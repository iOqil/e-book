<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470">
  <title>Ketma-ket bajarilish: qadamlar zanjiri yuqoridan pastga, bittadan</title>
  <rect x="0" y="0" width="820" height="470" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Chiziqli algoritm — ketma-ket bajarilish</text>
  <text x="410" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Har qadam aynan bir marta, tepadan pastga; sakrash yoki takror yo'q</text>

  <!-- Step 1 -->
  <rect x="60" y="92" width="300" height="54" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="92" cy="119" r="17" fill="#2563eb"/>
  <text x="92" y="125" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#ffffff">1</text>
  <text x="120" y="124" font-family="monospace" font-size="15" fill="#334155">narx &lt;- 1000</text>

  <!-- Step 2 -->
  <rect x="60" y="166" width="300" height="54" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="92" cy="193" r="17" fill="#2563eb"/>
  <text x="92" y="199" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#ffffff">2</text>
  <text x="120" y="198" font-family="monospace" font-size="15" fill="#334155">soliq &lt;- narx * 0.12</text>

  <!-- Step 3 -->
  <rect x="60" y="240" width="300" height="54" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="92" cy="267" r="17" fill="#2563eb"/>
  <text x="92" y="273" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#ffffff">3</text>
  <text x="120" y="272" font-family="monospace" font-size="15" fill="#334155">jami &lt;- narx + soliq</text>

  <!-- Step 4 -->
  <rect x="60" y="314" width="300" height="54" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <circle cx="92" cy="341" r="17" fill="#16a34a"/>
  <text x="92" y="347" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#ffffff">4</text>
  <text x="120" y="346" font-family="monospace" font-size="15" fill="#334155">chiqar jami  // -&gt; 1120</text>

  <!-- Down arrows -->
  <line x1="210" y1="146" x2="210" y2="166" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="210,166 206,158 214,158" fill="#94a3b8"/>
  <line x1="210" y1="220" x2="210" y2="240" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="210,240 206,232 214,232" fill="#94a3b8"/>
  <line x1="210" y1="294" x2="210" y2="314" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="210,314 206,306 214,306" fill="#94a3b8"/>

  <!-- Control-flow marker on the left -->
  <rect x="22" y="92" width="14" height="276" rx="7" fill="#dbeafe"/>
  <text x="29" y="240" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb" transform="rotate(-90 29 240)">boshqaruv oqimi</text>

  <!-- Notes panel -->
  <rect x="410" y="92" width="370" height="276" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="430" y="124" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">Chiziqli algoritmning belgisi</text>

  <circle cx="442" cy="158" r="5" fill="#16a34a"/>
  <text x="458" y="163" font-family="Segoe UI" font-size="14" fill="#334155">Boshqaruv faqat pastga oqadi</text>

  <circle cx="442" cy="192" r="5" fill="#16a34a"/>
  <text x="458" y="197" font-family="Segoe UI" font-size="14" fill="#334155">Har qator aynan 1 marta ishlaydi</text>

  <circle cx="442" cy="226" r="5" fill="#16a34a"/>
  <text x="458" y="231" font-family="Segoe UI" font-size="14" fill="#334155">Tartib MUHIM: 3 dan 2 oldin keladi</text>

  <circle cx="442" cy="260" r="5" fill="#dc2626"/>
  <text x="458" y="265" font-family="Segoe UI" font-size="14" fill="#334155">Hech qaerda shart (if) yo'q</text>

  <circle cx="442" cy="294" r="5" fill="#dc2626"/>
  <text x="458" y="299" font-family="Segoe UI" font-size="14" fill="#334155">Hech qaerda takror (loop) yo'q</text>

  <rect x="430" y="318" width="334" height="34" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="447" y="340" font-family="Segoe UI" font-size="14" fill="#1e3a8a">Qadam soni = qator soni (oldindan ma'lum)</text>
</svg>
