<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <title>Permutatsiya generatsiyasi daraxti: [1,2,3] ning barcha tartiblari, har darajada tanlov soni bittaga kamayadi va jami 3 faktorial ya'ni 6 barg hosil bo'ladi</title>
  <rect x="0" y="0" width="900" height="520" fill="#f8fafc"/>
  <text x="450" y="36" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Permutatsiya daraxti: [1, 2, 3]</text>
  <text x="450" y="62" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Har darajada ishlatilmagan elementni tanla, qo'shib rekursiv kez, keyin OLIB TASHLA (backtrack)</text>

  <!-- level labels -->
  <g font-family="Segoe UI" font-size="13" font-weight="bold">
    <text x="40" y="116" fill="#2563eb">1-pozitsiya</text>
    <text x="40" y="236" fill="#16a34a">2-pozitsiya</text>
    <text x="40" y="356" fill="#7c3aed">3-pozitsiya</text>
    <text x="40" y="426" fill="#dc2626">barg (perm)</text>
  </g>

  <!-- edges -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <!-- root to L1 -->
    <line x1="450" y1="122" x2="180" y2="212"/>
    <line x1="450" y1="122" x2="450" y2="212"/>
    <line x1="450" y1="122" x2="720" y2="212"/>
    <!-- 1 -> {2,3} -->
    <line x1="180" y1="224" x2="120" y2="332"/>
    <line x1="180" y1="224" x2="240" y2="332"/>
    <!-- 2 -> {1,3} -->
    <line x1="450" y1="224" x2="390" y2="332"/>
    <line x1="450" y1="224" x2="510" y2="332"/>
    <!-- 3 -> {1,2} -->
    <line x1="720" y1="224" x2="660" y2="332"/>
    <line x1="720" y1="224" x2="780" y2="332"/>
  </g>

  <!-- edge labels (choices) -->
  <g font-family="monospace" font-size="13" fill="#64748b">
    <text x="290" y="170">1</text>
    <text x="458" y="170">2</text>
    <text x="600" y="170">3</text>
    <text x="138" y="285">2</text>
    <text x="222" y="285">3</text>
    <text x="408" y="285">1</text>
    <text x="492" y="285">3</text>
    <text x="678" y="285">1</text>
    <text x="762" y="285">2</text>
  </g>

  <!-- root -->
  <circle cx="450" cy="112" r="16" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text x="450" y="117" text-anchor="middle" font-family="monospace" font-size="13" fill="#1e293b">[ ]</text>

  <!-- level 1 nodes -->
  <g font-family="monospace" font-size="13">
    <circle cx="180" cy="218" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="180" y="223" text-anchor="middle" fill="#2563eb">[1]</text>
    <circle cx="450" cy="218" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="450" y="223" text-anchor="middle" fill="#2563eb">[2]</text>
    <circle cx="720" cy="218" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="720" y="223" text-anchor="middle" fill="#2563eb">[3]</text>
  </g>

  <!-- level 2 nodes -->
  <g font-family="monospace" font-size="13">
    <circle cx="120" cy="338" r="18" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="120" y="343" text-anchor="middle" fill="#16a34a">[1,2]</text>
    <circle cx="240" cy="338" r="18" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="240" y="343" text-anchor="middle" fill="#16a34a">[1,3]</text>
    <circle cx="390" cy="338" r="18" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="390" y="343" text-anchor="middle" fill="#16a34a">[2,1]</text>
    <circle cx="510" cy="338" r="18" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="510" y="343" text-anchor="middle" fill="#16a34a">[2,3]</text>
    <circle cx="660" cy="338" r="18" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="660" y="343" text-anchor="middle" fill="#16a34a">[3,1]</text>
    <circle cx="780" cy="338" r="18" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="780" y="343" text-anchor="middle" fill="#16a34a">[3,2]</text>
  </g>

  <!-- leaves: 6 full permutations -->
  <g font-family="monospace" font-size="13" fill="#334155">
    <rect x="86"  y="392" width="68" height="28" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
    <text x="120" y="411" text-anchor="middle">1,2,3</text>
    <rect x="206" y="392" width="68" height="28" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
    <text x="240" y="411" text-anchor="middle">1,3,2</text>
    <rect x="356" y="392" width="68" height="28" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
    <text x="390" y="411" text-anchor="middle">2,1,3</text>
    <rect x="476" y="392" width="68" height="28" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
    <text x="510" y="411" text-anchor="middle">2,3,1</text>
    <rect x="626" y="392" width="68" height="28" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
    <text x="660" y="411" text-anchor="middle">3,1,2</text>
    <rect x="746" y="392" width="68" height="28" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
    <text x="780" y="411" text-anchor="middle">3,2,1</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="1.2">
    <line x1="120" y1="356" x2="120" y2="392"/>
    <line x1="240" y1="356" x2="240" y2="392"/>
    <line x1="390" y1="356" x2="390" y2="392"/>
    <line x1="510" y1="356" x2="510" y2="392"/>
    <line x1="660" y1="356" x2="660" y2="392"/>
    <line x1="780" y1="356" x2="780" y2="392"/>
  </g>

  <!-- summary -->
  <text x="450" y="462" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Tanlovlar soni har darajada kamayadi: 3 × 2 × 1 = 6 barg.</text>
  <text x="450" y="492" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#f59e0b">n element ⟹ n! permutatsiya</text>
</svg>
