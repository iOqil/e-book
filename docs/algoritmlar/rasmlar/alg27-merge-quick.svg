<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540">
  <title>Merge sort va quick sort g'oyalari yonma-yon: merge teng yarmlarga bo'lib saralangan qismlarni birlashtiradi, quick pivot atrofida partition qiladi va birlashtirish kerak emas</title>
  <rect x="0" y="0" width="880" height="540" fill="#f8fafc"/>
  <text x="440" y="32" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Merge sort va Quick sort g'oyasi</text>

  <!-- divider -->
  <line x1="440" y1="50" x2="440" y2="520" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- ===== LEFT: MERGE SORT ===== -->
  <text x="220" y="72" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">MERGE SORT</text>
  <text x="220" y="92" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">teng yarmga BO'L, so'ng BIRLASHTIR</text>

  <!-- top array -->
  <rect x="120" y="104" width="200" height="32" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="125" text-anchor="middle" font-family="monospace" font-size="14" fill="#2563eb">[5, 2, 9, 1]</text>
  <line x1="180" y1="136" x2="150" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <line x1="260" y1="136" x2="290" y2="160" stroke="#94a3b8" stroke-width="2"/>

  <!-- two halves -->
  <rect x="100" y="160" width="100" height="30" rx="5" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="150" y="180" text-anchor="middle" font-family="monospace" font-size="14" fill="#7c3aed">[5, 2]</text>
  <rect x="240" y="160" width="100" height="30" rx="5" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="290" y="180" text-anchor="middle" font-family="monospace" font-size="14" fill="#7c3aed">[9, 1]</text>

  <text x="220" y="216" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">...bitta elementgacha bo'l, keyin merge...</text>

  <!-- merged halves -->
  <rect x="100" y="232" width="100" height="30" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="150" y="252" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">[2, 5]</text>
  <rect x="240" y="232" width="100" height="30" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="290" y="252" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">[1, 9]</text>
  <line x1="150" y1="262" x2="190" y2="286" stroke="#16a34a" stroke-width="2"/>
  <line x1="290" y1="262" x2="250" y2="286" stroke="#16a34a" stroke-width="2"/>

  <!-- merge step detail -->
  <text x="220" y="304" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">MERGE: ikki barmoq, kichigini ol</text>
  <rect x="110" y="316" width="90" height="28" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="155" y="335" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">2,5 ^</text>
  <rect x="240" y="316" width="90" height="28" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="285" y="335" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">1,9 ^</text>

  <!-- final -->
  <rect x="120" y="356" width="200" height="34" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="220" y="378" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#16a34a">[1, 2, 5, 9]</text>

  <text x="220" y="418" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748b">T(n)=2T(n/2)+O(n)=O(n log n)</text>
  <text x="220" y="440" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">barqaror, lekin O(n) qo'shimcha xotira</text>
  <text x="220" y="460" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">eng yomon holat ham O(n log n) (kafolatli)</text>

  <!-- ===== RIGHT: QUICK SORT ===== -->
  <text x="660" y="72" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">QUICK SORT</text>
  <text x="660" y="92" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">PIVOT tanla, atrofida PARTITION</text>

  <!-- top array with pivot -->
  <rect x="560" y="104" width="200" height="32" rx="5" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="640" y="125" text-anchor="middle" font-family="monospace" font-size="14" fill="#334155">[3, 8, 5, 1,</text>
  <rect x="722" y="104" width="38" height="32" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="741" y="125" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#d97706">6]</text>
  <text x="660" y="152" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#f59e0b">pivot = 6 (oxirgisi)</text>

  <!-- partition result -->
  <text x="660" y="176" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">PARTITION: kichik | pivot | katta</text>
  <rect x="540" y="186" width="110" height="32" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="595" y="207" text-anchor="middle" font-family="monospace" font-size="13" fill="#2563eb">[3, 5, 1]</text>
  <rect x="654" y="186" width="40" height="32" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="674" y="207" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#d97706">6</text>
  <rect x="698" y="186" width="80" height="32" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="738" y="207" text-anchor="middle" font-family="monospace" font-size="13" fill="#dc2626">[8]</text>

  <text x="595" y="240" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">&lt; 6</text>
  <text x="674" y="240" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">o'z o'rnida!</text>
  <text x="738" y="240" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">&gt; 6</text>

  <line x1="595" y1="246" x2="595" y2="268" stroke="#94a3b8" stroke-width="2"/>
  <line x1="738" y1="246" x2="738" y2="268" stroke="#94a3b8" stroke-width="2"/>

  <text x="660" y="286" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">har qismni rekursiv quick sort</text>

  <!-- recursed -->
  <rect x="540" y="298" width="110" height="30" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="595" y="318" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">[1, 3, 5]</text>
  <rect x="698" y="298" width="80" height="30" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="738" y="318" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">[8]</text>

  <!-- final -->
  <rect x="560" y="356" width="200" height="34" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="660" y="378" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#16a34a">[1, 3, 5, 6, 8]</text>
  <text x="660" y="400" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">birlashtirish (merge) KERAK EMAS</text>

  <text x="660" y="424" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748b">o'rtacha O(n log n), eng yomon O(n²)</text>
  <text x="660" y="444" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">in-place, lekin barqaror EMAS</text>
  <text x="660" y="464" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#f59e0b">tasodifiy pivot -> O(n²) dan saqlanish</text>

  <text x="440" y="508" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Ikkalasi ham "bo'l va hukmronlik": farq — qaerda ish bajariladi (merge: birlashtirishda, quick: bo'lishda)</text>
</svg>
