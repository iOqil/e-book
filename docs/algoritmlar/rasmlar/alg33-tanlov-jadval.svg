<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560">
  <title>Qaror jadvali: muammoning belgisiga qarab qaysi struktura yoki paradigma tanlanadi</title>
  <rect x="0" y="0" width="880" height="560" fill="#f8fafc"/>
  <text x="440" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Qaror jadvali: belgi -> vosita</text>
  <text x="440" y="62" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Muammoda nimani ko'rsang — qaysi qurolni olasan</text>

  <!-- header -->
  <rect x="40" y="84" width="430" height="40" fill="#e0e7ff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="470" y="84" width="370" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="255" y="110" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Muammoda nimani ko'rasan</text>
  <text x="655" y="110" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Tanlanadigan vosita</text>

  <!-- rows -->
  <!-- r1 -->
  <rect x="40" y="124" width="430" height="42" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="470" y="124" width="370" height="42" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="54" y="150" font-family="Segoe UI" font-size="14" fill="#334155">Tez qidiruv (bormi? qayerda?)</text>
  <text x="484" y="150" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">hash jadval / saralash + binar qidiruv</text>

  <!-- r2 -->
  <rect x="40" y="166" width="430" height="42" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="470" y="166" width="370" height="42" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="54" y="192" font-family="Segoe UI" font-size="14" fill="#334155">Doimo eng kichik/katta kerak</text>
  <text x="484" y="192" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">heap (ustuvor navbat)</text>

  <!-- r3 -->
  <rect x="40" y="208" width="430" height="42" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="470" y="208" width="370" height="42" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="54" y="234" font-family="Segoe UI" font-size="14" fill="#334155">Eng qisqa yo'l (vaznsiz / vaznli)</text>
  <text x="484" y="234" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">BFS / Dijkstra</text>

  <!-- r4 -->
  <rect x="40" y="250" width="430" height="42" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="470" y="250" width="370" height="42" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="54" y="276" font-family="Segoe UI" font-size="14" fill="#334155">Optimal + qism-masalalar takrorlanadi</text>
  <text x="484" y="276" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">dinamik dasturlash (DP)</text>

  <!-- r5 -->
  <rect x="40" y="292" width="430" height="42" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="470" y="292" width="370" height="42" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="54" y="318" font-family="Segoe UI" font-size="14" fill="#334155">Lokal optimal yetarli (isbot bilan)</text>
  <text x="484" y="318" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">greedy (ochko'z)</text>

  <!-- r6 -->
  <rect x="40" y="334" width="430" height="42" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="470" y="334" width="370" height="42" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="54" y="360" font-family="Segoe UI" font-size="14" fill="#334155">Barcha yechim / kombinatsiya, cheklov</text>
  <text x="484" y="360" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#f59e0b">backtracking</text>

  <!-- r7 -->
  <rect x="40" y="376" width="430" height="42" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="470" y="376" width="370" height="42" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="54" y="402" font-family="Segoe UI" font-size="14" fill="#334155">Mustaqil bo'laklarga bo'linadi</text>
  <text x="484" y="402" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">divide and conquer</text>

  <!-- r8 -->
  <rect x="40" y="418" width="430" height="42" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="470" y="418" width="370" height="42" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="54" y="444" font-family="Segoe UI" font-size="14" fill="#334155">Prefiks / so'z / avtokomplit</text>
  <text x="484" y="444" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">trie</text>

  <!-- r9 -->
  <rect x="40" y="460" width="430" height="42" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="470" y="460" width="370" height="42" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="54" y="486" font-family="Segoe UI" font-size="14" fill="#334155">Guruh / bog'liqlik / "bir to'plamdami?"</text>
  <text x="484" y="486" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">union-find (DSU)</text>

  <text x="440" y="532" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Bu jadval — butun kitobning xulosasi: belgini taniysan, qurolni olasan.</text>
</svg>
