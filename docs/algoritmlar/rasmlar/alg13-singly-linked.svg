<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360">
  <title>Bir tomonlama bog'langan ro'yxat: head ko'rsatkichi va har bir tugun [qiymat | keyingi] keyingi tugunga strelka bilan ulanadi, oxiri None</title>
  <rect x="0" y="0" width="880" height="360" fill="#f8fafc"/>
  <text x="440" y="36" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Bir tomonlama bog'langan ro'yxat (singly linked list)</text>
  <text x="440" y="62" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Har bir tugun = [qiymat | keyingiga ko'rsatkich]; tugunlar xotirada tarqoq</text>

  <!-- head pointer -->
  <text x="70" y="150" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">head</text>
  <line x1="70" y1="160" x2="70" y2="195" stroke="#7c3aed" stroke-width="2.5"/>
  <line x1="70" y1="195" x2="118" y2="195" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ph)"/>

  <!-- node 1 -->
  <rect x="120" y="170" width="120" height="56" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <line x1="200" y1="170" x2="200" y2="226" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="205" text-anchor="middle" font-family="monospace" font-size="18" fill="#1e293b">10</text>
  <text x="220" y="203" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">next</text>
  <circle cx="220" cy="212" r="3.5" fill="#2563eb"/>
  <line x1="220" y1="212" x2="288" y2="198" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>

  <!-- node 2 -->
  <rect x="290" y="170" width="120" height="56" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <line x1="370" y1="170" x2="370" y2="226" stroke="#2563eb" stroke-width="1.5"/>
  <text x="330" y="205" text-anchor="middle" font-family="monospace" font-size="18" fill="#1e293b">20</text>
  <text x="390" y="203" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">next</text>
  <circle cx="390" cy="212" r="3.5" fill="#2563eb"/>
  <line x1="390" y1="212" x2="458" y2="198" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>

  <!-- node 3 -->
  <rect x="460" y="170" width="120" height="56" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <line x1="540" y1="170" x2="540" y2="226" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="205" text-anchor="middle" font-family="monospace" font-size="18" fill="#1e293b">30</text>
  <text x="560" y="203" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">next</text>
  <circle cx="560" cy="212" r="3.5" fill="#2563eb"/>
  <line x1="560" y1="212" x2="628" y2="198" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>

  <!-- node 4 -->
  <rect x="630" y="170" width="120" height="56" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <line x1="710" y1="170" x2="710" y2="226" stroke="#2563eb" stroke-width="1.5"/>
  <text x="670" y="205" text-anchor="middle" font-family="monospace" font-size="18" fill="#1e293b">40</text>
  <text x="730" y="203" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">next</text>
  <circle cx="730" cy="212" r="3.5" fill="#2563eb"/>
  <line x1="730" y1="212" x2="788" y2="198" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>

  <!-- None -->
  <text x="822" y="202" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#dc2626">None</text>

  <!-- bottom note -->
  <rect x="160" y="288" width="560" height="46" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="316" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Oxirgi tugunning next = None; ro'yxat boshini faqat head saqlaydi</text>

  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="ph" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>
</svg>
