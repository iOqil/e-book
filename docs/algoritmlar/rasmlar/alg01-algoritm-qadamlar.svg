<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470">
  <title>Choy damlash algoritmi: raqamlangan ketma-ket qadamlar</title>
  <rect x="0" y="0" width="820" height="470" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Choy damlash — kundalik algoritm</text>
  <text x="410" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Aniq, tartibli, cheklangan qadamlar ketma-ketligi</text>

  <!-- Step 1 -->
  <rect x="40" y="92" width="320" height="56" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="72" cy="120" r="18" fill="#2563eb"/>
  <text x="72" y="126" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#ffffff">1</text>
  <text x="104" y="125" font-family="Segoe UI" font-size="15" fill="#334155">Choynakka 1 qoshiq choy soling</text>

  <!-- Step 2 -->
  <rect x="40" y="168" width="320" height="56" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="72" cy="196" r="18" fill="#2563eb"/>
  <text x="72" y="202" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#ffffff">2</text>
  <text x="104" y="201" font-family="Segoe UI" font-size="15" fill="#334155">Suvni qaynaguncha qizdiring</text>

  <!-- Step 3 -->
  <rect x="40" y="244" width="320" height="56" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="72" cy="272" r="18" fill="#2563eb"/>
  <text x="72" y="278" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#ffffff">3</text>
  <text x="104" y="277" font-family="Segoe UI" font-size="15" fill="#334155">Qaynoq suvni choynakka quying</text>

  <!-- Step 4 -->
  <rect x="40" y="320" width="320" height="56" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="72" cy="348" r="18" fill="#2563eb"/>
  <text x="72" y="354" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#ffffff">4</text>
  <text x="104" y="353" font-family="Segoe UI" font-size="15" fill="#334155">5 daqiqa damlansin (kuting)</text>

  <!-- Step 5 -->
  <rect x="40" y="396" width="320" height="56" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <circle cx="72" cy="424" r="18" fill="#16a34a"/>
  <text x="72" y="430" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#ffffff">5</text>
  <text x="104" y="429" font-family="Segoe UI" font-size="15" fill="#334155">Piyolaga quying — tayyor!</text>

  <!-- Down arrows between steps -->
  <line x1="200" y1="148" x2="200" y2="168" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="200,168 196,160 204,160" fill="#94a3b8"/>
  <line x1="200" y1="224" x2="200" y2="244" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="200,244 196,236 204,236" fill="#94a3b8"/>
  <line x1="200" y1="300" x2="200" y2="320" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="200,320 196,312 204,312" fill="#94a3b8"/>
  <line x1="200" y1="376" x2="200" y2="396" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="200,396 196,388 204,388" fill="#94a3b8"/>

  <!-- Notes panel -->
  <rect x="410" y="92" width="370" height="360" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="430" y="124" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">Nega bu algoritm?</text>

  <circle cx="442" cy="160" r="5" fill="#16a34a"/>
  <text x="458" y="165" font-family="Segoe UI" font-size="14" fill="#334155">Har qadam aniq — bir ma'noli</text>

  <circle cx="442" cy="196" r="5" fill="#16a34a"/>
  <text x="458" y="201" font-family="Segoe UI" font-size="14" fill="#334155">Tartib muhim: 2 dan oldin 3 bo'lmaydi</text>

  <circle cx="442" cy="232" r="5" fill="#16a34a"/>
  <text x="458" y="237" font-family="Segoe UI" font-size="14" fill="#334155">Cheklangan: 5 qadamdan keyin tugaydi</text>

  <circle cx="442" cy="268" r="5" fill="#16a34a"/>
  <text x="458" y="273" font-family="Segoe UI" font-size="14" fill="#334155">Kirish: choy, suv, choynak</text>

  <circle cx="442" cy="304" r="5" fill="#16a34a"/>
  <text x="458" y="309" font-family="Segoe UI" font-size="14" fill="#334155">Chiqish: damlangan choy</text>

  <rect x="430" y="336" width="330" height="96" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="446" y="362" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">Yomon qadam (anti-misol):</text>
  <text x="446" y="386" font-family="Segoe UI" font-size="14" fill="#334155">"Suvni biroz qizdiring" — qancha?</text>
  <text x="446" y="408" font-family="Segoe UI" font-size="14" fill="#334155">Noaniq. Algoritm aniqlikni</text>
  <text x="446" y="426" font-family="Segoe UI" font-size="14" fill="#334155">talab qiladi.</text>
</svg>
