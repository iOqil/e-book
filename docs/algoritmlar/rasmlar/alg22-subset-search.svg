<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520">
  <title>Qism-to'plamlarni sanab chiqish daraxti: uchta element uchun har qadamda "olamiz" yoki "olmaymiz" tanlovi, jami 2 darajada 3 ya'ni 8 ta barg</title>
  <rect x="0" y="0" width="880" height="520" fill="#f8fafc"/>
  <text x="440" y="36" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Qism-to'plamlarni sanab chiqish daraxti</text>
  <text x="440" y="62" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">{a, b, c}: har element uchun "olamiz" (1) yoki "olmaymiz" (0) → 2³ = 8 barg</text>

  <!-- level labels -->
  <text x="60" y="110" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#2563eb">a?</text>
  <text x="60" y="190" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a">b?</text>
  <text x="60" y="270" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#7c3aed">c?</text>
  <text x="60" y="350" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#dc2626">barg</text>

  <!-- edges -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <!-- root to level a -->
    <line x1="440" y1="118" x2="240" y2="178"/>
    <line x1="440" y1="118" x2="640" y2="178"/>
    <!-- level a to level b -->
    <line x1="240" y1="190" x2="140" y2="250"/>
    <line x1="240" y1="190" x2="340" y2="250"/>
    <line x1="640" y1="190" x2="540" y2="250"/>
    <line x1="640" y1="190" x2="740" y2="250"/>
    <!-- level b to level c (leaves) -->
    <line x1="140" y1="262" x2="90"  y2="322"/>
    <line x1="140" y1="262" x2="190" y2="322"/>
    <line x1="340" y1="262" x2="290" y2="322"/>
    <line x1="340" y1="262" x2="390" y2="322"/>
    <line x1="540" y1="262" x2="490" y2="322"/>
    <line x1="540" y1="262" x2="590" y2="322"/>
    <line x1="740" y1="262" x2="690" y2="322"/>
    <line x1="740" y1="262" x2="790" y2="322"/>
  </g>

  <!-- edge labels -->
  <g font-family="monospace" font-size="13" fill="#64748b">
    <text x="320" y="150">0</text>
    <text x="555" y="150">1</text>
  </g>

  <!-- root -->
  <circle cx="440" cy="108" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text x="440" y="113" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">{}</text>

  <!-- level a nodes -->
  <circle cx="240" cy="184" r="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="640" cy="184" r="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>

  <!-- level b nodes -->
  <circle cx="140" cy="256" r="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <circle cx="340" cy="256" r="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <circle cx="540" cy="256" r="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <circle cx="740" cy="256" r="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>

  <!-- leaves: 8 subsets -->
  <g font-family="monospace" font-size="13" fill="#334155">
    <rect x="62"  y="312" width="56" height="28" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
    <text x="90"  y="330" text-anchor="middle">{}</text>
    <rect x="162" y="312" width="56" height="28" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
    <text x="190" y="330" text-anchor="middle">{c}</text>
    <rect x="262" y="312" width="56" height="28" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
    <text x="290" y="330" text-anchor="middle">{b}</text>
    <rect x="362" y="312" width="56" height="28" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
    <text x="390" y="330" text-anchor="middle">{b,c}</text>
    <rect x="462" y="312" width="56" height="28" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
    <text x="490" y="330" text-anchor="middle">{a}</text>
    <rect x="562" y="312" width="56" height="28" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
    <text x="590" y="330" text-anchor="middle">{a,c}</text>
    <rect x="662" y="312" width="56" height="28" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
    <text x="690" y="330" text-anchor="middle">{a,b}</text>
    <rect x="762" y="312" width="56" height="28" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
    <text x="790" y="330" text-anchor="middle">{a,b,c}</text>
  </g>

  <!-- summary -->
  <text x="440" y="400" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Har bir daraja element sonini ikkilantiradi: 1 → 2 → 4 → 8 barg.</text>
  <text x="440" y="430" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#f59e0b">n element ⟹ 2ⁿ qism-to'plam</text>
  <text x="440" y="468" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Permutatsiyalar daraxti esa har darajada kamayuvchi tanlov beradi: n × (n−1) × ... × 1 = n! barg.</text>
</svg>
