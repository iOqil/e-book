<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470">
  <title>Greedy g'oya: har qadamda hozir eng yaxshi (lokal optimal) tanlovni qilib, orqaga qaramasdan oldinga yurish</title>
  <rect x="0" y="0" width="860" height="470" fill="#f8fafc"/>
  <text x="430" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Greedy: har qadamda "hozir eng yaxshi" tanlov</text>
  <text x="430" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Lokal optimalni tanla → oldinga yur → orqaga qaytma</text>

  <!-- qadam 1 -->
  <circle cx="110" cy="200" r="42" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="110" y="195" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Qadam 1</text>
  <text x="110" y="215" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">holat S0</text>

  <!-- tanlovlar 1 -->
  <text x="110" y="278" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">tanlovlar:</text>
  <rect x="58" y="290" width="44" height="26" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="80" y="308" text-anchor="middle" font-family="monospace" font-size="13" fill="#dc2626">+3</text>
  <rect x="108" y="290" width="44" height="26" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="130" y="308" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#16a34a">+9</text>
  <text x="110" y="338" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">eng yaxshi = +9</text>

  <!-- arrow 1->2 -->
  <line x1="152" y1="200" x2="218" y2="200" stroke="#334155" stroke-width="2"/>
  <polygon points="218,194 230,200 218,206" fill="#334155"/>

  <!-- qadam 2 -->
  <circle cx="290" cy="200" r="42" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="290" y="195" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Qadam 2</text>
  <text x="290" y="215" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">holat S1</text>

  <text x="290" y="278" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">tanlovlar:</text>
  <rect x="238" y="290" width="44" height="26" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="260" y="308" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#16a34a">+7</text>
  <rect x="288" y="290" width="44" height="26" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="310" y="308" text-anchor="middle" font-family="monospace" font-size="13" fill="#dc2626">+2</text>
  <text x="290" y="338" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">eng yaxshi = +7</text>

  <!-- arrow 2->3 -->
  <line x1="332" y1="200" x2="398" y2="200" stroke="#334155" stroke-width="2"/>
  <polygon points="398,194 410,200 398,206" fill="#334155"/>

  <!-- qadam 3 -->
  <circle cx="470" cy="200" r="42" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="470" y="195" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Qadam 3</text>
  <text x="470" y="215" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">holat S2</text>

  <text x="470" y="278" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">tanlovlar:</text>
  <rect x="418" y="290" width="44" height="26" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="440" y="308" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#16a34a">+5</text>
  <rect x="468" y="290" width="44" height="26" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="490" y="308" text-anchor="middle" font-family="monospace" font-size="13" fill="#dc2626">+1</text>
  <text x="470" y="338" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">eng yaxshi = +5</text>

  <!-- arrow 3->natija -->
  <line x1="512" y1="200" x2="578" y2="200" stroke="#334155" stroke-width="2"/>
  <polygon points="578,194 590,200 578,206" fill="#334155"/>

  <!-- natija -->
  <rect x="600" y="160" width="220" height="80" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="710" y="190" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">Yechim</text>
  <text x="710" y="216" text-anchor="middle" font-family="monospace" font-size="14" fill="#334155">9 + 7 + 5 = 21</text>

  <!-- orqaga qaramaslik strelkasi (cross) -->
  <path d="M 470 380 Q 290 420 110 380" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/>
  <polygon points="110,380 122,376 120,389" fill="#dc2626"/>
  <text x="290" y="445" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#dc2626">Greedy hech qachon orqaga qaytib qarorni o'zgartirmaydi</text>
</svg>
