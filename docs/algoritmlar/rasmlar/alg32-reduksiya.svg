<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480">
  <title>Reduksiya: A masalani B ga aylantirish, agar B yechilsa A ham yechiladi, qiyinlik B tomonga o'tadi</title>
  <rect x="0" y="0" width="860" height="480" fill="#f8fafc"/>
  <text x="430" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Reduksiya: A &#8804;&#8345; B ("B kamida A qadar qiyin")</text>
  <text x="430" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">A ni B ga tarjima qilamiz, B qutisidan A javobini olamiz</text>

  <!-- A input -->
  <rect x="50" y="120" width="160" height="70" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="150" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">A nusxasi</text>
  <text x="130" y="172" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">yechmoqchi masala</text>

  <!-- arrow translate -->
  <line x1="210" y1="155" x2="300" y2="155" stroke="#334155" stroke-width="2"/>
  <polygon points="300,149 312,155 300,161" fill="#334155"/>
  <text x="258" y="140" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">polinomial</text>
  <text x="258" y="200" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">tarjima</text>

  <!-- B input -->
  <rect x="315" y="120" width="160" height="70" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="395" y="150" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">B nusxasi</text>
  <text x="395" y="172" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">tarjima qilingan</text>

  <!-- arrow to B-solver -->
  <line x1="395" y1="190" x2="395" y2="240" stroke="#334155" stroke-width="2"/>
  <polygon points="389,240 395,252 401,240" fill="#334155"/>

  <!-- B solver (black box) -->
  <rect x="300" y="255" width="190" height="80" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="395" y="288" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">B ni yechuvchi</text>
  <text x="395" y="312" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">(qora quti)</text>

  <!-- B answer arrow back to A answer -->
  <line x1="300" y1="295" x2="210" y2="295" stroke="#334155" stroke-width="2"/>
  <polygon points="210,289 198,295 210,301" fill="#334155"/>

  <!-- A answer -->
  <rect x="50" y="260" width="148" height="70" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="124" y="290" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">A javobi</text>
  <text x="124" y="312" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">HA / YO'Q</text>

  <!-- direction-of-difficulty panel -->
  <rect x="555" y="120" width="265" height="215" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="687" y="150" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#d97706">Qiyinlik yo'nalishi</text>
  <text x="687" y="180" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">B ni yecha olsak,</text>
  <text x="687" y="200" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">A ni ham yechamiz</text>
  <text x="687" y="226" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">=&gt; B kamida A qadar qiyin</text>

  <line x1="595" y1="250" x2="780" y2="250" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="687" y="278" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Isbot retsepti: ma'lum</text>
  <text x="687" y="298" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">NP-to'liq (A) dan yangi</text>
  <text x="687" y="318" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">masalaga (B) reduksiya</text>

  <!-- bottom warning -->
  <text x="430" y="410" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">Diqqat: A &#8804;&#8345; B "A osonroq" EMAS — qiyinlik oson tomondan qiyin tomonga (B ga) o'tadi.</text>
  <text x="430" y="440" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Yo'nalish: oson masala (A) &#8594; qiyin masala (B). NP-to'liqlikni shu bilan isbotlaymiz.</text>
</svg>
