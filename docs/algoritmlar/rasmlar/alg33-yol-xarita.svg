<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480">
  <title>Keyingi qadamlar yo'l xaritasi: amaliyot, ilg'or mavzular, intervyu va raqobat bosqichlari</title>
  <rect x="0" y="0" width="880" height="480" fill="#f8fafc"/>
  <text x="440" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Bundan keyin qayoqqa? — yo'l xaritasi</text>
  <text x="440" y="62" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Kitob tugadi — haqiqiy o'rganish endi boshlanadi</text>

  <!-- path line -->
  <line x1="120" y1="250" x2="760" y2="250" stroke="#cbd5e1" stroke-width="4"/>

  <!-- step 1 AMALIYOT -->
  <circle cx="160" cy="250" r="18" fill="#16a34a"/>
  <text x="160" y="256" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#ffffff">1</text>
  <rect x="80" y="120" width="160" height="100" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.2"/>
  <text x="160" y="148" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">Amaliyot</text>
  <text x="160" y="170" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">eng muhim qadam</text>
  <text x="160" y="190" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">1000 masala yech</text>
  <text x="160" y="208" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">har kuni oz-ozdan</text>
  <line x1="160" y1="220" x2="160" y2="232" stroke="#16a34a" stroke-width="2"/>

  <!-- step 2 ILG'OR -->
  <circle cx="360" cy="250" r="18" fill="#2563eb"/>
  <text x="360" y="256" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#ffffff">2</text>
  <rect x="280" y="270" width="160" height="110" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.2"/>
  <text x="360" y="298" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">Ilg'or mavzular</text>
  <text x="360" y="320" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">segment tree</text>
  <text x="360" y="340" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">ilg'or graf, string</text>
  <text x="360" y="360" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">geometriya</text>
  <line x1="360" y1="268" x2="360" y2="280" stroke="#2563eb" stroke-width="2"/>

  <!-- step 3 INTERVYU -->
  <circle cx="560" cy="250" r="18" fill="#7c3aed"/>
  <text x="560" y="256" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#ffffff">3</text>
  <rect x="480" y="120" width="160" height="100" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2.2"/>
  <text x="560" y="148" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">Intervyu</text>
  <text x="560" y="170" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">ovoz chiqarib o'yla</text>
  <text x="560" y="190" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">brute -> optimal</text>
  <text x="560" y="208" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">murakkablikni ayt</text>
  <line x1="560" y1="220" x2="560" y2="232" stroke="#7c3aed" stroke-width="2"/>

  <!-- step 4 RAQOBAT -->
  <circle cx="760" cy="250" r="18" fill="#f59e0b"/>
  <text x="760" y="256" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#ffffff">4</text>
  <rect x="680" y="270" width="160" height="110" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2.2"/>
  <text x="760" y="298" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#d97706">Raqobat</text>
  <text x="760" y="320" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Codeforces</text>
  <text x="760" y="340" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">LeetCode</text>
  <text x="760" y="360" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">kitob: CLRS</text>
  <line x1="760" y1="268" x2="760" y2="280" stroke="#f59e0b" stroke-width="2"/>

  <!-- direction arrow -->
  <polygon points="760,242 778,250 760,258" fill="#94a3b8"/>

  <text x="440" y="430" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Algoritmika — yodlash emas, FIKRLASH. U faqat mashq bilan keladi.</text>
  <text x="440" y="456" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Bugun bitta masala yech — ertaga yana bitta. Mana shu sizni ekspert qiladi.</text>
</svg>
