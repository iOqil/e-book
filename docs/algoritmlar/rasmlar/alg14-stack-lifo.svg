<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520">
  <title>Stack (stek): push va pop amallari faqat yuqori uchidan bajariladi — LIFO tartibi, tarelkalar uyumi analogiyasi</title>
  <rect x="0" y="0" width="880" height="520" fill="#f8fafc"/>
  <text x="440" y="36" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Stack (stek) — LIFO: oxirgi kirgan birinchi chiqadi</text>
  <text x="440" y="62" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">push (qo'shish) va pop (olib tashlash) faqat yuqori uchidan bajariladi</text>

  <!-- analogiya: tarelkalar uyumi -->
  <text x="200" y="100" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Analogiya: tarelkalar uyumi</text>

  <!-- arrows showing push/pop at top -->
  <line x1="200" y1="130" x2="200" y2="165" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrG)"/>
  <text x="120" y="150" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">push</text>
  <line x1="280" y1="165" x2="280" y2="130" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrR)"/>
  <text x="320" y="150" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">pop</text>

  <!-- plates -->
  <rect x="120" y="170" width="160" height="26" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="188" text-anchor="middle" font-family="monospace" font-size="14" fill="#2563eb">tarelka 4  (top)</text>
  <rect x="120" y="200" width="160" height="26" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="200" y="218" text-anchor="middle" font-family="monospace" font-size="14" fill="#7c3aed">tarelka 3</text>
  <rect x="120" y="230" width="160" height="26" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="200" y="248" text-anchor="middle" font-family="monospace" font-size="14" fill="#7c3aed">tarelka 2</text>
  <rect x="120" y="260" width="160" height="26" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="200" y="278" text-anchor="middle" font-family="monospace" font-size="14" fill="#7c3aed">tarelka 1  (bottom)</text>
  <line x1="110" y1="290" x2="290" y2="290" stroke="#94a3b8" stroke-width="3"/>

  <!-- amal ketma-ketligi -->
  <text x="640" y="100" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Amallar ketma-ketligi</text>

  <!-- step 1: push 10 -->
  <text x="470" y="140" font-family="monospace" font-size="13" fill="#16a34a">push(10)</text>
  <rect x="560" y="125" width="50" height="24" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="585" y="142" text-anchor="middle" font-family="monospace" font-size="13" fill="#2563eb">10</text>

  <!-- step 2: push 20 -->
  <text x="470" y="178" font-family="monospace" font-size="13" fill="#16a34a">push(20)</text>
  <rect x="560" y="163" width="50" height="24" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="585" y="180" text-anchor="middle" font-family="monospace" font-size="13" fill="#2563eb">10</text>
  <rect x="615" y="163" width="50" height="24" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="640" y="180" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">20</text>

  <!-- step 3: push 30 -->
  <text x="470" y="216" font-family="monospace" font-size="13" fill="#16a34a">push(30)</text>
  <rect x="560" y="201" width="50" height="24" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="585" y="218" text-anchor="middle" font-family="monospace" font-size="13" fill="#2563eb">10</text>
  <rect x="615" y="201" width="50" height="24" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="640" y="218" text-anchor="middle" font-family="monospace" font-size="13" fill="#2563eb">20</text>
  <rect x="670" y="201" width="50" height="24" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="695" y="218" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">30</text>

  <!-- step 4: pop -> 30 -->
  <text x="470" y="254" font-family="monospace" font-size="13" fill="#dc2626">pop()=30</text>
  <rect x="560" y="239" width="50" height="24" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="585" y="256" text-anchor="middle" font-family="monospace" font-size="13" fill="#2563eb">10</text>
  <rect x="615" y="239" width="50" height="24" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="640" y="256" text-anchor="middle" font-family="monospace" font-size="13" fill="#2563eb">20</text>
  <rect x="670" y="239" width="50" height="24" fill="#ffffff" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="695" y="256" text-anchor="middle" font-family="monospace" font-size="13" fill="#dc2626">30</text>

  <!-- step 5: pop -> 20 -->
  <text x="470" y="292" font-family="monospace" font-size="13" fill="#dc2626">pop()=20</text>
  <rect x="560" y="277" width="50" height="24" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="585" y="294" text-anchor="middle" font-family="monospace" font-size="13" fill="#2563eb">10</text>
  <rect x="615" y="277" width="50" height="24" fill="#ffffff" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="640" y="294" text-anchor="middle" font-family="monospace" font-size="13" fill="#dc2626">20</text>

  <!-- bo'lim: barcha amallar O(1) -->
  <rect x="120" y="330" width="640" height="60" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="440" y="356" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">push · pop · peek · is_empty — hammasi O(1)</text>
  <text x="440" y="378" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Faqat bitta uchni (top) o'zgartiramiz: hech qachon hamma elementlarni surishimiz shart emas</text>

  <!-- LIFO kun-tartibi izoh -->
  <text x="440" y="430" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#7c3aed">LIFO = Last In, First Out</text>
  <text x="440" y="456" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Eng oxirgi qo'yilgan element eng birinchi chiqadi — orqaga (undo) tugmasidagidek</text>

  <defs>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
