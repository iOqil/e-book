<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520">
  <title>Binar min-heap bir vaqtning o'zida to'liq daraxt sifatida va massiv sifatida; bola va ota indekslari formulalari</title>
  <rect x="0" y="0" width="880" height="520" fill="#f8fafc"/>
  <text x="440" y="36" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Binar min-heap: daraxt va massiv — bitta narsa</text>
  <text x="440" y="62" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Complete daraxt bo'lgani uchun ko'rsatkichsiz, oddiy massivda saqlanadi</text>

  <!-- TREE -->
  <text x="230" y="98" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">Daraxt ko'rinishi (min-heap)</text>

  <!-- edges -->
  <line x1="230" y1="135" x2="140" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="230" y1="135" x2="320" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="140" y1="230" x2="95"  y2="295" stroke="#94a3b8" stroke-width="2"/>
  <line x1="140" y1="230" x2="185" y2="295" stroke="#94a3b8" stroke-width="2"/>
  <line x1="320" y1="230" x2="275" y2="295" stroke="#94a3b8" stroke-width="2"/>

  <!-- nodes: 1(root) 3 4 8 5 7 -->
  <circle cx="230" cy="120" r="22" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="230" y="126" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">1</text>
  <text x="230" y="100" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748b">i=0</text>

  <circle cx="140" cy="215" r="22" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="140" y="221" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">3</text>
  <text x="105" y="205" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748b">i=1</text>

  <circle cx="320" cy="215" r="22" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="320" y="221" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">4</text>
  <text x="356" y="205" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748b">i=2</text>

  <circle cx="95" cy="310" r="22" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="95" y="316" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">8</text>
  <text x="95" y="350" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748b">i=3</text>

  <circle cx="185" cy="310" r="22" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="185" y="316" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">5</text>
  <text x="185" y="350" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748b">i=4</text>

  <circle cx="275" cy="310" r="22" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="275" y="316" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">7</text>
  <text x="275" y="350" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748b">i=5</text>

  <text x="230" y="390" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">Har ota &#8804; bolalari (1&#8804;3,4; 3&#8804;8,5; 4&#8804;7)</text>

  <!-- ARRAY -->
  <text x="660" y="98" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">Massiv ko'rinishi</text>
  <g font-family="monospace" font-size="16">
    <rect x="500" y="120" width="50" height="46" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="525" y="150" text-anchor="middle" font-weight="bold" fill="#1e293b">1</text>
    <rect x="550" y="120" width="50" height="46" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="575" y="150" text-anchor="middle" font-weight="bold" fill="#1e293b">3</text>
    <rect x="600" y="120" width="50" height="46" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="625" y="150" text-anchor="middle" font-weight="bold" fill="#1e293b">4</text>
    <rect x="650" y="120" width="50" height="46" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="675" y="150" text-anchor="middle" font-weight="bold" fill="#1e293b">8</text>
    <rect x="700" y="120" width="50" height="46" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="725" y="150" text-anchor="middle" font-weight="bold" fill="#1e293b">5</text>
    <rect x="750" y="120" width="50" height="46" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="775" y="150" text-anchor="middle" font-weight="bold" fill="#1e293b">7</text>
  </g>
  <g font-family="monospace" font-size="13" fill="#64748b">
    <text x="525" y="186" text-anchor="middle">0</text>
    <text x="575" y="186" text-anchor="middle">1</text>
    <text x="625" y="186" text-anchor="middle">2</text>
    <text x="675" y="186" text-anchor="middle">3</text>
    <text x="725" y="186" text-anchor="middle">4</text>
    <text x="775" y="186" text-anchor="middle">5</text>
  </g>
  <text x="650" y="208" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">indeks i</text>

  <!-- index relation arrows -->
  <text x="660" y="250" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Indeks munosabati (i = ota)</text>
  <rect x="505" y="265" width="310" height="100" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="525" y="295" font-family="monospace" font-size="15" fill="#7c3aed">chap bola = 2*i + 1</text>
  <text x="525" y="320" font-family="monospace" font-size="15" fill="#7c3aed">ong  bola = 2*i + 2</text>
  <text x="525" y="345" font-family="monospace" font-size="15" fill="#7c3aed">ota      = (i - 1) // 2</text>

  <!-- example -->
  <rect x="120" y="420" width="640" height="78" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="440" y="448" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Misol: i=1 (qiymat 3)</text>
  <text x="440" y="472" text-anchor="middle" font-family="monospace" font-size="14" fill="#334155">chap = 2*1+1 = 3 (qiymat 8),  ong = 2*1+2 = 4 (qiymat 5),  ota = (1-1)//2 = 0</text>
  <text x="440" y="491" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">Diqqat: heap BST EMAS — aka-ukalar (8 va 5) o'rtasida tartib yo'q</text>
</svg>
