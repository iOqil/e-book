<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520">
  <title>Ichma-ich sikl n^2: tashqi va ichki sikl bajarilishlarini jadval ko'rinishida sanash</title>
  <rect x="0" y="0" width="820" height="520" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Ichma-ich sikl: bajarilishlar soni n x n</text>
  <text x="410" y="63" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Tashqi sikl n marta; har birida ichki sikl n marta = n^2 amal</text>

  <!-- Code panel -->
  <rect x="40" y="92" width="380" height="150" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="124" font-family="monospace" font-size="15" fill="#334155">for i in range(n):</text>
  <text x="90" y="156" font-family="monospace" font-size="15" fill="#7c3aed">for j in range(n):</text>
  <text x="120" y="188" font-family="monospace" font-size="15" fill="#dc2626">amal()  # bir amal</text>
  <text x="60" y="226" font-family="monospace" font-size="14" fill="#64748b"># jami: n * n = n^2</text>

  <!-- Grid n=5 -->
  <text x="610" y="118" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">n = 5 uchun to'liq kvadrat: 25 katak</text>
  <g font-family="monospace" font-size="13" fill="#16a34a">
    <!-- 5x5 grid of cells: each cell = one execution -->
    <!-- row 0 -->
    <rect x="470" y="132" width="44" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="516" y="132" width="44" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="562" y="132" width="44" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="608" y="132" width="44" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="654" y="132" width="44" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <!-- row 1 -->
    <rect x="470" y="178" width="44" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="516" y="178" width="44" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="562" y="178" width="44" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="608" y="178" width="44" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="654" y="178" width="44" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <!-- row 2 -->
    <rect x="470" y="224" width="44" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="516" y="224" width="44" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="562" y="224" width="44" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="608" y="224" width="44" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="654" y="224" width="44" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <!-- row 3 -->
    <rect x="470" y="270" width="44" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="516" y="270" width="44" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="562" y="270" width="44" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="608" y="270" width="44" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="654" y="270" width="44" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <!-- row 4 -->
    <rect x="470" y="316" width="44" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="516" y="316" width="44" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="562" y="316" width="44" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="608" y="316" width="44" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="654" y="316" width="44" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  </g>
  <text x="445" y="160" text-anchor="end" font-family="monospace" font-size="13" fill="#7c3aed">i=0</text>
  <text x="445" y="206" text-anchor="end" font-family="monospace" font-size="13" fill="#7c3aed">i=1</text>
  <text x="445" y="252" text-anchor="end" font-family="monospace" font-size="13" fill="#7c3aed">i=2</text>
  <text x="445" y="298" text-anchor="end" font-family="monospace" font-size="13" fill="#7c3aed">i=3</text>
  <text x="445" y="344" text-anchor="end" font-family="monospace" font-size="13" fill="#7c3aed">i=4</text>

  <!-- Triangle comparison -->
  <text x="230" y="300" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Agar ichki sikl j=i dan boshlansa</text>
  <text x="230" y="320" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">faqat yarim katak ishlaydi (uchburchak)</text>
  <g>
    <!-- triangular: row k has 5-k cells, aligned -->
    <rect x="120" y="334" width="40" height="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="162" y="334" width="40" height="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="204" y="334" width="40" height="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="246" y="334" width="40" height="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="288" y="334" width="40" height="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>

    <rect x="162" y="376" width="40" height="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="204" y="376" width="40" height="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="246" y="376" width="40" height="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="288" y="376" width="40" height="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>

    <rect x="204" y="418" width="40" height="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="246" y="418" width="40" height="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="288" y="418" width="40" height="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>

    <rect x="246" y="460" width="40" height="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="288" y="460" width="40" height="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>

    <rect x="288" y="502" width="40" height="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <text x="500" y="430" font-family="monospace" font-size="14" fill="#334155">5+4+3+2+1 = 15 katak</text>
  <text x="500" y="458" font-family="monospace" font-size="14" fill="#334155">= n(n+1)/2 = n^2/2 + n/2</text>
  <text x="500" y="486" font-family="monospace" font-size="14" fill="#dc2626">hukmron a'zo n^2/2  ->  Theta(n^2)</text>
  <text x="500" y="510" font-family="Segoe UI" font-size="13" fill="#64748b">Yarim bo'lsa ham o'sish tartibi n^2 bo'lib qoladi.</text>
</svg>
