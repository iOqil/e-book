<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520">
  <title>Kirish hajmi n o'sganda amallar soni qanday o'sadi: n, n log n va n kvadrat egri chiziqlari va jadval</title>
  <rect x="0" y="0" width="820" height="520" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">n o'sganda amallar soni qanday o'sadi</text>
  <text x="410" y="63" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Bir xil masala, uchta turli algoritm: tartib qanchalik muhim</text>

  <!-- Axes -->
  <line x1="90" y1="320" x2="90" y2="92" stroke="#334155" stroke-width="2"/>
  <line x1="90" y1="320" x2="470" y2="320" stroke="#334155" stroke-width="2"/>
  <text x="58" y="100" font-family="Segoe UI" font-size="14" fill="#64748b">amal</text>
  <text x="478" y="324" font-family="Segoe UI" font-size="14" fill="#64748b">n</text>

  <!-- n^2 curve (red) -->
  <path d="M90,320 Q260,300 350,150 T460,100" fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="370" y="120" font-family="monospace" font-size="14" fill="#dc2626">n²</text>

  <!-- n log n curve (amber) -->
  <path d="M90,320 Q230,250 340,205 T460,170" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <text x="400" y="185" font-family="monospace" font-size="14" fill="#f59e0b">n log n</text>

  <!-- n line (green) -->
  <line x1="90" y1="320" x2="460" y2="232" stroke="#16a34a" stroke-width="3"/>
  <text x="410" y="245" font-family="monospace" font-size="14" fill="#16a34a">n</text>

  <!-- Table -->
  <text x="560" y="100" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Amallar soni (taxminan)</text>
  <rect x="510" y="116" width="280" height="190" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>

  <line x1="510" y1="150" x2="790" y2="150" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="580" y1="116" x2="580" y2="306" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="650" y1="116" x2="650" y2="306" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="720" y1="116" x2="720" y2="306" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="545" y="139" text-anchor="middle" font-family="monospace" font-size="14" fill="#334155">n</text>
  <text x="615" y="139" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">n</text>
  <text x="685" y="139" text-anchor="middle" font-family="monospace" font-size="13" fill="#f59e0b">n log n</text>
  <text x="755" y="139" text-anchor="middle" font-family="monospace" font-size="14" fill="#dc2626">n²</text>

  <text x="545" y="174" text-anchor="middle" font-family="monospace" font-size="14" fill="#334155">10</text>
  <text x="615" y="174" text-anchor="middle" font-family="monospace" font-size="14" fill="#334155">10</text>
  <text x="685" y="174" text-anchor="middle" font-family="monospace" font-size="14" fill="#334155">33</text>
  <text x="755" y="174" text-anchor="middle" font-family="monospace" font-size="14" fill="#334155">100</text>

  <text x="545" y="204" text-anchor="middle" font-family="monospace" font-size="14" fill="#334155">1000</text>
  <text x="615" y="204" text-anchor="middle" font-family="monospace" font-size="14" fill="#334155">1e3</text>
  <text x="685" y="204" text-anchor="middle" font-family="monospace" font-size="14" fill="#334155">1e4</text>
  <text x="755" y="204" text-anchor="middle" font-family="monospace" font-size="14" fill="#334155">1e6</text>

  <text x="545" y="234" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">1e6</text>
  <text x="615" y="234" text-anchor="middle" font-family="monospace" font-size="14" fill="#334155">1e6</text>
  <text x="685" y="234" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">2e7</text>
  <text x="755" y="234" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">1e12</text>

  <text x="545" y="264" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">1e9</text>
  <text x="615" y="264" text-anchor="middle" font-family="monospace" font-size="14" fill="#334155">1e9</text>
  <text x="685" y="264" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">3e10</text>
  <text x="755" y="264" text-anchor="middle" font-family="monospace" font-size="13" fill="#dc2626">1e18</text>

  <text x="650" y="293" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">n² oxirgi qatorda — amalda imkonsiz</text>

  <!-- Takeaway -->
  <rect x="90" y="360" width="700" height="130" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="110" y="390" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">Asosiy xulosa</text>
  <text x="110" y="418" font-family="Segoe UI" font-size="14" fill="#334155">Kichik n da farq sezilmaydi. Lekin n katta bo'lganda o'sish TARTIBI hammasini hal qiladi.</text>
  <text x="110" y="442" font-family="Segoe UI" font-size="14" fill="#334155">Sekundiga ~1e9 amal bajaruvchi kompyuterda: n=1e9 uchun chiziqli ≈ 1 sekund,</text>
  <text x="110" y="466" font-family="Segoe UI" font-size="14" fill="#334155">n² esa ≈ 1e18 amal = ~30 yil. "To'g'ri, lekin sekin" yetarli emas.</text>
</svg>
