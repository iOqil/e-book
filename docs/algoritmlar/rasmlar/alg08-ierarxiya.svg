<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560">
  <title>Murakkablik ierarxiyasi zinapoyasi: O(1) ajoyibdan O(n!) dahshatligacha rangli zinalar, har bir zinada tartib nomi va misol algoritm</title>
  <rect x="0" y="0" width="860" height="560" fill="#f8fafc"/>
  <text x="430" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Murakkablik ierarxiyasi: ajoyibdan dahshatligacha</text>
  <text x="430" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Pastdan tepaga: har bir zina avvalgisidan jiddiyroq sekinroq o'sadi</text>

  <!-- staircase: bottom step is widest/greenest (best), top is reddest (worst) -->
  <!-- O(1) -->
  <rect x="60" y="470" width="200" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="78" y="499" font-family="monospace" font-size="16" font-weight="bold" fill="#15803d">O(1)</text>
  <text x="280" y="499" font-family="Segoe UI" font-size="14" fill="#16a34a">Ajoyib — hash jadval qidiruvi, massiv indeksi</text>

  <!-- O(log n) -->
  <rect x="90" y="416" width="200" height="46" rx="6" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
  <text x="108" y="445" font-family="monospace" font-size="16" font-weight="bold" fill="#0e7490">O(log n)</text>
  <text x="310" y="445" font-family="Segoe UI" font-size="14" fill="#0891b2">Zo'r — binar qidiruv</text>

  <!-- O(n) -->
  <rect x="120" y="362" width="200" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="138" y="391" font-family="monospace" font-size="16" font-weight="bold" fill="#1d4ed8">O(n)</text>
  <text x="340" y="391" font-family="Segoe UI" font-size="14" fill="#2563eb">Yaxshi — bitta sikl, chiziqli qidiruv</text>

  <!-- O(n log n) -->
  <rect x="150" y="308" width="200" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="168" y="337" font-family="monospace" font-size="15" font-weight="bold" fill="#6d28d9">O(n log n)</text>
  <text x="370" y="337" font-family="Segoe UI" font-size="14" fill="#7c3aed">Maqbul — tez saralash (merge, heap)</text>

  <!-- O(n^2) -->
  <rect x="180" y="254" width="200" height="46" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="198" y="283" font-family="monospace" font-size="16" font-weight="bold" fill="#b45309">O(n²)</text>
  <text x="400" y="283" font-family="Segoe UI" font-size="14" fill="#d97706">O'rtacha — ikki ichma-ich sikl</text>

  <!-- O(n^3) -->
  <rect x="210" y="200" width="200" height="46" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="228" y="229" font-family="monospace" font-size="16" font-weight="bold" fill="#c2410c">O(n³)</text>
  <text x="430" y="229" font-family="Segoe UI" font-size="14" fill="#ea580c">Sekin — uch ichma-ich sikl</text>

  <!-- O(2^n) -->
  <rect x="240" y="146" width="200" height="46" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="258" y="175" font-family="monospace" font-size="16" font-weight="bold" fill="#b91c1c">O(2ⁿ)</text>
  <text x="460" y="175" font-family="Segoe UI" font-size="14" fill="#dc2626">Yomon — barcha qism-to'plamlar</text>

  <!-- O(n!) -->
  <rect x="270" y="92" width="200" height="46" rx="6" fill="#fecaca" stroke="#991b1b" stroke-width="2.5"/>
  <text x="288" y="121" font-family="monospace" font-size="16" font-weight="bold" fill="#7f1d1d">O(n!)</text>
  <text x="490" y="121" font-family="Segoe UI" font-size="14" fill="#991b1b">Dahshatli — barcha o'rin almashtirishlar</text>

  <!-- direction arrow -->
  <line x1="40" y1="500" x2="40" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#up)"/>
  <defs>
    <marker id="up" markerWidth="11" markerHeight="11" refX="5.5" refY="2" orient="auto">
      <path d="M0,9 L5.5,0 L11,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="30" y="300" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b" transform="rotate(-90 30 300)">tezroq portlaydi →</text>
</svg>
