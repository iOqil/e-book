<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520">
  <title>BFS qatlamma-qatlam (kenglik) va DFS chuqurlikka birinchi (chuqurlik) daraxtni aylanib chiqishi</title>
  <rect x="0" y="0" width="880" height="520" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">BFS (kenglik) va DFS (chuqurlik)</text>
  <text x="440" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Raqamlar — tugunga tashrif tartibi. BFS navbat (queue), DFS stack/rekursiya ishlatadi.</text>

  <!-- ===== LEFT : BFS ===== -->
  <text x="220" y="92" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">BFS / level-order (qatlamli)</text>

  <!-- edges -->
  <line x1="220" y1="130" x2="140" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <line x1="220" y1="130" x2="300" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <line x1="140" y1="210" x2="90" y2="290" stroke="#94a3b8" stroke-width="2"/>
  <line x1="140" y1="210" x2="190" y2="290" stroke="#94a3b8" stroke-width="2"/>
  <line x1="300" y1="210" x2="350" y2="290" stroke="#94a3b8" stroke-width="2"/>

  <!-- layer bands -->
  <rect x="44" y="106" width="352" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <rect x="44" y="186" width="352" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <rect x="44" y="266" width="352" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>

  <!-- nodes -->
  <circle cx="220" cy="130" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="220" y="136" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">1</text>
  <circle cx="140" cy="210" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="140" y="216" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">2</text>
  <circle cx="300" cy="210" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="300" y="216" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">3</text>
  <circle cx="90" cy="290" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="90" y="296" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">4</text>
  <circle cx="190" cy="290" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="190" y="296" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">5</text>
  <circle cx="350" cy="290" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="350" y="296" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">6</text>

  <text x="412" y="135" font-family="Segoe UI" font-size="13" fill="#2563eb">qatlam 0</text>
  <text x="412" y="215" font-family="Segoe UI" font-size="13" fill="#2563eb">qatlam 1</text>
  <text x="412" y="295" font-family="Segoe UI" font-size="13" fill="#2563eb">qatlam 2</text>

  <rect x="44" y="340" width="392" height="40" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="240" y="365" text-anchor="middle" font-family="monospace" font-size="14" fill="#2563eb">tartib: 1 2 3 4 5 6  (yaqindan uzoqqa)</text>

  <!-- ===== RIGHT : DFS ===== -->
  <text x="660" y="92" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">DFS / pre-order (chuqurlik)</text>

  <line x1="660" y1="130" x2="580" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <line x1="660" y1="130" x2="740" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <line x1="580" y1="210" x2="530" y2="290" stroke="#94a3b8" stroke-width="2"/>
  <line x1="580" y1="210" x2="630" y2="290" stroke="#94a3b8" stroke-width="2"/>
  <line x1="740" y1="210" x2="790" y2="290" stroke="#94a3b8" stroke-width="2"/>

  <!-- dive arrow -->
  <path d="M 660 158 Q 600 200 568 270" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4"/>

  <circle cx="660" cy="130" r="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="660" y="136" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">1</text>
  <circle cx="580" cy="210" r="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="580" y="216" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">2</text>
  <circle cx="740" cy="210" r="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="740" y="216" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">5</text>
  <circle cx="530" cy="290" r="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="530" y="296" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">3</text>
  <circle cx="630" cy="290" r="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="630" y="296" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">4</text>
  <circle cx="790" cy="290" r="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="790" y="296" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">6</text>

  <text x="478" y="240" font-family="Segoe UI" font-size="13" fill="#16a34a" font-weight="bold">avval</text>
  <text x="478" y="258" font-family="Segoe UI" font-size="13" fill="#16a34a" font-weight="bold">tubigacha</text>
  <text x="478" y="276" font-family="Segoe UI" font-size="13" fill="#16a34a" font-weight="bold">kiradi</text>

  <rect x="476" y="340" width="380" height="40" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="666" y="365" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">tartib: 1 2 3 4 5 6  (shoxni oxirigacha)</text>

  <!-- bottom contrast note -->
  <rect x="44" y="412" width="812" height="86" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="64" y="440" font-family="Segoe UI" font-size="14" fill="#7c3aed" font-weight="bold">Asosiy farq</text>
  <text x="64" y="464" font-family="Segoe UI" font-size="13" fill="#334155">BFS: ildizga yaqin tugunlarni AVVAL ko'radi — qatlamma-qatlam. Eng qisqa yo'l / eng yaqin tugun uchun.</text>
  <text x="64" y="486" font-family="Segoe UI" font-size="13" fill="#334155">DFS: bitta shoxni oxirigacha kuzatib, keyin orqaga qaytadi. Kam xotira (faqat balandlik chuqurligida).</text>
</svg>
