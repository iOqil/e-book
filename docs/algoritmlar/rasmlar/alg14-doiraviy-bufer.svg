<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560">
  <title>Doiraviy bufer (circular / ring buffer): sobit hajmli massivni halqaga aylantirib, bosh (head) va oxir (tail) ko'rsatkichlari aylanma harakatlanadi — enqueue va dequeue O(1)</title>
  <rect x="0" y="0" width="880" height="560" fill="#f8fafc"/>
  <text x="440" y="36" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Doiraviy bufer (circular / ring buffer)</text>
  <text x="440" y="62" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Sobit massiv halqaga aylanadi: head va tail indekslari oxiridan boshiga "o'rab" o'tadi</text>

  <!-- ring of 8 cells -->
  <!-- center 290,310 radius 150, cells as boxes around circle -->
  <!-- index 0 top, clockwise -->
  <!-- cell positions computed: 8 slots -->
  <g font-family="monospace" font-size="15">
    <!-- 0 (top) -->
    <rect x="255" y="175" width="70" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="290" y="200" text-anchor="middle" fill="#cbd5e1">bo'sh</text>
    <text x="290" y="165" text-anchor="middle" font-size="13" fill="#64748b">[0]</text>
    <!-- 1 (top-right) -->
    <rect x="365" y="205" width="70" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="400" y="230" text-anchor="middle" fill="#cbd5e1">bo'sh</text>
    <text x="448" y="225" text-anchor="middle" font-size="13" fill="#64748b">[1]</text>
    <!-- 2 (right) -->
    <rect x="400" y="290" width="70" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="435" y="315" text-anchor="middle" fill="#2563eb">C</text>
    <text x="488" y="315" text-anchor="middle" font-size="13" fill="#64748b">[2]</text>
    <!-- 3 (bottom-right) -->
    <rect x="365" y="375" width="70" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="400" y="400" text-anchor="middle" fill="#2563eb">D</text>
    <text x="448" y="408" text-anchor="middle" font-size="13" fill="#64748b">[3]</text>
    <!-- 4 (bottom) -->
    <rect x="255" y="405" width="70" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="290" y="430" text-anchor="middle" fill="#2563eb">E</text>
    <text x="290" y="463" text-anchor="middle" font-size="13" fill="#64748b">[4]</text>
    <!-- 5 (bottom-left) -->
    <rect x="145" y="375" width="70" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="180" y="400" text-anchor="middle" fill="#cbd5e1">bo'sh</text>
    <text x="132" y="408" text-anchor="middle" font-size="13" fill="#64748b">[5]</text>
    <!-- 6 (left) -->
    <rect x="110" y="290" width="70" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="145" y="315" text-anchor="middle" fill="#cbd5e1">bo'sh</text>
    <text x="92" y="315" text-anchor="middle" font-size="13" fill="#64748b">[6]</text>
    <!-- 7 (top-left) -->
    <rect x="145" y="205" width="70" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="180" y="230" text-anchor="middle" fill="#cbd5e1">bo'sh</text>
    <text x="132" y="225" text-anchor="middle" font-size="13" fill="#64748b">[7]</text>
  </g>

  <!-- head pointer -> slot 2 (front=C) -->
  <text x="600" y="300" font-family="monospace" font-size="14" font-weight="bold" fill="#dc2626">head = 2 (front)</text>
  <line x1="595" y1="295" x2="475" y2="305" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrhead)"/>
  <!-- tail pointer -> slot 5 (next free) -->
  <text x="600" y="395" font-family="monospace" font-size="14" font-weight="bold" fill="#16a34a">tail = 5 (keyingi bo'sh)</text>
  <line x1="595" y1="390" x2="220" y2="392" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrtail)"/>

  <!-- wrap-around indicator -->
  <path d="M 290 165 A 165 165 0 0 0 132 310" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="120" y="180" font-family="Segoe UI" font-size="13" fill="#f59e0b">index 7 dan keyin</text>
  <text x="120" y="198" font-family="Segoe UI" font-size="13" fill="#f59e0b">0 ga "o'raladi"</text>

  <!-- formula box -->
  <rect x="120" y="480" width="640" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="440" y="505" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#7c3aed">indeks = (indeks + 1) % hajm</text>
  <text x="440" y="528" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">enqueue: arr[tail]=x; tail=(tail+1)%hajm  ·  dequeue: x=arr[head]; head=(head+1)%hajm  —  ikkalasi ham O(1)</text>

  <defs>
    <marker id="arrhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrtail" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
