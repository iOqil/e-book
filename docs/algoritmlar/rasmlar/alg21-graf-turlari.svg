<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520">
  <title>Graf turlari: yo'naltirilgan va yo'naltirilmagan, vaznli va vaznsiz, sikli bor va sikli yo'q (DAG)</title>
  <rect x="0" y="0" width="880" height="520" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Graf turlari</text>
  <text x="440" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Bir nechta o'qda farqlanadi: yo'nalish, vazn va siklning bor-yo'qligi</text>

  <!-- arrowhead marker -->
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="ahp" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- ===== 1: undirected, unweighted ===== -->
  <rect x="28" y="84" width="396" height="190" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="226" y="110" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">Yo'naltirilmagan, vaznsiz</text>

  <line x1="120" y1="160" x2="230" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <line x1="230" y1="150" x2="330" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <line x1="120" y1="160" x2="180" y2="240" stroke="#94a3b8" stroke-width="2"/>
  <line x1="180" y1="240" x2="330" y2="180" stroke="#94a3b8" stroke-width="2"/>

  <circle cx="120" cy="160" r="19" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="120" y="165" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">A</text>
  <circle cx="230" cy="150" r="19" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="230" y="155" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">B</text>
  <circle cx="330" cy="180" r="19" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="330" y="185" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">C</text>
  <circle cx="180" cy="240" r="19" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="180" y="245" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">D</text>
  <text x="226" y="266" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">qirralar ikki tomonlama (do'stlik)</text>

  <!-- ===== 2: directed, unweighted ===== -->
  <rect x="456" y="84" width="396" height="190" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="654" y="110" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">Yo'naltirilgan (digraph)</text>

  <line x1="566" y1="160" x2="650" y2="150" stroke="#dc2626" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="676" y1="156" x2="752" y2="180" stroke="#dc2626" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="566" y1="166" x2="606" y2="234" stroke="#dc2626" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="626" y1="240" x2="745" y2="192" stroke="#dc2626" stroke-width="2" marker-end="url(#ah)"/>

  <circle cx="560" cy="160" r="19" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="560" y="165" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">A</text>
  <circle cx="660" cy="150" r="19" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="660" y="155" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">B</text>
  <circle cx="760" cy="184" r="19" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="760" y="189" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">C</text>
  <circle cx="612" cy="244" r="19" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="612" y="249" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">D</text>
  <text x="654" y="266" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">strelka = yo'nalish (kuzatuvchi)</text>

  <!-- ===== 3: weighted ===== -->
  <rect x="28" y="296" width="396" height="200" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="226" y="322" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">Vaznli (weighted)</text>

  <line x1="120" y1="380" x2="230" y2="368" stroke="#16a34a" stroke-width="2"/>
  <line x1="230" y1="368" x2="330" y2="400" stroke="#16a34a" stroke-width="2"/>
  <line x1="120" y1="380" x2="190" y2="450" stroke="#16a34a" stroke-width="2"/>
  <line x1="190" y1="450" x2="330" y2="400" stroke="#16a34a" stroke-width="2"/>

  <text x="172" y="364" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">7</text>
  <text x="288" y="376" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">3</text>
  <text x="142" y="425" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">2</text>
  <text x="270" y="438" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">5</text>

  <circle cx="120" cy="380" r="19" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="120" y="385" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">A</text>
  <circle cx="230" cy="368" r="19" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="230" y="373" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">B</text>
  <circle cx="330" cy="400" r="19" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="330" y="405" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">C</text>
  <circle cx="190" cy="450" r="19" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="190" y="455" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">D</text>
  <text x="226" y="486" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">son = masofa / narx / sig'im</text>

  <!-- ===== 4: DAG ===== -->
  <rect x="456" y="296" width="396" height="200" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="654" y="322" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#7c3aed">Sikli yo'q: DAG</text>

  <line x1="540" y1="380" x2="618" y2="362" stroke="#7c3aed" stroke-width="2" marker-end="url(#ahp)"/>
  <line x1="540" y1="388" x2="618" y2="430" stroke="#7c3aed" stroke-width="2" marker-end="url(#ahp)"/>
  <line x1="652" y1="372" x2="730" y2="396" stroke="#7c3aed" stroke-width="2" marker-end="url(#ahp)"/>
  <line x1="652" y1="438" x2="730" y2="408" stroke="#7c3aed" stroke-width="2" marker-end="url(#ahp)"/>

  <circle cx="528" cy="384" r="19" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="528" y="389" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">A</text>
  <circle cx="636" cy="356" r="19" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="636" y="361" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">B</text>
  <circle cx="636" cy="442" r="19" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="636" y="447" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">C</text>
  <circle cx="746" cy="402" r="19" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="746" y="407" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">D</text>
  <text x="654" y="486" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">orqaga yo'l yo'q (vazifa bog'liqligi)</text>
</svg>
