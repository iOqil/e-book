<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470">
  <title>Mantiqiy amallar haqiqat jadvali: AND, OR, NOT</title>
  <rect x="0" y="0" width="860" height="470" fill="#f8fafc"/>
  <text x="430" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Mantiqiy amallar — haqiqat jadvallari</text>
  <text x="430" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">R = rost (True), Y = yolg'on (False)</text>

  <!-- AND table -->
  <text x="160" y="104" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">AND (va)</text>
  <text x="160" y="124" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">ikkalasi ham rost bo'lsa</text>
  <!-- header -->
  <rect x="40" y="136" width="80" height="36" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="120" y="136" width="80" height="36" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="200" y="136" width="80" height="36" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="80" y="160" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#1e293b">A</text>
  <text x="160" y="160" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#1e293b">B</text>
  <text x="240" y="160" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#1e293b">A and B</text>
  <!-- rows -->
  <rect x="40" y="172" width="80" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="120" y="172" width="80" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="200" y="172" width="80" height="34" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1"/>
  <text x="80" y="194" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">R</text>
  <text x="160" y="194" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">R</text>
  <text x="240" y="194" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#16a34a">R</text>

  <rect x="40" y="206" width="80" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="120" y="206" width="80" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="200" y="206" width="80" height="34" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1"/>
  <text x="80" y="228" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">R</text>
  <text x="160" y="228" text-anchor="middle" font-family="monospace" font-size="14" fill="#dc2626">Y</text>
  <text x="240" y="228" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#dc2626">Y</text>

  <rect x="40" y="240" width="80" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="120" y="240" width="80" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="200" y="240" width="80" height="34" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1"/>
  <text x="80" y="262" text-anchor="middle" font-family="monospace" font-size="14" fill="#dc2626">Y</text>
  <text x="160" y="262" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">R</text>
  <text x="240" y="262" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#dc2626">Y</text>

  <rect x="40" y="274" width="80" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="120" y="274" width="80" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="200" y="274" width="80" height="34" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1"/>
  <text x="80" y="296" text-anchor="middle" font-family="monospace" font-size="14" fill="#dc2626">Y</text>
  <text x="160" y="296" text-anchor="middle" font-family="monospace" font-size="14" fill="#dc2626">Y</text>
  <text x="240" y="296" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#dc2626">Y</text>

  <!-- OR table -->
  <text x="450" y="104" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#7c3aed">OR (yoki)</text>
  <text x="450" y="124" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">kamida bittasi rost bo'lsa</text>
  <rect x="330" y="136" width="80" height="36" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="410" y="136" width="80" height="36" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="490" y="136" width="80" height="36" fill="#ede9fe" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="370" y="160" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#1e293b">A</text>
  <text x="450" y="160" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#1e293b">B</text>
  <text x="530" y="160" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#1e293b">A or B</text>

  <rect x="330" y="172" width="80" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="410" y="172" width="80" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="490" y="172" width="80" height="34" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1"/>
  <text x="370" y="194" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">R</text>
  <text x="450" y="194" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">R</text>
  <text x="530" y="194" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#16a34a">R</text>

  <rect x="330" y="206" width="80" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="410" y="206" width="80" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="490" y="206" width="80" height="34" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1"/>
  <text x="370" y="228" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">R</text>
  <text x="450" y="228" text-anchor="middle" font-family="monospace" font-size="14" fill="#dc2626">Y</text>
  <text x="530" y="228" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#16a34a">R</text>

  <rect x="330" y="240" width="80" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="410" y="240" width="80" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="490" y="240" width="80" height="34" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1"/>
  <text x="370" y="262" text-anchor="middle" font-family="monospace" font-size="14" fill="#dc2626">Y</text>
  <text x="450" y="262" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">R</text>
  <text x="530" y="262" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#16a34a">R</text>

  <rect x="330" y="274" width="80" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="410" y="274" width="80" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="490" y="274" width="80" height="34" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1"/>
  <text x="370" y="296" text-anchor="middle" font-family="monospace" font-size="14" fill="#dc2626">Y</text>
  <text x="450" y="296" text-anchor="middle" font-family="monospace" font-size="14" fill="#dc2626">Y</text>
  <text x="530" y="296" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#dc2626">Y</text>

  <!-- NOT table -->
  <text x="710" y="104" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">NOT (emas)</text>
  <text x="710" y="124" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">qiymatni teskari qiladi</text>
  <rect x="630" y="136" width="80" height="36" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="710" y="136" width="100" height="36" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="670" y="160" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#1e293b">A</text>
  <text x="760" y="160" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#1e293b">not A</text>

  <rect x="630" y="172" width="80" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="710" y="172" width="100" height="34" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1"/>
  <text x="670" y="194" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">R</text>
  <text x="760" y="194" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#dc2626">Y</text>

  <rect x="630" y="206" width="80" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="710" y="206" width="100" height="34" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1"/>
  <text x="670" y="228" text-anchor="middle" font-family="monospace" font-size="14" fill="#dc2626">Y</text>
  <text x="760" y="228" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#16a34a">R</text>

  <!-- De Morgan note -->
  <rect x="630" y="252" width="180" height="56" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="720" y="274" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#b45309">De Morgan:</text>
  <text x="720" y="294" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">not(A and B)</text>
  <text x="720" y="308" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">= not A or not B</text>

  <!-- bottom band -->
  <rect x="40" y="332" width="770" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="352" font-family="Segoe UI" font-size="14" fill="#334155">Qisqa tutashuv: A and B da A yolg'on bo'lsa, B umuman baholanmaydi (natija baribir yolg'on).</text>
  <text x="60" y="372" font-family="Segoe UI" font-size="14" fill="#334155">A or B da A rost bo'lsa, B baholanmaydi. Bu xavfsizlik tekshiruvlarida juda foydali.</text>
</svg>
