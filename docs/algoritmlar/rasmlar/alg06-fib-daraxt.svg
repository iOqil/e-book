<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560">
  <title>fib(5) rekursiya daraxti: takroriy qism-masalalar belgilangan</title>
  <rect x="0" y="0" width="900" height="560" fill="#f8fafc"/>
  <text x="450" y="36" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">fib(5) rekursiya daraxti</text>
  <text x="450" y="60" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Bir xil qism-masala (amber) qayta-qayta hisoblanadi — eksponensial isrof</text>

  <!-- edges -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <!-- fib5 -> fib4, fib3 -->
    <path d="M 450 110 L 250 175"/>
    <path d="M 450 110 L 650 175"/>
    <!-- fib4 -> fib3, fib2 -->
    <path d="M 250 200 L 140 270"/>
    <path d="M 250 200 L 360 270"/>
    <!-- fib3(right) -> fib2, fib1 -->
    <path d="M 650 200 L 560 270"/>
    <path d="M 650 200 L 750 270"/>
    <!-- fib3(left under fib4) -> fib2, fib1 -->
    <path d="M 140 295 L 70 365"/>
    <path d="M 140 295 L 210 365"/>
    <!-- fib2 under fib4 -> fib1, fib0 -->
    <path d="M 360 295 L 320 365"/>
    <path d="M 360 295 L 410 365"/>
    <!-- fib2 under right fib3 -> fib1, fib0 -->
    <path d="M 560 295 L 520 365"/>
    <path d="M 560 295 L 610 365"/>
    <!-- fib2 (leftmost under fib3) -> fib1, fib0 -->
    <path d="M 70 390 L 30 455"/>
    <path d="M 70 390 L 110 455"/>
  </g>

  <!-- nodes -->
  <!-- root fib5 -->
  <circle cx="450" cy="95" r="26" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="450" y="100" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e293b">fib5</text>

  <!-- level 1 -->
  <circle cx="250" cy="188" r="24" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="250" y="193" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e293b">fib4</text>
  <circle cx="650" cy="188" r="24" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="650" y="193" text-anchor="middle" font-family="monospace" font-size="14" fill="#92400e">fib3</text>

  <!-- level 2 -->
  <circle cx="140" cy="283" r="22" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="140" y="288" text-anchor="middle" font-family="monospace" font-size="13" fill="#92400e">fib3</text>
  <circle cx="360" cy="283" r="22" fill="#fde68a" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="360" y="288" text-anchor="middle" font-family="monospace" font-size="13" fill="#92400e">fib2</text>
  <circle cx="560" cy="283" r="22" fill="#fde68a" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="560" y="288" text-anchor="middle" font-family="monospace" font-size="13" fill="#92400e">fib2</text>
  <circle cx="750" cy="283" r="22" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="750" y="288" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">fib1</text>

  <!-- level 3 -->
  <circle cx="70" cy="383" r="20" fill="#fde68a" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="70" y="388" text-anchor="middle" font-family="monospace" font-size="13" fill="#92400e">fib2</text>
  <circle cx="210" cy="383" r="20" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="210" y="388" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">fib1</text>
  <circle cx="320" cy="383" r="20" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="320" y="388" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">fib1</text>
  <circle cx="410" cy="383" r="20" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="410" y="388" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">fib0</text>
  <circle cx="520" cy="383" r="20" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="520" y="388" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">fib1</text>
  <circle cx="610" cy="383" r="20" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="610" y="388" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">fib0</text>

  <!-- level 4 (leftmost fib2 children) -->
  <circle cx="30" cy="473" r="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="30" y="478" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">fib1</text>
  <circle cx="110" cy="473" r="18" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="110" y="478" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">fib0</text>

  <!-- legend -->
  <rect x="430" y="430" width="440" height="100" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="455" cy="458" r="11" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="475" y="463" font-family="Segoe UI" font-size="14" fill="#334155">= takror hisoblangan qism-masala (fib3 2 marta, fib2 3 marta)</text>
  <text x="450" y="492" font-family="Segoe UI" font-size="14" fill="#334155">fib(5) uchun 15 ta chaqiruv; fib(n) chaqiruvlari ~ O(phi^n) — eksponensial.</text>
  <text x="450" y="516" font-family="Segoe UI" font-size="14" fill="#dc2626">Yechim: memoizatsiya / DP — har qism-masalani bir marta hisobla.</text>
</svg>
