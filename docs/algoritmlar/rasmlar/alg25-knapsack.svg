  <!-- explanation of one cell -->
  <rect x="40" y="370" width="820" height="160" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="398" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">Bitta katak qanday hisoblanadi: dp[i][c]</text>
  <text x="60" y="426" font-family="monospace" font-size="14" fill="#1e293b">dp[i][c] = max( dp[i-1][c]      // i-buyumni OLMAYMIZ — yuqoridagi katak</text>
  <text x="60" y="450" font-family="monospace" font-size="14" fill="#1e293b">              , dp[i-1][c-w] + v )  // i-buyumni OLAMIZ (agar w &lt;= c)</text>
  <text x="60" y="484" font-family="Segoe UI" font-size="14" fill="#334155">Misol — ko'k katak dp[2][3]: w=3,v=4 buyum. Olmaymiz: dp[1][3]=1. Olamiz: dp[1][3-3]+4 = dp[1][0]+4 = 0+4 = 4.</text>
  <text x="60" y="510" font-family="Segoe UI" font-size="14" fill="#16a34a">max(1, 4) = 4. Yashil katak dp[3][7]=9 — yakuniy javob (w=3 va w=4 buyumlar: 4+5=9).</text>
</svg>
