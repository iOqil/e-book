<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560">
  <title>0/1 knapsack DP jadvali — qatorlar buyumlar, ustunlar sig'im, bitta katak hisoblanishi</title>
  <rect x="0" y="0" width="900" height="560" fill="#f8fafc"/>
  <text x="450" y="32" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">0/1 Knapsack DP jadvali</text>
  <text x="450" y="56" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Buyumlar: (og'irlik=1,qiymat=1) (3,4) (4,5) (5,7) · Sig'im W=7 · Javob = 9</text>

  <!-- column headers: capacity 0..7 -->
  <text x="120" y="108" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155">buyum \ sig'im</text>
  <g font-family="monospace" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="bold">
    <text x="240" y="108">0</text>
    <text x="300" y="108">1</text>
    <text x="360" y="108">2</text>
    <text x="420" y="108">3</text>
    <text x="480" y="108">4</text>
    <text x="540" y="108">5</text>
    <text x="600" y="108">6</text>
    <text x="660" y="108">7</text>
  </g>

  <!-- row labels -->
  <g font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="end">
    <text x="205" y="142">(yo'q)</text>
    <text x="205" y="186">w1 v1</text>
    <text x="205" y="230">w3 v4</text>
    <text x="205" y="274">w4 v5</text>
    <text x="205" y="318">w5 v7</text>
  </g>

