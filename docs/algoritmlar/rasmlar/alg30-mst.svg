<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560">
  <title>Minimal qoplovchi daraxt (MST): Kruskal qirralarni vazn bo'yicha saralab union-find bilan qo'shadi, Prim esa bitta tugundan eng arzon qirra bilan o'sib boradi</title>
  <rect x="0" y="0" width="880" height="560" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Minimal qoplovchi daraxt (MST)</text>
  <text x="440" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Barcha tugunni bog'lovchi, eng kam umumiy vaznli, siklsiz daraxt (V-1 qirra)</text>

  <!-- ===== Chap: Kruskal ===== -->
  <rect x="24" y="80" width="412" height="450" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="230" y="106" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">Kruskal: qirralarni saralab qo'shish</text>

  <!-- graf -->
  <line x1="95" y1="170" x2="200" y2="160" stroke="#16a34a" stroke-width="3"/>
  <line x1="95" y1="180" x2="150" y2="270" stroke="#16a34a" stroke-width="3"/>
  <line x1="215" y1="175" x2="160" y2="265" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="225" y1="160" x2="320" y2="210" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="175" y1="280" x2="315" y2="225" stroke="#16a34a" stroke-width="3"/>
  <line x1="335" y1="225" x2="360" y2="320" stroke="#16a34a" stroke-width="3"/>

  <text x="148" y="158" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">1</text>
  <text x="108" y="232" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">3</text>
  <text x="200" y="232" text-anchor="middle" font-family="monospace" font-size="14" fill="#94a3b8">3</text>
  <text x="280" y="178" text-anchor="middle" font-family="monospace" font-size="14" fill="#94a3b8">6</text>
  <text x="258" y="248" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">5</text>
  <text x="362" y="278" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">2</text>

  <circle cx="80" cy="175" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="80" y="180" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">0</text>
  <circle cx="215" cy="158" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="215" y="163" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">1</text>
  <circle cx="160" cy="285" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="160" y="290" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">2</text>
  <circle cx="328" cy="218" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="328" y="223" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">3</text>
  <circle cx="368" cy="335" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="368" y="340" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">4</text>

  <rect x="44" y="372" width="372" height="142" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="58" y="396" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">Saralangan qirralarni ketma-ket qo'shamiz:</text>
  <text x="58" y="420" font-family="monospace" font-size="13" fill="#16a34a">0-1 (1) ✓  2-4 (2) ✓  0-2 (3) ✓</text>
  <text x="58" y="442" font-family="monospace" font-size="13" fill="#dc2626">1-2 (3) ✗ sikl  →  union-find rad etadi</text>
  <text x="58" y="464" font-family="monospace" font-size="13" fill="#16a34a">2-3 (5) ✓   (4 ta qirra = V-1, tugadi)</text>
  <text x="58" y="488" font-family="monospace" font-size="13" fill="#334155">Jami vazn = 1+2+3+5 = 11</text>
  <text x="58" y="508" font-family="monospace" font-size="13" fill="#64748b">Murakkablik: O(E log E)  (saralash)</text>

  <!-- ===== O'ng: Prim ===== -->
  <rect x="452" y="80" width="404" height="450" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="654" y="106" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">Prim: bitta tugundan o'sib borish</text>

  <!-- daraxt o'sishi -->
  <line x1="520" y1="170" x2="625" y2="160" stroke="#2563eb" stroke-width="3"/>
  <line x1="520" y1="180" x2="575" y2="270" stroke="#2563eb" stroke-width="3"/>
  <line x1="600" y1="280" x2="740" y2="225" stroke="#2563eb" stroke-width="3"/>
  <line x1="760" y1="225" x2="785" y2="320" stroke="#2563eb" stroke-width="3"/>

  <text x="573" y="158" text-anchor="middle" font-family="monospace" font-size="14" fill="#2563eb">1</text>
  <text x="533" y="232" text-anchor="middle" font-family="monospace" font-size="14" fill="#2563eb">3</text>
  <text x="680" y="248" text-anchor="middle" font-family="monospace" font-size="14" fill="#2563eb">5</text>
  <text x="787" y="278" text-anchor="middle" font-family="monospace" font-size="14" fill="#2563eb">2</text>

  <circle cx="505" cy="175" r="20" fill="#fef9c3" stroke="#f59e0b" stroke-width="3"/>
  <text x="505" y="180" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#b45309">0</text>
  <text x="505" y="148" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#b45309">boshlash</text>
  <circle cx="640" cy="158" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="640" y="163" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">1</text>
  <circle cx="585" cy="285" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="585" y="290" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">2</text>
  <circle cx="753" cy="218" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="753" y="223" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">3</text>
  <circle cx="793" cy="335" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="793" y="340" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">4</text>

  <rect x="472" y="372" width="364" height="142" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="486" y="396" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">Har qadamda daraxtdan chiquvchi</text>
  <text x="486" y="418" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">eng arzon qirrani tanlaymiz:</text>
  <text x="486" y="442" font-family="monospace" font-size="13" fill="#2563eb">{0} → 0-1(1) → {0,1} → 0-2(3)</text>
  <text x="486" y="464" font-family="monospace" font-size="13" fill="#2563eb">→ 2-4(2) → 2-3(5).  Jami = 11</text>
  <text x="486" y="486" font-family="Segoe UI" font-size="13" fill="#334155">Bir xil natija! (MST yagona vaznli)</text>
  <text x="486" y="508" font-family="monospace" font-size="13" fill="#64748b">Murakkablik: O((V+E) log V)  (heap)</text>
</svg>
