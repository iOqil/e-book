<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470">
  <title>Topologik saralash: vazifa bog'liqliklari DAG sifatida berilgan; har qirra oldindan keyinga yo'naladi va natijada barcha bog'liqliklarni hurmat qiluvchi chiziqli tartib hosil bo'ladi</title>
  <rect x="0" y="0" width="860" height="470" fill="#f8fafc"/>
  <text x="430" y="36" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Topologik saralash — DAG dan chiziqli tartib</text>
  <text x="430" y="60" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Kiyinish bog'liqligi: strelka "avval bu kerak" degani</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/></marker>
  </defs>

  <!-- DAG -->
  <text x="220" y="100" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">DAG (bog'liqlik grafi)</text>
  <g stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <line x1="125" y1="150" x2="195" y2="205"/>
    <line x1="225" y1="230" x2="290" y2="290"/>
    <line x1="120" y1="320" x2="285" y2="305"/>
    <line x1="235" y1="225" x2="345" y2="160"/>
    <line x1="240" y1="240" x2="330" y2="290"/>
  </g>
  <g font-family="Segoe UI" font-size="13" font-weight="bold" text-anchor="middle">
    <circle cx="110" cy="140" r="30" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="110" y="145" fill="#5b21b6">koylak</text>
    <circle cx="215" cy="225" r="30" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="215" y="230" fill="#5b21b6">shim</text>
    <circle cx="100" cy="330" r="30" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="100" y="335" fill="#5b21b6">paypoq</text>
    <circle cx="320" cy="315" r="30" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="320" y="320" fill="#5b21b6">tufli</text>
    <circle cx="370" cy="140" r="30" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="370" y="145" fill="#5b21b6">kostyum</text>
  </g>

  <!-- arrow to result -->
  <line x1="430" y1="235" x2="500" y2="235" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>
  <defs>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/></marker>
  </defs>
  <text x="465" y="222" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">Kahn</text>

  <!-- linear order -->
  <text x="660" y="100" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">Chiziqli tartib (yagona emas)</text>
  <g font-family="Segoe UI" font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="520" y="155" width="84" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="562" y="182" fill="#15803d">koylak</text>
    <rect x="612" y="155" width="84" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="654" y="182" fill="#15803d">paypoq</text>
    <rect x="704" y="155" width="84" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="746" y="182" fill="#15803d">shim</text>
    <rect x="566" y="215" width="84" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="608" y="242" fill="#15803d">kostyum</text>
    <rect x="658" y="215" width="84" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="700" y="242" fill="#15803d">tufli</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="604" y1="177" x2="612" y2="177"/>
    <line x1="696" y1="177" x2="704" y2="177"/>
    <line x1="650" y1="237" x2="658" y2="237"/>
  </g>
  <text x="654" y="290" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Har strelka chapdan o'ngga: hech</text>
  <text x="654" y="310" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">bir qirra orqaga qaramaydi.</text>

  <!-- cycle warning -->
  <rect x="60" y="395" width="740" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="80" y="426" font-family="Segoe UI" font-size="14" fill="#b91c1c"><tspan font-weight="bold">Diqqat:</tspan> agar grafda sikl bo'lsa, topologik tartib MAVJUD EMAS (Kahn hamma tugunni chiqara olmaydi).</text>
</svg>
