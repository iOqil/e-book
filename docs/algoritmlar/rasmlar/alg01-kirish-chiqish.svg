<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420">
  <title>Qora quti modeli: Kirish -> Algoritm -> Chiqish</title>
  <rect x="0" y="0" width="820" height="420" fill="#f8fafc"/>
  <text x="410" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">"Qora quti" modeli</text>
  <text x="410" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Algoritm kirishni chiqishga aylantiradi</text>

  <!-- Kirish -->
  <rect x="40" y="150" width="190" height="120" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="135" y="185" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#7c3aed">Kirish</text>
  <text x="135" y="208" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">(input)</text>
  <text x="135" y="234" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Masalan:</text>
  <text x="135" y="254" text-anchor="middle" font-family="monospace" font-size="14" fill="#334155">[7, 2, 9, 4]</text>

  <!-- Algoritm (black box) -->
  <rect x="315" y="130" width="190" height="160" rx="12" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <text x="410" y="200" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#ffffff">Algoritm</text>
  <text x="410" y="226" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#cbd5e1">qayta ishlash</text>
  <text x="410" y="248" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#94a3b8">(qadamlar ketma-ketligi)</text>

  <!-- Chiqish -->
  <rect x="590" y="150" width="190" height="120" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="685" y="185" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#16a34a">Chiqish</text>
  <text x="685" y="208" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">(output)</text>
  <text x="685" y="234" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Eng katta:</text>
  <text x="685" y="254" text-anchor="middle" font-family="monospace" font-size="14" fill="#334155">9</text>

  <!-- arrows -->
  <line x1="230" y1="210" x2="312" y2="210" stroke="#475569" stroke-width="3"/>
  <polygon points="315,210 305,204 305,216" fill="#475569"/>
  <line x1="505" y1="210" x2="587" y2="210" stroke="#475569" stroke-width="3"/>
  <polygon points="590,210 580,204 580,216" fill="#475569"/>

  <!-- bottom annotation -->
  <rect x="120" y="330" width="580" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="410" y="356" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Ichida nima bo'lishini bilmasak ham, kirish va chiqishni ko'rsata olamiz.</text>
  <text x="410" y="378" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Aynan shu "qora quti" g'oyasi algoritmni dasturdan ajratib o'ylashga yordam beradi.</text>
</svg>
