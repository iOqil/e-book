<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470">
  <title>Saralash algoritmlarini solishtirish jadvali: nom, eng yaxshi/o'rtacha/yomon vaqt, qo'shimcha xotira va barqarorlik</title>
  <rect x="0" y="0" width="880" height="470" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Saralash algoritmlari: solishtirish</text>

  <!-- header row -->
  <rect x="30" y="54" width="170" height="40" fill="#1e293b"/>
  <rect x="200" y="54" width="130" height="40" fill="#1e293b"/>
  <rect x="330" y="54" width="130" height="40" fill="#1e293b"/>
  <rect x="460" y="54" width="130" height="40" fill="#1e293b"/>
  <rect x="590" y="54" width="130" height="40" fill="#1e293b"/>
  <rect x="720" y="54" width="130" height="40" fill="#1e293b"/>
  <text x="115" y="79" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff">Algoritm</text>
  <text x="265" y="79" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff">Eng yaxshi</text>
  <text x="395" y="79" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff">O'rtacha</text>
  <text x="525" y="79" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff">Eng yomon</text>
  <text x="655" y="79" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff">Xotira</text>
  <text x="785" y="79" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff">Barqaror</text>

  <!-- rows: helper grid -->
  <!-- Row 1 Bubble -->
  <rect x="30" y="94" width="820" height="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="42" y="117" font-family="Segoe UI" font-size="14" fill="#334155">Bubble</text>
  <text x="265" y="117" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">O(n)</text>
  <text x="395" y="117" text-anchor="middle" font-family="monospace" font-size="13" fill="#dc2626">O(n²)</text>
  <text x="525" y="117" text-anchor="middle" font-family="monospace" font-size="13" fill="#dc2626">O(n²)</text>
  <text x="655" y="117" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">O(1)</text>
  <text x="785" y="117" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">Ha</text>

  <!-- Row 2 Selection -->
  <rect x="30" y="130" width="820" height="36" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="42" y="153" font-family="Segoe UI" font-size="14" fill="#334155">Selection</text>
  <text x="265" y="153" text-anchor="middle" font-family="monospace" font-size="13" fill="#dc2626">O(n²)</text>
  <text x="395" y="153" text-anchor="middle" font-family="monospace" font-size="13" fill="#dc2626">O(n²)</text>
  <text x="525" y="153" text-anchor="middle" font-family="monospace" font-size="13" fill="#dc2626">O(n²)</text>
  <text x="655" y="153" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">O(1)</text>
  <text x="785" y="153" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#dc2626">Yo'q</text>

  <!-- Row 3 Insertion -->
  <rect x="30" y="166" width="820" height="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="42" y="189" font-family="Segoe UI" font-size="14" fill="#334155">Insertion</text>
  <text x="265" y="189" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">O(n)</text>
  <text x="395" y="189" text-anchor="middle" font-family="monospace" font-size="13" fill="#dc2626">O(n²)</text>
  <text x="525" y="189" text-anchor="middle" font-family="monospace" font-size="13" fill="#dc2626">O(n²)</text>
  <text x="655" y="189" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">O(1)</text>
  <text x="785" y="189" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">Ha</text>

  <!-- Row 4 Merge -->
  <rect x="30" y="202" width="820" height="36" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="42" y="225" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">Merge</text>
  <text x="265" y="225" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">O(n log n)</text>
  <text x="395" y="225" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">O(n log n)</text>
  <text x="525" y="225" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">O(n log n)</text>
  <text x="655" y="225" text-anchor="middle" font-family="monospace" font-size="13" fill="#f59e0b">O(n)</text>
  <text x="785" y="225" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">Ha</text>

  <!-- Row 5 Quick -->
  <rect x="30" y="238" width="820" height="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="42" y="261" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">Quick</text>
  <text x="265" y="261" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">O(n log n)</text>
  <text x="395" y="261" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">O(n log n)</text>
  <text x="525" y="261" text-anchor="middle" font-family="monospace" font-size="13" fill="#dc2626">O(n²)</text>
  <text x="655" y="261" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">O(log n)</text>
  <text x="785" y="261" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#dc2626">Yo'q</text>

  <!-- Row 6 Heap -->
  <rect x="30" y="274" width="820" height="36" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="42" y="297" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">Heap</text>
  <text x="265" y="297" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">O(n log n)</text>
  <text x="395" y="297" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">O(n log n)</text>
  <text x="525" y="297" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">O(n log n)</text>
  <text x="655" y="297" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">O(1)</text>
  <text x="785" y="297" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#dc2626">Yo'q</text>

  <!-- Row 7 Counting -->
  <rect x="30" y="310" width="820" height="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="42" y="333" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">Counting</text>
  <text x="265" y="333" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">O(n+k)</text>
  <text x="395" y="333" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">O(n+k)</text>
  <text x="525" y="333" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">O(n+k)</text>
  <text x="655" y="333" text-anchor="middle" font-family="monospace" font-size="13" fill="#f59e0b">O(k)</text>
  <text x="785" y="333" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">Ha</text>

  <!-- Row 8 Radix -->
  <rect x="30" y="346" width="820" height="36" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="42" y="369" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">Radix</text>
  <text x="265" y="369" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">O(d(n+k))</text>
  <text x="395" y="369" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">O(d(n+k))</text>
  <text x="525" y="369" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">O(d(n+k))</text>
  <text x="655" y="369" text-anchor="middle" font-family="monospace" font-size="13" fill="#f59e0b">O(n+k)</text>
  <text x="785" y="369" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">Ha</text>

  <!-- legend -->
  <text x="42" y="412" font-family="Segoe UI" font-size="14" fill="#16a34a">■ yashil = tez / yaxshi</text>
  <text x="270" y="412" font-family="Segoe UI" font-size="14" fill="#f59e0b">■ amber = e'tibor</text>
  <text x="470" y="412" font-family="Segoe UI" font-size="14" fill="#dc2626">■ qizil = sekin / kamchilik</text>

  <text x="42" y="442" font-family="Segoe UI" font-size="13" fill="#64748b">Yuqori (taqqoslash) blok: umumiy maqsadli — har qanday solishtiriladigan kalit. Quyi (binar/banafsha) blok: faqat butun kalitlar, cheklangan diapazon.</text>
  <text x="42" y="460" font-family="Segoe UI" font-size="13" fill="#64748b">k = qiymatlar diapazoni, d = raqamlar soni. Counting/radix taqqoslashsiz ishlaydi -> O(n log n) chegarasini aylanib o'tadi.</text>
</svg>
