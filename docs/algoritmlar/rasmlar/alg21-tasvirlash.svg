  <text x="656" y="340" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">3</text>

  <!-- node 1 -->
  <rect x="470" y="362" width="40" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="490" y="382" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#16a34a">1</text>
