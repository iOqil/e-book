  <rect x="530" y="404" width="44" height="30" rx="6" fill="#ffffff" stroke="#16a34a"/>
  <text x="552" y="424" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">0</text>
  <rect x="582" y="404" width="44" height="30" rx="6" fill="#ffffff" stroke="#16a34a"/>
  <text x="604" y="424" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">3</text>

  <!-- node 3 -->
  <rect x="470" y="446" width="40" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="490" y="466" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#16a34a">3</text>
  <line x1="510" y1="461" x2="530" y2="461" stroke="#16a34a" stroke-width="2"/>
  <rect x="530" y="446" width="44" height="30" rx="6" fill="#ffffff" stroke="#16a34a"/>
  <text x="552" y="466" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">0</text>
  <rect x="582" y="446" width="44" height="30" rx="6" fill="#ffffff" stroke="#16a34a"/>
  <text x="604" y="466" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">1</text>
  <rect x="634" y="446" width="44" height="30" rx="6" fill="#ffffff" stroke="#16a34a"/>
  <text x="656" y="466" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">2</text>

  <text x="640" y="500" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">Xotira: O(V+E) — siyrak grafga mos</text>
</svg>
