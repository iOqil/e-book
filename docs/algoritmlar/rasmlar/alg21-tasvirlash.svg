  <rect x="530" y="362" width="44" height="30" rx="6" fill="#ffffff" stroke="#16a34a"/>
  <text x="552" y="382" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">0</text>
  <rect x="582" y="362" width="44" height="30" rx="6" fill="#ffffff" stroke="#16a34a"/>
  <text x="604" y="382" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">3</text>

  <!-- node 2 -->
  <rect x="470" y="404" width="40" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="490" y="424" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#16a34a">2</text>
