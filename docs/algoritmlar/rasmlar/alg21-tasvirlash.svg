<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540">
  <title>Bitta graf uchun qo'shnilik matritsasi va qo'shnilik ro'yxati taqqoslangani</title>
  <rect x="0" y="0" width="880" height="540" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Tasvirlash: matritsa va ro'yxat</text>
  <text x="440" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Bir xil yo'naltirilmagan graf, ikki xil saqlash usuli</text>

  <!-- ===== graph (top, centered) ===== -->
  <rect x="318" y="76" width="244" height="160" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <line x1="380" y1="120" x2="500" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <line x1="380" y1="120" x2="380" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="500" y1="120" x2="500" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="380" y1="200" x2="500" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="380" y1="120" x2="500" y2="200" stroke="#94a3b8" stroke-width="2"/>

  <circle cx="380" cy="120" r="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="380" y="125" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">0</text>
  <circle cx="500" cy="120" r="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="500" y="125" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">1</text>
  <circle cx="380" cy="200" r="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="380" y="205" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">2</text>
  <circle cx="500" cy="200" r="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="500" y="205" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">3</text>
  <text x="440" y="226" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">qirralar: 0-1, 0-2, 0-3, 1-3, 2-3</text>

  <!-- ===== adjacency matrix (left) ===== -->
  <text x="200" y="282" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">Qo'shnilik matritsasi</text>
  <text x="200" y="302" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">V x V jadval, qirra bor-yo'q = O(1)</text>

  <!-- column headers -->
  <text x="150" y="334" text-anchor="middle" font-family="monospace" font-size="13" fill="#2563eb">0</text>
  <text x="190" y="334" text-anchor="middle" font-family="monospace" font-size="13" fill="#2563eb">1</text>
  <text x="230" y="334" text-anchor="middle" font-family="monospace" font-size="13" fill="#2563eb">2</text>
  <text x="270" y="334" text-anchor="middle" font-family="monospace" font-size="13" fill="#2563eb">3</text>

  <!-- row 0 -->
  <text x="110" y="364" text-anchor="middle" font-family="monospace" font-size="13" fill="#2563eb">0</text>
  <rect x="132" y="348" width="36" height="28" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="150" y="367" text-anchor="middle" font-family="monospace" font-size="14" fill="#94a3b8">0</text>
