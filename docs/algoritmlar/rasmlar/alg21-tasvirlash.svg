  <text x="190" y="395" text-anchor="middle" font-family="monospace" font-size="14" fill="#94a3b8">0</text>
  <rect x="212" y="376" width="36" height="28" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="230" y="395" text-anchor="middle" font-family="monospace" font-size="14" fill="#94a3b8">0</text>
  <rect x="252" y="376" width="36" height="28" fill="#dbeafe" stroke="#cbd5e1"/>
  <text x="270" y="395" text-anchor="middle" font-family="monospace" font-size="14" fill="#2563eb">1</text>

  <!-- row 2 -->
  <text x="110" y="420" text-anchor="middle" font-family="monospace" font-size="13" fill="#2563eb">2</text>
  <rect x="132" y="404" width="36" height="28" fill="#dbeafe" stroke="#cbd5e1"/>
  <text x="150" y="423" text-anchor="middle" font-family="monospace" font-size="14" fill="#2563eb">1</text>
  <rect x="172" y="404" width="36" height="28" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="190" y="423" text-anchor="middle" font-family="monospace" font-size="14" fill="#94a3b8">0</text>
  <rect x="212" y="404" width="36" height="28" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="230" y="423" text-anchor="middle" font-family="monospace" font-size="14" fill="#94a3b8">0</text>
  <rect x="252" y="404" width="36" height="28" fill="#dbeafe" stroke="#cbd5e1"/>
  <text x="270" y="423" text-anchor="middle" font-family="monospace" font-size="14" fill="#2563eb">1</text>

  <!-- row 3 -->
  <text x="110" y="448" text-anchor="middle" font-family="monospace" font-size="13" fill="#2563eb">3</text>
  <rect x="132" y="432" width="36" height="28" fill="#dbeafe" stroke="#cbd5e1"/>
  <text x="150" y="451" text-anchor="middle" font-family="monospace" font-size="14" fill="#2563eb">1</text>
  <rect x="172" y="432" width="36" height="28" fill="#dbeafe" stroke="#cbd5e1"/>
  <text x="190" y="451" text-anchor="middle" font-family="monospace" font-size="14" fill="#2563eb">1</text>
  <rect x="212" y="432" width="36" height="28" fill="#dbeafe" stroke="#cbd5e1"/>
  <text x="230" y="451" text-anchor="middle" font-family="monospace" font-size="14" fill="#2563eb">1</text>
  <rect x="252" y="432" width="36" height="28" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="270" y="451" text-anchor="middle" font-family="monospace" font-size="14" fill="#94a3b8">0</text>

  <text x="200" y="490" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">Xotira: O(V^2) — zich grafga mos</text>

  <!-- ===== adjacency list (right) ===== -->
  <text x="640" y="282" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">Qo'shnilik ro'yxati</text>
  <text x="640" y="302" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">har tugun: qo'shnilar ro'yxati</text>

  <!-- node 0 -->
  <rect x="470" y="320" width="40" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="490" y="340" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#16a34a">0</text>
  <line x1="510" y1="335" x2="530" y2="335" stroke="#16a34a" stroke-width="2"/>
  <rect x="530" y="320" width="44" height="30" rx="6" fill="#ffffff" stroke="#16a34a"/>
  <text x="552" y="340" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">1</text>
  <rect x="582" y="320" width="44" height="30" rx="6" fill="#ffffff" stroke="#16a34a"/>
  <text x="604" y="340" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">2</text>
