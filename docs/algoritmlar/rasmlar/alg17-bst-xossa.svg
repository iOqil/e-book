<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520">
  <title>Binar qidiruv daraxti xossasi: har bir tugun uchun chap qism-daraxt qiymatlari tugundan kichik, o'ng qism-daraxt qiymatlari kattadir</title>
  <rect x="0" y="0" width="860" height="520" fill="#f8fafc"/>
  <text x="430" y="36" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">BST xossasi (invariant)</text>
  <text x="430" y="62" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Har tugun uchun: chap qism-daraxt &lt; tugun &lt; o'ng qism-daraxt</text>

  <!-- edges -->
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="430" y1="118" x2="280" y2="198"/>
    <line x1="430" y1="118" x2="600" y2="198"/>
    <line x1="280" y1="218" x2="190" y2="298"/>
    <line x1="280" y1="218" x2="370" y2="298"/>
    <line x1="600" y1="218" x2="690" y2="298"/>
    <line x1="190" y1="318" x2="130" y2="398"/>
    <line x1="190" y1="318" x2="250" y2="398"/>
  </g>

  <!-- root 50 -->
  <circle cx="430" cy="108" r="28" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="430" y="114" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1e293b">50</text>

  <!-- level 2 -->
  <circle cx="280" cy="208" r="28" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="280" y="214" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1e293b">30</text>
  <circle cx="600" cy="208" r="28" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
  <text x="600" y="214" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1e293b">70</text>

  <!-- level 3 -->
  <circle cx="190" cy="308" r="26" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="190" y="314" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#1e293b">20</text>
  <circle cx="370" cy="308" r="26" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="370" y="314" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#1e293b">40</text>
  <circle cx="690" cy="308" r="26" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="690" y="314" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#1e293b">80</text>

  <!-- level 4 -->
  <circle cx="130" cy="408" r="24" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="130" y="414" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#1e293b">10</text>
  <circle cx="250" cy="408" r="24" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="250" y="414" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#1e293b">25</text>

  <!-- annotation for root -->
  <rect x="120" y="150" width="220" height="34" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="230" y="172" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">chap: 20,25,30,40 &lt; 50</text>

  <rect x="540" y="150" width="200" height="34" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="640" y="172" text-anchor="middle" font-family="monospace" font-size="13" fill="#dc2626">o'ng: 70,80 &gt; 50</text>

  <!-- bottom note -->
  <rect x="120" y="455" width="620" height="44" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="430" y="473" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Bu shart REKURSIV: har bir tugunda (nafaqat ildizda) bir vaqtning o'zida bajariladi.</text>
  <text x="430" y="491" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">In-order traversal: 10, 20, 25, 30, 40, 50, 70, 80 — to'liq saralangan!</text>
</svg>
