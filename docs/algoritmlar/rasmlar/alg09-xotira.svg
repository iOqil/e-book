<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540">
  <title>Xotira murakkabligi: in-place O(1) qo'shimcha xotira, O(n) qo'shimcha massiv va rekursiya stek chuqurligi</title>
  <rect x="0" y="0" width="820" height="540" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Xotira (space) murakkabligi</text>
  <text x="410" y="63" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Qo'shimcha (auxiliary) xotira: kirishdan tashqari nima eslab qolinadi</text>

  <!-- Left: O(1) in-place -->
  <rect x="30" y="92" width="240" height="240" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="150" y="120" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">O(1) — in-place</text>
  <text x="150" y="142" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Massivni o'z joyida o'zgartirish</text>
  <!-- input array -->
  <g font-family="monospace" font-size="14">
    <rect x="50" y="158" width="36" height="36" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="68" y="182" text-anchor="middle" fill="#166534">5</text>
    <rect x="86" y="158" width="36" height="36" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="104" y="182" text-anchor="middle" fill="#166534">2</text>
    <rect x="122" y="158" width="36" height="36" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="140" y="182" text-anchor="middle" fill="#166534">8</text>
    <rect x="158" y="158" width="36" height="36" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="176" y="182" text-anchor="middle" fill="#166534">1</text>
    <rect x="194" y="158" width="36" height="36" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="212" y="182" text-anchor="middle" fill="#166534">9</text>
  </g>
  <text x="150" y="222" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Qo'shimcha: faqat bir nechta</text>
  <text x="150" y="240" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">o'zgaruvchi (i, j, temp)</text>
  <rect x="70" y="254" width="44" height="34" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="92" y="276" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">i</text>
  <rect x="118" y="254" width="44" height="34" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="140" y="276" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">j</text>
  <rect x="166" y="254" width="64" height="34" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="198" y="276" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">temp</text>
  <text x="150" y="316" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a" font-weight="bold">o'lcham n ga bog'liq emas</text>

  <!-- Middle: O(n) extra array -->
  <rect x="290" y="92" width="240" height="240" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="120" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">O(n) — qo'shimcha massiv</text>
  <text x="410" y="142" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Natija uchun yangi massiv ochish</text>
  <g font-family="monospace" font-size="14">
    <rect x="310" y="158" width="36" height="36" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="328" y="182" text-anchor="middle" fill="#1e40af">5</text>
    <rect x="346" y="158" width="36" height="36" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="364" y="182" text-anchor="middle" fill="#1e40af">2</text>
    <rect x="382" y="158" width="36" height="36" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="400" y="182" text-anchor="middle" fill="#1e40af">8</text>
    <rect x="418" y="158" width="36" height="36" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="436" y="182" text-anchor="middle" fill="#1e40af">1</text>
    <rect x="454" y="158" width="36" height="36" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="472" y="182" text-anchor="middle" fill="#1e40af">9</text>
  </g>
  <text x="410" y="208" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">nusxa / yangi massiv</text>
  <g font-family="monospace" font-size="14">
    <rect x="310" y="218" width="36" height="36" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="346" y="218" width="36" height="36" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="382" y="218" width="36" height="36" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="418" y="218" width="36" height="36" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="454" y="218" width="36" height="36" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  </g>
  <text x="410" y="290" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">n ta element -> n ta yangi katak</text>
  <text x="410" y="316" text-anchor="middle" font-family="monospace" font-size="14" fill="#2563eb" font-weight="bold">xotira n bilan o'sadi</text>

  <!-- Right: O(log n) / recursion stack -->
  <rect x="550" y="92" width="240" height="240" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="670" y="120" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#7c3aed">Rekursiya steki</text>
  <text x="670" y="142" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Xotira = chaqiruv chuqurligi</text>
  <!-- stack frames -->
  <rect x="600" y="156" width="140" height="28" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="670" y="175" text-anchor="middle" font-family="monospace" font-size="13" fill="#5b21b6">f(n)</text>
  <rect x="600" y="186" width="140" height="28" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="670" y="205" text-anchor="middle" font-family="monospace" font-size="13" fill="#5b21b6">f(n-1)</text>
  <rect x="600" y="216" width="140" height="28" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="670" y="235" text-anchor="middle" font-family="monospace" font-size="13" fill="#5b21b6">f(n-2)</text>
  <rect x="600" y="246" width="140" height="28" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="670" y="265" text-anchor="middle" font-family="monospace" font-size="13" fill="#5b21b6">...</text>
  <rect x="600" y="276" width="140" height="28" rx="4" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="670" y="295" text-anchor="middle" font-family="monospace" font-size="13" fill="#5b21b6" font-weight="bold">f(0) baza</text>
  <text x="670" y="322" text-anchor="middle" font-family="monospace" font-size="13" fill="#7c3aed">chuqurlik d -> O(d) xotira</text>

  <!-- Bottom summary -->
  <rect x="30" y="352" width="760" height="160" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="50" y="382" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">Xulosa</text>
  <text x="50" y="412" font-family="monospace" font-size="14" fill="#16a34a">O(1) xotira:   chiziqli o'tish, joyida almashtirish (in-place), o'zgaruvchi sanagichlar</text>
  <text x="50" y="440" font-family="monospace" font-size="14" fill="#2563eb">O(n) xotira:   kirish nusxasi, natija massivi, hash to'plam, BFS navbati</text>
  <text x="50" y="468" font-family="monospace" font-size="14" fill="#7c3aed">O(log n) xotira: balanslangan rekursiya steki (masalan binar qidiruv chuqurligi)</text>
  <text x="50" y="496" font-family="Segoe UI" font-size="14" fill="#dc2626">Diqqat: rekursiv funksiya hech narsa qaytarmasa ham stek joy egallaydi.</text>
</svg>
