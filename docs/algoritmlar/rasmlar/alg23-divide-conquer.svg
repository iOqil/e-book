<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470">
  <title>Divide and conquer paradigmasining uch qadami: muammoni kichik qism-muammolarga BO'L, har birini rekursiv HAL QIL, so'ng yechimlarni BIRLASHTIR</title>
  <rect x="0" y="0" width="860" height="470" fill="#f8fafc"/>
  <text x="430" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Divide and Conquer: uch qadam</text>
  <text x="430" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">BO'L (divide) → HAL QIL (conquer, rekursiv) → BIRLASHTIR (combine)</text>

  <!-- top: original problem -->
  <rect x="350" y="90" width="160" height="46" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="430" y="119" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">Muammo (hajm n)</text>

  <!-- step 1 label: DIVIDE -->
  <text x="120" y="168" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">1) BO'L</text>
  <text x="120" y="188" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">kichik qismlarga</text>

  <!-- divide edges -->
  <line x1="395" y1="136" x2="270" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <line x1="465" y1="136" x2="590" y2="180" stroke="#94a3b8" stroke-width="2"/>

  <!-- two subproblems -->
  <rect x="200" y="180" width="140" height="44" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="270" y="207" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#7c3aed">qism-muammo (n/2)</text>
  <rect x="520" y="180" width="140" height="44" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="590" y="207" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#7c3aed">qism-muammo (n/2)</text>

  <!-- step 2 label: CONQUER -->
  <text x="120" y="258" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#f59e0b">2) HAL QIL</text>
  <text x="120" y="278" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">rekursiv (yoki to'g'ridan)</text>

  <!-- conquer arrows down -->
  <line x1="270" y1="224" x2="270" y2="262" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="590" y1="224" x2="590" y2="262" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- solved subproblems -->
  <rect x="200" y="262" width="140" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="270" y="289" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">yechim A</text>
  <rect x="520" y="262" width="140" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="590" y="289" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">yechim B</text>

  <!-- step 3 label: COMBINE -->
  <text x="120" y="362" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">3) BIRLASHTIR</text>
  <text x="120" y="382" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">qismlarni qo'sh</text>

  <!-- combine edges -->
  <line x1="270" y1="306" x2="395" y2="352" stroke="#94a3b8" stroke-width="2"/>
  <line x1="590" y1="306" x2="465" y2="352" stroke="#94a3b8" stroke-width="2"/>

  <!-- final solution -->
  <rect x="345" y="352" width="170" height="48" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="430" y="382" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">To'liq yechim</text>

  <!-- cost note -->
  <rect x="250" y="424" width="360" height="34" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="430" y="446" text-anchor="middle" font-family="monospace" font-size="14" fill="#2563eb">T(n) = 2·T(n/2) + (birlashtirish narxi)</text>
</svg>
