<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560">
  <title>Push amalida sift-up va pop amalida sift-down qadamlari, oldin va keyin holatlari bilan</title>
  <rect x="0" y="0" width="900" height="560" fill="#f8fafc"/>
  <text x="450" y="36" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">push = sift-up,  pop = sift-down  (min-heap)</text>

  <!-- PUSH / SIFT-UP -->
  <text x="225" y="74" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">push(1): oxiriga qo'sh -> sift-up</text>

  <!-- oldin: root 2, children 3,8, then 5 ; we add 1 at the end under 3 -->
  <text x="225" y="100" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Oldin: oxiriga 1 qo'shildi (xossa buzildi: 1 &lt; 3)</text>
  <line x1="225" y1="125" x2="160" y2="175" stroke="#94a3b8" stroke-width="2"/>
  <line x1="225" y1="125" x2="290" y2="175" stroke="#94a3b8" stroke-width="2"/>
  <line x1="160" y1="200" x2="120" y2="250" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="225" cy="115" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="225" y="121" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">2</text>
  <circle cx="160" cy="190" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="160" y="196" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">3</text>
  <circle cx="290" cy="190" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="290" y="196" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">8</text>
  <circle cx="120" cy="265" r="20" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="120" y="271" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">1</text>

  <text x="225" y="300" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#dc2626">1 otasi (3) bilan almashadi, keyin (2) bilan</text>
  <text x="225" y="320" text-anchor="middle" font-family="Segoe UI" font-size="22" fill="#16a34a">&#8595;</text>

  <!-- keyin: 1 root, children 2,8, child 3 -->
  <text x="225" y="346" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Keyin: 1 ildizga ko'tarildi, xossa tiklandi</text>
  <line x1="225" y1="371" x2="160" y2="421" stroke="#94a3b8" stroke-width="2"/>
  <line x1="225" y1="371" x2="290" y2="421" stroke="#94a3b8" stroke-width="2"/>
  <line x1="160" y1="446" x2="120" y2="496" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="225" cy="361" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="225" y="367" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">1</text>
  <circle cx="160" cy="436" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="160" y="442" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">2</text>
  <circle cx="290" cy="436" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="290" y="442" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">8</text>
  <circle cx="120" cy="511" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="120" y="517" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">3</text>

  <!-- divider -->
  <line x1="450" y1="80" x2="450" y2="525" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- POP / SIFT-DOWN -->
  <text x="675" y="74" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">pop(): ildizni ol, oxirgini tepaga -> sift-down</text>

  <!-- oldin: root was 1 removed, last (8) put on top; children 2,4 -->
  <text x="675" y="100" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Oldin: ildiz (1) olindi, oxirgi (8) tepaga (8 &gt; 2)</text>
  <line x1="675" y1="125" x2="610" y2="175" stroke="#94a3b8" stroke-width="2"/>
  <line x1="675" y1="125" x2="740" y2="175" stroke="#94a3b8" stroke-width="2"/>
  <line x1="610" y1="200" x2="570" y2="250" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="675" cy="115" r="20" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="675" y="121" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">8</text>
  <circle cx="610" cy="190" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="610" y="196" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">2</text>
  <circle cx="740" cy="190" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="740" y="196" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">4</text>
  <circle cx="570" cy="265" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="570" y="271" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">3</text>

  <text x="675" y="300" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#dc2626">8 kichik bola (2) bilan, keyin (3) bilan almashadi</text>
  <text x="675" y="320" text-anchor="middle" font-family="Segoe UI" font-size="22" fill="#16a34a">&#8595;</text>

  <!-- keyin: root 2, children 3,4, child 8 -->
  <text x="675" y="346" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Keyin: 2 yangi ildiz, 8 pastga tushdi</text>
  <line x1="675" y1="371" x2="610" y2="421" stroke="#94a3b8" stroke-width="2"/>
  <line x1="675" y1="371" x2="740" y2="421" stroke="#94a3b8" stroke-width="2"/>
  <line x1="610" y1="446" x2="570" y2="496" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="675" cy="361" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="675" y="367" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">2</text>
  <circle cx="610" cy="436" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="610" y="442" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">3</text>
  <circle cx="740" cy="436" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="740" y="442" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">4</text>
  <circle cx="570" cy="511" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="570" y="517" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">8</text>

  <text x="450" y="548" text-anchor="middle" font-family="monospace" font-size="14" fill="#64748b">Ikkala amal ham balandlik bo'ylab: O(log n)</text>
</svg>
