<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <title>Memoizatsiya (yuqoridan-pastga) va tabulatsiya (pastdan-yuqoriga) — ikki DP yondashuvi</title>
  <rect x="0" y="0" width="900" height="520" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">DP ning ikki yondashuvi</text>
  <text x="450" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Ikkalasi ham har qism-masalani bir marta hisoblaydi — faqat tartibi farq qiladi</text>

  <!-- LEFT: memoization -->
  <rect x="30" y="80" width="400" height="410" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="230" y="110" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">Memoizatsiya (top-down)</text>
  <text x="230" y="132" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Rekursiya + kesh. Katta masaladan boshla.</text>

  <!-- top-down arrow + nodes -->
  <circle cx="230" cy="172" r="24" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="230" y="177" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e293b">f(5)</text>
  <line x1="200" y1="190" x2="150" y2="226" stroke="#94a3b8" stroke-width="2"/>
  <line x1="260" y1="190" x2="310" y2="226" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="140" cy="244" r="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="249" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e293b">f(4)</text>
  <circle cx="320" cy="244" r="22" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="320" y="249" text-anchor="middle" font-family="monospace" font-size="14" fill="#92400e">f(3)</text>
  <line x1="118" y1="262" x2="90" y2="298" stroke="#94a3b8" stroke-width="2"/>
  <line x1="162" y1="262" x2="200" y2="298" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="80" cy="316" r="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="80" y="321" text-anchor="middle" font-family="monospace" font-size="13" fill="#92400e">f(3)</text>
  <circle cx="210" cy="316" r="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="210" y="321" text-anchor="middle" font-family="monospace" font-size="13" fill="#5b21b6">f(2)</text>

  <!-- cache hit note -->
  <rect x="60" y="356" width="340" height="44" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="230" y="383" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#92400e">f(3) keshda bor — qayta hisoblamay, keshdan oladi</text>

  <text x="230" y="428" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">+ Tabiiy: faqat KERAKLI qism-masalalar</text>
  <text x="230" y="450" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">- Rekursiya cheksiz chuqurlik xavfi (stek)</text>
  <text x="230" y="472" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Vaqt O(n), xotira O(n) (kesh + stek)</text>

  <!-- RIGHT: tabulation -->
  <rect x="470" y="80" width="400" height="410" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="670" y="110" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">Tabulatsiya (bottom-up)</text>
  <text x="670" y="132" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Iterativ jadval. Eng kichikdan boshla.</text>

  <!-- table cells filled left to right -->
  <g font-family="monospace" font-size="14">
    <rect x="510" y="170" width="44" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="532" y="198" text-anchor="middle" fill="#166534">0</text>
    <rect x="558" y="170" width="44" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="580" y="198" text-anchor="middle" fill="#166534">1</text>
    <rect x="606" y="170" width="44" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="628" y="198" text-anchor="middle" fill="#166534">1</text>
    <rect x="654" y="170" width="44" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="676" y="198" text-anchor="middle" fill="#166534">2</text>
    <rect x="702" y="170" width="44" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="724" y="198" text-anchor="middle" fill="#166534">3</text>
    <rect x="750" y="170" width="44" height="44" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="2.5"/>
    <text x="772" y="198" text-anchor="middle" fill="#166534">5</text>
  </g>
  <g font-family="monospace" font-size="13" fill="#64748b" text-anchor="middle">
    <text x="532" y="232">dp0</text>
    <text x="580" y="232">dp1</text>
    <text x="628" y="232">dp2</text>
    <text x="676" y="232">dp3</text>
    <text x="724" y="232">dp4</text>
    <text x="772" y="232">dp5</text>
  </g>

  <!-- arrow indicating fill direction -->
  <line x1="510" y1="262" x2="780" y2="262" stroke="#16a34a" stroke-width="2.5"/>
  <path d="M 780 262 l -12 -6 l 0 12 z" fill="#16a34a"/>
  <text x="645" y="282" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">to'ldirish yo'nalishi: kichikdan kattaga</text>

  <rect x="500" y="304" width="340" height="48" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="670" y="325" text-anchor="middle" font-family="monospace" font-size="13" fill="#166534">dp[i] = dp[i-1] + dp[i-2]</text>
  <text x="670" y="344" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">har katak avval to'lgan kataklardan tuziladi</text>

  <text x="670" y="392" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">+ Rekursiyasiz — stek xavfi yo'q, ko'pincha tezroq</text>
  <text x="670" y="414" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">+ Xotirani O(1) ga siqish oson (rolling)</text>
  <text x="670" y="436" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">- Ba'zan keraksiz kataklarni ham to'ldiradi</text>
  <text x="670" y="458" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Vaqt O(n), xotira O(n) yoki O(1)</text>
</svg>
