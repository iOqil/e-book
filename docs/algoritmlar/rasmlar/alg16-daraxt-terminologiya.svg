<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560">
  <title>Daraxt atamalari: ildiz, ota-bola, barg, balandlik, chuqurlik, daraja va qism-daraxt</title>
  <rect x="0" y="0" width="880" height="560" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Daraxt terminologiyasi</text>
  <text x="440" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Ierarxik struktura: bitta ildiz, undan tarmoqlanib ketadigan tugunlar</text>

  <!-- level guide lines -->
  <line x1="60" y1="110" x2="600" y2="110" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="60" y1="210" x2="600" y2="210" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="60" y1="310" x2="600" y2="310" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="60" y1="410" x2="600" y2="410" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="68" y="105" font-family="Segoe UI" font-size="13" fill="#94a3b8">daraja 0 (chuqurlik 0)</text>
  <text x="68" y="205" font-family="Segoe UI" font-size="13" fill="#94a3b8">daraja 1</text>
  <text x="68" y="305" font-family="Segoe UI" font-size="13" fill="#94a3b8">daraja 2</text>
  <text x="68" y="405" font-family="Segoe UI" font-size="13" fill="#94a3b8">daraja 3</text>

  <!-- edges -->
  <line x1="330" y1="110" x2="200" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <line x1="330" y1="110" x2="470" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <line x1="200" y1="210" x2="130" y2="310" stroke="#94a3b8" stroke-width="2"/>
  <line x1="200" y1="210" x2="280" y2="310" stroke="#94a3b8" stroke-width="2"/>
  <line x1="470" y1="210" x2="540" y2="310" stroke="#94a3b8" stroke-width="2"/>
  <line x1="280" y1="310" x2="280" y2="410" stroke="#94a3b8" stroke-width="2"/>

  <!-- root -->
  <circle cx="330" cy="110" r="26" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="330" y="116" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1e293b">A</text>
  <text x="330" y="80" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb" font-weight="bold">ildiz (root)</text>

  <!-- level 1 -->
  <circle cx="200" cy="210" r="26" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
  <text x="200" y="216" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1e293b">B</text>
  <circle cx="470" cy="210" r="26" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="470" y="216" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1e293b">C</text>

  <!-- level 2 -->
  <circle cx="130" cy="310" r="26" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <text x="130" y="316" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1e293b">D</text>
  <circle cx="280" cy="310" r="26" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="280" y="316" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1e293b">E</text>
  <circle cx="540" cy="310" r="26" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <text x="540" y="316" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1e293b">F</text>

  <!-- level 3 -->
  <circle cx="280" cy="410" r="26" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <text x="280" y="416" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1e293b">G</text>

  <!-- labels -->
  <text x="158" y="200" text-anchor="end" font-family="Segoe UI" font-size="13" fill="#7c3aed" font-weight="bold">B = ota (parent)</text>
  <text x="98" y="350" font-family="Segoe UI" font-size="13" fill="#7c3aed">D, E = B ning bolalari</text>
  <text x="540" y="356" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a" font-weight="bold">barg (leaf)</text>
  <text x="280" y="452" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a" font-weight="bold">barg (leaf)</text>
  <text x="130" y="282" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a" font-weight="bold">barg</text>

  <!-- subtree box -->
  <rect x="92" y="184" width="222" height="256" rx="14" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="203" y="478" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#f59e0b" font-weight="bold">B ildizli qism-daraxt (subtree)</text>

  <!-- height annotation -->
  <line x1="620" y1="110" x2="620" y2="410" stroke="#dc2626" stroke-width="2"/>
  <line x1="614" y1="110" x2="626" y2="110" stroke="#dc2626" stroke-width="2"/>
  <line x1="614" y1="410" x2="626" y2="410" stroke="#dc2626" stroke-width="2"/>
  <text x="636" y="265" font-family="Segoe UI" font-size="14" fill="#dc2626" font-weight="bold">balandlik = 3</text>
  <text x="636" y="285" font-family="Segoe UI" font-size="13" fill="#dc2626">(ildizdan eng uzoq</text>
  <text x="636" y="303" font-family="Segoe UI" font-size="13" fill="#dc2626">bargacha qirralar soni)</text>

  <!-- legend / facts -->
  <rect x="60" y="500" width="760" height="42" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="527" text-anchor="middle" font-family="monospace" font-size="14" fill="#2563eb">7 tugun  ->  6 qirra   (har doim: n tugun -> n-1 qirra, chunki ildizdan boshqa har tugunga 1 qirra kiradi)</text>
</svg>
