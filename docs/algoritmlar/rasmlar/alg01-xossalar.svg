<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560">
  <title>Algoritmning 5 ta asosiy xossasi</title>
  <rect x="0" y="0" width="820" height="560" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Algoritmning 5 ta xossasi</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Ketma-ketlik algoritm bo'lishi uchun hammasi shart</text>

  <!-- Center -->
  <circle cx="410" cy="300" r="78" fill="#1e293b"/>
  <text x="410" y="294" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#ffffff">Algoritm</text>
  <text x="410" y="318" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#cbd5e1">5 xossa = haqiqiy</text>

  <!-- connector lines -->
  <line x1="410" y1="222" x2="410" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <line x1="345" y1="258" x2="180" y2="190" stroke="#94a3b8" stroke-width="2"/>
  <line x1="345" y1="342" x2="180" y2="420" stroke="#94a3b8" stroke-width="2"/>
  <line x1="475" y1="258" x2="640" y2="190" stroke="#94a3b8" stroke-width="2"/>
  <line x1="475" y1="342" x2="640" y2="420" stroke="#94a3b8" stroke-width="2"/>

  <!-- Card 1: Aniqlik (top) -->
  <rect x="290" y="96" width="240" height="58" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="122" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">1. Aniqlik / determinizm</text>
  <text x="410" y="143" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Har qadam bir ma'noli</text>

  <!-- Card 2: Cheklilik (top-left) -->
  <rect x="40" y="140" width="240" height="58" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="160" y="166" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">2. Cheklilik</text>
  <text x="160" y="187" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">To'xtashi shart (finiteness)</text>

  <!-- Card 3: Kirish (bottom-left) -->
  <rect x="40" y="392" width="240" height="58" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="160" y="418" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">3. Kirish (input)</text>
  <text x="160" y="439" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">0 yoki undan ko'p</text>

  <!-- Card 4: Chiqish (top-right) -->
  <rect x="540" y="140" width="240" height="58" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="660" y="166" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#f59e0b">4. Chiqish (output)</text>
  <text x="660" y="187" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Kamida 1 natija</text>

  <!-- Card 5: Samaradorlik (bottom-right) -->
  <rect x="540" y="392" width="240" height="58" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="660" y="418" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">5. Bajariluvchanlik</text>
  <text x="660" y="439" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Har amal real bajariladi</text>

  <!-- bottom note -->
  <rect x="160" y="492" width="500" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="410" y="521" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Bittasi yetishmasa — bu to'liq algoritm emas (masalan, to'xtamasa).</text>
</svg>
