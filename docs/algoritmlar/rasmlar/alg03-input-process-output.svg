<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470">
  <title>Kirish-qayta ishlash-chiqish modeli: uchburchak yuzini hisoblash</title>
  <rect x="0" y="0" width="860" height="470" fill="#f8fafc"/>
  <text x="430" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Kirish &#8594; Qayta ishlash &#8594; Chiqish (IPO)</text>
  <text x="430" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Misol: uchburchak yuzi  yuza = (asos * balandlik) / 2</text>

  <!-- INPUT block -->
  <rect x="40" y="110" width="220" height="250" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="40" y="110" width="220" height="44" rx="14" fill="#2563eb"/>
  <text x="150" y="139" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#ffffff">KIRISH</text>
  <text x="150" y="182" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Boshlang'ich ma'lumot</text>
  <rect x="66" y="204" width="168" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="150" y="233" text-anchor="middle" font-family="monospace" font-size="15" fill="#334155">asos = 6</text>
  <rect x="66" y="262" width="168" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="150" y="291" text-anchor="middle" font-family="monospace" font-size="15" fill="#334155">balandlik = 4</text>
  <text x="150" y="338" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#94a3b8">o'qish / oldindan berilgan</text>

  <!-- arrow 1 -->
  <line x1="262" y1="235" x2="318" y2="235" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="318,235 306,229 306,241" fill="#94a3b8"/>

  <!-- PROCESS block -->
  <rect x="322" y="110" width="220" height="250" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <rect x="322" y="110" width="220" height="44" rx="14" fill="#f59e0b"/>
  <text x="432" y="139" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#ffffff">QAYTA ISHLASH</text>
  <text x="432" y="182" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Ketma-ket formulalar</text>
  <rect x="342" y="204" width="180" height="44" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="432" y="226" text-anchor="middle" font-family="monospace" font-size="14" fill="#334155">kop = asos*balandlik</text>
  <text x="432" y="242" text-anchor="middle" font-family="monospace" font-size="13" fill="#92400e">// kop = 24</text>
  <rect x="342" y="262" width="180" height="44" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="432" y="284" text-anchor="middle" font-family="monospace" font-size="14" fill="#334155">yuza = kop / 2</text>
  <text x="432" y="300" text-anchor="middle" font-family="monospace" font-size="13" fill="#92400e">// yuza = 12</text>
  <text x="432" y="338" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#94a3b8">tartib bo'yicha bajariladi</text>

  <!-- arrow 2 -->
  <line x1="544" y1="235" x2="600" y2="235" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="600,235 588,229 588,241" fill="#94a3b8"/>

  <!-- OUTPUT block -->
  <rect x="604" y="110" width="220" height="250" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="604" y="110" width="220" height="44" rx="14" fill="#16a34a"/>
  <text x="714" y="139" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#ffffff">CHIQISH</text>
  <text x="714" y="182" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Natija</text>
  <rect x="630" y="212" width="168" height="84" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="714" y="248" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#166534">yuza =</text>
  <text x="714" y="280" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#166534">12</text>
  <text x="714" y="338" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#94a3b8">chop etish / qaytarish</text>

  <!-- bottom note -->
  <rect x="40" y="392" width="784" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="432" y="423" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e3a8a">Har bir chiziqli algoritm shu uch bosqichdan iborat: oldin ma'lumot, keyin amallar, oxirida natija.</text>
</svg>
