<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540">
  <title>Merge sort: massivni yarmiga bo'lish daraxti pastga tushadi, bitta elementga yetganda saralangan deb hisoblanadi, so'ng birlashtirib (merge) yuqoriga saralangan massiv qaytadi</title>
  <rect x="0" y="0" width="880" height="540" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Merge sort: bo'l (pastga) va birlashtir (yuqoriga)</text>

  <!-- left arrow: BO'L down -->
  <text x="60" y="120" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626" transform="rotate(-90 60 120)">BO'L ↓</text>
  <!-- right arrow: BIRLASHTIR up -->
  <text x="820" y="120" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a" transform="rotate(-90 820 120)">BIRLASHTIR ↑</text>

  <!-- level 0 -->
  <rect x="320" y="64" width="240" height="36" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="88" text-anchor="middle" font-family="monospace" font-size="15" fill="#2563eb">[5, 2, 9, 1, 7, 3]</text>

  <line x1="380" y1="100" x2="250" y2="134" stroke="#94a3b8" stroke-width="2"/>
  <line x1="500" y1="100" x2="630" y2="134" stroke="#94a3b8" stroke-width="2"/>

  <!-- level 1 -->
  <rect x="170" y="134" width="160" height="34" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="250" y="157" text-anchor="middle" font-family="monospace" font-size="14" fill="#7c3aed">[5, 2, 9]</text>
  <rect x="550" y="134" width="160" height="34" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="630" y="157" text-anchor="middle" font-family="monospace" font-size="14" fill="#7c3aed">[1, 7, 3]</text>

  <line x1="210" y1="168" x2="150" y2="202" stroke="#94a3b8" stroke-width="2"/>
  <line x1="290" y1="168" x2="350" y2="202" stroke="#94a3b8" stroke-width="2"/>
  <line x1="590" y1="168" x2="530" y2="202" stroke="#94a3b8" stroke-width="2"/>
  <line x1="670" y1="168" x2="730" y2="202" stroke="#94a3b8" stroke-width="2"/>

  <!-- level 2 -->
  <rect x="105" y="202" width="90" height="34" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="150" y="225" text-anchor="middle" font-family="monospace" font-size="14" fill="#7c3aed">[5, 2]</text>
  <rect x="320" y="202" width="60" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="350" y="225" text-anchor="middle" font-family="monospace" font-size="14" fill="#d97706">[9]</text>
  <rect x="500" y="202" width="60" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="530" y="225" text-anchor="middle" font-family="monospace" font-size="14" fill="#d97706">[1]</text>
  <rect x="685" y="202" width="90" height="34" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="730" y="225" text-anchor="middle" font-family="monospace" font-size="14" fill="#7c3aed">[7, 3]</text>

  <line x1="130" y1="236" x2="110" y2="266" stroke="#94a3b8" stroke-width="2"/>
  <line x1="170" y1="236" x2="190" y2="266" stroke="#94a3b8" stroke-width="2"/>
  <line x1="710" y1="236" x2="690" y2="266" stroke="#94a3b8" stroke-width="2"/>
  <line x1="750" y1="236" x2="770" y2="266" stroke="#94a3b8" stroke-width="2"/>

  <!-- level 3 leaves (single elements) -->
  <rect x="85" y="266" width="50" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="110" y="288" text-anchor="middle" font-family="monospace" font-size="14" fill="#d97706">[5]</text>
  <rect x="165" y="266" width="50" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="190" y="288" text-anchor="middle" font-family="monospace" font-size="14" fill="#d97706">[2]</text>
  <rect x="665" y="266" width="50" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="690" y="288" text-anchor="middle" font-family="monospace" font-size="14" fill="#d97706">[7]</text>
  <rect x="745" y="266" width="50" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="770" y="288" text-anchor="middle" font-family="monospace" font-size="14" fill="#d97706">[3]</text>

  <text x="440" y="288" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#94a3b8">bitta element = saralangan (bazaviy holat)</text>

  <!-- merge (combine) phase going up -->
  <text x="440" y="334" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">⬇ endi merge (birlashtirish) yuqoriga ⬇</text>

  <!-- merged level 2 -->
  <rect x="105" y="352" width="90" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="150" y="375" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">[2, 5]</text>
  <rect x="685" y="352" width="90" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="730" y="375" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">[3, 7]</text>

  <!-- merged level 1 -->
  <rect x="170" y="408" width="160" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="250" y="431" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">[2, 5, 9]</text>
  <rect x="550" y="408" width="160" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="630" y="431" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">[1, 3, 7]</text>

  <line x1="190" y1="386" x2="220" y2="408" stroke="#16a34a" stroke-width="2"/>
  <line x1="690" y1="386" x2="660" y2="408" stroke="#16a34a" stroke-width="2"/>
  <line x1="250" y1="442" x2="380" y2="468" stroke="#16a34a" stroke-width="2"/>
  <line x1="630" y1="442" x2="500" y2="468" stroke="#16a34a" stroke-width="2"/>

  <!-- final merged -->
  <rect x="320" y="468" width="240" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="440" y="494" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#16a34a">[1, 2, 3, 5, 7, 9]</text>

  <text x="440" y="528" text-anchor="middle" font-family="monospace" font-size="14" fill="#64748b">T(n) = 2·T(n/2) + O(n) = O(n log n)</text>
</svg>
