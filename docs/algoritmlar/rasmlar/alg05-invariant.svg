<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540">
  <title>Sikl invarianti: 1..n yig'indini hisoblashda har iteratsiyadan keyin yigindi 1..i sonlar yig'indisiga teng bo'lib qolishini ko'rsatuvchi qadamlar</title>
  <rect x="0" y="0" width="880" height="540" fill="#f8fafc"/>
  <text x="440" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Sikl invarianti — yig'indi misolida</text>
  <text x="440" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Invariant: har takrordan keyin  yigindi = 1 + 2 + ... + i</text>

  <!-- Invariant banner -->
  <rect x="220" y="84" width="440" height="46" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="440" y="113" text-anchor="middle" font-family="monospace" font-size="16" fill="#5b21b6">INV:  yigindi == (1 + 2 + ... + i)</text>

  <!-- Column headers -->
  <text x="120" y="172" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">qadam</text>
  <text x="300" y="172" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">i</text>
  <text x="470" y="172" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">yigindi</text>
  <text x="690" y="172" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">invariant rostmi?</text>
  <line x1="40" y1="184" x2="840" y2="184" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Row: init -->
  <text x="120" y="216" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">boshlanish</text>
  <rect x="270" y="198" width="60" height="32" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="220" text-anchor="middle" font-family="monospace" font-size="15" fill="#1e293b">0</text>
  <rect x="430" y="198" width="80" height="32" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="470" y="220" text-anchor="middle" font-family="monospace" font-size="15" fill="#1e293b">0</text>
  <text x="690" y="220" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">bo'sh yig'indi = 0  ✓</text>

  <!-- Row 1 -->
  <text x="120" y="262" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">1-takror</text>
  <rect x="270" y="244" width="60" height="32" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="266" text-anchor="middle" font-family="monospace" font-size="15" fill="#1e293b">1</text>
  <rect x="430" y="244" width="80" height="32" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="470" y="266" text-anchor="middle" font-family="monospace" font-size="15" fill="#1e293b">1</text>
  <text x="690" y="266" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">1 = 1  ✓</text>

  <!-- Row 2 -->
  <text x="120" y="308" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">2-takror</text>
  <rect x="270" y="290" width="60" height="32" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="312" text-anchor="middle" font-family="monospace" font-size="15" fill="#1e293b">2</text>
  <rect x="430" y="290" width="80" height="32" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="470" y="312" text-anchor="middle" font-family="monospace" font-size="15" fill="#1e293b">3</text>
  <text x="690" y="312" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">1+2 = 3  ✓</text>

  <!-- Row 3 -->
  <text x="120" y="354" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">3-takror</text>
  <rect x="270" y="336" width="60" height="32" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="358" text-anchor="middle" font-family="monospace" font-size="15" fill="#1e293b">3</text>
  <rect x="430" y="336" width="80" height="32" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="470" y="358" text-anchor="middle" font-family="monospace" font-size="15" fill="#1e293b">6</text>
  <text x="690" y="358" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">1+2+3 = 6  ✓</text>

  <!-- Row 4 -->
  <text x="120" y="400" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">4-takror</text>
  <rect x="270" y="382" width="60" height="32" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="404" text-anchor="middle" font-family="monospace" font-size="15" fill="#1e293b">4</text>
  <rect x="430" y="382" width="80" height="32" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="470" y="404" text-anchor="middle" font-family="monospace" font-size="15" fill="#1e293b">10</text>
  <text x="690" y="404" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">1+2+3+4 = 10  ✓</text>

  <line x1="40" y1="424" x2="840" y2="424" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Termination box -->
  <rect x="40" y="442" width="800" height="78" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="60" y="470" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#d97706">Tugash (n = 4 da):</text>
  <text x="60" y="496" font-family="Segoe UI" font-size="14" fill="#334155">sikl  i &gt; n  bo'lganda to'xtaydi  ->  i = 4 da oxirgi takror, invariant: yigindi = 1+2+3+4.</text>
  <text x="60" y="516" font-family="Segoe UI" font-size="14" fill="#334155">Invariant + tugash sharti birga to'g'ri natijani beradi:  yigindi = 1..n yig'indisi.</text>
</svg>
