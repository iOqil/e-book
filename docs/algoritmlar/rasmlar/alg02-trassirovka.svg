<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470">
  <title>Trassirovka jadvali: 1 dan 5 gacha yig'indi qadamba-qadam</title>
  <rect x="0" y="0" width="800" height="470" fill="#f8fafc"/>
  <text x="400" y="34" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b" text-anchor="middle">Trassirovka: 1+2+3+4+5 yig'indisi</text>
  <text x="400" y="58" font-family="Segoe UI" font-size="14" fill="#64748b" text-anchor="middle">Har qatorda sikl bir marta aylanadi; ustunlar o'zgaruvchi qiymatlarini saqlaydi</text>

  <!-- Jadval ramkasi -->
  <!-- Sarlavha qatori -->
  <rect x="80" y="90" width="160" height="44" fill="#e0e7ff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="240" y="90" width="160" height="44" fill="#e0e7ff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="400" y="90" width="160" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="560" y="90" width="160" height="44" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="160" y="118" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">qadam</text>
  <text x="320" y="118" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">i</text>
  <text x="480" y="118" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">yigindi (oldin)</text>
  <text x="640" y="118" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">yigindi (keyin)</text>

  <!-- Qatorlar -->
  <!-- 1 -->
  <rect x="80" y="134" width="160" height="38" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="240" y="134" width="160" height="38" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="400" y="134" width="160" height="38" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="560" y="134" width="160" height="38" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="160" y="159" font-family="monospace" font-size="15" fill="#334155" text-anchor="middle">1</text>
  <text x="320" y="159" font-family="monospace" font-size="15" fill="#334155" text-anchor="middle">1</text>
  <text x="480" y="159" font-family="monospace" font-size="15" fill="#64748b" text-anchor="middle">0</text>
  <text x="640" y="159" font-family="monospace" font-size="15" fill="#16a34a" text-anchor="middle">0 + 1 = 1</text>

  <!-- 2 -->
  <rect x="80" y="172" width="160" height="38" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="240" y="172" width="160" height="38" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="400" y="172" width="160" height="38" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="560" y="172" width="160" height="38" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="160" y="197" font-family="monospace" font-size="15" fill="#334155" text-anchor="middle">2</text>
  <text x="320" y="197" font-family="monospace" font-size="15" fill="#334155" text-anchor="middle">2</text>
  <text x="480" y="197" font-family="monospace" font-size="15" fill="#64748b" text-anchor="middle">1</text>
  <text x="640" y="197" font-family="monospace" font-size="15" fill="#16a34a" text-anchor="middle">1 + 2 = 3</text>

  <!-- 3 -->
  <rect x="80" y="210" width="160" height="38" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="240" y="210" width="160" height="38" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="400" y="210" width="160" height="38" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="560" y="210" width="160" height="38" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="160" y="235" font-family="monospace" font-size="15" fill="#334155" text-anchor="middle">3</text>
  <text x="320" y="235" font-family="monospace" font-size="15" fill="#334155" text-anchor="middle">3</text>
  <text x="480" y="235" font-family="monospace" font-size="15" fill="#64748b" text-anchor="middle">3</text>
  <text x="640" y="235" font-family="monospace" font-size="15" fill="#16a34a" text-anchor="middle">3 + 3 = 6</text>

  <!-- 4 -->
  <rect x="80" y="248" width="160" height="38" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="240" y="248" width="160" height="38" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="400" y="248" width="160" height="38" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="560" y="248" width="160" height="38" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="160" y="273" font-family="monospace" font-size="15" fill="#334155" text-anchor="middle">4</text>
  <text x="320" y="273" font-family="monospace" font-size="15" fill="#334155" text-anchor="middle">4</text>
  <text x="480" y="273" font-family="monospace" font-size="15" fill="#64748b" text-anchor="middle">6</text>
  <text x="640" y="273" font-family="monospace" font-size="15" fill="#16a34a" text-anchor="middle">6 + 4 = 10</text>

  <!-- 5 -->
  <rect x="80" y="286" width="160" height="38" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="240" y="286" width="160" height="38" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="400" y="286" width="160" height="38" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="560" y="286" width="160" height="38" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="160" y="311" font-family="monospace" font-size="15" fill="#334155" text-anchor="middle">5</text>
  <text x="320" y="311" font-family="monospace" font-size="15" fill="#334155" text-anchor="middle">5</text>
  <text x="480" y="311" font-family="monospace" font-size="15" fill="#64748b" text-anchor="middle">10</text>
  <text x="640" y="311" font-family="monospace" font-size="15" fill="#16a34a" text-anchor="middle">10 + 5 = 15</text>

  <!-- Natija -->
  <rect x="240" y="350" width="320" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="381" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a" text-anchor="middle">Natija: yigindi = 15</text>

  <text x="400" y="436" font-family="Segoe UI" font-size="14" fill="#64748b" text-anchor="middle">Trassirovka — kodni ishga tushirmasdan, qog'ozda qiymatlarni kuzatish.</text>
</svg>
