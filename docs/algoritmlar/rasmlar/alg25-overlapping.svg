<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540">
  <title>fib(5) daraxtida takrorlanuvchi qism-masalalar — DP ularni bir marta hisoblaydi</title>
  <rect x="0" y="0" width="900" height="540" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Takrorlanuvchi qism-masalalar: fib(5)</text>
  <text x="450" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Bir xil qism-masala (rangli) qayta-qayta hisoblanadi — bu DP qo'llanishi uchun shart</text>

  <!-- edges -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M 450 108 L 250 172"/>
    <path d="M 450 108 L 650 172"/>
    <path d="M 250 196 L 140 262"/>
    <path d="M 250 196 L 360 262"/>
    <path d="M 650 196 L 560 262"/>
    <path d="M 650 196 L 750 262"/>
    <path d="M 140 286 L 70 352"/>
    <path d="M 140 286 L 210 352"/>
    <path d="M 360 286 L 320 352"/>
    <path d="M 360 286 L 410 352"/>
    <path d="M 560 286 L 520 352"/>
    <path d="M 560 286 L 610 352"/>
    <path d="M 70 376 L 30 440"/>
    <path d="M 70 376 L 110 440"/>
  </g>

  <!-- root fib5 -->
  <circle cx="450" cy="92" r="26" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="450" y="97" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e293b">fib5</text>

  <!-- level 1: fib4 (blue), fib3 (amber=takror) -->
  <circle cx="250" cy="184" r="24" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="250" y="189" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e293b">fib4</text>
  <circle cx="650" cy="184" r="24" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="650" y="189" text-anchor="middle" font-family="monospace" font-size="14" fill="#92400e">fib3</text>

  <!-- level 2 -->
  <circle cx="140" cy="274" r="22" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="140" y="279" text-anchor="middle" font-family="monospace" font-size="13" fill="#92400e">fib3</text>
  <circle cx="360" cy="274" r="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="360" y="279" text-anchor="middle" font-family="monospace" font-size="13" fill="#5b21b6">fib2</text>
  <circle cx="560" cy="274" r="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="560" y="279" text-anchor="middle" font-family="monospace" font-size="13" fill="#5b21b6">fib2</text>
  <circle cx="750" cy="274" r="22" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="750" y="279" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">fib1</text>

  <!-- level 3 -->
  <circle cx="70" cy="364" r="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="70" y="369" text-anchor="middle" font-family="monospace" font-size="13" fill="#5b21b6">fib2</text>
  <circle cx="210" cy="364" r="20" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="210" y="369" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">fib1</text>
  <circle cx="320" cy="364" r="20" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="320" y="369" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">fib1</text>
  <circle cx="410" cy="364" r="20" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="410" y="369" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">fib0</text>
  <circle cx="520" cy="364" r="20" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="520" y="369" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">fib1</text>
  <circle cx="610" cy="364" r="20" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="610" y="369" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">fib0</text>

  <!-- level 4 -->
  <circle cx="30" cy="452" r="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="30" y="457" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">fib1</text>
  <circle cx="110" cy="452" r="18" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="110" y="457" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">fib0</text>

  <!-- legend -->
  <rect x="300" y="430" width="580" height="96" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="324" cy="458" r="11" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="344" y="463" font-family="Segoe UI" font-size="14" fill="#334155">fib3 — 2 marta hisoblanadi</text>
  <circle cx="600" cy="458" r="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="620" y="463" font-family="Segoe UI" font-size="14" fill="#334155">fib2 — 3 marta hisoblanadi</text>
  <text x="324" y="492" font-family="Segoe UI" font-size="14" fill="#dc2626">Naive: O(2^n) chaqiruv (isrof).</text>
  <text x="600" y="492" font-family="Segoe UI" font-size="14" fill="#16a34a">DP: har biri 1 marta — O(n).</text>
  <text x="324" y="515" font-family="Segoe UI" font-size="13" fill="#64748b">G'oya: javobni saqlab qol va qayta ishlat — "bir xil ishni qayta qilma".</text>
</svg>
