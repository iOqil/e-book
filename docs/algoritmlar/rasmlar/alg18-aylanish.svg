<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560">
  <title>Aylanish (rotation): chapga va ongga aylanish, BST xossasi va in-order saqlanadi</title>
  <rect x="0" y="0" width="900" height="560" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Aylanish (rotation) — balanslashning asosiy vositasi</text>
  <text x="450" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Strukturani o'zgartiradi, lekin in-order tartibni (BST xossasini) buzmaydi</text>

  <!-- LEFT tree (before) -->
  <text x="200" y="96" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">Oldin: x ildiz (o'ngga egilgan)</text>

  <line x1="160" y1="135" x2="100" y2="205" stroke="#94a3b8" stroke-width="2"/>
  <line x1="160" y1="135" x2="260" y2="205" stroke="#94a3b8" stroke-width="2"/>
  <line x1="260" y1="205" x2="210" y2="275" stroke="#94a3b8" stroke-width="2"/>
  <line x1="260" y1="205" x2="320" y2="275" stroke="#94a3b8" stroke-width="2"/>

  <circle cx="160" cy="135" r="22" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="160" y="141" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1e293b">x</text>
  <circle cx="260" cy="205" r="22" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
  <text x="260" y="211" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1e293b">y</text>
  <rect x="78" y="185" width="44" height="40" rx="8" fill="#fef9c3" stroke="#f59e0b" stroke-width="2"/>
  <text x="100" y="210" text-anchor="middle" font-family="monospace" font-size="15" fill="#92400e">A</text>
  <rect x="188" y="255" width="44" height="40" rx="8" fill="#fef9c3" stroke="#f59e0b" stroke-width="2"/>
  <text x="210" y="280" text-anchor="middle" font-family="monospace" font-size="15" fill="#92400e">B</text>
  <rect x="298" y="255" width="44" height="40" rx="8" fill="#fef9c3" stroke="#f59e0b" stroke-width="2"/>
  <text x="320" y="280" text-anchor="middle" font-family="monospace" font-size="15" fill="#92400e">C</text>

  <!-- arrows between -->
  <line x1="372" y1="200" x2="528" y2="200" stroke="#16a34a" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="528" y1="235" x2="372" y2="235" stroke="#dc2626" stroke-width="3" marker-end="url(#ar2)"/>
  <text x="450" y="190" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">x atrofida CHAPGA aylanish</text>
  <text x="450" y="255" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">y atrofida O'NGGA aylanish</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="ar2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- RIGHT tree (after) -->
  <text x="700" y="96" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">Keyin: y ildiz (balandlik kamaydi)</text>

  <line x1="700" y1="135" x2="630" y2="205" stroke="#94a3b8" stroke-width="2"/>
  <line x1="700" y1="135" x2="800" y2="205" stroke="#94a3b8" stroke-width="2"/>
  <line x1="630" y1="205" x2="580" y2="275" stroke="#94a3b8" stroke-width="2"/>
  <line x1="630" y1="205" x2="685" y2="275" stroke="#94a3b8" stroke-width="2"/>

  <circle cx="700" cy="135" r="22" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
  <text x="700" y="141" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1e293b">y</text>
  <circle cx="630" cy="205" r="22" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="630" y="211" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1e293b">x</text>
  <rect x="558" y="255" width="44" height="40" rx="8" fill="#fef9c3" stroke="#f59e0b" stroke-width="2"/>
  <text x="580" y="280" text-anchor="middle" font-family="monospace" font-size="15" fill="#92400e">A</text>
  <rect x="663" y="255" width="44" height="40" rx="8" fill="#fef9c3" stroke="#f59e0b" stroke-width="2"/>
  <text x="685" y="280" text-anchor="middle" font-family="monospace" font-size="15" fill="#92400e">B</text>
  <rect x="778" y="185" width="44" height="40" rx="8" fill="#fef9c3" stroke="#f59e0b" stroke-width="2"/>
  <text x="800" y="210" text-anchor="middle" font-family="monospace" font-size="15" fill="#92400e">C</text>

  <!-- invariant box -->
  <rect x="60" y="340" width="780" height="84" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="366" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">BST tartib o'zgarmaydi (invariant):</text>
  <text x="450" y="392" text-anchor="middle" font-family="monospace" font-size="15" fill="#2563eb">A &lt; x &lt; B &lt; y &lt; C</text>
  <text x="450" y="414" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">In-order ikkala daraxtda ham bir xil: A, x, B, y, C — faqat shakl o'zgardi</text>

  <!-- mechanics box -->
  <rect x="60" y="438" width="780" height="100" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="80" y="464" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">Chapga aylanish (x atrofida) — uch ko'rsatkichni qayta ulash:</text>
  <text x="92" y="488" font-family="monospace" font-size="14" fill="#334155">y = x.right;   x.right = y.left;   y.left = x;   // yangi ildiz = y</text>
  <text x="80" y="514" font-family="Segoe UI" font-size="13" fill="#64748b">Faqat 3 ta ko'rsatkich o'zgaradi -> O(1). O'ngga aylanish — aynan oynadagi aksi.</text>
  <text x="80" y="532" font-family="Segoe UI" font-size="13" fill="#64748b">B (y.left) x ning o'ng farzandiga ko'chadi: A &lt; x &lt; B shartini saqlaydi.</text>
</svg>
