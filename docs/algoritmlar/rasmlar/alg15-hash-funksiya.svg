<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470">
  <title>Hash funksiya kalitni massiv indeksiga aylantiradi: kalit -> h(kalit) -> indeks -> bucket massivi</title>
  <rect x="0" y="0" width="880" height="470" fill="#f8fafc"/>
  <text x="440" y="36" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Hash funksiya: kalitdan to'g'ridan-to'g'ri indeksga</text>
  <text x="440" y="62" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">h(kalit) bir butun son qaytaradi; uni m ga bo'lib qoldiq olinadi -> [0, m) oraliq indeks</text>

  <!-- kalit -->
  <rect x="40" y="180" width="120" height="56" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="100" y="205" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">kalit</text>
  <text x="100" y="226" text-anchor="middle" font-family="monospace" font-size="15" fill="#1e293b">"olma"</text>

  <!-- arrow 1 -->
  <line x1="160" y1="208" x2="232" y2="208" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="232,208 222,203 222,213" fill="#94a3b8"/>

  <!-- hash funksiya -->
  <rect x="234" y="168" width="170" height="80" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="319" y="196" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">hash funksiya</text>
  <text x="319" y="218" text-anchor="middle" font-family="monospace" font-size="14" fill="#334155">h("olma")=65</text>
  <text x="319" y="238" text-anchor="middle" font-family="monospace" font-size="14" fill="#334155">65 % 8 = 1</text>

  <!-- arrow 2 -->
  <line x1="404" y1="208" x2="476" y2="208" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="476,208 466,203 466,213" fill="#94a3b8"/>

  <!-- indeks -->
  <rect x="478" y="180" width="110" height="56" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="533" y="205" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">indeks</text>
  <text x="533" y="226" text-anchor="middle" font-family="monospace" font-size="16" fill="#16a34a" font-weight="bold">1</text>

  <!-- arrow 3 -->
  <line x1="588" y1="208" x2="648" y2="208" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="648,208 638,203 638,213" fill="#94a3b8"/>

  <!-- bucket massivi -->
  <text x="765" y="120" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">bucket (savatcha) massivi</text>
  <g font-family="monospace" font-size="14">
    <rect x="690" y="132" width="150" height="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="700" y="152" fill="#64748b">[0]</text>
    <rect x="690" y="162" width="150" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="700" y="182" fill="#64748b">[1]</text>
    <text x="760" y="182" fill="#16a34a" font-weight="bold">("olma",3)</text>
    <rect x="690" y="192" width="150" height="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="700" y="212" fill="#64748b">[2]</text>
    <rect x="690" y="222" width="150" height="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="700" y="242" fill="#64748b">[3]</text>
    <rect x="690" y="252" width="150" height="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="700" y="272" fill="#64748b">...</text>
    <rect x="690" y="282" width="150" height="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="700" y="302" fill="#64748b">[m-1]</text>
  </g>

  <!-- xossalar box -->
  <rect x="40" y="330" width="800" height="110" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="358" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">Yaxshi hash funksiyaning xossalari</text>
  <text x="60" y="384" font-family="Segoe UI" font-size="14" fill="#334155">1. Deterministik — bir kalit har doim bir xil indeks beradi.</text>
  <text x="60" y="406" font-family="Segoe UI" font-size="14" fill="#334155">2. Tez — O(1) yoki kalit uzunligiga chiziqli (satr uchun).</text>
  <text x="460" y="384" font-family="Segoe UI" font-size="14" fill="#334155">3. Bir tekis taqsimot — indekslar teng tarqaladi.</text>
  <text x="460" y="406" font-family="Segoe UI" font-size="14" fill="#334155">4. Kichik o'zgarish -> butunlay boshqa indeks.</text>
</svg>
