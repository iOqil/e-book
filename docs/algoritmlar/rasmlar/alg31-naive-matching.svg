<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540">
  <title>Sodda (naive) pattern qidiruv: namunani matn bo'ylab bir-bir siljitib taqqoslash</title>
  <rect x="0" y="0" width="860" height="540" fill="#f8fafc"/>
  <text x="430" y="34" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Sodda (naive) qidiruv: bir-bir siljitish</text>
  <text x="430" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">T = "ABABCAB", P = "ABC" — namunani har pozitsiyada taqqoslaymiz</text>

  <!-- Text row label -->
  <text x="70" y="100" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155">Matn T:</text>

  <!-- Text cells: A B A B C A B (indices 0..6) -->
  <g font-family="monospace" font-size="18" font-weight="bold">
    <rect x="170" y="82" width="42" height="42" fill="#ffffff" stroke="#334155" stroke-width="2"/><text x="191" y="110" text-anchor="middle" fill="#1e293b">A</text>
    <rect x="212" y="82" width="42" height="42" fill="#ffffff" stroke="#334155" stroke-width="2"/><text x="233" y="110" text-anchor="middle" fill="#1e293b">B</text>
    <rect x="254" y="82" width="42" height="42" fill="#ffffff" stroke="#334155" stroke-width="2"/><text x="275" y="110" text-anchor="middle" fill="#1e293b">A</text>
    <rect x="296" y="82" width="42" height="42" fill="#ffffff" stroke="#334155" stroke-width="2"/><text x="317" y="110" text-anchor="middle" fill="#1e293b">B</text>
    <rect x="338" y="82" width="42" height="42" fill="#ffffff" stroke="#334155" stroke-width="2"/><text x="359" y="110" text-anchor="middle" fill="#1e293b">C</text>
    <rect x="380" y="82" width="42" height="42" fill="#ffffff" stroke="#334155" stroke-width="2"/><text x="401" y="110" text-anchor="middle" fill="#1e293b">A</text>
    <rect x="422" y="82" width="42" height="42" fill="#ffffff" stroke="#334155" stroke-width="2"/><text x="443" y="110" text-anchor="middle" fill="#1e293b">B</text>
  </g>
  <g font-family="monospace" font-size="13" fill="#94a3b8">
    <text x="191" y="140" text-anchor="middle">0</text>
    <text x="233" y="140" text-anchor="middle">1</text>
    <text x="275" y="140" text-anchor="middle">2</text>
    <text x="317" y="140" text-anchor="middle">3</text>
    <text x="359" y="140" text-anchor="middle">4</text>
    <text x="401" y="140" text-anchor="middle">5</text>
    <text x="443" y="140" text-anchor="middle">6</text>
  </g>

  <!-- Shift 0: P aligned at index 0 -> mismatch at C vs A (pos 2) -->
  <text x="70" y="195" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#dc2626">siljish s=0:</text>
  <g font-family="monospace" font-size="16" font-weight="bold">
    <rect x="170" y="172" width="42" height="36" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="191" y="197" text-anchor="middle" fill="#166534">A</text>
    <rect x="212" y="172" width="42" height="36" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="233" y="197" text-anchor="middle" fill="#166534">B</text>
    <rect x="254" y="172" width="42" height="36" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="275" y="197" text-anchor="middle" fill="#dc2626">C</text>
  </g>
  <text x="320" y="197" font-family="Segoe UI" font-size="13" fill="#dc2626">C ≠ A → mos emas, 1 ga siljiy</text>

  <!-- Shift 1: P aligned at index 1 -> mismatch at first char -->
  <text x="70" y="250" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#dc2626">siljish s=1:</text>
  <g font-family="monospace" font-size="16" font-weight="bold">
    <rect x="212" y="227" width="42" height="36" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="233" y="252" text-anchor="middle" fill="#dc2626">A</text>
    <rect x="254" y="227" width="42" height="36" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="275" y="252" text-anchor="middle" fill="#64748b">B</text>
    <rect x="296" y="227" width="42" height="36" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="317" y="252" text-anchor="middle" fill="#64748b">C</text>
  </g>
  <text x="362" y="252" font-family="Segoe UI" font-size="13" fill="#dc2626">A ≠ B → birinchidayoq mos emas</text>

  <!-- Shift 2: P aligned at index 2 -> full match! -->
  <text x="70" y="305" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a">siljish s=2:</text>
  <g font-family="monospace" font-size="16" font-weight="bold">
    <rect x="254" y="282" width="42" height="36" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="275" y="307" text-anchor="middle" fill="#166534">A</text>
    <rect x="296" y="282" width="42" height="36" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="317" y="307" text-anchor="middle" fill="#166534">B</text>
    <rect x="338" y="282" width="42" height="36" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="359" y="307" text-anchor="middle" fill="#166534">C</text>
  </g>
  <text x="404" y="307" font-family="Segoe UI" font-size="14" fill="#16a34a" font-weight="bold">✓ to'liq mos! s=2 da topildi</text>

  <!-- complexity box -->
  <rect x="170" y="350" width="520" height="70" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="430" y="378" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#92400e">Har siljishda eng yomon m ta solishtirish, n−m+1 ta siljish</text>
  <text x="430" y="404" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#92400e">eng yomon: O(n · m)   ·   eng yaxshi: O(n)</text>

  <!-- worst case note -->
  <rect x="170" y="438" width="520" height="74" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="186" y="464" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#2563eb">Eng yomon holat misoli:</text>
  <text x="186" y="486" font-family="monospace" font-size="13" fill="#334155">T = "AAAAAAAA", P = "AAAB" — har siljishda deyarli</text>
  <text x="186" y="505" font-family="monospace" font-size="13" fill="#334155">to'liq solishtirib, oxirgi belgida mos kelmaydi.</text>
</svg>
