<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560">
  <title>Asosiy o'sish tartiblari egri chiziqlari bitta grafikda: O(1), O(log n), O(n), O(n log n), O(n kvadrat) va O(2 darajada n) ning n o'qi bo'ylab T(n) o'qida o'sishi</title>
  <rect x="0" y="0" width="860" height="560" fill="#f8fafc"/>
  <text x="430" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">O'sish tartiblari: n kattalashganda T(n) qanday o'sadi</text>
  <text x="430" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Pastdagi egri = sekin o'sadi (yaxshi), tepadagi = portlab o'sadi (yomon)</text>

  <!-- plot area -->
  <rect x="90" y="90" width="600" height="400" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- axes -->
  <line x1="90" y1="490" x2="690" y2="490" stroke="#334155" stroke-width="2"/>
  <line x1="90" y1="90" x2="90" y2="490" stroke="#334155" stroke-width="2"/>
  <text x="390" y="525" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#334155">kirish hajmi  n  →</text>
  <text x="40" y="290" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#334155" transform="rotate(-90 40 290)">qadamlar soni  T(n)  →</text>

  <!-- light gridlines -->
  <line x1="190" y1="90" x2="190" y2="490" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="290" y1="90" x2="290" y2="490" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="390" y1="90" x2="390" y2="490" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="490" y1="90" x2="490" y2="490" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="590" y1="90" x2="590" y2="490" stroke="#f1f5f9" stroke-width="1"/>

  <!-- O(1) constant: flat near bottom -->
  <path d="M 90 470 L 690 468" fill="none" stroke="#16a34a" stroke-width="3"/>
  <!-- O(log n): slow rise -->
  <path d="M 90 478 Q 250 440 420 420 T 690 400" fill="none" stroke="#0891b2" stroke-width="3"/>
  <!-- O(n): straight diagonal -->
  <path d="M 90 480 L 690 250" fill="none" stroke="#2563eb" stroke-width="3"/>
  <!-- O(n log n): a bit above linear, curving up -->
  <path d="M 90 480 Q 380 320 540 230 T 690 150" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <!-- O(n^2): steeper parabola -->
  <path d="M 90 485 Q 350 400 470 250 T 600 100" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <!-- O(2^n): explodes almost vertically -->
  <path d="M 90 486 Q 200 460 250 350 T 300 95" fill="none" stroke="#dc2626" stroke-width="3"/>

  <!-- curve labels (right side legend) -->
  <rect x="710" y="120" width="138" height="278" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="779" y="146" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Tartib</text>

  <line x1="722" y1="170" x2="746" y2="170" stroke="#dc2626" stroke-width="3"/>
  <text x="752" y="175" font-family="monospace" font-size="13" fill="#dc2626">O(2ⁿ)</text>
  <line x1="722" y1="202" x2="746" y2="202" stroke="#f59e0b" stroke-width="3"/>
  <text x="752" y="207" font-family="monospace" font-size="13" fill="#d97706">O(n²)</text>
  <line x1="722" y1="234" x2="746" y2="234" stroke="#7c3aed" stroke-width="3"/>
  <text x="752" y="239" font-family="monospace" font-size="13" fill="#7c3aed">O(n log n)</text>
  <line x1="722" y1="266" x2="746" y2="266" stroke="#2563eb" stroke-width="3"/>
  <text x="752" y="271" font-family="monospace" font-size="13" fill="#2563eb">O(n)</text>
  <line x1="722" y1="298" x2="746" y2="298" stroke="#0891b2" stroke-width="3"/>
  <text x="752" y="303" font-family="monospace" font-size="13" fill="#0891b2">O(log n)</text>
  <line x1="722" y1="330" x2="746" y2="330" stroke="#16a34a" stroke-width="3"/>
  <text x="752" y="335" font-family="monospace" font-size="13" fill="#16a34a">O(1)</text>

  <text x="779" y="372" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Tepa = yomon</text>
  <text x="779" y="390" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Past = yaxshi</text>
</svg>
