<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500">
  <title>Dinamik massiv to'lganda sig'imni ikkilantirish: eski massivdan yangi ikki barobar katta massivga nusxalash</title>
  <rect x="0" y="0" width="860" height="500" fill="#f8fafc"/>
  <text x="430" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Sig'im to'lganda: ikkilantirish va nusxalash</text>
  <text x="430" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Eski blokda joy qolmaganda 2x katta yangi blok ajratiladi, elementlar ko'chiriladi</text>

  <!-- step 1: old full array -->
  <text x="70" y="115" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">1. Eski massiv to'ldi (size = capacity = 4)</text>
  <g font-family="monospace" font-size="16">
    <rect x="70"  y="130" width="56" height="50" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="98"  y="162" text-anchor="middle" fill="#1e293b">A</text>
    <rect x="126" y="130" width="56" height="50" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="154" y="162" text-anchor="middle" fill="#1e293b">B</text>
    <rect x="182" y="130" width="56" height="50" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="210" y="162" text-anchor="middle" fill="#1e293b">C</text>
    <rect x="238" y="130" width="56" height="50" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="266" y="162" text-anchor="middle" fill="#1e293b">D</text>
  </g>
  <text x="360" y="160" font-family="Segoe UI" font-size="14" fill="#dc2626">← yana append kelsa joy yo'q</text>

  <!-- step 2: allocate new array 2x -->
  <text x="70" y="230" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">2. Yangi blok ajratiladi (capacity = 8, ikki barobar)</text>
  <g font-family="monospace" font-size="16">
    <rect x="70"  y="245" width="56" height="50" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect x="126" y="245" width="56" height="50" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect x="182" y="245" width="56" height="50" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect x="238" y="245" width="56" height="50" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect x="294" y="245" width="56" height="50" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="350" y="245" width="56" height="50" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="406" y="245" width="56" height="50" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="462" y="245" width="56" height="50" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  </g>
  <text x="560" y="276" font-family="Segoe UI" font-size="14" fill="#64748b">to'rt katak bo'sh (zaxira)</text>

  <!-- step 3: copy -->
  <text x="70" y="345" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">3. 4 ta eski element nusxalanadi — bu O(n) ish</text>
  <g font-family="monospace" font-size="16">
    <rect x="70"  y="360" width="56" height="50" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="98"  y="392" text-anchor="middle" fill="#1e293b">A</text>
    <rect x="126" y="360" width="56" height="50" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="154" y="392" text-anchor="middle" fill="#1e293b">B</text>
    <rect x="182" y="360" width="56" height="50" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="210" y="392" text-anchor="middle" fill="#1e293b">C</text>
    <rect x="238" y="360" width="56" height="50" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="266" y="392" text-anchor="middle" fill="#1e293b">D</text>
    <rect x="294" y="360" width="56" height="50" fill="#fef9c3" stroke="#f59e0b" stroke-width="2"/>
    <text x="322" y="392" text-anchor="middle" fill="#1e293b">E</text>
    <rect x="350" y="360" width="56" height="50" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="406" y="360" width="56" height="50" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="462" y="360" width="56" height="50" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  </g>
  <text x="322" y="438" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#f59e0b">yangi E qo'shildi</text>

  <!-- conclusion -->
  <rect x="555" y="355" width="270" height="90" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="690" y="385" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Bu qimmat amal kam uchraydi</text>
  <text x="690" y="410" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">8 katakni to'ldirish uchun</text>
  <text x="690" y="430" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">append amortized = O(1)</text>
</svg>
