<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <title>Sikl turlari: for sanagichli, while shartli va do-while kamida bir marta bajariladigan sikllarning yonma-yon taqqoslanishi</title>
  <rect x="0" y="0" width="900" height="520" fill="#f8fafc"/>
  <text x="450" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Uchta asosiy sikl turi</text>
  <text x="450" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Farqi: shart qachon tekshiriladi va takror soni oldindan ma'lummi</text>

  <!-- FOR card -->
  <rect x="30" y="92" width="270" height="380" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="165" y="124" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#2563eb">for — sanagichli</text>
  <line x1="50" y1="138" x2="280" y2="138" stroke="#dbeafe" stroke-width="2"/>
  <text x="165" y="162" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Takror soni OLDINDAN ma'lum</text>
  <rect x="50" y="178" width="230" height="92" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="64" y="202" font-family="monospace" font-size="14" fill="#1e293b">for i = 1..n:</text>
  <text x="80" y="226" font-family="monospace" font-size="14" fill="#334155">tana(i)</text>
  <text x="64" y="256" font-family="monospace" font-size="13" fill="#64748b"># init, shart, step</text>
  <text x="165" y="300" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Shart: takrordan OLDIN</text>
  <text x="165" y="324" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">0 marta bajarilishi mumkin</text>
  <text x="165" y="356" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Misol: 1..n yig'indi,</text>
  <text x="165" y="376" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">jadval, massiv bo'ylab</text>
  <rect x="50" y="400" width="230" height="52" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="165" y="424" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">"Aniq N marta qil"</text>
  <text x="165" y="442" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">degan vazifalarga</text>

  <!-- WHILE card -->
  <rect x="315" y="92" width="270" height="380" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="450" y="124" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#7c3aed">while — shartli</text>
  <line x1="335" y1="138" x2="565" y2="138" stroke="#ede9fe" stroke-width="2"/>
  <text x="450" y="162" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Takror soni NOMA'LUM</text>
  <rect x="335" y="178" width="230" height="92" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="349" y="202" font-family="monospace" font-size="14" fill="#1e293b">while shart:</text>
  <text x="365" y="226" font-family="monospace" font-size="14" fill="#334155">tana()</text>
  <text x="349" y="256" font-family="monospace" font-size="13" fill="#64748b"># shart buzilguncha</text>
  <text x="450" y="300" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Shart: takrordan OLDIN</text>
  <text x="450" y="324" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">0 marta bajarilishi mumkin</text>
  <text x="450" y="356" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Misol: foydalanuvchidan</text>
  <text x="450" y="376" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">kiritma, qidiruv, GCD</text>
  <rect x="335" y="400" width="230" height="52" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="450" y="424" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">"Shart rost ekan</text>
  <text x="450" y="442" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">davom et" vazifalarga</text>

  <!-- DO-WHILE card -->
  <rect x="600" y="92" width="270" height="380" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="735" y="124" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#d97706">do-while — keyin</text>
  <line x1="620" y1="138" x2="850" y2="138" stroke="#fef3c7" stroke-width="2"/>
  <text x="735" y="162" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Kamida BIR marta bajariladi</text>
  <rect x="620" y="178" width="230" height="92" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <text x="634" y="202" font-family="monospace" font-size="14" fill="#1e293b">do:</text>
  <text x="650" y="226" font-family="monospace" font-size="14" fill="#334155">tana()</text>
  <text x="634" y="250" font-family="monospace" font-size="14" fill="#1e293b">while shart</text>
  <text x="735" y="300" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Shart: takrordan KEYIN</text>
  <text x="735" y="324" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Tana 1+ marta bajariladi</text>
  <text x="735" y="356" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Misol: menyu ko'rsatish,</text>
  <text x="735" y="376" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">"qayta urinish" so'rovi</text>
  <rect x="620" y="400" width="230" height="52" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="735" y="424" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">Python'da to'g'ridan-to'g'ri</text>
  <text x="735" y="442" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">yo'q (while True + break)</text>
</svg>
