<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560">
  <title>T(n)=2T(n/2)+n rekursiya daraxti: har darajada bajariladigan ish n ga teng, jami log n+1 daraja bor, shuning uchun umumiy ish n marta log n ga teng</title>
  <rect x="0" y="0" width="880" height="560" fill="#f8fafc"/>
  <text x="440" y="36" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Rekursiya daraxti:  T(n) = 2T(n/2) + n</text>
  <text x="440" y="62" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Har bir tugun ichidagi son = o'sha chaqiruvdagi "birlashtirish" ishi (f qiymati)</text>

  <!-- right column header -->
  <text x="800" y="92" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Daraja ishi</text>

  <!-- level 0 -->
  <rect x="400" y="100" width="80" height="40" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="125" text-anchor="middle" font-family="monospace" font-size="15" fill="#2563eb">n</text>
  <text x="800" y="125" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">= n</text>

  <!-- edges 0->1 -->
  <line x1="430" y1="140" x2="250" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <line x1="450" y1="140" x2="630" y2="180" stroke="#94a3b8" stroke-width="2"/>

  <!-- level 1 -->
  <rect x="210" y="180" width="80" height="40" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="250" y="205" text-anchor="middle" font-family="monospace" font-size="15" fill="#2563eb">n/2</text>
  <rect x="590" y="180" width="80" height="40" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="630" y="205" text-anchor="middle" font-family="monospace" font-size="15" fill="#2563eb">n/2</text>
  <text x="800" y="205" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">2·(n/2) = n</text>

  <!-- edges 1->2 -->
  <line x1="240" y1="220" x2="160" y2="260" stroke="#94a3b8" stroke-width="2"/>
  <line x1="260" y1="220" x2="340" y2="260" stroke="#94a3b8" stroke-width="2"/>
  <line x1="620" y1="220" x2="540" y2="260" stroke="#94a3b8" stroke-width="2"/>
  <line x1="640" y1="220" x2="720" y2="260" stroke="#94a3b8" stroke-width="2"/>

  <!-- level 2 -->
  <rect x="125" y="260" width="70" height="38" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="160" y="284" text-anchor="middle" font-family="monospace" font-size="14" fill="#7c3aed">n/4</text>
  <rect x="305" y="260" width="70" height="38" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="340" y="284" text-anchor="middle" font-family="monospace" font-size="14" fill="#7c3aed">n/4</text>
  <rect x="505" y="260" width="70" height="38" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="540" y="284" text-anchor="middle" font-family="monospace" font-size="14" fill="#7c3aed">n/4</text>
  <rect x="685" y="260" width="70" height="38" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="720" y="284" text-anchor="middle" font-family="monospace" font-size="14" fill="#7c3aed">n/4</text>
  <text x="800" y="284" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">4·(n/4) = n</text>

  <!-- dots -->
  <text x="440" y="334" text-anchor="middle" font-family="Segoe UI" font-size="22" fill="#94a3b8">⋮</text>
  <text x="800" y="334" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">⋮ = n</text>

  <!-- leaves -->
  <g>
    <rect x="120" y="360" width="30" height="30" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="170" y="360" width="30" height="30" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="220" y="360" width="30" height="30" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="270" y="360" width="30" height="30" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="330" y="381" text-anchor="middle" font-family="Segoe UI" font-size="16" fill="#94a3b8">…</text>
    <rect x="360" y="360" width="30" height="30" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="410" y="360" width="30" height="30" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="460" y="360" width="30" height="30" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="520" y="381" text-anchor="middle" font-family="Segoe UI" font-size="16" fill="#94a3b8">…</text>
    <rect x="550" y="360" width="30" height="30" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="600" y="360" width="30" height="30" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="650" y="360" width="30" height="30" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="700" y="360" width="30" height="30" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <text x="425" y="412" text-anchor="middle" font-family="monospace" font-size="14" fill="#d97706">n ta barg (T(1) ish = O(1) har biri)</text>
  <text x="800" y="381" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">= n</text>

  <!-- left bracket: height -->
  <line x1="80" y1="100" x2="80" y2="390" stroke="#dc2626" stroke-width="2"/>
  <line x1="80" y1="100" x2="92" y2="100" stroke="#dc2626" stroke-width="2"/>
  <line x1="80" y1="390" x2="92" y2="390" stroke="#dc2626" stroke-width="2"/>
  <text x="58" y="250" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#dc2626" transform="rotate(-90 58 250)">balandlik = log₂ n + 1 daraja</text>

  <!-- total box -->
  <rect x="240" y="450" width="400" height="78" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="440" y="478" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#334155">Jami = (daraja ishi) × (daraja soni)</text>
  <text x="440" y="508" text-anchor="middle" font-family="monospace" font-size="17" font-weight="bold" fill="#16a34a">n × (log₂ n + 1) = Θ(n log n)</text>
</svg>
