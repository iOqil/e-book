<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500">
  <title>Faollik tanlash: ishlarni tugash vaqti bo'yicha saralab, oldingi tanlangan ish bilan kesishadiganlarni tashlab, eng ko'p mos kelmaydigan ishni tanlash</title>
  <rect x="0" y="0" width="860" height="500" fill="#f8fafc"/>
  <text x="430" y="36" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Faollik tanlash: tugash vaqti bo'yicha greedy</text>
  <text x="430" y="62" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Eng erta tugaydigan ishni ol, kesishadiganlarni tashla, takrorla</text>

  <!-- time axis -->
  <line x1="120" y1="430" x2="800" y2="430" stroke="#334155" stroke-width="2"/>
  <polygon points="800,424 812,430 800,436" fill="#334155"/>
  <text x="816" y="435" font-family="Segoe UI" font-size="13" fill="#64748b">vaqt</text>
  <text x="120" y="455" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748b">0</text>
  <text x="800" y="455" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748b">11</text>

  <!-- intervals, sorted by finish time. x: 120 = t0, scale 60px per unit -->
  <!-- A: [1,3] TANLANDI -->
  <rect x="180" y="100" width="120" height="30" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="240" y="120" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">A [1,3] ✓</text>

  <!-- B: [2,5] kesishadi (A bilan), TASHLANDI -->
  <rect x="240" y="142" width="180" height="30" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="330" y="162" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#dc2626">B [2,5] ✗ kesishadi</text>

  <!-- C: [4,7] TANLANDI -->
  <rect x="360" y="184" width="180" height="30" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="450" y="204" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">C [4,7] ✓</text>

  <!-- D: [6,8] kesishadi (C bilan), TASHLANDI -->
  <rect x="480" y="226" width="120" height="30" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="540" y="246" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#dc2626">D [6,8] ✗</text>

  <!-- E: [8,11] TANLANDI -->
  <rect x="600" y="268" width="180" height="30" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="690" y="288" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">E [8,11] ✓</text>

  <!-- vertical guide lines for finish times -->
  <line x1="300" y1="100" x2="300" y2="430" stroke="#16a34a" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
  <line x1="540" y1="184" x2="540" y2="430" stroke="#16a34a" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>

  <text x="430" y="345" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">Tanlandi: A, C, E — 3 ta mos kelmaydigan ish</text>
  <text x="430" y="372" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Greedy tanlovi: oldingi tanlangan ish tugaganidan keyin boshlanadigan,</text>
  <text x="430" y="392" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">eng erta tugaydigan ishni ol — bu har doim optimal (isbot: almashtirish argumenti).</text>
</svg>
