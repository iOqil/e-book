<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560">
  <title>To'liq blok-sxema misoli: ikki sonning kattasini topish</title>
  <rect x="0" y="0" width="760" height="560" fill="#f8fafc"/>
  <text x="380" y="34" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b" text-anchor="middle">Misol: ikki sonning kattasini topish</text>
  <text x="380" y="58" font-family="Segoe UI" font-size="14" fill="#64748b" text-anchor="middle">Qaror blokidan ikki tarmoq chiqadi — har biri o'z chiqishiga olib boradi</text>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Boshla -->
  <ellipse cx="380" cy="100" rx="70" ry="28" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="106" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">Boshla</text>
  <line x1="380" y1="128" x2="380" y2="158" stroke="#334155" stroke-width="2" marker-end="url(#a2)"/>

  <!-- Kirish a, b -->
  <polygon points="320,162 460,162 432,212 292,212" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="378" y="193" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed" text-anchor="middle">Kirish: a, b</text>
  <line x1="380" y1="212" x2="380" y2="242" stroke="#334155" stroke-width="2" marker-end="url(#a2)"/>

  <!-- Qaror a > b -->
  <polygon points="380,246 470,300 380,354 290,300" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="306" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#f59e0b" text-anchor="middle">a &gt; b ?</text>

  <!-- Ha tarmoq (chap) -->
  <line x1="290" y1="300" x2="180" y2="300" stroke="#334155" stroke-width="2"/>
  <line x1="180" y1="300" x2="180" y2="392" stroke="#334155" stroke-width="2" marker-end="url(#a2)"/>
  <text x="232" y="290" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">ha</text>

  <!-- Yo'q tarmoq (o'ng) -->
  <line x1="470" y1="300" x2="580" y2="300" stroke="#334155" stroke-width="2"/>
  <line x1="580" y1="300" x2="580" y2="392" stroke="#334155" stroke-width="2" marker-end="url(#a2)"/>
  <text x="528" y="290" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">yo'q</text>

  <!-- Chiqish a (chap) -->
  <polygon points="120,396 240,396 216,446 96,446" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="168" y="427" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">Chiqar: a</text>

  <!-- Chiqish b (o'ng) -->
  <polygon points="520,396 640,396 616,446 496,446" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="568" y="427" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">Chiqar: b</text>

  <!-- Birlashtirish va Tugat -->
  <line x1="168" y1="446" x2="168" y2="492" stroke="#334155" stroke-width="2"/>
  <line x1="568" y1="446" x2="568" y2="492" stroke="#334155" stroke-width="2"/>
  <line x1="168" y1="492" x2="568" y2="492" stroke="#334155" stroke-width="2"/>
  <line x1="380" y1="492" x2="380" y2="510" stroke="#334155" stroke-width="2" marker-end="url(#a2)"/>

  <ellipse cx="380" cy="535" rx="70" ry="22" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="541" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">Tugat</text>
</svg>
