<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560">
  <title>P, NP, NP-to'liq va NP-qiyin sinflarining munosabati, P teng emas NP farazi ostida</title>
  <rect x="0" y="0" width="860" height="560" fill="#f8fafc"/>
  <text x="430" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Murakkablik sinflari: P, NP, NP-to'liq, NP-qiyin</text>
  <text x="430" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">P &#8800; NP farazi ostida (eng ko'pchilik shunday deb hisoblaydi)</text>

  <!-- NP big ellipse -->
  <ellipse cx="320" cy="320" rx="270" ry="190" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="320" y="160" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#2563eb">NP</text>
  <text x="320" y="182" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">yechimi tez tekshiriladigan</text>

  <!-- P ellipse inside NP -->
  <ellipse cx="215" cy="350" rx="135" ry="120" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="180" y="320" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#16a34a">P</text>
  <text x="180" y="342" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">tez yechiladigan</text>
  <text x="180" y="372" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">saralash</text>
  <text x="180" y="392" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">eng qisqa yo'l</text>

  <!-- NP-complete region inside NP (right part) -->
  <ellipse cx="450" cy="350" rx="120" ry="120" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="470" y="318" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">NP-to'liq</text>
  <text x="470" y="340" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">NP &#8745; NP-qiyin</text>
  <text x="470" y="368" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">SAT, 3-SAT</text>
  <text x="470" y="388" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">TSP (qaror)</text>
  <text x="470" y="408" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">klika, knapsack</text>

  <!-- NP-hard box (outside, encompassing) -->
  <rect x="640" y="200" width="195" height="240" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="737" y="232" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">NP-qiyin</text>
  <text x="737" y="254" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">kamida NP qadar</text>
  <text x="737" y="272" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">qiyin; NP da</text>
  <text x="737" y="290" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">bo'lishi shart emas</text>
  <text x="737" y="324" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">TSP (optimizatsiya)</text>
  <text x="737" y="348" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">to'xtash muammosi</text>
  <text x="737" y="372" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">(yechib bo'lmaydi)</text>

  <!-- arrow linking NP-complete to NP-hard -->
  <line x1="565" y1="330" x2="638" y2="300" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5,4"/>
  <polygon points="638,300 626,300 632,310" fill="#7c3aed"/>
  <text x="600" y="288" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#7c3aed">NP-qiyin qism</text>

  <!-- bottom note -->
  <text x="430" y="510" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">P &#8838; NP. NP-to'liq = NP-qiyin va NP. NP-qiyin &#8839; NP-to'liq.</text>
  <text x="430" y="534" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">P &#8800; NP bo'lsa, P va NP-to'liq kesishmaydi (hech bir NP-to'liq P da emas).</text>
</svg>
