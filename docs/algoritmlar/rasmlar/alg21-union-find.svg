<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560">
  <title>Union-Find: to'plamlar o'rmoni, union va find amallari hamda yo'lni siqish (path compression)</title>
  <rect x="0" y="0" width="880" height="560" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Union-Find (Disjoint Set Union)</text>
  <text x="440" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Har to'plam — daraxt; ildiz (root) — to'plam vakili</text>

  <defs>
    <marker id="up" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="upg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- ===== panel 1: forest (two sets) ===== -->
  <rect x="28" y="80" width="396" height="220" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="226" y="106" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">1. To'plamlar o'rmoni</text>

  <!-- set A: root 1 -->
  <line x1="120" y1="170" x2="120" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#up)"/>
  <line x1="90" y1="220" x2="113" y2="183" stroke="#64748b" stroke-width="2" marker-end="url(#up)"/>
  <line x1="150" y1="220" x2="127" y2="183" stroke="#64748b" stroke-width="2" marker-end="url(#up)"/>
  <circle cx="120" cy="148" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="120" y="153" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">1</text>
  <circle cx="90" cy="226" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="90" y="231" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#2563eb">2</text>
  <circle cx="150" cy="226" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="150" y="231" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#2563eb">3</text>
  <text x="120" y="272" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">to'plam {1,2,3}</text>

  <!-- set B: root 5 -->
  <line x1="300" y1="220" x2="320" y2="183" stroke="#64748b" stroke-width="2" marker-end="url(#up)"/>
  <circle cx="326" cy="148" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="326" y="153" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">5</text>
  <circle cx="296" cy="226" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="296" y="231" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">4</text>
  <text x="320" y="272" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">to'plam {4,5}</text>

  <!-- ===== panel 2: union(3,4) ===== -->
  <rect x="456" y="80" width="396" height="220" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="654" y="106" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#f59e0b">2. union(3, 4)</text>
  <text x="654" y="126" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">kichik daraxt ildizi kattaga ulanadi</text>

  <!-- merged tree, root 1 -->
  <line x1="554" y1="184" x2="554" y2="166" stroke="#64748b" stroke-width="2" marker-end="url(#up)"/>
  <line x1="520" y1="234" x2="547" y2="197" stroke="#64748b" stroke-width="2" marker-end="url(#up)"/>
  <line x1="588" y1="234" x2="561" y2="197" stroke="#64748b" stroke-width="2" marker-end="url(#up)"/>
  <line x1="640" y1="184" x2="595" y2="168" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#up)"/>
  <line x1="690" y1="234" x2="652" y2="197" stroke="#64748b" stroke-width="2" marker-end="url(#up)"/>

  <circle cx="554" cy="162" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="554" y="167" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">1</text>
  <circle cx="514" cy="240" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="514" y="245" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#2563eb">2</text>
  <circle cx="594" cy="240" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="594" y="245" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#2563eb">3</text>
  <circle cx="648" cy="184" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="648" y="189" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">5</text>
  <circle cx="696" cy="240" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="696" y="245" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">4</text>
  <text x="654" y="282" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">endi hammasi bitta to'plam, ildiz = 1</text>

  <!-- ===== panel 3: path compression ===== -->
  <rect x="28" y="320" width="824" height="216" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="440" y="346" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">3. find(8) — yo'lni siqish (path compression)</text>

  <!-- before -->
  <text x="200" y="374" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#64748b">Oldin: uzun zanjir</text>
  <line x1="200" y1="440" x2="200" y2="409" stroke="#64748b" stroke-width="2" marker-end="url(#up)"/>
  <line x1="200" y1="482" x2="200" y2="451" stroke="#64748b" stroke-width="2" marker-end="url(#up)"/>
  <line x1="200" y1="514" x2="200" y2="493" stroke="#64748b" stroke-width="2" marker-end="url(#up)"/>
  <circle cx="200" cy="398" r="17" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="200" y="403" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#2563eb">r</text>
  <circle cx="200" cy="440" r="17" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="200" y="445" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">6</text>
  <circle cx="200" cy="482" r="17" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="200" y="487" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">7</text>
  <circle cx="200" cy="524" r="17" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="200" y="529" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#f59e0b">8</text>

  <!-- arrow -->
  <line x1="320" y1="450" x2="470" y2="450" stroke="#16a34a" stroke-width="3" marker-end="url(#upg)"/>
  <text x="395" y="438" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">find(8)</text>
  <text x="395" y="472" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">ildizgacha</text>

  <!-- after -->
  <text x="660" y="374" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">Keyin: tekis (hamma ildizga)</text>
  <line x1="600" y1="478" x2="648" y2="424" stroke="#16a34a" stroke-width="2" marker-end="url(#upg)"/>
  <line x1="660" y1="478" x2="660" y2="424" stroke="#16a34a" stroke-width="2" marker-end="url(#upg)"/>
  <line x1="720" y1="478" x2="672" y2="424" stroke="#16a34a" stroke-width="2" marker-end="url(#upg)"/>
  <circle cx="660" cy="408" r="17" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="660" y="413" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#2563eb">r</text>
  <circle cx="600" cy="484" r="17" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="600" y="489" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">6</text>
  <circle cx="660" cy="484" r="17" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="660" y="489" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">7</text>
  <circle cx="720" cy="484" r="17" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="720" y="489" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">8</text>
  <text x="660" y="524" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">keyingi find lar deyarli O(1)</text>
</svg>
