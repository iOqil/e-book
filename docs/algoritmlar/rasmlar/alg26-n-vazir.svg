<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480">
  <title>N-vazir masalasi: 4x4 shaxmat taxtasida to'rt vazir bir-birini urmaydigan joylashuv va ustun/diagonal cheklovlari</title>
  <rect x="0" y="0" width="880" height="480" fill="#f8fafc"/>
  <text x="440" y="36" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">N-vazir (N-queens): 4x4 yechim</text>
  <text x="440" y="62" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Har qatorga bitta vazir: hech bir juftlik bir ustun, qator yoki diagonalda emas</text>

  <!-- board 4x4, top-left at (90,100), cell 70 -->
  <g>
    <!-- cells -->
    <!-- row 0 -->
    <rect x="90"  y="100" width="70" height="70" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="160" y="100" width="70" height="70" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="230" y="100" width="70" height="70" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="300" y="100" width="70" height="70" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- row 1 -->
    <rect x="90"  y="170" width="70" height="70" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="160" y="170" width="70" height="70" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="230" y="170" width="70" height="70" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="300" y="170" width="70" height="70" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- row 2 -->
    <rect x="90"  y="240" width="70" height="70" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="160" y="240" width="70" height="70" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="230" y="240" width="70" height="70" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="300" y="240" width="70" height="70" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- row 3 -->
    <rect x="90"  y="310" width="70" height="70" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="160" y="310" width="70" height="70" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="230" y="310" width="70" height="70" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="300" y="310" width="70" height="70" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- queens at solution [1,3,0,2]: row0->col1, row1->col3, row2->col0, row3->col2 -->
  <g font-family="Segoe UI" font-size="34" text-anchor="middle">
    <circle cx="195" cy="135" r="24" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="195" y="148" fill="#15803d">♛</text>
    <circle cx="335" cy="205" r="24" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="335" y="218" fill="#15803d">♛</text>
    <circle cx="125" cy="275" r="24" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="125" y="288" fill="#15803d">♛</text>
    <circle cx="265" cy="345" r="24" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="265" y="358" fill="#15803d">♛</text>
  </g>

  <!-- row labels -->
  <g font-family="monospace" font-size="13" fill="#64748b">
    <text x="72" y="140" text-anchor="end">q0</text>
    <text x="72" y="210" text-anchor="end">q1</text>
    <text x="72" y="280" text-anchor="end">q2</text>
    <text x="72" y="350" text-anchor="end">q3</text>
    <text x="125" y="92" text-anchor="middle">u0</text>
    <text x="195" y="92" text-anchor="middle">u1</text>
    <text x="265" y="92" text-anchor="middle">u2</text>
    <text x="335" y="92" text-anchor="middle">u3</text>
  </g>

  <!-- constraints panel -->
  <rect x="430" y="100" width="380" height="280" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="450" y="128" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Uchta cheklov (O(1) tekshiruv):</text>
  <text x="450" y="158" font-family="monospace" font-size="13" fill="#2563eb">ustun</text>
  <text x="510" y="158" font-family="Segoe UI" font-size="13" fill="#334155">— bir ustunda ikki vazir yo'q</text>
  <text x="450" y="186" font-family="monospace" font-size="13" fill="#16a34a">qator − ustun</text>
  <text x="570" y="186" font-family="Segoe UI" font-size="13" fill="#334155">— ↘ diagonal bir xil</text>
  <text x="450" y="214" font-family="monospace" font-size="13" fill="#7c3aed">qator + ustun</text>
  <text x="570" y="214" font-family="Segoe UI" font-size="13" fill="#334155">— ↙ diagonal bir xil</text>
  <text x="450" y="250" font-family="Segoe UI" font-size="13" fill="#64748b">Yangi vazir uchta to'plamning birortasiga</text>
  <text x="450" y="270" font-family="Segoe UI" font-size="13" fill="#64748b">tegsa — shox KESILADI (pruning), keyingi</text>
  <text x="450" y="290" font-family="Segoe UI" font-size="13" fill="#64748b">ustun sinaladi yoki orqaga qaytiladi.</text>
  <text x="450" y="326" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155">Yechimlar soni:</text>
  <text x="450" y="352" font-family="monospace" font-size="13" fill="#334155">N=4 → 2,  N=6 → 4,  N=8 → 92</text>
  <text x="450" y="372" font-family="Segoe UI" font-size="13" fill="#64748b">(yuqorida [1, 3, 0, 2] yechimi)</text>
</svg>
