<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
  <title>Indeksli massiv (raqamli tartib) va kalitli massiv (kalit dan qiymat) o'rtasidagi farq</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>

  <text x="380" y="36" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle">Massivning ikki turi</text>

  <!-- CHAP: Indeksli massiv -->
  <text x="200" y="74" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">Indeksli (tartibli) massiv</text>
  <text x="200" y="96" font-family="monospace" font-size="13" fill="#475569" text-anchor="middle">["olma", "anor", "uzum"]</text>

  <!-- indekslar va qiymatlar -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <!-- 0 -->
    <rect x="60" y="120" width="48" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="84" y="146" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">0</text>
    <rect x="120" y="120" width="220" height="40" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="230" y="146" font-size="14" fill="#1e293b" text-anchor="middle">"olma"</text>
    <!-- 1 -->
    <rect x="60" y="170" width="48" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="84" y="196" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">1</text>
    <rect x="120" y="170" width="220" height="40" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="230" y="196" font-size="14" fill="#1e293b" text-anchor="middle">"anor"</text>
    <!-- 2 -->
    <rect x="60" y="220" width="48" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="84" y="246" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">2</text>
    <rect x="120" y="220" width="220" height="40" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="230" y="246" font-size="14" fill="#1e293b" text-anchor="middle">"uzum"</text>
  </g>
  <text x="84" y="290" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">indeks</text>
  <text x="230" y="290" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">qiymat</text>
  <text x="200" y="330" font-family="monospace" font-size="13" fill="#16a34a" text-anchor="middle">$mevalar[1] → "anor"</text>
  <text x="200" y="356" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">Raqam (0, 1, 2...) bilan murojaat.</text>
  <text x="200" y="378" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">Sanoq 0 dan boshlanadi.</text>

  <!-- Ajratuvchi chiziq -->
  <line x1="380" y1="60" x2="380" y2="390" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- O'NG: Kalitli massiv -->
  <text x="560" y="74" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f59e0b" text-anchor="middle">Kalitli (assotsiativ) massiv</text>
  <text x="560" y="96" font-family="monospace" font-size="13" fill="#475569" text-anchor="middle">["ism" =&gt; "Ali", "yosh" =&gt; 19]</text>

  <defs>
    <marker id="kv" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <g font-family="Segoe UI, system-ui, sans-serif">
    <!-- ism -->
    <rect x="420" y="120" width="100" height="40" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="470" y="146" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">"ism"</text>
    <line x1="525" y1="140" x2="568" y2="140" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#kv)"/>
    <rect x="580" y="120" width="140" height="40" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="650" y="146" font-size="14" fill="#1e293b" text-anchor="middle">"Ali"</text>
    <!-- yosh -->
    <rect x="420" y="170" width="100" height="40" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="470" y="196" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">"yosh"</text>
    <line x1="525" y1="190" x2="568" y2="190" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#kv)"/>
    <rect x="580" y="170" width="140" height="40" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="650" y="196" font-size="14" fill="#1e293b" text-anchor="middle">19</text>
    <!-- shahar -->
    <rect x="420" y="220" width="100" height="40" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="470" y="246" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">"shahar"</text>
    <line x1="525" y1="240" x2="568" y2="240" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#kv)"/>
    <rect x="580" y="220" width="140" height="40" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="650" y="246" font-size="14" fill="#1e293b" text-anchor="middle">"Toshkent"</text>
  </g>
  <text x="470" y="290" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">kalit</text>
  <text x="650" y="290" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">qiymat</text>
  <text x="560" y="330" font-family="monospace" font-size="13" fill="#16a34a" text-anchor="middle">$talaba["ism"] → "Ali"</text>
  <text x="560" y="356" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">Nom (kalit) bilan murojaat.</text>
  <text x="560" y="378" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">=&gt; kalitni qiymatga bog'laydi.</text>
</svg>
