<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540">
  <title>map filter reduce: map har bir elementni o'zgartiradi, filter shartga mos elementlarni tanlaydi, reduce massivni bitta qiymatga yig'adi</title>
  <rect x="0" y="0" width="760" height="540" fill="#f8fafc"/>

  <text x="380" y="34" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle">map / filter / reduce massivni qanday o'zgartiradi</text>

  <defs>
    <marker id="ma" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- ===== MAP ===== -->
  <text x="60" y="80" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">array_map — o'zgartir (har birini)</text>
  <!-- kirish -->
  <g font-family="monospace" font-size="14">
    <rect x="60" y="95" width="44" height="36" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="82" y="119" fill="#1e293b" text-anchor="middle">1</text>
    <rect x="110" y="95" width="44" height="36" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="132" y="119" fill="#1e293b" text-anchor="middle">2</text>
    <rect x="160" y="95" width="44" height="36" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="182" y="119" fill="#1e293b" text-anchor="middle">3</text>
    <rect x="210" y="95" width="44" height="36" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="232" y="119" fill="#1e293b" text-anchor="middle">4</text>
  </g>
  <line x1="290" y1="113" x2="380" y2="113" stroke="#475569" stroke-width="2.5" marker-end="url(#ma)"/>
  <text x="335" y="104" font-family="monospace" font-size="13" fill="#2563eb" text-anchor="middle">fn($n)=&gt;$n*$n</text>
  <g font-family="monospace" font-size="14">
    <rect x="400" y="95" width="44" height="36" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="422" y="119" fill="#1e293b" text-anchor="middle">1</text>
    <rect x="450" y="95" width="44" height="36" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="472" y="119" fill="#1e293b" text-anchor="middle">4</text>
    <rect x="500" y="95" width="44" height="36" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="522" y="119" fill="#1e293b" text-anchor="middle">9</text>
    <rect x="550" y="95" width="44" height="36" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="572" y="119" fill="#1e293b" text-anchor="middle">16</text>
  </g>
  <text x="650" y="119" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">soni bir xil</text>

  <line x1="30" y1="160" x2="730" y2="160" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ===== FILTER ===== -->
  <text x="60" y="205" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">array_filter — tanla (shartga mos)</text>
  <g font-family="monospace" font-size="14">
    <rect x="60" y="220" width="40" height="36" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="80" y="244" fill="#1e293b" text-anchor="middle">1</text>
    <rect x="105" y="220" width="40" height="36" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="125" y="244" fill="#1e293b" text-anchor="middle">2</text>
    <rect x="150" y="220" width="40" height="36" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="170" y="244" fill="#1e293b" text-anchor="middle">3</text>
    <rect x="195" y="220" width="40" height="36" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="215" y="244" fill="#1e293b" text-anchor="middle">4</text>
    <rect x="240" y="220" width="40" height="36" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="260" y="244" fill="#1e293b" text-anchor="middle">5</text>
    <rect x="285" y="220" width="40" height="36" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="305" y="244" fill="#1e293b" text-anchor="middle">6</text>
  </g>
  <line x1="340" y1="238" x2="430" y2="238" stroke="#475569" stroke-width="2.5" marker-end="url(#ma)"/>
  <text x="385" y="229" font-family="monospace" font-size="13" fill="#16a34a" text-anchor="middle">$n%2===0</text>
  <g font-family="monospace" font-size="14">
    <rect x="450" y="220" width="44" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="472" y="244" fill="#1e293b" text-anchor="middle">2</text>
    <rect x="500" y="220" width="44" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="522" y="244" fill="#1e293b" text-anchor="middle">4</text>
    <rect x="550" y="220" width="44" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="572" y="244" fill="#1e293b" text-anchor="middle">6</text>
  </g>
  <text x="660" y="244" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">faqat juftlar</text>

  <line x1="30" y1="285" x2="730" y2="285" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ===== REDUCE ===== -->
  <text x="60" y="330" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f59e0b">array_reduce — yig' (bitta qiymatga)</text>
  <g font-family="monospace" font-size="14">
    <rect x="60" y="345" width="44" height="36" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="82" y="369" fill="#1e293b" text-anchor="middle">1</text>
    <rect x="110" y="345" width="44" height="36" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="132" y="369" fill="#1e293b" text-anchor="middle">2</text>
    <rect x="160" y="345" width="44" height="36" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="182" y="369" fill="#1e293b" text-anchor="middle">3</text>
    <rect x="210" y="345" width="44" height="36" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="232" y="369" fill="#1e293b" text-anchor="middle">4</text>
  </g>
  <text x="335" y="340" font-family="monospace" font-size="13" fill="#f59e0b" text-anchor="middle">fn($acc,$n)=&gt;$acc+$n</text>
  <text x="335" y="385" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">$acc: 0→1→3→6→10</text>
  <line x1="430" y1="363" x2="520" y2="363" stroke="#475569" stroke-width="2.5" marker-end="url(#ma)"/>
  <rect x="540" y="343" width="80" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="580" y="370" font-family="monospace" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">10</text>
  <text x="675" y="368" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">bitta son</text>

  <line x1="30" y1="410" x2="730" y2="410" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Xulosa -->
  <text x="380" y="445" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Uchta asosiy fikr</text>
  <text x="380" y="470" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle">map — o'zgartir (soni o'zgarmaydi)</text>
  <text x="380" y="494" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a" text-anchor="middle">filter — tanla (soni kamayishi mumkin)</text>
  <text x="380" y="518" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#f59e0b" text-anchor="middle">reduce — yig' (bitta qiymat qoladi)</text>
</svg>
