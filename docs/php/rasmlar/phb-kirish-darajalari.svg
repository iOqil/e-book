<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>Kirish darajalari: public hamma joydan, protected class va bolalardan, private faqat shu class ichidan ko'rinadi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>

  <text x="380" y="32" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle">Kirish darajalari: qayerdan ko'rinadi?</text>
  <text x="380" y="54" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">public / protected / private</text>

  <defs>
    <marker id="oky" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="rad" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Class qutisi -->
  <rect x="250" y="80" width="260" height="150" rx="10" fill="#e2e8f0" stroke="#2563eb" stroke-width="2.5"/>
  <text x="380" y="106" font-family="monospace" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">class Hisob</text>
  <rect x="270" y="120" width="220" height="28" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="380" y="139" font-family="monospace" font-size="13" fill="#1e293b" text-anchor="middle">public $egasi</text>
  <rect x="270" y="153" width="220" height="28" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="380" y="172" font-family="monospace" font-size="13" fill="#1e293b" text-anchor="middle">protected $turi</text>
  <rect x="270" y="186" width="220" height="28" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="380" y="205" font-family="monospace" font-size="13" fill="#1e293b" text-anchor="middle">private $balans</text>

  <!-- Bola class (chap) -->
  <rect x="40" y="290" width="220" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="150" y="315" font-family="monospace" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Bola class</text>
  <text x="150" y="338" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">(extends Hisob)</text>

  <!-- Tashqarida (o'ng) -->
  <rect x="500" y="290" width="220" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="610" y="315" font-family="monospace" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Tashqarida</text>
  <text x="610" y="338" font-family="monospace" font-size="13" fill="#475569" text-anchor="middle">$h->...</text>

  <!-- public -> bola: ok -->
  <line x1="270" y1="134" x2="150" y2="290" stroke="#16a34a" stroke-width="2" marker-end="url(#oky)"/>
  <!-- public -> tashqari: ok -->
  <line x1="490" y1="134" x2="610" y2="290" stroke="#16a34a" stroke-width="2" marker-end="url(#oky)"/>

  <!-- protected -> bola: ok -->
  <line x1="270" y1="167" x2="170" y2="290" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#oky)"/>
  <!-- protected -> tashqari: yo'q -->
  <line x1="490" y1="167" x2="588" y2="290" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#rad)"/>

  <!-- private -> tashqari: yo'q -->
  <line x1="490" y1="200" x2="568" y2="292" stroke="#dc2626" stroke-width="2" marker-end="url(#rad)"/>
  <!-- private -> bola: yo'q -->
  <line x1="270" y1="200" x2="190" y2="290" stroke="#dc2626" stroke-width="2" marker-end="url(#rad)"/>

  <!-- Jadval / izoh -->
  <rect x="40" y="380" width="680" height="74" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="404" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b"><tspan font-weight="bold" fill="#16a34a">public</tspan>  — shu class + bola class + tashqaridan ko'rinadi (eng ochiq)</text>
  <text x="60" y="426" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b"><tspan font-weight="bold" fill="#f59e0b">protected</tspan> — faqat shu class va undan meros olgan bola class'lar ichidan</text>
  <text x="60" y="448" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b"><tspan font-weight="bold" fill="#dc2626">private</tspan>  — faqat shu class ichidan (eng yopiq)</text>
</svg>
