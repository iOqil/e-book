<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440" width="740" height="440">
  <title>MVC arxitekturasi: so'rov -&gt; Controller -&gt; Model/baza -&gt; View -&gt; javob</title>
  <rect x="0" y="0" width="740" height="440" fill="#f8fafc"/>

  <text x="370" y="30" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">MVC — so'rov qanday oqadi</text>

  <defs>
    <marker id="arM" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Browser -->
  <rect x="30" y="180" width="130" height="80" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="95" y="212" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Brauzer</text>
  <text x="95" y="234" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">foydalanuvchi</text>

  <!-- Controller -->
  <rect x="260" y="170" width="160" height="100" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="340" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Controller</text>
  <text x="340" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">boshqaruvchi</text>
  <text x="340" y="244" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">"nima qilinsin"</text>
  <text x="340" y="262" text-anchor="middle" font-family="monospace" font-size="13" fill="#1e293b">royxat.php</text>

  <!-- Model -->
  <rect x="540" y="60" width="170" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="625" y="90" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">Model</text>
  <text x="625" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ma'lumot + baza</text>
  <text x="625" y="132" text-anchor="middle" font-family="monospace" font-size="13" fill="#1e293b">SQL (SELECT...)</text>
  <text x="625" y="152" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">HTML yo'q</text>

  <!-- Database -->
  <ellipse cx="625" cy="300" rx="55" ry="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <rect x="570" y="300" width="110" height="55" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <line x1="570" y1="300" x2="570" y2="355" stroke="#16a34a" stroke-width="2"/>
  <line x1="680" y1="300" x2="680" y2="355" stroke="#16a34a" stroke-width="2"/>
  <ellipse cx="625" cy="355" rx="55" ry="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="625" y="335" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Baza</text>

  <!-- View -->
  <rect x="260" y="320" width="160" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="340" y="350" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">View</text>
  <text x="340" y="372" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ko'rinish (HTML)</text>
  <text x="340" y="394" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">SQL yo'q</text>

  <!-- 1: browser -> controller -->
  <line x1="162" y1="210" x2="256" y2="210" stroke="#475569" stroke-width="2.5" marker-end="url(#arM)"/>
  <text x="208" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">1. so'rov</text>

  <!-- 2: controller -> model -->
  <line x1="420" y1="190" x2="536" y2="125" stroke="#475569" stroke-width="2.5" marker-end="url(#arM)"/>
  <text x="478" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">2. ma'lumot so'ra</text>

  <!-- model <-> db -->
  <line x1="625" y1="162" x2="625" y2="280" stroke="#16a34a" stroke-width="2" marker-end="url(#arM)"/>
  <text x="660" y="225" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">SQL</text>

  <!-- 3: model -> controller (data) -->
  <line x1="536" y1="150" x2="422" y2="215" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arM)"/>
  <text x="500" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">3. qatorlar</text>

  <!-- 4: controller -> view -->
  <line x1="340" y1="272" x2="340" y2="316" stroke="#475569" stroke-width="2.5" marker-end="url(#arM)"/>
  <text x="405" y="298" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">4. ma'lumotni uzat</text>

  <!-- 5: view -> browser (response) -->
  <path d="M 260 365 Q 95 365 95 264" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arM)"/>
  <text x="160" y="385" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">5. javob (HTML)</text>
</svg>
