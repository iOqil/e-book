<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380">
  <title>Funksiya chaqiruvi: argumentlar kiradi, funksiya ichida hisoblanadi, return natijani qaytaradi</title>
  <rect x="0" y="0" width="760" height="380" fill="#f8fafc"/>

  <text x="380" y="36" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle">Funksiya chaqiruvi: kirish → hisob → qaytish</text>
  <text x="380" y="58" font-family="monospace" font-size="13" fill="#475569" text-anchor="middle">$natija = yigindi(5, 3);</text>

  <defs>
    <marker id="fa" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Argumentlar (chap) -->
  <rect x="40" y="150" width="150" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="178" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">Argumentlar</text>
  <text x="115" y="202" font-family="monospace" font-size="14" fill="#1e293b" text-anchor="middle">5,  3</text>
  <text x="115" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">(kirish qiymatlari)</text>

  <!-- Kirish strelkasi -->
  <line x1="190" y1="190" x2="280" y2="190" stroke="#475569" stroke-width="2.5" marker-end="url(#fa)"/>
  <text x="235" y="180" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">kiradi →</text>

  <!-- Funksiya qutisi (markaz) -->
  <rect x="285" y="120" width="200" height="140" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="285" y="120" width="200" height="30" rx="10" fill="#f59e0b"/>
  <text x="385" y="141" font-family="monospace" font-size="14" fill="#1e293b" text-anchor="middle">yigindi($a, $b)</text>
  <text x="385" y="178" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">$a = 5,  $b = 3</text>
  <rect x="305" y="190" width="160" height="34" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="385" y="212" font-family="monospace" font-size="13" fill="#1e293b" text-anchor="middle">return $a + $b;</text>
  <text x="385" y="245" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">ichida hisoblanadi</text>

  <!-- Chiqish strelkasi -->
  <line x1="485" y1="190" x2="575" y2="190" stroke="#475569" stroke-width="2.5" marker-end="url(#fa)"/>
  <text x="530" y="180" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">return →</text>

  <!-- Natija (o'ng) -->
  <rect x="580" y="150" width="150" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="655" y="178" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">Natija</text>
  <text x="655" y="204" font-family="monospace" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">8</text>
  <text x="655" y="223" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">$natija ga tushadi</text>

  <!-- Izoh -->
  <text x="380" y="305" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">Argumentlar parametrlarga (kirish) bog'lanadi, funksiya ichida</text>
  <text x="380" y="327" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">hisob bo'ladi, return qaytargan qiymat tashqarida ishlatiladi.</text>
  <text x="380" y="353" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">return bajarilgach funksiya darrov tugaydi.</text>
</svg>
