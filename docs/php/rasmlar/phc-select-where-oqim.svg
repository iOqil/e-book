<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" width="660" height="420">
  <title>SELECT ... WHERE so'rov oqimi: shartga mos qatorlar qanday tanlanadi</title>
  <rect x="0" y="0" width="660" height="420" fill="#f8fafc"/>

  <text x="330" y="30" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">SELECT * FROM talabalar WHERE yosh &gt; 20</text>

  <!-- Left: full table -->
  <text x="150" y="62" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#475569">Barcha qatorlar</text>

  <g font-family="monospace" font-size="14">
    <!-- header -->
    <rect x="40" y="74" width="60" height="34" fill="#2563eb"/>
    <rect x="100" y="74" width="120" height="34" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="70"  y="96" text-anchor="middle" fill="#ffffff" font-weight="bold">id</text>
    <text x="160" y="96" text-anchor="middle" fill="#1e293b" font-weight="bold">yosh</text>

    <!-- row id1 yosh19 : not match -->
    <rect x="40"  y="108" width="60"  height="34" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="100" y="108" width="120" height="34" fill="#ffffff" stroke="#94a3b8"/>
    <text x="70"  y="130" text-anchor="middle" fill="#94a3b8">1</text>
    <text x="160" y="130" text-anchor="middle" fill="#94a3b8">19</text>
    <text x="232" y="130" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">19 &gt; 20 ? yo'q</text>

    <!-- row id2 yosh22 : match -->
    <rect x="40"  y="142" width="60"  height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="100" y="142" width="120" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="70"  y="164" text-anchor="middle" fill="#1e293b">2</text>
    <text x="160" y="164" text-anchor="middle" fill="#1e293b">22</text>
    <text x="232" y="164" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">22 &gt; 20 ? ha</text>

    <!-- row id3 yosh19 : not match -->
    <rect x="40"  y="176" width="60"  height="34" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="100" y="176" width="120" height="34" fill="#ffffff" stroke="#94a3b8"/>
    <text x="70"  y="198" text-anchor="middle" fill="#94a3b8">3</text>
    <text x="160" y="198" text-anchor="middle" fill="#94a3b8">19</text>
    <text x="232" y="198" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">19 &gt; 20 ? yo'q</text>

    <!-- row id4 yosh25 : match -->
    <rect x="40"  y="210" width="60"  height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="100" y="210" width="120" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="70"  y="232" text-anchor="middle" fill="#1e293b">4</text>
    <text x="160" y="232" text-anchor="middle" fill="#1e293b">25</text>
    <text x="232" y="232" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">25 &gt; 20 ? ha</text>
  </g>

  <!-- WHERE filter box (middle) -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="360" y="120" width="120" height="100" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="420" y="158" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">WHERE</text>
    <text x="420" y="180" text-anchor="middle" font-size="14" fill="#1e293b">filtr</text>
    <text x="420" y="202" text-anchor="middle" font-size="13" fill="#475569">yosh &gt; 20</text>
  </g>

  <!-- arrow from table to filter -->
  <defs>
    <marker id="arrowSel" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <line x1="330" y1="170" x2="358" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arrowSel)"/>

  <!-- arrow from filter to result -->
  <line x1="482" y1="170" x2="512" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arrowSel)"/>

  <!-- Right: result -->
  <text x="585" y="62" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Natija (tanlangan)</text>
  <g font-family="monospace" font-size="14">
    <rect x="520" y="74" width="50" height="34" fill="#2563eb"/>
    <rect x="570" y="74" width="80" height="34" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="545" y="96" text-anchor="middle" fill="#ffffff" font-weight="bold">id</text>
    <text x="610" y="96" text-anchor="middle" fill="#1e293b" font-weight="bold">yosh</text>

    <rect x="520" y="108" width="50" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="570" y="108" width="80" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="545" y="130" text-anchor="middle" fill="#1e293b">2</text>
    <text x="610" y="130" text-anchor="middle" fill="#1e293b">22</text>

    <rect x="520" y="142" width="50" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="570" y="142" width="80" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="545" y="164" text-anchor="middle" fill="#1e293b">4</text>
    <text x="610" y="164" text-anchor="middle" fill="#1e293b">25</text>
  </g>

  <!-- bottom note -->
  <text x="330" y="296" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">WHERE har bir qatorni shart bilan tekshiradi:</text>
  <text x="330" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">shart rost (ha) bo'lsa — qator natijaga kiradi,</text>
  <text x="330" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">yolg'on (yo'q) bo'lsa — tashlab ketiladi.</text>

  <text x="330" y="382" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">SQL'da tenglik bitta = bilan (yosh = 20), taqqoslash: &gt; &lt; &gt;= &lt;= !=</text>
  <text x="330" y="404" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Bir nechta shart: AND (ikkalasi) yoki OR (bittasi yetadi)</text>
</svg>
