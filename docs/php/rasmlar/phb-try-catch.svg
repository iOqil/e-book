<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500">
  <title>try / catch / finally oqimi: try ichida xato bo'lsa catch ushlaydi, xato bo'lmasa catch o'tkazib yuboriladi, finally har ikki holatda ham bajariladi</title>
  <rect x="0" y="0" width="760" height="500" fill="#f8fafc"/>

  <text x="380" y="32" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle">try / catch / finally oqimi</text>
  <text x="380" y="54" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">xato bo'lsa — ushlanadi; dastur to'xtamaydi</text>

  <defs>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="agr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="agn" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- try bloki -->
  <rect x="280" y="74" width="200" height="68" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="380" y="100" font-family="monospace" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">try { ... }</text>
  <text x="380" y="124" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">"urinib ko'r"</text>

  <!-- Qaror romb: xato bo'ldimi? -->
  <polygon points="380,160 490,210 380,260 270,210" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="206" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">xato (throw)</text>
  <text x="380" y="224" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">bo'ldimi?</text>
  <line x1="380" y1="142" x2="380" y2="158" stroke="#475569" stroke-width="2" marker-end="url(#ag)"/>

  <!-- HA -> catch (chap) -->
  <line x1="270" y1="210" x2="160" y2="210" stroke="#dc2626" stroke-width="2.5" marker-end="url(#agr)"/>
  <text x="215" y="200" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">HA (xato)</text>
  <rect x="40" y="186" width="120" height="68" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="100" y="212" font-family="monospace" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">catch ($e)</text>
  <text x="100" y="234" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">"ushla"</text>

  <!-- YO'Q -> catch o'tkazib (o'ng) -->
  <line x1="490" y1="210" x2="600" y2="210" stroke="#16a34a" stroke-width="2.5" marker-end="url(#agn)"/>
  <text x="545" y="200" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">YO'Q</text>
  <rect x="600" y="186" width="120" height="68" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="208" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">catch</text>
  <text x="660" y="228" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">o'tkazib</text>
  <text x="660" y="246" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">yuboriladi</text>

  <!-- finally (markazda past) -->
  <line x1="100" y1="254" x2="320" y2="320" stroke="#475569" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="660" y1="254" x2="440" y2="320" stroke="#475569" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="280" y="324" width="200" height="68" rx="8" fill="#ede9fe" stroke="#9333ea" stroke-width="2.5"/>
  <text x="380" y="350" font-family="monospace" font-size="15" font-weight="bold" fill="#9333ea" text-anchor="middle">finally { ... }</text>
  <text x="380" y="374" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">HAR DOIM bajariladi</text>

  <!-- Davom -->
  <line x1="380" y1="392" x2="380" y2="414" stroke="#475569" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="280" y="416" width="200" height="40" rx="8" fill="#2563eb"/>
  <text x="380" y="441" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">dastur davom etadi</text>

  <!-- Izoh -->
  <text x="380" y="482" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Xato bo'lsa ham dastur qulamaydi: catch xabar beradi, finally tozalaydi, kod davom etadi.</text>
</svg>
