<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" width="700" height="430">
  <title>PDO ulanish oqimi: PHP -&gt; PDO prepared statement -&gt; baza -&gt; natija</title>
  <rect x="0" y="0" width="700" height="430" fill="#f8fafc"/>

  <text x="350" y="30" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">PDO ulanish oqimi (prepared statement)</text>

  <defs>
    <marker id="arrowPdo" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- PHP box -->
  <rect x="30" y="70" width="150" height="120" rx="10" fill="#e2e8f0" stroke="#2563eb" stroke-width="2"/>
  <text x="105" y="96" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">PHP kodi</text>
  <text x="105" y="122" text-anchor="middle" font-family="monospace" font-size="13" fill="#1e293b">$id = $_GET['id'];</text>
  <text x="105" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">foydalanuvchidan</text>
  <text x="105" y="168" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">kelgan qiymat</text>

  <!-- PDO box -->
  <rect x="250" y="62" width="200" height="136" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="350" y="88" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">PDO</text>
  <text x="350" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(PHP Data Objects)</text>

  <line x1="262" y1="120" x2="438" y2="120" stroke="#f59e0b" stroke-width="1"/>
  <text x="350" y="140" text-anchor="middle" font-family="monospace" font-size="13" fill="#1e293b">1. prepare("... id = ?")</text>
  <text x="350" y="162" text-anchor="middle" font-family="monospace" font-size="13" fill="#1e293b">2. execute([$id])</text>
  <text x="350" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">qiymat ALOHIDA, xavfsiz</text>

  <!-- Baza box -->
  <rect x="520" y="70" width="150" height="120" rx="10" fill="#e2e8f0" stroke="#16a34a" stroke-width="2"/>
  <!-- cylinder hint -->
  <ellipse cx="595" cy="100" rx="42" ry="12" fill="#dcfce7" stroke="#16a34a"/>
  <text x="595" y="105" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Baza</text>
  <text x="595" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">MySQL</text>
  <text x="595" y="162" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">talabalar</text>
  <text x="595" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">jadvali</text>

  <!-- arrows PHP -> PDO -->
  <line x1="182" y1="120" x2="246" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#arrowPdo)"/>
  <text x="214" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">$id</text>

  <!-- arrows PDO -> Baza -->
  <line x1="452" y1="130" x2="516" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#arrowPdo)"/>
  <text x="484" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">so'rov</text>

  <!-- arrows Baza -> PDO (result) -->
  <line x1="516" y1="160" x2="452" y2="160" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowPdoG)"/>
  <defs>
    <marker id="arrowPdoG" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <text x="484" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">qatorlar</text>

  <!-- down arrow PDO -> result -->
  <line x1="350" y1="200" x2="350" y2="240" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowPdoDown)"/>
  <defs>
    <marker id="arrowPdoDown" markerWidth="12" markerHeight="12" refX="4" refY="9" orient="auto">
      <path d="M0,0 L8,0 L4,9 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Result box -->
  <rect x="220" y="248" width="260" height="74" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="350" y="272" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Natija — PHP'ga qaytadi</text>
  <text x="350" y="296" text-anchor="middle" font-family="monospace" font-size="13" fill="#1e293b">$talaba = $stmt-&gt;fetch();</text>
  <text x="350" y="315" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">kalitli massiv: $talaba['ism']</text>

  <!-- Why safe note -->
  <rect x="40" y="346" width="620" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="350" y="370" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">Nega ? va execute([...]) xavfsiz?</text>
  <text x="350" y="392" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Qiymat so'rov matniga emas, ALOHIDA "ma'lumot" sifatida yuboriladi —</text>
  <text x="350" y="410" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">u hech qachon SQL buyruq sifatida bajarilmaydi (SQL injection oldi olinadi).</text>
</svg>
