<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470">
  <title>KMP — LPS (failure) massivi: eng uzun bir xil prefiks-suffiks uzunligi</title>
  <rect x="0" y="0" width="840" height="470" fill="#f8fafc"/>
  <text x="420" y="30" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">KMP — LPS (failure) massivi</text>
  <text x="420" y="54" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">lps[i] = pattern[0..i] da prefiks ham, suffiks ham bo'lgan eng uzun bo'lak uzunligi</text>

  <text x="420" y="86" text-anchor="middle" font-family="monospace" font-size="15" fill="#1e293b">Naqsh: "A B A B C A B A B"</text>

  <!-- pattern hujayralari -->
  <g font-family="monospace" font-size="20" font-weight="bold">
    <rect x="60" y="100" width="80" height="46" fill="#e2e8f0" stroke="#94a3b8"/><text x="100" y="131" text-anchor="middle" fill="#1e293b">A</text>
    <rect x="140" y="100" width="80" height="46" fill="#e2e8f0" stroke="#94a3b8"/><text x="180" y="131" text-anchor="middle" fill="#1e293b">B</text>
    <rect x="220" y="100" width="80" height="46" fill="#e2e8f0" stroke="#94a3b8"/><text x="260" y="131" text-anchor="middle" fill="#1e293b">A</text>
    <rect x="300" y="100" width="80" height="46" fill="#e2e8f0" stroke="#94a3b8"/><text x="340" y="131" text-anchor="middle" fill="#1e293b">B</text>
    <rect x="380" y="100" width="80" height="46" fill="#fee2e2" stroke="#dc2626"/><text x="420" y="131" text-anchor="middle" fill="#1e293b">C</text>
    <rect x="460" y="100" width="80" height="46" fill="#e2e8f0" stroke="#94a3b8"/><text x="500" y="131" text-anchor="middle" fill="#1e293b">A</text>
    <rect x="540" y="100" width="80" height="46" fill="#e2e8f0" stroke="#94a3b8"/><text x="580" y="131" text-anchor="middle" fill="#1e293b">B</text>
    <rect x="620" y="100" width="80" height="46" fill="#e2e8f0" stroke="#94a3b8"/><text x="660" y="131" text-anchor="middle" fill="#1e293b">A</text>
    <rect x="700" y="100" width="80" height="46" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="740" y="131" text-anchor="middle" fill="#1e293b">B</text>
  </g>
  <!-- indekslar -->
  <g font-family="monospace" font-size="13" fill="#94a3b8">
    <text x="100" y="165" text-anchor="middle">i=0</text>
    <text x="180" y="165" text-anchor="middle">1</text>
    <text x="260" y="165" text-anchor="middle">2</text>
    <text x="340" y="165" text-anchor="middle">3</text>
    <text x="420" y="165" text-anchor="middle">4</text>
    <text x="500" y="165" text-anchor="middle">5</text>
    <text x="580" y="165" text-anchor="middle">6</text>
    <text x="660" y="165" text-anchor="middle">7</text>
    <text x="740" y="165" text-anchor="middle">8</text>
  </g>

  <!-- lps qatori -->
  <text x="100" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">lps:</text>
  <g font-family="monospace" font-size="18" font-weight="bold">
    <rect x="60" y="208" width="80" height="42" fill="#dbeafe" stroke="#2563eb"/><text x="100" y="235" text-anchor="middle" fill="#1e293b">0</text>
    <rect x="140" y="208" width="80" height="42" fill="#dbeafe" stroke="#2563eb"/><text x="180" y="235" text-anchor="middle" fill="#1e293b">0</text>
    <rect x="220" y="208" width="80" height="42" fill="#dbeafe" stroke="#2563eb"/><text x="260" y="235" text-anchor="middle" fill="#1e293b">1</text>
    <rect x="300" y="208" width="80" height="42" fill="#dbeafe" stroke="#2563eb"/><text x="340" y="235" text-anchor="middle" fill="#1e293b">2</text>
    <rect x="380" y="208" width="80" height="42" fill="#fee2e2" stroke="#dc2626"/><text x="420" y="235" text-anchor="middle" fill="#1e293b">0</text>
    <rect x="460" y="208" width="80" height="42" fill="#dbeafe" stroke="#2563eb"/><text x="500" y="235" text-anchor="middle" fill="#1e293b">1</text>
    <rect x="540" y="208" width="80" height="42" fill="#dbeafe" stroke="#2563eb"/><text x="580" y="235" text-anchor="middle" fill="#1e293b">2</text>
    <rect x="620" y="208" width="80" height="42" fill="#dbeafe" stroke="#2563eb"/><text x="660" y="235" text-anchor="middle" fill="#1e293b">3</text>
    <rect x="700" y="208" width="80" height="42" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="740" y="235" text-anchor="middle" fill="#1e293b">4</text>
  </g>

  <!-- misol: i=7 lps=3 -->
  <rect x="60" y="278" width="720" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="80" y="304" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Misol — i=8 (oxirgi belgi), lps[8] = 4:</text>
  <text x="80" y="330" font-family="monospace" font-size="14" fill="#16a34a">prefiks "ABAB" (boshidan)  =  suffiks "ABAB" (oxiridan)  →  uzunligi 4</text>
  <text x="80" y="350" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">"ABABCABAB" ning boshi va oxiri "ABAB" da mos keladi (5 ta belgi farqli).</text>

  <!-- nega kerak: mos kelmaslikda sakrash -->
  <rect x="60" y="368" width="720" height="86" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="80" y="394" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Nega foydali? — mos kelmaganda orqaga qaytmaslik uchun</text>
  <text x="80" y="418" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Matnda naqsh j-pozitsiyada uzilsa, matn indeksi i ni QAYTARMAY, naqshni</text>
  <text x="80" y="440" font-family="monospace" font-size="14" fill="#1e293b">j = lps[j − 1]   ga siljitamiz  →  jami O(n + m), takror tekshiruvsiz.</text>
</svg>
