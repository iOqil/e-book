<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400">
  <title>Level-order (BFS) traversal — daraxt qatlam-qatlam, navbat yordamida</title>
  <rect x="0" y="0" width="560" height="400" fill="#f8fafc"/>
  <text x="280" y="30" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#1e293b" text-anchor="middle">Level-order traversal (BFS) — qatlam bo'yicha</text>

  <!-- qatlam chiziqlari -->
  <line x1="20" y1="80" x2="40" y2="80" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="40" y="64" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b" text-anchor="start">qatlam 0</text>
  <text x="40" y="134" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b" text-anchor="start">qatlam 1</text>
  <text x="40" y="204" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b" text-anchor="start">qatlam 2</text>

  <!-- qirralar -->
  <line x1="280" y1="80" x2="190" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <line x1="280" y1="80" x2="370" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <line x1="190" y1="150" x2="130" y2="220" stroke="#94a3b8" stroke-width="2"/>
  <line x1="190" y1="150" x2="250" y2="220" stroke="#94a3b8" stroke-width="2"/>
  <line x1="370" y1="150" x2="430" y2="220" stroke="#94a3b8" stroke-width="2"/>

  <!-- tugunlar, BFS tartib raqami bilan -->
  <circle cx="280" cy="80" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="280" y="86" font-family="monospace" font-size="16" fill="#1e293b" text-anchor="middle">8</text>
  <text x="306" y="70" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="start">1</text>

  <circle cx="190" cy="150" r="24" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="190" y="156" font-family="monospace" font-size="16" fill="#1e293b" text-anchor="middle">3</text>
  <text x="216" y="140" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="start">2</text>

  <circle cx="370" cy="150" r="24" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="370" y="156" font-family="monospace" font-size="16" fill="#1e293b" text-anchor="middle">10</text>
  <text x="396" y="140" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="start">3</text>

  <circle cx="130" cy="220" r="24" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="130" y="226" font-family="monospace" font-size="16" fill="#1e293b" text-anchor="middle">1</text>
  <text x="156" y="210" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="start">4</text>

  <circle cx="250" cy="220" r="24" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="250" y="226" font-family="monospace" font-size="16" fill="#1e293b" text-anchor="middle">6</text>
  <text x="276" y="210" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="start">5</text>

  <circle cx="430" cy="220" r="24" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="430" y="226" font-family="monospace" font-size="16" fill="#1e293b" text-anchor="middle">14</text>
  <text x="456" y="210" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="start">6</text>

  <text x="500" y="86" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626" text-anchor="end">qizil = tashrif tartibi</text>

  <!-- natija lentasi -->
  <text x="280" y="292" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Navbat tartibi natijasi:</text>
  <g font-family="monospace" font-size="16" fill="#1e293b" text-anchor="middle">
    <rect x="70" y="308" width="56" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="98" y="334">8</text>
    <rect x="134" y="308" width="56" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="162" y="334">3</text>
    <rect x="198" y="308" width="56" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="226" y="334">10</text>
    <rect x="262" y="308" width="56" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="290" y="334">1</text>
    <rect x="326" y="308" width="56" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="354" y="334">6</text>
    <rect x="390" y="308" width="56" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="418" y="334">14</text>
  </g>
  <text x="280" y="378" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Navbatga root qo'yiladi; har chiqarilgan tugun bolalarini navbat oxiriga qo'shadi</text>
</svg>
