<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>Monoton stek — keyingi katta element (next greater element) ishlash tartibi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="30" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#1e293b" text-anchor="middle">Monoton stek — keyingi katta element</text>
  <text x="380" y="52" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">nums = [2, 1, 2, 4, 3] · stekda kamayuvchi qiymatli INDEKSlar saqlanadi</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- massiv -->
  <text x="60" y="86" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">i:</text>
  <g font-family="monospace" font-size="16" fill="#1e293b" text-anchor="middle">
    <rect x="90" y="70" width="56" height="44" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="118" y="98">2</text>
    <rect x="146" y="70" width="56" height="44" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="174" y="98">1</text>
    <rect x="202" y="70" width="56" height="44" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="230" y="98">2</text>
    <rect x="258" y="70" width="56" height="44" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="286" y="98">4</text>
    <rect x="314" y="70" width="56" height="44" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="342" y="98">3</text>
  </g>
  <g font-family="monospace" font-size="13" fill="#64748b" text-anchor="middle">
    <text x="118" y="128">0</text><text x="174" y="128">1</text><text x="230" y="128">2</text><text x="286" y="128">3</text><text x="342" y="128">4</text>
  </g>
  <text x="420" y="98" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">natija: [4, 2, 4, -1, -1]</text>

  <!-- qoida -->
  <rect x="470" y="62" width="278" height="64" fill="#fef9c3" stroke="#f59e0b" stroke-width="2" rx="6"/>
  <text x="484" y="84" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">Qoida (har i uchun):</text>
  <text x="484" y="104" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">nums[i] &gt; stek tepasidagi qiymat ekan,</text>
  <text x="484" y="120" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">pop qil → o'sha indeksga javob = nums[i]</text>

  <!-- bosqichlar sarlavhasi -->
  <text x="380" y="166" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">Stek holati har qadamda (qiymatlar kamayuvchi tartibda)</text>

  <!-- 5 ta qadam: har biri stekni va amalni ko'rsatadi -->
  <!-- Qadam 1: i=0 push 2 -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <text x="80" y="196" font-size="13" font-weight="bold" fill="#475569">i=0 → 2</text>
    <rect x="50" y="206" width="60" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="80" y="229" font-family="monospace" font-size="15" fill="#1e293b" text-anchor="middle">2</text>
    <text x="80" y="262" font-size="13" fill="#16a34a" text-anchor="middle">push</text>
  </g>
  <line x1="118" y1="222" x2="142" y2="222" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Qadam 2: i=1 push 1 -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <text x="195" y="196" font-size="13" font-weight="bold" fill="#475569">i=1 → 1</text>
    <rect x="165" y="206" width="60" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="195" y="229" font-family="monospace" font-size="15" fill="#1e293b" text-anchor="middle">1</text>
    <rect x="165" y="240" width="60" height="34" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <text x="195" y="263" font-family="monospace" font-size="15" fill="#1e293b" text-anchor="middle">2</text>
    <text x="195" y="296" font-size="13" fill="#16a34a" text-anchor="middle">1&lt;2: push</text>
  </g>
  <line x1="233" y1="240" x2="257" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Qadam 3: i=2 val 2 -> pop 1 -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <text x="312" y="196" font-size="13" font-weight="bold" fill="#475569">i=2 → 2</text>
    <rect x="282" y="206" width="60" height="34" fill="#fee2e2" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="312" y="229" font-family="monospace" font-size="15" fill="#dc2626" text-anchor="middle">1</text>
    <rect x="282" y="240" width="60" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="312" y="263" font-family="monospace" font-size="15" fill="#1e293b" text-anchor="middle">2</text>
    <text x="312" y="296" font-size="13" fill="#dc2626" text-anchor="middle">2&gt;1: pop→res[1]=2</text>
    <text x="312" y="312" font-size="13" fill="#16a34a" text-anchor="middle">so'ng 2 ni push</text>
  </g>
  <line x1="350" y1="240" x2="374" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Qadam 4: i=3 val 4 -> pop 2,2 -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <text x="430" y="196" font-size="13" font-weight="bold" fill="#475569">i=3 → 4</text>
    <rect x="400" y="206" width="60" height="34" fill="#fee2e2" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="430" y="229" font-family="monospace" font-size="15" fill="#dc2626" text-anchor="middle">2</text>
    <rect x="400" y="240" width="60" height="34" fill="#fee2e2" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="430" y="263" font-family="monospace" font-size="15" fill="#dc2626" text-anchor="middle">2</text>
    <text x="430" y="296" font-size="13" fill="#dc2626" text-anchor="middle">4&gt;2,2: ikkala pop</text>
    <text x="430" y="312" font-size="13" fill="#dc2626" text-anchor="middle">res[2]=4, res[0]=4</text>
  </g>
  <line x1="468" y1="240" x2="492" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Qadam 5: i=4 val 3 push (stek=[4]) -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <text x="548" y="196" font-size="13" font-weight="bold" fill="#475569">i=4 → 3</text>
    <rect x="518" y="206" width="60" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="548" y="229" font-family="monospace" font-size="15" fill="#1e293b" text-anchor="middle">3</text>
    <rect x="518" y="240" width="60" height="34" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <text x="548" y="263" font-family="monospace" font-size="15" fill="#1e293b" text-anchor="middle">4</text>
    <text x="548" y="296" font-size="13" fill="#16a34a" text-anchor="middle">3&lt;4: push</text>
  </g>

  <!-- oxirgi holat -->
  <text x="700" y="225" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">stekda</text>
  <text x="700" y="241" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">qolgan</text>
  <text x="700" y="257" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">→ -1</text>

  <!-- pastki izoh -->
  <rect x="50" y="338" width="660" height="106" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" rx="6"/>
  <text x="68" y="362" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Nega O(n)?</text>
  <text x="68" y="384" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Har indeks stekka FAQAT bir marta kiradi va FAQAT bir marta chiqadi (pop).</text>
  <text x="68" y="404" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Stek pastdan tepaga kamayuvchi bo'lib qoladi: yangi katta qiymat kelganda</text>
  <text x="68" y="424" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">o'zidan kichik tepalarni "yutib" yuboradi — o'sha tepalar uchun javob shu qiymat.</text>
</svg>
