<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560">
  <title>Dijkstra eng qisqa yo'l — har qadamda eng yaqin tugunni olib, qo'shnilarini yumshatamiz</title>
  <rect x="0" y="0" width="760" height="560" fill="#f8fafc"/>
  <text x="380" y="30" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Dijkstra — eng qisqa yo'l qadamlari</text>
  <text x="380" y="54" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Manbadan (A) boshlab, eng kichik masofali tugunni tanlab qo'shnilarni yangilaymiz</text>

  <defs>
    <marker id="dj" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- ===== graph ===== -->
  <!-- edges with weights -->
  <!-- A-B 4 -->
  <line x1="148" y1="150" x2="290" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <text x="210" y="124" font-family="monospace" font-size="14" fill="#dc2626">4</text>
  <!-- A-C 1 -->
  <line x1="140" y1="170" x2="280" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <text x="200" y="212" font-family="monospace" font-size="14" fill="#dc2626">1</text>
  <!-- C-B 2 -->
  <line x1="300" y1="218" x2="310" y2="138" stroke="#94a3b8" stroke-width="2"/>
  <text x="318" y="182" font-family="monospace" font-size="14" fill="#dc2626">2</text>
  <!-- C-D 5 -->
  <line x1="318" y1="238" x2="448" y2="248" stroke="#94a3b8" stroke-width="2"/>
  <text x="378" y="232" font-family="monospace" font-size="14" fill="#dc2626">5</text>
  <!-- B-D 1 -->
  <line x1="328" y1="128" x2="450" y2="228" stroke="#94a3b8" stroke-width="2"/>
  <text x="396" y="168" font-family="monospace" font-size="14" fill="#dc2626">1</text>

  <!-- nodes -->
  <circle cx="125" cy="160" r="22" fill="#16a34a"/>
  <text x="125" y="166" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#ffffff" font-weight="bold">A</text>
  <text x="125" y="118" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">d=0 (manba)</text>

  <circle cx="310" cy="118" r="22" fill="#2563eb"/>
  <text x="310" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#ffffff" font-weight="bold">B</text>
  <text x="310" y="86" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">d=3</text>

  <circle cx="300" cy="240" r="22" fill="#2563eb"/>
  <text x="300" y="246" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#ffffff" font-weight="bold">C</text>
  <text x="300" y="282" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">d=1</text>

  <circle cx="470" cy="240" r="22" fill="#2563eb"/>
  <text x="470" y="246" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#ffffff" font-weight="bold">D</text>
  <text x="470" y="282" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">d=4</text>

  <!-- shortest path highlight A->C->B->D = 1+2+1=4 -->
  <text x="560" y="120" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Eng qisqa yo'l A→D:</text>
  <text x="560" y="144" font-family="monospace" font-size="14" fill="#1e293b">A → C → B → D</text>
  <text x="560" y="166" font-family="monospace" font-size="14" fill="#1e293b">1 + 2 + 1 = 4</text>
  <text x="560" y="196" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(to'g'ridan A→B→D = 4+1=5</text>
  <text x="560" y="214" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">  dan yaxshiroq)</text>

  <!-- ===== step table ===== -->
  <text x="100" y="330" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Qadamma-qadam (min-heap dan eng yaqinni olamiz):</text>

  <g font-family="monospace" font-size="13">
    <!-- header -->
    <rect x="100" y="346" width="120" height="30" fill="#2563eb"/>
    <rect x="220" y="346" width="110" height="30" fill="#2563eb"/>
    <rect x="330" y="346" width="330" height="30" fill="#2563eb"/>
    <text x="160" y="366" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, system-ui, sans-serif" font-size="13">olingan tugun</text>
    <text x="275" y="366" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, system-ui, sans-serif" font-size="13">masofa</text>
    <text x="495" y="366" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, system-ui, sans-serif" font-size="13">qo'shnilarni yumshatish (relax)</text>

    <!-- rows -->
    <rect x="100" y="376" width="120" height="30" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="220" y="376" width="110" height="30" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="330" y="376" width="330" height="30" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="160" y="396" text-anchor="middle" fill="#16a34a">A</text>
    <text x="275" y="396" text-anchor="middle" fill="#1e293b">0</text>
    <text x="345" y="396" fill="#1e293b">B=4, C=1</text>

    <rect x="100" y="406" width="120" height="30" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="220" y="406" width="110" height="30" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="330" y="406" width="330" height="30" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="160" y="426" text-anchor="middle" fill="#1e293b">C</text>
    <text x="275" y="426" text-anchor="middle" fill="#1e293b">1</text>
    <text x="345" y="426" fill="#1e293b">B: 1+2=3 &lt; 4 ✓, D=1+5=6</text>

    <rect x="100" y="436" width="120" height="30" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="220" y="436" width="110" height="30" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="330" y="436" width="330" height="30" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="160" y="456" text-anchor="middle" fill="#1e293b">B</text>
    <text x="275" y="456" text-anchor="middle" fill="#1e293b">3</text>
    <text x="345" y="456" fill="#1e293b">D: 3+1=4 &lt; 6 ✓</text>

    <rect x="100" y="466" width="120" height="30" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="220" y="466" width="110" height="30" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="330" y="466" width="330" height="30" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="160" y="486" text-anchor="middle" fill="#1e293b">D</text>
    <text x="275" y="486" text-anchor="middle" fill="#16a34a">4</text>
    <text x="345" y="486" fill="#16a34a">tugadi — D ning yakuniy masofasi</text>
  </g>

  <text x="100" y="524" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Yumshatish: agar d[u]+w(u,v) &lt; d[v] bo'lsa, d[v] yangilanadi va prev[v]=u (yo'lni tiklash uchun).</text>
</svg>
