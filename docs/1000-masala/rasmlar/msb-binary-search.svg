<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>Ikkilik qidiruv: saralangan massivda har qadamda o'rtani tekshirib, qidiruv oralig'ini yarmiga qisqartirish</title>
  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>
  <defs>
    <marker id="sa" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Ikkilik qidiruv — x = 7 ni topish</text>
  <text x="360" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Saralangan massiv. Har qadamda o'rtani (mid) tekshiramiz, yarmini tashlaymiz</text>

  <!-- Indekslar -->
  <g font-family="monospace" font-size="13" text-anchor="middle" fill="#475569">
    <text x="95" y="78">0</text><text x="165" y="78">1</text><text x="235" y="78">2</text><text x="305" y="78">3</text>
    <text x="375" y="78">4</text><text x="445" y="78">5</text><text x="515" y="78">6</text><text x="585" y="78">7</text>
  </g>

  <!-- Qadam 1: butun oraliq, mid = 3 (qiymat 5) -->
  <text x="40" y="108" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">1-qadam: lo=0, hi=7, mid=3 → a[3]=5 &lt; 7 → o'ngga (lo=mid+1)</text>
  <g font-family="monospace" font-size="16" text-anchor="middle">
    <rect x="70" y="116" width="50" height="40" rx="5" fill="#e2e8f0" stroke="#94a3b8"/><text x="95" y="142" fill="#1e293b">1</text>
    <rect x="140" y="116" width="50" height="40" rx="5" fill="#e2e8f0" stroke="#94a3b8"/><text x="165" y="142" fill="#1e293b">3</text>
    <rect x="210" y="116" width="50" height="40" rx="5" fill="#e2e8f0" stroke="#94a3b8"/><text x="235" y="142" fill="#1e293b">4</text>
    <rect x="280" y="116" width="50" height="40" rx="5" fill="#f59e0b" stroke="#94a3b8"/><text x="305" y="142" fill="#1e293b">5</text>
    <rect x="350" y="116" width="50" height="40" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="375" y="142" fill="#1e293b">7</text>
    <rect x="420" y="116" width="50" height="40" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="445" y="142" fill="#1e293b">9</text>
    <rect x="490" y="116" width="50" height="40" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="515" y="142" fill="#1e293b">12</text>
    <rect x="560" y="116" width="50" height="40" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="585" y="142" fill="#1e293b">15</text>
  </g>
  <text x="305" y="174" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#f59e0b">mid</text>
  <text x="480" y="174" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">qoladigan yarim</text>

  <!-- Qadam 2: o'ng yarim, mid = 5 (qiymat 9) -->
  <text x="40" y="210" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">2-qadam: lo=4, hi=7, mid=5 → a[5]=9 &gt; 7 → chapga (hi=mid-1)</text>
  <g font-family="monospace" font-size="16" text-anchor="middle">
    <rect x="70" y="218" width="50" height="40" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/><text x="95" y="244" fill="#94a3b8">1</text>
    <rect x="140" y="218" width="50" height="40" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/><text x="165" y="244" fill="#94a3b8">3</text>
    <rect x="210" y="218" width="50" height="40" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/><text x="235" y="244" fill="#94a3b8">4</text>
    <rect x="280" y="218" width="50" height="40" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/><text x="305" y="244" fill="#94a3b8">5</text>
    <rect x="350" y="218" width="50" height="40" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="375" y="244" fill="#1e293b">7</text>
    <rect x="420" y="218" width="50" height="40" rx="5" fill="#f59e0b" stroke="#94a3b8"/><text x="445" y="244" fill="#1e293b">9</text>
    <rect x="490" y="218" width="50" height="40" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/><text x="515" y="244" fill="#94a3b8">12</text>
    <rect x="560" y="218" width="50" height="40" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/><text x="585" y="244" fill="#94a3b8">15</text>
  </g>
  <text x="445" y="276" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#f59e0b">mid</text>
  <text x="375" y="276" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">qoladigan yarim</text>

  <!-- Qadam 3: topildi, mid = 4 (qiymat 7) -->
  <text x="40" y="312" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">3-qadam: lo=4, hi=4, mid=4 → a[4]=7 = x → topildi! return 4</text>
  <g font-family="monospace" font-size="16" text-anchor="middle">
    <rect x="70" y="320" width="50" height="40" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/><text x="95" y="346" fill="#94a3b8">1</text>
    <rect x="140" y="320" width="50" height="40" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/><text x="165" y="346" fill="#94a3b8">3</text>
    <rect x="210" y="320" width="50" height="40" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/><text x="235" y="346" fill="#94a3b8">4</text>
    <rect x="280" y="320" width="50" height="40" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/><text x="305" y="346" fill="#94a3b8">5</text>
    <rect x="350" y="320" width="50" height="40" rx="5" fill="#16a34a" stroke="#94a3b8"/><text x="375" y="346" fill="#f8fafc">7</text>
    <rect x="420" y="320" width="50" height="40" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/><text x="445" y="346" fill="#94a3b8">9</text>
    <rect x="490" y="320" width="50" height="40" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/><text x="515" y="346" fill="#94a3b8">12</text>
    <rect x="560" y="320" width="50" height="40" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/><text x="585" y="346" fill="#94a3b8">15</text>
  </g>
  <text x="375" y="378" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" font-weight="bold">topildi</text>

  <rect x="40" y="396" width="640" height="32" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="52" y="416" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Har qadamda oraliq yarmiga qisqaradi: 8 → 4 → 2 → 1 element. Shuning uchun O(log n).</text>
</svg>
