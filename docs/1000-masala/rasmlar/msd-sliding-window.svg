<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" width="840" height="480">
  <title>Sliding window: takrorsiz eng uzun qism-satr, oyna siljishi s = "abcab"</title>
  <rect x="0" y="0" width="840" height="480" fill="#f8fafc"/>
  <text x="30" y="32" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#2563eb">Siljuvchi oyna — takrorsiz eng uzun qism-satr</text>
  <text x="30" y="55" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">s = "a b c a b" · i oynani o'ngga kengaytiradi; takror topilsa start oldinga "sakraydi".</text>

  <!-- column index header used by all rows -->
  <g font-family="monospace" font-size="13" fill="#475569" text-anchor="middle">
    <text x="150" y="92">0:a</text><text x="230" y="92">1:b</text><text x="310" y="92">2:c</text><text x="390" y="92">3:a</text><text x="470" y="92">4:b</text>
  </g>

  <!-- STEP 1: window [0..2] abc, all unique, best=3 -->
  <g font-family="monospace" font-size="18" text-anchor="middle" fill="#1e293b">
    <rect x="120" y="100" width="60" height="44" fill="#dcfce7" stroke="#16a34a"/><text x="150" y="130">a</text>
    <rect x="200" y="100" width="60" height="44" fill="#dcfce7" stroke="#16a34a"/><text x="230" y="130">b</text>
    <rect x="280" y="100" width="60" height="44" fill="#dcfce7" stroke="#16a34a"/><text x="310" y="130">c</text>
    <rect x="360" y="100" width="60" height="44" fill="#fff" stroke="#94a3b8"/><text x="390" y="130">a</text>
    <rect x="440" y="100" width="60" height="44" fill="#fff" stroke="#94a3b8"/><text x="470" y="130">b</text>
  </g>
  <rect x="118" y="98" width="224" height="48" fill="none" stroke="#16a34a" stroke-width="3" rx="4"/>
  <text x="150" y="164" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">start</text>
  <text x="310" y="164" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">i</text>
  <text x="540" y="130" font-family="monospace" font-size="14" fill="#16a34a">"abc" — takror yo'q · best = 3</text>

  <!-- STEP 2: i=3 'a' repeats; start jumps past first 'a' -->
  <g font-family="monospace" font-size="18" text-anchor="middle" fill="#1e293b">
    <rect x="120" y="196" width="60" height="44" fill="#fef2f2" stroke="#dc2626"/><text x="150" y="226">a</text>
    <rect x="200" y="196" width="60" height="44" fill="#fff" stroke="#94a3b8"/><text x="230" y="226">b</text>
    <rect x="280" y="196" width="60" height="44" fill="#fff" stroke="#94a3b8"/><text x="310" y="226">c</text>
    <rect x="360" y="196" width="60" height="44" fill="#fde68a" stroke="#f59e0b"/><text x="390" y="226">a</text>
    <rect x="440" y="196" width="60" height="44" fill="#fff" stroke="#94a3b8"/><text x="470" y="226">b</text>
  </g>
  <defs>
    <marker id="msw-ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#f59e0b"/>
    </marker>
  </defs>
  <path d="M 150 252 Q 250 290 226 252" stroke="#f59e0b" stroke-width="2.2" fill="none" marker-end="url(#msw-ar)"/>
  <text x="390" y="260" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#f59e0b" text-anchor="middle">i — takror 'a'</text>
  <text x="540" y="216" font-family="monospace" font-size="14" fill="#dc2626">'a' takrorlandi (poz. 0)</text>
  <text x="540" y="238" font-family="monospace" font-size="14" fill="#f59e0b">start = 0+1 = 1 (sakraydi)</text>

  <!-- STEP 3: window [1..3] bca, unique again, best stays 3 -->
  <g font-family="monospace" font-size="18" text-anchor="middle" fill="#1e293b">
    <rect x="120" y="300" width="60" height="44" fill="#e2e8f0" stroke="#94a3b8"/><text x="150" y="330">a</text>
    <rect x="200" y="300" width="60" height="44" fill="#dcfce7" stroke="#16a34a"/><text x="230" y="330">b</text>
    <rect x="280" y="300" width="60" height="44" fill="#dcfce7" stroke="#16a34a"/><text x="310" y="330">c</text>
    <rect x="360" y="300" width="60" height="44" fill="#dcfce7" stroke="#16a34a"/><text x="390" y="330">a</text>
    <rect x="440" y="300" width="60" height="44" fill="#fff" stroke="#94a3b8"/><text x="470" y="330">b</text>
  </g>
  <rect x="198" y="298" width="224" height="48" fill="none" stroke="#16a34a" stroke-width="3" rx="4"/>
  <text x="230" y="364" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">start</text>
  <text x="390" y="364" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">i</text>
  <text x="540" y="330" font-family="monospace" font-size="14" fill="#16a34a">"bca" — yana takrorsiz · best = 3</text>

  <text x="30" y="412" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Oyna kengligi = i − start + 1. Har belgi oynaga ko'pi bilan bir marta kiradi va bir marta chiqadi,</text>
  <text x="30" y="434" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">shuning uchun butun jarayon ⏱ O(n) · 💾 O(k) (k — alifbo hajmi). Qaytadan sanash shart emas.</text>
  <text x="30" y="462" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Yashil = joriy oyna · Qizil = takror sodir bo'lgan belgi · Sariq strelka = start ning sakrashi.</text>
</svg>
