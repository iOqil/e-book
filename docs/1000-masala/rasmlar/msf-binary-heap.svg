<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470">
  <title>Binary heap — massiv va to'liq daraxt: parent va child indekslari</title>
  <rect x="0" y="0" width="820" height="470" fill="#f8fafc"/>
  <text x="410" y="30" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Binar uyum (min-heap) — massiv ⟷ to'liq daraxt</text>
  <text x="410" y="54" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Bir massiv ham daraxt sifatida qaraladi; indeks orqali ota va bola topiladi</text>

  <defs>
    <marker id="hp" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- daraxt qirralari -->
  <line x1="180" y1="120" x2="100" y2="190" stroke="#475569" stroke-width="2"/>
  <line x1="180" y1="120" x2="260" y2="190" stroke="#475569" stroke-width="2"/>
  <line x1="100" y1="224" x2="55" y2="294" stroke="#475569" stroke-width="2"/>
  <line x1="100" y1="224" x2="145" y2="294" stroke="#475569" stroke-width="2"/>
  <line x1="260" y1="224" x2="305" y2="294" stroke="#475569" stroke-width="2"/>

  <!-- daraxt tugunlari: qiymat (indeks) -->
  <!-- ildiz i=0 -->
  <circle cx="180" cy="103" r="26" fill="#2563eb"/>
  <text x="180" y="100" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff">2</text>
  <text x="180" y="116" text-anchor="middle" font-family="monospace" font-size="13" fill="#dbeafe">i=0</text>
  <!-- i=1 -->
  <circle cx="100" cy="207" r="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="100" y="204" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1e293b">5</text>
  <text x="100" y="220" text-anchor="middle" font-family="monospace" font-size="13" fill="#475569">i=1</text>
  <!-- i=2 -->
  <circle cx="260" cy="207" r="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="260" y="204" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1e293b">4</text>
  <text x="260" y="220" text-anchor="middle" font-family="monospace" font-size="13" fill="#475569">i=2</text>
  <!-- i=3 -->
  <circle cx="55" cy="311" r="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="55" y="308" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1e293b">9</text>
  <text x="55" y="324" text-anchor="middle" font-family="monospace" font-size="13" fill="#475569">i=3</text>
  <!-- i=4 -->
  <circle cx="145" cy="311" r="26" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="145" y="308" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1e293b">7</text>
  <text x="145" y="324" text-anchor="middle" font-family="monospace" font-size="13" fill="#475569">i=4</text>
  <!-- i=5 -->
  <circle cx="305" cy="311" r="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="305" y="308" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1e293b">6</text>
  <text x="305" y="324" text-anchor="middle" font-family="monospace" font-size="13" fill="#475569">i=5</text>

  <text x="180" y="372" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Ota har bolasidan kichik (yoki teng) — eng kichigi ildizda</text>

  <!-- massiv ko'rinishi -->
  <text x="600" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Xotirada — oddiy massiv</text>
  <g font-family="monospace" font-size="16">
    <rect x="455" y="115" width="48" height="44" fill="#2563eb"/>
    <text x="479" y="143" text-anchor="middle" fill="#ffffff">2</text>
    <rect x="503" y="115" width="48" height="44" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="527" y="143" text-anchor="middle" fill="#1e293b">5</text>
    <rect x="551" y="115" width="48" height="44" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="575" y="143" text-anchor="middle" fill="#1e293b">4</text>
    <rect x="599" y="115" width="48" height="44" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="623" y="143" text-anchor="middle" fill="#1e293b">9</text>
    <rect x="647" y="115" width="48" height="44" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="671" y="143" text-anchor="middle" fill="#1e293b">7</text>
    <rect x="695" y="115" width="48" height="44" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="719" y="143" text-anchor="middle" fill="#1e293b">6</text>
  </g>
  <g font-family="monospace" font-size="13" fill="#94a3b8">
    <text x="479" y="178" text-anchor="middle">0</text>
    <text x="527" y="178" text-anchor="middle">1</text>
    <text x="575" y="178" text-anchor="middle">2</text>
    <text x="623" y="178" text-anchor="middle">3</text>
    <text x="671" y="178" text-anchor="middle">4</text>
    <text x="719" y="178" text-anchor="middle">5</text>
  </g>

  <!-- indeks formulalari -->
  <rect x="430" y="210" width="350" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="450" y="236" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Indeks bo'yicha bog'lanish:</text>
  <text x="450" y="262" font-family="monospace" font-size="14" fill="#2563eb">chap bola  = 2·i + 1</text>
  <text x="450" y="284" font-family="monospace" font-size="14" fill="#2563eb">o'ng bola  = 2·i + 2</text>
  <text x="450" y="306" font-family="monospace" font-size="14" fill="#16a34a">ota        = (i − 1) / 2  (butun)</text>

  <!-- misol o'qi: i=1 -> bolalari 3,4 -->
  <text x="60" y="408" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Misol: i = 1 (qiymat 5)</text>
  <text x="60" y="432" font-family="monospace" font-size="14" fill="#1e293b">chap bola  = 2·1+1 = 3  →  qiymat 9</text>
  <text x="60" y="454" font-family="monospace" font-size="14" fill="#1e293b">o'ng bola  = 2·1+2 = 4  →  qiymat 7</text>
  <text x="470" y="408" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Misol: i = 4 (qiymat 7)</text>
  <text x="470" y="432" font-family="monospace" font-size="14" fill="#16a34a">ota = (4−1)/2 = 1  →  qiymat 5</text>
  <text x="470" y="454" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">push: pastdan ko'tar · pop: yuqoridan tushir</text>
</svg>
