<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" width="580" height="380">
  <title>Graf BFS — qatlam-qatlam, navbat yordamida kenglik bo'yicha o'tish</title>
  <rect x="0" y="0" width="580" height="380" fill="#f8fafc"/>
  <text x="290" y="30" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#1e293b" text-anchor="middle">Graf BFS — qatlam-qatlam (navbat bilan)</text>

  <!-- qirralar (yo'naltirilmagan) -->
  <line x1="110" y1="180" x2="240" y2="110" stroke="#94a3b8" stroke-width="2"/>
  <line x1="110" y1="180" x2="240" y2="250" stroke="#94a3b8" stroke-width="2"/>
  <line x1="240" y1="110" x2="380" y2="110" stroke="#94a3b8" stroke-width="2"/>
  <line x1="240" y1="250" x2="380" y2="110" stroke="#94a3b8" stroke-width="2"/>
  <line x1="240" y1="250" x2="380" y2="250" stroke="#94a3b8" stroke-width="2"/>
  <line x1="380" y1="110" x2="490" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <line x1="380" y1="250" x2="490" y2="180" stroke="#94a3b8" stroke-width="2"/>

  <!-- qatlam halqalari (orqa fon) -->
  <text x="110" y="232" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">qatlam 0</text>
  <text x="240" y="302" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">qatlam 1</text>
  <text x="380" y="302" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#f59e0b" text-anchor="middle">qatlam 2</text>
  <text x="490" y="232" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">qatlam 3</text>

  <!-- tugunlar -->
  <!-- A start (qatlam 0) -->
  <circle cx="110" cy="180" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="110" y="186" font-family="monospace" font-size="17" fill="#1e293b" text-anchor="middle">A</text>
  <text x="110" y="146" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">start</text>

  <!-- B (qatlam 1) -->
  <circle cx="240" cy="110" r="26" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="240" y="116" font-family="monospace" font-size="17" fill="#1e293b" text-anchor="middle">B</text>
  <!-- C (qatlam 1) -->
  <circle cx="240" cy="250" r="26" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="240" y="256" font-family="monospace" font-size="17" fill="#1e293b" text-anchor="middle">C</text>

  <!-- D (qatlam 2) -->
  <circle cx="380" cy="110" r="26" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="380" y="116" font-family="monospace" font-size="17" fill="#1e293b" text-anchor="middle">D</text>
  <!-- E (qatlam 2) -->
  <circle cx="380" cy="250" r="26" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="380" y="256" font-family="monospace" font-size="17" fill="#1e293b" text-anchor="middle">E</text>

  <!-- F (qatlam 3) -->
  <circle cx="490" cy="180" r="26" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="490" y="186" font-family="monospace" font-size="17" fill="#1e293b" text-anchor="middle">F</text>

  <!-- natija -->
  <text x="290" y="330" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Tashrif tartibi:  A → B, C → D, E → F</text>
  <text x="290" y="356" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Yaqin qo'shnilar avval; har tugun navbatga bir marta (visited) qo'shiladi</text>
</svg>
