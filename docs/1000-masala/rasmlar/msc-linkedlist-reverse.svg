<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" width="620" height="380">
  <title>Bog'langan listni teskari ag'darish — prev/cur/next ko'rsatkichlari</title>
  <rect x="0" y="0" width="620" height="380" fill="#f8fafc"/>
  <text x="310" y="30" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#1e293b" text-anchor="middle">Listni teskari ag'darish (har qadamda bir bog'lanish buriladi)</text>

  <defs>
    <marker id="arrC" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#475569"/>
    </marker>
    <marker id="arrCg" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- ============ BOSHLANG'ICH ============ -->
  <text x="40" y="90" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="start">Boshlang'ich:</text>
  <!-- node A -->
  <rect x="120" y="72" width="70" height="38" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="155" y="96" font-family="monospace" font-size="16" fill="#1e293b" text-anchor="middle">1</text>
  <line x1="190" y1="91" x2="240" y2="91" stroke="#475569" stroke-width="2.5" marker-end="url(#arrC)"/>
  <!-- node B -->
  <rect x="242" y="72" width="70" height="38" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="277" y="96" font-family="monospace" font-size="16" fill="#1e293b" text-anchor="middle">2</text>
  <line x1="312" y1="91" x2="362" y2="91" stroke="#475569" stroke-width="2.5" marker-end="url(#arrC)"/>
  <!-- node C -->
  <rect x="364" y="72" width="70" height="38" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="399" y="96" font-family="monospace" font-size="16" fill="#1e293b" text-anchor="middle">3</text>
  <line x1="434" y1="91" x2="484" y2="91" stroke="#475569" stroke-width="2.5" marker-end="url(#arrC)"/>
  <text x="510" y="96" font-family="monospace" font-size="15" fill="#64748b" text-anchor="middle">null</text>

  <!-- ============ ORALIQ QADAM ============ -->
  <text x="40" y="200" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="start">Qadam:</text>
  <text x="40" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b" text-anchor="start">cur.next = prev</text>

  <!-- node A (prev) -->
  <rect x="120" y="182" width="70" height="38" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="155" y="206" font-family="monospace" font-size="16" fill="#1e293b" text-anchor="middle">1</text>
  <text x="155" y="248" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">prev</text>

  <!-- node B (cur) -->
  <rect x="242" y="182" width="70" height="38" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="277" y="206" font-family="monospace" font-size="16" fill="#1e293b" text-anchor="middle">2</text>
  <text x="277" y="248" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="middle">cur</text>

  <!-- node C (next) -->
  <rect x="364" y="182" width="70" height="38" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="399" y="206" font-family="monospace" font-size="16" fill="#1e293b" text-anchor="middle">3</text>
  <text x="399" y="248" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">next</text>

  <!-- teskari strelka B -> A -->
  <line x1="242" y1="201" x2="192" y2="201" stroke="#16a34a" stroke-width="3" marker-end="url(#arrCg)"/>
  <text x="217" y="178" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">teskari</text>
  <!-- A -> null (prev oldidan endi null) -->
  <line x1="118" y1="201" x2="78" y2="201" stroke="#475569" stroke-width="2" marker-end="url(#arrC)"/>
  <text x="58" y="206" font-family="monospace" font-size="14" fill="#64748b" text-anchor="middle">null</text>

  <!-- ============ NATIJA ============ -->
  <text x="40" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="start">Natija:</text>
  <text x="510" y="324" font-family="monospace" font-size="15" fill="#64748b" text-anchor="middle">null</text>
  <line x1="484" y1="319" x2="436" y2="319" stroke="#475569" stroke-width="2.5" marker-end="url(#arrC)"/>
  <rect x="364" y="300" width="70" height="38" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="399" y="324" font-family="monospace" font-size="16" fill="#1e293b" text-anchor="middle">3</text>
  <line x1="362" y1="319" x2="314" y2="319" stroke="#475569" stroke-width="2.5" marker-end="url(#arrC)"/>
  <rect x="242" y="300" width="70" height="38" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="277" y="324" font-family="monospace" font-size="16" fill="#1e293b" text-anchor="middle">2</text>
  <line x1="240" y1="319" x2="192" y2="319" stroke="#475569" stroke-width="2.5" marker-end="url(#arrC)"/>
  <rect x="120" y="300" width="70" height="38" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="155" y="324" font-family="monospace" font-size="16" fill="#1e293b" text-anchor="middle">1</text>
  <text x="155" y="358" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">yangi bosh</text>
</svg>
