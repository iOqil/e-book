<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" width="660" height="380">
  <title>Hash map: kalit, hash funksiya, bucket va O(1) qidiruv</title>
  <rect x="0" y="0" width="660" height="380" fill="#f8fafc"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <text x="330" y="30" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Hash map qanday ishlaydi (O(1) qidiruv)</text>

  <!-- Kalit -->
  <rect x="30" y="70" width="150" height="50" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="105" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">kalit</text>
  <text x="105" y="111" text-anchor="middle" font-family="monospace" font-size="15" fill="#2563eb">"olma"</text>

  <!-- strelka -->
  <line x1="180" y1="95" x2="245" y2="95" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <!-- hash funksiya -->
  <rect x="250" y="68" width="160" height="54" rx="6" fill="#2563eb"/>
  <text x="330" y="90" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#f8fafc">hash funksiya</text>
  <text x="330" y="110" text-anchor="middle" font-family="monospace" font-size="13" fill="#f8fafc">h("olma") = 2</text>

  <!-- strelka -->
  <line x1="410" y1="95" x2="475" y2="95" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="510" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">indeks</text>
  <text x="510" y="111" text-anchor="middle" font-family="monospace" font-size="16" fill="#f59e0b">2</text>

  <!-- buckets jadval -->
  <text x="60" y="175" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">bucket'lar (xotira):</text>
  <g font-family="monospace" font-size="15" fill="#1e293b">
    <rect x="60" y="190" width="80" height="44" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="100" y="218" text-anchor="middle" fill="#94a3b8">0</text>
    <rect x="140" y="190" width="80" height="44" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="180" y="218" text-anchor="middle" fill="#94a3b8">1</text>
    <rect x="220" y="190" width="80" height="44" fill="#16a34a" stroke="#16a34a"/>
    <text x="260" y="212" text-anchor="middle" font-size="13" fill="#f8fafc">"olma"</text>
    <text x="260" y="228" text-anchor="middle" font-size="13" fill="#f8fafc">→ 5</text>
    <rect x="300" y="190" width="80" height="44" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="340" y="218" text-anchor="middle" fill="#94a3b8">3</text>
    <rect x="380" y="190" width="80" height="44" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="420" y="218" text-anchor="middle" fill="#94a3b8">4</text>
  </g>
  <!-- indeks raqamlari ostida -->
  <g font-family="monospace" font-size="13" fill="#2563eb" text-anchor="middle">
    <text x="100" y="252">0</text>
    <text x="180" y="252">1</text>
    <text x="260" y="252">2</text>
    <text x="340" y="252">3</text>
    <text x="420" y="252">4</text>
  </g>

  <!-- indeks 2 ga strelka -->
  <line x1="510" y1="120" x2="280" y2="186" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ar)"/>
  <text x="430" y="155" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#f59e0b">to'g'ridan-to'g'ri 2-bucket</text>

  <!-- izoh -->
  <text x="60" y="305" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Nega O(1)?</text>
  <text x="60" y="330" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Kalit hashga aylanadi, hash to'g'ridan indeksni beradi —</text>
  <text x="60" y="352" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">butun massivni aylanib chiqmaymiz, bitta qadamda topamiz.</text>
</svg>
