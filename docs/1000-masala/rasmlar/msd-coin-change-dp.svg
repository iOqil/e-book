<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470">
  <title>Tanga maydalash (coin change): dp jadvalini to'ldirish, tangalar = {1,3,4}, summa = 6</title>
  <rect x="0" y="0" width="820" height="470" fill="#f8fafc"/>
  <text x="30" y="34" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#2563eb">Coin change: dp[a] = a summa uchun minimal tangalar</text>
  <text x="30" y="58" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Tangalar = {1, 3, 4} · Maqsad summa = 6 · O'tish: dp[a] = min(dp[a], dp[a − tanga] + 1)</text>

  <!-- index row -->
  <g font-family="monospace" font-size="14" text-anchor="middle">
    <text x="60" y="105" fill="#475569" font-family="Segoe UI, system-ui, sans-serif">a:</text>
    <text x="150" y="105" fill="#475569">0</text>
    <text x="240" y="105" fill="#475569">1</text>
    <text x="330" y="105" fill="#475569">2</text>
    <text x="420" y="105" fill="#475569">3</text>
    <text x="510" y="105" fill="#475569">4</text>
    <text x="600" y="105" fill="#475569">5</text>
    <text x="690" y="105" fill="#475569">6</text>
  </g>
  <!-- dp cells -->
  <g font-family="monospace" font-size="16" text-anchor="middle" fill="#1e293b">
    <rect x="120" y="118" width="60" height="46" fill="#dcfce7" stroke="#16a34a"/><text x="150" y="148">0</text>
    <rect x="210" y="118" width="60" height="46" fill="#e2e8f0" stroke="#94a3b8"/><text x="240" y="148">1</text>
    <rect x="300" y="118" width="60" height="46" fill="#e2e8f0" stroke="#94a3b8"/><text x="330" y="148">2</text>
    <rect x="390" y="118" width="60" height="46" fill="#e2e8f0" stroke="#94a3b8"/><text x="420" y="148">1</text>
    <rect x="480" y="118" width="60" height="46" fill="#e2e8f0" stroke="#94a3b8"/><text x="510" y="148">1</text>
    <rect x="570" y="118" width="60" height="46" fill="#e2e8f0" stroke="#94a3b8"/><text x="600" y="148">2</text>
    <rect x="660" y="118" width="60" height="46" fill="#bfdbfe" stroke="#2563eb"/><text x="690" y="148">2</text>
  </g>
  <text x="150" y="186" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">baza: 0</text>
  <text x="690" y="186" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">javob</text>

  <!-- transition demo for a=6 -->
  <defs>
    <marker id="mc-ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#f59e0b"/>
    </marker>
  </defs>
  <text x="30" y="252" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">a = 6 ni hisoblash — har tanga uchun bitta nomzod:</text>

  <g stroke="#f59e0b" stroke-width="2" fill="none">
    <path d="M 690 168 Q 660 220 600 222" marker-end="url(#mc-ar)"/>
    <path d="M 690 168 Q 560 230 420 222" marker-end="url(#mc-ar)"/>
    <path d="M 690 168 Q 520 250 330 222" marker-end="url(#mc-ar)"/>
  </g>

  <g font-family="monospace" font-size="14" fill="#1e293b">
    <rect x="40" y="288" width="730" height="34" rx="5" fill="#fff" stroke="#94a3b8"/>
    <text x="55" y="310">tanga 1 → dp[5] + 1 = 2 + 1 = 3</text>
    <rect x="40" y="328" width="730" height="34" rx="5" fill="#fff" stroke="#94a3b8"/>
    <text x="55" y="350">tanga 3 → dp[3] + 1 = 1 + 1 = 2</text>
    <rect x="40" y="368" width="730" height="34" rx="5" fill="#dbeafe" stroke="#2563eb"/>
    <text x="55" y="390">tanga 4 → dp[2] + 1 = 2 + 1 = 3</text>
  </g>
  <text x="540" y="350" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">← eng kichigi = 2</text>

  <text x="40" y="436" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">dp[6] = min(barcha nomzodlar) = 2 tanga (3 + 3). Imkonsiz bo'lsa dp = ∞ qoladi → −1.</text>
  <text x="40" y="456" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Jadval a=1 dan a=6 gacha chapdan o'ngga to'ldiriladi; kichik javoblar kattalarini quradi.</text>
</svg>
