<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420">
  <title>Matritsani 90 daraja aylantirish — transpozitsiya keyin har qatorni teskari</title>
  <rect x="0" y="0" width="860" height="420" fill="#f8fafc"/>
  <text x="430" y="30" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Matritsani 90° soat yo'nalishida aylantirish</text>
  <text x="430" y="54" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Ikki bosqich: 1) transpozitsiya (diagonal bo'yicha aks ettir)  2) har qatorni teskari</text>

  <defs>
    <marker id="mr" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- 1: original -->
  <text x="105" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Boshlang'ich</text>
  <g font-family="monospace" font-size="18">
    <rect x="45" y="105" width="40" height="40" fill="#dbeafe" stroke="#94a3b8"/><text x="65" y="131" text-anchor="middle" fill="#1e293b">1</text>
    <rect x="85" y="105" width="40" height="40" fill="#dbeafe" stroke="#94a3b8"/><text x="105" y="131" text-anchor="middle" fill="#1e293b">2</text>
    <rect x="125" y="105" width="40" height="40" fill="#dbeafe" stroke="#94a3b8"/><text x="145" y="131" text-anchor="middle" fill="#1e293b">3</text>
    <rect x="45" y="145" width="40" height="40" fill="#fef3c7" stroke="#94a3b8"/><text x="65" y="171" text-anchor="middle" fill="#1e293b">4</text>
    <rect x="85" y="145" width="40" height="40" fill="#fef3c7" stroke="#94a3b8"/><text x="105" y="171" text-anchor="middle" fill="#1e293b">5</text>
    <rect x="125" y="145" width="40" height="40" fill="#fef3c7" stroke="#94a3b8"/><text x="145" y="171" text-anchor="middle" fill="#1e293b">6</text>
    <rect x="45" y="185" width="40" height="40" fill="#dcfce7" stroke="#94a3b8"/><text x="65" y="211" text-anchor="middle" fill="#1e293b">7</text>
    <rect x="85" y="185" width="40" height="40" fill="#dcfce7" stroke="#94a3b8"/><text x="105" y="211" text-anchor="middle" fill="#1e293b">8</text>
    <rect x="125" y="185" width="40" height="40" fill="#dcfce7" stroke="#94a3b8"/><text x="145" y="211" text-anchor="middle" fill="#1e293b">9</text>
  </g>

  <!-- arrow 1 -->
  <line x1="180" y1="165" x2="280" y2="165" stroke="#475569" stroke-width="2.5" marker-end="url(#mr)"/>
  <text x="230" y="152" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">1) transpoz.</text>
  <text x="230" y="186" text-anchor="middle" font-family="monospace" font-size="13" fill="#475569">m[i][j]↔m[j][i]</text>

  <!-- 2: transposed -->
  <text x="355" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Transpozitsiyadan keyin</text>
  <g font-family="monospace" font-size="18">
    <rect x="295" y="105" width="40" height="40" fill="#dbeafe" stroke="#94a3b8"/><text x="315" y="131" text-anchor="middle" fill="#1e293b">1</text>
    <rect x="335" y="105" width="40" height="40" fill="#fef3c7" stroke="#94a3b8"/><text x="355" y="131" text-anchor="middle" fill="#1e293b">4</text>
    <rect x="375" y="105" width="40" height="40" fill="#dcfce7" stroke="#94a3b8"/><text x="395" y="131" text-anchor="middle" fill="#1e293b">7</text>
    <rect x="295" y="145" width="40" height="40" fill="#dbeafe" stroke="#94a3b8"/><text x="315" y="171" text-anchor="middle" fill="#1e293b">2</text>
    <rect x="335" y="145" width="40" height="40" fill="#fef3c7" stroke="#94a3b8"/><text x="355" y="171" text-anchor="middle" fill="#1e293b">5</text>
    <rect x="375" y="145" width="40" height="40" fill="#dcfce7" stroke="#94a3b8"/><text x="395" y="171" text-anchor="middle" fill="#1e293b">8</text>
    <rect x="295" y="185" width="40" height="40" fill="#dbeafe" stroke="#94a3b8"/><text x="315" y="211" text-anchor="middle" fill="#1e293b">3</text>
    <rect x="335" y="185" width="40" height="40" fill="#fef3c7" stroke="#94a3b8"/><text x="355" y="211" text-anchor="middle" fill="#1e293b">6</text>
    <rect x="375" y="185" width="40" height="40" fill="#dcfce7" stroke="#94a3b8"/><text x="395" y="211" text-anchor="middle" fill="#1e293b">9</text>
  </g>

  <!-- arrow 2 -->
  <line x1="430" y1="165" x2="530" y2="165" stroke="#475569" stroke-width="2.5" marker-end="url(#mr)"/>
  <text x="480" y="152" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">2) qatorni</text>
  <text x="480" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">teskari (reverse)</text>

  <!-- 3: result -->
  <text x="605" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">Natija — 90° aylangan</text>
  <g font-family="monospace" font-size="18">
    <rect x="545" y="105" width="40" height="40" fill="#dcfce7" stroke="#16a34a"/><text x="565" y="131" text-anchor="middle" fill="#1e293b">7</text>
    <rect x="585" y="105" width="40" height="40" fill="#fef3c7" stroke="#16a34a"/><text x="605" y="131" text-anchor="middle" fill="#1e293b">4</text>
    <rect x="625" y="105" width="40" height="40" fill="#dbeafe" stroke="#16a34a"/><text x="645" y="131" text-anchor="middle" fill="#1e293b">1</text>
    <rect x="545" y="145" width="40" height="40" fill="#dcfce7" stroke="#16a34a"/><text x="565" y="171" text-anchor="middle" fill="#1e293b">8</text>
    <rect x="585" y="145" width="40" height="40" fill="#fef3c7" stroke="#16a34a"/><text x="605" y="171" text-anchor="middle" fill="#1e293b">5</text>
    <rect x="625" y="145" width="40" height="40" fill="#dbeafe" stroke="#16a34a"/><text x="645" y="171" text-anchor="middle" fill="#1e293b">2</text>
    <rect x="545" y="185" width="40" height="40" fill="#dcfce7" stroke="#16a34a"/><text x="565" y="211" text-anchor="middle" fill="#1e293b">9</text>
    <rect x="585" y="185" width="40" height="40" fill="#fef3c7" stroke="#16a34a"/><text x="605" y="211" text-anchor="middle" fill="#1e293b">6</text>
    <rect x="625" y="185" width="40" height="40" fill="#dbeafe" stroke="#16a34a"/><text x="645" y="211" text-anchor="middle" fill="#1e293b">3</text>
  </g>

  <!-- izoh -->
  <rect x="690" y="100" width="150" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="765" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Rang = ustun</text>
  <text x="765" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Boshlang'ich 1-</text>
  <text x="765" y="167" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ustun (1,4,7) →</text>
  <text x="765" y="184" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">natijada 1-qator</text>
  <text x="765" y="208" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Joyida, O(1) xotira</text>

  <!-- pastki izoh -->
  <rect x="45" y="262" width="770" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="65" y="288" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Nega bu ikki bosqich 90° beradi?</text>
  <text x="65" y="314" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">• Transpozitsiya: element [i][j] o'rni [j][i] ga ko'chadi — matritsa bosh diagonal bo'ylab aks etadi.</text>
  <text x="65" y="338" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">• Har qatorni teskari qilish: ustunlar tartibi teskarilanadi — tepa-chap pastdan kelib chiqadi.</text>
  <text x="65" y="362" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">• Birga: eski 1-ustun (yuqoridan-past: 1,4,7) yangi 1-qatorga (chapdan-o'ng: 7,4,1) aylanadi.</text>
  <text x="65" y="384" font-family="monospace" font-size="13" fill="#475569">Soat teskari uchun: avval har qatorni teskari, keyin transpozitsiya.</text>
</svg>
