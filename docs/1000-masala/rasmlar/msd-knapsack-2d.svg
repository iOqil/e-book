<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="840" height="520">
  <title>0/1 Knapsack: 2D dp jadvali, buyumlar (og'irlik, qiymat), sig'im = 5</title>
  <rect x="0" y="0" width="840" height="520" fill="#f8fafc"/>
  <text x="30" y="32" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#2563eb">0/1 Knapsack — dp[i][w]: i ta buyum, w sig'im uchun maksimal qiymat</text>
  <text x="30" y="55" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Buyumlar: A(og'.1, qiy.1) · B(og'.3, qiy.4) · C(og'.4, qiy.5) · C(og'.5, qiy.7) · Sig'im = 5</text>

  <!-- column headers w = 0..5 -->
  <g font-family="monospace" font-size="14" text-anchor="middle" fill="#475569">
    <text x="120" y="92" font-family="Segoe UI, system-ui, sans-serif" font-size="13">sig'im w →</text>
    <text x="240" y="92">0</text><text x="300" y="92">1</text><text x="360" y="92">2</text>
    <text x="420" y="92">3</text><text x="480" y="92">4</text><text x="540" y="92">5</text>
  </g>

  <!-- row labels -->
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="end">
    <text x="200" y="127">0 buyum</text>
    <text x="200" y="167">+ A(1,1)</text>
    <text x="200" y="207">+ B(3,4)</text>
    <text x="200" y="247">+ C(4,5)</text>
    <text x="200" y="287">+ D(5,7)</text>
  </g>

  <!-- grid cells: 5 rows x 6 cols -->
  <g font-family="monospace" font-size="15" text-anchor="middle" fill="#1e293b">
    <!-- row 0 -->
    <g>
      <rect x="210" y="106" width="60" height="34" fill="#e2e8f0" stroke="#94a3b8"/><text x="240" y="129">0</text>
      <rect x="270" y="106" width="60" height="34" fill="#e2e8f0" stroke="#94a3b8"/><text x="300" y="129">0</text>
      <rect x="330" y="106" width="60" height="34" fill="#e2e8f0" stroke="#94a3b8"/><text x="360" y="129">0</text>
      <rect x="390" y="106" width="60" height="34" fill="#e2e8f0" stroke="#94a3b8"/><text x="420" y="129">0</text>
      <rect x="450" y="106" width="60" height="34" fill="#e2e8f0" stroke="#94a3b8"/><text x="480" y="129">0</text>
      <rect x="510" y="106" width="60" height="34" fill="#e2e8f0" stroke="#94a3b8"/><text x="540" y="129">0</text>
    </g>
    <!-- row A -->
    <g>
      <rect x="210" y="140" width="60" height="40" fill="#fff" stroke="#94a3b8"/><text x="240" y="166">0</text>
      <rect x="270" y="140" width="60" height="40" fill="#fff" stroke="#94a3b8"/><text x="300" y="166">1</text>
      <rect x="330" y="140" width="60" height="40" fill="#fff" stroke="#94a3b8"/><text x="360" y="166">1</text>
      <rect x="390" y="140" width="60" height="40" fill="#fff" stroke="#94a3b8"/><text x="420" y="166">1</text>
      <rect x="450" y="140" width="60" height="40" fill="#fff" stroke="#94a3b8"/><text x="480" y="166">1</text>
      <rect x="510" y="140" width="60" height="40" fill="#fff" stroke="#94a3b8"/><text x="540" y="166">1</text>
    </g>
    <!-- row B -->
    <g>
      <rect x="210" y="180" width="60" height="40" fill="#fff" stroke="#94a3b8"/><text x="240" y="206">0</text>
      <rect x="270" y="180" width="60" height="40" fill="#fff" stroke="#94a3b8"/><text x="300" y="206">1</text>
      <rect x="330" y="180" width="60" height="40" fill="#fde68a" stroke="#f59e0b"/><text x="360" y="206">1</text>
      <rect x="390" y="180" width="60" height="40" fill="#fde68a" stroke="#f59e0b"/><text x="420" y="206">4</text>
      <rect x="450" y="180" width="60" height="40" fill="#fff" stroke="#94a3b8"/><text x="480" y="206">5</text>
      <rect x="510" y="180" width="60" height="40" fill="#fff" stroke="#94a3b8"/><text x="540" y="206">5</text>
    </g>
    <!-- row C -->
    <g>
      <rect x="210" y="220" width="60" height="40" fill="#fff" stroke="#94a3b8"/><text x="240" y="246">0</text>
      <rect x="270" y="220" width="60" height="40" fill="#fff" stroke="#94a3b8"/><text x="300" y="246">1</text>
      <rect x="330" y="220" width="60" height="40" fill="#fff" stroke="#94a3b8"/><text x="360" y="246">1</text>
      <rect x="390" y="220" width="60" height="40" fill="#fff" stroke="#94a3b8"/><text x="420" y="246">4</text>
      <rect x="450" y="220" width="60" height="40" fill="#fff" stroke="#94a3b8"/><text x="480" y="246">5</text>
      <rect x="510" y="220" width="60" height="40" fill="#fff" stroke="#94a3b8"/><text x="540" y="246">6</text>
    </g>
    <!-- row D -->
    <g>
      <rect x="210" y="260" width="60" height="40" fill="#fff" stroke="#94a3b8"/><text x="240" y="286">0</text>
      <rect x="270" y="260" width="60" height="40" fill="#fff" stroke="#94a3b8"/><text x="300" y="286">1</text>
      <rect x="330" y="260" width="60" height="40" fill="#fff" stroke="#94a3b8"/><text x="360" y="286">1</text>
      <rect x="390" y="260" width="60" height="40" fill="#fff" stroke="#94a3b8"/><text x="420" y="286">4</text>
      <rect x="450" y="260" width="60" height="40" fill="#fff" stroke="#94a3b8"/><text x="480" y="286">5</text>
      <rect x="510" y="260" width="60" height="40" fill="#bfdbfe" stroke="#2563eb"/><text x="540" y="286">7</text>
    </g>
  </g>
  <text x="600" y="286" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">← javob = 7</text>

  <!-- transition explanation -->
  <defs>
    <marker id="mk-ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#16a34a"/>
    </marker>
    <marker id="mk-ar2" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <text x="30" y="345" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Har katak — buyumni olish yoki olmaslikning kattasini tanlaydi:</text>

  <rect x="40" y="360" width="370" height="120" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="55" y="384" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">OLMASLIK</text>
  <text x="55" y="408" font-family="monospace" font-size="14" fill="#1e293b">dp[i-1][w]</text>
  <text x="55" y="432" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yuqoridagi qator — bir xil sig'im,</text>
  <text x="55" y="452" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">joriy buyumsiz natija.</text>

  <rect x="430" y="360" width="380" height="120" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="445" y="384" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">OLISH (og'irlik ≤ w bo'lsa)</text>
  <text x="445" y="408" font-family="monospace" font-size="14" fill="#1e293b">dp[i-1][w − og'irlik] + qiymat</text>
  <text x="445" y="432" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yuqori qatorning kamaytirilgan sig'im</text>
  <text x="445" y="452" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">katagi + shu buyum qiymati.</text>

  <text x="40" y="502" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">dp[i][w] = max(OLMASLIK, OLISH). Jadval yuqoridan-pastga, chapdan o'ngga to'ldiriladi.</text>
</svg>
