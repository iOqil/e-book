<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>Ray casting — nuqta ko'pburchak ichidami: o'ngga nur otib kesishishlarni sanash</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="30" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#1e293b" text-anchor="middle">Ray casting — nuqta ko'pburchak ichidami?</text>
  <text x="380" y="52" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Nuqtadan o'ngga nur otamiz: qirralarni TOQ marta kesib o'tsa — ichida, JUFT marta — tashqarisida</text>

  <defs>
    <marker id="ray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- ko'pburchak (yulduzsimon, qirralar bilan) -->
  <!-- uchlar: A(120,120) B(280,80) C(360,200) D(300,330) E(150,300) F(90,220) -->
  <polygon points="120,120 280,80 360,200 300,330 150,300 90,220"
           fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>

  <!-- uchlar belgilari -->
  <g font-family="monospace" font-size="13" fill="#1e293b" text-anchor="middle">
    <circle cx="120" cy="120" r="4" fill="#2563eb"/>
    <circle cx="280" cy="80" r="4" fill="#2563eb"/>
    <circle cx="360" cy="200" r="4" fill="#2563eb"/>
    <circle cx="300" cy="330" r="4" fill="#2563eb"/>
    <circle cx="150" cy="300" r="4" fill="#2563eb"/>
    <circle cx="90" cy="220" r="4" fill="#2563eb"/>
  </g>

  <!-- ICHKI nuqta P1 va uning nuri -->
  <circle cx="200" cy="200" r="6" fill="#16a34a"/>
  <text x="200" y="190" font-family="monospace" font-size="14" fill="#16a34a" text-anchor="middle">P1</text>
  <line x1="206" y1="200" x2="500" y2="200" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ray)"/>
  <!-- P1 nuri 1 ta qirrani kesadi (BC qirrasi) -->
  <circle cx="348" cy="200" r="6" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <text x="348" y="232" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">1-kesishish</text>
  <text x="520" y="195" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">P1: 1 ta (TOQ)</text>
  <text x="520" y="213" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">→ ICHIDA</text>

  <!-- TASHQI nuqta P2 va uning nuri (pastda) -->
  <circle cx="40" cy="360" r="6" fill="#dc2626"/>
  <text x="40" y="350" font-family="monospace" font-size="14" fill="#dc2626" text-anchor="middle">P2</text>
  <line x1="46" y1="360" x2="500" y2="360" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ray)"/>
  <!-- y=360 ko'pburchakning eng past uchidan (330) pastda → 0 ta kesishish -->
  <text x="520" y="355" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">P2: 0 ta (JUFT)</text>
  <text x="520" y="373" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">→ TASHQARISIDA</text>

  <!-- qadamlar paneli -->
  <rect x="520" y="70" width="220" height="100" fill="#fef9c3" stroke="#f59e0b" stroke-width="2" rx="6"/>
  <text x="534" y="92" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">Har qirra uchun shart:</text>
  <text x="534" y="113" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">1) qirra nuqta y'ini qamrabmi?</text>
  <text x="534" y="131" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">2) kesishish x'i nuqta o'ngidami?</text>
  <text x="534" y="155" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">ikkalasi rost → inside = !inside</text>

  <!-- pastki umumiy izoh -->
  <rect x="50" y="392" width="660" height="64" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" rx="6"/>
  <text x="68" y="415" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">G'oya:</text>
  <text x="118" y="415" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Cheksiz uzoqlikdan (tashqaridan) nur tortilsa, har qirrani kesishda tashqari↔ichkari almashadi.</text>
  <text x="68" y="437" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Shuning uchun kesishishlar soni toq bo'lsa nuqta ichida, juft bo'lsa tashqarisida bo'ladi — O(n).</text>
</svg>
