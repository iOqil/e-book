<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" width="580" height="380">
  <title>Graf DFS — chuqurlik bo'yicha, bir yo'lni oxirigacha kuzatadi</title>
  <rect x="0" y="0" width="580" height="380" fill="#f8fafc"/>
  <text x="290" y="30" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#1e293b" text-anchor="middle">Graf DFS — chuqurlikka (bir yo'l oxirigacha)</text>

  <defs>
    <marker id="arrD" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- qirralar (oddiy) -->
  <line x1="110" y1="180" x2="240" y2="110" stroke="#94a3b8" stroke-width="2"/>
  <line x1="110" y1="180" x2="240" y2="250" stroke="#94a3b8" stroke-width="2"/>
  <line x1="240" y1="110" x2="380" y2="110" stroke="#94a3b8" stroke-width="2"/>
  <line x1="240" y1="250" x2="380" y2="110" stroke="#94a3b8" stroke-width="2"/>
  <line x1="240" y1="250" x2="380" y2="250" stroke="#94a3b8" stroke-width="2"/>
  <line x1="380" y1="110" x2="490" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <line x1="380" y1="250" x2="490" y2="180" stroke="#94a3b8" stroke-width="2"/>

  <!-- DFS yo'li (qizil strelka): A -> B -> D -> F -> E -> C -->
  <line x1="132" y1="167" x2="220" y2="122" stroke="#dc2626" stroke-width="3" marker-end="url(#arrD)"/>
  <line x1="266" y1="110" x2="354" y2="110" stroke="#dc2626" stroke-width="3" marker-end="url(#arrD)"/>
  <line x1="402" y1="123" x2="470" y2="167" stroke="#dc2626" stroke-width="3" marker-end="url(#arrD)"/>
  <line x1="470" y1="193" x2="402" y2="237" stroke="#dc2626" stroke-width="3" marker-end="url(#arrD)"/>
  <line x1="354" y1="250" x2="266" y2="250" stroke="#dc2626" stroke-width="3" marker-end="url(#arrD)"/>

  <!-- tugunlar tashrif raqami bilan -->
  <circle cx="110" cy="180" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="110" y="186" font-family="monospace" font-size="17" fill="#1e293b" text-anchor="middle">A</text>
  <text x="110" y="146" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">start (1)</text>

  <circle cx="240" cy="110" r="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="240" y="116" font-family="monospace" font-size="17" fill="#1e293b" text-anchor="middle">B</text>
  <text x="240" y="74" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">2</text>

  <circle cx="380" cy="110" r="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="380" y="116" font-family="monospace" font-size="17" fill="#1e293b" text-anchor="middle">D</text>
  <text x="380" y="74" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">3</text>

  <circle cx="490" cy="180" r="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="490" y="186" font-family="monospace" font-size="17" fill="#1e293b" text-anchor="middle">F</text>
  <text x="490" y="146" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">4</text>

  <circle cx="380" cy="250" r="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="380" y="256" font-family="monospace" font-size="17" fill="#1e293b" text-anchor="middle">E</text>
  <text x="380" y="296" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">5</text>

  <circle cx="240" cy="250" r="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="240" y="256" font-family="monospace" font-size="17" fill="#1e293b" text-anchor="middle">C</text>
  <text x="240" y="296" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">6</text>

  <!-- natija -->
  <text x="290" y="332" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Tashrif tartibi:  A → B → D → F → E → C</text>
  <text x="290" y="358" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Bir qo'shniga kirib, undan chuqurlashadi; tupik bo'lganda orqaga qaytadi (backtrack)</text>
</svg>
