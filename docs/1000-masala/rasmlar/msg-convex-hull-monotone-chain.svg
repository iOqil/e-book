<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500">
  <title>Convex hull — Andrew monotone chain: nuqtalarni saralab pastki va yuqori zanjirlarni qurish</title>
  <rect x="0" y="0" width="760" height="500" fill="#f8fafc"/>
  <text x="380" y="30" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#1e293b" text-anchor="middle">Convex hull — Andrew monotone chain</text>
  <text x="380" y="52" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Nuqtalar x bo'yicha saralanadi, so'ng pastki va yuqori zanjirlar alohida quriladi</text>

  <defs>
    <marker id="arL" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arU" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- 1-panel: barcha nuqtalar (chap) -->
  <text x="190" y="84" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">1) Saralangan nuqtalar (x↑)</text>
  <rect x="40" y="96" width="300" height="280" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="6"/>
  <!-- nuqtalar: koordinatalar SVG-da y pastga -->
  <!-- A(60,340) B(110,180) C(160,300) D(180,130) E(230,250) F(290,160) G(310,330) ichki(170,250) -->
  <g fill="#475569">
    <circle cx="70" cy="340" r="5"/>
    <circle cx="120" cy="170" r="5"/>
    <circle cx="160" cy="300" r="5"/>
    <circle cx="185" cy="120" r="5"/>
    <circle cx="225" cy="250" r="5"/>
    <circle cx="290" cy="150" r="5"/>
    <circle cx="315" cy="330" r="5"/>
    <circle cx="175" cy="235" r="5" fill="#94a3b8"/>
  </g>
  <text x="175" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">ichki nuqta</text>
  <text x="190" y="368" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">eng chap → eng o'ng tartibda yuriladi</text>

  <!-- 2-panel: ikki zanjir (o'ng) -->
  <text x="555" y="84" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">2) Pastki + yuqori zanjir = qobiq</text>
  <rect x="405" y="96" width="300" height="280" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="6"/>
  <!-- xuddi shu nuqtalar +365 x siljishi -->
  <!-- A(435,340) B(485,170) D(550,120) F(655,150) G(680,330) C(525,300) E(590,250) ichki(540,235) -->
  <!-- to'ldirilgan qobiq -->
  <polygon points="435,340 485,170 550,120 655,150 680,330" fill="#dbeafe" stroke="none" opacity="0.6"/>
  <!-- yuqori zanjir A->B->D->F (amber) -->
  <line x1="435" y1="340" x2="485" y2="170" stroke="#f59e0b" stroke-width="3" marker-end="url(#arU)"/>
  <line x1="485" y1="170" x2="550" y2="120" stroke="#f59e0b" stroke-width="3" marker-end="url(#arU)"/>
  <line x1="550" y1="120" x2="655" y2="150" stroke="#f59e0b" stroke-width="3" marker-end="url(#arU)"/>
  <!-- pastki zanjir A->G->F? aslida pastki: A(eng chap) -> G(pastki o'ng) -> F(eng o'ng tepa) -->
  <line x1="435" y1="340" x2="680" y2="330" stroke="#16a34a" stroke-width="3" marker-end="url(#arL)"/>
  <line x1="680" y1="330" x2="655" y2="150" stroke="#16a34a" stroke-width="3" marker-end="url(#arL)"/>
  <!-- qobiq uchlari -->
  <g fill="#1e293b">
    <circle cx="435" cy="340" r="5"/>
    <circle cx="485" cy="170" r="5"/>
    <circle cx="550" cy="120" r="5"/>
    <circle cx="655" cy="150" r="5"/>
    <circle cx="680" cy="330" r="5"/>
  </g>
  <!-- ichkarida qolgan nuqtalar -->
  <g fill="#94a3b8">
    <circle cx="525" cy="300" r="5"/>
    <circle cx="590" cy="250" r="5"/>
    <circle cx="540" cy="235" r="5"/>
  </g>
  <text x="500" y="158" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#b45309">yuqori</text>
  <text x="560" y="358" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">pastki</text>

  <!-- cross qoidasi paneli -->
  <rect x="40" y="392" width="350" height="92" fill="#fef9c3" stroke="#f59e0b" stroke-width="2" rx="6"/>
  <text x="56" y="414" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">Burilish testi (cross product):</text>
  <text x="56" y="435" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Yangi nuqta o'ngga (soat) buriltirsa, oxirgi</text>
  <text x="56" y="453" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">uchni stekdan pop qilamiz (cross ≤ 0).</text>
  <text x="56" y="473" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Faqat chapga buriluvchi (qavariq) uchlar qoladi.</text>

  <rect x="405" y="392" width="300" height="92" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" rx="6"/>
  <text x="421" y="414" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Murakkablik:</text>
  <text x="421" y="435" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Saralash → O(n log n) (asosiy narx).</text>
  <text x="421" y="453" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Zanjir qurish → O(n): har nuqta bir kiradi,</text>
  <text x="421" y="473" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">bir chiqadi. Xotira O(n).</text>
</svg>
