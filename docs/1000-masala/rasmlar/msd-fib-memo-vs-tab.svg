<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470">
  <title>Fibonachchi: memoizatsiya (top-down) va tabulatsiya (bottom-up) taqqoslash</title>
  <rect x="0" y="0" width="860" height="470" fill="#f8fafc"/>

  <!-- LEFT: memoization (top-down) -->
  <text x="30" y="34" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#2563eb">Memoizatsiya (top-down)</text>
  <text x="30" y="56" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">rekursiya + kesh — har qiymat 1 marta hisoblanadi</text>

  <!-- recursion tree fib(5) with cache -->
  <!-- nodes -->
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">
    <circle cx="200" cy="92" r="20" fill="#e2e8f0" stroke="#94a3b8"/><text x="200" y="97">f(5)</text>
    <circle cx="120" cy="160" r="20" fill="#e2e8f0" stroke="#94a3b8"/><text x="120" y="165">f(4)</text>
    <circle cx="280" cy="160" r="20" fill="#fde68a" stroke="#f59e0b"/><text x="280" y="165">f(3)</text>
    <circle cx="70"  cy="228" r="20" fill="#e2e8f0" stroke="#94a3b8"/><text x="70" y="233">f(3)</text>
    <circle cx="170" cy="228" r="20" fill="#fde68a" stroke="#f59e0b"/><text x="170" y="233">f(2)</text>
    <circle cx="40"  cy="296" r="20" fill="#fde68a" stroke="#f59e0b"/><text x="40" y="301">f(2)</text>
    <circle cx="110" cy="296" r="20" fill="#dcfce7" stroke="#16a34a"/><text x="110" y="301">f(1)</text>
  </g>
  <g stroke="#475569" stroke-width="1.5">
    <line x1="186" y1="106" x2="134" y2="146"/>
    <line x1="214" y1="106" x2="266" y2="146"/>
    <line x1="108" y1="174" x2="82"  y2="214"/>
    <line x1="132" y1="174" x2="158" y2="214"/>
    <line x1="58"  y1="242" x2="46"  y2="278"/>
    <line x1="82"  y1="242" x2="104" y2="278"/>
  </g>
  <!-- cache-hit marker -->
  <rect x="250" y="186" width="120" height="26" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="310" y="204" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309" text-anchor="middle">keshdan olinadi ⟳</text>
  <line x1="300" y1="180" x2="290" y2="186" stroke="#f59e0b" stroke-width="1.5"/>

  <text x="30" y="360" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Sariq tugun = avval hisoblangan, qaytadan</text>
  <text x="30" y="380" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">hisoblanmaydi (keshdan o'qiladi).</text>
  <text x="30" y="404" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">⏱ O(n) · 💾 O(n) kesh + rekursiya steki</text>

  <!-- divider -->
  <line x1="430" y1="20" x2="430" y2="450" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 5"/>

  <!-- RIGHT: tabulation (bottom-up) -->
  <text x="470" y="34" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#16a34a">Tabulatsiya (bottom-up)</text>
  <text x="470" y="56" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">jadvalni pastdan to'ldirish: dp[i]=dp[i-1]+dp[i-2]</text>

  <!-- dp table -->
  <g font-family="monospace" font-size="14" fill="#1e293b" text-anchor="middle">
    <rect x="470" y="96"  width="52" height="40" fill="#dcfce7" stroke="#94a3b8"/><text x="496" y="121">0</text>
    <rect x="522" y="96"  width="52" height="40" fill="#dcfce7" stroke="#94a3b8"/><text x="548" y="121">1</text>
    <rect x="574" y="96"  width="52" height="40" fill="#e2e8f0" stroke="#94a3b8"/><text x="600" y="121">1</text>
    <rect x="626" y="96"  width="52" height="40" fill="#e2e8f0" stroke="#94a3b8"/><text x="652" y="121">2</text>
    <rect x="678" y="96"  width="52" height="40" fill="#e2e8f0" stroke="#94a3b8"/><text x="704" y="121">3</text>
    <rect x="730" y="96"  width="52" height="40" fill="#bfdbfe" stroke="#2563eb"/><text x="756" y="121">5</text>
  </g>
  <g font-family="monospace" font-size="13" fill="#475569" text-anchor="middle">
    <text x="496" y="153">i=0</text><text x="548" y="153">1</text><text x="600" y="153">2</text>
    <text x="652" y="153">3</text><text x="704" y="153">4</text><text x="756" y="153">5</text>
  </g>

  <!-- transition arrows showing dp[i]=dp[i-1]+dp[i-2] -->
  <g stroke="#f59e0b" stroke-width="1.8" fill="none">
    <path d="M 600 172 Q 626 200 678 172" marker-end="url(#md-ar)"/>
    <path d="M 548 188 Q 600 224 678 184" marker-end="url(#md-ar)"/>
  </g>
  <defs>
    <marker id="md-ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#f59e0b"/>
    </marker>
  </defs>
  <text x="652" y="248" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309" text-anchor="middle">dp[4] = dp[3] + dp[2]</text>

  <text x="470" y="296" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">To'ldirish yo'nalishi: chapdan o'ngga →</text>
  <text x="470" y="316" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Rekursiya yo'q; faqat oxirgi 2 qiymat kerak,</text>
  <text x="470" y="336" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">shuning uchun jadval ham shart emas.</text>
  <text x="470" y="404" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">⏱ O(n) · 💾 O(1) (ikki o'zgaruvchi)</text>

  <text x="430" y="442" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle" font-style="italic">Bir xil natija — ikki uslub: yuqoridan-pastga so'rab, yoki pastdan-yuqoriga qurib.</text>
</svg>
