<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>Merge sort: massivni ikkiga bo'lib pastga tushadi, so'ng saralangan holda birlashtirib yuqoriga ko'tariladi</title>
  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>
  <defs>
    <marker id="md" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="mu" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Merge sort — bo'l va birlashtir</text>
  <text x="200" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">↓ Bo'lish (yarmiga)</text>
  <text x="540" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">↑ Birlashtirish (saralangan)</text>

  <!-- Bo'lish strelkalari (chap, ko'k) -->
  <g stroke="#2563eb" stroke-width="1.6" marker-end="url(#md)">
    <line x1="300" y1="92" x2="170" y2="142"/>
    <line x1="170" y1="180" x2="100" y2="230"/>
    <line x1="190" y1="180" x2="240" y2="230"/>
  </g>
  <!-- Birlashtirish strelkalari (o'ng, yashil) -->
  <g stroke="#16a34a" stroke-width="1.6" marker-end="url(#mu)">
    <line x1="450" y1="142" x2="380" y2="92"/>
    <line x1="500" y1="230" x2="560" y2="180"/>
    <line x1="660" y1="230" x2="600" y2="180"/>
  </g>

  <!-- Daraja 0: butun massiv -->
  <g font-family="monospace" font-size="15" text-anchor="middle">
    <rect x="250" y="64" width="220" height="30" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="360" y="84" fill="#1e293b">[ 5 , 2 , 4 , 1 ]</text>

    <!-- Daraja 1 chap (bo'lingan) -->
    <rect x="110" y="148" width="120" height="30" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="170" y="168" fill="#1e293b">[ 5 , 2 ]</text>
    <!-- Daraja 1 o'ng (birlashgan) -->
    <rect x="490" y="148" width="120" height="30" rx="5" fill="#dcfce7" stroke="#16a34a"/>
    <text x="550" y="168" fill="#1e293b">[ 1 , 2 , 4 , 5 ]</text>

    <!-- Daraja 2: yakka elementlar -->
    <rect x="74" y="234" width="50" height="30" rx="5" fill="#f59e0b" stroke="#94a3b8"/>
    <text x="99" y="254" fill="#1e293b">[ 5 ]</text>
    <rect x="214" y="234" width="50" height="30" rx="5" fill="#f59e0b" stroke="#94a3b8"/>
    <text x="239" y="254" fill="#1e293b">[ 2 ]</text>
    <rect x="455" y="234" width="50" height="30" rx="5" fill="#dcfce7" stroke="#16a34a"/>
    <text x="480" y="254" fill="#1e293b">[ 2 , 5 ]</text>
    <rect x="595" y="234" width="50" height="30" rx="5" fill="#dcfce7" stroke="#16a34a"/>
    <text x="620" y="254" fill="#1e293b">[ 1 , 4 ]</text>
  </g>

  <line x1="360" y1="290" x2="360" y2="312" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="360" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">eng past: bitta element — o'zi-o'zicha saralangan</text>

  <!-- Birlashtirish (merge) tushuntirish paneli -->
  <rect x="60" y="324" width="600" height="92" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="360" y="346" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Merge: ikki saralangan ro'yxatni bittaga qo'shish</text>
  <g font-family="monospace" font-size="14" text-anchor="middle">
    <rect x="120" y="358" width="40" height="28" rx="4" fill="#dcfce7" stroke="#16a34a"/><text x="140" y="377" fill="#1e293b">2</text>
    <rect x="162" y="358" width="40" height="28" rx="4" fill="#dcfce7" stroke="#16a34a"/><text x="182" y="377" fill="#1e293b">5</text>
    <rect x="262" y="358" width="40" height="28" rx="4" fill="#dcfce7" stroke="#16a34a"/><text x="282" y="377" fill="#1e293b">1</text>
    <rect x="304" y="358" width="40" height="28" rx="4" fill="#dcfce7" stroke="#16a34a"/><text x="324" y="377" fill="#1e293b">4</text>
  </g>
  <text x="232" y="377" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#475569">+</text>
  <text x="360" y="377" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#475569">→</text>
  <g font-family="monospace" font-size="14" text-anchor="middle">
    <rect x="392" y="358" width="40" height="28" rx="4" fill="#16a34a" stroke="#94a3b8"/><text x="412" y="377" fill="#f8fafc">1</text>
    <rect x="434" y="358" width="40" height="28" rx="4" fill="#16a34a" stroke="#94a3b8"/><text x="454" y="377" fill="#f8fafc">2</text>
    <rect x="476" y="358" width="40" height="28" rx="4" fill="#16a34a" stroke="#94a3b8"/><text x="496" y="377" fill="#f8fafc">4</text>
    <rect x="518" y="358" width="40" height="28" rx="4" fill="#16a34a" stroke="#94a3b8"/><text x="538" y="377" fill="#f8fafc">5</text>
  </g>
  <text x="360" y="406" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Har qadamda ikki boshidagi kichigini olamiz — natija doim saralangan bo'ladi</text>

  <text x="360" y="446" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Daraxt balandligi log n, har daraja n ish → jami O(n log n)</text>
</svg>
