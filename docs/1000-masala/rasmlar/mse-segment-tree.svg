<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" width="780" height="540">
  <title>Segment tree — har tugun bir oraliq yig'indisi; range query bir nechta tugunni qo'shadi</title>
  <rect x="0" y="0" width="780" height="540" fill="#f8fafc"/>
  <text x="390" y="30" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Segment tree (yig'indi) — qurilish va range so'rov</text>
  <text x="390" y="54" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Massiv [2, 5, 1, 4, 9, 3] · har tugun = o'z oralig'idagi elementlar yig'indisi</text>

  <defs>
    <marker id="sg" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- edges -->
  <line x1="390" y1="110" x2="210" y2="170" stroke="#475569" stroke-width="2"/>
  <line x1="390" y1="110" x2="570" y2="170" stroke="#475569" stroke-width="2"/>
  <line x1="210" y1="204" x2="120" y2="264" stroke="#475569" stroke-width="2"/>
  <line x1="210" y1="204" x2="300" y2="264" stroke="#475569" stroke-width="2"/>
  <line x1="570" y1="204" x2="570" y2="264" stroke="#475569" stroke-width="2"/>
  <!-- leaves under [0,1] -->
  <line x1="120" y1="298" x2="80" y2="358" stroke="#475569" stroke-width="2"/>
  <line x1="120" y1="298" x2="160" y2="358" stroke="#475569" stroke-width="2"/>
  <!-- leaves under [2,3] -->
  <line x1="300" y1="298" x2="260" y2="358" stroke="#475569" stroke-width="2"/>
  <line x1="300" y1="298" x2="340" y2="358" stroke="#475569" stroke-width="2"/>
  <!-- leaves under [4,5] -->
  <line x1="570" y1="298" x2="530" y2="358" stroke="#475569" stroke-width="2"/>
  <line x1="570" y1="298" x2="610" y2="358" stroke="#475569" stroke-width="2"/>

  <!-- root [0,5]=24 -->
  <rect x="345" y="76" width="90" height="34" rx="6" fill="#2563eb"/>
  <text x="390" y="93" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffffff">[0,5]</text>
  <text x="390" y="107" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffffff">sum=24</text>

  <!-- [0,2]=8 (highlighted partial -> recurse) -->
  <rect x="165" y="170" width="90" height="34" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="210" y="187" text-anchor="middle" font-family="monospace" font-size="13" fill="#1e293b">[0,2]</text>
  <text x="210" y="201" text-anchor="middle" font-family="monospace" font-size="13" fill="#1e293b">sum=8</text>

  <!-- [3,5]=16 (fully inside query -> use directly) -->
  <rect x="525" y="170" width="90" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="570" y="187" text-anchor="middle" font-family="monospace" font-size="13" fill="#1e293b">[3,5]</text>
  <text x="570" y="201" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">sum=16 ✓</text>

  <!-- [0,1]=7 (fully inside -> use directly) -->
  <rect x="75" y="264" width="90" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="120" y="281" text-anchor="middle" font-family="monospace" font-size="13" fill="#1e293b">[0,1]</text>
  <text x="120" y="295" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">sum=7 ✓</text>

  <!-- [2,2]=1 (outside query [0,2]? actually 2 included) -> leaf used -->
  <rect x="255" y="264" width="90" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="300" y="281" text-anchor="middle" font-family="monospace" font-size="13" fill="#1e293b">[2,3]</text>
  <text x="300" y="295" text-anchor="middle" font-family="monospace" font-size="13" fill="#1e293b">sum=5</text>

  <!-- [4,5]=12 child -->
  <rect x="525" y="264" width="90" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="570" y="281" text-anchor="middle" font-family="monospace" font-size="13" fill="#1e293b">[4,5]</text>
  <text x="570" y="295" text-anchor="middle" font-family="monospace" font-size="13" fill="#1e293b">sum=12</text>

  <!-- leaves -->
  <g font-family="monospace" font-size="13">
    <rect x="55" y="358" width="50" height="34" rx="5" fill="#dcfce7" stroke="#16a34a"/>
    <text x="80" y="380" text-anchor="middle" fill="#1e293b">2</text>
    <rect x="135" y="358" width="50" height="34" rx="5" fill="#dcfce7" stroke="#16a34a"/>
    <text x="160" y="380" text-anchor="middle" fill="#1e293b">5</text>
    <rect x="235" y="358" width="50" height="34" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="260" y="380" text-anchor="middle" fill="#1e293b">1</text>
    <rect x="315" y="358" width="50" height="34" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="340" y="380" text-anchor="middle" fill="#1e293b">4</text>
    <rect x="505" y="358" width="50" height="34" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="530" y="380" text-anchor="middle" fill="#1e293b">9</text>
    <rect x="585" y="358" width="50" height="34" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="610" y="380" text-anchor="middle" fill="#1e293b">3</text>
  </g>
  <!-- leaf indices -->
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">
    <text x="80" y="408" text-anchor="middle">i=0</text>
    <text x="160" y="408" text-anchor="middle">1</text>
    <text x="260" y="408" text-anchor="middle">2</text>
    <text x="340" y="408" text-anchor="middle">3</text>
    <text x="530" y="408" text-anchor="middle">4</text>
    <text x="610" y="408" text-anchor="middle">5</text>
  </g>

  <!-- query explanation -->
  <rect x="60" y="430" width="660" height="98" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="80" y="456" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">query(0, 4) — [0,4] oralig'i yig'indisi:</text>
  <circle cx="90" cy="476" r="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="106" y="481" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">tugun oralig'i so'rovga TO'LIQ kirsa → yig'indini darrov ol</text>
  <circle cx="90" cy="500" r="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="106" y="505" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">qisman kessa → ikki bolaga tushib davom et (rekursiya)</text>
  <text x="430" y="481" font-family="monospace" font-size="14" fill="#16a34a">[0,1]=7 + [2,2]=1</text>
  <text x="430" y="505" font-family="monospace" font-size="14" fill="#16a34a">+ [3,4]=13  →  21</text>
  <text x="430" y="524" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">O(log n) ta tugun yetarli</text>
</svg>
