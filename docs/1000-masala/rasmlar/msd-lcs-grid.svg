<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540">
  <title>LCS: eng uzun umumiy qism-ketma-ketlik, dp grid A=ABCBDAB, B=BDCAB</title>
  <rect x="0" y="0" width="760" height="540" fill="#f8fafc"/>
  <text x="30" y="32" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#2563eb">LCS — dp[i][j]: A[1..i] va B[1..j] ning umumiy qism-ketma-ketligi uzunligi</text>
  <text x="30" y="55" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">A = "ABCB"  ·  B = "BDCB"  ·  Javob: LCS = "BCB", uzunligi 3</text>

  <!-- column headers: "" B D C B -->
  <g font-family="monospace" font-size="16" text-anchor="middle" font-weight="bold" fill="#dc2626">
    <text x="200" y="98">""</text><text x="270" y="98">B</text><text x="340" y="98">D</text><text x="410" y="98">C</text><text x="480" y="98">B</text>
  </g>
  <!-- row headers: "" A B C B -->
  <g font-family="monospace" font-size="16" text-anchor="middle" font-weight="bold" fill="#16a34a">
    <text x="160" y="135">""</text><text x="160" y="195">A</text><text x="160" y="255">B</text><text x="160" y="315">C</text><text x="160" y="375">B</text>
  </g>

  <!-- grid 5x5 cells -->
  <g font-family="monospace" font-size="16" text-anchor="middle" fill="#1e293b">
    <!-- row 0 -->
    <rect x="175" y="110" width="50" height="50" fill="#e2e8f0" stroke="#94a3b8"/><text x="200" y="141">0</text>
    <rect x="245" y="110" width="50" height="50" fill="#e2e8f0" stroke="#94a3b8"/><text x="270" y="141">0</text>
    <rect x="315" y="110" width="50" height="50" fill="#e2e8f0" stroke="#94a3b8"/><text x="340" y="141">0</text>
    <rect x="385" y="110" width="50" height="50" fill="#e2e8f0" stroke="#94a3b8"/><text x="410" y="141">0</text>
    <rect x="455" y="110" width="50" height="50" fill="#e2e8f0" stroke="#94a3b8"/><text x="480" y="141">0</text>
    <!-- row A -->
    <rect x="175" y="170" width="50" height="50" fill="#e2e8f0" stroke="#94a3b8"/><text x="200" y="201">0</text>
    <rect x="245" y="170" width="50" height="50" fill="#fff" stroke="#94a3b8"/><text x="270" y="201">0</text>
    <rect x="315" y="170" width="50" height="50" fill="#fff" stroke="#94a3b8"/><text x="340" y="201">0</text>
    <rect x="385" y="170" width="50" height="50" fill="#fff" stroke="#94a3b8"/><text x="410" y="201">0</text>
    <rect x="455" y="170" width="50" height="50" fill="#fff" stroke="#94a3b8"/><text x="480" y="201">0</text>
    <!-- row B -->
    <rect x="175" y="230" width="50" height="50" fill="#e2e8f0" stroke="#94a3b8"/><text x="200" y="261">0</text>
    <rect x="245" y="230" width="50" height="50" fill="#dcfce7" stroke="#16a34a"/><text x="270" y="261">1</text>
    <rect x="315" y="230" width="50" height="50" fill="#fff" stroke="#94a3b8"/><text x="340" y="261">1</text>
    <rect x="385" y="230" width="50" height="50" fill="#fff" stroke="#94a3b8"/><text x="410" y="261">1</text>
    <rect x="455" y="230" width="50" height="50" fill="#dcfce7" stroke="#16a34a"/><text x="480" y="261">1</text>
    <!-- row C -->
    <rect x="175" y="290" width="50" height="50" fill="#e2e8f0" stroke="#94a3b8"/><text x="200" y="321">0</text>
    <rect x="245" y="290" width="50" height="50" fill="#fff" stroke="#94a3b8"/><text x="270" y="321">1</text>
    <rect x="315" y="290" width="50" height="50" fill="#fff" stroke="#94a3b8"/><text x="340" y="321">1</text>
    <rect x="385" y="290" width="50" height="50" fill="#dcfce7" stroke="#16a34a"/><text x="410" y="321">2</text>
    <rect x="455" y="290" width="50" height="50" fill="#fff" stroke="#94a3b8"/><text x="480" y="321">2</text>
    <!-- row B -->
    <rect x="175" y="350" width="50" height="50" fill="#e2e8f0" stroke="#94a3b8"/><text x="200" y="381">0</text>
    <rect x="245" y="350" width="50" height="50" fill="#dcfce7" stroke="#16a34a"/><text x="270" y="381">1</text>
    <rect x="315" y="350" width="50" height="50" fill="#fff" stroke="#94a3b8"/><text x="340" y="381">1</text>
    <rect x="385" y="350" width="50" height="50" fill="#fff" stroke="#94a3b8"/><text x="410" y="381">2</text>
    <rect x="455" y="350" width="50" height="50" fill="#bfdbfe" stroke="#2563eb"/><text x="480" y="381">3</text>
  </g>

  <!-- diagonal backtrack path arrows (match cells) -->
  <defs>
    <marker id="ml-ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <g stroke="#2563eb" stroke-width="2.2" fill="none" stroke-dasharray="5 4">
    <path d="M 456 351 L 411 306"/>
    <path d="M 384 291 L 341 248 L 296 248 L 271 230"/>
  </g>
  <text x="525" y="378" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#2563eb" font-weight="bold">← javob</text>

  <!-- transition legend -->
  <text x="30" y="438" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">O'tish qoidasi:</text>
  <rect x="30" y="448" width="350" height="34" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <text x="44" y="470" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Belgilar MOS → diagonal (yuqori-chap) + 1</text>
  <rect x="30" y="486" width="350" height="34" rx="5" fill="#fff" stroke="#94a3b8"/>
  <text x="44" y="508" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">MOS EMAS → max(yuqori, chap)</text>

  <text x="400" y="470" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Yashil kataklar — belgilar mos kelgan</text>
  <text x="400" y="490" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">joylar (B, C, B). Ko'k punktir — pastki-o'ng</text>
  <text x="400" y="510" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">burchakdan teskari yo'l (backtrack) bilan LCS.</text>
</svg>
