<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400">
  <title>BST inorder traversal — chap, root, o'ng tartibi saralangan natija beradi</title>
  <rect x="0" y="0" width="560" height="400" fill="#f8fafc"/>
  <text x="280" y="30" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#1e293b" text-anchor="middle">Inorder traversal — chap → root → o'ng</text>

  <!-- qirralar -->
  <line x1="280" y1="80" x2="170" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <line x1="280" y1="80" x2="390" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <line x1="170" y1="150" x2="110" y2="220" stroke="#94a3b8" stroke-width="2"/>
  <line x1="170" y1="150" x2="230" y2="220" stroke="#94a3b8" stroke-width="2"/>
  <line x1="390" y1="150" x2="450" y2="220" stroke="#94a3b8" stroke-width="2"/>

  <!-- tugunlar (BST: chap < root < o'ng) -->
  <!-- root 8 -->
  <circle cx="280" cy="80" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="280" y="86" font-family="monospace" font-size="17" fill="#1e293b" text-anchor="middle">8</text>
  <text x="280" y="56" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">root</text>

  <!-- chap 3 -->
  <circle cx="170" cy="150" r="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="170" y="156" font-family="monospace" font-size="17" fill="#1e293b" text-anchor="middle">3</text>
  <!-- o'ng 10 -->
  <circle cx="390" cy="150" r="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="390" y="156" font-family="monospace" font-size="17" fill="#1e293b" text-anchor="middle">10</text>

  <!-- 1 -->
  <circle cx="110" cy="220" r="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="110" y="226" font-family="monospace" font-size="17" fill="#1e293b" text-anchor="middle">1</text>
  <!-- 6 -->
  <circle cx="230" cy="220" r="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="230" y="226" font-family="monospace" font-size="17" fill="#1e293b" text-anchor="middle">6</text>
  <!-- 14 -->
  <circle cx="450" cy="220" r="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="450" y="226" font-family="monospace" font-size="17" fill="#1e293b" text-anchor="middle">14</text>

  <!-- chap < root < o'ng eslatma -->
  <text x="195" y="118" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">chap kichik</text>
  <text x="365" y="118" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">o'ng katta</text>

  <!-- natija lentasi -->
  <text x="280" y="290" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Inorder natija (avtomatik saralangan):</text>
  <g font-family="monospace" font-size="16" fill="#1e293b" text-anchor="middle">
    <rect x="70" y="308" width="56" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="98" y="334">1</text>
    <rect x="134" y="308" width="56" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="162" y="334">3</text>
    <rect x="198" y="308" width="56" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="226" y="334">6</text>
    <rect x="262" y="308" width="56" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="290" y="334">8</text>
    <rect x="326" y="308" width="56" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="354" y="334">10</text>
    <rect x="390" y="308" width="56" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="418" y="334">14</text>
  </g>
  <text x="280" y="378" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Har tugunda: avval chap shoxni to'liq kez, keyin o'zini, keyin o'ng shoxni</text>
</svg>
