<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540">
  <title>N-Queens backtracking — qaror daraxti: tanlash, rekursiya, orqaga qaytish</title>
  <rect x="0" y="0" width="760" height="540" fill="#f8fafc"/>
  <text x="380" y="30" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">N-Queens (4×4) — backtracking qaror daraxti</text>
  <text x="380" y="54" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Har qatorda ustun tanlaymiz → rekursiya → berk yo'lda orqaga qaytamiz (undo)</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#475569"/>
    </marker>
    <marker id="arRed" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#dc2626"/>
    </marker>
    <marker id="arGreen" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Level labels -->
  <text x="60" y="100" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">qator 0</text>
  <text x="60" y="190" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">qator 1</text>
  <text x="60" y="290" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">qator 2</text>
  <text x="60" y="390" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">qator 3</text>

  <!-- Root -->
  <rect x="340" y="76" width="80" height="34" rx="6" fill="#2563eb"/>
  <text x="380" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#ffffff" font-weight="bold">start</text>

  <!-- Row0 choices: c=0 (branch we follow) and c=1 -->
  <line x1="360" y1="110" x2="250" y2="166" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="400" y1="110" x2="540" y2="166" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="4 3"/>
  <text x="290" y="142" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">ustun 0</text>
  <text x="478" y="142" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">ustun 1...</text>

  <rect x="200" y="166" width="100" height="34" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="250" y="188" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Q ustun 0</text>
  <rect x="490" y="166" width="100" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="540" y="188" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">boshqa shox</text>

  <!-- Row1: from c=0, c=0,c=1 hujum (kesiladi), c=2 OK -->
  <line x1="220" y1="200" x2="165" y2="262" stroke="#dc2626" stroke-width="2" marker-end="url(#arRed)"/>
  <line x1="250" y1="200" x2="250" y2="262" stroke="#dc2626" stroke-width="2" marker-end="url(#arRed)"/>
  <line x1="280" y1="200" x2="340" y2="262" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="120" y="234" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">ust.0 ✗</text>
  <text x="215" y="248" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">ust.1 ✗</text>
  <text x="305" y="234" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">ust.2 ✓</text>

  <rect x="120" y="262" width="90" height="34" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="165" y="284" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">hujum: kes</text>
  <rect x="300" y="262" width="100" height="34" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="350" y="284" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Q ustun 2</text>

  <!-- Row2: from c=2 -> berk (barcha ustun hujum), undo -->
  <line x1="350" y1="296" x2="350" y2="362" stroke="#dc2626" stroke-width="2" marker-end="url(#arRed)"/>
  <text x="356" y="334" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">berk yo'l</text>
  <rect x="295" y="362" width="160" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="375" y="385" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">orqaga qaytish (undo)</text>

  <!-- Backtrack curve -->
  <path d="M295,380 C200,400 180,360 250,205" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="120" y="380" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#f59e0b">↩ qadamni bekor qil,</text>
  <text x="120" y="398" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#f59e0b">keyingi ustunni sina</text>

  <!-- Success branch indicator -->
  <rect x="560" y="262" width="170" height="36" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="645" y="285" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">qator==N → yechim ✓</text>
  <line x1="560" y1="280" x2="410" y2="280" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arGreen)"/>

  <!-- Legend / pattern box -->
  <rect x="80" y="430" width="600" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="100" y="456" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Asosiy naqsh (har qadamda):</text>
  <text x="100" y="480" font-family="monospace" font-size="14" fill="#2563eb">1) tanlash:</text>
  <text x="200" y="480" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">ustunni belgilash (cols, diag1, diag2 ga qo'sh)</text>
  <text x="100" y="500" font-family="monospace" font-size="14" fill="#2563eb">2) rekursiya:</text>
  <text x="200" y="500" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">place(row+1) — keyingi qatorga o't</text>
  <text x="100" y="518" font-family="monospace" font-size="14" fill="#dc2626">3) undo:</text>
  <text x="200" y="518" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">belgini olib tashlash — boshqa ustunni sinash</text>
</svg>
