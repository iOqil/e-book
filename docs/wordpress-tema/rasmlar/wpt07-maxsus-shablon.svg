<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" width="780" height="480" font-family="Segoe UI, system-ui, sans-serif">
  <title>Maxsus shablonlar: single-{type}.php va page-{slug}.php aniqlikdan umumiylikka</title>
  <rect x="0" y="0" width="780" height="480" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Maxsus shablonlar: aniqdan umumiyga</text>
  <text x="390" y="56" text-anchor="middle" font-size="14" fill="#475569">WordPress tepadan pastga qaraydi, birinchi topilgan faylni oladi</text>

  <!-- Left column: single (post type) -->
  <text x="200" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#2563eb">"kitob" yozuvi ochildi</text>

  <rect x="60" y="108" width="280" height="56" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <text x="200" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">1. single-kitob.php</text>
  <text x="200" y="153" text-anchor="middle" font-size="13" fill="#475569">aynan shu post type uchun</text>

  <rect x="60" y="178" width="280" height="56" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="200" y="202" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">2. single.php</text>
  <text x="200" y="223" text-anchor="middle" font-size="13" fill="#475569">har qanday yozuv uchun</text>

  <rect x="60" y="248" width="280" height="56" rx="9" fill="#475569"/>
  <text x="200" y="272" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3. index.php</text>
  <text x="200" y="293" text-anchor="middle" font-size="13" fill="#e2e8f0">zaxira</text>

  <line x1="200" y1="164" x2="200" y2="178" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="194,178 200,188 206,178" fill="#94a3b8"/>
  <line x1="200" y1="234" x2="200" y2="248" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="194,248 200,258 206,248" fill="#94a3b8"/>

  <!-- Right column: page (slug) -->
  <text x="580" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#d97706">"aloqa" sahifasi ochildi</text>

  <rect x="440" y="108" width="280" height="56" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <text x="580" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">1. page-aloqa.php</text>
  <text x="580" y="153" text-anchor="middle" font-size="13" fill="#475569">aynan shu slug uchun</text>

  <rect x="440" y="178" width="280" height="56" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="580" y="202" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">2. page.php</text>
  <text x="580" y="223" text-anchor="middle" font-size="13" fill="#475569">har qanday sahifa uchun</text>

  <rect x="440" y="248" width="280" height="56" rx="9" fill="#475569"/>
  <text x="580" y="272" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3. index.php</text>
  <text x="580" y="293" text-anchor="middle" font-size="13" fill="#e2e8f0">zaxira</text>

  <line x1="580" y1="164" x2="580" y2="178" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="574,178 580,188 586,178" fill="#94a3b8"/>
  <line x1="580" y1="234" x2="580" y2="248" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="574,248 580,258 586,248" fill="#94a3b8"/>

  <!-- aniqlik strelkasi -->
  <rect x="60" y="332" width="660" height="40" rx="8" fill="#e2e8f0"/>
  <text x="90" y="357" font-size="14" font-weight="700" fill="#16a34a">Aniqroq</text>
  <line x1="160" y1="352" x2="620" y2="352" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="620,346 634,352 620,358" fill="#94a3b8"/>
  <text x="690" y="357" font-size="14" font-weight="700" fill="#475569" text-anchor="end">Umumiyroq</text>

  <text x="390" y="406" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">page-{slug}.php va single-{type}.php AVTOMATIK tanlanadi</text>
  <text x="390" y="430" text-anchor="middle" font-size="13" fill="#475569">Fayl nomi to'g'ri bo'lsa kifoya - tahrirda hech narsa bosish shart emas</text>
  <text x="390" y="458" text-anchor="middle" font-size="13" fill="#dc2626">category-{slug}.php ham xuddi shunday: aniq kategoriya uchun</text>
</svg>
