<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>theme.json yuqori darajadagi kalitlar: version, settings, styles, templateParts, customTemplates, patterns</title>
  <rect width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">theme.json — yuqori darajadagi kalitlar</text>

  <!-- root box -->
  <rect x="300" y="56" width="160" height="44" rx="8" fill="#21759b"/>
  <text x="380" y="83" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">theme.json</text>

  <!-- connector lines -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M380 100 L380 120 L80 120 L80 150"/>
    <path d="M380 120 L235 120 L235 150"/>
    <path d="M380 120 L380 150"/>
    <path d="M380 120 L525 120 L525 150"/>
    <path d="M380 120 L680 120 L680 150"/>
  </g>

  <!-- version -->
  <rect x="20" y="150" width="120" height="58" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="80" y="176" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">version</text>
  <text x="80" y="197" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">3 (majburiy)</text>

  <!-- settings (highlighted - this chapter) -->
  <rect x="170" y="150" width="130" height="58" rx="8" fill="#2563eb" stroke="#1e3a8a" stroke-width="2"/>
  <text x="235" y="176" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">settings</text>
  <text x="235" y="197" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dbeafe">16-bob (bu yer)</text>

  <!-- styles -->
  <rect x="320" y="150" width="120" height="58" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="380" y="176" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">styles</text>
  <text x="380" y="197" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">17-bob</text>

  <!-- templateParts -->
  <rect x="460" y="150" width="130" height="58" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="525" y="176" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">templateParts</text>
  <text x="525" y="197" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">18-bob</text>

  <!-- customTemplates -->
  <rect x="610" y="150" width="140" height="58" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="680" y="173" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">customTemplates</text>
  <text x="680" y="194" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">+ patterns</text>

  <!-- settings expansion -->
  <rect x="130" y="248" width="500" height="200" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="274" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">settings ichi (16-bob mavzusi)</text>

  <g font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">
    <rect x="150" y="290" width="135" height="36" rx="6" fill="#dbeafe"/>
    <text x="217" y="313" text-anchor="middle" font-weight="bold">color</text>

    <rect x="300" y="290" width="135" height="36" rx="6" fill="#dcfce7"/>
    <text x="367" y="313" text-anchor="middle" font-weight="bold">typography</text>

    <rect x="450" y="290" width="160" height="36" rx="6" fill="#fef3c7"/>
    <text x="530" y="313" text-anchor="middle" font-weight="bold">spacing</text>

    <rect x="150" y="338" width="135" height="36" rx="6" fill="#e2e8f0"/>
    <text x="217" y="361" text-anchor="middle" font-weight="bold">layout</text>

    <rect x="300" y="338" width="135" height="36" rx="6" fill="#e2e8f0"/>
    <text x="367" y="361" text-anchor="middle" font-weight="bold">appearanceTools</text>

    <rect x="450" y="338" width="160" height="36" rx="6" fill="#e2e8f0"/>
    <text x="530" y="361" text-anchor="middle" font-weight="bold">blocks (per-block)</text>
  </g>

  <text x="380" y="408" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Har biri foydalanuvchiga qaysi sozlamalar ko'rinishini boshqaradi</text>
  <text x="380" y="430" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">va preset CSS o'zgaruvchilarni yaratadi (--wp--preset--...)</text>
</svg>
