  <!-- yon menyu -->
  <rect x="24" y="52" width="240" height="360" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="24" y="52" width="240" height="42" rx="10" fill="#21759b"/>
  <text x="144" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Tahrirlash bo'limlari</text>

  <rect x="44" y="108" width="200" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="60" y="136" font-size="16" fill="#1e293b">Navigation (menyu)</text>

  <rect x="44" y="160" width="200" height="44" rx="8" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="60" y="188" font-size="16" fill="#1e293b">Styles (global stil)</text>

  <rect x="44" y="212" width="200" height="44" rx="8" fill="#fde68a" stroke="#d97706"/>
