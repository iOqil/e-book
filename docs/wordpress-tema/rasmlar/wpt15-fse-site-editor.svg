  <rect x="44" y="264" width="200" height="44" rx="8" fill="#e2e8f0" stroke="#475569"/>
  <text x="60" y="292" font-size="16" fill="#1e293b">Templates (shablonlar)</text>

  <rect x="44" y="316" width="200" height="44" rx="8" fill="#e2e8f0" stroke="#475569"/>
