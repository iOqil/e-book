  <rect x="344" y="192" width="348" height="28" rx="4" fill="#bfdbfe"/>
  <text x="356" y="211" font-size="14" fill="#1e293b" font-family="Consolas, monospace">wp:post-title</text>
  <rect x="344" y="228" width="348" height="28" rx="4" fill="#bfdbfe"/>
  <text x="356" y="247" font-size="14" fill="#1e293b" font-family="Consolas, monospace">wp:post-content</text>
  <rect x="344" y="264" width="348" height="50" rx="4" fill="#e2e8f0"/>
