  <text x="44" y="392" font-size="14" fill="#94a3b8">Kod yozmasdan, vizual.</text>

  <!-- kanvas -->
  <rect x="300" y="52" width="436" height="360" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
