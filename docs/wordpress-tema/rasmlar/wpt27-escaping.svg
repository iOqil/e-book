<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>Escaping funksiyalari va ularning HTML konteksti</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">Escaping — CHIQISHda himoya (kontekstga qarab)</text>
  <text x="380" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">"Har dinamik chiqishni eng oxirgi nuqtada escape qil"</text>

  <!-- esc_html -->
  <rect x="30" y="84" width="345" height="110" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="30" y="84" width="345" height="30" rx="10" fill="#2563eb"/>
  <text x="46" y="105" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">esc_html()</text>
  <text x="46" y="135" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Kontekst: HTML matn (teglar orasi)</text>
  <text x="46" y="158" font-family="Consolas, monospace" font-size="13" fill="#1e293b">&lt;h2&gt;&lt;?php echo esc_html($t); ?&gt;&lt;/h2&gt;</text>
  <text x="46" y="180" font-family="Consolas, monospace" font-size="13" fill="#16a34a">&lt;script&gt; -&gt; &amp;lt;script&amp;gt;</text>

  <!-- esc_attr -->
  <rect x="385" y="84" width="345" height="110" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="385" y="84" width="345" height="30" rx="10" fill="#16a34a"/>
  <text x="401" y="105" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">esc_attr()</text>
  <text x="401" y="135" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Kontekst: atribut qiymati</text>
  <text x="401" y="158" font-family="Consolas, monospace" font-size="13" fill="#1e293b">value="&lt;?php echo esc_attr($v); ?&gt;"</text>
  <text x="401" y="180" font-family="Consolas, monospace" font-size="13" fill="#16a34a">" -&gt; &amp;quot;  (atributdan chiqib ketmaydi)</text>

  <!-- esc_url -->
  <rect x="30" y="208" width="345" height="110" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <rect x="30" y="208" width="345" height="30" rx="10" fill="#d97706"/>
  <text x="46" y="229" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">esc_url()</text>
  <text x="46" y="259" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Kontekst: URL (href, src)</text>
  <text x="46" y="282" font-family="Consolas, monospace" font-size="13" fill="#1e293b">href="&lt;?php echo esc_url($u); ?&gt;"</text>
  <text x="46" y="304" font-family="Consolas, monospace" font-size="13" fill="#dc2626">javascript:alert(1) -&gt; (bo'sh!)</text>

  <!-- wp_kses_post -->
  <rect x="385" y="208" width="345" height="110" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="385" y="208" width="345" height="30" rx="10" fill="#7c3aed"/>
  <text x="401" y="229" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">wp_kses_post()</text>
  <text x="401" y="259" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Kontekst: ruxsat etilgan boy HTML</text>
  <text x="401" y="282" font-family="Consolas, monospace" font-size="13" fill="#1e293b">echo wp_kses_post($boy_matn);</text>
  <text x="401" y="304" font-family="Consolas, monospace" font-size="13" fill="#16a34a">&lt;strong&gt; qoladi, &lt;script&gt; o'chadi</text>

  <!-- bottom note: qo'shimcha funksiyalar -->
  <rect x="30" y="340" width="700" height="100" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="46" y="365" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Boshqa kontekstlar:</text>
  <text x="46" y="390" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569"><tspan font-family="Consolas, monospace" fill="#1e293b">esc_textarea()</tspan> — &lt;textarea&gt; ichida    <tspan font-family="Consolas, monospace" fill="#1e293b">esc_js()</tspan> — inline JS string ichida</text>
  <text x="46" y="414" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569"><tspan font-family="Consolas, monospace" fill="#1e293b">esc_html__() / esc_attr_e()</tspan> — escape + i18n (tarjima) birga</text>
  <text x="46" y="434" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-style="italic" fill="#475569">Qoida: noto'g'ri kontekst funksiyasi = yarim himoya. Atributda esc_attr, teg orasida esc_html.</text>
</svg>
