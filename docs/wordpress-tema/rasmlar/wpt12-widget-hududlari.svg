<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <title>Widget hududlari dizayni: footer 3 kolonka misoli</title>
  <rect x="0" y="0" width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="34" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Widget hududlari dizayni: footer 3 kolonka</text>

  <!-- Browser frame -->
  <rect x="40" y="60" width="680" height="320" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>

  <!-- header bar -->
  <rect x="40" y="60" width="680" height="44" rx="10" fill="#1e293b"/>
  <rect x="40" y="90" width="680" height="14" fill="#1e293b"/>
  <text x="64" y="88" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#f8fafc">Sayt header (logo + menyu)</text>

  <!-- main content -->
  <rect x="64" y="124" width="430" height="160" rx="8" fill="#e2e8f0"/>
  <text x="279" y="208" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#475569" text-anchor="middle">Asosiy kontent (The Loop)</text>

  <!-- sidebar (sidebar-1) -->
  <rect x="510" y="124" width="186" height="160" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="603" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">sidebar-1</text>
  <rect x="524" y="162" width="158" height="34" rx="5" fill="#ffffff"/>
  <text x="603" y="184" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Qidiruv widgeti</text>
  <rect x="524" y="204" width="158" height="34" rx="5" fill="#ffffff"/>
  <text x="603" y="226" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Oxirgi postlar</text>
  <rect x="524" y="246" width="158" height="28" rx="5" fill="#ffffff"/>
  <text x="603" y="265" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Kategoriyalar</text>

  <!-- footer widget areas -->
  <rect x="64" y="300" width="200" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="164" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">footer-1</text>
  <text x="164" y="348" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Sayt haqida</text>

  <rect x="280" y="300" width="200" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">footer-2</text>
  <text x="380" y="348" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Tezkor havolalar</text>

  <rect x="496" y="300" width="200" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="596" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">footer-3</text>
  <text x="596" y="348" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Ijtimoiy tarmoq</text>

  <!-- legend -->
  <rect x="40" y="402" width="20" height="20" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="68" y="418" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">register_sidebar( id =&gt; 'sidebar-1' )</text>
  <rect x="360" y="402" width="20" height="20" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="388" y="418" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">3 ta hudud: footer-1, footer-2, footer-3</text>
  <text x="40" y="446" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">Har bir kulrang-ko'k blok = bitta widget hududi; ichidagi oq qutilar = foydalanuvchi qo'ygan widgetlar</text>
</svg>
