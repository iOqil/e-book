<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440">
  <title>Dependency grafi: app.js jquery va slider'ga bog'liq, WordPress tartibni avtomatik aniqlaydi</title>
  <rect width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Dependency: tartibni WordPress hal qiladi</text>

  <text x="380" y="62" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">deps massivida nima yozsangiz - u AVVAL yuklanadi</text>

  <!-- code box -->
  <rect x="40" y="84" width="680" height="92" rx="10" fill="#1e293b"/>
  <text x="58" y="112" font-family="Consolas, monospace" font-size="14" fill="#93c5fd">wp_enqueue_script(</text>
  <text x="58" y="134" font-family="Consolas, monospace" font-size="14" fill="#e2e8f0">  'app',  'app.js',  </text>
  <text x="262" y="134" font-family="Consolas, monospace" font-size="14" fill="#fbbf24">array('jquery','slider')</text>
  <text x="262" y="156" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">^ deps - shu skriptlar avval yuklanishi shart</text>
  <text x="58" y="156" font-family="Consolas, monospace" font-size="14" fill="#e2e8f0">);</text>

  <!-- graph nodes -->
  <!-- jquery -->
  <rect x="90" y="220" width="160" height="64" rx="10" fill="#2563eb"/>
  <text x="170" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">jquery</text>
  <text x="170" y="270" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dbeafe">1-yuklanadi</text>

  <!-- slider -->
  <rect x="300" y="220" width="160" height="64" rx="10" fill="#2563eb"/>
  <text x="380" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">slider</text>
  <text x="380" y="270" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dbeafe">2-yuklanadi</text>

  <!-- app -->
  <rect x="510" y="220" width="160" height="64" rx="10" fill="#16a34a"/>
  <text x="590" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">app</text>
  <text x="590" y="270" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dcfce7">3-yuklanadi</text>

  <!-- dependency arrows (app depends on slider depends-on-order, app depends on jquery) -->
  <line x1="510" y1="252" x2="462" y2="252" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="462,252 474,246 474,258" fill="#dc2626"/>

  <path d="M 510 268 Q 340 330 250 268" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="250,268 262,266 257,277" fill="#dc2626"/>

  <text x="380" y="330" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">qizil o'qlar = "men bunga bog'liqman" (app -> slider, app -> jquery)</text>

  <!-- result strip -->
  <rect x="90" y="356" width="580" height="56" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="380" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Natija HTML tartibi: jquery -> slider -> app</text>
  <text x="380" y="400" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Siz tartibni o'zingiz boshqarmaysiz - WordPress hisoblaydi.</text>
</svg>
