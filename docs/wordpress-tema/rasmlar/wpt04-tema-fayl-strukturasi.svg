<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Segoe UI, system-ui, sans-serif">
  <title>WordPress tema fayl strukturasi: klassik va block tema</title>
  <rect x="0" y="0" width="900" height="600" fill="#f8fafc"/>
  <text x="450" y="34" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">Tema papka strukturasi</text>

  <!-- KLASSIK -->
  <rect x="24" y="56" width="420" height="516" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="24" y="56" width="420" height="40" rx="10" fill="#2563eb"/>
  <text x="234" y="83" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Klassik (PHP shablon) tema</text>

  <text x="44" y="126" font-size="16" font-weight="bold" fill="#475569">portfolio-tema/</text>
  <!-- fayllar -->
  <g font-size="15" fill="#1e293b">
    <text x="70" y="156">style.css           <tspan fill="#dc2626" font-size="13">(MAJBURIY: header)</tspan></text>
    <text x="70" y="184">index.php           <tspan fill="#dc2626" font-size="13">(MAJBURIY: zaxira)</tspan></text>
    <text x="70" y="212">functions.php       <tspan fill="#94a3b8" font-size="13">(hook, setup)</tspan></text>
    <text x="70" y="240">screenshot.png      <tspan fill="#94a3b8" font-size="13">(1200x900)</tspan></text>
    <text x="70" y="268">header.php  footer.php  sidebar.php</text>
    <text x="70" y="296">single.php  page.php  archive.php  404.php</text>
  </g>
  <text x="70" y="328" font-size="15" font-weight="bold" fill="#16a34a">template-parts/</text>
  <text x="96" y="354" font-size="14" fill="#1e293b">content.php  content-none.php</text>
  <text x="70" y="386" font-size="15" font-weight="bold" fill="#16a34a">inc/</text>
  <text x="96" y="412" font-size="14" fill="#1e293b">custom-functions.php  setup.php</text>
  <text x="70" y="444" font-size="15" font-weight="bold" fill="#16a34a">assets/</text>
  <text x="96" y="470" font-size="14" fill="#1e293b">css/  js/  images/  fonts/</text>
  <text x="70" y="502" font-size="15" font-weight="bold" fill="#16a34a">languages/</text>
  <text x="96" y="528" font-size="14" fill="#1e293b">portfolio-tema.pot  uz.po  uz.mo</text>
  <text x="44" y="558" font-size="13" fill="#475569">Ko'rinish PHP shablonlar bilan quriladi</text>

  <!-- BLOCK -->
  <rect x="456" y="56" width="420" height="516" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="456" y="56" width="420" height="40" rx="10" fill="#21759b"/>
  <text x="666" y="83" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Block (FSE) tema</text>

  <text x="476" y="126" font-size="16" font-weight="bold" fill="#475569">portfolio-block/</text>
  <g font-size="15" fill="#1e293b">
    <text x="502" y="156">style.css           <tspan fill="#dc2626" font-size="13">(MAJBURIY: header)</tspan></text>
    <text x="502" y="184">theme.json          <tspan fill="#dc2626" font-size="13">(MAJBURIY: sozlama)</tspan></text>
    <text x="502" y="212">functions.php       <tspan fill="#94a3b8" font-size="13">(ixtiyoriy)</tspan></text>
    <text x="502" y="240">screenshot.png      <tspan fill="#94a3b8" font-size="13">(1200x900)</tspan></text>
  </g>
  <text x="502" y="272" font-size="15" font-weight="bold" fill="#16a34a">templates/</text>
  <text x="528" y="298" font-size="14" fill="#1e293b">index.html  single.html  page.html</text>
  <text x="528" y="322" font-size="14" fill="#1e293b">archive.html  404.html</text>
  <text x="502" y="354" font-size="15" font-weight="bold" fill="#16a34a">parts/</text>
  <text x="528" y="380" font-size="14" fill="#1e293b">header.html  footer.html</text>
  <text x="502" y="412" font-size="15" font-weight="bold" fill="#16a34a">patterns/</text>
  <text x="528" y="438" font-size="14" fill="#1e293b">hero.php  cta.php</text>
  <text x="502" y="470" font-size="15" font-weight="bold" fill="#16a34a">styles/</text>
  <text x="528" y="496" font-size="14" fill="#1e293b">dark.json  evening.json</text>
  <text x="502" y="528" font-size="15" font-weight="bold" fill="#16a34a">assets/</text>
  <text x="476" y="558" font-size="13" fill="#475569">Ko'rinish HTML block markup bilan quriladi</text>
</svg>
