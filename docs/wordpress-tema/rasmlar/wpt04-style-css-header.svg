<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Segoe UI, system-ui, sans-serif">
  <title>style.css header maydonlari va ularning vazifasi</title>
  <rect x="0" y="0" width="900" height="640" fill="#f8fafc"/>
  <text x="450" y="34" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">style.css header: WordPress temani shu yerdan taniydi</text>

  <!-- Kod paneli -->
  <rect x="24" y="56" width="470" height="556" rx="10" fill="#1e293b"/>
  <text x="44" y="88" font-size="15" font-family="Consolas, monospace" fill="#94a3b8">/*</text>
  <text x="44" y="116" font-size="15" font-family="Consolas, monospace" fill="#f59e0b">Theme Name:</text>
  <text x="200" y="116" font-size="15" font-family="Consolas, monospace" fill="#ffffff">Portfolio Tema</text>
  <text x="44" y="144" font-size="15" font-family="Consolas, monospace" fill="#f59e0b">Theme URI:</text>
  <text x="200" y="144" font-size="15" font-family="Consolas, monospace" fill="#ffffff">https://ioqil.uz/portfolio</text>
  <text x="44" y="172" font-size="15" font-family="Consolas, monospace" fill="#f59e0b">Author:</text>
  <text x="200" y="172" font-size="15" font-family="Consolas, monospace" fill="#ffffff">Oqil Imomnazarov</text>
  <text x="44" y="200" font-size="15" font-family="Consolas, monospace" fill="#f59e0b">Author URI:</text>
  <text x="200" y="200" font-size="15" font-family="Consolas, monospace" fill="#ffffff">https://ioqil.uz</text>
  <text x="44" y="228" font-size="15" font-family="Consolas, monospace" fill="#f59e0b">Description:</text>
  <text x="200" y="228" font-size="15" font-family="Consolas, monospace" fill="#ffffff">Yengil portfolio temasi.</text>
  <text x="44" y="256" font-size="15" font-family="Consolas, monospace" fill="#f59e0b">Version:</text>
  <text x="200" y="256" font-size="15" font-family="Consolas, monospace" fill="#ffffff">1.0.0</text>
  <text x="44" y="284" font-size="15" font-family="Consolas, monospace" fill="#f59e0b">License:</text>
  <text x="200" y="284" font-size="15" font-family="Consolas, monospace" fill="#ffffff">GPL v2 or later</text>
  <text x="44" y="312" font-size="15" font-family="Consolas, monospace" fill="#f59e0b">License URI:</text>
  <text x="200" y="312" font-size="15" font-family="Consolas, monospace" fill="#ffffff">http://...gpl-2.0.html</text>
  <text x="44" y="340" font-size="15" font-family="Consolas, monospace" fill="#f59e0b">Text Domain:</text>
  <text x="200" y="340" font-size="15" font-family="Consolas, monospace" fill="#ffffff">portfolio-tema</text>
  <text x="44" y="368" font-size="15" font-family="Consolas, monospace" fill="#f59e0b">Tags:</text>
  <text x="200" y="368" font-size="15" font-family="Consolas, monospace" fill="#ffffff">blog, portfolio</text>
  <text x="44" y="396" font-size="15" font-family="Consolas, monospace" fill="#f59e0b">Requires at least:</text>
  <text x="290" y="396" font-size="15" font-family="Consolas, monospace" fill="#ffffff">6.7</text>
  <text x="44" y="424" font-size="15" font-family="Consolas, monospace" fill="#f59e0b">Tested up to:</text>
  <text x="220" y="424" font-size="15" font-family="Consolas, monospace" fill="#ffffff">7.0</text>
  <text x="44" y="452" font-size="15" font-family="Consolas, monospace" fill="#f59e0b">Requires PHP:</text>
  <text x="220" y="452" font-size="15" font-family="Consolas, monospace" fill="#ffffff">8.0</text>
  <text x="44" y="480" font-size="15" font-family="Consolas, monospace" fill="#94a3b8">*/</text>

  <!-- Izohlar -->
  <text x="514" y="88" font-size="16" font-weight="bold" fill="#475569">Maydon vazifasi:</text>
  <g font-size="14" fill="#1e293b">
    <text x="514" y="116"><tspan fill="#2563eb" font-weight="bold">Theme Name</tspan> — admin'da ko'rinadigan nom (MAJBURIY)</text>
    <text x="514" y="144"><tspan fill="#2563eb" font-weight="bold">Theme URI</tspan> — tema sahifasi manzili</text>
    <text x="514" y="172"><tspan fill="#2563eb" font-weight="bold">Author</tspan> — muallif ismi</text>
    <text x="514" y="200"><tspan fill="#2563eb" font-weight="bold">Author URI</tspan> — muallif sayti</text>
    <text x="514" y="228"><tspan fill="#2563eb" font-weight="bold">Description</tspan> — tema tavsifi (admin'da)</text>
    <text x="514" y="256"><tspan fill="#2563eb" font-weight="bold">Version</tspan> — versiya (kesh-buzish, yangilash)</text>
    <text x="514" y="284"><tspan fill="#2563eb" font-weight="bold">License</tspan> — litsenziya (WP.org uchun GPL)</text>
    <text x="514" y="312"><tspan fill="#2563eb" font-weight="bold">License URI</tspan> — litsenziya matni manzili</text>
    <text x="514" y="340"><tspan fill="#2563eb" font-weight="bold">Text Domain</tspan> — tarjima kaliti (= papka nomi)</text>
    <text x="514" y="368"><tspan fill="#2563eb" font-weight="bold">Tags</tspan> — katalog filtrlari (vergul bilan)</text>
    <text x="514" y="396"><tspan fill="#2563eb" font-weight="bold">Requires at least</tspan> — minimal WP versiyasi</text>
    <text x="514" y="424"><tspan fill="#2563eb" font-weight="bold">Tested up to</tspan> — sinalgan WP versiyasi</text>
    <text x="514" y="452"><tspan fill="#2563eb" font-weight="bold">Requires PHP</tspan> — minimal PHP versiyasi</text>
  </g>

  <rect x="514" y="486" width="362" height="118" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="528" y="512" font-size="15" font-weight="bold" fill="#d97706">Diqqat</text>
  <text x="528" y="538" font-size="14" fill="#475569">Faqat <tspan font-weight="bold">Theme Name</tspan> majburiy. Qolganlari</text>
  <text x="528" y="560" font-size="14" fill="#475569">tavsiya etiladi — WordPress.org katalogiga</text>
  <text x="528" y="582" font-size="14" fill="#475569">yuborish uchun esa hammasi kerak.</text>
</svg>
