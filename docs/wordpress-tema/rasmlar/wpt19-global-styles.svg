<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430">
  <title>Global styles: Site Editor Styles paneli o'zgarishlari wp_global_styles post sifatida baza'ga saqlanadi, theme.json ustiga qatlam bo'ladi</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="30" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Global styles qanday ishlaydi</text>

  <!-- theme.json (fayl) -->
  <rect x="30" y="70" width="200" height="120" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="130" y="96" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">theme.json (fayl)</text>
  <text x="130" y="120" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Tema standarti</text>
  <text x="130" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Faqat dasturchi</text>
  <text x="130" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">o'zgartiradi</text>
  <text x="130" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" font-weight="bold">PASTKI QATLAM</text>

  <!-- Site Editor panel -->
  <rect x="530" y="70" width="200" height="120" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="630" y="96" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Site Editor</text>
  <text x="630" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">&gt; Styles paneli</text>
  <text x="630" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Rang / shrift / bo'shliq</text>
  <text x="630" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">UI orqali sozlash</text>
  <text x="630" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb" font-weight="bold">Foydalanuvchi</text>

  <!-- arrow to DB -->
  <line x1="630" y1="190" x2="630" y2="245" stroke="#2563eb" stroke-width="2"/>
  <polygon points="630,255 624,243 636,243" fill="#2563eb"/>
  <text x="648" y="225" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">Saqlash</text>

  <!-- DB -->
  <rect x="500" y="255" width="230" height="100" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="615" y="282" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#92400e">Ma'lumotlar bazasi</text>
  <text x="615" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">wp_global_styles</text>
  <text x="615" y="324" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">post type (post)</text>
  <text x="615" y="344" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#d97706" font-weight="bold">USTKI QATLAM</text>

  <!-- merge box -->
  <rect x="245" y="255" width="225" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="357" y="284" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#166534">Birlashma (merge)</text>
  <text x="357" y="308" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">baza ustun keladi</text>
  <text x="357" y="328" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">-&gt; yakuniy CSS</text>
  <text x="357" y="348" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" font-weight="bold">Sayt ko'rinishi</text>

  <!-- theme.json -> merge -->
  <line x1="130" y1="190" x2="130" y2="305" stroke="#475569" stroke-width="2"/>
  <line x1="130" y1="305" x2="240" y2="305" stroke="#475569" stroke-width="2"/>
  <polygon points="245,305 233,299 233,311" fill="#475569"/>

  <!-- DB -> merge -->
  <line x1="500" y1="305" x2="475" y2="305" stroke="#d97706" stroke-width="2"/>
  <polygon points="470,305 482,299 482,311" fill="#d97706"/>

  <text x="380" y="400" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626" font-weight="bold">Foydalanuvchi UI o'zgarishi theme.json faylga TEGMAYDI — baza ustiga yoziladi</text>
</svg>
