<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>Block temada templates/ va parts/ papkalari tuzilishi va vazifasi</title>
  <rect width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Block tema fayl strukturasi: templates/ va parts/</text>

  <!-- tema ildizi -->
  <rect x="30" y="58" width="200" height="34" rx="6" fill="#21759b"/>
  <text x="130" y="80" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">mening-temam/</text>

  <!-- style.css + theme.json -->
  <rect x="70" y="104" width="180" height="28" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="80" y="123" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">style.css</text>
  <rect x="70" y="138" width="180" height="28" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="80" y="157" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">theme.json</text>

  <!-- templates/ box -->
  <rect x="290" y="104" width="220" height="248" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">templates/</text>
  <text x="400" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">to'liq sahifa shablonlari</text>

  <g font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">
    <rect x="306" y="158" width="188" height="24" rx="4" fill="#ffffff" stroke="#94a3b8"/><text x="314" y="175">index.html</text><text x="487" y="175" text-anchor="end" fill="#94a3b8">zaxira</text>
    <rect x="306" y="184" width="188" height="24" rx="4" fill="#ffffff" stroke="#94a3b8"/><text x="314" y="201">home.html</text><text x="487" y="201" text-anchor="end" fill="#94a3b8">blog</text>
    <rect x="306" y="210" width="188" height="24" rx="4" fill="#ffffff" stroke="#94a3b8"/><text x="314" y="227">single.html</text><text x="487" y="227" text-anchor="end" fill="#94a3b8">maqola</text>
    <rect x="306" y="236" width="188" height="24" rx="4" fill="#ffffff" stroke="#94a3b8"/><text x="314" y="253">page.html</text><text x="487" y="253" text-anchor="end" fill="#94a3b8">sahifa</text>
    <rect x="306" y="262" width="188" height="24" rx="4" fill="#ffffff" stroke="#94a3b8"/><text x="314" y="279">archive.html</text><text x="487" y="279" text-anchor="end" fill="#94a3b8">ro'yxat</text>
    <rect x="306" y="288" width="188" height="24" rx="4" fill="#ffffff" stroke="#94a3b8"/><text x="314" y="305">search.html</text><text x="487" y="305" text-anchor="end" fill="#94a3b8">qidiruv</text>
    <rect x="306" y="314" width="188" height="24" rx="4" fill="#ffffff" stroke="#94a3b8"/><text x="314" y="331">404.html</text><text x="487" y="331" text-anchor="end" fill="#94a3b8">topilmadi</text>
  </g>

  <!-- parts/ box -->
  <rect x="530" y="104" width="200" height="180" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="630" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">parts/</text>
  <text x="630" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">qayta ishlatiluvchi bo'laklar</text>

  <g font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">
    <rect x="546" y="158" width="168" height="30" rx="4" fill="#ffffff" stroke="#94a3b8"/><text x="554" y="178">header.html</text>
    <rect x="546" y="194" width="168" height="30" rx="4" fill="#ffffff" stroke="#94a3b8"/><text x="554" y="214">footer.html</text>
    <rect x="546" y="230" width="168" height="30" rx="4" fill="#ffffff" stroke="#94a3b8"/><text x="554" y="250">sidebar.html</text>
  </g>

  <!-- arrow: part is reused by templates -->
  <path d="M 530 200 C 515 200 515 235 510 235" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="540" y="312" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">wp:template-part</text>
  <text x="540" y="330" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">bilan chaqiriladi</text>

  <!-- bottom note -->
  <rect x="30" y="378" width="700" height="74" rx="8" fill="#fef9c3" stroke="#d97706"/>
  <text x="46" y="402" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#92400e">Klassik temadan farqi:</text>
  <text x="46" y="424" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">single.php (PHP)  -&gt;  single.html (block markup).  header.php  -&gt;  parts/header.html.</text>
  <text x="46" y="444" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">PHP yo'q — hammasi HTML kommentlar (block markup) bilan yoziladi.</text>
</svg>
