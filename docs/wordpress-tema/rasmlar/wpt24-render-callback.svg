<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470">
  <title>block.json render kaliti render.php faylga ishora qiladi va WordPress unga $attributes, $content, $block o'zgaruvchilarini uzatadi</title>
  <rect width="780" height="470" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">block.json render &#8594; render.php</text>

  <!-- block.json -->
  <rect x="40" y="62" width="260" height="150" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="40" y="62" width="260" height="34" rx="10" fill="#2563eb"/>
  <text x="170" y="85" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">block.json</text>
  <text x="58" y="120" font-family="Consolas, monospace" font-size="13" fill="#1e293b">"apiVersion": 3,</text>
  <text x="58" y="142" font-family="Consolas, monospace" font-size="13" fill="#1e293b">"name": "kitob/oxirgi",</text>
  <text x="58" y="164" font-family="Consolas, monospace" font-size="13" fill="#1e293b">"editorScript": "...",</text>
  <text x="58" y="190" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#16a34a">"render": "file:./render.php"</text>

  <!-- arrow -->
  <path d="M300 137 L360 137" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="330" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">WP 6.1+</text>

  <!-- register -->
  <rect x="362" y="62" width="378" height="150" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <rect x="362" y="62" width="378" height="34" rx="10" fill="#d97706"/>
  <text x="551" y="85" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">WordPress yadrosi (PHP)</text>
  <text x="380" y="120" font-family="Consolas, monospace" font-size="13" fill="#1e293b">register_block_type( __DIR__ );</text>
  <text x="380" y="148" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">render &#8594; render_callback yaratadi:</text>
  <text x="380" y="170" font-family="Consolas, monospace" font-size="13" fill="#475569">ob_start();</text>
  <text x="380" y="188" font-family="Consolas, monospace" font-size="13" fill="#475569">require $template_path;</text>
  <text x="380" y="206" font-family="Consolas, monospace" font-size="13" fill="#475569">return ob_get_clean();</text>

  <!-- arrow down -->
  <path d="M551 212 L551 250" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="640" y="236" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">har so'rovda</text>

  <!-- render.php -->
  <rect x="180" y="254" width="540" height="190" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="180" y="254" width="540" height="34" rx="10" fill="#16a34a"/>
  <text x="450" y="277" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">render.php — mavjud o'zgaruvchilar</text>

  <rect x="200" y="300" width="160" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="280" y="325" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#1e3a8a">$attributes</text>
  <text x="280" y="346" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">blok atributlari (array)</text>

  <rect x="370" y="300" width="160" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="450" y="325" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#166534">$content</text>
  <text x="450" y="346" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">InnerBlocks markup</text>

  <rect x="540" y="300" width="160" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="620" y="325" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#92400e">$block</text>
  <text x="620" y="346" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">WP_Block namunasi</text>

  <text x="450" y="392" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">get_block_wrapper_attributes()  +  esc_html() / esc_url()</text>
  <text x="450" y="420" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#166534">&#8594; HTML stringni qaytaradi (echo qilinadi)</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
