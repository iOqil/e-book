<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <title>Block variation va block style farqi</title>
  <rect width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Variation va Style — ikki xil "tayyor sozlama"</text>

  <!-- VARIATION ustun -->
  <rect x="32" y="58" width="344" height="372" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="204" y="86" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#1e40af">registerBlockVariation</text>
  <text x="204" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">"oldindan to'ldirilgan blok"</text>

  <rect x="52" y="124" width="304" height="78" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="68" y="148" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">core/group</text>
  <text x="68" y="170" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">+ attributes (layout, fon rangi)</text>
  <text x="68" y="190" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">+ innerBlocks (tayyor tarkib)</text>

  <text x="52" y="232" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#334155">O'zgartiradi:</text>
  <text x="68" y="256" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">+ ATRIBUTLAR va INNERBLOCKS</text>
  <text x="68" y="278" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">name, title, icon, attributes</text>
  <text x="68" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">isActive — qachon faol</text>
  <text x="68" y="322" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">scope: ['inserter' | 'block' | 'transform']</text>

  <rect x="52" y="344" width="304" height="68" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="68" y="368" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">Natija: Inserter'da alohida blok</text>
  <text x="68" y="390" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">"Banner" tanlasa = group + sozlamalar</text>

  <!-- STYLE ustun -->
  <rect x="384" y="58" width="344" height="372" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="556" y="86" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#166534">registerBlockStyle</text>
  <text x="556" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">"faqat ko'rinish (CSS)"</text>

  <rect x="404" y="124" width="304" height="78" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="420" y="148" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">core/quote</text>
  <text x="420" y="170" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">class="is-style-pushka"</text>
  <text x="420" y="190" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tarkib O'ZGARMAYDI</text>

  <text x="404" y="232" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#334155">O'zgartiradi:</text>
  <text x="420" y="256" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">faqat KO'RINISH (CSS klass)</text>
  <text x="420" y="278" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">name -&gt; is-style-{name} klass</text>
  <text x="420" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">label — "Styles" panelida nom</text>
  <text x="420" y="322" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">CSS .is-style-pushka { ... }</text>

  <rect x="404" y="344" width="304" height="68" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="420" y="368" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">Natija: "Styles" tab'da tugma</text>
  <text x="420" y="390" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">bir blok, har xil ko'rinish</text>

  <text x="380" y="450" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">Variation = sozlangan VARIANT (atribut+tarkib) · Style = KO'RINISH varianti (CSS klass)</text>
</svg>
