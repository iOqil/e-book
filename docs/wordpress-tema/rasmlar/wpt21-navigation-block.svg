<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" font-family="Segoe UI, system-ui, sans-serif">
  <title>Navigation bloki va wp_navigation post type: menyu baza'da saqlanadi va ref orqali ulanadi</title>
  <rect x="0" y="0" width="760" height="480" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Navigation bloki va wp_navigation post type</text>

  <!-- Template part (markup) -->
  <rect x="28" y="60" width="320" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="48" y="86" font-size="15" font-weight="bold" fill="#166534">parts/header.html (block markup)</text>
  <rect x="44" y="98" width="288" height="96" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="56" y="122" font-size="13" fill="#1e293b" font-family="Consolas, monospace">&lt;!-- wp:navigation</text>
  <text x="56" y="144" font-size="13" fill="#2563eb" font-family="Consolas, monospace">  {"ref":7} /--&gt;</text>
  <text x="56" y="172" font-size="13" fill="#475569">ref = menyu post ID'si</text>

  <!-- arrow to DB -->
  <path d="M 348 135 L 412 135" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="380" y="125" text-anchor="middle" font-size="13" fill="#475569">ref</text>

  <!-- Database -->
  <rect x="412" y="60" width="320" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="432" y="86" font-size="15" font-weight="bold" fill="#1e3a8a">Ma'lumotlar bazasi (wp_posts)</text>
  <rect x="428" y="98" width="288" height="96" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="440" y="122" font-size="13" fill="#1e293b">post_type = wp_navigation</text>
  <text x="440" y="144" font-size="13" fill="#1e293b">ID = 7, post_title = "Asosiy"</text>
  <text x="440" y="172" font-size="13" fill="#475569">post_content = navigation-link bloklari</text>

  <!-- properties of post type -->
  <rect x="412" y="226" width="320" height="92" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="432" y="252" font-size="14" font-weight="bold" fill="#92400e">wp_navigation xossalari</text>
  <text x="432" y="276" font-size="13" fill="#1e293b">public = false  (front'da to'g'ridan ochilmaydi)</text>
  <text x="432" y="298" font-size="13" fill="#1e293b">show_in_rest = true  (Site Editor tahrirlaydi)</text>

  <!-- inline navigation alternative -->
  <rect x="28" y="226" width="320" height="150" rx="10" fill="#e0e7ff" stroke="#475569" stroke-width="1.5"/>
  <text x="48" y="252" font-size="15" font-weight="bold" fill="#334155">Inline variant (ref'siz)</text>
  <rect x="44" y="264" width="288" height="96" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="56" y="288" font-size="13" fill="#1e293b" font-family="Consolas, monospace">&lt;!-- wp:navigation --&gt;</text>
  <text x="56" y="310" font-size="13" fill="#2563eb" font-family="Consolas, monospace">  wp:navigation-link...</text>
  <text x="56" y="332" font-size="13" fill="#1e293b" font-family="Consolas, monospace">&lt;!-- /wp:navigation --&gt;</text>
  <text x="56" y="354" font-size="13" fill="#475569">birinchi saqlashda wp_navigation'ga ko'chadi</text>

  <!-- render result -->
  <rect x="28" y="394" width="704" height="64" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="48" y="420" font-size="14" font-weight="bold" fill="#166534">Frontend natija (render_block):</text>
  <rect x="320" y="406" width="92" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="366" y="430" text-anchor="middle" font-size="13" fill="#1e293b">Bosh</text>
  <rect x="424" y="406" width="92" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="470" y="430" text-anchor="middle" font-size="13" fill="#1e293b">Blog</text>
  <rect x="528" y="406" width="92" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="574" y="430" text-anchor="middle" font-size="13" fill="#1e293b">Aloqa</text>
  <rect x="632" y="406" width="80" height="38" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="672" y="430" text-anchor="middle" font-size="13" fill="#991b1b">&#9776; mobil</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
