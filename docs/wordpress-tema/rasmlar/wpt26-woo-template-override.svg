<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <title>WooCommerce shablonni qidirganda avval tema ichidagi woocommerce/ papkani, topmasa plagin templates/ papkasini ishlatadi — tema override prioriteti yuqori</title>
  <rect width="800" height="480" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Shablon override prioriteti: tema &gt; plagin</text>

  <!-- request -->
  <rect x="290" y="56" width="220" height="46" rx="10" fill="#21759b"/>
  <text x="400" y="79" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Mahsulot sahifasi so'rovi</text>
  <text x="400" y="96" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dbeafe">single-product.php kerak</text>

  <path d="M400 102 L400 130" stroke="#475569" stroke-width="2.5" marker-end="url(#aa)"/>

  <!-- wc_get_template -->
  <rect x="250" y="132" width="300" height="40" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="400" y="157" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#92400e">wc_locate_template()</text>

  <!-- step 1 -->
  <rect x="60" y="200" width="680" height="78" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="84" y="228" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#166534">1-qadam: TEMA papkasi (eng yuqori prioritet)</text>
  <text x="84" y="252" font-family="Consolas, monospace" font-size="14" fill="#1e293b">wp-content/themes/mening-temam/woocommerce/single-product.php</text>
  <text x="84" y="271" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">Topildi &#8594; SHU ishlatiladi (plaginnikiga qaramaydi)</text>
  <text x="700" y="245" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="30" fill="#16a34a">&#10003;</text>

  <path d="M400 278 L400 300" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ag)"/>
  <text x="470" y="294" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">topilmasa</text>

  <!-- step 2 -->
  <rect x="60" y="302" width="680" height="78" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="84" y="330" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#475569">2-qadam: PLAGIN papkasi (zaxira / default)</text>
  <text x="84" y="354" font-family="Consolas, monospace" font-size="14" fill="#1e293b">wp-content/plugins/woocommerce/templates/single-product.php</text>
  <text x="84" y="373" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">WooCommerce'ning standart shabloni ishlatiladi</text>

  <!-- bottom note -->
  <rect x="60" y="402" width="680" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="84" y="427" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#92400e">Override = plagin shablonini tema ichidagi woocommerce/ ga NUSXALAB tahrirlash.</text>
  <text x="84" y="449" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Plagin fayllarini TO'G'RIDAN-TO'G'RI tahrirlama — yangilanishda yo'qoladi.</text>

  <defs>
    <marker id="aa" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
