<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470">
  <title>edit funksiya editor ko'rinishini, save funksiya frontda saqlanadigan statik HTML markupni qaytaradi</title>
  <rect width="780" height="470" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">edit() vs save(): bitta blok, ikki vazifa</text>

  <!-- EDIT panel -->
  <rect x="28" y="58" width="340" height="172" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="198" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">edit() — EDITOR ko'rinishi</text>
  <text x="46" y="110" font-family="Consolas, monospace" font-size="13.5" fill="#475569">function Edit({ attributes,</text>
  <text x="46" y="129" font-family="Consolas, monospace" font-size="13.5" fill="#475569">  setAttributes }) {</text>
  <text x="46" y="150" font-family="Consolas, monospace" font-size="13.5" fill="#16a34a">  useBlockProps()</text>
  <text x="46" y="171" font-family="Consolas, monospace" font-size="13.5" fill="#16a34a">  &lt;RichText onChange/&gt;</text>
  <text x="46" y="192" font-family="Consolas, monospace" font-size="13.5" fill="#16a34a">  &lt;InspectorControls/&gt;</text>
  <text x="46" y="213" font-family="Consolas, monospace" font-size="13.5" fill="#475569">}</text>

  <!-- SAVE panel -->
  <rect x="412" y="58" width="340" height="172" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="582" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">save() — STATIK markup</text>
  <text x="430" y="110" font-family="Consolas, monospace" font-size="13.5" fill="#475569">function save({ attributes }) {</text>
  <text x="430" y="131" font-family="Consolas, monospace" font-size="13.5" fill="#2563eb">  useBlockProps.save()</text>
  <text x="430" y="152" font-family="Consolas, monospace" font-size="13.5" fill="#2563eb">  &lt;RichText.Content/&gt;</text>
  <text x="430" y="173" font-family="Consolas, monospace" font-size="13" fill="#dc2626">  // onChange YO'Q</text>
  <text x="430" y="194" font-family="Consolas, monospace" font-size="13" fill="#dc2626">  // setAttributes YO'Q</text>
  <text x="430" y="215" font-family="Consolas, monospace" font-size="13.5" fill="#475569">}</text>

  <!-- arrows down -->
  <g stroke="#94a3b8" stroke-width="2.5" fill="none">
    <path d="M198 230 L198 268"/>
    <path d="M582 230 L582 268"/>
  </g>
  <polygon points="192,262 198,276 204,262" fill="#94a3b8"/>
  <polygon points="576,262 582,276 588,262" fill="#94a3b8"/>

  <!-- editor result -->
  <rect x="40" y="282" width="316" height="92" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="198" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Gutenberg editorda</text>
  <text x="198" y="330" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">tahrirlanadigan, interaktiv</text>
  <text x="198" y="352" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">(matn yoziladi, sidebar ochiladi)</text>

  <!-- frontend result -->
  <rect x="424" y="282" width="316" height="92" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="582" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">post_content (DB) ga yoziladi</text>
  <text x="582" y="330" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">&lt;div class="..."&gt;&lt;h4&gt;...&lt;/h4&gt;</text>
  <text x="582" y="350" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">&lt;p&gt;...&lt;/p&gt;&lt;/div&gt;</text>

  <!-- bottom note -->
  <rect x="60" y="392" width="660" height="62" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="390" y="416" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Asosiy farq</text>
  <text x="390" y="439" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">edit faqat editorda ishlaydi (React); save'ning natijasi HTML bo'lib bazaga saqlanadi va frontda ko'rsatiladi.</text>
</svg>
