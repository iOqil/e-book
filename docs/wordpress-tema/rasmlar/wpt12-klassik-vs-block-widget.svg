<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440">
  <title>Klassik widget va blok asosli widget (WP 5.8+) farqi</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Klassik widget va Blok asosli widget</text>

  <!-- Classic side -->
  <rect x="24" y="60" width="340" height="340" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="194" y="90" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#d97706" text-anchor="middle">Klassik widget (eski)</text>
  <text x="194" y="114" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">WP 2.2 - 5.7 standart</text>

  <rect x="44" y="132" width="300" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="194" y="153" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">WP_Widget sinfini extend</text>
  <text x="194" y="172" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">widget() / form() / update()</text>

  <rect x="44" y="194" width="300" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="194" y="221" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">register_widget( ... )</text>

  <rect x="44" y="250" width="300" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="194" y="277" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">PHP form maydonlari</text>

  <text x="44" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">+ To'liq nazorat (PHP)</text>
  <text x="44" y="348" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">+ Eski temalarga mos</text>
  <text x="44" y="372" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">- Ko'p kod, eskirib bormoqda</text>

  <!-- Block side -->
  <rect x="396" y="60" width="340" height="340" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="566" y="90" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#2563eb" text-anchor="middle">Blok asosli widget</text>
  <text x="566" y="114" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">WP 5.8+ standart (block editor)</text>

  <rect x="416" y="132" width="300" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="566" y="153" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">Har qanday BLOK widget bo'ladi</text>
  <text x="566" y="172" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">core/paragraph, core/latest-posts</text>

  <rect x="416" y="194" width="300" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="566" y="221" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">register_sidebar O'ZGARMAYDI</text>

  <rect x="416" y="250" width="300" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="566" y="277" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">Blok editor interfeysi</text>

  <text x="416" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">+ Kod yozmasdan, vizual</text>
  <text x="416" y="348" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">+ Mavjud bloklar qayta ishlatiladi</text>
  <text x="416" y="372" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">remove_theme_support bilan o'chiriladi</text>

  <!-- shared base -->
  <text x="380" y="426" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569" text-anchor="middle" font-weight="bold">Ikki holatda ham hudud register_sidebar() bilan ro'yxatga olinadi</text>
</svg>
