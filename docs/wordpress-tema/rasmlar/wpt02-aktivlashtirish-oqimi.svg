<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420">
  <title>Temani aktivlashtirish oqimi: papkaga qo'yish, wp-admin, aktivlashtirish</title>
  <rect x="0" y="0" width="780" height="420" fill="#f8fafc"/>
  <text x="390" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Temani aktivlashtirish oqimi</text>

  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- 1 -->
  <rect x="40" y="80" width="210" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="68" cy="108" r="16" fill="#2563eb"/>
  <text x="68" y="114" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">1</text>
  <text x="96" y="114" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Papkaga qo'yish</text>
  <text x="58" y="146" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Tema papkasini joylashtir:</text>
  <text x="58" y="167" font-family="Consolas, monospace" font-size="13" fill="#16a34a">wp-content/themes/</text>
  <text x="58" y="186" font-family="Consolas, monospace" font-size="13" fill="#16a34a">birinchi-tema/</text>

  <!-- 2 -->
  <rect x="285" y="80" width="210" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="313" cy="108" r="16" fill="#2563eb"/>
  <text x="313" y="114" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">2</text>
  <text x="341" y="114" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">wp-admin</text>
  <text x="303" y="146" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Boshqaruv paneliga kir:</text>
  <text x="303" y="167" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Ko'rinish (Appearance)</text>
  <text x="303" y="186" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">&#8594; Mavzular (Themes)</text>

  <!-- 3 -->
  <rect x="530" y="80" width="210" height="120" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <circle cx="558" cy="108" r="16" fill="#16a34a"/>
  <text x="558" y="114" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">3</text>
  <text x="586" y="114" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Aktivlashtirish</text>
  <text x="548" y="146" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Temani topib bos:</text>
  <text x="548" y="167" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">"Faollashtirish"</text>
  <text x="548" y="186" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(Activate) tugmasi</text>

  <!-- arrows -->
  <line x1="250" y1="140" x2="283" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="495" y1="140" x2="528" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- natija -->
  <rect x="160" y="250" width="460" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="390" y="285" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#166534">Natija: saytni ochsangiz temangiz ishlaydi</text>
  <text x="390" y="313" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#15803d">http://localhost:8090 &#8594; index.php render bo'ladi</text>
  <text x="390" y="335" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#15803d">Sayt nomi, yozuvlar va "Birinchi temangiz ishladi!"</text>
  <line x1="390" y1="200" x2="390" y2="248" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <text x="390" y="392" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">CLI bilan ham bo'ladi: wp theme activate birinchi-tema</text>
</svg>
