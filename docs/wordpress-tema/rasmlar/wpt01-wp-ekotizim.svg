<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="Segoe UI, system-ui, sans-serif">
  <title>WordPress ekotizimi: yadro, tema, plagin va ma'lumotlar bazasi munosabati</title>
  <rect x="0" y="0" width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">WordPress ekotizimi</text>
  <text x="380" y="56" text-anchor="middle" font-size="14" fill="#475569">Yadro, tema va plagin birgalikda saytni hosil qiladi</text>

  <!-- YADRO (markaz) -->
  <rect x="280" y="180" width="200" height="100" rx="12" fill="#21759b"/>
  <text x="380" y="218" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">WordPress YADRO</text>
  <text x="380" y="242" text-anchor="middle" font-size="13" fill="#dbeafe">(core: wp-includes,</text>
  <text x="380" y="260" text-anchor="middle" font-size="13" fill="#dbeafe">wp-admin) — dvigatel</text>

  <!-- TEMA (yuqori chap) -->
  <rect x="60" y="90" width="200" height="92" rx="12" fill="#2563eb"/>
  <text x="160" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">TEMA (mavzu)</text>
  <text x="160" y="148" text-anchor="middle" font-size="13" fill="#dbeafe">Ko'rinish qatlami:</text>
  <text x="160" y="166" text-anchor="middle" font-size="13" fill="#dbeafe">sayt qanday ko'rinadi</text>

  <!-- PLAGIN (yuqori o'ng) -->
  <rect x="500" y="90" width="200" height="92" rx="12" fill="#16a34a"/>
  <text x="600" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">PLAGIN</text>
  <text x="600" y="148" text-anchor="middle" font-size="13" fill="#dcfce7">Funksiya qatlami:</text>
  <text x="600" y="166" text-anchor="middle" font-size="13" fill="#dcfce7">sayt nima qiladi</text>

  <!-- MA'LUMOTLAR BAZASI (past) -->
  <rect x="280" y="360" width="200" height="80" rx="12" fill="#475569"/>
  <text x="380" y="392" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">MA'LUMOTLAR BAZASI</text>
  <text x="380" y="414" text-anchor="middle" font-size="13" fill="#e2e8f0">MySQL/MariaDB —</text>
  <text x="380" y="430" text-anchor="middle" font-size="13" fill="#e2e8f0">postlar, sahifalar, sozlamalar</text>

  <!-- bog'lanishlar -->
  <line x1="200" y1="182" x2="320" y2="180" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="560" y1="182" x2="440" y2="180" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="380" y1="280" x2="380" y2="360" stroke="#94a3b8" stroke-width="2.5"/>

  <text x="232" y="160" text-anchor="middle" font-size="13" fill="#475569">ulanadi</text>
  <text x="528" y="160" text-anchor="middle" font-size="13" fill="#475569">ulanadi</text>
  <text x="430" y="326" text-anchor="middle" font-size="13" fill="#475569">o'qish/yozish</text>

  <text x="380" y="455" text-anchor="middle" font-size="13" fill="#94a3b8">Yadro tema va plaginlarni boshqaradi; bazadagi ma'lumotni tema HTML qilib chiqaradi</text>
</svg>
