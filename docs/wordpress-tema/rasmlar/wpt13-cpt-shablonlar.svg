<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" font-family="Segoe UI, system-ui, sans-serif">
  <title>CPT shablon iyerarxiyasi: single-loyiha.php va archive-loyiha.php tanlanishi</title>
  <rect x="0" y="0" width="800" height="540" fill="#f8fafc"/>
  <text x="400" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">CPT shablon iyerarxiyasi</text>
  <text x="400" y="60" text-anchor="middle" font-size="14" fill="#475569">WordPress tepadan pastga qaraydi, birinchi topilgan faylni oladi (07-bob)</text>

  <!-- LEFT column: single loyiha -->
  <rect x="40" y="80" width="350" height="40" rx="9" fill="#2563eb"/>
  <text x="215" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Bitta loyiha ochildi (single)</text>

  <rect x="60" y="134" width="310" height="52" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <text x="215" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">1. single-loyiha.php</text>
  <text x="215" y="176" text-anchor="middle" font-size="13" fill="#475569">aynan 'loyiha' CPT uchun</text>

  <rect x="60" y="200" width="310" height="52" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="215" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">2. single.php</text>
  <text x="215" y="242" text-anchor="middle" font-size="13" fill="#475569">har qanday yagona yozuv</text>

  <rect x="60" y="266" width="310" height="52" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="215" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">3. singular.php</text>
  <text x="215" y="308" text-anchor="middle" font-size="13" fill="#475569">single va page uchun umumiy</text>

  <rect x="60" y="332" width="310" height="46" rx="9" fill="#475569"/>
  <text x="215" y="361" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4. index.php (zaxira)</text>

  <line x1="215" y1="186" x2="215" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="209,200 215,210 221,200" fill="#94a3b8"/>
  <line x1="215" y1="252" x2="215" y2="266" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="209,266 215,276 221,266" fill="#94a3b8"/>
  <line x1="215" y1="318" x2="215" y2="332" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="209,332 215,342 221,332" fill="#94a3b8"/>

  <!-- RIGHT column: archive loyiha -->
  <rect x="410" y="80" width="350" height="40" rx="9" fill="#d97706"/>
  <text x="585" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Loyihalar ro'yxati (archive)</text>

  <rect x="430" y="134" width="310" height="52" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <text x="585" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">1. archive-loyiha.php</text>
  <text x="585" y="176" text-anchor="middle" font-size="13" fill="#475569">'loyiha' CPT arxivi (has_archive!)</text>

  <rect x="430" y="200" width="310" height="52" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="585" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">2. archive.php</text>
  <text x="585" y="242" text-anchor="middle" font-size="13" fill="#475569">har qanday arxiv</text>

  <rect x="430" y="266" width="310" height="52" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="585" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">3. taxonomy-loyiha_kategoriya.php</text>
  <text x="585" y="308" text-anchor="middle" font-size="13" fill="#475569">taxonomy bo'yicha filtr uchun</text>

  <rect x="430" y="332" width="310" height="46" rx="9" fill="#475569"/>
  <text x="585" y="361" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4. index.php (zaxira)</text>

  <line x1="585" y1="186" x2="585" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="579,200 585,210 591,200" fill="#94a3b8"/>
  <line x1="585" y1="252" x2="585" y2="266" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="579,266 585,276 591,266" fill="#94a3b8"/>
  <line x1="585" y1="318" x2="585" y2="332" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="579,332 585,342 591,332" fill="#94a3b8"/>

  <!-- precision bar -->
  <rect x="60" y="400" width="680" height="40" rx="8" fill="#e2e8f0"/>
  <text x="90" y="425" font-size="14" font-weight="700" fill="#16a34a">Aniqroq</text>
  <line x1="170" y1="420" x2="640" y2="420" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="640,414 654,420 640,426" fill="#94a3b8"/>
  <text x="710" y="425" font-size="14" font-weight="700" fill="#475569" text-anchor="end">Umumiyroq</text>

  <text x="400" y="472" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Fayl nomini to'g'ri qo'ying — WordPress AVTOMATIK tanlaydi</text>
  <text x="400" y="498" text-anchor="middle" font-size="13" fill="#dc2626">archive-loyiha.php ishlashi uchun CPT'da has_archive =&gt; true bo'lishi SHART</text>
  <text x="400" y="522" text-anchor="middle" font-size="13" fill="#475569">Permalink yangilanmasa 404 chiqadi: Sozlamalar &gt; Doimiy havolalar &gt; Saqlash</text>
</svg>
