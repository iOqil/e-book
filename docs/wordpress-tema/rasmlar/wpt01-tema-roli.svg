<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Segoe UI, system-ui, sans-serif">
  <title>Tema = ko'rinish qatlami: ma'lumot bazada saqlanadi, temani chiqaradi</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Tema = ko'rinish (presentation) qatlami</text>
  <text x="380" y="56" text-anchor="middle" font-size="14" fill="#475569">Bir xil ma'lumot, har xil temada turlicha ko'rinadi</text>

  <!-- 1. Baza -->
  <rect x="40" y="120" width="180" height="180" rx="12" fill="#475569"/>
  <text x="130" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1. BAZADAGI MA'LUMOT</text>
  <line x1="60" y1="166" x2="200" y2="166" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="130" y="194" text-anchor="middle" font-size="13" fill="#e2e8f0">Sarlavha: "Salom"</text>
  <text x="130" y="218" text-anchor="middle" font-size="13" fill="#e2e8f0">Matn: "Birinchi post"</text>
  <text x="130" y="242" text-anchor="middle" font-size="13" fill="#e2e8f0">Sana: 14-iyun</text>
  <text x="130" y="266" text-anchor="middle" font-size="13" fill="#e2e8f0">Muallif: Oqil</text>
  <text x="130" y="290" text-anchor="middle" font-size="13" fill="#cbd5e1">(toza ma'lumot, dizaynsiz)</text>

  <!-- strelka 1 -->
  <line x1="226" y1="210" x2="290" y2="210" stroke="#21759b" stroke-width="3"/>
  <polygon points="290,202 308,210 290,218" fill="#21759b"/>
  <text x="267" y="198" text-anchor="middle" font-size="13" fill="#21759b">tema</text>

  <!-- 2. Tema A -->
  <rect x="320" y="100" width="180" height="100" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="410" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">TEMA A (minimal)</text>
  <text x="410" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Salom</text>
  <text x="410" y="174" text-anchor="middle" font-size="13" fill="#475569">Birinchi post · 14-iyun</text>
  <text x="410" y="192" text-anchor="middle" font-size="13" fill="#94a3b8">sodda, oq fon</text>

  <!-- 2. Tema B -->
  <rect x="320" y="220" width="180" height="100" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="410" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#f59e0b">TEMA B (jasur)</text>
  <text x="410" y="274" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">SALOM</text>
  <text x="410" y="296" text-anchor="middle" font-size="13" fill="#cbd5e1">Oqil · 14-iyun</text>
  <text x="410" y="314" text-anchor="middle" font-size="13" fill="#94a3b8">to'q fon, katta shrift</text>

  <!-- strelka 2 -->
  <line x1="506" y1="150" x2="560" y2="170" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="506" y1="270" x2="560" y2="250" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- 3. Brauzer -->
  <rect x="570" y="160" width="150" height="100" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="645" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">3. BRAUZER</text>
  <text x="645" y="216" text-anchor="middle" font-size="13" fill="#475569">Foydalanuvchi</text>
  <text x="645" y="234" text-anchor="middle" font-size="13" fill="#475569">ko'radigan HTML</text>

  <text x="380" y="372" text-anchor="middle" font-size="13" fill="#16a34a" font-weight="700">Temani almashtirsangiz — ma'lumot O'ZGARMAYDI, faqat ko'rinish o'zgaradi</text>
  <text x="380" y="396" text-anchor="middle" font-size="13" fill="#94a3b8">Aynan shu — tema kontentni dizayndan ajratadi</text>
</svg>
