<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500">
  <title>Nonce CSRF himoyasi: forma tokeni server tomonida tasdiqlanadi</title>
  <defs>
    <marker id="arrn" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="500" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">Nonce — CSRF himoyasi (so'rov haqiqiyligini tasdiqlash)</text>
  <text x="380" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">"number used once" — formaga bog'langan bir martalik token</text>

  <!-- step 1: form -->
  <rect x="40" y="86" width="300" height="140" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="40" y="86" width="300" height="30" rx="10" fill="#2563eb"/>
  <text x="56" y="107" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">1. Formada token chiqarish</text>
  <text x="56" y="138" font-family="Consolas, monospace" font-size="13" fill="#1e293b">&lt;form method="post"&gt;</text>
  <text x="56" y="159" font-family="Consolas, monospace" font-size="13" fill="#16a34a">  wp_nonce_field('act','nm');</text>
  <text x="56" y="180" font-family="Consolas, monospace" font-size="13" fill="#1e293b">  ...maydonlar...</text>
  <text x="56" y="201" font-family="Consolas, monospace" font-size="13" fill="#1e293b">&lt;/form&gt;</text>
  <text x="56" y="220" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-style="italic" fill="#475569">hidden input: value="b7061092ca"</text>

  <!-- arrow submit -->
  <line x1="340" y1="156" x2="420" y2="156" stroke="#475569" stroke-width="2.5" marker-end="url(#arrn)"/>
  <text x="380" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yuborish</text>

  <!-- step 2: server verify -->
  <rect x="420" y="86" width="300" height="140" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <rect x="420" y="86" width="300" height="30" rx="10" fill="#d97706"/>
  <text x="436" y="107" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">2. Serverda tekshirish</text>
  <text x="436" y="140" font-family="Consolas, monospace" font-size="13" fill="#1e293b">wp_verify_nonce($t,'act')</text>
  <text x="436" y="162" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yoki qulay o'ram:</text>
  <text x="436" y="184" font-family="Consolas, monospace" font-size="13" fill="#1e293b">check_admin_referer(...)</text>
  <text x="436" y="208" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-style="italic" fill="#475569">AJAX uchun: check_ajax_referer()</text>

  <!-- decision diamond -->
  <polygon points="380,250 470,295 380,340 290,295" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <text x="380" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Token</text>
  <text x="380" y="308" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">to'g'rimi?</text>
  <line x1="570" y1="170" x2="475" y2="265" stroke="#475569" stroke-width="2" marker-end="url(#arrn)"/>

  <!-- valid path -->
  <line x1="380" y1="340" x2="380" y2="372" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrn)"/>
  <text x="398" y="362" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">int(1) yoki int(2)</text>
  <rect x="230" y="374" width="300" height="44" rx="10" fill="#16a34a"/>
  <text x="380" y="401" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Amalni bajarish (+ current_user_can)</text>

  <!-- invalid path -->
  <line x1="470" y1="295" x2="640" y2="295" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrn)"/>
  <text x="555" y="287" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">false (yaroqsiz/eskirgan)</text>
  <rect x="560" y="312" width="170" height="60" rx="10" fill="#dc2626"/>
  <text x="645" y="338" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">wp_die()</text>
  <text x="645" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#fee2e2">so'rov to'xtatiladi</text>

  <!-- note -->
  <rect x="40" y="436" width="680" height="50" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="56" y="458" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Action mos kelmasa yoki token soxta bo'lsa -&gt; <tspan font-family="Consolas, monospace" fill="#dc2626">false</tspan>. CSRF: begona sayt to'g'ri tokenni bilmaydi.</text>
  <text x="56" y="478" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-style="italic" fill="#475569">Nonce = "niyat" tasdig'i; ruxsat = alohida current_user_can(). Ikkalasi birga kerak.</text>
</svg>
