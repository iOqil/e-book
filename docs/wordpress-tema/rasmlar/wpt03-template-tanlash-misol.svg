<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600">
  <title>Misol: /category/news uchun shablon tanlash bosqichlari</title>
  <rect x="0" y="0" width="880" height="600" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Misol: /category/news/ qaysi faylni tanlaydi?</text>

  <!-- URL box -->
  <rect x="280" y="54" width="320" height="50" rx="8" fill="#2563eb"/>
  <text x="440" y="76" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#fff">URL: /category/news/</text>
  <text x="440" y="95" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dbeafe">is_category() = true, slug = news, term_id = 7</text>

  <line x1="440" y1="104" x2="440" y2="128" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#m)"/>

  <text x="440" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">WP nomzodlar ro'yxatini tartibda qidiradi (yuqoridan pastga):</text>

  <!-- candidate steps -->
  <!-- step1 -->
  <rect x="120" y="168" width="500" height="48" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="140" y="190" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">1. category-news.php</text>
  <text x="140" y="209" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#991b1b">mavjud emas -> keyingisiga o't</text>
  <text x="650" y="197" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#dc2626">x</text>

  <!-- step2 -->
  <rect x="120" y="224" width="500" height="48" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="140" y="246" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">2. category-7.php</text>
  <text x="140" y="265" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#991b1b">mavjud emas (7 = term_id) -> keyingisiga o't</text>
  <text x="650" y="253" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#dc2626">x</text>

  <!-- step3 -->
  <rect x="120" y="280" width="500" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="140" y="302" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">3. category.php</text>
  <text x="140" y="321" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">MAVJUD! -> SHU FAYL TANLANADI, qidiruv to'xtaydi</text>
  <text x="648" y="310" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#16a34a">OK</text>

  <!-- step4 grayed -->
  <rect x="120" y="336" width="500" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="140" y="363" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#64748b">4. archive.php — (tekshirilmaydi, yuqorida topildi)</text>

  <!-- step5 grayed -->
  <rect x="120" y="388" width="500" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="140" y="415" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#64748b">5. index.php — (oxirgi fallback, kerak bo'lmadi)</text>

  <!-- arrows between steps -->
  <g stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#m)">
    <line x1="370" y1="216" x2="370" y2="222"/>
    <line x1="370" y1="272" x2="370" y2="278"/>
  </g>

  <!-- result -->
  <rect x="200" y="452" width="480" height="72" rx="10" fill="#16a34a"/>
  <text x="440" y="482" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#fff">Natija: themes/mening-temam/category.php ishga tushadi</text>
  <text x="440" y="506" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dcfce7">Agar category.php ham bo'lmasa -> archive.php, u ham bo'lmasa -> index.php</text>

  <text x="440" y="556" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Qoida: AGAR aniqroq fayl qo'shsangiz (masalan category-news.php), WP avtomatik uni afzal ko'radi.</text>
  <text x="440" y="580" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Faqat shu kategoriyaga maxsus dizayn kerak bo'lsa — category-news.php yarating, qolgani category.php da qoladi.</text>

  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
