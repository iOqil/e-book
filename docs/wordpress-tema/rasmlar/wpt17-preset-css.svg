<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430">
  <title>var:preset|color|asosiy sintaksisi generatsiya qilingan CSS o'zgaruvchiga aylanishi</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle">var:preset|... &#8594; CSS o'zgaruvchi</text>

  <!-- step 1: settings preset -->
  <rect x="30" y="60" width="220" height="120" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="84" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">1. settings (16-bob)</text>
  <text x="46" y="110" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">"palette": [</text>
  <text x="58" y="130" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">&#123; "slug":</text>
  <text x="126" y="130" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2563eb">"asosiy"</text>
  <text x="58" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">"color": "#2563eb" &#125;</text>
  <text x="46" y="170" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">]</text>

  <!-- arrow -->
  <line x1="250" y1="120" x2="300" y2="120" stroke="#475569" stroke-width="2.5"/>
  <polygon points="300,114 314,120 300,126" fill="#475569"/>

  <!-- step 2: styles reference -->
  <rect x="318" y="60" width="276" height="120" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="456" y="84" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">2. styles da murojaat (bu bob)</text>
  <text x="334" y="112" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">"color": &#123;</text>
  <text x="346" y="134" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">"text":</text>
  <text x="346" y="156" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#d97706">"var:preset|color|asosiy"</text>
  <text x="334" y="174" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">&#125;</text>

  <!-- big down arrow -->
  <line x1="456" y1="180" x2="456" y2="220" stroke="#475569" stroke-width="2.5"/>
  <polygon points="450,220 456,234 462,220" fill="#475569"/>
  <text x="610" y="206" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">WordPress generatsiya qiladi</text>

  <!-- step 3: generated CSS -->
  <rect x="60" y="244" width="640" height="130" rx="10" fill="#1e293b"/>
  <text x="380" y="270" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="middle">3. &lt;head&gt; ichiga inline CSS</text>

  <text x="84" y="300" font-family="Consolas, Segoe UI, monospace" font-size="14" fill="#94a3b8">:root &#123;</text>
  <text x="104" y="322" font-family="Consolas, Segoe UI, monospace" font-size="14" fill="#f59e0b">--wp--preset--color--asosiy</text>
  <text x="380" y="322" font-family="Consolas, Segoe UI, monospace" font-size="14" fill="#e2e8f0">: #2563eb;</text>
  <text x="84" y="344" font-family="Consolas, Segoe UI, monospace" font-size="14" fill="#94a3b8">&#125;</text>
  <text x="84" y="366" font-family="Consolas, Segoe UI, monospace" font-size="14" fill="#e2e8f0">body &#123; color: </text>
  <text x="216" y="366" font-family="Consolas, Segoe UI, monospace" font-size="14" fill="#16a34a">var(--wp--preset--color--asosiy)</text>
  <text x="566" y="366" font-family="Consolas, Segoe UI, monospace" font-size="14" fill="#e2e8f0">; &#125;</text>

  <text x="380" y="404" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">"var:preset|KATEGORIYA|slug" &#8594; var(--wp--preset--KATEGORIYA--slug). Frontendda to'liq var(...) yozasiz.</text>
</svg>
