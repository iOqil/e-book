<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>Eng minimal klassik tema fayllari: style.css va index.php</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Eng minimal klassik tema = 2 ta fayl</text>

  <!-- Papka -->
  <rect x="40" y="60" width="680" height="48" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="62" y="90" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#475569">wp-content/themes/birinchi-tema/</text>
  <text x="500" y="90" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">(tema papkasi)</text>

  <!-- style.css karta -->
  <rect x="40" y="135" width="330" height="290" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="40" y="135" width="330" height="40" rx="10" fill="#2563eb"/>
  <text x="60" y="162" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">style.css</text>
  <text x="230" y="162" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dbeafe">SHART</text>

  <text x="60" y="198" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Yuqorida MAJBURIY header bloki:</text>
  <rect x="58" y="210" width="294" height="155" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="232" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">/*</text>
  <text x="70" y="252" font-family="Consolas, monospace" font-size="13" fill="#16a34a">Theme Name: Birinchi Tema</text>
  <text x="70" y="272" font-family="Consolas, monospace" font-size="13" fill="#475569">Author: Oqil Imomnazarov</text>
  <text x="70" y="292" font-family="Consolas, monospace" font-size="13" fill="#475569">Description: ...</text>
  <text x="70" y="312" font-family="Consolas, monospace" font-size="13" fill="#475569">Version: 1.0.0</text>
  <text x="70" y="332" font-family="Consolas, monospace" font-size="13" fill="#475569">Text Domain: birinchi-tema</text>
  <text x="70" y="356" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">*/</text>
  <text x="60" y="395" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">Theme Name BO'LMASA — tema</text>
  <text x="60" y="413" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">ro'yxatda KO'RINMAYDI.</text>

  <!-- index.php karta -->
  <rect x="390" y="135" width="330" height="290" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="390" y="135" width="330" height="40" rx="10" fill="#16a34a"/>
  <text x="410" y="162" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">index.php</text>
  <text x="580" y="162" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dcfce7">SHART</text>

  <text x="410" y="198" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Eng asosiy (fallback) shablon:</text>
  <rect x="408" y="210" width="294" height="155" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="420" y="232" font-family="Consolas, monospace" font-size="13" fill="#7c3aed">&lt;!DOCTYPE html&gt;</text>
  <text x="420" y="252" font-family="Consolas, monospace" font-size="13" fill="#475569">&lt;head&gt; wp_head() &lt;/head&gt;</text>
  <text x="420" y="272" font-family="Consolas, monospace" font-size="13" fill="#475569">&lt;body&gt;</text>
  <text x="436" y="292" font-family="Consolas, monospace" font-size="13" fill="#2563eb">have_posts()</text>
  <text x="436" y="312" font-family="Consolas, monospace" font-size="13" fill="#2563eb">the_post();</text>
  <text x="436" y="332" font-family="Consolas, monospace" font-size="13" fill="#475569">the_title(); the_content();</text>
  <text x="420" y="356" font-family="Consolas, monospace" font-size="13" fill="#475569">wp_footer(); &lt;/body&gt;</text>
  <text x="410" y="395" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Har bir so'rov bu faylga</text>
  <text x="410" y="413" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">tushib qoladi (oxirgi chora).</text>

  <text x="380" y="452" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">screenshot.png ixtiyoriy: admin paneldagi tema rasmini ko'rsatadi.</text>
</svg>
