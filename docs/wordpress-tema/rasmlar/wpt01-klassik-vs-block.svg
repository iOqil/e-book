<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Klassik tema (PHP shablon) va block tema (theme.json / HTML) taqqoslash</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Klassik tema va Block tema</text>
  <text x="380" y="56" text-anchor="middle" font-size="14" fill="#475569">Ikkala tema ham WordPress 7.0'da ishlaydi</text>

  <!-- KLASSIK -->
  <rect x="40" y="80" width="320" height="350" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="40" y="80" width="320" height="46" rx="12" fill="#2563eb"/>
  <rect x="40" y="108" width="320" height="18" fill="#2563eb"/>
  <text x="200" y="110" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">KLASSIK TEMA</text>

  <text x="60" y="156" font-size="14" font-weight="700" fill="#1e293b">Asosiy fayllar (PHP):</text>
  <text x="68" y="182" font-size="13" fill="#475569">style.css  (header sharti)</text>
  <text x="68" y="206" font-size="13" fill="#475569">index.php  &lt;?php the_post() ?&gt;</text>
  <text x="68" y="230" font-size="13" fill="#475569">functions.php, header.php ...</text>

  <text x="60" y="266" font-size="14" font-weight="700" fill="#1e293b">Qanday ishlaydi:</text>
  <text x="68" y="290" font-size="13" fill="#475569">PHP shablonlar HTML yasaydi</text>
  <text x="68" y="312" font-size="13" fill="#475569">Loop bilan ma'lumot chiqaradi</text>

  <text x="60" y="348" font-size="14" font-weight="700" fill="#16a34a">+ To'liq nazorat, eski saytlar</text>
  <text x="60" y="372" font-size="14" font-weight="700" fill="#dc2626">- Ko'proq kod, qo'lda yangilash</text>
  <text x="60" y="408" font-size="13" fill="#94a3b8">Tahrirlash: kod muharriri (PHP/CSS)</text>

  <!-- VS -->
  <circle cx="380" cy="255" r="26" fill="#f59e0b"/>
  <text x="380" y="262" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">VS</text>

  <!-- BLOCK -->
  <rect x="400" y="80" width="320" height="350" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <rect x="400" y="80" width="320" height="46" rx="12" fill="#16a34a"/>
  <rect x="400" y="108" width="320" height="18" fill="#16a34a"/>
  <text x="560" y="110" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">BLOCK TEMA (FSE)</text>

  <text x="420" y="156" font-size="14" font-weight="700" fill="#1e293b">Asosiy fayllar (HTML/JSON):</text>
  <text x="428" y="182" font-size="13" fill="#475569">style.css  (header sharti)</text>
  <text x="428" y="206" font-size="13" fill="#475569">theme.json  (sozlama+uslub)</text>
  <text x="428" y="230" font-size="13" fill="#475569">templates/index.html, parts/ ...</text>

  <text x="420" y="266" font-size="14" font-weight="700" fill="#1e293b">Qanday ishlaydi:</text>
  <text x="428" y="290" font-size="13" fill="#475569">Bloklar (&lt;!-- wp:... --&gt;) markup</text>
  <text x="428" y="312" font-size="13" fill="#475569">theme.json butun saytni sozlaydi</text>

  <text x="420" y="348" font-size="14" font-weight="700" fill="#16a34a">+ Site Editor, kamroq kod, zamonaviy</text>
  <text x="420" y="372" font-size="14" font-weight="700" fill="#dc2626">- Yangi yondashuv, o'rganish kerak</text>
  <text x="420" y="408" font-size="13" fill="#94a3b8">Tahrirlash: Site Editor (vizual)</text>

  <text x="380" y="452" text-anchor="middle" font-size="13" fill="#475569">2026'da block tema STANDART; klassik bilim ish bozori uchun hamon kerak</text>
</svg>
