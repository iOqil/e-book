<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 510" width="780" height="510" font-family="Segoe UI, system-ui, sans-serif">
  <title>header + loop + sidebar + footer = to'liq sahifa yig'ilishi</title>
  <rect x="0" y="0" width="780" height="510" fill="#f8fafc"/>
  <text x="390" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Bo'laklardan to'liq sahifa qanday yig'iladi</text>
  <text x="390" y="54" text-anchor="middle" font-size="14" fill="#475569">index.php (yoki single.php / page.php) dirijyor - bo'laklarni tartib bilan chaqiradi</text>

  <!-- chap: index.php chaqiruvlar -->
  <rect x="36" y="78" width="290" height="410" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="181" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">index.php</text>
  <line x1="56" y1="112" x2="306" y2="112" stroke="#e2e8f0" stroke-width="1.5"/>

  <rect x="54" y="124" width="254" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="181" y="149" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">get_header();</text>

  <rect x="54" y="174" width="254" height="170" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="181" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">The Loop</text>
  <text x="68" y="218" font-size="13" fill="#475569">while ( have_posts() ) :</text>
  <text x="78" y="238" font-size="13" fill="#475569">the_post();</text>
  <text x="78" y="262" font-size="13" fill="#475569">get_template_part(</text>
  <text x="92" y="280" font-size="13" fill="#475569">'template-parts/content',</text>
  <text x="92" y="298" font-size="13" fill="#475569">get_post_type() );</text>
  <text x="68" y="322" font-size="13" fill="#475569">endwhile;</text>

  <rect x="54" y="354" width="254" height="38" rx="6" fill="#fef9c3" stroke="#d97706" stroke-width="1.8"/>
  <text x="181" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#d97706">get_sidebar();</text>

  <rect x="54" y="400" width="254" height="40" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.8"/>
  <text x="181" y="425" text-anchor="middle" font-size="14" font-weight="700" fill="#d97706">get_footer();</text>

  <text x="181" y="468" text-anchor="middle" font-size="13" fill="#94a3b8">Har chaqiruv mos faylni o'rniga "ulaydi"</text>

  <!-- strelka -->
  <line x1="330" y1="280" x2="384" y2="280" stroke="#475569" stroke-width="3"/>
  <polygon points="384,270 402,280 384,290" fill="#475569"/>
  <text x="366" y="268" text-anchor="middle" font-size="13" fill="#475569">render</text>

  <!-- o'ng: yig'ilgan sahifa -->
  <rect x="418" y="78" width="326" height="410" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="581" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Yig'ilgan HTML sahifa</text>

  <!-- header qism -->
  <rect x="436" y="116" width="290" height="58" rx="6" fill="#2563eb"/>
  <text x="581" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">HEADER (header.php)</text>
  <text x="581" y="160" text-anchor="middle" font-size="13" fill="#dbeafe">logo + menyu + wp_head()</text>

  <!-- kontent + sidebar yonma-yon -->
  <rect x="436" y="182" width="190" height="208" rx="6" fill="#16a34a"/>
  <text x="531" y="204" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">KONTENT (loop)</text>
  <rect x="450" y="216" width="162" height="44" rx="4" fill="#ffffff" opacity="0.9"/>
  <text x="531" y="242" text-anchor="middle" font-size="13" fill="#16a34a">content-post.php</text>
  <rect x="450" y="268" width="162" height="44" rx="4" fill="#ffffff" opacity="0.9"/>
  <text x="531" y="294" text-anchor="middle" font-size="13" fill="#16a34a">content-post.php</text>
  <rect x="450" y="320" width="162" height="44" rx="4" fill="#ffffff" opacity="0.9"/>
  <text x="531" y="346" text-anchor="middle" font-size="13" fill="#16a34a">content-post.php</text>

  <rect x="634" y="182" width="92" height="208" rx="6" fill="#d97706"/>
  <text x="680" y="276" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" transform="rotate(90 680 276)">SIDEBAR (sidebar.php)</text>

  <!-- footer qism -->
  <rect x="436" y="398" width="290" height="54" rx="6" fill="#475569"/>
  <text x="581" y="422" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">FOOTER (footer.php)</text>
  <text x="581" y="442" text-anchor="middle" font-size="13" fill="#cbd5e1">copyright + wp_footer()</text>

  <text x="581" y="476" text-anchor="middle" font-size="13" fill="#475569" font-weight="700">Bitta bog'langan HTML hujjat = bir nechta kichik fayl natijasi</text>
</svg>
