<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Site Editor (FSE) paneli: Templates, Template Parts, Styles, Navigation, Patterns</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Site Editor (Appearance &gt; Editor)</text>
  <text x="380" y="52" text-anchor="middle" font-size="14" fill="#475569">Block tema'ni butunligicha brauzerda tahrirlash</text>

  <!-- Left sidebar -->
  <rect x="24" y="74" width="230" height="372" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="44" y="100" font-size="15" font-weight="bold" fill="#21759b">Design</text>

  <!-- Templates -->
  <rect x="40" y="116" width="198" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="56" y="140" font-size="15" font-weight="bold" fill="#1e293b">Templates</text>
  <text x="56" y="160" font-size="13" fill="#475569">index, single, page, 404...</text>

  <!-- Template Parts -->
  <rect x="40" y="180" width="198" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="56" y="204" font-size="15" font-weight="bold" fill="#1e293b">Template Parts</text>
  <text x="56" y="224" font-size="13" fill="#475569">header, footer</text>

  <!-- Styles -->
  <rect x="40" y="244" width="198" height="56" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="56" y="268" font-size="15" font-weight="bold" fill="#1e293b">Styles</text>
  <text x="56" y="288" font-size="13" fill="#475569">ranglar, shrift, variations</text>

  <!-- Navigation -->
  <rect x="40" y="308" width="198" height="56" rx="8" fill="#e0e7ff" stroke="#475569" stroke-width="1.5"/>
  <text x="56" y="332" font-size="15" font-weight="bold" fill="#1e293b">Navigation</text>
  <text x="56" y="352" font-size="13" fill="#475569">menyular (wp_navigation)</text>

  <!-- Patterns -->
  <rect x="40" y="372" width="198" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="56" y="396" font-size="15" font-weight="bold" fill="#1e293b">Patterns</text>
  <text x="56" y="416" font-size="13" fill="#475569">block to'plamlar</text>

  <!-- Canvas (right) -->
  <rect x="278" y="74" width="458" height="372" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="507" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">Tahrirlash kanvasi (live preview)</text>

  <!-- mock header -->
  <rect x="300" y="116" width="414" height="48" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="318" y="145" font-size="14" font-weight="bold" fill="#166534">Header part</text>
  <rect x="560" y="128" width="134" height="24" rx="4" fill="#e0e7ff" stroke="#475569" stroke-width="1"/>
  <text x="627" y="145" text-anchor="middle" font-size="13" fill="#1e293b">Navigation</text>

  <!-- mock body -->
  <rect x="300" y="176" width="414" height="180" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="318" y="200" font-size="14" fill="#475569">Bloklar (Group, Heading, Query Loop...)</text>
  <rect x="318" y="214" width="378" height="18" rx="3" fill="#cbd5e1"/>
  <rect x="318" y="242" width="320" height="14" rx="3" fill="#e2e8f0"/>
  <rect x="318" y="264" width="350" height="14" rx="3" fill="#e2e8f0"/>
  <rect x="318" y="296" width="160" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="398" y="321" text-anchor="middle" font-size="13" fill="#1e3a8a">Query Loop</text>

  <!-- mock footer -->
  <rect x="300" y="368" width="414" height="48" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="318" y="397" font-size="14" font-weight="bold" fill="#92400e">Footer part</text>

  <text x="507" y="440" text-anchor="middle" font-size="13" fill="#475569">Saqlash -&gt; o'zgarishlar baza'da (wp_template / wp_template_part)</text>
</svg>
