<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Segoe UI, system-ui, sans-serif">
  <title>Block Bindings API: post meta qiymati blok atributiga avtomatik bog'lanadi</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Block Bindings: meta -&gt; blok atributi (WP 6.5+)</text>
  <text x="380" y="56" text-anchor="middle" font-size="14" fill="#475569">Zamonaviy usul — PHP shablon o'rniga blok markupida bog'lanish</text>

  <!-- meta source -->
  <rect x="40" y="90" width="200" height="110" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">1. Post meta</text>
  <text x="140" y="142" text-anchor="middle" font-size="13" fill="#475569">register_post_meta()</text>
  <text x="140" y="164" text-anchor="middle" font-size="13" fill="#94a3b8">show_in_rest = true</text>
  <text x="140" y="188" text-anchor="middle" font-size="14" fill="#16a34a">narx = "100"</text>

  <!-- binding -->
  <rect x="290" y="80" width="200" height="130" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="390" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#d97706">2. metadata.bindings</text>
  <text x="390" y="132" text-anchor="middle" font-size="13" fill="#1e293b">"content": {</text>
  <text x="390" y="152" text-anchor="middle" font-size="13" fill="#1e293b">"source": "core/post-meta",</text>
  <text x="390" y="172" text-anchor="middle" font-size="13" fill="#1e293b">"args": { "key": "narx" }</text>
  <text x="390" y="192" text-anchor="middle" font-size="13" fill="#1e293b">}</text>

  <!-- block output -->
  <rect x="540" y="90" width="200" height="110" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="640" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#16a34a">3. Blok chiqishi</text>
  <text x="640" y="142" text-anchor="middle" font-size="13" fill="#475569">core/paragraph</text>
  <text x="640" y="168" text-anchor="middle" font-size="13" fill="#94a3b8">content atributi</text>
  <text x="640" y="190" text-anchor="middle" font-size="14" fill="#16a34a">&lt;p&gt;100&lt;/p&gt;</text>

  <!-- arrows -->
  <line x1="242" y1="145" x2="288" y2="145" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="492" y1="145" x2="538" y2="145" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- markup example -->
  <rect x="40" y="240" width="680" height="150" rx="10" fill="#1e293b"/>
  <text x="60" y="268" font-size="13" fill="#94a3b8" font-family="Consolas, monospace">Blok markup (post yoki shablon ichida):</text>
  <text x="60" y="296" font-size="13" fill="#f8fafc" font-family="Consolas, monospace">&lt;!-- wp:paragraph {"metadata":{"bindings":{"content":</text>
  <text x="60" y="318" font-size="13" fill="#f8fafc" font-family="Consolas, monospace">  {"source":"core/post-meta","args":{"key":"narx"}}}}} --&gt;</text>
  <text x="60" y="340" font-size="13" fill="#f59e0b" font-family="Consolas, monospace">&lt;p&gt;&lt;/p&gt;   &lt;!-- matn meta'dan avtomatik to'ladi --&gt;</text>
  <text x="60" y="362" font-size="13" fill="#f8fafc" font-family="Consolas, monospace">&lt;!-- /wp:paragraph --&gt;</text>
  <text x="60" y="384" font-size="13" fill="#16a34a" font-family="Consolas, monospace">Editor'da ham, frontend'da ham meta qiymati ko'rinadi.</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker>
  </defs>
</svg>
