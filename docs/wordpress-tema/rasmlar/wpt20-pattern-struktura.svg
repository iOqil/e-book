<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>Pattern PHP fayl strukturasi: header izoh + block markup -> Inserter</title>
  <rect width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">patterns/cta-hero.php fayl strukturasi</text>

  <!-- PHP fayl konteyner -->
  <rect x="30" y="60" width="420" height="340" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="48" y="86" font-size="15" font-weight="bold" fill="#475569">patterns/cta-hero.php</text>

  <!-- Header izoh qismi -->
  <rect x="48" y="100" width="384" height="148" rx="6" fill="#e2e8f0" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="122" font-size="14" font-weight="bold" fill="#2563eb">1) HEADER IZOH (PHP doc-blok)</text>
  <text x="60" y="146" font-size="13" fill="#1e293b">* Title: CTA hero</text>
  <text x="60" y="166" font-size="13" fill="#1e293b">* Slug: ch20-test/cta-hero</text>
  <text x="60" y="186" font-size="13" fill="#1e293b">* Categories: banner, featured</text>
  <text x="60" y="206" font-size="13" fill="#1e293b">* Keywords: hero, cta, chaqiruv</text>
  <text x="60" y="226" font-size="13" fill="#1e293b">* Block Types: core/group</text>
  <text x="60" y="244" font-size="13" fill="#64748b">* Post Types / Inserter / Viewport...</text>

  <!-- Block markup qismi -->
  <rect x="48" y="262" width="384" height="122" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="60" y="284" font-size="14" font-weight="bold" fill="#16a34a">2) BLOCK MARKUP (tana)</text>
  <text x="60" y="307" font-size="13" fill="#1e293b">&lt;!-- wp:group --&gt;</text>
  <text x="76" y="327" font-size="13" fill="#1e293b">&lt;!-- wp:heading --&gt; ... &lt;!-- /wp:heading --&gt;</text>
  <text x="76" y="347" font-size="13" fill="#1e293b">&lt;!-- wp:buttons --&gt; ... &lt;!-- /wp:buttons --&gt;</text>
  <text x="60" y="372" font-size="13" fill="#1e293b">&lt;!-- /wp:group --&gt;</text>

  <!-- Strelka -->
  <line x1="450" y1="230" x2="540" y2="230" stroke="#d97706" stroke-width="3"/>
  <polygon points="540,222 558,230 540,238" fill="#d97706"/>
  <text x="504" y="218" text-anchor="middle" font-size="13" fill="#d97706">WP avto</text>
  <text x="504" y="252" text-anchor="middle" font-size="13" fill="#d97706">(6.0+)</text>

  <!-- Inserter -->
  <rect x="560" y="120" width="172" height="220" rx="10" fill="#ffffff" stroke="#21759b" stroke-width="2"/>
  <text x="646" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#21759b">Editor Inserter</text>
  <line x1="572" y1="158" x2="720" y2="158" stroke="#94a3b8" stroke-width="1"/>
  <text x="582" y="182" font-size="13" fill="#475569">Bloklar | <tspan font-weight="bold" fill="#1e293b">Patterns</tspan></text>
  <rect x="582" y="196" width="128" height="48" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="646" y="216" text-anchor="middle" font-size="13" fill="#1e293b">CTA hero</text>
  <text x="646" y="234" text-anchor="middle" font-size="13" fill="#64748b">[banner]</text>
  <rect x="582" y="254" width="128" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="646" y="279" text-anchor="middle" font-size="13" fill="#94a3b8">boshqa pattern...</text>
  <text x="646" y="320" text-anchor="middle" font-size="13" fill="#16a34a">bir klik = qo'shildi</text>
</svg>
