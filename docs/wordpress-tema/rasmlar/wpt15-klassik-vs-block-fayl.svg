<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>Klassik tema (PHP shablonlar) va block tema (theme.json + HTML markup) fayllarining solishtiruvi</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>

  <!-- Klassik ustun -->
  <rect x="24" y="20" width="330" height="400" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="24" y="20" width="330" height="46" rx="10" fill="#475569"/>
  <text x="189" y="49" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Klassik tema (PHP)</text>

  <text x="44" y="96" font-size="15" fill="#1e293b">Sahifani PHP kodi yasaydi:</text>

  <rect x="44" y="110" width="290" height="34" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="58" y="132" font-size="15" fill="#1e293b" font-family="Consolas, monospace">index.php</text>
  <rect x="44" y="150" width="290" height="34" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="58" y="172" font-size="15" fill="#1e293b" font-family="Consolas, monospace">single.php  ·  page.php</text>
  <rect x="44" y="190" width="290" height="34" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="58" y="212" font-size="15" fill="#1e293b" font-family="Consolas, monospace">header.php  ·  footer.php</text>
  <rect x="44" y="230" width="290" height="34" rx="6" fill="#fde68a" stroke="#d97706"/>
  <text x="58" y="252" font-size="15" fill="#1e293b" font-family="Consolas, monospace">functions.php</text>
  <rect x="44" y="270" width="290" height="34" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="58" y="292" font-size="15" fill="#1e293b" font-family="Consolas, monospace">style.css (haqiqiy CSS)</text>

  <text x="44" y="340" font-size="15" fill="#475569">HTML'ni PHP funksiyalari</text>
  <text x="44" y="362" font-size="15" fill="#475569">(the_title, the_content...)</text>
  <text x="44" y="384" font-size="15" fill="#475569">chiqaradi.</text>
  <text x="44" y="408" font-size="15" fill="#dc2626" font-weight="bold">Stil: kodda · Editor cheklangan</text>

  <!-- Block ustun -->
  <rect x="406" y="20" width="330" height="400" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="406" y="20" width="330" height="46" rx="10" fill="#2563eb"/>
  <text x="571" y="49" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Block tema (FSE)</text>

  <text x="426" y="96" font-size="15" fill="#1e293b">Sahifani blok markup yasaydi:</text>

  <rect x="426" y="110" width="290" height="34" rx="6" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="440" y="132" font-size="15" fill="#1e293b" font-family="Consolas, monospace">theme.json  (SHART)</text>
  <rect x="426" y="150" width="290" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="440" y="172" font-size="15" fill="#1e293b" font-family="Consolas, monospace">templates/index.html</text>
  <rect x="426" y="190" width="290" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="440" y="212" font-size="15" fill="#1e293b" font-family="Consolas, monospace">parts/header.html</text>
  <rect x="426" y="230" width="290" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="440" y="252" font-size="15" fill="#1e293b" font-family="Consolas, monospace">patterns/  ·  styles/</text>
  <rect x="426" y="270" width="290" height="34" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="440" y="292" font-size="15" fill="#1e293b" font-family="Consolas, monospace">style.css (faqat header)</text>

  <text x="426" y="340" font-size="15" fill="#475569">HTML = blok markup</text>
  <text x="426" y="362" font-size="15" fill="#475569">(&lt;!-- wp:post-title /--&gt;).</text>
  <text x="426" y="384" font-size="15" fill="#475569">PHP shablon YO'Q.</text>
  <text x="426" y="408" font-size="15" fill="#16a34a" font-weight="bold">Stil: theme.json · Editor to'liq</text>
</svg>
