<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>WooCommerce sahifa hook'lari: woocommerce_before_main_content wrapper ochadi, woocommerce_content mahsulotlarni chiqaradi, woocommerce_sidebar yon panel, woocommerce_after_main_content wrapper yopadi</title>
  <rect width="800" height="500" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">WooCommerce sahifa hook'lari (tema integratsiyasi)</text>

  <!-- header -->
  <rect x="120" y="56" width="560" height="36" rx="8" fill="#475569"/>
  <text x="400" y="80" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#ffffff">get_header()  /  header.html</text>

  <path d="M400 92 L400 110" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- before_main_content -->
  <rect x="120" y="112" width="560" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="135" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#1e3a8a">do_action( 'woocommerce_before_main_content' )</text>
  <text x="400" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">wrapper ochiladi (woocommerce_output_content_wrapper) + breadcrumb</text>

  <path d="M400 168 L400 186" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- content -->
  <rect x="120" y="188" width="380" height="118" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="310" y="212" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#166534">woocommerce_content()</text>
  <text x="310" y="236" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">mahsulot loop / single-product</text>
  <text x="140" y="262" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">ichida yana hook'lar:</text>
  <text x="140" y="282" font-family="Consolas, monospace" font-size="13" fill="#1e293b">woocommerce_before_shop_loop</text>
  <text x="140" y="300" font-family="Consolas, monospace" font-size="13" fill="#1e293b">woocommerce_after_shop_loop_item</text>

  <!-- sidebar -->
  <rect x="520" y="188" width="160" height="118" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="600" y="212" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#92400e">woocommerce_</text>
  <text x="600" y="230" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#92400e">sidebar</text>
  <text x="600" y="258" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yon panel</text>
  <text x="600" y="278" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(get_sidebar)</text>

  <path d="M310 306 L310 324 L400 324" stroke="#475569" stroke-width="2.5" fill="none"/>
  <path d="M600 306 L600 324 L400 324" stroke="#475569" stroke-width="2.5" fill="none"/>
  <path d="M400 324 L400 342" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- after_main_content -->
  <rect x="120" y="344" width="560" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="367" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#1e3a8a">do_action( 'woocommerce_after_main_content' )</text>
  <text x="400" y="388" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">wrapper yopiladi (woocommerce_output_content_wrapper_end)</text>

  <path d="M400 400 L400 418" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- footer -->
  <rect x="120" y="420" width="560" height="36" rx="8" fill="#475569"/>
  <text x="400" y="444" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#ffffff">get_footer()  /  footer.html</text>

  <!-- side note -->
  <text x="400" y="482" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Tema bu hook'larga remove_action / add_action bilan o'z wrapper'ini ulaydi</text>

  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
