  <text x="670" y="352" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">29: child tema + tarqatish</text>

  <!-- Arrows row1 -->
  <line x1="260" y1="107" x2="298" y2="107" stroke="#475569" stroke-width="2" marker-end="url(#arr30)"/>
  <line x1="520" y1="107" x2="558" y2="107" stroke="#475569" stroke-width="2" marker-end="url(#arr30)"/>
  <!-- down right -->
  <line x1="670" y1="140" x2="670" y2="188" stroke="#475569" stroke-width="2" marker-end="url(#arr30)"/>
  <!-- row2 right to left -->
  <line x1="560" y1="223" x2="522" y2="223" stroke="#475569" stroke-width="2" marker-end="url(#arr30)"/>
  <line x1="300" y1="223" x2="262" y2="223" stroke="#475569" stroke-width="2" marker-end="url(#arr30)"/>
  <!-- down left -->
  <line x1="150" y1="256" x2="150" y2="304" stroke="#475569" stroke-width="2" marker-end="url(#arr30)"/>
  <!-- row3 left to right -->
  <line x1="260" y1="339" x2="298" y2="339" stroke="#475569" stroke-width="2" marker-end="url(#arr30)"/>
  <line x1="520" y1="339" x2="558" y2="339" stroke="#475569" stroke-width="2" marker-end="url(#arr30)"/>

  <!-- Result -->
  <rect x="190" y="420" width="440" height="64" rx="10" fill="#16a34a"/>
  <text x="410" y="448" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">To'liq ishlaydigan professional tema</text>
  <text x="410" y="470" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dcfce7">JSON valid · PHP php -l · markup parse_blocks · build OK</text>
  <line x1="410" y1="372" x2="410" y2="418" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr30)"/>
</svg>
