  <rect x="300" y="306" width="220" height="66" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="410" y="334" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#dc2626">8. Xavfsizlik</text>
  <text x="410" y="356" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">27: escape qilish</text>

