  </defs>

  <!-- Step 1 -->
  <rect x="40" y="74" width="220" height="66" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="150" y="102" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e293b">1. Reja va struktura</text>
  <text x="150" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">04-bob: papka tuzilishi</text>

  <!-- Step 2 -->
  <rect x="300" y="74" width="220" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="410" y="102" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2563eb">2. style.css + theme.json</text>
  <text x="410" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">16-17: palitra, shrift, oraliq</text>

  <!-- Step 3 -->
  <rect x="560" y="74" width="220" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="670" y="102" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2563eb">3. templates/ + parts/</text>
  <text x="670" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">18: block markup</text>

  <!-- Step 4 (row 2, right to left) -->
  <rect x="560" y="190" width="220" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="670" y="218" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2563eb">4. patterns/ + variation</text>
  <text x="670" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">19-20: hero, CTA, tungi</text>

  <!-- Step 5 -->
  <rect x="300" y="190" width="220" height="66" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="410" y="218" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#16a34a">5. Custom blok (build)</text>
  <text x="410" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">22-25: npm wp-scripts build</text>

  <!-- Step 6 -->
  <rect x="40" y="190" width="220" height="66" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="150" y="218" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#d97706">6. functions.php</text>
  <text x="150" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">09-10: setup + register</text>

  <!-- Step 7 (row 3) -->
  <rect x="40" y="306" width="220" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
