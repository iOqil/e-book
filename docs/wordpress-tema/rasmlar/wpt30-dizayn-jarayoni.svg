<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520">
  <title>Kapston temani qurish oqimi: reja -> theme.json -> templates -> patterns -> custom blok -> i18n -> Theme Check</title>
  <rect width="820" height="520" fill="#f8fafc"/>
  <text x="410" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1e293b">Tema qurish jarayoni — bosqichma-bosqich</text>

  <defs>
    <marker id="arr30" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#475569"/>
