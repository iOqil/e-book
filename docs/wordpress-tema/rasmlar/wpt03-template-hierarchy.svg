<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" width="1180" height="900">
  <title>WordPress Template Hierarchy: to'liq daraxt (index.php fallback)</title>
  <rect x="0" y="0" width="1180" height="900" fill="#f8fafc"/>
  <text x="590" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">Template Hierarchy — to'liq daraxt</text>
  <text x="590" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Har qatorda: aniqdan umumiyga. Birinchi mavjud fayl tanlanadi. Hech qaysi topilmasa -> index.php</text>

