  <text x="590" y="836" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Tartib: chapdan o'ngga = aniqdan umumiyga. {type}=post-type, {tax}=taksonomiya, {mime}=fayl turi (masalan image).</text>
  <text x="590" y="858" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">single-{type}-{slug} uchun slug nomida noASCII bo'lsa, WP avval urldecode qilingan variantni ham qidiradi.</text>
  <text x="590" y="882" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626" font-weight="bold">index.php HAMMA narsaning oxirgi fallback'i — har klassik temada MAJBURIY.</text>

