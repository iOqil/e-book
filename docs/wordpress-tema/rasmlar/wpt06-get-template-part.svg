<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>get_template_part bilan modulli qayta ishlatish: bir bo'lakni ko'p shablonda chaqirish</title>
  <rect x="0" y="0" width="780" height="470" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">get_template_part() bilan qayta ishlatish</text>
  <text x="390" y="56" text-anchor="middle" font-size="14" fill="#475569">Bir marta yozilgan post-kartochkasini ko'p shablonda chaqiring (DRY)</text>

  <!-- Chaqiruvchi shablonlar (chap) -->
  <text x="170" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">Chaqiruvchi shablonlar</text>

  <rect x="60" y="104" width="220" height="64" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">index.php</text>
  <text x="170" y="152" text-anchor="middle" font-size="13" fill="#2563eb" font-family="Consolas, monospace">get_template_part('parts/card')</text>

  <rect x="60" y="184" width="220" height="64" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">archive.php</text>
  <text x="170" y="232" text-anchor="middle" font-size="13" fill="#2563eb" font-family="Consolas, monospace">get_template_part('parts/card')</text>

  <rect x="60" y="264" width="220" height="64" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">search.php</text>
  <text x="170" y="312" text-anchor="middle" font-size="13" fill="#2563eb" font-family="Consolas, monospace">get_template_part('parts/card')</text>

  <!-- strelkalar -->
  <line x1="280" y1="136" x2="470" y2="210" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="280" y1="216" x2="470" y2="220" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="280" y1="296" x2="470" y2="230" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Markaziy bo'lak (o'ng) -->
  <rect x="480" y="150" width="240" height="150" rx="12" fill="#16a34a"/>
  <text x="600" y="182" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">parts/card.php</text>
  <text x="600" y="208" text-anchor="middle" font-size="13" fill="#dcfce7">Bitta post kartochkasi:</text>
  <text x="600" y="230" text-anchor="middle" font-size="13" fill="#dcfce7">rasm + sarlavha + qisqacha</text>
  <text x="600" y="256" text-anchor="middle" font-size="13" fill="#dcfce7">Bir joyda yoziladi,</text>
  <text x="600" y="276" text-anchor="middle" font-size="13" fill="#dcfce7">hamma joyda ishlatiladi</text>

  <!-- variant nomi -->
  <rect x="480" y="320" width="240" height="78" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="600" y="345" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Variant tanlash (2-argument):</text>
  <text x="600" y="368" text-anchor="middle" font-size="13" fill="#92400e" font-family="Consolas, monospace">get_template_part('parts/card','wide')</text>
  <text x="600" y="388" text-anchor="middle" font-size="13" fill="#92400e">-&gt; avval card-wide.php ni izlaydi</text>

  <text x="390" y="430" text-anchor="middle" font-size="13" fill="#475569" font-weight="700">Foydasi: o'zgartirish bitta faylda — barcha sahifalarda bir vaqtda yangilanadi</text>
  <text x="390" y="454" text-anchor="middle" font-size="13" fill="#94a3b8">3-argument ($args) bilan bo'lakka ma'lumot uzatish mumkin (WP 5.5+)</text>
</svg>
