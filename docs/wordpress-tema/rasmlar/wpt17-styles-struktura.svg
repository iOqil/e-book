<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>theme.json styles bo'limi iyerarxiyasi: root daraja, elements va blocks</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle">theme.json &#8594; "styles" bo'limi tuzilishi</text>

  <!-- root styles box -->
  <rect x="280" y="56" width="200" height="50" rx="8" fill="#2563eb"/>
  <text x="380" y="80" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">"styles": &#123; ... &#125;</text>
  <text x="380" y="98" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dbeafe" text-anchor="middle">sayt standart ko'rinishi</text>

  <!-- connectors -->
  <line x1="380" y1="106" x2="140" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <line x1="380" y1="106" x2="380" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <line x1="380" y1="106" x2="620" y2="150" stroke="#94a3b8" stroke-width="2"/>

  <!-- ROOT level -->
  <rect x="30" y="150" width="220" height="130" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="173" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#16a34a" text-anchor="middle">ROOT daraja</text>
  <text x="140" y="193" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">butun saytga</text>
  <text x="46" y="216" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">color (background, text)</text>
  <text x="46" y="236" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">typography (fontSize...)</text>
  <text x="46" y="256" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">spacing (padding, blockGap)</text>
  <text x="46" y="274" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">css (custom CSS)</text>

  <!-- elements level -->
  <rect x="270" y="150" width="220" height="130" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="380" y="173" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#d97706" text-anchor="middle">"elements"</text>
  <text x="380" y="193" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">HTML elementlari</text>
  <text x="286" y="216" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">link (:hover, :focus)</text>
  <text x="286" y="236" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">heading, h1...h6</text>
  <text x="286" y="256" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">button (:hover)</text>
  <text x="286" y="274" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">caption, cite</text>

  <!-- blocks level -->
  <rect x="510" y="150" width="220" height="130" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="620" y="173" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#dc2626" text-anchor="middle">"blocks"</text>
  <text x="620" y="193" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">har bir blok alohida</text>
  <text x="526" y="216" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">core/quote</text>
  <text x="526" y="236" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">core/button</text>
  <text x="526" y="256" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">core/code</text>
  <text x="526" y="274" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">core/post-title ...</text>

  <!-- nesting note -->
  <rect x="510" y="300" width="220" height="56" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="620" y="322" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">blocks ichida elements</text>
  <text x="620" y="342" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">core/quote &#8594; cite</text>
  <line x1="620" y1="280" x2="620" y2="300" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- arrow to CSS output -->
  <rect x="180" y="384" width="400" height="62" rx="10" fill="#21759b"/>
  <text x="380" y="408" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">WordPress hammasini avtomatik CSS ga aylantiradi</text>
  <text x="380" y="431" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#cfe8f3" text-anchor="middle">qo'lda style.css yozmaysiz &#8212; theme.json &#8594; &lt;style&gt;</text>
  <line x1="140" y1="280" x2="300" y2="384" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="380" y1="280" x2="380" y2="384" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="620" y1="356" x2="460" y2="384" stroke="#94a3b8" stroke-width="1.5"/>
</svg>
