<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="Segoe UI, system-ui, sans-serif">
  <title>Block tema papka strukturasi: theme.json, templates, parts, patterns, styles</title>
  <rect x="0" y="0" width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Block tema papka strukturasi</text>

  <!-- ildiz papka -->
  <rect x="40" y="56" width="280" height="36" rx="6" fill="#475569"/>
  <text x="58" y="80" font-size="16" fill="#ffffff" font-family="Consolas, monospace">mening-temam/</text>

  <!-- vertikal chiziq -->
  <line x1="64" y1="92" x2="64" y2="430" stroke="#94a3b8" stroke-width="2"/>

  <!-- elementlar funksiyasi: chap blok = fayl, o'ng = izoh -->
  <!-- style.css -->
  <line x1="64" y1="118" x2="92" y2="118" stroke="#94a3b8" stroke-width="2"/>
  <rect x="92" y="100" width="240" height="36" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="106" y="124" font-size="15" fill="#1e293b" font-family="Consolas, monospace">style.css</text>
  <text x="350" y="124" font-size="14" fill="#475569">tema nomi (header sharti)</text>

  <!-- theme.json -->
  <line x1="64" y1="158" x2="92" y2="158" stroke="#94a3b8" stroke-width="2"/>
  <rect x="92" y="140" width="240" height="36" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="106" y="164" font-size="15" fill="#1e293b" font-family="Consolas, monospace">theme.json</text>
  <text x="350" y="164" font-size="14" fill="#2563eb" font-weight="bold">SHART: stil + sozlamalar</text>

  <!-- templates/ -->
  <line x1="64" y1="198" x2="92" y2="198" stroke="#94a3b8" stroke-width="2"/>
  <rect x="92" y="180" width="240" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="106" y="204" font-size="15" fill="#1e293b" font-family="Consolas, monospace">templates/</text>
  <text x="350" y="204" font-size="14" fill="#475569">sahifa shablonlari (.html)</text>
  <text x="120" y="234" font-size="14" fill="#475569" font-family="Consolas, monospace">index.html · single.html</text>
  <text x="120" y="254" font-size="14" fill="#475569" font-family="Consolas, monospace">page.html · 404.html</text>

  <!-- parts/ -->
  <line x1="64" y1="288" x2="92" y2="288" stroke="#94a3b8" stroke-width="2"/>
  <rect x="92" y="270" width="240" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="106" y="294" font-size="15" fill="#1e293b" font-family="Consolas, monospace">parts/</text>
  <text x="350" y="294" font-size="14" fill="#475569">qayta ishlatiluvchi bo'laklar</text>
  <text x="120" y="324" font-size="14" fill="#475569" font-family="Consolas, monospace">header.html · footer.html</text>

  <!-- patterns/ -->
  <line x1="64" y1="358" x2="92" y2="358" stroke="#94a3b8" stroke-width="2"/>
  <rect x="92" y="340" width="240" height="36" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <text x="106" y="364" font-size="15" fill="#1e293b" font-family="Consolas, monospace">patterns/</text>
  <text x="350" y="364" font-size="14" fill="#475569">tayyor blok to'plamlari (.php)</text>

  <!-- styles/ -->
  <line x1="64" y1="398" x2="92" y2="398" stroke="#94a3b8" stroke-width="2"/>
  <rect x="92" y="380" width="240" height="36" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <text x="106" y="404" font-size="15" fill="#1e293b" font-family="Consolas, monospace">styles/</text>
  <text x="350" y="404" font-size="14" fill="#475569">stil variatsiyalari (.json)</text>

  <!-- functions.php (ixtiyoriy) -->
  <line x1="64" y1="438" x2="92" y2="438" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="92" y="420" width="240" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="106" y="442" font-size="15" fill="#475569" font-family="Consolas, monospace">functions.php</text>
  <text x="350" y="442" font-size="14" fill="#94a3b8">ixtiyoriy (enqueue, hooks)</text>
</svg>
