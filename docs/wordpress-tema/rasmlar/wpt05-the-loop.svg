<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="Segoe UI, system-ui, sans-serif">
  <title>The Loop oqimi: have_posts tekshiradi, the_post tayyorlaydi, ma'lumot chiqariladi va takrorlanadi</title>
  <rect x="0" y="0" width="760" height="560" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">The Loop oqimi</text>
  <text x="380" y="56" text-anchor="middle" font-size="14" fill="#475569">WordPress so'rov natijasidagi har bir post'ni navbatma-navbat chiqaradi</text>

  <!-- 1. Boshlanish: main query tayyor -->
  <rect x="280" y="80" width="200" height="58" rx="29" fill="#21759b"/>
  <text x="380" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">WP main query tayyor</text>
  <text x="380" y="126" text-anchor="middle" font-size="13" fill="#dbeafe">(postlar massivi yuklangan)</text>

  <!-- strelka -->
  <line x1="380" y1="138" x2="380" y2="172" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="380,180 374,170 386,170" fill="#94a3b8"/>

  <!-- 2. have_posts() ? -->
  <polygon points="380,190 500,250 380,310 260,250" fill="#f59e0b"/>
  <text x="380" y="244" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">have_posts()</text>
  <text x="380" y="264" text-anchor="middle" font-size="13" fill="#1e293b">post bormi?</text>

  <!-- HA strelka pastga -->
  <line x1="380" y1="310" x2="380" y2="344" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="380,352 374,342 386,342" fill="#16a34a"/>
  <text x="398" y="332" font-size="13" font-weight="700" fill="#16a34a">HA</text>

  <!-- YOQ strelka chapga -->
  <line x1="260" y1="250" x2="150" y2="250" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="142,250 152,244 152,256" fill="#dc2626"/>
  <text x="205" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">YO'Q</text>

  <!-- YOQ holati: bo'sh xabar -->
  <rect x="20" y="222" width="120" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="80" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">else:</text>
  <text x="80" y="265" text-anchor="middle" font-size="13" fill="#991b1b">"topilmadi"</text>

  <!-- 3. the_post() -->
  <rect x="280" y="360" width="200" height="56" rx="10" fill="#2563eb"/>
  <text x="380" y="384" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">the_post()</text>
  <text x="380" y="403" text-anchor="middle" font-size="13" fill="#dbeafe">global $post ni tayyorlaydi</text>

  <line x1="380" y1="416" x2="380" y2="446" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="380,454 374,444 386,444" fill="#94a3b8"/>

  <!-- 4. ma'lumot chiqarish -->
  <rect x="240" y="462" width="280" height="62" rx="10" fill="#16a34a"/>
  <text x="380" y="486" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Ma'lumotni chiqar</text>
  <text x="380" y="506" text-anchor="middle" font-size="13" fill="#dcfce7">the_title() · the_content() · the_permalink()</text>

  <!-- takror strelkasi: pastdan o'ngga va yuqoriga have_posts ga -->
  <path d="M 520 493 H 600 V 250 H 500" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="6 5"/>
  <polygon points="500,250 510,244 510,256" fill="#475569"/>
  <text x="610" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#475569" transform="rotate(90 610 372)">while: keyingi post'ga takror</text>

  <text x="380" y="550" text-anchor="middle" font-size="13" fill="#94a3b8">while ( have_posts() ) : the_post(); ... endwhile;</text>
</svg>
