<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" width="780" height="540">
  <title>Kitobdan keyingi yo'l xaritasi: plagin yaratish, Gutenberg chuqurlashtirish, headless WordPress va tema biznesi</title>
  <rect width="780" height="540" fill="#f8fafc"/>
  <text x="390" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1e293b">Kitobdan keyin: keyingi qadamlar</text>

  <!-- Center node -->
  <circle cx="390" cy="270" r="62" fill="#21759b"/>
  <text x="390" y="264" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Siz endi</text>
  <text x="390" y="284" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">tema</text>
  <text x="390" y="304" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">ustasisiz</text>

  <defs>
    <marker id="arr30b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Branch 1: Plagin -->
  <line x1="338" y1="232" x2="230" y2="150" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr30b)"/>
  <rect x="30" y="86" width="300" height="92" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="48" y="112" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#2563eb">1. Plagin yaratish</text>
  <text x="48" y="134" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Funksionallikni temadan ajrating:</text>
  <text x="48" y="153" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">CPT, shortcode, hooklar, plugin header.</text>
  <text x="48" y="171" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">"Tema = ko'rinish, plagin = mantiq".</text>

  <!-- Branch 2: Gutenberg -->
  <line x1="442" y1="232" x2="550" y2="150" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr30b)"/>
  <rect x="450" y="86" width="300" height="92" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="468" y="112" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#16a34a">2. Gutenberg chuqur</text>
  <text x="468" y="134" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">SlotFill, block bindings, formatlar,</text>
  <text x="468" y="153" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">@wordpress/data store, Interactivity API,</text>
  <text x="468" y="171" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">murakkab InnerBlocks tizimlar.</text>

  <!-- Branch 3: Headless -->
  <line x1="442" y1="308" x2="550" y2="390" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr30b)"/>
  <rect x="450" y="362" width="300" height="92" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="468" y="388" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#d97706">3. Headless WordPress</text>
  <text x="468" y="410" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">WP = backend; REST API yoki WPGraphQL.</text>
  <text x="468" y="429" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Frontend: Next.js / Astro / Nuxt.</text>
  <text x="468" y="447" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Tez, zamonaviy, ajratilgan arxitektura.</text>

  <!-- Branch 4: Biznes -->
  <line x1="338" y1="308" x2="230" y2="390" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr30b)"/>
  <rect x="30" y="362" width="300" height="92" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="48" y="388" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#dc2626">4. Tema biznesi</text>
  <text x="48" y="410" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">WordPress.org katalogi (bepul + obro'),</text>
  <text x="48" y="429" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ThemeForest / o'z saytida sotish,</text>
  <text x="48" y="447" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">freelance va mijoz loyihalari.</text>

  <!-- Footer note -->
  <rect x="120" y="484" width="540" height="38" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="390" y="508" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Davom et: ../php/ asoslari · arxitektura · API dizayn · testlash kitoblari</text>
</svg>
