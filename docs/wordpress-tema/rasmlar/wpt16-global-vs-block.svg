<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 480" width="770" height="480">
  <title>settings global vs settings.blocks per-block: global qoida hamma bloklarga, per-block bitta blokni ustidan yozadi</title>
  <rect width="770" height="480" fill="#f8fafc"/>
  <text x="385" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Global settings vs per-block settings</text>

  <!-- GLOBAL box -->
  <rect x="30" y="58" width="340" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">settings.color (GLOBAL)</text>
  <text x="50" y="112" font-family="Consolas, monospace" font-size="13.5" fill="#475569">"settings": {</text>
  <text x="66" y="132" font-family="Consolas, monospace" font-size="13.5" fill="#475569">"color": {</text>
  <text x="82" y="152" font-family="Consolas, monospace" font-size="13.5" fill="#16a34a">"custom": true</text>
  <text x="66" y="172" font-family="Consolas, monospace" font-size="13.5" fill="#475569">} }</text>

  <!-- PER-BLOCK box -->
  <rect x="400" y="58" width="340" height="120" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="570" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#d97706">settings.blocks.core/paragraph</text>
  <text x="420" y="112" font-family="Consolas, monospace" font-size="13.5" fill="#475569">"blocks": {</text>
  <text x="436" y="132" font-family="Consolas, monospace" font-size="13.5" fill="#475569">"core/paragraph": {</text>
  <text x="452" y="152" font-family="Consolas, monospace" font-size="13.5" fill="#dc2626">"color": { "custom": false }</text>
  <text x="436" y="172" font-family="Consolas, monospace" font-size="13.5" fill="#475569">} }</text>

  <!-- arrows down -->
  <g stroke="#94a3b8" stroke-width="2.5" fill="none">
    <path d="M200 178 L200 220"/>
    <path d="M570 178 L570 220"/>
  </g>
  <polygon points="194,214 200,228 206,214" fill="#94a3b8"/>
  <polygon points="564,214 570,228 576,214" fill="#94a3b8"/>

  <!-- result blocks -->
  <text x="385" y="252" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Natija: editorda bloklar</text>

  <!-- Heading block (global applies) -->
  <rect x="40" y="270" width="200" height="84" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="296" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">core/heading</text>
  <text x="140" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#16a34a">Custom rang: BOR</text>
  <text x="140" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(globaldan meros)</text>

  <!-- Group block (global applies) -->
  <rect x="265" y="270" width="200" height="84" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="365" y="296" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">core/group</text>
  <text x="365" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#16a34a">Custom rang: BOR</text>
  <text x="365" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(globaldan meros)</text>

  <!-- Paragraph block (per-block overrides) -->
  <rect x="490" y="270" width="240" height="84" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
  <text x="610" y="296" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">core/paragraph</text>
  <text x="610" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#dc2626">Custom rang: YO'Q</text>
  <text x="610" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(per-block ustidan yozdi)</text>

  <!-- rule box -->
  <rect x="60" y="384" width="650" height="78" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="385" y="410" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Qoida: aniqlik yutadi (specificity)</text>
  <text x="385" y="434" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Global qoida hamma bloklarga tarqaladi. settings.blocks.{block} esa</text>
  <text x="385" y="453" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">faqat o'sha bitta blok uchun global qiymatni ustidan yozadi (override).</text>
</svg>
