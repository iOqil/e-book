<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Menyu oqimi: register_nav_menus -> Appearance Menus -> wp_nav_menu</title>
  <rect x="0" y="0" width="820" height="470" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Menyu qanday ishlaydi: uch bosqich</text>
  <text x="410" y="56" text-anchor="middle" font-size="14" fill="#475569">Dasturchi joy ochadi, admin menyu to'ldiradi, tema chiqaradi</text>

  <defs>
    <marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- 1: register_nav_menus -->
  <rect x="40" y="100" width="220" height="220" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="70" cy="130" r="16" fill="#2563eb"/>
  <text x="70" y="135" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text>
  <text x="150" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Dasturchi (kod)</text>
  <text x="150" y="162" text-anchor="middle" font-size="13" fill="#475569">functions.php ichida</text>
  <rect x="58" y="176" width="184" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="150" y="198" text-anchor="middle" font-size="13" fill="#2563eb" font-family="Consolas, monospace">register_nav_menus()</text>
  <text x="150" y="220" text-anchor="middle" font-size="13" fill="#475569">after_setup_theme</text>
  <text x="150" y="237" text-anchor="middle" font-size="13" fill="#475569">hookida</text>
  <text x="150" y="270" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="700">Menyu JOYI ochiladi</text>
  <text x="150" y="292" text-anchor="middle" font-size="13" fill="#475569">masalan 'primary'</text>

  <line x1="260" y1="210" x2="300" y2="210" stroke="#475569" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- 2: Appearance > Menus -->
  <rect x="300" y="100" width="220" height="220" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <circle cx="330" cy="130" r="16" fill="#16a34a"/>
  <text x="330" y="135" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2</text>
  <text x="410" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Admin (sichqoncha)</text>
  <text x="410" y="162" text-anchor="middle" font-size="13" fill="#475569">WP boshqaruv panelida</text>
  <rect x="318" y="176" width="184" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="410" y="198" text-anchor="middle" font-size="13" fill="#16a34a" font-weight="700">Ko'rinish (Appearance)</text>
  <text x="410" y="217" text-anchor="middle" font-size="13" fill="#16a34a">&gt; Menyular (Menus)</text>
  <text x="410" y="237" text-anchor="middle" font-size="13" fill="#475569">sahifa/havola qo'shadi</text>
  <text x="410" y="270" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="700">Menyu TO'LDIRILADI</text>
  <text x="410" y="292" text-anchor="middle" font-size="13" fill="#475569">joyga biriktiriladi</text>

  <line x1="520" y1="210" x2="560" y2="210" stroke="#475569" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- 3: wp_nav_menu -->
  <rect x="560" y="100" width="220" height="220" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2.5"/>
  <circle cx="590" cy="130" r="16" fill="#d97706"/>
  <text x="590" y="135" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">3</text>
  <text x="670" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Tema (chiqarish)</text>
  <text x="670" y="162" text-anchor="middle" font-size="13" fill="#475569">header.php ichida</text>
  <rect x="578" y="176" width="184" height="64" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="670" y="198" text-anchor="middle" font-size="13" fill="#b45309" font-family="Consolas, monospace">wp_nav_menu()</text>
  <text x="670" y="220" text-anchor="middle" font-size="13" fill="#475569">theme_location</text>
  <text x="670" y="237" text-anchor="middle" font-size="13" fill="#475569">=&gt; 'primary'</text>
  <text x="670" y="270" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="700">HTML chiqadi</text>
  <text x="670" y="292" text-anchor="middle" font-size="13" fill="#475569">&lt;ul&gt;&lt;li&gt;&lt;a&gt;...</text>

  <rect x="40" y="346" width="740" height="44" rx="10" fill="#e2e8f0"/>
  <text x="410" y="374" text-anchor="middle" font-size="14" fill="#1e293b">Asosiy g'oya: kod faqat JOY ochadi, mazmunni admin boshqaradi — kontent va dizayn ajraladi</text>

  <text x="410" y="424" text-anchor="middle" font-size="13" fill="#475569">Agar admin menyu tuzmasa: fallback_cb ishlaydi (masalan wp_page_menu — sahifalar ro'yxati)</text>
  <text x="410" y="450" text-anchor="middle" font-size="13" fill="#94a3b8">has_nav_menu('primary') bilan menyu biriktirilganini tekshirib bo'ladi</text>
</svg>
