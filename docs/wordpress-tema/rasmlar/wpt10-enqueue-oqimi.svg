<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>wp_enqueue_scripts hook orqali register/enqueue va head/footer chiqishi</title>
  <rect width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Enqueue oqimi: hook'dan sahifaga</text>

  <!-- Step 1: hook -->
  <rect x="40" y="64" width="300" height="78" rx="10" fill="#2563eb"/>
  <text x="190" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">1. wp_enqueue_scripts</text>
  <text x="190" y="114" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dbeafe">WordPress bu hook'ni ishga tushiradi</text>
  <text x="190" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dbeafe">(har sahifa yuklanganda)</text>

  <!-- arrow -->
  <line x1="190" y1="142" x2="190" y2="174" stroke="#475569" stroke-width="2"/>
  <polygon points="190,182 185,172 195,172" fill="#475569"/>

  <!-- Step 2: your callback -->
  <rect x="40" y="184" width="300" height="96" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">2. Sizning funksiyangiz</text>
  <text x="190" y="232" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">wp_register_style/script</text>
  <text x="190" y="250" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">wp_enqueue_style/script</text>
  <text x="190" y="268" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">(navbatga qo'yadi, hali chiqarmaydi)</text>

  <!-- arrow -->
  <line x1="190" y1="280" x2="190" y2="312" stroke="#475569" stroke-width="2"/>
  <polygon points="190,320 185,310 195,310" fill="#475569"/>

  <!-- Step 3: WP collects -->
  <rect x="40" y="322" width="300" height="78" rx="10" fill="#16a34a"/>
  <text x="190" y="350" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">3. WordPress to'playdi</text>
  <text x="190" y="372" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dcfce7">dependency tartibini hal qiladi,</text>
  <text x="190" y="390" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dcfce7">dublikatlarni o'chiradi, ?ver qo'shadi</text>

  <!-- arrows to outputs -->
  <line x1="340" y1="103" x2="430" y2="103" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="340" y1="361" x2="430" y2="361" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- output: head -->
  <rect x="432" y="74" width="290" height="120" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="577" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">wp_head() -> &lt;head&gt;</text>
  <text x="448" y="126" font-family="Consolas, monospace" font-size="13" fill="#475569">&lt;link rel="stylesheet"</text>
  <text x="448" y="146" font-family="Consolas, monospace" font-size="13" fill="#475569">  href="...main.css?ver=12"&gt;</text>
  <text x="448" y="172" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">CSS odatda head'da</text>

  <!-- output: footer -->
  <rect x="432" y="306" width="290" height="120" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="577" y="332" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">wp_footer() -> footer</text>
  <text x="448" y="358" font-family="Consolas, monospace" font-size="13" fill="#475569">&lt;script src="...app.js</text>
  <text x="448" y="378" font-family="Consolas, monospace" font-size="13" fill="#475569">  ?ver=12" defer&gt;&lt;/script&gt;</text>
  <text x="448" y="404" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">JS (in_footer=true) footer'da</text>

  <text x="380" y="450" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Siz hech qachon &lt;link&gt;/&lt;script&gt; teglarini qo'lda yozmaysiz - WordPress chiqaradi.</text>
</svg>
