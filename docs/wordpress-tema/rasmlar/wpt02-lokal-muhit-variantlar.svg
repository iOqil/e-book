<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <title>Lokal WordPress muhit variantlari taqqoslash</title>
  <rect x="0" y="0" width="800" height="480" fill="#f8fafc"/>
  <text x="400" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Lokal WordPress muhit variantlari</text>

  <!-- jadval sarlavhasi -->
  <rect x="30" y="60" width="740" height="42" rx="6" fill="#1e293b"/>
  <text x="120" y="87" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Vosita</text>
  <text x="330" y="87" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Qulaylik</text>
  <text x="540" y="87" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Kim uchun</text>
  <text x="710" y="87" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Talab</text>

  <!-- LocalWP -->
  <rect x="30" y="102" width="740" height="62" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="130" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">LocalWP</text>
  <text x="44" y="151" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">(grafik ilova)</text>
  <text x="330" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Eng oson, 1 klik</text>
  <text x="540" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Yangi boshlovchi</text>
  <text x="710" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">O'rnatish</text>

  <!-- Studio -->
  <rect x="30" y="164" width="740" height="62" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="192" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">Studio by WP</text>
  <text x="44" y="213" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">(Automattic, bepul)</text>
  <text x="330" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Oson, yengil</text>
  <text x="540" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Tez prototip</text>
  <text x="710" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">O'rnatish</text>

  <!-- XAMPP -->
  <rect x="30" y="226" width="740" height="62" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="254" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#d97706">XAMPP / MAMP</text>
  <text x="44" y="275" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">(Apache+MySQL+PHP)</text>
  <text x="330" y="262" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#d97706">Qo'lda sozlash</text>
  <text x="540" y="262" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Klassik usul</text>
  <text x="710" y="262" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">WP qo'lda</text>

  <!-- wp-env -->
  <rect x="30" y="288" width="740" height="62" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="316" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#7c3aed">wp-env</text>
  <text x="44" y="337" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">(@wordpress/env)</text>
  <text x="330" y="324" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#d97706">Terminal, npx</text>
  <text x="540" y="324" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Blok ishlab chiqish</text>
  <text x="710" y="324" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Node+Docker</text>

  <!-- Docker -->
  <rect x="30" y="350" width="740" height="62" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="378" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#475569">Docker (qo'lda)</text>
  <text x="44" y="399" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">(docker-compose)</text>
  <text x="330" y="386" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">Murakkab</text>
  <text x="540" y="386" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">To'liq nazorat</text>
  <text x="710" y="386" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Docker</text>

  <text x="400" y="448" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a" font-weight="bold">Tavsiya: boshlovchiga LocalWP; blok ishlab chiqishga wp-env.</text>
</svg>
