<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500" font-family="Segoe UI, system-ui, sans-serif">
  <title>Custom page template oqimi: Template Name header dan sahifa tahririgacha</title>
  <rect x="0" y="0" width="780" height="500" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Custom page template oqimi</text>
  <text x="390" y="56" text-anchor="middle" font-size="14" fill="#475569">"Template Name" - foydalanuvchi QO'LDA tanlaydigan shablon</text>

  <!-- Step 1: fayl + header -->
  <rect x="40" y="84" width="320" height="150" rx="10" fill="#1e293b"/>
  <text x="60" y="110" font-size="14" font-weight="700" fill="#f59e0b">1) template-portfolio.php</text>
  <text x="60" y="138" font-size="13" fill="#e2e8f0" font-family="Consolas, monospace">&lt;?php</text>
  <text x="60" y="158" font-size="13" fill="#e2e8f0" font-family="Consolas, monospace">/**</text>
  <text x="60" y="178" font-size="13" fill="#16a34a" font-family="Consolas, monospace"> * Template Name: Portfolio</text>
  <text x="60" y="198" font-size="13" fill="#94a3b8" font-family="Consolas, monospace"> * Template Post Type: page</text>
  <text x="60" y="218" font-size="13" fill="#e2e8f0" font-family="Consolas, monospace"> */</text>

  <!-- arrow 1 -->
  <line x1="360" y1="160" x2="420" y2="160" stroke="#21759b" stroke-width="3"/>
  <polygon points="420,152 438,160 420,168" fill="#21759b"/>

  <!-- Step 2: WP ro'yxatga oladi -->
  <rect x="448" y="100" width="300" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="598" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">2) WordPress header'ni o'qiydi</text>
  <text x="598" y="156" text-anchor="middle" font-size="13" fill="#475569">get_page_templates() -></text>
  <text x="598" y="180" text-anchor="middle" font-size="13" fill="#475569">shablonni ro'yxatga qo'shadi</text>
  <text x="598" y="204" text-anchor="middle" font-size="13" fill="#94a3b8">{"template-portfolio.php":"Portfolio"}</text>

  <!-- arrow down -->
  <line x1="598" y1="220" x2="598" y2="266" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="590,266 598,284 606,266" fill="#94a3b8"/>

  <!-- Step 3: sahifa tahriri -->
  <rect x="448" y="288" width="300" height="150" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="598" y="314" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">3) Sahifa tahriri</text>
  <text x="598" y="338" text-anchor="middle" font-size="13" fill="#475569">Sahifa atributlari &gt; Shablon</text>
  <rect x="478" y="352" width="240" height="34" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="496" y="374" font-size="13" fill="#1e293b">Standart</text>
  <rect x="478" y="392" width="240" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="496" y="414" font-size="13" font-weight="700" fill="#2563eb">Portfolio  &lt;- tanlandi</text>

  <!-- arrow left to render -->
  <line x1="448" y1="362" x2="380" y2="362" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="380,354 362,362 380,370" fill="#94a3b8"/>

  <!-- Step 4: render -->
  <rect x="40" y="300" width="320" height="124" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2.5"/>
  <text x="200" y="328" text-anchor="middle" font-size="14" font-weight="700" fill="#d97706">4) Shu sahifa ochilganda</text>
  <text x="200" y="354" text-anchor="middle" font-size="13" fill="#475569">page.php EMAS, balki</text>
  <text x="200" y="378" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">template-portfolio.php ishlaydi</text>
  <text x="200" y="402" text-anchor="middle" font-size="13" fill="#94a3b8">(slug muhim emas, faqat tanlov muhim)</text>

  <text x="390" y="470" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="700">Farq: page-{slug}.php avtomatik; custom template esa qo'lda tanlanadi</text>
  <text x="390" y="492" text-anchor="middle" font-size="13" fill="#94a3b8">Shuning uchun bitta shablonni ko'p sahifaga qo'llash mumkin</text>
</svg>
