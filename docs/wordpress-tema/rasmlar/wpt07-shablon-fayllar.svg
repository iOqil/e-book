<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Klassik tema shablon fayllari va har birining vazifasi</title>
  <rect x="0" y="0" width="780" height="470" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Klassik tema shablon fayllari</text>
  <text x="390" y="56" text-anchor="middle" font-size="14" fill="#475569">Qaysi URL ochilsa - WordPress mos faylni tanlaydi</text>

  <!-- index.php (fallback) -->
  <rect x="280" y="84" width="220" height="58" rx="10" fill="#475569"/>
  <text x="390" y="110" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">index.php</text>
  <text x="390" y="131" text-anchor="middle" font-size="13" fill="#e2e8f0">Zaxira (fallback) - doim ishlaydi</text>

  <!-- single.php -->
  <rect x="40" y="180" width="220" height="64" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="150" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#2563eb">single.php</text>
  <text x="150" y="228" text-anchor="middle" font-size="13" fill="#475569">Bitta post (yozuv) sahifasi</text>

  <!-- page.php -->
  <rect x="280" y="180" width="220" height="64" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="390" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">page.php</text>
  <text x="390" y="228" text-anchor="middle" font-size="13" fill="#475569">Statik sahifa (Biz haqimizda)</text>

  <!-- archive.php -->
  <rect x="520" y="180" width="220" height="64" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2.5"/>
  <text x="630" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#d97706">archive.php</text>
  <text x="630" y="228" text-anchor="middle" font-size="13" fill="#475569">Kategoriya/teg/sana ro'yxati</text>

  <!-- category.php -->
  <rect x="40" y="282" width="220" height="64" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2.5"/>
  <text x="150" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#d97706">category.php</text>
  <text x="150" y="330" text-anchor="middle" font-size="13" fill="#475569">Faqat kategoriya arxivi</text>

  <!-- search.php -->
  <rect x="280" y="282" width="220" height="64" rx="10" fill="#ffffff" stroke="#21759b" stroke-width="2.5"/>
  <text x="390" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#21759b">search.php</text>
  <text x="390" y="330" text-anchor="middle" font-size="13" fill="#475569">Qidiruv (?s=...) natijasi</text>

  <!-- 404.php -->
  <rect x="520" y="282" width="220" height="64" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
  <text x="630" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">404.php</text>
  <text x="630" y="330" text-anchor="middle" font-size="13" fill="#475569">Manzil topilmadi</text>

  <!-- arrows from index to each -->
  <line x1="350" y1="142" x2="180" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <line x1="390" y1="142" x2="390" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <line x1="430" y1="142" x2="600" y2="180" stroke="#94a3b8" stroke-width="2"/>

  <text x="390" y="158" text-anchor="middle" font-size="13" fill="#94a3b8">mos fayl topilmasa -> index.php ga tushadi</text>

  <!-- legend -->
  <rect x="120" y="388" width="540" height="58" rx="10" fill="#e2e8f0"/>
  <text x="390" y="412" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Qoida: aniqroq fayl - kuchliroq</text>
  <text x="390" y="434" text-anchor="middle" font-size="13" fill="#475569">category.php (aniq) &gt; archive.php (umumiy) &gt; index.php (zaxira)</text>
</svg>
