  <text x="380" y="450" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569" font-weight="bold">Bitta tema — bir nechta tayyor ko'rinish, kod yozmasdan almashtiriladi</text>
