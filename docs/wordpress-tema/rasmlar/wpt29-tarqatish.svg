<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 490" width="820" height="490" font-family="Segoe UI, system-ui, sans-serif">
  <title>Tema tarqatish: Theme Check -> WordPress.org katalogi (GPL, escaping) yoki premium</title>
  <rect x="0" y="0" width="820" height="490" fill="#f8fafc"/>
  <text x="410" y="36" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">Temani tarqatish yo'li</text>

  <!-- Step 1: Tema tayyor -->
  <rect x="40" y="62" width="200" height="78" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="140" y="92" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Tema tayyor</text>
  <text x="140" y="116" font-size="13" fill="#475569" text-anchor="middle">kod + style.css</text>
  <text x="140" y="132" font-size="13" fill="#475569" text-anchor="middle">Version: 1.0.0</text>

  <path d="M240 101 L296 101" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Step 2: Theme Check -->
  <rect x="300" y="62" width="220" height="78" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="90" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">Theme Check plagin</text>
  <text x="410" y="114" font-size="13" fill="#1e293b" text-anchor="middle">escaping, i18n, headerlar,</text>
  <text x="410" y="131" font-size="13" fill="#1e293b" text-anchor="middle">eskirgan API -> REQUIRED = 0</text>

  <path d="M520 101 L576 101" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Step 3: branching point -->
  <rect x="580" y="62" width="200" height="78" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="680" y="92" font-size="16" font-weight="bold" fill="#d97706" text-anchor="middle">Tarqatish kanali?</text>
  <text x="680" y="116" font-size="13" fill="#1e293b" text-anchor="middle">.zip (slug = papka)</text>
  <text x="680" y="132" font-size="13" fill="#1e293b" text-anchor="middle">ikki yo'l</text>

  <!-- branch lines -->
  <path d="M680 140 L680 168 L230 168 L230 196" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#g)"/>
  <path d="M680 140 L680 168 L600 168 L600 196" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#bl)"/>

  <!-- Left: wordpress.org -->
  <rect x="40" y="200" width="380" height="260" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="40" y="200" width="380" height="40" rx="12" fill="#16a34a"/>
  <text x="230" y="226" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">A) WordPress.org katalogi (tekin)</text>

  <text x="60" y="266" font-size="14" font-weight="bold" fill="#16a34a">Majburiy talablar:</text>
  <text x="60" y="290" font-size="14" fill="#1e293b">&#10003; GPL litsenziya (kod + resurs)</text>
  <text x="60" y="314" font-size="14" fill="#1e293b">&#10003; noyob prefiks (kitob_)</text>
  <text x="60" y="338" font-size="14" fill="#1e293b">&#10003; escaping + sanitization</text>
  <text x="60" y="362" font-size="14" fill="#1e293b">&#10003; i18n (text domain = slug)</text>
  <text x="60" y="386" font-size="14" fill="#1e293b">&#10003; no tracking / no reklama</text>
  <text x="60" y="410" font-size="14" fill="#1e293b">&#10003; wp_head() / wp_footer()</text>
  <rect x="60" y="424" width="340" height="26" rx="6" fill="#dcfce7"/>
  <text x="230" y="442" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">reviewer -> auto yangilanish</text>

  <!-- Right: premium -->
  <rect x="440" y="200" width="340" height="260" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="440" y="200" width="340" height="40" rx="12" fill="#2563eb"/>
  <text x="610" y="226" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">B) Premium (pulli)</text>

  <text x="460" y="266" font-size="14" font-weight="bold" fill="#2563eb">Kanal:</text>
  <text x="460" y="290" font-size="14" fill="#1e293b">&#8226; ThemeForest (Envato)</text>
  <text x="460" y="314" font-size="14" fill="#1e293b">&#8226; o'z sayti orqali</text>
  <text x="460" y="338" font-size="14" fill="#1e293b">&#8226; freemium (tekin + Pro)</text>

  <rect x="460" y="356" width="300" height="44" rx="6" fill="#dbeafe"/>
  <text x="610" y="375" font-size="13" fill="#2563eb" text-anchor="middle">GPL = sotsa bo'ladi</text>
  <text x="610" y="392" font-size="13" fill="#1e293b" text-anchor="middle">(erkin, "tekin" emas)</text>

  <rect x="460" y="410" width="300" height="40" rx="6" fill="#fef3c7"/>
  <text x="610" y="428" font-size="13" fill="#d97706" text-anchor="middle">Update URI: -> o'z update</text>
  <text x="610" y="444" font-size="13" fill="#d97706" text-anchor="middle">serveri kerak</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#475569"/>
    </marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#16a34a"/>
    </marker>
    <marker id="bl" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#2563eb"/>
    </marker>
  </defs>
</svg>
