<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620">
  <title>Kapston temasining to'liq fayl strukturasi: block tema yadrosi, custom blok, i18n va xavfsizlik</title>
  <rect width="760" height="620" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1e293b">ch30-kapston/ — to'liq professional hybrid tema</text>

  <!-- Root box -->
  <rect x="24" y="56" width="712" height="540" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Column 1: block tema yadrosi -->
  <rect x="44" y="78" width="330" height="244" rx="8" fill="#e2e8f0" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="102" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2563eb">Block tema yadrosi (16-21)</text>
  <text x="62" y="128" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">style.css  — header (majburiy)</text>
  <text x="62" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">theme.json  — settings + styles (v3)</text>
  <text x="62" y="172" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">templates/</text>
  <text x="84" y="192" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">index · single · page · archive</text>
  <text x="84" y="210" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">404 · page-keng (custom)</text>
  <text x="62" y="232" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">parts/</text>
  <text x="84" y="252" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">header.html · footer.html</text>
  <text x="62" y="274" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">patterns/  — hero.php · cta.php</text>
  <text x="62" y="296" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">styles/  — tungi.json (variation)</text>

  <!-- Column 2: custom blok -->
  <rect x="394" y="78" width="322" height="156" rx="8" fill="#e2e8f0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="410" y="102" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#16a34a">Custom blok (22-25)</text>
  <text x="412" y="126" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">build/xizmat-kartasi/</text>
  <text x="434" y="146" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">block.json (apiVersion 3)</text>
  <text x="434" y="164" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">index.js  (wp-scripts build)</text>
  <text x="434" y="182" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">index.asset.php</text>
  <text x="434" y="200" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">style-index.css · index.css</text>
  <text x="412" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">edit + save (RichText)</text>

  <!-- Column 2b: functions.php glue -->
  <rect x="394" y="246" width="322" height="76" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="410" y="270" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#d97706">functions.php — hybrid yelimi (09-10)</text>
  <text x="412" y="292" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">theme setup · enqueue · register_block_type</text>
  <text x="412" y="310" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">pattern kategoriya · block style</text>

  <!-- Row: i18n + xavfsizlik -->
  <rect x="44" y="338" width="330" height="100" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="362" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2563eb">i18n / l10n (28)</text>
  <text x="62" y="386" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">languages/kapston.pot</text>
  <text x="62" y="408" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">__() / esc_html_x() / _x()</text>
  <text x="62" y="428" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">text domain = kapston</text>

  <rect x="394" y="338" width="322" height="100" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="410" y="362" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#dc2626">Xavfsizlik (27)</text>
  <text x="412" y="386" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">esc_html / esc_url / esc_attr</text>
  <text x="412" y="408" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ABSPATH tekshirish</text>
  <text x="412" y="428" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">har chiqishni escape qilish</text>

  <!-- Row: child tema + theme check -->
  <rect x="44" y="454" width="672" height="124" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="60" y="478" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#16a34a">Tarqatishga tayyor (29)</text>
  <text x="62" y="502" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Theme Check  ·  GPL litsenziya  ·  screenshot.png</text>
  <text x="62" y="524" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">child tema: kapston-child/ (style.css Template: kapston)</text>
  <text x="62" y="546" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">versiyalash  ·  i18n tayyor  ·  hybrid = klassik functions.php + block templates</text>
  <text x="62" y="566" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">wp theme list -> ch30-kapston (jonli WP 7.0 da tasdiqlangan)</text>
</svg>
