<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500">
  <title>InspectorControls editorning o'ng sidebar paneli: PanelBody ichida TextControl, ToggleControl, RangeControl, ColorPalette komponentlari attributelarni boshqaradi</title>
  <rect width="780" height="500" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">InspectorControls — o'ng sidebar sozlamalari</text>

  <!-- editor canvas (left) -->
  <rect x="28" y="58" width="380" height="404" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="218" y="82" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#475569">Editor kanvasi (blok)</text>
  <rect x="56" y="100" width="324" height="120" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="74" y="132" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">! Diqqat</text>
  <text x="74" y="160" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Bu yerga ogohlantirish matni</text>
  <text x="74" y="180" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">RichText bilan yoziladi...</text>
  <text x="218" y="252" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">RichText to'g'ridan-to'g'ri kanvasda</text>
  <text x="218" y="272" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tahrirlanadi (inline)</text>

  <!-- arrow to sidebar -->
  <g stroke="#2563eb" stroke-width="2.5" fill="none"><path d="M408 250 L452 250"/></g>
  <polygon points="448,244 462,250 448,256" fill="#2563eb"/>

  <!-- sidebar (right) -->
  <rect x="468" y="58" width="284" height="404" rx="10" fill="#e2e8f0" stroke="#2563eb" stroke-width="2"/>
  <text x="610" y="82" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">&lt;InspectorControls&gt;</text>

  <!-- PanelBody 1 -->
  <rect x="484" y="96" width="252" height="186" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="498" y="118" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e293b">&#9662; PanelBody "Sozlamalar"</text>

  <!-- ToggleControl -->
  <text x="498" y="144" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Ikonka korsatilsinmi</text>
  <rect x="690" y="134" width="34" height="16" rx="8" fill="#16a34a"/>
  <circle cx="716" cy="142" r="6" fill="#ffffff"/>
  <text x="498" y="160" font-family="Consolas, monospace" font-size="13" fill="#16a34a">ToggleControl</text>

  <!-- RangeControl -->
  <text x="498" y="190" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Burchak radiusi (px)</text>
  <line x1="498" y1="204" x2="724" y2="204" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="588" cy="204" r="7" fill="#2563eb"/>
  <text x="498" y="222" font-family="Consolas, monospace" font-size="13" fill="#2563eb">RangeControl</text>

  <!-- TextControl -->
  <text x="498" y="250" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Sarlavha (matnli)</text>
  <rect x="498" y="256" width="226" height="20" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="504" y="270" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Diqqat</text>
  <text x="498" y="290" font-family="Consolas, monospace" font-size="13" fill="#d97706">TextControl</text>

  <!-- PanelBody 2: ColorPalette -->
  <rect x="484" y="296" width="252" height="86" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="498" y="318" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e293b">&#9656; PanelBody "Fon rangi"</text>
  <circle cx="506" cy="344" r="10" fill="#2563eb"/>
  <circle cx="534" cy="344" r="10" fill="#16a34a"/>
  <circle cx="562" cy="344" r="10" fill="#dc2626"/>
  <circle cx="590" cy="344" r="10" fill="#f59e0b"/>
  <text x="498" y="372" font-family="Consolas, monospace" font-size="13" fill="#7c3aed">ColorPalette</text>

  <!-- note -->
  <rect x="484" y="394" width="252" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="610" y="416" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Har bir control onChange'da</text>
  <text x="610" y="434" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#16a34a">setAttributes(...)</text>

  <!-- bottom note -->
  <text x="390" y="488" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">@wordpress/block-editor: InspectorControls, PanelBody  +  @wordpress/components: TextControl, ToggleControl...</text>
</svg>
