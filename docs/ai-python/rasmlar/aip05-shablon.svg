<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" font-family="Segoe UI, system-ui, sans-serif">
  <title>O'zgaruvchili prompt shabloni: ko'rsatma matni ichiga kontekst va savol joylashtiriladi</title>
  <rect x="0" y="0" width="760" height="410" fill="#f8fafc"/>
  <text x="380" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Prompt shabloni: o'zgarmas ko'rsatma + o'zgaruvchilar</text>

  <!-- Template box -->
  <rect x="40" y="70" width="320" height="290" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="40" y="70" width="320" height="38" rx="14" fill="#eef2ff"/>
  <text x="200" y="95" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">Shablon (o'zgarmas)</text>
  <text x="58" y="138" font-size="14" fill="#1e293b">Quyidagi kontekst asosida</text>
  <text x="58" y="160" font-size="14" fill="#1e293b">savolga javob ber.</text>

  <rect x="58" y="180" width="284" height="56" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="72" y="204" font-size="14" font-weight="700" fill="#0284c7">Kontekst:</text>
  <text x="72" y="226" font-size="14" font-family="JetBrains Mono, monospace" fill="#0284c7">{kontekst}</text>

  <rect x="58" y="248" width="284" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="72" y="272" font-size="14" font-weight="700" fill="#166534">Savol:</text>
  <text x="72" y="294" font-size="14" font-family="JetBrains Mono, monospace" fill="#166534">{savol}</text>

  <text x="200" y="338" text-anchor="middle" font-size="13" fill="#64748b">.format(...) bilan o'zgaruvchi</text>
  <text x="200" y="356" text-anchor="middle" font-size="13" fill="#64748b">to'ldiriladi</text>

  <!-- Arrow -->
  <defs>
    <marker id="sh" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4f46e5"/>
    </marker>
  </defs>
  <line x1="364" y1="215" x2="438" y2="215" stroke="#4f46e5" stroke-width="3" marker-end="url(#sh)"/>

  <!-- Final prompt -->
  <rect x="446" y="70" width="278" height="290" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="446" y="70" width="278" height="38" rx="14" fill="#dcfce7"/>
  <text x="585" y="95" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Tayyor prompt</text>
  <text x="464" y="138" font-size="14" fill="#1e293b">Quyidagi kontekst asosida</text>
  <text x="464" y="160" font-size="14" fill="#1e293b">savolga javob ber.</text>
  <text x="464" y="196" font-size="14" font-weight="700" fill="#0284c7">Kontekst:</text>
  <text x="464" y="218" font-size="13" fill="#475569">Buyurtma 3-kun kechikdi,</text>
  <text x="464" y="238" font-size="13" fill="#475569">mijoz norozi.</text>
  <text x="464" y="274" font-size="14" font-weight="700" fill="#166534">Savol:</text>
  <text x="464" y="296" font-size="13" fill="#475569">Mijozga uzr xatini yoz.</text>
  <text x="585" y="338" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="600">Foydalanuvchi matni — alohida</text>
  <text x="585" y="356" text-anchor="middle" font-size="13" fill="#64748b">(ko'rsatma bilan aralashmaydi)</text>
</svg>
