<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Model tanlash uchburchagi: narx, tezlik va sifat o'rtasidagi muvozanat</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Model tanlash: narx ↔ tezlik ↔ sifat</text>

  <!-- Triangle -->
  <polygon points="380,80 150,330 610,330" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>

  <!-- Vertex labels -->
  <circle cx="380" cy="80" r="8" fill="#4f46e5"/>
  <text x="380" y="64" text-anchor="middle" font-size="18" font-weight="700" fill="#4338ca">Sifat</text>

  <circle cx="150" cy="330" r="8" fill="#16a34a"/>
  <text x="150" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">Narx (arzon)</text>

  <circle cx="610" cy="330" r="8" fill="#0ea5e9"/>
  <text x="610" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#0284c7">Tezlik</text>

  <!-- Center note -->
  <text x="380" y="215" text-anchor="middle" font-size="14" fill="#475569">Hammasini bir vaqtda</text>
  <text x="380" y="236" text-anchor="middle" font-size="14" fill="#475569">maksimal qilib bo'lmaydi</text>

  <!-- Model placements -->
  <rect x="290" y="98" width="180" height="34" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="380" y="120" text-anchor="middle" font-size="13" fill="#1e293b">gpt-5.5 · claude-opus-4-8</text>

  <rect x="78" y="290" width="158" height="34" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="157" y="312" text-anchor="middle" font-size="13" fill="#1e293b">gemini-2.5-flash</text>

  <rect x="524" y="290" width="172" height="34" rx="8" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="610" y="312" text-anchor="middle" font-size="13" fill="#1e293b">Groq · llama-3.3-70b</text>

  <!-- Guidance boxes -->
  <rect x="40" y="392" width="340" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="60" y="416" font-size="14" font-weight="700" fill="#166534">Oddiy vazifa</text>
  <text x="60" y="438" font-size="13" fill="#166534">tasnif, qisqa javob -> kichik/arzon model</text>

  <rect x="400" y="392" width="320" height="58" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="420" y="416" font-size="14" font-weight="700" fill="#b45309">Murakkab vazifa</text>
  <text x="420" y="438" font-size="13" fill="#b45309">mulohaza, kod, tahlil -> kuchli model</text>
</svg>
