<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="Segoe UI, system-ui, sans-serif">
  <title>Matn embedding modeliga kirib, sonlar vektori bo'lib chiqadi</title>
  <rect x="0" y="0" width="760" height="320" fill="#f8fafc"/>
  <text x="380" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Matndan vektorga</text>

  <defs>
    <marker id="mv" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- Input text -->
  <rect x="30" y="120" width="180" height="80" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <text x="120" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#0284c7">Matn (kirish)</text>
  <text x="120" y="178" text-anchor="middle" font-size="14" fill="#1e293b">"It bog'da</text>
  <text x="120" y="196" text-anchor="middle" font-size="14" fill="#1e293b">yuguryapti"</text>

  <!-- arrow 1 -->
  <line x1="214" y1="160" x2="285" y2="160" stroke="#4f46e5" stroke-width="3" marker-end="url(#mv)"/>

  <!-- Model -->
  <rect x="290" y="115" width="180" height="90" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="380" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">Embedding</text>
  <text x="380" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">modeli</text>
  <text x="380" y="194" text-anchor="middle" font-size="13" fill="#6366f1">text-embedding-3-small</text>

  <!-- arrow 2 -->
  <line x1="474" y1="160" x2="545" y2="160" stroke="#4f46e5" stroke-width="3" marker-end="url(#mv)"/>

  <!-- Vector output -->
  <rect x="550" y="110" width="185" height="100" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="642" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Vektor (chiqish)</text>
  <text x="642" y="164" text-anchor="middle" font-size="14" font-family="JetBrains Mono, monospace" fill="#1e293b">[0.12, -0.34,</text>
  <text x="642" y="184" text-anchor="middle" font-size="14" font-family="JetBrains Mono, monospace" fill="#1e293b"> 0.88, ...]</text>
  <text x="642" y="203" text-anchor="middle" font-size="13" fill="#16a34a">1536 ta son</text>

  <text x="380" y="258" text-anchor="middle" font-size="14" fill="#475569">Vektor matnning MA'NOSINI sonlarda kodlaydi</text>
  <text x="380" y="284" text-anchor="middle" font-size="13" fill="#64748b">Bir model doim bir xil uzunlikdagi vektor qaytaradi</text>
</svg>
