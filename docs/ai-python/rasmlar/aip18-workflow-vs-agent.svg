<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>Workflow va agent farqi: belgilangan to'g'ri chiziqli oqim va model boshqaradigan halqa</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Workflow va agent: kim yo'lni tanlaydi?</text>

  <defs>
    <marker id="wa-arr" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#0284c7"/>
    </marker>
    <marker id="wa-arr-i" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- divider -->
  <line x1="380" y1="70" x2="380" y2="420" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- ===== LEFT: Workflow ===== -->
  <rect x="30" y="70" width="320" height="40" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="190" y="96" text-anchor="middle" font-size="17" font-weight="700" fill="#0284c7">Workflow — qadamlar oldindan</text>

  <rect x="120" y="135" width="140" height="42" rx="9" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="190" y="161" text-anchor="middle" font-size="14" fill="#1e293b">1-qadam</text>
  <rect x="120" y="205" width="140" height="42" rx="9" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="190" y="231" text-anchor="middle" font-size="14" fill="#1e293b">2-qadam</text>
  <rect x="120" y="275" width="140" height="42" rx="9" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="190" y="301" text-anchor="middle" font-size="14" fill="#1e293b">3-qadam</text>

  <line x1="190" y1="177" x2="190" y2="203" stroke="#0284c7" stroke-width="2.5" marker-end="url(#wa-arr)"/>
  <line x1="190" y1="247" x2="190" y2="273" stroke="#0284c7" stroke-width="2.5" marker-end="url(#wa-arr)"/>

  <text x="190" y="352" text-anchor="middle" font-size="14" font-weight="700" fill="#0284c7">yo'lni DASTURCHI yozadi</text>
  <text x="190" y="378" text-anchor="middle" font-size="13" fill="#64748b">bashoratli · sodda · arzon</text>
  <text x="190" y="398" text-anchor="middle" font-size="13" fill="#64748b">har safar bir xil yo'l</text>

  <!-- ===== RIGHT: Agent ===== -->
  <rect x="410" y="70" width="320" height="40" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="570" y="96" text-anchor="middle" font-size="17" font-weight="700" fill="#4338ca">Agent — model yo'lda tanlaydi</text>

  <!-- central brain -->
  <circle cx="570" cy="225" r="48" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="570" y="221" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">LLM</text>
  <text x="570" y="241" text-anchor="middle" font-size="13" fill="#6366f1">qaror</text>

  <!-- surrounding tools -->
  <rect x="455" y="138" width="98" height="36" rx="9" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="504" y="161" text-anchor="middle" font-size="13" fill="#1e293b">tool A</text>
  <rect x="588" y="138" width="98" height="36" rx="9" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="637" y="161" text-anchor="middle" font-size="13" fill="#1e293b">tool B</text>
  <rect x="455" y="276" width="98" height="36" rx="9" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="504" y="299" text-anchor="middle" font-size="13" fill="#1e293b">tool C</text>
  <rect x="588" y="276" width="98" height="36" rx="9" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="637" y="299" text-anchor="middle" font-size="13" fill="#1e293b">javob</text>

  <line x1="529" y1="186" x2="545" y2="200" stroke="#4f46e5" stroke-width="2" marker-end="url(#wa-arr-i)"/>
  <line x1="611" y1="186" x2="595" y2="200" stroke="#4f46e5" stroke-width="2" marker-end="url(#wa-arr-i)"/>
  <line x1="529" y1="264" x2="545" y2="250" stroke="#4f46e5" stroke-width="2" marker-end="url(#wa-arr-i)"/>
  <line x1="611" y1="264" x2="595" y2="250" stroke="#4f46e5" stroke-width="2" marker-end="url(#wa-arr-i)"/>

  <text x="570" y="352" text-anchor="middle" font-size="14" font-weight="700" fill="#4338ca">yo'lni MODEL tanlaydi</text>
  <text x="570" y="378" text-anchor="middle" font-size="13" fill="#64748b">moslashuvchan · murakkab · qimmat</text>
  <text x="570" y="398" text-anchor="middle" font-size="13" fill="#64748b">yo'l vazifaga qarab o'zgaradi</text>
</svg>
