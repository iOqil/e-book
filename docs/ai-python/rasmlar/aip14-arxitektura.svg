<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>Vektor bazasi arxitekturasi: hujjatlarni embed qilib saqlash va savol bilan qidirish oqimi</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Vektor bazasi: saqlash va qidirish oqimi</text>

  <defs>
    <marker id="a14a" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4f46e5"/>
    </marker>
    <marker id="a14g" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- INDEXING PHASE -->
  <text x="200" y="76" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">1-bosqich: saqlash (bir marta)</text>

  <rect x="40" y="92" width="150" height="58" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="115" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Hujjatlar</text>
  <text x="115" y="138" text-anchor="middle" font-size="13" fill="#64748b">matn bo'laklari</text>

  <line x1="190" y1="121" x2="244" y2="121" stroke="#4f46e5" stroke-width="3" marker-end="url(#a14a)"/>

  <rect x="246" y="92" width="150" height="58" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="321" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#4338ca">Embed model</text>
  <text x="321" y="138" text-anchor="middle" font-size="13" fill="#475569">matn -> vektor</text>

  <line x1="396" y1="121" x2="450" y2="121" stroke="#4f46e5" stroke-width="3" marker-end="url(#a14a)"/>

  <rect x="452" y="86" width="268" height="70" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2.5"/>
  <text x="586" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#0284c7">Vektor bazasi</text>
  <text x="586" y="134" text-anchor="middle" font-size="13" fill="#475569">vektor + matn + metadata</text>

  <!-- divider -->
  <line x1="40" y1="186" x2="720" y2="186" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- QUERY PHASE -->
  <text x="200" y="220" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">2-bosqich: qidirish (har savolda)</text>

  <rect x="40" y="238" width="150" height="58" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="115" y="264" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Savol</text>
  <text x="115" y="284" text-anchor="middle" font-size="13" fill="#64748b">"narx qancha?"</text>

  <line x1="190" y1="267" x2="244" y2="267" stroke="#16a34a" stroke-width="3" marker-end="url(#a14g)"/>

  <rect x="246" y="238" width="150" height="58" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="321" y="264" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Embed model</text>
  <text x="321" y="284" text-anchor="middle" font-size="13" fill="#475569">savol -> vektor</text>

  <line x1="396" y1="267" x2="450" y2="267" stroke="#16a34a" stroke-width="3" marker-end="url(#a14g)"/>

  <rect x="452" y="232" width="268" height="70" rx="12" fill="#dcfce7" stroke="#0284c7" stroke-width="2.5"/>
  <text x="586" y="258" text-anchor="middle" font-size="15" font-weight="700" fill="#0284c7">query(): eng yaqin N ta</text>
  <text x="586" y="280" text-anchor="middle" font-size="13" fill="#475569">tezkor (taxminiy) qidiruv</text>

  <!-- arrow down to result -->
  <line x1="586" y1="302" x2="586" y2="344" stroke="#0284c7" stroke-width="3" marker-end="url(#a14g)"/>

  <rect x="200" y="346" width="360" height="56" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="372" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">Eng mos hujjat bo'laklari</text>
  <text x="380" y="392" text-anchor="middle" font-size="13" fill="#b45309">keyin LLM'ga kontekst sifatida beriladi (RAG)</text>
</svg>
