<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>Zero-shot va few-shot promptlarni taqqoslash: misolsiz va bir nechta misol bilan</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Zero-shot va few-shot</text>

  <!-- Zero-shot -->
  <rect x="36" y="70" width="330" height="320" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="36" y="70" width="330" height="40" rx="14" fill="#f1f5f9"/>
  <text x="201" y="97" text-anchor="middle" font-size="17" font-weight="700" fill="#475569">Zero-shot (misolsiz)</text>
  <text x="56" y="140" font-size="14" fill="#1e293b">Faqat ko'rsatma berasiz,</text>
  <text x="56" y="162" font-size="14" fill="#1e293b">misol yo'q.</text>

  <rect x="56" y="184" width="290" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="70" y="210" font-size="13" font-family="JetBrains Mono, monospace" fill="#4338ca">Vazifa: kayfiyatni aniqla.</text>
  <text x="70" y="236" font-size="13" font-family="JetBrains Mono, monospace" fill="#1e293b">Matn: "Yetkazib berish</text>
  <text x="70" y="256" font-size="13" font-family="JetBrains Mono, monospace" fill="#1e293b">kechikdi."</text>
  <text x="70" y="288" font-size="13" font-family="JetBrains Mono, monospace" fill="#64748b">Javob: ?</text>

  <text x="56" y="334" font-size="14" font-weight="600" fill="#166534">+ Qisqa, oddiy vazifaga yetarli</text>
  <text x="56" y="362" font-size="14" font-weight="600" fill="#b45309">- Format/uslub kafolatsiz</text>

  <!-- Few-shot -->
  <rect x="394" y="70" width="330" height="320" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="394" y="70" width="330" height="40" rx="14" fill="#eef2ff"/>
  <text x="559" y="97" text-anchor="middle" font-size="17" font-weight="700" fill="#4338ca">Few-shot (misol bilan)</text>
  <text x="414" y="140" font-size="14" fill="#1e293b">Ko'rsatma + bir nechta</text>
  <text x="414" y="162" font-size="14" fill="#1e293b">tayyor namuna.</text>

  <rect x="414" y="184" width="290" height="120" rx="10" fill="#f8fafc" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="428" y="208" font-size="13" font-family="JetBrains Mono, monospace" fill="#16a34a">"Zo'r mahsulot!" -> ijobiy</text>
  <text x="428" y="230" font-size="13" font-family="JetBrains Mono, monospace" fill="#dc2626">"Buzuq keldi." -> salbiy</text>
  <text x="428" y="252" font-size="13" font-family="JetBrains Mono, monospace" fill="#64748b">"Oddiy narsa." -> betaraf</text>
  <line x1="428" y1="266" x2="690" y2="266" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="428" y="290" font-size="13" font-family="JetBrains Mono, monospace" fill="#4338ca">"Kechikdi." -> ?</text>

  <text x="414" y="334" font-size="14" font-weight="600" fill="#166534">+ Format/uslubni o'rgatadi</text>
  <text x="414" y="362" font-size="14" font-weight="600" fill="#166534">+ Murakkab/nozik vazifaga zo'r</text>

  <text x="380" y="424" text-anchor="middle" font-size="14" fill="#64748b">Misol — eng kuchli ko'rsatma: "ayt" emas, "ko'rsat"</text>
</svg>
