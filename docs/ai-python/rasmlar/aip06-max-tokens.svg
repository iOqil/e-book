<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" font-family="Segoe UI, system-ui, sans-serif">
  <title>max_tokens chiqishni cheklab, javobni o'rtada kesib qo'yadi va finish_reason length bo'ladi</title>
  <rect x="0" y="0" width="760" height="410" fill="#f8fafc"/>
  <text x="380" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">max_tokens: chiqish chegarasi</text>

  <defs>
    <marker id="ar6m" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Enough box -->
  <rect x="40" y="80" width="320" height="200" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="40" y="80" width="320" height="38" rx="14" fill="#dcfce7"/>
  <text x="200" y="105" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Yetarli limit</text>
  <text x="60" y="146" font-size="14" fill="#1e293b">"Toshkent O'zbekistonning</text>
  <text x="60" y="170" font-size="14" fill="#1e293b">poytaxti va eng yirik</text>
  <text x="60" y="194" font-size="14" fill="#1e293b">shahridir. Aholisi 2.9</text>
  <text x="60" y="218" font-size="14" fill="#1e293b">milliondan ortiq." </text>
  <rect x="60" y="236" width="280" height="30" rx="8" fill="#dcfce7"/>
  <text x="200" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">finish_reason = "stop"</text>

  <!-- Truncated box -->
  <rect x="400" y="80" width="320" height="200" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="400" y="80" width="320" height="38" rx="14" fill="#fee2e2"/>
  <text x="560" y="105" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">max_tokens juda kichik</text>
  <text x="420" y="146" font-size="14" fill="#1e293b">"Toshkent O'zbekistonning</text>
  <text x="420" y="170" font-size="14" fill="#1e293b">poytaxti va eng yir</text>
  <line x1="420" y1="180" x2="700" y2="180" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="560" y="206" text-anchor="middle" font-size="22" font-weight="700" fill="#dc2626">CHIQ KESILDI</text>
  <rect x="420" y="236" width="280" height="30" rx="8" fill="#fee2e2"/>
  <text x="560" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">finish_reason = "length"</text>

  <line x1="362" y1="180" x2="398" y2="180" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar6m)"/>

  <!-- bottom note -->
  <rect x="40" y="312" width="680" height="70" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="60" y="340" font-size="15" font-weight="700" fill="#b45309">Tekshiring:</text>
  <text x="60" y="364" font-size="14" fill="#1e293b">javob.choices[0].finish_reason == "length" bo'lsa, javob tugab qolgan</text>
  <text x="60" y="382" font-size="13" fill="#475569">-> max_tokens'ni oshiring yoki promptda "qisqaroq javob ber" deng.</text>
</svg>
