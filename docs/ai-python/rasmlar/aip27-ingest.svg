<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Segoe UI, system-ui, sans-serif">
  <title>Indekslash quvuri: hujjatlar -> chunk -> embed -> Chroma baza</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">ingest.py — indekslash quvuri</text>

  <defs>
    <marker id="ig27" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- 1 hujjatlar -->
  <rect x="30" y="92" width="148" height="90" rx="12" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="104" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#0284c7">Hujjatlar</text>
  <text x="104" y="148" text-anchor="middle" font-size="13" fill="#475569">hujjatlar/</text>
  <text x="104" y="168" text-anchor="middle" font-size="13" fill="#475569">.md .txt .pdf</text>

  <!-- 2 chunk -->
  <rect x="216" y="92" width="148" height="90" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="290" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">chunk_qil</text>
  <text x="290" y="148" text-anchor="middle" font-size="13" fill="#92400e">~800 belgi</text>
  <text x="290" y="168" text-anchor="middle" font-size="13" fill="#92400e">overlap ~100</text>

  <!-- 3 embed -->
  <rect x="402" y="92" width="148" height="90" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="476" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">embed_qil</text>
  <text x="476" y="148" text-anchor="middle" font-size="13" fill="#475569">har chunk</text>
  <text x="476" y="168" text-anchor="middle" font-size="13" fill="#475569">-> vektor</text>

  <!-- 4 chroma -->
  <rect x="588" y="92" width="148" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="662" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Chroma</text>
  <text x="662" y="148" text-anchor="middle" font-size="13" fill="#166534">doimiy baza</text>
  <text x="662" y="168" text-anchor="middle" font-size="13" fill="#166534">chroma_db/</text>

  <line x1="178" y1="137" x2="212" y2="137" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#ig27)"/>
  <line x1="364" y1="137" x2="398" y2="137" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#ig27)"/>
  <line x1="550" y1="137" x2="584" y2="137" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#ig27)"/>

  <!-- saqlanadigan yozuv -->
  <rect x="150" y="232" width="460" height="130" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="150" y="232" width="460" height="32" rx="14" fill="#dcfce7"/>
  <text x="380" y="254" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Bazaga saqlanadigan har bir yozuv</text>
  <text x="176" y="292" font-size="14" font-family="JetBrains Mono, monospace" fill="#1e293b">vektor:    [0.12, -0.04, ...]   (qidirish kaliti)</text>
  <text x="176" y="318" font-size="14" font-family="JetBrains Mono, monospace" fill="#1e293b">matn:      "chunk asl matni..."  (modelga beriladi)</text>
  <text x="176" y="344" font-size="14" font-family="JetBrains Mono, monospace" fill="#b45309">metadata:  {manba, chunk_raqami}  (citation)</text>

  <line x1="662" y1="182" x2="480" y2="228" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ig27)"/>

  <text x="380" y="394" text-anchor="middle" font-size="14" fill="#475569">Bir marta bajariladi (python ingest.py) -> so'rovga tayyor bilim bazasi</text>
</svg>
