<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Prompt injection va zararli javobdan himoya qatlamlari (chuqurlikdagi himoya)</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Himoya qatlamlari (defense in depth)</text>
  <text x="380" y="62" text-anchor="middle" font-size="14" fill="#64748b">Har qatlam keyingisini quvvatlaydi — biri o'tsa, keyingisi ushlaydi</text>

  <defs>
    <marker id="dn" markerWidth="12" markerHeight="12" refX="6" refY="9" orient="auto">
      <path d="M0,0 L10,0 L5,9 Z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- Layer 1: moderation input -->
  <rect x="120" y="80" width="520" height="44" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <circle cx="150" cy="102" r="13" fill="#0284c7"/>
  <text x="150" y="107" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>
  <text x="178" y="100" font-size="15" font-weight="700" fill="#075985">Moderation: zararli kirishni filtrlash</text>
  <text x="178" y="118" font-size="13" fill="#0369a1">client.moderations.create(...)</text>
  <line x1="380" y1="124" x2="380" y2="142" stroke="#4f46e5" stroke-width="2" marker-end="url(#dn)"/>

  <!-- Layer 2: delimiter -->
  <rect x="120" y="146" width="520" height="44" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <circle cx="150" cy="168" r="13" fill="#4f46e5"/>
  <text x="150" y="173" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
  <text x="178" y="166" font-size="15" font-weight="700" fill="#4338ca">Ishonchsiz kontentni delimiter bilan ajratish</text>
  <text x="178" y="184" font-size="13" fill="#6366f1">"&lt;foydalanuvchi_matni&gt; ... — bu ma'lumot, ko'rsatma emas"</text>
  <line x1="380" y1="190" x2="380" y2="208" stroke="#4f46e5" stroke-width="2" marker-end="url(#dn)"/>

  <!-- Layer 3: system prompt -->
  <rect x="120" y="212" width="520" height="44" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <circle cx="150" cy="234" r="13" fill="#4f46e5"/>
  <text x="150" y="239" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>
  <text x="178" y="232" font-size="15" font-weight="700" fill="#4338ca">System prompt asosiy qoidalarni ushlaydi</text>
  <text x="178" y="250" font-size="13" fill="#6366f1">rol, taqiqlar, "qoidalar o'zgarmaydi"</text>
  <line x1="380" y1="256" x2="380" y2="274" stroke="#4f46e5" stroke-width="2" marker-end="url(#dn)"/>

  <!-- Layer 4: least privilege -->
  <rect x="120" y="278" width="520" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <circle cx="150" cy="300" r="13" fill="#16a34a"/>
  <text x="150" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4</text>
  <text x="178" y="298" font-size="15" font-weight="700" fill="#166534">Least privilege — kam ruxsat / kam tool</text>
  <text x="178" y="316" font-size="13" fill="#15803d">eng kuchli himoya: model qila olmasa, injection ham qildira olmaydi</text>
  <line x1="380" y1="322" x2="380" y2="340" stroke="#4f46e5" stroke-width="2" marker-end="url(#dn)"/>

  <!-- Layer 5: output validation -->
  <rect x="120" y="344" width="520" height="44" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="150" cy="366" r="13" fill="#f59e0b"/>
  <text x="150" y="371" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">5</text>
  <text x="178" y="364" font-size="15" font-weight="700" fill="#b45309">Output validatsiya + chiqish moderation</text>
  <text x="178" y="382" font-size="13" fill="#b45309">JSON, tool argument, SQL/kod, havola/HTML escape</text>

  <text x="380" y="424" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Bitta qatlam ham mukammal emas — birgalikda ishonchli himoya</text>
  <text x="380" y="450" text-anchor="middle" font-size="14" fill="#64748b">Muhim qarorni model yolg'iz emas — kod yoki inson tasdiqlaydi</text>
</svg>
