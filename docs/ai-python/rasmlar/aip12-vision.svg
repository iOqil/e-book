<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" font-family="Segoe UI, system-ui, sans-serif">
  <title>Vision oqimi: rasm va savol content bloklariga joylanib modelga boradi, model tushunib javob qaytaradi</title>
  <rect x="0" y="0" width="760" height="410" fill="#f8fafc"/>
  <text x="380" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Vision: rasm + savol -> javob</text>

  <defs>
    <marker id="vs" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- 1. Foydalanuvchi kirishi -->
  <rect x="30" y="80" width="190" height="150" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <text x="125" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#0284c7">1. Foydalanuvchi</text>
  <rect x="52" y="120" width="146" height="56" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="125" y="153" text-anchor="middle" font-size="14" fill="#0284c7">[rasm fayli]</text>
  <text x="125" y="206" text-anchor="middle" font-size="14" fill="#1e293b">"Rasmda nima bor?"</text>

  <line x1="222" y1="155" x2="288" y2="155" stroke="#4f46e5" stroke-width="3" marker-end="url(#vs)"/>

  <!-- 2. content bloklari -->
  <rect x="292" y="70" width="200" height="180" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="292" y="70" width="200" height="34" rx="14" fill="#eef2ff"/>
  <text x="392" y="93" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">2. content = [bloklar]</text>
  <rect x="310" y="116" width="164" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="320" y="138" font-size="13" font-family="JetBrains Mono, monospace" fill="#1e293b">type: "text",</text>
  <text x="320" y="158" font-size="13" font-family="JetBrains Mono, monospace" fill="#1e293b">text: savol</text>
  <rect x="310" y="178" width="164" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="320" y="200" font-size="13" font-family="JetBrains Mono, monospace" fill="#1e293b">type:"image_url"</text>
  <text x="320" y="222" font-size="13" font-family="JetBrains Mono, monospace" fill="#7c3aed">url: data:.../base64</text>

  <line x1="494" y1="160" x2="560" y2="160" stroke="#4f46e5" stroke-width="3" marker-end="url(#vs)"/>

  <!-- 3. Model -->
  <rect x="564" y="110" width="166" height="100" rx="16" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
  <text x="647" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#4338ca">3. Vision</text>
  <text x="647" y="174" text-anchor="middle" font-size="18" font-weight="700" fill="#4338ca">model</text>
  <text x="647" y="196" text-anchor="middle" font-size="13" fill="#64748b">rasmni tushunadi</text>

  <line x1="647" y1="212" x2="647" y2="288" stroke="#16a34a" stroke-width="3" marker-end="url(#vs)"/>

  <!-- 4. Javob -->
  <rect x="430" y="292" width="300" height="86" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="430" y="292" width="300" height="34" rx="14" fill="#dcfce7"/>
  <text x="580" y="315" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">4. Matnli javob</text>
  <text x="580" y="350" text-anchor="middle" font-size="14" fill="#1e293b">"Rasmda kulrang mushuk..."</text>
  <text x="580" y="370" text-anchor="middle" font-size="13" fill="#64748b">OCR / tavsif / tahlil</text>

  <text x="225" y="330" text-anchor="middle" font-size="15" fill="#475569">content endi satr emas,</text>
  <text x="225" y="354" text-anchor="middle" font-size="15" fill="#475569">balki bloklar ro'yxati</text>
</svg>
