<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Segoe UI, system-ui, sans-serif">
  <title>So'rov xarajati tarkibi: input va output tokenlar alohida narxlanadi</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Bitta so'rov narxi ikki qismdan iborat</text>

  <!-- Input box -->
  <rect x="40" y="78" width="300" height="150" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <rect x="40" y="78" width="300" height="40" rx="14" fill="#e0f2fe"/>
  <text x="190" y="104" text-anchor="middle" font-size="17" font-weight="700" fill="#0284c7">Kirish (input)</text>
  <text x="60" y="146" font-size="14" fill="#475569">Siz yuborgan matn:</text>
  <text x="60" y="170" font-size="14" fill="#1e293b">prompt + suhbat tarixi</text>
  <text x="60" y="192" font-size="14" fill="#1e293b">+ RAG kontekst</text>
  <text x="60" y="216" font-size="14" font-weight="700" fill="#0284c7">arzonroq narx</text>

  <!-- Output box -->
  <rect x="420" y="78" width="300" height="150" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="420" y="78" width="300" height="40" rx="14" fill="#fee2e2"/>
  <text x="570" y="104" text-anchor="middle" font-size="17" font-weight="700" fill="#dc2626">Chiqish (output)</text>
  <text x="440" y="146" font-size="14" fill="#475569">Model qaytargan javob:</text>
  <text x="440" y="170" font-size="14" fill="#1e293b">generatsiya qilingan</text>
  <text x="440" y="192" font-size="14" fill="#1e293b">matn</text>
  <text x="440" y="216" font-size="14" font-weight="700" fill="#dc2626">3-5x QIMMATROQ</text>

  <!-- plus -->
  <text x="380" y="160" text-anchor="middle" font-size="32" font-weight="700" fill="#64748b">+</text>

  <!-- arrows down to total -->
  <defs>
    <marker id="nt" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4f46e5"/>
    </marker>
  </defs>
  <line x1="190" y1="230" x2="320" y2="288" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#nt)"/>
  <line x1="570" y1="230" x2="440" y2="288" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#nt)"/>

  <!-- Total -->
  <rect x="210" y="296" width="340" height="60" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="380" y="322" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">Umumiy narx</text>
  <text x="380" y="345" text-anchor="middle" font-size="14" fill="#1e293b">input_narx + output_narx</text>

  <!-- formula note -->
  <text x="380" y="392" text-anchor="middle" font-size="14" fill="#64748b">narx = (input_tok / 1e6 * input_narx) + (output_tok / 1e6 * output_narx)</text>
  <text x="380" y="414" text-anchor="middle" font-size="13" fill="#475569">Narxlar million token uchun e'lon qilinadi — provayder sahifasini tekshiring</text>
</svg>
