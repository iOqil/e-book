<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Segoe UI, system-ui, sans-serif">
  <title>Matndan Pydantic model orqali validatsiyalangan ishonchli obyektgacha</title>
  <rect x="0" y="0" width="760" height="360" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Pydantic: matn -&gt; validatsiya -&gt; ishonchli obyekt</text>

  <defs>
    <marker id="py-arr" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- 1 model text -->
  <rect x="30" y="120" width="160" height="110" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <rect x="30" y="120" width="160" height="32" rx="12" fill="#e0f2fe"/>
  <text x="110" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#0284c7">1. Model javobi</text>
  <text x="110" y="176" text-anchor="middle" font-size="13" fill="#1e293b">JSON matni</text>
  <text x="110" y="198" text-anchor="middle" font-size="13" fill="#64748b">(oddiy satr,</text>
  <text x="110" y="216" text-anchor="middle" font-size="13" fill="#64748b">hali ishonchsiz)</text>

  <!-- 2 pydantic schema -->
  <rect x="240" y="110" width="170" height="130" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="325" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">2. Pydantic model</text>
  <text x="258" y="166" font-size="13" font-family="JetBrains Mono, monospace" fill="#1e293b">class Mahsulot:</text>
  <text x="258" y="188" font-size="13" font-family="JetBrains Mono, monospace" fill="#7c3aed">  nom: str</text>
  <text x="258" y="210" font-size="13" font-family="JetBrains Mono, monospace" fill="#0284c7">  narx: float</text>
  <text x="258" y="228" font-size="13" font-family="JetBrains Mono, monospace" fill="#16a34a">  joy: str</text>

  <!-- 3 validation -->
  <rect x="460" y="120" width="140" height="110" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <rect x="460" y="120" width="140" height="32" rx="12" fill="#fef3c7"/>
  <text x="530" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">3. Validatsiya</text>
  <text x="530" y="174" text-anchor="middle" font-size="13" fill="#1e293b">tip to'g'rimi?</text>
  <text x="530" y="194" text-anchor="middle" font-size="13" fill="#1e293b">maydon bormi?</text>
  <text x="530" y="216" text-anchor="middle" font-size="13" fill="#64748b">xato -> Error</text>

  <!-- 4 object -->
  <rect x="640" y="120" width="100" height="110" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="690" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">4. Obyekt</text>
  <text x="690" y="184" text-anchor="middle" font-size="13" fill="#166534">.narx</text>
  <text x="690" y="204" text-anchor="middle" font-size="13" fill="#166534">.nom</text>
  <text x="690" y="222" text-anchor="middle" font-size="13" fill="#475569">ishonchli</text>

  <line x1="192" y1="175" x2="236" y2="175" stroke="#4f46e5" stroke-width="3" marker-end="url(#py-arr)"/>
  <line x1="412" y1="175" x2="456" y2="175" stroke="#4f46e5" stroke-width="3" marker-end="url(#py-arr)"/>
  <line x1="602" y1="175" x2="636" y2="175" stroke="#4f46e5" stroke-width="3" marker-end="url(#py-arr)"/>

  <text x="380" y="296" text-anchor="middle" font-size="14" fill="#475569">.parse(...) -&gt; .parsed: model JSON'ni avtomatik tekshirib, tip bilan obyekt qaytaradi</text>
  <text x="380" y="324" text-anchor="middle" font-size="13" fill="#64748b">Maydon yetishmasa yoki tip xato bo'lsa, ValidationError chiqadi — sukutda o'tib ketmaydi</text>
</svg>
