<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Segoe UI, system-ui, sans-serif">
  <title>LLM xizmati arxitekturasi: client -> FastAPI -> LLM provayder -> javob</title>
  <rect x="0" y="0" width="760" height="360" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">LLM logikani REST API ortiga qo'yish</text>

  <defs>
    <marker id="a26r" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#16a34a"/>
    </marker>
    <marker id="a26l" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Clients -->
  <rect x="24" y="120" width="150" height="120" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <text x="99" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#0284c7">Mijozlar</text>
  <text x="99" y="178" text-anchor="middle" font-size="14" fill="#475569">web sayt</text>
  <text x="99" y="200" text-anchor="middle" font-size="14" fill="#475569">mobil ilova</text>
  <text x="99" y="222" text-anchor="middle" font-size="14" fill="#475569">boshqa xizmat</text>

  <!-- FastAPI -->
  <rect x="290" y="100" width="180" height="160" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="380" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">FastAPI xizmati</text>
  <text x="380" y="158" text-anchor="middle" font-size="14" fill="#475569">POST /chat</text>
  <text x="380" y="180" text-anchor="middle" font-size="14" fill="#475569">Pydantic tekshiruv</text>
  <text x="380" y="202" text-anchor="middle" font-size="14" fill="#475569">.env kalit (serverda)</text>
  <text x="380" y="224" text-anchor="middle" font-size="14" fill="#475569">xato -> HTTP status</text>
  <text x="380" y="246" text-anchor="middle" font-size="14" fill="#475569">logging</text>

  <!-- Provider -->
  <rect x="586" y="120" width="150" height="120" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="661" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">LLM provayder</text>
  <text x="661" y="178" text-anchor="middle" font-size="14" fill="#475569">OpenAI / Claude</text>
  <text x="661" y="200" text-anchor="middle" font-size="14" fill="#475569">Gemini / Groq</text>
  <text x="661" y="222" text-anchor="middle" font-size="14" fill="#475569">(API orqali)</text>

  <!-- Arrows client <-> api -->
  <line x1="176" y1="160" x2="286" y2="160" stroke="#16a34a" stroke-width="3" marker-end="url(#a26r)"/>
  <text x="231" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#16a34a">JSON so'rov</text>
  <line x1="286" y1="205" x2="176" y2="205" stroke="#f59e0b" stroke-width="3" marker-end="url(#a26l)"/>
  <text x="231" y="226" text-anchor="middle" font-size="13" font-weight="600" fill="#b45309">JSON javob</text>

  <!-- Arrows api <-> provider -->
  <line x1="472" y1="160" x2="582" y2="160" stroke="#16a34a" stroke-width="3" marker-end="url(#a26r)"/>
  <text x="527" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#16a34a">LLM chaqir</text>
  <line x1="582" y1="205" x2="472" y2="205" stroke="#f59e0b" stroke-width="3" marker-end="url(#a26l)"/>
  <text x="527" y="226" text-anchor="middle" font-size="13" font-weight="600" fill="#b45309">model javobi</text>

  <text x="380" y="312" text-anchor="middle" font-size="15" fill="#64748b">Kalit va LLM logika faqat serverda — mijoz uni hech qachon ko'rmaydi</text>
  <text x="380" y="336" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Skript emas, ko'p mijoz ulanadigan XIZMAT</text>
</svg>
