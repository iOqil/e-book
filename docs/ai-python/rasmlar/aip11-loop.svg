<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Ko'p qadamli while agent-loop: tool -> natija -> tool -> ... -> javob</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Ko'p qadamli agent-loop (qadam limiti bilan)</text>

  <defs>
    <marker id="lp-arr" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4f46e5"/>
    </marker>
    <marker id="lp-arr-g" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#16a34a"/>
    </marker>
    <marker id="lp-arr-y" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- user start -->
  <rect x="290" y="62" width="180" height="44" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="380" y="89" text-anchor="middle" font-size="14" font-weight="700" fill="#0284c7">user savoli</text>
  <line x1="380" y1="106" x2="380" y2="132" stroke="#0ea5e9" stroke-width="2.5" marker-end="url(#lp-arr)"/>

  <!-- model -->
  <rect x="270" y="136" width="220" height="56" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="380" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">Model javob beradi</text>
  <text x="380" y="180" text-anchor="middle" font-size="13" fill="#475569">create(messages, tools)</text>

  <!-- decision -->
  <line x1="380" y1="192" x2="380" y2="216" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#lp-arr)"/>
  <polygon points="380,220 500,266 380,312 260,266" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">tool_calls</text>
  <text x="380" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">bormi?</text>

  <!-- YES branch -> execute -->
  <text x="540" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">HA</text>
  <line x1="500" y1="266" x2="566" y2="266" stroke="#16a34a" stroke-width="2.5" marker-end="url(#lp-arr-g)"/>
  <rect x="570" y="234" width="170" height="64" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="655" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Toollarni bajar</text>
  <text x="655" y="277" text-anchor="middle" font-size="13" fill="#166534">registry -&gt; natija</text>
  <text x="655" y="292" text-anchor="middle" font-size="13" fill="#166534">tarixga qo'shamiz</text>

  <!-- loop back from execute to model -->
  <path d="M655,234 C655,150 560,150 492,158" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#lp-arr-g)"/>
  <text x="600" y="138" text-anchor="middle" font-size="13" fill="#166534">natijalar bilan QAYTA chaqir (sikl)</text>

  <!-- NO branch -> final -->
  <text x="222" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">YO'Q</text>
  <line x1="260" y1="266" x2="194" y2="266" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#lp-arr)"/>
  <rect x="20" y="240" width="170" height="52" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="105" y="264" text-anchor="middle" font-size="14" font-weight="700" fill="#4338ca">Yakuniy matn</text>
  <text x="105" y="283" text-anchor="middle" font-size="13" fill="#475569">loop tugaydi</text>

  <!-- step limit -->
  <rect x="270" y="338" width="220" height="50" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">qadam &lt; maks_qadam ?</text>
  <text x="380" y="380" text-anchor="middle" font-size="13" fill="#92400e">limit cheksiz siklni to'xtatadi</text>
  <line x1="380" y1="312" x2="380" y2="334" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#lp-arr-y)"/>

  <!-- bottom note -->
  <rect x="60" y="408" width="640" height="48" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="380" y="431" text-anchor="middle" font-size="14" font-weight="700" fill="#4338ca">Sikl yadrosi: model -&gt; tool -&gt; natija -&gt; model -&gt; ... -&gt; yakuniy javob</text>
  <text x="380" y="449" text-anchor="middle" font-size="13" fill="#64748b">To'xtash: tool_calls yo'q YOKI qadam limitiga yetildi</text>
</svg>
