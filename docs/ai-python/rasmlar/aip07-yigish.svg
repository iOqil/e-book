<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Segoe UI, system-ui, sans-serif">
  <title>Streaming bo'laklaridan to'liq matnni yig'ish</title>
  <rect x="0" y="0" width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Bo'laklardan to'liq matnni yig'ish</text>

  <defs>
    <marker id="yi-arr" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- Incoming deltas -->
  <text x="40" y="92" font-size="15" font-weight="600" fill="#475569">Kelgan delta bo'laklari (ketma-ket):</text>
  <rect x="40" y="106" width="80" height="40" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="80" y="131" text-anchor="middle" font-size="15" fill="#0284c7">"Sal"</text>
  <rect x="132" y="106" width="80" height="40" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="172" y="131" text-anchor="middle" font-size="15" fill="#0284c7">"om, "</text>
  <rect x="224" y="106" width="100" height="40" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="274" y="131" text-anchor="middle" font-size="15" fill="#0284c7">"dunyo"</text>
  <rect x="336" y="106" width="60" height="40" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="366" y="131" text-anchor="middle" font-size="15" fill="#0284c7">"!"</text>
  <text x="430" y="131" font-size="22" fill="#94a3b8">...</text>

  <!-- Accumulator -->
  <rect x="40" y="190" width="400" height="120" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="40" y="190" width="400" height="38" rx="14" fill="#eef2ff"/>
  <text x="240" y="215" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">yigindi (akkumulyator)</text>
  <text x="60" y="256" font-size="14" font-family="JetBrains Mono, monospace" fill="#1e293b">qismlar = []</text>
  <text x="60" y="280" font-size="14" font-family="JetBrains Mono, monospace" fill="#16a34a">qismlar.append(delta)</text>
  <text x="60" y="300" font-size="13" fill="#64748b">har delta ro'yxatga qo'shiladi</text>

  <!-- Arrow deltas -> accumulator -->
  <line x1="200" y1="150" x2="200" y2="186" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#yi-arr)"/>

  <!-- Join -->
  <rect x="510" y="190" width="220" height="120" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="510" y="190" width="220" height="38" rx="14" fill="#dcfce7"/>
  <text x="620" y="215" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">To'liq matn</text>
  <text x="620" y="256" text-anchor="middle" font-size="14" font-family="JetBrains Mono, monospace" fill="#1e293b">"".join(qismlar)</text>
  <text x="620" y="288" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">"Salom, dunyo!"</text>

  <!-- Arrow accumulator -> join -->
  <line x1="440" y1="250" x2="506" y2="250" stroke="#4f46e5" stroke-width="3" marker-end="url(#yi-arr)"/>

  <text x="380" y="358" text-anchor="middle" font-size="14" fill="#64748b">Oqim tugagach: bo'laklarni birlashtirib butun javobni saqlaysiz (masalan, suhbat tarixiga)</text>
  <text x="380" y="380" text-anchor="middle" font-size="13" fill="#94a3b8">Maslahat: tezlik uchun ro'yxatga yig'ib, oxirida bir marta "".join() qiling</text>
</svg>
