<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Segoe UI, system-ui, sans-serif">
  <title>API stateless: har navbatda butun suhbat tarixi qayta yuboriladi</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">API holatsiz (stateless): tarixni HAR safar siz yuborasiz</text>

  <defs>
    <marker id="st-arr" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- Model box -->
  <rect x="560" y="110" width="170" height="210" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="645" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#4338ca">Model</text>
  <text x="645" y="178" text-anchor="middle" font-size="13" fill="#475569">Hech nimani</text>
  <text x="645" y="198" text-anchor="middle" font-size="13" fill="#475569">yodida</text>
  <text x="645" y="218" text-anchor="middle" font-size="13" fill="#475569">tutmaydi.</text>
  <text x="645" y="252" text-anchor="middle" font-size="13" fill="#64748b">Har so'rovni</text>
  <text x="645" y="272" text-anchor="middle" font-size="13" fill="#64748b">noldan, mustaqil</text>
  <text x="645" y="292" text-anchor="middle" font-size="13" fill="#64748b">ko'radi.</text>

  <!-- Navbat 1 -->
  <rect x="30" y="80" width="320" height="92" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="48" y="106" font-size="14" font-weight="700" fill="#0284c7">1-navbat — yuborilgan messages:</text>
  <text x="48" y="130" font-size="13" fill="#1e293b">user: "Ismim Olim."</text>
  <text x="48" y="156" font-size="13" fill="#16a34a">assistant: "Tanishganimdan xursandman, Olim!"</text>
  <line x1="350" y1="126" x2="556" y2="150" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#st-arr)"/>

  <!-- Navbat 2 -->
  <rect x="30" y="200" width="320" height="118" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="48" y="226" font-size="14" font-weight="700" fill="#0284c7">2-navbat — yuborilgan messages:</text>
  <text x="48" y="250" font-size="13" fill="#94a3b8">user: "Ismim Olim."</text>
  <text x="48" y="272" font-size="13" fill="#94a3b8">assistant: "Tanishganimdan xursandman, Olim!"</text>
  <text x="48" y="296" font-size="13" fill="#1e293b">user: "Ismim nima edi?"</text>
  <line x1="350" y1="258" x2="556" y2="240" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#st-arr)"/>

  <text x="48" y="345" font-size="13" fill="#64748b">Kulrang qatorlar = avvalgi tarix. Uni qayta yubormasangiz,</text>
  <text x="48" y="367" font-size="13" fill="#64748b">model "Ismim nima edi?" savoliga javob bera olmaydi.</text>

  <rect x="380" y="345" width="350" height="60" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="372" font-size="13" font-weight="700" fill="#b45309">"Xotira" — bu sizning kodingizda,</text>
  <text x="400" y="392" font-size="13" fill="#b45309">modelda emas. Tarixni siz to'plab borasiz.</text>
</svg>
