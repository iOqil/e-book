<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Segoe UI, system-ui, sans-serif">
  <title>Agent anatomiyasi: miya (LLM), tool'lar, xotira va loop</title>
  <rect x="0" y="0" width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Agent qismlari</text>

  <!-- Brain / LLM center -->
  <rect x="290" y="150" width="180" height="100" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="380" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#4338ca">Miya (LLM)</text>
  <text x="380" y="216" text-anchor="middle" font-size="14" fill="#475569">qaror qiladi:</text>
  <text x="380" y="236" text-anchor="middle" font-size="14" fill="#475569">qaysi qadam?</text>

  <!-- Tools -->
  <rect x="40" y="170" width="180" height="60" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="130" y="196" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Tool'lar</text>
  <text x="130" y="218" text-anchor="middle" font-size="13" fill="#475569">qidiruv, hisob, API, DB</text>

  <!-- Memory -->
  <rect x="540" y="170" width="180" height="60" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="630" y="196" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">Xotira</text>
  <text x="630" y="218" text-anchor="middle" font-size="13" fill="#475569">messages tarixi</text>

  <!-- Loop -->
  <rect x="250" y="300" width="260" height="56" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="380" y="326" text-anchor="middle" font-size="16" font-weight="700" fill="#0284c7">Loop (sikl)</text>
  <text x="380" y="346" text-anchor="middle" font-size="13" fill="#475569">maqsadga yetguncha takror</text>

  <defs>
    <marker id="ag" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <line x1="288" y1="200" x2="224" y2="200" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
  <line x1="472" y1="200" x2="536" y2="200" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#ag)"/>
  <line x1="380" y1="252" x2="380" y2="298" stroke="#0ea5e9" stroke-width="2.5" marker-end="url(#ag)"/>

  <text x="380" y="392" text-anchor="middle" font-size="14" fill="#64748b">Oddiy LLM chaqiruvidan farqi: agent o'zi qaror qiladi va qadamlarni takrorlaydi</text>
</svg>
