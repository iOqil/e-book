<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="Segoe UI, system-ui, sans-serif">
  <title>Ko'p-navbatli RAG suhbat oqimi: savol + tarix -> standalone -> retrieve -> generate -> javob</title>
  <rect x="0" y="0" width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Suhbat oqimi (har savolda)</text>

  <defs>
    <marker id="ch27a" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4f46e5"/>
    </marker>
    <marker id="ch27g" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- 1 savol + tarix -->
  <rect x="36" y="74" width="200" height="76" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <text x="136" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#0284c7">Yangi savol + tarix</text>
  <text x="136" y="126" text-anchor="middle" font-size="13" fill="#64748b">"Uni qanday</text>
  <text x="136" y="142" text-anchor="middle" font-size="13" fill="#64748b">rasmiylashtiraman?"</text>

  <!-- 2 standalone -->
  <rect x="290" y="74" width="200" height="76" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="390" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">1. Standalone qilish</text>
  <text x="390" y="124" text-anchor="middle" font-size="13" fill="#92400e">"uni" -> "ta'tilni"</text>
  <text x="390" y="142" text-anchor="middle" font-size="13" fill="#92400e">LLM qayta yozadi</text>

  <!-- 3 retrieve -->
  <rect x="544" y="74" width="184" height="76" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="636" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">2. Retrieve</text>
  <text x="636" y="124" text-anchor="middle" font-size="13" fill="#64748b">top-k chunk</text>
  <text x="636" y="142" text-anchor="middle" font-size="13" fill="#64748b">Chroma'dan</text>

  <!-- vektor baza -->
  <rect x="556" y="222" width="160" height="62" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="636" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#4338ca">Chroma baza</text>
  <text x="636" y="269" text-anchor="middle" font-size="13" fill="#64748b">(ingest indeksi)</text>

  <!-- 4 prompt + generate -->
  <rect x="290" y="210" width="200" height="86" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="390" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">3. Prompt + LLM</text>
  <text x="390" y="262" text-anchor="middle" font-size="13" fill="#64748b">kontekst + savol</text>
  <text x="390" y="280" text-anchor="middle" font-size="13" fill="#64748b">-> javob</text>

  <!-- 5 javob -->
  <rect x="36" y="210" width="200" height="86" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="136" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">4. Javob + manba</text>
  <text x="136" y="262" text-anchor="middle" font-size="13" fill="#166534">[1] qollanma.md</text>
  <text x="136" y="280" text-anchor="middle" font-size="13" fill="#166534">foydalanuvchiga</text>

  <!-- tarixga qaytish -->
  <rect x="240" y="356" width="280" height="62" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="382" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">5. Tarixga qo'shish</text>
  <text x="380" y="404" text-anchor="middle" font-size="13" fill="#475569">asl savol + javob -> keyingi navbat</text>

  <!-- arrows -->
  <line x1="236" y1="112" x2="286" y2="112" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#ch27a)"/>
  <line x1="490" y1="112" x2="540" y2="112" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#ch27a)"/>
  <line x1="636" y1="150" x2="636" y2="218" stroke="#6366f1" stroke-width="2.5" marker-end="url(#ch27a)"/>
  <line x1="544" y1="253" x2="494" y2="253" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#ch27a)"/>
  <line x1="290" y1="253" x2="240" y2="253" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ch27g)"/>
  <line x1="136" y1="296" x2="136" y2="380" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ch27g)"/>
  <line x1="136" y1="386" x2="236" y2="386" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ch27g)"/>
  <!-- tarix feeds back to step 1 -->
  <line x1="520" y1="386" x2="640" y2="386" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="640" y1="386" x2="640" y2="160" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>

  <text x="380" y="446" text-anchor="middle" font-size="14" fill="#475569">Tarix -> standalone qilish: "uni" kabi ishorani aniq nom bilan almashtiradi (retrieve aniq ishlaydi)</text>
</svg>
