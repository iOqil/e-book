<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 440" width="770" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>Qaror daraxti: qachon sof kod, qachon freymvork, qachon MCP</title>
  <rect x="0" y="0" width="770" height="440" fill="#f8fafc"/>
  <text x="385" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Qachon nima ishlatish kerak?</text>

  <defs>
    <marker id="qc" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- root -->
  <rect x="285" y="64" width="200" height="56" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="385" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">Vazifa qanday?</text>
  <text x="385" y="108" text-anchor="middle" font-size="13" fill="#475569">avval o'zingdan so'ra</text>

  <!-- Q1: learning / control -->
  <rect x="40" y="170" width="210" height="120" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <text x="145" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#0369a1">Sof SDK / kod</text>
  <text x="145" y="222" text-anchor="middle" font-size="13" fill="#475569">o'rganyapsan, to'liq</text>
  <text x="145" y="240" text-anchor="middle" font-size="13" fill="#475569">nazorat kerak, mantiq</text>
  <text x="145" y="258" text-anchor="middle" font-size="13" fill="#475569">oddiy yoki maxsus;</text>
  <text x="145" y="278" text-anchor="middle" font-size="13" font-weight="600" fill="#0369a1">debug oson, lock-in yo'q</text>

  <!-- Q2: framework -->
  <rect x="280" y="170" width="210" height="120" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="385" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">Freymvork</text>
  <text x="385" y="222" text-anchor="middle" font-size="13" fill="#475569">tez prototip kerak,</text>
  <text x="385" y="240" text-anchor="middle" font-size="13" fill="#475569">tayyor RAG/integratsiya,</text>
  <text x="385" y="258" text-anchor="middle" font-size="13" fill="#475569">standart naqsh;</text>
  <text x="385" y="278" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">qora quti, versiya tavakkali</text>

  <!-- Q3: MCP -->
  <rect x="520" y="170" width="210" height="120" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="625" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">MCP</text>
  <text x="625" y="222" text-anchor="middle" font-size="13" fill="#475569">bitta tool/manbani ko'p</text>
  <text x="625" y="240" text-anchor="middle" font-size="13" fill="#475569">ilovaga ulash kerak,</text>
  <text x="625" y="258" text-anchor="middle" font-size="13" fill="#475569">qayta ishlatiladigan;</text>
  <text x="625" y="278" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">standart, bir marta yoz</text>

  <!-- arrows -->
  <line x1="320" y1="120" x2="170" y2="168" stroke="#64748b" stroke-width="2.5" marker-end="url(#qc)"/>
  <line x1="385" y1="122" x2="385" y2="168" stroke="#64748b" stroke-width="2.5" marker-end="url(#qc)"/>
  <line x1="450" y1="120" x2="600" y2="168" stroke="#64748b" stroke-width="2.5" marker-end="url(#qc)"/>

  <!-- bottom note -->
  <rect x="90" y="330" width="590" height="78" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="385" y="360" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">Oltin qoida</text>
  <text x="385" y="384" text-anchor="middle" font-size="14" fill="#1e293b">Avval sof kod bilan TUSHUN — keyin freymvork yoki MCP bilan tezlash.</text>
  <text x="385" y="402" text-anchor="middle" font-size="13" fill="#64748b">Ular bir-birini istisno qilmaydi: ko'pincha aralash ishlatiladi.</text>
</svg>
