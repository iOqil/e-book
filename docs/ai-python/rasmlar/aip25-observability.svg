<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Segoe UI, system-ui, sans-serif">
  <title>Kuzatuv quvuri: so'rov, strukturali log va tahlil</title>
  <rect x="0" y="0" width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Kuzatuv quvuri: log -> tahlil</text>

  <defs>
    <marker id="ob" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- So'rov -->
  <rect x="30" y="120" width="150" height="90" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <text x="105" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#0284c7">So'rov</text>
  <text x="105" y="182" text-anchor="middle" font-size="13" fill="#475569">foydalanuvchi</text>
  <text x="105" y="200" text-anchor="middle" font-size="13" fill="#475569">savoli</text>

  <line x1="182" y1="165" x2="226" y2="165" stroke="#4f46e5" stroke-width="3" marker-end="url(#ob)"/>

  <!-- Logger o'rab beruvchi + LLM -->
  <rect x="230" y="95" width="190" height="140" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="325" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">O'ralgan LLM chaqiruvi</text>
  <rect x="252" y="138" width="146" height="44" rx="9" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="325" y="166" text-anchor="middle" font-size="14" fill="#1e293b">client.chat...create()</text>
  <text x="325" y="208" text-anchor="middle" font-size="13" fill="#475569">vaqt + token o'lchanadi</text>

  <line x1="422" y1="165" x2="466" y2="165" stroke="#4f46e5" stroke-width="3" marker-end="url(#ob)"/>

  <!-- Strukturali JSON log -->
  <rect x="470" y="80" width="260" height="170" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="470" y="80" width="260" height="34" rx="12" fill="#dcfce7"/>
  <text x="600" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Strukturali JSON yozuv</text>
  <text x="488" y="138" font-size="13" font-family="JetBrains Mono, monospace" fill="#1e293b">"model": "gpt-5.4-mini"</text>
  <text x="488" y="160" font-size="13" font-family="JetBrains Mono, monospace" fill="#1e293b">"prompt_hash": "a1b2c3.."</text>
  <text x="488" y="182" font-size="13" font-family="JetBrains Mono, monospace" fill="#b45309">"latency_ms": 561</text>
  <text x="488" y="204" font-size="13" font-family="JetBrains Mono, monospace" fill="#0284c7">"tokens": 84</text>
  <text x="488" y="226" font-size="13" font-family="JetBrains Mono, monospace" fill="#16a34a">"narx_usd": 0.00004</text>

  <!-- Strelka pastga tahlilga -->
  <line x1="600" y1="252" x2="600" y2="296" stroke="#4f46e5" stroke-width="3" marker-end="url(#ob)"/>

  <!-- Tahlil -->
  <rect x="190" y="300" width="540" height="78" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="460" y="328" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">Jamlash va tahlil</text>
  <text x="460" y="356" text-anchor="middle" font-size="14" fill="#1e293b">o'rtacha / p95 latency  -  kunlik xarajat  -  xato darajasi</text>

  <!-- maxfiyni saqlama eslatma -->
  <rect x="30" y="300" width="140" height="78" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="100" y="332" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">Maxfiyni</text>
  <text x="100" y="354" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">logga yozma</text>
</svg>
