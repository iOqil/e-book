<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Segoe UI, system-ui, sans-serif">
  <title>Mas'uliyat ajratilgan: model AYTADI (niyat), kod BAJARADI (ijro)</title>
  <rect x="0" y="0" width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Model AYTADI, kod BAJARADI</text>

  <defs>
    <marker id="kb" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#16a34a"/>
    </marker>
    <marker id="kb2" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- MODEL box -->
  <rect x="40" y="80" width="300" height="230" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="40" y="80" width="300" height="42" rx="14" fill="#4f46e5"/>
  <text x="190" y="108" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">MODEL — faqat AYTADI</text>
  <text x="190" y="156" text-anchor="middle" font-size="15" fill="#1e293b">niyatini bildiradi:</text>
  <rect x="66" y="176" width="248" height="58" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="190" y="202" text-anchor="middle" font-size="14" font-family="JetBrains Mono, monospace" fill="#4338ca">ob_havo(</text>
  <text x="190" y="222" text-anchor="middle" font-size="14" font-family="JetBrains Mono, monospace" fill="#4338ca">shahar="Toshkent")</text>
  <text x="190" y="266" text-anchor="middle" font-size="14" fill="#dc2626">kod ishga tushira OLMAYDI</text>
  <text x="190" y="290" text-anchor="middle" font-size="14" fill="#475569">bazaga, internetga kira olmaydi</text>

  <!-- CODE box -->
  <rect x="420" y="80" width="300" height="230" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <rect x="420" y="80" width="300" height="42" rx="14" fill="#16a34a"/>
  <text x="570" y="108" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">KOD (SIZ) — BAJARADI</text>
  <text x="570" y="156" text-anchor="middle" font-size="15" fill="#1e293b">funksiyani haqiqatda chaqiradi:</text>
  <rect x="446" y="176" width="248" height="58" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="570" y="202" text-anchor="middle" font-size="14" font-family="JetBrains Mono, monospace" fill="#166534">natija = ob_havo(</text>
  <text x="570" y="222" text-anchor="middle" font-size="14" font-family="JetBrains Mono, monospace" fill="#166534">shahar="Toshkent")</text>
  <text x="570" y="266" text-anchor="middle" font-size="14" fill="#166534">API, baza, kalkulyatorga kiradi</text>
  <text x="570" y="290" text-anchor="middle" font-size="14" fill="#475569">nazorat va xavfsizlik sizda</text>

  <!-- arrows between -->
  <line x1="342" y1="170" x2="418" y2="170" stroke="#16a34a" stroke-width="3" marker-end="url(#kb)"/>
  <text x="380" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#16a34a">niyat</text>
  <line x1="418" y1="235" x2="342" y2="235" stroke="#f59e0b" stroke-width="3" marker-end="url(#kb2)"/>
  <text x="380" y="252" text-anchor="middle" font-size="13" font-weight="600" fill="#b45309">natija</text>

  <text x="380" y="354" text-anchor="middle" font-size="15" fill="#64748b">Model — buyruq beruvchi rahbar; kod — buyruqni bajaruvchi yordamchi</text>
  <text x="380" y="380" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Shu ajratish nazoratni SIZNING qo'lingizda qoldiradi</text>
</svg>
