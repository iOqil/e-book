<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Segoe UI, system-ui, sans-serif">
  <title>Vazifa turiga qarab tavsiya etilgan generatsiya parametrlari jadvali</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Qaysi vazifaga qaysi sozlama</text>

  <!-- header -->
  <rect x="30" y="64" width="340" height="44" fill="#4f46e5"/>
  <rect x="370" y="64" width="180" height="44" fill="#4f46e5"/>
  <rect x="550" y="64" width="180" height="44" fill="#4f46e5"/>
  <text x="48" y="92" font-size="15" font-weight="700" fill="#ffffff">Vazifa</text>
  <text x="460" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">temperature</text>
  <text x="640" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">max_tokens</text>

  <!-- row 1 -->
  <rect x="30" y="108" width="700" height="46" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="48" y="130" font-size="14" font-weight="700" fill="#1e293b">Faktik savol-javob</text>
  <text x="48" y="148" font-size="13" fill="#64748b">aniqlik muhim</text>
  <text x="460" y="137" text-anchor="middle" font-size="14" font-weight="700" fill="#0284c7">0.0 - 0.3</text>
  <text x="640" y="137" text-anchor="middle" font-size="14" fill="#475569">o'rta</text>

  <!-- row 2 -->
  <rect x="30" y="154" width="700" height="46" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="48" y="176" font-size="14" font-weight="700" fill="#1e293b">JSON / strukturali natija</text>
  <text x="48" y="194" font-size="13" fill="#64748b">tasnif, ma'lumot ajratish</text>
  <text x="460" y="183" text-anchor="middle" font-size="14" font-weight="700" fill="#0284c7">0.0</text>
  <text x="640" y="183" text-anchor="middle" font-size="14" fill="#475569">kichik-o'rta</text>

  <!-- row 3 -->
  <rect x="30" y="200" width="700" height="46" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="48" y="222" font-size="14" font-weight="700" fill="#1e293b">Kod yozish</text>
  <text x="48" y="240" font-size="13" fill="#64748b">aniq, ishlaydigan kod</text>
  <text x="460" y="229" text-anchor="middle" font-size="14" font-weight="700" fill="#0284c7">0.0 - 0.4</text>
  <text x="640" y="229" text-anchor="middle" font-size="14" fill="#475569">katta</text>

  <!-- row 4 -->
  <rect x="30" y="246" width="700" height="46" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="48" y="268" font-size="14" font-weight="700" fill="#1e293b">Suhbat / chatbot</text>
  <text x="48" y="286" font-size="13" fill="#64748b">tabiiy, jonli ohang</text>
  <text x="460" y="275" text-anchor="middle" font-size="14" font-weight="700" fill="#6366f1">0.5 - 0.7</text>
  <text x="640" y="275" text-anchor="middle" font-size="14" fill="#475569">o'rta</text>

  <!-- row 5 -->
  <rect x="30" y="292" width="700" height="46" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="48" y="314" font-size="14" font-weight="700" fill="#1e293b">Ijodiy yozuv / g'oyalar</text>
  <text x="48" y="332" font-size="13" fill="#64748b">hikoya, reklama, brainstorm</text>
  <text x="460" y="321" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">0.8 - 1.2</text>
  <text x="640" y="321" text-anchor="middle" font-size="14" fill="#475569">katta</text>

  <!-- note -->
  <rect x="30" y="354" width="700" height="58" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="48" y="380" font-size="14" font-weight="700" fill="#4338ca">Qoida:</text>
  <text x="110" y="380" font-size="14" fill="#1e293b">aniqlik kerakmi -> past; ijod kerakmi -> yuqori.</text>
  <text x="48" y="402" font-size="13" fill="#475569">temperature va top_p ni birga aralashtirmang. Bittasini o'zgartiring.</text>
</svg>
