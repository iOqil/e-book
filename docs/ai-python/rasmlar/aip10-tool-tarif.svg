<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>Tool ta'rifining anatomiyasi: name, description va parameters (JSON schema)</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Tool ta'rifining anatomiyasi</text>

  <!-- main code box -->
  <rect x="40" y="64" width="430" height="344" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="40" y="64" width="430" height="38" rx="14" fill="#eef2ff"/>
  <text x="255" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">tools = [ { ... } ]</text>

  <text x="60" y="134" font-size="14" font-family="JetBrains Mono, monospace" fill="#64748b">"type": "function",</text>
  <text x="60" y="160" font-size="14" font-family="JetBrains Mono, monospace" fill="#64748b">"function": {</text>

  <text x="76" y="190" font-size="14" font-family="JetBrains Mono, monospace" fill="#7c3aed">"name": "ob_havo",</text>
  <text x="76" y="222" font-size="14" font-family="JetBrains Mono, monospace" fill="#0284c7">"description": "joriy</text>
  <text x="76" y="242" font-size="14" font-family="JetBrains Mono, monospace" fill="#0284c7">  ob-havoni qaytaradi",</text>
  <text x="76" y="274" font-size="14" font-family="JetBrains Mono, monospace" fill="#16a34a">"parameters": {</text>
  <text x="92" y="298" font-size="14" font-family="JetBrains Mono, monospace" fill="#475569">"type": "object",</text>
  <text x="92" y="320" font-size="14" font-family="JetBrains Mono, monospace" fill="#475569">"properties": {</text>
  <text x="108" y="342" font-size="13" font-family="JetBrains Mono, monospace" fill="#475569">"shahar": {"type":"string"}</text>
  <text x="92" y="364" font-size="14" font-family="JetBrains Mono, monospace" fill="#475569">},</text>
  <text x="92" y="386" font-size="14" font-family="JetBrains Mono, monospace" fill="#b45309">"required": ["shahar"]</text>

  <defs>
    <marker id="tt" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- callout: name -->
  <line x1="290" y1="186" x2="540" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#tt)"/>
  <rect x="540" y="138" width="190" height="48" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="635" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#7c3aed">name</text>
  <text x="635" y="178" text-anchor="middle" font-size="13" fill="#475569">funksiya nomi</text>

  <!-- callout: description -->
  <line x1="320" y1="232" x2="540" y2="232" stroke="#94a3b8" stroke-width="2" marker-end="url(#tt)"/>
  <rect x="540" y="200" width="190" height="64" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="635" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#0284c7">description</text>
  <text x="635" y="242" text-anchor="middle" font-size="13" fill="#475569">model qachon</text>
  <text x="635" y="258" text-anchor="middle" font-size="13" fill="#475569">ishlatishni biladi</text>

  <!-- callout: parameters -->
  <line x1="290" y1="320" x2="540" y2="320" stroke="#94a3b8" stroke-width="2" marker-end="url(#tt)"/>
  <rect x="540" y="288" width="190" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="635" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">parameters</text>
  <text x="635" y="332" text-anchor="middle" font-size="13" fill="#475569">argumentlar =</text>
  <text x="635" y="350" text-anchor="middle" font-size="13" fill="#475569">JSON schema</text>

  <text x="380" y="428" text-anchor="middle" font-size="14" fill="#64748b">Model funksiya KODINI ko'rmaydi — faqat shu ta'rifni o'qiydi</text>
</svg>
