<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Segoe UI, system-ui, sans-serif">
  <title>Audio transkripsiya quvuri: ovozli fayl Whisper orqali matnga aylanadi va keyin ishlatiladi</title>
  <rect x="0" y="0" width="760" height="360" fill="#f8fafc"/>
  <text x="380" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Audio transkripsiya quvuri</text>

  <defs>
    <marker id="au" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- 1. Ovozli fayl -->
  <rect x="24" y="110" width="170" height="110" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="109" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Ovozli fayl</text>
  <text x="109" y="162" text-anchor="middle" font-size="14" fill="#475569">mp3 / wav / m4a</text>
  <!-- to'lqin belgisi -->
  <polyline points="44,192 56,178 68,200 80,172 92,200 104,180 116,196 128,176 140,200 152,184 164,194 174,188"
            fill="none" stroke="#16a34a" stroke-width="2.5"/>

  <line x1="196" y1="165" x2="260" y2="165" stroke="#4f46e5" stroke-width="3" marker-end="url(#au)"/>

  <!-- 2. Whisper -->
  <rect x="264" y="110" width="200" height="110" rx="14" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
  <text x="364" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">audio.transcriptions</text>
  <text x="364" y="163" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">.create(whisper)</text>
  <text x="364" y="195" text-anchor="middle" font-size="13" fill="#64748b">nutqni eshitib yozadi</text>

  <line x1="466" y1="165" x2="530" y2="165" stroke="#4f46e5" stroke-width="3" marker-end="url(#au)"/>

  <!-- 3. Matn -->
  <rect x="534" y="110" width="200" height="110" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <rect x="534" y="110" width="200" height="34" rx="14" fill="#e0f2fe"/>
  <text x="634" y="133" text-anchor="middle" font-size="16" font-weight="700" fill="#0284c7">Matn</text>
  <text x="634" y="170" text-anchor="middle" font-size="14" fill="#1e293b">natija.text</text>
  <text x="634" y="196" text-anchor="middle" font-size="13" fill="#64748b">"Salom, bu xabar..."</text>

  <!-- Keyingi qadam -->
  <line x1="634" y1="222" x2="634" y2="266" stroke="#4f46e5" stroke-width="3" marker-end="url(#au)"/>
  <rect x="470" y="270" width="280" height="62" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="610" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">Keyin: matn bilan ishlash</text>
  <text x="610" y="318" text-anchor="middle" font-size="14" fill="#475569">xulosa · qidiruv · javob</text>

  <text x="240" y="300" text-anchor="middle" font-size="14" fill="#475569">Ilovangiz endi</text>
  <text x="240" y="322" text-anchor="middle" font-size="14" fill="#475569">"eshita oladi"</text>
</svg>
