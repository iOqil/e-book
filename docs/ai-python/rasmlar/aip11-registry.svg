<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Segoe UI, system-ui, sans-serif">
  <title>Bir nechta tool, registry lug'ati va model tanlovi</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Ko'p tool: model tanlaydi, registry bog'laydi</text>

  <defs>
    <marker id="rg-arr" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4f46e5"/>
    </marker>
    <marker id="rg-arr-g" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Model -->
  <rect x="40" y="150" width="170" height="110" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="125" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#4338ca">Model</text>
  <text x="125" y="216" text-anchor="middle" font-size="13" fill="#475569">so'rovga qarab</text>
  <text x="125" y="236" text-anchor="middle" font-size="13" fill="#475569">tool(lar)ni tanlaydi</text>

  <!-- tools list given to model -->
  <text x="370" y="80" text-anchor="middle" font-size="14" fill="#64748b">tools = [ ... ] (modelga beriladi: nom + description)</text>

  <!-- tool descriptors -->
  <rect x="270" y="100" width="210" height="48" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="285" y="122" font-size="14" font-weight="700" fill="#0284c7">ob_havo</text>
  <text x="285" y="140" font-size="13" fill="#475569">"shahar ob-havosini qaytaradi"</text>

  <rect x="270" y="160" width="210" height="48" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="285" y="182" font-size="14" font-weight="700" fill="#0284c7">valyuta_aylantir</text>
  <text x="285" y="200" font-size="13" fill="#475569">"summani aylantiradi"</text>

  <rect x="270" y="220" width="210" height="48" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="285" y="242" font-size="14" font-weight="700" fill="#0284c7">joriy_vaqt</text>
  <text x="285" y="260" font-size="13" fill="#475569">"sana va vaqtni qaytaradi"</text>

  <!-- model -> descriptors -->
  <line x1="210" y1="180" x2="266" y2="135" stroke="#4f46e5" stroke-width="2" marker-end="url(#rg-arr)"/>
  <line x1="210" y1="205" x2="266" y2="184" stroke="#4f46e5" stroke-width="2" marker-end="url(#rg-arr)"/>
  <line x1="210" y1="230" x2="266" y2="240" stroke="#4f46e5" stroke-width="2" marker-end="url(#rg-arr)"/>

  <!-- REGISTRY -->
  <rect x="540" y="96" width="190" height="180" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="540" y="96" width="190" height="36" rx="14" fill="#dcfce7"/>
  <text x="635" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">REGISTRY (lug'at)</text>
  <text x="556" y="156" font-size="13" font-family="JetBrains Mono, monospace" fill="#1e293b">"ob_havo":</text>
  <text x="565" y="174" font-size="13" font-family="JetBrains Mono, monospace" fill="#166534">  -&gt; funksiya</text>
  <text x="556" y="200" font-size="13" font-family="JetBrains Mono, monospace" fill="#1e293b">"valyuta_aylantir":</text>
  <text x="565" y="218" font-size="13" font-family="JetBrains Mono, monospace" fill="#166534">  -&gt; funksiya</text>
  <text x="556" y="244" font-size="13" font-family="JetBrains Mono, monospace" fill="#1e293b">"joriy_vaqt":</text>
  <text x="565" y="262" font-size="13" font-family="JetBrains Mono, monospace" fill="#166534">  -&gt; funksiya</text>

  <!-- descriptor names -> registry -->
  <line x1="480" y1="124" x2="536" y2="150" stroke="#16a34a" stroke-width="2" marker-end="url(#rg-arr-g)"/>
  <line x1="480" y1="184" x2="536" y2="194" stroke="#16a34a" stroke-width="2" marker-end="url(#rg-arr-g)"/>
  <line x1="480" y1="244" x2="536" y2="238" stroke="#16a34a" stroke-width="2" marker-end="url(#rg-arr-g)"/>

  <text x="510" y="306" text-anchor="middle" font-size="13" fill="#64748b">model NOM qaytaradi</text>

  <!-- bottom explainer -->
  <rect x="60" y="330" width="640" height="74" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="358" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">Model faqat nom + description'ni ko'radi — kodni emas</text>
  <text x="380" y="382" text-anchor="middle" font-size="13" fill="#92400e">Tanlovni tavsifga qarab qiladi. Registry esa NOM'ni haqiqiy funksiyaga ulaydi.</text>
</svg>
