<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Ko'p tool orkestratsiyasi: model har qadamda qaysi toolni qachon chaqirishni o'zi hal qiladi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Ko'p tool orkestratsiyasi: yo'lni model tanlaydi</text>

  <defs>
    <marker id="a28o-i" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4f46e5"/>
    </marker>
    <marker id="a28o-g" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- vazifa -->
  <rect x="280" y="58" width="200" height="46" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="380" y="79" text-anchor="middle" font-size="14" font-weight="700" fill="#0284c7">Foydalanuvchi vazifasi</text>
  <text x="380" y="97" text-anchor="middle" font-size="13" fill="#475569">murakkab, ko'p qadamli</text>
  <line x1="380" y1="104" x2="380" y2="128" stroke="#0ea5e9" stroke-width="2.5" marker-end="url(#a28o-i)"/>

  <!-- model dirijyor -->
  <rect x="250" y="132" width="260" height="64" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="380" y="158" text-anchor="middle" font-size="17" font-weight="700" fill="#4338ca">Model — dirijyor</text>
  <text x="380" y="180" text-anchor="middle" font-size="13" fill="#475569">qaysi tool, qaysi tartibda? — O'ZI hal qiladi</text>

  <!-- three tool boxes -->
  <!-- tool A -->
  <rect x="40" y="252" width="200" height="60" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">hujjat_qidir</text>
  <text x="140" y="296" text-anchor="middle" font-size="13" fill="#166534">ichki ma'lumot (RAG)</text>
  <!-- tool B -->
  <rect x="280" y="252" width="200" height="60" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">kalkulyator</text>
  <text x="380" y="296" text-anchor="middle" font-size="13" fill="#166534">aniq hisob-kitob</text>
  <!-- tool C -->
  <rect x="520" y="252" width="200" height="60" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">fayl_yoz</text>
  <text x="620" y="296" text-anchor="middle" font-size="13" fill="#166534">natijani saqlash</text>

  <!-- arrows model -> tools (numbered order) -->
  <line x1="320" y1="196" x2="160" y2="250" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a28o-g)"/>
  <circle cx="232" cy="218" r="13" fill="#16a34a"/>
  <text x="232" y="223" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <line x1="380" y1="196" x2="380" y2="250" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a28o-g)"/>
  <circle cx="404" cy="222" r="13" fill="#16a34a"/>
  <text x="404" y="227" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <line x1="440" y1="196" x2="600" y2="250" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a28o-g)"/>
  <circle cx="528" cy="218" r="13" fill="#16a34a"/>
  <text x="528" y="223" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>

  <!-- results back to memory/model -->
  <path d="M140,312 C140,360 360,360 376,338" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M380,312 C380,344 380,344 380,338" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M620,312 C620,360 400,360 384,338" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="300" y="330" width="160" height="34" rx="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="380" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#0284c7">natija -> xotira -> model</text>

  <!-- final -->
  <rect x="250" y="392" width="260" height="50" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="380" y="416" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">Yetarli bo'lganda: yakuniy hisobot</text>
  <text x="380" y="434" text-anchor="middle" font-size="13" fill="#64748b">tool_calls yo'q -> loop to'xtaydi</text>
  <line x1="380" y1="364" x2="380" y2="390" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#a28o-i)"/>

  <text x="160" y="240" text-anchor="middle" font-size="13" fill="#166534">tartib oldindan emas, yo'lda tug'iladi</text>
</svg>
