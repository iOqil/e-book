<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>ReAct sikli: Reason, Act, Observe takrorlanadi va maqsadga yetganda Final javob qaytadi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">ReAct sikli: Reason -> Act -> Observe -> takror</text>

  <defs>
    <marker id="ra-arr" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4f46e5"/>
    </marker>
    <marker id="ra-arr-g" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Reason -->
  <rect x="290" y="75" width="180" height="74" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="380" y="105" text-anchor="middle" font-size="18" font-weight="700" fill="#4338ca">1. Reason</text>
  <text x="380" y="128" text-anchor="middle" font-size="14" fill="#475569">model fikrlaydi:</text>
  <text x="380" y="145" text-anchor="middle" font-size="13" fill="#64748b">"endi nima qilay?"</text>

  <!-- Act -->
  <rect x="500" y="205" width="190" height="74" rx="14" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2.5"/>
  <text x="595" y="235" text-anchor="middle" font-size="18" font-weight="700" fill="#0284c7">2. Act</text>
  <text x="595" y="258" text-anchor="middle" font-size="14" fill="#475569">tool ishlatadi:</text>
  <text x="595" y="275" text-anchor="middle" font-size="13" fill="#64748b">ob_havo("Toshkent")</text>

  <!-- Observe -->
  <rect x="70" y="205" width="190" height="74" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="165" y="235" text-anchor="middle" font-size="18" font-weight="700" fill="#b45309">3. Observe</text>
  <text x="165" y="258" text-anchor="middle" font-size="14" fill="#475569">natijani ko'radi:</text>
  <text x="165" y="275" text-anchor="middle" font-size="13" fill="#92610a">{"harorat": 29}</text>

  <!-- cycle arrows -->
  <path d="M470,128 C545,150 575,175 588,200" fill="none" stroke="#4f46e5" stroke-width="3" marker-end="url(#ra-arr)"/>
  <path d="M500,255 C385,300 270,290 230,282" fill="none" stroke="#4f46e5" stroke-width="3" marker-end="url(#ra-arr)"/>
  <path d="M165,203 C172,175 210,150 288,128" fill="none" stroke="#4f46e5" stroke-width="3" marker-end="url(#ra-arr)"/>

  <text x="380" y="245" text-anchor="middle" font-size="15" font-weight="700" fill="#6366f1">takror</text>
  <text x="380" y="266" text-anchor="middle" font-size="13" fill="#94a3b8">maqsadga</text>
  <text x="380" y="283" text-anchor="middle" font-size="13" fill="#94a3b8">yetguncha</text>

  <!-- exit to Final -->
  <line x1="380" y1="149" x2="380" y2="360" stroke="#16a34a" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ra-arr-g)"/>
  <text x="398" y="335" font-size="13" fill="#166534">model "tugadi" desa</text>

  <rect x="225" y="365" width="310" height="70" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="380" y="395" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">Final — yakuniy javob</text>
  <text x="380" y="419" text-anchor="middle" font-size="13" fill="#166534">tool kerak emas: sikldan chiqadi</text>
</svg>
