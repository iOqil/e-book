<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>Tool calling to'rt qadamli sikli: so'rov, tool_calls, bajarish, yakuniy javob</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Tool calling: to'rt qadamli sikl</text>

  <defs>
    <marker id="ts" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4f46e5"/>
    </marker>
    <marker id="tsg" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- KOD column -->
  <text x="160" y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">Sizning kodingiz</text>
  <!-- MODEL column -->
  <text x="600" y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Model (LLM)</text>

  <!-- Step 1: request -->
  <rect x="36" y="96" width="248" height="62" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="56" y="124" font-size="15" font-weight="700" fill="#4f46e5">1. So'rov</text>
  <text x="56" y="146" font-size="13" fill="#475569">savol + tool ro'yxati</text>
  <line x1="286" y1="127" x2="474" y2="127" stroke="#4f46e5" stroke-width="3" marker-end="url(#ts)"/>

  <!-- Step 2: tool_calls -->
  <rect x="476" y="96" width="248" height="62" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="496" y="124" font-size="15" font-weight="700" fill="#4338ca">2. tool_calls</text>
  <text x="496" y="146" font-size="13" fill="#475569">"ob_havo(shahar='...') chaqir"</text>
  <line x1="474" y1="200" x2="286" y2="200" stroke="#16a34a" stroke-width="3" marker-end="url(#tsg)"/>

  <!-- Step 3: execute -->
  <rect x="36" y="180" width="248" height="78" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="56" y="208" font-size="15" font-weight="700" fill="#166534">3. Bajarish</text>
  <text x="56" y="230" font-size="13" fill="#475569">funksiyani BIZ chaqiramiz,</text>
  <text x="56" y="248" font-size="13" fill="#475569">role:"tool" natija qaytaramiz</text>
  <line x1="286" y1="231" x2="474" y2="231" stroke="#4f46e5" stroke-width="3" marker-end="url(#ts)"/>

  <!-- Step 4: final answer -->
  <rect x="476" y="180" width="248" height="78" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="496" y="208" font-size="15" font-weight="700" fill="#166534">4. Yakuniy javob</text>
  <text x="496" y="230" font-size="13" fill="#475569">model natijani ko'rib</text>
  <text x="496" y="248" font-size="13" fill="#475569">matnli javob yozadi</text>
  <line x1="600" y1="260" x2="600" y2="300" stroke="#16a34a" stroke-width="3" marker-end="url(#tsg)"/>

  <!-- result box -->
  <rect x="200" y="300" width="360" height="56" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="326" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">"Toshkentda 24 daraja, quyoshli"</text>
  <text x="380" y="346" text-anchor="middle" font-size="13" fill="#b45309">son endi to'qima emas — funksiyadan keldi</text>

  <text x="380" y="400" text-anchor="middle" font-size="14" fill="#64748b">Modelga IKKI marta murojaat: 1-2 (niyat) va 3-4 (natija -> javob)</text>
  <text x="380" y="424" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Yashil = modeldan, ko'k = sizning kodingizdan</text>
</svg>
