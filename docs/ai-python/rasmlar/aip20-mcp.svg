<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 430" width="770" height="430" font-family="Segoe UI, system-ui, sans-serif">
  <title>MCP arxitekturasi: host/client bitta standart orqali ko'p serverga ulanadi</title>
  <rect x="0" y="0" width="770" height="430" fill="#f8fafc"/>
  <text x="385" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">MCP — "AI uchun USB-C"</text>
  <text x="385" y="60" text-anchor="middle" font-size="14" fill="#64748b">bitta standart protokol, ko'p tool/manba; bir marta yoz, ko'p joyda ishlat</text>

  <defs>
    <marker id="mc" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- Host / client -->
  <rect x="40" y="120" width="220" height="190" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="40" y="120" width="220" height="42" rx="14" fill="#4f46e5"/>
  <text x="150" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">HOST (ilova)</text>
  <text x="150" y="186" text-anchor="middle" font-size="14" fill="#1e293b">sizning AI ilovangiz</text>
  <text x="150" y="208" text-anchor="middle" font-size="14" fill="#475569">(IDE, chatbot, agent)</text>
  <rect x="66" y="228" width="168" height="62" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="150" y="254" text-anchor="middle" font-size="14" font-weight="700" fill="#4338ca">MCP client</text>
  <text x="150" y="276" text-anchor="middle" font-size="13" fill="#475569">protokolda gaplashadi</text>

  <!-- Servers -->
  <g>
    <rect x="490" y="92" width="240" height="78" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="610" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">MCP server: Fayllar</text>
    <text x="610" y="146" text-anchor="middle" font-size="13" fill="#475569">resource: hujjatlarni o'qish</text>
  </g>
  <g>
    <rect x="490" y="182" width="240" height="78" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="610" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#0369a1">MCP server: Ma'lumotlar bazasi</text>
    <text x="610" y="236" text-anchor="middle" font-size="13" fill="#475569">tool: SQL so'rov bajarish</text>
  </g>
  <g>
    <rect x="490" y="272" width="240" height="78" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <text x="610" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">MCP server: GitHub / API</text>
    <text x="610" y="326" text-anchor="middle" font-size="13" fill="#475569">tool: issue, qidiruv...</text>
  </g>

  <!-- Protocol bar -->
  <rect x="300" y="200" width="150" height="44" rx="10" fill="#4f46e5"/>
  <text x="375" y="221" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">MCP protokol</text>
  <text x="375" y="238" text-anchor="middle" font-size="13" fill="#c7d2fe">(yagona "til")</text>

  <!-- arrows -->
  <line x1="262" y1="222" x2="298" y2="222" stroke="#4f46e5" stroke-width="3" marker-end="url(#mc)"/>
  <line x1="452" y1="218" x2="488" y2="131" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#mc)"/>
  <line x1="452" y1="222" x2="488" y2="221" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#mc)"/>
  <line x1="452" y1="226" x2="488" y2="311" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#mc)"/>

  <text x="385" y="392" text-anchor="middle" font-size="14" fill="#64748b">Server bir marta yoziladi; uni har qanday MCP-mos host (Claude Desktop, IDE, agent) ishlatadi</text>
</svg>
