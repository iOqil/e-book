<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>Chroma kolleksiyasi: hujjatlar, vektorlar va metadata bir qatorda; query eng yaqinini topadi</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Chroma kolleksiyasi ichi</text>

  <defs>
    <marker id="a14c" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- collection table -->
  <rect x="36" y="66" width="688" height="206" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2.5"/>
  <rect x="36" y="66" width="688" height="40" rx="14" fill="#e0f2fe"/>
  <text x="60" y="92" font-size="16" font-weight="700" fill="#0284c7">collection: "qollanma"</text>

  <!-- header row -->
  <text x="80" y="132" font-size="14" font-weight="700" fill="#475569">id</text>
  <text x="180" y="132" font-size="14" font-weight="700" fill="#475569">documents (matn)</text>
  <text x="420" y="132" font-size="14" font-weight="700" fill="#475569">embeddings (vektor)</text>
  <text x="600" y="132" font-size="14" font-weight="700" fill="#475569">metadatas</text>
  <line x1="56" y1="142" x2="704" y2="142" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- row 1 -->
  <text x="80" y="170" font-size="13" font-family="JetBrains Mono, monospace" fill="#1e293b">d1</text>
  <text x="180" y="170" font-size="13" fill="#1e293b">"Yetkazib berish 3 kun"</text>
  <text x="420" y="170" font-size="13" font-family="JetBrains Mono, monospace" fill="#7c3aed">[0.12, -0.4, ...]</text>
  <text x="600" y="170" font-size="13" fill="#16a34a">{bolim: dostavka}</text>
  <line x1="56" y1="182" x2="704" y2="182" stroke="#f1f5f9" stroke-width="1"/>

  <!-- row 2 -->
  <text x="80" y="208" font-size="13" font-family="JetBrains Mono, monospace" fill="#1e293b">d2</text>
  <text x="180" y="208" font-size="13" fill="#1e293b">"Qaytarish 14 kun ichida"</text>
  <text x="420" y="208" font-size="13" font-family="JetBrains Mono, monospace" fill="#7c3aed">[-0.3, 0.8, ...]</text>
  <text x="600" y="208" font-size="13" fill="#16a34a">{bolim: qaytarish}</text>
  <line x1="56" y1="220" x2="704" y2="220" stroke="#f1f5f9" stroke-width="1"/>

  <!-- row 3 -->
  <text x="80" y="246" font-size="13" font-family="JetBrains Mono, monospace" fill="#1e293b">d3</text>
  <text x="180" y="246" font-size="13" fill="#1e293b">"To'lov karta orqali"</text>
  <text x="420" y="246" font-size="13" font-family="JetBrains Mono, monospace" fill="#7c3aed">[0.5, 0.1, ...]</text>
  <text x="600" y="246" font-size="13" fill="#16a34a">{bolim: tolov}</text>

  <!-- query box -->
  <rect x="36" y="318" width="300" height="88" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="56" y="346" font-size="15" font-weight="700" fill="#166534">query("buyurtmam qachon keladi?")</text>
  <text x="56" y="370" font-size="13" fill="#475569">savol vektorga aylanadi va</text>
  <text x="56" y="390" font-size="13" fill="#475569">eng yaqin qatorlar topiladi</text>

  <line x1="336" y1="362" x2="448" y2="362" stroke="#16a34a" stroke-width="3" marker-end="url(#a14c)"/>

  <rect x="450" y="318" width="274" height="88" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="587" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">Natija: d1</text>
  <text x="587" y="370" text-anchor="middle" font-size="13" fill="#b45309">"Yetkazib berish 3 kun"</text>
  <text x="587" y="390" text-anchor="middle" font-size="13" fill="#b45309">distance (masofa) eng kichik</text>
</svg>
