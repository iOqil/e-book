<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>Parallel tool calls: bitta javobda bir nechta tool_call</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Parallel tool calls: bitta javobda bir nechta</text>

  <defs>
    <marker id="pl-arr" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4f46e5"/>
    </marker>
    <marker id="pl-arr-g" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- user -->
  <rect x="40" y="70" width="270" height="60" rx="12" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="56" y="94" font-size="13" font-weight="700" fill="#0284c7">user</text>
  <text x="56" y="116" font-size="13" fill="#1e293b">"Toshkent VA Samarqandda ob-havo?"</text>

  <!-- assistant response with 2 tool_calls -->
  <rect x="40" y="160" width="270" height="120" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="40" y="160" width="270" height="32" rx="12" fill="#eef2ff"/>
  <text x="175" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#4338ca">assistant (bitta javob)</text>
  <rect x="56" y="202" width="238" height="32" rx="8" fill="#f8fafc" stroke="#6366f1" stroke-width="1.5"/>
  <text x="66" y="222" font-size="13" font-family="JetBrains Mono, monospace" fill="#1e293b">tool_call#1 ob_havo("Toshkent")</text>
  <rect x="56" y="240" width="238" height="32" rx="8" fill="#f8fafc" stroke="#6366f1" stroke-width="1.5"/>
  <text x="66" y="260" font-size="13" font-family="JetBrains Mono, monospace" fill="#1e293b">tool_call#2 ob_havo("Samarqand")</text>

  <line x1="175" y1="130" x2="175" y2="156" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#pl-arr)"/>

  <!-- execute both -->
  <text x="360" y="222" text-anchor="middle" font-size="13" fill="#64748b">har birini</text>
  <text x="360" y="240" text-anchor="middle" font-size="13" fill="#64748b">bajaramiz</text>
  <line x1="314" y1="218" x2="416" y2="218" stroke="#16a34a" stroke-width="2.5" marker-end="url(#pl-arr-g)"/>
  <line x1="314" y1="256" x2="416" y2="256" stroke="#16a34a" stroke-width="2.5" marker-end="url(#pl-arr-g)"/>

  <!-- two tool results -->
  <rect x="420" y="200" width="300" height="40" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="436" y="218" font-size="13" font-weight="700" fill="#166534">tool (tool_call_id #1)</text>
  <text x="436" y="234" font-size="13" fill="#1e293b">{"shahar":"Toshkent","harorat_c":24}</text>

  <rect x="420" y="248" width="300" height="40" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="436" y="266" font-size="13" font-weight="700" fill="#166534">tool (tool_call_id #2)</text>
  <text x="436" y="282" font-size="13" fill="#1e293b">{"shahar":"Samarqand","harorat_c":21}</text>

  <!-- warning row -->
  <rect x="40" y="306" width="680" height="44" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="380" y="333" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">QOIDA: har tool_call uchun ALOHIDA tool javobi (o'z tool_call_id bilan) shart</text>

  <!-- final -->
  <rect x="40" y="366" width="680" height="56" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="380" y="390" text-anchor="middle" font-size="14" font-weight="700" fill="#4338ca">Natijalarni qaytarib qayta chaqiramiz -&gt; model yakuniy matnni yozadi</text>
  <text x="380" y="411" text-anchor="middle" font-size="13" fill="#475569">"Toshkentda 24°C, Samarqandda 21°C, ikkalasi ham ochiq."</text>
</svg>
