<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Segoe UI, system-ui, sans-serif">
  <title>LLM-as-judge: javob va mezon -> baho beruvchi model -> ball</title>
  <rect x="0" y="0" width="760" height="380" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">LLM-as-judge: model javobni baholaydi</text>

  <defs>
    <marker id="jd" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- Kirish: savol + javob + mezon -->
  <rect x="30" y="80" width="240" height="220" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <rect x="30" y="80" width="240" height="38" rx="14" fill="#e0f2fe"/>
  <text x="150" y="105" text-anchor="middle" font-size="16" font-weight="700" fill="#0284c7">Kirish</text>

  <rect x="50" y="132" width="200" height="44" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="64" y="152" font-size="13" font-weight="700" fill="#1e293b">SAVOL</text>
  <text x="64" y="170" font-size="13" fill="#475569">poytaxt qaysi?</text>

  <rect x="50" y="186" width="200" height="44" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="64" y="206" font-size="13" font-weight="700" fill="#1e293b">JAVOB (baholanadigan)</text>
  <text x="64" y="224" font-size="13" fill="#475569">poytaxt — Toshkent</text>

  <rect x="50" y="240" width="200" height="44" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="64" y="260" font-size="13" font-weight="700" fill="#b45309">MEZON</text>
  <text x="64" y="278" font-size="13" fill="#475569">to'g'ri va to'liqmi?</text>

  <line x1="272" y1="190" x2="316" y2="190" stroke="#4f46e5" stroke-width="3" marker-end="url(#jd)"/>

  <!-- Sudya model -->
  <rect x="320" y="120" width="190" height="140" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="415" y="165" text-anchor="middle" font-size="17" font-weight="700" fill="#4338ca">Sudya model</text>
  <text x="415" y="190" text-anchor="middle" font-size="14" fill="#475569">(KUCHLIROQ model)</text>
  <text x="415" y="214" text-anchor="middle" font-size="13" fill="#64748b">JSON rejimida</text>
  <text x="415" y="236" text-anchor="middle" font-size="13" fill="#64748b">xolis baholaydi</text>

  <line x1="512" y1="190" x2="556" y2="190" stroke="#4f46e5" stroke-width="3" marker-end="url(#jd)"/>

  <!-- Chiqish: ball -->
  <rect x="560" y="130" width="170" height="120" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="560" y="130" width="170" height="36" rx="14" fill="#dcfce7"/>
  <text x="645" y="154" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Chiqish (JSON)</text>
  <text x="645" y="196" text-anchor="middle" font-size="30" font-weight="700" fill="#16a34a">5 / 5</text>
  <text x="645" y="228" text-anchor="middle" font-size="13" fill="#475569">"sabab": to'g'ri</text>

  <text x="380" y="338" text-anchor="middle" font-size="14" fill="#64748b">Aniq mezon + kuchli sudya = inson bahosiga eng yaqin avtomatik usul</text>
  <text x="380" y="360" text-anchor="middle" font-size="13" fill="#64748b">Eslatma: sudya ham xato qiladi — muhim qarorda inson ham tekshirsin</text>
</svg>
