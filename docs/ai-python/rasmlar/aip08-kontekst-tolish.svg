<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Segoe UI, system-ui, sans-serif">
  <title>Kontekst oynasi suhbat o'sgani sari to'lib boradi va strategiya kerak bo'ladi</title>
  <rect x="0" y="0" width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Kontekst oynasi to'lib boradi</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#64748b">Suhbat uzaygani sari tarix oynani egallaydi</text>

  <!-- Three glasses -->
  <!-- Glass 1: empty -->
  <text x="150" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#475569">Boshida</text>
  <rect x="100" y="112" width="100" height="200" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="102" y="262" width="96" height="48" rx="6" fill="#dcfce7"/>
  <text x="150" y="292" text-anchor="middle" font-size="14" fill="#166534">15%</text>
  <text x="150" y="336" text-anchor="middle" font-size="13" fill="#16a34a">bo'sh joy ko'p</text>

  <!-- Glass 2: half -->
  <text x="380" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#475569">O'rtada</text>
  <rect x="330" y="112" width="100" height="200" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <rect x="332" y="212" width="96" height="98" rx="6" fill="#fef3c7"/>
  <text x="380" y="266" text-anchor="middle" font-size="14" fill="#b45309">55%</text>
  <text x="380" y="336" text-anchor="middle" font-size="13" fill="#b45309">to'lib boryapti</text>

  <!-- Glass 3: full -->
  <text x="610" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#475569">Uzun suhbatdan keyin</text>
  <rect x="560" y="112" width="100" height="200" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="562" y="120" width="96" height="190" rx="6" fill="#fee2e2"/>
  <text x="610" y="220" text-anchor="middle" font-size="14" fill="#dc2626">98%</text>
  <text x="610" y="336" text-anchor="middle" font-size="13" fill="#dc2626">to'lib ketdi!</text>

  <defs>
    <marker id="kt" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <line x1="208" y1="212" x2="322" y2="212" stroke="#64748b" stroke-width="2.5" marker-end="url(#kt)"/>
  <line x1="438" y1="212" x2="552" y2="212" stroke="#64748b" stroke-width="2.5" marker-end="url(#kt)"/>

  <!-- Warning bar -->
  <rect x="100" y="352" width="560" height="36" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="380" y="375" text-anchor="middle" font-size="14" fill="#dc2626">Oyna to'lsa: xato yoki eng eski xabar kesiladi -> strategiya kerak (window / xulosa)</text>
</svg>
