<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Segoe UI, system-ui, sans-serif">
  <title>Har navbatda butun suhbat tarixi qayta yuboriladi, token soni o'sib boradi</title>
  <rect x="0" y="0" width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Har navbatda BUTUN tarix qayta yuboriladi</text>

  <!-- Turn 1 -->
  <rect x="30" y="64" width="200" height="120" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <rect x="30" y="64" width="200" height="30" rx="12" fill="#eef2ff"/>
  <text x="130" y="85" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">1-navbat</text>
  <rect x="44" y="104" width="172" height="22" rx="6" fill="#eef2ff"/>
  <text x="52" y="120" font-size="13" fill="#4338ca">system</text>
  <rect x="44" y="132" width="172" height="22" rx="6" fill="#e0f2fe"/>
  <text x="52" y="148" font-size="13" fill="#0284c7">user 1</text>
  <text x="130" y="174" text-anchor="middle" font-size="13" fill="#16a34a">~60 token</text>

  <!-- Turn 2 -->
  <rect x="260" y="64" width="200" height="120" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <rect x="260" y="64" width="200" height="30" rx="12" fill="#eef2ff"/>
  <text x="360" y="85" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">2-navbat</text>
  <rect x="274" y="100" width="172" height="18" rx="5" fill="#eef2ff"/>
  <text x="282" y="113" font-size="13" fill="#4338ca">system</text>
  <rect x="274" y="121" width="172" height="18" rx="5" fill="#e0f2fe"/>
  <text x="282" y="134" font-size="13" fill="#0284c7">user 1</text>
  <rect x="274" y="142" width="172" height="18" rx="5" fill="#dcfce7"/>
  <text x="282" y="155" font-size="13" fill="#166534">assistant 1</text>
  <rect x="274" y="163" width="172" height="18" rx="5" fill="#e0f2fe"/>
  <text x="282" y="176" font-size="13" fill="#0284c7">user 2</text>

  <!-- Turn 3 -->
  <rect x="490" y="64" width="240" height="150" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="490" y="64" width="240" height="30" rx="12" fill="#fee2e2"/>
  <text x="610" y="85" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">3-navbat</text>
  <rect x="504" y="100" width="212" height="15" rx="4" fill="#eef2ff"/>
  <text x="512" y="112" font-size="13" fill="#4338ca">system</text>
  <rect x="504" y="118" width="212" height="15" rx="4" fill="#e0f2fe"/>
  <text x="512" y="130" font-size="13" fill="#0284c7">user 1</text>
  <rect x="504" y="136" width="212" height="15" rx="4" fill="#dcfce7"/>
  <text x="512" y="148" font-size="13" fill="#166534">assistant 1</text>
  <rect x="504" y="154" width="212" height="15" rx="4" fill="#e0f2fe"/>
  <text x="512" y="166" font-size="13" fill="#0284c7">user 2</text>
  <rect x="504" y="172" width="212" height="15" rx="4" fill="#dcfce7"/>
  <text x="512" y="184" font-size="13" fill="#166534">assistant 2</text>
  <rect x="504" y="190" width="212" height="15" rx="4" fill="#e0f2fe"/>
  <text x="512" y="202" font-size="13" fill="#0284c7">user 3</text>

  <text x="360" y="200" text-anchor="middle" font-size="13" fill="#b45309">~140 token</text>
  <text x="610" y="232" text-anchor="middle" font-size="13" fill="#dc2626">~240 token</text>

  <defs>
    <marker id="th" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <line x1="232" y1="124" x2="258" y2="124" stroke="#64748b" stroke-width="2.5" marker-end="url(#th)"/>
  <line x1="462" y1="124" x2="488" y2="124" stroke="#64748b" stroke-width="2.5" marker-end="url(#th)"/>

  <!-- Growth note -->
  <rect x="30" y="280" width="700" height="90" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="50" y="312" font-size="16" font-weight="700" fill="#b45309">Tendensiya</text>
  <text x="50" y="340" font-size="14" fill="#1e293b">Har yangi navbatda avvalgi barcha xabarlar qayta yuboriladi -> token soni</text>
  <text x="50" y="362" font-size="14" fill="#1e293b">har navbatda ortadi -> narx oshadi va kontekst oynasi to'lib boradi.</text>
</svg>
