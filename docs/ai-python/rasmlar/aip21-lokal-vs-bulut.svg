<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Segoe UI, system-ui, sans-serif">
  <title>Lokal va bulut LLM taqqoslash: narx, maxfiylik, tezlik, sifat</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Lokal va bulut: qaysi biri qachon?</text>

  <!-- Local column -->
  <rect x="30" y="64" width="340" height="328" rx="14" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <rect x="30" y="64" width="340" height="44" rx="14" fill="#e0f2fe"/>
  <text x="200" y="93" text-anchor="middle" font-size="17" font-weight="700" fill="#0284c7">Lokal (Ollama)</text>

  <text x="52" y="146" font-size="15" fill="#1e293b">Narx</text>
  <text x="348" y="146" text-anchor="end" font-size="15" font-weight="700" fill="#16a34a">bepul</text>
  <text x="52" y="200" font-size="15" fill="#1e293b">Maxfiylik</text>
  <text x="348" y="200" text-anchor="end" font-size="15" font-weight="700" fill="#16a34a">a'lo (chiqmaydi)</text>
  <text x="52" y="254" font-size="15" fill="#1e293b">Tezlik</text>
  <text x="348" y="254" text-anchor="end" font-size="15" font-weight="700" fill="#b45309">apparatga bog'liq</text>
  <text x="52" y="308" font-size="15" fill="#1e293b">Sifat</text>
  <text x="348" y="308" text-anchor="end" font-size="15" font-weight="700" fill="#b45309">kichik=kuchsizroq</text>
  <line x1="52" y1="162" x2="348" y2="162" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="52" y1="216" x2="348" y2="216" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="52" y1="270" x2="348" y2="270" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="200" y="360" text-anchor="middle" font-size="14" fill="#475569">Internet kerak emas, ma'lumot</text>
  <text x="200" y="380" text-anchor="middle" font-size="14" fill="#475569">kompyuteringizdan chiqmaydi</text>

  <!-- Cloud column -->
  <rect x="390" y="64" width="340" height="328" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="390" y="64" width="340" height="44" rx="14" fill="#eef2ff"/>
  <text x="560" y="93" text-anchor="middle" font-size="17" font-weight="700" fill="#4338ca">Bulut (API)</text>

  <text x="412" y="146" font-size="15" fill="#1e293b">Narx</text>
  <text x="708" y="146" text-anchor="end" font-size="15" font-weight="700" fill="#dc2626">token uchun to'lov</text>
  <text x="412" y="200" font-size="15" fill="#1e293b">Maxfiylik</text>
  <text x="708" y="200" text-anchor="end" font-size="15" font-weight="700" fill="#b45309">serverga yuboriladi</text>
  <text x="412" y="254" font-size="15" fill="#1e293b">Tezlik</text>
  <text x="708" y="254" text-anchor="end" font-size="15" font-weight="700" fill="#16a34a">kuchli, barqaror</text>
  <text x="412" y="308" font-size="15" fill="#1e293b">Sifat</text>
  <text x="708" y="308" text-anchor="end" font-size="15" font-weight="700" fill="#16a34a">eng yuqori</text>
  <line x1="412" y1="162" x2="708" y2="162" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="412" y1="216" x2="708" y2="216" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="412" y1="270" x2="708" y2="270" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="560" y="360" text-anchor="middle" font-size="14" fill="#475569">Eng kuchli modellar, internet</text>
  <text x="560" y="380" text-anchor="middle" font-size="14" fill="#475569">va to'lov talab qiladi</text>

  <text x="380" y="418" text-anchor="middle" font-size="14" fill="#64748b">Maxfiylik/eksperiment/offline -> lokal;  eng yuqori sifat -> bulut</text>
</svg>
