<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Segoe UI, system-ui, sans-serif">
  <title>Oddiy RAG va yaxshilangan RAG (re-rank + hybrid) natija sifatini taqqoslash</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Oddiy RAG va yaxshilangan RAG</text>

  <defs>
    <marker id="nv" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- LEFT: naive RAG (weak) -->
  <rect x="30" y="70" width="330" height="300" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="30" y="70" width="330" height="40" rx="14" fill="#fee2e2"/>
  <text x="195" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">Oddiy (naive) RAG</text>

  <text x="50" y="138" font-size="14" fill="#1e293b">Savol -> vektor qidiruv -> top-3</text>

  <rect x="50" y="156" width="290" height="34" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="64" y="178" font-size="13" fill="#b45309">chunk: shovqin (mavzuga aloqasiz)</text>
  <rect x="50" y="196" width="290" height="34" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="64" y="218" font-size="13" fill="#166534">chunk: KERAKLI javob (oxirida)</text>
  <rect x="50" y="236" width="290" height="34" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="64" y="258" font-size="13" fill="#dc2626">chunk: noto'g'ri (so'z mos, mazmun yo'q)</text>

  <line x1="195" y1="278" x2="195" y2="300" stroke="#64748b" stroke-width="2.5" marker-end="url(#nv)"/>
  <rect x="50" y="306" width="290" height="50" rx="10" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <text x="195" y="328" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">Javob: noaniq / chalkash</text>
  <text x="195" y="348" text-anchor="middle" font-size="13" fill="#dc2626">shovqin modelni adashtiradi</text>

  <!-- RIGHT: improved RAG (strong) -->
  <rect x="400" y="70" width="330" height="300" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="400" y="70" width="330" height="40" rx="14" fill="#dcfce7"/>
  <text x="565" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Yaxshilangan RAG</text>

  <text x="420" y="138" font-size="14" fill="#1e293b">hybrid + top-20 -> re-rank -> top-3</text>

  <rect x="420" y="156" width="290" height="34" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="434" y="178" font-size="13" fill="#166534">chunk: aniq javob (1-o'rin)</text>
  <rect x="420" y="196" width="290" height="34" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="434" y="218" font-size="13" fill="#166534">chunk: qo'shimcha tegishli kontekst</text>
  <rect x="420" y="236" width="290" height="34" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="434" y="258" font-size="13" fill="#4338ca">chunk: tasdiqlovchi tafsilot</text>

  <line x1="565" y1="278" x2="565" y2="300" stroke="#64748b" stroke-width="2.5" marker-end="url(#nv)"/>
  <rect x="420" y="306" width="290" height="50" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="565" y="328" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Javob: aniq, manbaga asoslangan</text>
  <text x="565" y="348" text-anchor="middle" font-size="13" fill="#166534">kam shovqin -> ishonchli</text>

  <text x="380" y="402" text-anchor="middle" font-size="14" fill="#64748b">Bir xil model va baza — farq faqat KONTEKST sifatida</text>
  <text x="380" y="424" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">"Yaxshi javob = yaxshi retrieval", noto'g'ri chunk -> noto'g'ri javob</text>
</svg>
