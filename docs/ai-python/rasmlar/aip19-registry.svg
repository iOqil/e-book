<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Tool registry: nom -> funksiya + ta'rif; agent matnli nomni haqiqiy funksiyaga bog'laydi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Tool registry: nom -> funksiya + ta'rif</text>

  <defs>
    <marker id="a19r-i" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4f46e5"/>
    </marker>
    <marker id="a19r-gray" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- LEFT: definitions sent to model -->
  <rect x="30" y="64" width="220" height="160" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <rect x="30" y="64" width="220" height="36" rx="14" fill="#e0f2fe"/>
  <text x="140" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#0284c7">tool ta'riflari -> model</text>
  <text x="48" y="124" font-size="13" font-family="JetBrains Mono, monospace" fill="#475569">name: "kalkulyator"</text>
  <text x="48" y="146" font-size="13" font-family="JetBrains Mono, monospace" fill="#475569">description: "..."</text>
  <text x="48" y="168" font-size="13" font-family="JetBrains Mono, monospace" fill="#475569">parameters: {...}</text>
  <line x1="48" y1="182" x2="232" y2="182" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="140" y="204" text-anchor="middle" font-size="13" fill="#64748b">model FAQAT ta'rifni</text>
  <text x="140" y="220" text-anchor="middle" font-size="13" fill="#64748b">ko'radi (kodni emas)</text>

  <!-- RIGHT: registry dict -->
  <rect x="510" y="64" width="220" height="200" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="510" y="64" width="220" height="36" rx="14" fill="#dcfce7"/>
  <text x="620" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">REGISTRY (lug'at)</text>
  <text x="528" y="126" font-size="13" font-family="JetBrains Mono, monospace" fill="#1e293b">"kalkulyator":</text>
  <text x="544" y="146" font-size="13" font-family="JetBrains Mono, monospace" fill="#16a34a">kalkulyator,</text>
  <text x="528" y="178" font-size="13" font-family="JetBrains Mono, monospace" fill="#1e293b">"qidir":</text>
  <text x="544" y="198" font-size="13" font-family="JetBrains Mono, monospace" fill="#16a34a">qidir,</text>
  <text x="528" y="230" font-size="13" font-family="JetBrains Mono, monospace" fill="#1e293b">"joriy_vaqt":</text>
  <text x="544" y="250" font-size="13" font-family="JetBrains Mono, monospace" fill="#16a34a">joriy_vaqt</text>

  <!-- MODEL center top -->
  <rect x="290" y="74" width="180" height="56" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="380" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">Model</text>
  <text x="380" y="118" text-anchor="middle" font-size="13" fill="#475569">ta'rifga qarab tanlaydi</text>
  <line x1="250" y1="120" x2="286" y2="108" stroke="#0284c7" stroke-width="2.5" marker-end="url(#a19r-i)"/>

  <!-- model returns name -->
  <rect x="270" y="172" width="220" height="48" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="380" y="194" text-anchor="middle" font-size="14" font-weight="700" fill="#7c3aed">tool_call.function.name</text>
  <text x="380" y="212" text-anchor="middle" font-size="13" fill="#475569">= "kalkulyator" (matnli nom)</text>
  <line x1="380" y1="130" x2="380" y2="168" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#a19r-i)"/>

  <!-- agent lookup -->
  <rect x="240" y="262" width="280" height="58" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="286" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">Agent: REGISTRY[name]</text>
  <text x="380" y="306" text-anchor="middle" font-size="13" fill="#92400e">nomni haqiqiy funksiyaga bog'laydi</text>
  <line x1="380" y1="220" x2="380" y2="258" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#a19r-i)"/>
  <!-- lookup arrow to registry -->
  <line x1="520" y1="200" x2="610" y2="200" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a19r-gray)"/>
  <path d="M520,290 C580,290 600,270 614,256" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a19r-gray)"/>

  <!-- call + result -->
  <rect x="240" y="346" width="280" height="56" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="370" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">funksiya(**args) -> natija</text>
  <text x="380" y="390" text-anchor="middle" font-size="13" fill="#166534">natija JSON bo'lib xotiraga qaytadi</text>
  <line x1="380" y1="320" x2="380" y2="342" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#a19r-i)"/>

  <text x="380" y="438" text-anchor="middle" font-size="14" fill="#64748b">Yangi tool = bitta funksiya + ta'rif + bitta registry yozuvi. Bajarish kodi o'zgarmaydi.</text>
</svg>
