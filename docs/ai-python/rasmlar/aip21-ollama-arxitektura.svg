<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Segoe UI, system-ui, sans-serif">
  <title>Ollama arxitekturasi: lokal server localhost:11434 va Python ulanish yo'llari</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Ollama: lokal LLM serveri</text>

  <!-- Python app -->
  <rect x="40" y="80" width="230" height="260" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="40" y="80" width="230" height="42" rx="14" fill="#eef2ff"/>
  <text x="155" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">Python ilovangiz</text>

  <rect x="60" y="138" width="190" height="80" rx="10" fill="#f8fafc" stroke="#6366f1" stroke-width="1.5"/>
  <text x="155" y="164" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">(a) native</text>
  <text x="155" y="188" text-anchor="middle" font-size="14" font-family="JetBrains Mono, monospace" fill="#475569">import ollama</text>
  <text x="155" y="208" text-anchor="middle" font-size="14" font-family="JetBrains Mono, monospace" fill="#475569">ollama.chat(...)</text>

  <rect x="60" y="232" width="190" height="92" rx="10" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5"/>
  <text x="155" y="258" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">(b) OpenAI-mos</text>
  <text x="155" y="282" text-anchor="middle" font-size="14" font-family="JetBrains Mono, monospace" fill="#475569">OpenAI(base_url=</text>
  <text x="155" y="300" text-anchor="middle" font-size="14" font-family="JetBrains Mono, monospace" fill="#475569">"...11434/v1")</text>
  <text x="155" y="318" text-anchor="middle" font-size="13" fill="#16a34a">oldingi kod ishlaydi!</text>

  <!-- Server -->
  <rect x="430" y="120" width="290" height="180" rx="14" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <rect x="430" y="120" width="290" height="42" rx="14" fill="#e0f2fe"/>
  <text x="575" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#0284c7">Ollama server</text>
  <text x="575" y="186" text-anchor="middle" font-size="15" font-family="JetBrains Mono, monospace" fill="#1e293b">localhost:11434</text>
  <text x="575" y="222" text-anchor="middle" font-size="14" fill="#475569">lokal modellar (HDD'da):</text>
  <text x="575" y="248" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">llama3.2  ·  qwen2.5</text>
  <text x="575" y="274" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">nomic-embed-text</text>

  <text x="575" y="338" text-anchor="middle" font-size="14" fill="#64748b">hammasi sizning kompyuteringizda</text>
  <text x="575" y="360" text-anchor="middle" font-size="14" fill="#64748b">ishlaydi — internet kerakmas</text>

  <defs>
    <marker id="oa" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4f46e5"/>
    </marker>
    <marker id="ob" markerWidth="12" markerHeight="12" refX="2" refY="5" orient="auto">
      <path d="M9,0 L0,5 L9,10 Z" fill="#0ea5e9"/>
    </marker>
  </defs>
  <line x1="272" y1="190" x2="426" y2="190" stroke="#4f46e5" stroke-width="3" marker-end="url(#oa)"/>
  <text x="349" y="180" text-anchor="middle" font-size="13" fill="#475569">so'rov (HTTP)</text>
  <line x1="426" y1="230" x2="272" y2="230" stroke="#0ea5e9" stroke-width="3" marker-end="url(#ob)"/>
  <text x="349" y="248" text-anchor="middle" font-size="13" fill="#475569">javob</text>

  <text x="380" y="402" text-anchor="middle" font-size="14" fill="#64748b">Ikki yo'l ham bitta lokal serverga ulanadi — kalit ham, internet ham shart emas</text>
</svg>
