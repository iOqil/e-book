<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Segoe UI, system-ui, sans-serif">
  <title>Fallback zanjiri: provayder A ishlamasa B, B ham bo'lmasa C</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Fallback zanjiri: A → B → C</text>
  <text x="380" y="64" text-anchor="middle" font-size="14" fill="#64748b">birinchi ishlagan provayder javob qaytaradi</text>

  <defs>
    <marker id="fb-fail" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#dc2626"/>
    </marker>
    <marker id="fb-ok" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- User request -->
  <rect x="40" y="120" width="120" height="80" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="100" y="155" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">So'rov</text>
  <text x="100" y="178" text-anchor="middle" font-size="13" fill="#475569">(foydalanuvchi)</text>

  <line x1="160" y1="160" x2="208" y2="160" stroke="#4f46e5" stroke-width="3" marker-end="url(#fb-ok)"/>

  <!-- Provider A -->
  <rect x="210" y="120" width="120" height="80" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="270" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Provayder A</text>
  <text x="270" y="172" text-anchor="middle" font-size="13" fill="#64748b">OpenAI</text>
  <text x="270" y="192" text-anchor="middle" font-size="13" fill="#dc2626">429 limit ✗</text>

  <!-- A -> B fail arrow -->
  <line x1="380" y1="160" x2="428" y2="160" stroke="#dc2626" stroke-width="3" marker-end="url(#fb-fail)"/>
  <text x="404" y="148" text-anchor="middle" font-size="13" fill="#dc2626">xato</text>

  <!-- Provider B -->
  <rect x="430" y="120" width="120" height="80" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="490" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Provayder B</text>
  <text x="490" y="172" text-anchor="middle" font-size="13" fill="#64748b">Gemini</text>
  <text x="490" y="192" text-anchor="middle" font-size="13" fill="#dc2626">503 server ✗</text>

  <!-- B -> C fail arrow -->
  <line x1="600" y1="160" x2="648" y2="160" stroke="#dc2626" stroke-width="3" marker-end="url(#fb-fail)"/>
  <text x="624" y="148" text-anchor="middle" font-size="13" fill="#dc2626">xato</text>

  <!-- Provider C (ok) -->
  <rect x="600" y="240" width="120" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="660" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Provayder C</text>
  <text x="660" y="292" text-anchor="middle" font-size="13" fill="#475569">Groq</text>
  <text x="660" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">javob! ✓</text>

  <!-- elbow from B's fail toward C: visual bend -->
  <path d="M660,200 L660,236" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#fb-ok)"/>

  <!-- C returns answer back to user -->
  <path d="M600,280 L100,280 L100,206" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#fb-ok)"/>
  <text x="330" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">javob foydalanuvchiga qaytadi</text>

  <!-- bottom note: all fail -->
  <rect x="90" y="350" width="580" height="56" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="380" y="374" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">Agar A, B, C — hammasi yiqilsa:</text>
  <text x="380" y="396" text-anchor="middle" font-size="14" fill="#475569">graceful degradation — foydalanuvchiga chiroyli zaxira xabar</text>
</svg>
