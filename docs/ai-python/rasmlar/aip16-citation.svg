<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Segoe UI, system-ui, sans-serif">
  <title>Citation bog'lanishi: javobdagi da'volar raqamli ishoralar orqali kontekst chunklariga va asl manbalarga bog'lanadi</title>
  <rect x="0" y="0" width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Manba ko'rsatish (citations)</text>

  <defs>
    <marker id="ct" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Column headers -->
  <text x="130" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Model javobi</text>
  <text x="380" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">Kontekst chunklari</text>
  <text x="630" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">Asl manbalar</text>

  <!-- Answer claims -->
  <rect x="20" y="100" width="220" height="60" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="36" y="126" font-size="13" fill="#1e293b">Ta'til 21 ish kuni</text>
  <text x="36" y="148" font-size="14" font-weight="700" fill="#16a34a">beriladi  [1]</text>

  <rect x="20" y="190" width="220" height="60" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="36" y="216" font-size="13" fill="#1e293b">Ariza 2 hafta oldin</text>
  <text x="36" y="238" font-size="14" font-weight="700" fill="#16a34a">topshiriladi  [2]</text>

  <!-- Chunks -->
  <rect x="290" y="100" width="180" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="304" y="124" font-size="14" font-weight="700" fill="#4338ca">[1] chunk</text>
  <text x="304" y="146" font-size="13" fill="#475569">"...21 ish kuni..."</text>

  <rect x="290" y="190" width="180" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="304" y="214" font-size="14" font-weight="700" fill="#4338ca">[2] chunk</text>
  <text x="304" y="236" font-size="13" fill="#475569">"...2 hafta oldin..."</text>

  <!-- Sources -->
  <rect x="520" y="100" width="220" height="60" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="536" y="126" font-size="14" font-weight="700" fill="#b45309">qollanma.pdf</text>
  <text x="536" y="148" font-size="13" fill="#475569">12-sahifa  (metadata)</text>

  <rect x="520" y="190" width="220" height="60" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="536" y="216" font-size="14" font-weight="700" fill="#b45309">qollanma.pdf</text>
  <text x="536" y="238" font-size="13" fill="#475569">13-sahifa  (metadata)</text>

  <!-- Arrows: claim -> chunk -> source -->
  <line x1="240" y1="130" x2="286" y2="130" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ct)"/>
  <line x1="470" y1="130" x2="516" y2="130" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ct)"/>
  <line x1="240" y1="220" x2="286" y2="220" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ct)"/>
  <line x1="470" y1="220" x2="516" y2="220" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ct)"/>

  <!-- Bottom note box -->
  <rect x="60" y="300" width="640" height="64" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <text x="380" y="328" text-anchor="middle" font-size="14" font-weight="700" fill="#0284c7">Har bir da'vo [n] raqami orqali aniq chunkka, u esa asl hujjat manbasiga bog'lanadi</text>
  <text x="380" y="352" text-anchor="middle" font-size="14" fill="#475569">Foydalanuvchi javobni manba bilan TEKSHIRA oladi -> ishonch</text>
</svg>
