<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Segoe UI, system-ui, sans-serif">
  <title>Abstraksiya qatlamlari: sof HTTP/SDK dan freymvorkgacha</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Abstraksiya qatlamlari</text>
  <text x="380" y="62" text-anchor="middle" font-size="14" fill="#64748b">pastda — ko'p nazorat, ko'p kod; tepada — kam kod, kam nazorat</text>

  <defs>
    <marker id="ql" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Layer 1: HTTP -->
  <rect x="120" y="350" width="520" height="50" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="380" y="372" text-anchor="middle" font-size="16" font-weight="700" fill="#b91c1c">1. Sof HTTP / requests</text>
  <text x="380" y="392" text-anchor="middle" font-size="13" fill="#475569">eng past daraja: har bayt sizning qo'lingizda, lekin ko'p qo'l mehnat</text>

  <!-- Layer 2: SDK -->
  <rect x="120" y="280" width="520" height="50" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="380" y="302" text-anchor="middle" font-size="16" font-weight="700" fill="#0369a1">2. Rasmiy SDK (openai, anthropic)</text>
  <text x="380" y="322" text-anchor="middle" font-size="13" fill="#475569">bu kitobning asosiy qatlami: aniq, shaffof, to'liq nazorat</text>

  <!-- Layer 3: own loop -->
  <rect x="120" y="210" width="520" height="50" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="232" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">3. O'z agent siklingiz (19-bob)</text>
  <text x="380" y="252" text-anchor="middle" font-size="13" fill="#475569">SDK ustiga qurilgan: o'ylash -> tool -> kuzatish loop, hammasi siznikida</text>

  <!-- Layer 4: framework -->
  <rect x="120" y="140" width="520" height="50" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="380" y="162" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">4. Freymvork (LangChain, LlamaIndex)</text>
  <text x="380" y="182" text-anchor="middle" font-size="13" fill="#475569">tayyor agent, chain, RAG bloklari: tez, lekin ichi ko'rinmaydi</text>

  <!-- side labels -->
  <text x="50" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#4338ca" transform="rotate(-90 50 270)">kam kod</text>
  <text x="710" y="375" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c" transform="rotate(-90 710 375)">ko'p nazorat</text>

  <!-- arrow up -->
  <line x1="80" y1="395" x2="80" y2="150" stroke="#64748b" stroke-width="2.5" marker-end="url(#ql)"/>
  <text x="100" y="115" text-anchor="middle" font-size="13" fill="#64748b">abstraksiya</text>
  <text x="100" y="100" text-anchor="middle" font-size="13" fill="#64748b">o'sadi</text>
</svg>
