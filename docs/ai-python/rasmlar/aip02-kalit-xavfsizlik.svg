<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Segoe UI, system-ui, sans-serif">
  <title>API kalitni saqlash: kodga yozish (xato) va .env faylda saqlash (to'g'ri)</title>
  <rect x="0" y="0" width="760" height="360" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Kalitni qayerda saqlash kerak?</text>

  <!-- Wrong -->
  <rect x="30" y="64" width="340" height="262" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="30" y="64" width="340" height="44" rx="14" fill="#fee2e2"/>
  <text x="200" y="93" text-anchor="middle" font-size="17" font-weight="700" fill="#dc2626">XATO: kodga yozish</text>
  <rect x="52" y="128" width="296" height="70" rx="8" fill="#0f172a"/>
  <text x="66" y="156" font-size="13" fill="#f87171" font-family="JetBrains Mono, monospace">api_key =</text>
  <text x="66" y="178" font-size="13" fill="#f87171" font-family="JetBrains Mono, monospace">  "sk-abc123secret..."</text>
  <text x="200" y="232" text-anchor="middle" font-size="14" fill="#dc2626">GitHub'ga commit qilinsa,</text>
  <text x="200" y="254" text-anchor="middle" font-size="14" fill="#dc2626">kalit ochiq qoladi</text>
  <text x="200" y="290" text-anchor="middle" font-size="14" font-weight="600" fill="#b91c1c">botlar bir daqiqada o'g'irlaydi</text>

  <!-- Right -->
  <rect x="390" y="64" width="340" height="262" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="390" y="64" width="340" height="44" rx="14" fill="#dcfce7"/>
  <text x="560" y="93" text-anchor="middle" font-size="17" font-weight="700" fill="#16a34a">TO'G'RI: .env faylda</text>
  <rect x="412" y="128" width="296" height="44" rx="8" fill="#0f172a"/>
  <text x="426" y="155" font-size="13" fill="#4ade80" font-family="JetBrains Mono, monospace">OPENAI_API_KEY=sk-abc...</text>
  <text x="560" y="196" text-anchor="middle" font-size="13" fill="#64748b">(.env fayli)</text>
  <rect x="412" y="212" width="296" height="44" rx="8" fill="#0f172a"/>
  <text x="426" y="239" font-size="13" fill="#93c5fd" font-family="JetBrains Mono, monospace">client = OpenAI()</text>
  <text x="560" y="280" text-anchor="middle" font-size="14" fill="#16a34a">.gitignore -> .env yashirin</text>
  <text x="560" y="304" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">kalit hech qachon chiqmaydi</text>
</svg>
