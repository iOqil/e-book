<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Segoe UI, system-ui, sans-serif">
  <title>Uch rol: system, user va assistant va ularning vazifasi</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Uch rol: messages ro'yxatining qatnashchilari</text>

  <!-- system -->
  <rect x="30" y="80" width="700" height="92" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <rect x="30" y="80" width="150" height="92" rx="14" fill="#fef3c7"/>
  <text x="105" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#b45309">system</text>
  <text x="105" y="146" text-anchor="middle" font-size="13" fill="#b45309">ko'rsatma beruvchi</text>
  <text x="200" y="112" font-size="15" font-weight="700" fill="#1e293b">Modelga qoida, shaxsiyat va ohang beradi</text>
  <text x="200" y="138" font-size="13" fill="#475569">"Sen muloyim yordamchisan. Faqat o'zbekcha javob ber."</text>
  <text x="200" y="160" font-size="13" fill="#64748b">Suhbat boshida bir marta turadi — sahna ortidagi rejissyor.</text>

  <!-- user -->
  <rect x="30" y="188" width="700" height="92" rx="14" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <rect x="30" y="188" width="150" height="92" rx="14" fill="#e0f2fe"/>
  <text x="105" y="230" text-anchor="middle" font-size="18" font-weight="700" fill="#0284c7">user</text>
  <text x="105" y="254" text-anchor="middle" font-size="13" fill="#0284c7">foydalanuvchi</text>
  <text x="200" y="220" font-size="15" font-weight="700" fill="#1e293b">Foydalanuvchining xabari yoki savoli</text>
  <text x="200" y="246" font-size="13" fill="#475569">"Salom! Bugun ob-havo qanday?"</text>
  <text x="200" y="268" font-size="13" fill="#64748b">Modelga nima qilish kerakligini aytadigan haqiqiy kirish.</text>

  <!-- assistant -->
  <rect x="30" y="296" width="700" height="92" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="30" y="296" width="150" height="92" rx="14" fill="#dcfce7"/>
  <text x="105" y="338" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">assistant</text>
  <text x="105" y="362" text-anchor="middle" font-size="13" fill="#166534">model javobi</text>
  <text x="200" y="328" font-size="15" font-weight="700" fill="#1e293b">Modelning o'zi qaytargan javob</text>
  <text x="200" y="354" font-size="13" fill="#475569">"Salom! Men ob-havoni ko'ra olmayman, lekin..."</text>
  <text x="200" y="376" font-size="13" fill="#64748b">Tarixga qo'shilsa, model o'z avvalgi gapini "eslaydi".</text>
</svg>
