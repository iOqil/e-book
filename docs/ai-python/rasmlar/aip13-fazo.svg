<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>Vektor fazosida o'xshash ma'noli matnlar klaster bo'lib to'planadi</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Vektor fazosi: o'xshash ma'no — yaqin nuqta</text>
  <text x="380" y="62" text-anchor="middle" font-size="13" fill="#64748b">(minglab o'lcham 2D ga soddalashtirilgan)</text>

  <!-- Axes -->
  <line x1="70" y1="400" x2="710" y2="400" stroke="#94a3b8" stroke-width="2"/>
  <line x1="70" y1="400" x2="70" y2="90" stroke="#94a3b8" stroke-width="2"/>

  <!-- Cluster 1: hayvonlar (yashil) -->
  <ellipse cx="200" cy="170" rx="105" ry="75" fill="#dcfce7" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="200" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Hayvonlar</text>
  <circle cx="170" cy="160" r="6" fill="#16a34a"/>
  <text x="182" y="156" font-size="13" fill="#166534">it</text>
  <circle cx="225" cy="150" r="6" fill="#16a34a"/>
  <text x="237" y="146" font-size="13" fill="#166534">kuchuk</text>
  <circle cx="205" cy="195" r="6" fill="#16a34a"/>
  <text x="217" y="200" font-size="13" fill="#166534">mushuk</text>

  <!-- Cluster 2: transport (ko'k) -->
  <ellipse cx="560" cy="180" rx="110" ry="75" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="560" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#0284c7">Transport</text>
  <circle cx="530" cy="170" r="6" fill="#0284c7"/>
  <text x="542" y="166" font-size="13" fill="#0284c7">mashina</text>
  <circle cx="595" cy="160" r="6" fill="#0284c7"/>
  <text x="607" y="156" font-size="13" fill="#0284c7">avtobus</text>
  <circle cx="565" cy="205" r="6" fill="#0284c7"/>
  <text x="577" y="210" font-size="13" fill="#0284c7">poyezd</text>

  <!-- Cluster 3: dasturlash (indigo) -->
  <ellipse cx="350" cy="335" rx="115" ry="62" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="350" y="295" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">Dasturlash</text>
  <circle cx="315" cy="335" r="6" fill="#4f46e5"/>
  <text x="327" y="331" font-size="13" fill="#4338ca">Python</text>
  <circle cx="385" cy="325" r="6" fill="#4f46e5"/>
  <text x="397" y="321" font-size="13" fill="#4338ca">kod</text>
  <circle cx="350" cy="360" r="6" fill="#4f46e5"/>
  <text x="362" y="365" font-size="13" fill="#4338ca">funksiya</text>

  <text x="380" y="428" text-anchor="middle" font-size="14" fill="#475569">Bir mavzudagi matnlar yaqin (klaster); boshqa mavzular uzoq</text>
</svg>
