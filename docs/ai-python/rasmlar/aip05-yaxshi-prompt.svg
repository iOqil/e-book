<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Segoe UI, system-ui, sans-serif">
  <title>Yaxshi promptning to'rt tarkibiy qismi: rol, kontekst, vazifa va format</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Yaxshi promptning tarkibiy qismlari</text>

  <!-- 1. Rol -->
  <rect x="40" y="70" width="320" height="130" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="40" y="70" width="320" height="36" rx="14" fill="#eef2ff"/>
  <text x="60" y="94" font-size="16" font-weight="700" fill="#4338ca">1. Rol / auditoriya</text>
  <text x="60" y="132" font-size="14" fill="#475569">Model kim bo'lib gapirsin,</text>
  <text x="60" y="154" font-size="14" fill="#475569">kim uchun yozsin.</text>
  <text x="60" y="182" font-size="13" fill="#64748b" font-style="italic">"Sen tajribali Python ustozisan..."</text>

  <!-- 2. Kontekst -->
  <rect x="400" y="70" width="320" height="130" rx="14" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <rect x="400" y="70" width="320" height="36" rx="14" fill="#e0f2fe"/>
  <text x="420" y="94" font-size="16" font-weight="700" fill="#0284c7">2. Kontekst</text>
  <text x="420" y="132" font-size="14" fill="#475569">Kerakli ma'lumot, fon,</text>
  <text x="420" y="154" font-size="14" fill="#475569">cheklovlar.</text>
  <text x="420" y="182" font-size="13" fill="#64748b" font-style="italic">"Quyidagi mijoz sharhi asosida..."</text>

  <!-- 3. Vazifa -->
  <rect x="40" y="220" width="320" height="130" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="40" y="220" width="320" height="36" rx="14" fill="#dcfce7"/>
  <text x="60" y="244" font-size="16" font-weight="700" fill="#166534">3. Vazifa (aniq amal)</text>
  <text x="60" y="282" font-size="14" fill="#475569">Aniq nima qilsin —</text>
  <text x="60" y="304" font-size="14" fill="#475569">bitta fe'l bilan.</text>
  <text x="60" y="332" font-size="13" fill="#64748b" font-style="italic">"...kayfiyatni aniqlab ber."</text>

  <!-- 4. Format -->
  <rect x="400" y="220" width="320" height="130" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <rect x="400" y="220" width="320" height="36" rx="14" fill="#fef3c7"/>
  <text x="420" y="244" font-size="16" font-weight="700" fill="#b45309">4. Kerakli format</text>
  <text x="420" y="282" font-size="14" fill="#475569">Javob qanday chiqsin:</text>
  <text x="420" y="304" font-size="14" fill="#475569">JSON, ro'yxat, 1 so'z.</text>
  <text x="420" y="332" font-size="13" fill="#64748b" font-style="italic">"Faqat: ijobiy / salbiy / betaraf"</text>

  <text x="380" y="392" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">To'rttasi birlashganda — model nimani, kim uchun, qanday qilishni aniq biladi</text>
  <text x="380" y="416" text-anchor="middle" font-size="14" fill="#64748b">Noaniqlik qancha kam bo'lsa — javob shuncha foydali</text>
</svg>
