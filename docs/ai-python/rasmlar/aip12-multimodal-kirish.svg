<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Segoe UI, system-ui, sans-serif">
  <title>Multimodal model: matn, rasm va ovoz kirishlari -> model -> chiqish</title>
  <rect x="0" y="0" width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Multimodal: matn, rasm, ovoz</text>

  <defs>
    <marker id="mm" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- Kirishlar -->
  <text x="120" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">Kirish</text>

  <rect x="30" y="100" width="180" height="56" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <text x="120" y="125" text-anchor="middle" font-size="16" font-weight="700" fill="#0284c7">Matn</text>
  <text x="120" y="146" text-anchor="middle" font-size="13" fill="#64748b">savol, ko'rsatma</text>

  <rect x="30" y="172" width="180" height="56" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="120" y="197" text-anchor="middle" font-size="16" font-weight="700" fill="#4f46e5">Rasm</text>
  <text x="120" y="218" text-anchor="middle" font-size="13" fill="#64748b">URL yoki base64</text>

  <rect x="30" y="244" width="180" height="56" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="120" y="269" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">Ovoz</text>
  <text x="120" y="290" text-anchor="middle" font-size="13" fill="#64748b">mp3, wav fayl</text>

  <!-- Strelkalar kirishdan modelga -->
  <line x1="212" y1="128" x2="305" y2="180" stroke="#4f46e5" stroke-width="3" marker-end="url(#mm)"/>
  <line x1="212" y1="200" x2="305" y2="200" stroke="#4f46e5" stroke-width="3" marker-end="url(#mm)"/>
  <line x1="212" y1="272" x2="305" y2="220" stroke="#4f46e5" stroke-width="3" marker-end="url(#mm)"/>

  <!-- Model -->
  <rect x="310" y="150" width="160" height="100" rx="16" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
  <text x="390" y="195" text-anchor="middle" font-size="19" font-weight="700" fill="#4338ca">Multimodal</text>
  <text x="390" y="220" text-anchor="middle" font-size="19" font-weight="700" fill="#4338ca">model</text>

  <!-- Strelka modeldan chiqishga -->
  <line x1="472" y1="200" x2="555" y2="200" stroke="#4f46e5" stroke-width="3" marker-end="url(#mm)"/>

  <!-- Chiqish -->
  <text x="650" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">Chiqish</text>
  <rect x="560" y="150" width="180" height="100" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="560" y="150" width="180" height="36" rx="14" fill="#dcfce7"/>
  <text x="650" y="174" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Javob</text>
  <text x="650" y="208" text-anchor="middle" font-size="14" fill="#1e293b">odatda matn</text>
  <text x="650" y="232" text-anchor="middle" font-size="13" fill="#64748b">(yoki rasm / ovoz)</text>

  <text x="380" y="350" text-anchor="middle" font-size="15" fill="#475569">Bir model bir nechta "modallik" bilan ishlaydi</text>
  <text x="380" y="376" text-anchor="middle" font-size="13" fill="#64748b">G'oya bir xil: ma'lumotni yuborasiz, natijani olasiz</text>
</svg>
