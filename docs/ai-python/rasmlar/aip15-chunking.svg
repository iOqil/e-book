<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>Uzun hujjatni overlap (ustma-ustlik) bilan bo'laklarga bo'lish</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Chunking: overlap bilan bo'laklash</text>

  <defs>
    <marker id="ch-arr" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- long document -->
  <text x="60" y="80" font-size="15" font-weight="700" fill="#475569">Uzun hujjat (bitta katta matn):</text>
  <rect x="60" y="92" width="640" height="46" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="380" y="121" text-anchor="middle" font-size="14" fill="#1e293b">...bir necha ming so'zlik uzluksiz matn — modelga butunligicha sig'maydi...</text>

  <line x1="380" y1="138" x2="380" y2="166" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#ch-arr)"/>
  <text x="470" y="158" font-size="14" font-weight="700" fill="#4338ca">o'lcham + overlap bilan kesamiz</text>

  <!-- chunks with overlap -->
  <text x="60" y="196" font-size="15" font-weight="700" fill="#475569">Bo'laklar (qo'shni bo'laklar chetlari ustma-ust tushadi):</text>

  <!-- chunk 1 -->
  <rect x="60" y="212" width="240" height="58" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="180" y="237" text-anchor="middle" font-size="14" font-weight="700" fill="#4338ca">Chunk 1</text>
  <text x="180" y="257" text-anchor="middle" font-size="13" fill="#475569">belgi 0 .. 800</text>

  <!-- chunk 2 -->
  <rect x="240" y="284" width="240" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="309" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Chunk 2</text>
  <text x="360" y="329" text-anchor="middle" font-size="13" fill="#166534">belgi 700 .. 1500</text>

  <!-- chunk 3 -->
  <rect x="420" y="356" width="240" height="58" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="540" y="381" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">Chunk 3</text>
  <text x="540" y="401" text-anchor="middle" font-size="13" fill="#92400e">belgi 1400 .. 2200</text>

  <!-- overlap markers -->
  <rect x="240" y="212" width="60" height="58" rx="0" fill="#dc2626" fill-opacity="0.14" stroke="none"/>
  <rect x="240" y="284" width="60" height="58" rx="0" fill="#dc2626" fill-opacity="0.14" stroke="none"/>
  <rect x="420" y="284" width="60" height="58" rx="0" fill="#dc2626" fill-opacity="0.14" stroke="none"/>
  <rect x="420" y="356" width="60" height="58" rx="0" fill="#dc2626" fill-opacity="0.14" stroke="none"/>

  <text x="312" y="278" font-size="13" font-weight="700" fill="#dc2626">overlap</text>
  <text x="492" y="350" font-size="13" font-weight="700" fill="#dc2626">overlap</text>

  <text x="380" y="434" text-anchor="middle" font-size="13" fill="#64748b">Overlap = qo'shni bo'laklar 100 belgini baham ko'radi -&gt; chegarada kontekst yo'qolmaydi</text>
</svg>
