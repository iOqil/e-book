<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="Segoe UI, system-ui, sans-serif">
  <title>Brute-force va ANN taqqoslash: hammasini solishtirish sekin, indeks orqali tez taxminiy qidiruv</title>
  <rect x="0" y="0" width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Brute-force va ANN: nega vektor bazasi tez</text>

  <!-- LEFT: brute force -->
  <rect x="30" y="64" width="340" height="330" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="30" y="64" width="340" height="38" rx="14" fill="#fee2e2"/>
  <text x="200" y="89" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">Brute-force (qo'lda)</text>
  <text x="200" y="124" text-anchor="middle" font-size="13" fill="#475569">savolni HAR vektor bilan solishtir</text>

  <!-- query point left -->
  <circle cx="200" cy="250" r="9" fill="#dc2626"/>
  <text x="200" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">savol</text>
  <!-- many dots with lines to all -->
  <g stroke="#fca5a5" stroke-width="1.5">
    <line x1="200" y1="250" x2="90" y2="170"/>
    <line x1="200" y1="250" x2="150" y2="150"/>
    <line x1="200" y1="250" x2="260" y2="160"/>
    <line x1="200" y1="250" x2="320" y2="200"/>
    <line x1="200" y1="250" x2="100" y2="320"/>
    <line x1="200" y1="250" x2="170" y2="350"/>
    <line x1="200" y1="250" x2="280" y2="340"/>
    <line x1="200" y1="250" x2="320" y2="300"/>
  </g>
  <g fill="#64748b">
    <circle cx="90" cy="170" r="6"/>
    <circle cx="150" cy="150" r="6"/>
    <circle cx="260" cy="160" r="6"/>
    <circle cx="320" cy="200" r="6"/>
    <circle cx="100" cy="320" r="6"/>
    <circle cx="170" cy="350" r="6"/>
    <circle cx="280" cy="340" r="6"/>
    <circle cx="320" cy="300" r="6"/>
  </g>
  <text x="200" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">N ta vektor = N ta hisob -> sekin</text>

  <!-- RIGHT: ANN -->
  <rect x="390" y="64" width="340" height="330" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="390" y="64" width="340" height="38" rx="14" fill="#dcfce7"/>
  <text x="560" y="89" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">ANN (indeks bilan)</text>
  <text x="560" y="124" text-anchor="middle" font-size="13" fill="#475569">faqat yaqin "mahalla"ga qaraydi</text>

  <!-- clusters -->
  <ellipse cx="470" cy="180" rx="48" ry="40" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <ellipse cx="650" cy="200" rx="48" ry="40" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <ellipse cx="540" cy="320" rx="56" ry="42" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>

  <g fill="#94a3b8">
    <circle cx="455" cy="170" r="6"/>
    <circle cx="485" cy="195" r="6"/>
    <circle cx="470" cy="160" r="6"/>
    <circle cx="640" cy="190" r="6"/>
    <circle cx="665" cy="210" r="6"/>
    <circle cx="645" cy="220" r="6"/>
  </g>

  <!-- query point right -->
  <circle cx="540" cy="320" r="9" fill="#16a34a"/>
  <text x="540" y="298" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">savol</text>
  <g fill="#16a34a">
    <circle cx="510" cy="330" r="6"/>
    <circle cx="565" cy="335" r="6"/>
    <circle cx="540" cy="350" r="6"/>
  </g>
  <line x1="540" y1="320" x2="510" y2="330" stroke="#16a34a" stroke-width="2"/>
  <line x1="540" y1="320" x2="565" y2="335" stroke="#16a34a" stroke-width="2"/>
  <line x1="540" y1="320" x2="540" y2="350" stroke="#16a34a" stroke-width="2"/>

  <text x="560" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">uzoq mahallalar tashlanadi -> tez</text>

  <text x="380" y="426" text-anchor="middle" font-size="14" fill="#64748b">ANN = "approximate nearest neighbor": ozgina aniqlikni tezlikka almashadi</text>
  <text x="380" y="448" text-anchor="middle" font-size="13" fill="#64748b">millionlab vektorda farq sekundlardan millisekundgacha</text>
</svg>
