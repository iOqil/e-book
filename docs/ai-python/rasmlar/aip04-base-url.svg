<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Bitta openai SDK, base_url almashib bir nechta provayderga ulanadi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Bitta SDK, faqat base_url almashadi</text>

  <!-- Center hub -->
  <rect x="285" y="190" width="190" height="100" rx="14" fill="#1e293b"/>
  <text x="380" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">openai SDK</text>
  <text x="380" y="250" text-anchor="middle" font-size="13" fill="#cbd5e1">OpenAI(base_url=...,</text>
  <text x="380" y="270" text-anchor="middle" font-size="13" fill="#cbd5e1">api_key=...)</text>

  <defs>
    <marker id="bu" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- Top-left: OpenAI -->
  <rect x="40" y="70" width="200" height="60" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="140" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">OpenAI</text>
  <text x="140" y="118" text-anchor="middle" font-size="13" fill="#475569">api.openai.com/v1</text>
  <line x1="240" y1="120" x2="288" y2="205" stroke="#6366f1" stroke-width="2.5" marker-end="url(#bu)"/>

  <!-- Mid-left: Groq -->
  <rect x="40" y="200" width="200" height="60" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Groq (tez, bepul)</text>
  <text x="140" y="248" text-anchor="middle" font-size="13" fill="#475569">api.groq.com/openai/v1</text>
  <line x1="240" y1="230" x2="283" y2="234" stroke="#6366f1" stroke-width="2.5" marker-end="url(#bu)"/>

  <!-- Bottom-left: DeepSeek -->
  <rect x="40" y="330" width="200" height="60" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="140" y="356" text-anchor="middle" font-size="15" font-weight="700" fill="#0284c7">DeepSeek (arzon)</text>
  <text x="140" y="378" text-anchor="middle" font-size="13" fill="#475569">api.deepseek.com</text>
  <line x1="240" y1="350" x2="288" y2="276" stroke="#6366f1" stroke-width="2.5" marker-end="url(#bu)"/>

  <!-- Top-right: Gemini -->
  <rect x="520" y="70" width="200" height="60" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="620" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">Gemini (mos endpoint)</text>
  <text x="620" y="118" text-anchor="middle" font-size="13" fill="#475569">.../v1beta/openai/</text>
  <line x1="520" y1="120" x2="472" y2="205" stroke="#6366f1" stroke-width="2.5" marker-end="url(#bu)"/>

  <!-- Mid-right: OpenRouter -->
  <rect x="520" y="200" width="200" height="60" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="620" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">OpenRouter</text>
  <text x="620" y="248" text-anchor="middle" font-size="13" fill="#475569">openrouter.ai/api/v1</text>
  <line x1="520" y1="230" x2="477" y2="234" stroke="#6366f1" stroke-width="2.5" marker-end="url(#bu)"/>

  <!-- Bottom-right: Ollama -->
  <rect x="520" y="330" width="200" height="60" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="356" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Ollama (lokal)</text>
  <text x="620" y="378" text-anchor="middle" font-size="13" fill="#475569">localhost:11434/v1</text>
  <line x1="520" y1="350" x2="472" y2="276" stroke="#6366f1" stroke-width="2.5" marker-end="url(#bu)"/>

  <text x="380" y="430" text-anchor="middle" font-size="14" fill="#64748b">Kod o'zgarmaydi — faqat base_url, kalit va model nomini almashtirasiz</text>
  <text x="380" y="454" text-anchor="middle" font-size="13" fill="#94a3b8">Claude va Gemini'ning to'liq imkoniyatlari uchun native SDK ham bor</text>
</svg>
