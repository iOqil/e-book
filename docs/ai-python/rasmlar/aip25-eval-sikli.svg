<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>Baholash sikli: test to'plamidan promptni yaxshilashgacha</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Baholash sikli (eval loop)</text>
  <text x="380" y="62" text-anchor="middle" font-size="14" fill="#64748b">"his" bilan emas, o'lchab yaxshilash</text>

  <defs>
    <marker id="ev" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- 1. Test to'plami -->
  <rect x="290" y="90" width="180" height="64" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="380" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">1. Test to'plami</text>
  <text x="380" y="140" text-anchor="middle" font-size="13" fill="#475569">[(kirish, kutilgan), ...]</text>

  <!-- 2. Ishga tushir -->
  <rect x="540" y="170" width="190" height="64" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <text x="635" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#0284c7">2. Ishga tushir</text>
  <text x="635" y="220" text-anchor="middle" font-size="13" fill="#475569">har misol -> javob</text>

  <!-- 3. Baho -->
  <rect x="540" y="290" width="190" height="78" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="635" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">3. Baho</text>
  <text x="635" y="340" text-anchor="middle" font-size="13" fill="#475569">aniq moslik / kalit so'z</text>
  <text x="635" y="358" text-anchor="middle" font-size="13" fill="#475569">/ LLM-judge -> ball</text>

  <!-- 4. Umumiy ball / qaror -->
  <rect x="285" y="300" width="190" height="78" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="328" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">4. Umumiy ball</text>
  <text x="380" y="350" text-anchor="middle" font-size="13" fill="#1e293b">o'rtacha 4.4/5</text>
  <text x="380" y="368" text-anchor="middle" font-size="13" fill="#1e293b">ball oshdimi?</text>

  <!-- 5. Yaxshilash -->
  <rect x="30" y="170" width="190" height="64" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="125" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">5. Yaxshilash</text>
  <text x="125" y="220" text-anchor="middle" font-size="13" fill="#475569">prompt / model</text>

  <!-- Strelkalar (sikl) -->
  <line x1="470" y1="135" x2="560" y2="172" stroke="#4f46e5" stroke-width="3" marker-end="url(#ev)"/>
  <line x1="635" y1="236" x2="635" y2="286" stroke="#4f46e5" stroke-width="3" marker-end="url(#ev)"/>
  <line x1="538" y1="335" x2="479" y2="335" stroke="#4f46e5" stroke-width="3" marker-end="url(#ev)"/>
  <line x1="285" y1="320" x2="170" y2="238" stroke="#6366f1" stroke-width="3" marker-end="url(#ev)"/>
  <line x1="160" y1="168" x2="300" y2="120" stroke="#6366f1" stroke-width="3" marker-end="url(#ev)"/>

  <text x="408" y="404" text-anchor="middle" font-size="13" fill="#64748b">tushsa -> yaxshila va sikl boshiga qayt; oshsa -> dalil bilan deploy</text>
</svg>
