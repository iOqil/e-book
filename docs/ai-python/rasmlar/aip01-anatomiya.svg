<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Segoe UI, system-ui, sans-serif">
  <title>LLM integratsiya oqimi: ilova -> API -> bulutdagi model -> javob</title>
  <rect x="0" y="0" width="760" height="360" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Integratsiya = modelni API orqali chaqirish</text>

  <!-- Your app -->
  <rect x="36" y="120" width="180" height="120" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="126" y="158" text-anchor="middle" font-size="17" font-weight="700" fill="#4f46e5">Sizning ilovangiz</text>
  <text x="126" y="186" text-anchor="middle" font-size="14" fill="#475569">Python kodi</text>
  <text x="126" y="208" text-anchor="middle" font-size="14" fill="#475569">(savolni yuboradi,</text>
  <text x="126" y="228" text-anchor="middle" font-size="14" fill="#475569">javobni ko'rsatadi)</text>

  <!-- Cloud LLM -->
  <rect x="544" y="120" width="184" height="120" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="636" y="158" text-anchor="middle" font-size="17" font-weight="700" fill="#4338ca">LLM provayderi</text>
  <text x="636" y="186" text-anchor="middle" font-size="14" fill="#475569">tayyor model</text>
  <text x="636" y="208" text-anchor="middle" font-size="14" fill="#475569">(bulutda, boshqalar</text>
  <text x="636" y="228" text-anchor="middle" font-size="14" fill="#475569">o'qitgan)</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrR" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrL" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <line x1="220" y1="160" x2="540" y2="160" stroke="#16a34a" stroke-width="3" marker-end="url(#arrR)"/>
  <text x="380" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#16a34a">1. so'rov (matn) — API</text>

  <line x1="540" y1="205" x2="220" y2="205" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrL)"/>
  <text x="380" y="226" text-anchor="middle" font-size="14" font-weight="600" fill="#b45309">2. javob (matn)</text>

  <text x="380" y="300" text-anchor="middle" font-size="15" fill="#64748b">Siz modelni qurmaysiz va o'qitmaysiz —</text>
  <text x="380" y="324" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">"rozetkaga ulanasiz" va ishlatganingizcha to'laysiz</text>
</svg>
