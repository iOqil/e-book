<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>Ishonch chegarasi: kalit faqat serverda yashashi kerak, brauzerda emas</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Ishonch chegarasi: kalit qayerda yashaydi?</text>

  <defs>
    <marker id="tb" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#16a34a"/>
    </marker>
    <marker id="tbRed" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- WRONG row -->
  <text x="40" y="86" font-size="16" font-weight="700" fill="#dc2626">XATO: kalit brauzerda</text>
  <rect x="40" y="100" width="180" height="86" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="130" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">Brauzer (frontend)</text>
  <text x="130" y="156" text-anchor="middle" font-size="14" fill="#dc2626">kalit kodda OCHIQ</text>
  <text x="130" y="176" text-anchor="middle" font-size="13" fill="#dc2626">har kim o'qiy oladi</text>

  <line x1="220" y1="143" x2="430" y2="143" stroke="#dc2626" stroke-width="2.5" marker-end="url(#tbRed)"/>
  <text x="325" y="134" text-anchor="middle" font-size="13" fill="#dc2626">kalit bilan to'g'ridan-to'g'ri</text>

  <rect x="430" y="100" width="180" height="86" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="520" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">LLM provayder</text>
  <text x="520" y="162" text-anchor="middle" font-size="13" fill="#64748b">API</text>

  <!-- thief -->
  <text x="700" y="120" text-anchor="middle" font-size="13" fill="#dc2626">o'g'ri kalitni</text>
  <text x="700" y="138" text-anchor="middle" font-size="13" fill="#dc2626">ko'radi va</text>
  <text x="700" y="156" text-anchor="middle" font-size="13" fill="#dc2626">o'g'irlaydi</text>
  <line x1="160" y1="186" x2="640" y2="186" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- divider -->
  <line x1="40" y1="218" x2="720" y2="218" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- RIGHT row -->
  <text x="40" y="256" font-size="16" font-weight="700" fill="#166534">TO'G'RI: kalit faqat serverda</text>

  <rect x="40" y="276" width="150" height="86" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="115" y="312" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Brauzer</text>
  <text x="115" y="338" text-anchor="middle" font-size="13" fill="#64748b">kalit YO'Q</text>

  <line x1="190" y1="319" x2="280" y2="319" stroke="#16a34a" stroke-width="2.5" marker-end="url(#tb)"/>
  <text x="235" y="310" text-anchor="middle" font-size="13" fill="#64748b">so'rov</text>

  <!-- trust boundary line -->
  <line x1="300" y1="262" x2="300" y2="392" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="300" y="408" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">ishonch chegarasi</text>

  <rect x="310" y="276" width="160" height="86" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="390" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Sizning server</text>
  <text x="390" y="332" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">kalit shu yerda</text>
  <text x="390" y="352" text-anchor="middle" font-size="13" fill="#15803d">.env, yashirin</text>

  <line x1="470" y1="319" x2="560" y2="319" stroke="#16a34a" stroke-width="2.5" marker-end="url(#tb)"/>
  <text x="515" y="310" text-anchor="middle" font-size="13" fill="#64748b">kalit bilan</text>

  <rect x="560" y="276" width="160" height="86" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="640" y="314" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">LLM provayder</text>
  <text x="640" y="338" text-anchor="middle" font-size="13" fill="#64748b">API</text>
</svg>
