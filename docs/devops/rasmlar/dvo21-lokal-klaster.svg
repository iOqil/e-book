<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380">
  <title>Lokal klaster: kind yoki minikube buyrug'i Docker ichida bitta node'li Kubernetes klaster yaratadi va kubectl shu klasterga ulanib get nodes natijasini ko'rsatadi degan diagramma</title>
  <rect x="0" y="0" width="760" height="380" fill="#f8fafc"/>
  <defs>
    <marker id="a21lk" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1e293b">Lokal klaster: kind / minikube + Docker</text>

  <!-- create command -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="28" y="74" width="190" height="96" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="123" y="100" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e40af">kind / minikube</text>
    <rect x="44" y="112" width="158" height="26" rx="4" fill="#fff" stroke="#2563eb" stroke-width="1.1"/>
    <text x="123" y="130" text-anchor="middle" font-size="13" fill="#1e293b">kind create cluster</text>
    <rect x="44" y="142" width="158" height="22" rx="4" fill="#fff" stroke="#2563eb" stroke-width="1.1"/>
    <text x="123" y="158" text-anchor="middle" font-size="13" fill="#475569">minikube start</text>
  </g>
  <line x1="218" y1="122" x2="276" y2="122" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a21lk)"/>
  <text x="247" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e40af">yaratadi</text>

  <!-- Docker host -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="280" y="60" width="320" height="200" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="440" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Docker (sizning kompyuteringiz)</text>

    <rect x="306" y="102" width="268" height="140" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="440" y="126" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16a34a">bitta-node K8s klaster</text>
    <text x="440" y="146" text-anchor="middle" font-size="13" fill="#475569">node = Docker konteyner</text>

    <rect x="324" y="158" width="232" height="42" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="440" y="184" text-anchor="middle" font-size="13" fill="#1e40af">control plane + worker bir node'da</text>

    <rect x="324" y="206" width="110" height="26" rx="5" fill="#fff" stroke="#16a34a" stroke-width="1.2"/>
    <text x="379" y="224" text-anchor="middle" font-size="13" fill="#1e293b">Pod</text>
    <rect x="446" y="206" width="110" height="26" rx="5" fill="#fff" stroke="#16a34a" stroke-width="1.2"/>
    <text x="501" y="224" text-anchor="middle" font-size="13" fill="#1e293b">Pod</text>
  </g>

  <!-- kubectl connects -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="640" y="74" width="100" height="96" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="690" y="118" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7c3aed">kubectl</text>
    <text x="690" y="140" text-anchor="middle" font-size="13" fill="#475569">ulanadi</text>
  </g>
  <line x1="640" y1="122" x2="602" y2="122" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#a21lk)"/>

  <!-- output -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="120" y="288" width="520" height="72" rx="10" fill="#1e293b"/>
    <text x="140" y="312" font-family="Consolas, monospace" font-size="13" fill="#dcfce7">$ kubectl get nodes</text>
    <text x="140" y="332" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">NAME                 STATUS   ROLES           AGE   VERSION</text>
    <text x="140" y="350" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">kind-control-plane   Ready    control-plane   60s   v1.34.0</text>
  </g>
  <text x="380" y="282" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">namuna chiqish (o'z klasteringizda) — illustrativ</text>
</svg>
