<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <title>To'liq production arxitekturasi: internetdan so'rov DNS va domen orqali serverga keladi, Nginx 443-portda TLS'ni tugatib web konteynerning 3000-portiga proxy qiladi, web esa bir Compose tarmog'idagi postgres va redis bilan named volume orqali ishlaydi</title>
  <rect x="0" y="0" width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">To'liq production stack: internetdan ilovagacha</text>

  <defs>
    <marker id="ar-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="ar-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="ar-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- internet -->
  <rect x="24" y="180" width="120" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="84" y="214" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Internet</text>
  <text x="84" y="236" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">brauzer</text>

  <!-- DNS -->
  <rect x="172" y="180" width="120" height="80" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="232" y="208" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">DNS / domen</text>
  <text x="232" y="230" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">A record</text>
  <text x="232" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">domen -&gt; IP</text>

  <line x1="144" y1="220" x2="170" y2="220" stroke="#2563eb" stroke-width="3" marker-end="url(#ar-blue)"/>
  <line x1="292" y1="220" x2="324" y2="220" stroke="#2563eb" stroke-width="3" marker-end="url(#ar-blue)"/>

  <!-- server / compose stack box -->
  <rect x="328" y="60" width="408" height="376" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="348" y="86" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#475569">Server (VPS) — bitta Compose stack, bitta ichki tarmoq</text>

  <!-- nginx -->
  <rect x="348" y="104" width="150" height="118" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="423" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Nginx</text>
  <text x="423" y="154" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#166534">listen 443 ssl</text>
  <text x="423" y="174" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">TLS tugatish</text>
  <text x="423" y="194" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">reverse proxy</text>
  <text x="423" y="213" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#16a34a">80 / 443 ochiq</text>

  <line x1="324" y1="220" x2="346" y2="180" stroke="#16a34a" stroke-width="3" marker-end="url(#ar-green)"/>
  <text x="318" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">HTTPS</text>

  <!-- web -->
  <rect x="556" y="104" width="160" height="118" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="636" y="132" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#1e40af">web</text>
  <text x="636" y="154" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">vazifalar API</text>
  <text x="636" y="174" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">:3000</text>
  <text x="636" y="194" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ichki, publish yo'q</text>
  <text x="636" y="213" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e40af">/health</text>

  <line x1="498" y1="160" x2="554" y2="160" stroke="#2563eb" stroke-width="3" marker-end="url(#ar-blue)"/>
  <text x="526" y="150" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e40af">web:3000</text>

  <!-- postgres -->
  <rect x="556" y="248" width="160" height="76" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="636" y="274" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#166534">db</text>
  <text x="636" y="294" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">postgres:17-alpine</text>
  <text x="636" y="312" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ichki, publish yo'q</text>

  <!-- redis -->
  <rect x="556" y="340" width="160" height="76" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="636" y="366" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#991b1b">cache</text>
  <text x="636" y="386" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">redis:7-alpine</text>
  <text x="636" y="404" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ichki, publish yo'q</text>

  <line x1="636" y1="222" x2="636" y2="246" stroke="#2563eb" stroke-width="3" marker-end="url(#ar-blue)"/>
  <line x1="600" y1="222" x2="600" y2="338" stroke="#2563eb" stroke-width="3" marker-end="url(#ar-blue)"/>

  <!-- named volume -->
  <rect x="348" y="248" width="150" height="76" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="423" y="274" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#b45309">db-data</text>
  <text x="423" y="294" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">named volume</text>
  <text x="423" y="312" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">doimiy ma'lumot</text>
  <line x1="554" y1="286" x2="500" y2="286" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#ar-amber)"/>

  <text x="423" y="362" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">restart: unless-stopped (hammada)</text>
  <text x="423" y="384" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">depends_on + healthcheck</text>
  <text x="423" y="408" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#16a34a">.env (secret) serverda</text>

  <text x="380" y="452" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">Faqat Nginx tashqariga ochiq; web, db, cache faqat ichki tarmoqda (xavfsiz)</text>
</svg>
