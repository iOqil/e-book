<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360">
  <title>Ikki muhitli deploy: git push main staging muhitiga avtomatik deploy boladi, production muhiti oldida required reviewers tasdiq darvozasi turadi, tasdiqlangach production ga deploy boladi</title>
  <rect x="0" y="0" width="760" height="360" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Environments: staging avto, production tasdiq bilan</text>

  <!-- push main -->
  <rect x="28" y="86" width="140" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="98" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e40af">git push</text>
  <text x="98" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">branch: main</text>

  <!-- release tag -->
  <rect x="28" y="222" width="140" height="70" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="98" y="252" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#92400e">release</text>
  <text x="98" y="274" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tag v1.4.0</text>

  <!-- push -> staging -->
  <line x1="168" y1="121" x2="248" y2="121" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#strel)"/>
  <text x="208" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">avto</text>

  <!-- staging -->
  <rect x="252" y="84" width="190" height="74" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="347" y="114" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#166534">staging muhiti</text>
  <text x="347" y="136" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">avto-deploy, sinov</text>

  <!-- staging -> server -->
  <line x1="442" y1="121" x2="586" y2="121" stroke="#16a34a" stroke-width="2.5" marker-end="url(#strelg)"/>

  <!-- staging server -->
  <rect x="590" y="84" width="146" height="74" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="663" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">staging server</text>
  <text x="663" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">compose up -d</text>

  <!-- release -> gate -->
  <line x1="168" y1="257" x2="248" y2="257" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#strel)"/>

  <!-- approval gate -->
  <rect x="252" y="220" width="190" height="74" rx="10" fill="#fde68a" stroke="#dc2626" stroke-width="2"/>
  <text x="347" y="250" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b91c1c">tasdiq darvozasi</text>
  <text x="347" y="272" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">required reviewers</text>

  <!-- gate -> production server -->
  <line x1="442" y1="257" x2="586" y2="257" stroke="#dc2626" stroke-width="2.5" marker-end="url(#strelr)"/>
  <text x="514" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b91c1c">tasdiqlangach</text>

  <!-- production server -->
  <rect x="590" y="220" width="146" height="74" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="663" y="252" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">production</text>
  <text x="663" y="274" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">compose up -d</text>

  <text x="380" y="334" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Har muhitning o'z environment secrets'i — har job o'z serverining qiymatini oladi</text>

  <defs>
    <marker id="strel" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
    <marker id="strelg" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/>
    </marker>
    <marker id="strelr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
