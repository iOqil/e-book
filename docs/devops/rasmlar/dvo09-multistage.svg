<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
  <title>Multi-stage build: katta build bosqichi (SDK, manba, devDependencies, 1.68GB) faqat tayyor artefaktni COPY --from orqali kichik runtime bosqichiga (335MB) uzatadi</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Multi-stage build: katta qurish, kichik natija</text>

  <!-- build stage -->
  <rect x="40" y="70" width="300" height="290" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="190" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">1-bosqich: build</text>
  <text x="190" y="118" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">FROM node:22 AS build</text>

  <rect x="64" y="134" width="252" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="190" y="159" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">To'liq SDK (kompilyator, npm)</text>

  <rect x="64" y="182" width="252" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="190" y="207" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Manba kod + devDependencies</text>

  <rect x="64" y="230" width="252" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="190" y="255" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">npm run build &#8594; dist/</text>

  <rect x="64" y="290" width="252" height="48" rx="6" fill="#dc2626"/>
  <text x="190" y="312" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Hajm: 1.68 GB</text>
  <text x="190" y="330" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#fee2e2">final image'ga tushmaydi</text>

  <!-- arrow: COPY from build -->
  <line x1="340" y1="254" x2="420" y2="254" stroke="#16a34a" stroke-width="3.5" marker-end="url(#arrow)"/>
  <rect x="346" y="214" width="68" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="380" y="236" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#166534">COPY</text>
  <text x="380" y="272" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#166534">--from=build</text>

  <!-- runtime stage -->
  <rect x="440" y="120" width="280" height="200" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="580" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">2-bosqich: runtime</text>
  <text x="580" y="168" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">FROM node:22-slim</text>

  <rect x="464" y="182" width="232" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="580" y="207" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">faqat dist/ + prod deps</text>

  <rect x="464" y="234" width="232" height="48" rx="6" fill="#16a34a"/>
  <text x="580" y="256" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Hajm: 335 MB</text>
  <text x="580" y="274" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dcfce7">push qilinadigan image</text>

  <text x="580" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">~5 baravar kichik, tez deploy</text>

  <text x="380" y="396" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Build vositalari oxirgi image'da qolmaydi &#8212; faqat ishlash uchun keragi yetadi</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
