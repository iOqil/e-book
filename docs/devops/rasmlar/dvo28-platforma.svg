<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520">
  <title>To'liq DevOps platforma yagona rasmda: dasturchi koddan Git/GitHub'ga, GitHub Actions CI/CD test-build-push orqali GHCR registriga, u yerdan ikki deploy yo'liga (VPS + Nginx + HTTPS yoki Kubernetes Ingress + HPA), va ustidan Prometheus/Grafana monitoring hamda backup kuzatib turishi</title>
  <rect x="0" y="0" width="860" height="520" fill="#f8fafc"/>
  <text x="430" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Yagona DevOps platforma: koddan production'gacha</text>

  <!-- 1. Dev -->
  <rect x="24" y="70" width="150" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="99" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e40af">Dasturchi</text>
  <text x="99" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">kod + Dockerfile</text>
  <text x="99" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">compose (08/09/11)</text>

  <!-- arrow -->
  <line x1="174" y1="110" x2="222" y2="110" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="198" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">push</text>

  <!-- 2. Git/GitHub -->
  <rect x="222" y="70" width="150" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="297" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#7c3aed">Git / GitHub</text>
  <text x="297" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">repo (main)</text>
  <text x="297" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">trigger: push</text>

  <line x1="372" y1="110" x2="420" y2="110" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- 3. CI/CD -->
  <rect x="420" y="62" width="180" height="96" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="510" y="88" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#92400e">GitHub Actions CI/CD</text>
  <text x="510" y="110" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">lint + test (matrix)</text>
  <text x="510" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">build + Trivy skan</text>
  <text x="510" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">12 / 13 / 14-boblar</text>

  <line x1="600" y1="110" x2="648" y2="110" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- 4. Registry -->
  <rect x="648" y="70" width="188" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="742" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e40af">GHCR registry</text>
  <text x="742" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ghcr.io/.../api</text>
  <text x="742" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">:sha · :latest (14)</text>

  <!-- registry -> deploy split -->
  <line x1="742" y1="150" x2="742" y2="190" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="742" y1="190" x2="250" y2="190" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="742" y1="190" x2="620" y2="190" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="250" y1="190" x2="250" y2="224" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arg)"/>
  <line x1="620" y1="190" x2="620" y2="224" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arg)"/>
  <text x="430" y="184" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">CD: avtomatik deploy (15) — IKKI yo'l</text>

  <!-- Yo'l A: VPS -->
  <rect x="60" y="228" width="320" height="150" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="252" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e40af">Yo'l A — VPS + Compose</text>
  <rect x="80" y="266" width="130" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="145" y="284" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">Nginx + HTTPS</text>
  <text x="145" y="302" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">16-20-boblar</text>
  <rect x="230" y="266" width="130" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="295" y="284" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">api konteyner</text>
  <text x="295" y="302" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">:3000</text>
  <line x1="210" y1="288" x2="228" y2="288" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="80" y="322" width="280" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="220" y="347" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">systemd (19) + db + backup (26)</text>

  <!-- Yo'l B: K8s -->
  <rect x="450" y="228" width="350" height="150" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="625" y="252" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#7c3aed">Yo'l B — Kubernetes</text>
  <rect x="468" y="266" width="120" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="528" y="284" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">Ingress+TLS</text>
  <text x="528" y="302" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">24-bob</text>
  <rect x="600" y="266" width="86" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="643" y="284" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">Service</text>
  <text x="643" y="302" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">22-bob</text>
  <rect x="696" y="266" width="86" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="739" y="284" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">Pods x3</text>
  <text x="739" y="302" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Deploy 22</text>
  <line x1="588" y1="288" x2="599" y2="288" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="686" y1="288" x2="695" y2="288" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="468" y="322" width="314" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="625" y="347" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">HPA avto-masshtab (23) + Helm/GitOps (24)</text>

  <!-- Monitoring band -->
  <rect x="60" y="400" width="740" height="58" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="430" y="424" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#92400e">Monitoring + ishonchlilik (25-26): Prometheus scrape -> Grafana panel -> Alertmanager xabar -> Backup</text>
  <text x="430" y="446" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">/metrics endpoint'larni yig'adi, har ikki yo'lni kuzatadi, muammoda ogohlantiradi</text>
  <!-- monitoring arrows up to both paths -->
  <line x1="220" y1="400" x2="220" y2="380" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#ary)"/>
  <line x1="625" y1="400" x2="625" y2="380" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#ary)"/>

  <!-- IaC footer -->
  <text x="430" y="486" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e293b">Butun bu muhit IaC bilan koddan quriladi: Ansible (server) + Terraform (cloud) — 27-bob</text>
  <text x="430" y="506" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Bitta repo, bitta zanjir: hech narsa qo'lda emas</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/></marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#16a34a"/></marker>
    <marker id="ary" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#f59e0b"/></marker>
  </defs>
</svg>
