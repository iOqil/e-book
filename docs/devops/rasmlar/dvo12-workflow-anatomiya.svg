<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 470" width="740" height="470">
  <title>GitHub Actions workflow anatomiyasi: tashqarida name va on, ichida jobs, jobs ichida bitta job runs-on bilan, job ichida steps va har step uses yoki run</title>
  <rect x="0" y="0" width="740" height="470" fill="#f8fafc"/>
  <text x="370" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Workflow anatomiyasi (.github/workflows/ci.yml)</text>

  <!-- Tashqi: workflow -->
  <rect x="30" y="52" width="680" height="396" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="48" y="78" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e40af">name: CI</text>

  <!-- on bloki -->
  <rect x="48" y="92" width="280" height="58" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="64" y="115" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#92400e">on: (qachon ishga tushadi)</text>
  <text x="64" y="138" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">push · pull_request · workflow_dispatch</text>

  <!-- jobs konteyner -->
  <rect x="48" y="164" width="644" height="266" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="64" y="188" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">jobs:</text>

  <!-- job: test -->
  <rect x="68" y="200" width="604" height="216" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="84" y="224" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">test:  (bitta job — alohida toza mashina)</text>
  <text x="84" y="247" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">runs-on: ubuntu-latest</text>
  <text x="84" y="268" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">steps:  (ketma-ket, bir fayl tizimi)</text>

  <!-- step 1: uses -->
  <rect x="88" y="280" width="564" height="30" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="102" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#5b21b6">- uses: actions/checkout@v6        (tayyor action)</text>

  <!-- step 2: uses -->
  <rect x="88" y="316" width="564" height="30" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="102" y="336" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#5b21b6">- uses: actions/setup-node@v6      (tayyor action)</text>

  <!-- step 3: run -->
  <rect x="88" y="352" width="564" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="102" y="372" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">- run: npm ci                       (shell buyrug'i)</text>

  <!-- step 4: run -->
  <rect x="88" y="388" width="564" height="22" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="102" y="404" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">- run: npm test                     (shell buyrug'i)</text>

  <!-- legenda -->
  <text x="370" y="462" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">workflow &gt; jobs &gt; job (runs-on + steps) &gt; step (uses yoki run)</text>
</svg>
