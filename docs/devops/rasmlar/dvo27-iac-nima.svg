<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430">
  <title>Qo'lda sozlash (snowflake) va Infrastructure as Code taqqoslovi: chapda inson har serverni qo'lda terib sozlaydi va natijada bir-biridan farq qiluvchi noyob serverlar hosil bo'ladi; o'ngda bitta kod fayli Git'da bir nechta bir xil serverni avtomatik yaratadi</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Qo'lda sozlash vs Infrastructure as Code</text>

  <!-- chap: qo'lda -->
  <rect x="24" y="54" width="344" height="352" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="196" y="82" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">Qo'lda sozlash ("snowflake")</text>

  <!-- inson -->
  <circle cx="70" cy="138" r="14" fill="#94a3b8"/>
  <text x="70" y="170" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">inson</text>
  <text x="70" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">qo'lda</text>

  <!-- strelkalar har serverga -->
  <line x1="92" y1="132" x2="150" y2="118" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="92" y1="142" x2="150" y2="200" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="92" y1="150" x2="150" y2="284" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 3 ta noyob server -->
  <rect x="156" y="100" width="190" height="46" rx="8" fill="#fde68a" stroke="#dc2626" stroke-width="1.5"/>
  <text x="251" y="121" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">Server A: nginx 1.27</text>
  <text x="251" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ufw: 80,443 (qaysidir...)</text>

  <rect x="156" y="184" width="190" height="46" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
  <text x="251" y="205" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">Server B: nginx 1.26</text>
  <text x="251" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ufw: 80 (443 unutilgan!)</text>

  <rect x="156" y="268" width="190" height="46" rx="8" fill="#fed7aa" stroke="#dc2626" stroke-width="1.5"/>
  <text x="251" y="289" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">Server C: nginx ???</text>
  <text x="251" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">hech kim eslamaydi</text>

  <text x="196" y="350" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#dc2626">Har biri NOYOB — farq qiladi</text>
  <text x="196" y="378" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">takrorlanmaydi, hujjatlanmaydi,</text>
  <text x="196" y="396" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">xatoga moyil</text>

  <!-- o'ng: IaC -->
  <rect x="392" y="54" width="344" height="352" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="564" y="82" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">Infrastructure as Code</text>

  <!-- kod fayl (Git) -->
  <rect x="416" y="104" width="150" height="92" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="491" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e40af">setup.yml</text>
  <text x="491" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">nginx: present</text>
  <text x="491" y="168" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">ufw: 80, 443</text>
  <text x="491" y="188" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">(Git'da, versiyalangan)</text>

  <!-- strelkalar har serverga -->
  <line x1="566" y1="135" x2="624" y2="124" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="566" y1="150" x2="624" y2="208" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="566" y1="165" x2="624" y2="292" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>

  <!-- 3 ta bir xil server -->
  <rect x="630" y="106" width="90" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="675" y="131" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#166534">Server 1</text>
  <rect x="630" y="190" width="90" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="675" y="215" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#166534">Server 2</text>
  <rect x="630" y="274" width="90" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="675" y="299" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#166534">Server 3</text>

  <text x="564" y="350" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#16a34a">Hammasi BIR XIL — aynan kod kabi</text>
  <text x="564" y="378" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">takrorlanadi, ko'rib chiqiladi,</text>
  <text x="564" y="396" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">idempotent</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
