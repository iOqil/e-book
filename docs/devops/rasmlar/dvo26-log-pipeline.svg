<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380">
  <title>Markazlashtirilgan log quvuri: bir nechta konteyner va ilova loglari collector (Promtail/Alloy) orqali yig'iladi, Loki saqlash bazasiga oqib boradi va Grafana'da bitta joydan qidiriladi</title>
  <rect x="0" y="0" width="760" height="380" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Markazlashtirilgan log quvuri</text>

  <!-- Manbalar: konteynerlar -->
  <text x="100" y="68" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#475569">Manbalar (loglar)</text>
  <rect x="30" y="82" width="140" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="100" y="103" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">vazifalar-api</text>
  <text x="100" y="121" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">konteyner</text>

  <rect x="30" y="142" width="140" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="100" y="163" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">nginx</text>
  <text x="100" y="181" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">konteyner</text>

  <rect x="30" y="202" width="140" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="100" y="223" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">postgres</text>
  <text x="100" y="241" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">konteyner</text>

  <!-- O'qlar manbalardan collectorga -->
  <line x1="170" y1="106" x2="250" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="170" y1="166" x2="250" y2="166" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="170" y1="226" x2="250" y2="172" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Collector -->
  <rect x="252" y="128" width="150" height="76" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="327" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#92400e">Collector</text>
  <text x="327" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Alloy / Promtail</text>
  <text x="327" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yig'adi + label qo'yadi</text>

  <!-- O'q collectordan Lokiga -->
  <line x1="402" y1="166" x2="482" y2="166" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrg)"/>
  <text x="442" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">push</text>

  <!-- Loki -->
  <rect x="484" y="128" width="130" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="549" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#166534">Loki</text>
  <text x="549" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">log saqlash</text>
  <text x="549" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(indekslangan)</text>

  <!-- O'q Lokidan Grafanaga -->
  <line x1="614" y1="166" x2="664" y2="166" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrb)"/>

  <!-- Grafana -->
  <rect x="610" y="232" width="120" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="670" y="258" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">Grafana</text>
  <text x="670" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">qidirish (LogQL)</text>

  <!-- Loki -> Grafana burchakli o'q -->
  <line x1="666" y1="204" x2="666" y2="232" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrb)"/>

  <!-- Pastki izoh -->
  <rect x="30" y="312" width="700" height="46" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="380" y="333" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#7c3aed">Foyda: 10 ta server / konteynerga SSH qilmasdan, BITTA joydan barcha loglarni qidirasiz</text>
  <text x="380" y="351" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">{job="vazifalar-api"} |= "error"  — labellar bo'yicha filtr + matn qidiruvi</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/></marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#16a34a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/></marker>
  </defs>
</svg>
