<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">
  <title>Backup va restore aylanasi: DB va volume cron orqali sanali backup faylga olinadi, 3-2-1 qoidasi bo'yicha bir nechta joyda saqlanadi, eski'lari retention bilan o'chiriladi va eng muhimi restore vaqti-vaqti bilan sinab ko'riladi</title>
  <rect x="0" y="0" width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Backup va restore aylanasi</text>

  <!-- 1: Manba -->
  <rect x="28" y="68" width="150" height="92" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="103" y="94" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">1. Manba</text>
  <text x="103" y="118" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">PostgreSQL DB</text>
  <text x="103" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">volume (fayllar)</text>

  <!-- o'q 1->2 -->
  <line x1="178" y1="114" x2="238" y2="114" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrb)"/>
  <text x="208" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">cron</text>

  <!-- 2: Backup -->
  <rect x="240" y="68" width="180" height="92" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="330" y="94" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#92400e">2. Backup (sanali)</text>
  <text x="330" y="118" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">pg_dump | gzip</text>
  <text x="330" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">db_2026-06-13.sql.gz</text>

  <!-- o'q 2->3 -->
  <line x1="420" y1="114" x2="480" y2="114" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arry)"/>

  <!-- 3: Saqlash 3-2-1 -->
  <rect x="482" y="68" width="250" height="92" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="607" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#166534">3. Saqlash (3-2-1)</text>
  <text x="607" y="114" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">3 nusxa, 2 xil joy,</text>
  <text x="607" y="134" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">1 off-site (boshqa shahar/bulut)</text>
  <text x="607" y="152" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">+ retention: eski'larni o'chir</text>

  <!-- 4: RESTORE TEST (eng muhim) -->
  <rect x="200" y="208" width="360" height="86" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="380" y="234" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">4. RESTORE'ni SINASH</text>
  <text x="380" y="258" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">gunzip -c db_...sql.gz | psql  ->  test bazaga</text>
  <text x="380" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#dc2626">Sinalmagan backup = backup EMAS</text>

  <!-- o'q saqlashdan restore testga -->
  <line x1="607" y1="160" x2="560" y2="226" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrr)"/>
  <text x="640" y="195" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">davriy tekshir</text>

  <!-- pastki izoh: nega kerak -->
  <rect x="28" y="316" width="704" height="66" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="380" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#7c3aed">Nega backup? DB buzilishi, tasodifan DROP/DELETE, ransomware, disk o'limi, inson xatosi.</text>
  <text x="380" y="364" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Backup mavjudligi yetarli emas — uni qaytara olishingizni davriy sinab ko'rgangacha ishonmang.</text>

  <defs>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/></marker>
    <marker id="arry" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#f59e0b"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#dc2626"/></marker>
  </defs>
</svg>
