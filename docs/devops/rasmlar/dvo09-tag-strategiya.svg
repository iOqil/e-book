<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" width="740" height="400">
  <title>Tag strategiyasi: bitta image ID uchta tag bilan belgilanadi - latest xavfli chunki o'zgaruvchan, 1.2.3 semver versiyani aniq aytadi, sha-a1b2c3d esa o'zgarmas immutable</title>
  <rect x="0" y="0" width="740" height="400" fill="#f8fafc"/>
  <text x="370" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Bitta image, uchta tag</text>

  <!-- the one image -->
  <rect x="270" y="64" width="200" height="74" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="370" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e40af">Image (bitta)</text>
  <text x="370" y="116" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">ID: 96cb7c4a2d7c</text>

  <!-- lines to three tags -->
  <line x1="320" y1="138" x2="150" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="370" y1="138" x2="370" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="420" y1="138" x2="590" y2="200" stroke="#94a3b8" stroke-width="2"/>

  <!-- latest -->
  <rect x="40" y="200" width="220" height="150" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="150" y="228" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#dc2626">:latest</text>
  <text x="150" y="254" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">O'zgaruvchan: har</text>
  <text x="150" y="272" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">push'da boshqa image'ga</text>
  <text x="150" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">ko'rsatadi</text>
  <text x="150" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#dc2626">Production'da xavfli</text>
  <text x="150" y="338" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">qaysi versiya ekani noaniq</text>

  <!-- semver -->
  <rect x="280" y="200" width="180" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="370" y="228" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#1e40af">:1.2.3</text>
  <text x="370" y="254" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Semver: versiyani</text>
  <text x="370" y="272" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">odamga tushunarli</text>
  <text x="370" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">aytadi</text>
  <text x="370" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e40af">Reliz uchun yaxshi</text>
  <text x="370" y="338" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">major.minor.patch</text>

  <!-- sha -->
  <rect x="480" y="200" width="220" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="590" y="228" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#166534">:sha-a1b2c3d</text>
  <text x="590" y="254" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Git commit SHA'si:</text>
  <text x="590" y="272" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">aynan qaysi koddan</text>
  <text x="590" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">qurilgani aniq</text>
  <text x="590" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#166534">Immutable, ideal</text>
  <text x="590" y="338" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">hech qachon o'zgarmaydi</text>

  <text x="370" y="384" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Tag &#8212; image'ga qo'yilgan yorliq, image'ning o'zi emas. Production'da o'zgarmas tag ishlat.</text>
</svg>
