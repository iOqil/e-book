<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440">
  <title>Kubernetes klaster arxitekturasi: control plane (kube-apiserver, etcd, kube-scheduler, controller-manager) worker node'lar (kubelet, kube-proxy, container runtime, podlar) ni boshqaradi va kubectl apiserver orqali gaplashadi degan diagramma</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <defs>
    <marker id="a21arb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="a21arg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1e293b">Kubernetes klaster arxitekturasi</text>

  <!-- kubectl -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="28" y="180" width="120" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="88" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">kubectl</text>
    <text x="88" y="231" text-anchor="middle" font-size="13" fill="#475569">(siz)</text>
  </g>
  <line x1="148" y1="215" x2="206" y2="180" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a21arb)"/>
  <text x="178" y="183" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e40af">API</text>

  <!-- CONTROL PLANE -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="210" y="62" width="300" height="316" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="360" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Control Plane</text>
    <text x="360" y="107" text-anchor="middle" font-size="13" fill="#475569">klaster miyasi — qaror qabul qiladi</text>

    <rect x="228" y="120" width="262" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="359" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">kube-apiserver</text>
    <text x="359" y="159" text-anchor="middle" font-size="13" fill="#475569">klaster eshigi — hamma shu yerga murojaat</text>

    <rect x="228" y="178" width="125" height="50" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="290" y="198" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7c3aed">etcd</text>
    <text x="290" y="216" text-anchor="middle" font-size="13" fill="#475569">holat bazasi</text>

    <rect x="363" y="178" width="127" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="426" y="198" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e40af">scheduler</text>
    <text x="426" y="216" text-anchor="middle" font-size="13" fill="#475569">pod -&gt; node</text>

    <rect x="228" y="236" width="262" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="359" y="256" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e40af">controller-manager</text>
    <text x="359" y="275" text-anchor="middle" font-size="13" fill="#475569">desired state'ni saqlovchi halqalar</text>

    <rect x="228" y="294" width="262" height="40" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/>
    <text x="359" y="319" text-anchor="middle" font-size="13" fill="#475569">cloud-controller-manager (bulutda)</text>
  </g>

  <!-- arrow control plane -> nodes -->
  <line x1="510" y1="215" x2="566" y2="180" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a21arg)"/>
  <text x="538" y="183" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#16a34a">buyruq</text>

  <!-- WORKER NODES -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="568" y="92" width="170" height="286" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="653" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">Worker Node</text>
    <text x="653" y="134" text-anchor="middle" font-size="13" fill="#475569">ish shu yerda bajariladi</text>

    <rect x="584" y="146" width="138" height="38" rx="5" fill="#fff" stroke="#16a34a" stroke-width="1.3"/>
    <text x="653" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">kubelet</text>

    <rect x="584" y="190" width="138" height="38" rx="5" fill="#fff" stroke="#16a34a" stroke-width="1.3"/>
    <text x="653" y="214" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">kube-proxy</text>

    <rect x="584" y="234" width="138" height="38" rx="5" fill="#fff" stroke="#16a34a" stroke-width="1.3"/>
    <text x="653" y="258" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">container runtime</text>

    <rect x="584" y="282" width="138" height="76" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="653" y="304" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e40af">Podlar</text>
    <text x="653" y="323" text-anchor="middle" font-size="13" fill="#475569">konteynerlaringiz</text>
    <text x="653" y="342" text-anchor="middle" font-size="13" fill="#475569">shu yerda ishlaydi</text>
  </g>

  <rect x="28" y="398" width="710" height="32" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="383" y="419" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">Control plane qaror qiladi, worker node'lar bajaradi; kubectl faqat apiserver bilan gaplashadi.</text>
</svg>
