<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">
  <title>systemd xizmat holat o'tishlari: inactive (dead) holatdan systemctl start bilan activating va active (running) ga; systemctl stop bilan inactive ga qaytadi; crash bo'lsa Restart siyosati activating ga qaytaradi; enable boot vaqtida avtomatik start ni ta'minlaydi</title>
  <rect x="0" y="0" width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Xizmat holat o'tishlari (systemctl)</text>

  <!-- inactive -->
  <rect x="40" y="150" width="170" height="80" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="125" y="183" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">inactive</text>
  <text x="125" y="205" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">(dead)</text>

  <!-- activating -->
  <rect x="295" y="150" width="170" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="183" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e40af">activating</text>
  <text x="380" y="205" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">ishga tushmoqda</text>

  <!-- active running -->
  <rect x="550" y="150" width="170" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="635" y="183" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#166534">active</text>
  <text x="635" y="205" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#166534">(running)</text>

  <!-- inactive -> activating: start -->
  <line x1="210" y1="178" x2="293" y2="178" stroke="#2563eb" stroke-width="2.5" marker-end="url(#strelb)"/>
  <text x="251" y="168" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e40af">start</text>

  <!-- activating -> active -->
  <line x1="465" y1="178" x2="548" y2="178" stroke="#16a34a" stroke-width="2.5" marker-end="url(#strelg)"/>
  <text x="506" y="168" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">ready</text>

  <!-- active -> inactive: stop (egri pastdan) -->
  <path d="M 590 230 Q 380 320 165 230" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#strelr)"/>
  <text x="380" y="305" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#dc2626">systemctl stop  -> inactive</text>

  <!-- active -> activating: crash/Restart (egri ustdan) -->
  <path d="M 600 150 Q 490 95 405 145" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#strely)"/>
  <text x="500" y="103" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#92400e">crash + Restart=on-failure</text>

  <!-- failed -->
  <rect x="295" y="300" width="170" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="380" y="330" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">failed</text>
  <text x="380" y="351" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">StartLimit oshib ketdi</text>

  <line x1="380" y1="230" x2="380" y2="298" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#strelr)"/>

  <!-- enable izohi -->
  <rect x="40" y="64" width="320" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="200" y="89" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#7c3aed">enable = boot'da avtomatik start</text>
  <text x="200" y="110" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">server yonganda systemd o'zi ishga tushiradi</text>
  <line x1="125" y1="124" x2="125" y2="148" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#strelp)"/>

  <defs>
    <marker id="strelb" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="strelg" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
    <marker id="strelr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/></marker>
    <marker id="strely" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f59e0b"/></marker>
    <marker id="strelp" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed"/></marker>
  </defs>
</svg>
