<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440">
  <title>Internet'dan kelgan HTTPS trafik Ingress Controller'ga tushadi, u host va path bo'yicha turli Service'larga marshrutlaydi, har Service o'z Pod'lariga yuboradi va TLS sertifikat Ingress darajasida tugatiladi degan diagramma</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <defs>
    <marker id="i24b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="i24g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <text x="380" y="30" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1e293b">Ingress: bitta eshik, ko'p ilova</text>

  <g font-family="Segoe UI, system-ui, sans-serif">
    <!-- Internet -->
    <rect x="28" y="180" width="120" height="74" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="88" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">Internet</text>
    <text x="88" y="231" text-anchor="middle" font-size="13" fill="#475569">foydalanuvchi</text>

    <line x1="148" y1="217" x2="204" y2="217" stroke="#2563eb" stroke-width="2.5" marker-end="url(#i24b)"/>
    <text x="176" y="207" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">HTTPS</text>

    <!-- Ingress Controller -->
    <rect x="206" y="150" width="148" height="134" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="280" y="176" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Ingress</text>
    <text x="280" y="195" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Controller</text>
    <text x="280" y="216" text-anchor="middle" font-size="13" fill="#475569">(nginx-ingress)</text>
    <rect x="222" y="228" width="116" height="44" rx="6" fill="#fff" stroke="#16a34a" stroke-width="1.4"/>
    <text x="280" y="246" text-anchor="middle" font-size="13" font-weight="600" fill="#16a34a">TLS tugatish</text>
    <text x="280" y="263" text-anchor="middle" font-size="13" fill="#475569">(sertifikat)</text>

    <!-- routing arrows -->
    <line x1="354" y1="180" x2="438" y2="92" stroke="#2563eb" stroke-width="2.3" marker-end="url(#i24b)"/>
    <text x="392" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">api.example.uz</text>

    <line x1="354" y1="217" x2="438" y2="217" stroke="#2563eb" stroke-width="2.3" marker-end="url(#i24b)"/>
    <text x="396" y="208" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">/admin</text>

    <line x1="354" y1="254" x2="438" y2="342" stroke="#2563eb" stroke-width="2.3" marker-end="url(#i24b)"/>
    <text x="392" y="322" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">/ (qolgani)</text>

    <!-- Services -->
    <rect x="440" y="62" width="150" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="515" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">api-service</text>
    <text x="515" y="104" text-anchor="middle" font-size="13" fill="#475569">Service</text>

    <rect x="440" y="189" width="150" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="515" y="211" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">admin-service</text>
    <text x="515" y="231" text-anchor="middle" font-size="13" fill="#475569">Service</text>

    <rect x="440" y="316" width="150" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="515" y="338" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">frontend-service</text>
    <text x="515" y="358" text-anchor="middle" font-size="13" fill="#475569">Service</text>

    <!-- Service -> Pods -->
    <line x1="590" y1="90" x2="640" y2="90" stroke="#16a34a" stroke-width="2.3" marker-end="url(#i24g)"/>
    <line x1="590" y1="217" x2="640" y2="217" stroke="#16a34a" stroke-width="2.3" marker-end="url(#i24g)"/>
    <line x1="590" y1="344" x2="640" y2="344" stroke="#16a34a" stroke-width="2.3" marker-end="url(#i24g)"/>

    <rect x="642" y="66" width="92" height="48" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="688" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">Pod'lar</text>
    <text x="688" y="105" text-anchor="middle" font-size="13" fill="#475569">api</text>

    <rect x="642" y="193" width="92" height="48" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="688" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">Pod'lar</text>
    <text x="688" y="232" text-anchor="middle" font-size="13" fill="#475569">admin</text>

    <rect x="642" y="320" width="92" height="48" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="688" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">Pod'lar</text>
    <text x="688" y="359" text-anchor="middle" font-size="13" fill="#475569">frontend</text>
  </g>

  <rect x="28" y="400" width="706" height="32" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="381" y="421" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">Bitta tashqi IP (Controller) host va path bo'yicha ko'p Service'ga marshrutlaydi; TLS markazda tugatiladi.</text>
</svg>
