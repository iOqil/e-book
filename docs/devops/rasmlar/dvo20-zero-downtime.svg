<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
  <title>Zero-downtime almashtirish bosqichlari: avval eski konteyner trafikni qabul qilib ishlayapti, keyin yangi konteyner ko'tariladi va healthcheck OK bo'lguncha kutiladi, so'ng trafik yangi konteynerga o'tadi, oxirida eski konteyner to'xtaydi</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Zero-downtime: eskini yangiga uzilishsiz almashtirish</text>

  <defs>
    <marker id="zd-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="zd-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="zd-blue" markerWidth="11" markerHeight="11" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- column headers -->
  <text x="135" y="74" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#1e40af">1. Eski ishlayapti</text>
  <text x="380" y="74" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#1e40af">2. Yangi + healthcheck</text>
  <text x="625" y="74" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#1e40af">3. Trafik o'tadi, eski o'chadi</text>

  <!-- ===== STAGE 1 ===== -->
  <text x="135" y="112" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#16a34a">Nginx</text>
  <circle cx="135" cy="128" r="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <line x1="135" y1="138" x2="135" y2="168" stroke="#16a34a" stroke-width="3" marker-end="url(#zd-green)"/>
  <rect x="70" y="172" width="130" height="74" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="135" y="200" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#166534">web (eski)</text>
  <text x="135" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">v1 — trafik OK</text>
  <text x="135" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">healthy</text>

  <!-- arrow stage1 -> stage2 -->
  <line x1="208" y1="210" x2="252" y2="210" stroke="#2563eb" stroke-width="3" marker-end="url(#zd-blue)"/>

  <!-- ===== STAGE 2 ===== -->
  <text x="380" y="112" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#16a34a">Nginx</text>
  <circle cx="380" cy="128" r="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <!-- still to old -->
  <line x1="372" y1="136" x2="320" y2="168" stroke="#16a34a" stroke-width="3" marker-end="url(#zd-green)"/>
  <!-- not yet to new (dashed gray) -->
  <line x1="388" y1="136" x2="440" y2="168" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#zd-gray)"/>

  <rect x="266" y="172" width="108" height="74" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="320" y="200" text-anchor="middle" font-family="Consolas, monospace" font-size="13.5" font-weight="bold" fill="#166534">web (eski)</text>
  <text x="320" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">trafik OK</text>
  <text x="320" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">healthy</text>

  <rect x="386" y="172" width="108" height="74" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="440" y="200" text-anchor="middle" font-family="Consolas, monospace" font-size="13.5" font-weight="bold" fill="#b45309">web (yangi)</text>
  <text x="440" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">v2 ko'tarildi</text>
  <text x="440" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#b45309">tekshirilyapti</text>

  <!-- arrow stage2 -> stage3 -->
  <line x1="502" y1="210" x2="538" y2="210" stroke="#2563eb" stroke-width="3" marker-end="url(#zd-blue)"/>

  <!-- ===== STAGE 3 ===== -->
  <text x="625" y="112" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#16a34a">Nginx</text>
  <circle cx="625" cy="128" r="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <!-- old now stopped (gray dashed) -->
  <line x1="617" y1="136" x2="568" y2="168" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#zd-gray)"/>
  <!-- new now live (green) -->
  <line x1="633" y1="136" x2="682" y2="168" stroke="#16a34a" stroke-width="3" marker-end="url(#zd-green)"/>

  <rect x="514" y="172" width="108" height="74" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="568" y="200" text-anchor="middle" font-family="Consolas, monospace" font-size="13.5" font-weight="bold" fill="#94a3b8">web (eski)</text>
  <text x="568" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">to'xtadi</text>
  <text x="568" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">olib tashlandi</text>

  <rect x="628" y="172" width="108" height="74" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="682" y="200" text-anchor="middle" font-family="Consolas, monospace" font-size="13.5" font-weight="bold" fill="#166534">web (yangi)</text>
  <text x="682" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">trafik OK</text>
  <text x="682" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">healthy</text>

  <!-- bottom note -->
  <rect x="120" y="300" width="520" height="86" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="326" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Asosiy g'oya: yangi tayyor BO'LGUNCHA eski o'chmaydi</text>
  <text x="380" y="350" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e40af">docker compose up -d --no-deps --build web</text>
  <text x="380" y="372" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Bir nechta replica + nginx upstream bilan uzilish nolga yaqinlashadi (23-bobda chuqur)</text>
</svg>
