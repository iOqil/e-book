<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <title>Incident boshqaruv halqasi: alert orqali incident aniqlanadi, runbook bo'yicha aniq qadamlar bajariladi (diagnostika va rollback), xizmat tiklanadi, so'ng blame-free post-mortem yoziladi va undan olingan saboq runbook'ni yangilaydi — shu bilan halqa yopiladi va keyingi safar tezroq tiklanadi</title>
  <rect x="0" y="0" width="800" height="420" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Incident -> runbook -> tiklash -> post-mortem -> saboq</text>

  <!-- 1 incident -->
  <rect x="300" y="58" width="200" height="74" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="400" y="86" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">1. Incident</text>
  <text x="400" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Alertmanager xabar:</text>
  <text x="400" y="126" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">"APIDown / 5xx oshdi"</text>

  <!-- arrow down-right to 2 -->
  <line x1="500" y1="95" x2="600" y2="135" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- 2 runbook action -->
  <rect x="560" y="150" width="210" height="96" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="665" y="176" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e40af">2. Runbook bo'yicha</text>
  <text x="665" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">logs/metrics ko'r (25-26)</text>
  <text x="665" y="216" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">aniq qadamlar -> rollback</text>
  <text x="665" y="234" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(oldingi :sha tag, 15)</text>

  <!-- arrow down to 3 -->
  <line x1="665" y1="246" x2="560" y2="320" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- 3 tiklash -->
  <rect x="300" y="300" width="200" height="74" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="328" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#166534">3. Tiklash</text>
  <text x="400" y="350" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">healthz yashil,</text>
  <text x="400" y="368" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">xizmat qayta ishlaydi</text>

  <!-- arrow left-up to 4 -->
  <line x1="300" y1="337" x2="200" y2="246" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- 4 post-mortem -->
  <rect x="30" y="150" width="210" height="96" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="135" y="176" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#7c3aed">4. Post-mortem</text>
  <text x="135" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">blame-free: nima -> sabab</text>
  <text x="135" y="216" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">-> tuzatish -> saboq</text>
  <text x="135" y="234" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">odamni emas, tizimni ayb</text>

  <!-- arrow up-right to 1 (close loop) -->
  <line x1="240" y1="170" x2="300" y2="105" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arp)"/>

  <!-- center saboq -->
  <rect x="320" y="178" width="160" height="64" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="204" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#92400e">Saboq -> runbook'ni</text>
  <text x="400" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#92400e">yangilaydi</text>

  <text x="400" y="404" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Halqa har aylanishda tizimni mustahkamroq qiladi: bir xato ikki marta og'ritmaydi</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/></marker>
    <marker id="arp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7c3aed"/></marker>
  </defs>
</svg>
