<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440">
  <title>Deployment ReplicaSet'ni boshqaradi, ReplicaSet esa uchta bir xil Pod'ni ushlab turadi; bir Pod o'lganda ReplicaSet uning o'rniga avtomatik yangi Pod yaratib replicas sonini saqlaydi - bu self-healing</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Deployment to ReplicaSet to Pod ierarxiyasi</text>

  <!-- Deployment -->
  <rect x="250" y="56" width="260" height="62" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="380" y="82" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Deployment (apps/v1)</text>
  <text x="380" y="104" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">replicas: 3</text>

  <!-- arrow Deployment -> ReplicaSet -->
  <line x1="380" y1="118" x2="380" y2="142" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue)"/>
  <text x="450" y="135" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e40af">yaratadi</text>

  <!-- ReplicaSet -->
  <rect x="230" y="146" width="300" height="62" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="380" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">ReplicaSet</text>
  <text x="380" y="194" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">3 nusxani doimo ushlab turadi</text>

  <!-- arrows ReplicaSet -> Pods -->
  <line x1="310" y1="208" x2="170" y2="262" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#purple)"/>
  <line x1="380" y1="208" x2="380" y2="262" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#purple)"/>
  <line x1="450" y1="208" x2="590" y2="262" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#purple)"/>

  <!-- Pod 1 -->
  <rect x="80" y="266" width="180" height="92" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="170" y="292" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Pod 1</text>
  <text x="170" y="313" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">Running</text>
  <text x="170" y="334" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">app: vazifalar</text>

  <!-- Pod 2 (dies) -->
  <rect x="290" y="266" width="180" height="92" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="380" y="292" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">Pod 2 (o'ldi)</text>
  <text x="380" y="313" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b91c1c">crash / node o'chdi</text>
  <text x="380" y="334" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">IP yo'qoldi</text>

  <!-- Pod 3 -->
  <rect x="500" y="266" width="180" height="92" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="590" y="292" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Pod 3</text>
  <text x="590" y="313" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">Running</text>
  <text x="590" y="334" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">app: vazifalar</text>

  <!-- self-healing arrow: ReplicaSet recreates pod 2 -->
  <path d="M 470 312 C 540 312, 560 380, 460 390 L 300 390" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#green)"/>
  <rect x="300" y="372" width="300" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="392" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#166534">Self-healing: yangi Pod 2' yaratiladi</text>
  <text x="450" y="412" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yangi nom + yangi IP, label o'sha: app: vazifalar</text>

  <defs>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
