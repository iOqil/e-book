<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <title>Linux fayl tizimi ierarxiyasi (FHS): ildiz slash dan etc, var, home, opt, usr, tmp, root shoxlari va har birining vazifasi</title>
  <rect x="0" y="0" width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1e293b">Linux fayl tizimi (FHS) — bitta daraxt</text>

  <!-- root node / -->
  <rect x="340" y="58" width="80" height="42" rx="8" fill="#2563eb"/>
  <text x="380" y="85" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff">/</text>
  <text x="430" y="84" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ildiz (root)</text>

  <!-- connector lines from / to children -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M380 100 L380 122 L110 122 L110 150"/>
    <path d="M218 122 L218 150"/>
    <path d="M326 122 L326 150"/>
    <path d="M434 122 L434 150"/>
    <path d="M542 122 L542 150"/>
    <path d="M650 122 L650 150"/>
    <path d="M380 100 L380 350"/>
  </g>

  <!-- child boxes row -->
  <!-- /etc -->
  <rect x="60" y="150" width="100" height="42" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="110" y="177" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e40af">/etc</text>
  <text x="110" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">sozlamalar</text>
  <text x="110" y="227" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(config)</text>

  <!-- /var -->
  <rect x="168" y="150" width="100" height="42" rx="7" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="218" y="177" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e293b">/var</text>
  <text x="218" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">log va</text>
  <text x="218" y="227" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ma'lumot</text>

  <!-- /home -->
  <rect x="276" y="150" width="100" height="42" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="326" y="177" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#16a34a">/home</text>
  <text x="326" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">foydalanuvchi</text>
  <text x="326" y="227" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">uy papkalari</text>

  <!-- /opt -->
  <rect x="384" y="150" width="100" height="42" rx="7" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="434" y="177" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e293b">/opt</text>
  <text x="434" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">qo'shimcha</text>
  <text x="434" y="227" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">dasturlar</text>

  <!-- /usr -->
  <rect x="492" y="150" width="100" height="42" rx="7" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="542" y="177" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e293b">/usr</text>
  <text x="542" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">buyruq va</text>
  <text x="542" y="227" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">kutubxonalar</text>

  <!-- /tmp -->
  <rect x="600" y="150" width="100" height="42" rx="7" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="650" y="177" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e293b">/tmp</text>
  <text x="650" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">vaqtinchalik</text>
  <text x="650" y="227" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">fayllar</text>

  <!-- second level under /var/log and /home/deploy -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M218 244 L218 278"/>
    <path d="M326 244 L326 278"/>
  </g>
  <rect x="158" y="278" width="120" height="40" rx="7" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="218" y="303" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#1e293b">/var/log</text>
  <rect x="270" y="278" width="160" height="40" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="350" y="303" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#16a34a">/home/deploy</text>

  <!-- /root note attached to / via long line -->
  <rect x="330" y="350" width="100" height="40" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="380" y="375" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#7c3aed">/root</text>
  <text x="442" y="367" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">root foydalanuvchining</text>
  <text x="442" y="384" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">uy papkasi (/home ichida emas)</text>

  <!-- legend -->
  <rect x="60" y="408" width="640" height="38" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="76" y="432" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Qoida: sozlama kerakmi -> /etc · log kerakmi -> /var/log · ilovam qayerda -> odatda /home yoki /opt</text>
</svg>
