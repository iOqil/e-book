<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
  <title>Service uch turining tashqi kirish bo'yicha farqi: ClusterIP faqat klaster ichidan ko'rinadi, NodePort har node'ning yuqori portini ochib tashqaridan kirish beradi, LoadBalancer cloud provayderdan tashqi IP olib eng to'liq tashqi kirishni ta'minlaydi</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Service turlari: tashqi kirish farqi</text>

  <!-- external user -->
  <rect x="300" y="56" width="160" height="48" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="380" y="78" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Tashqi foydalanuvchi</text>
  <text x="380" y="96" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(internetdan)</text>

  <!-- ===== ClusterIP column ===== -->
  <rect x="30" y="130" width="220" height="260" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="140" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e40af">ClusterIP (default)</text>
  <!-- cluster boundary -->
  <rect x="50" y="172" width="180" height="150" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="140" y="192" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e40af">klaster ichi</text>
  <rect x="74" y="204" width="132" height="40" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="229" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Service</text>
  <rect x="74" y="260" width="132" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="285" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">Pod'lar</text>
  <text x="140" y="345" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Faqat ichki aloqa</text>
  <text x="140" y="365" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">tashqaridan kirib bo'lmaydi</text>
  <!-- blocked arrow from external -->
  <line x1="340" y1="108" x2="200" y2="170" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="262" y1="130" x2="278" y2="146" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="278" y1="130" x2="262" y2="146" stroke="#dc2626" stroke-width="2.5"/>

  <!-- ===== NodePort column ===== -->
  <rect x="270" y="130" width="220" height="260" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="380" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#6d28d9">NodePort</text>
  <rect x="290" y="172" width="180" height="150" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,4"/>
  <!-- node port slot on boundary -->
  <rect x="338" y="166" width="84" height="22" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="182" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#92400e">:30080</text>
  <rect x="314" y="204" width="132" height="40" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="380" y="229" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Service</text>
  <rect x="314" y="260" width="132" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="285" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">Pod'lar</text>
  <text x="380" y="345" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">node-IP:30000-32767</text>
  <text x="380" y="365" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">tashqaridan kirish bor</text>
  <line x1="380" y1="104" x2="380" y2="164" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#purple)"/>

  <!-- ===== LoadBalancer column ===== -->
  <rect x="510" y="130" width="220" height="260" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="620" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#166534">LoadBalancer</text>
  <!-- cloud LB -->
  <rect x="548" y="166" width="144" height="30" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">cloud LB + tashqi IP</text>
  <rect x="530" y="208" width="180" height="114" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,4"/>
  <rect x="554" y="224" width="132" height="40" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="249" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Service</text>
  <rect x="554" y="276" width="132" height="36" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="299" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">Pod'lar</text>
  <text x="620" y="345" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">cloud bergan tashqi IP</text>
  <text x="620" y="365" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">to'liq tashqi kirish</text>
  <line x1="420" y1="86" x2="612" y2="164" stroke="#16a34a" stroke-width="2.5" marker-end="url(#green)"/>

  <text x="380" y="410" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">ClusterIP: ichki | NodePort: lokal/oddiy tashqi | LoadBalancer: cloud production</text>

  <defs>
    <marker id="purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
