<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">
  <title>Registry'dan docker pull bilan o'zgarmas image tortiladi, undan docker run bilan bir nechta ishlaydigan container tug'iladi degan image, container va registry oqimi diagrammasi</title>
  <rect x="0" y="0" width="760" height="400" fill="#f8fafc"/>
  <defs>
    <marker id="arrow06ic" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1e293b">Registry → Image → Container</text>

  <!-- REGISTRY -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="30" y="120" width="170" height="140" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="115" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">REGISTRY</text>
    <text x="115" y="170" text-anchor="middle" font-size="13" fill="#475569">image'lar ombori</text>
    <rect x="55" y="184" width="120" height="26" rx="4" fill="#fff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="115" y="202" text-anchor="middle" font-size="13" fill="#1e293b">Docker Hub</text>
    <rect x="55" y="216" width="120" height="26" rx="4" fill="#fff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="115" y="234" text-anchor="middle" font-size="13" fill="#1e293b">GHCR (ghcr.io)</text>
  </g>

  <!-- pull arrow -->
  <line x1="200" y1="190" x2="288" y2="190" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow06ic)"/>
  <text x="244" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#1e40af">docker pull</text>

  <!-- IMAGE (layers) -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="295" y="118" width="160" height="144" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="375" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">IMAGE</text>
    <text x="375" y="166" text-anchor="middle" font-size="13" fill="#475569">o'zgarmas shablon</text>
    <text x="375" y="183" text-anchor="middle" font-size="13" fill="#475569">("retsept" / class)</text>
    <!-- layer stack -->
    <rect x="320" y="194" width="110" height="18" rx="2" fill="#fff" stroke="#2563eb" stroke-width="1"/>
    <text x="375" y="207" text-anchor="middle" font-size="13" fill="#1e293b">kod</text>
    <rect x="320" y="214" width="110" height="18" rx="2" fill="#fff" stroke="#2563eb" stroke-width="1"/>
    <text x="375" y="227" text-anchor="middle" font-size="13" fill="#1e293b">kutubxonalar</text>
    <rect x="320" y="234" width="110" height="18" rx="2" fill="#fff" stroke="#2563eb" stroke-width="1"/>
    <text x="375" y="247" text-anchor="middle" font-size="13" fill="#1e293b">asos OS</text>
  </g>

  <!-- run arrow -->
  <line x1="455" y1="190" x2="543" y2="190" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow06ic)"/>
  <text x="499" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#1e40af">docker run</text>

  <!-- CONTAINERS (3 instances) -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="550" y="100" width="160" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="630" y="121" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e293b">container 1</text>
    <text x="630" y="137" text-anchor="middle" font-size="13" fill="#16a34a">ishlaydi</text>

    <rect x="550" y="168" width="160" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="630" y="189" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e293b">container 2</text>
    <text x="630" y="205" text-anchor="middle" font-size="13" fill="#16a34a">ishlaydi</text>

    <rect x="550" y="236" width="160" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="630" y="257" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e293b">container 3</text>
    <text x="630" y="273" text-anchor="middle" font-size="13" fill="#16a34a">ishlaydi</text>

    <text x="630" y="300" text-anchor="middle" font-size="13" fill="#475569">("taom" / object — nusxalar)</text>
  </g>

  <!-- bottom note -->
  <rect x="30" y="330" width="680" height="48" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="370" y="352" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Image bitta va o'zgarmas; undan istalgancha container ishga tushirish mumkin.</text>
  <text x="370" y="371" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Bir retseptdan ko'p taom: container = image'ning ishlaydigan jonli nusxasi.</text>
</svg>
