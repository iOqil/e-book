<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">
  <title>Service selector app: vazifalar label'iga ega Pod'larni topadi: ikkita vazifalar Pod'i selectorga mos kelib trafik oladi, app: boshqa label'li Pod esa mos kelmaydi va Service uni chetda qoldiradi</title>
  <rect x="0" y="0" width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Label va selector: K8s'ning bog'lash mexanizmi</text>

  <!-- Service box -->
  <rect x="40" y="120" width="210" height="150" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="145" y="152" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Service</text>
  <rect x="60" y="168" width="170" height="84" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="145" y="190" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#166534">selector:</text>
  <text x="145" y="212" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">app: vazifalar</text>
  <text x="145" y="238" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e40af">"shu yorliqni top"</text>

  <!-- Pod 1 matches -->
  <rect x="370" y="60" width="200" height="78" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="470" y="86" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Pod A</text>
  <rect x="388" y="98" width="164" height="28" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="470" y="117" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#166534">app: vazifalar</text>

  <!-- Pod 2 matches -->
  <rect x="370" y="160" width="200" height="78" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="470" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Pod B</text>
  <rect x="388" y="198" width="164" height="28" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="470" y="217" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#166534">app: vazifalar</text>

  <!-- Pod 3 no match -->
  <rect x="370" y="260" width="200" height="78" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="470" y="286" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#64748b">Pod C</text>
  <rect x="388" y="298" width="164" height="28" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="470" y="317" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#64748b">app: boshqa</text>

  <!-- arrows match (green) -->
  <line x1="250" y1="180" x2="364" y2="99" stroke="#16a34a" stroke-width="3" marker-end="url(#green)"/>
  <line x1="250" y1="195" x2="364" y2="199" stroke="#16a34a" stroke-width="3" marker-end="url(#green)"/>
  <text x="312" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">mos: trafik</text>

  <!-- arrow no match (gray, crossed) -->
  <line x1="250" y1="225" x2="364" y2="295" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5,4"/>
  <text x="318" y="270" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">mos emas: o'tkazib yuboriladi</text>
  <line x1="300" y1="248" x2="316" y2="264" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="316" y1="248" x2="300" y2="264" stroke="#dc2626" stroke-width="2.5"/>

  <!-- footer note -->
  <rect x="120" y="356" width="520" height="34" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="378" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">Bog'lanish IP yoki nom orqali emas - label orqali (Pod o'lib qaytsa ham label o'sha)</text>

  <defs>
    <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
