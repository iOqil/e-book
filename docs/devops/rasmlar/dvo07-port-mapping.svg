<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380">
  <title>Port mapping: brauzer host mashinaning 8080-portiga so'rov yuboradi, -p 8080:80 buyrug'i uni konteyner ichidagi 80-portga yo'naltiradi</title>
  <rect x="0" y="0" width="760" height="380" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Port mapping: -p 8080:80</text>

  <!-- browser -->
  <rect x="30" y="120" width="150" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="105" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e40af">Brauzer</text>
  <text x="105" y="184" text-anchor="middle" font-family="Consolas, monospace" font-size="13.5" fill="#1e293b">localhost</text>
  <text x="105" y="202" text-anchor="middle" font-family="Consolas, monospace" font-size="13.5" fill="#1e293b">:8080</text>

  <!-- host machine -->
  <rect x="250" y="80" width="480" height="220" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="270" y="106" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#475569">Host mashina (sizning kompyuter / server)</text>

  <!-- host port -->
  <rect x="280" y="130" width="120" height="80" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="340" y="162" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e293b">Host port</text>
  <text x="340" y="188" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#b45309">8080</text>

  <!-- container -->
  <rect x="500" y="120" width="200" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#166534">Konteyner (nginx)</text>
  <rect x="540" y="160" width="120" height="62" rx="8" fill="#16a34a"/>
  <text x="600" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#ffffff">Konteyner port</text>
  <text x="600" y="208" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#ffffff">80</text>

  <!-- arrow browser -> host port -->
  <line x1="180" y1="170" x2="278" y2="170" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)"/>
  <!-- arrow host port -> container -->
  <line x1="400" y1="170" x2="538" y2="180" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arr)"/>

  <text x="455" y="158" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#b45309">-p 8080:80</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <text x="380" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">host:konteyner &#8212; chap raqam tashqaridan kiriladigan port, o'ng raqam konteyner ichidagi port</text>
  <text x="380" y="360" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">-p bo'lmasa konteyner port tashqaridan ko'rinmaydi</text>
</svg>
