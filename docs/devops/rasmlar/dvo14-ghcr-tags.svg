<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 410" width="740" height="410">
  <title>GHCR tag generatsiyasi: bitta qurilgan image metadata-action orqali uchta tag oladi - git commit'dan sha-a1b2c3d immutable, git tag'dan 1.2.3 semver va faqat main branch'da latest</title>
  <rect x="0" y="0" width="740" height="410" fill="#f8fafc"/>
  <text x="370" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">metadata-action: tag'larni avtomatik yasaydi</text>

  <!-- built image -->
  <rect x="270" y="62" width="200" height="68" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="370" y="89" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e40af">Qurilgan image</text>
  <text x="370" y="112" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">ID: 96cb7c4a2d7c</text>

  <!-- metadata-action -->
  <rect x="255" y="155" width="230" height="56" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="370" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#5b21b6">docker/metadata-action</text>
  <text x="370" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">kontekstdan tag hisoblaydi</text>
  <line x1="370" y1="130" x2="370" y2="155" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- three tag lines -->
  <line x1="300" y1="211" x2="150" y2="250" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="370" y1="211" x2="370" y2="250" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="440" y1="211" x2="590" y2="250" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- sha tag -->
  <rect x="40" y="255" width="220" height="118" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="150" y="282" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#166534">:sha-a1b2c3d</text>
  <text x="150" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">git commit SHA'sidan</text>
  <text x="150" y="326" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">type=sha</text>
  <text x="150" y="356" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#166534">immutable</text>

  <!-- semver tag -->
  <rect x="280" y="255" width="180" height="118" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="370" y="282" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#1e40af">:1.2.3</text>
  <text x="370" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">git tag v1.2.3 dan</text>
  <text x="370" y="326" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">type=semver</text>
  <text x="370" y="356" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e40af">reliz uchun</text>

  <!-- latest tag -->
  <rect x="480" y="255" width="220" height="118" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="590" y="282" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#b45309">:latest</text>
  <text x="590" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">FAQAT main branch'da</text>
  <text x="590" y="326" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">enable={{is_default_branch}}</text>
  <text x="590" y="356" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#b45309">mutable, qulaylik</text>

  <text x="370" y="397" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Uchala tag bitta image'ga ishora qiladi &#8212; hammasi bir build, GHCR'da bir Image ID.</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/></marker>
  </defs>
</svg>
