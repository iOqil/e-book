<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="Segoe UI, system-ui, sans-serif">
  <title>Dev jamoasi va Ops jamoasi orasidagi devor: avval kod devor osha uloqtiriladi va muammolar chiqadi, DevOps esa devorni hamkorlik ko'prigiga aylantiradi</title>
  <rect x="0" y="0" width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Dev va Ops orasidagi devor — va DevOps ko'prigi</text>

  <!-- AVVAL: yuqori qism -->
  <text x="380" y="66" font-size="15" font-weight="bold" fill="#475569" text-anchor="middle">AVVAL: ajralgan ikki dunyo</text>

  <!-- Dev quti -->
  <rect x="40" y="86" width="220" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="116" font-size="17" font-weight="bold" fill="#1e40af" text-anchor="middle">Dev (ishlab chiqish)</text>
  <text x="150" y="142" font-size="13" fill="#1e293b" text-anchor="middle">kod yozadi, yangilik qo'shadi</text>
  <text x="150" y="164" font-size="13" fill="#1e293b" text-anchor="middle">maqsad: tezroq o'zgarish</text>
  <text x="150" y="190" font-size="13.5" font-weight="bold" fill="#2563eb" text-anchor="middle">"menda ishlaydi-ku"</text>

  <!-- Ops quti -->
  <rect x="500" y="86" width="220" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="610" y="116" font-size="17" font-weight="bold" fill="#15803d" text-anchor="middle">Ops (ekspluatatsiya)</text>
  <text x="610" y="142" font-size="13" fill="#1e293b" text-anchor="middle">serverni ushlab turadi</text>
  <text x="610" y="164" font-size="13" fill="#1e293b" text-anchor="middle">maqsad: barqarorlik</text>
  <text x="610" y="190" font-size="13.5" font-weight="bold" fill="#16a34a" text-anchor="middle">"o'zgarish = xavf"</text>

  <!-- DEVOR -->
  <rect x="350" y="80" width="60" height="140" fill="#94a3b8"/>
  <rect x="350" y="80" width="60" height="20" fill="#64748b"/>
  <rect x="350" y="120" width="60" height="20" fill="#64748b"/>
  <rect x="350" y="160" width="60" height="20" fill="#64748b"/>
  <rect x="350" y="200" width="60" height="20" fill="#64748b"/>
  <text x="380" y="155" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" transform="rotate(-90 380 155)">DEVOR</text>

  <!-- kod uloqtirilishi: Dev -> devor -->
  <defs>
    <marker id="ar" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <path d="M262,120 C300,100 330,100 348,118" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="305" y="96" font-size="13" fill="#dc2626" text-anchor="middle">kod "devor osha"</text>

  <!-- muammolar matni pastda -->
  <text x="380" y="246" font-size="13.5" fill="#dc2626" text-anchor="middle">Natija: sekin qo'lda reliz · tungi deploy qo'rquvi · ayblash madaniyati</text>

  <!-- ajratuvchi chiziq -->
  <line x1="40" y1="270" x2="720" y2="270" stroke="#e2e8f0" stroke-width="2"/>

  <!-- KEYIN: DevOps ko'prik -->
  <text x="380" y="300" font-size="15" font-weight="bold" fill="#475569" text-anchor="middle">DEVOPS: bitta jamoa, ko'prik</text>

  <!-- Dev quti 2 -->
  <rect x="40" y="320" width="180" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="352" font-size="16" font-weight="bold" fill="#1e40af" text-anchor="middle">Dev</text>
  <text x="130" y="378" font-size="13" fill="#1e293b" text-anchor="middle">kod + javobgarlik</text>

  <!-- Ops quti 2 -->
  <rect x="540" y="320" width="180" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="630" y="352" font-size="16" font-weight="bold" fill="#15803d" text-anchor="middle">Ops</text>
  <text x="630" y="378" font-size="13" fill="#1e293b" text-anchor="middle">barqarorlik + bilim</text>

  <!-- ko'prik -->
  <rect x="232" y="345" width="296" height="42" rx="21" fill="#7c3aed"/>
  <text x="380" y="372" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">DevOps: hamkorlik + avtomatlashtirish</text>

  <!-- ikki tomonlama strelkalar -->
  <defs>
    <marker id="arp" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <line x1="232" y1="366" x2="222" y2="366" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arp)"/>
  <line x1="528" y1="366" x2="538" y2="366" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arp)"/>

  <text x="380" y="432" font-size="13.5" fill="#15803d" text-anchor="middle">Natija: tez-tez kichik deploy · avtomatik test/build · aybsiz post-mortem</text>
</svg>
