<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380">
  <title>Uzluksiz deploy zanjiri: dasturchi git commit qiladi, GitHub Actions ishga tushadi (test -> build -> GHCR'ga push), so'ng avtomatik deploy bo'ladi va ilova ishga tushadi, monitoring esa uni doimo kuzatib turadi — har qadam avtomatik, qo'l aralashuvisiz</title>
  <rect x="0" y="0" width="820" height="380" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Uzluksiz zanjir: git commit -> ishlaydigan production</text>

  <!-- 1 commit -->
  <rect x="30" y="70" width="150" height="78" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="105" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e40af">1. git commit</text>
  <text x="105" y="120" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">git push origin</text>
  <text x="105" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">main</text>

  <line x1="180" y1="109" x2="222" y2="109" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- 2 Actions box with 3 sub steps -->
  <rect x="222" y="58" width="372" height="102" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="408" y="80" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#92400e">2. GitHub Actions (avtomatik)</text>
  <rect x="236" y="92" width="106" height="54" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="289" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#166534">test</text>
  <text x="289" y="135" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">lint+matrix</text>
  <rect x="350" y="92" width="106" height="54" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="403" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#166534">build</text>
  <text x="403" y="135" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">image+Trivy</text>
  <rect x="464" y="92" width="116" height="54" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="522" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#166534">push GHCR</text>
  <text x="522" y="135" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">:sha tag</text>
  <line x1="342" y1="119" x2="349" y2="119" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="456" y1="119" x2="463" y2="119" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>

  <line x1="594" y1="109" x2="636" y2="109" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- 3 deploy -->
  <rect x="636" y="70" width="154" height="78" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="713" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#7c3aed">3. deploy</text>
  <text x="713" y="120" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">VPS pull / k8s</text>
  <text x="713" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">set image</text>

  <!-- down to 4 -->
  <line x1="713" y1="148" x2="713" y2="210" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- 4 running -->
  <rect x="600" y="214" width="190" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="695" y="242" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#166534">4. ishga tushadi</text>
  <text x="695" y="264" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">healthz OK -></text>
  <text x="695" y="282" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">eski versiya almashtiriladi</text>

  <line x1="600" y1="252" x2="430" y2="252" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- 5 monitoring -->
  <rect x="200" y="214" width="220" height="76" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="310" y="242" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#92400e">5. monitoring kuzatadi</text>
  <text x="310" y="264" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Prometheus /metrics</text>
  <text x="310" y="282" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">muammo bo'lsa -> alert</text>

  <!-- feedback loop arrow monitoring -> commit -->
  <line x1="200" y1="252" x2="105" y2="252" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="105" y1="252" x2="105" y2="148" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="105" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">alert -> tuzatish -></text>
  <text x="105" y="218" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">yangi commit</text>

  <text x="410" y="338" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Har qadam avtomatik. Inson faqat kod yozadi va alert kelganda aralashadi.</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/></marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#dc2626"/></marker>
  </defs>
</svg>
