<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440">
  <title>docker run -d -p 8080:80 --name web nginx buyrugining anatomiyasi: har bir bayroq alohida izoh bilan ko'rsatilgan</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">docker run buyrug'i anatomiyasi</text>

  <!-- command line -->
  <rect x="30" y="56" width="700" height="48" rx="8" fill="#1e293b"/>
  <text x="44" y="86" font-family="Consolas, monospace" font-size="15" fill="#dcfce7">docker run </text>
  <text x="148" y="86" font-family="Consolas, monospace" font-size="15" fill="#93c5fd">-d </text>
  <text x="180" y="86" font-family="Consolas, monospace" font-size="15" fill="#fcd34d">-p 8080:80 </text>
  <text x="304" y="86" font-family="Consolas, monospace" font-size="15" fill="#86efac">--name web </text>
  <text x="436" y="86" font-family="Consolas, monospace" font-size="15" fill="#f9a8d4">nginx</text>

  <!-- d -->
  <rect x="30" y="130" width="335" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="48" y="155" font-family="Consolas, monospace" font-size="14.5" font-weight="bold" fill="#1e40af">-d</text>
  <text x="48" y="176" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">detached &#8212; fonda ishlaydi,</text>
  <text x="48" y="192" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">terminal bo'sh qoladi</text>

  <!-- p -->
  <rect x="395" y="130" width="335" height="64" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="413" y="155" font-family="Consolas, monospace" font-size="14.5" font-weight="bold" fill="#1e293b">-p 8080:80</text>
  <text x="413" y="176" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">port: host 8080 &#8594; konteyner 80,</text>
  <text x="413" y="192" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">tashqaridan kirish ochiladi</text>

  <!-- name -->
  <rect x="30" y="210" width="335" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="48" y="235" font-family="Consolas, monospace" font-size="14.5" font-weight="bold" fill="#166534">--name web</text>
  <text x="48" y="256" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">qulay nom beradi (ID o'rniga</text>
  <text x="48" y="272" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">shu nom bilan murojaat)</text>

  <!-- image -->
  <rect x="395" y="210" width="335" height="64" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="413" y="235" font-family="Consolas, monospace" font-size="14.5" font-weight="bold" fill="#6d28d9">nginx</text>
  <text x="413" y="256" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">image nomi &#8212; nimadan konteyner</text>
  <text x="413" y="272" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">yaratiladi (yo'q bo'lsa pull qiladi)</text>

  <!-- extra flags row -->
  <rect x="30" y="300" width="700" height="100" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="48" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#1e293b">Boshqa tez-tez ishlatiladigan bayroqlar</text>
  <text x="48" y="348" font-family="Consolas, monospace" font-size="13.5" fill="#1e293b">-it</text>
  <text x="120" y="348" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">interaktiv terminal (shell ochish uchun)</text>
  <text x="48" y="368" font-family="Consolas, monospace" font-size="13.5" fill="#1e293b">--rm</text>
  <text x="120" y="368" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">to'xtagach konteynerni avtomatik o'chiradi</text>
  <text x="48" y="388" font-family="Consolas, monospace" font-size="13.5" fill="#1e293b">-e KEY=val</text>
  <text x="200" y="388" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">environment o'zgaruvchi   |   -v vol:/yo'l  volume ulash</text>

  <text x="380" y="424" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Tartib: docker run [BAYROQLAR] IMAGE [BUYRUQ] &#8212; bayroqlar image nomidan oldin keladi</text>
</svg>
