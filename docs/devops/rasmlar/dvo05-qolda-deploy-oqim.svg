<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380">
  <title>Ilovani qo'lda serverga joylash bosqichlari: lokal kompyuterdan SSH orqali serverga, Node o'rnatish, kodni olib borish, npm install, node app.js va port 3000 ni tekshirish</title>
  <rect x="0" y="0" width="760" height="380" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Qo'lda deploy: lokaldan serverga 6 qadam</text>

  <!-- Lokal kompyuter -->
  <rect x="30" y="70" width="190" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="125" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e40af">Lokal kompyuter</text>
  <text x="125" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">app.js + package.json</text>
  <text x="125" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">git push (kod GitHub'da)</text>
  <text x="125" y="168" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">node app.js -> ishladi</text>

  <!-- Strelka 1: ssh -->
  <line x1="220" y1="125" x2="300" y2="125" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#strel)"/>
  <text x="260" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ssh</text>

  <!-- Server -->
  <rect x="300" y="70" width="430" height="280" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="515" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">VPS server (Ubuntu)</text>

  <!-- Qadam 1 -->
  <rect x="320" y="116" width="180" height="46" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="410" y="135" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e40af">1. Node o'rnatish</text>
  <text x="410" y="153" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">nodesource / nvm</text>

  <!-- Qadam 2 -->
  <rect x="530" y="116" width="180" height="46" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="620" y="135" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e40af">2. Kodni olib borish</text>
  <text x="620" y="153" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">git clone / rsync</text>

  <!-- Qadam 3 -->
  <rect x="320" y="186" width="180" height="46" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="410" y="205" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e40af">3. Bog'liqlik</text>
  <text x="410" y="223" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">npm install</text>

  <!-- Qadam 4 -->
  <rect x="530" y="186" width="180" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="620" y="205" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#166534">4. Ishga tushirish</text>
  <text x="620" y="223" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">node app.js</text>

  <!-- Qadam 5 -->
  <rect x="320" y="256" width="180" height="46" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="410" y="275" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#92400e">5. Port ochish</text>
  <text x="410" y="293" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ufw allow 3000</text>

  <!-- Qadam 6 -->
  <rect x="530" y="256" width="180" height="46" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="620" y="275" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e40af">6. Tekshirish</text>
  <text x="620" y="293" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">curl :3000/tasks</text>

  <!-- ichki strelkalar -->
  <line x1="500" y1="139" x2="528" y2="139" stroke="#94a3b8" stroke-width="2" marker-end="url(#strel)"/>
  <line x1="620" y1="162" x2="410" y2="184" stroke="#94a3b8" stroke-width="2" marker-end="url(#strel)"/>
  <line x1="500" y1="209" x2="528" y2="209" stroke="#94a3b8" stroke-width="2" marker-end="url(#strel)"/>
  <line x1="620" y1="232" x2="410" y2="254" stroke="#94a3b8" stroke-width="2" marker-end="url(#strel)"/>
  <line x1="500" y1="279" x2="528" y2="279" stroke="#94a3b8" stroke-width="2" marker-end="url(#strel)"/>

  <text x="515" y="334" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">Har qadam QO'LDA — terminal yopilsa ilova to'xtaydi</text>

  <defs>
    <marker id="strel" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
