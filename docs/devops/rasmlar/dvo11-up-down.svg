<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380">
  <title>docker compose up -d butun stackni ko'taradi (tarmoq, volume, konteynerlar), down esa to'xtatib o'chiradi; down -v volume'ni ham o'chiradi degan lifecycle</title>
  <rect x="0" y="0" width="760" height="380" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">up va down — stack lifecycle'i</text>

  <defs>
    <marker id="udup" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="uddown" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- chap: yo'q holat -->
  <rect x="40" y="150" width="170" height="86" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="125" y="184" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#475569">bo'sh holat</text>
  <text x="125" y="206" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">konteyner yo'q</text>
  <text x="125" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tarmoq yo'q</text>

  <!-- o'ng: ishlayotgan stack -->
  <rect x="550" y="120" width="180" height="146" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="640" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#166534">ishlayotgan stack</text>
  <rect x="568" y="158" width="144" height="26" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="640" y="176" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e40af">web (Up)</text>
  <rect x="568" y="190" width="144" height="26" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="640" y="208" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#166534">db (healthy)</text>
  <rect x="568" y="222" width="144" height="26" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="640" y="240" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#991b1b">cache (healthy)</text>
  <text x="640" y="262" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">+ tarmoq + volume</text>

  <!-- up oqi (yuqorida) -->
  <path d="M212 150 C 340 70, 430 70, 548 130" fill="none" stroke="#16a34a" stroke-width="3.5" marker-end="url(#udup)"/>
  <rect x="318" y="64" width="160" height="30" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="398" y="84" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#166534">docker compose up -d</text>
  <text x="398" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tarmoq + volume + konteynerlar (to'g'ri tartibda)</text>

  <!-- down oqi (pastda) -->
  <path d="M548 256 C 430 320, 340 320, 214 236" fill="none" stroke="#dc2626" stroke-width="3.5" marker-end="url(#uddown)"/>
  <rect x="330" y="296" width="136" height="30" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="398" y="316" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#991b1b">docker compose down</text>
  <text x="398" y="346" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">konteyner + tarmoqni o'chiradi · volume QOLADI</text>

  <!-- down -v izoh -->
  <rect x="40" y="262" width="170" height="74" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="125" y="286" text-anchor="middle" font-family="Consolas, monospace" font-size="13.5" font-weight="bold" fill="#b45309">down -v</text>
  <text x="125" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">volume'ni HAM o'chiradi</text>
  <text x="125" y="324" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">ma'lumot yo'qoladi!</text>
</svg>
