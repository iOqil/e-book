<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
  <title>Docker image CI oqimi: git push GitHub Actions'ni ishga tushiradi, runner kodni checkout qiladi, Buildx'ni sozlaydi, image'ni quradi, Trivy bilan zaiflikka skanerlaydi va toza bo'lsa GHCR registry'ga push qiladi</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Bitta git push &#8594; tayyor image GHCR'da</text>

  <!-- trigger -->
  <rect x="40" y="70" width="160" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="120" y="96" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#5b21b6">git push / release</text>
  <text x="120" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">trigger (on:)</text>

  <text x="270" y="105" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">GitHub</text>
  <text x="270" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Actions</text>
  <line x1="200" y1="100" x2="330" y2="100" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- runner box -->
  <rect x="40" y="160" width="680" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60" y="185" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#475569">ubuntu-latest runner (avtomatik bosqichlar)</text>

  <!-- step 1 checkout -->
  <rect x="60" y="205" width="115" height="80" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="117" y="237" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">checkout</text>
  <text x="117" y="258" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">kodni olish</text>

  <!-- step 2 buildx -->
  <rect x="190" y="205" width="115" height="80" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="247" y="237" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">buildx</text>
  <text x="247" y="258" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">builder</text>

  <!-- step 3 build -->
  <rect x="320" y="205" width="115" height="80" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="377" y="237" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">build</text>
  <text x="377" y="258" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">image qurish</text>

  <!-- step 4 trivy -->
  <rect x="450" y="205" width="115" height="80" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="507" y="237" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">Trivy skan</text>
  <text x="507" y="258" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">gate (CVE)</text>

  <!-- step 5 push -->
  <rect x="580" y="205" width="120" height="80" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="640" y="237" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#166534">push</text>
  <text x="640" y="258" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">toza bo'lsa</text>

  <!-- inner arrows -->
  <line x1="175" y1="245" x2="190" y2="245" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="305" y1="245" x2="320" y2="245" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="435" y1="245" x2="450" y2="245" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="565" y1="245" x2="580" y2="245" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ghcr target -->
  <rect x="280" y="340" width="200" height="60" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="2.5"/>
  <text x="380" y="366" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">GHCR registry</text>
  <text x="380" y="388" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">ghcr.io/owner/image</text>
  <line x1="640" y1="285" x2="640" y2="370" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="640" y1="370" x2="482" y2="370" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrg)"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/></marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/></marker>
  </defs>
</svg>
