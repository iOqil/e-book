<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" width="740" height="360">
  <title>Namuna vazifalar API arxitekturasi: klient (brauzer yoki curl) HTTP so'rovi Express ilovasiga keladi, express.json middleware so'rov tanasini o'qiydi, marshrutlar GET va POST tasks ni qayta ishlaydi, vazifalar xotiradagi massivda saqlanadi</title>
  <rect x="0" y="0" width="740" height="360" fill="#f8fafc"/>
  <text x="370" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Namuna ilova: vazifalar (todo) REST API</text>

  <!-- Klient -->
  <rect x="30" y="120" width="150" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="105" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e40af">Klient</text>
  <text x="105" y="184" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">brauzer / curl</text>
  <text x="105" y="206" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">HTTP so'rov</text>

  <!-- strelka so'rov -->
  <line x1="180" y1="160" x2="244" y2="160" stroke="#2563eb" stroke-width="2.5" marker-end="url(#b2)"/>
  <text x="212" y="151" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">so'rov</text>
  <!-- strelka javob -->
  <line x1="244" y1="195" x2="180" y2="195" stroke="#16a34a" stroke-width="2.5" marker-end="url(#b3)"/>
  <text x="212" y="216" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">JSON javob</text>

  <!-- Express ilova quti -->
  <rect x="248" y="70" width="460" height="230" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="478" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Express ilova (node app.js, port 3000)</text>

  <!-- middleware -->
  <rect x="272" y="116" width="412" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="478" y="143" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#92400e">express.json() — so'rov tanasini req.body ga o'qiydi</text>

  <!-- marshrutlar -->
  <rect x="272" y="172" width="200" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="372" y="193" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e40af">GET /tasks</text>
  <text x="372" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ro'yxatni qaytaradi</text>

  <rect x="484" y="172" width="200" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="584" y="193" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e40af">POST /tasks</text>
  <text x="584" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yangi vazifa qo'shadi</text>

  <!-- xotira -->
  <rect x="272" y="228" width="412" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="478" y="250" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#5b21b6">Xotiradagi massiv (vazifalar[])</text>
  <text x="478" y="269" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">server qayta ishga tushsa — yo'qoladi (keyin DB)</text>

  <!-- ichki strelkalar -->
  <line x1="372" y1="160" x2="372" y2="170" stroke="#94a3b8" stroke-width="2" marker-end="url(#b2)"/>
  <line x1="584" y1="160" x2="584" y2="170" stroke="#94a3b8" stroke-width="2" marker-end="url(#b2)"/>
  <line x1="372" y1="216" x2="372" y2="226" stroke="#94a3b8" stroke-width="2" marker-end="url(#b2)"/>
  <line x1="584" y1="216" x2="584" y2="226" stroke="#94a3b8" stroke-width="2" marker-end="url(#b2)"/>

  <text x="370" y="332" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Kichik, lekin haqiqiy ilova — kitob bo'ylab shu API'ni deploy qilamiz</text>

  <defs>
    <marker id="b2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
    <marker id="b3" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
