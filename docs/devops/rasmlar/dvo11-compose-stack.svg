<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440">
  <title>compose.yaml fayli butun stackni tasvirlaydi: web, db va cache servislari bitta avtomatik tarmoqda, db named volume bilan, faqat web tashqariga publish qilingan</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Bitta compose.yaml — butun stack</text>

  <defs>
    <marker id="csarr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="csvol" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- compose.yaml fayl -->
  <rect x="30" y="56" width="180" height="120" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="120" y="84" text-anchor="middle" font-family="Consolas, monospace" font-size="14.5" font-weight="bold" fill="#7c3aed">compose.yaml</text>
  <text x="120" y="108" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">services:</text>
  <text x="120" y="128" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">web / db / cache</text>
  <text x="120" y="152" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">deklarativ tavsif</text>
  <text x="120" y="170" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#16a34a">up -d</text>

  <line x1="210" y1="116" x2="266" y2="116" stroke="#2563eb" stroke-width="3" marker-end="url(#csarr)"/>

  <!-- avtomatik tarmoq qutisi -->
  <rect x="272" y="62" width="458" height="240" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="292" y="86" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e40af">proyekt_default — avtomatik tarmoq (ichki DNS)</text>

  <!-- web servis -->
  <rect x="296" y="104" width="170" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="381" y="130" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#1e40af">web</text>
  <text x="381" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">build: .  (Node)</text>
  <text x="381" y="170" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">port 8080-&gt;3000</text>

  <!-- db servis -->
  <rect x="296" y="200" width="170" height="80" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="381" y="226" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#166534">db</text>
  <text x="381" y="246" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">postgres:16-alpine</text>
  <text x="381" y="266" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ichki, publish yo'q</text>

  <!-- cache servis -->
  <rect x="536" y="200" width="170" height="80" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="621" y="226" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#991b1b">cache</text>
  <text x="621" y="246" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">redis:7-alpine</text>
  <text x="621" y="266" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ichki, publish yo'q</text>

  <!-- web -> db (nom bilan) -->
  <line x1="381" y1="184" x2="381" y2="196" stroke="#2563eb" stroke-width="3" marker-end="url(#csarr)"/>
  <text x="396" y="195" font-family="Consolas, monospace" font-size="13" fill="#1e40af">db</text>
  <!-- web -> cache (nom bilan) -->
  <line x1="466" y1="150" x2="600" y2="200" stroke="#2563eb" stroke-width="3" marker-end="url(#csarr)"/>
  <text x="540" y="168" font-family="Consolas, monospace" font-size="13" fill="#1e40af">cache</text>

  <!-- named volume -->
  <rect x="536" y="104" width="170" height="64" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="621" y="130" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#b45309">db-data</text>
  <text x="621" y="152" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">named volume (doimiy)</text>
  <line x1="466" y1="232" x2="536" y2="150" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#csvol)"/>

  <!-- tashqi foydalanuvchi -->
  <text x="381" y="334" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e293b">brauzer / curl  →  localhost:8080  (faqat web tashqariga ochiq)</text>
  <line x1="381" y1="312" x2="381" y2="190" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>

  <text x="380" y="372" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Compose tarmoqni, DNS'ni va volume'ni AVTOMATIK yaratadi — qo'lda docker run yo'q</text>
  <text x="380" y="398" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#16a34a">web ulanadi:  postgres://db:5432  ·  redis://cache:6379   (NOM bilan, IP emas)</text>
  <text x="380" y="422" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">db va cache faqat ichki tarmoqda — tashqaridan ko'rinmaydi (xavfsiz)</text>
</svg>
