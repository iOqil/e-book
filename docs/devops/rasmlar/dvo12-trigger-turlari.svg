<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 380" width="740" height="380">
  <title>GitHub Actions trigger turlari: push, pull_request, workflow_dispatch (qo'lda tugma) va schedule (cron) workflow'ni ishga tushiradi</title>
  <rect x="0" y="0" width="740" height="380" fill="#f8fafc"/>
  <text x="370" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">on: workflow'ni nima ishga tushiradi</text>

  <!-- push -->
  <rect x="40" y="64" width="300" height="118" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="92" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e40af">push</text>
  <text x="60" y="120" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Repoga kod yuborilganda</text>
  <text x="60" y="142" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">(git push). Eng keng tarqalgan.</text>
  <text x="60" y="166" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">branches: [main]</text>

  <!-- pull_request -->
  <rect x="400" y="64" width="300" height="118" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="420" y="92" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#166534">pull_request</text>
  <text x="420" y="120" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">PR ochilganda yoki</text>
  <text x="420" y="142" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">yangilanganda. Qo'shishdan</text>
  <text x="420" y="164" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">oldin tekshiradi.</text>

  <!-- workflow_dispatch -->
  <rect x="40" y="202" width="300" height="118" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="60" y="230" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#92400e">workflow_dispatch</text>
  <text x="60" y="258" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Actions tab'idan QO'LDA</text>
  <text x="60" y="280" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">tugma bilan ishga tushirish.</text>
  <text x="60" y="304" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">deploy uchun zo'r</text>

  <!-- schedule -->
  <rect x="400" y="202" width="300" height="118" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="420" y="230" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#5b21b6">schedule</text>
  <text x="420" y="258" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Vaqt jadvali (cron) bo'yicha.</text>
  <text x="420" y="280" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Tungi audit, backup uchun.</text>
  <text x="420" y="304" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">cron: '0 3 * * *' (UTC)</text>

  <!-- arrowlar markazga -->
  <text x="370" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#dc2626">Bir workflow'da bir nechta trigger bo'lishi mumkin</text>
</svg>
