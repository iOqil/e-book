<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
  <title>ufw firewall server portlari: 22, 80, 443 ochiq, qolgan portlar bloklangan</title>
  <rect width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="36" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">ufw firewall: faqat kerakli portlar ochiq</text>

  <!-- Internet (chap) -->
  <rect x="30" y="150" width="150" height="110" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="105" y="195" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e40af" text-anchor="middle">Internet</text>
  <text x="105" y="220" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">so'rovlar +</text>
  <text x="105" y="238" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">botlar</text>

  <!-- arrow internet -> firewall -->
  <line x1="180" y1="205" x2="240" y2="205" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="240,199 252,205 240,211" fill="#94a3b8"/>

  <!-- Firewall wall -->
  <rect x="255" y="70" width="90" height="280" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="300" y="100" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">ufw</text>
  <text x="300" y="120" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#92400e" text-anchor="middle">qo'riqchi</text>
  <text x="300" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#92400e" text-anchor="middle">default</text>
  <text x="300" y="338" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#92400e" text-anchor="middle">deny in</text>

  <!-- Server (o'ng) -->
  <rect x="470" y="60" width="260" height="300" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="600" y="92" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Server (public IP)</text>

  <!-- ochiq portlar -->
  <rect x="495" y="110" width="210" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="515" y="137" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">22  SSH      ALLOW</text>
  <rect x="495" y="160" width="210" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="515" y="187" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">80  HTTP     ALLOW</text>
  <rect x="495" y="210" width="210" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="515" y="237" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">443 HTTPS    ALLOW</text>

  <!-- bloklangan portlar -->
  <rect x="495" y="262" width="210" height="38" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="515" y="287" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">5432 Postgres  DENY</text>
  <rect x="495" y="306" width="210" height="38" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="515" y="331" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">6379 Redis     DENY</text>

  <!-- ruxsat etilgan oqim (yashil strelka) -->
  <line x1="345" y1="150" x2="490" y2="150" stroke="#16a34a" stroke-width="3"/>
  <polygon points="490,144 502,150 490,156" fill="#16a34a"/>
  <text x="418" y="142" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">o'tadi</text>

  <!-- bloklangan oqim (qizil X) -->
  <line x1="345" y1="285" x2="478" y2="285" stroke="#dc2626" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="486" y="278" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#dc2626" text-anchor="middle">X</text>
  <text x="412" y="277" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">to'siladi</text>

  <!-- pastki izoh -->
  <text x="380" y="398" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569" text-anchor="middle">Qoida: default deny incoming, so'ng faqat 22/80/443 ni alohida allow qilamiz.</text>
</svg>
