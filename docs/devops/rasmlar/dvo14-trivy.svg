<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 420" width="740" height="420">
  <title>Trivy zaiflik gate'i: qurilgan image Trivy bilan skanerlanadi, CVE hisoboti severity bo'yicha chiqadi, agar CRITICAL yoki HIGH topilsa pipeline to'xtaydi va push bo'lmaydi, toza bo'lsa GHCR'ga push qilinadi</title>
  <rect x="0" y="0" width="740" height="420" fill="#f8fafc"/>
  <text x="370" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Trivy gate: skan o'tmasa, push yo'q</text>

  <!-- image -->
  <rect x="40" y="160" width="140" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="110" y="190" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">Qurilgan</text>
  <text x="110" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">image</text>

  <!-- trivy -->
  <rect x="230" y="155" width="150" height="80" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="305" y="185" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b45309">Trivy skan</text>
  <text x="305" y="207" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">paketlarni CVE</text>
  <text x="305" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">bazasi bilan solishtirish</text>
  <line x1="180" y1="195" x2="230" y2="195" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- report -->
  <rect x="430" y="148" width="270" height="94" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="445" y="172" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#475569">CVE hisobot (namuna)</text>
  <text x="445" y="194" font-family="Consolas, monospace" font-size="13" fill="#dc2626">CRITICAL: 0</text>
  <text x="445" y="213" font-family="Consolas, monospace" font-size="13" fill="#b45309">HIGH: 2</text>
  <text x="445" y="232" font-family="Consolas, monospace" font-size="13" fill="#475569">MEDIUM / LOW: ...</text>
  <line x1="380" y1="195" x2="430" y2="195" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- gate decision -->
  <text x="305" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">gate: severity = CRITICAL, HIGH ?</text>
  <line x1="305" y1="235" x2="305" y2="258" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- fail branch -->
  <rect x="60" y="305" width="280" height="90" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="200" y="332" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">topildi &#8594; exit-code 1</text>
  <text x="200" y="356" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">pipeline to'xtaydi</text>
  <text x="200" y="376" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#dc2626">PUSH BO'LMAYDI</text>
  <line x1="250" y1="290" x2="200" y2="305" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- pass branch -->
  <rect x="400" y="305" width="280" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="540" y="332" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#166534">toza &#8594; davom</text>
  <text x="540" y="356" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">SARIF Security'ga</text>
  <text x="540" y="376" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#166534">GHCR'ga PUSH</text>
  <line x1="360" y1="290" x2="540" y2="305" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arg)"/>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/></marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/></marker>
  </defs>
</svg>
