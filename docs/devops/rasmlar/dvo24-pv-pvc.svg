<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
  <title>Pod PersistentVolumeClaim (talab) orqali PersistentVolume (haqiqiy hajm) ga ulanadi, PV esa bulutdagi yoki node'dagi haqiqiy diskka bog'lanadi, StorageClass esa PVC kelganda PV'ni avtomatik yaratadi (dynamic provisioning) degan diagramma</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <defs>
    <marker id="p24b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="p24v" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1e293b">Pod -&gt; PVC -&gt; PV -&gt; haqiqiy disk</text>

  <g font-family="Segoe UI, system-ui, sans-serif">
    <!-- Pod -->
    <rect x="36" y="150" width="140" height="86" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="106" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">Pod</text>
    <text x="106" y="203" text-anchor="middle" font-size="13" fill="#475569">ilova ishlaydi</text>
    <text x="106" y="221" text-anchor="middle" font-size="13" fill="#475569">(ephemeral)</text>

    <line x1="176" y1="193" x2="232" y2="193" stroke="#2563eb" stroke-width="2.5" marker-end="url(#p24b)"/>
    <text x="204" y="183" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">volume</text>

    <!-- PVC -->
    <rect x="234" y="150" width="150" height="86" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="309" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">PVC</text>
    <text x="309" y="200" text-anchor="middle" font-size="13" fill="#475569">talab: 5Gi</text>
    <text x="309" y="218" text-anchor="middle" font-size="13" fill="#475569">ReadWriteOnce</text>

    <line x1="384" y1="193" x2="440" y2="193" stroke="#2563eb" stroke-width="2.5" marker-end="url(#p24b)"/>
    <text x="412" y="183" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">bind</text>

    <!-- PV -->
    <rect x="442" y="150" width="150" height="86" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="517" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">PV</text>
    <text x="517" y="200" text-anchor="middle" font-size="13" fill="#475569">haqiqiy hajm</text>
    <text x="517" y="218" text-anchor="middle" font-size="13" fill="#475569">5Gi</text>

    <line x1="592" y1="193" x2="648" y2="193" stroke="#2563eb" stroke-width="2.5" marker-end="url(#p24b)"/>

    <!-- Disk -->
    <rect x="650" y="150" width="84" height="86" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <text x="692" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Disk</text>
    <text x="692" y="200" text-anchor="middle" font-size="13" fill="#475569">cloud /</text>
    <text x="692" y="218" text-anchor="middle" font-size="13" fill="#475569">node disk</text>

    <!-- StorageClass: dynamic provisioning -->
    <rect x="234" y="296" width="358" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="413" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed">StorageClass</text>
    <text x="413" y="343" text-anchor="middle" font-size="13" fill="#475569">PVC kelganda PV'ni avtomatik yaratadi</text>
    <text x="413" y="361" text-anchor="middle" font-size="13" fill="#475569">(dynamic provisioning)</text>

    <line x1="309" y1="296" x2="309" y2="240" stroke="#7c3aed" stroke-width="2.3" stroke-dasharray="5,4" marker-end="url(#p24v)"/>
    <line x1="517" y1="240" x2="517" y2="296" stroke="#7c3aed" stroke-width="2.3" stroke-dasharray="5,4" marker-end="url(#p24v)"/>
    <text x="600" y="280" text-anchor="middle" font-size="13" font-weight="600" fill="#7c3aed">PV yaratadi</text>
  </g>

  <rect x="36" y="62" width="698" height="64" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="385" y="86" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">Pod ephemeral (o'chsa ichidagi ma'lumot yo'qoladi); PVC orqali ulangan PV esa Pod umridan uzoq yashaydi.</text>
  <text x="385" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Pod faqat PVC (talab) yozadi; StorageClass haqiqiy diskni va PV'ni o'zi tayyorlaydi.</text>
</svg>
