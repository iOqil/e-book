<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" font-family="Segoe UI, system-ui, sans-serif">
  <title>Model narx/qobiliyat narvoni: Haiku ($1/$5 oddiy/tez) -> Sonnet ($3/$15 muvozanat) -> Opus ($5/$25 qiyin fikrlash) -> Fable ($10/$50 eng qiyin); router g'oyasi: arzon modeldan boshla, kerak bo'lsa Opusga ko'tar</title>
  <defs>
    <marker id="ar14b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="480" fill="#f8fafc"/>
  <text x="400" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Qaysi vazifaga qaysi model? — narx/qobiliyat narvoni</text>
  <text x="400" y="58" font-size="14" fill="#64748b" text-anchor="middle">Narx $ / 1M token (kirish / chiqish). Pastdan yuqoriga: arzon+tez → qimmat+kuchli</text>

  <!-- Haiku -->
  <rect x="80" y="370" width="640" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="100" y="398" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="start">Haiku 4.5</text>
  <text x="100" y="420" font-size="13" fill="#475569" text-anchor="start">tasniflash, marshrutlash, oddiy + ko'p hajmli</text>
  <text x="700" y="398" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="end">$1 / $5</text>
  <text x="700" y="420" font-size="13" fill="#475569" text-anchor="end">eng arzon · 200K kontekst</text>

  <!-- Sonnet -->
  <rect x="80" y="294" width="640" height="64" rx="10" fill="#dbeafe" stroke="#0ea5e9" stroke-width="2.5"/>
  <text x="100" y="322" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="start">Sonnet 4.6</text>
  <text x="100" y="344" font-size="13" fill="#475569" text-anchor="start">muvozanatli — tezlik + aql; ko'p ishlab chiqarish</text>
  <text x="700" y="322" font-size="15" font-weight="bold" fill="#0ea5e9" text-anchor="end">$3 / $15</text>
  <text x="700" y="344" font-size="13" fill="#475569" text-anchor="end">1M kontekst</text>

  <!-- Opus -->
  <rect x="80" y="218" width="640" height="64" rx="10" fill="#fef3c7" stroke="#d97757" stroke-width="2.5"/>
  <text x="100" y="246" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="start">Opus 4.8 (standart)</text>
  <text x="100" y="268" font-size="13" fill="#475569" text-anchor="start">qiyin fikrlash, agentlar, uzoq vazifalar</text>
  <text x="700" y="246" font-size="15" font-weight="bold" fill="#d97757" text-anchor="end">$5 / $25</text>
  <text x="700" y="268" font-size="13" fill="#475569" text-anchor="end">1M kontekst</text>

  <!-- Fable -->
  <rect x="80" y="142" width="640" height="64" rx="10" fill="#e0e7ff" stroke="#9333ea" stroke-width="2.5"/>
  <text x="100" y="170" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="start">Fable 5</text>
  <text x="100" y="192" font-size="13" fill="#475569" text-anchor="start">eng qiyin masalalar — eng kuchli</text>
  <text x="700" y="170" font-size="15" font-weight="bold" fill="#9333ea" text-anchor="end">$10 / $50</text>
  <text x="700" y="192" font-size="13" fill="#475569" text-anchor="end">1M kontekst</text>

  <!-- router idea on the left arrow -->
  <line x1="48" y1="402" x2="48" y2="150" stroke="#9333ea" stroke-width="3" marker-end="url(#ar14b)"/>
  <text x="40" y="120" font-size="13.5" font-weight="bold" fill="#9333ea" text-anchor="middle">qobiliyat ↑</text>
  <text x="40" y="100" font-size="13.5" font-weight="bold" fill="#9333ea" text-anchor="middle">narx ↑</text>

  <!-- router callout -->
  <rect x="80" y="446" width="640" height="26" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="400" y="464" font-size="13.5" fill="#1e293b" text-anchor="middle">Router naqshi: avval arzon model bilan urin, FAQAT kerak bo'lganda Opus/Fable ga ko'tar</text>
</svg>
