<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>API holatsiz (stateless): suhbat eslab qolinishi uchun har chaqiruvda butun tarix qayta yuboriladi</title>
  <defs>
    <marker id="s1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="470" fill="#f8fafc"/>
  <text x="400" y="32" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">API HOLATSIZ — model hech narsani eslamaydi</text>
  <text x="400" y="56" font-size="14" fill="#64748b" text-anchor="middle">Suhbat bo'lishi uchun tarixni SIZ saqlaysiz va har safar HAMMASINI yuborasiz</text>

  <!-- Call 1 -->
  <text x="195" y="92" font-size="15" font-weight="bold" fill="#d97757" text-anchor="middle">1-chaqiruv</text>
  <rect x="40" y="104" width="310" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="52" y="116" width="286" height="40" rx="6" fill="#dbeafe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="66" y="135" font-size="13" font-weight="bold" fill="#0ea5e9" text-anchor="start">user</text>
  <text x="66" y="151" font-size="13" fill="#1e293b" text-anchor="start">"Mening ismim Aziz."</text>

  <line x1="355" y1="136" x2="420" y2="136" stroke="#6366f1" stroke-width="2.5" marker-end="url(#s1)"/>
  <rect x="425" y="110" width="150" height="56" rx="12" fill="#6366f1"/>
  <text x="500" y="135" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Model</text>
  <text x="500" y="154" font-size="13" fill="#e0e7ff" text-anchor="middle">(xotirasiz)</text>
  <line x1="578" y1="136" x2="645" y2="136" stroke="#6366f1" stroke-width="2.5" marker-end="url(#s1)"/>
  <rect x="650" y="114" width="120" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="662" y="133" font-size="13" font-weight="bold" fill="#6366f1" text-anchor="start">assistant</text>
  <text x="662" y="150" font-size="13" fill="#1e293b" text-anchor="start">"Salom, Aziz!"</text>

  <!-- Call 2 -->
  <text x="195" y="232" font-size="15" font-weight="bold" fill="#d97757" text-anchor="middle">2-chaqiruv — tarixni QAYTA yuborasiz</text>
  <rect x="40" y="244" width="320" height="150" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="52" y="256" width="296" height="34" rx="6" fill="#dbeafe" stroke="#0ea5e9" stroke-width="1.2"/>
  <text x="66" y="278" font-size="13" fill="#1e293b" text-anchor="start"><tspan font-weight="bold" fill="#0ea5e9">user</tspan>  "Mening ismim Aziz."</text>
  <rect x="52" y="296" width="296" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="66" y="318" font-size="13" fill="#1e293b" text-anchor="start"><tspan font-weight="bold" fill="#6366f1">assistant</tspan>  "Salom, Aziz!"</text>
  <rect x="52" y="336" width="296" height="34" rx="6" fill="#dbeafe" stroke="#0ea5e9" stroke-width="1.2"/>
  <text x="66" y="358" font-size="13" fill="#1e293b" text-anchor="start"><tspan font-weight="bold" fill="#0ea5e9">user</tspan>  "Ismim nima edi?"</text>
  <text x="200" y="386" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">↑ BUTUN tarix bir massivda</text>

  <line x1="365" y1="318" x2="420" y2="318" stroke="#6366f1" stroke-width="2.5" marker-end="url(#s1)"/>
  <rect x="425" y="290" width="150" height="56" rx="12" fill="#6366f1"/>
  <text x="500" y="315" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Model</text>
  <text x="500" y="334" font-size="13" fill="#e0e7ff" text-anchor="middle">(xotirasiz)</text>
  <line x1="578" y1="318" x2="645" y2="318" stroke="#6366f1" stroke-width="2.5" marker-end="url(#s1)"/>
  <rect x="650" y="296" width="125" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="662" y="315" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">assistant</text>
  <text x="662" y="332" font-size="13" fill="#1e293b" text-anchor="start">"Sizning ismingiz Aziz."</text>

  <text x="400" y="432" font-size="14" fill="#475569" text-anchor="middle" font-weight="bold">Analogiya: har chaqiruv — yangi xodim. U faqat siz qo'liga bergan qog'ozni biladi.</text>
  <text x="400" y="454" font-size="13" fill="#ef4444" text-anchor="middle">Tarixni yubormasangiz, model "Aziz" ni bilmaydi — har gal noldan boshlaydi.</text>
</svg>
