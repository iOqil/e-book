<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Segoe UI, system-ui, sans-serif">
  <title>AI SDK tool loop: generateText({ tools, stopWhen: stepCountIs(5) }) chaqirilganda SDK siklni o'zi aylantiradi — model tool so'raydi, SDK execute funksiyangizni ishlatadi, natijani modelga qaytaradi, stopWhen gacha takrorlaydi. Siz faqat boshlanish va yakuniy text + steps ni ko'rasiz; sikl SDK ichida yashiringan.</title>
  <defs>
    <marker id="t12" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="500" fill="#f8fafc"/>
  <text x="400" y="32" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Tool loop'ni AI SDK O'ZI aylantiradi</text>
  <text x="400" y="56" font-size="14" fill="#64748b" text-anchor="middle">07-bobdagi qo'lda while(true) endi generateText ichida yashiringan</text>

  <!-- 1: you call (top) -->
  <rect x="250" y="80" width="300" height="62" rx="12" fill="#dbeafe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="400" y="105" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">1. Siz chaqirasiz</text>
  <text x="400" y="128" font-size="13" fill="#475569" text-anchor="middle" font-family="Consolas, monospace">generateText({ tools, stopWhen })</text>

  <!-- arrow into SDK box -->
  <line x1="400" y1="142" x2="400" y2="172" stroke="#64748b" stroke-width="2" marker-end="url(#t12)"/>

  <!-- SDK boundary box -->
  <rect x="120" y="176" width="560" height="216" rx="14" fill="#ffffff" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="140" y="200" font-size="14" font-weight="bold" fill="#6366f1" text-anchor="start">AI SDK ichida (sikl avtomatik)</text>

  <!-- model node -->
  <rect x="150" y="220" width="200" height="76" rx="10" fill="#1e293b"/>
  <text x="250" y="248" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Model o'ylaydi</text>
  <text x="250" y="270" font-size="13" fill="#94a3b8" text-anchor="middle">tool kerakmi?</text>
  <text x="250" y="288" font-size="13" fill="#94a3b8" text-anchor="middle">weather(city) so'raydi</text>

  <!-- execute node -->
  <rect x="450" y="220" width="200" height="76" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="550" y="248" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="middle">execute() ishlaydi</text>
  <text x="550" y="270" font-size="13" fill="#1e293b" text-anchor="middle">SIZNING funksiyangiz</text>
  <text x="550" y="288" font-size="13" fill="#475569" text-anchor="middle">SDK uni o'zi chaqiradi</text>

  <!-- arrow model -> execute -->
  <line x1="350" y1="246" x2="450" y2="246" stroke="#64748b" stroke-width="2" marker-end="url(#t12)"/>
  <text x="400" y="238" font-size="13" fill="#64748b" text-anchor="middle">tool-call</text>

  <!-- result node -->
  <rect x="450" y="320" width="200" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="550" y="345" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">natija (result)</text>
  <text x="550" y="365" font-size="13" fill="#475569" text-anchor="middle">"Tokioda quyoshli"</text>

  <!-- arrow execute -> result -->
  <line x1="550" y1="296" x2="550" y2="320" stroke="#64748b" stroke-width="2" marker-end="url(#t12)"/>

  <!-- arrow result -> model (loop back) -->
  <line x1="450" y1="348" x2="250" y2="348" stroke="#64748b" stroke-width="2"/>
  <line x1="250" y1="348" x2="250" y2="296" stroke="#64748b" stroke-width="2" marker-end="url(#t12)"/>
  <text x="350" y="368" font-size="13" fill="#64748b" text-anchor="middle">natijani modelga qaytaradi</text>

  <!-- loop limit badge -->
  <rect x="150" y="358" width="200" height="24" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="250" y="375" font-size="13" fill="#6366f1" text-anchor="middle">stopWhen: stepCountIs(5)</text>

  <!-- arrow out to final -->
  <line x1="400" y1="392" x2="400" y2="420" stroke="#16a34a" stroke-width="2.5" marker-end="url(#t12)"/>
  <text x="486" y="410" font-size="13" fill="#16a34a" text-anchor="middle">tool kerakmas -&gt; tugadi</text>

  <!-- final result -->
  <rect x="200" y="424" width="400" height="58" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="449" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">2. Natija: { text, steps }</text>
  <text x="400" y="471" font-size="13" fill="#475569" text-anchor="middle">yakuniy javob + har bir qadam tarixi</text>
</svg>
