<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Effort — modelning qancha kuch sarflashini boshqaradigan "sozlagich": low -> medium -> high (standart) -> xhigh -> max. O'ngga surilgan sari intellekt/sifat ham, token/narx/kechikish ham oshadi. Har bosqich uchun "qachon ishlatish" yorlig'i.</title>
  <defs>
    <marker id="a10e" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <linearGradient id="g10e" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="800" height="470" fill="#f8fafc"/>
  <text x="400" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">effort — model qancha "kuch" sarflasin? sozlagichi</text>
  <text x="400" y="58" font-size="14" fill="#64748b" text-anchor="middle">output_config: { effort: "low" | "medium" | "high" | "xhigh" | "max" }</text>

  <!-- dial track -->
  <rect x="70" y="120" width="660" height="14" rx="7" fill="url(#g10e)"/>

  <!-- ticks + labels -->
  <!-- low -->
  <circle cx="100" cy="127" r="11" fill="#ffffff" stroke="#0ea5e9" stroke-width="3"/>
  <text x="100" y="106" font-size="15" font-weight="bold" fill="#0ea5e9" text-anchor="middle">low</text>
  <!-- medium -->
  <circle cx="255" cy="127" r="11" fill="#ffffff" stroke="#6366f1" stroke-width="3"/>
  <text x="255" y="106" font-size="15" font-weight="bold" fill="#6366f1" text-anchor="middle">medium</text>
  <!-- high (default) -->
  <circle cx="410" cy="127" r="13" fill="#6366f1" stroke="#1e293b" stroke-width="3"/>
  <text x="410" y="103" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">high</text>
  <text x="410" y="88" font-size="13" fill="#16a34a" text-anchor="middle">⬅ STANDART</text>
  <!-- xhigh -->
  <circle cx="565" cy="127" r="11" fill="#ffffff" stroke="#9333ea" stroke-width="3"/>
  <text x="565" y="106" font-size="15" font-weight="bold" fill="#9333ea" text-anchor="middle">xhigh</text>
  <!-- max -->
  <circle cx="700" cy="127" r="11" fill="#ffffff" stroke="#9333ea" stroke-width="3"/>
  <text x="700" y="106" font-size="15" font-weight="bold" fill="#9333ea" text-anchor="middle">max</text>

  <!-- rising axes -->
  <line x1="70" y1="172" x2="730" y2="172" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a10e)"/>
  <text x="76" y="192" font-size="13.5" fill="#16a34a" text-anchor="start" font-weight="bold">⬆ intellekt / sifat oshadi</text>

  <line x1="70" y1="210" x2="730" y2="210" stroke="#ef4444" stroke-width="2.5" marker-end="url(#a10e)"/>
  <text x="76" y="230" font-size="13.5" fill="#ef4444" text-anchor="start" font-weight="bold">⬆ token / narx / kechikish ham oshadi</text>

  <!-- "qachon qaysi" cards -->
  <rect x="40" y="252" width="138" height="118" rx="10" fill="#dbeafe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="109" y="276" font-size="14" font-weight="bold" fill="#0ea5e9" text-anchor="middle">low</text>
  <text x="109" y="300" font-size="13" fill="#475569" text-anchor="middle">oddiy / tez /</text>
  <text x="109" y="318" font-size="13" fill="#475569" text-anchor="middle">arzon: tasnif,</text>
  <text x="109" y="336" font-size="13" fill="#475569" text-anchor="middle">qidiruv, sodda</text>
  <text x="109" y="354" font-size="13" fill="#475569" text-anchor="middle">javob</text>

  <rect x="186" y="252" width="138" height="118" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="255" y="276" font-size="14" font-weight="bold" fill="#6366f1" text-anchor="middle">medium</text>
  <text x="255" y="300" font-size="13" fill="#475569" text-anchor="middle">muvozanat —</text>
  <text x="255" y="318" font-size="13" fill="#475569" text-anchor="middle">sifat va narx</text>
  <text x="255" y="336" font-size="13" fill="#475569" text-anchor="middle">o'rtasida</text>

  <rect x="332" y="252" width="138" height="118" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="401" y="276" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">high (standart)</text>
  <text x="401" y="300" font-size="13" fill="#475569" text-anchor="middle">intellekt muhim</text>
  <text x="401" y="318" font-size="13" fill="#475569" text-anchor="middle">ishlar uchun</text>
  <text x="401" y="336" font-size="13" fill="#475569" text-anchor="middle">odatiy tanlov</text>

  <rect x="478" y="252" width="138" height="118" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="547" y="276" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="middle">xhigh</text>
  <text x="547" y="300" font-size="13" fill="#475569" text-anchor="middle">kod va agentik</text>
  <text x="547" y="318" font-size="13" fill="#475569" text-anchor="middle">ish uchun ENG</text>
  <text x="547" y="336" font-size="13" fill="#475569" text-anchor="middle">yaxshi</text>

  <rect x="624" y="252" width="138" height="118" rx="10" fill="#ffffff" stroke="#9333ea" stroke-width="2"/>
  <text x="693" y="276" font-size="14" font-weight="bold" fill="#9333ea" text-anchor="middle">max</text>
  <text x="693" y="300" font-size="13" fill="#475569" text-anchor="middle">eng qiyin —</text>
  <text x="693" y="318" font-size="13" fill="#475569" text-anchor="middle">narx muhim</text>
  <text x="693" y="336" font-size="13" fill="#475569" text-anchor="middle">emas</text>

  <!-- footer -->
  <rect x="40" y="392" width="722" height="58" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="418" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="bold">effort = sifat ⇄ narx sozlagichi. Yuqori = aqlliroq, lekin ko'proq token, pul va kechikish (14-bob).</text>
  <text x="400" y="438" font-size="13.5" fill="#475569" text-anchor="middle">Vazifaning qiymatiga moslang: arzon vazifaga "max" — isrof; qiyin vazifaga "low" — sifat tushadi.</text>
</svg>
