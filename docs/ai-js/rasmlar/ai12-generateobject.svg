<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>generateObject: prompt va Zod sxema kiradi, AI SDK modelni sxemaga majburlaydi va tipli, tekshirilgan object qaytaradi (ism, email, reja). Xom output_config bilan farqi: SDK Zod sxemani avtomatik ulaydi va JSON.parse + validatsiyani o'zi qiladi.</title>
  <defs>
    <marker id="g12" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="470" fill="#f8fafc"/>
  <text x="400" y="32" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">generateObject — Zod kiradi, tipli obyekt chiqadi</text>
  <text x="400" y="56" font-size="14" fill="#64748b" text-anchor="middle">AI SDK modelni sxemaga majburlaydi, JSON.parse + tekshiruvni O'ZI qiladi</text>

  <!-- prompt input (left top) -->
  <rect x="40" y="84" width="240" height="64" rx="12" fill="#dbeafe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="160" y="110" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">1. prompt (erkin matn)</text>
  <text x="160" y="132" font-size="13" fill="#475569" text-anchor="middle">"Ali Valiyev, ali@co.uz,</text>
  <text x="160" y="149" font-size="13" fill="#475569" text-anchor="middle">Enterprise xohlaydi"</text>

  <!-- zod schema input (left bottom) -->
  <rect x="40" y="168" width="240" height="116" rx="12" fill="#e0e7ff" stroke="#9333ea" stroke-width="2.5"/>
  <text x="160" y="194" font-size="14" font-weight="bold" fill="#9333ea" text-anchor="middle">2. schema: z.object({...})</text>
  <text x="56" y="220" font-size="13" fill="#1e293b" text-anchor="start" font-family="Consolas, monospace">ism: z.string(),</text>
  <text x="56" y="242" font-size="13" fill="#1e293b" text-anchor="start" font-family="Consolas, monospace">email: z.string(),</text>
  <text x="56" y="264" font-size="13" fill="#1e293b" text-anchor="start" font-family="Consolas, monospace">reja: z.enum([...])</text>

  <!-- arrows into the SDK box -->
  <line x1="280" y1="116" x2="356" y2="188" stroke="#6366f1" stroke-width="2.5" marker-end="url(#g12)"/>
  <line x1="280" y1="226" x2="356" y2="216" stroke="#6366f1" stroke-width="2.5" marker-end="url(#g12)"/>

  <!-- SDK box (center) -->
  <rect x="360" y="150" width="200" height="116" rx="12" fill="#1e293b"/>
  <text x="460" y="180" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">generateObject</text>
  <text x="460" y="204" font-size="13" fill="#94a3b8" text-anchor="middle">AI SDK + Claude</text>
  <text x="460" y="226" font-size="13" fill="#94a3b8" text-anchor="middle">model -&gt; majburlaydi</text>
  <text x="460" y="248" font-size="13" fill="#94a3b8" text-anchor="middle">parse + tekshiradi</text>

  <!-- arrow to result -->
  <line x1="560" y1="208" x2="640" y2="208" stroke="#6366f1" stroke-width="2.5" marker-end="url(#g12)"/>

  <!-- result (right) -->
  <rect x="620" y="150" width="160" height="116" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="700" y="178" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">{ object }</text>
  <text x="700" y="202" font-size="13" fill="#1e293b" text-anchor="middle">tipli +</text>
  <text x="700" y="220" font-size="13" fill="#1e293b" text-anchor="middle">tekshirilgan</text>
  <text x="636" y="246" font-size="13" fill="#475569" text-anchor="start" font-family="Consolas, monospace">{ ism, email,</text>
  <text x="636" y="263" font-size="13" fill="#475569" text-anchor="start" font-family="Consolas, monospace">  reja }</text>

  <!-- contrast strip -->
  <rect x="40" y="318" width="350" height="100" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="215" y="344" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="middle">Xom SDK (06-bob)</text>
  <text x="215" y="368" font-size="13" fill="#1e293b" text-anchor="middle">output_config.format ni</text>
  <text x="215" y="386" font-size="13" fill="#1e293b" text-anchor="middle">qo'lda yozasiz, JSON.parse +</text>
  <text x="215" y="404" font-size="13" fill="#1e293b" text-anchor="middle">Zod tekshiruvni o'zingiz qilasiz</text>

  <rect x="410" y="318" width="350" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="585" y="344" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">AI SDK (bu bob)</text>
  <text x="585" y="368" font-size="13" fill="#1e293b" text-anchor="middle">schema: ZodSxema beresiz,</text>
  <text x="585" y="386" font-size="13" fill="#1e293b" text-anchor="middle">object — tayyor, tipli,</text>
  <text x="585" y="404" font-size="13" fill="#1e293b" text-anchor="middle">tekshirilgan. Ortiqcha kod yo'q</text>

  <text x="400" y="448" font-size="13.5" fill="#475569" text-anchor="middle" font-weight="bold">Bir Zod sxema -> bir tipli obyekt: provayder almashsa ham kod o'zgarmaydi.</text>
</svg>
