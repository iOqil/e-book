<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" font-family="Segoe UI, system-ui, sans-serif">
  <title>Kvitansiya rasmi vision + output_config.format orqali strukturali JSON ga aylanadi: { sotuvchi, sana, summa, mahsulotlar }, so'ng JSON.parse bilan kodda ishlatsa bo'ladigan JS obyektiga. OCR dan strukturali ma'lumotgacha bo'lgan quvur.</title>
  <defs>
    <marker id="a9b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97757"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="480" fill="#f8fafc"/>
  <text x="400" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Kvitansiya rasmi → strukturali JSON → JS obyekti</text>
  <text x="400" y="58" font-size="14" fill="#64748b" text-anchor="middle">Vision (rasmni o'qish) + output_config.format (06-bob) = ishonchli ma'lumot chiqarish</text>

  <!-- Step 1: receipt image -->
  <text x="120" y="92" font-size="15" font-weight="bold" fill="#d97757" text-anchor="middle">1. Kvitansiya rasmi</text>
  <rect x="50" y="104" width="140" height="150" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="120" y="128" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">KORZINKA</text>
  <line x1="66" y1="138" x2="174" y2="138" stroke="#94a3b8" stroke-width="1"/>
  <text x="66" y="158" font-size="13" fill="#475569" text-anchor="start">Sut       12 000</text>
  <text x="66" y="178" font-size="13" fill="#475569" text-anchor="start">Non        4 000</text>
  <text x="66" y="198" font-size="13" fill="#475569" text-anchor="start">Tuxum     18 000</text>
  <line x1="66" y1="208" x2="174" y2="208" stroke="#94a3b8" stroke-width="1"/>
  <text x="66" y="228" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="start">JAMI    34 000</text>
  <text x="66" y="246" font-size="13" fill="#64748b" text-anchor="start">2026-06-15</text>

  <line x1="192" y1="178" x2="236" y2="178" stroke="#d97757" stroke-width="2.5" marker-end="url(#a9b)"/>

  <!-- Step 2: model -->
  <text x="350" y="92" font-size="15" font-weight="bold" fill="#6366f1" text-anchor="middle">2. Claude vision + sxema</text>
  <rect x="242" y="120" width="216" height="116" rx="12" fill="#6366f1"/>
  <text x="350" y="152" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Claude</text>
  <text x="350" y="178" font-size="13" fill="#e0e7ff" text-anchor="middle">rasmni o'qiydi (OCR)</text>
  <text x="350" y="200" font-size="13" fill="#e0e7ff" text-anchor="middle">+ output_config.format</text>
  <text x="350" y="220" font-size="13" fill="#e0e7ff" text-anchor="middle">(json_schema majburiy)</text>

  <line x1="460" y1="178" x2="504" y2="178" stroke="#d97757" stroke-width="2.5" marker-end="url(#a9b)"/>

  <!-- Step 3: JSON -->
  <text x="640" y="92" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">3. Kafolatli JSON</text>
  <rect x="510" y="104" width="270" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="526" y="128" font-size="13" fill="#1e293b" text-anchor="start" font-family="Consolas, monospace">{</text>
  <text x="540" y="148" font-size="13" fill="#1e293b" text-anchor="start" font-family="Consolas, monospace">"sotuvchi": "Korzinka",</text>
  <text x="540" y="168" font-size="13" fill="#1e293b" text-anchor="start" font-family="Consolas, monospace">"sana": "2026-06-15",</text>
  <text x="540" y="188" font-size="13" fill="#1e293b" text-anchor="start" font-family="Consolas, monospace">"summa": 34000,</text>
  <text x="540" y="208" font-size="13" fill="#1e293b" text-anchor="start" font-family="Consolas, monospace">"mahsulotlar": [</text>
  <text x="554" y="228" font-size="13" fill="#475569" text-anchor="start" font-family="Consolas, monospace">"Sut", "Non", "Tuxum" ]</text>
  <text x="526" y="248" font-size="13" fill="#1e293b" text-anchor="start" font-family="Consolas, monospace">}</text>

  <!-- arrow down -->
  <line x1="400" y1="278" x2="400" y2="316" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a9b)"/>
  <text x="418" y="300" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">JSON.parse</text>

  <!-- Step 4: JS object -->
  <text x="400" y="296" font-size="15" font-weight="bold" fill="#0ea5e9" text-anchor="middle">4. JS obyekti — kodda to'g'ridan-to'g'ri</text>
  <rect x="120" y="328" width="560" height="106" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="140" y="356" font-size="14" fill="#1e293b" text-anchor="start" font-family="Consolas, monospace">const r = JSON.parse(msg.content[0].text);</text>
  <text x="140" y="382" font-size="14" fill="#1e293b" text-anchor="start" font-family="Consolas, monospace">await db.xarajatlar.insert(r.sotuvchi, r.summa);</text>
  <text x="140" y="408" font-size="14" fill="#475569" text-anchor="start" font-family="Consolas, monospace">// r.summa — son, r.mahsulotlar — massiv. Tekshiruvsiz!</text>

  <text x="400" y="462" font-size="14" fill="#475569" text-anchor="middle" font-weight="bold">Killer use case: chek/hisob-faktura parsing — rasmdan bevosita ma'lumotlar bazasiga.</text>
</svg>
