<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" width="820" height="600" font-family="Segoe UI, system-ui, sans-serif">
  <title>O'zlashtirilgan ko'nikmalar xaritasi. Markazda "AI/LLM + JS ekspert" hub; undan kitobning ustunlariga shoxlar: Messages API va streaming, prompt muhandisligi, strukturali chiqish va vositalar, vision, AI SDK va UI, token/narx/caching, RAG va embeddings, agentlar va MCP, xavfsizlik, observability va evals, deploy. Reader endi shularning hammasini biladi.</title>
  <defs>
    <marker id="m26a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="600" fill="#f8fafc"/>
  <text x="410" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Siz o'zlashtirgan ko'nikmalar xaritasi</text>
  <text x="410" y="58" font-size="14" fill="#64748b" text-anchor="middle">26 bobda — Claude API'dan to'liq ishlab chiqarish ilovasigacha</text>

  <!-- connectors (drawn first, under nodes) -->
  <line x1="410" y1="300" x2="180" y2="140" stroke="#94a3b8" stroke-width="2" marker-end="url(#m26a)"/>
  <line x1="410" y1="300" x2="410" y2="128" stroke="#94a3b8" stroke-width="2" marker-end="url(#m26a)"/>
  <line x1="410" y1="300" x2="640" y2="140" stroke="#94a3b8" stroke-width="2" marker-end="url(#m26a)"/>
  <line x1="410" y1="300" x2="120" y2="262" stroke="#94a3b8" stroke-width="2" marker-end="url(#m26a)"/>
  <line x1="410" y1="300" x2="700" y2="262" stroke="#94a3b8" stroke-width="2" marker-end="url(#m26a)"/>
  <line x1="410" y1="300" x2="120" y2="360" stroke="#94a3b8" stroke-width="2" marker-end="url(#m26a)"/>
  <line x1="410" y1="300" x2="700" y2="360" stroke="#94a3b8" stroke-width="2" marker-end="url(#m26a)"/>
  <line x1="410" y1="300" x2="180" y2="476" stroke="#94a3b8" stroke-width="2" marker-end="url(#m26a)"/>
  <line x1="410" y1="300" x2="410" y2="492" stroke="#94a3b8" stroke-width="2" marker-end="url(#m26a)"/>
  <line x1="410" y1="300" x2="640" y2="476" stroke="#94a3b8" stroke-width="2" marker-end="url(#m26a)"/>

  <!-- hub -->
  <circle cx="410" cy="300" r="74" fill="#d97757" stroke="#1e293b" stroke-width="2.5"/>
  <text x="410" y="294" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">AI/LLM + JS</text>
  <text x="410" y="316" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">EKSPERT</text>

  <!-- top row -->
  <rect x="92" y="100" width="176" height="56" rx="10" fill="#dbeafe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="180" y="124" font-size="13.5" font-weight="bold" fill="#0ea5e9" text-anchor="middle">Messages API</text>
  <text x="180" y="144" font-size="13" fill="#475569" text-anchor="middle">+ streaming (03/04)</text>

  <rect x="322" y="92" width="176" height="56" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="410" y="116" font-size="13.5" font-weight="bold" fill="#6366f1" text-anchor="middle">Prompt muhandisligi</text>
  <text x="410" y="136" font-size="13" fill="#475569" text-anchor="middle">(05-bob)</text>

  <rect x="552" y="100" width="186" height="56" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="645" y="124" font-size="13.5" font-weight="bold" fill="#f59e0b" text-anchor="middle">Strukturali chiqish</text>
  <text x="645" y="144" font-size="13" fill="#475569" text-anchor="middle">+ vositalar (06/07/12)</text>

  <!-- upper-side row -->
  <rect x="20" y="234" width="186" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="113" y="258" font-size="13.5" font-weight="bold" fill="#16a34a" text-anchor="middle">Vision / fayllar</text>
  <text x="113" y="278" font-size="13" fill="#475569" text-anchor="middle">(09-bob)</text>

  <rect x="614" y="234" width="186" height="56" rx="10" fill="#dbeafe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="707" y="258" font-size="13.5" font-weight="bold" fill="#0ea5e9" text-anchor="middle">AI SDK + UI</text>
  <text x="707" y="278" font-size="13" fill="#475569" text-anchor="middle">(11/12/13)</text>

  <!-- lower-side row -->
  <rect x="20" y="332" width="186" height="56" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="113" y="356" font-size="13.5" font-weight="bold" fill="#f59e0b" text-anchor="middle">Token / narx / kesh</text>
  <text x="113" y="376" font-size="13" fill="#475569" text-anchor="middle">(14/15-bob)</text>

  <rect x="614" y="332" width="186" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="707" y="356" font-size="13.5" font-weight="bold" fill="#16a34a" text-anchor="middle">RAG + embeddings</text>
  <text x="707" y="376" font-size="13" fill="#475569" text-anchor="middle">(17/18-bob)</text>

  <!-- bottom row -->
  <rect x="92" y="448" width="176" height="56" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="180" y="472" font-size="13.5" font-weight="bold" fill="#6366f1" text-anchor="middle">Agentlar + MCP</text>
  <text x="180" y="492" font-size="13" fill="#475569" text-anchor="middle">(19/20/21)</text>

  <rect x="322" y="498" width="176" height="56" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="410" y="522" font-size="13.5" font-weight="bold" fill="#ef4444" text-anchor="middle">Xavfsizlik</text>
  <text x="410" y="542" font-size="13" fill="#475569" text-anchor="middle">(22-bob)</text>

  <rect x="552" y="448" width="186" height="56" rx="10" fill="#fef3c7" stroke="#9333ea" stroke-width="2"/>
  <text x="645" y="468" font-size="13.5" font-weight="bold" fill="#9333ea" text-anchor="middle">Observability + evals</text>
  <text x="645" y="486" font-size="13" fill="#475569" text-anchor="middle">deploy (23/24/25)</text>
  <text x="645" y="500" font-size="13" fill="#64748b" text-anchor="middle">batch · serverless · edge</text>

  <rect x="160" y="566" width="500" height="28" rx="8" fill="#dcfce7"/>
  <text x="410" y="585" font-size="13.5" fill="#1e293b" text-anchor="middle">26-bob bu ustunlarni BITTA ilovaga birlashtiradi — Hujjat-yordamchi.</text>
</svg>
