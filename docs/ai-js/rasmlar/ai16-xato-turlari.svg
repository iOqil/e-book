<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" font-family="Segoe UI, system-ui, sans-serif">
  <title>Xato turlari xaritasi: 400/401/403/404 retry QILMANG (so'rovni tuzating, qizil) vs 429/500/529/ulanish retry QILING (backoff bilan) — tipli klasslar va qaysini qayta urinish</title>
  <defs>
    <marker id="ar16a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="480" fill="#f8fafc"/>
  <text x="400" y="32" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Anthropic xatolari — qaysini qayta urinish (retry)?</text>
  <text x="400" y="56" font-size="14" fill="#64748b" text-anchor="middle">Xatoni `instanceof` tipli klass bilan tuting — matn solishtirish bilan EMAS.</text>

  <!-- central node -->
  <rect x="320" y="78" width="160" height="50" rx="12" fill="#1e293b"/>
  <text x="400" y="100" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">xato tutildi</text>
  <text x="400" y="119" font-size="13" fill="#94a3b8" text-anchor="middle">qaysi tip?</text>

  <line x1="360" y1="128" x2="260" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#ar16a)"/>
  <line x1="440" y1="128" x2="545" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#ar16a)"/>

  <!-- LEFT: do NOT retry -->
  <rect x="32" y="164" width="356" height="240" rx="12" fill="#ffffff" stroke="#ef4444" stroke-width="2.5"/>
  <text x="210" y="190" font-size="16" font-weight="bold" fill="#ef4444" text-anchor="middle">Qayta URINMANG — so'rovni tuzating</text>
  <text x="210" y="210" font-size="13" fill="#475569" text-anchor="middle">Aybingiz bor: noto'g'ri so'rov, kalit, ruxsat.</text>

  <rect x="48" y="222" width="324" height="28" rx="6" fill="#fef3c7" stroke="#ef4444" stroke-width="1.2"/>
  <text x="60" y="241" font-size="13" fill="#1e293b" text-anchor="start">400  BadRequestError — noto'g'ri parametr</text>
  <rect x="48" y="254" width="324" height="28" rx="6" fill="#fef3c7" stroke="#ef4444" stroke-width="1.2"/>
  <text x="60" y="273" font-size="13" fill="#1e293b" text-anchor="start">401  AuthenticationError — kalit xato</text>
  <rect x="48" y="286" width="324" height="28" rx="6" fill="#fef3c7" stroke="#ef4444" stroke-width="1.2"/>
  <text x="60" y="305" font-size="13" fill="#1e293b" text-anchor="start">403  PermissionDeniedError — ruxsat yo'q</text>
  <rect x="48" y="318" width="324" height="28" rx="6" fill="#fef3c7" stroke="#ef4444" stroke-width="1.2"/>
  <text x="60" y="337" font-size="13" fill="#1e293b" text-anchor="start">404  NotFoundError — model/endpoint xato</text>
  <text x="210" y="372" font-size="13.5" fill="#ef4444" text-anchor="middle">Qayta urinish FOYDASIZ — har safar</text>
  <text x="210" y="390" font-size="13.5" fill="#ef4444" text-anchor="middle">aynan shu xato qaytadi. Kodni tuzating.</text>

  <!-- RIGHT: retry with backoff -->
  <rect x="412" y="164" width="356" height="240" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="590" y="190" font-size="16" font-weight="bold" fill="#16a34a" text-anchor="middle">Backoff bilan QAYTA URINING</text>
  <text x="590" y="210" font-size="13" fill="#475569" text-anchor="middle">Vaqtinchalik: kutib qayta urinsa o'tadi.</text>

  <rect x="428" y="222" width="324" height="28" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="440" y="241" font-size="13" fill="#1e293b" text-anchor="start">429  RateLimitError — limit (retry-after bor)</text>
  <rect x="428" y="254" width="324" height="28" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="440" y="273" font-size="13" fill="#1e293b" text-anchor="start">500  InternalServerError — server xatosi</text>
  <rect x="428" y="286" width="324" height="28" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="440" y="305" font-size="13" fill="#1e293b" text-anchor="start">529  OverloadedError — server band</text>
  <rect x="428" y="318" width="324" height="28" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="440" y="337" font-size="13" fill="#1e293b" text-anchor="start">—    APIConnectionError + 408/409</text>
  <text x="590" y="372" font-size="13.5" fill="#16a34a" text-anchor="middle">SDK buni O'ZI qiladi: maxRetries (def. 2),</text>
  <text x="590" y="390" font-size="13.5" fill="#16a34a" text-anchor="middle">eksponensial backoff. Odatda yetarli.</text>

  <!-- footer note -->
  <rect x="32" y="420" width="736" height="44" rx="10" fill="#dbeafe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="400" y="441" font-size="13.5" fill="#1e293b" text-anchor="middle">Hammasi `Anthropic.APIError` dan meros oladi — `.status` (HTTP kodi) bor.</text>
  <text x="400" y="458" font-size="13.5" fill="#475569" text-anchor="middle">`instanceof` ni eng aniqdan umumiyga: RateLimitError → ... → APIError.</text>
</svg>
