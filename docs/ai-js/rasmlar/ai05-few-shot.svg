<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Segoe UI, system-ui, sans-serif">
  <title>Few-shot: promptdagi 2 ta kirish-chiqish misoli modelga naqshni o'rgatadi, shuning uchun yangi kirish mos formatdagi javob oladi (matn → ijobiy/salbiy yorlig'i)</title>
  <defs>
    <marker id="fs1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/>
    </marker>
    <marker id="fs2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="500" fill="#f8fafc"/>
  <text x="400" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Few-shot: misol ko'rsating, model naqshni nusxalaydi</text>
  <text x="400" y="58" font-size="14" fill="#64748b" text-anchor="middle">2-3 ta kirish→chiqish juftligi "javob shu shaklda bo'lsin" deb o'rgatadi</text>

  <!-- Examples in prompt -->
  <text x="225" y="92" font-size="15" font-weight="bold" fill="#d97757" text-anchor="middle">Promptdagi misollar (namuna)</text>

  <rect x="40" y="104" width="370" height="58" rx="8" fill="#dbeafe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="58" y="128" font-size="13" fill="#1e293b" text-anchor="start"><tspan font-weight="bold" fill="#0ea5e9">Matn:</tspan> "Ajoyib mahsulot, juda yoqdi!"</text>
  <text x="58" y="150" font-size="13" fill="#1e293b" text-anchor="start"><tspan font-weight="bold" fill="#16a34a">Yorliq:</tspan> ijobiy</text>

  <rect x="40" y="172" width="370" height="58" rx="8" fill="#dbeafe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="58" y="196" font-size="13" fill="#1e293b" text-anchor="start"><tspan font-weight="bold" fill="#0ea5e9">Matn:</tspan> "Sifati past, pulim ketdi."</text>
  <text x="58" y="218" font-size="13" fill="#1e293b" text-anchor="start"><tspan font-weight="bold" fill="#ef4444">Yorliq:</tspan> salbiy</text>

  <text x="225" y="256" font-size="13" fill="#94a3b8" text-anchor="middle">↑ Model bu juftliklardan naqshni o'rganadi</text>

  <!-- New input -->
  <text x="225" y="300" font-size="15" font-weight="bold" fill="#9333ea" text-anchor="middle">Yangi kirish (yorliqsiz)</text>
  <rect x="40" y="312" width="370" height="46" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="58" y="340" font-size="13" fill="#1e293b" text-anchor="start"><tspan font-weight="bold" fill="#0ea5e9">Matn:</tspan> "Yetkazib berish kech bo'ldi."</text>

  <!-- arrow to model -->
  <line x1="414" y1="335" x2="478" y2="335" stroke="#6366f1" stroke-width="2.5" marker-end="url(#fs1)"/>

  <!-- Model -->
  <rect x="484" y="300" width="150" height="70" rx="12" fill="#6366f1"/>
  <text x="559" y="332" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Model</text>
  <text x="559" y="354" font-size="13" fill="#e0e7ff" text-anchor="middle">naqshga ergashadi</text>

  <!-- arrow to answer -->
  <line x1="637" y1="335" x2="694" y2="335" stroke="#16a34a" stroke-width="2.5" marker-end="url(#fs2)"/>

  <!-- Answer -->
  <rect x="640" y="384" width="120" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="700" y="404" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">Yorliq:</text>
  <text x="700" y="421" font-size="13" fill="#1e293b" text-anchor="middle">salbiy</text>
  <line x1="700" y1="370" x2="700" y2="382" stroke="#16a34a" stroke-width="2" marker-end="url(#fs2)"/>

  <rect x="40" y="396" width="370" height="68" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="225" y="422" font-size="13.5" font-weight="bold" fill="#1e293b" text-anchor="middle">Nega ishlaydi?</text>
  <text x="225" y="446" font-size="13" fill="#475569" text-anchor="middle">Model "ijobiy/salbiy" deb bitta so'z</text>
  <text x="225" y="464" font-size="13" fill="#475569" text-anchor="middle">qaytaradi — misollardagidek, izohsiz.</text>

  <text x="400" y="486" font-size="13" fill="#64748b" text-anchor="middle">Tasniflash (classification), format va ohang uchun ayniqsa kuchli usul</text>
</svg>
