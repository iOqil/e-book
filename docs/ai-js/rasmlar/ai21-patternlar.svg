<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" font-family="Segoe UI, system-ui, sans-serif">
  <title>Beshta workflow naqshi: 1) Prompt zanjiri — A bosqichi chiqishi B ga, B niki C ga (ketma-ket). 2) Marshrutlash — klassifikator so'rovni toifaga ajratadi va to'g'ri yo'lga (model/prompt) yo'naltiradi. 3) Parallellashtirish — Promise.all bilan bir nechta mustaqil chaqiruv bir vaqtda, keyin jamlash. 4) Koordinator-ishchilar — koordinator vazifani kichik vazifalarga bo'ladi, ishchilar parallel bajaradi, koordinator jamlaydi. 5) Baholovchi-optimizator — yaratuvchi yozadi, baholovchi tanqid qiladi, yetarli bo'lguncha sikl. Soddadan boshlang: bitta chaqiruv -> workflow -> agent -> ko'p agent.</title>
  <defs>
    <marker id="p21" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="540" fill="#f8fafc"/>
  <text x="400" y="32" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Beshta workflow naqshi — bir qarashda</text>
  <text x="400" y="56" font-size="14" fill="#64748b" text-anchor="middle">Murakkab vazifani kod bilan boshqariladigan qadam va rollarga bo'lish</text>

  <!-- 1) Prompt chaining -->
  <rect x="24" y="78" width="372" height="120" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="40" y="102" font-size="15" font-weight="bold" fill="#6366f1" text-anchor="start">1. Prompt zanjiri (chaining)</text>
  <text x="40" y="122" font-size="13" fill="#475569" text-anchor="start">A chiqishi -&gt; B kirishi -&gt; C (ketma-ket)</text>
  <rect x="44" y="138" width="80" height="44" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="84" y="165" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">A reja</text>
  <line x1="124" y1="160" x2="160" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#p21)"/>
  <rect x="164" y="138" width="80" height="44" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="204" y="165" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">B qoralama</text>
  <line x1="244" y1="160" x2="280" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#p21)"/>
  <rect x="284" y="138" width="88" height="44" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="328" y="165" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">C sayqal</text>

  <!-- 2) Routing -->
  <rect x="404" y="78" width="372" height="120" rx="12" fill="#dbeafe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="420" y="102" font-size="15" font-weight="bold" fill="#0ea5e9" text-anchor="start">2. Marshrutlash (routing)</text>
  <text x="420" y="122" font-size="13" fill="#475569" text-anchor="start">arzon klassifikator yo'lni tanlaydi</text>
  <rect x="424" y="138" width="104" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="476" y="159" font-size="13" font-weight="bold" fill="#f59e0b" text-anchor="middle">klassifikator</text>
  <text x="476" y="175" font-size="13" fill="#64748b" text-anchor="middle">(Haiku)</text>
  <line x1="528" y1="150" x2="566" y2="142" stroke="#64748b" stroke-width="2" marker-end="url(#p21)"/>
  <line x1="528" y1="160" x2="566" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#p21)"/>
  <line x1="528" y1="170" x2="566" y2="178" stroke="#64748b" stroke-width="2" marker-end="url(#p21)"/>
  <rect x="570" y="132" width="194" height="20" rx="6" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.2"/>
  <text x="667" y="147" font-size="13" fill="#1e293b" text-anchor="middle">hisob-kitob -&gt; Opus</text>
  <rect x="570" y="156" width="194" height="20" rx="6" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.2"/>
  <text x="667" y="171" font-size="13" fill="#1e293b" text-anchor="middle">texnik -&gt; Opus</text>
  <rect x="570" y="180" width="194" height="14" rx="6" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.2"/>
  <text x="667" y="191" font-size="13" fill="#1e293b" text-anchor="middle">umumiy -&gt; Haiku</text>

  <!-- 3) Parallelization -->
  <rect x="24" y="210" width="372" height="138" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="40" y="234" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="start">3. Parallellashtirish</text>
  <text x="40" y="254" font-size="13" fill="#475569" text-anchor="start">Promise.all — mustaqil chaqiruvlar bir vaqtda</text>
  <rect x="44" y="268" width="70" height="36" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="79" y="290" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">manba</text>
  <line x1="114" y1="286" x2="148" y2="278" stroke="#64748b" stroke-width="2" marker-end="url(#p21)"/>
  <line x1="114" y1="286" x2="148" y2="294" stroke="#64748b" stroke-width="2" marker-end="url(#p21)"/>
  <line x1="114" y1="286" x2="148" y2="312" stroke="#64748b" stroke-width="2" marker-end="url(#p21)"/>
  <rect x="152" y="266" width="92" height="18" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="198" y="279" font-size="13" fill="#1e293b" text-anchor="middle">chaqiruv 1</text>
  <rect x="152" y="288" width="92" height="18" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="198" y="301" font-size="13" fill="#1e293b" text-anchor="middle">chaqiruv 2</text>
  <rect x="152" y="310" width="92" height="18" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="198" y="323" font-size="13" fill="#1e293b" text-anchor="middle">chaqiruv 3</text>
  <line x1="244" y1="278" x2="278" y2="294" stroke="#64748b" stroke-width="2" marker-end="url(#p21)"/>
  <line x1="244" y1="297" x2="278" y2="297" stroke="#64748b" stroke-width="2" marker-end="url(#p21)"/>
  <line x1="244" y1="319" x2="278" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#p21)"/>
  <rect x="282" y="278" width="90" height="40" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="327" y="296" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">jamla</text>
  <text x="327" y="312" font-size="13" fill="#64748b" text-anchor="middle">~N× tez</text>

  <!-- 4) Orchestrator-workers -->
  <rect x="404" y="210" width="372" height="138" rx="12" fill="#e0e7ff" stroke="#9333ea" stroke-width="2"/>
  <text x="420" y="234" font-size="15" font-weight="bold" fill="#9333ea" text-anchor="start">4. Koordinator-ishchilar</text>
  <text x="420" y="254" font-size="13" fill="#475569" text-anchor="start">bo'l -&gt; (parallel) bajar -&gt; jamla</text>
  <rect x="424" y="268" width="84" height="40" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="466" y="286" font-size="13" font-weight="bold" fill="#9333ea" text-anchor="middle">koordinator</text>
  <text x="466" y="302" font-size="13" fill="#64748b" text-anchor="middle">bo'ladi</text>
  <line x1="508" y1="282" x2="540" y2="276" stroke="#64748b" stroke-width="2" marker-end="url(#p21)"/>
  <line x1="508" y1="288" x2="540" y2="297" stroke="#64748b" stroke-width="2" marker-end="url(#p21)"/>
  <line x1="508" y1="294" x2="540" y2="318" stroke="#64748b" stroke-width="2" marker-end="url(#p21)"/>
  <rect x="544" y="266" width="82" height="18" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="585" y="279" font-size="13" fill="#1e293b" text-anchor="middle">ishchi 1</text>
  <rect x="544" y="288" width="82" height="18" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="585" y="301" font-size="13" fill="#1e293b" text-anchor="middle">ishchi 2</text>
  <rect x="544" y="310" width="82" height="18" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="585" y="323" font-size="13" fill="#1e293b" text-anchor="middle">ishchi 3</text>
  <line x1="626" y1="276" x2="658" y2="293" stroke="#64748b" stroke-width="2" marker-end="url(#p21)"/>
  <line x1="626" y1="297" x2="658" y2="297" stroke="#64748b" stroke-width="2" marker-end="url(#p21)"/>
  <line x1="626" y1="318" x2="658" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#p21)"/>
  <rect x="662" y="276" width="102" height="42" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="713" y="294" font-size="13" font-weight="bold" fill="#9333ea" text-anchor="middle">koordinator</text>
  <text x="713" y="310" font-size="13" fill="#64748b" text-anchor="middle">jamlaydi</text>

  <!-- 5) Evaluator-optimizer -->
  <rect x="24" y="360" width="752" height="112" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="40" y="384" font-size="15" font-weight="bold" fill="#f59e0b" text-anchor="start">5. Baholovchi-optimizator (evaluator-optimizer)</text>
  <text x="40" y="404" font-size="13" fill="#475569" text-anchor="start">yaratuvchi yozadi, baholovchi mezonga qarab tanqid qiladi — yetarli bo'lguncha sikl (chegara bilan)</text>
  <rect x="120" y="418" width="160" height="44" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="200" y="440" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">Yaratuvchi</text>
  <text x="200" y="456" font-size="13" fill="#475569" text-anchor="middle">javob yozadi / tuzatadi</text>
  <line x1="280" y1="430" x2="496" y2="430" stroke="#64748b" stroke-width="2" marker-end="url(#p21)"/>
  <text x="388" y="424" font-size="13" fill="#64748b" text-anchor="middle">javob</text>
  <line x1="496" y1="452" x2="280" y2="452" stroke="#64748b" stroke-width="2" marker-end="url(#p21)"/>
  <text x="388" y="468" font-size="13" fill="#64748b" text-anchor="middle">"tuzat: ..." (yetarli bo'lmasa)</text>
  <rect x="500" y="418" width="180" height="44" rx="10" fill="#ffffff" stroke="#d97757" stroke-width="2"/>
  <text x="590" y="440" font-size="14" font-weight="bold" fill="#d97757" text-anchor="middle">Baholovchi</text>
  <text x="590" y="456" font-size="13" fill="#475569" text-anchor="middle">mezonga qarab tekshiradi</text>

  <!-- footer -->
  <rect x="24" y="484" width="752" height="44" rx="10" fill="#dbeafe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="400" y="503" font-size="13.5" font-weight="bold" fill="#1e293b" text-anchor="middle">Soddadan boshlang: bitta chaqiruv -&gt; workflow -&gt; agent -&gt; ko'p agent</text>
  <text x="400" y="521" font-size="13" fill="#475569" text-anchor="middle">Murakkablikni faqat u natijani o'lchovli yaxshilaganda qo'shing</text>
</svg>
