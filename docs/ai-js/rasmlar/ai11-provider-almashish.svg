<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" width="780" height="460" font-family="Segoe UI, system-ui, sans-serif">
  <title>Provayderdan mustaqillik: anthropic("claude-opus-4-8") model obyekti generateText'ning model maydoniga ulanadi. Konseptual ravishda boshqa provayder ham xuddi shu funksiyaga ulanishi mumkin — lekin bu kitob Claude'da qoladi. Ulanadigan-model g'oyasi.</title>
  <defs>
    <marker id="pa" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="460" fill="#f8fafc"/>
  <text x="390" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Ulanadigan model — provayderdan mustaqil funksiya</text>
  <text x="390" y="58" font-size="14" fill="#64748b" text-anchor="middle">model obyekti generateText'ga "ulanadi"; kod bir xil qoladi</text>

  <!-- central function box -->
  <rect x="280" y="180" width="220" height="100" rx="14" fill="#dbeafe" stroke="#0ea5e9" stroke-width="3"/>
  <text x="390" y="220" font-size="16" font-weight="bold" fill="#0ea5e9" text-anchor="middle">generateText({</text>
  <text x="390" y="244" font-size="14" fill="#1e293b" text-anchor="middle">model: ...,</text>
  <text x="390" y="266" font-size="14" fill="#1e293b" text-anchor="middle">prompt })</text>

  <!-- provider 1: anthropic (active) -->
  <rect x="40" y="120" width="200" height="74" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="140" y="150" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">@ai-sdk/anthropic</text>
  <text x="140" y="173" font-size="13" fill="#475569" text-anchor="middle">anthropic("claude-opus-4-8")</text>
  <text x="140" y="208" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">BU KITOB SHU YERDA</text>
  <line x1="240" y1="170" x2="276" y2="205" stroke="#16a34a" stroke-width="3" marker-end="url(#pa)"/>

  <!-- provider 2: other (conceptual, dashed) -->
  <rect x="40" y="266" width="200" height="64" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="140" y="294" font-size="14" fill="#64748b" text-anchor="middle">boshqa provayder</text>
  <text x="140" y="314" font-size="13" fill="#94a3b8" text-anchor="middle">(konseptual — xuddi shu joyga)</text>
  <line x1="240" y1="298" x2="276" y2="255" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#pa)"/>

  <!-- arrow to API -->
  <line x1="500" y1="230" x2="556" y2="230" stroke="#64748b" stroke-width="2.5" marker-end="url(#pa)"/>

  <!-- API/Claude -->
  <rect x="560" y="186" width="180" height="88" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="650" y="222" font-size="15" font-weight="bold" fill="#d97757" text-anchor="middle">Anthropic API</text>
  <text x="650" y="248" font-size="14" fill="#475569" text-anchor="middle">-> Claude</text>

  <!-- key idea banner -->
  <rect x="120" y="372" width="540" height="60" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="390" y="398" font-size="14" font-weight="bold" fill="#6366f1" text-anchor="middle">Asosiy g'oya: generateText o'zgarmaydi — faqat model obyekti almashadi.</text>
  <text x="390" y="420" font-size="13" fill="#475569" text-anchor="middle">Provayder-mustaqillik bor, ammo biz Claude'ning kuchidan to'liq foydalanamiz.</text>
</svg>
