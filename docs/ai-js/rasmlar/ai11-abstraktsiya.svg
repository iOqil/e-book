<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="Segoe UI, system-ui, sans-serif">
  <title>Abstraksiya qatlamlari: sizning ilovangiz -> Vercel AI SDK (generateText/streamText/tool/useChat) -> @ai-sdk/anthropic provayderi -> Anthropic API -> Claude. AI SDK provayder ustidagi yagona qatlam.</title>
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="540" fill="#f8fafc"/>
  <text x="380" y="36" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Vercel AI SDK — abstraksiya qatlami</text>
  <text x="380" y="60" font-size="14" fill="#64748b" text-anchor="middle">Sizning kodingiz tepada; har qatlam ostidagisiga tayanadi</text>

  <!-- Layer 1: your app -->
  <rect x="150" y="82" width="460" height="62" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="380" y="110" font-size="16" font-weight="bold" fill="#6366f1" text-anchor="middle">1. Sizning ilovangiz</text>
  <text x="380" y="132" font-size="13" fill="#475569" text-anchor="middle">chat, agent, RAG, Next.js sahifa</text>

  <line x1="380" y1="144" x2="380" y2="172" stroke="#64748b" stroke-width="2.5" marker-end="url(#ab)"/>

  <!-- Layer 2: Vercel AI SDK -->
  <rect x="90" y="174" width="580" height="98" rx="12" fill="#dbeafe" stroke="#0ea5e9" stroke-width="2.5"/>
  <text x="380" y="200" font-size="16" font-weight="bold" fill="#0ea5e9" text-anchor="middle">2. Vercel AI SDK  (paket: ai)</text>
  <text x="380" y="221" font-size="13" fill="#475569" text-anchor="middle">matn/obyekt/vosita/UI uchun yagona ergonomik API</text>
  <rect x="110" y="234" width="130" height="28" rx="7" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="175" y="253" font-size="13" fill="#1e293b" text-anchor="middle">generateText</text>
  <rect x="250" y="234" width="120" height="28" rx="7" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="310" y="253" font-size="13" fill="#1e293b" text-anchor="middle">streamText</text>
  <rect x="380" y="234" width="80" height="28" rx="7" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="420" y="253" font-size="13" fill="#1e293b" text-anchor="middle">tool</text>
  <rect x="470" y="234" width="100" height="28" rx="7" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="520" y="253" font-size="13" fill="#1e293b" text-anchor="middle">useChat</text>
  <text x="618" y="253" font-size="13" fill="#94a3b8" text-anchor="middle">...</text>

  <line x1="380" y1="272" x2="380" y2="300" stroke="#64748b" stroke-width="2.5" marker-end="url(#ab)"/>

  <!-- Layer 3: provider -->
  <rect x="150" y="302" width="460" height="62" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="380" y="330" font-size="16" font-weight="bold" fill="#d97757" text-anchor="middle">3. @ai-sdk/anthropic — provayder</text>
  <text x="380" y="352" font-size="13" fill="#475569" text-anchor="middle">anthropic("claude-opus-4-8") — Claude'ga ulagich</text>

  <line x1="380" y1="364" x2="380" y2="392" stroke="#64748b" stroke-width="2.5" marker-end="url(#ab)"/>

  <!-- Layer 4: Anthropic API -->
  <rect x="180" y="394" width="400" height="56" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
  <text x="380" y="420" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">4. Anthropic API  (HTTP)</text>
  <text x="380" y="440" font-size="13" fill="#475569" text-anchor="middle">02-bobdagi xom SDK ham aynan shu yerga boradi</text>

  <line x1="380" y1="450" x2="380" y2="478" stroke="#64748b" stroke-width="2.5" marker-end="url(#ab)"/>

  <!-- Layer 5: Claude -->
  <rect x="250" y="480" width="260" height="48" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="380" y="510" font-size="16" font-weight="bold" fill="#16a34a" text-anchor="middle">5. Claude (model)</text>
</svg>
