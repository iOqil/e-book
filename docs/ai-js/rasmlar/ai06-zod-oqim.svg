<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Zod yagona haqiqat manbai: z.object bir vaqtning o'zida modelni cheklash uchun ham, javobni ishga tushirish vaqtida tekshirish uchun ham ishlatiladi va tipli obyekt qaytaradi; noto'g'ri chiqish ushlanadi</title>
  <defs>
    <marker id="a6c" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="470" fill="#f8fafc"/>
  <text x="400" y="32" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Zod — yagona haqiqat manbai (single source of truth)</text>
  <text x="400" y="56" font-size="14" fill="#64748b" text-anchor="middle">Bir sxema → modelni cheklaydi VA javobni tekshiradi VA (TS'da) tip beradi</text>

  <!-- central Zod schema -->
  <rect x="280" y="80" width="240" height="116" rx="12" fill="#e0e7ff" stroke="#9333ea" stroke-width="2.5"/>
  <text x="400" y="106" font-size="15" font-weight="bold" fill="#9333ea" text-anchor="middle">z.object(...)</text>
  <text x="296" y="132" font-size="13" fill="#1e293b" text-anchor="start" font-family="Consolas, monospace">ism: z.string(),</text>
  <text x="296" y="154" font-size="13" fill="#1e293b" text-anchor="start" font-family="Consolas, monospace">email: z.string().email(),</text>
  <text x="296" y="176" font-size="13" fill="#1e293b" text-anchor="start" font-family="Consolas, monospace">reja: z.enum([...])</text>

  <!-- arrow to model (left) -->
  <line x1="280" y1="138" x2="180" y2="200" stroke="#9333ea" stroke-width="2.5" marker-end="url(#a6c)"/>
  <text x="150" y="178" font-size="13" font-weight="bold" fill="#9333ea" text-anchor="middle">1. cheklaydi</text>

  <!-- arrow to validate (right) -->
  <line x1="520" y1="138" x2="620" y2="200" stroke="#9333ea" stroke-width="2.5" marker-end="url(#a6c)"/>
  <text x="650" y="178" font-size="13" font-weight="bold" fill="#9333ea" text-anchor="middle">2. tekshiradi</text>

  <!-- model box (left) -->
  <rect x="40" y="208" width="280" height="92" rx="10" fill="#6366f1"/>
  <text x="180" y="236" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Modelga so'rov</text>
  <text x="180" y="260" font-size="13" fill="#e0e7ff" text-anchor="middle" font-family="Consolas, monospace">messages.parse({</text>
  <text x="180" y="282" font-size="13" fill="#e0e7ff" text-anchor="middle" font-family="Consolas, monospace">output_format: Contact })</text>

  <!-- validate box (right) -->
  <rect x="480" y="208" width="280" height="92" rx="10" fill="#0ea5e9"/>
  <text x="620" y="236" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Runtime tekshiruv</text>
  <text x="620" y="260" font-size="13" fill="#dbeafe" text-anchor="middle">email format, enum,</text>
  <text x="620" y="282" font-size="13" fill="#dbeafe" text-anchor="middle">min/max (sxema bermaganni)</text>

  <!-- arrows down to result -->
  <line x1="180" y1="300" x2="340" y2="346" stroke="#9333ea" stroke-width="2.5" marker-end="url(#a6c)"/>
  <line x1="620" y1="300" x2="460" y2="346" stroke="#9333ea" stroke-width="2.5" marker-end="url(#a6c)"/>

  <!-- result -->
  <rect x="240" y="354" width="320" height="66" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="380" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">res.parsed_output</text>
  <text x="400" y="404" font-size="13" fill="#1e293b" text-anchor="middle">tekshirilgan, tipli obyekt — ishonchli</text>

  <!-- invalid caught -->
  <rect x="40" y="354" width="180" height="66" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="130" y="380" font-size="14" font-weight="bold" fill="#ef4444" text-anchor="middle">Noto'g'ri chiqish</text>
  <text x="130" y="404" font-size="13" fill="#ef4444" text-anchor="middle">ZodError → ushlanadi</text>

  <text x="400" y="450" font-size="13" fill="#475569" text-anchor="middle" font-weight="bold">Bitta ta'rif ikki vazifa qiladi: ortiqcha qog'oz, ikki manba o'rtasida nomuvofiqlik yo'q.</text>
</svg>
