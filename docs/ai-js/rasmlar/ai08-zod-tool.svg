<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" font-family="Segoe UI, system-ui, sans-serif">
  <title>Bitta Zod sxema bir vaqtning o'zida JSON input_schema'ni avtomatik yasaydi, Claude yuborgan argumentni ish vaqtida validatsiya qiladi va tipli (typed) tool argumentini beradi — yagona haqiqat manbai</title>
  <defs>
    <marker id="zt" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="480" fill="#f8fafc"/>
  <text x="400" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Zod sxema — yagona haqiqat manbai</text>
  <text x="400" y="58" font-size="14" fill="#64748b" text-anchor="middle">Bir marta yozasiz, uchta ish avtomatik bajariladi</text>

  <!-- SOURCE: Zod schema -->
  <rect x="220" y="84" width="360" height="96" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="400" y="112" font-size="15" font-weight="bold" fill="#6366f1" text-anchor="middle">Zod sxema (siz yozasiz)</text>
  <text x="400" y="140" font-size="13.5" fill="#1e293b" text-anchor="middle" font-family="Consolas, monospace">z.object({ city: z.string()</text>
  <text x="400" y="162" font-size="13.5" fill="#1e293b" text-anchor="middle" font-family="Consolas, monospace">.describe("Shahar nomi") })</text>

  <!-- three arrows fanning out -->
  <line x1="320" y1="184" x2="160" y2="236" stroke="#6366f1" stroke-width="2.5" marker-end="url(#zt)"/>
  <line x1="400" y1="184" x2="400" y2="236" stroke="#6366f1" stroke-width="2.5" marker-end="url(#zt)"/>
  <line x1="480" y1="184" x2="640" y2="236" stroke="#6366f1" stroke-width="2.5" marker-end="url(#zt)"/>

  <!-- 1: JSON schema -->
  <rect x="36" y="244" width="232" height="150" rx="10" fill="#dbeafe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="152" y="272" font-size="14" font-weight="bold" fill="#0ea5e9" text-anchor="middle">1. JSON input_schema</text>
  <text x="152" y="294" font-size="13" fill="#475569" text-anchor="middle">avtomatik yasaladi</text>
  <rect x="52" y="306" width="200" height="76" rx="6" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="64" y="328" font-size="13" fill="#1e293b" text-anchor="start" font-family="Consolas, monospace">{ "type":"object",</text>
  <text x="64" y="348" font-size="13" fill="#1e293b" text-anchor="start" font-family="Consolas, monospace">  "properties": {</text>
  <text x="64" y="368" font-size="13" fill="#1e293b" text-anchor="start" font-family="Consolas, monospace">  "city": {...} } }</text>

  <!-- 2: runtime validation -->
  <rect x="284" y="244" width="232" height="150" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="272" font-size="14" font-weight="bold" fill="#d97757" text-anchor="middle">2. Ish vaqti validatsiyasi</text>
  <text x="400" y="296" font-size="13" fill="#475569" text-anchor="middle">Claude yuborgan argument</text>
  <text x="400" y="316" font-size="13" fill="#475569" text-anchor="middle">tekshiriladi</text>
  <rect x="300" y="328" width="200" height="52" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="350" font-size="13" fill="#16a34a" text-anchor="middle">"Toshkent" -&gt; OK</text>
  <text x="400" y="370" font-size="13" fill="#ef4444" text-anchor="middle">42 (son) -&gt; xato tutiladi</text>

  <!-- 3: typed args -->
  <rect x="532" y="244" width="232" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="648" y="272" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">3. Tipli argument</text>
  <text x="648" y="296" font-size="13" fill="#475569" text-anchor="middle">run(input) ichida</text>
  <rect x="548" y="310" width="200" height="70" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="648" y="334" font-size="13" fill="#1e293b" text-anchor="middle" font-family="Consolas, monospace">input.city</text>
  <text x="648" y="356" font-size="13" fill="#475569" text-anchor="middle">string ekani</text>
  <text x="648" y="374" font-size="13" fill="#475569" text-anchor="middle">kafolatlangan</text>

  <!-- footer -->
  <rect x="60" y="416" width="680" height="44" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="400" y="443" font-size="13.5" fill="#1e293b" text-anchor="middle">Qo'lda yozilgan JSON sxema bilan bu uch narsa uch joyda — bir-biriga mos kelmay qolishi oson. Zod ularni bittadan tug'diradi.</text>
</svg>
