<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Segoe UI, system-ui, sans-serif">
  <title>Ishonchli callClaude o'rovi oqimi: try -> tipli-xato tarmog'i -> retryable bo'lsa backoff bilan qayta urinish / 4xx bo'lsa darhol to'xtash / qayta-qayta muvaffaqiyatsizlikda fallback model -> natija yoki chiroyli xato qaytarish</title>
  <defs>
    <marker id="ar16c" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="500" fill="#f8fafc"/>
  <text x="400" y="32" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Ishonchli `callClaude` o'rovi — ishlab chiqarishga tayyor</text>
  <text x="400" y="56" font-size="14" fill="#64748b" text-anchor="middle">Tipli xato + backoff (retry-after) + timeout + fallback = qulamaydigan klient</text>

  <!-- try call -->
  <rect x="320" y="76" width="160" height="48" rx="12" fill="#6366f1"/>
  <text x="400" y="98" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">try: chaqiruv</text>
  <text x="400" y="116" font-size="13" fill="#e0e7ff" text-anchor="middle">messages.create / stream</text>

  <!-- success path down-right -->
  <line x1="480" y1="100" x2="650" y2="100" stroke="#16a34a" stroke-width="2" marker-end="url(#ar16c)"/>
  <text x="565" y="92" font-size="13" fill="#16a34a" text-anchor="middle">muvaffaqiyat</text>
  <rect x="652" y="78" width="120" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="712" y="98" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">natija qaytar</text>
  <text x="712" y="115" font-size="13" fill="#475569" text-anchor="middle">✓ Message</text>

  <!-- catch -->
  <line x1="400" y1="124" x2="400" y2="154" stroke="#64748b" stroke-width="2" marker-end="url(#ar16c)"/>
  <text x="470" y="146" font-size="13" fill="#ef4444" text-anchor="middle">catch (xato)</text>
  <rect x="290" y="156" width="220" height="44" rx="12" fill="#1e293b"/>
  <text x="400" y="178" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">instanceof tekshir</text>
  <text x="400" y="195" font-size="13" fill="#94a3b8" text-anchor="middle">qaysi tip? retryable?</text>

  <!-- two branches -->
  <line x1="330" y1="200" x2="190" y2="240" stroke="#64748b" stroke-width="2" marker-end="url(#ar16c)"/>
  <line x1="470" y1="200" x2="610" y2="240" stroke="#64748b" stroke-width="2" marker-end="url(#ar16c)"/>

  <!-- LEFT: 4xx fail fast -->
  <rect x="40" y="244" width="280" height="96" rx="12" fill="#ffffff" stroke="#ef4444" stroke-width="2.5"/>
  <text x="180" y="270" font-size="14" font-weight="bold" fill="#ef4444" text-anchor="middle">4xx (400/401/403/404)</text>
  <text x="180" y="294" font-size="13" fill="#1e293b" text-anchor="middle">Darhol TO'XTA (fail-fast).</text>
  <text x="180" y="314" font-size="13" fill="#475569" text-anchor="middle">Qayta urinish foydasiz —</text>
  <text x="180" y="332" font-size="13" fill="#475569" text-anchor="middle">xatoni yuqoriga uzating.</text>

  <!-- RIGHT: retryable backoff -->
  <rect x="480" y="244" width="280" height="96" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="620" y="270" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">429 / 5xx / ulanish</text>
  <text x="620" y="294" font-size="13" fill="#1e293b" text-anchor="middle">Backoff bilan qayta urin.</text>
  <text x="620" y="314" font-size="13" fill="#475569" text-anchor="middle">429 da retry-after ga rioya.</text>
  <text x="620" y="332" font-size="13" fill="#475569" text-anchor="middle">Urinishlar tugaguncha takror.</text>

  <!-- backoff loops back up -->
  <path d="M620,244 C620,222 540,210 510,200" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#ar16c)"/>
  <text x="585" y="226" font-size="13" fill="#16a34a" text-anchor="middle">qayta</text>

  <!-- fallback after exhausted -->
  <line x1="620" y1="340" x2="620" y2="372" stroke="#64748b" stroke-width="2" marker-end="url(#ar16c)"/>
  <text x="620" y="362" font-size="13" fill="#9333ea" text-anchor="middle">urinishlar tugadi</text>
  <rect x="440" y="374" width="360" height="58" rx="12" fill="#e0e7ff" stroke="#9333ea" stroke-width="2.5"/>
  <text x="620" y="398" font-size="14" font-weight="bold" fill="#9333ea" text-anchor="middle">Fallback (zaxira reja)</text>
  <text x="620" y="420" font-size="13" fill="#1e293b" text-anchor="middle">arzonroq/boshqa model · keshlangan javob</text>

  <!-- final graceful error -->
  <line x1="180" y1="340" x2="180" y2="392" stroke="#64748b" stroke-width="2" marker-end="url(#ar16c)"/>
  <rect x="40" y="394" width="280" height="58" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="180" y="418" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="middle">Chiroyli xato (degradatsiya)</text>
  <text x="180" y="440" font-size="13" fill="#1e293b" text-anchor="middle">"Biroz kuting" + request_id ni logla</text>

  <!-- footer -->
  <rect x="40" y="462" width="720" height="30" rx="8" fill="#dbeafe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="400" y="482" font-size="13" fill="#1e293b" text-anchor="middle">Ilova HECH QACHON qulab tushmaydi — har yo'l natija yoki tushunarli xato bilan tugaydi.</text>
</svg>
