<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>Tokenlar model'dan stream orqali birma-bir ilova/terminalga oqib keladi va to'liq xabarga yig'iladi; finalMessage hammasini birga to'playdi</title>
  <defs>
    <marker id="ar4o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97757"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="440" fill="#f8fafc"/>
  <text x="400" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Token oqimi — model'dan terminalgacha</text>
  <text x="400" y="58" font-size="14" fill="#64748b" text-anchor="middle">Model tokenlarni birma-bir ishlab chiqaradi; ilovangiz ularni darhol oladi va yig'adi</text>

  <!-- Model -->
  <rect x="40" y="120" width="150" height="120" rx="12" fill="#fef3c7" stroke="#d97757" stroke-width="2.5"/>
  <text x="115" y="170" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Claude</text>
  <text x="115" y="194" font-size="13" fill="#475569" text-anchor="middle">model tokenni</text>
  <text x="115" y="212" font-size="13" fill="#475569" text-anchor="middle">birma-bir hosil</text>
  <text x="115" y="230" font-size="13" fill="#475569" text-anchor="middle">qiladi</text>

  <!-- stream pipe with tokens -->
  <rect x="210" y="150" width="360" height="60" rx="30" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="390" y="138" font-size="13.5" font-weight="bold" fill="#6366f1" text-anchor="middle">stream (oqim quvuri)</text>
  <!-- tokens inside the pipe -->
  <circle cx="250" cy="180" r="16" fill="#dbeafe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="250" y="185" font-size="13" fill="#1e293b" text-anchor="middle">Bu</text>
  <circle cx="312" cy="180" r="16" fill="#dbeafe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="312" y="185" font-size="13" fill="#1e293b" text-anchor="middle">gun</text>
  <circle cx="374" cy="180" r="16" fill="#dbeafe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="374" y="185" font-size="13" fill="#1e293b" text-anchor="middle">ob</text>
  <circle cx="436" cy="180" r="16" fill="#dbeafe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="436" y="185" font-size="13" fill="#1e293b" text-anchor="middle">-havo</text>
  <circle cx="510" cy="180" r="16" fill="#dbeafe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="510" y="185" font-size="13" fill="#1e293b" text-anchor="middle">yaxshi</text>
  <!-- arrows -->
  <line x1="192" y1="180" x2="208" y2="180" stroke="#d97757" stroke-width="2.5" marker-end="url(#ar4o)"/>
  <line x1="572" y1="180" x2="600" y2="180" stroke="#d97757" stroke-width="2.5" marker-end="url(#ar4o)"/>

  <!-- terminal / app -->
  <rect x="604" y="120" width="156" height="120" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="682" y="146" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Terminal / ilova</text>
  <text x="618" y="176" font-size="13" fill="#94a3b8" text-anchor="start" font-family="Consolas, monospace">$ node cli.js</text>
  <text x="618" y="200" font-size="13" fill="#dcfce7" text-anchor="start" font-family="Consolas, monospace">Bugun ob-havo</text>
  <text x="618" y="220" font-size="13" fill="#dcfce7" text-anchor="start" font-family="Consolas, monospace">yaxshi_</text>

  <!-- accumulation -->
  <text x="400" y="294" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">finalMessage() — barcha tokenlarni bitta to'liq xabarga yig'adi</text>
  <!-- collected box -->
  <rect x="160" y="312" width="480" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="400" y="336" font-size="14" fill="#1e293b" text-anchor="middle" font-family="Consolas, monospace">"Bugun ob-havo yaxshi"</text>
  <text x="400" y="357" font-size="13" fill="#475569" text-anchor="middle">final.content[0].text · final.usage.output_tokens</text>
  <!-- arrows down from each token to collected -->
  <line x1="250" y1="198" x2="330" y2="308" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="436" y1="198" x2="400" y2="308" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="510" y1="198" x2="470" y2="308" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- footer note -->
  <rect x="40" y="392" width="720" height="34" rx="9" fill="#dbeafe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="400" y="414" font-size="13.5" fill="#1e293b" text-anchor="middle">Har token kelishi bilan terminalga yoziladi (jonli), oxirida esa to'liq matn ham qo'lingizda bo'ladi.</text>
</svg>
