<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>Claude model oilasi: Fable 5, Opus 4.8, Sonnet 4.6 va Haiku 4.5 — kontekst, narx va qachon ishlatish</title>
  <rect x="0" y="0" width="800" height="440" fill="#f8fafc"/>
  <text x="400" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Claude model oilasi — qaysi birini tanlash</text>
  <text x="400" y="58" font-size="14" fill="#64748b" text-anchor="middle">Bu kitob standart sifatida Opus 4.8 dan foydalanadi. Narx — 1M token uchun (kirish / chiqish).</text>

  <!-- Fable 5 -->
  <rect x="30" y="80" width="180" height="320" rx="14" fill="#ffffff" stroke="#9333ea" stroke-width="2"/>
  <rect x="30" y="80" width="180" height="46" rx="14" fill="#9333ea"/>
  <text x="120" y="110" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Fable 5</text>
  <text x="120" y="152" font-size="14" font-weight="bold" fill="#9333ea" text-anchor="middle">Eng kuchli</text>
  <text x="120" y="186" font-size="13" fill="#475569" text-anchor="middle">Kontekst: 1M</text>
  <text x="120" y="212" font-size="13" fill="#475569" text-anchor="middle">Narx: $10 / $50</text>
  <line x1="50" y1="232" x2="190" y2="232" stroke="#e0e7ff" stroke-width="1.5"/>
  <text x="120" y="258" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">Qachon:</text>
  <text x="120" y="282" font-size="13" fill="#64748b" text-anchor="middle">eng og'ir, eng</text>
  <text x="120" y="302" font-size="13" fill="#64748b" text-anchor="middle">murakkab vazifa</text>
  <text x="120" y="358" font-size="13" fill="#64748b" text-anchor="middle">claude-fable-5</text>

  <!-- Opus 4.8 (default, highlighted) -->
  <rect x="222" y="70" width="180" height="340" rx="14" fill="#ffffff" stroke="#d97757" stroke-width="3"/>
  <rect x="222" y="70" width="180" height="46" rx="14" fill="#d97757"/>
  <text x="312" y="100" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Opus 4.8</text>
  <text x="312" y="142" font-size="14" font-weight="bold" fill="#d97757" text-anchor="middle">★ Standart</text>
  <text x="312" y="176" font-size="13" fill="#475569" text-anchor="middle">Kontekst: 1M</text>
  <text x="312" y="202" font-size="13" fill="#475569" text-anchor="middle">Narx: $5 / $25</text>
  <line x1="242" y1="222" x2="382" y2="222" stroke="#fef3c7" stroke-width="1.5"/>
  <text x="312" y="248" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">Qachon:</text>
  <text x="312" y="272" font-size="13" fill="#64748b" text-anchor="middle">deyarli hamma</text>
  <text x="312" y="292" font-size="13" fill="#64748b" text-anchor="middle">ish; aqlli va</text>
  <text x="312" y="312" font-size="13" fill="#64748b" text-anchor="middle">avtonom agent</text>
  <text x="312" y="368" font-size="13" fill="#64748b" text-anchor="middle">claude-opus-4-8</text>

  <!-- Sonnet 4.6 -->
  <rect x="414" y="80" width="180" height="320" rx="14" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <rect x="414" y="80" width="180" height="46" rx="14" fill="#6366f1"/>
  <text x="504" y="110" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Sonnet 4.6</text>
  <text x="504" y="152" font-size="14" font-weight="bold" fill="#6366f1" text-anchor="middle">Muvozanat</text>
  <text x="504" y="186" font-size="13" fill="#475569" text-anchor="middle">Kontekst: 1M</text>
  <text x="504" y="212" font-size="13" fill="#475569" text-anchor="middle">Narx: $3 / $15</text>
  <line x1="434" y1="232" x2="574" y2="232" stroke="#e0e7ff" stroke-width="1.5"/>
  <text x="504" y="258" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">Qachon:</text>
  <text x="504" y="282" font-size="13" fill="#64748b" text-anchor="middle">tezlik + aql;</text>
  <text x="504" y="302" font-size="13" fill="#64748b" text-anchor="middle">katta hajmli ish</text>
  <text x="504" y="358" font-size="13" fill="#64748b" text-anchor="middle">claude-sonnet-4-6</text>

  <!-- Haiku 4.5 -->
  <rect x="606" y="80" width="180" height="320" rx="14" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <rect x="606" y="80" width="180" height="46" rx="14" fill="#0ea5e9"/>
  <text x="696" y="110" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Haiku 4.5</text>
  <text x="696" y="152" font-size="14" font-weight="bold" fill="#0ea5e9" text-anchor="middle">Tez va arzon</text>
  <text x="696" y="186" font-size="13" fill="#475569" text-anchor="middle">Kontekst: 200K</text>
  <text x="696" y="212" font-size="13" fill="#475569" text-anchor="middle">Narx: $1 / $5</text>
  <line x1="626" y1="232" x2="766" y2="232" stroke="#dbeafe" stroke-width="1.5"/>
  <text x="696" y="258" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">Qachon:</text>
  <text x="696" y="282" font-size="13" fill="#64748b" text-anchor="middle">oddiy, tezkor</text>
  <text x="696" y="302" font-size="13" fill="#64748b" text-anchor="middle">ish; tasniflash</text>
  <text x="696" y="358" font-size="13" fill="#64748b" text-anchor="middle">claude-haiku-4-5</text>

  <text x="400" y="428" font-size="13" fill="#64748b" text-anchor="middle">Chapdan o'ngga: kuchliroq/qimmatroq → tezroq/arzonroq. Boshqa provayderlar ham bor; bu kitob Claude'dan foydalanadi.</text>
</svg>
