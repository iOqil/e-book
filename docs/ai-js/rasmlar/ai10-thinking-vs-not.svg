<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Segoe UI, system-ui, sans-serif">
  <title>Qiyin masala thinkingsiz: model birinchi javobni darhol aytadi va ADASHADI; adaptiv thinking bilan model "qoralama qog'oz"da (thinking bloklari) qadam-baqadam o'ylab, TO'G'RI javob beradi — talaba qoralamada hisoblaydi vs birinchi javobni boltiraydi.</title>
  <defs>
    <marker id="a10t" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="500" fill="#f8fafc"/>
  <text x="400" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Thinking nima beradi? — qoralama qog'oz analogiyasi</text>
  <text x="400" y="58" font-size="14" fill="#64748b" text-anchor="middle">Qiyin masala: "Bir poyezd 3 soatda 240 km, ikkinchisi 2 soatda 180 km. Qaysi tezroq va necha foizga?"</text>

  <!-- TOP: without thinking -->
  <text x="40" y="98" font-size="15" font-weight="bold" fill="#ef4444" text-anchor="start">Thinkingsiz — birinchi javobni darhol boltiradi</text>

  <rect x="40" y="112" width="200" height="78" rx="10" fill="#dbeafe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="140" y="140" font-size="14" font-weight="bold" fill="#0ea5e9" text-anchor="middle">Savol</text>
  <text x="140" y="164" font-size="13" fill="#475569" text-anchor="middle">2 poyezd,</text>
  <text x="140" y="182" font-size="13" fill="#475569" text-anchor="middle">tezlik solishtir</text>

  <line x1="240" y1="151" x2="300" y2="151" stroke="#64748b" stroke-width="2.5" marker-end="url(#a10t)"/>

  <rect x="304" y="112" width="190" height="78" rx="10" fill="#6366f1"/>
  <text x="399" y="146" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Model</text>
  <text x="399" y="170" font-size="13" fill="#e0e7ff" text-anchor="middle">o'ylamasdan darhol</text>

  <line x1="494" y1="151" x2="554" y2="151" stroke="#64748b" stroke-width="2.5" marker-end="url(#a10t)"/>

  <rect x="558" y="112" width="202" height="78" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="2.5"/>
  <text x="659" y="140" font-size="15" font-weight="bold" fill="#ef4444" text-anchor="middle">❌ "Birinchisi"</text>
  <text x="659" y="164" font-size="13" fill="#475569" text-anchor="middle">80 vs 90 — chalkash</text>
  <text x="659" y="182" font-size="13" fill="#475569" text-anchor="middle">hisob, NOTO'G'RI</text>

  <!-- divider -->
  <line x1="40" y1="216" x2="760" y2="216" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,5"/>

  <!-- BOTTOM: with adaptive thinking -->
  <text x="40" y="252" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="start">Adaptiv thinking bilan — avval "qoralama qog'oz"da o'ylaydi</text>

  <rect x="40" y="266" width="200" height="78" rx="10" fill="#dbeafe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="140" y="294" font-size="14" font-weight="bold" fill="#0ea5e9" text-anchor="middle">Savol</text>
  <text x="140" y="318" font-size="13" fill="#475569" text-anchor="middle">2 poyezd,</text>
  <text x="140" y="336" font-size="13" fill="#475569" text-anchor="middle">tezlik solishtir</text>

  <line x1="240" y1="305" x2="296" y2="305" stroke="#64748b" stroke-width="2.5" marker-end="url(#a10t)"/>

  <!-- scratch paper: thinking block -->
  <rect x="300" y="262" width="262" height="124" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="431" y="285" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="middle">📝 thinking — qoralama qog'oz</text>
  <text x="316" y="309" font-size="13" fill="#475569" text-anchor="start" font-family="Consolas, monospace">1: 240/3 = 80 km/soat</text>
  <text x="316" y="329" font-size="13" fill="#475569" text-anchor="start" font-family="Consolas, monospace">2: 180/2 = 90 km/soat</text>
  <text x="316" y="349" font-size="13" fill="#475569" text-anchor="start" font-family="Consolas, monospace">2-si tez: (90-80)/80</text>
  <text x="316" y="369" font-size="13" fill="#475569" text-anchor="start" font-family="Consolas, monospace">= 12.5%</text>

  <line x1="562" y1="324" x2="614" y2="324" stroke="#64748b" stroke-width="2.5" marker-end="url(#a10t)"/>

  <rect x="618" y="282" width="142" height="84" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="689" y="312" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">✅ "Ikkinchisi,</text>
  <text x="689" y="334" font-size="14" fill="#16a34a" text-anchor="middle">12.5% tezroq"</text>
  <text x="689" y="354" font-size="13" fill="#475569" text-anchor="middle">TO'G'RI</text>

  <!-- footer -->
  <rect x="40" y="408" width="720" height="74" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="60" y="434" font-size="13.5" fill="#1e293b" text-anchor="start" font-weight="bold">Xuddi talaba kabi: birinchi xayolga kelgan javobni aytsa adashadi; masalani qoralamada qadam-baqadam</text>
  <text x="60" y="456" font-size="13.5" fill="#475569" text-anchor="start">ishlasa to'g'ri chiqadi. thinking — modelning shu "qoralama qog'ozi". Qiyin (matn, mantiq, ko'p qadamli)</text>
  <text x="60" y="474" font-size="13.5" fill="#475569" text-anchor="start">masalalarda aniqlikni keskin oshiradi. Oddiy savolda esa shart emas — bekorga token sarflaydi.</text>
</svg>
