<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" width="780" height="460" font-family="Segoe UI, system-ui, sans-serif">
  <title>API kalit xavfsizligi: to'g'ri yo'l — kalitni .env faylida saqlash va .gitignore qilish; noto'g'ri yo'l — kalitni kodga yozib GitHub'ga yuklash, natijada kalit o'g'irlanadi</title>
  <rect x="0" y="0" width="780" height="460" fill="#f8fafc"/>
  <text x="390" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">API kalitni qayerda saqlash kerak?</text>
  <text x="390" y="58" font-size="14" fill="#64748b" text-anchor="middle">Kalit — bu sizning pulingiz. O'g'irlansa, hisobingizdan begona pul sarflaydi.</text>

  <!-- TO'G'RI -->
  <rect x="30" y="80" width="350" height="340" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="205" y="112" font-size="17" font-weight="bold" fill="#16a34a" text-anchor="middle">To'g'ri yo'l</text>

  <rect x="58" y="132" width="294" height="62" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="72" y="155" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="start" font-family="Consolas, monospace">.env</text>
  <text x="72" y="180" font-size="13" fill="#475569" text-anchor="start" font-family="Consolas, monospace">ANTHROPIC_API_KEY=sk-ant-...</text>

  <rect x="58" y="206" width="294" height="50" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="72" y="228" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="start" font-family="Consolas, monospace">.gitignore</text>
  <text x="72" y="248" font-size="13" fill="#475569" text-anchor="start" font-family="Consolas, monospace">.env</text>

  <rect x="58" y="268" width="294" height="50" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="72" y="290" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="start" font-family="Consolas, monospace">app.js</text>
  <text x="72" y="310" font-size="13" fill="#475569" text-anchor="start" font-family="Consolas, monospace">new Anthropic()  // env'dan o'qiydi</text>

  <text x="205" y="346" font-size="13.5" fill="#16a34a" text-anchor="middle">Kalit faqat sizning mashinangizda.</text>
  <text x="205" y="368" font-size="13.5" fill="#16a34a" text-anchor="middle">Git'ga hech qachon tushmaydi.</text>
  <text x="205" y="398" font-size="22" font-weight="bold" fill="#16a34a" text-anchor="middle">&#10003; Xavfsiz</text>

  <!-- NOTO'G'RI -->
  <rect x="400" y="80" width="350" height="340" rx="14" fill="#fef3c7" stroke="#ef4444" stroke-width="2.5"/>
  <text x="575" y="112" font-size="17" font-weight="bold" fill="#ef4444" text-anchor="middle">Noto'g'ri yo'l</text>

  <rect x="428" y="132" width="294" height="78" rx="9" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="442" y="155" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="start" font-family="Consolas, monospace">app.js</text>
  <text x="442" y="178" font-size="13" fill="#ef4444" text-anchor="start" font-family="Consolas, monospace">new Anthropic({</text>
  <text x="442" y="198" font-size="13" fill="#ef4444" text-anchor="start" font-family="Consolas, monospace">  apiKey: "sk-ant-abc123" })</text>

  <rect x="428" y="224" width="294" height="48" rx="9" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="575" y="253" font-size="13.5" fill="#475569" text-anchor="middle" font-family="Consolas, monospace">git push &#8594; GitHub (ochiq)</text>

  <text x="575" y="298" font-size="13.5" fill="#d97757" text-anchor="middle">Kalit kod ichida — hammaga ko'rinadi.</text>
  <text x="575" y="320" font-size="13.5" fill="#d97757" text-anchor="middle">Botlar repozitoriylarni skanlaydi,</text>
  <text x="575" y="342" font-size="13.5" fill="#d97757" text-anchor="middle">kalitni topib, pulingizni sarflaydi.</text>
  <text x="575" y="372" font-size="22" font-weight="bold" fill="#ef4444" text-anchor="middle">&#10007; O'g'irlanadi</text>
  <text x="575" y="398" font-size="13" fill="#64748b" text-anchor="middle">Kalit kodga kirsa — uni darhol bekor qiling</text>
</svg>
