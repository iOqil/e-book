<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Bitta so'rov narxi: input_tokens kirish narxiga, output_tokens chiqish narxiga ko'paytiriladi; chiqish qimmatroq (Opus 4.8 $5 in / $25 out); o'zbekcha va kod ko'proq token oladi</title>
  <defs>
    <marker id="ar14a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97757"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="470" fill="#f8fafc"/>
  <text x="400" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Bitta so'rov narxi qanday hisoblanadi</text>
  <text x="400" y="58" font-size="14" fill="#64748b" text-anchor="middle">Siz HAR input token uchun ham, HAR output token uchun ham to'laysiz — chiqish qimmatroq</text>

  <!-- input box -->
  <rect x="40" y="92" width="220" height="120" rx="12" fill="#dbeafe" stroke="#0ea5e9" stroke-width="2.5"/>
  <text x="150" y="122" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">KIRISH (input)</text>
  <text x="150" y="148" font-size="14" fill="#475569" text-anchor="middle">prompt + tarix + rasm</text>
  <text x="150" y="174" font-size="15" font-weight="bold" fill="#0ea5e9" text-anchor="middle">1 200 token</text>
  <text x="150" y="196" font-size="13" fill="#475569" text-anchor="middle">$5 / 1M token</text>

  <!-- output box -->
  <rect x="540" y="92" width="220" height="120" rx="12" fill="#fef3c7" stroke="#d97757" stroke-width="2.5"/>
  <text x="650" y="122" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">CHIQISH (output)</text>
  <text x="650" y="148" font-size="14" fill="#475569" text-anchor="middle">model javobi</text>
  <text x="650" y="174" font-size="15" font-weight="bold" fill="#d97757" text-anchor="middle">800 token</text>
  <text x="650" y="196" font-size="13" fill="#475569" text-anchor="middle">$25 / 1M token (5x!)</text>

  <!-- model in middle -->
  <rect x="320" y="112" width="160" height="80" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="400" y="146" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Claude</text>
  <text x="400" y="170" font-size="13" fill="#94a3b8" text-anchor="middle">Opus 4.8</text>
  <line x1="264" y1="152" x2="316" y2="152" stroke="#d97757" stroke-width="2.5" marker-end="url(#ar14a)"/>
  <line x1="484" y1="152" x2="536" y2="152" stroke="#d97757" stroke-width="2.5" marker-end="url(#ar14a)"/>

  <!-- usage object -->
  <text x="400" y="250" font-size="14" font-weight="bold" fill="#6366f1" text-anchor="middle">msg.usage — sizning haqiqiy hisobingiz</text>
  <rect x="150" y="262" width="500" height="48" rx="9" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="400" y="291" font-size="13.5" fill="#1e293b" text-anchor="middle" font-family="Consolas, monospace">{ input_tokens: 1200, output_tokens: 800 }</text>

  <!-- formula -->
  <rect x="60" y="332" width="680" height="78" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="400" y="358" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">narx = input × kirish_narxi + output × chiqish_narxi</text>
  <text x="400" y="384" font-size="13.5" fill="#475569" text-anchor="middle" font-family="Consolas, monospace">1200/1e6 × $5  +  800/1e6 × $25</text>
  <text x="400" y="404" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">= $0.006 + $0.020 = $0.026</text>

  <!-- callout -->
  <rect x="40" y="426" width="720" height="34" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="448" font-size="13.5" fill="#1e293b" text-anchor="middle">O'zbekcha va kod inglizchadan KO'PROQ token oladi — bir xil ma'noli prompt sizga qimmatroq tushadi</text>
</svg>
