<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Segoe UI, system-ui, sans-serif">
  <title>Production deploy arxitekturasi: foydalanuvchilar (brauzer/mobil) CDN/edge orqali sizning serverless yoki edge route'ingizga ulanadi; route ANTHROPIC_API_KEY ni platforma maxfiy do'konidan (secrets) o'qib Anthropic'ni chaqiradi; oqimli javob xuddi shu yo'l bilan foydalanuvchiga qaytadi. Kalit har doim server maxfiylarida qoladi, hech qachon klientga chiqmaydi.</title>
  <defs>
    <marker id="d25f" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/>
    </marker>
    <marker id="d25r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="500" fill="#f8fafc"/>
  <text x="400" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Production deploy — kalit platforma maxfiylarida</text>
  <text x="400" y="58" font-size="14" fill="#64748b" text-anchor="middle">Foydalanuvchi → edge/serverless route (kalit) → Anthropic; javob xuddi shu yo'ldan qaytadi</text>

  <!-- Users -->
  <rect x="28" y="98" width="168" height="150" rx="12" fill="#dbeafe" stroke="#0ea5e9" stroke-width="2.5"/>
  <text x="112" y="126" font-size="15" font-weight="bold" fill="#0ea5e9" text-anchor="middle">Foydalanuvchilar</text>
  <rect x="50" y="142" width="124" height="38" rx="8" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="112" y="166" font-size="13" fill="#1e293b" text-anchor="middle">brauzer</text>
  <rect x="50" y="190" width="124" height="38" rx="8" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="112" y="214" font-size="13" fill="#1e293b" text-anchor="middle">mobil ilova</text>

  <!-- Edge / serverless route -->
  <rect x="248" y="86" width="232" height="298" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="364" y="114" font-size="15" font-weight="bold" fill="#6366f1" text-anchor="middle">Sizning deploy'ingiz</text>
  <text x="364" y="133" font-size="13" fill="#475569" text-anchor="middle">(Vercel / Cloudflare / Node)</text>

  <rect x="268" y="146" width="192" height="40" rx="8" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="364" y="171" font-size="13" fill="#1e293b" text-anchor="middle">CDN / edge tarmoq</text>

  <rect x="268" y="196" width="192" height="48" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="364" y="217" font-size="13" fill="#1e293b" text-anchor="middle">/api/chat route</text>
  <text x="364" y="235" font-size="13" fill="#475569" text-anchor="middle">streamText(...)</text>

  <rect x="268" y="256" width="192" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="364" y="277" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">🔑 ANTHROPIC_API_KEY</text>
  <text x="364" y="296" font-size="13" fill="#1e293b" text-anchor="middle">platforma maxfiylaridan</text>

  <rect x="268" y="318" width="192" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="364" y="339" font-size="13" fill="#1e293b" text-anchor="middle">process.env orqali</text>
  <text x="364" y="357" font-size="13" fill="#475569" text-anchor="middle">o'qiladi (git'da emas)</text>

  <!-- Anthropic -->
  <rect x="588" y="98" width="184" height="150" rx="12" fill="#fef3c7" stroke="#d97757" stroke-width="2.5"/>
  <text x="680" y="126" font-size="15" font-weight="bold" fill="#d97757" text-anchor="middle">Anthropic</text>
  <text x="680" y="156" font-size="13" fill="#475569" text-anchor="middle">claude-opus-4-8</text>
  <rect x="608" y="172" width="144" height="56" rx="8" fill="#ffffff" stroke="#d97757" stroke-width="1.5"/>
  <text x="680" y="194" font-size="13" fill="#1e293b" text-anchor="middle">model javobni</text>
  <text x="680" y="213" font-size="13" fill="#1e293b" text-anchor="middle">oqim qiladi</text>

  <!-- forward arrows -->
  <line x1="196" y1="165" x2="244" y2="165" stroke="#6366f1" stroke-width="2.5" marker-end="url(#d25f)"/>
  <text x="222" y="155" font-size="13" fill="#6366f1" text-anchor="middle">HTTPS</text>
  <line x1="480" y1="210" x2="584" y2="160" stroke="#6366f1" stroke-width="2.5" marker-end="url(#d25f)"/>

  <!-- return stream -->
  <line x1="584" y1="200" x2="480" y2="280" stroke="#16a34a" stroke-width="2.5" marker-end="url(#d25r)"/>
  <line x1="244" y1="220" x2="196" y2="220" stroke="#16a34a" stroke-width="2.5" marker-end="url(#d25r)"/>
  <text x="112" y="244" font-size="13" fill="#16a34a" text-anchor="middle">⚡ oqimli javob</text>

  <!-- forbidden -->
  <text x="650" y="320" font-size="13.5" font-weight="bold" fill="#ef4444" text-anchor="middle">❌ klient → Anthropic to'g'ridan:</text>
  <text x="650" y="340" font-size="13.5" fill="#ef4444" text-anchor="middle">kalit oshkor bo'lardi</text>

  <!-- callout -->
  <rect x="60" y="404" width="680" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="430" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">Qaysi platformaga deploy qilsangiz ham — bu chegara o'zgarmaydi</text>
  <text x="400" y="453" font-size="13.5" fill="#1e293b" text-anchor="middle">Kalit faqat SERVER maxfiylarida (Vercel/CF dashboard, .env git'da emas). Klient kodi</text>
  <text x="400" y="473" font-size="13.5" fill="#1e293b" text-anchor="middle">har kimga ko'rinadi — kalit o'sha yerda bo'lmasligi shart (13- va 22-bob).</text>
</svg>
