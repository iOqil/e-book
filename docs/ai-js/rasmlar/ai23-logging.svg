<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>loggedCall o'rami har API chaqiruvini o'rab oladi: kirish (PII tozalangan), chiqish, model, tokenlar -> narx, kechikish, stop_reason, request_id va xatolar log/dashboardga yoziladi</title>
  <defs>
    <marker id="ar23a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97757"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="470" fill="#f8fafc"/>
  <text x="400" y="32" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">loggedCall — har chaqiruvni o'rab, ko'rinadigan qiladi</text>
  <text x="400" y="56" font-size="14" fill="#64748b" text-anchor="middle">O'ram API chaqiruvini o'raydi, oldin-keyinini o'lchaydi va log/dashboardga yozadi</text>

  <!-- input -->
  <rect x="36" y="92" width="150" height="84" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="111" y="118" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Kirish (prompt)</text>
  <text x="111" y="140" font-size="13" fill="#475569" text-anchor="middle">foydalanuvchi matni</text>
  <text x="111" y="160" font-size="13" fill="#ef4444" text-anchor="middle">PII tozalanadi (22-bob)</text>

  <!-- timer start -->
  <line x1="186" y1="134" x2="262" y2="134" stroke="#d97757" stroke-width="2.5" marker-end="url(#ar23a)"/>
  <text x="224" y="124" font-size="13" fill="#64748b" text-anchor="middle">t = start</text>

  <!-- wrapper box -->
  <rect x="266" y="78" width="268" height="312" rx="14" fill="#ffffff" stroke="#d97757" stroke-width="2.5"/>
  <text x="400" y="104" font-size="15" font-weight="bold" fill="#d97757" text-anchor="middle">loggedCall( params )</text>

  <!-- inner api call -->
  <rect x="294" y="120" width="212" height="60" rx="10" fill="#dbeafe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="400" y="144" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">messages.create(params)</text>
  <text x="400" y="166" font-size="13" fill="#475569" text-anchor="middle">Claude API ga so'rov</text>

  <!-- captured list -->
  <text x="400" y="206" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Nimani ushlaymiz:</text>
  <text x="306" y="230" font-size="13" fill="#1e293b" text-anchor="start">• model va parametrlar</text>
  <text x="306" y="252" font-size="13" fill="#1e293b" text-anchor="start">• usage: input/output token</text>
  <text x="306" y="274" font-size="13" fill="#16a34a" text-anchor="start">• tokenlar -&gt; narx (14-bob)</text>
  <text x="306" y="296" font-size="13" fill="#1e293b" text-anchor="start">• kechikish (latency, ms)</text>
  <text x="306" y="318" font-size="13" fill="#1e293b" text-anchor="start">• stop_reason</text>
  <text x="306" y="340" font-size="13" fill="#9333ea" text-anchor="start">• _request_id (qo'llab-quvvat)</text>
  <text x="306" y="362" font-size="13" fill="#ef4444" text-anchor="start">• xato bo'lsa — xatoni ham</text>

  <!-- timer end -->
  <line x1="534" y1="234" x2="610" y2="234" stroke="#d97757" stroke-width="2.5" marker-end="url(#ar23a)"/>
  <text x="572" y="224" font-size="13" fill="#64748b" text-anchor="middle">t = end</text>

  <!-- log / dashboard -->
  <rect x="614" y="110" width="150" height="150" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="689" y="138" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">Log / Dashboard</text>
  <text x="689" y="164" font-size="13" fill="#1e293b" text-anchor="middle">strukturali JSON</text>
  <text x="689" y="186" font-size="13" fill="#475569" text-anchor="middle">qatori = bir chaqiruv</text>
  <text x="689" y="212" font-size="13" fill="#1e293b" text-anchor="middle">narx / user / feature</text>
  <text x="689" y="234" font-size="13" fill="#f59e0b" text-anchor="middle">spike -&gt; ogohlantirish</text>

  <!-- footer -->
  <rect x="36" y="406" width="728" height="48" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="428" font-size="13.5" font-weight="bold" fill="#1e293b" text-anchor="middle">Ko'rmasangiz — tuzata olmaysiz. Har chaqiruvni loglang.</text>
  <text x="400" y="447" font-size="13" fill="#475569" text-anchor="middle">Platformalar (Langfuse, LangSmith, Helicone) yoki o'zingiz yozasiz — muhimi: log bor</text>
</svg>
