<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" font-family="Segoe UI, system-ui, sans-serif">
  <title>Kontekst oynasi: prompt va javob tokenlari belgilangan o'lchamli oynaga sig'ishi kerak</title>
  <rect x="0" y="0" width="780" height="430" fill="#f8fafc"/>
  <text x="390" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Kontekst oynasi — modelning "ish stoli"</text>
  <text x="390" y="58" font-size="14" fill="#64748b" text-anchor="middle">Prompt + javob bitta belgilangan o'lchamga sig'ishi kerak. Claude Opus 4.8 = 1M token.</text>

  <!-- the window box -->
  <rect x="50" y="90" width="600" height="150" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="350" y="84" font-size="14" font-weight="bold" fill="#6366f1" text-anchor="middle">Kontekst oynasi (1 000 000 token)</text>

  <!-- prompt fills -->
  <rect x="62" y="104" width="300" height="122" rx="8" fill="#dbeafe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="212" y="150" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Prompt (kirish)</text>
  <text x="212" y="174" font-size="14" fill="#475569" text-anchor="middle">system + suhbat tarixi</text>
  <text x="212" y="196" font-size="14" fill="#475569" text-anchor="middle">+ sizning savolingiz</text>

  <!-- completion fills -->
  <rect x="370" y="104" width="180" height="122" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="460" y="156" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Javob</text>
  <text x="460" y="180" font-size="14" fill="#475569" text-anchor="middle">(chiqish)</text>

  <!-- free space -->
  <rect x="558" y="104" width="80" height="122" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="598" y="160" font-size="13" fill="#64748b" text-anchor="middle">bo'sh</text>
  <text x="598" y="178" font-size="13" fill="#64748b" text-anchor="middle">joy</text>

  <text x="350" y="262" font-size="14" fill="#16a34a" text-anchor="middle">Hammasi oynaga sig'di — model ko'ra oladi.</text>

  <!-- overflow case -->
  <rect x="50" y="290" width="600" height="100" rx="12" fill="#ffffff" stroke="#ef4444" stroke-width="2.5"/>
  <text x="350" y="284" font-size="14" font-weight="bold" fill="#ef4444" text-anchor="middle">Agar matn juda katta bo'lsa...</text>

  <rect x="62" y="304" width="576" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="350" y="338" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Juda uzun prompt — oyna chetidan oshib ketadi</text>

  <!-- overflow piece sticking out -->
  <rect x="642" y="318" width="60" height="44" rx="8" fill="#fca5a5" stroke="#ef4444" stroke-width="1.5"/>
  <text x="672" y="345" font-size="13" fill="#7f1d1d" text-anchor="middle">sig'maydi</text>
  <text x="672" y="376" font-size="13" fill="#ef4444" text-anchor="middle">✕</text>

  <text x="350" y="412" font-size="13" fill="#64748b" text-anchor="middle">Analogiya: stolga faqat shuncha qog'oz sig'adi. Oshib ketganini qisqartirish kerak.</text>
</svg>
