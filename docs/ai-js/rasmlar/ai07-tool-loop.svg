<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Segoe UI, system-ui, sans-serif">
  <title>Tool-use sikli: foydalanuvchi savoli -> Claude (stop_reason: tool_use) -> SIZNING kodingiz funksiyani bajaradi -> tool_result Claude'ga qaytadi -> Claude javob beradi (end_turn). Kodni Claude emas, SIZ ishlatasiz.</title>
  <defs>
    <marker id="tl1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="500" fill="#f8fafc"/>
  <text x="400" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Tool-use sikli — kim nimani bajaradi?</text>
  <text x="400" y="58" font-size="14" fill="#64748b" text-anchor="middle">Claude QACHON chaqirishni hal qiladi; funksiyani esa SIZ JavaScript'da ishlatasiz.</text>

  <!-- 1: user question -->
  <rect x="300" y="80" width="200" height="56" rx="12" fill="#dbeafe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="400" y="104" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">1. Foydalanuvchi savoli</text>
  <text x="400" y="124" font-size="13" fill="#475569" text-anchor="middle">"Toshkentda ob-havo?"</text>

  <!-- arrow down -->
  <line x1="400" y1="136" x2="400" y2="172" stroke="#64748b" stroke-width="2" marker-end="url(#tl1)"/>

  <!-- 2: Claude decides -->
  <rect x="290" y="176" width="220" height="68" rx="12" fill="#1e293b"/>
  <text x="400" y="200" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2. Claude o'ylaydi</text>
  <text x="400" y="221" font-size="13" fill="#94a3b8" text-anchor="middle">stop_reason === "tool_use"</text>
  <text x="400" y="238" font-size="13" fill="#94a3b8" text-anchor="middle">{ name, input } so'rovini chiqaradi</text>

  <!-- arrow right to your code -->
  <line x1="510" y1="210" x2="620" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#tl1)"/>
  <text x="565" y="200" font-size="13" fill="#64748b" text-anchor="middle">tool_use</text>

  <!-- 3: your code (right) -->
  <rect x="600" y="176" width="180" height="100" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="690" y="200" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="middle">3. SIZNING kodingiz</text>
  <text x="690" y="222" font-size="13" fill="#1e293b" text-anchor="middle">funksiyani bajaradi</text>
  <text x="690" y="240" font-size="13" fill="#475569" text-anchor="middle">getWeather("Toshkent")</text>
  <text x="690" y="262" font-size="13" fill="#475569" text-anchor="middle">Claude EMAS — siz!</text>

  <!-- arrow down from your code -->
  <line x1="690" y1="276" x2="690" y2="312" stroke="#64748b" stroke-width="2" marker-end="url(#tl1)"/>

  <!-- 4: tool_result back -->
  <rect x="600" y="316" width="180" height="68" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="690" y="340" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">4. tool_result</text>
  <text x="690" y="361" font-size="13" fill="#475569" text-anchor="middle">"18°C, ochiq"</text>
  <text x="690" y="378" font-size="13" fill="#475569" text-anchor="middle">Claude'ga qaytadi</text>

  <!-- arrow left back to Claude (loop) -->
  <line x1="600" y1="350" x2="400" y2="350" stroke="#64748b" stroke-width="2" marker-end="url(#tl1)"/>
  <line x1="400" y1="350" x2="400" y2="316" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="500" y="340" font-size="13" fill="#64748b" text-anchor="middle">natija bilan qayta chaqir</text>

  <!-- loop note: back into Claude -->
  <line x1="400" y1="296" x2="400" y2="246" stroke="#64748b" stroke-width="2" marker-end="url(#tl1)"/>
  <rect x="300" y="292" width="200" height="24" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="400" y="309" font-size="13" fill="#6366f1" text-anchor="middle">while: end_turn'gacha takrorla</text>

  <!-- 5: final answer -->
  <rect x="40" y="316" width="220" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="150" y="342" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">5. Yakuniy javob</text>
  <text x="150" y="364" font-size="13" fill="#1e293b" text-anchor="middle">stop_reason === "end_turn"</text>
  <text x="150" y="386" font-size="13" fill="#475569" text-anchor="middle">"Toshkentda 18°C,</text>
  <text x="150" y="404" font-size="13" fill="#475569" text-anchor="middle">ochiq havo."</text>

  <!-- arrow from Claude to final answer (when end_turn) -->
  <line x1="290" y1="225" x2="150" y2="312" stroke="#16a34a" stroke-width="2" marker-end="url(#tl1)"/>
  <text x="190" y="280" font-size="13" fill="#16a34a" text-anchor="middle">end_turn</text>

  <!-- callout footer -->
  <rect x="40" y="440" width="720" height="44" rx="10" fill="#dbeafe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="400" y="461" font-size="13.5" fill="#1e293b" text-anchor="middle">Asosiy g'oya: model kodni o'zi ISHLATMAYDI — u faqat "shu funksiyani chaqir" deb so'raydi.</text>
  <text x="400" y="478" font-size="13.5" fill="#475569" text-anchor="middle">Funksiyani bajarish va natijani qaytarish — sizning ilovangizning vazifasi.</text>
</svg>
