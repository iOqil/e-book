<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" font-family="Segoe UI, system-ui, sans-serif">
  <title>Eksponensial backoff vaqt o'qi: 1-urinish muvaffaqiyatsiz, 1s kut; 2-urinish muvaffaqiyatsiz, 2s kut; 3-urinish muvaffaqiyatsiz, 4s kut (+jitter); muvaffaqiyat. 429 da retry-after ga rioya qiling, urinishlar soni cheklangan</title>
  <defs>
    <marker id="ar16b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="460" fill="#f8fafc"/>
  <text x="400" y="32" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Eksponensial backoff — kutish vaqti o'sib boradi</text>
  <text x="400" y="56" font-size="14" fill="#64748b" text-anchor="middle">kechikish = asos × 2^urinish + jitter (tasodifiy qo'shimcha)</text>

  <!-- time axis -->
  <line x1="50" y1="300" x2="760" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#ar16b)"/>
  <text x="755" y="322" font-size="13" fill="#64748b" text-anchor="end">vaqt</text>

  <!-- attempt 1 (fail) -->
  <rect x="56" y="250" width="86" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="99" y="270" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">1-urinish</text>
  <text x="99" y="288" font-size="13" fill="#ef4444" text-anchor="middle">429 ✗</text>
  <!-- wait 1s -->
  <rect x="146" y="262" width="74" height="26" rx="13" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="183" y="280" font-size="13" fill="#6366f1" text-anchor="middle">kut 1s</text>

  <!-- attempt 2 (fail) -->
  <rect x="224" y="250" width="86" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="267" y="270" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">2-urinish</text>
  <text x="267" y="288" font-size="13" fill="#ef4444" text-anchor="middle">529 ✗</text>
  <!-- wait 2s -->
  <rect x="314" y="262" width="104" height="26" rx="13" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="366" y="280" font-size="13" fill="#6366f1" text-anchor="middle">kut 2s</text>

  <!-- attempt 3 (fail) -->
  <rect x="422" y="250" width="86" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="465" y="270" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">3-urinish</text>
  <text x="465" y="288" font-size="13" fill="#ef4444" text-anchor="middle">500 ✗</text>
  <!-- wait 4s -->
  <rect x="512" y="262" width="150" height="26" rx="13" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="587" y="280" font-size="13" fill="#6366f1" text-anchor="middle">kut 4s + jitter</text>

  <!-- attempt 4 (success) -->
  <rect x="666" y="246" width="92" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="712" y="268" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">4-urinish</text>
  <text x="712" y="287" font-size="13" fill="#16a34a" text-anchor="middle">200 ✓</text>

  <!-- rising bars showing growth -->
  <text x="400" y="100" font-size="14" fill="#475569" text-anchor="middle">Har muvaffaqiyatsiz urinishdan keyin kutish IKKI baravar oshadi:</text>
  <rect x="120" y="190" width="60" height="22" rx="4" fill="#6366f1"/>
  <text x="150" y="206" font-size="13" fill="#ffffff" text-anchor="middle">1s</text>
  <rect x="300" y="168" width="60" height="44" rx="4" fill="#6366f1"/>
  <text x="330" y="195" font-size="13" fill="#ffffff" text-anchor="middle">2s</text>
  <rect x="480" y="124" width="60" height="88" rx="4" fill="#6366f1"/>
  <text x="510" y="172" font-size="13" fill="#ffffff" text-anchor="middle">4s</text>
  <text x="660" y="206" font-size="13" fill="#16a34a" text-anchor="middle">✓ o'tdi</text>

  <!-- rules box -->
  <rect x="40" y="346" width="356" height="98" rx="10" fill="#dbeafe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="218" y="370" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Qoidalar</text>
  <text x="56" y="392" font-size="13" fill="#1e293b" text-anchor="start">• 429 da `retry-after` sarlavhasiga rioya qiling</text>
  <text x="56" y="412" font-size="13" fill="#1e293b" text-anchor="start">• jitter — bir vaqtda hujum (thundering herd) oldini oladi</text>
  <text x="56" y="432" font-size="13" fill="#1e293b" text-anchor="start">• urinishlar sonini cheklang (masalan 5)</text>

  <rect x="412" y="346" width="348" height="98" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="586" y="370" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Esda tuting</text>
  <text x="428" y="392" font-size="13" fill="#1e293b" text-anchor="start">• SDK buni o'zi qiladi (maxRetries: 2)</text>
  <text x="428" y="412" font-size="13" fill="#1e293b" text-anchor="start">• 4xx (429'dan tashqari) ni QAYTA urinmang</text>
  <text x="428" y="432" font-size="13" fill="#1e293b" text-anchor="start">• maksimal kechikishni ham cheklang (cap)</text>
</svg>
