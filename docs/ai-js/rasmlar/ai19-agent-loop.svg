<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="Segoe UI, system-ui, sans-serif">
  <title>Agent loop: maqsad berasiz, keyin model FIKRLAYDI (rejalashtiradi) -> ASBOB chaqiradi -> NATIJANI kuzatadi -> yana fikrlaydi -> ... -> tugagach yakuniy javob. Tsiklning markazida "model o'zi keyingi qadamni TANLAYDI" turadi — bu agentni qattiq yozilgan workflow'dan farqlaydi. stopWhen step chegarasi cheksiz aylanishdan himoya qiladi.</title>
  <defs>
    <marker id="a19a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/>
    </marker>
    <marker id="a19g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="520" fill="#f8fafc"/>
  <text x="400" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Agent loop — fikrla, harakat qil, kuzat</text>
  <text x="400" y="58" font-size="14" fill="#64748b" text-anchor="middle">Model maqsadga yetguncha O'ZI keyingi qadamni tanlaydi (qattiq yozilgan ketma-ketlik EMAS)</text>

  <!-- Goal -->
  <rect x="40" y="92" width="150" height="74" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="115" y="124" font-size="15" font-weight="bold" fill="#6366f1" text-anchor="middle">Maqsad</text>
  <text x="115" y="146" font-size="13" fill="#475569" text-anchor="middle">"X mavzuni</text>
  <text x="115" y="162" font-size="13" fill="#475569" text-anchor="middle">o'rganib hisobot yoz"</text>

  <line x1="190" y1="129" x2="236" y2="129" stroke="#6366f1" stroke-width="2.5" marker-end="url(#a19a)"/>

  <!-- Loop container -->
  <rect x="244" y="86" width="412" height="318" rx="14" fill="#dbeafe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="450" y="110" font-size="15" font-weight="bold" fill="#0ea5e9" text-anchor="middle">TSIKL — tugaguncha takrorlanadi</text>

  <!-- Reason node (top) -->
  <rect x="320" y="124" width="260" height="72" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="152" font-size="15" font-weight="bold" fill="#f59e0b" text-anchor="middle">1. Model FIKRLAYDI</text>
  <text x="450" y="174" font-size="13" fill="#475569" text-anchor="middle">rejalashtiradi: keyin qaysi</text>
  <text x="450" y="190" font-size="13" fill="#475569" text-anchor="middle">asbobni, qachon chaqiray? (10-bob)</text>

  <!-- arrow reason -> act (right side down) -->
  <line x1="580" y1="160" x2="612" y2="160" stroke="#6366f1" stroke-width="2.5"/>
  <line x1="612" y1="160" x2="612" y2="262" stroke="#6366f1" stroke-width="2.5"/>
  <line x1="612" y1="262" x2="584" y2="262" stroke="#6366f1" stroke-width="2.5" marker-end="url(#a19a)"/>

  <!-- Act node (bottom right) -->
  <rect x="400" y="226" width="180" height="72" rx="10" fill="#ffffff" stroke="#d97757" stroke-width="2"/>
  <text x="490" y="254" font-size="15" font-weight="bold" fill="#d97757" text-anchor="middle">2. ASBOB chaqiradi</text>
  <text x="490" y="276" font-size="13" fill="#475569" text-anchor="middle">qidiruv / kalkulyator /</text>
  <text x="490" y="292" font-size="13" fill="#475569" text-anchor="middle">saqlash (07-bob)</text>

  <!-- arrow act -> observe -->
  <line x1="400" y1="262" x2="320" y2="262" stroke="#6366f1" stroke-width="2.5" marker-end="url(#a19a)"/>

  <!-- Observe node (bottom left) -->
  <rect x="320" y="226" width="180" height="0" fill="none"/>
  <rect x="140" y="226" width="180" height="72" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="230" y="254" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">3. NATIJANI kuzatadi</text>
  <text x="230" y="276" font-size="13" fill="#475569" text-anchor="middle">asbob qaytargan</text>
  <text x="230" y="292" font-size="13" fill="#475569" text-anchor="middle">ma'lumotni o'qiydi</text>

  <!-- arrow observe -> reason (left side up, loop back) -->
  <line x1="230" y1="226" x2="230" y2="160" stroke="#6366f1" stroke-width="2.5"/>
  <line x1="230" y1="160" x2="316" y2="160" stroke="#6366f1" stroke-width="2.5" marker-end="url(#a19a)"/>
  <text x="262" y="200" font-size="13" font-weight="bold" fill="#6366f1" text-anchor="middle">yana</text>

  <!-- center note -->
  <rect x="372" y="318" width="270" height="56" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="507" y="340" font-size="13.5" font-weight="bold" fill="#6366f1" text-anchor="middle">Model O'ZI keyingi qadamni tanlaydi</text>
  <text x="507" y="360" font-size="13" fill="#475569" text-anchor="middle">siz if/while yozmaysiz — bu agentlik</text>

  <!-- step cap note left bottom -->
  <rect x="262" y="318" width="100" height="56" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="312" y="340" font-size="13" font-weight="bold" fill="#f59e0b" text-anchor="middle">stopWhen</text>
  <text x="312" y="360" font-size="13" fill="#475569" text-anchor="middle">step cheki</text>

  <!-- Done -->
  <line x1="450" y1="404" x2="450" y2="436" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a19g)"/>
  <text x="478" y="424" font-size="13" fill="#16a34a" text-anchor="start">tugadi (asbob shart emas)</text>

  <rect x="300" y="440" width="300" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="465" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">Yakuniy javob</text>
  <text x="450" y="483" font-size="13" fill="#475569" text-anchor="middle">model "tugadim" deganda chiqadi</text>

  <!-- right side teaching note -->
  <rect x="676" y="124" width="100" height="174" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="726" y="148" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Qism</text>
  <text x="726" y="172" font-size="13" fill="#475569" text-anchor="middle">larni</text>
  <text x="726" y="190" font-size="13" fill="#475569" text-anchor="middle">07/12-</text>
  <text x="726" y="208" font-size="13" fill="#475569" text-anchor="middle">bobda</text>
  <text x="726" y="226" font-size="13" fill="#475569" text-anchor="middle">qurgansiz:</text>
  <text x="726" y="248" font-size="13" fill="#0ea5e9" text-anchor="middle">tool +</text>
  <text x="726" y="266" font-size="13" fill="#0ea5e9" text-anchor="middle">loop +</text>
  <text x="726" y="284" font-size="13" fill="#0ea5e9" text-anchor="middle">stopWhen</text>
</svg>
