<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>Keyingi tokenni bashorat qilish: kirish tokenlari, model va ehtimollik taqsimoti</title>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="440" fill="#f8fafc"/>
  <text x="390" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">LLM "keyingi token" ni bashorat qiladi</text>
  <text x="390" y="58" font-size="14" fill="#64748b" text-anchor="middle">Sehr emas — ehtimollik. Model eng ehtimolli tokenni tanlaydi.</text>

  <!-- kirish tokenlari -->
  <text x="120" y="95" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">Kirish (oldingi tokenlar)</text>
  <rect x="40" y="110" width="80" height="44" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="80" y="138" font-size="15" fill="#1e293b" text-anchor="middle">"Bugun"</text>
  <rect x="130" y="110" width="100" height="44" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="180" y="138" font-size="15" fill="#1e293b" text-anchor="middle">"ob-havo"</text>

  <!-- arrow to model -->
  <line x1="232" y1="132" x2="300" y2="200" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- model -->
  <rect x="295" y="180" width="190" height="80" rx="14" fill="#6366f1"/>
  <text x="390" y="214" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Model (neyron tarmoq)</text>
  <text x="390" y="240" font-size="14" fill="#e0e7ff" text-anchor="middle">claude-opus-4-8</text>

  <!-- arrow to distribution -->
  <line x1="487" y1="220" x2="555" y2="220" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="560" y="178" font-size="14" font-weight="bold" fill="#475569" text-anchor="start">Ehtimollik taqsimoti</text>

  <!-- distribution bars -->
  <!-- issiq 0.6 -->
  <rect x="560" y="190" width="156" height="26" rx="5" fill="#16a34a"/>
  <text x="566" y="208" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="start">"issiq"</text>
  <text x="724" y="208" font-size="14" fill="#16a34a" text-anchor="start">0.60</text>
  <!-- yomg'irli 0.20 -->
  <rect x="560" y="224" width="78" height="22" rx="5" fill="#0ea5e9"/>
  <text x="566" y="240" font-size="13" fill="#ffffff" text-anchor="start">"yomg'irli"</text>
  <text x="646" y="240" font-size="14" fill="#0ea5e9" text-anchor="start">0.20</text>
  <!-- sovuq 0.12 -->
  <rect x="560" y="254" width="47" height="22" rx="5" fill="#94a3b8"/>
  <text x="566" y="270" font-size="13" fill="#ffffff" text-anchor="start">"sovuq"</text>
  <text x="615" y="270" font-size="14" fill="#64748b" text-anchor="start">0.12</text>
  <!-- ... -->
  <text x="560" y="294" font-size="13" fill="#94a3b8" text-anchor="start">... (qolgan minglab token)   0.08</text>

  <!-- pick line -->
  <line x1="638" y1="203" x2="390" y2="330" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr)"/>

  <!-- chosen token -->
  <text x="390" y="360" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">Tanlangan token qo'shiladi</text>
  <rect x="250" y="372" width="280" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="390" y="400" font-size="15" fill="#1e293b" text-anchor="middle">"Bugun ob-havo issiq" → keyingisi...</text>

  <text x="40" y="400" font-size="13" fill="#64748b" text-anchor="start">Har token uchun</text>
  <text x="40" y="418" font-size="13" fill="#64748b" text-anchor="start">jarayon takrorlanadi</text>
</svg>
