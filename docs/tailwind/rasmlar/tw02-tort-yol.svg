<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" width="780" height="460" font-family="Segoe UI, system-ui, sans-serif">
  <title>Tailwind CSS v4 ni ishlatishning to'rt yo'li: Vite plugin, PostCSS, Standalone CLI va Play CDN — qaysi biri qachon</title>
  <rect x="0" y="0" width="780" height="460" fill="#f8fafc"/>
  <text x="390" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">Tailwind v4 ni ishlatishning to'rt yo'li</text>
  <text x="390" y="60" text-anchor="middle" font-size="14" fill="#64748b">har biri boshqa loyihaga mos — qaysi birini tanlash kerak?</text>

  <!-- 1. Vite plugin -->
  <rect x="30" y="86" width="350" height="158" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/>
  <rect x="30" y="86" width="350" height="34" rx="12" fill="#6366f1"/>
  <rect x="30" y="104" width="350" height="16" fill="#6366f1"/>
  <text x="48" y="109" font-size="16" font-weight="bold" fill="#ffffff">1 · Vite plugin</text>
  <text x="365" y="109" text-anchor="end" font-size="13" fill="#ffffff">@tailwindcss/vite</text>
  <text x="48" y="146" font-size="14" fill="#1e293b">Qachon: real ilovalar — React,</text>
  <text x="48" y="166" font-size="14" fill="#1e293b">Vue, Svelte, vanilla Vite.</text>
  <text x="48" y="194" font-size="13" fill="#475569">Eng tez build, eng yaxshi DX.</text>
  <rect x="48" y="208" width="200" height="24" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="148" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#16a34a">TAVSIYA · production</text>

  <!-- 2. PostCSS -->
  <rect x="400" y="86" width="350" height="158" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2.5"/>
  <rect x="400" y="86" width="350" height="34" rx="12" fill="#0ea5e9"/>
  <rect x="400" y="104" width="350" height="16" fill="#0ea5e9"/>
  <text x="418" y="109" font-size="16" font-weight="bold" fill="#ffffff">2 · PostCSS</text>
  <text x="735" y="109" text-anchor="end" font-size="13" fill="#ffffff">@tailwindcss/postcss</text>
  <text x="418" y="146" font-size="14" fill="#1e293b">Qachon: Next.js, webpack yoki</text>
  <text x="418" y="166" font-size="14" fill="#1e293b">tayyor PostCSS quvuri bor loyiha.</text>
  <text x="418" y="194" font-size="13" fill="#475569">postcss.config.mjs ichiga ulanadi.</text>
  <rect x="418" y="208" width="200" height="24" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="518" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#16a34a">production · framework</text>

  <!-- 3. CLI -->
  <rect x="30" y="262" width="350" height="158" rx="12" fill="#ffffff" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="30" y="262" width="350" height="34" rx="12" fill="#38bdf8"/>
  <rect x="30" y="280" width="350" height="16" fill="#38bdf8"/>
  <text x="48" y="285" font-size="16" font-weight="bold" fill="#1e293b">3 · Standalone CLI</text>
  <text x="365" y="285" text-anchor="end" font-size="13" fill="#1e293b">@tailwindcss/cli</text>
  <text x="48" y="322" font-size="14" fill="#1e293b">Qachon: build-asbobsiz, oddiy</text>
  <text x="48" y="342" font-size="14" fill="#1e293b">HTML. O'rganish uchun ideal.</text>
  <text x="48" y="370" font-size="13" fill="#475569">--watch bilan avtomatik qayta-build.</text>
  <rect x="48" y="384" width="220" height="24" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="158" y="401" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">O'RGANISH · bu bobda</text>

  <!-- 4. Play CDN -->
  <rect x="400" y="262" width="350" height="158" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 4"/>
  <rect x="400" y="262" width="350" height="34" rx="12" fill="#94a3b8"/>
  <rect x="400" y="280" width="350" height="16" fill="#94a3b8"/>
  <text x="418" y="285" font-size="16" font-weight="bold" fill="#ffffff">4 · Play CDN</text>
  <text x="735" y="285" text-anchor="end" font-size="13" fill="#ffffff">browser@4 skript</text>
  <text x="418" y="322" font-size="14" fill="#1e293b">Qachon: tezkor prototip, CodePen,</text>
  <text x="418" y="342" font-size="14" fill="#1e293b">bir martalik demo.</text>
  <text x="418" y="370" font-size="13" fill="#475569">Brauzerda kompilyatsiya — sekin.</text>
  <rect x="418" y="384" width="270" height="24" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="553" y="401" text-anchor="middle" font-size="13" font-weight="bold" fill="#ef4444">FAQAT PROTOTIP · production EMAS</text>

  <text x="390" y="444" text-anchor="middle" font-size="13" fill="#64748b">Hammasi bitta narsani beradi — farqi: build qayerda va qachon bo'ladi.</text>
</svg>
