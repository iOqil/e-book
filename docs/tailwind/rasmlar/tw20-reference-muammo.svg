<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Segoe UI, system-ui, sans-serif">
  <title>Vue SFC style blokida @apply ishlamaydi chunki fayl alohida kompilyatsiya qilinadi; tepaga @reference "../app.css" qo'shilsa, blok temani biladi va @apply ishlaydi</title>
  <rect x="0" y="0" width="800" height="500" fill="#f8fafc"/>

  <text x="400" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">@reference — v4 ning eng ko'p o'tkazib yuboriladigan qadami</text>
  <text x="400" y="60" text-anchor="middle" font-size="14" fill="#475569">Alohida kompilyatsiya qilinadigan &lt;style&gt; bloki temani bilmaydi — uni ulab berish kerak</text>

  <!-- BEFORE -->
  <rect x="30" y="84" width="355" height="356" rx="12" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="207" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#ef4444">AVVAL — jim ishlamaydi</text>

  <!-- red X badge -->
  <circle cx="62" cy="104" r="13" fill="#ef4444"/>
  <text x="62" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">&#10007;</text>

  <rect x="52" y="124" width="311" height="150" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="68" y="148" font-size="13" font-weight="bold" fill="#64748b">Card.vue</text>
  <text x="68" y="172" font-size="14" fill="#475569">&lt;style&gt;</text>
  <text x="84" y="196" font-size="14" fill="#1e293b">.card &#123;</text>
  <text x="100" y="220" font-size="14" fill="#1e293b">@apply rounded-xl p-6</text>
  <text x="100" y="240" font-size="14" fill="#1e293b">bg-primary text-white;</text>
  <text x="84" y="260" font-size="14" fill="#1e293b">&#125;</text>
  <text x="68" y="280" font-size="14" fill="#475569" opacity="0">&lt;/style&gt;</text>

  <rect x="52" y="288" width="311" height="64" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="68" y="312" font-size="13" font-weight="bold" fill="#ef4444">Natija: stil umuman chiqmaydi</text>
  <text x="68" y="334" font-size="13" fill="#475569">Bu blok app.css'dagi tema kontekstini</text>
  <text x="68" y="350" font-size="13" fill="#475569">ko'rmaydi — @apply klasslarni bilmaydi.</text>

  <text x="207" y="384" text-anchor="middle" font-size="13" fill="#475569">Xatolik ham bermaydi — eng yomon tomoni</text>
  <text x="207" y="408" text-anchor="middle" font-size="13" font-weight="bold" fill="#ef4444">"Nega ishlamayapti?!" — #1 v4 chalkashligi</text>

  <!-- arrow between -->
  <line x1="392" y1="260" x2="420" y2="260" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="420,260 406,253 406,267" fill="#16a34a"/>
  <text x="406" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#16a34a">+1 qator</text>

  <!-- AFTER -->
  <rect x="428" y="84" width="342" height="356" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="599" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#16a34a">KEYIN — ishlaydi</text>

  <!-- green check badge -->
  <circle cx="460" cy="104" r="13" fill="#16a34a"/>
  <text x="460" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">&#10003;</text>

  <rect x="450" y="124" width="300" height="174" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="466" y="148" font-size="13" font-weight="bold" fill="#64748b">Card.vue</text>
  <text x="466" y="172" font-size="14" fill="#475569">&lt;style&gt;</text>
  <rect x="462" y="180" width="276" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="474" y="198" font-size="13" font-weight="bold" fill="#16a34a">@reference "../app.css";</text>
  <text x="484" y="226" font-size="14" fill="#1e293b">.card &#123;</text>
  <text x="500" y="250" font-size="14" fill="#1e293b">@apply rounded-xl p-6</text>
  <text x="500" y="270" font-size="14" fill="#1e293b">bg-primary text-white;</text>
  <text x="484" y="290" font-size="14" fill="#1e293b">&#125;</text>

  <rect x="450" y="312" width="300" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="466" y="336" font-size="13" font-weight="bold" fill="#16a34a">Natija: stil to'g'ri qo'llanadi</text>
  <text x="466" y="358" font-size="13" fill="#475569">@reference temani import qiladi — LEKIN</text>
  <text x="466" y="376" font-size="13" fill="#475569">CSS chiqishini TAKRORLAMAYDI (faqat kontekst).</text>

  <rect x="100" y="452" width="600" height="36" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="400" y="475" text-anchor="middle" font-size="13" fill="#4f46e5">Qoida: @apply yoki theme() ni alohida faylda ishlatsangiz — tepaga @reference qo'shing</text>
</svg>
