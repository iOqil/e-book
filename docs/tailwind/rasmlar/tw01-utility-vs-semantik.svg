<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500" font-family="Segoe UI, system-ui, sans-serif">
  <title>An'anaviy semantik CSS va utility-first usul yonma-yon: birida fayl orasida sakrash, ikkinchisida hammasi bir joyda</title>
  <rect x="0" y="0" width="780" height="500" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Bir xil tugma — ikki xil yondashuv</text>

  <line x1="390" y1="54" x2="390" y2="448" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- CHAP: An'anaviy / semantik -->
  <rect x="36" y="62" width="312" height="34" rx="8" fill="#dbeafe" stroke="#4f46e5" stroke-width="2"/>
  <text x="192" y="85" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">An'anaviy (semantik) — 2 fayl</text>

  <!-- HTML fayl -->
  <rect x="36" y="108" width="312" height="58" rx="8" fill="#1e293b"/>
  <text x="52" y="126" font-family="Consolas, monospace" font-size="13" fill="#64748b">index.html</text>
  <text x="52" y="148" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">&lt;button class=</text>
  <text x="170" y="148" font-family="Consolas, monospace" font-size="13" fill="#38bdf8">"btn"</text>
  <text x="214" y="148" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">&gt;...</text>

  <!-- sakrash o'qi -->
  <path d="M 192 168 L 192 188" stroke="#ef4444" stroke-width="2" fill="none"/>
  <polygon points="192,194 187,184 197,184" fill="#ef4444"/>
  <text x="202" y="184" font-size="13" fill="#ef4444">fayl orasida sakrash</text>

  <!-- CSS fayl -->
  <rect x="36" y="198" width="312" height="124" rx="8" fill="#1e293b"/>
  <text x="52" y="216" font-family="Consolas, monospace" font-size="13" fill="#64748b">styles.css</text>
  <text x="52" y="238" font-family="Consolas, monospace" font-size="13" fill="#38bdf8">.btn {</text>
  <text x="52" y="258" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">  padding: .5rem 1rem;</text>
  <text x="52" y="278" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">  background: #4f46e5;</text>
  <text x="52" y="298" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">  border-radius: .375rem;</text>
  <text x="52" y="316" font-family="Consolas, monospace" font-size="13" fill="#38bdf8">}</text>

  <text x="52" y="352" font-size="13" fill="#ef4444">- Nom o'ylab topiladi (.btn)</text>
  <text x="52" y="374" font-size="13" fill="#ef4444">- Ikki fayl orasida sakrash</text>
  <text x="52" y="396" font-size="13" fill="#ef4444">- Ishlatilmagan CSS o'sib boradi</text>

  <!-- O'NG: Utility-first -->
  <rect x="432" y="62" width="312" height="34" rx="8" fill="#cffafe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="588" y="85" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Utility-first — 1 fayl</text>

  <!-- HTML fayl (hammasi shu yerda) -->
  <rect x="432" y="108" width="312" height="124" rx="8" fill="#1e293b"/>
  <text x="448" y="126" font-family="Consolas, monospace" font-size="13" fill="#64748b">index.html</text>
  <text x="448" y="148" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">&lt;button class=</text>
  <text x="448" y="170" font-family="Consolas, monospace" font-size="13" fill="#38bdf8">  "px-4 py-2 rounded-md</text>
  <text x="448" y="190" font-family="Consolas, monospace" font-size="13" fill="#38bdf8">   bg-indigo-600 text-white"</text>
  <text x="448" y="210" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">&gt;Yuborish&lt;/button&gt;</text>

  <!-- co-location belgisi -->
  <rect x="432" y="244" width="312" height="78" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="588" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">Stil HTML ichida — co-location</text>
  <text x="588" y="294" text-anchor="middle" font-size="13" fill="#475569">Alohida .css fayli yo'q,</text>
  <text x="588" y="312" text-anchor="middle" font-size="13" fill="#475569">sakrash yo'q, nom yo'q</text>

  <text x="448" y="352" font-size="13" fill="#16a34a">+ Nom o'ylab topilmaydi</text>
  <text x="448" y="374" font-size="13" fill="#16a34a">+ Hammasi bir joyda (HTML)</text>
  <text x="448" y="396" font-size="13" fill="#16a34a">+ Ishlatilgan klass CSS chiqaradi</text>

  <!-- yagona xulosa -->
  <rect x="130" y="424" width="520" height="44" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="390" y="451" text-anchor="middle" font-size="13" fill="#1e293b">Ikkalasi bir xil tugmani chizadi — farq stil qayerga yozilishida</text>
</svg>
