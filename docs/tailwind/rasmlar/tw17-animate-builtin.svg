<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="Segoe UI, system-ui, sans-serif">
  <title>Tayyor animatsiyalar: animate-spin (uzilishli aylana yuklagich), animate-pulse (xira skelet chizig'i), animate-bounce (sakrayotgan to'p), animate-ping (kengayuvchi halqa nuqta)</title>
  <rect x="0" y="0" width="800" height="360" fill="#f8fafc"/>

  <text x="400" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">Tailwind'ning tayyor animatsiyalari</text>
  <text x="400" y="62" text-anchor="middle" font-size="14" fill="#475569">Klass qo'shasiz — boshqa hech narsa kerak emas</text>

  <!-- 1) animate-spin -->
  <text x="120" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#4f46e5">animate-spin</text>
  <circle cx="120" cy="180" r="40" fill="none" stroke="#94a3b8" stroke-width="6" opacity="0.35"/>
  <path d="M 120 140 A 40 40 0 0 1 160 180" fill="none" stroke="#4f46e5" stroke-width="6" stroke-linecap="round"/>
  <text x="120" y="262" text-anchor="middle" font-size="13" fill="#64748b">yuklash spinneri</text>
  <text x="120" y="282" text-anchor="middle" font-size="13" fill="#64748b">(aylanadi)</text>

  <!-- 2) animate-pulse -->
  <text x="320" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#4f46e5">animate-pulse</text>
  <rect x="250" y="150" width="140" height="16" rx="8" fill="#94a3b8" opacity="0.55"/>
  <rect x="250" y="178" width="110" height="16" rx="8" fill="#94a3b8" opacity="0.35"/>
  <rect x="250" y="206" width="130" height="16" rx="8" fill="#94a3b8" opacity="0.2"/>
  <text x="320" y="262" text-anchor="middle" font-size="13" fill="#64748b">skelet (skeleton)</text>
  <text x="320" y="282" text-anchor="middle" font-size="13" fill="#64748b">(xiralashib turadi)</text>

  <!-- 3) animate-bounce -->
  <text x="520" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#4f46e5">animate-bounce</text>
  <path d="M 490 150 Q 520 195 550 150" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M 500 160 Q 520 200 540 160" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="520" cy="200" r="22" fill="#0ea5e9"/>
  <line x1="475" y1="226" x2="565" y2="226" stroke="#94a3b8" stroke-width="2"/>
  <text x="520" y="262" text-anchor="middle" font-size="13" fill="#64748b">scroll ishorasi</text>
  <text x="520" y="282" text-anchor="middle" font-size="13" fill="#64748b">(sakraydi)</text>

  <!-- 4) animate-ping -->
  <text x="700" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#4f46e5">animate-ping</text>
  <circle cx="700" cy="185" r="38" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.2"/>
  <circle cx="700" cy="185" r="26" fill="none" stroke="#ef4444" stroke-width="2.5" opacity="0.45"/>
  <circle cx="700" cy="185" r="12" fill="#ef4444"/>
  <text x="700" y="262" text-anchor="middle" font-size="13" fill="#64748b">bildirishnoma nuqtasi</text>
  <text x="700" y="282" text-anchor="middle" font-size="13" fill="#64748b">(halqa kengayadi)</text>

  <!-- bottom note -->
  <text x="400" y="330" text-anchor="middle" font-size="13" fill="#64748b">Doim qisqa va maqsadli — foydalanuvchini chalg'itmaslik uchun motion-reduce: ni unutmang</text>
</svg>
