<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" font-family="Segoe UI, system-ui, sans-serif">
  <title>Frosted glass effekti: bg-white/30 backdrop-blur-md karta rang-barang gradient fon ustida — orqadagi fon shisha orqali xiralashib ko'rinadi</title>
  <rect x="0" y="0" width="780" height="420" fill="#f8fafc"/>

  <text x="390" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Frosted glass — muzlagan shisha effekti</text>
  <text x="390" y="62" text-anchor="middle" font-size="14" fill="#475569">backdrop-blur ORQADAGI narsani xiralashtiradi; yarim-shaffof fon shu xiralikni ko'rsatadi</text>

  <defs>
    <linearGradient id="bgwall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glassblur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <!-- colorful background wall -->
  <rect x="90" y="92" width="600" height="280" rx="16" fill="url(#bgwall)"/>
  <!-- decorative shapes on the wall to make blur visible -->
  <circle cx="200" cy="170" r="46" fill="#ffffff" opacity="0.55"/>
  <circle cx="560" cy="300" r="56" fill="#ffffff" opacity="0.45"/>
  <rect x="430" y="120" width="90" height="90" rx="16" fill="#ef4444" opacity="0.55"/>

  <!-- blurred copy of the wall region behind the glass card (shows blur-through) -->
  <clipPath id="cardclip"><rect x="250" y="170" width="280" height="130" rx="14"/></clipPath>
  <g clip-path="url(#cardclip)" filter="url(#glassblur)">
    <rect x="90" y="92" width="600" height="280" fill="url(#bgwall)"/>
    <circle cx="200" cy="170" r="46" fill="#ffffff" opacity="0.55"/>
    <circle cx="560" cy="300" r="56" fill="#ffffff" opacity="0.45"/>
    <rect x="430" y="120" width="90" height="90" rx="16" fill="#ef4444" opacity="0.55"/>
  </g>
  <!-- translucent white overlay = bg-white/30 -->
  <rect x="250" y="170" width="280" height="130" rx="14" fill="#ffffff" opacity="0.45"/>
  <rect x="250" y="170" width="280" height="130" rx="14" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
  <text x="390" y="232" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Shisha karta</text>
  <text x="390" y="256" text-anchor="middle" font-size="13" fill="#1e293b">orqa fon shu yerda xira ko'rinadi</text>

  <!-- annotations -->
  <rect x="540" y="186" width="200" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="640" y="206" text-anchor="middle" font-size="14" fill="#4f46e5">bg-white/30</text>
  <line x1="540" y1="201" x2="528" y2="210" stroke="#94a3b8" stroke-width="1.5"/>

  <rect x="540" y="252" width="200" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="640" y="272" text-anchor="middle" font-size="14" fill="#4f46e5">backdrop-blur-md</text>
  <line x1="540" y1="267" x2="528" y2="262" stroke="#94a3b8" stroke-width="1.5"/>

  <text x="390" y="402" text-anchor="middle" font-size="13" fill="#ef4444" font-weight="bold">Diqqat: fon shaffof bo'lmasa (mas. bg-white), blur ko'rinmaydi — yarim-shaffoflik shart</text>
</svg>
