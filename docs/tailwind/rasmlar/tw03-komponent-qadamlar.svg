<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Bitta kartani utility'lardan bosqichma-bosqich qurish: HTML -> layout/spacing -> rang/tipografiya -> chegara/soya</title>
  <rect x="0" y="0" width="780" height="470" fill="#f8fafc"/>

  <text x="390" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Kartani utility'lardan bosqichma-bosqich qurish</text>
  <text x="390" y="64" text-anchor="middle" font-size="14" fill="#475569">Har qadamda yangi utility'lar qo'shamiz — uslub kichik bo'laklardan "yig'iladi"</text>

  <!-- ===== Step 1: plain HTML ===== -->
  <text x="120" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#64748b">1 — Oddiy HTML</text>
  <rect x="40" y="112" width="160" height="120" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="52" y="138" font-size="13" fill="#1e293b">Avatar</text>
  <text x="52" y="160" font-size="13" fill="#1e293b">Oqil Imomnazarov</text>
  <text x="52" y="180" font-size="13" fill="#64748b">Dasturchi</text>
  <text x="52" y="206" font-size="13" fill="#1e293b">[Kuzatish]</text>
  <text x="120" y="250" text-anchor="middle" font-size="13" fill="#64748b">uslubsiz</text>

  <!-- ===== Step 2: layout + spacing ===== -->
  <text x="320" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#0ea5e9">2 — +layout +spacing</text>
  <rect x="240" y="112" width="160" height="120" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- flex row: avatar circle + text -->
  <circle cx="268" cy="148" r="16" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="296" y="144" font-size="13" fill="#1e293b">Oqil I.</text>
  <text x="296" y="162" font-size="13" fill="#64748b">Dasturchi</text>
  <rect x="256" y="186" width="128" height="28" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="320" y="205" text-anchor="middle" font-size="13" fill="#1e293b">Kuzatish</text>
  <text x="320" y="250" text-anchor="middle" font-size="13" fill="#0ea5e9">flex gap-4 p-4</text>

  <!-- ===== Step 3: color + typography ===== -->
  <text x="540" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#f59e0b">3 — +rang +tipografiya</text>
  <rect x="460" y="112" width="160" height="120" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="488" cy="148" r="16" fill="#6366f1"/>
  <text x="516" y="144" font-size="14" font-weight="bold" fill="#1e293b">Oqil I.</text>
  <text x="516" y="162" font-size="13" fill="#6366f1">Dasturchi</text>
  <rect x="476" y="186" width="128" height="28" fill="#4f46e5"/>
  <text x="540" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Kuzatish</text>
  <text x="540" y="250" text-anchor="middle" font-size="13" fill="#f59e0b">font-bold text-indigo bg-indigo</text>

  <!-- ===== Step 4: border + shadow + rounded ===== -->
  <text x="320" y="296" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">4 — +chegara +soya +rounded (yakuniy)</text>
  <!-- shadow -->
  <rect x="244" y="316" width="160" height="120" rx="14" fill="#cbd5e1"/>
  <rect x="240" y="312" width="160" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="268" cy="348" r="16" fill="#6366f1"/>
  <text x="296" y="344" font-size="14" font-weight="bold" fill="#1e293b">Oqil I.</text>
  <text x="296" y="362" font-size="13" fill="#6366f1">Dasturchi</text>
  <rect x="256" y="386" width="128" height="28" rx="8" fill="#4f46e5"/>
  <text x="320" y="405" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Kuzatish</text>

  <!-- annotation arrow + classes for final -->
  <line x1="404" y1="372" x2="470" y2="372" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="470,372 460,367 460,377" fill="#94a3b8"/>
  <rect x="478" y="330" width="278" height="86" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="492" y="354" font-size="13" font-weight="bold" fill="#16a34a">Yakuniy klasslar:</text>
  <text x="492" y="376" font-size="13" fill="#1e293b">flex gap-4 p-4 bg-white</text>
  <text x="492" y="396" font-size="13" fill="#1e293b">rounded-xl shadow-md</text>

  <!-- step arrows along the top row -->
  <line x1="204" y1="172" x2="236" y2="172" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="236,172 226,167 226,177" fill="#94a3b8"/>
  <line x1="404" y1="172" x2="456" y2="172" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="456,172 446,167 446,177" fill="#94a3b8"/>
</svg>
