<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" font-family="Segoe UI, system-ui, sans-serif">
  <title>Bir xil karta grid uch kenglikda: mobil 1 ustun, planshet 2 ustun, desktop 4 ustun — grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 klassi har biri ostida belgilangan</title>
  <rect x="0" y="0" width="800" height="430" fill="#f8fafc"/>

  <text x="400" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">Bitta grid, uch ekran</text>
  <text x="400" y="60" text-anchor="middle" font-size="14" fill="#475569">class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4"</text>

  <!-- ===== Mobil: 1 ustun ===== -->
  <text x="135" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Mobil (&lt; 640px)</text>
  <rect x="70" y="110" width="130" height="230" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- 4 karta ustma-ust -->
  <rect x="84" y="124" width="102" height="44" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="135" y="151" text-anchor="middle" font-size="14" fill="#4f46e5">1</text>
  <rect x="84" y="176" width="102" height="44" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="135" y="203" text-anchor="middle" font-size="14" fill="#4f46e5">2</text>
  <rect x="84" y="228" width="102" height="44" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="135" y="255" text-anchor="middle" font-size="14" fill="#4f46e5">3</text>
  <rect x="84" y="280" width="102" height="44" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="135" y="307" text-anchor="middle" font-size="14" fill="#4f46e5">4</text>
  <text x="135" y="364" text-anchor="middle" font-size="13" font-weight="bold" fill="#64748b">grid-cols-1</text>
  <text x="135" y="384" text-anchor="middle" font-size="13" fill="#64748b">(asos)</text>

  <!-- ===== Planshet: 2 ustun ===== -->
  <text x="360" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Planshet (&#8805; 640px)</text>
  <rect x="250" y="110" width="220" height="180" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="264" y="124" width="92" height="68" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1"/>
  <text x="310" y="162" text-anchor="middle" font-size="14" fill="#0284c7">1</text>
  <rect x="364" y="124" width="92" height="68" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1"/>
  <text x="410" y="162" text-anchor="middle" font-size="14" fill="#0284c7">2</text>
  <rect x="264" y="200" width="92" height="68" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1"/>
  <text x="310" y="238" text-anchor="middle" font-size="14" fill="#0284c7">3</text>
  <rect x="364" y="200" width="92" height="68" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1"/>
  <text x="410" y="238" text-anchor="middle" font-size="14" fill="#0284c7">4</text>
  <text x="360" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#64748b">sm:grid-cols-2</text>
  <text x="360" y="336" text-anchor="middle" font-size="13" fill="#64748b">(640px dan)</text>

  <!-- ===== Desktop: 4 ustun ===== -->
  <text x="640" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Desktop (&#8805; 1024px)</text>
  <rect x="520" y="110" width="240" height="100" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="532" y="124" width="48" height="72" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="556" y="166" text-anchor="middle" font-size="14" fill="#16a34a">1</text>
  <rect x="588" y="124" width="48" height="72" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="612" y="166" text-anchor="middle" font-size="14" fill="#16a34a">2</text>
  <rect x="644" y="124" width="48" height="72" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="668" y="166" text-anchor="middle" font-size="14" fill="#16a34a">3</text>
  <rect x="700" y="124" width="48" height="72" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="724" y="166" text-anchor="middle" font-size="14" fill="#16a34a">4</text>
  <text x="640" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#64748b">lg:grid-cols-4</text>
  <text x="640" y="256" text-anchor="middle" font-size="13" fill="#64748b">(1024px dan)</text>

  <!-- pastki izoh -->
  <line x1="70" y1="400" x2="730" y2="400" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="400" y="420" text-anchor="middle" font-size="13" fill="#64748b">Ekran kengaygani sayin yangi prefiks yoqilib, ustun soni oshib boradi</text>
</svg>
