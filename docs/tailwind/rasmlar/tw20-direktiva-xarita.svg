<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Segoe UI, system-ui, sans-serif">
  <title>Tailwind v4 direktivalari maqsadi bo'yicha guruhlangan xarita: SETUP (@import), THEME (@theme), KENGAYTIRISH (@utility, @custom-variant, @layer), QAYTA-ISHLATISH (@apply, @reference), KONTENT (@source), ESKI (@plugin, @config)</title>
  <rect x="0" y="0" width="800" height="560" fill="#f8fafc"/>

  <text x="400" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">v4 direktivalari — maqsadi bo'yicha xarita</text>
  <text x="400" y="60" text-anchor="middle" font-size="14" fill="#475569">Hammasi endi CSS'da. Har bir at-rule — sizning asbobingiz</text>

  <!-- SETUP -->
  <rect x="30" y="84" width="365" height="92" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="48" y="108" font-size="14" font-weight="bold" fill="#0284c7">1. O'RNATISH (SETUP)</text>
  <rect x="48" y="118" width="170" height="32" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="58" y="139" font-size="14" font-weight="bold" fill="#4f46e5">@import "tailwindcss"</text>
  <text x="48" y="168" font-size="13" fill="#475569">Tema, preflight va utility'larni olib keladi</text>

  <!-- THEME -->
  <rect x="405" y="84" width="365" height="92" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="423" y="108" font-size="14" font-weight="bold" fill="#4f46e5">2. TEMA (THEME)</text>
  <rect x="423" y="118" width="100" height="32" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="433" y="139" font-size="14" font-weight="bold" fill="#4f46e5">@theme</text>
  <text x="423" y="168" font-size="13" fill="#475569">Dizayn tokenlari (18-bob)</text>

  <!-- EXTEND -->
  <rect x="30" y="190" width="365" height="120" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="48" y="214" font-size="14" font-weight="bold" fill="#4f46e5">3. KENGAYTIRISH (EXTEND)</text>
  <rect x="48" y="224" width="95" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="58" y="244" font-size="13" font-weight="bold" fill="#4f46e5">@utility</text>
  <rect x="151" y="224" width="145" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="161" y="244" font-size="13" font-weight="bold" fill="#4f46e5">@custom-variant</text>
  <rect x="304" y="224" width="75" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="314" y="244" font-size="13" font-weight="bold" fill="#4f46e5">@layer</text>
  <text x="48" y="278" font-size="13" fill="#475569">Yangi utility, variant va qatlamli</text>
  <text x="48" y="296" font-size="13" fill="#475569">base/components stillari (19-bob)</text>

  <!-- REUSE -->
  <rect x="405" y="190" width="365" height="120" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="423" y="214" font-size="14" font-weight="bold" fill="#16a34a">4. QAYTA-ISHLATISH (REUSE)</text>
  <rect x="423" y="224" width="85" height="30" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="433" y="244" font-size="13" font-weight="bold" fill="#16a34a">@apply</text>
  <rect x="516" y="224" width="115" height="30" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="526" y="244" font-size="13" font-weight="bold" fill="#16a34a">@reference</text>
  <text x="423" y="278" font-size="13" fill="#475569">@apply — utility'larni CSS qoidasiga</text>
  <text x="423" y="296" font-size="13" fill="#475569">solish; @reference — temani ulash</text>

  <!-- CONTENT -->
  <rect x="30" y="324" width="365" height="92" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="48" y="348" font-size="14" font-weight="bold" fill="#b45309">5. KONTENT (CONTENT)</text>
  <rect x="48" y="358" width="95" height="32" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="58" y="379" font-size="14" font-weight="bold" fill="#b45309">@source</text>
  <text x="48" y="408" font-size="13" fill="#475569">Klass qidirish manbalarini boshqarish</text>

  <!-- LEGACY -->
  <rect x="405" y="324" width="365" height="92" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="423" y="348" font-size="14" font-weight="bold" fill="#64748b">6. ESKI (LEGACY)</text>
  <rect x="423" y="358" width="90" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="433" y="379" font-size="14" font-weight="bold" fill="#475569">@plugin</text>
  <rect x="521" y="358" width="90" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="531" y="379" font-size="14" font-weight="bold" fill="#475569">@config</text>
  <text x="423" y="408" font-size="13" fill="#475569">v3 JS plagin / config'ni ulash</text>

  <!-- functions strip -->
  <rect x="30" y="432" width="740" height="92" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="400" y="456" text-anchor="middle" font-size="14" font-weight="bold" fill="#4f46e5">FUNKSIYALAR — custom CSS ichida qiymat hisoblash</text>
  <rect x="60" y="468" width="200" height="40" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="160" y="493" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">--spacing(6)</text>
  <rect x="290" y="468" width="290" height="40" rx="8" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="435" y="493" text-anchor="middle" font-size="14" font-weight="bold" fill="#0284c7">--alpha(var(--color-..) / 30%)</text>
  <rect x="610" y="468" width="130" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="675" y="493" text-anchor="middle" font-size="14" font-weight="bold" fill="#64748b">theme() (eski)</text>

  <text x="400" y="548" text-anchor="middle" font-size="13" fill="#64748b">Direktiva = at-rule (@...) · Funksiya = qiymat qaytaradi (--spacing, --alpha)</text>
</svg>
