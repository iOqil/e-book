<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" width="780" height="480" font-family="Segoe UI, system-ui, sans-serif">
  <title>Dashboard skeleti: tepada to'liq enli header (col-span-full), chapda 240px sidebar, o'ngda 1fr main maydon — grid-cols-[240px_1fr] grid-rows-[auto_1fr]</title>
  <rect x="0" y="0" width="780" height="480" fill="#f8fafc"/>

  <text x="390" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Dashboard layout — ikki ustun, ikki qator</text>
  <text x="390" y="60" text-anchor="middle" font-size="14" fill="#475569">grid grid-cols-[240px_1fr] grid-rows-[auto_1fr] min-h-screen</text>

  <!-- Grid maydoni: x 130..690 (560 keng), y 96..420 -->
  <!-- ustun chiziqlari: 1=130, sidebar 240px ko'rsatuvchi nisbat: 130..280 (150px vizual) , 2=280, 3=690 -->
  <!-- qator chiziqlari: 1=96 (auto header), main: 156..420 -->

  <!-- ustun chiziqlari -->
  <line x1="130" y1="86" x2="130" y2="432" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="280" y1="148" x2="280" y2="432" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="690" y1="86" x2="690" y2="432" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="130" cy="82" r="11" fill="#4f46e5"/>
  <text x="130" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
  <circle cx="280" cy="82" r="11" fill="#4f46e5"/>
  <text x="280" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
  <circle cx="690" cy="82" r="11" fill="#4f46e5"/>
  <text x="690" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>

  <!-- ustun o'lcham yorliqlari -->
  <text x="205" y="450" text-anchor="middle" font-size="13" fill="#64748b">240px</text>
  <text x="485" y="450" text-anchor="middle" font-size="13" fill="#64748b">1fr (qolgan bo'sh joy)</text>

  <!-- Header: col-span-full -->
  <rect x="130" y="98" width="560" height="46" rx="8" fill="#4f46e5"/>
  <text x="410" y="127" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Header &#8212; col-span-full</text>

  <!-- Sidebar 240px -->
  <rect x="130" y="156" width="150" height="264" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="205" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#4338ca">Sidebar</text>
  <rect x="146" y="200" width="118" height="22" rx="5" fill="#ffffff" stroke="#c7d2fe" stroke-width="1"/>
  <rect x="146" y="230" width="118" height="22" rx="5" fill="#ffffff" stroke="#c7d2fe" stroke-width="1"/>
  <rect x="146" y="260" width="118" height="22" rx="5" fill="#ffffff" stroke="#c7d2fe" stroke-width="1"/>
  <rect x="146" y="290" width="118" height="22" rx="5" fill="#ffffff" stroke="#c7d2fe" stroke-width="1"/>

  <!-- Main 1fr -->
  <rect x="290" y="156" width="400" height="264" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="490" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Main &#8212; 1fr</text>
  <!-- kichik kartalar main ichida -->
  <rect x="306" y="200" width="118" height="56" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="436" y="200" width="118" height="56" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="566" y="200" width="108" height="56" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="306" y="270" width="368" height="134" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="490" y="342" text-anchor="middle" font-size="13" fill="#64748b">kontent (grafiklar, jadval ...)</text>

  <!-- qator yorliqlari o'ngda -->
  <text x="712" y="125" font-size="13" fill="#64748b">auto</text>
  <text x="712" y="292" font-size="13" fill="#64748b">1fr</text>

  <text x="390" y="472" text-anchor="middle" font-size="13" fill="#64748b">Header butun enni egallaydi; sidebar qat'iy 240px, main qolgan joyni to'ldiradi</text>
</svg>
