<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Tailwind display utility'lari: block, inline, inline-block, flex, grid va hidden elementlar oqimda qanday joylashishi</title>
  <rect x="0" y="0" width="780" height="470" fill="#f8fafc"/>

  <text x="390" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Display turlari: element oqimda qanday joylashadi</text>

  <!-- block -->
  <text x="30" y="76" font-size="15" font-weight="bold" fill="#4f46e5">block</text>
  <text x="105" y="76" font-size="13" fill="#64748b">— butun qatorni egallaydi, ustma-ust taxlanadi</text>
  <rect x="30" y="86" width="340" height="34" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="200" y="108" text-anchor="middle" font-size="14" fill="#4f46e5">A (block)</text>
  <rect x="30" y="126" width="340" height="34" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="200" y="148" text-anchor="middle" font-size="14" fill="#4f46e5">B (block)</text>

  <!-- inline -->
  <text x="410" y="76" font-size="15" font-weight="bold" fill="#0ea5e9">inline</text>
  <text x="478" y="76" font-size="13" fill="#64748b">— matn kabi yonma-yon, eni mazmuncha</text>
  <rect x="410" y="86" width="80" height="34" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="450" y="108" text-anchor="middle" font-size="14" fill="#0ea5e9">A</text>
  <rect x="498" y="86" width="60" height="34" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="528" y="108" text-anchor="middle" font-size="14" fill="#0ea5e9">B</text>
  <rect x="566" y="86" width="96" height="34" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="614" y="108" text-anchor="middle" font-size="14" fill="#0ea5e9">C</text>
  <text x="410" y="150" font-size="13" fill="#ef4444">w-* / h-* ta'sir qilmaydi</text>

  <!-- inline-block -->
  <text x="410" y="178" font-size="15" font-weight="bold" fill="#38bdf8">inline-block</text>
  <text x="528" y="178" font-size="13" fill="#64748b">— yonma-yon, lekin o'lcham oladi</text>
  <rect x="410" y="188" width="70" height="44" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text x="445" y="214" text-anchor="middle" font-size="14" fill="#0ea5e9">A</text>
  <rect x="488" y="188" width="70" height="44" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text x="523" y="214" text-anchor="middle" font-size="14" fill="#0ea5e9">B</text>

  <!-- flex -->
  <text x="30" y="200" font-size="15" font-weight="bold" fill="#16a34a">flex</text>
  <text x="80" y="200" font-size="13" fill="#64748b">— bolalar bir o'qda saf bo'ladi</text>
  <rect x="30" y="210" width="340" height="56" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="44" y="222" width="90" height="32" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="89" y="243" text-anchor="middle" font-size="13" fill="#16a34a">A</text>
  <rect x="144" y="222" width="90" height="32" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="189" y="243" text-anchor="middle" font-size="13" fill="#16a34a">B</text>
  <rect x="244" y="222" width="112" height="32" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="300" y="243" text-anchor="middle" font-size="13" fill="#16a34a">C</text>

  <!-- grid -->
  <text x="30" y="300" font-size="15" font-weight="bold" fill="#f59e0b">grid</text>
  <text x="80" y="300" font-size="13" fill="#64748b">— ustun va qatorli to'r</text>
  <rect x="30" y="310" width="340" height="80" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="44" y="322" width="100" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="94" y="339" text-anchor="middle" font-size="13" fill="#f59e0b">A</text>
  <rect x="154" y="322" width="100" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="204" y="339" text-anchor="middle" font-size="13" fill="#f59e0b">B</text>
  <rect x="264" y="322" width="92" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="310" y="339" text-anchor="middle" font-size="13" fill="#f59e0b">C</text>
  <rect x="44" y="354" width="100" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="94" y="371" text-anchor="middle" font-size="13" fill="#f59e0b">D</text>
  <rect x="154" y="354" width="100" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="204" y="371" text-anchor="middle" font-size="13" fill="#f59e0b">E</text>
  <rect x="264" y="354" width="92" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="310" y="371" text-anchor="middle" font-size="13" fill="#f59e0b">F</text>

  <!-- hidden -->
  <text x="410" y="270" font-size="15" font-weight="bold" fill="#ef4444">hidden</text>
  <text x="488" y="270" font-size="13" fill="#64748b">— display:none, joy ham egallamaydi</text>
  <rect x="410" y="280" width="252" height="44" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="536" y="307" text-anchor="middle" font-size="14" fill="#ef4444">( ko'rinmaydi — oqimdan chiqadi )</text>

  <!-- bottom note -->
  <line x1="30" y1="410" x2="750" y2="410" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="390" y="436" text-anchor="middle" font-size="14" fill="#475569">Tailwind'da bu turlar — bitta klass: block · inline · inline-block · flex · grid · hidden</text>
  <text x="390" y="458" text-anchor="middle" font-size="13" fill="#64748b">hidden = elementni butunlay olib tashlaydi; invisible esa joyni saqlab faqat ko'rinmas qiladi</text>
</svg>
