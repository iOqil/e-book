<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" width="780" height="480" font-family="Segoe UI, system-ui, sans-serif">
  <title>grid-cols-3 gap-4 — uchta ustun (1fr), ustun va qator chiziqlari raqamlangan, gap ko'rinadi va bitta katak col-span-2 bilan ikki ustunni egallaydi</title>
  <rect x="0" y="0" width="780" height="480" fill="#f8fafc"/>

  <text x="390" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">grid-cols-3 gap-4 — tracklar va chiziqlar</text>
  <text x="390" y="62" text-anchor="middle" font-size="14" fill="#475569">3 ta teng ustun (har biri 1fr), oradagi bo'shliq = gap</text>

  <!-- Grid maydoni: x 90..690 (600 keng), y 110..400 -->
  <!-- 3 ustun: kenglik 184, gap 24 -> 90,298,506 ; har ustun 184 keng -->
  <!-- ustun chiziqlari: 1=90, 2=274, 3=482, 4=690 ; gap markazi chiziqlardan keyin -->

  <!-- gap zonalarini ko'rsatuvchi yengil panel -->
  <rect x="90" y="110" width="600" height="290" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>

  <!-- Ustun chiziqlari (column lines) 1..4 -->
  <line x1="98" y1="100" x2="98" y2="412" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="290" y1="100" x2="290" y2="412" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="482" y1="100" x2="482" y2="412" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="682" y1="100" x2="682" y2="412" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 4"/>

  <circle cx="98" cy="96" r="11" fill="#4f46e5"/>
  <text x="98" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
  <circle cx="290" cy="96" r="11" fill="#4f46e5"/>
  <text x="290" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
  <circle cx="482" cy="96" r="11" fill="#4f46e5"/>
  <text x="482" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
  <circle cx="682" cy="96" r="11" fill="#4f46e5"/>
  <text x="682" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">4</text>
  <text x="390" y="430" text-anchor="middle" font-size="13" fill="#64748b">&#8593; ustun chiziqlari (column lines): 1 ... 4</text>

  <!-- Qator chiziqlari (row lines) 1..3 chap tomonda -->
  <line x1="80" y1="118" x2="694" y2="118" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="80" y1="262" x2="694" y2="262" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="80" y1="392" x2="694" y2="392" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="72" cy="118" r="11" fill="#0284c7"/>
  <text x="72" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
  <circle cx="72" cy="262" r="11" fill="#0284c7"/>
  <text x="72" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
  <circle cx="72" cy="392" r="11" fill="#0284c7"/>
  <text x="72" y="396" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>

  <!-- 1-qator kataklari (y 122..258, balandlik 136) -->
  <!-- katak 1: 98..282 -->
  <rect x="98" y="122" width="184" height="136" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="190" y="196" text-anchor="middle" font-size="14" fill="#1e293b">1</text>
  <!-- katak 2: 290..474 -->
  <rect x="290" y="122" width="184" height="136" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="382" y="196" text-anchor="middle" font-size="14" fill="#1e293b">2</text>
  <!-- katak 3: 482..666 -->
  <rect x="482" y="122" width="184" height="136" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="574" y="196" text-anchor="middle" font-size="14" fill="#1e293b">3</text>

  <!-- 2-qator: col-span-2 katak (1..3 chiziq oralig'i) + bitta oddiy katak -->
  <rect x="98" y="266" width="376" height="120" rx="8" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5"/>
  <text x="286" y="320" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">col-span-2</text>
  <text x="286" y="344" text-anchor="middle" font-size="13" fill="#e0e7ff">1-chiziqdan 3-chiziqgacha</text>
  <rect x="482" y="266" width="184" height="120" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="574" y="330" text-anchor="middle" font-size="14" fill="#1e293b">4</text>

  <!-- gap belgilash -->
  <line x1="282" y1="140" x2="290" y2="140" stroke="#f59e0b" stroke-width="3"/>
  <text x="286" y="118" text-anchor="middle" font-size="13" fill="#b45309" font-weight="bold">gap-4</text>

  <!-- gap (qatorlar orasi) -->
  <line x1="120" y1="258" x2="120" y2="266" stroke="#f59e0b" stroke-width="3"/>

  <text x="390" y="460" text-anchor="middle" font-size="13" fill="#64748b">Katak ustun chiziqlari orasini egallaydi; col-span-N — N ta track bo'ylab cho'ziladi</text>
</svg>
