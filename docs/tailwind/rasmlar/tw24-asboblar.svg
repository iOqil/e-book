<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" font-family="Segoe UI, system-ui, sans-serif">
  <title>Tailwind DX asboblari: IntelliSense (avtomatik to'ldirish, hover'da CSS, rang nuqtasi), Prettier plugin (tartibsiz klasslarni tartiblaydi), Lint (p-2 p-4 ziddiyatini belgilaydi)</title>
  <rect x="0" y="0" width="780" height="430" fill="#f8fafc"/>

  <text x="390" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">Tailwind DX asboblari to'plami</text>
  <text x="390" y="58" text-anchor="middle" font-size="14" fill="#475569">Uchta asbob: avtomatik to'ldirish · klass tartibi · ziddiyat tekshiruvi</text>

  <!-- Panel 1: IntelliSense -->
  <rect x="24" y="84" width="240" height="320" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="24" y="84" width="240" height="40" rx="12" fill="#eef2ff"/>
  <rect x="24" y="110" width="240" height="14" fill="#eef2ff"/>
  <text x="144" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#4f46e5">IntelliSense</text>

  <text x="44" y="150" font-size="13" font-weight="bold" fill="#475569">Avtomatik to'ldirish</text>
  <rect x="44" y="160" width="200" height="92" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="58" y="182" font-size="13" fill="#1e293b">class="bg-sk</text>
  <rect x="58" y="190" width="172" height="22" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <rect x="64" y="195" width="12" height="12" rx="2" fill="#0ea5e9"/>
  <text x="84" y="206" font-size="13" fill="#1e293b">bg-sky-400</text>
  <rect x="64" y="219" width="12" height="12" rx="2" fill="#0284c7"/>
  <text x="84" y="230" font-size="13" fill="#1e293b">bg-sky-500</text>
  <rect x="64" y="231" width="12" height="12" rx="2" fill="#0369a1"/>
  <text x="84" y="242" font-size="13" fill="#475569">bg-sky-600</text>

  <text x="44" y="282" font-size="13" font-weight="bold" fill="#475569">Hover'da CSS</text>
  <rect x="44" y="292" width="200" height="50" rx="6" fill="#1e293b"/>
  <text x="58" y="313" font-size="13" fill="#ffffff">.bg-sky-500 &#123;</text>
  <text x="58" y="332" font-size="13" fill="#38bdf8">background: oklch(...) &#125;</text>

  <text x="44" y="368" font-size="13" font-weight="bold" fill="#475569">Rang nuqtalari</text>
  <circle cx="56" cy="386" r="8" fill="#ef4444"/>
  <circle cx="80" cy="386" r="8" fill="#f59e0b"/>
  <circle cx="104" cy="386" r="8" fill="#16a34a"/>
  <circle cx="128" cy="386" r="8" fill="#0ea5e9"/>
  <circle cx="152" cy="386" r="8" fill="#6366f1"/>

  <!-- Panel 2: Prettier plugin -->
  <rect x="276" y="84" width="240" height="320" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
  <rect x="276" y="84" width="240" height="40" rx="12" fill="#f0f9ff"/>
  <rect x="276" y="110" width="240" height="14" fill="#f0f9ff"/>
  <text x="396" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#0284c7">Prettier plugin</text>

  <text x="296" y="150" font-size="13" font-weight="bold" fill="#b91c1c">Oldin (tartibsiz)</text>
  <rect x="296" y="160" width="200" height="58" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="310" y="182" font-size="13" fill="#1e293b">class="text-white</text>
  <text x="310" y="202" font-size="13" fill="#1e293b">p-4 flex bg-sky-500"</text>

  <line x1="396" y1="226" x2="396" y2="252" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="396,252 390,240 402,240" fill="#94a3b8"/>
  <text x="430" y="244" font-size="13" fill="#16a34a">saqlaganda</text>

  <text x="296" y="278" font-size="13" font-weight="bold" fill="#166534">Keyin (tartibli)</text>
  <rect x="296" y="288" width="200" height="58" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="310" y="310" font-size="13" fill="#1e293b">class="flex bg-sky-500</text>
  <text x="310" y="330" font-size="13" fill="#1e293b">p-4 text-white"</text>

  <text x="396" y="378" text-anchor="middle" font-size="13" fill="#475569">tavsiya etilgan tartib —</text>
  <text x="396" y="396" text-anchor="middle" font-size="13" fill="#475569">butun jamoada bir xil</text>

  <!-- Panel 3: Lint -->
  <rect x="528" y="84" width="228" height="320" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="528" y="84" width="228" height="40" rx="12" fill="#fffbeb"/>
  <rect x="528" y="110" width="228" height="14" fill="#fffbeb"/>
  <text x="642" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">Lint (ziddiyat)</text>

  <text x="548" y="152" font-size="13" font-weight="bold" fill="#475569">Ziddiyatli klasslar</text>
  <rect x="548" y="162" width="188" height="64" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="562" y="186" font-size="13" fill="#1e293b">class="</text>
  <rect x="608" y="172" width="42" height="20" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="629" y="187" text-anchor="middle" font-size="13" fill="#b91c1c">p-2</text>
  <rect x="656" y="172" width="42" height="20" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="677" y="187" text-anchor="middle" font-size="13" fill="#b91c1c">p-4</text>
  <text x="562" y="216" font-size="13" fill="#1e293b">"</text>

  <rect x="548" y="240" width="188" height="48" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="642" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">ogohlantirish:</text>
  <text x="642" y="280" text-anchor="middle" font-size="13" fill="#b91c1c">p-4 p-2 ni bekor qiladi</text>

  <text x="548" y="318" font-size="13" font-weight="bold" fill="#166534">Tuzatish</text>
  <rect x="548" y="328" width="188" height="40" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="642" y="353" text-anchor="middle" font-size="13" fill="#166534">bittasini qoldiring: p-4</text>

  <text x="642" y="392" text-anchor="middle" font-size="13" fill="#475569">xato erta tutiladi</text>
</svg>
