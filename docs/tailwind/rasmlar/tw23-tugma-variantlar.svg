<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>Tugma matritsasi: qatorlar = maqsad (primary indigo, secondary outline, ghost, danger red), ustunlar = holat (normal, hover, disabled) — vizual tugma spetsifikatsiya varaqi</title>
  <rect x="0" y="0" width="800" height="440" fill="#f8fafc"/>

  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Tugma spetsifikatsiyasi — maqsad &#215; holat</text>
  <text x="400" y="57" text-anchor="middle" font-size="14" fill="#475569">Qatorlar: maqsad (intent) &#183; Ustunlar: holat (state)</text>

  <!-- column headers -->
  <text x="300" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">normal</text>
  <text x="455" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#f59e0b">hover:</text>
  <text x="610" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#94a3b8">disabled:</text>

  <!-- ROW 1: primary -->
  <text x="40" y="130" font-size="14" font-weight="bold" fill="#1e293b">primary</text>
  <text x="40" y="150" font-size="13" fill="#64748b">bg-indigo-600</text>
  <rect x="238" y="108" width="124" height="42" rx="9" fill="#4f46e5"/>
  <text x="300" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Saqlash</text>
  <rect x="393" y="108" width="124" height="42" rx="9" fill="#4338ca"/>
  <text x="455" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Saqlash</text>
  <rect x="548" y="108" width="124" height="42" rx="9" fill="#4f46e5" opacity="0.5"/>
  <text x="610" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff" opacity="0.85">Saqlash</text>

  <!-- ROW 2: secondary (outline) -->
  <text x="40" y="198" font-size="14" font-weight="bold" fill="#1e293b">secondary</text>
  <text x="40" y="218" font-size="13" fill="#64748b">border + text</text>
  <rect x="238" y="176" width="124" height="42" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="300" y="203" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Bekor</text>
  <rect x="393" y="176" width="124" height="42" rx="9" fill="#f8fafc" stroke="#6366f1" stroke-width="1.5"/>
  <text x="455" y="203" text-anchor="middle" font-size="14" font-weight="bold" fill="#4f46e5">Bekor</text>
  <rect x="548" y="176" width="124" height="42" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" opacity="0.5"/>
  <text x="610" y="203" text-anchor="middle" font-size="14" font-weight="bold" fill="#94a3b8">Bekor</text>

  <!-- ROW 3: ghost -->
  <text x="40" y="266" font-size="14" font-weight="bold" fill="#1e293b">ghost</text>
  <text x="40" y="286" font-size="13" fill="#64748b">fonsiz</text>
  <rect x="238" y="244" width="124" height="42" rx="9" fill="#f8fafc"/>
  <text x="300" y="271" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">Ortga</text>
  <rect x="393" y="244" width="124" height="42" rx="9" fill="#eef2ff"/>
  <text x="455" y="271" text-anchor="middle" font-size="14" font-weight="bold" fill="#4f46e5">Ortga</text>
  <rect x="548" y="244" width="124" height="42" rx="9" fill="#f8fafc" opacity="0.5"/>
  <text x="610" y="271" text-anchor="middle" font-size="14" font-weight="bold" fill="#94a3b8">Ortga</text>

  <!-- ROW 4: danger -->
  <text x="40" y="334" font-size="14" font-weight="bold" fill="#1e293b">danger</text>
  <text x="40" y="354" font-size="13" fill="#64748b">bg-red-600</text>
  <rect x="238" y="312" width="124" height="42" rx="9" fill="#ef4444"/>
  <text x="300" y="339" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">O'chirish</text>
  <rect x="393" y="312" width="124" height="42" rx="9" fill="#dc2626"/>
  <text x="455" y="339" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">O'chirish</text>
  <rect x="548" y="312" width="124" height="42" rx="9" fill="#ef4444" opacity="0.5"/>
  <text x="610" y="339" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff" opacity="0.85">O'chirish</text>

  <!-- divider -->
  <line x1="30" y1="378" x2="770" y2="378" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- shared base note -->
  <text x="400" y="404" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Umumiy asos (har bir tugmada bir xil):</text>
  <text x="400" y="426" text-anchor="middle" font-size="13" fill="#4f46e5">inline-flex items-center justify-center rounded-lg px-4 py-2 font-medium transition focus-visible:ring-2</text>
</svg>
