<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>justify-* main o'q bo'ylab taqsimlash va items-* cross o'q bo'ylab tekislash variantlari</title>
  <rect x="0" y="0" width="800" height="470" fill="#f8fafc"/>

  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">justify-* (main o'q) va items-* (cross o'q)</text>

  <!-- ===== ROW 1: justify (main axis) ===== -->
  <text x="30" y="68" font-size="15" font-weight="bold" fill="#0ea5e9">MAIN o'q bo'ylab taqsimlash — justify-*</text>

  <!-- justify-start -->
  <rect x="30" y="80" width="170" height="80" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="38" y="108" width="24" height="24" rx="4" fill="#6366f1"/>
  <rect x="66" y="108" width="24" height="24" rx="4" fill="#6366f1"/>
  <rect x="94" y="108" width="24" height="24" rx="4" fill="#6366f1"/>
  <text x="115" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">justify-start</text>

  <!-- justify-center -->
  <rect x="215" y="80" width="170" height="80" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="259" y="108" width="24" height="24" rx="4" fill="#6366f1"/>
  <rect x="287" y="108" width="24" height="24" rx="4" fill="#6366f1"/>
  <rect x="315" y="108" width="24" height="24" rx="4" fill="#6366f1"/>
  <text x="300" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">justify-center</text>

  <!-- justify-between -->
  <rect x="400" y="80" width="170" height="80" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="408" y="108" width="24" height="24" rx="4" fill="#6366f1"/>
  <rect x="473" y="108" width="24" height="24" rx="4" fill="#6366f1"/>
  <rect x="538" y="108" width="24" height="24" rx="4" fill="#6366f1"/>
  <text x="485" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">justify-between</text>

  <!-- justify-evenly -->
  <rect x="585" y="80" width="185" height="80" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="617" y="108" width="24" height="24" rx="4" fill="#6366f1"/>
  <rect x="665" y="108" width="24" height="24" rx="4" fill="#6366f1"/>
  <rect x="713" y="108" width="24" height="24" rx="4" fill="#6366f1"/>
  <text x="677" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">justify-evenly</text>

  <!-- main axis arrow -->
  <line x1="30" y1="185" x2="755" y2="185" stroke="#0ea5e9" stroke-width="2.5"/>
  <polygon points="768,185 754,179 754,191" fill="#0ea5e9"/>
  <text x="400" y="208" text-anchor="middle" font-size="14" fill="#0ea5e9">main o'q (flex-row da gorizontal)</text>

  <!-- divider -->
  <line x1="30" y1="230" x2="770" y2="230" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- ===== ROW 2: items (cross axis) ===== -->
  <text x="30" y="262" font-size="15" font-weight="bold" fill="#f59e0b">CROSS o'q bo'ylab tekislash — items-*</text>

  <!-- items-start -->
  <rect x="30" y="274" width="170" height="110" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="50" y="284" width="34" height="34" rx="4" fill="#f59e0b"/>
  <rect x="92" y="284" width="34" height="50" rx="4" fill="#f59e0b"/>
  <rect x="134" y="284" width="34" height="42" rx="4" fill="#f59e0b"/>
  <text x="115" y="376" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">items-start</text>

  <!-- items-center -->
  <rect x="215" y="274" width="170" height="110" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="235" y="305" width="34" height="34" rx="4" fill="#f59e0b"/>
  <rect x="277" y="297" width="34" height="50" rx="4" fill="#f59e0b"/>
  <rect x="319" y="301" width="34" height="42" rx="4" fill="#f59e0b"/>
  <text x="300" y="376" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">items-center</text>

  <!-- items-end -->
  <rect x="400" y="274" width="170" height="110" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="420" y="326" width="34" height="34" rx="4" fill="#f59e0b"/>
  <rect x="462" y="310" width="34" height="50" rx="4" fill="#f59e0b"/>
  <rect x="504" y="318" width="34" height="42" rx="4" fill="#f59e0b"/>
  <text x="485" y="376" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">items-end</text>

  <!-- items-stretch -->
  <rect x="585" y="274" width="185" height="110" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="617" y="284" width="34" height="76" rx="4" fill="#16a34a"/>
  <rect x="659" y="284" width="34" height="76" rx="4" fill="#16a34a"/>
  <rect x="701" y="284" width="34" height="76" rx="4" fill="#16a34a"/>
  <text x="677" y="376" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">items-stretch</text>

  <!-- cross axis arrow (vertical) -->
  <line x1="18" y1="274" x2="18" y2="360" stroke="#f59e0b" stroke-width="2.5"/>
  <polygon points="18,372 12,358 24,358" fill="#f59e0b"/>

  <text x="400" y="416" text-anchor="middle" font-size="14" fill="#475569">items-* qatorning balandligi bo'ylab (cross o'q) tekislaydi. stretch = standart: to'liq cho'ziladi.</text>
  <text x="400" y="442" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">flex items-center justify-center = mukammal markazlash (har ikki o'q).</text>
</svg>
