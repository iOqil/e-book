<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Segoe UI, system-ui, sans-serif">
  <title>Komponent yondashuvlari spektri: chap chetda sof utility (to'liq nazorat, sekin), o'ngga qarab daisyUI va Flowbite (semantik klasslar), Headless UI (a11y mantiq va sizning uslubingiz), shadcn/ui (nusxa ol, o'zingniki); pastda nazorat va tezlik o'qlari</title>
  <rect x="0" y="0" width="800" height="450" fill="#f8fafc"/>

  <text x="400" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">Komponent yondashuvlari spektri</text>
  <text x="400" y="62" text-anchor="middle" font-size="14" fill="#475569">sof utility'dan tayyor klasslargacha — nazorat va tezlik orasidagi tanlov</text>

  <!-- spektr chizig'i -->
  <line x1="60" y1="100" x2="740" y2="100" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="740,100 726,93 726,107" fill="#94a3b8"/>
  <text x="60" y="92" font-size="13" font-weight="bold" fill="#16a34a">↤ ko'proq nazorat</text>
  <text x="740" y="92" text-anchor="end" font-size="13" font-weight="bold" fill="#f59e0b">ko'proq tezlik ↦</text>

  <!-- 4 ta nuqta -->
  <circle cx="155" cy="100" r="7" fill="#16a34a"/>
  <circle cx="350" cy="100" r="7" fill="#0ea5e9"/>
  <circle cx="545" cy="100" r="7" fill="#6366f1"/>
  <circle cx="700" cy="100" r="7" fill="#f59e0b"/>

  <!-- 1. Sof utility -->
  <rect x="40" y="128" width="170" height="150" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="125" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">Sof utility</text>
  <text x="125" y="172" text-anchor="middle" font-size="13" fill="#64748b">(bu kitob)</text>
  <rect x="56" y="184" width="138" height="30" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="125" y="204" text-anchor="middle" font-size="13" fill="#1e293b">bg-indigo-600 px-4</text>
  <text x="56" y="234" font-size="13" fill="#16a34a">+ to'liq nazorat</text>
  <text x="56" y="252" font-size="13" fill="#16a34a">+ o'ziga xos</text>
  <text x="56" y="270" font-size="13" fill="#475569">− sekinroq yozish</text>

  <!-- 2. daisyUI / Flowbite -->
  <rect x="230" y="128" width="170" height="150" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="315" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#0284c7">daisyUI / Flowbite</text>
  <text x="315" y="172" text-anchor="middle" font-size="13" fill="#64748b">semantik klasslar</text>
  <rect x="246" y="184" width="138" height="30" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="315" y="204" text-anchor="middle" font-size="13" fill="#1e293b">btn btn-primary</text>
  <text x="246" y="234" font-size="13" fill="#16a34a">+ juda tez</text>
  <text x="246" y="252" font-size="13" fill="#16a34a">+ tema almashtirish</text>
  <text x="246" y="270" font-size="13" fill="#475569">− kamroq noyob</text>

  <!-- 3. Headless UI -->
  <rect x="420" y="128" width="170" height="150" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="505" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#4f46e5">Headless UI</text>
  <text x="505" y="172" text-anchor="middle" font-size="13" fill="#64748b">React / Vue</text>
  <rect x="436" y="184" width="138" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="505" y="204" text-anchor="middle" font-size="13" fill="#1e293b">Menu, Dialog ...</text>
  <text x="436" y="234" font-size="13" fill="#16a34a">+ a11y mantiq tayyor</text>
  <text x="436" y="252" font-size="13" fill="#16a34a">+ uslub sizniki</text>
  <text x="436" y="270" font-size="13" fill="#475569">− ko'rinishni yozasiz</text>

  <!-- 4. shadcn/ui -->
  <rect x="610" y="128" width="170" height="150" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="695" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">shadcn/ui</text>
  <text x="695" y="172" text-anchor="middle" font-size="13" fill="#64748b">React + Radix</text>
  <rect x="626" y="184" width="138" height="30" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="695" y="204" text-anchor="middle" font-size="13" fill="#1e293b">npx shadcn add</text>
  <text x="626" y="234" font-size="13" fill="#16a34a">+ to'liq egalik</text>
  <text x="626" y="252" font-size="13" fill="#16a34a">+ tayyor + a11y</text>
  <text x="626" y="270" font-size="13" fill="#475569">− faqat React</text>

  <!-- pastki yo'riqnoma -->
  <rect x="40" y="300" width="740" height="128" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="410" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#4f46e5">Qaysi birini tanlayman?</text>
  <text x="64" y="356" font-size="13" fill="#1e293b">• O'rganish / to'liq nazorat  →  sof utility</text>
  <text x="64" y="380" font-size="13" fill="#1e293b">• Tez yetkazib berish (MVP)  →  daisyUI / Flowbite</text>
  <text x="420" y="356" font-size="13" fill="#1e293b">• Faqat interaktiv mantiq, dizayn o'zimniki  →  Headless UI</text>
  <text x="420" y="380" font-size="13" fill="#1e293b">• React ilova + a11y + egalik  →  shadcn/ui</text>
  <text x="410" y="410" text-anchor="middle" font-size="13" fill="#64748b">Kutubxona utility o'rnini bosmaydi — uning ustiga quriladi</text>
</svg>
