<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>Elevation soyasi: beshta karta shadow-xs dan shadow-2xl gacha — soya kattalashgan sayin karta sahifadan balandroq ko'tariladi</title>
  <rect x="0" y="0" width="800" height="440" fill="#f8fafc"/>

  <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Soya = balandlik (elevation)</text>
  <text x="400" y="66" text-anchor="middle" font-size="14" fill="#475569">Soya qanchalik katta va tarqoq bo'lsa, karta sahifadan shunchalik baland ko'tarilgandek ko'rinadi</text>

  <defs>
    <filter id="b1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.5"/></filter>
    <filter id="b2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="b3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="b4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="b5" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>

  <!-- baseline (the page) -->
  <line x1="40" y1="350" x2="760" y2="350" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="48" y="368" font-size="13" fill="#64748b">sahifa yuzasi (z = 0)</text>

  <!-- card 1: shadow-xs, lowest -->
  <ellipse cx="120" cy="332" rx="46" ry="7" fill="#1e293b" opacity="0.16" filter="url(#b1)"/>
  <rect x="78" y="300" width="84" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="120" y="392" text-anchor="middle" font-size="14" font-weight="bold" fill="#4f46e5">shadow-xs</text>
  <text x="120" y="412" text-anchor="middle" font-size="13" fill="#64748b">eng past</text>

  <!-- card 2: shadow-sm -->
  <ellipse cx="270" cy="324" rx="52" ry="9" fill="#1e293b" opacity="0.18" filter="url(#b2)"/>
  <rect x="226" y="286" width="88" height="46" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="270" y="392" text-anchor="middle" font-size="14" font-weight="bold" fill="#4f46e5">shadow-sm</text>
  <text x="270" y="412" text-anchor="middle" font-size="13" fill="#64748b">karta</text>

  <!-- card 3: shadow-md -->
  <ellipse cx="420" cy="312" rx="58" ry="11" fill="#1e293b" opacity="0.2" filter="url(#b3)"/>
  <rect x="372" y="266" width="96" height="50" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="420" y="392" text-anchor="middle" font-size="14" font-weight="bold" fill="#4f46e5">shadow-md</text>
  <text x="420" y="412" text-anchor="middle" font-size="13" fill="#64748b">dropdown</text>

  <!-- card 4: shadow-lg -->
  <ellipse cx="575" cy="296" rx="66" ry="13" fill="#1e293b" opacity="0.22" filter="url(#b4)"/>
  <rect x="523" y="240" width="104" height="56" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="575" y="392" text-anchor="middle" font-size="14" font-weight="bold" fill="#4f46e5">shadow-lg</text>
  <text x="575" y="412" text-anchor="middle" font-size="13" fill="#64748b">popover</text>

  <!-- card 5: shadow-2xl, highest -->
  <ellipse cx="710" cy="270" rx="76" ry="16" fill="#1e293b" opacity="0.26" filter="url(#b5)"/>
  <rect x="652" y="206" width="116" height="64" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="710" y="392" text-anchor="middle" font-size="14" font-weight="bold" fill="#4f46e5">shadow-2xl</text>
  <text x="710" y="412" text-anchor="middle" font-size="13" fill="#64748b">modal — eng baland</text>

  <!-- rising arrow -->
  <line x1="120" y1="160" x2="730" y2="160" stroke="#16a34a" stroke-width="2"/>
  <polygon points="730,160 718,154 718,166" fill="#16a34a"/>
  <text x="425" y="150" text-anchor="middle" font-size="14" fill="#16a34a" font-weight="bold">balandlik ortadi — soya kengayadi va yumshaydi</text>
</svg>
