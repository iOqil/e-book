<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>@import "tailwindcss" bitta qatori ichida theme, base (preflight), components va utilities cascade qatlamlariga ochiladi</title>
  <defs>
    <marker id="tw02c-strelka" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="470" fill="#f8fafc"/>
  <text x="390" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">Bitta qator nimani olib keladi?</text>
  <text x="390" y="60" text-anchor="middle" font-size="14" fill="#64748b">@import "tailwindcss" to'rtta cascade qatlamiga ochiladi</text>

  <!-- import qatori -->
  <rect x="240" y="84" width="300" height="48" rx="10" fill="#1e293b" stroke="#4f46e5" stroke-width="2"/>
  <text x="390" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">@import "tailwindcss";</text>

  <!-- strelka pastga -->
  <line x1="390" y1="132" x2="390" y2="166" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#tw02c-strelka)"/>
  <text x="408" y="156" font-size="13" fill="#64748b">ochiladi &#8595;</text>

  <!-- 4 qatlam (ustma-ust) -->
  <!-- theme -->
  <rect x="120" y="176" width="540" height="60" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="140" y="202" font-size="16" font-weight="bold" fill="#4f46e5">1 · theme</text>
  <text x="140" y="224" font-size="14" fill="#1e293b">dizayn tokenlari: ranglar, spacing, shriftlar (@theme bu yerga qo'shiladi)</text>
  <text x="644" y="211" text-anchor="end" font-size="13" fill="#64748b">@layer theme</text>

  <!-- base / preflight -->
  <rect x="120" y="244" width="540" height="60" rx="10" fill="#dbeafe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="140" y="270" font-size="16" font-weight="bold" fill="#0284c7">2 · base (preflight)</text>
  <text x="140" y="292" font-size="14" fill="#1e293b">brauzer reset: margin/padding tozalanadi, bir xil boshlang'ich nuqta</text>
  <text x="644" y="279" text-anchor="end" font-size="13" fill="#64748b">@layer base</text>

  <!-- components -->
  <rect x="120" y="312" width="540" height="60" rx="10" fill="#cffafe" stroke="#38bdf8" stroke-width="2"/>
  <text x="140" y="338" font-size="16" font-weight="bold" fill="#0e7490">3 · components</text>
  <text x="140" y="360" font-size="14" fill="#1e293b">o'z komponent klasslaringiz uchun joy (@apply, plaginlar)</text>
  <text x="644" y="347" text-anchor="end" font-size="13" fill="#64748b">@layer components</text>

  <!-- utilities -->
  <rect x="120" y="380" width="540" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="406" font-size="16" font-weight="bold" fill="#16a34a">4 · utilities</text>
  <text x="140" y="428" font-size="14" fill="#1e293b">asosiy ish: p-4, flex, text-3xl... — eng baland prioritet</text>
  <text x="644" y="415" text-anchor="end" font-size="13" fill="#64748b">@layer utilities</text>

  <!-- prioritet o'qi -->
  <text x="694" y="200" text-anchor="middle" font-size="13" fill="#64748b">past</text>
  <text x="694" y="430" text-anchor="middle" font-size="13" fill="#64748b">baland</text>
  <line x1="694" y1="208" x2="694" y2="416" stroke="#94a3b8" stroke-width="2" marker-end="url(#tw02c-strelka)"/>
  <text x="730" y="312" text-anchor="middle" font-size="13" fill="#475569" transform="rotate(90 730 312)">prioritet ortadi</text>
</svg>
