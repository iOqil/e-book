<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Tailwind spacing scale: n × 0.25rem formulasi va o'sib boruvchi bar'lar</title>
  <rect x="0" y="0" width="780" height="470" fill="#f8fafc"/>

  <text x="30" y="40" font-size="22" fill="#1e293b" font-weight="bold">Spacing scale: bitta birlik, ko'p qadam</text>
  <text x="30" y="66" font-size="15" fill="#475569">Har bir son — ko'paytuvchi (multiplier). Asos: --spacing = 0.25rem = 4px</text>

  <!-- formula box -->
  <rect x="30" y="84" width="720" height="48" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="50" y="114" font-size="18" fill="#4f46e5" font-weight="bold">p-4</text>
  <text x="100" y="114" font-size="16" fill="#1e293b">=  4  ×  0.25rem  =  1rem  =  16px</text>
  <text x="430" y="114" font-size="15" fill="#64748b">soni — bu necha marta 4px</text>

  <!-- column headers -->
  <text x="50" y="168" font-size="14" fill="#64748b" font-weight="bold">KLASS</text>
  <text x="150" y="168" font-size="14" fill="#64748b" font-weight="bold">n × 0.25rem</text>
  <text x="300" y="168" font-size="14" fill="#64748b" font-weight="bold">px</text>
  <text x="360" y="168" font-size="14" fill="#64748b" font-weight="bold">ko'rinishi (kenglik bar)</text>

  <!-- rows: y, label, formula, px, barwidth -->
  <!-- p-1 -->
  <text x="50" y="196" font-size="15" fill="#1e293b">p-1</text>
  <text x="150" y="196" font-size="15" fill="#475569">1 × 0.25</text>
  <text x="300" y="196" font-size="15" fill="#16a34a">4</text>
  <rect x="360" y="186" width="8" height="14" rx="2" fill="#6366f1"/>

  <!-- p-2 -->
  <text x="50" y="224" font-size="15" fill="#1e293b">p-2</text>
  <text x="150" y="224" font-size="15" fill="#475569">2 × 0.25</text>
  <text x="300" y="224" font-size="15" fill="#16a34a">8</text>
  <rect x="360" y="214" width="16" height="14" rx="2" fill="#6366f1"/>

  <!-- p-3 -->
  <text x="50" y="252" font-size="15" fill="#1e293b">p-3</text>
  <text x="150" y="252" font-size="15" fill="#475569">3 × 0.25</text>
  <text x="300" y="252" font-size="15" fill="#16a34a">12</text>
  <rect x="360" y="242" width="24" height="14" rx="2" fill="#6366f1"/>

  <!-- p-4 -->
  <text x="50" y="280" font-size="15" fill="#1e293b">p-4</text>
  <text x="150" y="280" font-size="15" fill="#475569">4 × 0.25</text>
  <text x="300" y="280" font-size="15" fill="#16a34a">16</text>
  <rect x="360" y="270" width="32" height="14" rx="2" fill="#4f46e5"/>

  <!-- p-6 -->
  <text x="50" y="308" font-size="15" fill="#1e293b">p-6</text>
  <text x="150" y="308" font-size="15" fill="#475569">6 × 0.25</text>
  <text x="300" y="308" font-size="15" fill="#16a34a">24</text>
  <rect x="360" y="298" width="48" height="14" rx="2" fill="#4f46e5"/>

  <!-- p-8 -->
  <text x="50" y="336" font-size="15" fill="#1e293b">p-8</text>
  <text x="150" y="336" font-size="15" fill="#475569">8 × 0.25</text>
  <text x="300" y="336" font-size="15" fill="#16a34a">32</text>
  <rect x="360" y="326" width="64" height="14" rx="2" fill="#4f46e5"/>

  <!-- p-12 -->
  <text x="50" y="364" font-size="15" fill="#1e293b">p-12</text>
  <text x="150" y="364" font-size="15" fill="#475569">12 × 0.25</text>
  <text x="300" y="364" font-size="15" fill="#16a34a">48</text>
  <rect x="360" y="354" width="96" height="14" rx="2" fill="#0ea5e9"/>

  <!-- p-16 -->
  <text x="50" y="392" font-size="15" fill="#1e293b">p-16</text>
  <text x="150" y="392" font-size="15" fill="#475569">16 × 0.25</text>
  <text x="300" y="392" font-size="15" fill="#16a34a">64</text>
  <rect x="360" y="382" width="128" height="14" rx="2" fill="#0ea5e9"/>

  <!-- special p-px -->
  <line x1="30" y1="414" x2="750" y2="414" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <text x="50" y="440" font-size="15" fill="#1e293b">p-px</text>
  <text x="150" y="440" font-size="15" fill="#475569">istisno</text>
  <text x="300" y="440" font-size="15" fill="#f59e0b">1</text>
  <text x="360" y="440" font-size="14" fill="#64748b">scale'dan tashqari: aniq 1px (yupqa chiziq uchun)</text>
</svg>
