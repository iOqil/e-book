<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500" font-family="Segoe UI, system-ui, sans-serif">
  <title>Brend dizayn tizimi paneli: @theme ichidagi brand-50 dan brand-900 gacha rang shkalasi, spacing asosi, radius va shrift namunasi, hamda ana shu tokenlardan qurilgan brend tugmasi</title>
  <rect x="0" y="0" width="780" height="500" fill="#f8fafc"/>

  <text x="390" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">Loyihaning @theme dizayn tizimi</text>
  <text x="390" y="60" text-anchor="middle" font-size="14" fill="#475569">Tokenlar (tepada) → ulardan qurilgan komponent (pastda)</text>

  <!-- Rang shkalasi bo'limi -->
  <text x="40" y="94" font-size="15" font-weight="bold" fill="#4f46e5">--color-brand-*  (rang shkalasi)</text>
  <!-- swatchlar 50 -> 900 -->
  <rect x="40" y="106" width="92" height="56" rx="6" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="86" y="138" text-anchor="middle" font-size="13" fill="#1e293b">50</text>
  <rect x="138" y="106" width="92" height="56" rx="6" fill="#c7d2fe" stroke="#cbd5e1" stroke-width="1"/>
  <text x="184" y="138" text-anchor="middle" font-size="13" fill="#1e293b">100</text>
  <rect x="236" y="106" width="92" height="56" rx="6" fill="#a5b4fc"/>
  <text x="282" y="138" text-anchor="middle" font-size="13" fill="#1e293b">200</text>
  <rect x="334" y="106" width="92" height="56" rx="6" fill="#6366f1"/>
  <text x="380" y="138" text-anchor="middle" font-size="13" fill="#ffffff">500</text>
  <rect x="432" y="106" width="92" height="56" rx="6" fill="#4f46e5"/>
  <text x="478" y="138" text-anchor="middle" font-size="13" fill="#ffffff">600</text>
  <rect x="530" y="106" width="92" height="56" rx="6" fill="#4338ca"/>
  <text x="576" y="138" text-anchor="middle" font-size="13" fill="#ffffff">700</text>
  <rect x="628" y="106" width="92" height="56" rx="6" fill="#312e81"/>
  <text x="674" y="138" text-anchor="middle" font-size="13" fill="#ffffff">900</text>

  <!-- O'rta qator: spacing, radius, shrift -->
  <!-- spacing -->
  <text x="40" y="200" font-size="15" font-weight="bold" fill="#4f46e5">--spacing</text>
  <text x="40" y="220" font-size="13" fill="#475569">asos: 0.25rem</text>
  <rect x="40" y="232" width="16" height="20" rx="3" fill="#38bdf8"/>
  <rect x="62" y="232" width="32" height="20" rx="3" fill="#0ea5e9"/>
  <rect x="100" y="232" width="48" height="20" rx="3" fill="#0284c7"/>
  <text x="40" y="272" font-size="13" fill="#64748b">p-1 · p-2 · p-3 ...</text>

  <!-- radius -->
  <text x="290" y="200" font-size="15" font-weight="bold" fill="#4f46e5">--radius-card</text>
  <text x="290" y="220" font-size="13" fill="#475569">1rem</text>
  <rect x="290" y="230" width="80" height="46" rx="16" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="330" y="259" text-anchor="middle" font-size="13" fill="#475569">rounded-card</text>

  <!-- shrift -->
  <text x="520" y="200" font-size="15" font-weight="bold" fill="#4f46e5">--font-display</text>
  <text x="520" y="220" font-size="13" fill="#475569">"Satoshi"</text>
  <rect x="520" y="230" width="200" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="534" y="261" font-size="20" font-weight="bold" fill="#1e293b">Aa Bb Cc</text>

  <!-- ajratuvchi chiziq -->
  <line x1="40" y1="300" x2="740" y2="300" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 5"/>
  <text x="390" y="324" text-anchor="middle" font-size="15" font-weight="bold" fill="#16a34a">↓ shu tokenlardan qurilgan brend komponenti ↓</text>

  <!-- Karta komponent -->
  <rect x="250" y="338" width="280" height="146" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- badge -->
  <rect x="270" y="356" width="70" height="26" rx="13" fill="#c7d2fe"/>
  <text x="305" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#4338ca">Yangi</text>
  <!-- sarlavha -->
  <text x="270" y="408" font-size="18" font-weight="bold" fill="#312e81">Pro tarif</text>
  <text x="270" y="430" font-size="13" fill="#64748b">Cheksiz loyihalar va yordam</text>
  <!-- tugma -->
  <rect x="270" y="442" width="240" height="32" rx="8" fill="#4f46e5"/>
  <text x="390" y="463" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Hoziroq boshlash</text>
  <!-- tugma izoh -->
  <text x="546" y="462" font-size="13" fill="#16a34a">bg-primary</text>
  <text x="546" y="479" font-size="13" fill="#64748b">= brand-600</text>

  <!-- chap izoh -->
  <text x="234" y="374" text-anchor="end" font-size="13" fill="#64748b">brand-100</text>
  <text x="234" y="412" text-anchor="end" font-size="13" fill="#64748b">brand-900</text>
</svg>
