<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Segoe UI, system-ui, sans-serif">
  <title>cn helper oqimi: asosiy klasslar va shartli klasslar clsx orqali birlashtiriladi, chaqiruvchidan kelgan override qo'shiladi, twMerge esa ziddiyatli klasslarni hal qiladi (px-2 ga qarshi px-4 dan px-4 yutadi) va yakuniy className hosil bo'ladi</title>
  <rect x="0" y="0" width="800" height="500" fill="#f8fafc"/>

  <text x="400" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">cn() = twMerge(clsx(...)) oqimi</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#475569">Shartli birlashtirish + ziddiyatni hal qilish = ishonchli className</text>

  <!-- 1. Asosiy klasslar -->
  <rect x="40" y="84" width="340" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="58" y="108" font-size="13" font-weight="bold" fill="#64748b">1. ASOS (komponent ichida)</text>
  <text x="58" y="134" font-size="14" fill="#1e293b">'px-2 py-1 rounded bg-indigo-600'</text>

  <!-- 2. Shartli klass -->
  <rect x="420" y="84" width="340" height="70" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="438" y="108" font-size="13" font-weight="bold" fill="#0284c7">2. SHARTLI (clsx baholaydi)</text>
  <text x="438" y="134" font-size="14" fill="#1e293b">isActive &amp;&amp; 'ring-2'</text>

  <!-- strelkalar pastga clsx ga -->
  <line x1="210" y1="154" x2="210" y2="182" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="210,182 204,170 216,170" fill="#94a3b8"/>
  <line x1="590" y1="154" x2="590" y2="182" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="590,182 584,170 596,170" fill="#94a3b8"/>

  <!-- clsx blok -->
  <rect x="120" y="184" width="560" height="58" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="400" y="208" text-anchor="middle" font-size="15" font-weight="bold" fill="#0284c7">clsx() — shartlilarni bitta qatorga qo'shadi</text>
  <text x="400" y="230" text-anchor="middle" font-size="13" fill="#1e293b">→ "px-2 py-1 rounded bg-indigo-600 ring-2"</text>

  <!-- 3. Chaqiruvchi override -->
  <rect x="120" y="262" width="560" height="62" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">3. CHAQIRUVCHIDAN override: className="px-4"</text>
  <text x="400" y="310" text-anchor="middle" font-size="13" fill="#1e293b">qatorga qo'shiladi → "...px-2... ring-2 px-4"  ⚠️ px-2 VA px-4 birga!</text>

  <!-- strelka pastga twMerge ga -->
  <line x1="400" y1="324" x2="400" y2="350" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="400,350 394,338 406,338" fill="#94a3b8"/>

  <!-- twMerge blok -->
  <rect x="120" y="352" width="560" height="78" rx="10" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5"/>
  <text x="400" y="378" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">twMerge() — ziddiyatni hal qiladi: OXIRGISI yutadi</text>
  <text x="400" y="402" text-anchor="middle" font-size="14" fill="#ffffff">px-2  ✕  px-4  →  px-4</text>
  <text x="400" y="421" text-anchor="middle" font-size="13" fill="#e0e7ff">(bir xil xususiyat — faqat bittasi qoladi)</text>

  <!-- strelka pastga natija -->
  <line x1="400" y1="430" x2="400" y2="452" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="400,452 394,440 406,440" fill="#94a3b8"/>

  <!-- yakuniy className -->
  <rect x="120" y="454" width="560" height="38" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="400" y="479" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">YAKUNIY: "py-1 rounded bg-indigo-600 ring-2 px-4"</text>
</svg>
