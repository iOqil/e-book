<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" width="780" height="460" font-family="Segoe UI, system-ui, sans-serif">
  <title>Utility klasslarning CSS qoidasiga ochilishi: har bir atomik klass aniq bitta CSS deklaratsiyaga aylanadi</title>
  <rect x="0" y="0" width="780" height="460" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Har bir utility = bitta atomik CSS qoidasi</text>
  <text x="390" y="58" text-anchor="middle" font-size="14" fill="#475569">klassni "ochsak", u aniq nimaga aylanishini ko'ramiz (v4.3.1)</text>

  <!-- ustun sarlavhalari -->
  <text x="175" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#4f46e5">Utility klass</text>
  <text x="565" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#0ea5e9">Hosil bo'lgan CSS</text>

  <!-- 1: px-4 -->
  <rect x="40" y="106" width="180" height="44" rx="8" fill="#1e293b"/>
  <text x="130" y="134" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#38bdf8">px-4</text>
  <path d="M 226 128 L 384 128" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <polygon points="390,128 380,123 380,133" fill="#94a3b8"/>
  <rect x="396" y="106" width="344" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="412" y="134" font-family="Consolas, monospace" font-size="14" fill="#1e293b">padding-inline: 1rem;</text>

  <!-- 2: py-2 -->
  <rect x="40" y="162" width="180" height="44" rx="8" fill="#1e293b"/>
  <text x="130" y="190" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#38bdf8">py-2</text>
  <path d="M 226 184 L 384 184" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <polygon points="390,184 380,179 380,189" fill="#94a3b8"/>
  <rect x="396" y="162" width="344" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="412" y="190" font-family="Consolas, monospace" font-size="14" fill="#1e293b">padding-block: 0.5rem;</text>

  <!-- 3: rounded-md -->
  <rect x="40" y="218" width="180" height="44" rx="8" fill="#1e293b"/>
  <text x="130" y="246" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#38bdf8">rounded-md</text>
  <path d="M 226 240 L 384 240" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <polygon points="390,240 380,235 380,245" fill="#94a3b8"/>
  <rect x="396" y="218" width="344" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="412" y="246" font-family="Consolas, monospace" font-size="14" fill="#1e293b">border-radius: 0.375rem;</text>

  <!-- 4: bg-indigo-600 -->
  <rect x="40" y="274" width="180" height="44" rx="8" fill="#1e293b"/>
  <text x="130" y="302" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#38bdf8">bg-indigo-600</text>
  <path d="M 226 296 L 384 296" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <polygon points="390,296 380,291 380,301" fill="#94a3b8"/>
  <rect x="396" y="274" width="344" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="412" y="302" font-family="Consolas, monospace" font-size="14" fill="#1e293b">background-color: </text>
  <rect x="615" y="289" width="16" height="16" rx="3" fill="#4f46e5"/>
  <text x="638" y="302" font-family="Consolas, monospace" font-size="13" fill="#475569">oklch(...)</text>

  <!-- 5: text-white -->
  <rect x="40" y="330" width="180" height="44" rx="8" fill="#1e293b"/>
  <text x="130" y="358" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#38bdf8">text-white</text>
  <path d="M 226 352 L 384 352" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <polygon points="390,352 380,347 380,357" fill="#94a3b8"/>
  <rect x="396" y="330" width="344" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="412" y="358" font-family="Consolas, monospace" font-size="14" fill="#1e293b">color: #ffffff;</text>

  <!-- xulosa -->
  <rect x="120" y="396" width="540" height="44" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="390" y="423" text-anchor="middle" font-size="13" fill="#1e293b">Klasslarni terib UI quryapsiz; har biri o'zgarmas (atomik) bitta qoida</text>
</svg>
