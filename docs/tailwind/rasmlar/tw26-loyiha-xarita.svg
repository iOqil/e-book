<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" font-family="Segoe UI, system-ui, sans-serif">
  <title>Yakuniy loyihaning anatomiyasi: app.css (@theme + @plugin + @custom-variant) dizayn manbai bo'lib, undan header, hero, feature-kartalar, forma, dashboard widgetlari, dark-toggle va qayta ishlatiluvchi Button komponenti oziqlanadi; har bir qism qaysi bobdan kelganini ko'rsatadi</title>
  <rect x="0" y="0" width="820" height="560" fill="#f8fafc"/>

  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">Loyiha anatomiyasi — bitta manba, ko'p qism</text>
  <text x="410" y="58" text-anchor="middle" font-size="14" fill="#475569">app.css barcha qismni oziqlantiradi; har blok ostida — manba bob</text>

  <!-- Manba: app.css -->
  <rect x="250" y="80" width="320" height="92" rx="12" fill="#4f46e5"/>
  <text x="410" y="108" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">app.css — dizayn manbai</text>
  <text x="410" y="131" text-anchor="middle" font-size="13" fill="#ffffff">@import "tailwindcss"</text>
  <text x="410" y="150" text-anchor="middle" font-size="13" fill="#ffffff">@theme · @plugin · @custom-variant dark</text>
  <text x="410" y="167" text-anchor="middle" font-size="13" fill="#c7d2fe">18 · 21 · 24-bob</text>

  <!-- Bog'lovchi chiziqlar app.css -> qismlar -->
  <line x1="410" y1="172" x2="410" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="120" y1="200" x2="700" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="120" y1="200" x2="120" y2="232" stroke="#94a3b8" stroke-width="2"/>
  <line x1="313" y1="200" x2="313" y2="232" stroke="#94a3b8" stroke-width="2"/>
  <line x1="507" y1="200" x2="507" y2="232" stroke="#94a3b8" stroke-width="2"/>
  <line x1="700" y1="200" x2="700" y2="232" stroke="#94a3b8" stroke-width="2"/>

  <!-- Qator 1: header / hero / feature / forma -->
  <rect x="40" y="232" width="160" height="74" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="120" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Header (shell)</text>
  <text x="120" y="283" text-anchor="middle" font-size="13" fill="#475569">sticky · backdrop-blur</text>
  <text x="120" y="300" text-anchor="middle" font-size="13" fill="#0ea5e9">06 · 08-bob</text>

  <rect x="233" y="232" width="160" height="74" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="313" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Hero</text>
  <text x="313" y="283" text-anchor="middle" font-size="13" fill="#475569">bg-linear · CTA</text>
  <text x="313" y="300" text-anchor="middle" font-size="13" fill="#0ea5e9">13 · 17-bob</text>

  <rect x="427" y="232" width="160" height="74" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="507" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Feature kartalar</text>
  <text x="507" y="283" text-anchor="middle" font-size="13" fill="#475569">@container · grid</text>
  <text x="507" y="300" text-anchor="middle" font-size="13" fill="#0ea5e9">07 · 10-bob</text>

  <rect x="620" y="232" width="160" height="74" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="700" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Forma</text>
  <text x="700" y="283" text-anchor="middle" font-size="13" fill="#475569">forms · user-invalid</text>
  <text x="700" y="300" text-anchor="middle" font-size="13" fill="#0ea5e9">15 · 23-bob</text>

  <!-- Qator 2 ulagich -->
  <line x1="120" y1="330" x2="120" y2="356" stroke="#94a3b8" stroke-width="2"/>
  <line x1="313" y1="330" x2="313" y2="356" stroke="#94a3b8" stroke-width="2"/>
  <line x1="507" y1="330" x2="507" y2="356" stroke="#94a3b8" stroke-width="2"/>
  <line x1="700" y1="330" x2="700" y2="356" stroke="#94a3b8" stroke-width="2"/>
  <line x1="120" y1="330" x2="700" y2="330" stroke="#94a3b8" stroke-width="2"/>

  <!-- Qator 2: dashboard / dark-toggle / Button / ship -->
  <rect x="40" y="356" width="160" height="74" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="120" y="386" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Dashboard</text>
  <text x="120" y="407" text-anchor="middle" font-size="13" fill="#475569">KPI · divide-y · prose</text>
  <text x="120" y="424" text-anchor="middle" font-size="13" fill="#0ea5e9">05 · 12 · 14-bob</text>

  <rect x="233" y="356" width="160" height="74" rx="10" fill="#1e293b"/>
  <text x="313" y="386" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Dark toggle</text>
  <text x="313" y="407" text-anchor="middle" font-size="13" fill="#cbd5e1">classList + no-FOUC</text>
  <text x="313" y="424" text-anchor="middle" font-size="13" fill="#38bdf8">16-bob</text>

  <rect x="427" y="356" width="160" height="74" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="507" y="386" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Button (cva)</text>
  <text x="507" y="407" text-anchor="middle" font-size="13" fill="#475569">cva + cn, qayta ishl.</text>
  <text x="507" y="424" text-anchor="middle" font-size="13" fill="#16a34a">22-bob</text>

  <rect x="620" y="356" width="160" height="74" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="700" y="386" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Polish &amp; ship</text>
  <text x="700" y="407" text-anchor="middle" font-size="13" fill="#475569">a11y · --minify</text>
  <text x="700" y="424" text-anchor="middle" font-size="13" fill="#f59e0b">24 · 25-bob</text>

  <!-- Pastki izoh -->
  <rect x="40" y="464" width="740" height="68" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="410" y="492" text-anchor="middle" font-size="15" font-weight="bold" fill="#4338ca">Qurish tartibi</text>
  <text x="410" y="516" text-anchor="middle" font-size="13" fill="#475569">1) Setup &#8594; 2) app.css/@theme &#8594; 3) shell &#8594; 4) hero &#8594; 5) kartalar &#8594; 6) forma &#8594; 7) dashboard &#8594; 8) dark &#8594; 9) Button &#8594; 10) ship</text>
</svg>
