<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Tailwind position utility turlari: relative, absolute, fixed va sticky elementlar skroll va ota-element ichida qanday joylashishi</title>
  <rect x="0" y="0" width="800" height="470" fill="#f8fafc"/>

  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">position turlari: element qayerga nisbatan joylashadi</text>

  <!-- relative -->
  <text x="40" y="74" font-size="15" font-weight="bold" fill="#4f46e5">relative</text>
  <text x="118" y="74" font-size="13" fill="#64748b">— asl joyidan siljiydi, joyi (arvoh) saqlanadi</text>
  <rect x="40" y="86" width="320" height="130" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="60" y="104" width="120" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="120" y="129" text-anchor="middle" font-size="13" fill="#94a3b8">asl o'rin</text>
  <rect x="90" y="134" width="120" height="40" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="150" y="159" text-anchor="middle" font-size="13" fill="#4f46e5">top-2 left-2</text>
  <text x="60" y="200" font-size="13" fill="#475569">Oqimda qoladi · positioning konteksti beradi</text>

  <!-- absolute -->
  <text x="440" y="74" font-size="15" font-weight="bold" fill="#0ea5e9">absolute</text>
  <text x="522" y="74" font-size="13" fill="#64748b">— oqimdan chiqadi, positioned ota'ga</text>
  <rect x="440" y="86" width="320" height="130" rx="8" fill="#ffffff" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="452" y="104" font-size="13" fill="#0ea5e9">relative ota</text>
  <rect x="690" y="96" width="60" height="36" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="720" y="118" text-anchor="middle" font-size="13" fill="#0ea5e9">badge</text>
  <text x="452" y="180" font-size="13" fill="#475569">absolute -top-1 -right-1</text>
  <text x="452" y="200" font-size="13" fill="#475569">→ ota'ning o'ng-yuqori burchagiga yopishadi</text>

  <!-- fixed -->
  <text x="40" y="256" font-size="15" font-weight="bold" fill="#16a34a">fixed</text>
  <text x="100" y="256" font-size="13" fill="#64748b">— viewport'ga yopishadi, skrollda qimirlamaydi</text>
  <rect x="40" y="268" width="320" height="160" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="200" y="286" text-anchor="middle" font-size="13" fill="#94a3b8">viewport (ekran oynasi)</text>
  <rect x="270" y="378" width="74" height="36" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="307" y="401" text-anchor="middle" font-size="13" fill="#16a34a">↑ top</text>
  <text x="56" y="358" font-size="13" fill="#475569">fixed bottom-4 right-4</text>
  <text x="56" y="378" font-size="13" fill="#475569">sahifa skroll bo'lsa ham</text>
  <text x="56" y="398" font-size="13" fill="#475569">shu yerda turaveradi</text>

  <!-- sticky -->
  <text x="440" y="256" font-size="15" font-weight="bold" fill="#f59e0b">sticky</text>
  <text x="510" y="256" font-size="13" fill="#64748b">— gibrid: skroll chegaraga yetguncha oqimda</text>
  <rect x="440" y="268" width="320" height="160" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="440" y="268" width="320" height="34" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="290" text-anchor="middle" font-size="13" fill="#f59e0b">sticky top-0  (yopishgan header)</text>
  <line x1="460" y1="322" x2="740" y2="322" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="460" y1="350" x2="740" y2="350" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="460" y1="378" x2="740" y2="378" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="600" y="410" text-anchor="middle" font-size="13" fill="#475569">tagdagi kontent ostidan skroll bo'ladi ↓</text>

  <text x="400" y="456" text-anchor="middle" font-size="14" fill="#475569">Hammasi bitta klass: relative · absolute · fixed · sticky — top/right/bottom/left bilan birga</text>
</svg>
