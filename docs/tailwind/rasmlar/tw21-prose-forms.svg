<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>Ikki juft oldin/keyin: chap tomonda uslublanmagan HTML maqola prose orqali chiroyli matnga aylanadi; o'ng tomonda xunuk standart input @tailwindcss/forms orqali uslublasa bo'ladigan toza inputga aylanadi</title>
  <rect x="0" y="0" width="800" height="440" fill="#f8fafc"/>

  <text x="400" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">Ikki rasmiy plagin — oldin va keyin</text>

  <!-- CHAP: typography -->
  <text x="200" y="68" text-anchor="middle" font-size="15" font-weight="bold" fill="#4f46e5">@tailwindcss/typography → prose</text>

  <!-- oldin: uslublanmagan maqola -->
  <rect x="30" y="84" width="160" height="180" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="110" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#64748b">OLDIN (xom HTML)</text>
  <text x="46" y="132" font-size="14" fill="#1e293b">Sarlavha</text>
  <text x="46" y="152" font-size="13" fill="#1e293b">qator qator qator qator</text>
  <text x="46" y="168" font-size="13" fill="#1e293b">qator qator qator</text>
  <text x="46" y="190" font-size="13" fill="#1e293b">* band band band</text>
  <text x="46" y="206" font-size="13" fill="#1e293b">* band band</text>
  <text x="46" y="228" font-size="13" fill="#1e293b">qator qator qator qator</text>
  <text x="46" y="244" font-size="13" fill="#1e293b">qator qator</text>

  <!-- strelka prose -->
  <line x1="194" y1="174" x2="230" y2="174" stroke="#6366f1" stroke-width="2"/>
  <polygon points="230,174 218,168 218,180" fill="#6366f1"/>
  <text x="212" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#4f46e5">prose</text>

  <!-- keyin: chiroyli maqola -->
  <rect x="234" y="84" width="156" height="180" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="312" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#4f46e5">KEYIN (prose)</text>
  <text x="250" y="136" font-size="16" font-weight="bold" fill="#1e293b">Sarlavha</text>
  <line x1="250" y1="148" x2="374" y2="148" stroke="#e2e8f0" stroke-width="1"/>
  <text x="250" y="168" font-size="13" fill="#475569">o'qishga qulay matn,</text>
  <text x="250" y="186" font-size="13" fill="#475569">to'g'ri masofa va o'lcham</text>
  <text x="250" y="212" font-size="13" fill="#475569">•  toza ro'yxat band</text>
  <text x="250" y="230" font-size="13" fill="#475569">•  toza ro'yxat band</text>
  <text x="250" y="252" font-size="13" fill="#6366f1">havola chiroyli rangda</text>

  <!-- vertikal ajratuvchi -->
  <line x1="410" y1="60" x2="410" y2="300" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- O'NG: forms -->
  <text x="600" y="68" text-anchor="middle" font-size="15" font-weight="bold" fill="#0284c7">@tailwindcss/forms → input</text>

  <!-- oldin: xunuk input -->
  <rect x="430" y="84" width="160" height="180" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="510" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#64748b">OLDIN (brauzer)</text>
  <text x="446" y="136" font-size="13" fill="#475569">Ism</text>
  <rect x="446" y="146" width="128" height="28" rx="2" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/>
  <text x="456" y="165" font-size="13" fill="#64748b">xunuk, ichki stil</text>
  <text x="446" y="200" font-size="13" fill="#ef4444">border/ring qisman</text>
  <text x="446" y="218" font-size="13" fill="#ef4444">bekor bo'ladi ✗</text>

  <!-- strelka forms -->
  <line x1="594" y1="174" x2="630" y2="174" stroke="#0ea5e9" stroke-width="2"/>
  <polygon points="630,174 618,168 618,180" fill="#0ea5e9"/>
  <text x="612" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#0284c7">forms</text>

  <!-- keyin: toza input -->
  <rect x="634" y="84" width="156" height="180" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="712" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#0284c7">KEYIN (forms)</text>
  <text x="650" y="136" font-size="13" fill="#475569">Ism</text>
  <rect x="650" y="146" width="124" height="32" rx="8" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <rect x="647" y="143" width="130" height="38" rx="10" fill="none" stroke="#bae6fd" stroke-width="3"/>
  <text x="660" y="167" font-size="13" fill="#64748b">focus:ring ✓</text>
  <text x="650" y="208" font-size="13" fill="#16a34a">border/rounded/ring</text>
  <text x="650" y="226" font-size="13" fill="#16a34a">endi ishlaydi ✓</text>

  <!-- pastki xulosa -->
  <rect x="60" y="320" width="680" height="92" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="400" y="350" text-anchor="middle" font-size="15" font-weight="bold" fill="#4f46e5">Ikkalasi bir xil naqsh bilan ulanadi:</text>
  <text x="400" y="378" text-anchor="middle" font-size="14" fill="#1e293b">@plugin "@tailwindcss/typography";  ·  @plugin "@tailwindcss/forms";</text>
  <text x="400" y="400" text-anchor="middle" font-size="13" fill="#64748b">typography — boy matn uchun · forms — forma elementlari uchun poydevor</text>
</svg>
