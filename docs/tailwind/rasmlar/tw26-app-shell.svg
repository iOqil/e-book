<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Responsive app shell skeleti: desktopda sticky header (to'liq en) + grid-cols-[260px_1fr] bilan 260px sidebar va 1fr main; mobilda sidebar yashirilib qism ustma-ust (stacked) joylashadi; lg: breakpointda ikki ustunga o'tadi</title>
  <rect x="0" y="0" width="820" height="470" fill="#f8fafc"/>

  <text x="410" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">App shell — bitta layout, ikki o'lcham</text>
  <text x="410" y="56" text-anchor="middle" font-size="14" fill="#475569">Chapda desktop (lg va undan keng) · O'ngda mobil (kichik ekran)</text>

  <!-- DESKTOP panel -->
  <text x="40" y="90" font-size="15" font-weight="bold" fill="#4f46e5">Desktop &#8211; lg: faol</text>

  <!-- sticky header to'liq en -->
  <rect x="40" y="100" width="460" height="40" rx="6" fill="#4f46e5"/>
  <text x="60" y="125" font-size="14" font-weight="bold" fill="#ffffff">Header</text>
  <text x="490" y="125" text-anchor="end" font-size="13" fill="#c7d2fe">sticky top-0 z-50</text>

  <!-- sidebar 260px -->
  <rect x="40" y="150" width="140" height="250" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="110" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#4338ca">Sidebar</text>
  <rect x="56" y="194" width="108" height="20" rx="4" fill="#ffffff" stroke="#c7d2fe" stroke-width="1"/>
  <rect x="56" y="222" width="108" height="20" rx="4" fill="#ffffff" stroke="#c7d2fe" stroke-width="1"/>
  <rect x="56" y="250" width="108" height="20" rx="4" fill="#ffffff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="110" y="392" text-anchor="middle" font-size="13" fill="#4338ca">260px</text>

  <!-- main 1fr -->
  <rect x="190" y="150" width="310" height="250" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="345" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Main</text>
  <rect x="206" y="194" width="86" height="48" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="302" y="194" width="86" height="48" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="398" y="194" width="86" height="48" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="206" y="254" width="278" height="130" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="345" y="324" text-anchor="middle" font-size="13" fill="#64748b">kontent</text>
  <text x="345" y="392" text-anchor="middle" font-size="13" fill="#475569">1fr (qolgan joy)</text>

  <text x="270" y="424" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">grid grid-cols-[260px_1fr]</text>

  <!-- breakpoint o'q -->
  <line x1="540" y1="100" x2="540" y2="430" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 5"/>

  <!-- MOBIL panel -->
  <text x="600" y="90" font-size="15" font-weight="bold" fill="#0ea5e9">Mobil &#8211; lg: o'chiq</text>

  <!-- header to'liq en -->
  <rect x="600" y="100" width="180" height="38" rx="6" fill="#4f46e5"/>
  <text x="618" y="124" font-size="13" font-weight="bold" fill="#ffffff">Header + ☰</text>

  <!-- main stacked (sidebar yashirin) -->
  <rect x="600" y="148" width="180" height="48" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="690" y="177" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Main (1 ustun)</text>
  <rect x="600" y="204" width="180" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="690" y="229" text-anchor="middle" font-size="13" fill="#64748b">KPI 1</text>
  <rect x="600" y="252" width="180" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="690" y="277" text-anchor="middle" font-size="13" fill="#64748b">KPI 2</text>
  <rect x="600" y="300" width="180" height="48" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="690" y="329" text-anchor="middle" font-size="13" fill="#64748b">kontent</text>

  <text x="690" y="376" text-anchor="middle" font-size="13" fill="#475569">sidebar yashirin (drawer)</text>
  <text x="690" y="408" text-anchor="middle" font-size="13" font-weight="bold" fill="#16a34a">grid-cols-1</text>
  <text x="690" y="428" text-anchor="middle" font-size="13" fill="#64748b">lg:grid-cols-[260px_1fr]</text>
</svg>
