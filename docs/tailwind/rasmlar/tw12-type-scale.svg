<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Tailwind type scale: text-xs dan text-4xl gacha namuna matnlar, klass va rem qiymati bilan</title>
  <rect x="0" y="0" width="780" height="470" fill="#f8fafc"/>

  <text x="30" y="40" font-size="22" fill="#1e293b" font-weight="bold">Type scale: bitta klass — o'lcham + line-height</text>
  <text x="30" y="66" font-size="15" fill="#475569">Har bir text-* klassi shrift o'lchamini VA mos line-height'ni birga beradi</text>

  <!-- column headers -->
  <text x="50" y="104" font-size="14" fill="#64748b" font-weight="bold">KLASS</text>
  <text x="170" y="104" font-size="14" fill="#64748b" font-weight="bold">rem</text>
  <text x="250" y="104" font-size="14" fill="#64748b" font-weight="bold">px</text>
  <text x="330" y="104" font-size="14" fill="#64748b" font-weight="bold">ko'rinishi (namuna)</text>
  <line x1="30" y1="114" x2="750" y2="114" stroke="#94a3b8"/>

  <!-- text-xs -->
  <text x="50" y="142" font-size="15" fill="#4f46e5" font-weight="bold">text-xs</text>
  <text x="170" y="142" font-size="14" fill="#475569">0.75</text>
  <text x="250" y="142" font-size="14" fill="#16a34a">12</text>
  <text x="330" y="144" font-size="13" fill="#1e293b">Aa Tailwind</text>

  <!-- text-sm -->
  <text x="50" y="172" font-size="15" fill="#4f46e5" font-weight="bold">text-sm</text>
  <text x="170" y="172" font-size="14" fill="#475569">0.875</text>
  <text x="250" y="172" font-size="14" fill="#16a34a">14</text>
  <text x="330" y="174" font-size="14" fill="#1e293b">Aa Tailwind</text>

  <!-- text-base -->
  <text x="50" y="204" font-size="15" fill="#4f46e5" font-weight="bold">text-base</text>
  <text x="170" y="204" font-size="14" fill="#475569">1</text>
  <text x="250" y="204" font-size="14" fill="#16a34a">16</text>
  <text x="330" y="206" font-size="16" fill="#1e293b">Aa Tailwind</text>

  <!-- text-lg -->
  <text x="50" y="240" font-size="15" fill="#4f46e5" font-weight="bold">text-lg</text>
  <text x="170" y="240" font-size="14" fill="#475569">1.125</text>
  <text x="250" y="240" font-size="14" fill="#16a34a">18</text>
  <text x="330" y="242" font-size="18" fill="#1e293b">Aa Tailwind</text>

  <!-- text-xl -->
  <text x="50" y="278" font-size="15" fill="#4f46e5" font-weight="bold">text-xl</text>
  <text x="170" y="278" font-size="14" fill="#475569">1.25</text>
  <text x="250" y="278" font-size="14" fill="#16a34a">20</text>
  <text x="330" y="282" font-size="20" fill="#1e293b">Aa Tailwind</text>

  <!-- text-2xl -->
  <text x="50" y="322" font-size="15" fill="#4f46e5" font-weight="bold">text-2xl</text>
  <text x="170" y="322" font-size="14" fill="#475569">1.5</text>
  <text x="250" y="322" font-size="14" fill="#16a34a">24</text>
  <text x="330" y="328" font-size="24" fill="#0ea5e9">Aa Tailwind</text>

  <!-- text-4xl -->
  <text x="50" y="384" font-size="15" fill="#4f46e5" font-weight="bold">text-4xl</text>
  <text x="170" y="384" font-size="14" fill="#475569">2.25</text>
  <text x="250" y="384" font-size="14" fill="#16a34a">36</text>
  <text x="330" y="392" font-size="36" fill="#0ea5e9" font-weight="bold">Aa Tailwind</text>

  <!-- footnote -->
  <line x1="30" y1="414" x2="750" y2="414" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <text x="30" y="440" font-size="14" fill="#64748b">Davomi bor: text-5xl (3rem) ... text-9xl (8rem). v4'da o'lcham + leading'ni birga: text-lg/7</text>
</svg>
