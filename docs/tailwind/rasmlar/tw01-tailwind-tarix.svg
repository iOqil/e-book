<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="Segoe UI, system-ui, sans-serif">
  <title>Tailwind CSS tarixi vaqt o'qida: v1 dan v4.3 gacha har versiyaning asosiy yangiligi</title>
  <rect x="0" y="0" width="800" height="380" fill="#f8fafc"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Tailwind CSS tarixi: v1 → v4.3</text>
  <text x="400" y="60" text-anchor="middle" font-size="14" fill="#475569">v4 — tub burilish: Oxide dvigateli va CSS-first sozlash</text>

  <!-- vaqt o'qi -->
  <line x1="60" y1="200" x2="740" y2="200" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="748,200 736,194 736,206" fill="#94a3b8"/>

  <!-- v1 -->
  <circle cx="110" cy="200" r="9" fill="#64748b"/>
  <line x1="110" y1="200" x2="110" y2="148" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="52" y="98" width="116" height="50" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="110" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">v1</text>
  <text x="110" y="139" text-anchor="middle" font-size="13" fill="#475569">utility-first</text>
  <text x="110" y="234" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">2017</text>

  <!-- v2 -->
  <circle cx="248" cy="200" r="9" fill="#64748b"/>
  <line x1="248" y1="200" x2="248" y2="252" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="190" y="252" width="116" height="50" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="248" y="274" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">v2</text>
  <text x="248" y="293" text-anchor="middle" font-size="13" fill="#475569">dark mode</text>
  <text x="248" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">2020</text>

  <!-- v3 -->
  <circle cx="386" cy="200" r="9" fill="#0ea5e9"/>
  <line x1="386" y1="200" x2="386" y2="148" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="328" y="98" width="116" height="50" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="386" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">v3</text>
  <text x="386" y="139" text-anchor="middle" font-size="13" fill="#475569">JIT dvigatel</text>
  <text x="386" y="234" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">2022</text>

  <!-- v4 (urg'u) -->
  <circle cx="540" cy="200" r="12" fill="#4f46e5"/>
  <line x1="540" y1="200" x2="540" y2="246" stroke="#6366f1" stroke-width="2"/>
  <rect x="468" y="246" width="144" height="68" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="540" y="270" text-anchor="middle" font-size="17" font-weight="bold" fill="#4f46e5">v4</text>
  <text x="540" y="290" text-anchor="middle" font-size="13" fill="#1e293b">Oxide (Rust)</text>
  <text x="540" y="307" text-anchor="middle" font-size="13" fill="#1e293b">CSS-first @theme</text>
  <text x="540" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#4f46e5">2025</text>

  <!-- v4.3 (joriy) -->
  <circle cx="690" cy="200" r="10" fill="#16a34a"/>
  <line x1="690" y1="200" x2="690" y2="148" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="628" y="92" width="124" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="690" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#16a34a">v4.3</text>
  <text x="690" y="133" text-anchor="middle" font-size="13" fill="#1e293b">joriy versiya</text>
  <text x="690" y="234" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">2026</text>

  <!-- izoh -->
  <rect x="150" y="338" width="500" height="32" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="400" y="359" text-anchor="middle" font-size="13" fill="#1e293b">Bu kitob butunlay v4 — eski v3 (JS config) sintaksisini ishlatmaymiz</text>
</svg>
