<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>group va peer farqi: group — OTA elementga .group qo'yiladi, bola ota holatiga javob beradi (ota -> bola); peer — oldingi SIBLING input'ga .peer qo'yiladi, keyingi sibling input holatiga javob beradi (sibling -> sibling)</title>
  <rect x="0" y="0" width="800" height="440" fill="#f8fafc"/>

  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">group (ota boshqaradi) va peer (sibling boshqaradi)</text>

  <!-- divider between two halves -->
  <line x1="400" y1="60" x2="400" y2="410" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- ===== LEFT: GROUP ===== -->
  <text x="200" y="82" text-anchor="middle" font-size="17" font-weight="bold" fill="#4f46e5">group</text>
  <text x="200" y="104" text-anchor="middle" font-size="13" fill="#475569">.group OTA'da · bola group-hover: bilan</text>

  <!-- parent box (the group) -->
  <rect x="60" y="120" width="280" height="180" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="76" y="142" font-size="13" font-weight="bold" fill="#4f46e5">OTA  class="group"</text>
  <text x="76" y="160" font-size="13" fill="#64748b">&#8593; sichqoncha shu OTA ustida</text>

  <!-- child box -->
  <rect x="92" y="186" width="216" height="80" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="200" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#0ea5e9">BOLA</text>
  <text x="200" y="236" text-anchor="middle" font-size="14" fill="#1e293b">group-hover:opacity-100</text>
  <text x="200" y="256" text-anchor="middle" font-size="13" fill="#64748b">ota'ga javob beradi</text>

  <!-- arrow parent -> child (downward, inside) -->
  <line x1="200" y1="166" x2="200" y2="180" stroke="#16a34a" stroke-width="3"/>
  <polygon points="200,188 194,176 206,176" fill="#16a34a"/>
  <text x="248" y="178" font-size="13" fill="#16a34a" font-weight="bold">ota &#8594; bola</text>

  <text x="200" y="290" text-anchor="middle" font-size="13" fill="#475569">Ichma-ich: bola ota holatini "eshitadi"</text>

  <!-- ===== RIGHT: PEER ===== -->
  <text x="600" y="82" text-anchor="middle" font-size="17" font-weight="bold" fill="#4f46e5">peer</text>
  <text x="600" y="104" text-anchor="middle" font-size="13" fill="#475569">.peer INPUT'da · KEYINGI sibling peer-checked:</text>

  <!-- peer input box -->
  <rect x="460" y="130" width="280" height="60" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="476" y="152" font-size="13" font-weight="bold" fill="#f59e0b">input class="peer"</text>
  <text x="476" y="172" font-size="13" fill="#64748b">holat: checked / focus / invalid</text>

  <!-- sibling box (after) -->
  <rect x="460" y="222" width="280" height="64" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="600" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#0ea5e9">KEYINGI sibling</text>
  <text x="600" y="270" text-anchor="middle" font-size="14" fill="#1e293b">peer-checked:bg-indigo-600</text>

  <!-- arrow sibling -> sibling (downward) -->
  <line x1="600" y1="190" x2="600" y2="214" stroke="#16a34a" stroke-width="3"/>
  <polygon points="600,222 594,210 606,210" fill="#16a34a"/>
  <text x="648" y="208" font-size="13" fill="#16a34a" font-weight="bold">sibling &#8594; sibling</text>

  <text x="600" y="312" text-anchor="middle" font-size="13" fill="#ef4444" font-weight="bold">DIQQAT: peer input KEYINGISIDAN OLDIN turishi shart</text>

  <!-- bottom summary boxes -->
  <rect x="60" y="350" width="280" height="56" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="200" y="374" text-anchor="middle" font-size="13" fill="#4f46e5" font-weight="bold">group = ICHKARIGA (ota &#8594; bola)</text>
  <text x="200" y="394" text-anchor="middle" font-size="13" fill="#475569">karta, ro'yxat elementi uchun</text>

  <rect x="460" y="350" width="280" height="56" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="600" y="374" text-anchor="middle" font-size="13" fill="#4f46e5" font-weight="bold">peer = YONMA-YON (sibling &#8594; sibling)</text>
  <text x="600" y="394" text-anchor="middle" font-size="13" fill="#475569">toggle, floating label uchun</text>
</svg>
