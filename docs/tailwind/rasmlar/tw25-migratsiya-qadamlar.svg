<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="Segoe UI, system-ui, sans-serif">
  <title>v3 dan v4 ga migratsiya oqimi: toza git branch yaratish, npx @tailwindcss/upgrade ishga tushirish, avtomatik o'zgarishlar, qo'lda tekshirish va vizual diff, tayyor; yon panelda asosiy nom o'zgarishlari ro'yxati</title>
  <rect x="0" y="0" width="800" height="520" fill="#f8fafc"/>

  <text x="400" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">v3 → v4 migratsiya oqimi</text>
  <text x="400" y="62" text-anchor="middle" font-size="14" fill="#475569">Asbob 90% ni qiladi — qolganini siz tekshirasiz</text>

  <!-- LEFT: oqim qadamlari -->
  <!-- step 1 -->
  <rect x="36" y="88" width="320" height="58" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="66" cy="117" r="15" fill="#6366f1"/>
  <text x="66" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">1</text>
  <text x="92" y="113" font-size="15" font-weight="bold" fill="#1e293b">Toza git branch</text>
  <text x="92" y="133" font-size="13" fill="#64748b">git checkout -b tailwind-v4</text>
  <line x1="196" y1="146" x2="196" y2="166" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 196 168 l -5 -8 l 10 0 z" fill="#94a3b8"/>

  <!-- step 2 -->
  <rect x="36" y="170" width="320" height="58" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <circle cx="66" cy="199" r="15" fill="#6366f1"/>
  <text x="66" y="204" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">2</text>
  <text x="92" y="195" font-size="15" font-weight="bold" fill="#1e293b">Asbobni ishga tushiring</text>
  <text x="92" y="215" font-size="13" fill="#4f46e5">npx @tailwindcss/upgrade</text>
  <line x1="196" y1="228" x2="196" y2="248" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 196 250 l -5 -8 l 10 0 z" fill="#94a3b8"/>

  <!-- step 3 -->
  <rect x="36" y="252" width="320" height="98" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <circle cx="66" cy="281" r="15" fill="#6366f1"/>
  <text x="66" y="286" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">3</text>
  <text x="92" y="282" font-size="15" font-weight="bold" fill="#1e293b">Avtomatik o'zgarishlar</text>
  <text x="56" y="306" font-size="13" fill="#475569">• @tailwind  →  @import "tailwindcss"</text>
  <text x="56" y="326" font-size="13" fill="#475569">• config theme  →  @theme (CSS'da)</text>
  <text x="56" y="344" font-size="13" fill="#475569">• utility nomlarini almashtirish</text>
  <line x1="196" y1="350" x2="196" y2="370" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 196 372 l -5 -8 l 10 0 z" fill="#94a3b8"/>

  <!-- step 4 -->
  <rect x="36" y="374" width="320" height="58" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="66" cy="403" r="15" fill="#f59e0b"/>
  <text x="66" y="408" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">4</text>
  <text x="92" y="399" font-size="15" font-weight="bold" fill="#1e293b">Qo'lda tekshir + vizual diff</text>
  <text x="92" y="419" font-size="13" fill="#64748b">har sahifani v3 va v4 da solishtiring</text>
  <line x1="196" y1="432" x2="196" y2="452" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 196 454 l -5 -8 l 10 0 z" fill="#94a3b8"/>

  <!-- step 5 -->
  <rect x="36" y="456" width="320" height="44" rx="10" fill="#16a34a"/>
  <text x="196" y="483" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">✓ Tayyor — v4 da</text>

  <!-- RIGHT: nom o'zgarishlari paneli -->
  <rect x="392" y="88" width="372" height="412" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="578" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#4f46e5">Asosiy nom o'zgarishlari (v3 → v4)</text>
  <line x1="412" y1="130" x2="744" y2="130" stroke="#94a3b8" stroke-width="1"/>

  <!-- header -->
  <text x="416" y="154" font-size="13" font-weight="bold" fill="#64748b">v3</text>
  <text x="582" y="154" font-size="13" font-weight="bold" fill="#64748b">v4</text>

  <!-- rows -->
  <text x="416" y="182" font-size="13" fill="#ef4444">bg-gradient-to-r</text>
  <text x="540" y="182" font-size="13" fill="#94a3b8">→</text>
  <text x="582" y="182" font-size="13" fill="#16a34a">bg-linear-to-r</text>

  <text x="416" y="208" font-size="13" fill="#ef4444">shadow-sm / shadow</text>
  <text x="540" y="208" font-size="13" fill="#94a3b8">→</text>
  <text x="582" y="208" font-size="13" fill="#16a34a">shadow-xs / shadow-sm</text>

  <text x="416" y="234" font-size="13" fill="#ef4444">rounded</text>
  <text x="540" y="234" font-size="13" fill="#94a3b8">→</text>
  <text x="582" y="234" font-size="13" fill="#16a34a">rounded-sm</text>

  <text x="416" y="260" font-size="13" fill="#ef4444">outline-none</text>
  <text x="540" y="260" font-size="13" fill="#94a3b8">→</text>
  <text x="582" y="260" font-size="13" fill="#16a34a">outline-hidden</text>

  <text x="416" y="286" font-size="13" fill="#ef4444">flex-shrink-0 / flex-grow</text>
  <text x="540" y="286" font-size="13" fill="#94a3b8">→</text>
  <text x="582" y="286" font-size="13" fill="#16a34a">shrink-0 / grow</text>

  <text x="416" y="312" font-size="13" fill="#ef4444">bg-opacity-50</text>
  <text x="540" y="312" font-size="13" fill="#94a3b8">→</text>
  <text x="582" y="312" font-size="13" fill="#16a34a">bg-black/50</text>

  <line x1="412" y1="330" x2="744" y2="330" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="416" y="352" font-size="13" font-weight="bold" fill="#1e293b">"Jim" o'zgarishlar — diqqat:</text>

  <text x="416" y="378" font-size="13" fill="#475569">• ring kengligi 3px → 1px</text>
  <text x="430" y="396" font-size="13" fill="#64748b">(eski xulq: ring-3)</text>
  <text x="416" y="422" font-size="13" fill="#475569">• standart border rangi:</text>
  <text x="430" y="440" font-size="13" fill="#64748b">gray-200 → currentColor</text>

  <rect x="412" y="456" width="332" height="32" rx="8" fill="#fee2e2"/>
  <text x="578" y="477" text-anchor="middle" font-size="13" font-weight="bold" fill="#ef4444">Eski brauzer kerakmi? → v3.4 da qoling</text>
</svg>
