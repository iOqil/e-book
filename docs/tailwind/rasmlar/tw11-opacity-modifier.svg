<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" font-family="Segoe UI, system-ui, sans-serif">
  <title>Opacity modifikatori: bg-blue-500 to'liq, /75, /50, /25 — shaffoflik shaxmat fonida ko'rinadi; color-mix bilan rangni transparent bilan aralashtiradi</title>
  <rect x="0" y="0" width="780" height="420" fill="#f8fafc"/>

  <text x="390" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">Opacity modifikatori: bg-blue-500 / NN</text>
  <text x="390" y="62" text-anchor="middle" font-size="14" fill="#475569">Slesh + raqam = rangning shaffoflik darajasi. Faqat shu rangga ta'sir qiladi.</text>

  <!-- checkerboard region behind swatches: x 40..740, y 90..250 -->
  <defs>
    <pattern id="checker" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#ffffff"/>
      <rect width="16" height="16" fill="#e2e8f0"/>
      <rect x="16" y="16" width="16" height="16" fill="#e2e8f0"/>
    </pattern>
  </defs>
  <rect x="40" y="90" width="700" height="160" rx="8" fill="url(#checker)" stroke="#94a3b8" stroke-width="1"/>

  <!-- four swatches over checker. Each 150 wide, gap 20, start 55 -->
  <!-- /100 solid -->
  <rect x="55" y="106" width="150" height="128" rx="8" fill="#3b82f6"/>
  <text x="130" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">/100</text>
  <text x="130" y="200" text-anchor="middle" font-size="13" fill="#dbeafe">to'liq</text>
  <!-- /75  alpha 0.75 -->
  <rect x="225" y="106" width="150" height="128" rx="8" fill="#3b82f6" fill-opacity="0.75"/>
  <text x="300" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">/75</text>
  <!-- /50 -->
  <rect x="395" y="106" width="150" height="128" rx="8" fill="#3b82f6" fill-opacity="0.5"/>
  <text x="470" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">/50</text>
  <!-- /25 -->
  <rect x="565" y="106" width="150" height="128" rx="8" fill="#3b82f6" fill-opacity="0.25"/>
  <text x="640" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">/25</text>

  <text x="130" y="270" text-anchor="middle" font-size="14" fill="#475569">bg-blue-500</text>
  <text x="300" y="270" text-anchor="middle" font-size="14" fill="#475569">bg-blue-500/75</text>
  <text x="470" y="270" text-anchor="middle" font-size="14" fill="#475569">bg-blue-500/50</text>
  <text x="640" y="270" text-anchor="middle" font-size="14" fill="#475569">bg-blue-500/25</text>

  <text x="390" y="300" text-anchor="middle" font-size="13" fill="#64748b">Shaffoflik kamaygan sayin orqadagi shaxmat naqshi ko'rina boshlaydi</text>

  <!-- compile-to box -->
  <rect x="100" y="328" width="580" height="74" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <rect x="120" y="346" width="190" height="26" rx="5" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="215" y="364" text-anchor="middle" font-size="14" fill="#4f46e5">bg-blue-500/50</text>
  <text x="330" y="364" font-size="18" fill="#64748b">&#8594;</text>
  <text x="390" y="364" font-size="13" font-weight="bold" fill="#16a34a">color-mix(in oklab,</text>
  <text x="390" y="388" font-size="13" font-weight="bold" fill="#16a34a">var(--color-blue-500) 50%, transparent)</text>
</svg>
