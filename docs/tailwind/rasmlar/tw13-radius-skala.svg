<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 410" width="780" height="410" font-family="Segoe UI, system-ui, sans-serif">
  <title>Border radius skalasi: rounded-none, rounded, rounded-lg, rounded-2xl va rounded-full — burchaklar asta yumshaydi; plus aylana avatar va pill tugma</title>
  <rect x="0" y="0" width="780" height="410" fill="#f8fafc"/>

  <text x="390" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">rounded-* skalasi: burchak yumshashi</text>
  <text x="390" y="66" text-anchor="middle" font-size="14" fill="#475569">Chapdan o'ngga radius o'sib boradi — to'rtburchakdan to to'liq aylanagacha</text>

  <!-- none -->
  <rect x="40" y="100" width="120" height="100" rx="0" fill="#6366f1"/>
  <text x="100" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#4f46e5">rounded-none</text>
  <text x="100" y="246" text-anchor="middle" font-size="13" fill="#64748b">0</text>

  <!-- rounded (default) -->
  <rect x="190" y="100" width="120" height="100" rx="4" fill="#6366f1"/>
  <text x="250" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#4f46e5">rounded</text>
  <text x="250" y="246" text-anchor="middle" font-size="13" fill="#64748b">0.25rem</text>

  <!-- lg -->
  <rect x="340" y="100" width="120" height="100" rx="8" fill="#6366f1"/>
  <text x="400" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#4f46e5">rounded-lg</text>
  <text x="400" y="246" text-anchor="middle" font-size="13" fill="#64748b">0.5rem</text>

  <!-- 2xl -->
  <rect x="490" y="100" width="120" height="100" rx="16" fill="#6366f1"/>
  <text x="550" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#4f46e5">rounded-2xl</text>
  <text x="550" y="246" text-anchor="middle" font-size="13" fill="#64748b">1rem</text>

  <!-- full (pill on rectangle) -->
  <rect x="640" y="100" width="120" height="100" rx="50" fill="#6366f1"/>
  <text x="700" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#4f46e5">rounded-full</text>
  <text x="700" y="246" text-anchor="middle" font-size="13" fill="#64748b">to'liq</text>

  <!-- separator -->
  <line x1="40" y1="278" x2="740" y2="278" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="40" y="306" font-size="15" font-weight="bold" fill="#1e293b">rounded-full + size-* / kenglik bilan ikki klassik shakl:</text>

  <!-- circle avatar -->
  <circle cx="120" cy="356" r="34" fill="#0ea5e9"/>
  <text x="120" y="362" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">OI</text>
  <text x="230" y="345" font-size="14" font-weight="bold" fill="#4f46e5">Aylana avatar</text>
  <text x="230" y="367" font-size="13" fill="#64748b">size-16 rounded-full</text>

  <!-- pill button -->
  <rect x="430" y="334" width="170" height="44" rx="22" fill="#16a34a"/>
  <text x="515" y="362" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Obuna bo'lish</text>
  <text x="630" y="345" font-size="14" font-weight="bold" fill="#4f46e5">Pill tugma</text>
  <text x="630" y="367" font-size="13" fill="#64748b">px-6 py-2 rounded-full</text>
</svg>
