<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>@theme tokeni Tailwind dvigatelidan o'tib, ham bg-brand-500 utility klassi, ham :root var(--color-brand-500) o'zgaruvchisi bo'lib chiqishi; ikkalasi ham HTML va custom CSS'da ishlatilishi</title>
  <rect x="0" y="0" width="800" height="470" fill="#f8fafc"/>

  <text x="400" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">Bitta token → ikkita natija</text>
  <text x="400" y="60" text-anchor="middle" font-size="14" fill="#475569">@theme'dagi bitta o'zgaruvchi ham utility klass, ham :root o'zgaruvchisi yaratadi</text>

  <!-- 1. @theme token (manba) -->
  <rect x="40" y="90" width="250" height="92" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="60" y="116" font-size="14" font-weight="bold" fill="#4f46e5">@theme &#123;</text>
  <text x="74" y="142" font-size="14" fill="#1e293b">--color-brand-500:</text>
  <text x="88" y="162" font-size="14" fill="#16a34a">oklch(0.62 0.19 250);</text>
  <text x="60" y="178" font-size="14" font-weight="bold" fill="#4f46e5">&#125;</text>
  <text x="165" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#64748b">1. TOKEN (manba)</text>

  <!-- strelka manba -> dvigatel -->
  <line x1="290" y1="136" x2="340" y2="136" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="340,136 328,130 328,142" fill="#94a3b8"/>

  <!-- 2. Tailwind dvigateli -->
  <rect x="340" y="106" width="160" height="60" rx="10" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5"/>
  <text x="420" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Tailwind</text>
  <text x="420" y="152" text-anchor="middle" font-size="13" fill="#ffffff">dvigateli</text>

  <!-- ikkiga ajraladi -->
  <line x1="500" y1="136" x2="540" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="540,100 528,104 535,114" fill="#94a3b8"/>
  <line x1="500" y1="136" x2="540" y2="172" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="540,172 535,158 528,168" fill="#94a3b8"/>

  <!-- chiqish A: utility klass -->
  <rect x="540" y="72" width="240" height="56" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="555" y="94" font-size="13" font-weight="bold" fill="#0284c7">A. UTILITY KLASS</text>
  <text x="555" y="116" font-size="14" fill="#1e293b">.bg-brand-500</text>

  <!-- chiqish B: :root var -->
  <rect x="540" y="146" width="240" height="56" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="555" y="168" font-size="13" font-weight="bold" fill="#16a34a">B. :root O'ZGARUVCHI</text>
  <text x="555" y="190" font-size="14" fill="#1e293b">var(--color-brand-500)</text>

  <!-- pastki qism: ishlatish -->
  <line x1="400" y1="222" x2="400" y2="242" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="400" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Ikkalasini ham ishlatasiz:</text>

  <!-- HTML utility -->
  <rect x="70" y="284" width="320" height="150" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="90" y="310" font-size="14" font-weight="bold" fill="#0284c7">HTML'da utility bilan</text>
  <rect x="90" y="324" width="280" height="44" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="104" y="351" font-size="14" fill="#1e293b">&lt;div class="bg-brand-500"&gt;</text>
  <rect x="90" y="378" width="280" height="42" rx="6" fill="#6366f1"/>
  <text x="230" y="404" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">fon = brand-500</text>

  <!-- custom CSS var -->
  <rect x="410" y="284" width="320" height="150" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="430" y="310" font-size="14" font-weight="bold" fill="#16a34a">Custom CSS'da o'zgaruvchi bilan</text>
  <rect x="430" y="324" width="280" height="64" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="444" y="346" font-size="14" fill="#1e293b">.halqa &#123;</text>
  <text x="458" y="366" font-size="13" fill="#1e293b">box-shadow: 0 0 0 3px</text>
  <text x="472" y="383" font-size="13" fill="#16a34a">var(--color-brand-500); &#125;</text>
  <text x="570" y="412" text-anchor="middle" font-size="13" fill="#475569">Manba bitta — joylar ko'p</text>

  <text x="400" y="456" text-anchor="middle" font-size="13" fill="#64748b">Tokenni bir joyda o'zgartirsangiz — utility ham, o'zgaruvchi ham birga yangilanadi</text>
</svg>
