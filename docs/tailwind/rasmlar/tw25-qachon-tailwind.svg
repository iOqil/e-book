<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Tailwind qachon to'g'ri tanlov: chap ustunda mos holatlar — ilovalar, dizayn tizimi, jamoa, tez iteratsiya, komponent freymvork; o'ng ustunda ehtiyot bo'lish kerak bo'lgan holatlar — kichik statik sahifa, qat'iy semantik talab, email HTML, jamoa rozi emas</title>
  <rect x="0" y="0" width="780" height="470" fill="#f8fafc"/>

  <text x="390" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">Tailwind: qachon HA, qachon EHTIYOT bo'l</text>
  <text x="390" y="62" text-anchor="middle" font-size="14" fill="#475569">Asbobni vazifaga moslang — vazifani asbobga emas</text>

  <!-- LEFT: yaxshi mos -->
  <rect x="32" y="84" width="350" height="362" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="32" y="84" width="350" height="44" rx="14" fill="#16a34a"/>
  <rect x="32" y="110" width="350" height="18" fill="#16a34a"/>
  <text x="207" y="113" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Tailwind yaxshi mos keladi</text>

  <!-- row 1 -->
  <text x="58" y="166" font-size="15" font-weight="bold" fill="#16a34a">✓</text>
  <text x="80" y="166" font-size="15" font-weight="bold" fill="#1e293b">Ilovalar (web app, dashboard)</text>
  <text x="80" y="186" font-size="13" fill="#64748b">ko'p ekran, ko'p holat, tez o'zgaradi</text>
  <!-- row 2 -->
  <text x="58" y="220" font-size="15" font-weight="bold" fill="#16a34a">✓</text>
  <text x="80" y="220" font-size="15" font-weight="bold" fill="#1e293b">Dizayn tizimi (@theme)</text>
  <text x="80" y="240" font-size="13" fill="#64748b">brendni markazdan boshqarish</text>
  <!-- row 3 -->
  <text x="58" y="274" font-size="15" font-weight="bold" fill="#16a34a">✓</text>
  <text x="80" y="274" font-size="15" font-weight="bold" fill="#1e293b">Jamoa ishi</text>
  <text x="80" y="294" font-size="13" fill="#64748b">cheklangan shkala = izchillik</text>
  <!-- row 4 -->
  <text x="58" y="328" font-size="15" font-weight="bold" fill="#16a34a">✓</text>
  <text x="80" y="328" font-size="15" font-weight="bold" fill="#1e293b">Tez iteratsiya / prototip</text>
  <text x="80" y="348" font-size="13" fill="#64748b">fikrdan ekrangacha qisqa masofa</text>
  <!-- row 5 -->
  <text x="58" y="382" font-size="15" font-weight="bold" fill="#16a34a">✓</text>
  <text x="80" y="382" font-size="15" font-weight="bold" fill="#1e293b">Komponent freymvork</text>
  <text x="80" y="402" font-size="13" fill="#64748b">React, Vue, Svelte — takror boshqariladi</text>

  <!-- RIGHT: ehtiyot bo'l -->
  <rect x="398" y="84" width="350" height="362" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <rect x="398" y="84" width="350" height="44" rx="14" fill="#f59e0b"/>
  <rect x="398" y="110" width="350" height="18" fill="#f59e0b"/>
  <text x="573" y="113" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Ehtiyot bo'l / muqobilni o'yla</text>

  <!-- row 1 -->
  <text x="424" y="166" font-size="15" font-weight="bold" fill="#f59e0b">!</text>
  <text x="446" y="166" font-size="15" font-weight="bold" fill="#1e293b">Kichik bir martalik statik sahifa</text>
  <text x="446" y="186" font-size="13" fill="#64748b">Play CDN yoki oddiy CSS yetadi</text>
  <!-- row 2 -->
  <text x="424" y="220" font-size="15" font-weight="bold" fill="#f59e0b">!</text>
  <text x="446" y="220" font-size="15" font-weight="bold" fill="#1e293b">Qat'iy semantik ajratish talabi</text>
  <text x="446" y="240" font-size="13" fill="#64748b">"stil faqat .css da" qoidasi</text>
  <!-- row 3 -->
  <text x="424" y="274" font-size="15" font-weight="bold" fill="#f59e0b">!</text>
  <text x="446" y="274" font-size="15" font-weight="bold" fill="#1e293b">Email HTML</text>
  <text x="446" y="294" font-size="13" fill="#64748b">email mijozlari CSS'ni cheklaydi</text>
  <!-- row 4 -->
  <text x="424" y="328" font-size="15" font-weight="bold" fill="#f59e0b">!</text>
  <text x="446" y="328" font-size="15" font-weight="bold" fill="#1e293b">Jamoa rozi emas</text>
  <text x="446" y="348" font-size="13" fill="#64748b">qabul qilinmagan asbob foyda bermaydi</text>
  <!-- note box -->
  <rect x="420" y="372" width="306" height="52" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="436" y="394" font-size="13" fill="#475569">Bu holatlarda Tailwind "noto'g'ri" emas —</text>
  <text x="436" y="412" font-size="13" fill="#475569">shunchaki eng mos asbob boshqasi bo'lishi mumkin.</text>
</svg>
