<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" font-family="Segoe UI, system-ui, sans-serif">
  <title>Transform turlari: asosiy kvadrat va uning scale-110, rotate-12, translate-x, skew-x-6 ko'rinishlari; har biri asl shaklni soya bilan ko'rsatadi; hamda 3D rotate-y karta</title>
  <rect x="0" y="0" width="800" height="460" fill="#f8fafc"/>

  <text x="400" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">Transform turlari — shaklni qayta chizmasdan o'zgartirish</text>
  <text x="400" y="60" text-anchor="middle" font-size="14" fill="#475569">Och kontur = asl o'rni · to'q = transform qo'llangandan keyin</text>

  <!-- 1) scale-110 -->
  <text x="110" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#4f46e5">scale-110</text>
  <rect x="78" y="135" width="64" height="64" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="71" y="128" width="78" height="78" rx="9" fill="#6366f1" opacity="0.9"/>
  <text x="110" y="232" text-anchor="middle" font-size="13" fill="#64748b">kattalashtiradi</text>

  <!-- 2) rotate-12 -->
  <text x="290" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#4f46e5">rotate-12</text>
  <rect x="258" y="135" width="64" height="64" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="258" y="135" width="64" height="64" rx="8" fill="#0ea5e9" opacity="0.9" transform="rotate(12 290 167)"/>
  <text x="290" y="232" text-anchor="middle" font-size="13" fill="#64748b">aylantiradi (12&#176;)</text>

  <!-- 3) translate-x-6 -->
  <text x="490" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#4f46e5">translate-x-6</text>
  <rect x="438" y="135" width="64" height="64" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="470" y="135" width="64" height="64" rx="8" fill="#38bdf8" opacity="0.95"/>
  <line x1="502" y1="215" x2="502" y2="215" stroke="#16a34a" stroke-width="2"/>
  <line x1="502" y1="216" x2="534" y2="216" stroke="#16a34a" stroke-width="2"/>
  <polygon points="534,216 524,211 524,221" fill="#16a34a"/>
  <text x="490" y="246" text-anchor="middle" font-size="13" fill="#64748b">o'ngga suradi</text>

  <!-- 4) skew-x-6 -->
  <text x="680" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#4f46e5">skew-x-6</text>
  <rect x="648" y="135" width="64" height="64" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="655,199 665,135 729,135 719,199" fill="#f59e0b" opacity="0.9"/>
  <text x="680" y="232" text-anchor="middle" font-size="13" fill="#64748b">qiyshaytiradi</text>

  <!-- ajratuvchi chiziq -->
  <line x1="40" y1="275" x2="760" y2="275" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- 3D rotate-y card -->
  <text x="400" y="305" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">3D (v4 yangi): perspective + transform-3d</text>

  <!-- frontal reference -->
  <rect x="180" y="330" width="120" height="90" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="240" y="382" text-anchor="middle" font-size="14" fill="#64748b">old yuza</text>
  <text x="240" y="440" text-anchor="middle" font-size="13" fill="#64748b">rotate-y-0 (asl)</text>

  <!-- rotated 3d card (trapezoid suggesting y rotation) -->
  <polygon points="470,330 590,346 590,404 470,420" fill="#4f46e5" opacity="0.95"/>
  <polygon points="470,330 590,346 590,404 470,420" fill="none" stroke="#4338ca" stroke-width="1.5"/>
  <text x="525" y="380" text-anchor="middle" font-size="14" fill="#ffffff">rotate-y-30</text>
  <text x="525" y="440" text-anchor="middle" font-size="13" fill="#64748b">Y o'qi bo'ylab burilgan</text>

  <!-- 3D axis hint -->
  <line x1="350" y1="375" x2="430" y2="375" stroke="#16a34a" stroke-width="2"/>
  <polygon points="430,375 420,370 420,380" fill="#16a34a"/>
  <text x="390" y="365" text-anchor="middle" font-size="13" fill="#16a34a" font-weight="bold">chuqurlik</text>
</svg>
