<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Statik @utility content-auto bitta klass beradi; funksional @utility tab-* esa * o'rnini --value(integer) bilan to'ldirib tab-2, tab-4, tab-[13] kabi cheksiz klasslar yaratadi</title>
  <rect x="0" y="0" width="800" height="470" fill="#f8fafc"/>

  <text x="400" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">@utility — ikki ko'rinish</text>
  <text x="400" y="60" text-anchor="middle" font-size="14" fill="#475569">Statik: bitta klass · Funksional: * o'rnini --value() to'ldiradi</text>

  <!-- ===== CHAP: STATIK ===== -->
  <rect x="30" y="80" width="360" height="350" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="210" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#0284c7">STATIK @utility</text>

  <!-- ta'rif -->
  <rect x="52" y="120" width="316" height="74" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="68" y="144" font-size="14" font-weight="bold" fill="#4f46e5">@utility content-auto &#123;</text>
  <text x="86" y="166" font-size="14" fill="#1e293b">content-visibility: auto;</text>
  <text x="68" y="186" font-size="14" font-weight="bold" fill="#4f46e5">&#125;</text>

  <!-- strelka -->
  <line x1="210" y1="200" x2="210" y2="224" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="210,224 204,212 216,212" fill="#94a3b8"/>

  <!-- natija: bitta klass -->
  <rect x="100" y="230" width="220" height="40" rx="8" fill="#6366f1"/>
  <text x="210" y="256" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">content-auto</text>
  <text x="210" y="290" text-anchor="middle" font-size="13" fill="#475569">aniq, qiymatsiz bitta klass</text>

  <!-- variantlar ham ishlaydi -->
  <rect x="52" y="306" width="316" height="106" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="68" y="330" font-size="13" font-weight="bold" fill="#16a34a">+ Variantlar avtomatik ishlaydi:</text>
  <rect x="68" y="342" width="130" height="30" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="133" y="362" text-anchor="middle" font-size="14" fill="#1e293b">lg:content-auto</text>
  <rect x="210" y="342" width="146" height="30" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="283" y="362" text-anchor="middle" font-size="14" fill="#1e293b">hover:content-auto</text>
  <text x="68" y="396" font-size="13" fill="#475569">Oddiy .class buni BERMAYDI — <tspan font-weight="bold">@utility</tspan> beradi.</text>

  <!-- ===== O'NG: FUNKSIONAL ===== -->
  <rect x="410" y="80" width="360" height="350" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="590" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#4f46e5">FUNKSIONAL @utility</text>

  <!-- ta'rif -->
  <rect x="432" y="120" width="316" height="74" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="448" y="144" font-size="14" font-weight="bold" fill="#4f46e5">@utility tab-* &#123;</text>
  <text x="466" y="166" font-size="14" fill="#1e293b">tab-size: <tspan fill="#16a34a">--value(integer)</tspan>;</text>
  <text x="448" y="186" font-size="14" font-weight="bold" fill="#4f46e5">&#125;</text>

  <!-- * placeholder izoh -->
  <text x="590" y="216" text-anchor="middle" font-size="13" fill="#ef4444" font-weight="bold">* = klassdagi qiymat o'rni</text>

  <!-- strelka -->
  <line x1="590" y1="224" x2="590" y2="244" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="590,244 584,232 596,232" fill="#94a3b8"/>

  <!-- natija: cheksiz klasslar -->
  <rect x="432" y="250" width="100" height="40" rx="8" fill="#6366f1"/>
  <text x="482" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">tab-2</text>
  <rect x="540" y="250" width="100" height="40" rx="8" fill="#6366f1"/>
  <text x="590" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">tab-4</text>
  <rect x="648" y="250" width="100" height="40" rx="8" fill="#4f46e5"/>
  <text x="698" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">tab-[13]</text>

  <!-- qanday hal bo'ladi -->
  <rect x="432" y="306" width="316" height="106" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="448" y="330" font-size="13" font-weight="bold" fill="#1e293b">* qanday to'ladi:</text>
  <text x="448" y="354" font-size="13" fill="#1e293b">tab-<tspan fill="#0ea5e9" font-weight="bold">2</tspan>  →  --value(integer) = <tspan fill="#16a34a" font-weight="bold">2</tspan></text>
  <text x="448" y="376" font-size="13" fill="#1e293b">tab-<tspan fill="#0ea5e9" font-weight="bold">4</tspan>  →  --value(integer) = <tspan fill="#16a34a" font-weight="bold">4</tspan></text>
  <text x="448" y="398" font-size="13" fill="#1e293b">tab-<tspan fill="#0ea5e9" font-weight="bold">[13]</tspan> →  --value([integer]) = <tspan fill="#16a34a" font-weight="bold">13</tspan></text>

  <text x="400" y="454" text-anchor="middle" font-size="13" fill="#64748b">Statik = bitta klass · Funksional (* bilan) = bir oilaning cheksiz klasslari</text>
</svg>
