<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" font-family="Segoe UI, system-ui, sans-serif">
  <title>Plaginni o'rnatish va ulash oqimi: npm i -D bilan o'rnatish, app.css ichida @plugin bilan ulash, keyin prose klasslari tayyor; yon eslatma v3 plugins:[] config vs v4 @plugin CSS</title>
  <rect x="0" y="0" width="780" height="430" fill="#f8fafc"/>

  <text x="390" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">Plaginni ulash — ikki qadam (v4)</text>
  <text x="390" y="62" text-anchor="middle" font-size="14" fill="#475569">o'rnatish (npm) → ulash (CSS) → klasslar tayyor</text>

  <!-- 1. npm install -->
  <rect x="30" y="96" width="220" height="92" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="140" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#0284c7">1. O'RNATISH</text>
  <rect x="46" y="118" width="188" height="54" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="58" y="142" font-size="13" fill="#475569">$ npm i -D</text>
  <text x="58" y="162" font-size="13" fill="#1e293b">@tailwindcss/typography</text>

  <!-- strelka -->
  <line x1="250" y1="142" x2="290" y2="142" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="290,142 278,136 278,148" fill="#94a3b8"/>

  <!-- 2. @plugin CSS -->
  <rect x="290" y="96" width="240" height="92" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="410" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#4f46e5">2. ULASH (app.css)</text>
  <text x="306" y="126" font-size="13" fill="#475569">@import "tailwindcss";</text>
  <text x="306" y="152" font-size="14" font-weight="bold" fill="#4f46e5">@plugin</text>
  <text x="368" y="152" font-size="14" fill="#1e293b">"@tailwindcss/</text>
  <text x="306" y="172" font-size="14" fill="#1e293b">typography";</text>

  <!-- strelka -->
  <line x1="530" y1="142" x2="570" y2="142" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="570,142 558,136 558,148" fill="#94a3b8"/>

  <!-- 3. klasslar tayyor -->
  <rect x="570" y="96" width="180" height="92" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="660" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#16a34a">3. TAYYOR</text>
  <rect x="586" y="118" width="148" height="54" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="600" y="142" font-size="14" fill="#1e293b">class="prose"</text>
  <text x="600" y="162" font-size="13" fill="#16a34a">ishlaydi ✓</text>

  <!-- yon eslatma: v3 vs v4 -->
  <text x="390" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Plagin qayerda ulanadi? — bu yerda v3 va v4 farq qiladi</text>

  <!-- v3 noto'g'ri -->
  <rect x="60" y="252" width="310" height="138" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="78" y="278" font-size="14" font-weight="bold" fill="#ef4444">v3 (eski) — JS config</text>
  <rect x="78" y="292" width="274" height="84" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="92" y="314" font-size="13" fill="#475569">// tailwind.config.js</text>
  <text x="92" y="334" font-size="13" fill="#1e293b">plugins: [</text>
  <text x="106" y="354" font-size="13" fill="#1e293b">require("@tailwindcss/...")</text>
  <text x="92" y="372" font-size="13" fill="#1e293b">]</text>

  <!-- v4 to'g'ri -->
  <rect x="410" y="252" width="310" height="138" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="428" y="278" font-size="14" font-weight="bold" fill="#16a34a">v4 (bu kitob) — CSS</text>
  <rect x="428" y="292" width="274" height="84" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="442" y="314" font-size="13" fill="#475569">/* app.css */</text>
  <text x="442" y="336" font-size="13" fill="#1e293b">@import "tailwindcss";</text>
  <text x="442" y="360" font-size="14" font-weight="bold" fill="#4f46e5">@plugin "...";</text>

  <text x="390" y="414" text-anchor="middle" font-size="13" fill="#64748b">v4 da JS config yo'q — plagin CSS ichida @plugin bilan ulanadi</text>
</svg>
