<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380" font-family="Segoe UI, system-ui, sans-serif">
  <title>Bitta tugma besh holatda: normal, hover (to'qroq fon), active (bosilgan), focus-visible (ring halqasi) va disabled (xira) — holat matritsasi va har biri uchun variant nomi</title>
  <rect x="0" y="0" width="780" height="380" fill="#f8fafc"/>

  <text x="390" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Bitta tugma — besh holat</text>
  <text x="390" y="62" text-anchor="middle" font-size="14" fill="#475569">Har bir holatni alohida variant boshqaradi</text>

  <!-- 1. normal -->
  <text x="143" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">normal (asos)</text>
  <rect x="80" y="120" width="126" height="48" rx="10" fill="#6366f1"/>
  <text x="143" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Saqlash</text>
  <text x="143" y="190" text-anchor="middle" font-size="13" fill="#64748b">bg-indigo-500</text>

  <!-- 2. hover -->
  <text x="305" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#f59e0b">hover: (to'qroq)</text>
  <rect x="242" y="120" width="126" height="48" rx="10" fill="#4f46e5"/>
  <text x="305" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Saqlash</text>
  <text x="305" y="190" text-anchor="middle" font-size="13" fill="#64748b">hover:bg-indigo-700</text>

  <!-- 3. active (pressed) - slightly shifted down + darker -->
  <text x="467" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">active: (bosilgan)</text>
  <rect x="404" y="124" width="126" height="48" rx="10" fill="#4338ca"/>
  <text x="467" y="154" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Saqlash</text>
  <text x="467" y="190" text-anchor="middle" font-size="13" fill="#64748b">active:scale-95</text>

  <!-- 4. focus-visible (ring) -->
  <text x="629" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#0ea5e9">focus-visible:</text>
  <rect x="562" y="116" width="134" height="56" rx="13" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <rect x="566" y="120" width="126" height="48" rx="10" fill="#6366f1"/>
  <text x="629" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Saqlash</text>
  <text x="629" y="190" text-anchor="middle" font-size="13" fill="#64748b">focus-visible:ring-2</text>

  <!-- 5. disabled (faded) - centered below -->
  <text x="390" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#94a3b8">disabled: (xira, o'chiq)</text>
  <rect x="327" y="262" width="126" height="48" rx="10" fill="#6366f1" opacity="0.5"/>
  <text x="390" y="292" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff" opacity="0.85">Saqlash</text>
  <text x="390" y="332" text-anchor="middle" font-size="13" fill="#64748b">disabled:opacity-50 disabled:cursor-not-allowed</text>

  <!-- divider -->
  <line x1="80" y1="210" x2="700" y2="210" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- summary -->
  <rect x="120" y="350" width="540" height="24" rx="6" fill="#f8fafc"/>
  <text x="390" y="367" text-anchor="middle" font-size="13" fill="#4f46e5">Bitta HTML element · holatlar variant prefiksi bilan, JavaScript'siz</text>
</svg>
