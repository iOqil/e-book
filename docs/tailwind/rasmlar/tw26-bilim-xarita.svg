<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" width="820" height="540" font-family="Segoe UI, system-ui, sans-serif">
  <title>Egallangan bilim xaritasi: markazda "Tailwind v4 ekspert" hubi, undan kitobning ustunlariga tarmoqlar — utility-first, layout (flex/grid), responsive va container queries, ranglar va tipografiya, holatlar va dark mode, @theme dizayn tizimi, custom utility va variant, komponentlar, production — o'quvchi endi nimani bilishining bayrami</title>
  <rect x="0" y="0" width="820" height="540" fill="#f8fafc"/>

  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">Endi siz bularning hammasini bilasiz</text>
  <text x="410" y="58" text-anchor="middle" font-size="14" fill="#475569">Markazda — siz; atrofda — egallagan ustunlaringiz</text>

  <!-- Tarmoqlar (markaz 410,290 -> har bir tugun) -->
  <line x1="410" y1="290" x2="160" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <line x1="410" y1="290" x2="410" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <line x1="410" y1="290" x2="660" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <line x1="410" y1="290" x2="120" y2="290" stroke="#94a3b8" stroke-width="2"/>
  <line x1="410" y1="290" x2="700" y2="290" stroke="#94a3b8" stroke-width="2"/>
  <line x1="410" y1="290" x2="160" y2="450" stroke="#94a3b8" stroke-width="2"/>
  <line x1="410" y1="290" x2="410" y2="460" stroke="#94a3b8" stroke-width="2"/>
  <line x1="410" y1="290" x2="660" y2="450" stroke="#94a3b8" stroke-width="2"/>

  <!-- Markaziy hub -->
  <circle cx="410" cy="290" r="74" fill="#4f46e5"/>
  <text x="410" y="284" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Tailwind v4</text>
  <text x="410" y="306" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">ekspert</text>

  <!-- Tugun: yuqori-chap -->
  <rect x="60" y="104" width="200" height="52" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="160" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Utility-first falsafa</text>
  <text x="160" y="146" text-anchor="middle" font-size="13" fill="#475569">01 &#8211; 03-bob</text>

  <!-- Tugun: yuqori-o'rta -->
  <rect x="310" y="94" width="200" height="52" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="410" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Layout: flex / grid</text>
  <text x="410" y="136" text-anchor="middle" font-size="13" fill="#475569">04 &#8211; 08-bob</text>

  <!-- Tugun: yuqori-o'ng -->
  <rect x="560" y="104" width="200" height="52" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="660" y="123" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Responsive +</text>
  <text x="660" y="140" text-anchor="middle" font-size="13" fill="#475569">@container · 09 &#8211; 10</text>

  <!-- Tugun: chap -->
  <rect x="20" y="264" width="200" height="52" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="120" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Ranglar · tipografiya</text>
  <text x="120" y="306" text-anchor="middle" font-size="13" fill="#475569">11 &#8211; 14-bob</text>

  <!-- Tugun: o'ng -->
  <rect x="600" y="264" width="200" height="52" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="700" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Holatlar · dark mode</text>
  <text x="700" y="306" text-anchor="middle" font-size="13" fill="#475569">15 &#8211; 17-bob</text>

  <!-- Tugun: past-chap -->
  <rect x="60" y="424" width="200" height="52" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="160" y="448" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">@theme dizayn-tizim</text>
  <text x="160" y="466" text-anchor="middle" font-size="13" fill="#475569">18-bob</text>

  <!-- Tugun: past-o'rta -->
  <rect x="310" y="434" width="200" height="52" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="410" y="453" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Custom utility / variant</text>
  <text x="410" y="471" text-anchor="middle" font-size="13" fill="#475569">19 &#8211; 21-bob</text>

  <!-- Tugun: past-o'ng -->
  <rect x="560" y="424" width="200" height="52" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="660" y="448" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Komponent · production</text>
  <text x="660" y="466" text-anchor="middle" font-size="13" fill="#475569">22 &#8211; 25-bob</text>

  <text x="410" y="520" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">Tabriklaymiz &#8212; 26 bob, bir butun mahorat</text>
</svg>
