<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>Gradient yo'nalishlari: bg-linear-to-r, bg-linear-to-br, bg-linear-45, bg-radial va bg-conic — har biri yo'nalish strelkasi bilan</title>
  <rect x="0" y="0" width="780" height="440" fill="#f8fafc"/>

  <defs>
    <linearGradient id="g-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="g-br" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="g-45" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="g-rad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="60%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </radialGradient>
    <linearGradient id="g-con" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="33%" stop-color="#a855f7"/>
      <stop offset="66%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="390" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Gradient yo'nalishlari (v4)</text>
  <text x="390" y="66" text-anchor="middle" font-size="14" fill="#475569">Strelka — rang qaysi tomonga "oqishini" ko'rsatadi. from → via → to</text>

  <!-- Swatch 1: to-r -->
  <rect x="40" y="100" width="200" height="120" rx="10" fill="url(#g-r)"/>
  <line x1="70" y1="160" x2="210" y2="160" stroke="#ffffff" stroke-width="3" marker-end="url(#arr)"/>
  <text x="140" y="248" text-anchor="middle" font-size="15" font-weight="bold" fill="#4f46e5">bg-linear-to-r</text>
  <text x="140" y="270" text-anchor="middle" font-size="13" fill="#64748b">chapdan o'ngga</text>

  <!-- Swatch 2: to-br -->
  <rect x="290" y="100" width="200" height="120" rx="10" fill="url(#g-br)"/>
  <line x1="320" y1="120" x2="460" y2="200" stroke="#ffffff" stroke-width="3" marker-end="url(#arr)"/>
  <text x="390" y="248" text-anchor="middle" font-size="15" font-weight="bold" fill="#4f46e5">bg-linear-to-br</text>
  <text x="390" y="270" text-anchor="middle" font-size="13" fill="#64748b">yuqori-chapdan past-o'ngga</text>

  <!-- Swatch 3: linear-45 -->
  <rect x="540" y="100" width="200" height="120" rx="10" fill="url(#g-45)"/>
  <line x1="570" y1="200" x2="710" y2="120" stroke="#ffffff" stroke-width="3" marker-end="url(#arr)"/>
  <text x="640" y="248" text-anchor="middle" font-size="15" font-weight="bold" fill="#4f46e5">bg-linear-45</text>
  <text x="640" y="270" text-anchor="middle" font-size="13" fill="#64748b">45 daraja burchak</text>

  <!-- Swatch 4: radial -->
  <rect x="165" y="300" width="200" height="100" rx="10" fill="url(#g-rad)"/>
  <circle cx="265" cy="350" r="6" fill="#ffffff"/>
  <text x="265" y="424" text-anchor="middle" font-size="15" font-weight="bold" fill="#4f46e5">bg-radial</text>

  <!-- Swatch 5: conic -->
  <rect x="415" y="300" width="200" height="100" rx="10" fill="url(#g-con)"/>
  <path d="M515 350 L515 318 A32 32 0 0 1 543 366 Z" fill="#ffffff" fill-opacity="0.55"/>
  <text x="515" y="424" text-anchor="middle" font-size="15" font-weight="bold" fill="#4f46e5">bg-conic</text>

  <text x="390" y="300" text-anchor="middle" font-size="13" fill="#64748b">radial — markazdan tashqariga · conic — markaz atrofida aylanib</text>
</svg>
