<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Media query viewport (butun brauzer oynasi) eniga, container query esa ota-element enига reaksiya qiladi — bir xil karta ikki xil signalga moslashadi</title>
  <rect x="0" y="0" width="780" height="470" fill="#f8fafc"/>

  <text x="390" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">Nimaning eniga qaraladi?</text>

  <!-- ===== Yuqori: media query = viewport ===== -->
  <text x="390" y="64" text-anchor="middle" font-size="15" font-weight="bold" fill="#4f46e5">Media query  →  VIEWPORT (butun oyna)</text>

  <!-- brauzer oynasi ramkasi -->
  <rect x="60" y="78" width="660" height="120" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <!-- viewport o'lcham o'qi (chap-o'ng chetlarda) -->
  <line x1="68" y1="138" x2="160" y2="138" stroke="#6366f1" stroke-width="2"/>
  <polygon points="68,138 80,132 80,144" fill="#6366f1"/>
  <line x1="620" y1="138" x2="712" y2="138" stroke="#6366f1" stroke-width="2"/>
  <polygon points="712,138 700,132 700,144" fill="#6366f1"/>
  <text x="390" y="100" text-anchor="middle" font-size="13" fill="#64748b">brauzer oynasi eni  —  @media (min-width: 768px)</text>

  <!-- ichidagi karta -->
  <rect x="300" y="116" width="180" height="62" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="390" y="152" text-anchor="middle" font-size="14" fill="#4f46e5">karta</text>
  <text x="390" y="190" text-anchor="middle" font-size="13" fill="#475569">Karta ekran enidan signal oladi — joylashuvi muhim emas</text>

  <!-- ajratuvchi -->
  <line x1="60" y1="222" x2="720" y2="222" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 5"/>

  <!-- ===== Past: container query = ota-element ===== -->
  <text x="390" y="252" text-anchor="middle" font-size="15" font-weight="bold" fill="#0284c7">Container query  →  OTA-ELEMENT eni</text>

  <!-- ayni brauzer oynasi (o'zgarmadi) -->
  <rect x="60" y="266" width="660" height="160" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="390" y="288" text-anchor="middle" font-size="13" fill="#64748b">oyna eni o'zgarmadi, lekin ichidagi konteyner kichik</text>

  <!-- ota-konteyner (@container) -->
  <rect x="250" y="300" width="280" height="108" rx="9" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="390" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#0284c7">@container (ota-element)</text>
  <!-- konteyner o'lcham o'qi -->
  <line x1="258" y1="356" x2="330" y2="356" stroke="#0ea5e9" stroke-width="2"/>
  <polygon points="258,356 270,350 270,362" fill="#0ea5e9"/>
  <line x1="450" y1="356" x2="522" y2="356" stroke="#0ea5e9" stroke-width="2"/>
  <polygon points="522,356 510,350 510,362" fill="#0ea5e9"/>

  <!-- ichidagi karta -->
  <rect x="318" y="336" width="144" height="58" rx="8" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="390" y="370" text-anchor="middle" font-size="14" fill="#0284c7">karta</text>

  <text x="390" y="448" text-anchor="middle" font-size="13" fill="#475569">Karta o'zini o'rab turgan konteyner enidan signal oladi — oyna emas</text>
</svg>
