<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" font-family="Segoe UI, system-ui, sans-serif">
  <title>Bitta rang oilasi (blue) 50 dan 950 gacha 11 ta soya: raqam = yorug'lik darajasi; 50-200 fon, 500 asosiy, 600-700 matn/tugma, 800-950 to'q</title>
  <rect x="0" y="0" width="800" height="430" fill="#f8fafc"/>

  <text x="400" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">Soya shkalasi: bitta oila (blue), 50 → 950</text>
  <text x="400" y="62" text-anchor="middle" font-size="14" fill="#475569">Raqam = yorug'lik bosqichi. Kichik = ochroq, katta = to'qroq.</text>

  <!-- 11 swatch: x from 40, width 64, gap 4 => step 68 -->
  <!-- 50 -->
  <rect x="40" y="90" width="64" height="120" rx="6" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="72" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">50</text>
  <!-- 100 -->
  <rect x="108" y="90" width="64" height="120" rx="6" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1"/>
  <text x="140" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">100</text>
  <!-- 200 -->
  <rect x="176" y="90" width="64" height="120" rx="6" fill="#bfdbfe" stroke="#cbd5e1" stroke-width="1"/>
  <text x="208" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">200</text>
  <!-- 300 -->
  <rect x="244" y="90" width="64" height="120" rx="6" fill="#93c5fd"/>
  <text x="276" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">300</text>
  <!-- 400 -->
  <rect x="312" y="90" width="64" height="120" rx="6" fill="#60a5fa"/>
  <text x="344" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">400</text>
  <!-- 500 base -->
  <rect x="380" y="84" width="64" height="132" rx="6" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/>
  <text x="412" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">500</text>
  <text x="412" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">asosiy</text>
  <!-- 600 -->
  <rect x="448" y="90" width="64" height="120" rx="6" fill="#2563eb"/>
  <text x="480" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">600</text>
  <!-- 700 -->
  <rect x="516" y="90" width="64" height="120" rx="6" fill="#1d4ed8"/>
  <text x="548" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">700</text>
  <!-- 800 -->
  <rect x="584" y="90" width="64" height="120" rx="6" fill="#1e40af"/>
  <text x="616" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">800</text>
  <!-- 900 -->
  <rect x="652" y="90" width="64" height="120" rx="6" fill="#1e3a8a"/>
  <text x="684" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">900</text>
  <!-- 950 -->
  <rect x="720" y="90" width="40" height="120" rx="6" fill="#172554"/>
  <text x="740" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">950</text>

  <!-- zone brackets -->
  <!-- 50-200: fon -->
  <line x1="40" y1="252" x2="240" y2="252" stroke="#0ea5e9" stroke-width="2.5"/>
  <text x="140" y="274" text-anchor="middle" font-size="14" font-weight="bold" fill="#0284c7">50–200: fon / yengil tus</text>
  <!-- 500 asosiy -->
  <line x1="312" y1="252" x2="444" y2="252" stroke="#16a34a" stroke-width="2.5"/>
  <text x="378" y="274" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">400–500: asosiy</text>
  <!-- 600-700 -->
  <line x1="448" y1="288" x2="580" y2="288" stroke="#6366f1" stroke-width="2.5"/>
  <text x="514" y="310" text-anchor="middle" font-size="14" font-weight="bold" fill="#4f46e5">600–700: matn / tugma</text>
  <!-- 800-950 -->
  <line x1="584" y1="288" x2="760" y2="288" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="672" y="310" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">800–950: to'q / dark-mode sirt</text>

  <!-- pairing example -->
  <rect x="40" y="332" width="720" height="74" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="60" y="360" font-size="14" font-weight="bold" fill="#1e293b">Juftlash naqshi:</text>
  <rect x="60" y="372" width="240" height="24" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="180" y="389" text-anchor="middle" font-size="14" fill="#1d4ed8">bg-blue-50 + text-blue-700</text>
  <text x="320" y="389" font-size="14" fill="#475569">ochiq fon + to'q matn = yetarli kontrast (o'qiladi)</text>
</svg>
