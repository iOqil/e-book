<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Modal anatomiyasi: qora yarim shaffof backdrop qatlami (fixed inset-0 bg-black/50) va markazlashtirilgan oq panel (sarlavha, matn, footer tugmalari) — joylashuv va qatlamlash klasslari bilan belgilangan</title>
  <rect x="0" y="0" width="780" height="470" fill="#f8fafc"/>

  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Modal (dialog) anatomiyasi</text>
  <text x="390" y="57" text-anchor="middle" font-size="14" fill="#475569">Ikki qatlam: backdrop (orqa fon) ustida markazlangan panel</text>

  <!-- backdrop layer (dark) -->
  <rect x="60" y="78" width="430" height="350" rx="10" fill="#1e293b" opacity="0.55"/>
  <text x="78" y="104" font-size="13" font-weight="bold" fill="#ffffff">backdrop qatlami</text>

  <!-- centered panel -->
  <rect x="135" y="150" width="280" height="206" rx="14" fill="#ffffff"/>
  <!-- panel header -->
  <text x="160" y="190" font-size="16" font-weight="bold" fill="#1e293b">Hisobni o'chirish?</text>
  <line x1="160" y1="204" x2="390" y2="204" stroke="#94a3b8" stroke-width="1"/>
  <!-- panel body -->
  <text x="160" y="232" font-size="13" fill="#475569">Bu amal qaytarib bo'lmaydi. Barcha</text>
  <text x="160" y="252" font-size="13" fill="#475569">ma'lumotlaringiz o'chiriladi.</text>
  <!-- panel footer buttons -->
  <rect x="160" y="296" width="92" height="40" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="206" y="321" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Bekor</text>
  <rect x="298" y="296" width="92" height="40" rx="9" fill="#ef4444"/>
  <text x="344" y="321" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">O'chirish</text>

  <!-- divider to callouts -->
  <line x1="520" y1="90" x2="520" y2="410" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- callout 1 backdrop -->
  <circle cx="550" cy="120" r="13" fill="#1e293b"/>
  <text x="550" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">1</text>
  <text x="574" y="117" font-size="14" font-weight="bold" fill="#1e293b">Backdrop</text>
  <text x="574" y="136" font-size="13" fill="#64748b">fixed inset-0</text>
  <text x="574" y="154" font-size="13" fill="#64748b">bg-black/50</text>

  <!-- callout 2 centering -->
  <circle cx="550" cy="190" r="13" fill="#6366f1"/>
  <text x="550" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">2</text>
  <text x="574" y="187" font-size="14" font-weight="bold" fill="#1e293b">Markazlash</text>
  <text x="574" y="206" font-size="13" fill="#64748b">grid place-items-center</text>

  <!-- callout 3 panel -->
  <circle cx="550" cy="242" r="13" fill="#6366f1"/>
  <text x="550" y="247" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">3</text>
  <text x="574" y="239" font-size="14" font-weight="bold" fill="#1e293b">Panel</text>
  <text x="574" y="258" font-size="13" fill="#64748b">rounded-2xl bg-white p-6</text>
  <text x="574" y="276" font-size="13" fill="#64748b">shadow-xl</text>

  <!-- callout 4 footer -->
  <circle cx="550" cy="312" r="13" fill="#6366f1"/>
  <text x="550" y="317" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">4</text>
  <text x="574" y="309" font-size="14" font-weight="bold" fill="#1e293b">Footer</text>
  <text x="574" y="328" font-size="13" fill="#64748b">flex justify-end gap-3</text>

  <!-- callout 5 a11y -->
  <circle cx="550" cy="364" r="13" fill="#16a34a"/>
  <text x="550" y="369" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">5</text>
  <text x="574" y="361" font-size="14" font-weight="bold" fill="#1e293b">A11y</text>
  <text x="574" y="380" font-size="13" fill="#16a34a">role="dialog" aria-modal</text>

  <!-- footer note -->
  <rect x="60" y="430" width="660" height="30" rx="8" fill="#eef2ff"/>
  <text x="390" y="450" text-anchor="middle" font-size="13" fill="#4f46e5">Native &#60;dialog&#62; bilan: backdrop avtomatik &#8212; backdrop:bg-black/50 + fokus tuzog'i tekin</text>
</svg>
