<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>leading va tracking taqqoslash: leading-tight vs leading-relaxed, tracking-tight vs tracking-widest</title>
  <rect x="0" y="0" width="800" height="470" fill="#f8fafc"/>

  <text x="30" y="40" font-size="22" fill="#1e293b" font-weight="bold">leading (qatorlararo) va tracking (harflararo)</text>
  <text x="30" y="66" font-size="15" fill="#475569">Bir xil matn — turli bo'shliq. O'qishni shu ikki sozlama hal qiladi</text>

  <line x1="400" y1="90" x2="400" y2="450" stroke="#94a3b8" stroke-dasharray="4 4"/>

  <!-- LEFT: leading -->
  <text x="30" y="116" font-size="16" fill="#4f46e5" font-weight="bold">leading — qatorlararo masofa</text>

  <!-- tight box -->
  <rect x="30" y="132" width="340" height="120" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="46" y="156" font-size="14" fill="#64748b" font-weight="bold">leading-tight (siqiq)</text>
  <text x="46" y="180" font-size="15" fill="#1e293b">Bu matn qatorlari bir-biriga</text>
  <text x="46" y="198" font-size="15" fill="#1e293b">juda yaqin joylashgan. Uzun</text>
  <text x="46" y="216" font-size="15" fill="#1e293b">paragrafda ko'z toliqadi va</text>
  <text x="46" y="234" font-size="15" fill="#1e293b">o'qish qiyinlashadi.</text>

  <!-- relaxed box -->
  <rect x="30" y="266" width="340" height="170" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="46" y="290" font-size="14" fill="#16a34a" font-weight="bold">leading-relaxed (havoli)</text>
  <text x="46" y="318" font-size="15" fill="#1e293b">Bu matn qatorlari orasida</text>
  <text x="46" y="346" font-size="15" fill="#1e293b">bemalol bo'shliq bor. Ko'z</text>
  <text x="46" y="374" font-size="15" fill="#1e293b">keyingi qatorni oson topadi</text>
  <text x="46" y="402" font-size="15" fill="#1e293b">va o'qish yengillashadi.</text>

  <!-- RIGHT: tracking -->
  <text x="424" y="116" font-size="16" fill="#4f46e5" font-weight="bold">tracking — harflararo masofa</text>

  <!-- tracking-tight heading -->
  <rect x="424" y="132" width="346" height="120" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="440" y="156" font-size="14" fill="#64748b" font-weight="bold">tracking-tight — katta sarlavhaga</text>
  <text x="440" y="206" font-size="34" fill="#1e293b" font-weight="bold" letter-spacing="-1.5">Sarlavha</text>
  <text x="440" y="234" font-size="13" fill="#64748b">Yirik shriftda harflar zich — chiroyli</text>

  <!-- tracking-widest label -->
  <rect x="424" y="266" width="346" height="170" rx="8" fill="#ffffff" stroke="#0ea5e9"/>
  <text x="440" y="290" font-size="14" fill="#0ea5e9" font-weight="bold">tracking-widest — mayda yorliqqa</text>
  <text x="440" y="346" font-size="15" fill="#1e293b" font-weight="bold" letter-spacing="4">YANGILIKLAR</text>
  <text x="440" y="378" font-size="15" fill="#1e293b" font-weight="bold" letter-spacing="4">KATEGORIYA</text>
  <text x="440" y="416" font-size="13" fill="#64748b">Mayda BOSH HARF yorliqda harflar</text>
  <text x="440" y="432" font-size="13" fill="#64748b">keng — toza va o'qiladigan</text>
</svg>
