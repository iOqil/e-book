<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Segoe UI, system-ui, sans-serif">
  <title>Tailwind klass nomining anatomiyasi: variant:variant:utility va mt-4 -> margin-top:1rem</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>

  <text x="380" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Tailwind klass nomining anatomiyasi</text>

  <!-- Top example: md:hover:bg-indigo-600 -->
  <text x="380" y="78" text-anchor="middle" font-size="15" fill="#475569">Variant'lar zanjir bo'lib chap tomonga qo'shiladi, utility oxirda turadi</text>

  <!-- segment boxes -->
  <!-- md: -->
  <rect x="120" y="100" width="120" height="52" rx="8" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="180" y="133" text-anchor="middle" font-size="22" font-weight="bold" fill="#0ea5e9">md:</text>

  <!-- hover: -->
  <rect x="250" y="100" width="150" height="52" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="325" y="133" text-anchor="middle" font-size="22" font-weight="bold" fill="#f59e0b">hover:</text>

  <!-- bg-indigo-600 -->
  <rect x="410" y="100" width="240" height="52" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="530" y="133" text-anchor="middle" font-size="22" font-weight="bold" fill="#4f46e5">bg-indigo-600</text>

  <!-- arrows down -->
  <line x1="180" y1="152" x2="180" y2="186" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="180,194 175,184 185,184" fill="#94a3b8"/>
  <line x1="325" y1="152" x2="325" y2="186" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="325,194 320,184 330,184" fill="#94a3b8"/>
  <line x1="530" y1="152" x2="530" y2="186" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="530,194 525,184 535,184" fill="#94a3b8"/>

  <!-- labels -->
  <rect x="100" y="198" width="160" height="64" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="180" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#0ea5e9">variant</text>
  <text x="180" y="244" text-anchor="middle" font-size="14" fill="#475569">breakpoint</text>
  <text x="180" y="259" text-anchor="middle" font-size="13" fill="#64748b">(md va kattaroq)</text>

  <rect x="270" y="198" width="125" height="64" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="332" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#f59e0b">variant</text>
  <text x="332" y="244" text-anchor="middle" font-size="14" fill="#475569">holat</text>
  <text x="332" y="259" text-anchor="middle" font-size="13" fill="#64748b">(sichqoncha)</text>

  <rect x="408" y="198" width="244" height="64" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="530" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#4f46e5">utility = property + value</text>
  <text x="530" y="244" text-anchor="middle" font-size="14" fill="#475569">background-color: indigo-600</text>
  <text x="530" y="259" text-anchor="middle" font-size="13" fill="#64748b">"qachon" emas, "nima"</text>

  <!-- meaning line -->
  <text x="380" y="296" text-anchor="middle" font-size="14" fill="#16a34a">Ma'nosi: "md ekranda, ustiga sichqoncha kelganda foni indigo-600 bo'lsin"</text>

  <!-- divider -->
  <line x1="120" y1="316" x2="640" y2="316" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- Bottom example: mt-4 -> margin-top:1rem -->
  <rect x="160" y="340" width="120" height="50" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="220" y="372" text-anchor="middle" font-size="22" font-weight="bold" fill="#4f46e5">mt-4</text>

  <line x1="288" y1="365" x2="360" y2="365" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="368,365 358,360 358,370" fill="#94a3b8"/>

  <rect x="376" y="340" width="224" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="488" y="364" text-anchor="middle" font-size="17" font-weight="bold" fill="#16a34a">margin-top: 1rem</text>
  <text x="488" y="382" text-anchor="middle" font-size="13" fill="#475569">4 x 0.25rem = 1rem (scale)</text>
</svg>
