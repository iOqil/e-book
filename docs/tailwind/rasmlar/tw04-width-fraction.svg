<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" width="780" height="480" font-family="Segoe UI, system-ui, sans-serif">
  <title>Tailwind kengliklar: w-1/2, w-1/3, w-full va max-w-md cheklangan kenglik</title>
  <rect x="0" y="0" width="780" height="480" fill="#f8fafc"/>

  <text x="30" y="40" font-size="22" fill="#1e293b" font-weight="bold">Kasrli va cheklangan kengliklar</text>
  <text x="30" y="66" font-size="15" fill="#475569">w-1/2 — ota-elementning 50% i; max-w-* — o'sishni cheklaydi</text>

  <!-- container reference line -->
  <text x="30" y="98" font-size="14" fill="#64748b">ota-element (100% = 700px)</text>

  <!-- row 1: w-1/2 + w-1/2 -->
  <rect x="30" y="108" width="700" height="50" rx="4" fill="none" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <rect x="34" y="112" width="342" height="42" rx="4" fill="#6366f1"/>
  <text x="205" y="139" font-size="15" fill="#ffffff" text-anchor="middle">w-1/2 (50%)</text>
  <rect x="384" y="112" width="342" height="42" rx="4" fill="#4f46e5"/>
  <text x="555" y="139" font-size="15" fill="#ffffff" text-anchor="middle">w-1/2 (50%)</text>

  <!-- row 2: w-1/3 x3 -->
  <rect x="30" y="174" width="700" height="50" rx="4" fill="none" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <rect x="34" y="178" width="226" height="42" rx="4" fill="#0ea5e9"/>
  <text x="147" y="205" font-size="15" fill="#ffffff" text-anchor="middle">w-1/3</text>
  <rect x="266" y="178" width="226" height="42" rx="4" fill="#38bdf8"/>
  <text x="379" y="205" font-size="15" fill="#1e293b" text-anchor="middle">w-1/3</text>
  <rect x="498" y="178" width="228" height="42" rx="4" fill="#0ea5e9"/>
  <text x="612" y="205" font-size="15" fill="#ffffff" text-anchor="middle">w-1/3</text>

  <!-- row 3: w-2/3 + w-1/3 -->
  <rect x="30" y="240" width="700" height="50" rx="4" fill="none" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <rect x="34" y="244" width="458" height="42" rx="4" fill="#6366f1"/>
  <text x="263" y="271" font-size="15" fill="#ffffff" text-anchor="middle">w-2/3 (66.6%)</text>
  <rect x="498" y="244" width="228" height="42" rx="4" fill="#38bdf8"/>
  <text x="612" y="271" font-size="15" fill="#1e293b" text-anchor="middle">w-1/3</text>

  <!-- row 4: w-full -->
  <rect x="30" y="306" width="700" height="50" rx="4" fill="none" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <rect x="34" y="310" width="692" height="42" rx="4" fill="#16a34a"/>
  <text x="380" y="337" font-size="15" fill="#ffffff" text-anchor="middle">w-full (100%)</text>

  <!-- row 5: max-w-md constrained -->
  <rect x="30" y="372" width="700" height="60" rx="4" fill="none" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <rect x="34" y="380" width="316" height="44" rx="4" fill="#f59e0b"/>
  <text x="192" y="407" font-size="15" fill="#1e293b" text-anchor="middle">max-w-md (28rem)</text>
  <text x="360" y="408" font-size="22" fill="#ef4444">&#8612;</text>
  <text x="390" y="403" font-size="14" fill="#475569">w-full bo'lsa ham bu yerda to'xtaydi —</text>
  <text x="390" y="423" font-size="14" fill="#475569">keng ekranda matn juda cho'zilmaydi (o'qish qulay)</text>

  <text x="30" y="462" font-size="14" fill="#64748b">w-fit — mazmunga teng · w-min — eng tor · w-max — eng keng · h-screen — ekran balandligi</text>
</svg>
