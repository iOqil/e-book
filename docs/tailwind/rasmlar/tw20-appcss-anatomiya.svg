<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" width="780" height="560" font-family="Segoe UI, system-ui, sans-serif">
  <title>Kanonik app.css anatomiyasi: yuqoridan pastga @import "tailwindcss", @theme, @custom-variant dark, @layer base, @utility, va @layer components ichidagi @apply komponenti — tartib bilan izohlangan</title>
  <rect x="0" y="0" width="780" height="560" fill="#f8fafc"/>

  <text x="390" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">app.css anatomiyasi — kanonik tartib</text>
  <text x="390" y="60" text-anchor="middle" font-size="14" fill="#475569">Bitta fayl, yuqoridan pastga: import → tema → variant → base → utility → komponent</text>

  <!-- vertical spine numbers + arrows -->
  <line x1="55" y1="98" x2="55" y2="510" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- block 1: import -->
  <circle cx="55" cy="116" r="13" fill="#0ea5e9"/>
  <text x="55" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">1</text>
  <rect x="90" y="92" width="430" height="48" rx="8" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="106" y="122" font-size="15" font-weight="bold" fill="#0284c7">@import "tailwindcss";</text>
  <text x="534" y="113" font-size="13" font-weight="bold" fill="#64748b">SETUP</text>
  <text x="534" y="130" font-size="13" fill="#94a3b8">avval keladi</text>

  <!-- block 2: theme -->
  <circle cx="55" cy="180" r="13" fill="#6366f1"/>
  <text x="55" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">2</text>
  <rect x="90" y="152" width="430" height="64" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="106" y="176" font-size="14" font-weight="bold" fill="#4f46e5">@theme &#123;</text>
  <text x="122" y="196" font-size="13" fill="#1e293b">--color-primary: oklch(0.55 0.2 265);</text>
  <text x="106" y="210" font-size="14" font-weight="bold" fill="#4f46e5">&#125;</text>
  <text x="534" y="178" font-size="13" font-weight="bold" fill="#64748b">TOKENLAR</text>
  <text x="534" y="195" font-size="13" fill="#94a3b8">dizayn tizimi</text>

  <!-- block 3: custom-variant -->
  <circle cx="55" cy="248" r="13" fill="#6366f1"/>
  <text x="55" y="253" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">3</text>
  <rect x="90" y="228" width="430" height="40" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="106" y="253" font-size="14" font-weight="bold" fill="#4f46e5">@custom-variant dark (&amp;:where(.dark *));</text>
  <text x="534" y="244" font-size="13" font-weight="bold" fill="#64748b">VARIANT</text>
  <text x="534" y="261" font-size="13" fill="#94a3b8">dark rejimi</text>

  <!-- block 4: layer base -->
  <circle cx="55" cy="312" r="13" fill="#16a34a"/>
  <text x="55" y="317" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">4</text>
  <rect x="90" y="280" width="430" height="64" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="106" y="304" font-size="14" font-weight="bold" fill="#16a34a">@layer base &#123;</text>
  <text x="122" y="324" font-size="13" fill="#1e293b">h1 &#123; @apply text-2xl font-bold; &#125;</text>
  <text x="106" y="338" font-size="14" font-weight="bold" fill="#16a34a">&#125;</text>
  <text x="534" y="306" font-size="13" font-weight="bold" fill="#64748b">BASE</text>
  <text x="534" y="323" font-size="13" fill="#94a3b8">global resetlar</text>

  <!-- block 5: utility -->
  <circle cx="55" cy="384" r="13" fill="#6366f1"/>
  <text x="55" y="389" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">5</text>
  <rect x="90" y="356" width="430" height="56" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="106" y="380" font-size="14" font-weight="bold" fill="#4f46e5">@utility tab-4 &#123;</text>
  <text x="122" y="400" font-size="13" fill="#1e293b">tab-size: 4;  &#125;</text>
  <text x="534" y="382" font-size="13" font-weight="bold" fill="#64748b">KENGAYTIRISH</text>
  <text x="534" y="399" font-size="13" fill="#94a3b8">yangi utility</text>

  <!-- block 6: layer components @apply -->
  <circle cx="55" cy="460" r="13" fill="#16a34a"/>
  <text x="55" y="465" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">6</text>
  <rect x="90" y="424" width="430" height="72" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="106" y="448" font-size="14" font-weight="bold" fill="#16a34a">@layer components &#123;</text>
  <text x="122" y="468" font-size="13" fill="#1e293b">.btn &#123; @apply rounded-lg px-4 py-2</text>
  <text x="138" y="486" font-size="13" fill="#1e293b">bg-primary text-white; &#125;</text>
  <text x="534" y="450" font-size="13" font-weight="bold" fill="#64748b">KOMPONENT</text>
  <text x="534" y="467" font-size="13" fill="#94a3b8">@apply, ehtiyot bilan</text>

  <rect x="90" y="514" width="600" height="34" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="390" y="536" text-anchor="middle" font-size="13" fill="#4f46e5">Tartib muhim: tokenlar utility'lardan oldin e'lon qilinishi, base esa components'dan oldin turishi kerak</text>
</svg>
