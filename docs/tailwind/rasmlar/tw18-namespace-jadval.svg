<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" width="780" height="520" font-family="Segoe UI, system-ui, sans-serif">
  <title>Token namespace'lari va ular kuchaytiradigan utility oilalari xaritasi: --color-* ranglarni, --spacing masofalarni, --font-* shriftni, --breakpoint-* responsive variantlarni, --radius-* burchaklarni, --shadow-* soyani, --animate-* animatsiyani beradi</title>
  <rect x="0" y="0" width="780" height="520" fill="#f8fafc"/>

  <text x="390" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">Namespace → utility xaritasi</text>
  <text x="390" y="60" text-anchor="middle" font-size="14" fill="#475569">Token nomining boshidagi namespace qaysi utility oilasi yaratilishini belgilaydi</text>

  <!-- ustun sarlavhalari -->
  <text x="200" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#4f46e5">TOKEN NAMESPACE</text>
  <text x="575" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#0284c7">HOSIL BO'LADIGAN UTILITY'LAR</text>

  <!-- qatorlar -->
  <!-- row 1: color -->
  <rect x="40" y="104" width="320" height="48" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="58" y="133" font-size="15" font-weight="bold" fill="#1e293b">--color-*</text>
  <line x1="360" y1="128" x2="400" y2="128" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="400,128 388,122 388,134" fill="#94a3b8"/>
  <rect x="400" y="104" width="340" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="416" y="133" font-size="14" fill="#0284c7">bg-* · text-* · border-* · ring-*</text>

  <!-- row 2: spacing -->
  <rect x="40" y="160" width="320" height="48" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="58" y="189" font-size="15" font-weight="bold" fill="#1e293b">--spacing</text>
  <line x1="360" y1="184" x2="400" y2="184" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="400,184 388,178 388,190" fill="#94a3b8"/>
  <rect x="400" y="160" width="340" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="416" y="189" font-size="14" fill="#0284c7">p-* · m-* · w-* · h-* · gap-*</text>

  <!-- row 3: font -->
  <rect x="40" y="216" width="320" height="48" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="58" y="245" font-size="15" font-weight="bold" fill="#1e293b">--font-*</text>
  <line x1="360" y1="240" x2="400" y2="240" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="400,240 388,234 388,246" fill="#94a3b8"/>
  <rect x="400" y="216" width="340" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="416" y="245" font-size="14" fill="#0284c7">font-* (shrift oilasi)</text>

  <!-- row 4: breakpoint -->
  <rect x="40" y="272" width="320" height="48" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="58" y="301" font-size="15" font-weight="bold" fill="#1e293b">--breakpoint-*</text>
  <line x1="360" y1="296" x2="400" y2="296" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="400,296 388,290 388,302" fill="#94a3b8"/>
  <rect x="400" y="272" width="340" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="416" y="301" font-size="14" fill="#0284c7">sm: · md: · lg: · 3xl: (responsive)</text>

  <!-- row 5: radius -->
  <rect x="40" y="328" width="320" height="48" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="58" y="357" font-size="15" font-weight="bold" fill="#1e293b">--radius-*</text>
  <line x1="360" y1="352" x2="400" y2="352" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="400,352 388,346 388,358" fill="#94a3b8"/>
  <rect x="400" y="328" width="340" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="416" y="357" font-size="14" fill="#0284c7">rounded-* (burchak)</text>

  <!-- row 6: shadow -->
  <rect x="40" y="384" width="320" height="48" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="58" y="413" font-size="15" font-weight="bold" fill="#1e293b">--shadow-*</text>
  <line x1="360" y1="408" x2="400" y2="408" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="400,408 388,402 388,414" fill="#94a3b8"/>
  <rect x="400" y="384" width="340" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="416" y="413" font-size="14" fill="#0284c7">shadow-* (soya)</text>

  <!-- row 7: animate -->
  <rect x="40" y="440" width="320" height="48" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="58" y="469" font-size="15" font-weight="bold" fill="#1e293b">--animate-*</text>
  <line x1="360" y1="464" x2="400" y2="464" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="400,464 388,458 388,470" fill="#94a3b8"/>
  <rect x="400" y="440" width="340" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="416" y="469" font-size="14" fill="#0284c7">animate-* (animatsiya)</text>

  <text x="390" y="510" text-anchor="middle" font-size="13" fill="#64748b">Qoida: --&lt;namespace&gt;-&lt;nom&gt; → &lt;utility-prefiks&gt;-&lt;nom&gt; · masalan --color-brand-500 → bg-brand-500</text>
</svg>
