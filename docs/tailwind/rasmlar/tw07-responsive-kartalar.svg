<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Bir xil 6 ta karta uch xil ekran kengligida: mobil 1 ustun, sm 2 ustun, lg 3 ustun — grid-cols-1 sm:grid-cols-2 lg:grid-cols-3</title>
  <rect x="0" y="0" width="800" height="470" fill="#f8fafc"/>

  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Bir xil kartalar — uch xil kenglikda</text>
  <text x="400" y="60" text-anchor="middle" font-size="14" fill="#475569">grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6</text>

  <!-- ===== Mobil: 1 ustun ===== -->
  <text x="130" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#64748b">Mobil &#8226; grid-cols-1</text>
  <rect x="60" y="110" width="140" height="320" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="74" y="124" width="112" height="56" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="130" y="157" text-anchor="middle" font-size="13" fill="#4f46e5">1</text>
  <rect x="74" y="190" width="112" height="56" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="130" y="223" text-anchor="middle" font-size="13" fill="#4f46e5">2</text>
  <rect x="74" y="256" width="112" height="56" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="130" y="289" text-anchor="middle" font-size="13" fill="#4f46e5">3</text>
  <rect x="74" y="322" width="112" height="42" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="130" y="348" text-anchor="middle" font-size="13" fill="#64748b">4</text>
  <text x="130" y="392" text-anchor="middle" font-size="13" fill="#94a3b8">5 ...</text>

  <!-- ===== sm: 2 ustun ===== -->
  <text x="400" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#0ea5e9">sm: (&#8805;640px) &#8226; 2 ustun</text>
  <rect x="300" y="110" width="200" height="320" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- 2 ustun x 3 qator -->
  <rect x="314" y="124" width="82" height="80" rx="6" fill="#bae6fd" stroke="#0ea5e9" stroke-width="1.2"/>
  <text x="355" y="169" text-anchor="middle" font-size="13" fill="#0369a1">1</text>
  <rect x="404" y="124" width="82" height="80" rx="6" fill="#bae6fd" stroke="#0ea5e9" stroke-width="1.2"/>
  <text x="445" y="169" text-anchor="middle" font-size="13" fill="#0369a1">2</text>
  <rect x="314" y="214" width="82" height="80" rx="6" fill="#bae6fd" stroke="#0ea5e9" stroke-width="1.2"/>
  <text x="355" y="259" text-anchor="middle" font-size="13" fill="#0369a1">3</text>
  <rect x="404" y="214" width="82" height="80" rx="6" fill="#bae6fd" stroke="#0ea5e9" stroke-width="1.2"/>
  <text x="445" y="259" text-anchor="middle" font-size="13" fill="#0369a1">4</text>
  <rect x="314" y="304" width="82" height="80" rx="6" fill="#bae6fd" stroke="#0ea5e9" stroke-width="1.2"/>
  <text x="355" y="349" text-anchor="middle" font-size="13" fill="#0369a1">5</text>
  <rect x="404" y="304" width="82" height="80" rx="6" fill="#bae6fd" stroke="#0ea5e9" stroke-width="1.2"/>
  <text x="445" y="349" text-anchor="middle" font-size="13" fill="#0369a1">6</text>

  <!-- ===== lg: 3 ustun ===== -->
  <text x="660" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#4f46e5">lg: (&#8805;1024px) &#8226; 3 ustun</text>
  <rect x="540" y="110" width="240" height="320" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- 3 ustun x 2 qator -->
  <rect x="554" y="124" width="66" height="120" rx="6" fill="#c7d2fe" stroke="#6366f1" stroke-width="1.2"/>
  <text x="587" y="189" text-anchor="middle" font-size="13" fill="#4338ca">1</text>
  <rect x="627" y="124" width="66" height="120" rx="6" fill="#c7d2fe" stroke="#6366f1" stroke-width="1.2"/>
  <text x="660" y="189" text-anchor="middle" font-size="13" fill="#4338ca">2</text>
  <rect x="700" y="124" width="66" height="120" rx="6" fill="#c7d2fe" stroke="#6366f1" stroke-width="1.2"/>
  <text x="733" y="189" text-anchor="middle" font-size="13" fill="#4338ca">3</text>
  <rect x="554" y="254" width="66" height="120" rx="6" fill="#c7d2fe" stroke="#6366f1" stroke-width="1.2"/>
  <text x="587" y="319" text-anchor="middle" font-size="13" fill="#4338ca">4</text>
  <rect x="627" y="254" width="66" height="120" rx="6" fill="#c7d2fe" stroke="#6366f1" stroke-width="1.2"/>
  <text x="660" y="319" text-anchor="middle" font-size="13" fill="#4338ca">5</text>
  <rect x="700" y="254" width="66" height="120" rx="6" fill="#c7d2fe" stroke="#6366f1" stroke-width="1.2"/>
  <text x="733" y="319" text-anchor="middle" font-size="13" fill="#4338ca">6</text>

  <!-- strelkalar -->
  <line x1="210" y1="270" x2="296" y2="270" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="296,270 286,265 286,275" fill="#94a3b8"/>
  <line x1="510" y1="270" x2="536" y2="270" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="536,270 526,265 526,275" fill="#94a3b8"/>

  <text x="400" y="454" text-anchor="middle" font-size="13" fill="#64748b">Mobile-first: bazaviy 1 ustun, ekran kengaygani sayin ustun qo'shiladi</text>
</svg>
