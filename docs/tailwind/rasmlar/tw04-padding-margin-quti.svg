<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Tailwind quti: margin tashqarida, padding ichkarida; mx-auto bilan markazlash</title>
  <rect x="0" y="0" width="780" height="470" fill="#f8fafc"/>

  <text x="30" y="40" font-size="22" fill="#1e293b" font-weight="bold">p-* ichkarida, m-* tashqarida</text>
  <text x="30" y="66" font-size="15" fill="#475569">padding — chegara bilan mazmun orasidagi joy; margin — quti bilan tashqi dunyo orasi</text>

  <!-- margin zone (outer) -->
  <rect x="180" y="100" width="420" height="300" rx="6" fill="#f59e0b" opacity="0.18"/>
  <rect x="180" y="100" width="420" height="300" rx="6" fill="none" stroke="#f59e0b" stroke-dasharray="6 4"/>
  <text x="195" y="122" font-size="15" fill="#b45309" font-weight="bold">margin (m-4)</text>

  <!-- border -->
  <rect x="240" y="150" width="300" height="200" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="3"/>
  <text x="255" y="172" font-size="14" fill="#4f46e5" font-weight="bold">border</text>

  <!-- padding zone -->
  <rect x="270" y="186" width="240" height="130" rx="4" fill="#0ea5e9" opacity="0.18"/>
  <text x="285" y="206" font-size="14" fill="#0369a1" font-weight="bold">padding (p-4)</text>

  <!-- content -->
  <rect x="320" y="222" width="140" height="60" rx="4" fill="#6366f1"/>
  <text x="390" y="258" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">mazmun</text>

  <!-- side labels for padding -->
  <text x="390" y="182" font-size="13" fill="#0369a1" text-anchor="middle">pt</text>
  <text x="390" y="312" font-size="13" fill="#0369a1" text-anchor="middle">pb</text>
  <text x="288" y="256" font-size="13" fill="#0369a1" text-anchor="middle">pl</text>
  <text x="492" y="256" font-size="13" fill="#0369a1" text-anchor="middle">pr</text>

  <!-- right side: shorthand legend -->
  <rect x="620" y="120" width="135" height="260" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="635" y="146" font-size="14" fill="#1e293b" font-weight="bold">Tomonlar</text>
  <text x="635" y="174" font-size="14" fill="#475569">p-4 — 4 tomon</text>
  <text x="635" y="200" font-size="14" fill="#475569">px-4 — chap+o'ng</text>
  <text x="635" y="226" font-size="14" fill="#475569">py-4 — yuqori+past</text>
  <text x="635" y="252" font-size="14" fill="#475569">pt pr pb pl</text>
  <text x="635" y="278" font-size="14" fill="#475569">— bittadan</text>
  <line x1="635" y1="294" x2="740" y2="294" stroke="#94a3b8" stroke-dasharray="3 3"/>
  <text x="635" y="318" font-size="14" fill="#16a34a" font-weight="bold">ps / pe</text>
  <text x="635" y="340" font-size="13" fill="#64748b">start / end</text>
  <text x="635" y="360" font-size="13" fill="#64748b">(RTL uchun)</text>

  <!-- mx-auto illustration at bottom -->
  <rect x="180" y="418" width="420" height="40" rx="4" fill="none" stroke="#94a3b8"/>
  <text x="190" y="442" font-size="13" fill="#64748b">ota-element</text>
  <rect x="330" y="424" width="120" height="28" rx="4" fill="#16a34a"/>
  <text x="390" y="443" font-size="14" fill="#ffffff" text-anchor="middle">mx-auto</text>
  <text x="250" y="443" font-size="20" fill="#16a34a" text-anchor="middle">&#8594;</text>
  <text x="530" y="443" font-size="20" fill="#16a34a" text-anchor="middle">&#8592;</text>
</svg>
