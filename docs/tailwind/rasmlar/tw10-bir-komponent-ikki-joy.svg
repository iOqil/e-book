<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" font-family="Segoe UI, system-ui, sans-serif">
  <title>Bir xil karta komponenti ikki joyda: tor yon panelda ustma-ust (flex-col), keng asosiy maydonda yonma-yon (md:flex-row) — klasslar bir xil, natija boshqa, chunki konteyner eni boshqa</title>
  <rect x="0" y="0" width="800" height="460" fill="#f8fafc"/>

  <text x="400" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">Bitta komponent, ikki joy — bir xil klasslar</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#475569">@container ichida: flex flex-col @md:flex-row</text>

  <!-- ===== Chap: tor yon panel ===== -->
  <text x="195" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Tor yon panel</text>
  <rect x="60" y="104" width="270" height="262" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- konteyner badge -->
  <rect x="84" y="124" width="222" height="222" rx="9" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="195" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#0284c7">@container (tor)</text>
  <!-- karta: vertikal (stacked) -->
  <rect x="104" y="156" width="182" height="78" rx="7" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="195" y="200" text-anchor="middle" font-size="14" fill="#4f46e5">rasm</text>
  <rect x="104" y="244" width="182" height="86" rx="7" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="195" y="280" text-anchor="middle" font-size="14" fill="#4f46e5">sarlavha</text>
  <text x="195" y="304" text-anchor="middle" font-size="13" fill="#64748b">matn</text>
  <text x="195" y="394" text-anchor="middle" font-size="13" font-weight="bold" fill="#0284c7">flex-col</text>
  <text x="195" y="414" text-anchor="middle" font-size="13" fill="#64748b">tor → ustma-ust</text>

  <!-- O'rta: tenglik belgisi -->
  <text x="400" y="250" text-anchor="middle" font-size="34" font-weight="bold" fill="#16a34a">=</text>
  <text x="400" y="284" text-anchor="middle" font-size="13" fill="#16a34a">aynan bir xil</text>
  <text x="400" y="302" text-anchor="middle" font-size="13" fill="#16a34a">HTML va klass</text>

  <!-- ===== O'ng: keng asosiy maydon ===== -->
  <text x="605" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Keng asosiy maydon</text>
  <rect x="470" y="104" width="270" height="262" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- konteyner badge -->
  <rect x="486" y="180" width="238" height="110" rx="9" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="605" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#0284c7">@container (keng)</text>
  <!-- karta: gorizontal (side-by-side) -->
  <rect x="500" y="196" width="96" height="78" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="548" y="240" text-anchor="middle" font-size="14" fill="#16a34a">rasm</text>
  <rect x="606" y="196" width="106" height="78" rx="7" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="659" y="230" text-anchor="middle" font-size="14" fill="#16a34a">sarlavha</text>
  <text x="659" y="254" text-anchor="middle" font-size="13" fill="#64748b">matn</text>
  <text x="605" y="394" text-anchor="middle" font-size="13" font-weight="bold" fill="#0284c7">@md:flex-row</text>
  <text x="605" y="414" text-anchor="middle" font-size="13" fill="#64748b">keng → yonma-yon</text>

  <line x1="60" y1="432" x2="740" y2="432" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="400" y="452" text-anchor="middle" font-size="13" fill="#475569">Ekran eni ikkalasida bir xil — farqni faqat konteyner eni hal qiladi</text>
</svg>
