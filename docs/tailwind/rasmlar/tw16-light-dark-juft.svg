<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Bir xil karta light va dark rejimda yonma-yon: har bir sirt va matn o'zining juftlangan klassi bilan belgilangan (bg-white dark:bg-gray-900, text-gray-900 dark:text-gray-100, va h.k.)</title>
  <rect x="0" y="0" width="800" height="470" fill="#f8fafc"/>

  <text x="400" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">Bir karta — ikki rejim: har rangni JUFTLANG</text>
  <text x="400" y="62" text-anchor="middle" font-size="14" fill="#475569">Har bir sirt/matn uchun light qiymat + dark: juftini yozasiz</text>

  <!-- LIGHT side -->
  <text x="210" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#0284c7">LIGHT (asos)</text>
  <rect x="60" y="110" width="300" height="190" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="84" y="146" font-size="17" font-weight="bold" fill="#1e293b">Hisobot kartasi</text>
  <text x="84" y="172" font-size="14" fill="#475569">Oxirgi 7 kunlik o'sish</text>
  <line x1="84" y1="190" x2="336" y2="190" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="84" y="222" font-size="14" fill="#1e293b">Faol foydalanuvchilar</text>
  <text x="336" y="222" text-anchor="end" font-size="17" font-weight="bold" fill="#4f46e5">1 284</text>
  <rect x="84" y="244" width="120" height="36" rx="8" fill="#6366f1"/>
  <text x="144" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Batafsil</text>

  <!-- DARK side -->
  <text x="590" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#4f46e5">DARK (dark: juftlari)</text>
  <rect x="440" y="110" width="300" height="190" rx="12" fill="#111827" stroke="#1e293b" stroke-width="2"/>
  <text x="464" y="146" font-size="17" font-weight="bold" fill="#f1f5f9">Hisobot kartasi</text>
  <text x="464" y="172" font-size="14" fill="#94a3b8">Oxirgi 7 kunlik o'sish</text>
  <line x1="464" y1="190" x2="716" y2="190" stroke="#1e293b" stroke-width="1.5"/>
  <text x="464" y="222" font-size="14" fill="#f1f5f9">Faol foydalanuvchilar</text>
  <text x="716" y="222" text-anchor="end" font-size="17" font-weight="bold" fill="#a5b4fc">1 284</text>
  <rect x="464" y="244" width="120" height="36" rx="8" fill="#6366f1"/>
  <text x="524" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Batafsil</text>

  <!-- pairing labels -->
  <text x="400" y="338" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Juftlangan klasslar (har biri light + dark:)</text>

  <rect x="60" y="352" width="345" height="98" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="76" y="376" font-size="13" fill="#1e293b">Sirt: <tspan font-weight="bold" fill="#4f46e5">bg-white dark:bg-gray-900</tspan></text>
  <text x="76" y="400" font-size="13" fill="#1e293b">Matn: <tspan font-weight="bold" fill="#4f46e5">text-gray-900 dark:text-gray-100</tspan></text>
  <text x="76" y="424" font-size="13" fill="#1e293b">Xira: <tspan font-weight="bold" fill="#4f46e5">text-gray-500 dark:text-gray-400</tspan></text>

  <rect x="425" y="352" width="315" height="98" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="441" y="376" font-size="13" fill="#1e293b">Chegara: <tspan font-weight="bold" fill="#4f46e5">border-gray-200 dark:border-gray-800</tspan></text>
  <text x="441" y="400" font-size="13" fill="#1e293b">Toza qora EMAS: <tspan font-weight="bold" fill="#16a34a">gray-900 / gray-950</tspan></text>
  <text x="441" y="424" font-size="13" fill="#1e293b">Soya zaif: <tspan font-weight="bold" fill="#b45309">ring / border qo'shing</tspan></text>
</svg>
