<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>Rang utility'lari xaritasi: bir karta ustida bg-* sirt, text-* matn, border-* chekka, ring-* fokus halqasi, shadow-* soya, fill-* ikona rangini belgilaydi</title>
  <rect x="0" y="0" width="780" height="440" fill="#f8fafc"/>

  <text x="390" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">Qaysi utility kartaning qaysi qismini ranglaydi?</text>

  <!-- focus ring (drawn behind card) -->
  <rect x="206" y="106" width="368" height="208" rx="16" fill="none" stroke="#93c5fd" stroke-width="6"/>

  <!-- shadow (offset rect) -->
  <rect x="216" y="120" width="350" height="190" rx="12" fill="#cbd5e1"/>
  <!-- card surface -->
  <rect x="210" y="112" width="350" height="190" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>

  <!-- icon (svg) -->
  <circle cx="250" cy="152" r="18" fill="#3b82f6"/>
  <path d="M242 152 l6 6 l12 -13" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- title + body text -->
  <text x="284" y="150" font-size="17" font-weight="bold" fill="#1e3a8a">Hisob yaratildi</text>
  <text x="232" y="186" font-size="14" fill="#475569">Tasdiqlash xati pochtangizga</text>
  <text x="232" y="208" font-size="14" fill="#475569">yuborildi. Davom etish uchun</text>
  <text x="232" y="230" font-size="14" fill="#475569">havolani bosing.</text>

  <!-- button inside card -->
  <rect x="232" y="252" width="130" height="34" rx="7" fill="#2563eb"/>
  <text x="297" y="274" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Davom etish</text>

  <!-- annotations with leader lines -->
  <!-- bg-* surface -->
  <line x1="460" y1="135" x2="610" y2="120" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="610" y="106" width="150" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="620" y="126" font-size="14" fill="#4f46e5">bg-*  &#8594; sirt (fon)</text>

  <!-- text-* -->
  <line x1="420" y1="186" x2="610" y2="160" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="610" y="146" width="150" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="620" y="166" font-size="14" fill="#4f46e5">text-*  &#8594; matn</text>

  <!-- border-* -->
  <line x1="558" y1="210" x2="610" y2="200" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="610" y="186" width="150" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="620" y="206" font-size="14" fill="#4f46e5">border-*  &#8594; chekka</text>

  <!-- ring-* -->
  <line x1="576" y1="250" x2="610" y2="240" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="610" y="226" width="150" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="620" y="246" font-size="14" fill="#4f46e5">ring-*  &#8594; fokus halqa</text>

  <!-- shadow-* -->
  <line x1="560" y1="300" x2="610" y2="280" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="610" y="266" width="150" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="620" y="286" font-size="14" fill="#4f46e5">shadow-*  &#8594; soya</text>

  <!-- fill-* icon -->
  <line x1="268" y1="152" x2="20" y2="120" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="20" y="106" width="170" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="30" y="126" font-size="14" fill="#4f46e5">fill-*  &#8594; SVG ikona</text>

  <!-- button color note -->
  <line x1="297" y1="286" x2="20" y2="260" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="20" y="246" width="170" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="30" y="266" font-size="14" fill="#4f46e5">tugma: bg-* + text-*</text>

  <text x="390" y="360" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Har bir utility rangni aniq BIR joyga qo'yadi — sirt, matn, chekka, halqa, soya yoki ikona.</text>
  <text x="390" y="386" text-anchor="middle" font-size="13" fill="#475569">Yana: divide-* (ajratgich), outline-*, decoration-* (tag chizig'i), placeholder-*, caret-* (kursor), accent-* (checkbox)</text>
  <text x="390" y="410" text-anchor="middle" font-size="13" fill="#64748b">Hammasi bir xil 22 oila × 11 soya palitrasidan rang oladi.</text>
</svg>
