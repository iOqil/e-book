<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" font-family="Segoe UI, system-ui, sans-serif">
  <title>flex justify-between items-center bilan qurilgan navbar: chapda logo, o'ngda havolalar va tugma</title>
  <rect x="0" y="0" width="780" height="420" fill="#f8fafc"/>

  <text x="390" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Navbar: flex justify-between items-center</text>
  <text x="390" y="62" text-anchor="middle" font-size="14" fill="#475569">Logo chapga, qolgani o'ngga — bo'sh joy ikki guruh orasiga tushadi</text>

  <!-- navbar container -->
  <rect x="40" y="86" width="700" height="74" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>

  <!-- LEFT group: logo -->
  <rect x="64" y="106" width="120" height="34" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="124" y="129" text-anchor="middle" font-size="15" font-weight="bold" fill="#4f46e5">LOGO</text>

  <!-- RIGHT group: links + button -->
  <text x="494" y="129" text-anchor="middle" font-size="14" fill="#1e293b">Bosh</text>
  <text x="556" y="129" text-anchor="middle" font-size="14" fill="#1e293b">Narx</text>
  <text x="620" y="129" text-anchor="middle" font-size="14" fill="#1e293b">Bog'lanish</text>
  <rect x="668" y="106" width="48" height="34" rx="6" fill="#4f46e5"/>
  <text x="692" y="129" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Kir</text>

  <!-- gap brace between left and right groups -->
  <line x1="190" y1="123" x2="478" y2="123" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="334" y="116" text-anchor="middle" font-size="13" fill="#64748b">justify-between bu bo'shliqni avtomatik qo'yadi</text>

  <!-- vertical centering guide line -->
  <line x1="40" y1="123" x2="740" y2="123" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>

  <!-- annotations -->
  <!-- left bracket -->
  <line x1="64" y1="178" x2="184" y2="178" stroke="#0ea5e9" stroke-width="2"/>
  <line x1="64" y1="172" x2="64" y2="178" stroke="#0ea5e9" stroke-width="2"/>
  <line x1="184" y1="172" x2="184" y2="178" stroke="#0ea5e9" stroke-width="2"/>
  <text x="124" y="198" text-anchor="middle" font-size="13" fill="#0ea5e9">1-bola: logo</text>

  <!-- right bracket -->
  <line x1="466" y1="178" x2="716" y2="178" stroke="#0ea5e9" stroke-width="2"/>
  <line x1="466" y1="172" x2="466" y2="178" stroke="#0ea5e9" stroke-width="2"/>
  <line x1="716" y1="172" x2="716" y2="178" stroke="#0ea5e9" stroke-width="2"/>
  <text x="591" y="198" text-anchor="middle" font-size="13" fill="#0ea5e9">2-bola: ichki flex (havolalar + tugma)</text>

  <!-- code block -->
  <rect x="40" y="222" width="700" height="160" rx="10" fill="#1e293b"/>
  <text x="60" y="252" font-size="14" font-family="Consolas, monospace" fill="#ffffff">&lt;nav class=<tspan fill="#38bdf8">"flex justify-between items-center px-6 py-3"</tspan>&gt;</text>
  <text x="84" y="278" font-size="14" font-family="Consolas, monospace" fill="#ffffff">&lt;a class=<tspan fill="#38bdf8">"font-bold text-lg"</tspan>&gt;LOGO&lt;/a&gt;</text>
  <text x="84" y="304" font-size="14" font-family="Consolas, monospace" fill="#ffffff">&lt;div class=<tspan fill="#38bdf8">"flex items-center gap-6"</tspan>&gt;</text>
  <text x="108" y="330" font-size="14" font-family="Consolas, monospace" fill="#94a3b8">&lt;!-- havolalar + tugma --&gt;</text>
  <text x="84" y="356" font-size="14" font-family="Consolas, monospace" fill="#ffffff">&lt;/div&gt;</text>
  <text x="60" y="376" font-size="14" font-family="Consolas, monospace" fill="#ffffff">&lt;/nav&gt;</text>

  <!-- key labels right side of code -->
  <text x="500" y="330" font-size="13" fill="#16a34a">justify-between -> ikki uchga</text>
  <text x="500" y="350" font-size="13" fill="#f59e0b">items-center -> vertikal markaz</text>
</svg>
