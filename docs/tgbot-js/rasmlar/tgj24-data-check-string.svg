<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420">
  <title>initData -> hash ni ajratish -> qolgan maydonlarni sortlab data_check_string qurish</title>
  <rect x="0" y="0" width="780" height="420" fill="#f8fafc"/>
  <text x="390" y="32" text-anchor="middle" font-family="Segoe UI" font-size="19" font-weight="bold" fill="#1e293b">data_check_string qanday quriladi</text>

  <defs>
    <marker id="ar" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#2563eb"/></marker>
  </defs>

  <!-- 1. Xom initData -->
  <rect x="24" y="58" width="732" height="64" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="40" y="82" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">1. Xom initData (query string)</text>
  <text x="40" y="106" font-family="Segoe UI" font-size="13" fill="#334155">query_id=AAH&amp;user={...}&amp;auth_date=1700000000&amp;hash=a1b2c3...</text>

  <line x1="390" y1="122" x2="390" y2="150" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- 2. hash ni ajratish -->
  <rect x="24" y="152" width="356" height="92" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="40" y="176" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">2. hash ni AJRATIB olamiz</text>
  <text x="40" y="200" font-family="Segoe UI" font-size="13" fill="#334155">hash = "a1b2c3..."</text>
  <text x="40" y="222" font-family="Segoe UI" font-size="13" fill="#64748b">params.delete("hash")</text>
  <text x="40" y="240" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#dc2626">hash data_check_string'ga KIRMAYDI</text>

  <!-- 3. qolgan maydonlar -->
  <rect x="400" y="152" width="356" height="92" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="416" y="176" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#15803d">3. Qolgan maydonlar (key=value)</text>
  <text x="416" y="200" font-family="Segoe UI" font-size="13" fill="#334155">auth_date=1700000000</text>
  <text x="416" y="220" font-family="Segoe UI" font-size="13" fill="#334155">query_id=AAH</text>
  <text x="416" y="240" font-family="Segoe UI" font-size="13" fill="#334155">user={"id":777,...}</text>

  <line x1="578" y1="244" x2="578" y2="272" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- 4. SORT + join("\n") -->
  <rect x="24" y="274" width="732" height="100" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="40" y="298" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#b45309">4. ALIFBO bo'yicha SORT + "\n" bilan birlashtirish = data_check_string</text>
  <text x="40" y="322" font-family="Segoe UI" font-size="13" fill="#334155">auth_date=1700000000</text>
  <text x="40" y="342" font-family="Segoe UI" font-size="13" fill="#334155">query_id=AAH</text>
  <text x="40" y="362" font-family="Segoe UI" font-size="13" fill="#334155">user={"id":777,...}</text>
  <text x="430" y="332" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#b45309">Sort SHART — Telegram</text>
  <text x="430" y="352" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#b45309">ham sortlab imzolaydi.</text>

  <text x="390" y="402" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Bu satr keyin HMAC-SHA256 ga kiritiladi (keyingi diagrammaga qarang)</text>
</svg>
