<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440">
  <title>grammY ekotizimi: yadro va atrofidagi rasmiy plaginlar xaritasi</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">grammY ekotizimi: yadro + plaginlar</text>

  <!-- Yadro -->
  <circle cx="380" cy="225" r="100" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="380" y="200" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#2563eb" text-anchor="middle">grammy</text>
  <text x="380" y="223" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">(yadro)</text>
  <text x="380" y="246" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">Bot · Composer · Context</text>
  <text x="380" y="265" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">Keyboard · session</text>

  <!-- Plaginlar (atrofda) -->
  <!-- yuqori chap -->
  <rect x="40" y="80" width="200" height="56" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="106" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">@grammyjs/conversations</text>
  <text x="140" y="125" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">ko'p qadamli suhbat (08-bob)</text>

  <!-- yuqori o'ng -->
  <rect x="520" y="80" width="200" height="56" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="106" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">@grammyjs/menu</text>
  <text x="620" y="125" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">interaktiv menyu (12-bob)</text>

  <!-- chap o'rta -->
  <rect x="20" y="197" width="200" height="56" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="120" y="223" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">@grammyjs/runner</text>
  <text x="120" y="242" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">konkurensiya (15-bob)</text>

  <!-- o'ng o'rta -->
  <rect x="540" y="197" width="200" height="56" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="640" y="223" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">@grammyjs/hydrate</text>
  <text x="640" y="242" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">qulay ctx metodlari (12)</text>

  <!-- past chap -->
  <rect x="40" y="320" width="200" height="56" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="346" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">@grammyjs/storage-file</text>
  <text x="140" y="365" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">sessiyani saqlash (10-bob)</text>

  <!-- past o'ng -->
  <rect x="520" y="320" width="200" height="56" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="620" y="346" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">@grammyjs/auto-retry</text>
  <text x="620" y="365" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">flood-control (15-bob)</text>

  <!-- bog'lovchi chiziqlar -->
  <line x1="240" y1="120" x2="300" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="520" y1="120" x2="460" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="220" y1="225" x2="280" y2="225" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="540" y1="225" x2="480" y2="225" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="240" y1="336" x2="300" y2="275" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="520" y1="336" x2="460" y2="275" stroke="#94a3b8" stroke-width="1.5"/>

  <text x="380" y="420" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">Yadro hamma narsani biladi; plaginlarni faqat kerak bo'lganda qo'shasiz</text>
</svg>
