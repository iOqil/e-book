<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480">
  <title>telegram-web-app.js SDK: window.Telegram.WebApp obyektining asosiy metod va xossalari</title>
  <rect x="0" y="0" width="760" height="480" fill="#f8fafc"/>

  <text x="380" y="34" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">window.Telegram.WebApp (brauzer SDK)</text>
  <text x="380" y="56" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">telegram-web-app.js sahifaga ulangach mavjud bo'ladi</text>

  <!-- markaziy obyekt -->
  <rect x="280" y="78" width="200" height="44" rx="10" fill="#2563eb"/>
  <text x="380" y="106" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">WebApp</text>

  <!-- Hayot sikli -->
  <rect x="30" y="150" width="220" height="140" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="174" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">Hayot sikli</text>
  <text x="48" y="200" font-family="Segoe UI" font-size="13" fill="#334155">.ready()  — tayyor signali</text>
  <text x="48" y="222" font-family="Segoe UI" font-size="13" fill="#334155">.expand() — to'liq baland</text>
  <text x="48" y="244" font-family="Segoe UI" font-size="13" fill="#334155">.close()  — yopish</text>
  <text x="48" y="270" font-family="Segoe UI" font-size="13" fill="#64748b">.themeParams — ranglar</text>

  <!-- Ma'lumot -->
  <rect x="270" y="150" width="220" height="140" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="174" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Ma'lumot</text>
  <text x="288" y="200" font-family="Segoe UI" font-size="13" fill="#334155">.initData — xom satr</text>
  <text x="288" y="222" font-family="Segoe UI" font-size="13" fill="#dc2626">.initDataUnsafe</text>
  <text x="288" y="240" font-family="Segoe UI" font-size="13" fill="#dc2626">  (ISHONMA! 24-bob)</text>
  <text x="288" y="266" font-family="Segoe UI" font-size="13" fill="#334155">.sendData(data)</text>
  <text x="288" y="282" font-family="Segoe UI" font-size="13" fill="#64748b">  -&gt; botga yuboradi</text>

  <!-- UI elementlari -->
  <rect x="510" y="150" width="220" height="140" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="620" y="174" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">UI elementlari</text>
  <text x="528" y="200" font-family="Segoe UI" font-size="13" fill="#334155">.MainButton — asosiy</text>
  <text x="528" y="222" font-family="Segoe UI" font-size="13" fill="#334155">.BackButton — orqaga</text>
  <text x="528" y="244" font-family="Segoe UI" font-size="13" fill="#334155">.HapticFeedback</text>
  <text x="528" y="266" font-family="Segoe UI" font-size="13" fill="#64748b">  (tebranish)</text>

  <!-- chiziqlar -->
  <path d="M 340 122 L 200 150" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <path d="M 380 122 L 380 150" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <path d="M 420 122 L 560 150" stroke="#94a3b8" stroke-width="1.5" fill="none"/>

  <!-- skelet kod -->
  <rect x="30" y="316" width="700" height="120" rx="10" fill="#1e293b"/>
  <text x="48" y="342" font-family="Segoe UI" font-size="13" fill="#94a3b8">&lt;script src="https://telegram.org/js/telegram-web-app.js"&gt;&lt;/script&gt;</text>
  <text x="48" y="366" font-family="Segoe UI" font-size="13" fill="#ffffff">const tg = window.Telegram.WebApp;</text>
  <text x="48" y="388" font-family="Segoe UI" font-size="13" fill="#ffffff">tg.ready();  tg.expand();</text>
  <text x="48" y="410" font-family="Segoe UI" font-size="13" fill="#ffffff">tg.MainButton.setText("Yuborish").show();</text>
  <text x="48" y="430" font-family="Segoe UI" font-size="13" fill="#86efac">tg.MainButton.onClick(() =&gt; tg.sendData("OK"));</text>

  <text x="380" y="466" font-family="Segoe UI" font-size="13" fill="#dc2626" text-anchor="middle">Bu qism BRAUZERDA ishlaydi (illustrativ) — bot kodi emas</text>
</svg>
