<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460">
  <title>ctx (Context) obyektining anatomiyasi: xom Update ma'lumoti va qulay yorliqlar</title>
  <rect x="0" y="0" width="720" height="460" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b">ctx (Context) — har handlerga uzatiladi</text>

  <!-- Outer ctx container -->
  <rect x="30" y="56" width="660" height="380" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="50" y="84" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">ctx</text>

  <!-- LEFT column: xom ma'lumot -->
  <rect x="50" y="100" width="300" height="320" rx="10" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="200" y="126" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#334155">Xom ma'lumot (Telegramdan)</text>

  <rect x="68" y="142" width="264" height="44" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="80" y="162" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">ctx.update</text>
  <text x="80" y="179" font-family="Segoe UI" font-size="13" fill="#64748b">butun xom Update (eng past daraja)</text>

  <rect x="68" y="194" width="264" height="44" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="80" y="214" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">ctx.message / .editedMessage</text>
  <text x="80" y="231" font-family="Segoe UI" font-size="13" fill="#64748b">.channelPost / .callbackQuery</text>

  <rect x="68" y="246" width="264" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="80" y="266" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">ctx.from</text>
  <text x="80" y="281" font-family="Segoe UI" font-size="13" fill="#64748b">kim yubordi (User)</text>

  <rect x="68" y="294" width="264" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="80" y="314" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">ctx.chat</text>
  <text x="80" y="329" font-family="Segoe UI" font-size="13" fill="#64748b">qaysi chat (Chat)</text>

  <rect x="68" y="342" width="264" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="80" y="362" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">ctx.me</text>
  <text x="80" y="377" font-family="Segoe UI" font-size="13" fill="#64748b">botning o'zi (getMe natijasi)</text>

  <!-- RIGHT column: qulayliklar -->
  <rect x="370" y="100" width="300" height="320" rx="10" fill="#f0fdf4" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="520" y="126" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#334155">Qulayliklar (grammY qo'shadi)</text>

  <rect x="388" y="142" width="264" height="48" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="400" y="162" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">ctx.msg</text>
  <text x="400" y="180" font-family="Segoe UI" font-size="13" fill="#64748b">message / edited / channelPost — qaysi kelsa</text>

  <rect x="388" y="198" width="264" height="44" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="400" y="218" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">ctx.chatId</text>
  <text x="400" y="235" font-family="Segoe UI" font-size="13" fill="#64748b">ctx.chat?.id ning qisqa yozuvi</text>

  <rect x="388" y="250" width="264" height="56" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="400" y="270" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">ctx.reply("matn")</text>
  <text x="400" y="288" font-family="Segoe UI" font-size="13" fill="#64748b">= api.sendMessage(ctx.chat.id, "matn")</text>
  <text x="400" y="303" font-family="Segoe UI" font-size="13" fill="#64748b">chat_id ni o'zi to'ldiradi</text>

  <rect x="388" y="314" width="264" height="56" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="400" y="334" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">ctx.api</text>
  <text x="400" y="352" font-family="Segoe UI" font-size="13" fill="#64748b">to'liq Bot API; boshqa chatga yozish:</text>
  <text x="400" y="367" font-family="Segoe UI" font-size="13" fill="#64748b">ctx.api.sendMessage(id, "...")</text>

  <text x="520" y="402" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">message bo'lmasa ctx.message=undefined; ctx.msg xavfsizroq</text>
</svg>
