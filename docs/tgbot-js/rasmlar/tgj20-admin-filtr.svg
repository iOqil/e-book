<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470">
  <title>Admin-filtr oqimi: /ban buyrug'i kelganda getChatMember bilan yuboruvchi admin ekanini va nishon oddiy a'zo ekanini tekshirish, keyin banChatMember</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Admin-filtr: /ban kim ishlatishi mumkin?</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- 1: buyruq keldi -->
  <rect x="280" y="56" width="200" height="50" rx="10" fill="#2563eb"/>
  <text x="380" y="80" font-family="Segoe UI" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">/ban (reply bilan)</text>
  <text x="380" y="98" font-family="Segoe UI" font-size="13" fill="#dbeafe" text-anchor="middle">guruhda keldi</text>
  <line x1="380" y1="106" x2="380" y2="134" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 2: reply bormi? -->
  <rect x="270" y="136" width="220" height="48" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="380" y="160" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">Nishon xabariga reply</text>
  <text x="380" y="178" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">qilinganmi?</text>
  <line x1="380" y1="184" x2="380" y2="212" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 3: yuboruvchi admin mi -->
  <rect x="230" y="214" width="300" height="56" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="237" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle" font-weight="bold">getChatMember(ctx.from.id)</text>
  <text x="380" y="257" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">.status admin/creator?</text>

  <!-- yo'q tarmoq -->
  <line x1="230" y1="242" x2="120" y2="242" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="170" y="234" font-family="Segoe UI" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">yo'q</text>
  <rect x="20" y="218" width="190" height="48" rx="10" fill="#fef2f2" stroke="#dc2626"/>
  <text x="115" y="240" font-family="Segoe UI" font-size="13" fill="#dc2626" text-anchor="middle">"Faqat adminlar</text>
  <text x="115" y="258" font-family="Segoe UI" font-size="13" fill="#dc2626" text-anchor="middle">uchun" -> to'xtash</text>

  <line x1="380" y1="270" x2="380" y2="298" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="404" y="288" font-family="Segoe UI" font-size="13" fill="#16a34a" font-weight="bold">ha</text>

  <!-- 4: nishon himoyalanganmi -->
  <rect x="210" y="300" width="340" height="74" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="322" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle" font-weight="bold">Nishon himoyalanganmi?</text>
  <text x="380" y="342" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">o'zi / bot / admin bo'lsa — rad</text>
  <text x="380" y="362" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">getChatMember(nishon).status tekshiriladi</text>

  <line x1="210" y1="337" x2="120" y2="337" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="168" y="329" font-family="Segoe UI" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">ha</text>
  <rect x="20" y="313" width="190" height="48" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="115" y="335" font-family="Segoe UI" font-size="13" fill="#b45309" text-anchor="middle">Rad: "Adminni/o'zini</text>
  <text x="115" y="353" font-family="Segoe UI" font-size="13" fill="#b45309" text-anchor="middle">ban qila olmaysiz"</text>

  <line x1="380" y1="374" x2="380" y2="402" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="404" y="392" font-family="Segoe UI" font-size="13" fill="#16a34a" font-weight="bold">yo'q</text>

  <!-- 5: ban -->
  <rect x="270" y="404" width="220" height="50" rx="10" fill="#16a34a"/>
  <text x="380" y="427" font-family="Segoe UI" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">ctx.banChatMember(nishon)</text>
  <text x="380" y="445" font-family="Segoe UI" font-size="13" fill="#dcfce7" text-anchor="middle">bajariladi va tasdiqlanadi</text>
</svg>
