<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440">
  <title>Composer daraxti: bot ildizdan Composer'lar va handlerlarga tarmoqlanadi, update yuqoridan pastga oqadi</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI" font-size="19" font-weight="bold" fill="#1e293b">Composer daraxti: bot.use(...) bilan tarmoqlanish</text>

  <!-- Root: bot -->
  <rect x="300" y="58" width="160" height="56" rx="10" fill="#2563eb"/>
  <text x="380" y="84" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#ffffff">bot (ildiz)</text>
  <text x="380" y="104" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#e0e7ff">Bot ham Composer</text>

  <!-- Level 2: three branches -->
  <rect x="40" y="170" width="200" height="64" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="140" y="196" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#b45309">logging middleware</text>
  <text x="140" y="218" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">bot.use(loglovchi)</text>

  <rect x="280" y="170" width="200" height="64" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="196" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">adminComposer</text>
  <text x="380" y="218" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">new Composer()</text>

  <rect x="520" y="170" width="200" height="64" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="620" y="196" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">userComposer</text>
  <text x="620" y="218" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">new Composer()</text>

  <!-- edges root -> level2 -->
  <line x1="360" y1="114" x2="160" y2="166" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="380" y1="114" x2="380" y2="166" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="400" y1="114" x2="600" y2="166" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Level 3: leaf handlers under composers -->
  <rect x="280" y="288" width="200" height="54" rx="9" fill="#16a34a"/>
  <text x="380" y="312" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#ffffff">.command("panel")</text>
  <text x="380" y="332" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dcfce7">.command("ban")</text>

  <rect x="520" y="288" width="200" height="54" rx="9" fill="#16a34a"/>
  <text x="620" y="312" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#ffffff">.command("start")</text>
  <text x="620" y="332" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dcfce7">.on("message:text")</text>

  <line x1="380" y1="234" x2="380" y2="284" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="620" y1="234" x2="620" y2="284" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- update flow note -->
  <line x1="40" y1="372" x2="720" y2="372" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="398" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Update yuqoridan pastga, qo'shilish tartibida (chap -> o'ng) oqadi</text>
  <text x="380" y="420" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">birinchi mos handler ishlaydi; next() bilan keyingisiga o'tiladi</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/></marker>
  </defs>
</svg>
