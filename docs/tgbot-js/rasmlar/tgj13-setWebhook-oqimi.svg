<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470">
  <title>setWebhook oqimi: bir marta setWebhook(url, secret_token) chaqiriladi, keyin har update server'ga POST bo'ladi; secret_token header bilan tekshiriladi</title>
  <rect x="0" y="0" width="860" height="470" fill="#f8fafc"/>
  <defs>
    <marker id="b1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="b2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="b3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="430" y="34" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">setWebhook: ro'yxatdan o'tkazish va sir tekshiruvi</text>

  <!-- Step 1: bir marta ro'yxatdan o'tkazish -->
  <rect x="30" y="60" width="800" height="120" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="50" y="86" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">1-qadam: BIR MARTA ro'yxatdan o'tkazish (dastur ishga tushganda)</text>

  <rect x="55" y="100" width="150" height="60" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="130" y="126" font-family="Segoe UI" font-size="14" fill="#1e293b" text-anchor="middle">Sizning kod</text>
  <text x="130" y="146" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">bot.api.setWebhook</text>

  <line x1="205" y1="130" x2="320" y2="130" stroke="#2563eb" stroke-width="2.5" marker-end="url(#b1)"/>
  <text x="262" y="120" font-family="Segoe UI" font-size="13" fill="#2563eb" text-anchor="middle">url + secret_token</text>

  <rect x="320" y="100" width="200" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="420" y="126" font-family="Segoe UI" font-size="14" fill="#1e293b" text-anchor="middle">Telegram</text>
  <text x="420" y="146" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">url + sirni eslab qoladi</text>

  <line x1="520" y1="130" x2="635" y2="130" stroke="#16a34a" stroke-width="2.5" marker-end="url(#b2)"/>
  <rect x="635" y="105" width="170" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="720" y="135" font-family="Segoe UI" font-size="14" fill="#16a34a" text-anchor="middle">true (o'rnatildi)</text>

  <!-- Step 2: har update -->
  <rect x="30" y="200" width="800" height="160" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="50" y="226" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">2-qadam: HAR update'da (avtomatik, doimiy)</text>

  <rect x="320" y="245" width="200" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="420" y="271" font-family="Segoe UI" font-size="14" fill="#1e293b" text-anchor="middle">Telegram</text>
  <text x="420" y="291" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">POST + sir header</text>

  <rect x="55" y="245" width="180" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="145" y="271" font-family="Segoe UI" font-size="14" fill="#1e293b" text-anchor="middle">Sizning server</text>
  <text x="145" y="291" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">sirni solishtiradi</text>

  <line x1="320" y1="275" x2="235" y2="275" stroke="#16a34a" stroke-width="2.5" marker-end="url(#b2)"/>
  <text x="278" y="263" font-family="Segoe UI" font-size="13" fill="#16a34a" text-anchor="middle">POST</text>
  <text x="430" y="335" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">Header: X-Telegram-Bot-Api-Secret-Token</text>

  <!-- sir tekshiruvi natijasi -->
  <rect x="560" y="240" width="245" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="682" y="270" font-family="Segoe UI" font-size="13" fill="#16a34a" text-anchor="middle">Sir mos -> 200 OK, handler ishlaydi</text>
  <rect x="560" y="298" width="245" height="50" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="682" y="328" font-family="Segoe UI" font-size="13" fill="#dc2626" text-anchor="middle">Sir mos emas -> 401, rad etiladi</text>

  <!-- Yordamchi metodlar -->
  <rect x="30" y="380" width="800" height="70" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="50" y="406" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155">Yordamchi metodlar:</text>
  <text x="50" y="430" font-family="Segoe UI" font-size="13" fill="#64748b">getWebhookInfo() holatni ko'rsatadi  -  deleteWebhook() polling'ga qaytaradi  -  Diqqat: webhook + getUpdates = 409 Conflict</text>
</svg>
