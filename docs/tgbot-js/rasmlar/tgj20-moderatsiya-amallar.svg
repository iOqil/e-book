<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430">
  <title>Ban, kick va mute farqi: ban — abadiy chiqarish (banChatMember), kick — ban+unban (qayta kira oladi), mute — restrictChatMember bilan jimlatish</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Moderatsiya amallari: ban / kick / mute</text>

  <!-- BAN -->
  <rect x="30" y="64" width="220" height="320" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="30" y="64" width="220" height="44" rx="12" fill="#dc2626"/>
  <rect x="30" y="92" width="220" height="16" fill="#dc2626"/>
  <text x="140" y="93" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">BAN</text>
  <text x="140" y="138" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">Guruhdan chiqarib,</text>
  <text x="140" y="158" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">qaytib kirishni</text>
  <text x="140" y="178" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">taqiqlaydi.</text>
  <rect x="48" y="200" width="184" height="34" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="140" y="222" font-family="Segoe UI" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">ctx.banChatMember(id)</text>
  <text x="140" y="266" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">Qayta kira oladimi?</text>
  <text x="140" y="288" font-family="Segoe UI" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">Yo'q (unban kerak)</text>
  <text x="140" y="326" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">until_date bilan</text>
  <text x="140" y="346" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">vaqtinchalik ban</text>
  <text x="140" y="366" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">ham mumkin</text>

  <!-- KICK -->
  <rect x="270" y="64" width="220" height="320" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <rect x="270" y="64" width="220" height="44" rx="12" fill="#f59e0b"/>
  <rect x="270" y="92" width="220" height="16" fill="#f59e0b"/>
  <text x="380" y="93" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">KICK</text>
  <text x="380" y="138" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">Guruhdan chiqaradi,</text>
  <text x="380" y="158" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">lekin qaytib kira</text>
  <text x="380" y="178" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">olishini qoldiradi.</text>
  <rect x="288" y="200" width="184" height="34" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="380" y="222" font-family="Segoe UI" font-size="13" fill="#b45309" text-anchor="middle" font-weight="bold">ban() + unban()</text>
  <text x="380" y="266" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">Qayta kira oladimi?</text>
  <text x="380" y="288" font-family="Segoe UI" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="bold">Ha (taklif/havola bilan)</text>
  <text x="380" y="326" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">unban = ban'ni</text>
  <text x="380" y="346" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">darhol olib tashlaydi,</text>
  <text x="380" y="366" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">a'zo qoladi-yu chiqadi</text>

  <!-- MUTE -->
  <rect x="510" y="64" width="220" height="320" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="510" y="64" width="220" height="44" rx="12" fill="#2563eb"/>
  <rect x="510" y="92" width="220" height="16" fill="#2563eb"/>
  <text x="620" y="93" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">MUTE</text>
  <text x="620" y="138" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">A'zo guruhda qoladi,</text>
  <text x="620" y="158" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">lekin yoza olmaydi</text>
  <text x="620" y="178" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">(faqat o'qiydi).</text>
  <rect x="524" y="200" width="192" height="34" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="620" y="221" font-family="Segoe UI" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">restrictChatMember(...)</text>
  <text x="620" y="266" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">Yoza oladimi?</text>
  <text x="620" y="288" font-family="Segoe UI" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">Yo'q: can_send_messages</text>
  <text x="620" y="306" font-family="Segoe UI" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">: false</text>
  <text x="620" y="338" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">until_date — vaqtinchalik;</text>
  <text x="620" y="358" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">qaytarish: hammasini</text>
  <text x="620" y="376" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">true qilib restrict()</text>

  <text x="380" y="416" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">Eng yengilidan og'irigacha: mute (jim) -> kick (chiqarish) -> ban (taqiq). Bot admin + can_restrict_members bo'lishi shart.</text>
</svg>
