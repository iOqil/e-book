<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440">
  <title>grammY filter query tili: qism:tur:detal uch bo'lakli sintaksis</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI" font-size="19" font-weight="bold" fill="#1e293b">Filter query tili: "qism:tur:detal"</text>

  <!-- The example query at top, split into three colored chunks -->
  <rect x="180" y="58" width="160" height="46" rx="8" fill="#2563eb"/>
  <text x="260" y="86" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#ffffff">message</text>
  <text x="345" y="89" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#334155">:</text>
  <rect x="358" y="58" width="120" height="46" rx="8" fill="#16a34a"/>
  <text x="418" y="86" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#ffffff">entities</text>
  <text x="483" y="89" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#334155">:</text>
  <rect x="496" y="58" width="100" height="46" rx="8" fill="#f59e0b"/>
  <text x="546" y="86" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#ffffff">url</text>

  <!-- arrows down to descriptions -->
  <line x1="260" y1="104" x2="260" y2="138" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="418" y1="104" x2="418" y2="138" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="546" y1="104" x2="546" y2="138" stroke="#f59e0b" stroke-width="2" marker-end="url(#ay)"/>

  <!-- 3 description cards -->
  <rect x="155" y="140" width="210" height="78" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="260" y="164" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">1. Qism (L1)</text>
  <text x="260" y="186" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Update turi: qaysi</text>
  <text x="260" y="204" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">maydonda kelgan</text>

  <rect x="375" y="140" width="120" height="78" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="435" y="164" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#166534">2. Tur (L2)</text>
  <text x="435" y="186" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">mazmun turi</text>
  <text x="435" y="204" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">(text/photo...)</text>

  <rect x="505" y="140" width="100" height="78" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="555" y="164" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#b45309">3. Detal (L3)</text>
  <text x="555" y="186" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">aniqlash-</text>
  <text x="555" y="204" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">tiruvchi</text>

  <!-- examples panel -->
  <rect x="40" y="240" width="680" height="178" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="266" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Misollar (chap = query, o'ng = nimani ushlaydi):</text>

  <text x="62" y="294" font-family="Consolas, Segoe UI" font-size="13" fill="#2563eb">"message:text"</text>
  <text x="300" y="294" font-family="Segoe UI" font-size="13" fill="#334155">matnli xabar (faqat message ichida)</text>

  <text x="62" y="320" font-family="Consolas, Segoe UI" font-size="13" fill="#2563eb">":photo"</text>
  <text x="300" y="320" font-family="Segoe UI" font-size="13" fill="#334155">message YOKI channel_post rasmi (qism tushirilgan)</text>

  <text x="62" y="346" font-family="Consolas, Segoe UI" font-size="13" fill="#2563eb">"message:entities:url"</text>
  <text x="300" y="346" font-family="Segoe UI" font-size="13" fill="#334155">matnida URL entity bo'lgan xabar</text>

  <text x="62" y="372" font-family="Consolas, Segoe UI" font-size="13" fill="#2563eb">"edited_message"</text>
  <text x="300" y="372" font-family="Segoe UI" font-size="13" fill="#334155">tahrirlangan xabar (faqat qism — L1)</text>

  <text x="62" y="398" font-family="Consolas, Segoe UI" font-size="13" fill="#2563eb">"callback_query:data"</text>
  <text x="300" y="398" font-family="Segoe UI" font-size="13" fill="#334155">tugma bosilganda kelgan data</text>

  <defs>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
    <marker id="ay" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f59e0b"/></marker>
  </defs>
</svg>
