<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460">
  <title>conversation.form.* validatsiya tsikli: noto'g'ri kiritmada otherwise chaqiriladi va yana kutiladi; to'g'ri qiymatda davom etadi</title>
  <rect x="0" y="0" width="820" height="460" fill="#f8fafc"/>
  <text x="410" y="34" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">conversation.form.* validatsiya tsikli</text>
  <text x="410" y="58" font-family="Segoe UI" font-size="14" fill="#64748b" text-anchor="middle">form maydoni tip mos kelmaguncha qayta-qayta so'raydi (otherwise)</text>

  <!-- markaziy form maydoni -->
  <rect x="300" y="90" width="220" height="70" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="410" y="120" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">form.int({ otherwise })</text>
  <text x="410" y="144" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">"Yoshingiz?" javobini kutadi</text>

  <!-- kelgan xabar tekshiruvi -->
  <path d="M410,160 L410,200" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <polygon points="410,205 520,255 410,305 300,255" fill="#fef9c3" stroke="#f59e0b" stroke-width="2"/>
  <text x="410" y="250" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">butun songa</text>
  <text x="410" y="270" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">aylanadimi?</text>

  <!-- HA shoxi -->
  <path d="M520,255 L640,255" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="580" y="245" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">HA</text>
  <rect x="640" y="225" width="150" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="715" y="252" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">qiymat qaytadi</text>
  <text x="715" y="272" font-family="Segoe UI" font-size="13" fill="#16a34a" text-anchor="middle">suhbat davom etadi</text>

  <!-- YO'Q shoxi -->
  <path d="M300,255 L180,255" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="240" y="245" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">YO'Q</text>
  <rect x="30" y="215" width="150" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="105" y="242" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">otherwise(ctx)</text>
  <text x="105" y="263" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">"Faqat son</text>
  <text x="105" y="281" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">kiriting" deydi</text>

  <!-- otherwise -> qayta kutish loop -->
  <path d="M105,215 C105,140 230,120 300,118" stroke="#dc2626" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="160" y="135" font-family="Segoe UI" font-size="13" fill="#dc2626">qayta kutadi (loop)</text>

  <!-- pastki izoh -->
  <rect x="60" y="345" width="700" height="90" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="80" y="372" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Tayyor form maydonlari:</text>
  <text x="80" y="396" font-family="Segoe UI" font-size="13" fill="#334155">.text() — matn &#160;·&#160; .number() — float &#160;·&#160; .int() — butun son &#160;·&#160; .select([...]) — ro'yxatdan</text>
  <text x="80" y="418" font-family="Segoe UI" font-size="13" fill="#334155">.photo() / .file() — media &#160;·&#160; har biri ixtiyoriy { otherwise } bilan o'z validatsiyasini boshqaradi</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
</svg>
