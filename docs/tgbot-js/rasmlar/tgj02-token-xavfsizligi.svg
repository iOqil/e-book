<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360">
  <title>Token xavfsizligi: kodga yozish (xato) va .env faylda saqlash (to'g'ri)</title>
  <rect x="0" y="0" width="760" height="360" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI" font-size="19" font-weight="bold" fill="#1e293b">Token qayerda turishi kerak?</text>

  <!-- LEFT: bad -->
  <rect x="30" y="64" width="340" height="256" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="200" y="92" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">Kodga yozish</text>
  <text x="200" y="113" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#dc2626">xato — xavfli</text>

  <rect x="54" y="130" width="292" height="72" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="68" y="154" font-family="Segoe UI" font-size="13" fill="#334155">// bot.js</text>
  <text x="68" y="176" font-family="Segoe UI" font-size="13" fill="#1e293b">new Bot("8012:AAH-secret...")</text>
  <text x="68" y="194" font-family="Segoe UI" font-size="13" fill="#dc2626">token ochiq turibdi</text>

  <text x="68" y="232" font-family="Segoe UI" font-size="13" fill="#334155">git commit -&gt; GitHub</text>
  <text x="68" y="256" font-family="Segoe UI" font-size="13" fill="#dc2626">token butun dunyoga ochiladi</text>
  <text x="68" y="280" font-family="Segoe UI" font-size="13" fill="#dc2626">robotlar botni egallaydi</text>
  <text x="68" y="304" font-family="Segoe UI" font-size="13" fill="#dc2626">tarixdan o'chirish qiyin</text>

  <!-- RIGHT: good -->
  <rect x="390" y="64" width="340" height="256" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="560" y="92" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">.env faylda</text>
  <text x="560" y="113" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">to'g'ri — xavfsiz</text>

  <rect x="414" y="130" width="292" height="48" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="428" y="150" font-family="Segoe UI" font-size="13" fill="#334155"># .env</text>
  <text x="428" y="170" font-family="Segoe UI" font-size="13" fill="#1e293b">BOT_TOKEN=8012:AAH-secret...</text>

  <rect x="414" y="188" width="292" height="40" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="428" y="208" font-family="Segoe UI" font-size="13" fill="#334155"># .gitignore</text>
  <text x="560" y="208" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">.env</text>

  <rect x="414" y="238" width="292" height="38" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="428" y="262" font-family="Segoe UI" font-size="13" fill="#1e293b">new Bot(process.env.BOT_TOKEN)</text>

  <text x="428" y="300" font-family="Segoe UI" font-size="13" fill="#16a34a">token git'ga hech qachon tushmaydi</text>

  <!-- divider -->
  <line x1="380" y1="70" x2="380" y2="314" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
</svg>
