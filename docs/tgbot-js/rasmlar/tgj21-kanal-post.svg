<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380">
  <title>Bot kanalga post yuborish oqimi: bot kanalda admin bo'lishi shart, sendMessage @username yoki -100 ID bilan, natijada kanal posti paydo bo'ladi</title>
  <rect x="0" y="0" width="760" height="380" fill="#f8fafc"/>

  <text x="380" y="34" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Bot kanalga post yuboradi</text>

  <!-- Bot quticha -->
  <rect x="40" y="80" width="180" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="110" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">Bot</text>
  <text x="130" y="138" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">ctx.api.sendMessage(</text>
  <text x="130" y="160" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">"@kanal" yoki</text>
  <text x="130" y="180" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">-100... , matn)</text>

  <!-- Shart: admin -->
  <rect x="290" y="80" width="180" height="120" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="108" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">SHART</text>
  <text x="380" y="136" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">Bot kanalda</text>
  <text x="380" y="158" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">administrator</text>
  <text x="380" y="180" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">("Post yuborish")</text>

  <!-- Kanal -->
  <rect x="540" y="80" width="180" height="120" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="630" y="110" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a" text-anchor="middle">Kanal</text>
  <text x="630" y="138" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">@kanal_username</text>
  <text x="630" y="160" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">id: -100123...</text>
  <text x="630" y="182" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">Yangi post paydo</text>

  <!-- Strelkalar -->
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <line x1="220" y1="140" x2="288" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="470" y1="140" x2="538" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Pastki paneldagi update -->
  <rect x="40" y="250" width="680" height="100" rx="10" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="280" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Teskari yo'nalish (bot admin bo'lsa):</text>
  <text x="60" y="308" font-family="Segoe UI" font-size="14" fill="#334155">Kanalda har yangi post -&gt; bot.on("channel_post") update oladi</text>
  <text x="60" y="332" font-family="Segoe UI" font-size="14" fill="#334155">ctx.channelPost.text — postni o'qiymiz; tahrir -&gt; edited_channel_post</text>
</svg>
