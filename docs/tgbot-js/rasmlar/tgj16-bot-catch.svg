<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440">
  <title>Xato oqimi: handler throw -> bot.start/runner bot.catch chaqiradi, lekin handleUpdate BotError sifatida yuqoriga otadi</title>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="32" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Handler ichida xato otildi (throw)</text>

  <!-- handler box -->
  <rect x="300" y="54" width="160" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="380" y="78" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">handler throw</text>
  <text x="380" y="98" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">new Error(...)</text>

  <!-- split: how was update fed? -->
  <text x="380" y="138" font-family="Segoe UI" font-size="14" fill="#64748b" text-anchor="middle">Update qanday uzatilgan edi?</text>

  <line x1="340" y1="110" x2="190" y2="166" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="420" y1="110" x2="575" y2="166" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>

  <!-- LEFT: bot.start / runner -->
  <rect x="40" y="170" width="300" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="190" y="196" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#166534" text-anchor="middle">bot.start() yoki runner</text>
  <text x="190" y="218" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">(jonli polling -- production)</text>
  <text x="190" y="238" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">xatoni o'zi ushlab beradi</text>

  <rect x="60" y="300" width="260" height="74" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="190" y="326" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#166534" text-anchor="middle">bot.catch((err) =&gt; ...)</text>
  <text x="190" y="348" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">CHAQIRILADI -- bot ishlashda</text>
  <text x="190" y="366" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">davom etadi (crash bo'lmaydi)</text>
  <line x1="190" y1="250" x2="190" y2="298" stroke="#16a34a" stroke-width="2" marker-end="url(#arG)"/>

  <!-- RIGHT: handleUpdate -->
  <rect x="420" y="170" width="300" height="80" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="570" y="196" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="middle">await bot.handleUpdate(u)</text>
  <text x="570" y="218" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">(test / webhook -- qo'lda)</text>
  <text x="570" y="238" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">bot.catch CHAQIRILMAYDI</text>

  <rect x="440" y="300" width="260" height="74" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="570" y="326" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="middle">BotError yuqoriga otiladi</text>
  <text x="570" y="348" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">try / catch bilan O'ZINGIZ</text>
  <text x="570" y="366" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">tutasiz (err.error -- asl xato)</text>
  <line x1="570" y1="250" x2="570" y2="298" stroke="#dc2626" stroke-width="2" marker-end="url(#arR)"/>

  <text x="380" y="408" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">Xulosa: test'da handleUpdate'ni try/catch'ga oling; bot.catch faqat start()/runner uchun.</text>
  <text x="380" y="428" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">Lokal qism uchun: bot.errorBoundary (9-bob).</text>
</svg>
