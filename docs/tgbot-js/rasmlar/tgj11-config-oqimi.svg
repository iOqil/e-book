<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450">
  <title>Konfiguratsiya oqimi: .env fayl config.js tomonidan o'qiladi va validatsiya qilinadi; token yo'q bo'lsa dastur to'xtaydi, aks holda muzlatilgan config obyekti butun ilovaga tarqaladi</title>
  <rect x="0" y="0" width="760" height="450" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI" font-size="19" font-weight="bold" fill="#1e293b">Konfiguratsiya oqimi: .env -> config -> butun ilova</text>

  <!-- .env -->
  <rect x="40" y="86" width="170" height="92" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="125" y="112" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">.env</text>
  <text x="125" y="136" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">BOT_TOKEN=...</text>
  <text x="125" y="156" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">ADMIN_ID=...</text>

  <!-- arrow -->
  <line x1="210" y1="132" x2="296" y2="132" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <text x="253" y="122" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">o'qish</text>

  <!-- config.js validator -->
  <rect x="300" y="80" width="220" height="104" rx="10" fill="#2563eb"/>
  <text x="410" y="108" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#ffffff">config.js</text>
  <text x="410" y="132" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dbeafe">loadConfig(env)</text>
  <text x="410" y="154" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dbeafe">VALIDATSIYA qiladi</text>
  <text x="410" y="174" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#bfdbfe">Object.freeze(...)</text>

  <!-- branch: missing token -> stop -->
  <line x1="410" y1="184" x2="410" y2="232" stroke="#dc2626" stroke-width="2" marker-end="url(#arRed)"/>
  <rect x="280" y="234" width="260" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="410" y="258" text-anchor="middle" font-family="Segoe UI" font-size="13.5" font-weight="bold" fill="#b91c1c">TOKEN yo'q -> throw Error</text>
  <text x="410" y="278" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#7f1d1d">dastur DARHOL to'xtaydi (fail-fast)</text>

  <!-- branch: ok -> config object -->
  <line x1="520" y1="132" x2="600" y2="132" stroke="#16a34a" stroke-width="2" marker-end="url(#arGreen)"/>
  <text x="560" y="122" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">ok</text>
  <rect x="604" y="92" width="130" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="669" y="120" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#15803d">config</text>
  <text x="669" y="142" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">obyekti</text>
  <text x="669" y="160" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">(muzlatilgan)</text>

  <!-- config spreads to app -->
  <line x1="669" y1="172" x2="669" y2="320" stroke="#16a34a" stroke-width="2"/>
  <line x1="200" y1="320" x2="669" y2="320" stroke="#16a34a" stroke-width="2"/>
  <g font-family="Segoe UI">
    <rect x="60" y="330" width="180" height="56" rx="9" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="150" y="354" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#15803d">bot.js</text>
    <text x="150" y="374" text-anchor="middle" font-size="13" fill="#334155">new Bot(config.botToken)</text>

    <rect x="290" y="330" width="180" height="56" rx="9" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="380" y="354" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#15803d">middlewares/</text>
    <text x="380" y="374" text-anchor="middle" font-size="13" fill="#334155">ctx.config = config</text>

    <rect x="520" y="330" width="180" height="56" rx="9" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="610" y="354" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#15803d">services/</text>
    <text x="610" y="374" text-anchor="middle" font-size="13" fill="#334155">DB(config.dbPath)</text>
  </g>
  <line x1="150" y1="320" x2="150" y2="326" stroke="#16a34a" stroke-width="2" marker-end="url(#arGreen)"/>
  <line x1="380" y1="320" x2="380" y2="326" stroke="#16a34a" stroke-width="2" marker-end="url(#arGreen)"/>
  <line x1="610" y1="320" x2="610" y2="326" stroke="#16a34a" stroke-width="2" marker-end="url(#arGreen)"/>

  <text x="380" y="418" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Yagona manba (single source of truth): konfiguratsiya bitta joyda o'qiladi va tekshiriladi</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/></marker>
    <marker id="arRed" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/></marker>
    <marker id="arGreen" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
  </defs>
</svg>
