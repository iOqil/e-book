<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430">
  <title>To'lov handlerlari: pre_checkout_query handler (10s, true/false) va message:successful_payment handler (fulfillment)</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI" font-size="19" font-weight="bold" fill="#1e293b">Ikki muhim handler</text>

  <defs>
    <marker id="ah" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="ahg" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#16a34a"/></marker>
    <marker id="ahr" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#dc2626"/></marker>
  </defs>

  <!-- Handler 1: pre_checkout_query -->
  <rect x="40" y="64" width="680" height="150" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="92" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">bot.on("pre_checkout_query", ...)</text>
  <text x="60" y="114" font-family="Segoe UI" font-size="13" fill="#64748b">To'lovdan OLDIN keladi — "tovar hali bormi?" Javob 10s ichida SHART.</text>

  <!-- decision box -->
  <rect x="60" y="128" width="220" height="68" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="170" y="152" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#b45309">Tovar bormi / narx to'g'rimi?</text>
  <text x="170" y="176" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">payload bo'yicha tekshir</text>

  <!-- true branch -->
  <rect x="330" y="128" width="170" height="30" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="415" y="148" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#15803d">answerPreCheckoutQuery(true)</text>
  <line x1="280" y1="150" x2="328" y2="143" stroke="#16a34a" stroke-width="2" marker-end="url(#ahg)"/>

  <!-- false branch -->
  <rect x="330" y="166" width="290" height="30" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="475" y="186" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#dc2626">answerPreCheckoutQuery(false, { error_message })</text>
  <line x1="280" y1="172" x2="328" y2="181" stroke="#dc2626" stroke-width="2" marker-end="url(#ahr)"/>

  <text x="535" y="148" font-family="Segoe UI" font-size="13" fill="#15803d">&#8594; to'lov davom etadi</text>

  <!-- Arrow down to handler 2 -->
  <line x1="380" y1="214" x2="380" y2="256" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="396" y="240" font-family="Segoe UI" font-size="13" fill="#64748b">true bo'lsa, pul yechiladi va...</text>

  <!-- Handler 2: successful_payment -->
  <rect x="40" y="262" width="680" height="120" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="60" y="290" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#15803d">bot.on("message:successful_payment", ...)</text>
  <text x="60" y="312" font-family="Segoe UI" font-size="13" fill="#64748b">To'lov MUVAFFAQIYATLI bo'lgach keladi — endi tovarni yetkazasiz.</text>

  <rect x="60" y="324" width="300" height="44" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="210" y="343" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">ctx.message.successful_payment</text>
  <text x="210" y="361" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">payload + telegram_payment_charge_id</text>

  <rect x="380" y="324" width="320" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="540" y="343" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Tovarni ber (idempotent):</text>
  <text x="540" y="361" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">charge_id bir marta bajarilsin</text>

  <!-- Bottom warning -->
  <text x="380" y="408" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#dc2626">pre_checkout'ga javob bermasangiz, successful_payment HECH QACHON kelmaydi</text>
</svg>
