<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440">
  <title>Telegram suhbat turlari: private, group, supergroup, channel — chat.id belgisi va bot.chatType filtri</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">ctx.chat.type — to'rt suhbat turi</text>

  <!-- private -->
  <rect x="30" y="60" width="160" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="88" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">private</text>
  <text x="110" y="112" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">1 foydalanuvchi</text>
  <text x="110" y="130" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">bilan shaxsiy</text>
  <text x="110" y="160" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">chat.id &gt; 0</text>
  <text x="110" y="182" font-family="Segoe UI" font-size="13" fill="#16a34a" text-anchor="middle">musbat</text>

  <!-- group -->
  <rect x="210" y="60" width="160" height="150" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="290" y="88" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a" text-anchor="middle">group</text>
  <text x="290" y="112" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">oddiy (eski,</text>
  <text x="290" y="130" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">kichik) guruh</text>
  <text x="290" y="160" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">chat.id &lt; 0</text>
  <text x="290" y="182" font-family="Segoe UI" font-size="13" fill="#dc2626" text-anchor="middle">manfiy</text>

  <!-- supergroup -->
  <rect x="390" y="60" width="160" height="150" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="470" y="88" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a" text-anchor="middle">supergroup</text>
  <text x="470" y="112" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">katta guruh:</text>
  <text x="470" y="130" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">admin, mavzular</text>
  <text x="470" y="160" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">-100... bilan</text>
  <text x="470" y="182" font-family="Segoe UI" font-size="13" fill="#dc2626" text-anchor="middle">manfiy</text>

  <!-- channel -->
  <rect x="570" y="60" width="160" height="150" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="650" y="88" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">channel</text>
  <text x="650" y="112" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">kanal — bir</text>
  <text x="650" y="130" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">tomonlama e'lon</text>
  <text x="650" y="160" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">-100... bilan</text>
  <text x="650" y="182" font-family="Segoe UI" font-size="13" fill="#dc2626" text-anchor="middle">manfiy</text>

  <!-- auto-convert arrow group -> supergroup -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#16a34a"/>
    </marker>
  </defs>
  <line x1="370" y1="135" x2="388" y2="135" stroke="#16a34a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="380" y="232" font-family="Segoe UI" font-size="13" fill="#16a34a" text-anchor="middle">guruh kattalashsa: group -&gt; supergroup avtomatik (id ham o'zgaradi)</text>

  <!-- code box -->
  <rect x="60" y="262" width="640" height="140" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="380" y="288" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">bot.chatType(...) bilan filtrlash</text>
  <line x1="80" y1="300" x2="680" y2="300" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="328" font-family="Segoe UI" font-size="14" fill="#16a34a">bot.chatType(["group", "supergroup"])  // guruhlar — DOIM ikkalasi</text>
  <text x="80" y="356" font-family="Segoe UI" font-size="14" fill="#2563eb">bot.chatType("private")                // shaxsiy</text>
  <text x="80" y="384" font-family="Segoe UI" font-size="14" fill="#b45309">bot.chatType("channel")                // kanal post</text>
</svg>
