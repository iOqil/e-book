<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420">
  <title>Inline tugmalar bilan sahifalash: bitta xabar editMessageText bilan yangilanadi</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI" font-size="19" font-weight="bold" fill="#1e293b">Sahifalash: bitta xabar, navigatsiya tugmalari</text>

  <!-- sahifa 1 -->
  <rect x="40" y="64" width="300" height="298" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="190" y="92" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">Mahsulotlar (sahifa 1/5)</text>
  <rect x="60" y="108" width="260" height="26" rx="5" fill="#eff6ff"/>
  <text x="72" y="126" font-family="Segoe UI" font-size="13" fill="#334155">• Mahsulot 1</text>
  <rect x="60" y="140" width="260" height="26" rx="5" fill="#eff6ff"/>
  <text x="72" y="158" font-family="Segoe UI" font-size="13" fill="#334155">• Mahsulot 2</text>
  <rect x="60" y="172" width="260" height="26" rx="5" fill="#eff6ff"/>
  <text x="72" y="190" font-family="Segoe UI" font-size="13" fill="#334155">• Mahsulot 3 ... 5</text>
  <!-- nav -->
  <rect x="120" y="296" width="74" height="34" rx="8" fill="#e0e7ff" stroke="#94a3b8"/>
  <text x="157" y="318" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">1/5</text>
  <rect x="202" y="296" width="74" height="34" rx="8" fill="#2563eb"/>
  <text x="239" y="318" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff">&gt;&gt;</text>
  <text x="190" y="350" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">birinchi sahifada "&lt;&lt;" yo'q</text>

  <!-- o'q -->
  <line x1="346" y1="210" x2="412" y2="210" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>
  <text x="379" y="196" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a">editMessageText</text>
  <text x="379" y="232" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">callback: "page:1"</text>

  <!-- sahifa 2 -->
  <rect x="420" y="64" width="300" height="298" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="570" y="92" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">Mahsulotlar (sahifa 2/5)</text>
  <rect x="440" y="108" width="260" height="26" rx="5" fill="#eff6ff"/>
  <text x="452" y="126" font-family="Segoe UI" font-size="13" fill="#334155">• Mahsulot 6</text>
  <rect x="440" y="140" width="260" height="26" rx="5" fill="#eff6ff"/>
  <text x="452" y="158" font-family="Segoe UI" font-size="13" fill="#334155">• Mahsulot 7</text>
  <rect x="440" y="172" width="260" height="26" rx="5" fill="#eff6ff"/>
  <text x="452" y="190" font-family="Segoe UI" font-size="13" fill="#334155">• Mahsulot 8 ... 10</text>
  <rect x="478" y="296" width="60" height="34" rx="8" fill="#2563eb"/>
  <text x="508" y="318" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff">&lt;&lt;</text>
  <rect x="546" y="296" width="60" height="34" rx="8" fill="#e0e7ff" stroke="#94a3b8"/>
  <text x="576" y="318" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">2/5</text>
  <rect x="614" y="296" width="60" height="34" rx="8" fill="#2563eb"/>
  <text x="644" y="318" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff">&gt;&gt;</text>
  <text x="570" y="350" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">ikkala yo'nalish ham bor</text>

  <!-- pastki izoh -->
  <rect x="40" y="378" width="680" height="32" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="380" y="399" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">Har tugma callback_data ichida sahifa raqamini olib yuradi: `page:${n}` (qisqa, &lt;64 bayt)</text>

  <defs>
    <marker id="g" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#16a34a"/></marker>
  </defs>
</svg>
