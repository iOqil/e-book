<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500">
  <title>Docker bilan deploy: Dockerfile (node:24-alpine, npm ci, CMD) -> image -> container; sirlar env orqali, .dockerignore node_modules va .env ni chiqaradi; docker compose bot + DB</title>
  <rect x="0" y="0" width="760" height="500" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI" font-size="19" font-weight="bold" fill="#1e293b">Docker bilan botni paketlash va ishga tushirish</text>

  <!-- Source files -->
  <rect x="40" y="62" width="190" height="150" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="135" y="88" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Loyiha fayllari</text>
  <text x="58" y="112" font-family="Segoe UI" font-size="13" fill="#334155">- bot.js, src/</text>
  <text x="58" y="134" font-family="Segoe UI" font-size="13" fill="#334155">- package.json</text>
  <text x="58" y="156" font-family="Segoe UI" font-size="13" fill="#334155">- package-lock.json</text>
  <text x="58" y="178" font-family="Segoe UI" font-size="13" fill="#dc2626">- .env (NUSXALANMAYDI)</text>
  <text x="58" y="200" font-family="Segoe UI" font-size="13" fill="#dc2626">- node_modules (skip)</text>

  <!-- Dockerfile -->
  <rect x="285" y="62" width="200" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="385" y="88" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">Dockerfile</text>
  <text x="300" y="112" font-family="Segoe UI" font-size="13" fill="#334155">FROM node:24-alpine</text>
  <text x="300" y="132" font-family="Segoe UI" font-size="13" fill="#334155">COPY package*.json ./</text>
  <text x="300" y="152" font-family="Segoe UI" font-size="13" fill="#334155">RUN npm ci --omit=dev</text>
  <text x="300" y="172" font-family="Segoe UI" font-size="13" fill="#334155">COPY . .</text>
  <text x="300" y="192" font-family="Segoe UI" font-size="13" fill="#334155">CMD ["node","bot.js"]</text>

  <!-- Image -->
  <rect x="540" y="62" width="180" height="150" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="630" y="88" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">Image</text>
  <text x="630" y="112" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">docker build -t bot .</text>
  <text x="630" y="140" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">o'zgarmas paket:</text>
  <text x="630" y="160" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Node + kod +</text>
  <text x="630" y="180" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">bog'liqliklar</text>

  <line x1="230" y1="120" x2="281" y2="120" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ad17)"/>
  <line x1="485" y1="137" x2="536" y2="137" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ad17)"/>

  <!-- .dockerignore note -->
  <rect x="40" y="226" width="445" height="56" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="60" y="250" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#b45309">.dockerignore:</text>
  <text x="60" y="272" font-family="Segoe UI" font-size="13" fill="#334155">node_modules / .env / .git -> image'ga TUSHMAYDI (xavfsiz + yengil)</text>

  <!-- compose: bot + db running -->
  <rect x="40" y="300" width="680" height="156" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="326" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">docker compose up — bot + DB birga ishga tushadi</text>

  <rect x="90" y="344" width="240" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="210" y="370" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">container: bot</text>
  <text x="210" y="392" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">BOT_TOKEN env orqali</text>
  <text x="210" y="412" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">restart: unless-stopped</text>

  <rect x="430" y="344" width="240" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="550" y="370" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">container: db</text>
  <text x="550" y="392" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">postgres / volume</text>
  <text x="550" y="412" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">ma'lumot saqlanadi</text>

  <line x1="330" y1="389" x2="426" y2="389" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ad17)"/>
  <text x="378" y="382" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">ulanish</text>

  <text x="380" y="484" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">Sir (token) HECH QACHON Dockerfile/kodga yozilmaydi -> faqat env yoki secret manager</text>

  <defs>
    <marker id="ad17" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/></marker>
  </defs>
</svg>
