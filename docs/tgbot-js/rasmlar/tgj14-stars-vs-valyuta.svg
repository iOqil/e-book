<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400">
  <title>Telegram Stars (XTR) va oddiy valyuta (UZS/USD) farqi: provider_token, tovar turi, amount birligi</title>
  <rect x="0" y="0" width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI" font-size="19" font-weight="bold" fill="#1e293b">Stars (XTR) va oddiy valyuta farqi</text>

  <!-- Left column: Stars -->
  <rect x="32" y="60" width="332" height="300" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="198" y="90" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#b45309">Telegram Stars (XTR)</text>
  <line x1="56" y1="104" x2="340" y2="104" stroke="#94a3b8" stroke-width="1"/>

  <text x="56" y="134" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">currency:</text>
  <text x="160" y="134" font-family="Segoe UI" font-size="14" fill="#16a34a">"XTR"</text>

  <text x="56" y="166" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">provider_token:</text>
  <text x="200" y="166" font-family="Segoe UI" font-size="14" fill="#16a34a">"" (bo'sh)</text>

  <text x="56" y="198" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">amount:</text>
  <text x="160" y="198" font-family="Segoe UI" font-size="14" fill="#334155">butun son (Stars)</text>

  <text x="56" y="230" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">tovar turi:</text>
  <text x="56" y="252" font-family="Segoe UI" font-size="13" fill="#334155">faqat RAQAMLI tovar/xizmat</text>

  <text x="56" y="284" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">qaytarish:</text>
  <text x="56" y="306" font-family="Segoe UI" font-size="13" fill="#334155">refundStarPayment bilan mumkin</text>

  <text x="56" y="338" font-family="Segoe UI" font-size="13" fill="#64748b">Sozlash shart emas — darhol ishlaydi</text>

  <!-- Right column: Oddiy valyuta -->
  <rect x="396" y="60" width="332" height="300" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="562" y="90" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#2563eb">Oddiy valyuta (UZS/USD)</text>
  <line x1="420" y1="104" x2="704" y2="104" stroke="#94a3b8" stroke-width="1"/>

  <text x="420" y="134" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">currency:</text>
  <text x="524" y="134" font-family="Segoe UI" font-size="14" fill="#2563eb">"UZS" / "USD"</text>

  <text x="420" y="166" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">provider_token:</text>
  <text x="564" y="166" font-family="Segoe UI" font-size="14" fill="#dc2626">BotFather'dan</text>

  <text x="420" y="198" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">amount:</text>
  <text x="524" y="198" font-family="Segoe UI" font-size="14" fill="#334155">tiyin/sent (x100)</text>

  <text x="420" y="230" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">tovar turi:</text>
  <text x="420" y="252" font-family="Segoe UI" font-size="13" fill="#334155">jismoniy va raqamli tovar</text>

  <text x="420" y="284" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">qaytarish:</text>
  <text x="420" y="306" font-family="Segoe UI" font-size="13" fill="#334155">provider qoidalari bo'yicha</text>

  <text x="420" y="338" font-family="Segoe UI" font-size="13" fill="#64748b">Provider ulash kerak (Stripe, h.k.)</text>

  <!-- VS badge -->
  <circle cx="380" cy="210" r="24" fill="#1e293b"/>
  <text x="380" y="216" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#ffffff">VS</text>
