<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400">
  <title>Bog'langan muhokama guruhi: kanal posti avtomatik ravishda bog'langan guruhga forward bo'ladi, bu xabarda is_automatic_forward true bo'ladi</title>
  <rect x="0" y="0" width="760" height="400" fill="#f8fafc"/>

  <text x="380" y="34" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Kanal + bog'langan muhokama guruhi</text>

  <!-- Kanal -->
  <rect x="60" y="80" width="240" height="150" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="180" y="112" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#16a34a" text-anchor="middle">Kanal</text>
  <text x="180" y="140" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">@mening_kanalim</text>
  <rect x="84" y="156" width="192" height="56" rx="6" fill="#f0fdf4" stroke="#94a3b8" stroke-width="1"/>
  <text x="180" y="180" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">Yangi post:</text>
  <text x="180" y="200" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">"Bugungi yangilik..."</text>

  <!-- Guruh -->
  <rect x="460" y="80" width="240" height="150" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="580" y="112" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#2563eb" text-anchor="middle">Muhokama guruhi</text>
  <text x="580" y="140" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">(supergroup)</text>
  <rect x="484" y="156" width="192" height="56" rx="6" fill="#eff6ff" stroke="#94a3b8" stroke-width="1"/>
  <text x="580" y="178" font-family="Segoe UI" font-size="13" fill="#2563eb" text-anchor="middle">Forwarded from kanal</text>
  <text x="580" y="200" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">"Bugungi yangilik..."</text>

  <!-- Avtomatik forward strelka -->
  <defs>
    <marker id="ar2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
  </defs>
  <line x1="300" y1="155" x2="458" y2="155" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#ar2)"/>
  <text x="380" y="145" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">avtomatik</text>

  <!-- Izoh paneli -->
  <rect x="60" y="270" width="640" height="100" rx="10" fill="#fffbeb" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="80" y="300" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#b45309">Guruhga tushgan bu xabarda:</text>
  <text x="80" y="328" font-family="Segoe UI" font-size="14" fill="#334155">ctx.message.is_automatic_forward === true</text>
  <text x="80" y="352" font-family="Segoe UI" font-size="14" fill="#334155">ctx.message.sender_chat — manba kanal; shunday xabarni filtrlash mumkin</text>
</svg>
