<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360">
  <title>Bot obyekti: Telegram bilan aloqa va middleware steki bir joyda</title>
  <rect x="0" y="0" width="760" height="360" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI" font-size="19" font-weight="bold" fill="#1e293b">Bot obyekti ikki vazifani birlashtiradi</text>

  <!-- central Bot box -->
  <rect x="290" y="64" width="180" height="64" rx="12" fill="#2563eb"/>
  <text x="380" y="92" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#ffffff">const bot =</text>
  <text x="380" y="114" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#e0e7ff">new Bot(BOT_TOKEN)</text>

  <!-- left: api (aloqa) -->
  <rect x="40" y="180" width="320" height="150" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="200" y="208" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">1. Telegram bilan aloqa</text>
  <text x="200" y="230" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">bot.api.*</text>
  <text x="60" y="256" font-family="Segoe UI" font-size="13" fill="#334155">bot.api.sendMessage(id, "...")</text>
  <text x="60" y="278" font-family="Segoe UI" font-size="13" fill="#334155">bot.api.getMe()</text>
  <text x="60" y="300" font-family="Segoe UI" font-size="13" fill="#334155">bot.api.sendPhoto(...)</text>
  <text x="60" y="320" font-family="Segoe UI" font-size="13" fill="#64748b">= Telegram metodlarini chaqirish</text>

  <!-- right: middleware (steki) -->
  <rect x="400" y="180" width="320" height="150" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="560" y="208" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#b45309">2. Middleware steki</text>
  <text x="560" y="230" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">handlerlar shu yerda</text>
  <text x="420" y="256" font-family="Segoe UI" font-size="13" fill="#334155">bot.command("start", ...)</text>
  <text x="420" y="278" font-family="Segoe UI" font-size="13" fill="#334155">bot.on("message:text", ...)</text>
  <text x="420" y="300" font-family="Segoe UI" font-size="13" fill="#334155">bot.use(...)</text>
  <text x="420" y="320" font-family="Segoe UI" font-size="13" fill="#64748b">= kelgan Update'ni qayta ishlash</text>

  <!-- arrows -->
  <line x1="330" y1="128" x2="210" y2="176" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="430" y1="128" x2="550" y2="176" stroke="#f59e0b" stroke-width="2" marker-end="url(#ay)"/>

  <text x="380" y="155" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">bitta obyekt, ikki rol</text>

  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
    <marker id="ay" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f59e0b"/></marker>
  </defs>
</svg>
