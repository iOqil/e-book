<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420">
  <title>forwardMessage va copyMessage taqqoslash: forward manbani ko'rsatadi (Forwarded from), copy esa ko'rsatmaydi va bot o'z nomidan yuboradi</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>

  <text x="380" y="34" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">forwardMessage  vs  copyMessage</text>

  <!-- Chap: forward -->
  <rect x="30" y="60" width="340" height="320" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="92" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#2563eb" text-anchor="middle">ctx.forwardMessage(toChatId)</text>
  <text x="200" y="118" font-family="Segoe UI" font-size="14" fill="#64748b" text-anchor="middle">manbani KO'RSATADI</text>

  <!-- forward xabar kartochkasi -->
  <rect x="60" y="140" width="280" height="120" rx="8" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="78" y="168" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">Forwarded from Mening kanalim</text>
  <line x1="78" y1="180" x2="322" y2="180" stroke="#94a3b8" stroke-width="1"/>
  <text x="78" y="206" font-family="Segoe UI" font-size="14" fill="#334155">Aksiya boshlandi! 50% chegirma</text>
  <text x="78" y="230" font-family="Segoe UI" font-size="14" fill="#334155">faqat shu hafta.</text>

  <text x="200" y="300" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">+ Original muallif/kanal nomi</text>
  <text x="200" y="324" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">qoladi (atribut saqlanadi)</text>
  <text x="200" y="356" font-family="Segoe UI" font-size="14" fill="#64748b" text-anchor="middle">payload: from_chat_id + message_id</text>

  <!-- O'ng: copy -->
  <rect x="390" y="60" width="340" height="320" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="560" y="92" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#16a34a" text-anchor="middle">ctx.copyMessage(toChatId)</text>
  <text x="560" y="118" font-family="Segoe UI" font-size="14" fill="#64748b" text-anchor="middle">manbani KO'RSATMAYDI</text>

  <!-- copy xabar kartochkasi -->
  <rect x="420" y="140" width="280" height="120" rx="8" fill="#f0fdf4" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="438" y="168" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">Mening botim</text>
  <line x1="438" y1="180" x2="682" y2="180" stroke="#94a3b8" stroke-width="1"/>
  <text x="438" y="206" font-family="Segoe UI" font-size="14" fill="#334155">Aksiya boshlandi! 50% chegirma</text>
  <text x="438" y="230" font-family="Segoe UI" font-size="14" fill="#334155">faqat shu hafta.</text>

  <text x="560" y="300" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">Bot o'z nomidan yuboradi —</text>
  <text x="560" y="324" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">"yangi" xabardek ko'rinadi</text>
  <text x="560" y="356" font-family="Segoe UI" font-size="14" fill="#64748b" text-anchor="middle">payload: from_chat_id + message_id</text>
</svg>
