<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400">
  <title>Update oqimi: foydalanuvchidan grammY handler funksiyasigacha</title>
  <rect x="0" y="0" width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI" font-size="19" font-weight="bold" fill="#1e293b">Update oqimi: foydalanuvchidan handler'gacha</text>

  <!-- User -->
  <rect x="30" y="68" width="140" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="100" y="98" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Foydalanuvchi</text>
  <text x="100" y="120" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">"/start" yozadi</text>

  <!-- Telegram server -->
  <rect x="235" y="68" width="160" height="70" rx="10" fill="#2563eb"/>
  <text x="315" y="98" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff">Telegram serveri</text>
  <text x="315" y="120" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#e0e7ff">Update saqlaydi</text>

  <!-- Bot program -->
  <rect x="460" y="68" width="160" height="70" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="540" y="96" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Bot dasturingiz</text>
  <text x="540" y="118" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">getUpdates (polling)</text>

  <!-- top arrows -->
  <line x1="170" y1="103" x2="231" y2="103" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="460" y1="118" x2="399" y2="118" stroke="#16a34a" stroke-width="2" marker-end="url(#arg)"/>
  <text x="430" y="136" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">so'rov</text>

  <!-- middleware stek -->
  <rect x="460" y="186" width="270" height="62" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="595" y="212" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#b45309">Middleware steki (bot)</text>
  <text x="595" y="234" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Update -&gt; ctx yasaydi, handlerlarni tekshiradi</text>
  <line x1="540" y1="138" x2="540" y2="182" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- order note -->
  <rect x="460" y="288" width="270" height="62" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="595" y="312" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Tartib bo'yicha taqqoslash</text>
  <text x="595" y="332" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">birinchi mos handler ishlaydi, to'xtaydi</text>
  <line x1="595" y1="248" x2="595" y2="284" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- handlers -->
  <rect x="40" y="186" width="190" height="62" rx="10" fill="#16a34a"/>
  <text x="135" y="212" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#ffffff">bot.command("start")</text>
  <text x="135" y="233" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dcfce7">1-tekshiriladi</text>

  <rect x="40" y="288" width="190" height="62" rx="10" fill="#16a34a"/>
  <text x="135" y="314" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#ffffff">bot.on("message:text")</text>
  <text x="135" y="335" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dcfce7">2-tekshiriladi (echo)</text>

  <line x1="460" y1="300" x2="234" y2="300" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
  <text x="345" y="293" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">mos handler -&gt; ctx.reply</text>

  <text x="135" y="372" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">/start command'ga mos, echo'ga yetib bormaydi</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/></marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
  </defs>
</svg>
