<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440">
  <title>Privacy mode: yoqilgan bo'lsa bot faqat buyruq, mention va reply ko'radi; o'chirilsa hamma xabarni ko'radi</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Privacy mode (BotFather /setprivacy)</text>
  <text x="380" y="56" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">Guruhda bot QAYSI xabarlarni umuman oladi?</text>

  <!-- LEFT: privacy ON -->
  <rect x="30" y="76" width="340" height="320" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="200" y="104" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#16a34a" text-anchor="middle">YOQILGAN (standart)</text>
  <text x="200" y="124" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">bot FAQAT shularni ko'radi:</text>

  <rect x="50" y="138" width="300" height="30" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="64" y="158" font-family="Segoe UI" font-size="13" fill="#16a34a">OK  /buyruq (masalan /start)</text>
  <rect x="50" y="174" width="300" height="30" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="64" y="194" font-family="Segoe UI" font-size="13" fill="#16a34a">OK  @bot_username mention</text>
  <rect x="50" y="210" width="300" height="30" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="64" y="230" font-family="Segoe UI" font-size="13" fill="#16a34a">OK  bot xabariga reply</text>
  <rect x="50" y="246" width="300" height="30" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="64" y="266" font-family="Segoe UI" font-size="13" fill="#16a34a">OK  xizmat (a'zo qo'shildi/chiqdi)</text>

  <rect x="50" y="290" width="300" height="30" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="64" y="310" font-family="Segoe UI" font-size="13" fill="#dc2626">X   oddiy gap ("salom hammaga")</text>

  <text x="200" y="346" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">Maxfiylik yaxshi: bot suhbatni</text>
  <text x="200" y="364" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">tinglamaydi. Spam-loglar kam.</text>
  <text x="200" y="384" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">can_read_all_group_messages: false</text>

  <!-- RIGHT: privacy OFF -->
  <rect x="390" y="76" width="340" height="320" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="560" y="104" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#dc2626" text-anchor="middle">O'CHIRILGAN</text>
  <text x="560" y="124" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">bot HAMMA xabarni ko'radi:</text>

  <rect x="410" y="138" width="300" height="30" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="424" y="158" font-family="Segoe UI" font-size="13" fill="#16a34a">OK  /buyruq, mention, reply</text>
  <rect x="410" y="174" width="300" height="30" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="424" y="194" font-family="Segoe UI" font-size="13" fill="#16a34a">OK  HAR QANDAY oddiy gap</text>
  <rect x="410" y="210" width="300" height="30" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="424" y="230" font-family="Segoe UI" font-size="13" fill="#16a34a">OK  rasm, fayl, sticker — bari</text>

  <text x="560" y="266" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">Anti-spam, so'z filtri, statistika</text>
  <text x="560" y="284" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">uchun KERAK — bot hammasini o'qiydi.</text>

  <rect x="410" y="300" width="300" height="46" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="424" y="320" font-family="Segoe UI" font-size="13" fill="#b45309">Diqqat: o'zgartirgach botni guruhdan</text>
  <text x="424" y="338" font-family="Segoe UI" font-size="13" fill="#b45309">chiqarib qayta qo'shing (kuchga kirsin).</text>

  <text x="560" y="384" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">can_read_all_group_messages: true</text>

  <text x="380" y="424" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">Botni admin qilish privacy bilan teng emas — admin bo'lsa ham privacy filtri ishlaydi.</text>
</svg>
