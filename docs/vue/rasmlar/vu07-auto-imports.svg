<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470">
  <title>Auto-imports: Nuxt belgilangan papkalarni skanerlab import yozmasdan ishlatish imkonini beradi</title>
  <defs>
    <marker id="vu07a-strelka" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="470" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">Auto-imports: import yozmasdan ishlatish</text>
  <text x="410" y="62" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Nuxt build paytida papkalarni skanerlaydi va kerakli import'larni o'zi qo'shadi</text>

  <!-- Chap: manbalar (papkalar) -->
  <rect x="30" y="92" width="250" height="320" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="155" y="118" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">Skanerlanadigan manbalar</text>

  <rect x="50" y="134" width="210" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="155" y="159" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#1e293b">Vue API: ref, computed</text>

  <rect x="50" y="184" width="210" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="155" y="209" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#1e293b">app/components/</text>

  <rect x="50" y="234" width="210" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="155" y="259" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#1e293b">app/composables/</text>

  <rect x="50" y="284" width="210" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="155" y="309" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#1e293b">app/utils/</text>

  <rect x="50" y="334" width="210" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="155" y="359" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#1e293b">useRoute, useFetch ...</text>

  <!-- O'rta: Nuxt skaner -->
  <rect x="330" y="210" width="160" height="86" rx="12" fill="#2563eb"/>
  <text x="410" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">Nuxt</text>
  <text x="410" y="272" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#f8fafc">auto-import skaner</text>

  <!-- Strelkalar manba -> skaner -->
  <line x1="262" y1="154" x2="326" y2="225" stroke="#475569" stroke-width="2" marker-end="url(#vu07a-strelka)"/>
  <line x1="262" y1="204" x2="326" y2="238" stroke="#475569" stroke-width="2" marker-end="url(#vu07a-strelka)"/>
  <line x1="262" y1="254" x2="326" y2="254" stroke="#475569" stroke-width="2" marker-end="url(#vu07a-strelka)"/>
  <line x1="262" y1="304" x2="326" y2="270" stroke="#475569" stroke-width="2" marker-end="url(#vu07a-strelka)"/>
  <line x1="262" y1="354" x2="326" y2="284" stroke="#475569" stroke-width="2" marker-end="url(#vu07a-strelka)"/>

  <!-- Strelka skaner -> kod -->
  <line x1="494" y1="253" x2="548" y2="253" stroke="#16a34a" stroke-width="2.5" marker-end="url(#vu07a-strelka)"/>

  <!-- O'ng: natija kod -->
  <rect x="552" y="120" width="238" height="270" rx="10" fill="#1e293b"/>
  <text x="571" y="146" font-family="Consolas, Courier New, monospace" font-size="13" fill="#94a3b8">&lt;script setup&gt;</text>
  <text x="571" y="172" font-family="Consolas, Courier New, monospace" font-size="13" fill="#16a34a">// import YO'Q!</text>
  <text x="571" y="202" font-family="Consolas, Courier New, monospace" font-size="13" fill="#f8fafc">const c = <tspan fill="#f59e0b">ref</tspan>(0)</text>
  <text x="571" y="228" font-family="Consolas, Courier New, monospace" font-size="13" fill="#f8fafc">const r = <tspan fill="#f59e0b">useRoute</tspan>()</text>
  <text x="571" y="254" font-family="Consolas, Courier New, monospace" font-size="13" fill="#f8fafc">const { data } =</text>
  <text x="571" y="280" font-family="Consolas, Courier New, monospace" font-size="13" fill="#f8fafc">  await <tspan fill="#f59e0b">useFetch</tspan>(...)</text>
  <text x="571" y="310" font-family="Consolas, Courier New, monospace" font-size="13" fill="#94a3b8">&lt;/script&gt;</text>
  <text x="571" y="346" font-family="Consolas, Courier New, monospace" font-size="13" fill="#f8fafc">&lt;<tspan fill="#f59e0b">MyButton</tspan> /&gt;</text>
  <text x="571" y="372" font-family="Consolas, Courier New, monospace" font-size="13" fill="#16a34a">// komponent ham auto</text>

  <text x="410" y="442" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">nested papka nomi prefiks bo'ladi: base/Button.vue  &#8594;  &lt;BaseButton /&gt;</text>
</svg>
