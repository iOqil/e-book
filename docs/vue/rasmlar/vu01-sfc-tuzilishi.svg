<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <title>SFC tuzilishi — template, script va style bitta .vue faylda</title>

  <rect x="0" y="0" width="720" height="420" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">SFC — Single File Component (.vue)</text>
  <text x="360" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Bitta faylda 3 ta blok: logika, ko'rinish va stil</text>

  <!-- file outline -->
  <rect x="60" y="80" width="600" height="316" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="60" y="80" width="600" height="36" rx="12" fill="#e2e8f0"/>
  <rect x="60" y="100" width="600" height="16" fill="#e2e8f0"/>
  <text x="80" y="104" font-family="monospace" font-size="15" font-weight="bold" fill="#2563eb">Counter.vue</text>

  <!-- script block -->
  <rect x="84" y="132" width="552" height="84" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="100" y="156" font-family="monospace" font-size="15" font-weight="bold" fill="#2563eb">&lt;script setup&gt;</text>
  <text x="110" y="180" font-family="monospace" font-size="14" fill="#1e293b">import { ref } from 'vue'</text>
  <text x="110" y="200" font-family="monospace" font-size="14" fill="#1e293b">const count = ref(0)</text>
  <text x="540" y="156" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">logika</text>

  <!-- template block -->
  <rect x="84" y="226" width="552" height="84" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="100" y="250" font-family="monospace" font-size="15" font-weight="bold" fill="#16a34a">&lt;template&gt;</text>
  <text x="110" y="274" font-family="monospace" font-size="14" fill="#1e293b">&lt;button @click="count++"&gt;</text>
  <text x="110" y="294" font-family="monospace" font-size="14" fill="#1e293b">  Bosildi: {{ count }}</text>
  <text x="540" y="250" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ko'rinish</text>

  <!-- style block -->
  <rect x="84" y="320" width="552" height="62" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="100" y="344" font-family="monospace" font-size="15" font-weight="bold" fill="#f59e0b">&lt;style scoped&gt;</text>
  <text x="110" y="368" font-family="monospace" font-size="14" fill="#1e293b">button { padding: 8px 16px; }</text>
  <text x="540" y="344" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">stil</text>

  <text x="540" y="368" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626" font-weight="bold">scoped = faqat shu komponentga</text>
</svg>
