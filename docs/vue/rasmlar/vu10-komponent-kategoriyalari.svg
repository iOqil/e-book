<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700">
  <title>Nuxt UI komponentlari: 8 kategoriya xaritasi — qaysi guruhda nima bor</title>
  <rect x="0" y="0" width="960" height="700" fill="#f8fafc"/>

  <text x="480" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="bold" fill="#1e293b">Nuxt UI komponentlari — kategoriya xaritasi</text>
  <text x="480" y="60" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">125+ komponent 8 guruhga bo'lingan · hammasi color / variant / size propini qabul qiladi</text>

  <!-- 1. Element -->
  <rect x="24" y="84" width="216" height="170" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="24" y="84" width="216" height="30" rx="10" fill="#2563eb"/>
  <rect x="24" y="100" width="216" height="14" fill="#2563eb"/>
  <text x="132" y="105" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">1 · Element</text>
  <text x="36" y="134" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">asosiy qurilish bloklari</text>
  <text x="36" y="156" font-family="monospace" font-size="13" fill="#1e293b">UButton · UButtonGroup</text>
  <text x="36" y="176" font-family="monospace" font-size="13" fill="#1e293b">UBadge · UAvatar</text>
  <text x="36" y="196" font-family="monospace" font-size="13" fill="#1e293b">UAvatarGroup · UChip</text>
  <text x="36" y="216" font-family="monospace" font-size="13" fill="#1e293b">UIcon · UKbd</text>
  <text x="36" y="236" font-family="monospace" font-size="13" fill="#1e293b">USeparator</text>

  <!-- 2. Feedback -->
  <rect x="256" y="84" width="216" height="170" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <rect x="256" y="84" width="216" height="30" rx="10" fill="#f59e0b"/>
  <rect x="256" y="100" width="216" height="14" fill="#f59e0b"/>
  <text x="364" y="105" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">2 · Feedback</text>
  <text x="268" y="134" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">holat va xabarlar</text>
  <text x="268" y="156" font-family="monospace" font-size="13" fill="#1e293b">UAlert · UBanner</text>
  <text x="268" y="176" font-family="monospace" font-size="13" fill="#1e293b">UProgress · USkeleton</text>
  <text x="268" y="200" font-family="monospace" font-size="13" fill="#dc2626">useToast()</text>
  <text x="268" y="220" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">komponent emas —</text>
  <text x="268" y="238" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">composable, UApp shart</text>

  <!-- 3. Form -->
  <rect x="488" y="84" width="216" height="170" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <rect x="488" y="84" width="216" height="30" rx="10" fill="#16a34a"/>
  <rect x="488" y="100" width="216" height="14" fill="#16a34a"/>
  <text x="596" y="105" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">3 · Form</text>
  <text x="500" y="134" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">SaaS yuragi · Zod validatsiya</text>
  <text x="500" y="156" font-family="monospace" font-size="13" fill="#1e293b">UForm · UFormField</text>
  <text x="500" y="176" font-family="monospace" font-size="13" fill="#1e293b">UInput · UInputNumber</text>
  <text x="500" y="196" font-family="monospace" font-size="13" fill="#1e293b">USelect · USelectMenu</text>
  <text x="500" y="216" font-family="monospace" font-size="13" fill="#1e293b">UCheckbox · USwitch</text>
  <text x="500" y="236" font-family="monospace" font-size="13" fill="#1e293b">URadioGroup · USlider...</text>

  <!-- 4. Data -->
  <rect x="720" y="84" width="216" height="170" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="720" y="84" width="216" height="30" rx="10" fill="#2563eb"/>
  <rect x="720" y="100" width="216" height="14" fill="#2563eb"/>
  <text x="828" y="105" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">4 · Data</text>
  <text x="732" y="134" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ma'lumot ko'rsatish</text>
  <text x="732" y="156" font-family="monospace" font-size="13" fill="#1e293b">UTable (TanStack)</text>
  <text x="732" y="176" font-family="monospace" font-size="13" fill="#1e293b">UCard · UAccordion</text>
  <text x="732" y="196" font-family="monospace" font-size="13" fill="#1e293b">UCarousel · UTree</text>
  <text x="732" y="216" font-family="monospace" font-size="13" fill="#1e293b">UCalendar · UTimeline</text>
  <text x="732" y="236" font-family="monospace" font-size="13" fill="#1e293b">UMarquee</text>

  <!-- 5. Navigation -->
  <rect x="24" y="270" width="216" height="170" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <rect x="24" y="270" width="216" height="30" rx="10" fill="#f59e0b"/>
  <rect x="24" y="286" width="216" height="14" fill="#f59e0b"/>
  <text x="132" y="291" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">5 · Navigation</text>
  <text x="36" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">sahifalar orasida harakat</text>
  <text x="36" y="342" font-family="monospace" font-size="13" fill="#1e293b">UNavigationMenu</text>
  <text x="36" y="362" font-family="monospace" font-size="13" fill="#1e293b">UTabs · UBreadcrumb</text>
  <text x="36" y="382" font-family="monospace" font-size="13" fill="#1e293b">UPagination · UStepper</text>
  <text x="36" y="402" font-family="monospace" font-size="13" fill="#1e293b">ULink</text>
  <text x="36" y="422" font-family="monospace" font-size="13" fill="#1e293b">UCommandPalette</text>

  <!-- 6. Overlay -->
  <rect x="256" y="270" width="216" height="170" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
  <rect x="256" y="270" width="216" height="30" rx="10" fill="#dc2626"/>
  <rect x="256" y="286" width="216" height="14" fill="#dc2626"/>
  <text x="364" y="291" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">6 · Overlay</text>
  <text x="268" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ustki oynalar · UApp shart</text>
  <text x="268" y="342" font-family="monospace" font-size="13" fill="#1e293b">UModal · USlideover</text>
  <text x="268" y="362" font-family="monospace" font-size="13" fill="#1e293b">UDrawer · UPopover</text>
  <text x="268" y="382" font-family="monospace" font-size="13" fill="#1e293b">UTooltip · UDropdownMenu</text>
  <text x="268" y="402" font-family="monospace" font-size="13" fill="#1e293b">UContextMenu</text>
  <text x="268" y="422" font-family="monospace" font-size="13" fill="#dc2626">useOverlay()</text>

  <!-- 7. Layout & Page -->
  <rect x="488" y="270" width="216" height="170" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <rect x="488" y="270" width="216" height="30" rx="10" fill="#16a34a"/>
  <rect x="488" y="286" width="216" height="14" fill="#16a34a"/>
  <text x="596" y="291" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">7 · Layout &amp; Page</text>
  <text x="500" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">marketing / landing tuzilma</text>
  <text x="500" y="342" font-family="monospace" font-size="13" fill="#1e293b">UApp · UContainer</text>
  <text x="500" y="362" font-family="monospace" font-size="13" fill="#1e293b">UHeader · UFooter · UMain</text>
  <text x="500" y="382" font-family="monospace" font-size="13" fill="#1e293b">UPage · UPageHeader</text>
  <text x="500" y="402" font-family="monospace" font-size="13" fill="#1e293b">UPageHero · UPageCard</text>
  <text x="500" y="422" font-family="monospace" font-size="13" fill="#1e293b">UPageGrid · UPageCTA...</text>

  <!-- 8. Dashboard -->
  <rect x="720" y="270" width="216" height="170" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="720" y="270" width="216" height="30" rx="10" fill="#2563eb"/>
  <rect x="720" y="286" width="216" height="14" fill="#2563eb"/>
  <text x="828" y="291" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">8 · Dashboard</text>
  <text x="732" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">SaaS admin panel</text>
  <text x="732" y="342" font-family="monospace" font-size="13" fill="#1e293b">UDashboardGroup</text>
  <text x="732" y="362" font-family="monospace" font-size="13" fill="#1e293b">UDashboardSidebar</text>
  <text x="732" y="382" font-family="monospace" font-size="13" fill="#1e293b">UDashboardPanel</text>
  <text x="732" y="402" font-family="monospace" font-size="13" fill="#1e293b">UDashboardNavbar</text>
  <text x="732" y="422" font-family="monospace" font-size="13" fill="#1e293b">UDashboardToolbar...</text>

  <!-- 9. Composables band -->
  <rect x="24" y="458" width="912" height="62" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="40" y="482" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">9 · Composables (komponent emas — funksiya):</text>
  <text x="40" y="506" font-family="monospace" font-size="13" fill="#dc2626">useToast() · useOverlay() · useColorMode() · defineShortcuts() · useFormField()</text>

  <!-- Foundation row: 09-modul tushunchalar -->
  <rect x="24" y="538" width="912" height="138" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="562" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">Umumiy poydevor — har bir komponent ostida (09-modul)</text>

  <rect x="44" y="578" width="200" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="144" y="603" text-anchor="middle" font-family="monospace" font-size="13" fill="#1e293b">color / variant / size</text>

  <rect x="260" y="578" width="200" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="360" y="596" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">props ↓ pastga (ota → bola)</text>
  <text x="360" y="613" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">bir tomonlama oqim</text>

  <rect x="476" y="578" width="200" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="576" y="596" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">emits ↑ tepaga (bola → ota)</text>
  <text x="576" y="613" text-anchor="middle" font-family="monospace" font-size="13" fill="#475569">v-model = props+emits</text>

  <rect x="692" y="578" width="224" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="804" y="596" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Vue 3 Proxy reaktivlik</text>
  <text x="804" y="613" text-anchor="middle" font-family="monospace" font-size="13" fill="#475569">ref / reactive → avto qayta chizish</text>

  <text x="480" y="646" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">SSR: server HTML chizadi → brauzerga yuboradi → hydration (Vue jonli tinglovchilarni ulaydi)</text>
  <text x="480" y="666" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Overlay / Toast / Tooltip mijoz tomonda yashaydi — shuning uchun UApp (Provider) majburiy</text>
</svg>
