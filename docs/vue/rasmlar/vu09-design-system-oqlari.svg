<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="860" height="460">
  <title>Nuxt UI design system: color, variant va size uchlamasi (3 mustaqil o'q)</title>
  <rect x="0" y="0" width="860" height="460" fill="#f8fafc"/>

  <text x="430" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Bitta komponent — 3 mustaqil o'q</text>
  <text x="430" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">&lt;UButton color="primary" variant="solid" size="md" /&gt;</text>

  <!-- color axis -->
  <rect x="40" y="86" width="780" height="104" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="60" y="112" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">color  — semantik rang (ma'no)</text>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">
    <rect x="60"  y="126" width="92" height="48" rx="6" fill="#16a34a"/><text x="106" y="155" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">primary</text>
    <rect x="162" y="126" width="92" height="48" rx="6" fill="#7c3aed"/><text x="208" y="155" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">secondary</text>
    <rect x="264" y="126" width="92" height="48" rx="6" fill="#16a34a"/><text x="310" y="155" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">success</text>
    <rect x="366" y="126" width="92" height="48" rx="6" fill="#2563eb"/><text x="412" y="155" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">info</text>
    <rect x="468" y="126" width="92" height="48" rx="6" fill="#f59e0b"/><text x="514" y="155" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="bold">warning</text>
    <rect x="570" y="126" width="92" height="48" rx="6" fill="#dc2626"/><text x="616" y="155" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">error</text>
    <rect x="672" y="126" width="92" height="48" rx="6" fill="#94a3b8"/><text x="718" y="155" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="bold">neutral</text>
  </g>

  <!-- variant axis -->
  <rect x="40" y="206" width="780" height="104" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="60" y="232" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#f59e0b">variant  — ko'rinish (bir rang, ko'p ko'rinish)</text>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="13">
    <rect x="60"  y="246" width="118" height="48" rx="6" fill="#2563eb"/><text x="119" y="275" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">solid</text>
    <rect x="188" y="246" width="118" height="48" rx="6" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/><text x="247" y="275" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="bold">outline</text>
    <rect x="316" y="246" width="118" height="48" rx="6" fill="#dbeafe"/><text x="375" y="275" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="bold">soft</text>
    <rect x="444" y="246" width="118" height="48" rx="6" fill="#dbeafe" stroke="#93c5fd"/><text x="503" y="275" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="bold">subtle</text>
    <rect x="572" y="246" width="118" height="48" rx="6" fill="#f8fafc"/><text x="631" y="275" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="bold">ghost</text>
    <rect x="700" y="246" width="64" height="48" rx="6" fill="#f8fafc"/><text x="732" y="275" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="bold" text-decoration="underline">link</text>
  </g>

  <!-- size axis -->
  <rect x="40" y="326" width="780" height="104" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="60" y="352" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">size  — o'lcham (padding + font + ikonka birga)</text>
  <g font-family="Segoe UI, system-ui, sans-serif" fill="#f8fafc" font-weight="bold">
    <rect x="60"  y="378" width="70"  height="30" rx="6" fill="#475569"/><text x="95"  y="398" text-anchor="middle" font-size="13">xs</text>
    <rect x="150" y="374" width="92"  height="38" rx="6" fill="#475569"/><text x="196" y="398" text-anchor="middle" font-size="13">sm</text>
    <rect x="262" y="370" width="116" height="46" rx="6" fill="#2563eb"/><text x="320" y="398" text-anchor="middle" font-size="13">md (default)</text>
    <rect x="398" y="366" width="140" height="54" rx="6" fill="#475569"/><text x="468" y="398" text-anchor="middle" font-size="13">lg</text>
    <rect x="558" y="362" width="170" height="62" rx="6" fill="#475569"/><text x="643" y="398" text-anchor="middle" font-size="13">xl</text>
  </g>
</svg>
