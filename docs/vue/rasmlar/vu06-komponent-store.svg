<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="840" height="520">
  <title>Komponent va store: state'ni o'qish, action chaqirish, hamma kuzatuvchiga reaktiv yangilanish</title>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arA" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#f59e0b"/>
    </marker>
    <marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="840" height="520" fill="#f8fafc"/>
  <text x="420" y="34" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Bir store — ko'p komponent: o'qish, chaqirish, reaktiv yangilanish</text>

  <!-- Central store -->
  <rect x="300" y="200" width="240" height="120" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="420" y="232" font-family="monospace" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">useCartStore</text>
  <text x="420" y="258" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">state: items (Proxy)</text>
  <text x="420" y="278" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">getter: totalItems</text>
  <text x="420" y="298" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309" text-anchor="middle">action: addToCart()</text>

  <!-- Component A: yozuvchi -->
  <rect x="40" y="80" width="220" height="100" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="150" y="108" font-family="monospace" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">ProductCard.vue</text>
  <text x="150" y="134" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">@click="addToCart(p)"</text>
  <text x="150" y="158" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309" text-anchor="middle">action chaqiradi (yozadi)</text>

  <!-- Component B: o'quvchi badge -->
  <rect x="580" y="80" width="220" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="690" y="108" font-family="monospace" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">CartBadge.vue</text>
  <text x="690" y="134" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">{{ totalItems }}</text>
  <text x="690" y="158" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">getter'ni o'qiydi</text>

  <!-- Component C: o'quvchi sahifa -->
  <rect x="580" y="340" width="220" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="690" y="368" font-family="monospace" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">CartPage.vue</text>
  <text x="690" y="394" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">v-for="i in items"</text>
  <text x="690" y="418" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">state'ni o'qiydi</text>

  <!-- A -> store (action chaqirish) -->
  <line x1="232" y1="180" x2="318" y2="222" stroke="#f59e0b" stroke-width="2.8" marker-end="url(#arA)"/>
  <text x="248" y="208" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309" font-weight="bold">1. action()</text>

  <!-- store -> B (reaktiv yangilanish) -->
  <line x1="522" y1="222" x2="608" y2="180" stroke="#16a34a" stroke-width="2.8" marker-end="url(#arG)"/>
  <text x="600" y="212" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" text-anchor="end" font-weight="bold">2. avto-yangilanadi</text>

  <!-- store -> C (reaktiv yangilanish) -->
  <line x1="522" y1="298" x2="608" y2="340" stroke="#16a34a" stroke-width="2.8" marker-end="url(#arG)"/>
  <text x="600" y="332" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" text-anchor="end" font-weight="bold">2. avto-yangilanadi</text>

  <!-- Reactivity note -->
  <rect x="40" y="240" width="220" height="160" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="150" y="266" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Reaktivlik zanjiri</text>
  <text x="150" y="292" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">action items'ni o'zgartiradi</text>
  <text x="150" y="312" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">→ Proxy o'zgarishni sezadi</text>
  <text x="150" y="332" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">→ totalItems qayta hisob</text>
  <text x="150" y="352" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">→ o'qigan HAR komponent</text>
  <text x="150" y="372" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">qayta render bo'ladi</text>

  <!-- storeToRefs warning -->
  <rect x="300" y="370" width="240" height="120" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="420" y="396" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">Diqqat: destructure</text>
  <text x="420" y="420" font-family="monospace" font-size="13" fill="#dc2626" text-anchor="middle">const {items} = store</text>
  <text x="420" y="438" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">reaktivlikni uzadi ×</text>
  <text x="420" y="462" font-family="monospace" font-size="13" fill="#16a34a" text-anchor="middle">storeToRefs(store)</text>
  <text x="420" y="480" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">state/getter uchun ✓</text>
</svg>
