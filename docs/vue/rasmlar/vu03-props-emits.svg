<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">
  <title>Bir tomonlama oqim: props pastga (data), emits yuqoriga (signal)</title>

  <defs>
    <marker id="vu03Down" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="vu03Up" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Bir tomonlama oqim: "props down, events up"</text>
  <text x="380" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Data faqat pastga oqadi; bola ota state'ini to'g'ridan-to'g'ri o'zgartira olmaydi</text>

  <!-- Ota komponent -->
  <rect x="230" y="80" width="300" height="78" rx="10" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2.5"/>
  <text x="380" y="110" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">Ota komponent (Parent)</text>
  <text x="380" y="135" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">state'ga egalik qiladi -- u o'zgartiradi</text>

  <!-- Bola komponent -->
  <rect x="230" y="280" width="300" height="78" rx="10" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="2.5"/>
  <text x="380" y="310" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">Bola komponent (Child)</text>
  <text x="380" y="335" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">props'ni o'qiydi, signal yuboradi</text>

  <!-- props pastga -->
  <line x1="300" y1="158" x2="300" y2="280" stroke="#2563eb" stroke-width="2.5" marker-end="url(#vu03Down)"/>
  <text x="150" y="205" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">props (data)</text>
  <text x="150" y="226" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">defineProps()</text>
  <text x="150" y="246" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">pastga -- o'zgarmas (immutable)</text>

  <!-- emits yuqoriga -->
  <line x1="460" y1="280" x2="460" y2="158" stroke="#16a34a" stroke-width="2.5" marker-end="url(#vu03Up)"/>
  <text x="618" y="205" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">emits (signal)</text>
  <text x="618" y="226" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">emit('increment', 1)</text>
  <text x="618" y="246" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yuqoriga -- ota qaror qiladi</text>

  <!-- Pastki izoh -->
  <rect x="40" y="372" width="680" height="0" fill="none"/>
  <text x="380" y="388" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">Bola props.name = 'x' qila olmaydi (Vue ogohlantirish beradi) -- faqat emit bilan "xabar beradi".</text>
</svg>
