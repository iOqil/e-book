<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>SSR oqimi: server data oladi va HTML render qiladi, brauzer oladi, keyin hydration</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>

  <text x="380" y="32" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">SSR oqimi: useFetch serverda ishlaydi, payload bilan clientga uzatiladi</text>

  <!-- SERVER ustuni -->
  <rect x="30" y="60" width="330" height="300" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="195" y="88" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#2563eb" text-anchor="middle">SERVER (Nitro / Node)</text>

  <!-- 1 -->
  <rect x="55" y="104" width="280" height="52" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="75" y="126" font-family="monospace" font-size="14" fill="#1e293b">1. useFetch('/api/users')</text>
  <text x="75" y="146" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">serverda data olinadi (1-marta)</text>

  <!-- 2 -->
  <rect x="55" y="172" width="280" height="52" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="75" y="194" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">2. HTML render qilinadi</text>
  <text x="75" y="214" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">to'liq mazmunli sahifa (SEO bor)</text>

  <!-- 3 -->
  <rect x="55" y="240" width="280" height="60" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="75" y="262" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">3. natija payloadga joylanadi</text>
  <text x="75" y="282" font-family="monospace" font-size="13" fill="#475569">window.__NUXT__</text>

  <text x="195" y="334" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">HTML + payload bitta javobda yuboriladi</text>

  <!-- O'q server -> brauzer -->
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <line x1="360" y1="210" x2="408" y2="210" stroke="#475569" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="384" y="200" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">HTML</text>

  <!-- BRAUZER ustuni -->
  <rect x="415" y="60" width="315" height="300" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="572" y="88" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#2563eb" text-anchor="middle">BRAUZER (Client)</text>

  <!-- 4 -->
  <rect x="438" y="104" width="270" height="52" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="458" y="126" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">4. HTML darrov ko'rinadi</text>
  <text x="458" y="146" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">FOUC yo'q, "loading" miltillamaydi</text>

  <!-- 5 -->
  <rect x="438" y="172" width="270" height="60" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="458" y="194" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">5. Hydration</text>
  <text x="458" y="214" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Vue HTML'ni "jonlantiradi"</text>

  <!-- 6 -->
  <rect x="438" y="248" width="270" height="60" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="458" y="270" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">6. payload o'qiladi → qayta</text>
  <text x="458" y="290" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">fetch QILINMAYDI</text>

  <text x="572" y="338" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">endi interaktiv SPA bo'lib davom etadi</text>

  <!-- Pastki izoh -->
  <rect x="30" y="385" width="700" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="48" y="410" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Universal (isomorphic):</text>
  <text x="48" y="432" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">data faqat BIR marta (serverda) olinadi, client payloaddan o'qiydi — ikki marta so'rov yo'q.</text>
</svg>
