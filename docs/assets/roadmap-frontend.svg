<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 215" width="760" height="215">
  <title>Frontend yo'nalishi ketma-ketligi: HTML va CSS, JavaScript, React, Next.js</title>
  <defs>
    <marker id="fe-strelka" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="215" fill="#f8fafc"/>
  <text x="380" y="30" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#2563eb">Frontend yo'nalishi</text>

  <!-- badgelar -->
  <circle cx="116" cy="52" r="13" fill="#2563eb"/><text x="116" y="57" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fff">1</text>
  <circle cx="292" cy="52" r="13" fill="#2563eb"/><text x="292" y="57" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fff">2</text>
  <circle cx="468" cy="52" r="13" fill="#2563eb"/><text x="468" y="57" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fff">3</text>
  <circle cx="644" cy="52" r="13" fill="#2563eb"/><text x="644" y="57" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fff">4</text>

  <!-- qutilar -->
  <rect x="46" y="68" width="140" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="116" y="96" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#1e293b">HTML &amp; CSS</text>
  <text x="116" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">struktura, dizayn</text>

  <rect x="222" y="68" width="140" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="292" y="96" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#1e293b">JavaScript</text>
  <text x="292" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">jonlilik, mantiq</text>

  <rect x="398" y="68" width="140" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="468" y="96" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#1e293b">React</text>
  <text x="468" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">komponentlar, UI</text>

  <rect x="574" y="68" width="140" height="62" rx="10" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <text x="644" y="96" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#ffffff">Next.js</text>
  <text x="644" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#dbeafe">SSR, marshrutlar</text>

  <!-- strelkalar -->
  <line x1="188" y1="99" x2="219" y2="99" stroke="#2563eb" stroke-width="2.5" marker-end="url(#fe-strelka)"/>
  <line x1="364" y1="99" x2="395" y2="99" stroke="#2563eb" stroke-width="2.5" marker-end="url(#fe-strelka)"/>
  <line x1="540" y1="99" x2="571" y2="99" stroke="#2563eb" stroke-width="2.5" marker-end="url(#fe-strelka)"/>

  <text x="380" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Muqobil yo'l: React/Next.js o'rniga <tspan font-weight="bold">Vue &amp; Nuxt</tspan> ni tanlash mumkin.</text>
  <text x="380" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Taxminiy vaqt: kuniga 1-2 soat bilan ~6-9 oyda ishga tayyor daraja.</text>
</svg>
