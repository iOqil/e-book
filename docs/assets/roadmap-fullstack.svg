<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 215" width="760" height="215">
  <title>Full Stack yo'nalishi ketma-ketligi: web poydevor, frontend (React/Next), backend (SQL + til), to'liq ilova</title>
  <defs>
    <marker id="fs-strelka" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="215" fill="#f8fafc"/>
  <text x="380" y="30" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#7c3aed">Full Stack yo'nalishi</text>

  <circle cx="116" cy="52" r="13" fill="#7c3aed"/><text x="116" y="57" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fff">1</text>
  <circle cx="292" cy="52" r="13" fill="#7c3aed"/><text x="292" y="57" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fff">2</text>
  <circle cx="468" cy="52" r="13" fill="#7c3aed"/><text x="468" y="57" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fff">3</text>
  <circle cx="644" cy="52" r="13" fill="#7c3aed"/><text x="644" y="57" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fff">4</text>

  <rect x="46" y="68" width="140" height="62" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="116" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e293b">Web poydevor</text>
  <text x="116" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">HTML/CSS + JS</text>

  <rect x="222" y="68" width="140" height="62" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="292" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e293b">Frontend</text>
  <text x="292" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">React / Next.js</text>

  <rect x="398" y="68" width="140" height="62" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="468" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e293b">Backend</text>
  <text x="468" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">SQL + PHP/Python</text>

  <rect x="574" y="68" width="140" height="62" rx="10" fill="#7c3aed" stroke="#6d28d9" stroke-width="2"/>
  <text x="644" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#ffffff">To'liq ilova</text>
  <text x="644" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#ede9fe">UI + API birga</text>

  <line x1="188" y1="99" x2="219" y2="99" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#fs-strelka)"/>
  <line x1="364" y1="99" x2="395" y2="99" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#fs-strelka)"/>
  <line x1="540" y1="99" x2="571" y2="99" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#fs-strelka)"/>

  <text x="380" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Full Stack = Frontend + Backend. Eng keng yo'l, lekin yakka o'zing ilova qura olasan.</text>
  <text x="380" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Taxminiy vaqt: kuniga 1-2 soat bilan ~9-14 oyda ishga tayyor daraja.</text>
</svg>
