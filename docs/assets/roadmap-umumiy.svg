<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" width="760" height="580">
  <title>Dasturlashni qayerdan boshlash: umumiy poydevordan (HTML/CSS, JavaScript) uchta yo'nalishga — Frontend, Full Stack, Backend</title>
  <defs>
    <marker id="rm-strelka" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="580" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="bold" fill="#1e293b">Dasturlashni qayerdan boshlash?</text>

  <!-- 1-bosqich: Poydevor -->
  <text x="380" y="62" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">1-bosqich · Poydevor — hamma yo'nalish uchun bir xil</text>
  <rect x="210" y="74" width="340" height="74" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="228" y="92" width="145" height="38" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="300" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">HTML &amp; CSS</text>
  <rect x="387" y="92" width="145" height="38" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="459" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">JavaScript</text>

  <!-- Strelka pastga + tanlov matni -->
  <line x1="380" y1="148" x2="380" y2="180" stroke="#475569" stroke-width="2.5" marker-end="url(#rm-strelka)"/>
  <text x="380" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">2-bosqich · Yo'nalishingni tanla</text>

  <!-- Uch ustun sarlavhalari -->
  <rect x="40" y="214" width="210" height="40" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="145" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">FRONTEND</text>
  <rect x="275" y="214" width="210" height="40" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="380" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#7c3aed">FULL STACK</text>
  <rect x="510" y="214" width="210" height="40" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="615" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">BACKEND</text>

  <!-- Ustun izohlari -->
  <text x="145" y="272" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">sayt ko'rinishi, brauzer</text>
  <text x="380" y="272" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">ikkalasi — yakka o'zi</text>
  <text x="615" y="272" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">server, ma'lumotlar bazasi</text>

  <!-- FRONTEND pillalari -->
  <rect x="55" y="286" width="180" height="34" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="145" y="308" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">React</text>
  <line x1="145" y1="320" x2="145" y2="330" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="55" y="330" width="180" height="34" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="145" y="352" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">Next.js</text>
  <rect x="55" y="374" width="180" height="32" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="145" y="395" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">muqobil: Vue &amp; Nuxt</text>

  <!-- FULL STACK pillalari -->
  <rect x="290" y="286" width="180" height="34" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="380" y="308" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">Frontend qismi</text>
  <line x1="380" y1="320" x2="380" y2="330" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="290" y="330" width="180" height="34" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="380" y="352" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">Backend qismi</text>
  <line x1="380" y1="364" x2="380" y2="374" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="290" y="374" width="180" height="34" rx="8" fill="#7c3aed"/>
  <text x="380" y="396" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#ffffff">To'liq loyiha</text>

  <!-- BACKEND pillalari -->
  <rect x="525" y="286" width="180" height="34" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="615" y="308" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">PHP yoki Python</text>
  <line x1="615" y1="320" x2="615" y2="330" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="525" y="330" width="180" height="34" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="615" y="352" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">SQL &amp; MySQL</text>
  <line x1="615" y1="364" x2="615" y2="374" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="525" y="374" width="180" height="32" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="615" y="395" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#1e293b">API / loyiha</text>

  <!-- Parallel band: 1000 masala -->
  <rect x="40" y="436" width="680" height="66" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="380" y="463" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#92400e">Butun yo'l davomida (parallel)</text>
  <text x="380" y="486" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">1000 masala — algoritmlar va intervyuga tayyorgarlik</text>

  <text x="380" y="535" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Har uch yo'nalish ham bitta poydevordan — HTML/CSS va JavaScript'dan — boshlanadi.</text>
</svg>
