<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560">
  <title>Energiya muvozanati: sarflash va tiklanish sikli</title>
  <rect x="0" y="0" width="820" height="560" fill="#f8fafc"/>
  <text x="410" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Energiya muvozanati</text>
  <text x="410" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Burnout - sarflash uzoq vaqt tiklanishdan ko'p bo'lganda yuz beradi</text>

  <!-- Left side: spending (drain) -->
  <rect x="60" y="110" width="300" height="230" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="210" y="148" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#dc2626">Energiyani sarflaydi</text>
  <text x="90" y="190" font-family="Segoe UI" font-size="14" fill="#334155">- Deadline va doimiy shoshilish</text>
  <text x="90" y="222" font-family="Segoe UI" font-size="14" fill="#334155">- On-call, kechki bildirishnomalar</text>
  <text x="90" y="254" font-family="Segoe UI" font-size="14" fill="#334155">- "Always on" - hech qachon uzilmaslik</text>
  <text x="90" y="286" font-family="Segoe UI" font-size="14" fill="#334155">- Nazoratsizlik, ko'p kontekst</text>
  <text x="90" y="318" font-family="Segoe UI" font-size="14" fill="#334155">- Mukofotsiz, adolatsiz muhit</text>

  <!-- Right side: recharge -->
  <rect x="460" y="110" width="300" height="230" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="610" y="148" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#16a34a">Energiyani to'ldiradi</text>
  <text x="490" y="190" font-family="Segoe UI" font-size="14" fill="#334155">- Yetarli, sifatli uyqu</text>
  <text x="490" y="222" font-family="Segoe UI" font-size="14" fill="#334155">- Jismoniy faollik, harakat</text>
  <text x="490" y="254" font-family="Segoe UI" font-size="14" fill="#334155">- Ishdan to'liq uzilish (detachment)</text>
  <text x="490" y="286" font-family="Segoe UI" font-size="14" fill="#334155">- Chegara: "yo'q" deya olish</text>
  <text x="490" y="318" font-family="Segoe UI" font-size="14" fill="#334155">- Hobbi, do'stlar, ijtimoiy aloqa</text>

  <!-- arrows cycle -->
  <path d="M 360 200 L 455 200" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah)"/>
  <path d="M 460 280 L 365 280" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah)"/>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- balance bar -->
  <text x="410" y="395" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Barqaror temp (sustainable pace)</text>
  <rect x="120" y="415" width="580" height="40" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="120" y="415" width="290" height="40" rx="10" fill="#fee2e2"/>
  <line x1="410" y1="410" x2="410" y2="460" stroke="#2563eb" stroke-width="3"/>
  <text x="265" y="440" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#dc2626">sarflash</text>
  <text x="555" y="440" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">tiklanish</text>

  <rect x="120" y="490" width="580" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="410" y="515" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Sprint kabi qisqa zo'riqish - normal. Marafonni sprint tezligida yugurish - burnout.</text>
</svg>
