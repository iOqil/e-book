<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520">
  <title>Maosh muzokarasi oqimi: tadqiqdan yozma kelishuvgacha besh qadam</title>
  <rect x="0" y="0" width="880" height="520" fill="#f8fafc"/>
  <text x="440" y="44" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Muzokara oqimi — bosqichma-bosqich</text>
  <text x="440" y="72" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Bu jang emas, hamkorlikda qiymatni topish jarayoni</text>

  <!-- Step 1 -->
  <rect x="40" y="120" width="150" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="152" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">1. Tadqiq</text>
  <text x="115" y="178" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Bozor narxi,</text>
  <text x="115" y="196" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">daraja, hudud,</text>
  <text x="115" y="214" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">BATNA tayyor</text>

  <!-- Step 2 -->
  <rect x="225" y="120" width="150" height="110" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="300" y="152" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#d97706">2. Ular langar</text>
  <text x="300" y="178" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Iloji bo'lsa</text>
  <text x="300" y="196" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">raqamni ular</text>
  <text x="300" y="214" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">birinchi aytsin</text>

  <!-- Step 3 -->
  <rect x="410" y="120" width="150" height="110" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="485" y="152" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#7c3aed">3. Qarshi taklif</text>
  <text x="485" y="178" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Hurmat bilan,</text>
  <text x="485" y="196" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">qiymat bilan</text>
  <text x="485" y="214" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">asoslangan</text>

  <!-- Step 4 -->
  <rect x="595" y="120" width="150" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="670" y="152" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">4. Kelishuv</text>
  <text x="670" y="178" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Ikki tomon ham</text>
  <text x="670" y="196" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">qoniqadigan</text>
  <text x="670" y="214" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">nuqta</text>

  <!-- Step 5 -->
  <rect x="365" y="300" width="150" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="440" y="332" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">5. Yozma</text>
  <text x="440" y="358" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Hammasi offer</text>
  <text x="440" y="376" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">xatida; og'zaki</text>
  <text x="440" y="394" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">va'da yetarli emas</text>

  <!-- Arrows -->
  <line x1="190" y1="175" x2="222" y2="175" stroke="#475569" stroke-width="2"/>
  <polygon points="222,175 213,170 213,180" fill="#475569"/>
  <line x1="375" y1="175" x2="407" y2="175" stroke="#475569" stroke-width="2"/>
  <polygon points="407,175 398,170 398,180" fill="#475569"/>
  <line x1="560" y1="175" x2="592" y2="175" stroke="#475569" stroke-width="2"/>
  <polygon points="592,175 583,170 583,180" fill="#475569"/>
  <line x1="670" y1="230" x2="490" y2="300" stroke="#475569" stroke-width="2"/>
  <polygon points="490,300 501,298 495,289" fill="#475569"/>

  <!-- Loop back note -->
  <line x1="410" y1="180" x2="320" y2="245" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="320,245 331,243 325,235" fill="#cbd5e1"/>
  <text x="300" y="270" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#94a3b8">3 va 2 bir necha bor takrorlanishi mumkin</text>

  <text x="440" y="460" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Har qadamda hurmat va munosabatni saqlang — kelajakda yana uchrashishingiz mumkin</text>
</svg>
