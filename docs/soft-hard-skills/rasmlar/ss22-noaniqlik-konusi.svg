<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520">
  <title>Noaniqlik konusi: vaqt o'tib baho diapazoni torayadi</title>
  <rect x="0" y="0" width="820" height="520" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Noaniqlik konusi (cone of uncertainty)</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Loyiha boshida baho keng diapazon; vaqt o'tib torayadi</text>

  <!-- Axes -->
  <line x1="120" y1="110" x2="120" y2="430" stroke="#334155" stroke-width="2"/>
  <line x1="120" y1="270" x2="760" y2="270" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="120" y1="430" x2="760" y2="430" stroke="#334155" stroke-width="2"/>

  <!-- Cone area -->
  <polygon points="120,130 760,255 760,285 120,410" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>

  <!-- Center estimate line -->
  <line x1="120" y1="270" x2="760" y2="270" stroke="#2563eb" stroke-width="2.5"/>

  <!-- Labels on axes -->
  <text x="108" y="135" text-anchor="end" font-family="Segoe UI" font-size="14" fill="#64748b">4x</text>
  <text x="108" y="275" text-anchor="end" font-family="Segoe UI" font-size="14" fill="#334155">1x</text>
  <text x="108" y="415" text-anchor="end" font-family="Segoe UI" font-size="14" fill="#64748b">0.25x</text>
  <text x="92" y="200" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b" transform="rotate(-90 92 200)">Baho xatosi (diapazon)</text>

  <!-- Time axis labels -->
  <text x="140" y="455" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Boshlanish</text>
  <text x="440" y="455" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Ish jarayonida</text>
  <text x="720" y="455" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Yakun</text>
  <text x="440" y="480" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Vaqt va aniqlik ortishi</text>

  <!-- Annotations -->
  <rect x="150" y="145" width="170" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="235" y="162" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#dc2626">Eng noaniq:</text>
  <text x="235" y="179" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">"3 oy yoki 1 yil?"</text>

  <rect x="560" y="248" width="180" height="42" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="650" y="265" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a">Aniqroq:</text>
  <text x="650" y="282" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">"yana 2-3 kun"</text>

  <text x="410" y="510" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#7c3aed">Saboq: baho bir raqam emas, DIAPAZON bo'lsin</text>
</svg>
