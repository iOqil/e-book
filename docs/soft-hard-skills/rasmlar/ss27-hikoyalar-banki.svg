<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560">
  <title>Hikoyalar banki matritsasi: bitta hikoya bir necha savolni qoplaydi</title>
  <rect x="0" y="0" width="880" height="560" fill="#f8fafc"/>
  <text x="440" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Hikoyalar banki: 5-7 hikoya, ko'p kompetensiya</text>
  <text x="440" y="70" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Belgi qaysi hikoya qaysi savolga moslanishini ko'rsatadi</text>

  <!-- column headers -->
  <text x="350" y="120" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">Nizo</text>
  <text x="460" y="120" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">Xato</text>
  <text x="575" y="120" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">Yetakchilik</text>
  <text x="690" y="120" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">Jamoa</text>
  <text x="800" y="120" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">Deadline</text>
  <text x="20" y="100" font-family="Segoe UI" font-size="13" fill="#64748b">Hikoya \ Kompetensiya</text>

  <!-- grid lines -->
  <line x1="300" y1="135" x2="855" y2="135" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- rows -->
  <!-- Row 1 -->
  <rect x="20" y="145" width="270" height="56" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="34" y="170" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">1. Production buzilishi</text>
  <text x="34" y="190" font-family="Segoe UI" font-size="13" fill="#64748b">to'lov moduli, kechqurun</text>
  <text x="350" y="180" text-anchor="middle" font-family="Segoe UI" font-size="20" fill="#16a34a">+</text>
  <text x="575" y="180" text-anchor="middle" font-family="Segoe UI" font-size="20" fill="#16a34a">+</text>
  <text x="800" y="180" text-anchor="middle" font-family="Segoe UI" font-size="20" fill="#16a34a">+</text>

  <!-- Row 2 -->
  <rect x="20" y="211" width="270" height="56" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="34" y="236" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">2. Reviewer bilan kelishmovchilik</text>
  <text x="34" y="256" font-family="Segoe UI" font-size="13" fill="#64748b">arxitektura tanlovi</text>
  <text x="350" y="246" text-anchor="middle" font-family="Segoe UI" font-size="20" fill="#16a34a">+</text>
  <text x="690" y="246" text-anchor="middle" font-family="Segoe UI" font-size="20" fill="#16a34a">+</text>

  <!-- Row 3 -->
  <rect x="20" y="277" width="270" height="56" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="34" y="302" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">3. Noto'g'ri taxmin qilganim</text>
  <text x="34" y="322" font-family="Segoe UI" font-size="13" fill="#64748b">ma'lumotni o'chirib yubordim</text>
  <text x="460" y="312" text-anchor="middle" font-family="Segoe UI" font-size="20" fill="#16a34a">+</text>
  <text x="575" y="312" text-anchor="middle" font-family="Segoe UI" font-size="20" fill="#16a34a">+</text>

  <!-- Row 4 -->
  <rect x="20" y="343" width="270" height="56" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="34" y="368" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">4. Yangi a'zoga mentorlik</text>
  <text x="34" y="388" font-family="Segoe UI" font-size="13" fill="#64748b">onboarding hujjati</text>
  <text x="575" y="378" text-anchor="middle" font-family="Segoe UI" font-size="20" fill="#16a34a">+</text>
  <text x="690" y="378" text-anchor="middle" font-family="Segoe UI" font-size="20" fill="#16a34a">+</text>

  <!-- Row 5 -->
  <rect x="20" y="409" width="270" height="56" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="34" y="434" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">5. Tor muddatli relizni yetkazish</text>
  <text x="34" y="454" font-family="Segoe UI" font-size="13" fill="#64748b">qamrovni kesib chiqdik</text>
  <text x="690" y="444" text-anchor="middle" font-family="Segoe UI" font-size="20" fill="#16a34a">+</text>
  <text x="800" y="444" text-anchor="middle" font-family="Segoe UI" font-size="20" fill="#16a34a">+</text>

  <!-- vertical separators -->
  <line x1="405" y1="145" x2="405" y2="465" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="515" y1="145" x2="515" y2="465" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="635" y1="145" x2="635" y2="465" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="745" y1="145" x2="745" y2="465" stroke="#e2e8f0" stroke-width="1"/>

  <text x="440" y="510" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">5 ta hikoya 5 kompetensiyani qoplaydi — har savolga tayyor hikoyangiz bor.</text>
  <text x="440" y="534" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Bitta hikoyani savolga qarab boshqa burchakdan ayting.</text>
</svg>
