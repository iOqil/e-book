<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560">
  <title>Feedbackni qabul qilish oqimi: to'xta, tushun, rahmat, baholab qaror qil</title>
  <rect x="0" y="0" width="860" height="560" fill="#f8fafc"/>
  <text x="430" y="44" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Feedbackni qabul qilish oqimi</text>
  <text x="430" y="72" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Birinchi turtki -- himoyaga o'tish. Uni to'xtating va quyidagi yo'ldan boring.</text>

  <!-- Step 1 -->
  <rect x="60" y="110" width="740" height="74" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <circle cx="100" cy="147" r="20" fill="#dc2626"/>
  <text x="100" y="154" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#ffffff">1</text>
  <text x="140" y="142" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#dc2626">TO'XTANG -- himoyaga o'tmang</text>
  <text x="140" y="166" font-family="Segoe UI" font-size="14" fill="#334155">Bir nafas oling. "Lekin..." deb javobni boshlamang. His -- bu signal, buyruq emas.</text>

  <path d="M430 184 L430 206" stroke="#94a3b8" stroke-width="3"/>
  <path d="M430 206 l-6 -9 h12 z" fill="#94a3b8"/>

  <!-- Step 2 -->
  <rect x="60" y="208" width="740" height="74" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="100" cy="245" r="20" fill="#2563eb"/>
  <text x="100" y="252" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#ffffff">2</text>
  <text x="140" y="240" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#2563eb">TUSHUNING -- tinglang va aniqlang</text>
  <text x="140" y="264" font-family="Segoe UI" font-size="14" fill="#334155">Faol tinglang. "Aniq misol berasizmi?" -- baholashdan oldin to'liq tushuning.</text>

  <path d="M430 282 L430 304" stroke="#94a3b8" stroke-width="3"/>
  <path d="M430 304 l-6 -9 h12 z" fill="#94a3b8"/>

  <!-- Step 3 -->
  <rect x="60" y="306" width="740" height="74" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="100" cy="343" r="20" fill="#f59e0b"/>
  <text x="100" y="350" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#ffffff">3</text>
  <text x="140" y="338" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#b45309">RAHMAT AYTING -- jasoratni qadrlang</text>
  <text x="140" y="362" font-family="Segoe UI" font-size="14" fill="#334155">Feedback berish ham qiyin. "Aytganing uchun rahmat." Bu rozilik emas -- xushmuomalalik.</text>

  <path d="M430 380 L430 402" stroke="#94a3b8" stroke-width="3"/>
  <path d="M430 402 l-6 -9 h12 z" fill="#94a3b8"/>

  <!-- Step 4 -->
  <rect x="60" y="404" width="740" height="74" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <circle cx="100" cy="441" r="20" fill="#16a34a"/>
  <text x="100" y="448" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#ffffff">4</text>
  <text x="140" y="436" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#16a34a">BAHOLANG va QAROR QILING -- keyinroq</text>
  <text x="140" y="460" font-family="Segoe UI" font-size="14" fill="#334155">Har feedback to'g'ri emas, lekin har birida ma'lumot bor. Sovuq aql bilan: qabul yoki rad.</text>

  <text x="430" y="516" text-anchor="middle" font-family="Segoe UI" font-size="14" font-style="italic" fill="#475569">Qabul qilish vaqti -- baholash vaqti emas. Avval eshiting, keyin hukm chiqaring.</text>
  <text x="430" y="540" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Ego -- feedback bilan o'sishning eng katta to'sig'i.</text>
</svg>
