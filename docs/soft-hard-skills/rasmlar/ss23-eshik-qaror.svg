<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540">
  <title>Qaytariladigan va qaytarilmaydigan qaror: ikki tomonlama eshik va bir tomonlama eshik</title>
  <rect x="0" y="0" width="820" height="540" fill="#f8fafc"/>
  <text x="410" y="44" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Qaytariladigan va qaytarilmaydigan qaror</text>
  <text x="410" y="72" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Jeff Bezos eshik metaforasi (2015): qaror turini avval aniqlang</text>

  <!-- LEFT: two-way door -->
  <rect x="50" y="100" width="340" height="380" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="220" y="134" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#16a34a">Ikki tomonlama eshik</text>
  <text x="220" y="158" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">qaytariladigan -- Type 2</text>

  <!-- door drawing -->
  <rect x="160" y="186" width="120" height="150" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <circle cx="266" cy="262" r="5" fill="#16a34a"/>
  <text x="220" y="220" text-anchor="middle" font-family="Segoe UI" font-size="26" fill="#16a34a">&#8646;</text>
  <text x="220" y="312" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">kira-chiqa olasiz</text>

  <text x="70" y="372" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">Tez qaror qiling</text>
  <text x="70" y="396" font-family="Segoe UI" font-size="13" fill="#334155">Xato chiqsa -- ortga qaytasiz.</text>
  <text x="70" y="418" font-family="Segoe UI" font-size="13" fill="#334155">Tajriba qiling, oʻrganing.</text>
  <text x="70" y="446" font-family="Segoe UI" font-size="13" fill="#334155">Misol: kutubxona tanlash,</text>
  <text x="70" y="466" font-family="Segoe UI" font-size="13" fill="#334155">UI rang, papka tuzilishi.</text>

  <!-- RIGHT: one-way door -->
  <rect x="430" y="100" width="340" height="380" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="134" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#dc2626">Bir tomonlama eshik</text>
  <text x="600" y="158" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">qaytarilmaydigan -- Type 1</text>

  <!-- door drawing -->
  <rect x="540" y="186" width="120" height="150" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <circle cx="646" cy="262" r="5" fill="#dc2626"/>
  <text x="600" y="220" text-anchor="middle" font-family="Segoe UI" font-size="26" fill="#dc2626">&#8594;</text>
  <text x="600" y="312" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">qaytib chiqib boʻlmaydi</text>

  <text x="450" y="372" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">Ehtiyot boʻling</text>
  <text x="450" y="396" font-family="Segoe UI" font-size="13" fill="#334155">Sekin, sinchkov, maslahat bilan.</text>
  <text x="450" y="418" font-family="Segoe UI" font-size="13" fill="#334155">Qaytarish qimmat yoki mumkin emas.</text>
  <text x="450" y="446" font-family="Segoe UI" font-size="13" fill="#334155">Misol: maʼlumotlar bazasi turi,</text>
  <text x="450" y="466" font-family="Segoe UI" font-size="13" fill="#334155">public API shakli, maʼlumot oʻchirish.</text>

  <text x="410" y="510" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Koʻp qaror aslida ikki tomonlama eshik -- ularni Type 1 deb sekinlashtirmang.</text>
</svg>
