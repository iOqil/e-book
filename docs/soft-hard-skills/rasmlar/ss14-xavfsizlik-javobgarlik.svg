<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560">
  <title>Psixologik xavfsizlik va javobgarlik matritsasi (Edmondson)</title>
  <rect x="0" y="0" width="840" height="560" fill="#f8fafc"/>
  <text x="420" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Xavfsizlik x Javobgarlik</text>
  <text x="420" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Edmondson, "The Fearless Organization" (2018-yil)</text>

  <!-- Quadrants -->
  <!-- Top-left: high safety, low accountability = Comfort -->
  <rect x="150" y="100" width="280" height="180" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="290" y="150" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#2563eb">Qulaylik zonasi</text>
  <text x="290" y="180" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Yoqimli, lekin sust</text>
  <text x="290" y="206" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Xavfsiz his, ammo natija</text>
  <text x="290" y="226" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">bosimi yo'q</text>

  <!-- Top-right: high safety, high accountability = Learning -->
  <rect x="450" y="100" width="280" height="180" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="590" y="150" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#16a34a">O'rganish zonasi</text>
  <text x="590" y="180" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Eng yaxshi ish shu yerda</text>
  <text x="590" y="206" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Ochiqlik + yuqori talab</text>
  <text x="590" y="226" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">birga turadi</text>

  <!-- Bottom-left: low safety, low accountability = Apathy -->
  <rect x="150" y="300" width="280" height="180" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="290" y="350" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#475569">Befarqlik zonasi</text>
  <text x="290" y="380" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Hech kim qiziqmaydi</text>
  <text x="290" y="406" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Minimal qilib, e'tibordan</text>
  <text x="290" y="426" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">qochish</text>

  <!-- Bottom-right: low safety, high accountability = Anxiety -->
  <rect x="450" y="300" width="280" height="180" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="590" y="350" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#dc2626">Tashvish zonasi</text>
  <text x="590" y="380" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Qo'rquv ostida ishlash</text>
  <text x="590" y="406" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Jazo qo'rquvi, yangi g'oya</text>
  <text x="590" y="426" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">aytishdan tortinish</text>

  <!-- Axis labels -->
  <text x="135" y="290" text-anchor="end" font-family="Segoe UI" font-size="13" fill="#64748b">Past javobgarlik</text>
  <text x="745" y="290" text-anchor="start" font-family="Segoe UI" font-size="13" fill="#64748b">Yuqori javobgarlik</text>
  <text x="440" y="520" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Javobgarlik (talab) -></text>
  <text x="120" y="290" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155" transform="rotate(-90 120 290)">Psixologik xavfsizlik -></text>
</svg>
