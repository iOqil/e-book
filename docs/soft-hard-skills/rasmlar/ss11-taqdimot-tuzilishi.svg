<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560">
  <title>Taqdimot tuzilishi: kirish, uchta asosiy nuqta, xulosa va harakat chaqirigi</title>
  <rect x="0" y="0" width="860" height="560" fill="#f8fafc"/>
  <text x="430" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Taqdimot tuzilishi</text>
  <text x="430" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Aytmoqchi boganini ayt - ayt - aytganini takrorla</text>

  <!-- Kirish -->
  <rect x="60" y="100" width="220" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="132" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#2563eb">1. Kirish</text>
  <text x="170" y="160" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Nima haqida?</text>
  <text x="170" y="182" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Nega muhim?</text>
  <text x="170" y="204" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Ilk 30 soniya - yodla</text>

  <!-- arrow -->
  <line x1="280" y1="160" x2="335" y2="160" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="335,153 350,160 335,167" fill="#94a3b8"/>

  <!-- Asosiy qism: uchlik qoidasi -->
  <rect x="350" y="92" width="450" height="200" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="575" y="120" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#7c3aed">2. Asosiy qism - uchlik qoidasi</text>

  <rect x="372" y="138" width="130" height="120" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="437" y="172" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">Nuqta 1</text>
  <text x="437" y="200" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Bitta goya</text>
  <text x="437" y="220" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">+ dalil</text>

  <rect x="510" y="138" width="130" height="120" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="575" y="172" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">Nuqta 2</text>
  <text x="575" y="200" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Bitta goya</text>
  <text x="575" y="220" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">+ dalil</text>

  <rect x="648" y="138" width="130" height="120" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="713" y="172" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">Nuqta 3</text>
  <text x="713" y="200" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Bitta goya</text>
  <text x="713" y="220" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">+ dalil</text>

  <!-- arrow down -->
  <line x1="575" y1="292" x2="575" y2="345" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="568,345 575,360 582,345" fill="#94a3b8"/>

  <!-- Xulosa -->
  <rect x="350" y="370" width="450" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="575" y="402" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#16a34a">3. Xulosa + harakat chaqirigi</text>
  <text x="575" y="432" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Asosiy goyani takrorla</text>
  <text x="575" y="458" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Endi auditoriya NIMA qilsin?</text>

  <!-- storytelling band -->
  <rect x="60" y="380" width="220" height="100" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="170" y="408" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#b45309">Hikoya skeleti</text>
  <text x="170" y="434" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Muammo - kurash</text>
  <text x="170" y="456" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">- yechim</text>

  <text x="430" y="528" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#94a3b8">Uchlik qoidasi: 3 nuqta esda qoladi, 7 nuqta unutiladi</text>
</svg>
