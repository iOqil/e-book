<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560">
  <title>Skill o'z-baho xaritasi: olti ko'nikma darajasi</title>
  <rect x="0" y="0" width="820" height="560" fill="#f8fafc"/>
  <text x="410" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Skill o'z-baho xaritasi</text>
  <text x="410" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Har ko'nikmani 1 dan 5 gacha o'zingiz baholang</text>

  <!-- Shkala sarlavhasi (1..5) -->
  <text x="300" y="108" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#94a3b8">1</text>
  <text x="380" y="108" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#94a3b8">2</text>
  <text x="460" y="108" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#94a3b8">3</text>
  <text x="540" y="108" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#94a3b8">4</text>
  <text x="620" y="108" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#94a3b8">5</text>

  <!-- Qatorlar: yorliq + to'liq panel + to'ldirilgan daraja -->
  <!-- 1 -->
  <text x="40" y="148" font-family="Segoe UI" font-size="14" fill="#1e293b">Kod yozish</text>
  <rect x="260" y="132" width="400" height="22" rx="6" fill="#e2e8f0"/>
  <rect x="260" y="132" width="320" height="22" rx="6" fill="#2563eb"/>
  <text x="676" y="148" font-family="Segoe UI" font-size="13" fill="#64748b">4</text>
  <!-- 2 -->
  <text x="40" y="192" font-family="Segoe UI" font-size="14" fill="#1e293b">Debugging</text>
  <rect x="260" y="176" width="400" height="22" rx="6" fill="#e2e8f0"/>
  <rect x="260" y="176" width="240" height="22" rx="6" fill="#2563eb"/>
  <text x="676" y="192" font-family="Segoe UI" font-size="13" fill="#64748b">3</text>
  <!-- 3 -->
  <text x="40" y="236" font-family="Segoe UI" font-size="14" fill="#1e293b">Muloqot</text>
  <rect x="260" y="220" width="400" height="22" rx="6" fill="#e2e8f0"/>
  <rect x="260" y="220" width="160" height="22" rx="6" fill="#16a34a"/>
  <text x="676" y="236" font-family="Segoe UI" font-size="13" fill="#64748b">2</text>
  <!-- 4 -->
  <text x="40" y="280" font-family="Segoe UI" font-size="14" fill="#1e293b">Fikr-mulohaza</text>
  <rect x="260" y="264" width="400" height="22" rx="6" fill="#e2e8f0"/>
  <rect x="260" y="264" width="80" height="22" rx="6" fill="#dc2626"/>
  <text x="676" y="280" font-family="Segoe UI" font-size="13" fill="#64748b">1</text>
  <!-- 5 -->
  <text x="40" y="324" font-family="Segoe UI" font-size="14" fill="#1e293b">Vaqt boshqaruvi</text>
  <rect x="260" y="308" width="400" height="22" rx="6" fill="#e2e8f0"/>
  <rect x="260" y="308" width="160" height="22" rx="6" fill="#16a34a"/>
  <text x="676" y="324" font-family="Segoe UI" font-size="13" fill="#64748b">2</text>
  <!-- 6 -->
  <text x="40" y="368" font-family="Segoe UI" font-size="14" fill="#1e293b">Jamoada ishlash</text>
  <rect x="260" y="352" width="400" height="22" rx="6" fill="#e2e8f0"/>
  <rect x="260" y="352" width="240" height="22" rx="6" fill="#16a34a"/>
  <text x="676" y="368" font-family="Segoe UI" font-size="13" fill="#64748b">3</text>

  <!-- Izoh -->
  <rect x="40" y="412" width="740" height="118" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="64" y="444" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#b45309">Qanday o'qiladi</text>
  <text x="64" y="472" font-family="Segoe UI" font-size="13" fill="#334155">Eng past baho — eng katta o'sish imkoniyati. Bu yerda: Fikr-mulohaza (1) zaif nuqta.</text>
  <text x="64" y="496" font-family="Segoe UI" font-size="13" fill="#334155">Maslahat: bir vaqtda HAMMASINI emas, bitta zaif ko'nikmani 1-2 oy ustida ishlang.</text>
  <text x="64" y="520" font-family="Segoe UI" font-size="13" fill="#64748b">Daraja: 1 boshlovchi · 3 ishonchli · 5 boshqalarni o'rgata oladi</text>
</svg>
