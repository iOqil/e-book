<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420">
  <title>Bilim quvuri: shaxsiy eslatmadan jamoa wiki va past bus factor sari</title>
  <rect x="0" y="0" width="860" height="420" fill="#f8fafc"/>
  <text x="430" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Bilim quvuri va bus factor</text>
  <text x="430" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Shaxsiy bilim hujjatlashtirilsa, jamoaning xavfi kamayadi</text>

  <rect x="40" y="120" width="220" height="130" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="150" y="160" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#b45309">Shaxsiy eslatma</text>
  <text x="150" y="188" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Faqat sizning</text>
  <text x="150" y="208" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">boshingizda / mashingiz</text>

  <rect x="320" y="120" width="220" height="130" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="430" y="160" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">Jamoa wiki / README</text>
  <text x="430" y="188" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Boshqalar ham</text>
  <text x="430" y="208" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">topa va o'qiy oladi</text>

  <rect x="600" y="120" width="220" height="130" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="710" y="160" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">Past bus factor</text>
  <text x="710" y="188" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Bir kishi ketsa ham</text>
  <text x="710" y="208" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">jamoa to'xtamaydi</text>

  <path d="M260 185 L318 185" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arr2)"/>
  <path d="M540 185 L598 185" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arr2)"/>

  <rect x="40" y="295" width="780" height="90" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="430" y="330" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">Bus factor 1 = xavf</text>
  <text x="430" y="358" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Agar bitta odam ketsa loyiha to'xtab qolsa, bilim hujjatlanmagan demakdir</text>

  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
