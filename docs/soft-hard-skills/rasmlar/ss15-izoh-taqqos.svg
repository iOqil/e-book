<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440">
  <title>Review izohi: ayblovchi vs savol-asoslangan taqqoslov</title>
  <rect x="0" y="0" width="860" height="440" fill="#f8fafc"/>
  <text x="430" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Bir xil muammo, ikki xil izoh</text>
  <text x="430" y="62" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Mazmun bir xil, ta'siri butunlay boshqa</text>

  <!-- Bad column -->
  <rect x="40" y="90" width="370" height="320" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="225" y="124" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#dc2626">Ayblovchi izoh</text>

  <text x="70" y="160" font-family="Segoe UI" font-size="14" fill="#7f1d1d">"Bu xato. Nega null tekshirmading?"</text>
  <text x="70" y="190" font-family="Segoe UI" font-size="14" fill="#7f1d1d">"Bunaqa kod yozilmaydi."</text>
  <text x="70" y="220" font-family="Segoe UI" font-size="14" fill="#7f1d1d">"Yana o'sha xato."</text>

  <line x1="70" y1="244" x2="380" y2="244" stroke="#fecaca" stroke-width="1"/>
  <text x="70" y="276" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#991b1b">Natija:</text>
  <text x="70" y="304" font-family="Segoe UI" font-size="14" fill="#7f1d1d">Author himoyaga o'tadi</text>
  <text x="70" y="332" font-family="Segoe UI" font-size="14" fill="#7f1d1d">Shaxsiy hujum his qiladi</text>
  <text x="70" y="360" font-family="Segoe UI" font-size="14" fill="#7f1d1d">Keyingi PR'dan cho'chiydi</text>
  <text x="70" y="388" font-family="Segoe UI" font-size="14" fill="#7f1d1d">Kod tuzaladi, munosabat buziladi</text>

  <!-- Good column -->
  <rect x="450" y="90" width="370" height="320" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="635" y="124" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#16a34a">Savol-asoslangan izoh</text>

  <text x="480" y="160" font-family="Segoe UI" font-size="14" fill="#14532d">"Bu yerda null kelsa nima bo'ladi?"</text>
  <text x="480" y="190" font-family="Segoe UI" font-size="14" fill="#14532d">"Taklif: guard qo'shsak qiziq emasmi?"</text>
  <text x="480" y="220" font-family="Segoe UI" font-size="14" fill="#14532d">"Bu nomlash juda toza, rahmat!"</text>

  <line x1="480" y1="244" x2="790" y2="244" stroke="#bbf7d0" stroke-width="1"/>
  <text x="480" y="276" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#15803d">Natija:</text>
  <text x="480" y="304" font-family="Segoe UI" font-size="14" fill="#14532d">Author birga o'ylaydi</text>
  <text x="480" y="332" font-family="Segoe UI" font-size="14" fill="#14532d">Sababini tushunadi</text>
  <text x="480" y="360" font-family="Segoe UI" font-size="14" fill="#14532d">Yana PR ochishga tayyor</text>
  <text x="480" y="388" font-family="Segoe UI" font-size="14" fill="#14532d">Kod ham, ishonch ham o'sadi</text>
</svg>
