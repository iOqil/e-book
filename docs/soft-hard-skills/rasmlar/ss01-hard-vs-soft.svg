<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540">
  <title>Hard skill va soft skill taqqoslash</title>
  <rect x="0" y="0" width="820" height="540" fill="#f8fafc"/>
  <text x="410" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Hard skill va Soft skill</text>
  <text x="410" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Ikkalasi ham o'rganiladigan ko'nikma — biri o'lchanadi, biri ko'rinadi</text>

  <rect x="40" y="100" width="350" height="400" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="215" y="138" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#2563eb">HARD SKILL</text>
  <text x="215" y="162" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">O'lchanadi · sertifikatlanadi · o'rgatiladi</text>
  <line x1="70" y1="180" x2="360" y2="180" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="72" y="212" font-family="Segoe UI" font-size="14" fill="#1e293b">- Dasturlash tili (JS, Python, PHP)</text>
  <text x="72" y="244" font-family="Segoe UI" font-size="14" fill="#1e293b">- SQL va ma'lumotlar bazasi</text>
  <text x="72" y="276" font-family="Segoe UI" font-size="14" fill="#1e293b">- Git va versiya boshqaruvi</text>
  <text x="72" y="308" font-family="Segoe UI" font-size="14" fill="#1e293b">- Debugging, test yozish</text>
  <text x="72" y="340" font-family="Segoe UI" font-size="14" fill="#1e293b">- Algoritmlar, ma'lumot strukturasi</text>
  <text x="72" y="372" font-family="Segoe UI" font-size="14" fill="#1e293b">- Framework, deploy, CI/CD</text>
  <text x="72" y="430" font-family="Segoe UI" font-size="13" fill="#64748b">Tekshirish: kod ishlaydimi?</text>
  <text x="72" y="452" font-family="Segoe UI" font-size="13" fill="#64748b">Eski bo'ladi: 3-5 yilda yangilanadi</text>

  <rect x="430" y="100" width="350" height="400" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="605" y="138" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#16a34a">SOFT SKILL</text>
  <text x="605" y="162" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Inson bilan ishlash · o'zini boshqarish</text>
  <line x1="460" y1="180" x2="750" y2="180" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="462" y="212" font-family="Segoe UI" font-size="14" fill="#1e293b">- Muloqot, fikrni tushuntirish</text>
  <text x="462" y="244" font-family="Segoe UI" font-size="14" fill="#1e293b">- Jamoada hamkorlik</text>
  <text x="462" y="276" font-family="Segoe UI" font-size="14" fill="#1e293b">- Vaqt va diqqatni boshqarish</text>
  <text x="462" y="308" font-family="Segoe UI" font-size="14" fill="#1e293b">- Fikr-mulohaza berish va olish</text>
  <text x="462" y="340" font-family="Segoe UI" font-size="14" fill="#1e293b">- Nizoni hal qilish, hamdardlik</text>
  <text x="462" y="372" font-family="Segoe UI" font-size="14" fill="#1e293b">- O'rganishni o'rganish, sabr</text>
  <text x="462" y="430" font-family="Segoe UI" font-size="13" fill="#64748b">Tekshirish: odamlar siz bilan</text>
  <text x="462" y="452" font-family="Segoe UI" font-size="13" fill="#64748b">qayta ishlashni xohlaydimi?</text>
  <text x="462" y="480" font-family="Segoe UI" font-size="13" fill="#64748b">Eskirmaydi: umrbod foydali</text>
</svg>
