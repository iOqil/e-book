<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520">
  <title>Senior dan keyin ikki yo'l: IC va menejment</title>
  <rect x="0" y="0" width="820" height="520" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Senior dan keyin yo'l ayriladi</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Ikkalasi ham yuqori daraja: "yuqoriga = menejer" majburiy emas</text>

  <rect x="305" y="100" width="210" height="66" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="130" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">Senior muhandis</text>
  <text x="410" y="153" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Ayri nuqta — o'zingga mosini tanla</text>

  <path d="M 360 166 L 200 215" stroke="#2563eb" stroke-width="2" fill="none"/>
  <path d="M 460 166 L 620 215" stroke="#7c3aed" stroke-width="2" fill="none"/>

  <rect x="60" y="220" width="290" height="250" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="205" y="252" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#2563eb">IC yo'li</text>
  <text x="205" y="274" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Individual hissa qo'shuvchi</text>
  <text x="80" y="306" font-family="Segoe UI" font-size="14" fill="#334155">Staff engineer</text>
  <text x="80" y="332" font-family="Segoe UI" font-size="14" fill="#334155">Principal engineer</text>
  <line x1="80" y1="348" x2="330" y2="348" stroke="#bfdbfe" stroke-width="1"/>
  <text x="80" y="374" font-family="Segoe UI" font-size="13" fill="#64748b">Texnik teranlik markazda</text>
  <text x="80" y="398" font-family="Segoe UI" font-size="13" fill="#64748b">Arxitektura, qiyin masala</text>
  <text x="80" y="422" font-family="Segoe UI" font-size="13" fill="#64748b">Ta'sir kod va dizayn orqali</text>
  <text x="80" y="446" font-family="Segoe UI" font-size="13" fill="#64748b">Jamoaga doimiy odam boshqarmaydi</text>

  <rect x="470" y="220" width="290" height="250" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="615" y="252" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#7c3aed">Menejment yo'li</text>
  <text x="615" y="274" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Odamlar orqali ta'sir</text>
  <text x="490" y="306" font-family="Segoe UI" font-size="14" fill="#334155">Team lead</text>
  <text x="490" y="332" font-family="Segoe UI" font-size="14" fill="#334155">Engineering manager</text>
  <line x1="490" y1="348" x2="740" y2="348" stroke="#e9d5ff" stroke-width="1"/>
  <text x="490" y="374" font-family="Segoe UI" font-size="13" fill="#64748b">Odam, jarayon, yo'nalish</text>
  <text x="490" y="398" font-family="Segoe UI" font-size="13" fill="#64748b">1:1, o'sish, ishga olish</text>
  <text x="490" y="422" font-family="Segoe UI" font-size="13" fill="#64748b">Ta'sir jamoa orqali</text>
  <text x="490" y="446" font-family="Segoe UI" font-size="13" fill="#64748b">Kod yozish kamayadi</text>

  <text x="410" y="500" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Orqaga qaytish mumkin: yo'lni bir umrga tanlamaysiz</text>
</svg>
