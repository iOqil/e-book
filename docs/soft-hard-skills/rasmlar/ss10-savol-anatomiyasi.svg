<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540">
  <title>Yaxshi savol va bug-report anatomiyasi</title>
  <rect x="0" y="0" width="860" height="540" fill="#f8fafc"/>
  <text x="430" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Yaxshi savolning anatomiyasi</text>
  <text x="430" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Javob beruvchini ortiqcha so'rashga majburlamang</text>

  <!-- Bad question card -->
  <rect x="40" y="100" width="300" height="370" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="190" y="132" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#dc2626">Yomon savol</text>
  <text x="190" y="178" text-anchor="middle" font-family="Segoe UI" font-size="15" font-style="italic" fill="#334155">"Ishlamayapti.</text>
  <text x="190" y="202" text-anchor="middle" font-family="Segoe UI" font-size="15" font-style="italic" fill="#334155">Yordam bering."</text>
  <text x="65" y="252" font-family="Segoe UI" font-size="13" fill="#64748b">- Nima ishlamayapti?</text>
  <text x="65" y="280" font-family="Segoe UI" font-size="13" fill="#64748b">- Qachon, qayerda?</text>
  <text x="65" y="308" font-family="Segoe UI" font-size="13" fill="#64748b">- Nima sinab ko'rdingiz?</text>
  <text x="65" y="336" font-family="Segoe UI" font-size="13" fill="#64748b">- Nima kutgandingiz?</text>
  <text x="190" y="400" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">Javob: yana 5 ta savol</text>
  <text x="190" y="424" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">-&gt; vaqt yo'qoladi</text>

  <!-- Good question card -->
  <rect x="380" y="100" width="440" height="370" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="132" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#16a34a">Yaxshi savol / bug-report</text>

  <rect x="405" y="152" width="390" height="46" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="420" y="172" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">1. Kontekst</text>
  <text x="420" y="190" font-family="Segoe UI" font-size="13" fill="#334155">Maqsad, muhit (versiya, OS), nima qilyapsiz</text>

  <rect x="405" y="206" width="390" height="46" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="420" y="226" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">2. Qayta tiklash qadamlari</text>
  <text x="420" y="244" font-family="Segoe UI" font-size="13" fill="#334155">1-2-3: aniq, takrorlanadigan qadamlar</text>

  <rect x="405" y="260" width="390" height="46" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="420" y="280" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">3. Kutilgan natija</text>
  <text x="420" y="298" font-family="Segoe UI" font-size="13" fill="#334155">Nima bo'lishi kerak edi</text>

  <rect x="405" y="314" width="390" height="46" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="420" y="334" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">4. Haqiqiy natija</text>
  <text x="420" y="352" font-family="Segoe UI" font-size="13" fill="#334155">Nima bo'ldi (aniq xato matni, log)</text>

  <rect x="405" y="368" width="390" height="46" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="420" y="388" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">5. Nimani urinib ko'rdingiz</text>
  <text x="420" y="406" font-family="Segoe UI" font-size="13" fill="#334155">Tekshirilgan gipotezalar - takrorlamaslik uchun</text>

  <text x="600" y="446" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">Javob: bitta aniq yechim -&gt; vaqt tejaladi</text>

  <text x="430" y="510" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Yaxshi savol yozish jarayonida ko'pincha javobni o'zingiz topasiz (rubber-duck effekti).</text>
</svg>
