<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520">
  <title>Vazifa nizosi vs munosabat nizosi va "disagree and commit" oqimi</title>
  <rect x="0" y="0" width="860" height="520" fill="#f8fafc"/>
  <text x="430" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Nizo turi va "disagree and commit"</text>
  <text x="430" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">G'oya haqida bahslash foydali; shaxsga o'tish zararli</text>

  <!-- Two nizo types -->
  <rect x="40" y="95" width="380" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="230" y="125" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">Vazifa nizosi (foydali)</text>
  <text x="230" y="150" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">G'oya, yondashuv, texnik tanlov haqida</text>
  <text x="230" y="172" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">"REST yoki gRPC? Nega?"</text>
  <text x="230" y="194" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">Yaxshiroq qaror chiqaradi</text>

  <rect x="440" y="95" width="380" height="120" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="630" y="125" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">Munosabat nizosi (zararli)</text>
  <text x="630" y="150" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Shaxsga, niyatga, "kim" ustiga o'tadi</text>
  <text x="630" y="172" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">"Sen hech narsa tushunmaysan"</text>
  <text x="630" y="194" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">Ishonchni buzadi, jamoa parchalanadi</text>

  <text x="430" y="248" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Texnik bahs tugagach: "disagree and commit" (Amazon)</text>

  <!-- flow -->
  <rect x="40" y="270" width="170" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="125" y="300" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">1. Ochiq bahs</text>
  <text x="125" y="322" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Faktga tayan,</text>
  <text x="125" y="340" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">egoga emas</text>

  <rect x="245" y="270" width="170" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="330" y="300" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">2. Qaror</text>
  <text x="330" y="322" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Mas'ul yoki jamoa</text>
  <text x="330" y="340" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">qaror qabul qiladi</text>

  <rect x="450" y="270" width="170" height="80" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="535" y="296" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">3. Rozi emasman,</text>
  <text x="535" y="316" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">lekin qo'llab-quvvatlayman</text>
  <text x="535" y="340" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Sabotaj yo'q</text>

  <rect x="655" y="270" width="165" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="737" y="300" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">4. Birga ijro</text>
  <text x="737" y="322" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Natijani kuzat,</text>
  <text x="737" y="340" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">kerak bo'lsa qayta ko'r</text>

  <path d="M212 310 L243 310" stroke="#94a3b8" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M417 310 L448 310" stroke="#94a3b8" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M622 310 L653 310" stroke="#94a3b8" stroke-width="2" marker-end="url(#a2)"/>
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 3 L0 6 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="40" y="385" width="780" height="95" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60" y="415" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Qachon eskalatsiya (yuqoriga olib chiqish)?</text>
  <text x="60" y="440" font-family="Segoe UI" font-size="13" fill="#475569">- Qaror qaytarib bo'lmas va xavfli bo'lsa (xavfsizlik, ma'lumot yo'qolishi).</text>
  <text x="60" y="462" font-family="Segoe UI" font-size="13" fill="#475569">- Bahs aylanib qolsa va jamoa o'zi hal qila olmasa — lead/menejerga olib chiqing, ego uchun emas.</text>
</svg>
