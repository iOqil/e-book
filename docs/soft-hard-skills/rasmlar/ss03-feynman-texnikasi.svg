<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520">
  <title>Feynman texnikasi: mavzu, sodda tushuntirish, bo'shliqni topish, soddalashtirish</title>
  <rect x="0" y="0" width="820" height="520" fill="#f8fafc"/>
  <text x="410" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Feynman texnikasi — 4 qadam</text>
  <text x="410" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Tushuntira olmasangiz — hali tushunmagansiz</text>

  <!-- step 1 -->
  <rect x="60" y="110" width="320" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="84" y="142" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">1. Mavzuni tanla</text>
  <text x="84" y="167" font-family="Segoe UI" font-size="13" fill="#334155">Bo'sh varaqqa mavzu nomini yoz.</text>
  <text x="84" y="187" font-family="Segoe UI" font-size="13" fill="#334155">Masalan: "REST API nima?"</text>

  <!-- step 2 -->
  <rect x="440" y="110" width="320" height="92" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="464" y="142" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">2. Bolaga tushuntir</text>
  <text x="464" y="167" font-family="Segoe UI" font-size="13" fill="#334155">Sodda til, jargonsiz, oddiy</text>
  <text x="464" y="187" font-family="Segoe UI" font-size="13" fill="#334155">misollar bilan yozib chiq.</text>

  <!-- step 3 -->
  <rect x="440" y="310" width="320" height="92" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="464" y="342" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">3. Bo'shliqni top</text>
  <text x="464" y="367" font-family="Segoe UI" font-size="13" fill="#334155">Qayerda tutilding? Manbaga</text>
  <text x="464" y="387" font-family="Segoe UI" font-size="13" fill="#334155">qaytib o'sha joyni o'rgan.</text>

  <!-- step 4 -->
  <rect x="60" y="310" width="320" height="92" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="84" y="342" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#b45309">4. Soddalashtir</text>
  <text x="84" y="367" font-family="Segoe UI" font-size="13" fill="#334155">Murakkab jumlani qisqartir,</text>
  <text x="84" y="387" font-family="Segoe UI" font-size="13" fill="#334155">o'xshatish qo'sh, takrorla.</text>

  <!-- arrows -->
  <path d="M 382 156 L 436 156" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#fa)"/>
  <path d="M 600 204 L 600 306" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#fa)"/>
  <path d="M 438 356 L 384 356" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#fa)"/>
  <!-- loop back from step 4 to step 2 (bo'shliq qaytishi) -->
  <path d="M 220 308 L 220 204" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#fr)"/>
  <text x="232" y="262" font-family="Segoe UI" font-size="13" font-style="italic" fill="#dc2626">tushunmaguncha</text>
  <text x="232" y="280" font-family="Segoe UI" font-size="13" font-style="italic" fill="#dc2626">takrorla</text>

  <defs>
    <marker id="fa" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="fr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
