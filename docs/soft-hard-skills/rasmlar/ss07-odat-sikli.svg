<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600">
  <title>Odat sikli: ishora, intilish, harakat, mukofot</title>
  <rect x="0" y="0" width="820" height="600" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Odat sikli (habit loop)</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Har bir odat to'rt qadamli halqadan iborat</text>

  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <circle cx="410" cy="340" r="170" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>

  <rect x="280" y="120" width="260" height="78" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="150" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#2563eb">1. Ishora (cue)</text>
  <text x="410" y="176" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Boshlovchi signal: vaqt, joy, his</text>

  <rect x="555" y="295" width="240" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="675" y="325" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#16a34a">2. Intilish</text>
  <text x="675" y="346" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">(craving)</text>
  <text x="675" y="368" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">O'zgarishga ichki istak</text>

  <rect x="280" y="482" width="260" height="78" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="410" y="512" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#7c3aed">3. Harakat (response)</text>
  <text x="410" y="538" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Odatning o'zi: amalga oshirasiz</text>

  <rect x="25" y="295" width="240" height="90" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="145" y="325" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#d97706">4. Mukofot</text>
  <text x="145" y="346" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">(reward)</text>
  <text x="145" y="368" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Qoniqish - miya eslab qoladi</text>

  <path d="M535 198 Q620 240 668 292" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M650 388 Q560 450 478 482" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M340 482 Q250 450 195 388" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M170 292 Q250 240 332 198" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="410" y="335" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#475569">Halqa har</text>
  <text x="410" y="357" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#475569">aylanishi bilan</text>
  <text x="410" y="379" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#475569">mustahkamlanadi</text>

  <text x="410" y="592" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">Clear ning 4 qonuni har bir qadamni boshqaradi: ko'rinarli, jozibali, oson, qoniqarli qil</text>
</svg>
