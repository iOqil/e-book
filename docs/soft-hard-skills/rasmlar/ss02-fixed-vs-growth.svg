<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540">
  <title>Qat'iy mentalitet va o'sish mentaliteti reaksiyalari</title>
  <rect x="0" y="0" width="860" height="540" fill="#f8fafc"/>
  <text x="430" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Qat'iy mentalitet vs O'sish mentaliteti</text>
  <text x="430" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Bir xil vaziyatga ikki xil ichki reaksiya</text>

  <rect x="40" y="92" width="380" height="38" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="230" y="117" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#dc2626">Qat'iy (fixed): "qobiliyat tug'ma"</text>

  <rect x="440" y="92" width="380" height="38" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="630" y="117" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#16a34a">O'sish (growth): "qobiliyat o'sadi"</text>

  <!-- Row 1: qiyinchilik -->
  <text x="430" y="162" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">Qiyin bug oldida</text>
  <rect x="40" y="172" width="380" height="48" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="230" y="201" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">"Bu mendan oshib ketdi, taslim"</text>
  <rect x="440" y="172" width="380" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="630" y="201" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">"Qiziq — buni hali yechmaganman"</text>

  <!-- Row 2: code review -->
  <text x="430" y="252" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">Code review tanqidi</text>
  <rect x="40" y="262" width="380" height="48" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="230" y="291" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">"Demak men yomon dasturchiman"</text>
  <rect x="440" y="262" width="380" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="630" y="291" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">"Bepul dars — keyingisi yaxshiroq"</text>

  <!-- Row 3: boshqaning yutugi -->
  <text x="430" y="342" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">Boshqaning muvaffaqiyati</text>
  <rect x="40" y="352" width="380" height="48" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="230" y="381" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">"U meni xijolatga qo'ydi" (tahdid)</text>
  <rect x="440" y="352" width="380" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="630" y="381" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">"Undan nimani o'rganaman?" (manba)</text>

  <!-- Row 4: harakat -->
  <text x="430" y="432" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">Harakat va sa'y</text>
  <rect x="40" y="442" width="380" height="48" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="230" y="471" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">"Tirishish = qobiliyatsizlik belgisi"</text>
  <rect x="440" y="442" width="380" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="630" y="471" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">"Tirishish = o'sish yo'li"</text>

  <text x="430" y="518" text-anchor="middle" font-family="Segoe UI" font-size="14" font-style="italic" fill="#64748b">Bitta so'z farqi: "men bilmayman" -&gt; "men buni HALI bilmayman"</text>
</svg>
