<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560">
  <title>Jami kompensatsiya tarkibi: maoshdan tashqari beshta qatlam</title>
  <rect x="0" y="0" width="860" height="560" fill="#f8fafc"/>
  <text x="430" y="44" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Jami kompensatsiya — faqat maosh emas</text>
  <text x="430" y="72" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Taklifni baholashda hammasini hisobga oling, faqat oylik raqamni emas</text>

  <!-- Central salary block -->
  <rect x="330" y="110" width="200" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="430" y="145" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#2563eb">Asosiy maosh</text>
  <text x="430" y="170" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Eng ko'rinadigan, lekin bitta qism</text>

  <!-- Five surrounding components -->
  <rect x="60" y="240" width="220" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="170" y="272" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">Bonus va ulush</text>
  <text x="170" y="296" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Yillik bonus, equity,</text>
  <text x="170" y="314" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">aksiya / RSU</text>

  <rect x="320" y="240" width="220" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="430" y="272" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">Imtiyozlar</text>
  <text x="430" y="296" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Sug'urta, ta'til,</text>
  <text x="430" y="314" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">jihoz, kasallik kuni</text>

  <rect x="580" y="240" width="220" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="690" y="272" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">Masofaviy ish</text>
  <text x="690" y="296" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Uydan ishlash, moslashuv,</text>
  <text x="690" y="314" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">yo'l vaqti tejaladi</text>

  <rect x="190" y="380" width="220" height="90" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="300" y="412" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#7c3aed">O'sish imkoniyati</text>
  <text x="300" y="436" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">O'rganish, mentor,</text>
  <text x="300" y="454" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">texnologiya, lavozim yo'li</text>

  <rect x="450" y="380" width="220" height="90" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="560" y="412" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#7c3aed">Jamoa va menejer</text>
  <text x="560" y="436" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Kim bilan ishlaysiz,</text>
  <text x="560" y="454" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">madaniyat, qo'llab-quvvatlash</text>

  <!-- Connector lines -->
  <line x1="380" y1="190" x2="200" y2="240" stroke="#94a3b8" stroke-width="2"/>
  <line x1="430" y1="190" x2="430" y2="240" stroke="#94a3b8" stroke-width="2"/>
  <line x1="480" y1="190" x2="660" y2="240" stroke="#94a3b8" stroke-width="2"/>
  <line x1="360" y1="190" x2="320" y2="380" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="500" y1="190" x2="540" y2="380" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 4"/>

  <text x="430" y="512" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Ba'zan kamroq maosh, lekin kuchli o'sish — uzoq muddatda foydaliroq bo'lishi mumkin</text>
</svg>
