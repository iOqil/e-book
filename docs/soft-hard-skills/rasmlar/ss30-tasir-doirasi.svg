<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560">
  <title>Darajalar va ta'sir doirasi: junior dan lead gacha</title>
  <rect x="0" y="0" width="820" height="560" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Daraja oshgani sari ta'sir doirasi kengayadi</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">O'lchov yil emas: scope (qamrov) va autonomy (mustaqillik)</text>

  <circle cx="320" cy="330" r="170" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="320" cy="330" r="115" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <circle cx="320" cy="330" r="60" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>

  <text x="320" y="325" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#b45309">O'zim</text>
  <text x="320" y="345" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">vazifa</text>
  <text x="320" y="240" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">Jamoa</text>
  <text x="320" y="185" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">Tashkilot</text>

  <rect x="560" y="120" width="230" height="68" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="575" y="148" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#b45309">Junior</text>
  <text x="575" y="172" font-family="Segoe UI" font-size="13" fill="#64748b">Vazifani nazorat bilan bajaradi</text>

  <rect x="560" y="205" width="230" height="68" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="575" y="233" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">Mid</text>
  <text x="575" y="257" font-family="Segoe UI" font-size="13" fill="#64748b">Vazifani mustaqil yopadi</text>

  <rect x="560" y="290" width="230" height="68" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="575" y="318" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">Senior</text>
  <text x="575" y="342" font-family="Segoe UI" font-size="13" fill="#64748b">Noaniq muammoni yechadi, ko'taradi</text>

  <rect x="560" y="375" width="230" height="68" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="575" y="403" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">Staff / Lead</text>
  <text x="575" y="427" font-family="Segoe UI" font-size="13" fill="#64748b">Tashkilot darajasida ta'sir</text>

  <text x="410" y="525" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Yuqoriga ko'tarilish = "men ko'p kod yozaman" emas, "ta'sirim kengayadi"</text>
</svg>
