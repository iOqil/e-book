<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470">
  <title>Review izohi og'irlik darajalari: nit, taklif, savol, bloklovchi</title>
  <rect x="0" y="0" width="860" height="470" fill="#f8fafc"/>
  <text x="430" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Izohni og'irligi bilan belgilang</text>
  <text x="430" y="62" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Prefiks author'ga nima muhimligini darrov ko'rsatadi</text>

  <!-- nit -->
  <rect x="60" y="95" width="740" height="78" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <rect x="60" y="95" width="14" height="78" rx="4" fill="#16a34a"/>
  <text x="100" y="128" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#16a34a">nit:</text>
  <text x="200" y="124" font-family="Segoe UI" font-size="15" fill="#334155">Did yoki uslub. Bloklamaydi, e'tibor bermasa ham bo'ladi.</text>
  <text x="200" y="152" font-family="Segoe UI" font-size="14" fill="#64748b">"nit: bu o'zgaruvchi nomi qisqaroq bo'lsa-chi?"</text>

  <!-- taklif -->
  <rect x="60" y="185" width="740" height="78" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="60" y="185" width="14" height="78" rx="4" fill="#2563eb"/>
  <text x="100" y="218" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#2563eb">taklif:</text>
  <text x="200" y="214" font-family="Segoe UI" font-size="15" fill="#334155">Yaxshilash g'oyasi. Author qaror qiladi, majburiy emas.</text>
  <text x="200" y="242" font-family="Segoe UI" font-size="14" fill="#64748b">"taklif: buni alohida funksiyaga ajratsak qayta ishlatsa bo'ladi"</text>

  <!-- savol -->
  <rect x="60" y="275" width="740" height="78" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <rect x="60" y="275" width="14" height="78" rx="4" fill="#f59e0b"/>
  <text x="100" y="308" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#b45309">savol:</text>
  <text x="200" y="304" font-family="Segoe UI" font-size="15" fill="#334155">Tushunmadim, aniqlik kerak. Javob muhokamani ochadi.</text>
  <text x="200" y="332" font-family="Segoe UI" font-size="14" fill="#64748b">"savol: bu yerda nega eski API'ni ishlatdik?"</text>

  <!-- bloklovchi -->
  <rect x="60" y="365" width="740" height="78" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <rect x="60" y="365" width="14" height="78" rx="4" fill="#dc2626"/>
  <text x="100" y="398" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#dc2626">bloklovchi:</text>
  <text x="220" y="394" font-family="Segoe UI" font-size="15" fill="#334155">Tuzatilmasa merge bo'lmaydi. Xato, xavfsizlik, ma'lumot yo'qolishi.</text>
  <text x="220" y="422" font-family="Segoe UI" font-size="14" fill="#64748b">"bloklovchi: bu so'rovda SQL injection xavfi bor"</text>
</svg>
