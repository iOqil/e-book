<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560">
  <title>Sayoz javob vs STAR bo'yicha tuzilgan javob taqqoslashi</title>
  <rect x="0" y="0" width="860" height="560" fill="#f8fafc"/>
  <text x="430" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Bir savol, ikki javob</text>
  <text x="430" y="70" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">"Jamoadagi nizoni hal qilgan vaqtingizni eslang"</text>

  <!-- Bad column -->
  <rect x="30" y="95" width="385" height="430" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="222" y="128" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#dc2626">Sayoz va chalkash</text>

  <text x="50" y="162" font-family="Segoe UI" font-size="14" fill="#7f1d1d">"Bizda doim nizolar bo'lardi.</text>
  <text x="50" y="184" font-family="Segoe UI" font-size="14" fill="#7f1d1d">Jamoa katta edi, hamma o'z</text>
  <text x="50" y="206" font-family="Segoe UI" font-size="14" fill="#7f1d1d">fikrini aytardi. Menimcha</text>
  <text x="50" y="228" font-family="Segoe UI" font-size="14" fill="#7f1d1d">muloqot eng muhimi. Biz</text>
  <text x="50" y="250" font-family="Segoe UI" font-size="14" fill="#7f1d1d">gaplashib hal qilardik..."</text>

  <text x="50" y="300" font-family="Segoe UI" font-size="14" fill="#dc2626">x  Faqat umumiy gap, vaziyat yo'q</text>
  <text x="50" y="328" font-family="Segoe UI" font-size="14" fill="#dc2626">x  "Biz" — siz nima qildingiz?</text>
  <text x="50" y="356" font-family="Segoe UI" font-size="14" fill="#dc2626">x  Aniq harakat ko'rinmaydi</text>
  <text x="50" y="384" font-family="Segoe UI" font-size="14" fill="#dc2626">x  Natija, raqam, saboq yo'q</text>
  <text x="50" y="412" font-family="Segoe UI" font-size="14" fill="#dc2626">x  Esda qolmaydi</text>

  <rect x="50" y="438" width="345" height="66" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="64" y="464" font-family="Segoe UI" font-size="13" fill="#7f1d1d">Intervyuer xulosasi: "Real misol bormi?</text>
  <text x="64" y="486" font-family="Segoe UI" font-size="13" fill="#7f1d1d">Bu odam nima qildi — bilolmadim."</text>

  <!-- Good column -->
  <rect x="445" y="95" width="385" height="430" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="637" y="128" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#16a34a">STAR bo'yicha tuzilgan</text>

  <text x="465" y="160" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#2563eb">S:</text>
  <text x="485" y="160" font-family="Segoe UI" font-size="13" fill="#334155">"Reviewer mening PR'imni 2 kun</text>
  <text x="485" y="178" font-family="Segoe UI" font-size="13" fill="#334155">bloklab turdi — yondashuvga rozi emas."</text>

  <text x="465" y="208" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#7c3aed">T:</text>
  <text x="485" y="208" font-family="Segoe UI" font-size="13" fill="#334155">"Reliz menga bog'liq edi, kelishuvga</text>
  <text x="485" y="226" font-family="Segoe UI" font-size="13" fill="#334155">erishishim kerak edi."</text>

  <text x="465" y="256" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a">A:</text>
  <text x="485" y="256" font-family="Segoe UI" font-size="13" fill="#334155">"Qo'ng'iroq qildim, fikrini so'radim,</text>
  <text x="485" y="274" font-family="Segoe UI" font-size="13" fill="#334155">2 variantni benchmark bilan solishtirdim."</text>

  <text x="465" y="304" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#b45309">R:</text>
  <text x="485" y="304" font-family="Segoe UI" font-size="13" fill="#334155">"Uning yo'li 20% tez chiqdi — qabul</text>
  <text x="485" y="322" font-family="Segoe UI" font-size="13" fill="#334155">qildim. Endi avval ma'lumot yig'aman."</text>

  <text x="465" y="362" font-family="Segoe UI" font-size="14" fill="#16a34a">+  Aniq vaziyat va rol</text>
  <text x="465" y="390" font-family="Segoe UI" font-size="14" fill="#16a34a">+  "Men" — aniq harakatlar</text>
  <text x="465" y="418" font-family="Segoe UI" font-size="14" fill="#16a34a">+  Natija + raqam + o'rgangan saboq</text>

  <rect x="465" y="438" width="345" height="66" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="479" y="464" font-family="Segoe UI" font-size="13" fill="#166534">Intervyuer xulosasi: "Nizoda ham xolis,</text>
  <text x="479" y="486" font-family="Segoe UI" font-size="13" fill="#166534">ham natijaga yo'naltirilgan odam."</text>
</svg>
