<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540">
  <title>STAR metodi: javobning 4 qadami</title>
  <rect x="0" y="0" width="860" height="540" fill="#f8fafc"/>
  <text x="430" y="44" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">STAR metodi: javobni 4 qadamga quring</text>
  <text x="430" y="72" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Har bir behavioral savolga shu ketma-ketlikda javob bering</text>

  <!-- S -->
  <rect x="40" y="110" width="370" height="180" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="90" cy="150" r="22" fill="#2563eb"/>
  <text x="90" y="158" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#ffffff">S</text>
  <text x="130" y="148" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#2563eb">Situation — Vaziyat</text>
  <text x="130" y="172" font-family="Segoe UI" font-size="14" fill="#334155">Kontekst: qachon, qayerda, kim bilan.</text>
  <text x="62" y="206" font-family="Segoe UI" font-size="14" fill="#334155">Qisqa fon. 1-2 jumla yetarli.</text>
  <text x="62" y="232" font-family="Segoe UI" font-size="13" fill="#64748b">"Sprint oxirida to'lov moduli</text>
  <text x="62" y="252" font-family="Segoe UI" font-size="13" fill="#64748b">production'da ishlamay qoldi."</text>
  <text x="62" y="278" font-family="Segoe UI" font-size="13" fill="#dc2626">Xato: shu yerda qolib ketmang!</text>

  <!-- T -->
  <rect x="450" y="110" width="370" height="180" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="500" cy="150" r="22" fill="#7c3aed"/>
  <text x="500" y="158" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#ffffff">T</text>
  <text x="540" y="148" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#7c3aed">Task — Vazifa</text>
  <text x="540" y="172" font-family="Segoe UI" font-size="14" fill="#334155">Aynan SIZNING mas'uliyatingiz.</text>
  <text x="472" y="206" font-family="Segoe UI" font-size="14" fill="#334155">Nima qilishingiz kerak edi?</text>
  <text x="472" y="232" font-family="Segoe UI" font-size="13" fill="#64748b">"Men navbatchi edim — 30 daqiqada</text>
  <text x="472" y="252" font-family="Segoe UI" font-size="13" fill="#64748b">sababni topib tiklashim kerak edi."</text>
  <text x="472" y="278" font-family="Segoe UI" font-size="13" fill="#64748b">Rolingizni aniq ajrating.</text>

  <!-- A -->
  <rect x="40" y="320" width="370" height="180" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <circle cx="90" cy="360" r="22" fill="#16a34a"/>
  <text x="90" y="368" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#ffffff">A</text>
  <text x="130" y="358" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#16a34a">Action — Harakat</text>
  <text x="130" y="382" font-family="Segoe UI" font-size="14" fill="#334155">AYNAN SIZ nima qildingiz. "Men".</text>
  <text x="62" y="416" font-family="Segoe UI" font-size="14" fill="#334155">Javobning yuragi — eng uzun qism.</text>
  <text x="62" y="442" font-family="Segoe UI" font-size="13" fill="#64748b">"Loglarni tekshirdim, deploy'ni</text>
  <text x="62" y="462" font-family="Segoe UI" font-size="13" fill="#64748b">orqaga qaytardim, jamoani ogohlantirdim."</text>
  <text x="62" y="488" font-family="Segoe UI" font-size="13" fill="#16a34a">"Biz" emas — "men": sizning hissangiz.</text>

  <!-- R -->
  <rect x="450" y="320" width="370" height="180" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="500" cy="360" r="22" fill="#f59e0b"/>
  <text x="500" y="368" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#ffffff">R</text>
  <text x="540" y="358" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#b45309">Result — Natija</text>
  <text x="540" y="382" font-family="Segoe UI" font-size="14" fill="#334155">Oqibat + raqam + o'rgangan saboq.</text>
  <text x="472" y="416" font-family="Segoe UI" font-size="14" fill="#334155">Hikoya nima bilan tugadi?</text>
  <text x="472" y="442" font-family="Segoe UI" font-size="13" fill="#64748b">"12 daqiqada tikladim. Keyin deploy'ga</text>
  <text x="472" y="462" font-family="Segoe UI" font-size="13" fill="#64748b">avtomatik test qo'shdik — qaytarilmadi."</text>
  <text x="472" y="488" font-family="Segoe UI" font-size="13" fill="#b45309">Raqam bo'lsa kuch beradi.</text>

  <!-- arrows -->
  <path d="M 415 200 L 445 200" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#ar27)"/>
  <path d="M 635 295 L 635 315" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#ar27)"/>
  <path d="M 445 410 L 415 410" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#ar27)"/>
  <defs>
    <marker id="ar27" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
