<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560">
  <title>Onlayn mavjudlik kanallari va ularning maqsadi</title>
  <rect x="0" y="0" width="820" height="560" fill="#f8fafc"/>
  <text x="410" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Onlayn mavjudlik kanallari</text>
  <text x="410" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Hammasini emas — bittasini tanlang va izchil davom eting</text>

  <!-- Blog -->
  <rect x="40" y="100" width="360" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="132" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#2563eb">Blog</text>
  <text x="60" y="160" font-family="Segoe UI" font-size="14" fill="#334155">Chuqur, uzoq umrli kontent</text>
  <text x="60" y="184" font-family="Segoe UI" font-size="13" fill="#64748b">SEO orqali topiladi; maqola, qo'llanma</text>
  <text x="60" y="206" font-family="Segoe UI" font-size="13" fill="#16a34a">Maqsad: chuqurlik va izlanuvchanlik</text>

  <!-- GitHub -->
  <rect x="420" y="100" width="360" height="120" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="440" y="132" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#7c3aed">GitHub</text>
  <text x="440" y="160" font-family="Segoe UI" font-size="14" fill="#334155">Kod orqali "ko'rsatish"</text>
  <text x="440" y="184" font-family="Segoe UI" font-size="13" fill="#64748b">Portfolio; loyiha, README, hissa</text>
  <text x="440" y="206" font-family="Segoe UI" font-size="13" fill="#16a34a">Maqsad: real ish isboti</text>

  <!-- LinkedIn -->
  <rect x="40" y="240" width="360" height="120" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="60" y="272" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#16a34a">LinkedIn</text>
  <text x="60" y="300" font-family="Segoe UI" font-size="14" fill="#334155">Professional ko'rinish, ish bozori</text>
  <text x="60" y="324" font-family="Segoe UI" font-size="13" fill="#64748b">Post, loyiha e'loni</text>
  <text x="60" y="346" font-family="Segoe UI" font-size="13" fill="#16a34a">Maqsad: yollovchiga ko'rinish</text>

  <!-- Twitter/X -->
  <rect x="420" y="240" width="360" height="120" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="440" y="272" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#b45309">Twitter / X</text>
  <text x="440" y="300" font-family="Segoe UI" font-size="14" fill="#334155">Tez fikr ulashish, suhbat</text>
  <text x="440" y="324" font-family="Segoe UI" font-size="13" fill="#64748b">Qisqa thread, savol</text>
  <text x="440" y="346" font-family="Segoe UI" font-size="13" fill="#16a34a">Maqsad: dasturchilar bilan aloqa</text>

  <!-- YouTube -->
  <rect x="40" y="380" width="360" height="120" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="412" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#dc2626">YouTube</text>
  <text x="60" y="440" font-family="Segoe UI" font-size="14" fill="#334155">Vizual tushuntirish</text>
  <text x="60" y="464" font-family="Segoe UI" font-size="13" fill="#64748b">Video, ekran yozuvi</text>
  <text x="60" y="486" font-family="Segoe UI" font-size="13" fill="#16a34a">Maqsad: hayotda ko'rsatish</text>

  <!-- Community -->
  <rect x="420" y="380" width="360" height="120" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <text x="440" y="412" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#0e7490">Telegram / Discord</text>
  <text x="440" y="440" font-family="Segoe UI" font-size="14" fill="#334155">Mahalliy hamjamiyat</text>
  <text x="440" y="464" font-family="Segoe UI" font-size="13" fill="#64748b">Tezkor yordam, javob, muhokama</text>
  <text x="440" y="486" font-family="Segoe UI" font-size="13" fill="#16a34a">Maqsad: hamjamiyatga hissa</text>

  <text x="410" y="535" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Mukammal bo'lishini kutmang — o'rganayotganingizdayoq ulashing</text>
</svg>
