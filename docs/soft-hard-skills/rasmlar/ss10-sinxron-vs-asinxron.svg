<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540">
  <title>Sinxron va asinxron muloqotni taqqoslash</title>
  <rect x="0" y="0" width="860" height="540" fill="#f8fafc"/>
  <text x="430" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Sinxron va asinxron muloqot</text>
  <text x="430" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Bir vaqtda javob kutamizmi yoki yo'qmi?</text>

  <!-- Sinxron column -->
  <rect x="40" y="100" width="370" height="370" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="225" y="135" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#2563eb">Sinxron</text>
  <text x="225" y="158" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Yig'ilish, qo'ng'iroq, jonli chat</text>

  <text x="65" y="200" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">+ Tez</text>
  <text x="80" y="222" font-family="Segoe UI" font-size="13" fill="#334155">Darhol javob, jonli muhokama</text>
  <text x="65" y="252" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">+ Nozik mavzu</text>
  <text x="80" y="274" font-family="Segoe UI" font-size="13" fill="#334155">Hissiy, murakkab suhbat uchun</text>

  <text x="65" y="312" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">- Uzadi</text>
  <text x="80" y="334" font-family="Segoe UI" font-size="13" fill="#334155">Hammani bir vaqtda to'playdi</text>
  <text x="65" y="364" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">- Iz qolmaydi</text>
  <text x="80" y="386" font-family="Segoe UI" font-size="13" fill="#334155">Qaror og'zaki, keyin unutiladi</text>
  <text x="65" y="416" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">- Vaqt mintaqasi</text>
  <text x="80" y="438" font-family="Segoe UI" font-size="13" fill="#334155">Hammasi bir paytda bo'sh bo'lsin</text>

  <!-- Asinxron column -->
  <rect x="450" y="100" width="370" height="370" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="635" y="135" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#16a34a">Asinxron</text>
  <text x="635" y="158" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">PR, issue, hujjat, yozma xabar</text>

  <text x="475" y="200" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">+ Iz qoladi</text>
  <text x="490" y="222" font-family="Segoe UI" font-size="13" fill="#334155">Yozuv qidiriladi, qayta o'qiladi</text>
  <text x="475" y="252" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">+ Chuqur fikr</text>
  <text x="490" y="274" font-family="Segoe UI" font-size="13" fill="#334155">O'ylab, tahrirlab yozasiz</text>
  <text x="475" y="304" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">+ Diqqatni asraydi</text>
  <text x="490" y="326" font-family="Segoe UI" font-size="13" fill="#334155">Mos vaqtda javob berasiz</text>

  <text x="475" y="364" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">- Sekinroq</text>
  <text x="490" y="386" font-family="Segoe UI" font-size="13" fill="#334155">Javob soatlar keyin kelishi mumkin</text>
  <text x="475" y="416" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">- Kontekst shart</text>
  <text x="490" y="438" font-family="Segoe UI" font-size="13" fill="#334155">Yetarli ma'lumotsiz tushunmaydi</text>

  <text x="430" y="510" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Async-first: standart - yozma. Sinxronni faqat nozik yoki tez kelishuv kerak bo'lganda ishlat.</text>
</svg>
