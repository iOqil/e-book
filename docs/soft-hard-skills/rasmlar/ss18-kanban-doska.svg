<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540">
  <title>Kanban doskasi: ustunlar, WIP limiti va oqim</title>
  <rect x="0" y="0" width="860" height="540" fill="#f8fafc"/>
  <text x="430" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Kanban doskasi</text>
  <text x="430" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Ishni vizual ko'rsat, WIP (jarayondagi ish) ni chekla, oqimni boshqar</text>

  <!-- Column 1: To Do -->
  <rect x="40" y="100" width="240" height="400" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="160" y="130" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#334155">Qilinadi (To Do)</text>
  <rect x="60" y="150" width="200" height="46" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="160" y="178" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Login sahifa</text>
  <rect x="60" y="206" width="200" height="46" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="160" y="234" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Hisobot eksporti</text>
  <rect x="60" y="262" width="200" height="46" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="160" y="290" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Email bildirishnoma</text>

  <!-- Column 2: In Progress with WIP limit -->
  <rect x="310" y="100" width="240" height="400" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="430" y="130" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#d97706">Jarayonda</text>
  <rect x="370" y="142" width="120" height="26" rx="13" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="430" y="160" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#dc2626">WIP limit: 2</text>
  <rect x="330" y="182" width="200" height="46" rx="7" fill="#ffedd5" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="430" y="210" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#92400e">To'lov integratsiyasi</text>
  <rect x="330" y="238" width="200" height="46" rx="7" fill="#ffedd5" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="430" y="266" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#92400e">Profil tahriri</text>
  <!-- blocked third card -->
  <rect x="330" y="300" width="200" height="46" rx="7" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="430" y="322" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">Limit to'ldi -</text>
  <text x="430" y="339" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">yangi ish kutadi</text>

  <!-- Column 3: Done -->
  <rect x="580" y="100" width="240" height="400" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="700" y="130" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">Tayyor (Done)</text>
  <rect x="600" y="150" width="200" height="46" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="700" y="178" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">Bosh sahifa</text>
  <rect x="600" y="206" width="200" height="46" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="700" y="234" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">Qidiruv funksiyasi</text>

  <!-- Flow arrows -->
  <line x1="282" y1="430" x2="308" y2="430" stroke="#334155" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="552" y1="430" x2="578" y2="430" stroke="#334155" stroke-width="2" marker-end="url(#ar2)"/>
  <text x="430" y="490" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Oqim chapdan o'ngga. WIP limit "ko'p ishni birga boshlash"ni to'xtatib, tugatishga majbur qiladi.</text>

  <defs>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
