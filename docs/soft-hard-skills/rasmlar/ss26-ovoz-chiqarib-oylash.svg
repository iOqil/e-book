<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540">
  <title>Ovoz chiqarib o'ylash va jim ishlash taqqoslash: intervyuer nimani ko'radi</title>
  <rect x="0" y="0" width="840" height="540" fill="#f8fafc"/>
  <text x="420" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Intervyuer nimani ko'radi?</text>
  <text x="420" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Bir xil masala — ikki xil natija</text>

  <!-- Jim ishlash -->
  <rect x="50" y="100" width="350" height="380" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="225" y="134" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#dc2626">Jim ishlash</text>
  <text x="225" y="160" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#b91c1c">Intervyuer faqat ekranni ko'radi</text>

  <rect x="78" y="184" width="294" height="60" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="92" y="208" font-family="Segoe UI" font-size="14" fill="#334155">Uzoq sukut — odam o'ylaydi:</text>
  <text x="92" y="230" font-family="Segoe UI" font-size="13" fill="#64748b">"Tiqilib qoldimi? Bilmaydimi?"</text>

  <rect x="78" y="256" width="294" height="60" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="92" y="280" font-family="Segoe UI" font-size="14" fill="#334155">Xato yo'l — yordam berib bo'lmaydi</text>
  <text x="92" y="302" font-family="Segoe UI" font-size="13" fill="#64748b">Intervyuer sizni yo'naltira olmaydi</text>

  <rect x="78" y="328" width="294" height="60" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="92" y="352" font-family="Segoe UI" font-size="14" fill="#334155">To'g'ri javob — lekin "qanday?"</text>
  <text x="92" y="374" font-family="Segoe UI" font-size="13" fill="#64748b">Tasodifmi yoki mantiqmi — noma'lum</text>

  <text x="225" y="430" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">Natija: fikrlash ko'rinmaydi</text>
  <text x="225" y="456" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#b91c1c">To'g'ri kod ham past baholanishi mumkin</text>

  <!-- Ovoz chiqarib -->
  <rect x="440" y="100" width="350" height="380" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="615" y="134" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#16a34a">Ovoz chiqarib o'ylash</text>
  <text x="615" y="160" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#15803d">Intervyuer fikrlashni ko'radi</text>

  <rect x="468" y="184" width="294" height="60" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="482" y="208" font-family="Segoe UI" font-size="14" fill="#334155">"Avval bo'sh massivni tekshiraman..."</text>
  <text x="482" y="230" font-family="Segoe UI" font-size="13" fill="#64748b">Mantiq ko'rinadi, ball beriladi</text>

  <rect x="468" y="256" width="294" height="60" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="482" y="280" font-family="Segoe UI" font-size="14" fill="#334155">Xato yo'l — intervyuer ishora beradi</text>
  <text x="482" y="302" font-family="Segoe UI" font-size="13" fill="#64748b">"O'sha holatni o'ylab ko'rdingmi?"</text>

  <rect x="468" y="328" width="294" height="60" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="482" y="352" font-family="Segoe UI" font-size="14" fill="#334155">Tiqilsangiz ham — yondashuv ko'rinadi</text>
  <text x="482" y="374" font-family="Segoe UI" font-size="13" fill="#64748b">Tugatmasangiz ham qisman ball</text>

  <text x="615" y="430" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">Natija: fikrlash baholanadi</text>
  <text x="615" y="456" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#15803d">Hamkorlikda ishlash signali ham kuchli</text>

  <text x="420" y="512" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Intervyuer sizning miyangizni o'qiy olmaydi — uni ovoz bilan ko'rsating</text>
</svg>
