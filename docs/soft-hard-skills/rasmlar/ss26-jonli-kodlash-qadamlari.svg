<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540">
  <title>Jonli kodlash 6 qadami: aniqlashtirishdan optimallashtirishgacha</title>
  <rect x="0" y="0" width="860" height="540" fill="#f8fafc"/>
  <text x="430" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Jonli kodlash qadamlari</text>
  <text x="430" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Masalaga sho'ng'imang — bu tartibda yuring (UMPIRE/REACTO ramkalari shunga yaqin)</text>

  <defs>
    <marker id="ar26b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- 1 -->
  <rect x="60" y="110" width="220" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="140" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">1. Aniqlashtir</text>
  <text x="170" y="166" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Savol bering, talabni</text>
  <text x="170" y="184" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">tushuning, taxmin qilmang</text>
  <text x="170" y="206" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Kirish/chiqish nima?</text>

  <!-- 2 -->
  <rect x="320" y="110" width="220" height="110" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="430" y="140" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#7c3aed">2. Misol va chegara</text>
  <text x="430" y="166" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Aniq misol yozing,</text>
  <text x="430" y="184" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">bo'sh/eng katta holatlar</text>
  <text x="430" y="206" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Chegaraviy holatlarni top</text>

  <!-- 3 -->
  <rect x="580" y="110" width="220" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="690" y="140" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">3. Yondashuvni ayt</text>
  <text x="690" y="166" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Rejani ovoz chiqarib</text>
  <text x="690" y="184" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">tushuntiring, kod yozishdan</text>
  <text x="690" y="206" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">oldin tasdiq oling</text>

  <!-- 4 -->
  <rect x="580" y="290" width="220" height="110" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="690" y="320" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#b45309">4. Kod yoz</text>
  <text x="690" y="346" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Toza, o'qiladigan kod;</text>
  <text x="690" y="364" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">yo'l-yo'lakay gapiring</text>
  <text x="690" y="386" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Jim qolmang</text>

  <!-- 5 -->
  <rect x="320" y="290" width="220" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="430" y="320" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">5. Test qil</text>
  <text x="430" y="346" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Misollarni qo'lda yuriting,</text>
  <text x="430" y="364" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">chegaralarni tekshiring</text>
  <text x="430" y="386" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Xatoni o'zingiz toping</text>

  <!-- 6 -->
  <rect x="60" y="290" width="220" height="110" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="170" y="320" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#7c3aed">6. Optimallashtir</text>
  <text x="170" y="346" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Murakkablikni muhokama</text>
  <text x="170" y="364" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">qiling, yaxshilashni ayting</text>
  <text x="170" y="386" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Trade-off muhokamasi</text>

  <!-- arrows -->
  <line x1="280" y1="165" x2="316" y2="165" stroke="#475569" stroke-width="2.5" marker-end="url(#ar26b)"/>
  <line x1="540" y1="165" x2="576" y2="165" stroke="#475569" stroke-width="2.5" marker-end="url(#ar26b)"/>
  <line x1="690" y1="220" x2="690" y2="286" stroke="#475569" stroke-width="2.5" marker-end="url(#ar26b)"/>
  <line x1="580" y1="345" x2="544" y2="345" stroke="#475569" stroke-width="2.5" marker-end="url(#ar26b)"/>
  <line x1="320" y1="345" x2="284" y2="345" stroke="#475569" stroke-width="2.5" marker-end="url(#ar26b)"/>

  <text x="430" y="450" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Har qadamda ovoz chiqarib o'ylang — intervyuer kodni emas, FIKRLASHNI baholaydi</text>
  <text x="430" y="476" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Tiqilib qolsangiz oldingi qadamga qayting — bu sikl, chiziq emas</text>
</svg>
