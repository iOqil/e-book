<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600">
  <title>Eisenhower matritsasi: muhim va shoshilinch bo'yicha 4 kvadrat</title>
  <rect x="0" y="0" width="860" height="600" fill="#f8fafc"/>
  <text x="430" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Eisenhower matritsasi</text>
  <text x="430" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Har vazifani ikki o'lchov bo'yicha ajrating: muhimlik va shoshilinchlik</text>

  <text x="290" y="108" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#334155">SHOSHILINCH</text>
  <text x="630" y="108" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#334155">SHOSHILINCH EMAS</text>
  <text x="70" y="245" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#334155" transform="rotate(-90 70 245)">MUHIM</text>
  <text x="70" y="465" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#334155" transform="rotate(-90 70 465)">MUHIM EMAS</text>

  <rect x="120" y="130" width="340" height="220" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="290" y="166" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#dc2626">1. DARHOL BAJAR</text>
  <text x="290" y="194" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Muhim + Shoshilinch</text>
  <text x="290" y="232" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Production bug, ishlamayotgan deploy</text>
  <text x="290" y="256" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Bugungi deadline, mijoz inqirozi</text>
  <text x="290" y="292" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#dc2626">Krizis zonasi</text>

  <rect x="500" y="130" width="340" height="220" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="670" y="166" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#16a34a">2. REJALASHTIR</text>
  <text x="670" y="194" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Muhim + Shoshilinch emas</text>
  <text x="670" y="232" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Test yozish, refactoring, o'rganish</text>
  <text x="670" y="256" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Hujjat, sog'liq, rejalashtirish</text>
  <text x="670" y="292" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#16a34a">Eng qadrli zona</text>

  <rect x="120" y="370" width="340" height="200" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="290" y="406" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#d97706">3. DELEGATSIYA / QISQART</text>
  <text x="290" y="434" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Shoshilinch + Muhim emas</text>
  <text x="290" y="472" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Ba'zi yig'ilishlar, ko'p bildirishnoma</text>
  <text x="290" y="496" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Boshqaning shoshilinch so'rovi</text>
  <text x="290" y="532" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#d97706">Aldamchi zona</text>

  <rect x="500" y="370" width="340" height="200" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="670" y="406" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#64748b">4. O'CHIR</text>
  <text x="670" y="434" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Muhim emas + Shoshilinch emas</text>
  <text x="670" y="472" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Maqsadsiz lenta aylantirish</text>
  <text x="670" y="496" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Befoyda chalg'ish, prokrastinatsiya</text>
  <text x="670" y="532" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">Vaqt o'g'risi</text>
</svg>
