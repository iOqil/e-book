<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540">
  <title>PARA metodi: Projects, Areas, Resources, Archives</title>
  <rect x="0" y="0" width="820" height="540" fill="#f8fafc"/>
  <text x="410" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">PARA metodi (Tiago Forte)</text>
  <text x="410" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Har bir eslatmani 4 toifadan biriga joylang: amaliylikka qarab</text>

  <rect x="60" y="110" width="330" height="170" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="225" y="150" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#2563eb">P — Projects (Loyihalar)</text>
  <text x="225" y="182" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Muddati va aniq natijasi bor ish</text>
  <text x="225" y="208" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Misol: login sahifasini chiqarish</text>
  <text x="225" y="246" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Eng faol, ustuvor toifa</text>

  <rect x="430" y="110" width="330" height="170" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="595" y="150" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#16a34a">A — Areas (Mas'uliyat)</text>
  <text x="595" y="182" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Davomiy mas'uliyat, muddatsiz</text>
  <text x="595" y="208" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Misol: sog'liq, jamoa, on-call</text>
  <text x="595" y="246" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Standartni saqlash</text>

  <rect x="60" y="300" width="330" height="170" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="225" y="340" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#7c3aed">R — Resources (Manbalar)</text>
  <text x="225" y="372" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Kelajakda foydali mavzular</text>
  <text x="225" y="398" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Misol: SQL, dizayn, cheat sheet</text>
  <text x="225" y="436" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Qiziqish va o'rganish</text>

  <rect x="430" y="300" width="330" height="170" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="595" y="340" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#475569">Ar — Archives (Arxiv)</text>
  <text x="595" y="372" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Tugagan yoki nofaol narsa</text>
  <text x="595" y="398" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Misol: yopilgan loyiha eslatmasi</text>
  <text x="595" y="436" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">O'chirmang: ko'zdan yashiring</text>

  <text x="410" y="510" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Faollik kamaygani sari yuqoridan pastga: Project to Area to Resource to Archive</text>
</svg>
