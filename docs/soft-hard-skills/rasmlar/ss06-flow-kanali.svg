<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600">
  <title>Flow kanali: qiyinlik va mahorat muvozanati</title>
  <rect x="0" y="0" width="820" height="600" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Flow kanali</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Flow vazifa qiyinligi va sizning mahoratingiz muvozanatda bo'lganda yuzaga keladi</text>

  <line x1="120" y1="120" x2="120" y2="500" stroke="#334155" stroke-width="2"/>
  <line x1="120" y1="500" x2="720" y2="500" stroke="#334155" stroke-width="2"/>
  <text x="120" y="540" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">past</text>
  <text x="720" y="540" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">yuqori</text>
  <text x="420" y="568" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#334155">Mahorat (sizning darajangiz)</text>
  <text x="95" y="500" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155" transform="rotate(-90 95 500)">past</text>
  <text x="95" y="130" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155" transform="rotate(-90 95 130)">yuqori</text>
  <text x="70" y="310" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#334155" transform="rotate(-90 70 310)">Qiyinlik (vazifa)</text>

  <polygon points="120,500 720,120 720,210 210,500" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="470" y="320" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#2563eb" transform="rotate(-32 470 320)">FLOW</text>
  <text x="478" y="350" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb" transform="rotate(-32 478 350)">to'liq berilish</text>

  <polygon points="120,500 120,120 720,120" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" opacity="0.5"/>
  <text x="270" y="185" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">TASHVISH</text>
  <text x="270" y="210" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">qiyinlik mahoratdan baland</text>

  <polygon points="120,500 720,500 720,120" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>
  <text x="560" y="455" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#d97706">ZERIKISH</text>
  <text x="560" y="480" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#d97706">mahorat qiyinlikdan baland</text>

  <text x="410" y="595" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">Mahorat o'sgani sayin flowda qolish uchun qiyinlikni ham oshirib borish kerak</text>
</svg>
