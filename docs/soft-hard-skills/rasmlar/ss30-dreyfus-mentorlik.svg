<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540">
  <title>Dreyfus 5 bosqichi va mentorlik sikli</title>
  <rect x="0" y="0" width="820" height="540" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Mahorat: qoidadan intuitsiyaga</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Dreyfus aka-uka modeli — 5 bosqich</text>

  <rect x="40" y="100" width="150" height="120" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="115" y="150" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">Novice</text>
  <text x="115" y="178" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Qoidaga</text>
  <text x="115" y="196" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">ergashadi</text>

  <rect x="200" y="100" width="150" height="120" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="275" y="143" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#b45309">Advanced</text>
  <text x="275" y="162" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#b45309">beginner</text>
  <text x="275" y="190" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Kontekstni</text>
  <text x="275" y="208" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">seza boshlaydi</text>

  <rect x="360" y="100" width="150" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="435" y="150" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">Competent</text>
  <text x="435" y="178" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Reja tuzadi,</text>
  <text x="435" y="196" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">javobgar</text>

  <rect x="520" y="100" width="150" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="595" y="150" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">Proficient</text>
  <text x="595" y="178" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Butunni</text>
  <text x="595" y="196" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">ko'radi</text>

  <rect x="680" y="100" width="140" height="120" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="750" y="150" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">Expert</text>
  <text x="750" y="178" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Intuitsiya</text>
  <text x="750" y="196" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">bilan</text>

  <text x="410" y="270" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">Mentorlik sikli: o'rganib qolmaydi, o'rgatib mustahkamlanadi</text>

  <circle cx="220" cy="400" r="70" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="395" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">O'rgan</text>
  <text x="220" y="418" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">mentordan</text>

  <circle cx="410" cy="400" r="70" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="395" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">Qo'lla</text>
  <text x="410" y="418" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">amaliyotda</text>

  <circle cx="600" cy="400" r="70" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="600" y="395" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#7c3aed">O'rgat</text>
  <text x="600" y="418" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">boshqaga</text>

  <path d="M 295 388 L 335 388" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ar30)"/>
  <path d="M 485 388 L 525 388" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ar30)"/>
  <path d="M 600 475 Q 410 520 220 475" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ar30)"/>
  <defs>
    <marker id="ar30" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
