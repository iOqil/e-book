<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540">
  <title>Abstraksiya narvoni: implementatsiya detalidan biznes qiymatigacha</title>
  <rect x="0" y="0" width="860" height="540" fill="#f8fafc"/>
  <text x="430" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Abstraksiya narvoni</text>
  <text x="430" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Auditoriyaga qarab to'g'ri pog'onani tanlang</text>

  <!-- vertical axis arrow -->
  <line x1="70" y1="470" x2="70" y2="110" stroke="#334155" stroke-width="2"/>
  <polygon points="70,100 64,116 76,116" fill="#334155"/>
  <text x="36" y="300" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b" transform="rotate(-90 36 300)">past detal  ->  yuqori qiymat</text>

  <!-- Level 4: business value (top) -->
  <rect x="120" y="100" width="660" height="74" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="140" y="130" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#7c3aed">4. Biznes qiymati</text>
  <text x="140" y="154" font-family="Segoe UI" font-size="13" fill="#334155">"To'lov tezroq, mijoz kamroq tashlab ketadi" - rahbar, mijoz</text>

  <!-- Level 3: capability -->
  <rect x="120" y="190" width="660" height="74" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="220" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">3. Imkoniyat / xatti-harakat</text>
  <text x="140" y="244" font-family="Segoe UI" font-size="13" fill="#334155">"To'lov sahifasi 4 soniya o'rniga 1 soniyada ochiladi" - menejer, PM</text>

  <!-- Level 2: design -->
  <rect x="120" y="280" width="660" height="74" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="310" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">2. Dizayn / yondashuv</text>
  <text x="140" y="334" font-family="Segoe UI" font-size="13" fill="#334155">"Sekin so'rovga indeks qo'shamiz, keshlash bilan to'ldiramiz" - jamoa, lead</text>

  <!-- Level 1: implementation (bottom) -->
  <rect x="120" y="370" width="660" height="74" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="140" y="400" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#b45309">1. Implementatsiya detali</text>
  <text x="140" y="424" font-family="Segoe UI" font-size="13" fill="#334155">"users.email ustuniga B-tree indeks, EXPLAIN full scan ko'rsatyapti" - junior</text>

  <text x="430" y="490" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Xato = noto'g'ri pog'ona: mijozga 1-darajada, junior'ga faqat 4-darajada gapirish.</text>
  <text x="430" y="514" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Avval tinglovchini, keyin pog'onani tanlang - keyin so'zni.</text>
</svg>
