<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560">
  <title>Diataxis ramkasi: hujjatning to'rt turi 2x2 matritsada</title>
  <rect x="0" y="0" width="860" height="560" fill="#f8fafc"/>
  <text x="430" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Diataxis: hujjatning to'rt turi</text>
  <text x="430" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Ikki o'lchov: o'quvchi nima qilyapti x mazmun qanaqa</text>

  <!-- Axis labels -->
  <text x="265" y="108" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155">O'rganish (study)</text>
  <text x="595" y="108" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155">Ish (work)</text>
  <text x="90" y="225" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155" transform="rotate(-90 90 225)">Amaliy (action)</text>
  <text x="90" y="425" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155" transform="rotate(-90 90 425)">Nazariy (cognition)</text>

  <!-- Tutorial: study + action -->
  <rect x="130" y="125" width="330" height="195" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="295" y="160" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#16a34a">O'quv qo'llanma</text>
  <text x="295" y="182" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">tutorial</text>
  <text x="295" y="214" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Maqsad: o'rgatish</text>
  <text x="295" y="240" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Yangi boshlovchini qo'lidan</text>
  <text x="295" y="260" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">ushlab oxiriga olib boradi</text>
  <text x="295" y="294" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">"Birinchi botni yarataylik"</text>

  <!-- How-to: work + action -->
  <rect x="465" y="125" width="330" height="195" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="630" y="160" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#2563eb">Amaliy qo'llanma</text>
  <text x="630" y="182" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">how-to</text>
  <text x="630" y="214" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Maqsad: muammo yechish</text>
  <text x="630" y="240" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Aniq vazifani bajarish uchun</text>
  <text x="630" y="260" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">qadamlar (oldindan biluvchiga)</text>
  <text x="630" y="294" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">"Loginni qanday sozlash"</text>

  <!-- Reference: work + cognition -->
  <rect x="465" y="335" width="330" height="195" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="630" y="370" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#7c3aed">Ma'lumotnoma</text>
  <text x="630" y="392" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">reference</text>
  <text x="630" y="424" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Maqsad: aniqlik</text>
  <text x="630" y="450" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Quruq, to'liq, tekshiriladigan</text>
  <text x="630" y="470" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">tavsif (qidirib topiladi)</text>
  <text x="630" y="504" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#7c3aed">"API endpointlar ro'yxati"</text>

  <!-- Explanation: study + cognition -->
  <rect x="130" y="335" width="330" height="195" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="295" y="370" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#b45309">Tushuntirish</text>
  <text x="295" y="392" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">explanation</text>
  <text x="295" y="424" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Maqsad: anglatish</text>
  <text x="295" y="450" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Nega shunday, kontekst,</text>
  <text x="295" y="470" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">sabab va fikrlash mantig'i</text>
  <text x="295" y="504" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#b45309">"Nega bu arxitektura"</text>
</svg>
