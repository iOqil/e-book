<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540">
  <title>Maqsadli amaliyot sikli: maqsad, chegarada mashq, fikr-mulohaza, tahlil, takror</title>
  <rect x="0" y="0" width="820" height="540" fill="#f8fafc"/>
  <text x="410" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Maqsadli amaliyot sikli</text>
  <text x="410" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Oddiy takror emas — har aylanishda bir oz qiyinroq</text>

  <!-- center circle -->
  <circle cx="410" cy="300" r="64" fill="#eef2ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="410" y="296" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#7c3aed">Deliberate</text>
  <text x="410" y="318" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#7c3aed">practice</text>

  <!-- node 1: maqsad (top) -->
  <rect x="310" y="108" width="200" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="138" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">1. Aniq maqsad</text>
  <text x="410" y="159" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Bitta zaif joyni tanla</text>

  <!-- node 2: chegarada mashq (right) -->
  <rect x="582" y="200" width="210" height="62" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="687" y="230" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#b45309">2. Chegarada mashq</text>
  <text x="687" y="251" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Qulay zonadan tashqari</text>

  <!-- node 3: fikr-mulohaza (bottom right) -->
  <rect x="560" y="400" width="210" height="62" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="665" y="430" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">3. Fikr-mulohaza</text>
  <text x="665" y="451" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Darhol, aniq signal</text>

  <!-- node 4: tahlil (bottom left) -->
  <rect x="50" y="400" width="210" height="62" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="155" y="430" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">4. Xatoni tahlil</text>
  <text x="155" y="451" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Nega xato bo'ldi?</text>

  <!-- node 5: takror (left) -->
  <rect x="28" y="200" width="210" height="62" rx="10" fill="#eef2ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="133" y="230" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#7c3aed">5. Takror + tuzat</text>
  <text x="133" y="251" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Endi sal qiyinroq</text>

  <!-- arrows around -->
  <path d="M 510 145 Q 640 160 690 196" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M 687 262 Q 700 340 670 396" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M 558 432 Q 410 470 262 432" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M 150 398 Q 120 340 133 264" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M 133 198 Q 180 160 308 144" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
