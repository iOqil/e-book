<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600">
  <title>Radical Candor 2x2 matritsasi (Kim Scott)</title>
  <rect x="0" y="0" width="820" height="600" fill="#f8fafc"/>
  <text x="410" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Radical Candor matritsasi</text>
  <text x="410" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Kim Scott: ikki o'q -- g'amxo'rlik va to'g'ridan-to'g'rilik</text>

  <!-- Vertical axis label (Care personally) -->
  <text x="44" y="320" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#334155" transform="rotate(-90 44 320)">Shaxsan g'amxo'rlik qiling  -- yuqoriga</text>

  <!-- Horizontal axis label (Challenge directly) -->
  <text x="455" y="582" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#334155">To'g'ridan-to'g'ri ayting  -- o'ngga</text>

  <!-- Axes lines -->
  <line x1="100" y1="110" x2="100" y2="540" stroke="#94a3b8" stroke-width="2"/>
  <line x1="100" y1="540" x2="810" y2="540" stroke="#94a3b8" stroke-width="2"/>
  <path d="M100 110 l-6 12 h12 z" fill="#94a3b8"/>
  <path d="M810 540 l-12 -6 v12 z" fill="#94a3b8"/>

  <!-- Top-left: Ruinous Empathy -->
  <rect x="120" y="130" width="320" height="180" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="280" y="166" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#b45309">Ruinous Empathy</text>
  <text x="280" y="190" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Halokatli hamdardlik</text>
  <text x="280" y="222" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">G'amxo'r, lekin aytmaydi.</text>
  <text x="280" y="244" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">"Xafa bo'lmasin" deb jim turadi.</text>
  <text x="280" y="276" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#1e293b">Eng keng tarqalgan xato.</text>
  <text x="280" y="296" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#1e293b">Yaxshilik niqobidagi zarar.</text>

  <!-- Top-right: Radical Candor -->
  <rect x="470" y="130" width="320" height="180" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <text x="630" y="166" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#16a34a">Radical Candor</text>
  <text x="630" y="190" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Samimiy to'g'rilik -- MAQSAD</text>
  <text x="630" y="222" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">G'amxo'r VA to'g'ridan-to'g'ri.</text>
  <text x="630" y="244" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">"Yaxshi ko'rganim uchun aytaman."</text>
  <text x="630" y="276" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#1e293b">Qiyin haqiqatni hurmat bilan.</text>
  <text x="630" y="296" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#1e293b">Aniq bo'lish -- mehribonlik.</text>

  <!-- Bottom-left: Manipulative Insincerity -->
  <rect x="120" y="335" width="320" height="180" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="280" y="371" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#475569">Manipulative Insincerity</text>
  <text x="280" y="395" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Riyokor manipulyatsiya</text>
  <text x="280" y="427" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Na g'amxo'rlik, na to'g'rilik.</text>
  <text x="280" y="449" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Orqavorotdan, soxta maqtov.</text>
  <text x="280" y="481" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#1e293b">Eng yomon kvadrant.</text>

  <!-- Bottom-right: Obnoxious Aggression -->
  <rect x="470" y="335" width="320" height="180" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="630" y="371" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#dc2626">Obnoxious Aggression</text>
  <text x="630" y="395" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Qo'pol tajovuz</text>
  <text x="630" y="427" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">To'g'ri aytadi, lekin g'amxo'rsiz.</text>
  <text x="630" y="449" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Haqorat, mensimaslik.</text>
  <text x="630" y="481" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#1e293b">To'g'ri so'z, noto'g'ri usul.</text>
</svg>
