<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540">
  <title>Hujjat o'quvchisi va maqsadi: kim o'qiydi va qaysi hujjat unga kerak</title>
  <rect x="0" y="0" width="860" height="540" fill="#f8fafc"/>
  <text x="430" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Kim o'qiydi -&gt; qaysi hujjat kerak</text>
  <text x="430" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Hujjatni o'quvchidan boshlang, o'zingizdan emas</text>

  <!-- Column headers -->
  <text x="215" y="110" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#334155">O'quvchi (kim)</text>
  <text x="540" y="110" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#334155">Savoli</text>
  <text x="775" y="110" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#334155">Hujjat</text>

  <!-- Row 1 -->
  <rect x="40" y="130" width="350" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="60" y="160" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">Yangi a'zo (onboarding)</text>
  <text x="60" y="184" font-family="Segoe UI" font-size="13" fill="#334155">Bu loyihaga qanday kiraman?</text>
  <text x="545" y="172" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">"Qaysidan boshlayman?"</text>
  <rect x="690" y="148" width="135" height="36" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="757" y="171" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a">README</text>

  <!-- Row 2 -->
  <rect x="40" y="215" width="350" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="245" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">Navbatchi muhandis</text>
  <text x="60" y="269" font-family="Segoe UI" font-size="13" fill="#334155">Tunda servis qulab tushdi!</text>
  <text x="545" y="257" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">"Hozir nima qilaman?"</text>
  <rect x="690" y="233" width="135" height="36" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="757" y="256" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#2563eb">Runbook</text>

  <!-- Row 3 -->
  <rect x="40" y="300" width="350" height="70" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="60" y="330" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">API ishlatuvchi dasturchi</text>
  <text x="60" y="354" font-family="Segoe UI" font-size="13" fill="#334155">Bu funksiya nima qaytaradi?</text>
  <text x="545" y="342" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">"Aniq qiymat qanaqa?"</text>
  <rect x="690" y="318" width="135" height="36" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="757" y="341" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#7c3aed">API hujjati</text>

  <!-- Row 4 -->
  <rect x="40" y="385" width="350" height="70" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="60" y="415" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#b45309">Kelajakdagi qaror izlovchi</text>
  <text x="60" y="439" font-family="Segoe UI" font-size="13" fill="#334155">Nega buni shunday qilishgan?</text>
  <text x="545" y="427" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">"Nega bu yo'l tanlangan?"</text>
  <rect x="690" y="403" width="135" height="36" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="757" y="426" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#b45309">ADR</text>

  <text x="430" y="500" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Har xil o'quvchi - har xil savol - har xil hujjat. Hammasini bittaga tiqishtirma.</text>
</svg>
