<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540">
  <title>Zo'riqsiz muloqot (NVC): 4 qadam</title>
  <rect x="0" y="0" width="860" height="540" fill="#f8fafc"/>
  <text x="430" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Zo'riqsiz muloqot (NVC) — 4 qadam</text>
  <text x="430" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Marshall Rosenberg: ayblovsiz, faktdan so'rovgacha</text>

  <!-- 1 Kuzatish -->
  <rect x="40" y="100" width="180" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="132" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">1. Kuzatish</text>
  <text x="130" y="158" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Baho bermay,</text>
  <text x="130" y="176" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">faqat fakt</text>
  <text x="130" y="208" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">"Oxirgi 3 standup'da</text>
  <text x="130" y="226" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">kechikding"</text>

  <!-- 2 His -->
  <rect x="240" y="100" width="180" height="150" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="330" y="132" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">2. His</text>
  <text x="330" y="158" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">O'z hissingni</text>
  <text x="330" y="176" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">ayt (ayblamay)</text>
  <text x="330" y="208" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">"Bu meni</text>
  <text x="330" y="226" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">xavotirga soldi"</text>

  <!-- 3 Ehtiyoj -->
  <rect x="440" y="100" width="180" height="150" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="530" y="132" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#7c3aed">3. Ehtiyoj</text>
  <text x="530" y="158" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">His ortidagi</text>
  <text x="530" y="176" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">ehtiyoj</text>
  <text x="530" y="208" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">"Menga ishonchli</text>
  <text x="530" y="226" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">reja kerak"</text>

  <!-- 4 So'rov -->
  <rect x="640" y="100" width="180" height="150" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="730" y="132" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">4. So'rov</text>
  <text x="730" y="158" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Aniq, bajariladigan</text>
  <text x="730" y="176" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">so'rov (buyruq emas)</text>
  <text x="730" y="208" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">"Keyingisida vaqtida</text>
  <text x="730" y="226" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">kelasanmi?"</text>

  <!-- arrows -->
  <path d="M222 175 L238 175" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M422 175 L438 175" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M622 175 L638 175" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 3 L0 6 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- bottom comparison -->
  <rect x="40" y="300" width="780" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="328" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">Ayblov:</text>
  <text x="150" y="328" font-family="Segoe UI" font-size="14" font-style="italic" fill="#334155">"Sen doim kechikasan, mas'uliyatsizsan!"</text>
  <text x="60" y="348" font-family="Segoe UI" font-size="13" fill="#64748b">Natija: himoyaga o'tadi, suhbat janjalga aylanadi.</text>

  <rect x="40" y="372" width="780" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="60" y="400" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">NVC:</text>
  <text x="150" y="400" font-family="Segoe UI" font-size="14" font-style="italic" fill="#334155">Kuzatish + His + Ehtiyoj + So'rov (yuqorida)</text>
  <text x="60" y="420" font-family="Segoe UI" font-size="13" fill="#64748b">Natija: tushunadi, birga yechim qidiradi.</text>

  <text x="430" y="470" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#475569">Fakt aniq, his sizniki, ehtiyoj ochiq, so'rov bajariladigan — to'rttasi ham.</text>
  <text x="430" y="500" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#94a3b8">Maqsad — kim haq ekanini isbotlash emas, bir-birini eshitish.</text>
</svg>
