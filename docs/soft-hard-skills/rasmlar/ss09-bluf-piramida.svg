<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540">
  <title>BLUF va teskari piramida: xulosa tepada, dalillar pastda</title>
  <rect x="0" y="0" width="860" height="540" fill="#f8fafc"/>
  <text x="430" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">BLUF: xulosa boshda</text>
  <text x="430" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Bottom Line Up Front - teskari piramida (Minto)</text>

  <!-- Inverted pyramid: three trapezoids, widest on top -->
  <!-- Level 1 conclusion (top, widest) -->
  <polygon points="180,110 680,110 600,200 260,200" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="430" y="145" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#2563eb">XULOSA / TAVSIYA</text>
  <text x="430" y="172" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">"Deploy'ni ertaga surishni taklif qilaman."</text>

  <!-- Level 2 reasons -->
  <polygon points="260,210 600,210 540,300 320,300" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="430" y="245" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">ASOSIY DALILLAR</text>
  <text x="430" y="272" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">2 ta kritik test sinadi, monitoring tayyor emas</text>

  <!-- Level 3 details (bottom, narrowest) -->
  <polygon points="320,310 540,310 490,400 370,400" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="430" y="345" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#b45309">TAFSILOTLAR</text>
  <text x="430" y="372" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">log, raqam, kontekst</text>

  <!-- arrow showing reading direction -->
  <line x1="740" y1="120" x2="740" y2="390" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="740,400 734,384 746,384" fill="#94a3b8"/>
  <text x="772" y="260" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b" transform="rotate(90 772 260)">o'qish chuqurligi ixtiyoriy</text>

  <text x="430" y="450" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Band o'quvchi faqat tepani o'qib qarorni biladi; xohlovchi pastga tushadi.</text>
  <text x="430" y="478" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">Teskarisi (detektiv tartibi): asosiy fikr oxirida - o'quvchi yo'qotadi.</text>
  <text x="430" y="506" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Tartib: nima (xulosa) -> nega (dalil) -> qanday (tafsilot).</text>
</svg>
