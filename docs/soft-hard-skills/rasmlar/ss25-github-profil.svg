<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560">
  <title>GitHub profil elementlari: profil README, pinned repozitoriylar, contribution grafigi</title>
  <rect x="0" y="0" width="840" height="560" fill="#f8fafc"/>
  <text x="420" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">GitHub profil — dasturchining vitrinasi</text>
  <text x="420" y="62" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Recruiter ko'radigan birinchi sahifa</text>

  <!-- 1. Profile README -->
  <rect x="40" y="92" width="760" height="118" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="92" cy="148" r="26" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="92" y="155" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#2563eb">1</text>
  <text x="140" y="128" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#2563eb">Profil README</text>
  <text x="140" y="154" font-family="Segoe UI" font-size="13" fill="#334155">Maxsus repo: username/username. Profil tepasida ko'rinadi.</text>
  <text x="140" y="178" font-family="Segoe UI" font-size="13" fill="#334155">Kimsiz, nimani bilasiz, qanday loyihalar, qanday bog'lanish — qisqa va aniq.</text>

  <!-- 2. Pinned repos -->
  <rect x="40" y="226" width="760" height="158" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <circle cx="92" cy="305" r="26" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="92" y="312" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#16a34a">2</text>
  <text x="140" y="258" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#16a34a">Pinned repozitoriylar (6 tagacha)</text>
  <text x="140" y="282" font-family="Segoe UI" font-size="13" fill="#334155">Eng yaxshi 2-3 loyihangizni yuqoriga qadab qo'ying — birinchi taassurot shu.</text>
  <rect x="140" y="298" width="200" height="68" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="158" y="322" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">savdo-bot</text>
  <text x="158" y="344" font-family="Segoe UI" font-size="13" fill="#64748b">Yaxshi README,</text>
  <text x="158" y="360" font-family="Segoe UI" font-size="13" fill="#64748b">jonli demo</text>
  <rect x="356" y="298" width="200" height="68" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="374" y="322" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">api-servis</text>
  <text x="374" y="344" font-family="Segoe UI" font-size="13" fill="#64748b">Toza kod,</text>
  <text x="374" y="360" font-family="Segoe UI" font-size="13" fill="#64748b">testlar</text>
  <rect x="572" y="298" width="200" height="68" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="590" y="322" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">portfolio-sayt</text>
  <text x="590" y="344" font-family="Segoe UI" font-size="13" fill="#64748b">Real muammo,</text>
  <text x="590" y="360" font-family="Segoe UI" font-size="13" fill="#64748b">deploy qilingan</text>

  <!-- 3. Contribution graph -->
  <rect x="40" y="400" width="760" height="148" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="92" cy="474" r="26" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="92" y="481" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#7c3aed">3</text>
  <text x="140" y="432" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#7c3aed">Contribution grafigi</text>
  <text x="140" y="456" font-family="Segoe UI" font-size="13" fill="#334155">"Yashil grafik" majburiy emas — sifatli commit muhim, har kuni yashil emas.</text>
  <!-- mini contribution squares -->
  <rect x="140" y="470" width="16" height="16" rx="3" fill="#ebedf0"/>
  <rect x="160" y="470" width="16" height="16" rx="3" fill="#9be9a8"/>
  <rect x="180" y="470" width="16" height="16" rx="3" fill="#40c463"/>
  <rect x="200" y="470" width="16" height="16" rx="3" fill="#ebedf0"/>
  <rect x="220" y="470" width="16" height="16" rx="3" fill="#30a14e"/>
  <rect x="240" y="470" width="16" height="16" rx="3" fill="#9be9a8"/>
  <rect x="260" y="470" width="16" height="16" rx="3" fill="#216e39"/>
  <rect x="280" y="470" width="16" height="16" rx="3" fill="#ebedf0"/>
  <rect x="300" y="470" width="16" height="16" rx="3" fill="#40c463"/>
  <rect x="320" y="470" width="16" height="16" rx="3" fill="#30a14e"/>
  <text x="140" y="514" font-family="Segoe UI" font-size="13" font-style="italic" fill="#dc2626">&#10007; Soxta commit "to'ldirish" — boshqalar darrov sezadi</text>
</svg>
