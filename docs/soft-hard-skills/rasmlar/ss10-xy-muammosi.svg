<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540">
  <title>XY muammosi: asl muammo o'rniga yechim haqida so'rash</title>
  <rect x="0" y="0" width="860" height="540" fill="#f8fafc"/>
  <text x="430" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">XY muammosi</text>
  <text x="430" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Asl muammo X, lekin siz tanlagan Y yechim haqida so'raysiz</text>

  <!-- X: real problem -->
  <rect x="60" y="110" width="240" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="145" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">X - asl muammo</text>
  <text x="180" y="172" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">"Faylning oxirgi 3 belgisini</text>
  <text x="180" y="190" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">olishim kerak"</text>

  <!-- arrow X -> Y -->
  <line x1="180" y1="210" x2="180" y2="255" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="180,262 174,250 186,250" fill="#94a3b8"/>
  <text x="200" y="240" font-family="Segoe UI" font-size="13" fill="#64748b">o'zicha yechim tanlaydi</text>

  <!-- Y: chosen (wrong) solution -->
  <rect x="60" y="265" width="240" height="100" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="180" y="300" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#b45309">Y - tanlangan yechim</text>
  <text x="180" y="327" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">"Fayl nomidan kengaytmani</text>
  <text x="180" y="345" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">qanday ajrataman?" (noto'g'ri yo'l)</text>

  <!-- arrow Y -> question -->
  <line x1="300" y1="315" x2="370" y2="315" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="377,315 365,309 365,321" fill="#94a3b8"/>

  <!-- The asked question -->
  <rect x="385" y="265" width="270" height="100" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="520" y="300" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">Berilgan savol = Y haqida</text>
  <text x="520" y="327" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Yordamchi Y'ni yechishga urinadi,</text>
  <text x="520" y="345" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">asl X'ni umuman ko'rmaydi</text>

  <!-- time lost -->
  <rect x="385" y="110" width="270" height="100" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="520" y="145" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">Natija: vaqt yo'qoladi</text>
  <text x="520" y="172" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Ikki tomon noto'g'ri Y ustida</text>
  <text x="520" y="190" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">ovora bo'ladi, X yechilmaydi</text>

  <!-- arrow up from question to result -->
  <line x1="520" y1="265" x2="520" y2="217" stroke="#dc2626" stroke-width="2"/>
  <polygon points="520,210 514,222 526,222" fill="#dc2626"/>

  <!-- Fix -->
  <rect x="690" y="160" width="130" height="160" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="755" y="195" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">Yechim</text>
  <text x="755" y="228" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Asl maqsadni</text>
  <text x="755" y="246" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">(X'ni) ham</text>
  <text x="755" y="264" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">ayting:</text>
  <text x="755" y="290" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a">"Men aslida</text>
  <text x="755" y="308" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a">... qilmoqchiman"</text>

  <text x="430" y="430" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Belgi: o'zingizni topshiriqning yarmini tushuntirayotganday his qilsangiz - balki XY tuzog'idasiz</text>
  <text x="430" y="468" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Doim "nima"ni emas, "nega"ni ham ayting: yordamchi yaxshiroq yo'lni taklif qilishi mumkin.</text>
  <text x="430" y="498" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Manba g'oyasi: Eric S. Raymond, "How To Ask Questions The Smart Way"</text>
</svg>
