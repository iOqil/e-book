<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560">
  <title>Chuqur ish va yuzaki ish spektri: misollar bilan taqqoslash</title>
  <rect x="0" y="0" width="860" height="560" fill="#f8fafc"/>
  <text x="430" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Chuqur ish va yuzaki ish spektri</text>
  <text x="430" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Vazifa kognitiv talab va yaratgan qiymati bo'yicha qayerda turadi?</text>

  <defs>
    <linearGradient id="spektr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect x="120" y="100" width="620" height="22" rx="11" fill="url(#spektr)"/>
  <text x="120" y="146" text-anchor="start" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">CHUQUR ISH</text>
  <text x="740" y="146" text-anchor="end" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#64748b">YUZAKI ISH</text>

  <rect x="80" y="180" width="350" height="320" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="255" y="214" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#16a34a">Chuqur ish</text>
  <text x="255" y="240" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Kognitiv talabchan, chalg'ishsiz</text>
  <text x="100" y="278" font-family="Segoe UI" font-size="14" fill="#334155">+ Murakkab algoritm yozish</text>
  <text x="100" y="308" font-family="Segoe UI" font-size="14" fill="#334155">+ Yangi tizimni dizayn qilish</text>
  <text x="100" y="338" font-family="Segoe UI" font-size="14" fill="#334155">+ Qiyin bug'ni debug qilish</text>
  <text x="100" y="368" font-family="Segoe UI" font-size="14" fill="#334155">+ Begona kodbazani o'rganish</text>
  <text x="100" y="398" font-family="Segoe UI" font-size="14" fill="#334155">+ Diqqat bilan o'qish/yozish</text>
  <text x="255" y="448" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">Takrorlanmas qiymat</text>
  <text x="255" y="474" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#16a34a">Mahoratni o'stiradi</text>

  <rect x="450" y="180" width="350" height="320" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="625" y="214" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#64748b">Yuzaki ish</text>
  <text x="625" y="240" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Oson, ko'pincha uzilgan holatda ham bajariladi</text>
  <text x="470" y="278" font-family="Segoe UI" font-size="14" fill="#334155">- Emailga javob berish</text>
  <text x="470" y="308" font-family="Segoe UI" font-size="14" fill="#334155">- Chat xabarlarini kuzatish</text>
  <text x="470" y="338" font-family="Segoe UI" font-size="14" fill="#334155">- Oddiy statusli yig'ilish</text>
  <text x="470" y="368" font-family="Segoe UI" font-size="14" fill="#334155">- Ticket maydonini to'ldirish</text>
  <text x="470" y="398" font-family="Segoe UI" font-size="14" fill="#334155">- Mayda administrativ ish</text>
  <text x="625" y="448" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#64748b">Kerak, lekin almashtirsa bo'ladi</text>
  <text x="625" y="474" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">Ko'paysa qiymatni yutadi</text>

  <text x="430" y="534" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Maqsad: yuzaki ishni nazorat ostiga olib, chuqur ish uchun joy ochish</text>
</svg>
