<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540">
  <title>SBI modeli: Holat, Xatti-harakat, Ta'sir</title>
  <rect x="0" y="0" width="860" height="540" fill="#f8fafc"/>
  <text x="430" y="44" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">SBI modeli: aniq feedbackning uch qadami</text>
  <text x="430" y="72" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Ayblamasdan, faqat kuzatilgan faktni ayting (Center for Creative Leadership)</text>

  <!-- Step 1: Situation -->
  <rect x="40" y="110" width="240" height="210" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="70" cy="142" r="16" fill="#2563eb"/>
  <text x="70" y="148" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#ffffff">S</text>
  <text x="160" y="148" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#2563eb">Situation</text>
  <text x="160" y="172" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Holat: qachon, qayerda</text>
  <text x="160" y="208" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Kontekstni belgilang.</text>
  <text x="160" y="228" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Eslab qoladigan voqea.</text>
  <text x="160" y="266" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#1e293b">"Kechagi sprint</text>
  <text x="160" y="286" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#1e293b">demosida..."</text>

  <!-- Arrow 1 -->
  <path d="M286 215 L308 215" stroke="#94a3b8" stroke-width="3" fill="none"/>
  <path d="M308 215 l-9 -6 v12 z" fill="#94a3b8"/>

  <!-- Step 2: Behavior -->
  <rect x="310" y="110" width="240" height="210" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="340" cy="142" r="16" fill="#f59e0b"/>
  <text x="340" y="148" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#ffffff">B</text>
  <text x="430" y="148" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#b45309">Behavior</text>
  <text x="430" y="172" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Xatti-harakat: aniq</text>
  <text x="430" y="208" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Kuzatilgan, ayblovsiz.</text>
  <text x="430" y="228" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Yorliq emas, fakt.</text>
  <text x="430" y="266" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#1e293b">"...testsiz PR'ni</text>
  <text x="430" y="286" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#1e293b">merge qilding..."</text>

  <!-- Arrow 2 -->
  <path d="M556 215 L578 215" stroke="#94a3b8" stroke-width="3" fill="none"/>
  <path d="M578 215 l-9 -6 v12 z" fill="#94a3b8"/>

  <!-- Step 3: Impact -->
  <rect x="580" y="110" width="240" height="210" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <circle cx="610" cy="142" r="16" fill="#16a34a"/>
  <text x="610" y="148" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#ffffff">I</text>
  <text x="700" y="148" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#16a34a">Impact</text>
  <text x="700" y="172" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Ta'sir: natija, his</text>
  <text x="700" y="208" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Nima sodir bo'ldi.</text>
  <text x="700" y="228" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Nega ahamiyatli.</text>
  <text x="700" y="266" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#1e293b">"...prod'da bug</text>
  <text x="700" y="286" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#1e293b">chiqdi, ishonch tushdi"</text>

  <!-- Bad vs good comparison -->
  <rect x="40" y="360" width="780" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="64" y="386" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">Noaniq (yomon):</text>
  <text x="220" y="386" font-family="Segoe UI" font-size="14" fill="#334155">"Sen e'tiborsizsan, doim shoshasan." -- yorliq, ayblov, himoyaga turtki.</text>
  <text x="64" y="408" font-family="Segoe UI" font-size="14" fill="#64748b">Yorliqqa qarshi bahslashish mumkin; faktga qarshi -- yo'q.</text>

  <rect x="40" y="430" width="780" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="64" y="456" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">SBI (yaxshi):</text>
  <text x="180" y="456" font-family="Segoe UI" font-size="14" fill="#334155">"Kechagi demoda (S) testsiz merge qilding (B), prod'da bug chiqdi (I)."</text>
  <text x="64" y="478" font-family="Segoe UI" font-size="14" fill="#64748b">Aniq, kuzatilgan, hal qilsa bo'ladigan -- shaxsga emas, harakatga qaratilgan.</text>
</svg>
