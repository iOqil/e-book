<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520">
  <title>Tuckman jamoa bosqichlari: samaradorlik egri chizigi</title>
  <rect x="0" y="0" width="840" height="520" fill="#f8fafc"/>
  <text x="420" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Tuckman bosqichlari</text>
  <text x="420" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Har jamoa bu yo'ldan o'tadi — storming normal hodisa</text>

  <!-- Axes -->
  <line x1="90" y1="430" x2="790" y2="430" stroke="#334155" stroke-width="2"/>
  <line x1="90" y1="430" x2="90" y2="110" stroke="#334155" stroke-width="2"/>
  <text x="440" y="470" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Vaqt</text>
  <text x="60" y="270" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b" transform="rotate(-90 60 270)">Samaradorlik</text>

  <!-- Performance curve: forming(orta) -> storming(pasayish) -> norming(ko'tarilish) -> performing(yuqori) -->
  <path d="M 130 270 C 200 280, 230 360, 270 380 C 320 400, 380 360, 430 300 C 500 220, 560 160, 720 150"
        fill="none" stroke="#2563eb" stroke-width="4"/>

  <!-- Stage markers -->
  <circle cx="130" cy="270" r="7" fill="#7c3aed"/>
  <circle cx="270" cy="380" r="7" fill="#dc2626"/>
  <circle cx="430" cy="300" r="7" fill="#f59e0b"/>
  <circle cx="720" cy="150" r="7" fill="#16a34a"/>

  <!-- Stage labels -->
  <text x="130" y="240" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#7c3aed">1. Forming</text>
  <text x="130" y="500" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Shakllanish</text>

  <text x="270" y="412" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">2. Storming</text>
  <text x="270" y="500" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">To'qnashuv</text>

  <text x="430" y="272" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#f59e0b">3. Norming</text>
  <text x="430" y="500" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Me'yorlashish</text>

  <text x="720" y="128" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">4. Performing</text>
  <text x="720" y="500" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Samaradorlik</text>
</svg>
