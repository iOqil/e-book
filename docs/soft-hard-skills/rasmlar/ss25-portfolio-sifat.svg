<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540">
  <title>Portfolio loyiha sifat nazorat ro'yxati: README, deploy, toza kod, real muammo</title>
  <rect x="0" y="0" width="840" height="540" fill="#f8fafc"/>
  <text x="420" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Portfolio loyiha: sifat nazorat ro'yxati</text>
  <text x="420" y="62" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">2-3 tugallangan loyiha &gt; 20 yarim loyiha</text>

  <!-- Four quality pillars -->
  <rect x="40" y="92" width="370" height="190" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="64" y="124" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#2563eb">1. Yaxshi README</text>
  <text x="64" y="152" font-family="Segoe UI" font-size="13" fill="#334155">&#10003; Nima qiladi, nega qildingiz</text>
  <text x="64" y="178" font-family="Segoe UI" font-size="13" fill="#334155">&#10003; Skrinshot yoki GIF</text>
  <text x="64" y="204" font-family="Segoe UI" font-size="13" fill="#334155">&#10003; O'rnatish va ishga tushirish</text>
  <text x="64" y="230" font-family="Segoe UI" font-size="13" fill="#334155">&#10003; Texnologiyalar ro'yxati</text>
  <text x="64" y="262" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">Birinchi ko'riniladigan narsa</text>

  <rect x="430" y="92" width="370" height="190" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="454" y="124" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#16a34a">2. Jonli demo</text>
  <text x="454" y="152" font-family="Segoe UI" font-size="13" fill="#334155">&#10003; Deploy qilingan (URL bor)</text>
  <text x="454" y="178" font-family="Segoe UI" font-size="13" fill="#334155">&#10003; Bir klik bilan ko'rsa bo'ladi</text>
  <text x="454" y="204" font-family="Segoe UI" font-size="13" fill="#334155">&#10003; README'da havola</text>
  <text x="454" y="230" font-family="Segoe UI" font-size="13" fill="#334155">&#10003; Ishlaydi, buzilmagan</text>
  <text x="454" y="262" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">"Ishlaydi" deyish kifoya emas</text>

  <rect x="40" y="298" width="370" height="190" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="64" y="330" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#7c3aed">3. Toza kod</text>
  <text x="64" y="358" font-family="Segoe UI" font-size="13" fill="#334155">&#10003; Mazmunli nom, tartibli struktura</text>
  <text x="64" y="384" font-family="Segoe UI" font-size="13" fill="#334155">&#10003; Kalitlar/parollar yo'q (.env)</text>
  <text x="64" y="410" font-family="Segoe UI" font-size="13" fill="#334155">&#10003; Toza commit tarixi</text>
  <text x="64" y="436" font-family="Segoe UI" font-size="13" fill="#334155">&#10003; Sharh va testlar (imkon bo'lsa)</text>
  <text x="64" y="468" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">Recruiter kodga ham qaraydi</text>

  <rect x="430" y="298" width="370" height="190" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="454" y="330" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#b45309">4. Real muammo</text>
  <text x="454" y="358" font-family="Segoe UI" font-size="13" fill="#334155">&#10003; Haqiqiy ehtiyojni yechadi</text>
  <text x="454" y="384" font-family="Segoe UI" font-size="13" fill="#334155">&#10003; Tutorial nusxasi emas</text>
  <text x="454" y="410" font-family="Segoe UI" font-size="13" fill="#334155">&#10003; "Nega buni qurdim" hikoyasi</text>
  <text x="454" y="436" font-family="Segoe UI" font-size="13" fill="#334155">&#10003; Sizni qiziqtiradigan soha</text>
  <text x="454" y="468" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">Sifat &gt; son</text>

  <text x="420" y="518" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">Yarim qolgan 20 loyiha — bittasi ham hisoblanmaydi</text>
</svg>
