<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520">
  <title>Vaqt mintaqalari va ustma-ust ishlash oynasi</title>
  <rect x="0" y="0" width="860" height="520" fill="#f8fafc"/>
  <text x="430" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Vaqt mintaqalari va ustma-ust oyna</text>
  <text x="430" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Uchta zona, faqat 3 soat birga ishlaydi - qolgani asinxron</text>

  <!-- time axis labels -->
  <text x="150" y="120" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">06:00</text>
  <text x="290" y="120" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">10:00</text>
  <text x="430" y="120" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">14:00</text>
  <text x="570" y="120" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">18:00</text>
  <text x="710" y="120" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">22:00</text>

  <!-- overlap band highlight -->
  <rect x="430" y="135" width="140" height="270" fill="#fef9c3" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" rx="6"/>
  <text x="500" y="430" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#b45309">Ustma-ust oyna</text>
  <text x="500" y="452" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#92400e">14:00 - 17:00 (UTC)</text>

  <!-- Toshkent row -->
  <text x="120" y="172" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Toshkent</text>
  <rect x="220" y="155" width="350" height="34" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="395" y="177" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">Ish kuni 09:00 - 18:00</text>

  <!-- Berlin row -->
  <text x="120" y="232" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Berlin</text>
  <rect x="360" y="215" width="350" height="34" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="535" y="237" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">Ish kuni 09:00 - 18:00</text>

  <!-- New York row -->
  <text x="120" y="292" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Nyu-York</text>
  <rect x="500" y="275" width="280" height="34" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="640" y="297" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#7c3aed">Ish kuni 09:00 - 18:00</text>

  <!-- handoff arrow -->
  <text x="150" y="360" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155">Handoff (ishni topshirish):</text>
  <text x="150" y="384" font-family="Segoe UI" font-size="13" fill="#334155">Toshkent kun oxirida yozma xulosa qoldiradi -&gt;</text>
  <text x="150" y="404" font-family="Segoe UI" font-size="13" fill="#334155">Nyu-York uxlab turib o'qiydi va davom etadi.</text>

  <text x="430" y="492" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Sinxron narsani oynaga to'pla; qolganini yozma (asinxron) hal qil.</text>
</svg>
