<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520">
  <title>Tiqilib qolganda (stuck) chiqish strategiyalari</title>
  <rect x="0" y="0" width="840" height="520" fill="#f8fafc"/>
  <text x="420" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">"Stuck" — tiqilib qolganda</text>
  <text x="420" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Tiqilish normal holat — panik emas, strategiya. Yengildan boshlang</text>

  <!-- Center -->
  <circle cx="420" cy="280" r="62" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="420" y="276" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#dc2626">Tiqilib</text>
  <text x="420" y="298" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#dc2626">qoldim</text>

  <!-- Strategy nodes around -->
  <rect x="120" y="120" width="230" height="66" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="235" y="148" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">1. Tanaffus qiling</text>
  <text x="235" y="170" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Yuring, suv iching — diffuz fikrlash ishlaydi</text>

  <rect x="490" y="120" width="230" height="66" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="605" y="148" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">2. Rezina o'rdak</text>
  <text x="605" y="170" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Ovoz chiqarib tushuntiring (20-bob)</text>

  <rect x="120" y="374" width="230" height="66" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="235" y="402" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#b45309">3. Qism-masalaga qayting</text>
  <text x="235" y="424" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Kichikroq, ishlaydigan holatdan boshlang</text>

  <rect x="490" y="374" width="230" height="66" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="605" y="402" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">4. Yordam so'rang</text>
  <text x="605" y="424" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Nimani sinaganingizni aytib so'rang</text>

  <!-- spokes -->
  <line x1="358" y1="248" x2="300" y2="186" stroke="#cbd5e1" stroke-width="2.5"/>
  <line x1="482" y1="248" x2="540" y2="186" stroke="#cbd5e1" stroke-width="2.5"/>
  <line x1="358" y1="312" x2="300" y2="374" stroke="#cbd5e1" stroke-width="2.5"/>
  <line x1="482" y1="312" x2="540" y2="374" stroke="#cbd5e1" stroke-width="2.5"/>

  <text x="420" y="492" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Qoida: 15-30 daqiqa o'zingiz urinib ko'ring, keyin albatta yordam so'rang</text>
</svg>
