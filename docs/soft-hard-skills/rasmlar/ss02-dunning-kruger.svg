<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540">
  <title>Dunning-Kruger egri chizigi: ishonch va bilim</title>
  <rect x="0" y="0" width="860" height="540" fill="#f8fafc"/>
  <text x="430" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Dunning-Kruger egri chizigi</text>
  <text x="430" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">O'ziga ishonch (vertikal) tajriba ortishi bilan (gorizontal) qanday o'zgaradi</text>

  <!-- Axes -->
  <line x1="90" y1="450" x2="800" y2="450" stroke="#334155" stroke-width="2"/>
  <line x1="90" y1="450" x2="90" y2="110" stroke="#334155" stroke-width="2"/>
  <text x="445" y="490" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#334155">Tajriba / bilim (vaqt) -&gt;</text>
  <text x="58" y="285" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#334155" transform="rotate(-90 58 285)">Ishonch -&gt;</text>

  <!-- Curve: rise to foolish peak, drop to valley, slow climb -->
  <path d="M 90 360 C 120 200, 150 150, 200 150 C 250 150, 270 380, 340 410 C 400 432, 430 420, 500 380 C 600 320, 700 270, 790 235" fill="none" stroke="#2563eb" stroke-width="3.5"/>

  <!-- Foolish peak -->
  <circle cx="200" cy="150" r="6" fill="#dc2626"/>
  <text x="200" y="135" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">"Ahmoqlar cho'qqisi"</text>
  <text x="200" y="172" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Oz bilim = katta</text>
  <text x="200" y="188" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">ishonch</text>

  <!-- Valley -->
  <circle cx="340" cy="410" r="6" fill="#f59e0b"/>
  <text x="340" y="435" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#d97706">"Umidsizlik vodiysi"</text>
  <text x="345" y="392" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Bu yerda imposter</text>
  <text x="345" y="376" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">tuygusi kuchayadi</text>

  <!-- Slope -->
  <circle cx="620" cy="300" r="6" fill="#16a34a"/>
  <text x="640" y="290" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">"Bilim qiyaligi"</text>
  <text x="650" y="312" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Real ishonch asta tiklanadi</text>

  <!-- Expert -->
  <text x="790" y="220" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#7c3aed">Ekspert</text>
  <text x="790" y="255" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">"hali ko'p</text>
  <text x="790" y="271" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">narsa bor"</text>

  <text x="430" y="522" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">Dunning va Kruger, 1999 — egri chiziq sxematik tasvir, asl maqolada ayni shu shaklda emas</text>
</svg>
