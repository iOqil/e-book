<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540">
  <title>Bo'lib qidirish: muammo makonini yarimga bo'lib torayish</title>
  <rect x="0" y="0" width="820" height="540" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Bo'lib qidirish (divide &amp; conquer)</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Har tekshiruv qidiruv maydonini ikki barobar qisqartiradi</text>

  <!-- Level 1: full range -->
  <text x="60" y="120" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155">1-tekshiruv</text>
  <rect x="180" y="98" width="280" height="38" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="460" y="98" width="280" height="38" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="320" y="122" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">qiymat to'g'ri</text>
  <text x="600" y="122" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">qiymat noto'g'ri -&gt; muammo shu yarmda</text>

  <!-- Level 2 -->
  <text x="60" y="190" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155">2-tekshiruv</text>
  <rect x="460" y="168" width="140" height="38" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="600" y="168" width="140" height="38" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="530" y="192" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">to'g'ri</text>
  <text x="670" y="192" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">noto'g'ri</text>

  <!-- Level 3 -->
  <text x="60" y="260" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155">3-tekshiruv</text>
  <rect x="600" y="238" width="70" height="38" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="670" y="238" width="70" height="38" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="635" y="262" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">ok</text>
  <text x="705" y="262" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">bug!</text>

  <!-- arrow to found -->
  <text x="600" y="312" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">Topildi: ~10 qadamda 1000 ehtimoldan birini</text>

  <!-- divider -->
  <line x1="40" y1="345" x2="780" y2="345" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- where to apply -->
  <text x="410" y="378" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">Uch sahnada qo'llang</text>

  <rect x="40" y="398" width="230" height="100" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="426" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">Kod yo'li</text>
  <text x="155" y="452" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">o'rtaga log /</text>
  <text x="155" y="472" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">breakpoint qo'y</text>

  <rect x="295" y="398" width="230" height="100" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="410" y="426" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">Commit tarixi</text>
  <text x="410" y="452" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">git bisect:</text>
  <text x="410" y="472" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">yaxshi / yomon</text>

  <rect x="550" y="398" width="230" height="100" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="665" y="426" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">Komponentlar</text>
  <text x="665" y="452" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">pluginni o'chir,</text>
  <text x="665" y="472" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">mock bilan almasht</text>
</svg>
