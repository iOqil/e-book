<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540">
  <title>Nisbiy baholash texnikalari: futbolka o'lchami, Fibonachchi, planning poker</title>
  <rect x="0" y="0" width="820" height="540" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Nisbiy baholash texnikalari</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">"Bu vazifa kattaroqmi?" - absolyut soatdan ko'ra ishonchli</text>

  <!-- Block 1: T-shirt sizes -->
  <rect x="40" y="100" width="230" height="200" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="130" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">Futbolka o'lchami</text>
  <rect x="70" y="150" width="40" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="90" y="176" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">S</text>
  <rect x="120" y="145" width="48" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="144" y="176" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">M</text>
  <rect x="178" y="138" width="60" height="64" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="208" y="176" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">L</text>
  <text x="155" y="235" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Eng sodda, eng tez:</text>
  <text x="155" y="256" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">faqat nisbiy hajm</text>
  <text x="155" y="280" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">S &lt; M &lt; L &lt; XL</text>

  <!-- Block 2: Fibonacci -->
  <rect x="295" y="100" width="230" height="200" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="410" y="130" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#7c3aed">Fibonachchi shkalasi</text>
  <text x="410" y="178" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b">1 . 2 . 3 . 5 . 8 . 13</text>
  <text x="410" y="220" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Oraliq kengayadi: katta</text>
  <text x="410" y="241" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">vazifada noaniqlik ham</text>
  <text x="410" y="262" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">kattaroq bo'lishini aks ettiradi</text>
  <text x="410" y="287" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Story point birligi</text>

  <!-- Block 3: Planning poker -->
  <rect x="550" y="100" width="230" height="200" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="665" y="130" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">Planning poker</text>
  <rect x="585" y="148" width="44" height="60" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="607" y="184" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#16a34a">3</text>
  <rect x="640" y="148" width="44" height="60" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="662" y="184" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#16a34a">5</text>
  <rect x="695" y="148" width="44" height="60" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="717" y="184" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#16a34a">8</text>
  <text x="665" y="235" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Har kim yashirin karta</text>
  <text x="665" y="256" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">tanlaydi, birga ochadi.</text>
  <text x="665" y="280" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Farq = muhokama</text>

  <!-- Bottom rationale band -->
  <rect x="40" y="330" width="740" height="160" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="362" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">Nega nisbiy baholash absolyut soatdan yaxshi?</text>
  <text x="410" y="392" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Inson "bu necha soat?" degan savolga yomon javob beradi (optimizm).</text>
  <text x="410" y="418" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Lekin "bu vazifa anavidan kattaroqmi?" degan savolga ancha aniq javob beradi.</text>
  <text x="410" y="448" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Nisbiy hajm + jamoa tezligi (velocity) = vaqt bashorati - mutlaq vada emas.</text>
  <text x="410" y="476" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#7c3aed">Story point - bu hajm va murakkablik o'lchovi, soat emas</text>
</svg>
