<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500">
  <title>Pomodoro sikli: 25 daqiqa fokus va 5 daqiqa tanaffus, 4 dan keyin uzun tanaffus</title>
  <rect x="0" y="0" width="860" height="500" fill="#f8fafc"/>
  <text x="430" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Pomodoro sikli</text>
  <text x="430" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Francesco Cirillo, 1980-yillar oxiri — fokus va tanaffusni almashtirish</text>

  <!-- 4 pomodoro bloklari -->
  <rect x="40" y="120" width="150" height="120" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="115" y="160" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">Pomodoro 1</text>
  <text x="115" y="190" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#334155">25 daqiqa</text>
  <text x="115" y="214" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">to'liq fokus</text>

  <rect x="210" y="150" width="80" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="250" y="176" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a">5 daq</text>
  <text x="250" y="196" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">tanaffus</text>

  <rect x="310" y="120" width="150" height="120" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="385" y="160" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">Pomodoro 2</text>
  <text x="385" y="190" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#334155">25 daqiqa</text>
  <text x="385" y="214" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">to'liq fokus</text>

  <rect x="480" y="150" width="80" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="520" y="176" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a">5 daq</text>
  <text x="520" y="196" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">tanaffus</text>

  <rect x="580" y="120" width="150" height="120" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="655" y="160" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">Pomodoro 3</text>
  <text x="655" y="190" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#334155">25 daqiqa</text>
  <text x="655" y="214" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">to'liq fokus</text>

  <rect x="750" y="150" width="80" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="790" y="176" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a">5 daq</text>
  <text x="790" y="196" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">tanaffus</text>

  <rect x="310" y="290" width="150" height="120" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="385" y="330" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">Pomodoro 4</text>
  <text x="385" y="360" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#334155">25 daqiqa</text>
  <text x="385" y="384" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">to'liq fokus</text>

  <rect x="490" y="300" width="200" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="590" y="340" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">Uzun tanaffus</text>
  <text x="590" y="368" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#334155">15-30 daqiqa</text>
  <text x="590" y="390" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">4 pomodorodan keyin</text>

  <text x="220" y="370" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">4 sikl</text>
  <text x="220" y="390" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">to'lgach</text>

  <text x="430" y="455" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">Bitta pomodoro davomida chalg'ish taqiqlanadi: bo'linsa, hisob noldan boshlanadi</text>
</svg>
