<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520">
  <title>Hayajonni boshqarish texnikalari: tayyorgarlik, nafas, mashq, koz kontakti halqasi</title>
  <rect x="0" y="0" width="860" height="520" fill="#f8fafc"/>
  <text x="430" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Sahna hayajonini boshqarish</text>
  <text x="430" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Hayajon - normal. Maqsad uni yoqotish emas, boshqarish.</text>

  <!-- markaz -->
  <circle cx="430" cy="300" r="78" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="430" y="292" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#7c3aed">Tinch va</text>
  <text x="430" y="316" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#7c3aed">aniq gapirish</text>

  <!-- 1 Tayyorgarlik (top-left) -->
  <rect x="80" y="120" width="250" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="205" y="150" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">1. Tayyorgarlik</text>
  <text x="205" y="178" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Ovoz chiqarib mashq qil</text>
  <text x="205" y="200" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Ilk 30 soniyani yodla</text>
  <line x1="330" y1="200" x2="370" y2="250" stroke="#cbd5e1" stroke-width="2"/>

  <!-- 2 Nafas (top-right) -->
  <rect x="530" y="120" width="250" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="655" y="150" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">2. Nafas</text>
  <text x="655" y="178" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Sekin, chuqur nafas ol</text>
  <text x="655" y="200" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Boshlashdan oldin pauza</text>
  <line x1="530" y1="200" x2="490" y2="250" stroke="#cbd5e1" stroke-width="2"/>

  <!-- 3 Sekin gapirish (bottom-left) -->
  <rect x="80" y="380" width="250" height="100" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="205" y="410" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#b45309">3. Sekin gapir</text>
  <text x="205" y="438" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Pauzadan qorqma</text>
  <text x="205" y="460" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">"u-u-u" o'rniga jimlik</text>
  <line x1="330" y1="400" x2="370" y2="350" stroke="#cbd5e1" stroke-width="2"/>

  <!-- 4 Koz kontakti (bottom-right) -->
  <rect x="530" y="380" width="250" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="655" y="410" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">4. Koz kontakti</text>
  <text x="655" y="438" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Bir-bir odamga qara</text>
  <text x="655" y="460" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Slaydga emas, odamga</text>
  <line x1="530" y1="400" x2="490" y2="350" stroke="#cbd5e1" stroke-width="2"/>

  <text x="430" y="505" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#94a3b8">Tana fiziologiyasi: nafas sekinlashsa, miya "xavf yoq" deb hisoblaydi</text>
</svg>
