<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540">
  <title>Agile Manifestining 4 qadriyati: chap tomon o'ng tomondan ustun</title>
  <rect x="0" y="0" width="840" height="540" fill="#f8fafc"/>
  <text x="420" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Agile Manifestining 4 qadriyati</text>
  <text x="420" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">2001-yil, Snowbird (Utah), 17 dasturchi. "X ustun Y dan" - lekin Y ham qadrli</text>

  <!-- Column headers -->
  <text x="245" y="106" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">Bundan ustun qo'yamiz</text>
  <text x="640" y="106" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#64748b">Bundan (qadrli, lekin kamroq)</text>

  <!-- Row 1 -->
  <rect x="40" y="120" width="410" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="245" y="166" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">Individlar va o'zaro aloqa</text>
  <text x="480" y="166" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#94a3b8">&gt;</text>
  <rect x="510" y="120" width="290" height="80" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="655" y="166" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#64748b">jarayon va asboblar</text>

  <!-- Row 2 -->
  <rect x="40" y="215" width="410" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="245" y="261" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">Ishlaydigan dastur</text>
  <text x="480" y="261" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#94a3b8">&gt;</text>
  <rect x="510" y="215" width="290" height="80" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="655" y="261" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#64748b">to'liq hujjat</text>

  <!-- Row 3 -->
  <rect x="40" y="310" width="410" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="245" y="356" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">Mijoz bilan hamkorlik</text>
  <text x="480" y="356" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#94a3b8">&gt;</text>
  <rect x="510" y="310" width="290" height="80" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="655" y="356" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#64748b">shartnoma muzokarasi</text>

  <!-- Row 4 -->
  <rect x="40" y="405" width="410" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="245" y="451" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">O'zgarishga javob berish</text>
  <text x="480" y="451" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#94a3b8">&gt;</text>
  <rect x="510" y="405" width="290" height="80" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="655" y="451" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#64748b">rejaga qat'iy amal qilish</text>

  <!-- Footer note -->
  <text x="420" y="518" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Asosiy g'oya: moslashuvchanlik, qisqa sikllar, fikr-mulohaza - qadriyat, marosim emas.</text>
</svg>
