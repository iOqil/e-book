<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560">
  <title>T-shaped dasturchi: chuqurlik va kenglik modeli</title>
  <rect x="0" y="0" width="820" height="560" fill="#f8fafc"/>
  <text x="410" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">T-shaped dasturchi</text>
  <text x="410" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Bitta sohada chuqurlik + ko'p sohada keng ko'nikma</text>

  <!-- Gorizontal panel: kenglik -->
  <rect x="90" y="110" width="640" height="92" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="142" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">KENGLIK — keng soft va umumiy ko'nikmalar</text>
  <text x="170" y="176" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Muloqot</text>
  <text x="290" y="176" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Hamkorlik</text>
  <text x="410" y="176" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Mahsulot</text>
  <text x="530" y="176" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Dizayn</text>
  <text x="650" y="176" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">DevOps</text>

  <!-- Vertikal ustun: chuqurlik -->
  <rect x="350" y="202" width="120" height="290" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="250" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">CHUQURLIK</text>
  <text x="410" y="300" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Sizning</text>
  <text x="410" y="322" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">asosiy</text>
  <text x="410" y="344" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">sohangiz</text>
  <text x="410" y="392" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">masalan:</text>
  <text x="410" y="414" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Backend</text>
  <text x="410" y="436" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">arxitekturasi</text>

  <!-- Shakl turlari -->
  <text x="410" y="528" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">I-shaped: faqat chuqurlik · T-shaped: 1 chuqurlik + kenglik · M/Pi-shaped: bir nechta chuqurlik</text>
</svg>
