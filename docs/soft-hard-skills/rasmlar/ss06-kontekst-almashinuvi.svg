<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 580">
  <title>Kontekst almashinuvi narxi: uzluksiz fokus va tez-tez uzilgan ish</title>
  <rect x="0" y="0" width="860" height="580" fill="#f8fafc"/>
  <text x="430" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Kontekst almashinuvi narxi</text>
  <text x="430" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Har uzilish e'tibor qoldig'i qoldiradi va to'liq fokus qaytishi vaqt oladi</text>

  <text x="60" y="120" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#334155">Fokus chuqurligi</text>

  <rect x="80" y="140" width="700" height="170" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="100" y="168" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">A) Uzluksiz 90 daqiqalik blok</text>
  <polyline points="100,290 160,270 230,225 320,200 460,195 600,195 740,195" fill="none" stroke="#16a34a" stroke-width="3"/>
  <circle cx="600" cy="195" r="5" fill="#16a34a"/>
  <text x="600" y="180" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">to'liq chuqurlik</text>
  <text x="100" y="300" font-family="Segoe UI" font-size="13" fill="#64748b">Fokus asta ko'tarilib eng yuqori darajada uzoq qoladi</text>

  <rect x="80" y="330" width="700" height="200" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="100" y="358" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">B) Har 15 daqiqada uzilgan ish</text>
  <polyline points="100,500 150,480 200,455 240,450 250,500 300,480 350,460 390,455 400,500 450,480 500,462 540,458 550,500 600,482 650,468 690,462 700,500 740,485"
            fill="none" stroke="#dc2626" stroke-width="3"/>
  <line x1="250" y1="430" x2="250" y2="510" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="400" y1="430" x2="400" y2="510" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="550" y1="430" x2="550" y2="510" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="700" y1="430" x2="700" y2="510" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="250" y="424" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#d97706">uzilish</text>
  <text x="400" y="424" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#d97706">uzilish</text>
  <text x="550" y="424" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#d97706">uzilish</text>
  <text x="100" y="522" font-family="Segoe UI" font-size="13" fill="#64748b">Fokus to'liq chuqurlikka hech yetmaydi: har uzilishdan keyin qaytadan ko'tarilish kerak</text>

  <text x="430" y="560" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#dc2626">E'tibor qoldig'i: oldingi vazifa miyada qoladi, to'liq qaytish 20+ daqiqa olishi mumkin</text>
</svg>
