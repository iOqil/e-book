<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560">
  <title>Kodbazada navigatsiya: kirish nuqtasidan ma'lumot oqimini kuzatish</title>
  <rect x="0" y="0" width="840" height="560" fill="#f8fafc"/>
  <text x="420" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Kodbazada harakatlanish</text>
  <text x="420" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Hammasini o'qima — kirish nuqtasini top, ma'lumot oqimini kuzat</text>

  <defs>
    <marker id="ar21nav" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Kirish nuqtasi -->
  <rect x="290" y="100" width="260" height="64" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="420" y="128" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#7c3aed">Kirish nuqtasi</text>
  <text x="420" y="150" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">main / route / handler / test</text>

  <!-- Arrow down -->
  <line x1="420" y1="164" x2="420" y2="208" stroke="#475569" stroke-width="2.5" marker-end="url(#ar21nav)"/>

  <!-- Birinchi funksiya -->
  <rect x="290" y="210" width="260" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="420" y="237" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">So'rovni qabul qiluvchi funksiya</text>
  <text x="420" y="257" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">"go to definition" bilan kiring</text>

  <!-- Branch arrows -->
  <line x1="350" y1="270" x2="220" y2="318" stroke="#475569" stroke-width="2.5" marker-end="url(#ar21nav)"/>
  <line x1="490" y1="270" x2="620" y2="318" stroke="#475569" stroke-width="2.5" marker-end="url(#ar21nav)"/>

  <!-- Left child -->
  <rect x="90" y="320" width="250" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="215" y="347" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">Validatsiya / biznes mantiq</text>
  <text x="215" y="367" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">call hierarchy ni ochib ko'r</text>

  <!-- Right child -->
  <rect x="500" y="320" width="250" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="625" y="347" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">Ma'lumotlar bazasi qatlami</text>
  <text x="625" y="367" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">"follow the data" — oqimni kuzat</text>

  <!-- Down to result -->
  <line x1="215" y1="380" x2="360" y2="430" stroke="#475569" stroke-width="2.5" marker-end="url(#ar21nav)"/>
  <line x1="625" y1="380" x2="480" y2="430" stroke="#475569" stroke-width="2.5" marker-end="url(#ar21nav)"/>

  <!-- Result -->
  <rect x="290" y="432" width="260" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="420" y="459" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">Natija / javob</text>
  <text x="420" y="479" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">vazifaga tegishli qism — shu yo'l</text>

  <text x="420" y="525" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Asboblar: qidiruv (grep/IDE), debugger breakpoint, test va README, git tarixi</text>
</svg>
