<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540">
  <title>Masofaviy ish tuzoqlari va ularning yechimlari</title>
  <rect x="0" y="0" width="860" height="540" fill="#f8fafc"/>
  <text x="430" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Masofaviy ish tuzoqlari -&gt; yechim</text>
  <text x="430" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Har tuzoqning aniq, amaliy javobi bor</text>

  <!-- column headers -->
  <text x="245" y="105" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">Tuzoq</text>
  <text x="660" y="105" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">Yechim</text>

  <!-- Row 1: Yolg'izlik -->
  <rect x="60" y="125" width="370" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="80" y="155" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">Yolg'izlik / izolyatsiya</text>
  <text x="80" y="180" font-family="Segoe UI" font-size="13" fill="#334155">Kun bo'yi hech kim bilan</text>
  <text x="80" y="198" font-family="Segoe UI" font-size="13" fill="#334155">gaplashmaslik, uzilib qolish</text>
  <text x="445" y="170" font-family="Segoe UI" font-size="22" fill="#64748b">-&gt;</text>
  <rect x="480" y="125" width="370" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="155" font-family="Segoe UI" font-size="13" fill="#334155">Norasmiy aloqa (virtual qahva),</text>
  <text x="500" y="178" font-family="Segoe UI" font-size="13" fill="#334155">hamjamiyat, koworking, jamoa</text>
  <text x="500" y="196" font-family="Segoe UI" font-size="13" fill="#334155">bilan haftalik 1:1 suhbat.</text>

  <!-- Row 2: Chegara yo'qolishi -->
  <rect x="60" y="225" width="370" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="80" y="255" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">Chegara yo'qolishi</text>
  <text x="80" y="280" font-family="Segoe UI" font-size="13" fill="#334155">Ish va hayot aralashadi,</text>
  <text x="80" y="298" font-family="Segoe UI" font-size="13" fill="#334155">hech qachon "ish tugamaydi"</text>
  <text x="445" y="270" font-family="Segoe UI" font-size="22" fill="#64748b">-&gt;</text>
  <rect x="480" y="225" width="370" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="255" font-family="Segoe UI" font-size="13" fill="#334155">Aniq ish soatlari, alohida ish</text>
  <text x="500" y="278" font-family="Segoe UI" font-size="13" fill="#334155">joyi, "tugatish marosimi",</text>
  <text x="500" y="296" font-family="Segoe UI" font-size="13" fill="#334155">bildirishnomalarni o'chirish.</text>

  <!-- Row 3: Ko'rinmaslik -->
  <rect x="60" y="325" width="370" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="80" y="355" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">Ko'rinmaslik</text>
  <text x="80" y="380" font-family="Segoe UI" font-size="13" fill="#334155">Ishlayapsan, lekin hech kim</text>
  <text x="80" y="398" font-family="Segoe UI" font-size="13" fill="#334155">ko'rmaydi, ishonch susayadi</text>
  <text x="445" y="370" font-family="Segoe UI" font-size="22" fill="#64748b">-&gt;</text>
  <rect x="480" y="325" width="370" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="355" font-family="Segoe UI" font-size="13" fill="#334155">Ishni hujjatla, ortiqcha muloqot</text>
  <text x="500" y="378" font-family="Segoe UI" font-size="13" fill="#334155">qil (overcommunicate), jarayonni</text>
  <text x="500" y="396" font-family="Segoe UI" font-size="13" fill="#334155">ko'rinarli (PR, demo, yangilik).</text>

  <text x="430" y="450" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Tuzoqlar tabiiy - ularni bilib, oldindan tizim qur.</text>
  <text x="430" y="478" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Masofaviy ishda intizom va ko'rinarlilik o'z-o'zidan kelmaydi - ataylab quriladi.</text>
</svg>
