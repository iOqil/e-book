<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540">
  <title>Debugging ilmiy sikli: kuzatish, gipoteza, tajriba, xulosa</title>
  <rect x="0" y="0" width="820" height="540" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Debugging ilmiy sikli</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Har bir o'zgartirish - tajriba, qimor emas</text>

  <!-- Step 1: Kuzatish -->
  <rect x="300" y="100" width="220" height="78" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="132" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#2563eb">1. Kuzatish</text>
  <text x="410" y="158" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Bug qachon, qanday yuz beradi?</text>

  <!-- Step 2: Gipoteza -->
  <rect x="560" y="225" width="220" height="78" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="670" y="257" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#7c3aed">2. Gipoteza</text>
  <text x="670" y="283" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Sabab - bu, chunki...</text>

  <!-- Step 3: Tajriba -->
  <rect x="300" y="350" width="220" height="78" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="410" y="382" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#b45309">3. Tajriba</text>
  <text x="410" y="408" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Log qo'y, ishga tushir, kuzat</text>

  <!-- Step 4: Xulosa -->
  <rect x="40" y="225" width="220" height="78" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="150" y="257" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#16a34a">4. Xulosa</text>
  <text x="150" y="283" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Tasdiqla yoki rad et</text>

  <!-- arrows clockwise -->
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <path d="M 520 150 Q 640 165 660 222" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M 660 306 Q 600 380 523 392" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M 300 392 Q 200 380 160 306" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M 160 222 Q 180 165 297 150" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>

  <!-- center loop note -->
  <text x="410" y="258" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Rad etilsa -&gt;</text>
  <text x="410" y="280" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">yangi gipoteza</text>
  <text x="410" y="300" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">bilan qaytadan</text>

  <text x="410" y="500" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Dalil bilan ishlang - "menimcha" emas, "ko'rsatdim"</text>
</svg>
