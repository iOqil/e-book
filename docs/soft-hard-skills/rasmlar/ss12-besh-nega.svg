<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560">
  <title>Besh nega: muammodan ildiz sababga zinapoyadan pastga tushish</title>
  <rect x="0" y="0" width="820" height="560" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Besh nega (5 Whys)</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Toyota / Taiichi Ohno — ildiz sababni topish</text>

  <rect x="60" y="95" width="640" height="58" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="80" y="120" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">Muammo: sayt foydalanuvchilarga 500 xato qaytardi</text>
  <text x="80" y="142" font-family="Segoe UI" font-size="13" fill="#64748b">Belgini emas, sababni qidiramiz</text>

  <rect x="110" y="170" width="640" height="50" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="130" y="192" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">1. Nega?</text>
  <text x="130" y="211" font-family="Segoe UI" font-size="13" fill="#334155">Server bazaga ulana olmadi</text>

  <rect x="160" y="237" width="640" height="50" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="180" y="259" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">2. Nega?</text>
  <text x="180" y="278" font-family="Segoe UI" font-size="13" fill="#334155">Ulanishlar limiti tugadi</text>

  <rect x="160" y="304" width="640" height="50" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="180" y="326" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">3. Nega?</text>
  <text x="180" y="345" font-family="Segoe UI" font-size="13" fill="#334155">Ochilgan ulanishlar yopilmadi</text>

  <rect x="120" y="371" width="640" height="50" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="140" y="393" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">4. Nega?</text>
  <text x="140" y="412" font-family="Segoe UI" font-size="13" fill="#334155">Yangi kodda ulanish yopish unutilgan</text>

  <rect x="70" y="438" width="640" height="50" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="90" y="460" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#b45309">5. Nega?</text>
  <text x="90" y="479" font-family="Segoe UI" font-size="13" fill="#334155">Code review yo'q va lint qoidasi sozlanmagan</text>

  <rect x="120" y="505" width="580" height="44" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="532" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">Ildiz sabab: jarayon (review) yo'q — odam aybi emas</text>
</svg>
