<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560">
  <title>CV anatomiyasi: bo'limlar tartibi va zaif vs kuchli bullet misoli</title>
  <rect x="0" y="0" width="840" height="560" fill="#f8fafc"/>
  <text x="420" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">CV anatomiyasi</text>
  <text x="420" y="62" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Eng muhimi tepada — recruiter 6-10 soniya qaraydi</text>

  <!-- Left column: section order -->
  <rect x="40" y="92" width="320" height="440" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="120" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">Bo'limlar tartibi</text>

  <rect x="64" y="138" width="272" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="80" y="160" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">1. Aloqa</text>
  <text x="80" y="180" font-family="Segoe UI" font-size="13" fill="#64748b">Ism, email, GitHub, LinkedIn</text>

  <rect x="64" y="194" width="272" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="80" y="216" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">2. Qisqacha (summary)</text>
  <text x="80" y="236" font-family="Segoe UI" font-size="13" fill="#64748b">2-3 jumla: kimsiz, nima izlaysiz</text>

  <rect x="64" y="250" width="272" height="48" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="80" y="272" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">3. Tajriba</text>
  <text x="80" y="292" font-family="Segoe UI" font-size="13" fill="#64748b">Yutuqlar, raqamlar bilan</text>

  <rect x="64" y="306" width="272" height="48" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="80" y="328" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">4. Loyihalar</text>
  <text x="80" y="348" font-family="Segoe UI" font-size="13" fill="#64748b">Tajribasiz bo'lsa — eng muhim</text>

  <rect x="64" y="362" width="272" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="80" y="384" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">5. Ko'nikmalar</text>
  <text x="80" y="404" font-family="Segoe UI" font-size="13" fill="#64748b">Til, freymvork, vosita</text>

  <rect x="64" y="418" width="272" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="80" y="440" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">6. Ta'lim</text>
  <text x="80" y="460" font-family="Segoe UI" font-size="13" fill="#64748b">Diplom yoki kurslar</text>

  <text x="200" y="498" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">1-2 sahifa, tartibli, o'qishga oson</text>
  <text x="200" y="518" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">PDF formatda yuboring</text>

  <!-- Right column: weak vs strong bullet -->
  <rect x="400" y="92" width="400" height="210" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="120" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">Zaif bullet (vazifa)</text>
  <text x="424" y="156" font-family="Segoe UI" font-size="15" fill="#334155">&#10007; "API yozdim."</text>
  <text x="424" y="190" font-family="Segoe UI" font-size="13" fill="#64748b">Nima qilgani noaniq.</text>
  <text x="424" y="212" font-family="Segoe UI" font-size="13" fill="#64748b">Natija yo'q, raqam yo'q.</text>
  <text x="424" y="234" font-family="Segoe UI" font-size="13" fill="#64748b">Hammaning CV'sida bor —</text>
  <text x="424" y="256" font-family="Segoe UI" font-size="13" fill="#64748b">sizni ajratib turmaydi.</text>
  <text x="424" y="284" font-family="Segoe UI" font-size="13" font-style="italic" fill="#dc2626">"Men nima qildim?"</text>

  <rect x="400" y="322" width="400" height="210" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="350" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">Kuchli bullet (natija)</text>
  <text x="424" y="384" font-family="Segoe UI" font-size="14" fill="#334155">&#10003; "Javob vaqtini 40%</text>
  <text x="424" y="406" font-family="Segoe UI" font-size="14" fill="#334155">qisqartirgan REST API qurdim</text>
  <text x="424" y="428" font-family="Segoe UI" font-size="14" fill="#334155">(10 000 foydalanuvchi)."</text>
  <text x="424" y="462" font-family="Segoe UI" font-size="13" fill="#64748b">Harakat fe'li + natija + raqam.</text>
  <text x="424" y="484" font-family="Segoe UI" font-size="13" fill="#64748b">Ta'sirni ko'rsatadi.</text>
  <text x="424" y="512" font-family="Segoe UI" font-size="13" font-style="italic" fill="#16a34a">"Men qanday farq qildim?"</text>
</svg>
