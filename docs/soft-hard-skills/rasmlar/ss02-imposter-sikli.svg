<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600">
  <title>Imposter sindromi sikli</title>
  <rect x="0" y="0" width="820" height="600" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Imposter sindromi sikli</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Yutuq ham, mag'lubiyat ham "men firibgarman" tuygusini oziqlantiradi</text>

  <!-- Center -->
  <circle cx="410" cy="320" r="74" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="410" y="312" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">Yashirin</text>
  <text x="410" y="334" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">ishonch yo'qligi</text>

  <!-- Node 1: yangi vazifa (top) -->
  <rect x="300" y="100" width="220" height="58" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="126" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">1. Yangi qiyin vazifa</text>
  <text x="410" y="146" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">(yangi loyiha, lavozim)</text>

  <!-- Node 2: shubha (right) -->
  <rect x="600" y="220" width="200" height="58" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="700" y="246" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">2. Shubha va xavotir</text>
  <text x="700" y="266" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">"men eplolmayman"</text>

  <!-- Node 3: haddan tashqari (bottom right) -->
  <rect x="560" y="430" width="240" height="58" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="680" y="456" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#d97706">3. Ortiqcha tayyorgarlik</text>
  <text x="680" y="476" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">yoki kechiktirish</text>

  <!-- Node 4: muvaffaqiyat (bottom left) -->
  <rect x="20" y="430" width="240" height="58" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="456" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">4. Vazifa muvaffaqiyatli</text>
  <text x="140" y="476" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">bajariladi</text>

  <!-- Node 5: omad edi (left) -->
  <rect x="20" y="220" width="200" height="58" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="120" y="246" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">5. "Bu omad edi"</text>
  <text x="120" y="266" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">yutuq inkor qilinadi</text>

  <!-- Arrows around the cycle (clockwise) -->
  <!-- 1 -> 2 -->
  <path d="M 520 145 C 600 165, 660 185, 690 215" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah)"/>
  <!-- 2 -> 3 -->
  <path d="M 700 278 C 700 330, 690 380, 683 425" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah)"/>
  <!-- 3 -> 4 -->
  <path d="M 558 462 C 450 470, 360 470, 263 462" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah)"/>
  <!-- 4 -> 5 -->
  <path d="M 137 428 C 130 380, 122 330, 120 282" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah)"/>
  <!-- 5 -> 1 -->
  <path d="M 130 216 C 160 185, 220 165, 298 146" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah)"/>

  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="410" y="560" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">Siklni uzish: yutuqni yozib boring, "men buni qildim" deb tan oling</text>
  <text x="410" y="582" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Clance va Imes, 1978 — imposter fenomeni</text>
</svg>
