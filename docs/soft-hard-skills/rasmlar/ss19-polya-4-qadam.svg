<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540">
  <title>Polya muammo yechishning 4 qadami sikli</title>
  <rect x="0" y="0" width="840" height="540" fill="#f8fafc"/>
  <text x="420" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Polya 4 qadami</text>
  <text x="420" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">"How to Solve It" (George Polya, 1945) — sikl, chiziq emas</text>

  <!-- 1 Tushun -->
  <rect x="120" y="110" width="270" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="255" y="142" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#2563eb">1. Muammoni tushun</text>
  <text x="255" y="170" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Nima berilgan? Nima so'ralyapti?</text>
  <text x="255" y="192" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">O'z so'zingiz bilan qayta ayting</text>
  <text x="255" y="214" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Misol, chegara holatlarini yozing</text>

  <!-- 2 Rejalashtir -->
  <rect x="450" y="110" width="270" height="120" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="585" y="142" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#7c3aed">2. Reja tuz</text>
  <text x="585" y="170" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Strategiya tanlang</text>
  <text x="585" y="192" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Bo'laklash, soddalashtirish,</text>
  <text x="585" y="214" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">o'xshash muammoni eslang</text>

  <!-- 3 Bajar -->
  <rect x="450" y="300" width="270" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="585" y="332" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#16a34a">3. Rejani bajar</text>
  <text x="585" y="360" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Qadam-baqadam amalga oshir</text>
  <text x="585" y="382" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Har qadamni tekshir</text>
  <text x="585" y="404" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Reja ishlamasa — 2-ga qayt</text>

  <!-- 4 Tekshir -->
  <rect x="120" y="300" width="270" height="120" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="255" y="332" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#b45309">4. Tekshir va qayta ko'r</text>
  <text x="255" y="360" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Javob to'g'rimi? Mantiqlimi?</text>
  <text x="255" y="382" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Yaxshiroq yo'l bormi?</text>
  <text x="255" y="404" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Nimani o'rgandingiz?</text>

  <!-- Arrows -->
  <defs>
    <marker id="ar19" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <line x1="390" y1="170" x2="446" y2="170" stroke="#475569" stroke-width="2.5" marker-end="url(#ar19)"/>
  <line x1="585" y1="230" x2="585" y2="296" stroke="#475569" stroke-width="2.5" marker-end="url(#ar19)"/>
  <line x1="450" y1="360" x2="394" y2="360" stroke="#475569" stroke-width="2.5" marker-end="url(#ar19)"/>
  <line x1="255" y1="300" x2="255" y2="234" stroke="#475569" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ar19)"/>
  <text x="300" y="270" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">qayta boshla</text>

  <text x="420" y="500" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Tushunmasdan rejaga, rejasiz bajarishga o'tmang — eng ko'p xato shu yerda</text>
</svg>
