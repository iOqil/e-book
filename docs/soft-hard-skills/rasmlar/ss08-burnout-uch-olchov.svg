<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520">
  <title>Maslach bo'yicha burnout'ning uch o'lchovi</title>
  <rect x="0" y="0" width="860" height="520" fill="#f8fafc"/>
  <text x="430" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Burnout'ning uch o'lchovi</text>
  <text x="430" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Christina Maslach modeli (Maslach Burnout Inventory)</text>

  <!-- Column 1: Emotional exhaustion -->
  <rect x="40" y="110" width="240" height="320" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <circle cx="160" cy="160" r="26" fill="#dc2626"/>
  <text x="160" y="168" text-anchor="middle" font-family="Segoe UI" font-size="24" font-weight="bold" fill="#ffffff">1</text>
  <text x="160" y="215" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#dc2626">Hissiy charchash</text>
  <text x="160" y="237" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#94a3b8">(emotional exhaustion)</text>
  <text x="160" y="278" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Ichki bateriya bo'shab</text>
  <text x="160" y="298" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">qolgan. Ertalab ham</text>
  <text x="160" y="318" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">charchagansiz.</text>
  <text x="160" y="358" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">"Boshqa berishga</text>
  <text x="160" y="378" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">kuchim qolmadi."</text>

  <!-- Column 2: Cynicism -->
  <rect x="310" y="110" width="240" height="320" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="430" cy="160" r="26" fill="#f59e0b"/>
  <text x="430" y="168" text-anchor="middle" font-family="Segoe UI" font-size="24" font-weight="bold" fill="#ffffff">2</text>
  <text x="430" y="215" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#b45309">Sinizm / uzoqlashish</text>
  <text x="430" y="237" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#94a3b8">(depersonalization)</text>
  <text x="430" y="278" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Ishga, jamoaga, mahsulotga</text>
  <text x="430" y="298" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">befarqlik. Kinoyali,</text>
  <text x="430" y="318" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">masofali munosabat.</text>
  <text x="430" y="358" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">"Baribir hech narsa</text>
  <text x="430" y="378" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">o'zgarmaydi."</text>

  <!-- Column 3: Reduced accomplishment -->
  <rect x="580" y="110" width="240" height="320" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="700" cy="160" r="26" fill="#7c3aed"/>
  <text x="700" y="168" text-anchor="middle" font-family="Segoe UI" font-size="24" font-weight="bold" fill="#ffffff">3</text>
  <text x="700" y="215" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#7c3aed">Samaradorlik pasayishi</text>
  <text x="700" y="237" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#94a3b8">(reduced accomplishment)</text>
  <text x="700" y="278" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">"Men yetarli emasman"</text>
  <text x="700" y="298" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">hissi. O'z natijasini</text>
  <text x="700" y="318" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">past baholaydi.</text>
  <text x="700" y="358" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">"Hech narsani uddasidan</text>
  <text x="700" y="378" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">chiqmayapman."</text>

  <text x="430" y="475" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Burnout - bir kunlik charchoq emas; bu uchta belgi haftalar davomida birga turishi.</text>
  <text x="430" y="498" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Ko'pincha bu shaxsiy zaiflik emas, tizimli (ish muhiti) muammosining belgisi.</text>
</svg>
