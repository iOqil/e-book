<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520">
  <title>Kod o'qish va yozish nisbati: vaqt ulushi</title>
  <rect x="0" y="0" width="840" height="520" fill="#f8fafc"/>
  <text x="420" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Dasturchi qancha o'qiydi, qancha yozadi?</text>
  <text x="420" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Ish vaqtining katta qismi mavjud kodni tushunishga ketadi</text>

  <!-- O'qish bar -->
  <text x="70" y="135" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">Kodni o'qish</text>
  <rect x="70" y="150" width="700" height="64" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="420" y="190" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">vaqtning katta qismi — mavjud kodni tushunish</text>

  <!-- Yozish bar -->
  <text x="70" y="265" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">Kod yozish</text>
  <rect x="70" y="280" width="120" height="64" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="130" y="320" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">yangi</text>

  <text x="70" y="392" font-family="Segoe UI" font-size="14" fill="#64748b">Ko'pincha "~10:1" nisbati keltiriladi (Robert Martin, "Clean Code")</text>
  <text x="70" y="414" font-family="Segoe UI" font-size="14" fill="#64748b">— aniq raqam emas, lekin yo'nalish to'g'ri: o'qish &gt; yozish</text>

  <!-- Xulosa qutilari -->
  <rect x="70" y="440" width="340" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="240" y="464" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">Tez yozilgan, o'qib bo'lmaydigan kod</text>
  <text x="240" y="486" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">keyin har safar qayta o'qishni qiyinlashtiradi</text>

  <rect x="430" y="440" width="340" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="464" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">O'qiluvchi kod yozish = vaqtni tejash</text>
  <text x="600" y="486" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">o'zingiz va boshqalar uchun</text>
</svg>
