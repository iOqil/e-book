<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560">
  <title>Masofaviy muloqot vositalari matritsasi: boylik va tezlik</title>
  <rect x="0" y="0" width="860" height="560" fill="#f8fafc"/>
  <text x="430" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Muloqot vositasini tanlash matritsasi</text>
  <text x="430" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">O'q: boylik (richness) va tezlik (qaytish vaqti)</text>

  <!-- axes -->
  <line x1="150" y1="110" x2="150" y2="480" stroke="#94a3b8" stroke-width="2"/>
  <line x1="150" y1="480" x2="790" y2="480" stroke="#94a3b8" stroke-width="2"/>
  <text x="135" y="300" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155" transform="rotate(-90 135 300)">Boylik (kanal sig'imi) -&gt;</text>
  <text x="470" y="512" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155">Javob tezligi -&gt;</text>

  <!-- low speed end / high speed end -->
  <text x="240" y="500" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Sekin (asinxron)</text>
  <text x="700" y="500" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Tez (sinxron)</text>

  <!-- Hujjat: high richness-ish, slow -->
  <rect x="180" y="150" width="170" height="70" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="265" y="180" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">Hujjat / RFC</text>
  <text x="265" y="202" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Chuqur, doimiy iz</text>

  <!-- Email -->
  <rect x="180" y="320" width="170" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="265" y="350" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">Email / Issue</text>
  <text x="265" y="372" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Tuzilgan, kutadi</text>

  <!-- Chat -->
  <rect x="450" y="320" width="170" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="535" y="350" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">Chat (Slack)</text>
  <text x="535" y="372" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Tez, sayoz iz</text>

  <!-- Video call -->
  <rect x="620" y="150" width="170" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="705" y="180" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">Video qo'ng'iroq</text>
  <text x="705" y="202" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Eng boy, iz yo'q</text>

  <text x="470" y="540" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Qoida: nozik/murakkab -&gt; boyroq kanal; oddiy/yozib qolinsin -&gt; asinxron yozma.</text>
</svg>
