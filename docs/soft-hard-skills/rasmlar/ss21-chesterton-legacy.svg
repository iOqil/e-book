<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540">
  <title>Chesterton to'sig'i va legacy kodga yondashuv: tushun, test, o'zgartir</title>
  <rect x="0" y="0" width="840" height="540" fill="#f8fafc"/>
  <text x="420" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Eski kodni o'zgartirishdan oldin</text>
  <text x="420" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Chesterton to'sig'i: nega borligini bilmasdan olib tashlama</text>

  <defs>
    <marker id="ar21leg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Step 1: Tushun -->
  <rect x="60" y="110" width="220" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="146" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#2563eb">1. Tushun</text>
  <text x="170" y="178" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Bu kod nega bunday?</text>
  <text x="170" y="200" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Tarixini o'rgan:</text>
  <text x="170" y="222" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">git blame / log, savol ber</text>
  <text x="170" y="244" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">PR va izohlarni o'qi</text>

  <line x1="280" y1="185" x2="326" y2="185" stroke="#475569" stroke-width="2.5" marker-end="url(#ar21leg)"/>

  <!-- Step 2: Test -->
  <rect x="330" y="110" width="220" height="150" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="440" y="146" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#b45309">2. Test bilan o'ra</text>
  <text x="440" y="178" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Testsiz kod = legacy</text>
  <text x="440" y="200" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">(Michael Feathers)</text>
  <text x="440" y="222" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Oldin xulqni qotiruvchi</text>
  <text x="440" y="244" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">test yoz, keyin tegin</text>

  <line x1="550" y1="185" x2="596" y2="185" stroke="#475569" stroke-width="2.5" marker-end="url(#ar21leg)"/>

  <!-- Step 3: O'zgartir -->
  <rect x="600" y="110" width="220" height="150" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="710" y="146" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#16a34a">3. O'zgartir</text>
  <text x="710" y="178" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Kichik qadamlar bilan</text>
  <text x="710" y="200" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Har qadamda test yashil</text>
  <text x="710" y="222" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Bittadan o'zgartir,</text>
  <text x="710" y="244" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">tekshir, davom et</text>

  <!-- Yomon vs Yaxshi -->
  <rect x="60" y="320" width="350" height="160" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="235" y="352" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">Yomon yondashuv</text>
  <text x="235" y="384" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">"Bu g'alati kod, kerakmas" deb</text>
  <text x="235" y="406" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">tushunmasdan o'chirib tashlash</text>
  <text x="235" y="438" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Natija: yashirin bug, eski</text>
  <text x="235" y="458" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">muammo qaytadi, ishonch yo'qoladi</text>

  <rect x="470" y="320" width="350" height="160" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="645" y="352" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">Yaxshi yondashuv</text>
  <text x="645" y="384" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">"Nega kerak edi?" deb so'rab,</text>
  <text x="645" y="406" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">sababini topib, keyin qaror qil</text>
  <text x="645" y="438" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Natija: sabab eskirgan bo'lsa</text>
  <text x="645" y="458" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">xotirjam olib tashlaysiz</text>
</svg>
