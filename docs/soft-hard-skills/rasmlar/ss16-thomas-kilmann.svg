<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600">
  <title>Thomas-Kilmann nizo uslublari: assertivlik va hamkorlik</title>
  <rect x="0" y="0" width="820" height="600" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Thomas-Kilmann nizo uslublari</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Kenneth Thomas va Ralph Kilmann (1974): ikki o'lcham, besh uslub</text>

  <!-- axes -->
  <line x1="160" y1="120" x2="160" y2="500" stroke="#475569" stroke-width="2"/>
  <line x1="160" y1="500" x2="720" y2="500" stroke="#475569" stroke-width="2"/>
  <!-- y axis label -->
  <text x="95" y="310" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b" transform="rotate(-90 95 310)">Assertivlik (o'z manfaatim)</text>
  <text x="138" y="135" text-anchor="end" font-family="Segoe UI" font-size="13" fill="#64748b">yuqori</text>
  <text x="138" y="498" text-anchor="end" font-family="Segoe UI" font-size="13" fill="#64748b">past</text>
  <!-- x axis label -->
  <text x="440" y="545" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Hamkorlik (boshqaning manfaati)</text>
  <text x="170" y="522" text-anchor="start" font-family="Segoe UI" font-size="13" fill="#64748b">past</text>
  <text x="710" y="522" text-anchor="end" font-family="Segoe UI" font-size="13" fill="#64748b">yuqori</text>

  <!-- Raqobat: high assert, low coop (top-left) -->
  <rect x="180" y="135" width="200" height="120" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="280" y="168" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">Raqobat</text>
  <text x="280" y="192" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">"Men yutaman"</text>
  <text x="280" y="214" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Tez qaror, favqulodda</text>
  <text x="280" y="234" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">holat; munosabatga zarar</text>

  <!-- Hamkorlik: high assert, high coop (top-right) -->
  <rect x="500" y="135" width="200" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="168" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">Hamkorlik</text>
  <text x="600" y="192" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">"Ikkimiz ham yutamiz"</text>
  <text x="600" y="214" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Muhim masala; vaqt bor;</text>
  <text x="600" y="234" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">ko'pincha eng yaxshi</text>

  <!-- Murosa: center -->
  <rect x="340" y="295" width="200" height="110" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="440" y="328" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#b45309">Murosa</text>
  <text x="440" y="352" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">"Ikkimiz biroz yon beramiz"</text>
  <text x="440" y="374" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Vaqt kam; tez yarim-yechim</text>

  <!-- Qochish: low assert, low coop (bottom-left) -->
  <rect x="180" y="370" width="200" height="120" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="280" y="403" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#475569">Qochish</text>
  <text x="280" y="427" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">"Hozir bu mavzuni ochmaymiz"</text>
  <text x="280" y="449" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Arzimas masala; hissiyot</text>
  <text x="280" y="469" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">sovushini kutish</text>

  <!-- Moslashish: low assert, high coop (bottom-right) -->
  <rect x="500" y="370" width="200" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="600" y="403" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">Moslashish</text>
  <text x="600" y="427" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">"Sizniki bo'lsin"</text>
  <text x="600" y="449" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Masala sizga muhim emas,</text>
  <text x="600" y="469" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">unga muhim; munosabat afzal</text>

  <text x="410" y="582" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#94a3b8">Hech bir uslub "yomon" emas — vaziyatga qarab tanlanadi. Faqat bittasiga qotib qolmang.</text>
</svg>
