<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520">
  <title>BATNA va kelishuv zonasi: muqobil variant kuchingizni belgilaydi</title>
  <rect x="0" y="0" width="860" height="520" fill="#f8fafc"/>
  <text x="430" y="44" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">BATNA — eng yaxshi muqobil variant</text>
  <text x="430" y="72" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Stol ortidan turib ketsangiz nima qolishini bilish — kuchingiz</text>

  <!-- Number line -->
  <line x1="90" y1="200" x2="770" y2="200" stroke="#334155" stroke-width="3"/>
  <text x="90" y="240" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#dc2626">Past</text>
  <text x="770" y="240" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">Yuqori</text>

  <!-- Your floor / BATNA marker -->
  <line x1="270" y1="160" x2="270" y2="240" stroke="#dc2626" stroke-width="3"/>
  <circle cx="270" cy="200" r="8" fill="#dc2626"/>
  <text x="270" y="148" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">Sizning poliingiz</text>
  <text x="270" y="270" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">BATNA: hozirgi ish yoki</text>
  <text x="270" y="288" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">boshqa taklif darajasi</text>

  <!-- Their ceiling marker -->
  <line x1="600" y1="160" x2="600" y2="240" stroke="#2563eb" stroke-width="3"/>
  <circle cx="600" cy="200" r="8" fill="#2563eb"/>
  <text x="600" y="148" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">Ularning shifti</text>
  <text x="600" y="270" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Ular to'lashga tayyor</text>
  <text x="600" y="288" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">eng yuqori miqdor</text>

  <!-- ZOPA zone -->
  <rect x="270" y="185" width="330" height="30" fill="#16a34a" fill-opacity="0.2" stroke="#16a34a" stroke-width="2"/>
  <text x="435" y="135" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">Kelishuv zonasi (ZOPA)</text>

  <!-- Bottom explanation boxes -->
  <rect x="60" y="340" width="360" height="130" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="240" y="372" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">BATNA kuchsiz bo'lsa</text>
  <text x="240" y="400" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Hozirgi ishingiz yo'q, boshqa</text>
  <text x="240" y="420" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">taklif yo'q — bosim ko'proq.</text>
  <text x="240" y="446" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Yolg'on takliflar to'qima — qiymatga tayan.</text>

  <rect x="440" y="340" width="360" height="130" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="372" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">BATNA kuchli bo'lsa</text>
  <text x="620" y="400" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Mavjud taklif yoki barqaror</text>
  <text x="620" y="420" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">ish bor — xotirjam gaplashasiz.</text>
  <text x="620" y="446" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">"Yo'q" deyish imkoni — eng katta kuch.</text>
</svg>
