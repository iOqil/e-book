<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540">
  <title>Savol turlari: ochiq va yopiq, aniqlovchi va yetaklovchi savol taqqoslash</title>
  <rect x="0" y="0" width="820" height="540" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Savol turlari</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Qaysi savol suhbatni ochadi, qaysi yopadi</text>

  <rect x="40" y="100" width="360" height="180" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="220" y="130" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#16a34a">Ochiq savol</text>
  <text x="60" y="158" font-family="Segoe UI" font-size="13" fill="#334155">Suhbatni ochadi, fikr so'raydi</text>
  <text x="60" y="186" font-family="Segoe UI" font-size="14" fill="#16a34a">"Bu yondashuvni tanlashga</text>
  <text x="60" y="207" font-family="Segoe UI" font-size="14" fill="#16a34a"> nima sabab bo'ldi?"</text>
  <text x="60" y="235" font-family="Segoe UI" font-size="14" fill="#16a34a">"Buni qanday ko'rdingiz?"</text>
  <text x="60" y="263" font-family="Segoe UI" font-size="13" fill="#64748b">Javob: keng, batafsil</text>

  <rect x="420" y="100" width="360" height="180" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="130" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#dc2626">Yopiq savol</text>
  <text x="440" y="158" font-family="Segoe UI" font-size="13" fill="#334155">Ha/yo'q bilan tugaydi</text>
  <text x="440" y="186" font-family="Segoe UI" font-size="14" fill="#dc2626">"Buni tugatdingmi?"</text>
  <text x="440" y="214" font-family="Segoe UI" font-size="14" fill="#dc2626">"Hammasi joyidami?"</text>
  <text x="440" y="242" font-family="Segoe UI" font-size="13" fill="#64748b">Foydali: tasdiqlash uchun,</text>
  <text x="440" y="263" font-family="Segoe UI" font-size="13" fill="#64748b">lekin suhbatni yopadi</text>

  <rect x="40" y="310" width="360" height="190" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="340" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#2563eb">Aniqlovchi savol</text>
  <text x="60" y="368" font-family="Segoe UI" font-size="13" fill="#334155">Tushunishni chuqurlashtiradi</text>
  <text x="60" y="396" font-family="Segoe UI" font-size="14" fill="#2563eb">"'Tez' deganda nechta</text>
  <text x="60" y="417" font-family="Segoe UI" font-size="14" fill="#2563eb"> soniyani nazarda tutyapsiz?"</text>
  <text x="60" y="447" font-family="Segoe UI" font-size="14" fill="#2563eb">"Misol keltira olasizmi?"</text>
  <text x="60" y="478" font-family="Segoe UI" font-size="13" fill="#64748b">Niyat: aniqlik, xolislik</text>

  <rect x="420" y="310" width="360" height="190" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="340" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#b45309">Yetaklovchi savol</text>
  <text x="440" y="368" font-family="Segoe UI" font-size="13" fill="#334155">Javobni o'zi tiqishtiradi</text>
  <text x="440" y="396" font-family="Segoe UI" font-size="14" fill="#b45309">"Buni shunday qilish</text>
  <text x="440" y="417" font-family="Segoe UI" font-size="14" fill="#b45309"> noto'g'ri-ku, shundaymi?"</text>
  <text x="440" y="447" font-family="Segoe UI" font-size="13" fill="#64748b">Xavf: suhbatdosh yopiladi,</text>
  <text x="440" y="468" font-family="Segoe UI" font-size="13" fill="#64748b">rost javob bermaydi</text>
  <text x="440" y="492" font-family="Segoe UI" font-size="13" fill="#dc2626">Bundan qoching</text>
</svg>
