<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540">
  <title>Tinglash darajalari: e'tiborsizdan to'liq empatik tinglashgacha</title>
  <rect x="0" y="0" width="820" height="540" fill="#f8fafc"/>
  <text x="410" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Tinglash darajalari</text>
  <text x="410" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Pastdan yuqoriga: sifat ortib boradi</text>

  <rect x="120" y="430" width="580" height="64" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="150" y="458" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">1. E'tiborsiz tinglash</text>
  <text x="150" y="481" font-family="Segoe UI" font-size="13" fill="#64748b">Telefonga qaraysiz, javobingizni o'ylaysiz — gapni eshitmaysiz</text>

  <rect x="150" y="350" width="550" height="64" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="180" y="378" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#b45309">2. Tanlab tinglash</text>
  <text x="180" y="401" font-family="Segoe UI" font-size="13" fill="#64748b">Faqat o'zingizga kerakli qismni eshitasiz, qolganini o'tkazib yuborasiz</text>

  <rect x="180" y="270" width="520" height="64" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="210" y="298" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">3. Diqqat bilan tinglash</text>
  <text x="210" y="321" font-family="Segoe UI" font-size="13" fill="#64748b">So'zlarga to'liq e'tibor berasiz, lekin his-tuyg'uni sezmaysiz</text>

  <rect x="210" y="190" width="490" height="64" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="240" y="218" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">4. Empatik (to'liq) tinglash</text>
  <text x="240" y="241" font-family="Segoe UI" font-size="13" fill="#334155">So'z + his + niyatni tushunasiz; suhbatdosh "anglandim" deydi</text>

  <text x="410" y="135" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">Maqsad: bu yerga intiling</text>
  <text x="80" y="280" font-family="Segoe UI" font-size="13" fill="#94a3b8">sifat</text>
  <path d="M 90 430 L 90 160" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrowUp)"/>
  <defs>
    <marker id="arrowUp" markerWidth="10" markerHeight="10" refX="5" refY="2" orient="auto">
      <path d="M0,8 L5,0 L10,8" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
