<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560">
  <title>Bir foiz yaxshilanish: bir yil davomida jamlanma natija</title>
  <rect x="0" y="0" width="820" height="560" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Bir foiz qoidasi</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Har kuni 1% yaxshilanish bir yilda 37 barobar natija beradi</text>

  <line x1="110" y1="100" x2="110" y2="450" stroke="#334155" stroke-width="2"/>
  <line x1="110" y1="450" x2="730" y2="450" stroke="#334155" stroke-width="2"/>

  <text x="60" y="110" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">natija</text>
  <text x="110" y="475" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">1-kun</text>
  <text x="420" y="475" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">6 oy</text>
  <text x="730" y="475" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">1 yil</text>
  <text x="420" y="500" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155">Vaqt (kunlar)</text>

  <line x1="110" y1="300" x2="730" y2="300" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="100" y="305" text-anchor="end" font-family="Segoe UI" font-size="13" fill="#94a3b8">boshlang'ich</text>

  <path d="M110 300 C 380 296, 560 270, 730 110" fill="none" stroke="#16a34a" stroke-width="4"/>
  <circle cx="730" cy="110" r="6" fill="#16a34a"/>
  <text x="715" y="100" text-anchor="end" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">+1% / kun</text>
  <text x="715" y="120" text-anchor="end" font-family="Segoe UI" font-size="13" fill="#16a34a">= 37 barobar</text>

  <path d="M110 300 C 380 304, 560 330, 730 405" fill="none" stroke="#dc2626" stroke-width="4"/>
  <circle cx="730" cy="405" r="6" fill="#dc2626"/>
  <text x="715" y="430" text-anchor="end" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">-1% / kun</text>
  <text x="715" y="448" text-anchor="end" font-family="Segoe UI" font-size="13" fill="#dc2626">= deyarli nolga</text>

  <text x="270" y="250" font-family="Segoe UI" font-size="13" fill="#64748b">Boshda farq</text>
  <text x="270" y="270" font-family="Segoe UI" font-size="13" fill="#64748b">sezilmaydi...</text>

  <text x="410" y="540" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">Kichik odat boshda arzimas, lekin jamlanib (compounding) katta tafovut yaratadi</text>
</svg>
