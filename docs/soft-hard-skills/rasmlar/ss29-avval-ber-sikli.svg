<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540">
  <title>Avval ber: networking qiymat sikli</title>
  <rect x="0" y="0" width="820" height="540" fill="#f8fafc"/>
  <text x="410" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">"Avval ber" sikli</text>
  <text x="410" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Manfaat olishni emas, qiymat berishni boshlang — qaytim tabiiy keladi</text>

  <!-- 1: Qiymat ber -->
  <rect x="300" y="100" width="220" height="80" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="410" y="132" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#b45309">1. Qiymat ber</text>
  <text x="410" y="158" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Yordam, bilim, tanishtirish</text>

  <!-- 2: Ishonch (right) -->
  <rect x="570" y="225" width="220" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="680" y="257" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">2. Ishonch quriladi</text>
  <text x="680" y="283" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Odamlar sizni eslab qoladi</text>

  <!-- 3: Tabiiy qaytim (bottom) -->
  <rect x="300" y="350" width="220" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="382" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">3. Tabiiy qaytim</text>
  <text x="410" y="408" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Ish, tavsiya, maslahat keladi</text>

  <!-- 4: Tarmoq o'sadi (left) -->
  <rect x="30" y="225" width="220" height="80" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="140" y="257" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#7c3aed">4. Tarmoq o'sadi</text>
  <text x="140" y="283" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Ko'proq odamga bera olasiz</text>

  <!-- Arrows (clockwise) -->
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <path d="M 522 150 Q 660 165 690 222" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah)"/>
  <path d="M 660 308 Q 600 400 524 392" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah)"/>
  <path d="M 298 392 Q 170 400 145 308" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah)"/>
  <path d="M 165 222 Q 215 160 298 148" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- center note -->
  <text x="410" y="262" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155">Sikl o'zini</text>
  <text x="410" y="282" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155">o'zi quvvatlaydi</text>

  <text x="410" y="475" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#dc2626">Manfaatparast bu siklni teskari aylantiradi (avval olish) — shuning uchun ishlamaydi</text>
  <text x="410" y="505" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Tarmoqni kerak bo'lishidan oldin quring</text>
</svg>
