<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520">
  <title>Rejalashtirish xatosi: baholangan vaqt va haqiqiy vaqt taqqoslash</title>
  <rect x="0" y="0" width="820" height="520" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Rejalashtirish xatosi (planning fallacy)</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Kahneman va Tversky, 1979 - biz doim optimistik baholaymiz</text>

  <!-- Baseline -->
  <line x1="120" y1="400" x2="760" y2="400" stroke="#334155" stroke-width="2"/>

  <!-- Estimated bars (blue) and actual bars (red) for 3 tasks -->
  <!-- Task 1 -->
  <rect x="160" y="320" width="60" height="80" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="312" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">2 kun</text>
  <rect x="230" y="250" width="60" height="150" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="260" y="242" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">3.5 kun</text>
  <text x="225" y="425" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">A vazifa</text>

  <!-- Task 2 -->
  <rect x="360" y="345" width="60" height="55" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="390" y="337" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">1 kun</text>
  <rect x="430" y="280" width="60" height="120" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="460" y="272" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">2.5 kun</text>
  <text x="425" y="425" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">B vazifa</text>

  <!-- Task 3 -->
  <rect x="560" y="300" width="60" height="100" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="590" y="292" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">3 kun</text>
  <rect x="630" y="180" width="60" height="220" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="660" y="172" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">6 kun</text>
  <text x="625" y="425" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">C vazifa</text>

  <!-- Legend -->
  <rect x="160" y="455" width="22" height="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="192" y="471" font-family="Segoe UI" font-size="14" fill="#334155">Baholangan vaqt (optimistik)</text>
  <rect x="430" y="455" width="22" height="22" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="462" y="471" font-family="Segoe UI" font-size="14" fill="#334155">Haqiqiy vaqt (har doim ko'proq)</text>

  <!-- Note -->
  <text x="410" y="505" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#7c3aed">Hofstadter qonuni: kutilganidan uzoqroq - hatto buni hisobga olsangiz ham</text>
</svg>
