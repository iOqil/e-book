<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600">
  <title>SMART maqsad: besh harf va ularning ma'nosi</title>
  <rect x="0" y="0" width="820" height="600" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">SMART maqsad</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Yaxshi maqsad besh sifatga ega bo'lishi kerak</text>

  <rect x="60" y="95" width="700" height="86" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="105" cy="138" r="26" fill="#2563eb"/>
  <text x="105" y="146" text-anchor="middle" font-family="Segoe UI" font-size="24" font-weight="bold" fill="#ffffff">S</text>
  <text x="150" y="128" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">Specific - Aniq</text>
  <text x="150" y="152" font-family="Segoe UI" font-size="13" fill="#64748b">Nima, qayerda, qanday - noaniqlik yo'q</text>
  <text x="150" y="172" font-family="Segoe UI" font-size="13" fill="#334155">Misol: 50 ta algoritm masala yechaman</text>

  <rect x="60" y="191" width="700" height="86" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <circle cx="105" cy="234" r="26" fill="#16a34a"/>
  <text x="105" y="242" text-anchor="middle" font-family="Segoe UI" font-size="24" font-weight="bold" fill="#ffffff">M</text>
  <text x="150" y="224" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">Measurable - O'lchanadigan</text>
  <text x="150" y="248" font-family="Segoe UI" font-size="13" fill="#64748b">Bajardim deb qachon aytishni bilish</text>
  <text x="150" y="268" font-family="Segoe UI" font-size="13" fill="#334155">Misol: 50 - bu son, sanab bo'ladi</text>

  <rect x="60" y="287" width="700" height="86" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="105" cy="330" r="26" fill="#7c3aed"/>
  <text x="105" y="338" text-anchor="middle" font-family="Segoe UI" font-size="24" font-weight="bold" fill="#ffffff">A</text>
  <text x="150" y="320" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">Achievable - Erishsa bo'ladigan</text>
  <text x="150" y="344" font-family="Segoe UI" font-size="13" fill="#64748b">Cho'zilib yetadigan, lekin real</text>
  <text x="150" y="364" font-family="Segoe UI" font-size="13" fill="#334155">Misol: 3 oyda 50 ta - haftasiga 4 ta</text>

  <rect x="60" y="383" width="700" height="86" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="105" cy="426" r="26" fill="#f59e0b"/>
  <text x="105" y="434" text-anchor="middle" font-family="Segoe UI" font-size="24" font-weight="bold" fill="#ffffff">R</text>
  <text x="150" y="416" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">Relevant - Tegishli</text>
  <text x="150" y="440" font-family="Segoe UI" font-size="13" fill="#64748b">Asl maqsadingizga xizmat qiladimi</text>
  <text x="150" y="460" font-family="Segoe UI" font-size="13" fill="#334155">Misol: intervyuga tayyorlanyapman</text>

  <rect x="60" y="479" width="700" height="86" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <circle cx="105" cy="522" r="26" fill="#dc2626"/>
  <text x="105" y="530" text-anchor="middle" font-family="Segoe UI" font-size="24" font-weight="bold" fill="#ffffff">T</text>
  <text x="150" y="512" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">Time-bound - Muddatli</text>
  <text x="150" y="536" font-family="Segoe UI" font-size="13" fill="#64748b">Aniq sana - cheksiz keyinga surilmaydi</text>
  <text x="150" y="556" font-family="Segoe UI" font-size="13" fill="#334155">Misol: 1-martgacha tugataman</text>
</svg>
