<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560">
  <title>Google Project Aristotle: samarali jamoaning 5 omili</title>
  <rect x="0" y="0" width="840" height="560" fill="#f8fafc"/>
  <text x="420" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Samarali jamoaning 5 omili</text>
  <text x="420" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Google Project Aristotle topilmasi — eng tepada eng muhimi</text>

  <!-- Factor 1: top, most important -->
  <rect x="220" y="100" width="400" height="62" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <text x="420" y="128" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#16a34a">1. Psixologik xavfsizlik</text>
  <text x="420" y="150" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Qo'rqmasdan savol berish, xato tan olish — #1 omil</text>

  <!-- Factor 2 -->
  <rect x="200" y="180" width="440" height="58" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="420" y="206" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">2. Ishonchlilik (dependability)</text>
  <text x="420" y="226" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Har kim o'z ishini o'z vaqtida, sifatli bajaradi</text>

  <!-- Factor 3 -->
  <rect x="200" y="256" width="440" height="58" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="420" y="282" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">3. Tuzilish va aniqlik</text>
  <text x="420" y="302" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Aniq rol, maqsad va reja har kimga ma'lum</text>

  <!-- Factor 4 -->
  <rect x="200" y="332" width="440" height="58" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="420" y="358" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#7c3aed">4. Ma'no (meaning)</text>
  <text x="420" y="378" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Ish shaxsan men uchun ahamiyatga ega</text>

  <!-- Factor 5 -->
  <rect x="200" y="408" width="440" height="58" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="420" y="434" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#7c3aed">5. Ta'sir (impact)</text>
  <text x="420" y="454" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Mening ishim haqiqatan o'zgarish keltiradi</text>

  <text x="420" y="510" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">KIM emas, jamoa QANDAY ishlashi muhim ekani aniqlandi</text>
</svg>
