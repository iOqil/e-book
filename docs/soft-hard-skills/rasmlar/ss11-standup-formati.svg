<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460">
  <title>Stand-up formati: kecha qildim, bugun qilaman, tosiqlar uch bloki</title>
  <rect x="0" y="0" width="860" height="460" fill="#f8fafc"/>
  <text x="430" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Stand-up: uch savol, uch blok</text>
  <text x="430" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Maqsad - hisobot emas, jamoani sinxronlash. Qisqa va aniq.</text>

  <!-- Blok 1: kecha -->
  <rect x="40" y="100" width="240" height="250" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="138" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#2563eb">Kecha nima qildim?</text>
  <line x1="64" y1="156" x2="256" y2="156" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="64" y="186" font-family="Segoe UI" font-size="14" fill="#334155">Tugagan ish, natija</text>
  <text x="64" y="214" font-family="Segoe UI" font-size="13" fill="#64748b">"Login API'ni yopdim,</text>
  <text x="64" y="234" font-family="Segoe UI" font-size="13" fill="#64748b">PR review'da"</text>
  <text x="64" y="286" font-family="Segoe UI" font-size="13" fill="#94a3b8">Vaqt: o'tgan kun</text>
  <text x="64" y="318" font-family="Segoe UI" font-size="13" fill="#dc2626">Emas: har kommit ro'yxati</text>

  <!-- Blok 2: bugun -->
  <rect x="310" y="100" width="240" height="250" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="430" y="138" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#16a34a">Bugun nima qilaman?</text>
  <line x1="334" y1="156" x2="526" y2="156" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="334" y="186" font-family="Segoe UI" font-size="14" fill="#334155">Bugungi asosiy maqsad</text>
  <text x="334" y="214" font-family="Segoe UI" font-size="13" fill="#64748b">"Parolni tiklash</text>
  <text x="334" y="234" font-family="Segoe UI" font-size="13" fill="#64748b">oqimini boshlayman"</text>
  <text x="334" y="286" font-family="Segoe UI" font-size="13" fill="#94a3b8">Vaqt: bugungi kun</text>
  <text x="334" y="318" font-family="Segoe UI" font-size="13" fill="#dc2626">Emas: noaniq "ishlayman"</text>

  <!-- Blok 3: tosiq -->
  <rect x="580" y="100" width="240" height="250" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="700" y="138" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#dc2626">Tosiqlar bormi?</text>
  <line x1="604" y1="156" x2="796" y2="156" stroke="#fecaca" stroke-width="1.5"/>
  <text x="604" y="186" font-family="Segoe UI" font-size="14" fill="#334155">Meni nima toxtatyapti</text>
  <text x="604" y="214" font-family="Segoe UI" font-size="13" fill="#64748b">"Test bazasiga ruxsat</text>
  <text x="604" y="234" font-family="Segoe UI" font-size="13" fill="#64748b">kerak - kim beradi?"</text>
  <text x="604" y="286" font-family="Segoe UI" font-size="13" fill="#94a3b8">Eng muhim blok!</text>
  <text x="604" y="318" font-family="Segoe UI" font-size="13" fill="#16a34a">Yordam shu yerda soraladi</text>

  <text x="430" y="398" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#475569">Uzun muhokama - stand-up'dan keyin, faqat kerakli odamlar bilan ("after-party")</text>
  <text x="430" y="424" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#94a3b8">Maqsad: 1-2 daqiqa har kishi, butun jamoa 15 daqiqada</text>
</svg>
