<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540">
  <title>Yerkes-Dodson qonuni: stress va samaradorlik teskari U egri chizigi</title>
  <rect x="0" y="0" width="820" height="540" fill="#f8fafc"/>
  <text x="410" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Yerkes-Dodson qonuni</text>
  <text x="410" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Ozgina stress yordam beradi, ortiqchasi qulatadi</text>

  <!-- Y axis -->
  <line x1="110" y1="110" x2="110" y2="430" stroke="#94a3b8" stroke-width="2"/>
  <!-- X axis -->
  <line x1="110" y1="430" x2="720" y2="430" stroke="#94a3b8" stroke-width="2"/>

  <text x="60" y="275" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155" transform="rotate(-90 60 275)">Samaradorlik</text>
  <text x="415" y="465" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Stress / qo'zg'alish darajasi  ---&gt;</text>

  <!-- inverted U curve -->
  <path d="M 130 410 Q 300 90 415 90 Q 530 90 700 410" fill="none" stroke="#2563eb" stroke-width="4"/>

  <!-- optimal marker -->
  <line x1="415" y1="90" x2="415" y2="430" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="415" cy="90" r="7" fill="#16a34a"/>
  <text x="415" y="125" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">Optimal zona</text>

  <!-- left zone label -->
  <text x="200" y="380" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#64748b">Befarqlik</text>
  <text x="200" y="402" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#94a3b8">zerikish, sustlik</text>

  <!-- middle zone label -->
  <text x="415" y="160" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">eng yuqori unum</text>

  <!-- right zone label -->
  <text x="630" y="380" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">Panika</text>
  <text x="630" y="402" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">vahima, qotib qolish</text>

  <!-- caption box -->
  <rect x="110" y="490" width="610" height="34" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="415" y="512" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Maqsad - stressni nolga tushirish emas, balki o'rtacha (optimal) zonada ushlab turish</text>
</svg>
