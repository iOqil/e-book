<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620">
  <title>Timeboxing: dasturchining bir kunlik vaqt bloklari rejasi</title>
  <rect x="0" y="0" width="860" height="620" fill="#f8fafc"/>
  <text x="430" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Timeboxing: bir kunlik blok rejasi</text>
  <text x="430" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Har vazifaga kalendarda aniq vaqt oynasi ajratiladi</text>

  <!-- timeline axis -->
  <line x1="150" y1="100" x2="150" y2="560" stroke="#cbd5e1" stroke-width="2"/>

  <text x="120" y="135" text-anchor="end" font-family="Segoe UI" font-size="14" fill="#64748b">09:00</text>
  <rect x="170" y="118" width="560" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="142" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">Reja va eng qiyin ish (Eat the Frog)</text>
  <text x="190" y="163" font-family="Segoe UI" font-size="13" fill="#64748b">Kun rejasini ko'rib chiqish, eng muhim vazifaga kirishish</text>

  <text x="120" y="205" text-anchor="end" font-family="Segoe UI" font-size="14" fill="#64748b">09:30</text>
  <rect x="170" y="188" width="560" height="76" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="190" y="214" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">Chuqur ish bloki 1</text>
  <text x="190" y="236" font-family="Segoe UI" font-size="13" fill="#64748b">Feature kodlash, chat va bildirishnomalar o'chiq</text>
  <text x="190" y="255" font-family="Segoe UI" font-size="13" fill="#64748b">Eng yuqori energiya soatlari himoyalangan</text>

  <text x="120" y="295" text-anchor="end" font-family="Segoe UI" font-size="14" fill="#64748b">11:30</text>
  <rect x="170" y="278" width="560" height="48" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="190" y="307" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#d97706">Stand-up va sayoz ishlar</text>

  <text x="120" y="356" text-anchor="end" font-family="Segoe UI" font-size="14" fill="#64748b">12:00</text>
  <rect x="170" y="339" width="560" height="44" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="190" y="367" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">Tushlik va dam</text>

  <text x="120" y="415" text-anchor="end" font-family="Segoe UI" font-size="14" fill="#64748b">13:00</text>
  <rect x="170" y="398" width="560" height="76" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="190" y="424" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">Chuqur ish bloki 2</text>
  <text x="190" y="446" font-family="Segoe UI" font-size="13" fill="#64748b">Murakkab masala yoki dizayn ustida ishlash</text>
  <text x="190" y="465" font-family="Segoe UI" font-size="13" fill="#64748b">Kontekst almashinuvi minimal saqlanadi</text>

  <text x="120" y="505" text-anchor="end" font-family="Segoe UI" font-size="14" fill="#64748b">15:00</text>
  <rect x="170" y="488" width="560" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="517" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">Code review, email, yig'ilishlar</text>

  <text x="120" y="558" text-anchor="end" font-family="Segoe UI" font-size="14" fill="#64748b">17:00</text>
  <rect x="170" y="541" width="560" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="190" y="569" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#64748b">Kun yakuni: ertangi reja, yopish</text>
</svg>
