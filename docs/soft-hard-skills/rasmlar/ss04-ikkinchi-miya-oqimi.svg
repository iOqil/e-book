<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360">
  <title>Ikkinchi miya oqimi: ushlash, tartiblash, qaytarib olish</title>
  <rect x="0" y="0" width="860" height="360" fill="#f8fafc"/>
  <text x="430" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Ikkinchi miya: bilim oqimi</text>
  <text x="430" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Ma'lumot kelganidan to qaytarib olingunicha 4 bosqich</text>

  <rect x="30" y="120" width="180" height="120" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="120" y="160" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#b45309">1. Kiruvchi</text>
  <text x="120" y="186" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Maqola, xato,</text>
  <text x="120" y="206" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">suhbat, kod</text>

  <rect x="245" y="120" width="180" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="335" y="160" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">2. Ushlash</text>
  <text x="335" y="186" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Tez eslatma,</text>
  <text x="335" y="206" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">inbox'ga yoz</text>

  <rect x="460" y="120" width="180" height="120" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="550" y="160" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#7c3aed">3. Tartiblash</text>
  <text x="550" y="186" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Atomar nota,</text>
  <text x="550" y="206" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">bog'lash, teg</text>

  <rect x="675" y="120" width="180" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="765" y="160" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">4. Qaytarib olish</text>
  <text x="765" y="186" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Qidir, qayta</text>
  <text x="765" y="206" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">ishlat, ulashing</text>

  <path d="M210 180 L243 180" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <path d="M425 180 L458 180" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <path d="M640 180 L673 180" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arr)"/>

  <text x="430" y="300" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Miya fikrlash uchun, saqlash uchun emas: yozib qo'ying, ishlating</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
