<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540">
  <title>Bir xil xabar uch auditoriyaga: junior, menejer, mijoz</title>
  <rect x="0" y="0" width="860" height="540" fill="#f8fafc"/>
  <text x="430" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Bitta xabar, uch auditoriya</text>
  <text x="430" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">"To'lov xizmati sekinlashdi" - har kimga boshqa urg'u bilan</text>

  <!-- Source message -->
  <rect x="300" y="90" width="260" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="430" y="115" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">Asl fakt (bir xil)</text>
  <text x="430" y="135" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">DB indeks yo'q, so'rov 4s ketyapti</text>

  <line x1="430" y1="146" x2="160" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="430" y1="146" x2="430" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="430" y1="146" x2="700" y2="200" stroke="#94a3b8" stroke-width="2"/>

  <!-- Junior -->
  <rect x="40" y="200" width="240" height="290" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="160" y="232" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#16a34a">Junior dasturchi</text>
  <text x="160" y="258" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#94a3b8">Urg'u: QANDAY</text>
  <text x="160" y="295" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Texnik detal to'liq.</text>
  <text x="160" y="315" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Indeks qaysi ustunga,</text>
  <text x="160" y="335" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">EXPLAIN natijasi, qanday</text>
  <text x="160" y="355" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">tuzatish - o'rgatuvchi ton.</text>
  <text x="160" y="400" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">"users jadvalida</text>
  <text x="160" y="420" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">email ustuniga indeks</text>
  <text x="160" y="440" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">qo'shsak, full scan</text>
  <text x="160" y="460" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">yo'qoladi."</text>

  <!-- Menejer -->
  <rect x="310" y="200" width="240" height="290" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="430" y="232" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#2563eb">Menejer</text>
  <text x="430" y="258" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#94a3b8">Urg'u: TA'SIR / VAQT</text>
  <text x="430" y="295" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Jargon yo'q. Qancha</text>
  <text x="430" y="315" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">vaqt, qancha foydalanuvchi,</text>
  <text x="430" y="335" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">risk va qaror nuqtasi.</text>
  <text x="430" y="400" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">"Sekinlik 4 soat ichida</text>
  <text x="430" y="420" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">tuzaladi, foydalanuvchiga</text>
  <text x="430" y="440" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">ta'sir kam. Deploy</text>
  <text x="430" y="460" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">vaqtini tasdiqlang."</text>

  <!-- Mijoz -->
  <rect x="580" y="200" width="240" height="290" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="700" y="232" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#7c3aed">Mijoz</text>
  <text x="700" y="258" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#94a3b8">Urg'u: ISHONCH / QIYMAT</text>
  <text x="700" y="295" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Sabab emas, yechim va</text>
  <text x="700" y="315" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">ishonch. Tinch ton,</text>
  <text x="700" y="335" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">aniq keyingi qadam.</text>
  <text x="700" y="400" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">"To'lov sahifasidagi</text>
  <text x="700" y="420" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">sekinlikni aniqladik.</text>
  <text x="700" y="440" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">Bugun tuzatamiz, sizga</text>
  <text x="700" y="460" text-anchor="middle" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">xabar beramiz."</text>

  <text x="430" y="520" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Fakt o'zgarmaydi - faqat chuqurlik, jargon va urg'u auditoriyaga moslashadi.</text>
</svg>
