<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560">
  <title>Texnik intervyu bosqichlari voronkasi: recruiter dan taklifgacha</title>
  <rect x="0" y="0" width="840" height="560" fill="#f8fafc"/>
  <text x="420" y="42" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Intervyu bosqichlari voronkasi</text>
  <text x="420" y="68" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Har bosqich boshqa narsani tekshiradi — har birga boshqacha tayyorlaning</text>

  <!-- 1 Recruiter -->
  <rect x="120" y="100" width="600" height="58" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="126" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">1. Recruiter suhbati</text>
  <text x="150" y="148" font-family="Segoe UI" font-size="13" fill="#64748b">Motivatsiya, maosh kutilmasi, umumiy moslik — texnik chuqurlik emas</text>

  <!-- 2 Skrining -->
  <rect x="160" y="172" width="520" height="58" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="190" y="198" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#7c3aed">2. Texnik skrining</text>
  <text x="190" y="220" font-family="Segoe UI" font-size="13" fill="#64748b">Telefon/online: asos bilim, kichik masala, tezkor filtr</text>

  <!-- 3 Jonli kodlash -->
  <rect x="200" y="244" width="440" height="58" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="230" y="270" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">3. Jonli kodlash</text>
  <text x="230" y="292" font-family="Segoe UI" font-size="13" fill="#334155">Fikrlash jarayoni, kod yozish, ovoz chiqarib o'ylash</text>

  <!-- 4 Tizim dizayni -->
  <rect x="240" y="316" width="360" height="58" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="270" y="342" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#b45309">4. Tizim dizayni</text>
  <text x="270" y="364" font-family="Segoe UI" font-size="13" fill="#334155">Talab, miqyos, trade-off (mid/senior uchun)</text>

  <!-- 5 Behavioral -->
  <rect x="280" y="388" width="280" height="58" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="310" y="414" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">5. Behavioral</text>
  <text x="310" y="436" font-family="Segoe UI" font-size="13" fill="#64748b">Jamoa, nizo, STAR (27-bob)</text>

  <!-- 6 Taklif -->
  <rect x="320" y="460" width="200" height="50" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="420" y="491" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#16a34a">6. Taklif</text>

  <text x="420" y="538" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Har bosqich oldingisini muvaffaqiyatli o'tgandan keyin — voronka torayadi</text>
</svg>
