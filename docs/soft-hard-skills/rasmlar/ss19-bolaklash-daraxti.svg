<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520">
  <title>Katta muammoni qism-masalalarga bo'laklash daraxti</title>
  <rect x="0" y="0" width="860" height="520" fill="#f8fafc"/>
  <text x="430" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Bo'laklash (decomposition)</text>
  <text x="430" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Yechib bo'lmaydigan katta muammo = bir necha yechiladigan kichik muammo</text>

  <defs>
    <marker id="ar19b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Root -->
  <rect x="300" y="100" width="260" height="64" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="430" y="128" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">"Foydalanuvchilar shikoyat qilyapti:</text>
  <text x="430" y="150" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">sayt sekin"</text>

  <!-- Level 2 -->
  <rect x="70" y="230" width="220" height="58" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="256" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">Sekinlik qayerda?</text>
  <text x="180" y="277" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Frontend / backend / tarmoq</text>

  <rect x="320" y="230" width="220" height="58" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="430" y="256" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">Qaysi sahifa?</text>
  <text x="430" y="277" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Hammasi / bitta / faqat tizimga kirgan</text>

  <rect x="570" y="230" width="220" height="58" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="680" y="256" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">Qachondan beri?</text>
  <text x="680" y="277" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">So'nggi deploy / yuklama oshganda</text>

  <!-- Level 3 leaves -->
  <rect x="320" y="360" width="220" height="56" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="430" y="385" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">Sekin DB so'rovi?</text>
  <text x="430" y="405" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Logni o'lchang, gipotezani sinang</text>

  <rect x="570" y="360" width="220" height="56" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="680" y="385" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">N+1 so'rov?</text>
  <text x="680" y="405" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Bitta tekshiriladigan farazga keldik</text>

  <!-- Connectors -->
  <line x1="380" y1="164" x2="180" y2="226" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar19b)"/>
  <line x1="430" y1="164" x2="430" y2="226" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar19b)"/>
  <line x1="480" y1="164" x2="680" y2="226" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar19b)"/>
  <line x1="430" y1="288" x2="430" y2="356" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar19b)"/>
  <line x1="680" y1="288" x2="680" y2="356" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar19b)"/>

  <text x="430" y="470" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Pastga tushgan sari muammo aniqroq, tekshirsa bo'ladigan va kichikroq bo'ladi</text>
</svg>
