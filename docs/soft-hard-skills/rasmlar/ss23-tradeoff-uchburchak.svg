<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560">
  <title>Trade-off uchburchagi: tez, sifatli, arzon -- uchtasidan ikkitasini tanlaysiz</title>
  <rect x="0" y="0" width="820" height="560" fill="#f8fafc"/>
  <text x="410" y="44" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Trade-off uchburchagi</text>
  <text x="410" y="72" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Uch xususiyatdan koʻpi bilan ikkitasini tanlay olasiz</text>

  <!-- Triangle -->
  <polygon points="410,130 690,470 130,470" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>

  <!-- Vertices: corner circles -->
  <circle cx="410" cy="130" r="56" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="125" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#2563eb">TEZ</text>
  <text x="410" y="146" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">tez yetkazish</text>

  <circle cx="690" cy="470" r="56" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="690" y="465" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#16a34a">SIFATLI</text>
  <text x="690" y="486" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">kam xato</text>

  <circle cx="130" cy="470" r="56" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="130" y="465" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#f59e0b">ARZON</text>
  <text x="130" y="486" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">kam resurs</text>

  <!-- Center note -->
  <text x="410" y="330" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Birini olsang,</text>
  <text x="410" y="352" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">boshqasidan voz kechasan</text>

  <!-- Examples bar -->
  <rect x="60" y="510" width="220" height="34" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="170" y="532" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Tez + Arzon = sifatsiz</text>

  <rect x="300" y="510" width="220" height="34" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="532" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Tez + Sifatli = qimmat</text>

  <rect x="540" y="510" width="220" height="34" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="650" y="532" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Sifatli + Arzon = sekin</text>
</svg>
