<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460">
  <title>Autentifikatsiya (kim?) va avtorizatsiya (nimaga ruxsat?) — ikki ketma-ket bosqich</title>
  <rect x="0" y="0" width="880" height="460" fill="#f8fafc"/>
  <text x="440" y="36" text-anchor="middle" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b">Authn va Authz — bitta so'rovning ikki darvozasi</text>
  <text x="440" y="60" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Avval "kim sen?", keyin "buni qilishga ruxsating bormi?"</text>

  <defs>
    <marker id="a12a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Request -->
  <rect x="30" y="170" width="150" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="105" y="200" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">So'rov keladi</text>
  <text x="105" y="224" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">DELETE</text>
  <text x="105" y="242" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748b">/orders/42</text>

  <line x1="180" y1="210" x2="240" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#a12a)"/>

  <!-- Authn gate -->
  <rect x="245" y="150" width="200" height="120" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="345" y="180" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#7c3aed">1. Autentifikatsiya</text>
  <text x="345" y="202" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">"Kim sen?"</text>
  <text x="345" y="226" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">token/login tekshiriladi</text>
  <text x="345" y="248" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">muvaffaqiyatsiz -&gt; 401</text>

  <line x1="445" y1="210" x2="505" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#a12a)"/>
  <text x="475" y="200" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a">OK</text>

  <!-- Authz gate -->
  <rect x="510" y="150" width="220" height="120" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="620" y="180" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">2. Avtorizatsiya</text>
  <text x="620" y="202" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">"Buni qila olasanmi?"</text>
  <text x="620" y="226" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">rol/scope + egalik tekshiriladi</text>
  <text x="620" y="248" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">ruxsat yo'q -&gt; 403</text>

  <line x1="730" y1="210" x2="790" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#a12a)"/>

  <!-- Allowed -->
  <rect x="760" y="180" width="100" height="60" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="810" y="206" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">Bajariladi</text>
  <text x="810" y="226" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">2xx</text>

  <!-- bottom note -->
  <rect x="60" y="330" width="760" height="96" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="440" y="358" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#b45309">Tartib muhim</text>
  <text x="440" y="384" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Autentifikatsiya kimligini aniqlaydi; avtorizatsiya o'sha aniqlangan kimsa nimaga haqli ekanini hal qiladi.</text>
  <text x="440" y="406" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Authn bo'lmasa authz ma'nosiz; authz bo'lmasa har kim har narsani qila oladi.</text>
</svg>
