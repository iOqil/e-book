<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520">
  <title>Query parametrlar: filtrlash, saralash va sparse fieldsets anatomiyasi</title>
  <rect x="0" y="0" width="880" height="520" fill="#f8fafc"/>
  <text x="440" y="36" text-anchor="middle" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b">Bitta URL — uchta vazifa</text>
  <text x="440" y="60" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Query string kolleksiyani filtrlaydi, saralaydi va kesadi</text>

  <!-- URL line -->
  <rect x="40" y="84" width="800" height="48" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="56" y="114" font-family="monospace" font-size="15" fill="#1e293b">GET /products?</text>
  <text x="216" y="114" font-family="monospace" font-size="15" fill="#2563eb">status=active</text>
  <text x="356" y="114" font-family="monospace" font-size="15" fill="#334155">&amp;</text>
  <text x="372" y="114" font-family="monospace" font-size="15" fill="#16a34a">sort=-created_at</text>
  <text x="540" y="114" font-family="monospace" font-size="15" fill="#334155">&amp;</text>
  <text x="556" y="114" font-family="monospace" font-size="15" fill="#7c3aed">fields=id,name</text>

  <!-- connectors -->
  <line x1="276" y1="132" x2="200" y2="172" stroke="#2563eb" stroke-width="2"/>
  <line x1="450" y1="132" x2="450" y2="172" stroke="#16a34a" stroke-width="2"/>
  <line x1="620" y1="132" x2="700" y2="172" stroke="#7c3aed" stroke-width="2"/>

  <!-- Filter card -->
  <rect x="40" y="176" width="256" height="300" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="64" y="206" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">Filtrlash</text>
  <text x="64" y="230" font-family="Segoe UI" font-size="13" fill="#64748b">"qaysi qatorlar?"</text>
  <text x="64" y="262" font-family="monospace" font-size="13" fill="#1d4ed8">?status=active</text>
  <text x="64" y="286" font-family="monospace" font-size="13" fill="#1d4ed8">?category=books</text>
  <text x="64" y="318" font-family="Segoe UI" font-size="13" fill="#334155">Operatorli (murakkab):</text>
  <text x="64" y="342" font-family="monospace" font-size="13" fill="#1d4ed8">?price[gte]=100</text>
  <text x="64" y="366" font-family="monospace" font-size="13" fill="#1d4ed8">?price[lte]=500</text>
  <text x="64" y="404" font-family="Segoe UI" font-size="13" fill="#334155">Natija: 1200 → 84 qator</text>
  <text x="64" y="440" font-family="Segoe UI" font-size="13" fill="#64748b">SQL: WHERE bandi</text>

  <!-- Sort card -->
  <rect x="312" y="176" width="256" height="300" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="336" y="206" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">Saralash</text>
  <text x="336" y="230" font-family="Segoe UI" font-size="13" fill="#64748b">"qaysi tartibda?"</text>
  <text x="336" y="262" font-family="monospace" font-size="13" fill="#15803d">?sort=created_at</text>
  <text x="336" y="284" font-family="Segoe UI" font-size="13" fill="#64748b">o'sish (ASC)</text>
  <text x="336" y="316" font-family="monospace" font-size="13" fill="#15803d">?sort=-created_at</text>
  <text x="336" y="338" font-family="Segoe UI" font-size="13" fill="#64748b">defis = kamayish (DESC)</text>
  <text x="336" y="370" font-family="monospace" font-size="13" fill="#15803d">?sort=-price,name</text>
  <text x="336" y="392" font-family="Segoe UI" font-size="13" fill="#64748b">ko'p maydon, chapdan</text>
  <text x="336" y="440" font-family="Segoe UI" font-size="13" fill="#64748b">SQL: ORDER BY</text>

  <!-- Sparse card -->
  <rect x="584" y="176" width="256" height="300" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="608" y="206" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#7c3aed">Sparse fields</text>
  <text x="608" y="230" font-family="Segoe UI" font-size="13" fill="#64748b">"qaysi maydonlar?"</text>
  <text x="608" y="262" font-family="monospace" font-size="13" fill="#6d28d9">?fields=id,name</text>
  <text x="608" y="294" font-family="Segoe UI" font-size="13" fill="#334155">To'liq obyekt o'rniga</text>
  <text x="608" y="314" font-family="Segoe UI" font-size="13" fill="#334155">faqat kerakli maydonlar.</text>
  <text x="608" y="346" font-family="Segoe UI" font-size="13" fill="#334155">Over-fetching kamayadi,</text>
  <text x="608" y="366" font-family="Segoe UI" font-size="13" fill="#334155">payload yengillashadi.</text>
  <text x="608" y="404" font-family="Segoe UI" font-size="13" fill="#64748b">GraphQL g'oyasi REST'da</text>
  <text x="608" y="440" font-family="Segoe UI" font-size="13" fill="#64748b">SQL: SELECT ustunlar</text>
</svg>
