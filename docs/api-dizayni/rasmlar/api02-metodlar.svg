<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <title>HTTP metodlari: safe, idempotent, body va qo'llanilishi</title>
  <rect x="0" y="0" width="900" height="520" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b">HTTP metodlari (RFC 9110)</text>
  <text x="450" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Safe = o'qish, o'zgartirmaydi · Idempotent = takror = bir xil natija</text>

  <!-- header row -->
  <rect x="36" y="78" width="120" height="40" fill="#1e293b"/>
  <rect x="156" y="78" width="110" height="40" fill="#1e293b"/>
  <rect x="266" y="78" width="130" height="40" fill="#1e293b"/>
  <rect x="396" y="78" width="100" height="40" fill="#1e293b"/>
  <rect x="496" y="78" width="368" height="40" fill="#1e293b"/>
  <text x="96" y="103" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff">Metod</text>
  <text x="211" y="103" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff">Safe?</text>
  <text x="331" y="103" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff">Idempotent?</text>
  <text x="446" y="103" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff">Body?</text>
  <text x="680" y="103" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff">Qo'llanilishi</text>

  <!-- rows -->
  <!-- GET -->
  <rect x="36" y="118" width="828" height="44" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="96" y="146" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#16a34a">GET</text>
  <text x="211" y="146" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">Ha</text>
  <text x="331" y="146" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">Ha</text>
  <text x="446" y="146" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Yo'q (odatda)</text>
  <text x="510" y="146" font-family="Segoe UI" font-size="13" fill="#334155">Resurs(lar)ni o'qish</text>
  <!-- HEAD -->
  <rect x="36" y="162" width="828" height="44" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="96" y="190" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#16a34a">HEAD</text>
  <text x="211" y="190" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">Ha</text>
  <text x="331" y="190" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">Ha</text>
  <text x="446" y="190" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Yo'q</text>
  <text x="510" y="190" font-family="Segoe UI" font-size="13" fill="#334155">GET kabi, faqat sarlavhalar (body siz)</text>
  <!-- POST -->
  <rect x="36" y="206" width="828" height="44" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="96" y="234" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#f59e0b">POST</text>
  <text x="211" y="234" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#dc2626">Yo'q</text>
  <text x="331" y="234" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#dc2626">Yo'q</text>
  <text x="446" y="234" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">Ha</text>
  <text x="510" y="234" font-family="Segoe UI" font-size="13" fill="#334155">Yaratish; takror = yangi nusxa xavfi</text>
  <!-- PUT -->
  <rect x="36" y="250" width="828" height="44" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="96" y="278" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#2563eb">PUT</text>
  <text x="211" y="278" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#dc2626">Yo'q</text>
  <text x="331" y="278" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">Ha</text>
  <text x="446" y="278" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">Ha</text>
  <text x="510" y="278" font-family="Segoe UI" font-size="13" fill="#334155">To'liq almashtirish (full replace)</text>
  <!-- PATCH -->
  <rect x="36" y="294" width="828" height="44" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="96" y="322" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#7c3aed">PATCH</text>
  <text x="211" y="322" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#dc2626">Yo'q</text>
  <text x="331" y="322" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#f59e0b">Shart emas</text>
  <text x="446" y="322" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">Ha</text>
  <text x="510" y="322" font-family="Segoe UI" font-size="13" fill="#334155">Qisman o'zgartirish (RFC 5789)</text>
  <!-- DELETE -->
  <rect x="36" y="338" width="828" height="44" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="96" y="366" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#dc2626">DELETE</text>
  <text x="211" y="366" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#dc2626">Yo'q</text>
  <text x="331" y="366" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">Ha</text>
  <text x="446" y="366" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Ixtiyoriy</text>
  <text x="510" y="366" font-family="Segoe UI" font-size="13" fill="#334155">O'chirish; takror = baribir yo'q holat</text>
  <!-- OPTIONS -->
  <rect x="36" y="382" width="828" height="44" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="96" y="410" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#64748b">OPTIONS</text>
  <text x="211" y="410" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">Ha</text>
  <text x="331" y="410" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">Ha</text>
  <text x="446" y="410" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Ixtiyoriy</text>
  <text x="510" y="410" font-family="Segoe UI" font-size="13" fill="#334155">Imkoniyatlar; CORS preflight</text>

  <!-- note -->
  <rect x="36" y="442" width="828" height="62" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="52" y="466" font-family="Segoe UI" font-size="13" fill="#334155">Idempotent metod xato/timeout holatida mijoz xavfsiz QAYTA urinishi mumkin — natija o'zgarmaydi.</text>
  <text x="52" y="488" font-family="Segoe UI" font-size="13" fill="#334155">POST idempotent emas: takror urinish ikkita buyurtma yaratishi mumkin (yechim: Idempotency-Key).</text>
</svg>
