<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470">
  <title>API hayot sikli bosqichlari: dizayndan retirgacha</title>
  <rect x="0" y="0" width="920" height="470" fill="#f8fafc"/>
  <text x="460" y="34" text-anchor="middle" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b">API hayot sikli — tug'ilishidan o'limigacha</text>
  <text x="460" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">API mahsulot kabi rejalashtiriladi, "deploy qilib unutish" emas</text>

  <!-- Asosiy oqim chizig'i -->
  <line x1="80" y1="150" x2="850" y2="150" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="850,150 838,144 838,156" fill="#94a3b8"/>

  <!-- 1. Dizayn -->
  <circle cx="120" cy="150" r="10" fill="#7c3aed"/>
  <rect x="50" y="172" width="150" height="74" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="125" y="196" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">1. Dizayn</text>
  <text x="125" y="217" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Resurs, kontrakt,</text>
  <text x="125" y="234" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">review (spec-first)</text>

  <!-- 2. Ishlab chiqish -->
  <circle cx="255" cy="150" r="10" fill="#2563eb"/>
  <rect x="190" y="262" width="150" height="74" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <line x1="255" y1="160" x2="255" y2="262" stroke="#2563eb" stroke-width="2"/>
  <text x="265" y="286" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">2. Ishlab chiqish</text>
  <text x="265" y="307" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Kod, test,</text>
  <text x="265" y="324" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">contract testlar</text>

  <!-- 3. Nashr -->
  <circle cx="390" cy="150" r="10" fill="#16a34a"/>
  <rect x="325" y="172" width="150" height="74" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="196" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#15803d">3. Nashr</text>
  <text x="400" y="217" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">publish / release,</text>
  <text x="400" y="234" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">v1 jonli</text>

  <!-- 4. Qo'llab-quvvatlash -->
  <circle cx="525" cy="150" r="10" fill="#16a34a"/>
  <rect x="455" y="262" width="160" height="74" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <line x1="525" y1="160" x2="525" y2="262" stroke="#16a34a" stroke-width="2"/>
  <text x="535" y="286" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#15803d">4. Qo'llab-quvvatlash</text>
  <text x="535" y="307" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">evolyutsiya,</text>
  <text x="535" y="324" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">additive o'sish</text>

  <!-- 5. Deprecation -->
  <circle cx="660" cy="150" r="10" fill="#f59e0b"/>
  <rect x="600" y="172" width="150" height="74" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="675" y="196" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#b45309">5. Deprecation</text>
  <text x="675" y="217" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">"eskirgan" e'lon,</text>
  <text x="675" y="234" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">hali ishlaydi</text>

  <!-- 6. Sunset -->
  <circle cx="775" cy="150" r="10" fill="#ea580c"/>
  <rect x="700" y="262" width="150" height="74" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <line x1="775" y1="160" x2="775" y2="262" stroke="#ea580c" stroke-width="2"/>
  <text x="775" y="286" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#c2410c">6. Sunset</text>
  <text x="775" y="307" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">o'chirish sanasi</text>
  <text x="775" y="324" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">e'lon qilinadi</text>

  <!-- 7. Retire -->
  <circle cx="850" cy="150" r="10" fill="#dc2626"/>
  <rect x="775" y="84" width="130" height="58" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <line x1="850" y1="142" x2="850" y2="150" stroke="#dc2626" stroke-width="2"/>
  <text x="840" y="108" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#b91c1c">7. Retire</text>
  <text x="840" y="129" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">410 Gone</text>

  <!-- Pastki izoh -->
  <rect x="50" y="356" width="820" height="92" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="460" y="380" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">Har bosqich rejalashtiriladi</text>
  <text x="70" y="404" font-family="Segoe UI" font-size="13" fill="#334155">• 1-4 = o'sish: kontrakt e'tibor, additive evolyutsiya, hech kimni sindirmaslik</text>
  <text x="70" y="426" font-family="Segoe UI" font-size="13" fill="#334155">• 5-7 = halol qarish: ogohlantir (Deprecation) → sana ber (Sunset) → o'chir (Retire)</text>
</svg>
