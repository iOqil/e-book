<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540">
  <title>API kompozitsiya: bitta so'rov bir nechta servisga tarqaladi va javoblar birlashtiriladi</title>
  <rect x="0" y="0" width="900" height="540" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b">API kompozitsiya (aggregatsiya) — scatter-gather</text>
  <text x="450" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Bitta mijoz so'rovi -> gateway bir nechta servisga parallel chaqiradi -> javoblarni birlashtiradi</text>

  <!-- Client -->
  <rect x="40" y="240" width="150" height="60" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="266" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1d4ed8">Mijoz</text>
  <text x="115" y="286" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748b">GET /dashboard</text>

  <!-- request arrow -->
  <line x1="190" y1="262" x2="330" y2="262" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrK)"/>
  <text x="260" y="252" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">1 so'rov</text>

  <!-- Gateway / aggregator -->
  <rect x="330" y="200" width="180" height="140" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="420" y="232" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#6d28d9">Gateway / BFF</text>
  <text x="420" y="256" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">aggregator</text>
  <text x="420" y="284" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">parallel chaqiradi,</text>
  <text x="420" y="304" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">javoblarni birlashtiradi</text>

  <!-- scatter arrows to services -->
  <line x1="510" y1="230" x2="660" y2="130" stroke="#16a34a" stroke-width="2" marker-end="url(#arrK2)"/>
  <line x1="510" y1="270" x2="660" y2="270" stroke="#16a34a" stroke-width="2" marker-end="url(#arrK2)"/>
  <line x1="510" y1="310" x2="660" y2="410" stroke="#16a34a" stroke-width="2" marker-end="url(#arrK2)"/>
  <text x="582" y="168" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">scatter</text>

  <!-- Services -->
  <rect x="660" y="100" width="200" height="60" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="760" y="124" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#15803d">user-service</text>
  <text x="760" y="144" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748b">profil</text>

  <rect x="660" y="240" width="200" height="60" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="760" y="264" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#15803d">order-service</text>
  <text x="760" y="284" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748b">oxirgi buyurtmalar</text>

  <rect x="660" y="380" width="200" height="60" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="760" y="404" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#b91c1c">reco-service</text>
  <text x="760" y="424" text-anchor="middle" font-family="monospace" font-size="13" fill="#dc2626">tushdi -> qisman</text>

  <!-- gather response -->
  <line x1="330" y1="290" x2="190" y2="290" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrK3)"/>
  <text x="260" y="310" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#7c3aed">1 birlashgan javob</text>

  <!-- bottom note -->
  <rect x="40" y="450" width="820" height="68" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="450" y="472" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#b45309">Trade-off: kechikish = eng sekin chaqiruv; bir servis tushsa — qisman muvaffaqiyat</text>
  <text x="450" y="492" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">reco-service tushdi -> uni bo'sh qoldirib, qolgan ma'lumot bilan javob qaytariladi</text>
  <text x="450" y="510" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Parallel chaqiruv ketma-ketdan tez; timeout + fallback shart</text>

  <defs>
    <marker id="arrK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrK2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrK3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7c3aed"/>
    </marker>
  </defs>
</svg>
