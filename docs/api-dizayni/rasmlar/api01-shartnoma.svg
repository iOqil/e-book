<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470">
  <title>API mijoz va server o'rtasidagi shartnoma (contract)</title>
  <rect x="0" y="0" width="880" height="470" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b">API = mijoz va server o'rtasidagi SHARTNOMA</text>
  <text x="440" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">So'rov shakli va javob shakli kelishilgan; ichki implementatsiya yashirin</text>

  <!-- Client card -->
  <rect x="40" y="95" width="220" height="150" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="125" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">Mijoz (client)</text>
  <text x="150" y="152" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">mobil ilova,</text>
  <text x="150" y="172" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">brauzer (SPA),</text>
  <text x="150" y="192" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">boshqa servis</text>
  <text x="150" y="222" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">shartnomaga ishonadi</text>

  <!-- Contract in middle -->
  <rect x="320" y="85" width="240" height="180" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="440" y="112" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">SHARTNOMA (contract)</text>
  <line x1="340" y1="124" x2="540" y2="124" stroke="#e2e8f0" stroke-width="1"/>
  <text x="340" y="148" font-family="monospace" font-size="13" fill="#16a34a">POST /v1/orders</text>
  <text x="340" y="170" font-family="monospace" font-size="13" fill="#334155">{ item_id, quantity }</text>
  <text x="340" y="196" font-family="monospace" font-size="13" fill="#2563eb">-&gt; 201 Created</text>
  <text x="340" y="218" font-family="monospace" font-size="13" fill="#334155">{ id, status }</text>
  <text x="440" y="248" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">so'rov + javob shakli</text>

  <!-- Server card -->
  <rect x="620" y="95" width="220" height="150" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="730" y="125" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">Server (provayder)</text>
  <text x="730" y="152" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">DB, biznes-mantiq,</text>
  <text x="730" y="172" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">til, freymvork</text>
  <text x="730" y="192" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">YASHIRIN</text>
  <text x="730" y="222" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">shartnomani saqlaydi</text>

  <!-- Arrows -->
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <line x1="262" y1="160" x2="316" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="618" y1="160" x2="564" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Bottom note -->
  <rect x="120" y="300" width="640" height="130" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="440" y="328" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#f59e0b">Kalit g'oya: shartnoma BARQAROR, implementatsiya O'ZGARUVCHAN</text>
  <text x="440" y="356" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Server ichida tilni, ma'lumotlar bazasini, algoritmni o'zgartirishingiz mumkin —</text>
  <text x="440" y="378" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">shartnoma (so'rov/javob shakli) saqlansa, mijoz buzilmaydi.</text>
  <text x="440" y="406" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Bu — inkapsulyatsiya: tashqi interfeys oddiy, ichki murakkablik yashiringan.</text>
</svg>
