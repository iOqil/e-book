<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560">
  <title>API loyihalash jarayoni: talabdan testgacha on qadam</title>
  <rect x="0" y="0" width="880" height="560" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b">API loyihalash jarayoni — 10 qadam</text>
  <text x="440" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Talabdan ishlaydigan shartnomagacha (har qadam = tegishli bob)</text>

  <!-- helper: rows -->
  <!-- Row 1: steps 1-5 -->
  <!-- step 1 -->
  <rect x="30" y="90" width="150" height="70" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="105" y="116" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">1. Talablar</text>
  <text x="105" y="138" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">nima, kim, NFR</text>

  <rect x="205" y="90" width="150" height="70" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="280" y="116" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">2. Resurslar</text>
  <text x="280" y="138" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">otlar + bog'lanish</text>

  <rect x="380" y="90" width="150" height="70" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="455" y="116" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">3. Endpoint</text>
  <text x="455" y="138" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">URL+metod+status</text>

  <rect x="555" y="90" width="150" height="70" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="630" y="116" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">4. So'rov/javob</text>
  <text x="630" y="138" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">payload, sahifa</text>

  <rect x="700" y="200" width="150" height="70" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="775" y="226" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">5. Xato</text>
  <text x="775" y="248" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Problem Details</text>

  <!-- Row 2 (reverse): steps 6-10 -->
  <rect x="525" y="200" width="150" height="70" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="226" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">6. Auth</text>
  <text x="600" y="248" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">scope + BOLA</text>

  <rect x="350" y="200" width="150" height="70" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="425" y="226" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#b45309">7. Sifat</text>
  <text x="425" y="248" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">limit·idemp·kesh</text>

  <rect x="175" y="200" width="150" height="70" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="250" y="226" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">8. Versiyalash</text>
  <text x="250" y="248" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">URI /v1/</text>

  <rect x="30" y="310" width="150" height="70" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="105" y="336" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">9. OpenAPI</text>
  <text x="105" y="358" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">haqiqat manbai</text>

  <rect x="205" y="310" width="200" height="70" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="305" y="336" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">10. Hujjat·Test·Obs.</text>
  <text x="305" y="358" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">DX, contract, log</text>

  <!-- arrows row1 -->
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <line x1="180" y1="125" x2="203" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="355" y1="125" x2="378" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="530" y1="125" x2="553" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
  <!-- 4 -> 5 (down to row2 right) -->
  <path d="M705,150 Q780,165 775,198" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
  <!-- row2 arrows (right to left) -->
  <line x1="700" y1="235" x2="677" y2="235" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="525" y1="235" x2="502" y2="235" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="350" y1="235" x2="327" y2="235" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
  <!-- 8 -> 9 down -->
  <path d="M175,255 Q105,275 105,308" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="180" y1="345" x2="203" y2="345" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>

  <!-- iteration note -->
  <rect x="455" y="320" width="395" height="120" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="652" y="346" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Eslatma: iteratsiya</text>
  <text x="472" y="372" font-family="Segoe UI" font-size="13" fill="#334155">Qadamlar qat'iy ketma-ket emas — ko'pincha</text>
  <text x="472" y="392" font-family="Segoe UI" font-size="13" fill="#334155">takrorlanadi. Endpoint dizayni resursni qayta</text>
  <text x="472" y="412" font-family="Segoe UI" font-size="13" fill="#334155">ko'rsatadi; OpenAPI xato shaklini aniqlaydi.</text>

  <!-- bottom principle bar -->
  <rect x="30" y="470" width="820" height="62" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="498" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Yaxshi API = izchil shartnoma + empatiya</text>
  <text x="440" y="520" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Standartlar izchillikni beradi (RFC 9110 / 9457 / 9111, OpenAPI); qolgani — mashq</text>
</svg>
