<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560">
  <title>Consumer-driven contract: iste'molchi kutgan shartnoma provayder tomonidan tasdiqlanadi</title>
  <rect x="0" y="0" width="880" height="560" fill="#f8fafc"/>
  <text x="440" y="36" text-anchor="middle" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b">Consumer-driven contract testing</text>
  <text x="440" y="60" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Iste'molchi shartnomani yozadi -> provayder uni qondirishini CI tekshiradi</text>

  <!-- Consumer tomoni -->
  <rect x="40" y="90" width="300" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="116" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e3a8a">Consumer (iste'molchi)</text>
  <text x="190" y="138" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e3a8a">mas: mobil ilova</text>
  <rect x="60" y="152" width="260" height="74" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="74" y="174" font-family="monospace" font-size="13" fill="#1e3a8a">GET /users/7 so'rasam,</text>
  <text x="74" y="194" font-family="monospace" font-size="13" fill="#1e3a8a">200 + {id, name, email}</text>
  <text x="74" y="214" font-family="monospace" font-size="13" fill="#1e3a8a">kutaman</text>

  <!-- shartnoma fayli markazda -->
  <rect x="380" y="120" width="120" height="90" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="440" y="150" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#5b21b6">Pact</text>
  <text x="440" y="170" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#5b21b6">shartnoma</text>
  <text x="440" y="190" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#5b21b6">(JSON)</text>

  <!-- Provider tomoni -->
  <rect x="540" y="90" width="300" height="150" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="690" y="116" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#166534">Provider (provayder)</text>
  <text x="690" y="138" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">mas: foydalanuvchi API</text>
  <rect x="560" y="152" width="260" height="74" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="574" y="174" font-family="monospace" font-size="13" fill="#166534">haqiqiy GET /users/7</text>
  <text x="574" y="194" font-family="monospace" font-size="13" fill="#166534">shartnomaga mosmi?</text>
  <text x="574" y="214" font-family="monospace" font-size="13" fill="#166534">-> tasdiqlanadi (verify)</text>

  <!-- strelkalar: consumer -> pact -->
  <line x1="340" y1="165" x2="375" y2="165" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrB2)"/>
  <text x="357" y="155" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">e'lon</text>
  <!-- pact -> provider -->
  <line x1="500" y1="165" x2="535" y2="165" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrP2)"/>
  <text x="517" y="155" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#7c3aed">tekshir</text>

  <!-- oqim 1: consumer test -->
  <rect x="40" y="270" width="800" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="296" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e3a8a">1) Consumer testi (consumer kodida)</text>
  <text x="60" y="318" font-family="Segoe UI" font-size="13" fill="#334155">Iste'molchi mock provayderga so'rov yuboradi, kutilgan javobni belgilaydi.</text>
  <text x="60" y="338" font-family="Segoe UI" font-size="13" fill="#334155">Test o'tsa, "shartnoma" fayli (Pact) avtomatik yoziladi va chop etiladi (broker).</text>

  <!-- oqim 2: provider verify -->
  <rect x="40" y="362" width="800" height="80" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="60" y="388" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#166534">2) Provider verifikatsiyasi (provayder CI'da)</text>
  <text x="60" y="410" font-family="Segoe UI" font-size="13" fill="#334155">Provayder shartnomadagi har so'rovni HAQIQIY endpointga yuboradi.</text>
  <text x="60" y="430" font-family="Segoe UI" font-size="13" fill="#334155">Javob shartnomaga mos kelsa PASS; mos kelmasa -> build to'xtaydi.</text>

  <!-- foyda paneli -->
  <rect x="40" y="454" width="800" height="78" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="60" y="480" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#b45309">Foyda</text>
  <text x="60" y="502" font-family="Segoe UI" font-size="13" fill="#334155">Ikki jamoa mustaqil deploy qiladi: shartnoma buzilsa, integratsiyani sahnaga</text>
  <text x="60" y="522" font-family="Segoe UI" font-size="13" fill="#334155">chiqarmasdan, CI'da darhol topiladi. To'liq E2E muhit kerak emas.</text>

  <defs>
    <marker id="arrB2" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#2563eb"/></marker>
    <marker id="arrP2" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#7c3aed"/></marker>
  </defs>
</svg>
