<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540">
  <title>Yaxshi API hujjatining anatomiyasi</title>
  <rect x="0" y="0" width="880" height="540" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b">Yaxshi hujjat anatomiyasi</text>
  <text x="440" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">dasturchi kerakli javobni tez topadigan oltita qatlam</text>

  <!-- 1 Kirish -->
  <rect x="40" y="80" width="380" height="92" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="58" y="108" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">1. Kirish / umumiy ko'rinish</text>
  <text x="58" y="132" font-family="Segoe UI" font-size="13" fill="#334155">API nima qiladi, asosiy tushunchalar,</text>
  <text x="58" y="152" font-family="Segoe UI" font-size="13" fill="#334155">resurslar va modeli "katta rasmi".</text>

  <!-- 2 Quickstart -->
  <rect x="460" y="80" width="380" height="92" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="478" y="108" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">2. Tezkor start (quickstart)</text>
  <text x="478" y="132" font-family="Segoe UI" font-size="13" fill="#334155">5 daqiqada birinchi muvaffaqiyatli</text>
  <text x="478" y="152" font-family="Segoe UI" font-size="13" fill="#334155">chaqiruv — eng muhim sahifa.</text>

  <!-- 3 Auth -->
  <rect x="40" y="190" width="380" height="92" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="58" y="218" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">3. Autentifikatsiya</text>
  <text x="58" y="242" font-family="Segoe UI" font-size="13" fill="#334155">kalit qanday olinadi, qanday</text>
  <text x="58" y="262" font-family="Segoe UI" font-size="13" fill="#334155">yuboriladi, doiralar (scopes).</text>

  <!-- 4 Reference -->
  <rect x="460" y="190" width="380" height="92" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="478" y="218" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">4. Endpoint ma'lumotnomasi</text>
  <text x="478" y="242" font-family="Segoe UI" font-size="13" fill="#334155">metod, URL, parametr, so'rov/javob,</text>
  <text x="478" y="262" font-family="Segoe UI" font-size="13" fill="#334155">status va xatolar — OpenAPI'dan.</text>

  <!-- 5 Examples -->
  <rect x="40" y="300" width="380" height="92" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="58" y="328" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#f59e0b">5. Misollar (eng ko'p o'qiladigan)</text>
  <text x="58" y="352" font-family="Segoe UI" font-size="13" fill="#334155">har endpointga real curl + til</text>
  <text x="58" y="372" font-family="Segoe UI" font-size="13" fill="#334155">namunalari, real so'rov va javob.</text>

  <!-- 6 Errors/limits -->
  <rect x="460" y="300" width="380" height="92" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="478" y="328" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">6. Xatolar, limit, pagination</text>
  <text x="478" y="352" font-family="Segoe UI" font-size="13" fill="#334155">xato ro'yxati, rate limit, sahifalash</text>
  <text x="478" y="372" font-family="Segoe UI" font-size="13" fill="#334155">va versiyalash / changelog.</text>

  <!-- bottom band: changelog -->
  <rect x="40" y="412" width="800" height="56" rx="10" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="438" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">+ Changelog / versiyalash — nima o'zgardi, nima eskirdi (deprecation)</text>
  <text x="440" y="458" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">dasturchi yangilanishlarni kuzatadi, kutilmagan buzilishdan saqlanadi</text>

  <!-- golden rule -->
  <rect x="40" y="486" width="800" height="38" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="440" y="510" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">Oltin qoida: hujjat KOD bilan sinxron bo'lishi shart — OpenAPI = yagona haqiqat manbai</text>
</svg>
