<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <title>Kvota darajalari: free, pro va enterprise rejalari uchun so'rov chegaralari</title>
  <rect x="0" y="0" width="900" height="500" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b">Kvota darajalari (billing bilan bog'liq)</text>
  <text x="450" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Reja qancha qimmat — shuncha ko'p tezlik va umumiy hajm</text>

  <!-- Free -->
  <rect x="40" y="92" width="250" height="330" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <rect x="40" y="92" width="250" height="56" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="165" y="128" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#475569">Free</text>
  <text x="165" y="178" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Tezlik (rate)</text>
  <text x="165" y="202" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#334155">10 so'rov / daqiqa</text>
  <line x1="70" y1="222" x2="260" y2="222" stroke="#e2e8f0" stroke-width="1"/>
  <text x="165" y="252" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Kvota (quota)</text>
  <text x="165" y="276" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#334155">10 000 / oy</text>
  <line x1="70" y1="296" x2="260" y2="296" stroke="#e2e8f0" stroke-width="1"/>
  <text x="165" y="326" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Concurrency</text>
  <text x="165" y="350" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#334155">2 parallel</text>
  <text x="165" y="396" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">Narx: $0</text>

  <!-- Pro -->
  <rect x="325" y="92" width="250" height="330" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="325" y="92" width="250" height="56" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="450" y="128" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#2563eb">Pro</text>
  <text x="450" y="178" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Tezlik (rate)</text>
  <text x="450" y="202" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">100 so'rov / daqiqa</text>
  <line x1="355" y1="222" x2="545" y2="222" stroke="#dbeafe" stroke-width="1"/>
  <text x="450" y="252" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Kvota (quota)</text>
  <text x="450" y="276" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">1 000 000 / oy</text>
  <line x1="355" y1="296" x2="545" y2="296" stroke="#dbeafe" stroke-width="1"/>
  <text x="450" y="326" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Concurrency</text>
  <text x="450" y="350" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#1e293b">20 parallel</text>
  <text x="450" y="396" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#2563eb">Narx: $49 / oy</text>

  <!-- Enterprise -->
  <rect x="610" y="92" width="250" height="330" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="610" y="92" width="250" height="56" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="735" y="128" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#7c3aed">Enterprise</text>
  <text x="735" y="178" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Tezlik (rate)</text>
  <text x="735" y="202" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">2 000 so'rov / daqiqa</text>
  <line x1="640" y1="222" x2="830" y2="222" stroke="#ede9fe" stroke-width="1"/>
  <text x="735" y="252" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Kvota (quota)</text>
  <text x="735" y="276" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">Kelishuv bo'yicha</text>
  <line x1="640" y1="296" x2="830" y2="296" stroke="#ede9fe" stroke-width="1"/>
  <text x="735" y="326" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Concurrency</text>
  <text x="735" y="350" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#1e293b">Maxsus SLA</text>
  <text x="735" y="396" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#7c3aed">Narx: shartnoma</text>

  <text x="450" y="456" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Tezlik = qisqa muddatli (so'rov/daqiqa) · Kvota = umumiy hajm (so'rov/oy)</text>
  <text x="450" y="480" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Daraja API key bilan aniqlanadi; oshirilsa 429 (tezlik) yoki kvota tugashi xatosi qaytadi</text>
</svg>
