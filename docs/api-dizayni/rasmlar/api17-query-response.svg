<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560">
  <title>GraphQL query: mijoz aniq maydonlarni so'raydi va javob aynan o'sha shaklda qaytadi (over/under-fetching yo'q)</title>
  <rect x="0" y="0" width="900" height="560" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b">So'rov shakli = javob shakli</text>
  <text x="450" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Mijoz kerakli maydonlarni tanlaydi -> ortiqcha ham, kam ham emas</text>

  <!-- QUERY paneli -->
  <rect x="40" y="86" width="380" height="290" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="230" y="112" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">Mijoz so'rovi (query)</text>
  <line x1="60" y1="122" x2="400" y2="122" stroke="#e2e8f0" stroke-width="1"/>
  <text x="64" y="148" font-family="monospace" font-size="14" fill="#334155">query {</text>
  <text x="84" y="172" font-family="monospace" font-size="14" fill="#16a34a">user(id: "42") {</text>
  <text x="108" y="196" font-family="monospace" font-size="14" fill="#334155">name</text>
  <text x="108" y="220" font-family="monospace" font-size="14" fill="#334155">posts {</text>
  <text x="132" y="244" font-family="monospace" font-size="14" fill="#334155">title</text>
  <text x="108" y="268" font-family="monospace" font-size="14" fill="#334155">}</text>
  <text x="84" y="292" font-family="monospace" font-size="14" fill="#16a34a">}</text>
  <text x="64" y="316" font-family="monospace" font-size="14" fill="#334155">}</text>
  <text x="64" y="350" font-family="Segoe UI" font-size="13" fill="#64748b">faqat: name + posts.title</text>
  <text x="64" y="368" font-family="Segoe UI" font-size="13" fill="#64748b">email/role SO'RALMADI</text>

  <!-- POST /graphql strelka -->
  <line x1="420" y1="230" x2="480" y2="230" stroke="#7c3aed" stroke-width="2.5"/>
  <polygon points="480,230 468,225 468,235" fill="#7c3aed"/>
  <text x="450" y="222" text-anchor="middle" font-family="monospace" font-size="13" fill="#7c3aed">POST</text>
  <text x="450" y="252" text-anchor="middle" font-family="monospace" font-size="13" fill="#7c3aed">/graphql</text>

  <!-- RESPONSE paneli -->
  <rect x="480" y="86" width="380" height="290" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="670" y="112" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">Server javobi (200 OK, JSON)</text>
  <line x1="500" y1="122" x2="840" y2="122" stroke="#e2e8f0" stroke-width="1"/>
  <text x="504" y="148" font-family="monospace" font-size="14" fill="#334155">{ "data": {</text>
  <text x="524" y="172" font-family="monospace" font-size="14" fill="#16a34a">"user": {</text>
  <text x="548" y="196" font-family="monospace" font-size="14" fill="#334155">"name": "Ali",</text>
  <text x="548" y="220" font-family="monospace" font-size="14" fill="#334155">"posts": [</text>
  <text x="572" y="244" font-family="monospace" font-size="14" fill="#334155">{ "title": "Salom" },</text>
  <text x="572" y="268" font-family="monospace" font-size="14" fill="#334155">{ "title": "API" }</text>
  <text x="548" y="292" font-family="monospace" font-size="14" fill="#334155">]</text>
  <text x="524" y="316" font-family="monospace" font-size="14" fill="#16a34a">} } }</text>
  <text x="504" y="350" font-family="Segoe UI" font-size="13" fill="#64748b">shakl so'rovga AYNAN mos</text>
  <text x="504" y="368" font-family="Segoe UI" font-size="13" fill="#64748b">ortiqcha maydon yo'q</text>

  <!-- pastki taqqoslash -->
  <rect x="40" y="400" width="400" height="130" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="240" y="426" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">REST muammosi</text>
  <text x="60" y="452" font-family="Segoe UI" font-size="13" fill="#334155">Over-fetching: GET /users/42 -> butun</text>
  <text x="60" y="472" font-family="Segoe UI" font-size="13" fill="#334155">obyekt (email, role... kerakmas) keladi.</text>
  <text x="60" y="496" font-family="Segoe UI" font-size="13" fill="#334155">Under-fetching: posts uchun yana</text>
  <text x="60" y="516" font-family="Segoe UI" font-size="13" fill="#334155">GET /users/42/posts — 2-chi so'rov.</text>

  <rect x="460" y="400" width="400" height="130" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="426" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">GraphQL yechimi</text>
  <text x="480" y="452" font-family="Segoe UI" font-size="13" fill="#334155">Bitta so'rovda aynan kerakli maydonlar:</text>
  <text x="480" y="472" font-family="Segoe UI" font-size="13" fill="#334155">name + posts.title — boshqa hech narsa.</text>
  <text x="480" y="496" font-family="Segoe UI" font-size="13" fill="#334155">Bog'liq posts ham SHU so'rovda keladi —</text>
  <text x="480" y="516" font-family="Segoe UI" font-size="13" fill="#334155">qo'shimcha aylanish (round-trip) yo'q.</text>
</svg>
