<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540">
  <title>BFF (Backend for Frontend): har mijoz turi uchun moslashtirilgan backend qatlami</title>
  <rect x="0" y="0" width="900" height="540" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b">BFF — har mijozga xos backend qatlami</text>
  <text x="450" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Har mijoz turi o'z BFF'iga, BFF'lar umumiy ichki servislarni aggregatsiya qiladi</text>

  <!-- Clients -->
  <rect x="40" y="100" width="200" height="56" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="124" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1d4ed8">Web mijoz</text>
  <text x="140" y="143" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">ko'p maydon, katta ekran</text>

  <rect x="40" y="240" width="200" height="56" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="264" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#15803d">Mobil mijoz</text>
  <text x="140" y="283" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">kam ma'lumot, kichik ekran</text>

  <rect x="40" y="380" width="200" height="56" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="140" y="404" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#6d28d9">3rd-party mijoz</text>
  <text x="140" y="423" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">barqaror, batafsil shakl</text>

  <!-- arrows clients -> bff -->
  <line x1="240" y1="128" x2="350" y2="128" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="240" y1="268" x2="350" y2="268" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="240" y1="408" x2="350" y2="408" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrB)"/>

  <!-- BFFs -->
  <rect x="350" y="100" width="190" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="445" y="124" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1d4ed8">Web BFF</text>
  <text x="445" y="143" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">web uchun moslangan</text>

  <rect x="350" y="240" width="190" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="445" y="264" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#15803d">Mobil BFF</text>
  <text x="445" y="283" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">qisqartirilgan javob</text>

  <rect x="350" y="380" width="190" height="56" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="445" y="404" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#6d28d9">Public BFF / API</text>
  <text x="445" y="423" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">versiyalangan shartnoma</text>

  <!-- arrows bff -> services (fan in) -->
  <line x1="540" y1="128" x2="660" y2="180" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrB)"/>
  <line x1="540" y1="268" x2="660" y2="280" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrB)"/>
  <line x1="540" y1="408" x2="660" y2="380" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrB)"/>
  <line x1="540" y1="135" x2="660" y2="280" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arrB)"/>
  <line x1="540" y1="261" x2="660" y2="180" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arrB)"/>

  <!-- Shared services -->
  <text x="755" y="92" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155">Umumiy ichki servislar</text>
  <rect x="660" y="158" width="190" height="48" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="755" y="187" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">catalog-service</text>
  <rect x="660" y="256" width="190" height="48" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="755" y="285" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">user-service</text>
  <rect x="660" y="354" width="190" height="48" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="755" y="383" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">order-service</text>

  <rect x="40" y="470" width="810" height="50" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="445" y="491" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#b45309">Har BFF mijozining aniq ehtiyojiga moslab ma'lumotni shakllaydi</text>
  <text x="445" y="509" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Over-fetching / under-fetching mijoz tomonida emas, BFF'da hal qilinadi</text>

  <defs>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
