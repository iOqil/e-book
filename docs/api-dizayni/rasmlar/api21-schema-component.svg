<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500">
  <title>Qayta ishlatiluvchi schema komponenti va $ref: bir marta ta'riflab ko'p joyda ishlatish</title>
  <rect x="0" y="0" width="860" height="500" fill="#f8fafc"/>
  <text x="430" y="34" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b" text-anchor="middle">$ref: bir marta ta'rifla, ko'p joyda ishlat (DRY)</text>

  <!-- definition card -->
  <rect x="290" y="60" width="280" height="150" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="3"/>
  <text x="430" y="86" font-family="monospace" font-size="14" font-weight="bold" fill="#0891b2" text-anchor="middle">components/schemas/Order</text>
  <line x1="310" y1="98" x2="550" y2="98" stroke="#e2e8f0" stroke-width="1"/>
  <text x="312" y="120" font-family="monospace" font-size="13" fill="#334155">type: object</text>
  <text x="312" y="140" font-family="monospace" font-size="13" fill="#334155">required: [id, status]</text>
  <text x="312" y="160" font-family="monospace" font-size="13" fill="#334155">properties:</text>
  <text x="328" y="180" font-family="monospace" font-size="13" fill="#334155">id: integer</text>
  <text x="328" y="200" font-family="monospace" font-size="13" fill="#334155">status: string</text>

  <text x="430" y="232" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">Order shakli FAQAT shu yerda ta'riflanadi (yagona haqiqat)</text>

  <!-- three reference targets -->
  <rect x="40" y="280" width="230" height="130" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="155" y="306" font-family="monospace" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">GET /orders/{id}</text>
  <text x="56" y="330" font-family="monospace" font-size="13" fill="#334155">responses:</text>
  <text x="72" y="350" font-family="monospace" font-size="13" fill="#334155">"200":</text>
  <text x="88" y="370" font-family="monospace" font-size="13" fill="#334155">schema:</text>
  <text x="104" y="390" font-family="monospace" font-size="13" fill="#2563eb">$ref: ".../Order"</text>

  <rect x="315" y="280" width="230" height="130" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="430" y="306" font-family="monospace" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="middle">GET /orders</text>
  <text x="331" y="330" font-family="monospace" font-size="13" fill="#334155">schema:</text>
  <text x="347" y="350" font-family="monospace" font-size="13" fill="#334155">type: array</text>
  <text x="347" y="370" font-family="monospace" font-size="13" fill="#334155">items:</text>
  <text x="363" y="390" font-family="monospace" font-size="13" fill="#2563eb">$ref: ".../Order"</text>

  <rect x="590" y="280" width="230" height="130" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="705" y="306" font-family="monospace" font-size="13" font-weight="bold" fill="#f59e0b" text-anchor="middle">webhook payload</text>
  <text x="606" y="330" font-family="monospace" font-size="13" fill="#334155">order.created:</text>
  <text x="622" y="350" font-family="monospace" font-size="13" fill="#334155">data:</text>
  <text x="638" y="370" font-family="monospace" font-size="13" fill="#334155">schema:</text>
  <text x="654" y="390" font-family="monospace" font-size="13" fill="#2563eb">$ref: ".../Order"</text>

  <!-- arrows from definition to each ref -->
  <line x1="350" y1="210" x2="170" y2="278" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="210" x2="430" y2="278" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="210" x2="690" y2="278" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="430" y="448" font-family="Segoe UI" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="bold">Order maydonini o'zgartirsangiz — uchala joy birdaniga yangilanadi</text>
  <text x="430" y="472" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">Nusxa-ko'chirish yo'q -> izchillik kafolatlanadi, drift (mos kelmaslik) yo'qoladi</text>
</svg>
