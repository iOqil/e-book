<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540">
  <title>Asinxron so'rov-javob naqshi: server 202 Accepted va status URL qaytaradi, mijoz polling yoki webhook orqali tugallangan natijani oladi</title>
  <rect x="0" y="0" width="880" height="540" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b">Uzoq ish — asinxron so'rov-javob (202 Accepted)</text>
  <text x="440" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Ish darrov tugamaydi: server operatsiya resursini ochadi, mijoz natijani keyin oladi</text>

  <!-- ustun sarlavhalari -->
  <text x="160" y="92" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">Mijoz</text>
  <text x="640" y="92" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">Server (API)</text>

  <!-- hayot chiziqlari -->
  <line x1="160" y1="104" x2="160" y2="500" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="640" y1="104" x2="640" y2="500" stroke="#cbd5e1" stroke-width="2"/>

  <!-- 1) so'rov -->
  <rect x="40" y="118" width="240" height="36" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="54" y="141" font-family="monospace" font-size="13" fill="#1e3a8a">POST /v1/reports  (og'ir ish)</text>
  <line x1="160" y1="166" x2="635" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#aB)"/>
  <text x="400" y="160" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">1) ishni boshlash so'rovi</text>

  <!-- 2) 202 javob -->
  <rect x="370" y="180" width="270" height="54" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="384" y="201" font-family="monospace" font-size="13" fill="#166534">202 Accepted</text>
  <text x="384" y="221" font-family="monospace" font-size="13" fill="#166534">Location: /v1/jobs/abc</text>
  <line x1="635" y1="250" x2="165" y2="250" stroke="#16a34a" stroke-width="2" marker-end="url(#aG)"/>
  <text x="400" y="244" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">2) "qabul qildim" + status URL</text>

  <!-- polling -->
  <text x="160" y="282" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#f59e0b">A yo'l: POLLING (mijoz so'rab turadi)</text>
  <line x1="160" y1="296" x2="635" y2="296" stroke="#f59e0b" stroke-width="2" marker-end="url(#aA)"/>
  <text x="400" y="290" text-anchor="middle" font-family="monospace" font-size="13" fill="#b45309">GET /v1/jobs/abc</text>
  <rect x="370" y="308" width="270" height="34" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="505" y="330" text-anchor="middle" font-family="monospace" font-size="13" fill="#b45309">200 {"status":"pending"}</text>
  <line x1="635" y1="356" x2="165" y2="356" stroke="#f59e0b" stroke-width="2" marker-end="url(#aA)"/>
  <text x="400" y="350" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#b45309">hali tayyor emas -> biroz kutib qayta so'ra</text>
  <line x1="160" y1="384" x2="635" y2="384" stroke="#f59e0b" stroke-width="2" marker-end="url(#aA)"/>
  <text x="400" y="378" text-anchor="middle" font-family="monospace" font-size="13" fill="#b45309">GET /v1/jobs/abc  (qayta)</text>
  <rect x="370" y="396" width="270" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="505" y="418" text-anchor="middle" font-family="monospace" font-size="13" fill="#166534">200 {"status":"done", result_url}</text>

  <!-- webhook alternativ -->
  <line x1="40" y1="446" x2="840" y2="446" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="160" y="470" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">B yo'l: WEBHOOK</text>
  <line x1="635" y1="486" x2="165" y2="486" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#aP)"/>
  <text x="400" y="480" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#7c3aed">tugagach server O'ZI POST qiladi (so'rab turish shart emas)</text>

  <defs>
    <marker id="aB" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto"><path d="M0,0 L7,3.4 L0,6.8 Z" fill="#2563eb"/></marker>
    <marker id="aG" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto"><path d="M0,0 L7,3.4 L0,6.8 Z" fill="#16a34a"/></marker>
    <marker id="aA" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto"><path d="M0,0 L7,3.4 L0,6.8 Z" fill="#f59e0b"/></marker>
    <marker id="aP" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto"><path d="M0,0 L7,3.4 L0,6.8 Z" fill="#7c3aed"/></marker>
  </defs>
</svg>
