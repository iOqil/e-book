<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540">
  <title>Stateless va stateful: so'rovning o'zini-o'zi yetarliligi</title>
  <rect x="0" y="0" width="880" height="540" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b">Stateless vs Stateful</text>
  <text x="440" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Holat qayerda saqlanadi — bu masshtablashning kalitini belgilaydi</text>

  <!-- STATELESS side -->
  <rect x="30" y="86" width="400" height="420" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="230" y="116" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">Stateless (REST)</text>
  <text x="230" y="138" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Har so'rov o'zini-o'zi yetarli</text>

  <rect x="56" y="162" width="120" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="116" y="192" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#15803d">Mijoz</text>

  <text x="300" y="170" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Server (xotirasiz)</text>
  <rect x="246" y="178" width="108" height="34" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="300" y="200" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#15803d">Server A</text>
  <rect x="246" y="222" width="108" height="34" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="300" y="244" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#15803d">Server B</text>

  <line x1="176" y1="200" x2="244" y2="195" stroke="#16a34a" stroke-width="1.8"/>
  <polygon points="244,195 232,193 233,201" fill="#16a34a"/>
  <line x1="176" y1="240" x2="244" y2="239" stroke="#16a34a" stroke-width="1.8"/>
  <polygon points="244,239 232,235 232,243" fill="#16a34a"/>

  <text x="58" y="296" font-family="monospace" font-size="13" fill="#334155">So'rov 1 -> Server A:</text>
  <text x="58" y="318" font-family="monospace" font-size="13" fill="#15803d">  Authorization: Bearer t</text>
  <text x="58" y="338" font-family="monospace" font-size="13" fill="#15803d">  + kerakli kontekst</text>
  <text x="58" y="368" font-family="monospace" font-size="13" fill="#334155">So'rov 2 -> Server B:</text>
  <text x="58" y="390" font-family="monospace" font-size="13" fill="#15803d">  Authorization: Bearer t</text>
  <text x="58" y="410" font-family="monospace" font-size="13" fill="#15803d">  + kerakli kontekst</text>
  <text x="58" y="446" font-family="Segoe UI" font-size="13" fill="#16a34a">Har server har so'rovni ko'taradi.</text>
  <text x="58" y="466" font-family="Segoe UI" font-size="13" fill="#16a34a">Oson masshtablash, ishonchli.</text>
  <text x="58" y="488" font-family="Segoe UI" font-size="13" fill="#64748b">Narx: har so'rovda ko'proq ma'lumot.</text>

  <!-- STATEFUL side -->
  <rect x="450" y="86" width="400" height="420" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="650" y="116" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">Stateful (sessiya)</text>
  <text x="650" y="138" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Holat server xotirasida saqlanadi</text>

  <rect x="476" y="162" width="120" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="536" y="192" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#b91c1c">Mijoz</text>

  <rect x="666" y="178" width="108" height="34" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="720" y="200" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#b91c1c">Server A</text>
  <text x="720" y="232" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#b91c1c">sessiya={user, savat}</text>

  <line x1="596" y1="195" x2="664" y2="195" stroke="#dc2626" stroke-width="1.8"/>
  <polygon points="664,195 652,191 652,199" fill="#dc2626"/>

  <text x="478" y="296" font-family="monospace" font-size="13" fill="#334155">So'rov 1 -> Server A:</text>
  <text x="478" y="318" font-family="monospace" font-size="13" fill="#b91c1c">  Cookie: SESSIONID=abc</text>
  <text x="478" y="338" font-family="Segoe UI" font-size="13" fill="#64748b">  (kontekst A xotirasida)</text>
  <text x="478" y="368" font-family="monospace" font-size="13" fill="#334155">So'rov 2 -> Server B?</text>
  <text x="478" y="390" font-family="monospace" font-size="13" fill="#b91c1c">  Cookie: SESSIONID=abc</text>
  <text x="478" y="410" font-family="Segoe UI" font-size="13" fill="#dc2626">  B sessiyani bilmaydi -> xato</text>
  <text x="478" y="446" font-family="Segoe UI" font-size="13" fill="#dc2626">Sticky session yoki umumiy</text>
  <text x="478" y="466" font-family="Segoe UI" font-size="13" fill="#dc2626">xotira (Redis) kerak bo'ladi.</text>
  <text x="478" y="488" font-family="Segoe UI" font-size="13" fill="#64748b">Masshtablash murakkablashadi.</text>
</svg>
