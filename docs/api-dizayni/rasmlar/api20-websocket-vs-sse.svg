<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540">
  <title>WebSocket vs SSE vs polling: ulanish yo'nalishi va xulqi yonma-yon</title>
  <rect x="0" y="0" width="920" height="540" fill="#f8fafc"/>
  <text x="460" y="34" text-anchor="middle" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b">Real-time uchun uch yondashuv</text>
  <text x="460" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Mijoz (chap) ↔ Server (o'ng): kim kimga, qachon ma'lumot yuboradi</text>

  <!-- POLLING -->
  <rect x="24" y="84" width="280" height="420" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="164" y="112" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#b45309">POLLING</text>
  <text x="164" y="132" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Mijoz qayta-qayta so'raydi</text>
  <text x="64" y="160" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#334155">Mijoz</text>
  <text x="244" y="160" text-anchor="end" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#334155">Server</text>
  <line x1="72" y1="172" x2="72" y2="488" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="256" y1="172" x2="256" y2="488" stroke="#cbd5e1" stroke-width="2"/>
  <!-- request/response pairs -->
  <line x1="72" y1="190" x2="256" y2="190" stroke="#2563eb" stroke-width="2" marker-end="url(#arrA)"/>
  <text x="164" y="184" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">GET ?</text>
  <line x1="256" y1="214" x2="72" y2="214" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrA)"/>
  <text x="164" y="230" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#94a3b8">bo'sh</text>
  <line x1="72" y1="262" x2="256" y2="262" stroke="#2563eb" stroke-width="2" marker-end="url(#arrA)"/>
  <text x="164" y="256" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">GET ?</text>
  <line x1="256" y1="286" x2="72" y2="286" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrA)"/>
  <text x="164" y="302" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#94a3b8">bo'sh</text>
  <line x1="72" y1="334" x2="256" y2="334" stroke="#2563eb" stroke-width="2" marker-end="url(#arrA)"/>
  <text x="164" y="328" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">GET ?</text>
  <line x1="256" y1="358" x2="72" y2="358" stroke="#16a34a" stroke-width="2" marker-end="url(#arrA)"/>
  <text x="164" y="374" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">DATA!</text>
  <rect x="40" y="404" width="248" height="84" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="164" y="426" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#b45309">Yo'nalish: 1 tomon</text>
  <text x="164" y="446" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Behuda so'rovlar, kechikish</text>
  <text x="164" y="466" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Oddiy, hech narsa kerakmas</text>

  <!-- SSE -->
  <rect x="320" y="84" width="280" height="420" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="460" y="112" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#6d28d9">SSE (Server-Sent Events)</text>
  <text x="460" y="132" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Server -> mijoz, bir tomonlama oqim</text>
  <text x="360" y="160" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#334155">Mijoz</text>
  <text x="540" y="160" text-anchor="end" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#334155">Server</text>
  <line x1="368" y1="172" x2="368" y2="488" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="552" y1="172" x2="552" y2="488" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="368" y1="192" x2="552" y2="192" stroke="#2563eb" stroke-width="2" marker-end="url(#arrA)"/>
  <text x="460" y="186" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">GET (1 marta)</text>
  <line x1="552" y1="232" x2="368" y2="232" stroke="#16a34a" stroke-width="2" marker-end="url(#arrA)"/>
  <text x="460" y="226" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">event</text>
  <line x1="552" y1="272" x2="368" y2="272" stroke="#16a34a" stroke-width="2" marker-end="url(#arrA)"/>
  <text x="460" y="266" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">event</text>
  <line x1="552" y1="312" x2="368" y2="312" stroke="#16a34a" stroke-width="2" marker-end="url(#arrA)"/>
  <text x="460" y="306" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">event</text>
  <text x="460" y="350" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">...ochiq oqim davom etadi...</text>
  <rect x="336" y="404" width="248" height="84" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="460" y="426" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#6d28d9">Yo'nalish: server -> mijoz</text>
  <text x="460" y="446" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">HTTP ustida, avto qayta-ulanish</text>
  <text x="460" y="466" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Bildirishnoma, feed, narx</text>

  <!-- WEBSOCKET -->
  <rect x="616" y="84" width="280" height="420" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="756" y="112" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1d4ed8">WEBSOCKET</text>
  <text x="756" y="132" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">To'liq ikki tomonlama, doimiy</text>
  <text x="656" y="160" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#334155">Mijoz</text>
  <text x="836" y="160" text-anchor="end" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#334155">Server</text>
  <line x1="664" y1="172" x2="664" y2="488" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="848" y1="172" x2="848" y2="488" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="664" y1="192" x2="848" y2="192" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrA)"/>
  <text x="756" y="186" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#b45309">Upgrade -> ws</text>
  <line x1="664" y1="236" x2="848" y2="236" stroke="#2563eb" stroke-width="2" marker-end="url(#arrA)"/>
  <text x="756" y="230" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">xabar</text>
  <line x1="848" y1="276" x2="664" y2="276" stroke="#16a34a" stroke-width="2" marker-end="url(#arrA)"/>
  <text x="756" y="270" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">xabar</text>
  <line x1="664" y1="316" x2="848" y2="316" stroke="#2563eb" stroke-width="2" marker-end="url(#arrA)"/>
  <text x="756" y="310" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">xabar</text>
  <text x="756" y="354" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">...ikki yo'nalish ham ochiq...</text>
  <rect x="632" y="404" width="248" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="756" y="426" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#1d4ed8">Yo'nalish: 2 tomon</text>
  <text x="756" y="446" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Past kechikish, alohida protokol</text>
  <text x="756" y="466" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Chat, o'yin, kollaboratsiya</text>

  <defs>
    <marker id="arrA" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
