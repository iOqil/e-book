<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500">
  <title>OpenAPI spec dan mock server: mijoz real backend tayyor bo'lmasdan ham ishlaydi</title>
  <rect x="0" y="0" width="880" height="500" fill="#f8fafc"/>
  <text x="440" y="36" text-anchor="middle" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b">OpenAPI spec dan mock server</text>
  <text x="440" y="60" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Design-first: shartnoma tayyor, backend hali yo'q -> mijoz baribir ishlaydi</text>

  <!-- OpenAPI spec -->
  <rect x="50" y="110" width="200" height="110" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="150" y="138" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#5b21b6">OpenAPI spec</text>
  <text x="150" y="160" text-anchor="middle" font-family="monospace" font-size="13" fill="#5b21b6">openapi.yaml</text>
  <text x="150" y="182" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#5b21b6">yo'llar + sxema</text>
  <text x="150" y="202" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#5b21b6">+ misol javoblar</text>

  <!-- strelka spec -> mock -->
  <line x1="250" y1="165" x2="335" y2="165" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrP3)"/>
  <text x="292" y="155" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#7c3aed">generatsiya</text>

  <!-- Mock server -->
  <rect x="340" y="110" width="200" height="110" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="440" y="138" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#b45309">Mock server</text>
  <text x="440" y="162" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#b45309">spec asosida</text>
  <text x="440" y="182" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#b45309">misol javob qaytaradi</text>
  <text x="440" y="202" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#b45309">(haqiqiy DB yo'q)</text>

  <!-- Real backend (kelajakda) -->
  <rect x="630" y="110" width="200" height="110" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="730" y="138" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#166534">Real backend</text>
  <text x="730" y="162" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">hali QURILMOQDA</text>
  <text x="730" y="182" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">tayyor bo'lgach,</text>
  <text x="730" y="202" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">mock o'rnini bosadi</text>

  <!-- frontend mijoz -->
  <rect x="50" y="290" width="200" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="320" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e3a8a">Frontend / mijoz</text>
  <text x="150" y="344" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e3a8a">backendni kutmaydi,</text>
  <text x="150" y="364" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e3a8a">parallel ishlaydi</text>

  <!-- mijoz -> mock so'rov -->
  <path d="M 200 290 Q 290 250 410 220" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrB3)"/>
  <text x="300" y="248" text-anchor="middle" font-family="monospace" font-size="13" fill="#2563eb">GET /users/7</text>
  <!-- mock -> mijoz javob -->
  <path d="M 410 220 Q 270 285 230 290" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrA3)"/>
  <text x="330" y="300" text-anchor="middle" font-family="monospace" font-size="13" fill="#b45309">200 + misol JSON</text>

  <!-- foyda paneli -->
  <rect x="320" y="290" width="510" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="340" y="316" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Nega foydali</text>
  <text x="340" y="340" font-family="Segoe UI" font-size="13" fill="#334155">+ Frontend va backend jamoalari bir vaqtda ishlaydi (parallel)</text>
  <text x="340" y="362" font-family="Segoe UI" font-size="13" fill="#334155">+ Tashqi API'ni mock qilib, xato/kechikishni ham simulyatsiya qilish mumkin</text>
  <text x="340" y="384" font-family="Segoe UI" font-size="13" fill="#334155">+ Shartnoma (spec) mock va real backend uchun yagona haqiqat manbai</text>
  <text x="340" y="404" font-family="Segoe UI" font-size="13" fill="#64748b">Diqqat: mock real mantiqni isbotlamaydi -> contract test bilan birga ishlat</text>

  <defs>
    <marker id="arrP3" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#7c3aed"/></marker>
    <marker id="arrB3" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#2563eb"/></marker>
    <marker id="arrA3" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#f59e0b"/></marker>
  </defs>
</svg>
