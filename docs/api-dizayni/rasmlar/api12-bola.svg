<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540">
  <title>BOLA: foydalanuvchi /orders/42 so'raydi, server egalikni tekshirishi shart</title>
  <rect x="0" y="0" width="880" height="540" fill="#f8fafc"/>
  <text x="440" y="36" text-anchor="middle" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b">BOLA — obyekt darajasidagi avtorizatsiyaning buzilishi</text>
  <text x="440" y="60" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">"42-buyurtma aynan shu foydalanuvchinikimi?" degan tekshiruv yo'qolsa</text>

  <defs>
    <marker id="a12c" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- actor -->
  <rect x="30" y="120" width="160" height="90" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="148" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">Ali (user_id=7)</text>
  <text x="110" y="172" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">tokeni to'g'ri,</text>
  <text x="110" y="192" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">autentifikatsiya OK</text>

  <text x="110" y="244" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">GET /orders/42</text>
  <text x="110" y="264" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">(42 — Vali'niki!)</text>
  <line x1="190" y1="240" x2="300" y2="240" stroke="#64748b" stroke-width="2" marker-end="url(#a12c)"/>

  <!-- server decision -->
  <rect x="305" y="150" width="270" height="180" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="440" y="180" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">Server tekshiruvi</text>
  <text x="440" y="206" text-anchor="middle" font-family="monospace" font-size="13" fill="#334155">order = db.find(42)</text>
  <text x="440" y="234" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">order.owner_id == 7 ?</text>
  <text x="440" y="262" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">ya'ni 42 Ali'nikimi?</text>
  <text x="440" y="292" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626" font-weight="bold">Bu satr yo'qolsa = BOLA</text>
  <text x="440" y="312" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">(OWASP API1, eng keng tarqalgan)</text>

  <!-- WRONG path -->
  <line x1="575" y1="200" x2="690" y2="160" stroke="#dc2626" stroke-width="2" marker-end="url(#a12c)"/>
  <text x="635" y="170" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626" font-weight="bold">tekshirmasa</text>
  <rect x="640" y="118" width="220" height="110" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="750" y="146" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">Zaiflik</text>
  <text x="750" y="170" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">200 OK + Vali'ning</text>
  <text x="750" y="190" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">buyurtmasi qaytadi.</text>
  <text x="750" y="212" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">ID ni almashtirib boshqaning</text>

  <!-- RIGHT path -->
  <line x1="575" y1="280" x2="690" y2="320" stroke="#16a34a" stroke-width="2" marker-end="url(#a12c)"/>
  <text x="635" y="318" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a" font-weight="bold">tekshirsa</text>
  <rect x="640" y="300" width="220" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="750" y="328" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">To'g'ri</text>
  <text x="750" y="352" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">owner_id != 7 -&gt; 404</text>
  <text x="750" y="372" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">(yoki 403; mavjudlik</text>
  <text x="750" y="392" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">yashirilsa 404 afzal)</text>

  <!-- bottom rule -->
  <rect x="60" y="440" width="760" height="80" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="440" y="468" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#b45309">Oltin qoida</text>
  <text x="440" y="494" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">URL'dagi ID — foydalanuvchi nazoratidagi kirish. Har so'rovda obyekt egaligini SERVER tekshiradi,</text>
  <text x="440" y="514" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">hech qachon "ID ni topa olsa demak haqli" deb ishonmaydi. "Topish" = "ruxsat" EMAS.</text>
</svg>
