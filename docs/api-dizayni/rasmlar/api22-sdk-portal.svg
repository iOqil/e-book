<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520">
  <title>Developer portal: hammasi bitta joyda</title>
  <rect x="0" y="0" width="880" height="520" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b">Developer portal</text>
  <text x="440" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">dasturchining barcha ehtiyoji bitta uy ostida</text>

  <!-- central portal box -->
  <rect x="320" y="222" width="240" height="76" rx="12" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <text x="440" y="252" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#ffffff">Developer portal</text>
  <text x="440" y="276" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dbeafe">developers.example.com</text>

  <!-- 6 satellites -->
  <!-- top-left: hujjat -->
  <rect x="60" y="92" width="220" height="78" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="78" y="120" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">Hujjat + reference</text>
  <text x="78" y="142" font-family="Segoe UI" font-size="13" fill="#334155">quickstart, qo'llanmalar,</text>
  <text x="78" y="160" font-family="Segoe UI" font-size="13" fill="#334155">endpoint ma'lumotnoma.</text>

  <!-- top-right: kalit -->
  <rect x="600" y="92" width="220" height="78" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="618" y="120" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">API kalit boshqaruvi</text>
  <text x="618" y="142" font-family="Segoe UI" font-size="13" fill="#334155">kalit yaratish, aylantirish,</text>
  <text x="618" y="160" font-family="Segoe UI" font-size="13" fill="#334155">sandbox va live muhit.</text>

  <!-- mid-left: try-it -->
  <rect x="40" y="232" width="220" height="78" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="58" y="260" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">Interaktiv sinov</text>
  <text x="58" y="282" font-family="Segoe UI" font-size="13" fill="#334155">"try it" — brauzerda real</text>
  <text x="58" y="300" font-family="Segoe UI" font-size="13" fill="#334155">so'rov yuborib javob ko'rish.</text>

  <!-- mid-right: SDK -->
  <rect x="620" y="232" width="220" height="78" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="638" y="260" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#f59e0b">SDK / kutubxonalar</text>
  <text x="638" y="282" font-family="Segoe UI" font-size="13" fill="#334155">rasmiy mijoz kutubxonalar,</text>
  <text x="638" y="300" font-family="Segoe UI" font-size="13" fill="#334155">Postman to'plami.</text>

  <!-- bottom-left: status -->
  <rect x="60" y="370" width="220" height="78" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="78" y="398" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">Status + changelog</text>
  <text x="78" y="420" font-family="Segoe UI" font-size="13" fill="#334155">uptime, hodisalar, nima</text>
  <text x="78" y="438" font-family="Segoe UI" font-size="13" fill="#334155">o'zgardi, deprecation.</text>

  <!-- bottom-right: support -->
  <rect x="600" y="370" width="220" height="78" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="618" y="398" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">Onboarding + yordam</text>
  <text x="618" y="420" font-family="Segoe UI" font-size="13" fill="#334155">misol loyiha, forum,</text>
  <text x="618" y="438" font-family="Segoe UI" font-size="13" fill="#334155">qo'llab-quvvatlash.</text>

  <!-- connectors -->
  <g stroke="#94a3b8" stroke-width="1.8">
    <line x1="280" y1="131" x2="332" y2="224"/>
    <line x1="600" y1="131" x2="548" y2="224"/>
    <line x1="260" y1="271" x2="320" y2="262"/>
    <line x1="620" y1="271" x2="560" y2="262"/>
    <line x1="280" y1="395" x2="334" y2="296"/>
    <line x1="600" y1="395" x2="546" y2="296"/>
  </g>

  <!-- bottom note -->
  <rect x="40" y="468" width="800" height="40" rx="8" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="493" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Hammasi bitta joyda = qidirish ishqalanishi yo'q = qisqa time-to-first-call</text>
</svg>
