<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470">
  <title>Dasturchi sayohati: kashf etishdan production'gacha</title>
  <rect x="0" y="0" width="900" height="470" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b">Dasturchi sayohati (DX funneli)</text>
  <text x="450" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">har qadamda ishqalanish (friction) dasturchini yo'qotadi</text>

  <!-- 5 steps as connected boxes -->
  <!-- Step 1 -->
  <rect x="30" y="92" width="150" height="86" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="105" y="120" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">1. Kashf etish</text>
  <text x="105" y="142" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">"bu API menga</text>
  <text x="105" y="160" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">mosmi?"</text>

  <!-- Step 2 -->
  <rect x="208" y="92" width="150" height="86" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="283" y="120" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">2. Ro'yxat / kalit</text>
  <text x="283" y="142" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">akkaunt + API</text>
  <text x="283" y="160" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">kalit olish</text>

  <!-- Step 3 highlighted -->
  <rect x="386" y="92" width="150" height="86" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <text x="461" y="118" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">3. Birinchi</text>
  <text x="461" y="136" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">chaqiruv</text>
  <text x="461" y="160" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">time-to-first-call</text>

  <!-- Step 4 -->
  <rect x="564" y="92" width="150" height="86" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="639" y="120" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">4. Integratsiya</text>
  <text x="639" y="142" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">SDK, xato,</text>
  <text x="639" y="160" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">pagination</text>

  <!-- Step 5 -->
  <rect x="742" y="92" width="150" height="86" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="817" y="120" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">5. Production</text>
  <text x="817" y="142" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">limit, monitoring,</text>
  <text x="817" y="160" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">jonli ishga tushish</text>

  <!-- arrows -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
  </defs>
  <line x1="180" y1="135" x2="206" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="358" y1="135" x2="384" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="536" y1="135" x2="562" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="714" y1="135" x2="740" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- friction lane -->
  <text x="30" y="218" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">Har qadamdagi ishqalanish (dasturchi shu yerda ketadi):</text>
  <rect x="30" y="232" width="280" height="58" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="44" y="256" font-family="Segoe UI" font-size="13" fill="#334155">Tushunarsiz hujjat, narx noaniq,</text>
  <text x="44" y="276" font-family="Segoe UI" font-size="13" fill="#334155">"nima qiladi" 1 daqiqada tushunmas.</text>

  <rect x="324" y="232" width="262" height="58" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="338" y="256" font-family="Segoe UI" font-size="13" fill="#334155">Murakkab ro'yxat, kredit-karta</text>
  <text x="338" y="276" font-family="Segoe UI" font-size="13" fill="#334155">talab, sandbox kaliti yo'q.</text>

  <rect x="600" y="232" width="292" height="58" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="614" y="256" font-family="Segoe UI" font-size="13" fill="#334155">Quickstart yo'q, misol ishlamaydi,</text>
  <text x="614" y="276" font-family="Segoe UI" font-size="13" fill="#334155">xato xabari sababini aytmaydi.</text>

  <!-- metric callout -->
  <rect x="30" y="312" width="862" height="62" rx="10" fill="#eef2ff" stroke="#2563eb" stroke-width="2"/>
  <text x="461" y="338" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">Asosiy DX metrikasi: TTFC — Time To First (successful) Call</text>
  <text x="461" y="360" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">kashf etishdan birinchi 2xx javobgacha o'tgan vaqt — qancha kichik, shuncha yaxshi DX</text>

  <rect x="30" y="390" width="862" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="461" y="414" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">Maqsad: kashf etishdan birinchi muvaffaqiyatli chaqiruvgacha 5 daqiqa</text>
  <text x="461" y="434" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">yaxshi quickstart + sandbox kaliti + nusxalanadigan curl misoli = qisqa TTFC</text>
</svg>
