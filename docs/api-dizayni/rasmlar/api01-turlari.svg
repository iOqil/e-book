<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520">
  <title>API turlari va kirish darajalari</title>
  <rect x="0" y="0" width="880" height="520" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b">API turlari va kirish darajasi</text>

  <!-- Three types row -->
  <text x="440" y="68" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#64748b">1) Texnik tur — API qayerda yashaydi</text>

  <rect x="40" y="84" width="250" height="150" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="165" y="112" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">Web / HTTP API</text>
  <text x="165" y="138" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Tarmoq orqali, HTTP bilan</text>
  <text x="165" y="160" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">REST, GraphQL, gRPC</text>
  <text x="165" y="186" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">GET /v1/users</text>
  <text x="165" y="214" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#7c3aed">Bu kitobning mavzusi</text>

  <rect x="315" y="84" width="250" height="150" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="440" y="112" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">Kutubxona / SDK API</text>
  <text x="440" y="138" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Bir jarayon ichida, funksiya</text>
  <text x="440" y="160" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">va sinflar chaqiruvi</text>
  <text x="440" y="186" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">array.sort()</text>
  <text x="440" y="214" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">tarmoq yo'q</text>

  <rect x="590" y="84" width="250" height="150" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="715" y="112" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#f59e0b">OS / tizim API</text>
  <text x="715" y="138" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Operatsion tizim xizmati</text>
  <text x="715" y="160" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">fayl, tarmoq, xotira</text>
  <text x="715" y="186" text-anchor="middle" font-family="monospace" font-size="13" fill="#16a34a">open(), read()</text>
  <text x="715" y="214" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">system call</text>

  <!-- Access level row -->
  <text x="440" y="282" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#64748b">2) Kirish darajasi — kimga ochiq</text>

  <rect x="40" y="298" width="250" height="170" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="165" y="326" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">Public (ochiq)</text>
  <text x="165" y="354" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Har qanday dasturchi</text>
  <text x="165" y="376" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">ro'yxatdan o'tib ishlatadi</text>
  <text x="165" y="404" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Misol: Stripe, GitHub</text>
  <text x="165" y="432" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">Eng qat'iy barqarorlik</text>
  <text x="165" y="454" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">va hujjat talab qiladi</text>

  <rect x="315" y="298" width="250" height="170" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="440" y="326" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#f59e0b">Partner (hamkor)</text>
  <text x="440" y="354" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Faqat tanlangan hamkorlar</text>
  <text x="440" y="376" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">shartnoma asosida</text>
  <text x="440" y="404" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Misol: to'lov integratsiyasi</text>
  <text x="440" y="432" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">cheklangan, nazorat ostida</text>

  <rect x="590" y="298" width="250" height="170" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="715" y="326" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">Private / internal</text>
  <text x="715" y="354" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Faqat o'z jamoangiz</text>
  <text x="715" y="376" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">ichki servislar orasida</text>
  <text x="715" y="404" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Misol: mikroservis aloqasi</text>
  <text x="715" y="432" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">tezroq o'zgartirish mumkin</text>
  <text x="715" y="454" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">(lekin baribir shartnoma)</text>

  <text x="440" y="500" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Tashqiroq auditoriya = barqarorlik va hujjatga talab kuchliroq</text>
</svg>
