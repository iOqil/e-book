<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470">
  <title>Webhook oqimi: provayderda hodisa yuz beradi va u mijozning ro'yxatdan o'tgan URL ga POST yuboradi (teskari API)</title>
  <rect x="0" y="0" width="880" height="470" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b">Webhook — "bizni chaqirmang, biz sizni chaqiramiz"</text>
  <text x="440" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Hodisa yuz berganda provayder mijozning oldindan ro'yxatdan o'tgan URL ga HTTP POST qiladi</text>

  <!-- ustun sarlavhalari -->
  <text x="200" y="96" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">Provayder (API)</text>
  <text x="680" y="96" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">Mijoz (webhook qabul qiluvchi)</text>

  <!-- hayot chiziqlari -->
  <line x1="200" y1="108" x2="200" y2="430" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="680" y1="108" x2="680" y2="430" stroke="#cbd5e1" stroke-width="2"/>

  <!-- 0) ro'yxatdan o'tish -->
  <rect x="500" y="124" width="350" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="514" y="148" font-family="monospace" font-size="13" fill="#1e3a8a">URL ro'yxatdan o'tkaziladi: https://shop.uz/hooks</text>
  <line x1="680" y1="172" x2="205" y2="172" stroke="#2563eb" stroke-width="2" marker-end="url(#arB)"/>
  <text x="440" y="166" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">0) "shu URL ga xabar ber" (bir marta sozlash)</text>

  <!-- hodisa yuz beradi -->
  <rect x="80" y="196" width="240" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="200" y="220" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">HODISA: to'lov tasdiqlandi</text>

  <!-- provayder POST yuboradi -->
  <rect x="30" y="256" width="330" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="44" y="280" font-family="monospace" font-size="13" fill="#166534">POST /hooks  {event: "payment.succeeded"}</text>
  <line x1="200" y1="304" x2="675" y2="304" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arG)"/>
  <text x="440" y="298" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">1) hodisa payload'i POST bilan yuboriladi</text>

  <!-- mijoz qabul qiladi -->
  <rect x="540" y="320" width="300" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="554" y="344" font-family="Segoe UI" font-size="13" fill="#1e3a8a">Mijoz: buyurtmani "to'langan" deb belgilaydi</text>

  <!-- 2xx javob -->
  <line x1="675" y1="392" x2="205" y2="392" stroke="#7c3aed" stroke-width="2" marker-end="url(#arP)"/>
  <text x="440" y="386" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#7c3aed">2) tezda 200 OK — "qabul qildim" (ishni navbatga qo'yib)</text>

  <text x="440" y="424" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Polling yo'q: mijoz so'ramaydi, provayder o'zi xabar beradi -> kam yuk, real-vaqtroq</text>

  <defs>
    <marker id="arB" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto"><path d="M0,0 L7,3.4 L0,6.8 Z" fill="#2563eb"/></marker>
    <marker id="arG" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto"><path d="M0,0 L7,3.4 L0,6.8 Z" fill="#16a34a"/></marker>
    <marker id="arP" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto"><path d="M0,0 L7,3.4 L0,6.8 Z" fill="#7c3aed"/></marker>
  </defs>
</svg>
