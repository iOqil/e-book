<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560">
  <title>ETag validatsiya: GET ETag oladi, keyingi GET If-None-Match yuboradi, server 304 qaytaradi</title>
  <rect x="0" y="0" width="880" height="560" fill="#f8fafc"/>
  <text x="440" y="36" text-anchor="middle" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b">ETag bilan validatsiya (304 Not Modified)</text>
  <text x="440" y="60" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Muddat tugagach, kesh o'zgardimi deb tekshiradi — body qayta yuborilmaydi</text>

  <!-- aktorlar -->
  <rect x="80" y="86" width="200" height="44" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="114" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">Kesh / Mijoz</text>
  <rect x="600" y="86" width="200" height="44" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="700" y="114" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">Server (origin)</text>

  <!-- life lines -->
  <line x1="180" y1="130" x2="180" y2="512" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="700" y1="130" x2="700" y2="512" stroke="#cbd5e1" stroke-width="2"/>

  <!-- 1: birinchi GET -->
  <text x="440" y="160" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">1) Birinchi so'rov</text>
  <line x1="180" y1="184" x2="700" y2="184" stroke="#2563eb" stroke-width="2"/>
  <polygon points="700,184 688,179 688,189" fill="#2563eb"/>
  <text x="440" y="178" text-anchor="middle" font-family="monospace" font-size="14" fill="#2563eb">GET /v1/products/42</text>

  <line x1="700" y1="218" x2="180" y2="218" stroke="#16a34a" stroke-width="2"/>
  <polygon points="180,218 192,213 192,223" fill="#16a34a"/>
  <text x="440" y="212" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">200 OK + body</text>
  <text x="440" y="236" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">ETag: "v3-9f2a"</text>

  <rect x="60" y="252" width="240" height="34" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="180" y="274" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e3a8a">Kesh body + ETag'ni saqlaydi</text>

  <!-- 2: keyingi GET validatsiya -->
  <text x="440" y="318" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">2) Keyingi so'rov (muddat tugagach)</text>
  <line x1="180" y1="340" x2="700" y2="340" stroke="#2563eb" stroke-width="2"/>
  <polygon points="700,340 688,335 688,345" fill="#2563eb"/>
  <text x="440" y="334" text-anchor="middle" font-family="monospace" font-size="14" fill="#2563eb">GET ... If-None-Match: "v3-9f2a"</text>

  <rect x="558" y="356" width="284" height="34" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="700" y="378" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#15803d">Server: ETag bir xilmi? Ha = o'zgarmagan</text>

  <line x1="700" y1="416" x2="180" y2="416" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="180,416 192,411 192,421" fill="#16a34a"/>
  <text x="440" y="410" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#16a34a">304 Not Modified</text>
  <text x="440" y="434" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">(BODY YO'Q — faqat sarlavhalar)</text>

  <rect x="40" y="452" width="280" height="34" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="180" y="474" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e3a8a">Kesh saqlangan body'ni ishlatadi</text>

  <!-- foyda -->
  <rect x="360" y="452" width="480" height="80" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="600" y="478" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">Tejash</text>
  <text x="600" y="500" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">304 = tana qayta yuborilmaydi, tarmoq tejaladi.</text>
  <text x="600" y="520" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Last-Modified + If-Modified-Since — zaifroq muqobil.</text>
</svg>
