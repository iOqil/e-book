<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520">
  <title>Distributed tracing: bitta so'rov bir nechta servis bo'ylab o'tadi, hammasi bitta trace ID bilan bog'langan span'larga ajraladi va vaqt o'qida ko'rsatiladi</title>
  <rect x="0" y="0" width="880" height="520" fill="#f8fafc"/>
  <text x="440" y="36" text-anchor="middle" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b">Distributed tracing — bitta so'rovning yo'li</text>
  <text x="440" y="60" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">trace_id = T-9f3a — barcha span shu ID bilan bog'lanadi; gantt ko'rinishi qaysi qadam sekinligini ochadi</text>

  <!-- oqim: servislar -->
  <text x="440" y="96" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#334155">So'rov servislar bo'ylab oqadi</text>
  <g font-family="Segoe UI" font-size="14" fill="#ffffff">
    <rect x="40" y="112" width="120" height="46" rx="8" fill="#2563eb"/>
    <text x="100" y="140" text-anchor="middle">Mijoz</text>
    <rect x="210" y="112" width="120" height="46" rx="8" fill="#7c3aed"/>
    <text x="270" y="140" text-anchor="middle">API gateway</text>
    <rect x="380" y="112" width="120" height="46" rx="8" fill="#7c3aed"/>
    <text x="440" y="140" text-anchor="middle">auth servis</text>
    <rect x="550" y="112" width="120" height="46" rx="8" fill="#7c3aed"/>
    <text x="610" y="140" text-anchor="middle">orders servis</text>
    <rect x="720" y="112" width="120" height="46" rx="8" fill="#dc2626"/>
    <text x="780" y="133" text-anchor="middle">database</text>
    <text x="780" y="150" text-anchor="middle" font-size="13">(sekin!)</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" marker-end="url(#tA)">
    <line x1="160" y1="135" x2="206" y2="135"/>
    <line x1="330" y1="135" x2="376" y2="135"/>
    <line x1="500" y1="135" x2="546" y2="135"/>
    <line x1="670" y1="135" x2="716" y2="135"/>
  </g>

  <!-- gantt -->
  <text x="440" y="200" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#334155">Span'lar vaqt o'qida (gantt)</text>
  <!-- o'q -->
  <line x1="250" y1="222" x2="820" y2="222" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="250" y="240" font-family="monospace" font-size="13" fill="#64748b">0 ms</text>
  <text x="525" y="240" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748b">120 ms</text>
  <text x="820" y="240" text-anchor="end" font-family="monospace" font-size="13" fill="#64748b">240 ms</text>

  <!-- span barlar: x label chap, bar o'ngda -->
  <g font-family="monospace" font-size="13">
    <text x="40" y="270" fill="#7c3aed">gateway</text>
    <rect x="250" y="258" width="560" height="20" rx="4" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="816" y="273" text-anchor="end" fill="#5b21b6">235 ms</text>

    <text x="40" y="300" fill="#7c3aed">auth</text>
    <rect x="270" y="288" width="70" height="20" rx="4" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="346" y="303" fill="#5b21b6">30 ms</text>

    <text x="40" y="330" fill="#7c3aed">orders</text>
    <rect x="350" y="318" width="440" height="20" rx="4" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="796" y="333" text-anchor="end" fill="#5b21b6">185 ms</text>

    <text x="40" y="360" fill="#dc2626">db query</text>
    <rect x="400" y="348" width="370" height="20" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="1.6"/>
    <text x="776" y="363" text-anchor="end" fill="#991b1b">160 ms — AYBDOR</text>
  </g>

  <!-- xulosa qutisi -->
  <rect x="250" y="392" width="570" height="96" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="270" y="418" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#b45309">O'qish:</text>
  <text x="270" y="440" font-family="Segoe UI" font-size="13" fill="#334155">Umumiy 235 ms — lekin parent span emas, ICHIDAGI db query 160 ms (~68%).</text>
  <text x="270" y="460" font-family="Segoe UI" font-size="13" fill="#334155">Tracing'siz faqat "endpoint sekin" deb bilarding; bu yerda AYNAN db qadam ko'rinadi.</text>
  <text x="270" y="480" font-family="Segoe UI" font-size="13" fill="#334155">Har span: trace_id (umumiy) + span_id + parent_span_id orqali daraxtga ulanadi.</text>

  <text x="440" y="508" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Standart: OpenTelemetry (OTel) — trace/metrik/log uchun yagona instrumentatsiya formati</text>

  <defs>
    <marker id="tA" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto"><path d="M0,0 L7,3.4 L0,6.8 Z" fill="#94a3b8"/></marker>
  </defs>
</svg>
