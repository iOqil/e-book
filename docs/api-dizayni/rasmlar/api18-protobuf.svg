<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <title>Protocol Buffers oqimi: .proto ta'rifidan kod generatsiyasi va ikkilik wire formatgacha</title>
  <rect x="0" y="0" width="900" height="500" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b">Protocol Buffers: .proto dan ikkilik formatgacha</text>
  <text x="450" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Bitta shartnoma — ko'p til — ixcham ikkilik tarmoq formati</text>

  <!-- Step 1: .proto -->
  <rect x="40" y="90" width="250" height="180" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="165" y="118" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">1. .proto fayl (IDL)</text>
  <rect x="60" y="132" width="210" height="124" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="74" y="154" font-family="monospace" font-size="13" fill="#1e3a8a">message User {</text>
  <text x="86" y="176" font-family="monospace" font-size="13" fill="#1e3a8a">int64 id = 1;</text>
  <text x="86" y="198" font-family="monospace" font-size="13" fill="#1e3a8a">string name = 2;</text>
  <text x="86" y="220" font-family="monospace" font-size="13" fill="#1e3a8a">bool active = 3;</text>
  <text x="74" y="242" font-family="monospace" font-size="13" fill="#1e3a8a">}</text>

  <!-- arrow 1 -->
  <line x1="295" y1="180" x2="345" y2="180" stroke="#64748b" stroke-width="2.5" marker-end="url(#pgray)"/>
  <text x="320" y="170" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">protoc</text>

  <!-- Step 2: generated code -->
  <rect x="350" y="90" width="250" height="180" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="475" y="118" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#7c3aed">2. Kod generatsiya</text>
  <text x="475" y="140" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">har til uchun tipli klass</text>
  <rect x="370" y="152" width="100" height="44" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="420" y="179" text-anchor="middle" font-family="monospace" font-size="13" fill="#5b21b6">Go</text>
  <rect x="480" y="152" width="100" height="44" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="530" y="179" text-anchor="middle" font-family="monospace" font-size="13" fill="#5b21b6">Java</text>
  <rect x="370" y="206" width="100" height="44" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="420" y="233" text-anchor="middle" font-family="monospace" font-size="13" fill="#5b21b6">Python</text>
  <rect x="480" y="206" width="100" height="44" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="530" y="233" text-anchor="middle" font-family="monospace" font-size="13" fill="#5b21b6">TS / C#</text>

  <!-- arrow 2 -->
  <line x1="605" y1="180" x2="655" y2="180" stroke="#64748b" stroke-width="2.5" marker-end="url(#pgray)"/>
  <text x="630" y="170" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">serialize</text>

  <!-- Step 3: wire format -->
  <rect x="660" y="90" width="210" height="180" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="765" y="118" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">3. Ikkilik (binary)</text>
  <text x="765" y="140" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">tarmoq wire format</text>
  <rect x="680" y="156" width="170" height="50" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="765" y="186" text-anchor="middle" font-family="monospace" font-size="13" fill="#15803d">08 01 12 03 41 6c 69</text>
  <text x="765" y="232" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">JSON'dan kichik va tez</text>
  <text x="765" y="252" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">inson o'qiy emas</text>

  <!-- Field number note -->
  <rect x="40" y="300" width="830" height="160" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="60" y="328" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#b45309">Maydon raqami (tag) — evolyutsiya kaliti</text>
  <text x="60" y="356" font-family="monospace" font-size="14" fill="#92400e">string name = 2;</text>
  <text x="240" y="356" font-family="Segoe UI" font-size="13" fill="#334155">"2" — wire formatda maydon kaliti. Nom emas, raqam saqlanadi.</text>
  <text x="60" y="392" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">Xavfsiz:</text>
  <text x="160" y="392" font-family="Segoe UI" font-size="13" fill="#334155">yangi maydonni yangi raqam bilan qo'shish (eski klient e'tiborsiz qoldiradi).</text>
  <text x="60" y="420" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">Buzuvchi:</text>
  <text x="160" y="420" font-family="Segoe UI" font-size="13" fill="#334155">mavjud maydon raqamini o'zgartirish yoki qayta ishlatish — ma'no buziladi.</text>
  <text x="60" y="448" font-family="Segoe UI" font-size="13" fill="#64748b">Qoida: maydon raqami muqaddas — bir marta tayinlangach, o'zgartirilmaydi.</text>

  <defs>
    <marker id="pgray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
  </defs>
</svg>
