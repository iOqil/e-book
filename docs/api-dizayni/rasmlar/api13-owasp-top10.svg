<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640">
  <title>OWASP API Security Top 10 (2023) ro'yxati: API1 BOLA dan API10 gacha</title>
  <rect x="0" y="0" width="880" height="640" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b">OWASP API Security Top 10 — 2023</text>
  <text x="440" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">API'lar uchun eng xavfli 10 ta zaiflik — tartib bilan</text>

  <!-- API1 -->
  <rect x="40" y="80" width="400" height="50" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="40" y="80" width="62" height="50" rx="8" fill="#fef2f2"/>
  <text x="71" y="103" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">API1</text>
  <text x="71" y="121" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">BOLA</text>
  <text x="114" y="101" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Broken Object Level Authorization</text>
  <text x="114" y="120" font-family="Segoe UI" font-size="13" fill="#64748b">Obyekt egaligi tekshirilmaydi — eng muhim</text>

  <!-- API2 -->
  <rect x="40" y="138" width="400" height="50" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <rect x="40" y="138" width="62" height="50" rx="8" fill="#fffbeb"/>
  <text x="71" y="167" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#d97706">API2</text>
  <text x="114" y="159" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Broken Authentication</text>
  <text x="114" y="178" font-family="Segoe UI" font-size="13" fill="#64748b">Zaif kim-ekanligini aniqlash mexanizmi</text>

  <!-- API3 -->
  <rect x="40" y="196" width="400" height="50" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="40" y="196" width="62" height="50" rx="8" fill="#fef2f2"/>
  <text x="71" y="219" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">API3</text>
  <text x="71" y="237" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">BOPLA</text>
  <text x="114" y="217" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Broken Object Property Level Authz</text>
  <text x="114" y="236" font-family="Segoe UI" font-size="13" fill="#64748b">Ortiqcha maydon + mass assignment</text>

  <!-- API4 -->
  <rect x="40" y="254" width="400" height="50" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="40" y="254" width="62" height="50" rx="8" fill="#eff6ff"/>
  <text x="71" y="283" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">API4</text>
  <text x="114" y="275" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Unrestricted Resource Consumption</text>
  <text x="114" y="294" font-family="Segoe UI" font-size="13" fill="#64748b">Rate limit / kvota yo'q</text>

  <!-- API5 -->
  <rect x="40" y="312" width="400" height="50" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="40" y="312" width="62" height="50" rx="8" fill="#fef2f2"/>
  <text x="71" y="335" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">API5</text>
  <text x="71" y="353" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">BFLA</text>
  <text x="114" y="333" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Broken Function Level Authorization</text>
  <text x="114" y="352" font-family="Segoe UI" font-size="13" fill="#64748b">Admin endpoint himoyasiz qoldirilgan</text>

  <!-- API6 -->
  <rect x="450" y="80" width="400" height="50" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <rect x="450" y="80" width="62" height="50" rx="8" fill="#fffbeb"/>
  <text x="481" y="109" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#d97706">API6</text>
  <text x="524" y="101" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Sensitive Business Flows abuse</text>
  <text x="524" y="120" font-family="Segoe UI" font-size="13" fill="#64748b">Biznes oqim suiiste'mol (scalping)</text>

  <!-- API7 -->
  <rect x="450" y="138" width="400" height="50" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="450" y="138" width="62" height="50" rx="8" fill="#fef2f2"/>
  <text x="481" y="161" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">API7</text>
  <text x="481" y="179" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">SSRF</text>
  <text x="524" y="159" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Server-Side Request Forgery</text>
  <text x="524" y="178" font-family="Segoe UI" font-size="13" fill="#64748b">Server ishonchsiz URL ga so'rov yuboradi</text>

  <!-- API8 -->
  <rect x="450" y="196" width="400" height="50" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <rect x="450" y="196" width="62" height="50" rx="8" fill="#fffbeb"/>
  <text x="481" y="225" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#d97706">API8</text>
  <text x="524" y="217" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Security Misconfiguration</text>
  <text x="524" y="236" font-family="Segoe UI" font-size="13" fill="#64748b">Noto'g'ri sozlash, debug yoniq</text>

  <!-- API9 -->
  <rect x="450" y="254" width="400" height="50" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="450" y="254" width="62" height="50" rx="8" fill="#f5f3ff"/>
  <text x="481" y="283" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">API9</text>
  <text x="524" y="275" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Improper Inventory Management</text>
  <text x="524" y="294" font-family="Segoe UI" font-size="13" fill="#64748b">Eski / hujjatsiz endpoint (shadow API)</text>

  <!-- API10 -->
  <rect x="450" y="312" width="400" height="50" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="450" y="312" width="62" height="50" rx="8" fill="#f5f3ff"/>
  <text x="481" y="341" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">API10</text>
  <text x="524" y="333" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Unsafe Consumption of APIs</text>
  <text x="524" y="352" font-family="Segoe UI" font-size="13" fill="#64748b">Uchinchi-tomon API'ga ko'r-ko'rona ishonch</text>

  <!-- Pastki izoh blok -->
  <rect x="40" y="392" width="810" height="120" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="445" y="420" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">Asosiy naqsh: avtorizatsiya zaifliklari ustun</text>
  <text x="64" y="448" font-family="Segoe UI" font-size="14" fill="#334155">API1 (BOLA), API3 (BOPLA), API5 (BFLA) — uchchalasi ham AVTORIZATSIYA muammosi.</text>
  <text x="64" y="472" font-family="Segoe UI" font-size="14" fill="#334155">Obyekt / maydon / funksiya darajasida "bu foydalanuvchi bunga haqlimi?" tekshirilmaydi.</text>
  <text x="64" y="496" font-family="Segoe UI" font-size="14" fill="#334155">Yechim: har so'rovda egalik va rol serverda majburiy tekshirilsin — mijozga ishonmang.</text>

  <!-- Rang izohi -->
  <rect x="40" y="528" width="14" height="14" fill="#fef2f2" stroke="#dc2626"/>
  <text x="60" y="540" font-family="Segoe UI" font-size="13" fill="#64748b">qizil = avtorizatsiya / kritik</text>
  <rect x="260" y="528" width="14" height="14" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="280" y="540" font-family="Segoe UI" font-size="13" fill="#64748b">sariq = sozlash / cheklov</text>
  <rect x="470" y="528" width="14" height="14" fill="#eff6ff" stroke="#2563eb"/>
  <text x="490" y="540" font-family="Segoe UI" font-size="13" fill="#64748b">ko'k = resurs sarfi</text>
  <rect x="640" y="528" width="14" height="14" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="660" y="540" font-family="Segoe UI" font-size="13" fill="#64748b">binafsha = inventar / tashqi</text>

  <text x="440" y="600" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Manba: OWASP API Security Top 10 — 2023 nashri (avvalgi nashr 2019-yilda chiqqan)</text>
</svg>
