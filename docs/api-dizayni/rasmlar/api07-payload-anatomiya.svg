<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560">
  <title>So'rov va javob payload anatomiyasi</title>
  <rect x="0" y="0" width="900" height="560" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b">Payload anatomiyasi: so'rov body va javob body</text>
  <text x="450" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Resurs maydonlari + ichki obyektlar + metadata</text>

  <!-- REQUEST card -->
  <rect x="36" y="80" width="400" height="450" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="236" y="108" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">SO'ROV body (mijoz yuboradi)</text>
  <text x="236" y="130" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">faqat MIJOZ beradigan maydonlar</text>

  <rect x="56" y="146" width="360" height="328" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="70" y="170" font-family="monospace" font-size="13" fill="#334155">{</text>
  <text x="86" y="192" font-family="monospace" font-size="13" fill="#16a34a">"title": "Yangi kitob",</text>
  <text x="86" y="214" font-family="monospace" font-size="13" fill="#16a34a">"price_cents": 49900,</text>
  <text x="86" y="236" font-family="monospace" font-size="13" fill="#16a34a">"is_published": false,</text>
  <text x="86" y="258" font-family="monospace" font-size="13" fill="#334155">"author": {</text>
  <text x="102" y="280" font-family="monospace" font-size="13" fill="#7c3aed">"id": "auth_42"</text>
  <text x="86" y="302" font-family="monospace" font-size="13" fill="#334155">},</text>
  <text x="86" y="324" font-family="monospace" font-size="13" fill="#334155">"tags": ["api", "rest"]</text>
  <text x="70" y="346" font-family="monospace" font-size="13" fill="#334155">}</text>

  <line x1="56" y1="368" x2="416" y2="368" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="392" font-family="Segoe UI" font-size="13" fill="#16a34a">^ resurs maydonlari</text>
  <text x="70" y="416" font-family="Segoe UI" font-size="13" fill="#334155">^ ichki obyekt (author)</text>
  <text x="70" y="440" font-family="Segoe UI" font-size="13" fill="#7c3aed">^ havola: faqat id beriladi</text>
  <text x="70" y="464" font-family="Segoe UI" font-size="13" fill="#dc2626">id, created_at YUBORILMAYDI</text>

  <text x="236" y="508" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Server boshqaradigan maydonlarni mijoz bermaydi</text>

  <!-- arrow -->
  <defs>
    <marker id="a7" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <line x1="442" y1="300" x2="462" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#a7)"/>

  <!-- RESPONSE card -->
  <rect x="466" y="80" width="400" height="450" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="666" y="108" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">JAVOB body (server qaytaradi)</text>
  <text x="666" y="130" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">to'liq resurs + server maydonlari</text>

  <rect x="486" y="146" width="360" height="328" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="500" y="170" font-family="monospace" font-size="13" fill="#334155">{</text>
  <text x="516" y="192" font-family="monospace" font-size="13" fill="#dc2626">"id": "book_1001",</text>
  <text x="516" y="214" font-family="monospace" font-size="13" fill="#16a34a">"title": "Yangi kitob",</text>
  <text x="516" y="236" font-family="monospace" font-size="13" fill="#16a34a">"price_cents": 49900,</text>
  <text x="516" y="258" font-family="monospace" font-size="13" fill="#16a34a">"is_published": false,</text>
  <text x="516" y="280" font-family="monospace" font-size="13" fill="#334155">"author": {</text>
  <text x="532" y="302" font-family="monospace" font-size="13" fill="#7c3aed">"id": "auth_42",</text>
  <text x="532" y="324" font-family="monospace" font-size="13" fill="#7c3aed">"name": "Oqil I."</text>
  <text x="516" y="346" font-family="monospace" font-size="13" fill="#334155">},</text>
  <text x="516" y="368" font-family="monospace" font-size="13" fill="#dc2626">"created_at": "2026-06-16T10:30:00Z"</text>
  <text x="500" y="390" font-family="monospace" font-size="13" fill="#334155">}</text>

  <line x1="486" y1="408" x2="846" y2="408" stroke="#cbd5e1" stroke-width="1"/>
  <text x="500" y="432" font-family="Segoe UI" font-size="13" fill="#dc2626">^ server beradi: id, created_at</text>
  <text x="500" y="456" font-family="Segoe UI" font-size="13" fill="#7c3aed">^ ichki obyekt to'ldirilgan (embed)</text>

  <text x="666" y="508" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Sana ISO 8601 (UTC), pul integer tiyin</text>
</svg>
