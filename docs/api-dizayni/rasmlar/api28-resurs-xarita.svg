<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520">
  <title>Vazifa-boshqaruvchi API resurs xaritasi va bog'lanishlari</title>
  <rect x="0" y="0" width="880" height="520" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b">Resurs xaritasi — vazifa-boshqaruvchi (task manager)</text>
  <text x="440" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Resurslar (otlar) va ular orasidagi bog'lanishlar</text>

  <defs>
    <marker id="rh" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- users -->
  <rect x="60" y="110" width="180" height="80" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="150" y="140" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#7c3aed">users</text>
  <text x="150" y="164" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">foydalanuvchi (ildiz)</text>
  <text x="150" y="182" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748b">id, name, email</text>

  <!-- projects -->
  <rect x="350" y="110" width="190" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="445" y="140" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#2563eb">projects</text>
  <text x="445" y="164" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">loyiha (ildiz)</text>
  <text x="445" y="182" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748b">id, name</text>

  <!-- members (junction) -->
  <rect x="350" y="270" width="190" height="80" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="445" y="300" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#b45309">members</text>
  <text x="445" y="324" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">a'zolik (rol bilan)</text>
  <text x="445" y="342" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748b">user_id, role</text>

  <!-- tasks -->
  <rect x="640" y="110" width="200" height="92" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="740" y="140" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#16a34a">tasks</text>
  <text x="740" y="162" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">vazifa (loyihaga tegishli)</text>
  <text x="740" y="180" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748b">id, title, status</text>
  <text x="740" y="196" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748b">assignee_id</text>

  <!-- comments -->
  <rect x="640" y="280" width="200" height="80" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="740" y="310" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#dc2626">comments</text>
  <text x="740" y="334" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">izoh (vazifaga)</text>
  <text x="740" y="352" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748b">id, text, author_id</text>

  <!-- relations -->
  <!-- projects -> tasks one-to-many -->
  <line x1="540" y1="150" x2="638" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#rh)"/>
  <text x="589" y="140" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">1 → ko'p</text>

  <!-- tasks -> comments one-to-many -->
  <line x1="740" y1="202" x2="740" y2="278" stroke="#64748b" stroke-width="2" marker-end="url(#rh)"/>
  <text x="790" y="244" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">1 → ko'p</text>

  <!-- projects -> members -->
  <line x1="445" y1="190" x2="445" y2="268" stroke="#64748b" stroke-width="2" marker-end="url(#rh)"/>
  <text x="495" y="234" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#b45309">1 → ko'p</text>

  <!-- users <-> projects many-to-many via members -->
  <line x1="240" y1="170" x2="348" y2="290" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#rh)"/>
  <text x="250" y="245" font-family="Segoe UI" font-size="13" fill="#7c3aed">ko'pdan-ko'p</text>

  <!-- users -> tasks (assignee, havola) -->
  <path d="M240,130 Q440,70 640,130" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="2 3" marker-end="url(#rh)"/>
  <text x="440" y="86" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">assignee (havola, uyalash emas)</text>

  <!-- legend -->
  <rect x="60" y="400" width="780" height="96" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="80" y="426" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Uyalash qaroriga e'tibor:</text>
  <text x="80" y="450" font-family="Segoe UI" font-size="13" fill="#334155">• Yaratish/ro'yxat = uyalangan:  </text>
  <text x="320" y="450" font-family="monospace" font-size="13" fill="#2563eb">POST /projects/{pid}/tasks</text>
  <text x="80" y="472" font-family="Segoe UI" font-size="13" fill="#334155">• Bitta elementga murojaat = tekis:  </text>
  <text x="360" y="472" font-family="monospace" font-size="13" fill="#16a34a">GET /tasks/{tid}</text>
  <text x="80" y="490" font-family="Segoe UI" font-size="13" fill="#64748b">Uzluksiz tutash chiziq = egalik/uyalash · uzuq chiziq = havola yoki ko'pdan-ko'p</text>
</svg>
