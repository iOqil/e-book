<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560">
  <title>HTTP status kod oilalari: 1xx, 2xx, 3xx, 4xx, 5xx</title>
  <rect x="0" y="0" width="880" height="560" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b">HTTP status kod oilalari (RFC 9110)</text>
  <text x="440" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Birinchi raqam butun ma'noni belgilaydi — javobning natijasini mashina o'qiydi</text>

  <!-- 1xx -->
  <rect x="40" y="90" width="800" height="78" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="70" y="122" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#7c3aed">1xx</text>
  <text x="70" y="146" font-family="Segoe UI" font-size="14" fill="#334155">Informatsion — "so'rovni qabul qildim, davom etyapman"</text>
  <text x="470" y="122" font-family="monospace" font-size="13" fill="#64748b">100 Continue · 101 Switching Protocols</text>
  <text x="470" y="146" font-family="Segoe UI" font-size="13" fill="#64748b">API'da kamdan-kam; ko'pincha avtomatik</text>

  <!-- 2xx -->
  <rect x="40" y="178" width="800" height="78" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="70" y="210" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#16a34a">2xx</text>
  <text x="70" y="234" font-family="Segoe UI" font-size="14" fill="#334155">Muvaffaqiyat — "so'rov tushunildi va bajarildi"</text>
  <text x="470" y="210" font-family="monospace" font-size="13" fill="#16a34a">200 OK · 201 Created · 202 Accepted</text>
  <text x="470" y="234" font-family="monospace" font-size="13" fill="#16a34a">204 No Content</text>

  <!-- 3xx -->
  <rect x="40" y="266" width="800" height="78" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="70" y="298" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#2563eb">3xx</text>
  <text x="70" y="322" font-family="Segoe UI" font-size="14" fill="#334155">Qayta yo'naltirish — "qo'shimcha qadam kerak"</text>
  <text x="470" y="298" font-family="monospace" font-size="13" fill="#2563eb">301 · 302 · 307 · 308 (redirect)</text>
  <text x="470" y="322" font-family="monospace" font-size="13" fill="#2563eb">304 Not Modified (kesh)</text>

  <!-- 4xx -->
  <rect x="40" y="354" width="800" height="78" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="70" y="386" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#f59e0b">4xx</text>
  <text x="70" y="410" font-family="Segoe UI" font-size="14" fill="#334155">Mijoz xatosi — "so'rov noto'g'ri; mijoz aybdor"</text>
  <text x="470" y="386" font-family="monospace" font-size="13" fill="#b45309">400 · 401 · 403 · 404 · 405 · 409</text>
  <text x="470" y="410" font-family="monospace" font-size="13" fill="#b45309">422 · 429 (juda ko'p so'rov)</text>

  <!-- 5xx -->
  <rect x="40" y="442" width="800" height="78" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="70" y="474" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#dc2626">5xx</text>
  <text x="70" y="498" font-family="Segoe UI" font-size="14" fill="#334155">Server xatosi — "so'rov to'g'ri edi; server uddalay olmadi"</text>
  <text x="470" y="474" font-family="monospace" font-size="13" fill="#dc2626">500 · 502 · 503 (Retry-After)</text>
  <text x="470" y="498" font-family="monospace" font-size="13" fill="#dc2626">504 Gateway Timeout</text>

  <text x="440" y="544" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">4xx = "muammoni tuzat va qayta urin" · 5xx = "aybsizsan; keyinroq qayta urinish mumkin"</text>
</svg>
