<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560">
  <title>gRPC ning 4 chaqiruv turi: unary, server streaming, client streaming va bidirectional streaming</title>
  <rect x="0" y="0" width="900" height="560" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b">gRPC ning 4 chaqiruv turi</text>
  <text x="450" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Mijoz (klient) chap, server o'ng — o'q yo'nalishi xabar oqimini ko'rsatadi</text>

  <!-- 1. Unary -->
  <rect x="30" y="84" width="410" height="200" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="50" y="112" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">1. Unary (1 -&gt; 1)</text>
  <text x="50" y="134" font-family="Segoe UI" font-size="13" fill="#64748b">Oddiy so'rov-javob, REST chaqiruviga o'xshash</text>
  <text x="70" y="172" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155">Klient</text>
  <text x="400" y="172" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155">Server</text>
  <line x1="70" y1="184" x2="70" y2="266" stroke="#94a3b8" stroke-width="2"/>
  <line x1="400" y1="184" x2="400" y2="266" stroke="#94a3b8" stroke-width="2"/>
  <line x1="78" y1="206" x2="392" y2="206" stroke="#2563eb" stroke-width="2" marker-end="url(#ablue)"/>
  <text x="235" y="200" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">1 so'rov</text>
  <line x1="392" y1="246" x2="78" y2="246" stroke="#16a34a" stroke-width="2" marker-end="url(#agreen)"/>
  <text x="235" y="240" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">1 javob</text>

  <!-- 2. Server streaming -->
  <rect x="460" y="84" width="410" height="200" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="112" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">2. Server streaming (1 -&gt; N)</text>
  <text x="480" y="134" font-family="Segoe UI" font-size="13" fill="#64748b">1 so'rov, javob oqim bo'lib qaytadi</text>
  <text x="500" y="172" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155">Klient</text>
  <text x="830" y="172" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155">Server</text>
  <line x1="500" y1="184" x2="500" y2="266" stroke="#94a3b8" stroke-width="2"/>
  <line x1="830" y1="184" x2="830" y2="266" stroke="#94a3b8" stroke-width="2"/>
  <line x1="508" y1="200" x2="822" y2="200" stroke="#2563eb" stroke-width="2" marker-end="url(#ablue)"/>
  <text x="665" y="194" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">1 so'rov</text>
  <line x1="822" y1="226" x2="508" y2="226" stroke="#16a34a" stroke-width="2" marker-end="url(#agreen)"/>
  <line x1="822" y1="246" x2="508" y2="246" stroke="#16a34a" stroke-width="2" marker-end="url(#agreen)"/>
  <line x1="822" y1="266" x2="508" y2="266" stroke="#16a34a" stroke-width="2" marker-end="url(#agreen)"/>
  <text x="665" y="262" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">N javob (oqim)</text>

  <!-- 3. Client streaming -->
  <rect x="30" y="304" width="410" height="200" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="50" y="332" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#b45309">3. Client streaming (N -&gt; 1)</text>
  <text x="50" y="354" font-family="Segoe UI" font-size="13" fill="#64748b">Oqim so'rov, oxirida 1 javob</text>
  <text x="70" y="392" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155">Klient</text>
  <text x="400" y="392" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155">Server</text>
  <line x1="70" y1="404" x2="70" y2="486" stroke="#94a3b8" stroke-width="2"/>
  <line x1="400" y1="404" x2="400" y2="486" stroke="#94a3b8" stroke-width="2"/>
  <line x1="78" y1="420" x2="392" y2="420" stroke="#f59e0b" stroke-width="2" marker-end="url(#aamber)"/>
  <line x1="78" y1="440" x2="392" y2="440" stroke="#f59e0b" stroke-width="2" marker-end="url(#aamber)"/>
  <line x1="78" y1="460" x2="392" y2="460" stroke="#f59e0b" stroke-width="2" marker-end="url(#aamber)"/>
  <text x="235" y="414" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#b45309">N so'rov (oqim)</text>
  <line x1="392" y1="480" x2="78" y2="480" stroke="#16a34a" stroke-width="2" marker-end="url(#agreen)"/>
  <text x="235" y="475" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">1 javob</text>

  <!-- 4. Bidirectional -->
  <rect x="460" y="304" width="410" height="200" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="480" y="332" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#7c3aed">4. Bidirectional (N &lt;-&gt; N)</text>
  <text x="480" y="354" font-family="Segoe UI" font-size="13" fill="#64748b">Ikki tomonlama mustaqil oqim</text>
  <text x="500" y="392" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155">Klient</text>
  <text x="830" y="392" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155">Server</text>
  <line x1="500" y1="404" x2="500" y2="486" stroke="#94a3b8" stroke-width="2"/>
  <line x1="830" y1="404" x2="830" y2="486" stroke="#94a3b8" stroke-width="2"/>
  <line x1="508" y1="422" x2="822" y2="422" stroke="#7c3aed" stroke-width="2" marker-end="url(#apurple)"/>
  <line x1="822" y1="446" x2="508" y2="446" stroke="#16a34a" stroke-width="2" marker-end="url(#agreen)"/>
  <line x1="508" y1="470" x2="822" y2="470" stroke="#7c3aed" stroke-width="2" marker-end="url(#apurple)"/>
  <text x="665" y="492" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">har ikki yon istalgan vaqtda yuboradi</text>

  <defs>
    <marker id="ablue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker>
    <marker id="agreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/></marker>
    <marker id="aamber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#f59e0b"/></marker>
    <marker id="apurple" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7c3aed"/></marker>
  </defs>
</svg>
