<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>StatelessWidget anatomiyasi: maydonlar (konfiguratsiya) build(context) metodiga kiradi va u widget daraxtini qaytaradi; SalomKartasi(ism) misolida</title>
  <rect x="0" y="0" width="780" height="470" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">StatelessWidget anatomiyasi</text>
  <text x="390" y="58" text-anchor="middle" font-size="14" fill="#475569">Maydonlar (sozlama) ichkariga kiradi, build() ularni o'qib widget daraxtini qaytaradi</text>

  <!-- The class container -->
  <rect x="36" y="88" width="708" height="318" rx="16" fill="#ffffff" stroke="#6366f1" stroke-width="2.5"/>
  <rect x="36" y="88" width="708" height="40" rx="16" fill="#6366f1"/>
  <text x="390" y="115" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">class SalomKartasi extends StatelessWidget</text>

  <!-- Fields (config) block -->
  <rect x="64" y="150" width="300" height="146" rx="12" fill="#e0e7ff"/>
  <text x="214" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#0553b1">1. Maydonlar = konfiguratsiya</text>
  <rect x="84" y="190" width="260" height="32" rx="7" fill="#ffffff"/>
  <text x="100" y="211" font-size="13" font-weight="700" fill="#6366f1">final String ism;</text>
  <rect x="84" y="228" width="260" height="32" rx="7" fill="#ffffff"/>
  <text x="100" y="249" font-size="13" font-weight="700" fill="#6366f1">const SalomKartasi(this.ism, ...)</text>
  <text x="214" y="282" text-anchor="middle" font-size="13" fill="#475569">o'zgarmas (final) kirish ma'lumoti</text>

  <!-- Arrow fields -> build -->
  <line x1="364" y1="223" x2="412" y2="223" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="412,223 400,217 400,229" fill="#94a3b8"/>

  <!-- build method block -->
  <rect x="420" y="150" width="300" height="146" rx="12" fill="#fef3c7"/>
  <text x="570" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">2. build(BuildContext context)</text>
  <rect x="440" y="190" width="260" height="86" rx="8" fill="#ffffff"/>
  <text x="458" y="212" font-size="13" font-weight="700" fill="#475569">return Container(</text>
  <text x="470" y="232" font-size="13" fill="#475569">child: Text('Salom, $ism!'),</text>
  <text x="458" y="252" font-size="13" font-weight="700" fill="#475569">);</text>
  <text x="570" y="293" text-anchor="middle" font-size="13" fill="#f59e0b">ismni o'qib UI qaytaradi</text>

  <!-- Arrow build -> tree (down) -->
  <line x1="390" y1="330" x2="390" y2="362" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="390,362 384,350 396,350" fill="#94a3b8"/>
  <text x="390" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">3. natija = widget daraxti</text>

  <!-- result tree mini -->
  <rect x="240" y="368" width="300" height="30" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="390" y="388" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">Container &#8594; Text('Salom, Anvar!')</text>

  <text x="390" y="430" text-anchor="middle" font-size="14" fill="#475569">build() ni Flutter chaqiradi; siz faqat "shu sozlamada nima ko'rinishi kerak"ni yozasiz.</text>
  <text x="390" y="452" text-anchor="middle" font-size="13" fill="#94a3b8">Stateless = chiqishi faqat kirishiga bog'liq; o'zi o'zgarmaydi (holatli widget 16-bobda).</text>
</svg>
