<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Segoe UI, system-ui, sans-serif">
  <title>Kompozitsiya: profil kartasi chap tomonda chizilgan ko'rinishda, o'ng tomonda esa uning widget daraxti (Container -> Column -> Image, Text, Row -> Icon, Text)</title>
  <rect x="0" y="0" width="800" height="500" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Kompozitsiya — kichik widgetlardan murakkab UI</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#475569">Chapda ko'ringan karta = o'ngdagi widget daraxti</text>

  <!-- LEFT: rendered card -->
  <text x="190" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">Ekranda ko'ringani</text>

  <!-- Container card -->
  <rect x="80" y="108" width="220" height="320" rx="18" fill="#ffffff" stroke="#027dfd" stroke-width="2.5"/>
  <!-- Image (avatar) -->
  <circle cx="190" cy="178" r="44" fill="#dbeafe" stroke="#027dfd" stroke-width="2"/>
  <circle cx="190" cy="166" r="16" fill="#027dfd"/>
  <path d="M 162 200 Q 190 176 218 200 Z" fill="#027dfd"/>
  <text x="190" y="240" text-anchor="middle" font-size="13" fill="#94a3b8">Image (avatar)</text>
  <!-- Name Text -->
  <text x="190" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Anvar Aliyev</text>
  <!-- Subtitle Text -->
  <text x="190" y="296" text-anchor="middle" font-size="13" fill="#64748b">Flutter dasturchisi</text>
  <!-- Row: Icon + Text -->
  <rect x="110" y="320" width="160" height="40" rx="20" fill="#dcfce7"/>
  <circle cx="138" cy="340" r="9" fill="#16a34a"/>
  <path d="M 134 340 l 3 3 l 6 -7" stroke="#ffffff" stroke-width="2" fill="none"/>
  <text x="170" y="345" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">Faol</text>
  <text x="190" y="398" text-anchor="middle" font-size="13" fill="#94a3b8">Row: Icon + Text</text>
  <text x="190" y="420" text-anchor="middle" font-size="13" fill="#94a3b8">hammasi Container ichida</text>

  <!-- divider -->
  <line x1="345" y1="100" x2="345" y2="440" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- RIGHT: widget tree -->
  <text x="575" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">Widget daraxti (kod)</text>

  <!-- connectors -->
  <line x1="430" y1="138" x2="430" y2="186" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="430" y1="210" x2="500" y2="234" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="430" y1="210" x2="500" y2="290" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="430" y1="210" x2="500" y2="346" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="640" y1="370" x2="700" y2="394" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="640" y1="370" x2="700" y2="424" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- Container node -->
  <rect x="370" y="114" width="120" height="42" rx="10" fill="#027dfd"/>
  <text x="430" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Container</text>

  <!-- Column node -->
  <rect x="370" y="188" width="120" height="40" rx="10" fill="#6366f1"/>
  <text x="430" y="213" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Column</text>

  <!-- Image node -->
  <rect x="500" y="216" width="150" height="36" rx="9" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="575" y="239" text-anchor="middle" font-size="13" font-weight="700" fill="#0ea5e9">Image (rasm)</text>

  <!-- Text node -->
  <rect x="500" y="272" width="150" height="36" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="575" y="295" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">Text (ism)</text>

  <!-- Row node -->
  <rect x="500" y="328" width="150" height="36" rx="9" fill="#f59e0b"/>
  <text x="575" y="351" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Row</text>

  <!-- Row children -->
  <rect x="700" y="376" width="84" height="34" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="742" y="398" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">Icon</text>
  <rect x="700" y="416" width="84" height="34" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="742" y="438" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">Text</text>

  <text x="400" y="480" text-anchor="middle" font-size="13" fill="#94a3b8">Murakkab UI = kichik widgetlarni bir-birining ichiga joylash. Har bo'lakni alohida widgetga ajratish — toza kod.</text>
</svg>
