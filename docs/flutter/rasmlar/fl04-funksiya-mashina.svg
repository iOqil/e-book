<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Segoe UI, system-ui, sans-serif">
  <title>Funksiya bir mashina kabi: parametrlar kirish, tana ichida jarayon, return qiymati chiqish</title>

  <rect x="0" y="0" width="760" height="400" fill="#f8fafc"/>

  <text x="380" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">Funksiya = mashina: kirish &#8594; jarayon &#8594; chiqish</text>

  <!-- KIRISH: parametr -->
  <rect x="30" y="150" width="170" height="80" rx="10" fill="#dbeafe" stroke="#027dfd" stroke-width="2"/>
  <text x="115" y="182" text-anchor="middle" font-size="15" font-weight="bold" fill="#027dfd">KIRISH</text>
  <text x="115" y="206" text-anchor="middle" font-size="15" fill="#475569">parametr: ism</text>
  <text x="115" y="262" text-anchor="middle" font-size="14" fill="#64748b">argument: 'Olim'</text>

  <!-- strelka 1 -->
  <line x1="200" y1="190" x2="265" y2="190" stroke="#475569" stroke-width="3"/>
  <polygon points="265,182 283,190 265,198" fill="#475569"/>

  <!-- JARAYON: tana -->
  <rect x="285" y="125" width="200" height="130" rx="12" fill="#6366f1" stroke="#475569" stroke-width="2"/>
  <text x="385" y="158" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">salomla( )</text>
  <rect x="305" y="172" width="160" height="64" rx="6" fill="#ffffff"/>
  <text x="385" y="198" text-anchor="middle" font-size="14" fill="#1e293b">print('Salom,</text>
  <text x="385" y="220" text-anchor="middle" font-size="14" fill="#1e293b">$ism!');</text>
  <text x="385" y="280" text-anchor="middle" font-size="14" fill="#64748b">funksiya tanasi (ish)</text>

  <!-- strelka 2 -->
  <line x1="485" y1="190" x2="550" y2="190" stroke="#475569" stroke-width="3"/>
  <polygon points="550,182 568,190 550,198" fill="#475569"/>

  <!-- CHIQISH: return -->
  <rect x="570" y="150" width="160" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="650" y="182" text-anchor="middle" font-size="15" font-weight="bold" fill="#16a34a">CHIQISH</text>
  <text x="650" y="206" text-anchor="middle" font-size="15" fill="#475569">return qiymati</text>
  <text x="650" y="262" text-anchor="middle" font-size="14" fill="#64748b">natija</text>

  <!-- pastki izoh -->
  <rect x="60" y="320" width="640" height="58" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="380" y="346" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">void salomla(String ism) { ... }</text>
  <text x="380" y="368" text-anchor="middle" font-size="13.5" fill="#475569">Mashina ichini bilmasangiz ham boladi — kirish va chiqishni bilsangiz yetadi</text>
</svg>
