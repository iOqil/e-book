<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>UI = f(state): holat (counter qiymati) build funksiyasiga kiradi va u UI'ni ishlab chiqaradi; holat o'zgarsa, Flutter build'ni qayta chaqirib UI'ni qaytadan quradi</title>
  <rect x="0" y="0" width="800" height="470" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Deklarativ UI: UI = f(holat)</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#475569">Siz qadam-baqadam o'zgartirmaysiz — shu holatda UI qanday ko'rinishini tasvirlaysiz</text>

  <!-- State box -->
  <rect x="40" y="110" width="180" height="110" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="130" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">HOLAT (state)</text>
  <rect x="62" y="152" width="136" height="48" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="130" y="183" text-anchor="middle" font-size="18" font-weight="700" fill="#f59e0b">counter = 3</text>

  <!-- arrow to build -->
  <line x1="220" y1="165" x2="300" y2="165" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="300,165 288,159 288,171" fill="#94a3b8"/>

  <!-- build function -->
  <rect x="302" y="100" width="196" height="130" rx="14" fill="#027dfd"/>
  <text x="400" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">build( )</text>
  <text x="400" y="158" text-anchor="middle" font-size="13" fill="#ffffff">funksiya: holatni oladi,</text>
  <text x="400" y="178" text-anchor="middle" font-size="13" fill="#ffffff">widget daraxtini</text>
  <text x="400" y="198" text-anchor="middle" font-size="13" fill="#ffffff">QAYTARADI</text>

  <!-- arrow to UI -->
  <line x1="498" y1="165" x2="578" y2="165" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="578,165 566,159 566,171" fill="#94a3b8"/>

  <!-- UI box -->
  <rect x="580" y="110" width="180" height="110" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="670" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">UI (ekran)</text>
  <rect x="602" y="152" width="136" height="48" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="670" y="183" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">Text('3')</text>

  <!-- feedback loop: state changes -> rebuild -->
  <line x1="670" y1="220" x2="670" y2="290" stroke="#6366f1" stroke-width="2.5"/>
  <line x1="670" y1="290" x2="130" y2="290" stroke="#6366f1" stroke-width="2.5"/>
  <line x1="130" y1="290" x2="130" y2="220" stroke="#6366f1" stroke-width="2.5"/>
  <polygon points="130,220 124,232 136,232" fill="#6366f1"/>
  <rect x="300" y="272" width="200" height="36" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="400" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#6366f1">holat o'zgardi -> qayta build</text>

  <!-- contrast box -->
  <rect x="40" y="332" width="720" height="106" rx="14" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="60" y="360" font-size="15" font-weight="700" fill="#ef4444">Imperativ (eski usul) — qo'lda o'zgartirish</text>
  <text x="60" y="386" font-size="14" fill="#475569">label.text = "4";  badge.show();  if (count == 0) badge.hide();  ...</text>
  <text x="60" y="412" font-size="13" fill="#64748b">Har bir o'zgarishni o'zingiz boshqarasiz — qadamlar ko'payib, xato oson kiradi.</text>
  <text x="60" y="430" font-size="13" fill="#16a34a">Deklarativda esa: holatni o'zgartirasiz, build qolganini o'zi qiladi.</text>
</svg>
