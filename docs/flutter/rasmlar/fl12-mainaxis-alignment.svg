<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>mainAxisAlignment ning to'rt qiymati: start, center, spaceBetween va spaceEvenly bir Row'da uchta qutini asosiy o'q bo'ylab qanday taqsimlashi</title>
  <rect x="0" y="0" width="780" height="470" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">mainAxisAlignment — bolalarni asosiy o'q bo'ylab taqsimlash</text>
  <text x="390" y="58" text-anchor="middle" font-size="14" fill="#475569">Bir xil Row, uchta quti — faqat mainAxisAlignment qiymati o'zgaradi</text>

  <!-- main axis arrow at top -->
  <line x1="100" y1="82" x2="690" y2="82" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="690,82 678,76 678,88" fill="#16a34a"/>
  <text x="395" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">asosiy o'q (gorizontal) →</text>

  <!-- ROW 1: start -->
  <text x="40" y="120" font-size="14" font-weight="700" fill="#027dfd">start</text>
  <rect x="100" y="100" width="590" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="110" y="108" width="56" height="32" rx="6" fill="#dbeafe" stroke="#027dfd" stroke-width="2"/>
  <rect x="172" y="108" width="56" height="32" rx="6" fill="#dbeafe" stroke="#027dfd" stroke-width="2"/>
  <rect x="234" y="108" width="56" height="32" rx="6" fill="#dbeafe" stroke="#027dfd" stroke-width="2"/>
  <text x="660" y="128" text-anchor="middle" font-size="13" fill="#64748b">boshiga</text>

  <!-- ROW 2: center -->
  <text x="40" y="190" font-size="14" font-weight="700" fill="#027dfd">center</text>
  <rect x="100" y="170" width="590" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="302" y="178" width="56" height="32" rx="6" fill="#dbeafe" stroke="#027dfd" stroke-width="2"/>
  <rect x="364" y="178" width="56" height="32" rx="6" fill="#dbeafe" stroke="#027dfd" stroke-width="2"/>
  <rect x="426" y="178" width="56" height="32" rx="6" fill="#dbeafe" stroke="#027dfd" stroke-width="2"/>
  <text x="640" y="198" text-anchor="middle" font-size="13" fill="#64748b">o'rtaga</text>

  <!-- ROW 3: spaceBetween -->
  <text x="40" y="260" font-size="14" font-weight="700" fill="#027dfd">spaceBetween</text>
  <rect x="100" y="240" width="590" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="110" y="248" width="56" height="32" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <rect x="367" y="248" width="56" height="32" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <rect x="624" y="248" width="56" height="32" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="246" y="269" text-anchor="middle" font-size="13" fill="#64748b">bo'shliq faqat oraliqda</text>

  <!-- ROW 4: spaceEvenly -->
  <text x="40" y="330" font-size="14" font-weight="700" fill="#027dfd">spaceEvenly</text>
  <rect x="100" y="310" width="590" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="159" y="318" width="56" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <rect x="367" y="318" width="56" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <rect x="575" y="318" width="56" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="250" y="339" text-anchor="middle" font-size="13" fill="#64748b">teng bo'shliq (chetlarda ham)</text>

  <text x="390" y="392" text-anchor="middle" font-size="14" fill="#475569">spaceAround — chetdagi bo'shliq oraliqdagining yarmi (bu yerda ko'rsatilmagan)</text>
  <text x="390" y="430" text-anchor="middle" font-size="13" fill="#94a3b8">start/center/end — qutilarni bir tomonga; spaceBetween/Around/Evenly — bo'sh joyni taqsimlaydi</text>
  <text x="390" y="454" text-anchor="middle" font-size="13" fill="#94a3b8">Bo'shliqni taqsimlash uchun Row'da bo'sh joy bo'lishi shart (mainAxisSize: max).</text>
</svg>
