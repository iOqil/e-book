<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Riverpod provayder grafi: repositoryProvider'dan usersProvider (uni watch qiladi), undan filterProvider bilan birga filteredUsersProvider hosil bo'ladi, va vidjet faqat oxirgisini watch qiladi — derived (hosila) provayderlar yo'naltirilgan grafi</title>
  <defs>
    <marker id="fl25grA" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="470" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Provayderlar grafi — biri boshqasini watch qiladi</text>
  <text x="390" y="58" text-anchor="middle" font-size="14" fill="#475569">Manba o'zgarsa, unga bog'liq provayderlar zanjiri avtomatik qayta hisoblanadi</text>

  <!-- repositoryProvider -->
  <rect x="40" y="150" width="200" height="62" rx="12" fill="#ffffff" stroke="#027dfd" stroke-width="2.5"/>
  <text x="140" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#027dfd">repositoryProvider</text>
  <text x="140" y="198" text-anchor="middle" font-size="13" fill="#64748b">ma'lumot manbai (DI)</text>

  <!-- usersProvider -->
  <rect x="290" y="150" width="200" height="62" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="390" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#6366f1">usersProvider</text>
  <text x="390" y="198" text-anchor="middle" font-size="13" fill="#64748b">repo'ni watch qiladi</text>

  <!-- filterProvider -->
  <rect x="290" y="280" width="200" height="56" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="390" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">filterProvider</text>
  <text x="390" y="324" text-anchor="middle" font-size="13" fill="#475569">qidiruv matni (holat)</text>

  <!-- filteredUsersProvider -->
  <rect x="540" y="150" width="200" height="62" rx="12" fill="#e0e7ff" stroke="#9333ea" stroke-width="2.5"/>
  <text x="640" y="173" text-anchor="middle" font-size="14" font-weight="700" fill="#9333ea">filteredUsersProvider</text>
  <text x="640" y="192" text-anchor="middle" font-size="13" fill="#64748b">users + filter ni</text>
  <text x="640" y="208" text-anchor="middle" font-size="13" fill="#64748b">birga watch qiladi</text>

  <!-- Widget -->
  <rect x="540" y="360" width="200" height="58" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="640" y="386" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">UserListView (vidjet)</text>
  <text x="640" y="406" text-anchor="middle" font-size="13" fill="#64748b">ref.watch(filtered...)</text>

  <!-- arrows: repo -> users -->
  <path d="M240 181 L284 181" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#fl25grA)"/>
  <!-- users -> filtered -->
  <path d="M490 178 L534 174" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#fl25grA)"/>
  <!-- filter -> filtered -->
  <path d="M490 300 Q560 300 600 218" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#fl25grA)"/>
  <!-- filtered -> widget -->
  <path d="M640 212 L640 354" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#fl25grA)"/>

  <text x="262" y="135" text-anchor="middle" font-size="13" fill="#94a3b8">watch</text>
  <text x="516" y="135" text-anchor="middle" font-size="13" fill="#94a3b8">watch</text>
  <text x="690" y="290" text-anchor="middle" font-size="13" fill="#94a3b8">watch</text>

  <!-- Footer note -->
  <rect x="40" y="436" width="700" height="26" rx="8" fill="#dbeafe" stroke="#027dfd" stroke-width="1.5"/>
  <text x="390" y="454" text-anchor="middle" font-size="13" fill="#0553b1">Strelka = "watch (kuzatadi)". Manba (repo/filter) yangilansa, o'q zanjiri bo'ylab faqat kerakli vidjet qayta quriladi.</text>
</svg>
