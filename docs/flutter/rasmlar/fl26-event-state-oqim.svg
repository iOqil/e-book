<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" font-family="Segoe UI, system-ui, sans-serif">
  <title>Bloc bir yo'nalishli oqim: UI Event qo'shadi, Bloc on Event ishlovchisi uni qabul qiladi va yangi State emit qiladi, BlocBuilder UI ni qayta quradi</title>
  <rect x="0" y="0" width="780" height="430" fill="#f8fafc"/>

  <text x="390" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">Bloc &#8212; bir yo'nalishli ma'lumot oqimi</text>
  <text x="390" y="56" text-anchor="middle" font-size="14" fill="#475569">Event &#8594; Bloc &#8594; State &#8594; UI (doimo bir tomonga)</text>

  <!-- UI box -->
  <rect x="40" y="90" width="200" height="250" rx="14" fill="#ffffff" stroke="#027dfd" stroke-width="2.5"/>
  <text x="140" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#027dfd">UI (ekran)</text>
  <text x="140" y="144" text-anchor="middle" font-size="13" fill="#475569">tugma bosilgan,</text>
  <text x="140" y="162" text-anchor="middle" font-size="13" fill="#475569">forma yuborilgan</text>

  <rect x="62" y="240" width="156" height="78" rx="10" fill="#dbeafe" stroke="#027dfd" stroke-width="1.5"/>
  <text x="140" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#0553b1">BlocBuilder</text>
  <text x="140" y="286" text-anchor="middle" font-size="13" fill="#475569">yangi State kelsa</text>
  <text x="140" y="304" text-anchor="middle" font-size="13" fill="#475569">qayta quradi</text>

  <!-- Bloc box -->
  <rect x="540" y="90" width="200" height="250" rx="14" fill="#ffffff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="640" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#6366f1">Bloc</text>
  <text x="640" y="142" text-anchor="middle" font-size="13" fill="#475569">biznes-mantiq</text>

  <rect x="562" y="160" width="156" height="62" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="640" y="184" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">on&lt;Event&gt;(</text>
  <text x="640" y="204" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">(e, emit) {...})</text>

  <rect x="562" y="240" width="156" height="78" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="640" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#16a34a">emit(newState)</text>
  <text x="640" y="286" text-anchor="middle" font-size="13" fill="#475569">yangi holatni</text>
  <text x="640" y="304" text-anchor="middle" font-size="13" fill="#475569">chiqaradi</text>

  <!-- Event arrow: UI -> Bloc (top) -->
  <line x1="240" y1="150" x2="538" y2="150" stroke="#f59e0b" stroke-width="3"/>
  <polygon points="538,144 552,150 538,156" fill="#f59e0b"/>
  <rect x="318" y="118" width="142" height="28" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="389" y="137" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">add(Event())</text>

  <!-- State arrow: Bloc -> UI (bottom) -->
  <line x1="540" y1="280" x2="222" y2="280" stroke="#16a34a" stroke-width="3"/>
  <polygon points="222,274 208,280 222,286" fill="#16a34a"/>
  <rect x="318" y="294" width="142" height="28" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="389" y="313" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">yangi State</text>

  <!-- bottom note -->
  <rect x="170" y="372" width="440" height="40" rx="20" fill="#027dfd"/>
  <text x="390" y="397" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Har bir o'zgarish oshkora &#8212; kuzatish va test oson</text>
</svg>
