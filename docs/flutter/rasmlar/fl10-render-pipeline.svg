<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" font-family="Segoe UI, system-ui, sans-serif">
  <title>Render quvuri: Dart widgetlari -> Flutter freymvorki daraxt quradi -> Impeller dvigateli -> GPU -> ekrandagi piksellar; Flutter har bir pikselni o'zi chizadi, shuning uchun Android va iOS'da bir xil ko'rinadi</title>
  <rect x="0" y="0" width="800" height="430" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Kodingiz ekrandagi pikselga qanday aylanadi</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#475569">Flutter OEM tugmalarini ishlatmaydi — har bir pikselni o'zi chizadi</text>

  <!-- Stage 1: Dart widgets -->
  <rect x="30" y="120" width="160" height="96" rx="14" fill="#ffffff" stroke="#027dfd" stroke-width="2.5"/>
  <text x="110" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#027dfd">Dart widgetlar</text>
  <text x="110" y="174" text-anchor="middle" font-size="13" fill="#475569">siz yozgan kod</text>
  <text x="110" y="194" text-anchor="middle" font-size="13" fill="#64748b">MaterialApp...</text>

  <line x1="190" y1="168" x2="226" y2="168" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="226,168 214,162 214,174" fill="#94a3b8"/>

  <!-- Stage 2: Framework builds tree -->
  <rect x="228" y="120" width="160" height="96" rx="14" fill="#ffffff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="308" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#6366f1">Flutter freymvork</text>
  <text x="308" y="174" text-anchor="middle" font-size="13" fill="#475569">widget daraxtini</text>
  <text x="308" y="194" text-anchor="middle" font-size="13" fill="#64748b">quradi va joylaydi</text>

  <line x1="388" y1="168" x2="424" y2="168" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="424,168 412,162 412,174" fill="#94a3b8"/>

  <!-- Stage 3: Impeller engine -->
  <rect x="426" y="120" width="160" height="96" rx="14" fill="#6366f1"/>
  <text x="506" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Impeller dvigatel</text>
  <text x="506" y="174" text-anchor="middle" font-size="13" fill="#ffffff">chizish buyruqlari</text>
  <text x="506" y="194" text-anchor="middle" font-size="13" fill="#ffffff">(standart renderer)</text>

  <line x1="586" y1="168" x2="622" y2="168" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="622,168 610,162 610,174" fill="#94a3b8"/>

  <!-- Stage 4: GPU -> pixels -->
  <rect x="624" y="120" width="150" height="96" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="699" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">GPU -> ekran</text>
  <text x="699" y="174" text-anchor="middle" font-size="13" fill="#475569">piksellar</text>
  <text x="699" y="194" text-anchor="middle" font-size="13" fill="#64748b">chiziladi</text>

  <!-- Consistency note -->
  <rect x="120" y="270" width="560" height="120" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">Flutter hamma narsani o'zi chizadi</text>
  <text x="400" y="328" text-anchor="middle" font-size="14" fill="#475569">JS ko'prik (bridge) yo'q — Dart to'g'ridan native mashina kodiga kompilyatsiya bo'ladi.</text>
  <text x="400" y="352" text-anchor="middle" font-size="14" fill="#475569">Tugmani platforma emas, Flutter chizadi — shuning uchun u har joyda bir xil.</text>
  <rect x="250" y="362" width="140" height="20" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="377" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">Android</text>
  <rect x="410" y="362" width="140" height="20" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="480" y="377" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">iOS — bir xil ko'rinish</text>
</svg>
