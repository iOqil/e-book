<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Segoe UI, system-ui, sans-serif">
  <title>Hero animatsiya: A ekranda kichik rasm (thumbnail) bor, foydalanuvchi unga bosib B ekranga o'tganda o'sha rasm uchib borib katta rasmga aylanadi. Ikkala ekrandagi Hero ham bir xil tag bilan belgilangani uchun Flutter ularni bog'lab, umumiy element o'tishi (shared element transition) hosil qiladi.</title>
  <rect x="0" y="0" width="800" height="450" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Hero animatsiya: umumiy element o'tishi</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#475569">Bir xil tag — rasm A ekrandan B ekranga uchib o'tadi</text>

  <!-- Screen A phone -->
  <rect x="60" y="92" width="200" height="300" rx="22" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
  <text x="160" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">A ekran (ro'yxat)</text>
  <!-- small thumbnail -->
  <rect x="92" y="140" width="60" height="60" rx="10" fill="#0ea5e9" stroke="#0553b1" stroke-width="2"/>
  <text x="122" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">rasm</text>
  <text x="170" y="165" font-size="13" fill="#64748b">kichik</text>
  <text x="170" y="183" font-size="13" fill="#64748b">thumbnail</text>
  <rect x="92" y="216" width="136" height="14" rx="5" fill="#dbeafe"/>
  <rect x="92" y="238" width="100" height="14" rx="5" fill="#dbeafe"/>
  <rect x="92" y="300" width="136" height="14" rx="5" fill="#e0e7ff"/>
  <rect x="92" y="322" width="110" height="14" rx="5" fill="#e0e7ff"/>
  <text x="160" y="372" text-anchor="middle" font-size="13" fill="#027dfd">bosing &#8594;</text>

  <!-- tag label A -->
  <rect x="84" y="206" width="76" height="0" />
  <text x="122" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#0553b1">tag: 'rasm-7'</text>

  <!-- flight arrow + growing shape -->
  <path d="M170 168 C320 150, 420 230, 540 250" stroke="#9333ea" stroke-width="3" fill="none" stroke-dasharray="7 5"/>
  <polygon points="540,250 526,245 530,258" fill="#9333ea"/>
  <rect x="300" y="170" width="44" height="44" rx="8" fill="#0ea5e9" opacity="0.55"/>
  <rect x="380" y="195" width="64" height="64" rx="9" fill="#0ea5e9" opacity="0.75"/>
  <text x="370" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#9333ea">uchib + kattalashib boradi</text>
  <text x="370" y="300" text-anchor="middle" font-size="13" fill="#64748b">navigatsiya paytida avtomatik</text>

  <!-- Screen B phone -->
  <rect x="540" y="92" width="200" height="300" rx="22" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
  <text x="640" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">B ekran (tafsilot)</text>
  <!-- big image -->
  <rect x="568" y="138" width="144" height="120" rx="12" fill="#0ea5e9" stroke="#0553b1" stroke-width="2.5"/>
  <text x="640" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">rasm (katta)</text>
  <text x="640" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#0553b1">tag: 'rasm-7'</text>
  <rect x="568" y="276" width="144" height="14" rx="5" fill="#dbeafe"/>
  <rect x="568" y="300" width="120" height="14" rx="5" fill="#dbeafe"/>
  <rect x="568" y="324" width="136" height="14" rx="5" fill="#dbeafe"/>

  <!-- bottom note -->
  <rect x="60" y="402" width="680" height="38" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="426" text-anchor="middle" font-size="13" fill="#475569">Sir oddiy: ikkala ekranda ham <tspan font-weight="700" fill="#16a34a">Hero(tag: 'rasm-7')</tspan> — bir xil tag bo'lsa, Flutter o'tishni o'zi quradi.</text>
</svg>
