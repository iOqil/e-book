<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" width="780" height="460" font-family="Segoe UI, system-ui, sans-serif">
  <title>ColorScheme.fromSeed: bitta urug' rang (indigo) beriladi va Flutter undan butun uyg'un palitra — primary, secondary, surface, error va ularning on-ranglari — avtomatik yaratadi. Bir rang butun palitraga aylanadi.</title>
  <rect x="0" y="0" width="780" height="460" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">ColorScheme.fromSeed — 1 rang, butun palitra</text>
  <text x="390" y="58" text-anchor="middle" font-size="14" fill="#475569">Siz bitta urug' (seed) rang berasiz — Flutter qolgan barcha mos ranglarni o'zi hisoblaydi</text>

  <!-- Seed color -->
  <rect x="40" y="150" width="150" height="120" rx="14" fill="#4f46e5"/>
  <text x="115" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">urug' (seed)</text>
  <text x="115" y="226" text-anchor="middle" font-size="14" fill="#e0e7ff">Colors.indigo</text>
  <text x="115" y="290" text-anchor="middle" font-size="13" fill="#475569">1 ta rang</text>

  <!-- Arrow + label -->
  <line x1="192" y1="210" x2="252" y2="210" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="252,210 238,203 238,217" fill="#94a3b8"/>
  <text x="222" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#6366f1">fromSeed</text>

  <!-- Generated palette container -->
  <rect x="262" y="98" width="488" height="290" rx="14" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="506" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#6366f1">avtomatik yaratilgan uyg'un palitra</text>

  <!-- primary -->
  <rect x="286" y="140" width="100" height="64" rx="9" fill="#4f46e5"/>
  <text x="336" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">primary</text>
  <text x="336" y="190" text-anchor="middle" font-size="13" fill="#e0e7ff">onPrimary</text>

  <!-- secondary -->
  <rect x="398" y="140" width="100" height="64" rx="9" fill="#6366f1"/>
  <text x="448" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">secondary</text>
  <text x="448" y="190" text-anchor="middle" font-size="13" fill="#e0e7ff">onSecondary</text>

  <!-- surface -->
  <rect x="510" y="140" width="100" height="64" rx="9" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="560" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">surface</text>
  <text x="560" y="190" text-anchor="middle" font-size="13" fill="#475569">onSurface</text>

  <!-- error -->
  <rect x="622" y="140" width="100" height="64" rx="9" fill="#ef4444"/>
  <text x="672" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">error</text>
  <text x="672" y="190" text-anchor="middle" font-size="13" fill="#ffffff">onError</text>

  <!-- second row: tints -->
  <rect x="286" y="222" width="100" height="50" rx="9" fill="#dbeafe" stroke="#027dfd" stroke-width="1.5"/>
  <text x="336" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#0553b1">primaryContainer</text>
  <rect x="398" y="222" width="100" height="50" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="448" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">tertiary</text>
  <rect x="510" y="222" width="100" height="50" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="560" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">surfaceVariant</text>
  <rect x="622" y="222" width="100" height="50" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="672" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">outline</text>

  <text x="506" y="306" text-anchor="middle" font-size="13" fill="#475569">Har bir rang juftiga "on" rang ham bor: primary ustiga onPrimary yoziladi —</text>
  <text x="506" y="326" text-anchor="middle" font-size="13" fill="#475569">matn fonga doim ko'rinarli (kontrast kafolatlangan)</text>
  <text x="506" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">Bir marta urug' bering — butun ilova uyg'un va kontrastli bo'ladi</text>

  <text x="390" y="430" text-anchor="middle" font-size="14" fill="#475569">ColorScheme.fromSeed(seedColor: Colors.indigo)  →  ThemeData(colorScheme: ...)</text>
</svg>
