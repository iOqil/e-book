<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" font-family="Segoe UI, system-ui, sans-serif">
  <title>Uch xil parametr turi: positional, named va optional positional — har biri chaqirish misoli bilan</title>

  <rect x="0" y="0" width="780" height="420" fill="#f8fafc"/>

  <text x="390" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">Parametrlarning uch turi</text>

  <!-- ===== 1. POSITIONAL ===== -->
  <rect x="24" y="64" width="232" height="300" rx="12" fill="#ffffff" stroke="#027dfd" stroke-width="2"/>
  <rect x="24" y="64" width="232" height="40" rx="12" fill="#027dfd"/>
  <text x="140" y="91" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">1. Positional</text>

  <text x="140" y="138" text-anchor="middle" font-size="15" fill="#475569">qavs: ( )</text>
  <rect x="44" y="156" width="192" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="140" y="181" text-anchor="middle" font-size="14" fill="#1e293b">f(int a, int b)</text>

  <text x="140" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Chaqirish:</text>
  <rect x="44" y="246" width="192" height="38" rx="6" fill="#dbeafe"/>
  <text x="140" y="270" text-anchor="middle" font-size="14" fill="#027dfd">f(3, 5)</text>

  <text x="140" y="316" text-anchor="middle" font-size="13" fill="#64748b">tartib bilan,</text>
  <text x="140" y="336" text-anchor="middle" font-size="13" fill="#64748b">majburiy</text>

  <!-- ===== 2. NAMED ===== -->
  <rect x="274" y="64" width="232" height="300" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="274" y="64" width="232" height="40" rx="12" fill="#16a34a"/>
  <text x="390" y="91" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">2. Named</text>

  <text x="390" y="138" text-anchor="middle" font-size="15" fill="#475569">qavs: { }</text>
  <rect x="294" y="156" width="192" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="390" y="181" text-anchor="middle" font-size="13" fill="#1e293b">f({required a, b = 0})</text>

  <text x="390" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Chaqirish:</text>
  <rect x="294" y="246" width="192" height="38" rx="6" fill="#dcfce7"/>
  <text x="390" y="270" text-anchor="middle" font-size="14" fill="#16a34a">f(a: 3, b: 5)</text>

  <text x="390" y="316" text-anchor="middle" font-size="13" fill="#64748b">nomi bilan, oqiluvchan</text>
  <text x="390" y="336" text-anchor="middle" font-size="13" fill="#64748b">(Flutter doim shu!)</text>

  <!-- ===== 3. OPTIONAL POSITIONAL ===== -->
  <rect x="524" y="64" width="232" height="300" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <rect x="524" y="64" width="232" height="40" rx="12" fill="#f59e0b"/>
  <text x="640" y="91" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">3. Optional positional</text>

  <text x="640" y="138" text-anchor="middle" font-size="15" fill="#475569">qavs: [ ]</text>
  <rect x="544" y="156" width="192" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="640" y="181" text-anchor="middle" font-size="14" fill="#1e293b">f(int a, [int b])</text>

  <text x="640" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Chaqirish:</text>
  <rect x="544" y="246" width="192" height="38" rx="6" fill="#fef3c7"/>
  <text x="640" y="270" text-anchor="middle" font-size="14" fill="#1e293b">f(3)  yoki  f(3, 5)</text>

  <text x="640" y="316" text-anchor="middle" font-size="13" fill="#64748b">tartib bilan,</text>
  <text x="640" y="336" text-anchor="middle" font-size="13" fill="#64748b">ixtiyoriy</text>

  <!-- pastki izoh -->
  <text x="390" y="398" text-anchor="middle" font-size="13.5" fill="#475569">Bittagina aniq parametr &#8594; positional · kop yoki chalkash &#8594; named · ixtiyoriy qoshimcha &#8594; [ ]</text>
</svg>
