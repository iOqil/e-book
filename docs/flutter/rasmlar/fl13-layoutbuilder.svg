<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>LayoutBuilder ota kengligini o'qiydi: agar maxWidth 600 dan kichik bo'lsa bloklarni Column qilib ustun joylaydi, 600 dan katta yoki teng bo'lsa Row qilib yonma-yon joylaydi — cheklovga qarab moslashuvchi tarmoq</title>
  <defs>
    <marker id="fl13lbA" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="470" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">LayoutBuilder — joyga qarab moslashadi</text>
  <text x="390" y="58" text-anchor="middle" font-size="14" fill="#475569">ota kengligini o'qib (constraints.maxWidth), to'g'ri joylashuvni tanlaydi</text>

  <!-- decision box -->
  <rect x="290" y="80" width="200" height="58" rx="12" fill="#6366f1"/>
  <text x="390" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">LayoutBuilder</text>
  <text x="390" y="126" text-anchor="middle" font-size="13" fill="#e0e7ff">maxWidth &gt; 600 ?</text>

  <!-- branch arrows -->
  <line x1="320" y1="138" x2="200" y2="178" stroke="#475569" stroke-width="2.5" marker-end="url(#fl13lbA)"/>
  <line x1="460" y1="138" x2="580" y2="178" stroke="#475569" stroke-width="2.5" marker-end="url(#fl13lbA)"/>
  <text x="225" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#ef4444">tor (&lt; 600)</text>
  <text x="560" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">keng (&ge; 600)</text>

  <!-- ===== Narrow: Column (phone) ===== -->
  <text x="180" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">Telefon → Column</text>
  <rect x="110" y="210" width="140" height="230" rx="14" fill="#ffffff" stroke="#ef4444" stroke-width="2.5"/>
  <!-- stacked blocks -->
  <rect x="126" y="226" width="108" height="60" rx="8" fill="#dbeafe" stroke="#027dfd" stroke-width="2"/>
  <text x="180" y="261" text-anchor="middle" font-size="14" font-weight="700" fill="#0553b1">Ro'yxat</text>
  <rect x="126" y="294" width="108" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="180" y="329" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">Tafsilot</text>
  <rect x="126" y="362" width="108" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="180" y="397" text-anchor="middle" font-size="14" font-weight="700" fill="#f59e0b">Izoh</text>
  <text x="180" y="436" text-anchor="middle" font-size="13" fill="#475569">ustma-ust (vertikal)</text>

  <!-- ===== Wide: Row (tablet) ===== -->
  <text x="560" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">Planshet → Row</text>
  <rect x="400" y="210" width="320" height="170" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <rect x="416" y="226" width="90" height="138" rx="8" fill="#dbeafe" stroke="#027dfd" stroke-width="2"/>
  <text x="461" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#0553b1">Ro'yxat</text>
  <rect x="514" y="226" width="90" height="138" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="559" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">Tafsilot</text>
  <rect x="612" y="226" width="90" height="138" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="657" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#f59e0b">Izoh</text>
  <text x="560" y="402" text-anchor="middle" font-size="13" fill="#475569">yonma-yon (gorizontal) — keng joydan foydalanadi</text>

  <text x="390" y="456" text-anchor="middle" font-size="13" fill="#94a3b8">Bitta kod, ikki ko'rinish — bu responsive UI'ning asosi (28-bobda kengayadi)</text>
</svg>
