<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" font-family="Segoe UI, system-ui, sans-serif">
  <title>Bitta Flutter kod bazasidan to'rt platformaga: Android, iOS, web va desktop</title>
  <defs>
    <marker id="cp-ar" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0553b1"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="420" fill="#f8fafc"/>

  <text x="390" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Bitta kod — ko'p platforma</text>
  <text x="390" y="58" text-anchor="middle" font-size="14" fill="#475569">Bir marta Dart'da yozasiz, Flutter to'rt joyga ilova quradi</text>

  <!-- markaz: kod bazasi -->
  <rect x="300" y="180" width="180" height="100" rx="12" fill="#027dfd" stroke="#0553b1" stroke-width="2.5"/>
  <text x="390" y="214" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Bitta kod bazasi</text>
  <text x="390" y="238" text-anchor="middle" font-size="14" fill="#ffffff">Dart + Flutter</text>
  <text x="390" y="260" text-anchor="middle" font-size="13" fill="#dbeafe">lib/main.dart</text>

  <!-- Android -->
  <line x1="300" y1="205" x2="210" y2="120" stroke="#0553b1" stroke-width="2.5" marker-end="url(#cp-ar)"/>
  <rect x="40" y="80" width="170" height="72" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="125" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#16a34a">Android</text>
  <text x="125" y="134" text-anchor="middle" font-size="13" fill="#475569">telefon va planshet</text>

  <!-- iOS -->
  <line x1="300" y1="255" x2="210" y2="320" stroke="#0553b1" stroke-width="2.5" marker-end="url(#cp-ar)"/>
  <rect x="40" y="300" width="170" height="72" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="125" y="330" text-anchor="middle" font-size="16" font-weight="bold" fill="#6366f1">iOS</text>
  <text x="125" y="354" text-anchor="middle" font-size="13" fill="#475569">iPhone va iPad</text>

  <!-- Web -->
  <line x1="480" y1="205" x2="570" y2="120" stroke="#0553b1" stroke-width="2.5" marker-end="url(#cp-ar)"/>
  <rect x="570" y="80" width="170" height="72" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2.5"/>
  <text x="655" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#0ea5e9">Web</text>
  <text x="655" y="134" text-anchor="middle" font-size="13" fill="#475569">brauzerda</text>

  <!-- Desktop -->
  <line x1="480" y1="255" x2="570" y2="320" stroke="#0553b1" stroke-width="2.5" marker-end="url(#cp-ar)"/>
  <rect x="570" y="300" width="170" height="72" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="655" y="324" text-anchor="middle" font-size="16" font-weight="bold" fill="#b45309">Desktop</text>
  <text x="655" y="348" text-anchor="middle" font-size="13" fill="#475569">Windows·macOS·Linux</text>

  <text x="390" y="402" text-anchor="middle" font-size="14" fill="#1e293b">Native dasturlashda har platforma alohida yoziladi — Flutter'da bittagina kod yetadi.</text>
</svg>
