<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>Hot reload sikli: yozish-saqlash-darhol yangilanish, an'anaviy sekin qayta qurish bilan taqqoslash</title>
  <defs>
    <marker id="hr-ar" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="hr-arr" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="440" fill="#f8fafc"/>

  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Hot reload — Flutter sehrining yuragi</text>

  <!-- HOT RELOAD ribbon (top) -->
  <text x="390" y="68" text-anchor="middle" font-size="15" font-weight="bold" fill="#16a34a">Flutter: Hot reload (bir soniyadan kam)</text>

  <rect x="50" y="86" width="150" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="125" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">Kod yozasiz</text>
  <text x="125" y="136" text-anchor="middle" font-size="13" fill="#475569">matnni o'zgartirish</text>

  <rect x="315" y="86" width="150" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="390" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">Saqlaysiz</text>
  <text x="390" y="136" text-anchor="middle" font-size="13" fill="#475569">Ctrl+S</text>

  <rect x="580" y="86" width="150" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="655" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">Ekran darhol</text>
  <text x="655" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">yangilanadi</text>

  <line x1="200" y1="118" x2="311" y2="118" stroke="#16a34a" stroke-width="2.5" marker-end="url(#hr-ar)"/>
  <line x1="465" y1="118" x2="576" y2="118" stroke="#16a34a" stroke-width="2.5" marker-end="url(#hr-ar)"/>
  <text x="255" y="108" text-anchor="middle" font-size="13" fill="#475569">&lt; 1 soniya</text>

  <!-- loop back arrow -->
  <path d="M655 150 Q655 200 390 200 Q125 200 125 152" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#hr-ar)"/>
  <text x="390" y="194" text-anchor="middle" font-size="13" fill="#16a34a" font-weight="bold">Holat saqlanadi: hisoblagich 7 da qoladi, 0 ga qaytmaydi</text>

  <!-- divider -->
  <line x1="40" y1="228" x2="740" y2="228" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- TRADITIONAL (bottom) -->
  <text x="390" y="258" text-anchor="middle" font-size="15" font-weight="bold" fill="#ef4444">An'anaviy native: to'liq qayta qurish (sekin)</text>

  <rect x="40" y="278" width="150" height="64" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2.5"/>
  <text x="115" y="306" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">Kod yozasiz</text>
  <text x="115" y="328" text-anchor="middle" font-size="13" fill="#475569">o'zgartirish</text>

  <rect x="240" y="278" width="160" height="64" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2.5"/>
  <text x="320" y="302" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">To'liq build</text>
  <text x="320" y="324" text-anchor="middle" font-size="13" fill="#475569">daqiqalab kutish</text>

  <rect x="450" y="278" width="160" height="64" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2.5"/>
  <text x="530" y="302" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">Qayta ishga tushadi</text>
  <text x="530" y="324" text-anchor="middle" font-size="13" fill="#475569">boshidan</text>

  <rect x="650" y="278" width="100" height="64" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="700" y="302" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">Holat</text>
  <text x="700" y="324" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">yo'qoladi</text>

  <line x1="190" y1="310" x2="236" y2="310" stroke="#ef4444" stroke-width="2.5" marker-end="url(#hr-arr)"/>
  <line x1="400" y1="310" x2="446" y2="310" stroke="#ef4444" stroke-width="2.5" marker-end="url(#hr-arr)"/>
  <line x1="610" y1="310" x2="646" y2="310" stroke="#ef4444" stroke-width="2.5" marker-end="url(#hr-arr)"/>

  <text x="390" y="392" text-anchor="middle" font-size="14" fill="#1e293b">Hot reload har bir kichik o'zgarishni soniyada ko'rsatadi — kuniga yuzlab daqiqa tejaladi.</text>
  <text x="390" y="418" text-anchor="middle" font-size="13" fill="#475569">Eslatma: katta o'zgarishda hot restart (R) kerak — u baribir to'liq build'dan tez.</text>
</svg>
