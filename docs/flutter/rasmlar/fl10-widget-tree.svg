<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500" font-family="Segoe UI, system-ui, sans-serif">
  <title>Birinchi ilovaning widget daraxti: MaterialApp ildizdan boshlanib, Scaffold'ga, undan AppBar (ichida Text) va body -> Center -> Text'ga tarmoqlanadi</title>
  <rect x="0" y="0" width="780" height="500" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Widget daraxti — ekran ana shunday qurilgan</text>
  <text x="390" y="58" text-anchor="middle" font-size="14" fill="#475569">Har bir widget boshqasini ichiga oladi: ildizdan barglargacha bitta daraxt</text>

  <!-- Connector lines (drawn first, under boxes) -->
  <line x1="390" y1="108" x2="390" y2="150" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="390" y1="200" x2="390" y2="242" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Scaffold splits to AppBar and body -->
  <line x1="390" y1="292" x2="210" y2="334" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="390" y1="292" x2="570" y2="334" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- AppBar -> Text -->
  <line x1="210" y1="384" x2="210" y2="420" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- body Center -> Text -->
  <line x1="570" y1="384" x2="570" y2="420" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- runApp label -->
  <text x="390" y="100" text-anchor="middle" font-size="13" fill="#64748b">runApp(...) ildizga qo'yadi</text>

  <!-- MaterialApp (root) -->
  <rect x="270" y="116" width="240" height="42" rx="12" fill="#027dfd"/>
  <text x="390" y="143" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">MaterialApp</text>

  <!-- Scaffold -->
  <rect x="280" y="250" width="220" height="42" rx="12" fill="#6366f1"/>
  <text x="390" y="277" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Scaffold</text>
  <text x="390" y="234" text-anchor="middle" font-size="13" fill="#64748b">sahifa skeleti</text>

  <!-- AppBar branch -->
  <rect x="110" y="334" width="200" height="48" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="210" y="357" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">AppBar</text>
  <text x="210" y="375" text-anchor="middle" font-size="13" fill="#64748b">yuqori panel</text>

  <rect x="120" y="420" width="180" height="44" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="210" y="442" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Text('Salomlashuv')</text>
  <text x="210" y="458" text-anchor="middle" font-size="13" fill="#64748b">sarlavha matni</text>

  <!-- body branch -->
  <rect x="470" y="334" width="200" height="48" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="570" y="357" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">Center (body)</text>
  <text x="570" y="375" text-anchor="middle" font-size="13" fill="#64748b">markazga joylaydi</text>

  <rect x="480" y="420" width="180" height="44" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="570" y="442" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Text('Salom!')</text>
  <text x="570" y="458" text-anchor="middle" font-size="13" fill="#64748b">markazdagi matn</text>

  <text x="390" y="490" text-anchor="middle" font-size="13" fill="#94a3b8">Ildiz = MaterialApp; barglar = Text. Flutter shu daraxtni o'qib ekranga chizadi.</text>
</svg>
