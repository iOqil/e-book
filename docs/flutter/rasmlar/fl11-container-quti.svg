<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" width="780" height="480" font-family="Segoe UI, system-ui, sans-serif">
  <title>Container qutisining anatomiyasi: tashqarida margin, keyin border, ichkarida padding va eng ichida child; o'ngda BoxDecoration (rang, burchak radiusi, soya)</title>
  <rect x="0" y="0" width="780" height="480" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Container — qutining qatlamlari</text>
  <text x="390" y="58" text-anchor="middle" font-size="14" fill="#475569">Tashqaridan ichkariga: margin &#8594; border &#8594; padding &#8594; child</text>

  <!-- margin layer -->
  <rect x="60" y="92" width="420" height="330" rx="14" fill="#fef3c7"/>
  <text x="78" y="116" font-size="14" font-weight="700" fill="#f59e0b">margin — tashqi bo'sh joy</text>
  <text x="78" y="135" font-size="13" fill="#64748b">qo'shni widgetlardan uzoqlashtiradi</text>

  <!-- border layer -->
  <rect x="108" y="150" width="324" height="234" rx="12" fill="#ffffff" stroke="#027dfd" stroke-width="3"/>
  <text x="270" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#027dfd">border + borderRadius (chegara)</text>

  <!-- padding layer -->
  <rect x="140" y="190" width="260" height="160" rx="10" fill="#dbeafe"/>
  <text x="270" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#0553b1">padding — ichki bo'sh joy</text>
  <text x="270" y="228" text-anchor="middle" font-size="13" fill="#64748b">child'ni chegaradan uzoqlashtiradi</text>

  <!-- child -->
  <rect x="178" y="248" width="184" height="86" rx="8" fill="#16a34a"/>
  <text x="270" y="288" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">child</text>
  <text x="270" y="312" text-anchor="middle" font-size="13" fill="#dcfce7">ichidagi widget (Text, Icon...)</text>

  <!-- BoxDecoration panel on right -->
  <rect x="510" y="120" width="234" height="300" rx="14" fill="#ffffff" stroke="#6366f1" stroke-width="2.5"/>
  <rect x="510" y="120" width="234" height="38" rx="14" fill="#6366f1"/>
  <text x="627" y="145" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">decoration: BoxDecoration</text>

  <rect x="530" y="174" width="194" height="50" rx="8" fill="#dbeafe"/>
  <text x="546" y="194" font-size="13" font-weight="700" fill="#0553b1">color:</text>
  <text x="546" y="213" font-size="13" fill="#475569">fon rangi</text>

  <rect x="530" y="232" width="194" height="50" rx="8" fill="#dcfce7"/>
  <text x="546" y="252" font-size="13" font-weight="700" fill="#16a34a">borderRadius:</text>
  <text x="546" y="271" font-size="13" fill="#475569">burchaklarni yumaloqlash</text>

  <rect x="530" y="290" width="194" height="50" rx="8" fill="#fef3c7"/>
  <text x="546" y="310" font-size="13" font-weight="700" fill="#f59e0b">boxShadow:</text>
  <text x="546" y="329" font-size="13" fill="#475569">tagidagi soya</text>

  <rect x="530" y="348" width="194" height="50" rx="8" fill="#e0e7ff"/>
  <text x="546" y="368" font-size="13" font-weight="700" fill="#6366f1">border / gradient:</text>
  <text x="546" y="387" font-size="13" fill="#475569">chegara va o'tish ranglari</text>

  <text x="390" y="450" text-anchor="middle" font-size="14" fill="#475569">Eslatma: color'ni decoration BILAN birga bermang — rangni decoration ichiga yozing.</text>
  <text x="390" y="470" text-anchor="middle" font-size="13" fill="#94a3b8">Container — ko'p ishlatiladigan "shveytsariya pichog'i": o'rab, bo'shliq berib, bezaydi.</text>
</svg>
