<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Klass — qolip (kesuvchi kabi), obyekt — undan tayyorlangan haqiqiy narsa; bitta Mashina klassidan har biri o'z maydon qiymatiga ega uchta obyekt yaratiladi</title>
  <rect x="0" y="0" width="780" height="470" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Klass — qolip, obyekt — undan chiqqan narsa</text>
  <text x="390" y="58" text-anchor="middle" font-size="14" fill="#475569">Bitta qolipdan ko'p narsa: har biri bir xil shaklda, lekin o'z qiymati bilan</text>

  <!-- Class (blueprint / cutter) -->
  <rect x="40" y="92" width="250" height="226" rx="14" fill="#ffffff" stroke="#6366f1" stroke-width="2.5"/>
  <rect x="40" y="92" width="250" height="40" rx="14" fill="#6366f1"/>
  <text x="165" y="119" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">class Mashina</text>
  <text x="165" y="153" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">QOLIP (blueprint)</text>
  <text x="165" y="173" text-anchor="middle" font-size="13" fill="#64748b">qiymatlari yo'q — faqat shakl</text>

  <rect x="60" y="190" width="210" height="34" rx="8" fill="#f8fafc"/>
  <text x="76" y="212" font-size="13" font-weight="700" fill="#6366f1">String rang;</text>
  <text x="200" y="212" font-size="13" fill="#64748b">maydon</text>
  <rect x="60" y="232" width="210" height="34" rx="8" fill="#f8fafc"/>
  <text x="76" y="254" font-size="13" font-weight="700" fill="#6366f1">int yili;</text>
  <text x="200" y="254" font-size="13" fill="#64748b">maydon</text>
  <rect x="60" y="274" width="210" height="34" rx="8" fill="#f8fafc"/>
  <text x="76" y="296" font-size="13" font-weight="700" fill="#6366f1">void yur() { ... }</text>
  <text x="200" y="296" font-size="13" fill="#64748b">xatti-harakat</text>

  <!-- Arrow: new -->
  <line x1="290" y1="205" x2="372" y2="205" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="372,205 360,199 360,211" fill="#94a3b8"/>
  <rect x="300" y="178" width="64" height="24" rx="6" fill="#027dfd"/>
  <text x="332" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Mashina()</text>
  <text x="332" y="228" text-anchor="middle" font-size="13" fill="#64748b">obyekt yaratish</text>

  <!-- Objects (instances) -->
  <!-- obj 1 -->
  <rect x="392" y="100" width="346" height="92" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="408" y="125" font-size="14" font-weight="700" fill="#16a34a">obyekt #1</text>
  <rect x="408" y="136" width="140" height="28" rx="6" fill="#f8fafc"/>
  <text x="478" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">rang = 'qizil'</text>
  <rect x="560" y="136" width="160" height="28" rx="6" fill="#f8fafc"/>
  <text x="640" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">yili = 2024</text>
  <text x="408" y="182" font-size="13" fill="#64748b">o'z qiymatlari bilan haqiqiy mashina</text>

  <!-- obj 2 -->
  <rect x="392" y="200" width="346" height="92" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="408" y="225" font-size="14" font-weight="700" fill="#16a34a">obyekt #2</text>
  <rect x="408" y="236" width="140" height="28" rx="6" fill="#f8fafc"/>
  <text x="478" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">rang = 'oq'</text>
  <rect x="560" y="236" width="160" height="28" rx="6" fill="#f8fafc"/>
  <text x="640" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">yili = 2019</text>
  <text x="408" y="282" font-size="13" fill="#64748b">boshqa qiymat — lekin shakl bir xil</text>

  <!-- obj 3 -->
  <rect x="392" y="300" width="346" height="92" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="408" y="325" font-size="14" font-weight="700" fill="#16a34a">obyekt #3</text>
  <rect x="408" y="336" width="140" height="28" rx="6" fill="#f8fafc"/>
  <text x="478" y="355" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">rang = 'qora'</text>
  <rect x="560" y="336" width="160" height="28" rx="6" fill="#f8fafc"/>
  <text x="640" y="355" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">yili = 2026</text>
  <text x="408" y="382" font-size="13" fill="#64748b">yana bir alohida obyekt</text>

  <text x="390" y="430" text-anchor="middle" font-size="14" fill="#475569">Klassni bir marta yozasiz; undan istalgancha obyekt yaratasiz — har biri xotirada alohida yashaydi.</text>
  <text x="390" y="452" text-anchor="middle" font-size="13" fill="#94a3b8">Flutter'da har bir widget — shunday klass; ekrandagi har bir tugma esa — uning obyekti.</text>
</svg>
