<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" width="780" height="520" font-family="Segoe UI, system-ui, sans-serif">
  <title>Material 3 tugmalar ierarxiyasi: yuqori urg'u FilledButton, o'rta urg'u ElevatedButton/FilledButton.tonal/OutlinedButton, past urg'u TextButton, va ixcham IconButton/FloatingActionButton — har biri qachon ishlatilishi bilan</title>
  <rect x="0" y="0" width="780" height="520" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Material 3 tugmalar: urg'u (emphasis) ierarxiyasi</text>
  <text x="390" y="58" text-anchor="middle" font-size="14" fill="#475569">Tugma qanchalik muhim bo'lsa, shunchalik ko'zga tashlanadi. Ekranda 1 ta asosiy harakat tanlang.</text>

  <!-- HIGH -->
  <rect x="40" y="84" width="140" height="86" rx="12" fill="#dbeafe" stroke="#027dfd" stroke-width="2"/>
  <text x="110" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#0553b1">YUQORI urg'u</text>
  <text x="110" y="142" text-anchor="middle" font-size="13" fill="#475569">asosiy harakat</text>
  <text x="110" y="160" text-anchor="middle" font-size="13" fill="#475569">(faqat 1 ta)</text>

  <rect x="210" y="92" width="160" height="42" rx="21" fill="#027dfd"/>
  <text x="290" y="119" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">FilledButton</text>
  <text x="470" y="111" text-anchor="start" font-size="13" fill="#475569">Eng katta urg'u — to'la fon.</text>
  <text x="470" y="131" text-anchor="start" font-size="13" fill="#64748b">"Saqlash", "Davom etish"</text>

  <!-- MEDIUM -->
  <rect x="40" y="184" width="140" height="150" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="110" y="218" text-anchor="middle" font-size="15" font-weight="700" fill="#6366f1">O'RTA urg'u</text>
  <text x="110" y="242" text-anchor="middle" font-size="13" fill="#475569">muhim, lekin</text>
  <text x="110" y="260" text-anchor="middle" font-size="13" fill="#475569">birlamchi emas</text>

  <rect x="210" y="190" width="160" height="40" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="290" y="215" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">ElevatedButton</text>
  <text x="470" y="215" text-anchor="start" font-size="13" fill="#475569">Soyali — rangli fon ustida ajraladi.</text>

  <rect x="210" y="238" width="160" height="40" rx="20" fill="#dbeafe"/>
  <text x="290" y="263" text-anchor="middle" font-size="13" font-weight="700" fill="#0553b1">FilledButton.tonal</text>
  <text x="470" y="263" text-anchor="start" font-size="13" fill="#475569">Yumshoq to'ldirish — ikkilamchi.</text>

  <rect x="210" y="286" width="160" height="40" rx="20" fill="#f8fafc" stroke="#027dfd" stroke-width="2"/>
  <text x="290" y="311" text-anchor="middle" font-size="14" font-weight="700" fill="#027dfd">OutlinedButton</text>
  <text x="470" y="311" text-anchor="start" font-size="13" fill="#475569">Faqat hoshiya — "Bekor qilish".</text>

  <!-- LOW -->
  <rect x="40" y="348" width="140" height="60" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="110" y="378" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">PAST urg'u</text>
  <text x="110" y="398" text-anchor="middle" font-size="13" fill="#475569">eng kam ko'zga</text>

  <rect x="210" y="358" width="160" height="40" rx="20" fill="#f8fafc"/>
  <text x="290" y="383" text-anchor="middle" font-size="14" font-weight="700" fill="#027dfd">TextButton</text>
  <text x="470" y="383" text-anchor="start" font-size="13" fill="#475569">Faqat matn — "Batafsil", linklar.</text>

  <!-- ICON / FAB -->
  <rect x="40" y="422" width="140" height="70" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="110" y="452" text-anchor="middle" font-size="15" font-weight="700" fill="#f59e0b">IXCHAM</text>
  <text x="110" y="472" text-anchor="middle" font-size="13" fill="#475569">faqat ikonka,</text>
  <text x="110" y="488" text-anchor="middle" font-size="13" fill="#475569">joy tejaydi</text>

  <circle cx="232" cy="457" r="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="232" y="463" text-anchor="middle" font-size="16" fill="#475569">+</text>
  <text x="232" y="492" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">IconButton</text>

  <circle cx="332" cy="457" r="22" fill="#027dfd"/>
  <text x="332" y="464" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">+</text>
  <text x="332" y="497" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">FAB</text>

  <text x="560" y="457" text-anchor="middle" font-size="13" fill="#475569">IconButton — panel/satr ichida.</text>
  <text x="560" y="477" text-anchor="middle" font-size="13" fill="#64748b">FAB — ekranning asosiy harakati.</text>

  <line x1="40" y1="178" x2="370" y2="178" stroke="#e0e7ff" stroke-width="1"/>
  <line x1="40" y1="342" x2="370" y2="342" stroke="#e0e7ff" stroke-width="1"/>
  <line x1="40" y1="416" x2="370" y2="416" stroke="#e0e7ff" stroke-width="1"/>
</svg>
