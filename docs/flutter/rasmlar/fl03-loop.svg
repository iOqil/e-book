<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>for sikli aylanasi: init bilan boshlanadi, shart tekshiriladi, rost bo'lsa tana bajariladi va yangilash bo'ladi keyin qaytadi, shart yolg'on bo'lganda sikldan chiqadi</title>
  <defs>
    <marker id="fl03lp" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="470" fill="#f8fafc"/>

  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Sikl aylanasi — for (var i = 0; i &lt; 3; i++)</text>
  <text x="390" y="56" text-anchor="middle" font-size="14" fill="#475569">init bir marta, keyin shart -&gt; tana -&gt; yangilash takrorlanadi</text>

  <!-- init -->
  <rect x="290" y="80" width="200" height="48" rx="10" fill="#dbeafe" stroke="#027dfd" stroke-width="2.5"/>
  <text x="390" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">1. init: var i = 0</text>
  <text x="390" y="118" text-anchor="middle" font-size="13" fill="#475569">faqat bir marta bajariladi</text>
  <line x1="390" y1="128" x2="390" y2="158" stroke="#475569" stroke-width="2" marker-end="url(#fl03lp)"/>

  <!-- shart romb -->
  <polygon points="390,163 510,213 390,263 270,213" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="390" y="208" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">2. i &lt; 3 ?</text>
  <text x="390" y="230" text-anchor="middle" font-size="13" fill="#475569">shart</text>

  <!-- chiqish (yolg'on) o'ngga -->
  <line x1="510" y1="213" x2="640" y2="213" stroke="#ef4444" stroke-width="2.5" marker-end="url(#fl03lp)"/>
  <text x="575" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#ef4444">false</text>
  <rect x="645" y="188" width="110" height="50" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2.5"/>
  <text x="700" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Chiqish</text>
  <text x="700" y="228" text-anchor="middle" font-size="13" fill="#475569">sikl tugadi</text>

  <!-- tana (rost) pastga -->
  <line x1="390" y1="263" x2="390" y2="293" stroke="#16a34a" stroke-width="2.5" marker-end="url(#fl03lp)"/>
  <text x="415" y="283" text-anchor="middle" font-size="13" font-weight="bold" fill="#16a34a">true</text>

  <rect x="290" y="293" width="200" height="48" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="390" y="313" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">3. tana: print(i)</text>
  <text x="390" y="331" text-anchor="middle" font-size="13" fill="#475569">har aylanishda bajariladi</text>
  <line x1="390" y1="341" x2="390" y2="368" stroke="#475569" stroke-width="2" marker-end="url(#fl03lp)"/>

  <!-- yangilash -->
  <rect x="290" y="368" width="200" height="48" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="390" y="388" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">4. yangilash: i++</text>
  <text x="390" y="406" text-anchor="middle" font-size="13" fill="#475569">i ni 1 ga oshiradi</text>

  <!-- qaytish strelkasi: yangilash -> shart (chap aylanma) -->
  <line x1="290" y1="392" x2="130" y2="392" stroke="#6366f1" stroke-width="2.5"/>
  <line x1="130" y1="392" x2="130" y2="213" stroke="#6366f1" stroke-width="2.5"/>
  <line x1="130" y1="213" x2="266" y2="213" stroke="#6366f1" stroke-width="2.5" marker-end="url(#fl03lp)"/>
  <text x="130" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#6366f1" transform="rotate(-90 130 305)">shartga qaytadi</text>

  <!-- iteratsiyalar izoh -->
  <rect x="540" y="290" width="215" height="130" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="647" y="314" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Aylanishlar</text>
  <text x="555" y="340" font-size="13" fill="#475569">i = 0  ->  shart rost  ->  0</text>
  <text x="555" y="362" font-size="13" fill="#475569">i = 1  ->  shart rost  ->  1</text>
  <text x="555" y="384" font-size="13" fill="#475569">i = 2  ->  shart rost  ->  2</text>
  <text x="555" y="406" font-size="13" fill="#ef4444">i = 3  ->  shart yolg'on  -> chiqish</text>
</svg>
