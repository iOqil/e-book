<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470">
  <title>Uchta to'plam yonma-yon: List (tartibli, indeksli), Set (takrorsiz, tartibsiz), Map (kalit-qiymat juftliklari)</title>
  <rect x="0" y="0" width="800" height="470" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="bold" fill="#1e293b">Dart'ning uchta to'plami</text>
  <text x="400" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Har biri ma'lumotni boshqacha tartibga soladi &#8212; vazifaga qarab tanlaysiz</text>

  <!-- ===== LIST ===== -->
  <rect x="24" y="80" width="240" height="340" rx="12" fill="#ffffff" stroke="#027dfd" stroke-width="2"/>
  <text x="144" y="110" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#027dfd">List</text>
  <text x="144" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tartibli &#183; indeksli</text>

  <!-- boxes with indexes -->
  <rect x="48" y="156" width="64" height="48" rx="6" fill="#027dfd"/>
  <text x="80" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">olma</text>
  <rect x="112" y="156" width="64" height="48" rx="6" fill="#027dfd"/>
  <text x="144" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">non</text>
  <rect x="176" y="156" width="64" height="48" rx="6" fill="#027dfd"/>
  <text x="208" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">sut</text>

  <text x="80" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">[0]</text>
  <text x="144" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">[1]</text>
  <text x="208" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">[2]</text>

  <text x="144" y="262" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#1e293b">['olma','non','sut']</text>
  <text x="144" y="296" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">&#10003; tartib saqlanadi</text>
  <text x="144" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">&#10003; indeks bilan olasiz</text>
  <text x="144" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">&#10003; takror bo'lishi mumkin</text>
  <text x="144" y="378" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">"Xarid ro'yxati"</text>
  <text x="144" y="400" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">tartib muhim narsalar</text>

  <!-- ===== SET ===== -->
  <rect x="280" y="80" width="240" height="340" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="400" y="110" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#6366f1">Set</text>
  <text x="400" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">takrorsiz &#183; tartibsiz</text>

  <!-- unique circles, no order -->
  <circle cx="345" cy="180" r="30" fill="#6366f1"/>
  <text x="345" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">olma</text>
  <circle cx="430" cy="172" r="30" fill="#6366f1"/>
  <text x="430" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">non</text>
  <circle cx="392" cy="232" r="30" fill="#6366f1"/>
  <text x="392" y="238" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">sut</text>

  <text x="400" y="288" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#1e293b">{'olma','non','sut'}</text>
  <text x="400" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ef4444">&#10007; indeks yo'q</text>
  <text x="400" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">&#10003; takror avtomatik tushadi</text>
  <text x="400" y="378" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">"Mehmonlar ro'yxati"</text>
  <text x="400" y="400" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">har kim bir marta</text>

  <!-- ===== MAP ===== -->
  <rect x="536" y="80" width="240" height="340" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="656" y="110" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#f59e0b">Map</text>
  <text x="656" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">kalit &#8594; qiymat</text>

  <!-- key->value pairs -->
  <rect x="556" y="152" width="92" height="40" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="602" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">'ism'</text>
  <text x="664" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#f59e0b">&#8594;</text>
  <rect x="676" y="152" width="80" height="40" rx="6" fill="#f59e0b"/>
  <text x="716" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">'Ali'</text>

  <rect x="556" y="204" width="92" height="40" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="602" y="230" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">'yosh'</text>
  <text x="664" y="230" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#f59e0b">&#8594;</text>
  <rect x="676" y="204" width="80" height="40" rx="6" fill="#f59e0b"/>
  <text x="716" y="230" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">25</text>

  <text x="656" y="288" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">{'ism':'Ali','yosh':25}</text>
  <text x="656" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">&#10003; kalit bilan olasiz</text>
  <text x="656" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">&#10003; kalit takrorlanmaydi</text>
  <text x="656" y="378" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">"Telefon kitobi"</text>
  <text x="656" y="400" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">ism &#8594; raqam</text>

  <text x="400" y="452" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b" font-style="italic">Tartib kerakmi? &#8594; List. Takrorsizlik kerakmi? &#8594; Set. Nom bilan topishmi? &#8594; Map.</text>
</svg>
