<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Kadr byudjeti: 16 millisekund ichiga sig'gan kadr (UI build + raster) silliq va yashil, byudjetdan oshib ketgan kadr esa jank/tushgan kadr va qizil; tuzatish usullari const widgetlar, dangasa ro'yxatlar va kamroq rebuild</title>
  <rect x="0" y="0" width="780" height="470" fill="#f8fafc"/>
  <text x="390" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Kadr byudjeti: 16 ms ichiga sig'sa — silliq</text>
  <text x="390" y="60" text-anchor="middle" font-size="14" fill="#475569">60 FPS = har kadrga ~16 ms (120 FPS = ~8 ms). Oshsa — jank</text>

  <!-- budget line marker -->
  <text x="345" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#ef4444">16 ms byudjet chizig'i</text>
  <line x1="60" y1="100" x2="720" y2="100" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="8 5"/>

  <!-- GOOD frame (under budget) -->
  <text x="220" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">Silliq kadr (12 ms)</text>
  <!-- UI build segment -->
  <rect x="120" y="140" width="120" height="46" rx="6" fill="#16a34a"/>
  <text x="180" y="168" text-anchor="middle" font-size="13" fill="#ffffff">UI: build (7 ms)</text>
  <!-- raster segment -->
  <rect x="240" y="140" width="80" height="46" rx="6" fill="#0ea5e9"/>
  <text x="280" y="168" text-anchor="middle" font-size="13" fill="#ffffff">raster (5)</text>
  <!-- under budget tick -->
  <rect x="324" y="148" width="84" height="30" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="366" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">sig'di</text>

  <!-- BAD frame (over budget) -->
  <text x="250" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#ef4444">Jank kadr (24 ms)</text>
  <rect x="120" y="238" width="180" height="46" rx="6" fill="#ef4444"/>
  <text x="210" y="266" text-anchor="middle" font-size="13" fill="#ffffff">UI: og'ir build (16 ms)</text>
  <rect x="300" y="238" width="120" height="46" rx="6" fill="#f59e0b"/>
  <text x="360" y="266" text-anchor="middle" font-size="13" fill="#ffffff">raster (8 ms)</text>
  <!-- over budget marker -->
  <line x1="420" y1="230" x2="420" y2="292" stroke="#ef4444" stroke-width="2.5"/>
  <text x="498" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#ef4444">byudjetdan oshdi</text>
  <text x="498" y="278" text-anchor="middle" font-size="13" fill="#64748b">kadr tushadi = jank</text>

  <!-- second budget reference for bad frame -->
  <line x1="120" y1="300" x2="324" y2="300" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="222" y="316" text-anchor="middle" font-size="13" fill="#94a3b8">16 ms shu yerda tugaydi — qolgani kechikish</text>

  <!-- Fixes box -->
  <rect x="120" y="336" width="540" height="104" rx="12" fill="#dbeafe" stroke="#027dfd" stroke-width="2"/>
  <text x="390" y="362" text-anchor="middle" font-size="15" font-weight="700" fill="#0553b1">Tuzatish — kadrdan keraksiz ishni olib tashlash</text>
  <text x="148" y="388" font-size="13" fill="#1e293b">• const widgetlar — qayta qurilmaydi</text>
  <text x="148" y="410" font-size="13" fill="#1e293b">• granular holat — kamroq rebuild</text>
  <text x="148" y="432" font-size="13" fill="#1e293b">• build ichida og'ir ish qilmang</text>
  <text x="430" y="388" font-size="13" fill="#1e293b">• ListView.builder — dangasa ro'yxat</text>
  <text x="430" y="410" font-size="13" fill="#1e293b">• RepaintBoundary — qismni ajratish</text>
  <text x="430" y="432" font-size="13" fill="#1e293b">• --profile rejimida o'lchang</text>
</svg>
