<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Stack: pastda rasm qatlami, ustiga Positioned bilan o'ng-yuqoriga nishon (badge), eng tepada pastki gradient ustida matn — qatlamlar bir-birining ustiga ustma-ust joylanadi (z-tartib)</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Stack — qatlamlarni ustma-ust qo'yadi</text>
  <text x="380" y="58" text-anchor="middle" font-size="14" fill="#475569">children ro'yxatidagi tartib = chizish tartibi (oxirgisi eng ustda)</text>

  <!-- ===== Left: stacked layers exploded ===== -->
  <text x="200" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">Qatlamlar (pastdan tepaga)</text>

  <!-- layer 1: base image -->
  <rect x="70" y="108" width="260" height="80" rx="10" fill="#dbeafe" stroke="#027dfd" stroke-width="2"/>
  <text x="200" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#0553b1">1. Image (asos)</text>
  <text x="200" y="162" text-anchor="middle" font-size="13" fill="#475569">eng pastki qatlam — fon rasmi</text>

  <!-- layer 2: gradient + text -->
  <rect x="70" y="204" width="260" height="80" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="200" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#6366f1">2. gradient + Text</text>
  <text x="200" y="258" text-anchor="middle" font-size="13" fill="#475569">pastda qora-shaffof + sarlavha</text>

  <!-- layer 3: positioned badge -->
  <rect x="70" y="300" width="260" height="80" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="200" y="332" text-anchor="middle" font-size="15" font-weight="700" fill="#f59e0b">3. Positioned (nishon)</text>
  <text x="200" y="354" text-anchor="middle" font-size="13" fill="#475569">o'ng-yuqorida kichik belgi</text>

  <!-- arrow showing stacking direction -->
  <line x1="40" y1="360" x2="40" y2="120" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#fl13up)"/>
  <defs>
    <marker id="fl13up" markerWidth="12" markerHeight="12" refX="5" refY="3" orient="auto">
      <path d="M0,8 L5,0 L10,8 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ===== Right: rendered result ===== -->
  <text x="565" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">Natija (ekranda)</text>

  <!-- base image -->
  <rect x="430" y="108" width="270" height="280" rx="14" fill="#0ea5e9"/>
  <rect x="430" y="108" width="270" height="280" rx="14" fill="#dbeafe" opacity="0.18"/>

  <!-- badge top-right -->
  <rect x="630" y="120" width="58" height="30" rx="15" fill="#ef4444"/>
  <text x="659" y="141" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">YANGI</text>
  <text x="659" y="170" text-anchor="middle" font-size="13" fill="#0553b1">top: 12</text>
  <text x="659" y="186" text-anchor="middle" font-size="13" fill="#0553b1">right: 12</text>

  <!-- bottom gradient -->
  <rect x="430" y="318" width="270" height="70" rx="0" fill="#1e293b" opacity="0.78"/>
  <rect x="430" y="374" width="270" height="14" rx="0" fill="#1e293b"/>
  <text x="448" y="352" font-size="17" font-weight="700" fill="#ffffff">Toshkent kechasi</text>
  <text x="448" y="374" font-size="13" fill="#dbeafe">Positioned.fill bilan butun rasmga yoyildi</text>

  <text x="565" y="412" text-anchor="middle" font-size="13" fill="#475569">Positioned(top/right/...) — bolani aniq joyga mixlaydi</text>
  <text x="380" y="450" text-anchor="middle" font-size="13" fill="#94a3b8">Positioned'siz bolalar Stack'ning alignment'iga ko'ra joylashadi (default: yuqori-chap)</text>
</svg>
