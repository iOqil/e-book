<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" font-family="Segoe UI, system-ui, sans-serif">
  <title>Flutter ish muhiti: SDK, editor, qurilma va flutter doctor tekshiruvi qanday bog'lanadi</title>
  <defs>
    <marker id="mu-ar" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="430" fill="#f8fafc"/>

  <text x="390" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Flutter ish muhiti — to'rt qism</text>
  <text x="390" y="58" text-anchor="middle" font-size="14" fill="#475569">Bularni bir marta sozlaysiz, keyin shu bilan ishlaysiz</text>

  <!-- 1. Editor -->
  <rect x="40" y="100" width="200" height="110" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="140" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#6366f1">1. Editor</text>
  <text x="140" y="156" text-anchor="middle" font-size="13" fill="#475569">VS Code (+Flutter</text>
  <text x="140" y="174" text-anchor="middle" font-size="13" fill="#475569">kengaytmasi)</text>
  <text x="140" y="196" text-anchor="middle" font-size="13" fill="#1e293b">Kod shu yerda yoziladi</text>

  <!-- 2. SDK -->
  <rect x="290" y="100" width="200" height="110" rx="10" fill="#027dfd" stroke="#0553b1" stroke-width="2.5"/>
  <text x="390" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">2. Flutter SDK</text>
  <text x="390" y="156" text-anchor="middle" font-size="13" fill="#dbeafe">flutter + dart</text>
  <text x="390" y="174" text-anchor="middle" font-size="13" fill="#dbeafe">komandalari</text>
  <text x="390" y="196" text-anchor="middle" font-size="13" fill="#ffffff">PATH'ga qo'shiladi</text>

  <!-- 3. Qurilma -->
  <rect x="540" y="100" width="200" height="110" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="640" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#16a34a">3. Qurilma</text>
  <text x="640" y="156" text-anchor="middle" font-size="13" fill="#475569">emulyator yoki</text>
  <text x="640" y="174" text-anchor="middle" font-size="13" fill="#475569">haqiqiy telefon</text>
  <text x="640" y="196" text-anchor="middle" font-size="13" fill="#1e293b">Ilova shu yerda ko'rinadi</text>

  <!-- editor -> sdk -->
  <line x1="240" y1="155" x2="286" y2="155" stroke="#475569" stroke-width="2.5" marker-end="url(#mu-ar)"/>
  <!-- sdk -> qurilma -->
  <line x1="490" y1="155" x2="536" y2="155" stroke="#475569" stroke-width="2.5" marker-end="url(#mu-ar)"/>
  <text x="263" y="146" text-anchor="middle" font-size="13" fill="#475569">build</text>
  <text x="513" y="146" text-anchor="middle" font-size="13" fill="#475569">flutter run</text>

  <!-- 4. flutter doctor -->
  <rect x="190" y="270" width="400" height="100" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="390" y="300" text-anchor="middle" font-size="16" font-weight="bold" fill="#b45309">4. flutter doctor</text>
  <text x="390" y="326" text-anchor="middle" font-size="13" fill="#1e293b">Hammasini tekshiradigan "shifokor": nima yetishmasa, aytadi</text>
  <text x="390" y="350" text-anchor="middle" font-size="13" fill="#16a34a">[✓] joyida</text>
  <text x="500" y="350" text-anchor="middle" font-size="13" fill="#b45309">[!] ogohlantirish</text>
  <text x="290" y="350" text-anchor="middle" font-size="13" fill="#ef4444">[✗] tuzatish kerak</text>

  <!-- doctor checks all three -->
  <line x1="270" y1="270" x2="160" y2="214" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mu-ar)"/>
  <line x1="390" y1="270" x2="390" y2="214" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mu-ar)"/>
  <line x1="510" y1="270" x2="620" y2="214" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mu-ar)"/>

  <text x="390" y="408" text-anchor="middle" font-size="14" fill="#1e293b">Biror narsa ishlamasa — birinchi bo'lib `flutter doctor` ni ishga tushiring.</text>
</svg>
