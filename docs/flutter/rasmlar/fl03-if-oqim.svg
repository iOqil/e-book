<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="Segoe UI, system-ui, sans-serif">
  <title>if/else qaror oqimi: yosh >= 18 sharti rost bo'lsa kattalar, aks holda bolalar shoxiga ketadi va so'ng birlashadi</title>
  <defs>
    <marker id="fl03ok" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="460" fill="#f8fafc"/>

  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">if / else — bitta qaror, ikki yo'l</text>
  <text x="380" y="56" text-anchor="middle" font-size="14" fill="#475569">Shart tekshiriladi, dastur shartga qarab bitta shoxni tanlaydi</text>

  <!-- boshlanish -->
  <rect x="305" y="80" width="150" height="40" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="380" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Boshlanish</text>

  <line x1="380" y1="120" x2="380" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#fl03ok)"/>

  <!-- shart romb -->
  <polygon points="380,155 480,215 380,275 280,215" fill="#dbeafe" stroke="#027dfd" stroke-width="2.5"/>
  <text x="380" y="205" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">yosh &gt;= 18 ?</text>
  <text x="380" y="228" text-anchor="middle" font-size="13" fill="#475569">(shart — bool)</text>

  <!-- rost shoxi (chap) -->
  <line x1="280" y1="215" x2="150" y2="215" stroke="#16a34a" stroke-width="2.5" marker-end="url(#fl03ok)"/>
  <text x="215" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">true (ha)</text>

  <rect x="55" y="255" width="190" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="150" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">if bloki</text>
  <text x="150" y="304" text-anchor="middle" font-size="13" fill="#475569">"kattalar" chiqadi</text>
  <line x1="150" y1="215" x2="150" y2="255" stroke="#16a34a" stroke-width="2.5" marker-end="url(#fl03ok)"/>

  <!-- yolg'on shoxi (o'ng) -->
  <line x1="480" y1="215" x2="610" y2="215" stroke="#ef4444" stroke-width="2.5" marker-end="url(#fl03ok)"/>
  <text x="545" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#ef4444">false (yo'q)</text>

  <rect x="515" y="255" width="190" height="64" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2.5"/>
  <text x="610" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">else bloki</text>
  <text x="610" y="304" text-anchor="middle" font-size="13" fill="#475569">"bolalar" chiqadi</text>
  <line x1="610" y1="215" x2="610" y2="255" stroke="#ef4444" stroke-width="2.5" marker-end="url(#fl03ok)"/>

  <!-- birlashish -->
  <line x1="150" y1="319" x2="150" y2="370" stroke="#475569" stroke-width="2"/>
  <line x1="610" y1="319" x2="610" y2="370" stroke="#475569" stroke-width="2"/>
  <line x1="150" y1="370" x2="610" y2="370" stroke="#475569" stroke-width="2"/>
  <line x1="380" y1="370" x2="380" y2="395" stroke="#475569" stroke-width="2" marker-end="url(#fl03ok)"/>

  <rect x="280" y="400" width="200" height="44" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="380" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Davom etadi (birlashadi)</text>
  <text x="380" y="438" text-anchor="middle" font-size="13" fill="#475569">qaysi shox bo'lsa ham — keyin shu yer</text>
</svg>
