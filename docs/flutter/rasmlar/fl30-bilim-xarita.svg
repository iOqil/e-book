<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" font-family="Segoe UI, system-ui, sans-serif">
  <title>Bilim xaritasi: markazda "Flutter va Dart ekspert" hub, undan kitobning asosiy ustunlari tarmoqlanadi — Dart tili, widgetlar va layout, state va lifecycle, navigatsiya, tarmoq va saqlash, state management (Riverpod/Bloc), animatsiya, testing va deploy. O'quvchi endi bularning hammasini biladi.</title>
  <rect x="0" y="0" width="820" height="560" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Siz endi nimani bilasiz — bilim xaritasi</text>
  <text x="410" y="58" text-anchor="middle" font-size="14" fill="#475569">30 bobda egallagan ko'nikmalaringiz bir markazda birlashadi</text>

  <!-- spokes (drawn under nodes) -->
  <line x1="410" y1="280" x2="170" y2="135" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="410" y1="280" x2="410" y2="120" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="410" y1="280" x2="650" y2="135" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="410" y1="280" x2="110" y2="280" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="410" y1="280" x2="710" y2="280" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="410" y1="280" x2="170" y2="425" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="410" y1="280" x2="410" y2="440" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="410" y1="280" x2="650" y2="425" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- central hub -->
  <circle cx="410" cy="280" r="86" fill="#027dfd"/>
  <text x="410" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Flutter &amp; Dart</text>
  <text x="410" y="296" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">EKSPERT</text>

  <!-- top-left: Dart tili -->
  <rect x="80" y="104" width="180" height="58" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="170" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#6366f1">Dart tili</text>
  <text x="170" y="150" text-anchor="middle" font-size="13" fill="#64748b">02-09: records, async</text>

  <!-- top: widgetlar -->
  <rect x="320" y="86" width="180" height="58" rx="12" fill="#ffffff" stroke="#027dfd" stroke-width="2.5"/>
  <text x="410" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#027dfd">Widgetlar &amp; layout</text>
  <text x="410" y="132" text-anchor="middle" font-size="13" fill="#64748b">10-15: UI qurish</text>

  <!-- top-right: navigatsiya -->
  <rect x="560" y="104" width="180" height="58" rx="12" fill="#ffffff" stroke="#9333ea" stroke-width="2.5"/>
  <text x="650" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#9333ea">Navigatsiya</text>
  <text x="650" y="150" text-anchor="middle" font-size="13" fill="#64748b">19-20: go_router</text>

  <!-- left: state & lifecycle -->
  <rect x="20" y="251" width="180" height="58" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="110" y="277" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">State &amp; lifecycle</text>
  <text x="110" y="297" text-anchor="middle" font-size="13" fill="#64748b">16-17: setState, forma</text>

  <!-- right: tarmoq & saqlash -->
  <rect x="620" y="251" width="180" height="58" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2.5"/>
  <text x="710" y="277" text-anchor="middle" font-size="14" font-weight="700" fill="#0553b1">Tarmoq &amp; saqlash</text>
  <text x="710" y="297" text-anchor="middle" font-size="13" fill="#64748b">21-23: API, SQLite</text>

  <!-- bottom-left: state management -->
  <rect x="80" y="398" width="180" height="58" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="170" y="424" text-anchor="middle" font-size="14" font-weight="700" fill="#6366f1">State management</text>
  <text x="170" y="444" text-anchor="middle" font-size="13" fill="#64748b">24-26: Riverpod, Bloc</text>

  <!-- bottom: animatsiya -->
  <rect x="320" y="416" width="180" height="58" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="410" y="442" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">Animatsiya</text>
  <text x="410" y="462" text-anchor="middle" font-size="13" fill="#64748b">27-28: Hero, paketlar</text>

  <!-- bottom-right: testing & deploy -->
  <rect x="560" y="398" width="180" height="58" rx="12" fill="#ffffff" stroke="#ef4444" stroke-width="2.5"/>
  <text x="650" y="424" text-anchor="middle" font-size="14" font-weight="700" fill="#ef4444">Testing &amp; deploy</text>
  <text x="650" y="444" text-anchor="middle" font-size="13" fill="#64748b">29-30: test, do'kon</text>

  <!-- footer -->
  <rect x="120" y="500" width="580" height="40" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="410" y="525" text-anchor="middle" font-size="14" fill="#16a34a">Bu ustunlarning hammasi bitta to'liq ilovada birlashdi — tabriklaymiz!</text>
</svg>
