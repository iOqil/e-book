<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Navigatsiya steki: Home ekrani ustiga push bilan Detail, uning ustiga Edit qo'yiladi (stekka tepadan qo'shiladi); pop tepadagi ekranni olib tashlab oldingisiga qaytaradi</title>
  <rect x="0" y="0" width="800" height="470" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Navigatsiya steki — ekranlar bir-birining ustiga taxlanadi</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#475569">push = tepaga qo'shadi · pop = tepadagini olib tashlaydi (orqaga)</text>

  <!-- LEFT: stack of screens -->
  <text x="200" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Stek (ekranlar taxlanmasi)</text>

  <!-- Edit (top) -->
  <rect x="100" y="108" width="200" height="58" rx="12" fill="#027dfd"/>
  <text x="200" y="134" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Edit</text>
  <text x="200" y="154" text-anchor="middle" font-size="13" fill="#dbeafe">tepa (eng yuqorida ko'rinadi)</text>

  <!-- Detail (middle) -->
  <rect x="100" y="184" width="200" height="58" rx="12" fill="#6366f1"/>
  <text x="200" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Detail</text>
  <text x="200" y="230" text-anchor="middle" font-size="13" fill="#e0e7ff">tagida kutib turadi</text>

  <!-- Home (bottom) -->
  <rect x="100" y="260" width="200" height="58" rx="12" fill="#94a3b8"/>
  <text x="200" y="286" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Home</text>
  <text x="200" y="306" text-anchor="middle" font-size="13" fill="#ffffff">tag (ildiz ekran)</text>

  <text x="200" y="344" text-anchor="middle" font-size="13" fill="#64748b">eng tagi = birinchi ekran</text>

  <!-- push arrow (down into stack, adds on top) -->
  <line x1="360" y1="137" x2="312" y2="137" stroke="#16a34a" stroke-width="3"/>
  <polygon points="312,137 326,130 326,144" fill="#16a34a"/>
  <text x="420" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">push()</text>
  <text x="430" y="146" text-anchor="middle" font-size="13" fill="#475569">yangi ekranni</text>
  <text x="430" y="164" text-anchor="middle" font-size="13" fill="#475569">tepaga qo'yadi</text>

  <!-- pop arrow (out of stack, removes top) -->
  <line x1="312" y1="290" x2="360" y2="290" stroke="#ef4444" stroke-width="3"/>
  <polygon points="360,290 346,283 346,297" fill="#ef4444"/>
  <text x="425" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#ef4444">pop()</text>
  <text x="430" y="300" text-anchor="middle" font-size="13" fill="#475569">tepadagini olib</text>
  <text x="430" y="318" text-anchor="middle" font-size="13" fill="#475569">tashlaydi (orqaga)</text>

  <!-- RIGHT: sequence of actions -->
  <rect x="520" y="100" width="250" height="240" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="645" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#0553b1">Voqealar ketma-ketligi</text>

  <text x="540" y="160" font-size="14" fill="#1e293b">1. Ilova ochildi:</text>
  <text x="560" y="180" font-size="13" fill="#475569">[ Home ]</text>

  <text x="540" y="208" font-size="14" fill="#16a34a">2. push(Detail):</text>
  <text x="560" y="228" font-size="13" fill="#475569">[ Home, Detail ]</text>

  <text x="540" y="256" font-size="14" fill="#16a34a">3. push(Edit):</text>
  <text x="560" y="276" font-size="13" fill="#475569">[ Home, Detail, Edit ]</text>

  <text x="540" y="304" font-size="14" fill="#ef4444">4. pop():</text>
  <text x="560" y="324" font-size="13" fill="#475569">[ Home, Detail ]  -> Edit ketdi</text>

  <text x="400" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Analogiya: brauzer tarixi yoki bir uyum tarelka</text>
  <text x="400" y="416" text-anchor="middle" font-size="13" fill="#475569">Har bir yangi sahifa ustiga qo'yiladi; "orqaga" tugmasi eng ustdagisini oladi.</text>
  <text x="400" y="440" text-anchor="middle" font-size="13" fill="#64748b">AppBar'dagi avtomatik orqaga tugmasi aslida shu pop() ni chaqiradi.</text>
</svg>
