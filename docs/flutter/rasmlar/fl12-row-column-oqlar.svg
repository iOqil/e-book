<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Row va Column ikki o'qi: Row'da asosiy o'q gorizontal, ko'ndalang o'q vertikal; Column'da asosiy o'q vertikal, ko'ndalang o'q gorizontal</title>
  <rect x="0" y="0" width="780" height="470" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Row va Column — har birida ikkita o'q bor</text>
  <text x="390" y="58" text-anchor="middle" font-size="14" fill="#475569">Asosiy o'q (main) = bolalar tizilish yo'nalishi · Ko'ndalang o'q (cross) = unga perpendikulyar</text>

  <!-- ===== ROW (left) ===== -->
  <text x="195" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#027dfd">Row — gorizontal qatorga teradi</text>

  <!-- container -->
  <rect x="40" y="110" width="310" height="180" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>

  <!-- three children laid horizontally -->
  <rect x="64" y="170" width="60" height="60" rx="8" fill="#dbeafe" stroke="#027dfd" stroke-width="2"/>
  <text x="94" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#0553b1">1</text>
  <rect x="164" y="170" width="60" height="60" rx="8" fill="#dbeafe" stroke="#027dfd" stroke-width="2"/>
  <text x="194" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#0553b1">2</text>
  <rect x="264" y="170" width="60" height="60" rx="8" fill="#dbeafe" stroke="#027dfd" stroke-width="2"/>
  <text x="294" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#0553b1">3</text>

  <!-- main axis = horizontal arrow -->
  <line x1="56" y1="146" x2="334" y2="146" stroke="#16a34a" stroke-width="3"/>
  <polygon points="334,146 322,140 322,152" fill="#16a34a"/>
  <text x="195" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">asosiy o'q (main) →</text>

  <!-- cross axis = vertical arrow -->
  <line x1="56" y1="252" x2="56" y2="158" stroke="#f59e0b" stroke-width="3"/>
  <polygon points="56,158 50,170 62,170" fill="#f59e0b"/>
  <text x="195" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#f59e0b">↕ ko'ndalang o'q (cross)</text>

  <!-- ===== COLUMN (right) ===== -->
  <text x="585" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#6366f1">Column — vertikal ustunga teradi</text>

  <rect x="450" y="110" width="270" height="290" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>

  <!-- three children laid vertically -->
  <rect x="540" y="134" width="90" height="48" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="585" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">1</text>
  <rect x="540" y="206" width="90" height="48" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="585" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">2</text>
  <rect x="540" y="278" width="90" height="48" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="585" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">3</text>

  <!-- main axis = vertical arrow -->
  <line x1="490" y1="128" x2="490" y2="380" stroke="#16a34a" stroke-width="3"/>
  <polygon points="490,380 484,368 496,368" fill="#16a34a"/>
  <text x="490" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">asosiy o'q ↓</text>

  <!-- cross axis = horizontal arrow -->
  <line x1="528" y1="356" x2="700" y2="356" stroke="#f59e0b" stroke-width="3"/>
  <polygon points="700,356 688,350 688,362" fill="#f59e0b"/>
  <text x="614" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#f59e0b">ko'ndalang o'q →</text>

  <text x="390" y="432" text-anchor="middle" font-size="14" fill="#475569">mainAxisAlignment = asosiy (yashil) o'q bo'ylab · crossAxisAlignment = ko'ndalang (sariq) o'q bo'ylab</text>
  <text x="390" y="456" text-anchor="middle" font-size="13" fill="#94a3b8">Eslab qoling: Row'da asosiy = yotiq, Column'da asosiy = tik. Boshlovchilar shu yerda adashadi.</text>
</svg>
