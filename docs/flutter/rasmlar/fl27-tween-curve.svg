<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Tween qiymatni begin (0.0) dan end (1.0) gacha vaqt bo'ylab o'zgartiradi. Curve esa shu o'zgarishning shaklini belgilaydi: linear to'g'ri chiziq, easeInOut sekin-tez-sekin, elasticOut esa oxirida sapchib chiqadi. Bu qiymat-vaqt grafigi curve harakat xarakterini qanday o'zgartirishini ko'rsatadi.</title>
  <rect x="0" y="0" width="800" height="470" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Tween + Curve: qiymat vaqt bo'ylab</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#475569">Tween nimadan-nimaga — Curve esa qanday yo'l bilan</text>

  <!-- axes -->
  <line x1="120" y1="100" x2="120" y2="360" stroke="#475569" stroke-width="2"/>
  <line x1="120" y1="360" x2="700" y2="360" stroke="#475569" stroke-width="2"/>
  <polygon points="120,100 114,114 126,114" fill="#475569"/>
  <polygon points="700,360 686,354 686,366" fill="#475569"/>

  <!-- Y axis labels: begin/end -->
  <text x="108" y="365" text-anchor="end" font-size="13" font-weight="700" fill="#16a34a">0.0</text>
  <text x="108" y="119" text-anchor="end" font-size="13" font-weight="700" fill="#ef4444">1.0</text>
  <text x="70" y="240" text-anchor="middle" font-size="13" fill="#64748b" transform="rotate(-90 70 240)">qiymat (Tween)</text>
  <text x="410" y="392" text-anchor="middle" font-size="13" fill="#64748b">vaqt (0 dan duration gacha) &#8594;</text>

  <!-- begin / end guide lines -->
  <line x1="120" y1="114" x2="700" y2="114" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="120" y1="360" x2="700" y2="360" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- linear -->
  <line x1="120" y1="360" x2="660" y2="114" stroke="#64748b" stroke-width="3"/>
  <!-- easeInOut: S-curve via cubic -->
  <path d="M120 360 C300 360, 480 114, 660 114" stroke="#027dfd" stroke-width="3.5" fill="none"/>
  <!-- elasticOut: overshoots above 1.0 then settles -->
  <path d="M120 360 C220 200, 300 60, 380 96 C440 124, 470 130, 510 116 C560 100, 600 114, 660 114" stroke="#9333ea" stroke-width="3.5" fill="none"/>

  <!-- overshoot marker -->
  <line x1="120" y1="90" x2="700" y2="90" stroke="#9333ea" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="690" y="84" text-anchor="end" font-size="13" fill="#9333ea">elastic biroz oshib ketadi</text>

  <!-- legend -->
  <rect x="150" y="124" width="14" height="14" rx="3" fill="#64748b"/>
  <text x="170" y="136" font-size="13" fill="#475569">Curves.linear — bir tekis (mexanik tuyuladi)</text>
  <rect x="150" y="150" width="14" height="14" rx="3" fill="#027dfd"/>
  <text x="170" y="162" font-size="13" fill="#475569">Curves.easeInOut — sekin, tez, sekin (tabiiy)</text>
  <rect x="150" y="176" width="14" height="14" rx="3" fill="#9333ea"/>
  <text x="170" y="188" font-size="13" fill="#475569">Curves.elasticOut — oxirida sapchiydi (jonli)</text>

  <!-- bottom explainer -->
  <rect x="36" y="406" width="350" height="48" rx="12" fill="#ffffff" stroke="#027dfd" stroke-width="2"/>
  <text x="56" y="430" font-size="13" font-weight="700" fill="#027dfd">Tween&lt;double&gt;(begin: 0.0, end: 1.0)</text>
  <text x="56" y="448" font-size="13" fill="#64748b">qaysi ikki qiymat orasini animatsiya qilish</text>

  <rect x="414" y="406" width="350" height="48" rx="12" fill="#ffffff" stroke="#9333ea" stroke-width="2"/>
  <text x="434" y="430" font-size="13" font-weight="700" fill="#9333ea">CurvedAnimation(curve: ...)</text>
  <text x="434" y="448" font-size="13" fill="#64748b">o'sha yo'lning shakli — harakat xarakteri</text>
</svg>
