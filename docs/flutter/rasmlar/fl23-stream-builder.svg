<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" font-family="Segoe UI, system-ui, sans-serif">
  <title>Oqim 1, 2, 3 qiymatlarni vaqt o'tib chiqaradi, har biri StreamBuilder ga oqib kiradi va u UI ni eng so'nggi qiymat bilan qaytadan chizadi — reaktiv halqa</title>
  <defs>
    <marker id="fl23sbA" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="fl23sbB" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="420" fill="#f8fafc"/>

  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Stream → StreamBuilder: reaktiv halqa</text>
  <text x="390" y="56" text-anchor="middle" font-size="14" fill="#475569">har yangi qiymat kelganda UI o'zini qaytadan chizadi</text>

  <!-- Stream manba -->
  <rect x="36" y="120" width="150" height="64" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="111" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Stream&lt;int&gt;</text>
  <text x="111" y="172" text-anchor="middle" font-size="13" fill="#64748b">async* + yield</text>

  <!-- vaqt o'qi bilan chiqayotgan qiymatlar -->
  <line x1="111" y1="220" x2="111" y2="372" stroke="#94a3b8" stroke-width="2" marker-end="url(#fl23sbA)"/>
  <text x="111" y="392" text-anchor="middle" font-size="13" fill="#64748b">vaqt</text>

  <circle cx="111" cy="248" r="20" fill="#16a34a"/>
  <text x="111" y="254" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">1</text>
  <circle cx="111" cy="300" r="20" fill="#16a34a"/>
  <text x="111" y="306" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">2</text>
  <circle cx="111" cy="352" r="20" fill="#16a34a"/>
  <text x="111" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">3</text>

  <!-- oqim StreamBuilderga kiradi -->
  <line x1="135" y1="248" x2="330" y2="220" stroke="#16a34a" stroke-width="2" marker-end="url(#fl23sbB)"/>
  <line x1="135" y1="300" x2="330" y2="248" stroke="#16a34a" stroke-width="2" marker-end="url(#fl23sbB)"/>
  <line x1="135" y1="352" x2="330" y2="276" stroke="#16a34a" stroke-width="2" marker-end="url(#fl23sbB)"/>
  <text x="225" y="200" text-anchor="middle" font-size="13" fill="#16a34a">har qiymat oqib kiradi</text>

  <!-- StreamBuilder qutisi -->
  <rect x="340" y="150" width="200" height="120" rx="12" fill="#dbeafe" stroke="#027dfd" stroke-width="2.5"/>
  <text x="440" y="184" text-anchor="middle" font-size="16" font-weight="bold" fill="#0553b1">StreamBuilder</text>
  <text x="440" y="210" text-anchor="middle" font-size="13" fill="#1e293b">snapshot.data ni o'qib</text>
  <text x="440" y="230" text-anchor="middle" font-size="13" fill="#1e293b">builder() ni QAYTA</text>
  <text x="440" y="250" text-anchor="middle" font-size="13" fill="#1e293b">chaqiradi</text>

  <!-- StreamBuilder -> UI -->
  <line x1="540" y1="210" x2="600" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#fl23sbA)"/>

  <!-- UI ekran -->
  <rect x="604" y="150" width="140" height="120" rx="14" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
  <rect x="618" y="166" width="112" height="40" rx="8" fill="#e0e7ff"/>
  <text x="674" y="192" text-anchor="middle" font-size="20" font-weight="bold" fill="#6366f1">3</text>
  <text x="674" y="234" text-anchor="middle" font-size="13" fill="#475569">UI (Text)</text>
  <text x="674" y="254" text-anchor="middle" font-size="13" fill="#475569">eng so'nggi qiymat</text>

  <!-- reaktiv halqa izohi -->
  <rect x="340" y="300" width="404" height="84" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="542" y="328" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">Reaktiv halqa</text>
  <text x="542" y="352" text-anchor="middle" font-size="13" fill="#1e293b">yangi qiymat → StreamBuilder → UI yangilanadi</text>
  <text x="542" y="372" text-anchor="middle" font-size="13" fill="#475569">setState YO'Q — avtomatik takrorlanadi</text>
</svg>
