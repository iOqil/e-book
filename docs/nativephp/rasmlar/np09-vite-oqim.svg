<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Segoe UI, sans-serif">
  <title>Vite assets oqimi: dev rejimda HMR, build rejimda kompilyatsiya qilingan fayllar</title>
  <rect width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Tailwind + Vite assets oqimi</text>

  <!-- Manba -->
  <rect x="40" y="70" width="200" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="140" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Manba fayllar</text>
  <text x="140" y="122" text-anchor="middle" font-size="13" fill="#334155">resources/css/app.css</text>
  <text x="140" y="144" text-anchor="middle" font-size="13" fill="#334155">resources/js/app.js</text>
  <text x="140" y="166" text-anchor="middle" font-size="13" fill="#334155">@vite([...]) Blade'da</text>

  <!-- Dev yo'l -->
  <rect x="300" y="58" width="420" height="138" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="320" y="84" font-size="14" font-weight="bold" fill="#16a34a">DEV: native:dev (npm run dev)</text>
  <text x="320" y="110" font-size="13" fill="#334155">Vite dev-server ishlaydi -&gt; @vite script tegi</text>
  <text x="320" y="132" font-size="13" fill="#334155">HMR: CSS/JS o'zgarsa oyna darhol yangilanadi</text>
  <text x="320" y="154" font-size="13" fill="#334155">PHP/Blade o'zgarsa — qayta yuklash kerak</text>
  <text x="320" y="180" font-size="13" fill="#dc2626">Eslatma: bu blok GUI talab qiladi (illustrativ)</text>

  <!-- Build yo'l -->
  <rect x="300" y="224" width="420" height="138" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="250" font-size="14" font-weight="bold" fill="#2563eb">BUILD: native:build (npm run build)</text>
  <text x="320" y="276" font-size="13" fill="#334155">Vite minify + hash -&gt; public/build/</text>
  <text x="320" y="298" font-size="13" fill="#334155">manifest.json bilan @vite to'g'ri faylga ishora</text>
  <text x="320" y="320" font-size="13" fill="#334155">assets ilova ichiga bundle qilinadi</text>
  <text x="320" y="346" font-size="13" fill="#dc2626">Eslatma: packaging bu muhitda ishlamaydi (illustrativ)</text>

  <!-- Strelkalar -->
  <line x1="240" y1="118" x2="296" y2="118" stroke="#16a34a" stroke-width="3"/>
  <polygon points="296,110 300,118 296,126" fill="#16a34a" transform="translate(-4,0)"/>
  <line x1="240" y1="148" x2="296" y2="290" stroke="#2563eb" stroke-width="3"/>
  <polygon points="292,282 300,292 288,294" fill="#2563eb"/>

  <text x="380" y="398" text-anchor="middle" font-size="13" fill="#334155">Bir manba — ikki rejim: tez ishlab chiqish (HMR) yoki yakuniy bundle</text>
</svg>
