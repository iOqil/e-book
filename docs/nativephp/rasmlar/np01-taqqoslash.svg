<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470">
  <title>NativePHP, Electron, React Native, Flutter va Tauri taqqoslashi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b">Qaysi til? Qaysi UI? Sof native mi?</text>

  <!-- header row -->
  <rect x="30" y="56" width="200" height="42" fill="#2563eb"/>
  <rect x="230" y="56" width="200" height="42" fill="#2563eb"/>
  <rect x="430" y="56" width="150" height="42" fill="#2563eb"/>
  <rect x="580" y="56" width="150" height="42" fill="#2563eb"/>
  <text x="130" y="83" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff">Texnologiya</text>
  <text x="330" y="83" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff">Til (mantiq)</text>
  <text x="505" y="83" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff">UI usuli</text>
  <text x="655" y="83" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff">Sof native?</text>

  <!-- rows -->
  <!-- NativePHP -->
  <rect x="30" y="98" width="200" height="58" fill="#eff6ff" stroke="#94a3b8"/>
  <rect x="230" y="98" width="200" height="58" fill="#eff6ff" stroke="#94a3b8"/>
  <rect x="430" y="98" width="150" height="58" fill="#eff6ff" stroke="#94a3b8"/>
  <rect x="580" y="98" width="150" height="58" fill="#eff6ff" stroke="#94a3b8"/>
  <text x="46" y="125" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">NativePHP</text>
  <text x="46" y="146" font-family="Segoe UI" font-size="13" fill="#334155">Electron / Swift / Kotlin</text>
  <text x="246" y="132" font-family="Segoe UI" font-size="13" fill="#334155">PHP / Laravel</text>
  <text x="446" y="132" font-family="Segoe UI" font-size="13" fill="#334155">Webview (Blade)</text>
  <text x="655" y="132" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">Yo'q</text>

  <!-- Electron -->
  <rect x="30" y="156" width="200" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="230" y="156" width="200" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="430" y="156" width="150" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="580" y="156" width="150" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <text x="46" y="186" font-family="Segoe UI" font-size="14" fill="#1e293b">Electron</text>
  <text x="246" y="186" font-family="Segoe UI" font-size="13" fill="#334155">JS / Node.js</text>
  <text x="446" y="186" font-family="Segoe UI" font-size="13" fill="#334155">Webview</text>
  <text x="655" y="186" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">Yo'q</text>

  <!-- React Native -->
  <rect x="30" y="206" width="200" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="230" y="206" width="200" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="430" y="206" width="150" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="580" y="206" width="150" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <text x="46" y="236" font-family="Segoe UI" font-size="14" fill="#1e293b">React Native</text>
  <text x="246" y="236" font-family="Segoe UI" font-size="13" fill="#334155">JS / TypeScript</text>
  <text x="446" y="236" font-family="Segoe UI" font-size="13" fill="#334155">Native widget</text>
  <text x="655" y="236" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">Ha</text>

  <!-- Flutter -->
  <rect x="30" y="256" width="200" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="230" y="256" width="200" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="430" y="256" width="150" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="580" y="256" width="150" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <text x="46" y="286" font-family="Segoe UI" font-size="14" fill="#1e293b">Flutter</text>
  <text x="246" y="286" font-family="Segoe UI" font-size="13" fill="#334155">Dart</text>
  <text x="446" y="286" font-family="Segoe UI" font-size="13" fill="#334155">O'z dvigateli</text>
  <text x="655" y="286" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">Ha</text>

  <!-- Tauri -->
  <rect x="30" y="306" width="200" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="230" y="306" width="200" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="430" y="306" width="150" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="580" y="306" width="150" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <text x="46" y="336" font-family="Segoe UI" font-size="14" fill="#1e293b">Tauri</text>
  <text x="246" y="336" font-family="Segoe UI" font-size="13" fill="#334155">Rust + JS</text>
  <text x="446" y="336" font-family="Segoe UI" font-size="13" fill="#334155">Webview (OS)</text>
  <text x="655" y="336" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">Yo'q</text>

  <text x="380" y="392" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155">NativePHP'ning ustunligi: PHP/Laravel bilimingizdan foydalanasiz</text>
  <rect x="30" y="408" width="700" height="46" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="436" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#92400e">"Sof native" pikselni piksel chizadi; webview brauzer dvigatelida HTML chizadi. NativePHP webview asosli.</text>
</svg>
