<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Segoe UI, sans-serif">
  <title>Ruxsat (permission) holatlari va oqimi NativePHP mobil ilovada</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Ruxsat (permission) holatlari</text>

  <!-- not_determined -->
  <rect x="280" y="64" width="200" height="62" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#f59e0b">not_determined</text>
  <text x="380" y="112" text-anchor="middle" font-size="13" fill="#334155">hali so'ralmagan</text>

  <!-- requestPermissions -->
  <rect x="280" y="166" width="200" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">requestPermissions()</text>
  <text x="380" y="210" text-anchor="middle" font-size="13" fill="#334155">tizim dialogi chiqadi</text>

  <line x1="380" y1="126" x2="380" y2="164" stroke="#94a3b8" stroke-width="2" marker-end="url(#b)"/>

  <!-- granted -->
  <rect x="40" y="290" width="200" height="80" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="318" text-anchor="middle" font-size="15" font-weight="bold" fill="#16a34a">granted</text>
  <text x="140" y="340" text-anchor="middle" font-size="13" fill="#334155">sensor ishlaydi</text>
  <text x="140" y="360" text-anchor="middle" font-size="13" fill="#334155">getCurrentPosition()</text>

  <!-- denied -->
  <rect x="280" y="290" width="200" height="80" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="318" text-anchor="middle" font-size="15" font-weight="bold" fill="#f59e0b">denied</text>
  <text x="380" y="340" text-anchor="middle" font-size="13" fill="#334155">qayta so'rash mumkin</text>
  <text x="380" y="360" text-anchor="middle" font-size="13" fill="#334155">izoh ko'rsating</text>

  <!-- permanently_denied -->
  <rect x="520" y="290" width="210" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="625" y="318" text-anchor="middle" font-size="15" font-weight="bold" fill="#dc2626">permanently_denied</text>
  <text x="625" y="340" text-anchor="middle" font-size="13" fill="#334155">faqat Sozlamalardan</text>
  <text x="625" y="360" text-anchor="middle" font-size="13" fill="#334155">qo'lda yoqiladi</text>

  <line x1="340" y1="222" x2="170" y2="288" stroke="#16a34a" stroke-width="2" marker-end="url(#b)"/>
  <line x1="380" y1="222" x2="380" y2="288" stroke="#f59e0b" stroke-width="2" marker-end="url(#b)"/>
  <line x1="420" y1="222" x2="600" y2="288" stroke="#dc2626" stroke-width="2" marker-end="url(#b)"/>

  <text x="380" y="404" text-anchor="middle" font-size="13" fill="#64748b">checkPermissions() holatni o'qiydi; natija PermissionStatusReceived / PermissionRequestResult eventida keladi</text>

  <defs>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
