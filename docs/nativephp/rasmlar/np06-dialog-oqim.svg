<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440">
  <title>Save dialog ketma-ketligi: tugma -> dialog -> yo'l yoki null -> faylga yozish -> bildirishnoma</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI" font-size="20" fill="#1e293b" font-weight="bold">"CSV saqlash" tugmasi bosilganda</text>

  <!-- Step 1 -->
  <rect x="40" y="58" width="220" height="64" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="84" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#2563eb" font-weight="bold">1. Controller</text>
  <text x="150" y="106" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Dialog::new()->save()</text>

  <line x1="260" y1="90" x2="320" y2="90" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- Step 2 -->
  <rect x="320" y="58" width="220" height="64" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="430" y="84" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a" font-weight="bold">2. OT save oynasi</text>
  <text x="430" y="106" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">foydalanuvchi tanlaydi</text>

  <!-- branch down to decision -->
  <line x1="430" y1="122" x2="430" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- decision diamond -->
  <polygon points="430,160 540,200 430,240 320,200" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="430" y="196" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b" font-weight="bold">Tanladimi?</text>
  <text x="430" y="216" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">($path null?)</text>

  <!-- No branch (cancel) -->
  <line x1="320" y1="200" x2="180" y2="200" stroke="#dc2626" stroke-width="2" marker-end="url(#a2)"/>
  <text x="250" y="190" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">Bekor: null</text>
  <rect x="40" y="172" width="140" height="56" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="110" y="196" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626" font-weight="bold">return back()</text>
  <text x="110" y="216" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">hech narsa qilmaymiz</text>

  <!-- Yes branch -->
  <line x1="430" y1="240" x2="430" y2="278" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
  <text x="470" y="264" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">Ha: "C:\...\hisobot.csv"</text>

  <!-- Step 3 write -->
  <rect x="300" y="278" width="260" height="58" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="430" y="302" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#2563eb" font-weight="bold">3. file_put_contents($path)</text>
  <text x="430" y="324" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">oddiy PHP — faylga yozamiz</text>

  <line x1="430" y1="336" x2="430" y2="368" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- Step 4 notify -->
  <rect x="280" y="368" width="300" height="56" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="430" y="392" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a" font-weight="bold">4. Notification::...->show()</text>
  <text x="430" y="414" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">"Eksport tugadi" bildirishnomasi</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
