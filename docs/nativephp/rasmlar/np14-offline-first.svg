<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Segoe UI, sans-serif">
  <title>Offline-first arxitektura: qurilmadagi SQLite asosiy manba, server ikkilamchi</title>
  <rect width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Offline-first: lokal SQLite — asosiy haqiqat manbai</text>

  <!-- Qurilma bloki -->
  <rect x="30" y="70" width="380" height="320" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563eb">Qurilma (offline ham ishlaydi)</text>

  <!-- Webview UI -->
  <rect x="60" y="118" width="320" height="58" rx="9" fill="#eff6ff" stroke="#94a3b8"/>
  <text x="220" y="143" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Webview UI (Blade / Livewire)</text>
  <text x="220" y="163" text-anchor="middle" font-size="13" fill="#334155">foydalanuvchi shu yerda yozadi/o'qiydi</text>

  <!-- PHP runtime -->
  <rect x="60" y="190" width="320" height="58" rx="9" fill="#eff6ff" stroke="#94a3b8"/>
  <text x="220" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">On-device PHP + Eloquent</text>
  <text x="220" y="235" text-anchor="middle" font-size="13" fill="#334155">Task::create() darhol lokalga yozadi</text>

  <!-- SQLite -->
  <rect x="60" y="262" width="320" height="64" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="220" y="289" text-anchor="middle" font-size="15" font-weight="bold" fill="#16a34a">Lokal SQLite (app container)</text>
  <text x="220" y="310" text-anchor="middle" font-size="13" fill="#334155">ASOSIY manba — internet shart emas</text>

  <text x="220" y="356" text-anchor="middle" font-size="13" fill="#334155">UI hech qachon tarmoqni kutmaydi</text>
  <text x="220" y="376" text-anchor="middle" font-size="13" fill="#334155">javob darhol lokal DB'dan keladi</text>

  <!-- Strelka qurilma <-> server -->
  <path d="M410 230 H 470" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M470 250 H 410" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="478" y="225" font-size="13" fill="#f59e0b" font-weight="bold">faqat tarmoq bo'lsa</text>
  <text x="478" y="270" font-size="13" fill="#334155">fonda sinxronlanadi</text>

  <!-- Server bloki -->
  <rect x="470" y="120" width="260" height="220" rx="14" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="600" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">Masofaviy API (Laravel)</text>
  <rect x="500" y="172" width="200" height="48" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="600" y="201" text-anchor="middle" font-size="13" fill="#334155">/sync endpoint (Sanctum)</text>
  <rect x="500" y="232" width="200" height="48" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="600" y="261" text-anchor="middle" font-size="13" fill="#334155">markaziy MySQL/Postgres</text>
  <text x="600" y="312" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="bold">IKKILAMCHI — zaxira + ulashish</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
