<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Segoe UI, sans-serif">
  <title>NativePHP qurilma plugin oqimi: PHP facade -> native bridge -> sensor -> event</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Qurilma plugin oqimi (asinxron)</text>

  <!-- PHP runtime box -->
  <rect x="30" y="70" width="200" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">PHP runtime (qurilmada)</text>
  <text x="130" y="124" text-anchor="middle" font-size="14" fill="#334155">Livewire komponent</text>
  <text x="130" y="148" text-anchor="middle" font-size="13" fill="#334155">Camera::getPhoto()</text>
  <text x="130" y="170" text-anchor="middle" font-size="13" fill="#334155">Scanner::scan()</text>

  <!-- Native bridge -->
  <rect x="290" y="70" width="180" height="120" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#f59e0b">Native bridge</text>
  <text x="380" y="124" text-anchor="middle" font-size="13" fill="#334155">Swift (iOS) /</text>
  <text x="380" y="144" text-anchor="middle" font-size="13" fill="#334155">Kotlin (Android)</text>
  <text x="380" y="170" text-anchor="middle" font-size="13" fill="#64748b">ruxsat + sensorga murojaat</text>

  <!-- Sensor -->
  <rect x="530" y="70" width="200" height="120" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="630" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#16a34a">Qurilma sensori</text>
  <text x="630" y="124" text-anchor="middle" font-size="13" fill="#334155">Kamera / GPS</text>
  <text x="630" y="144" text-anchor="middle" font-size="13" fill="#334155">Mikrofon / ML Kit</text>
  <text x="630" y="170" text-anchor="middle" font-size="13" fill="#334155">AVFoundation</text>

  <!-- arrows right -->
  <line x1="230" y1="118" x2="288" y2="118" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="470" y1="118" x2="528" y2="118" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="259" y="110" text-anchor="middle" font-size="13" fill="#64748b">1</text>
  <text x="499" y="110" text-anchor="middle" font-size="13" fill="#64748b">2</text>

  <!-- event return path -->
  <rect x="290" y="270" width="180" height="90" rx="10" fill="#fff7ed" stroke="#dc2626" stroke-width="2"/>
  <text x="380" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#dc2626">Event</text>
  <text x="380" y="322" text-anchor="middle" font-size="13" fill="#334155">PhotoTaken</text>
  <text x="380" y="342" text-anchor="middle" font-size="13" fill="#334155">CodeScanned ...</text>

  <line x1="630" y1="190" x2="630" y2="315" stroke="#94a3b8" stroke-width="2"/>
  <line x1="630" y1="315" x2="472" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="650" y="255" text-anchor="middle" font-size="13" fill="#64748b">3 natija</text>

  <line x1="290" y1="315" x2="130" y2="315" stroke="#94a3b8" stroke-width="2"/>
  <line x1="130" y1="315" x2="130" y2="192" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="200" y="305" text-anchor="middle" font-size="13" fill="#64748b">4 #[OnNative] handler</text>

  <text x="380" y="400" text-anchor="middle" font-size="13" fill="#64748b">Chaqiruv darhol qaytadi; natija keyinroq event orqali keladi (asinxron, callback emas, blokirovka yo'q)</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
