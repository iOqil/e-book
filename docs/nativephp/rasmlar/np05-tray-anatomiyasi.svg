<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440">
  <title>MenuBar (tray) ilova anatomiyasi: ikonka, popover oyna va kontekst menyu</title>
  <rect width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b">Tray / MenuBar ilova anatomiyasi</text>

  <!-- system tray bar -->
  <rect x="30" y="60" width="700" height="40" rx="6" fill="#1e293b"/>
  <text x="50" y="85" font-family="Segoe UI" font-size="13" fill="#94a3b8">Tizim trayi (system tray)</text>
  <circle cx="560" cy="80" r="9" fill="#94a3b8"/>
  <circle cx="595" cy="80" r="9" fill="#94a3b8"/>
  <rect x="624" y="71" width="18" height="18" rx="3" fill="#2563eb"/>
  <text x="700" y="85" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#94a3b8">12:30</text>
  <text x="633" y="120" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">ikonka</text>

  <!-- click left -> popover -->
  <line x1="633" y1="100" x2="320" y2="170" stroke="#16a34a" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="430" y="138" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">chap bosish -> popover oyna</text>

  <!-- popover window (webview) -->
  <rect x="120" y="170" width="260" height="230" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="120" y="170" width="260" height="34" rx="10" fill="#2563eb"/>
  <text x="250" y="192" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff">Popover (webview)</text>
  <text x="250" y="232" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">->route('tray.popover')</text>
  <text x="250" y="258" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Blade / Livewire UI</text>
  <rect x="150" y="280" width="200" height="30" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="250" y="300" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">Bugungi vazifalar: 4</text>
  <rect x="150" y="320" width="200" height="30" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="250" y="340" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">+ Yangi qo'shish</text>
  <text x="250" y="378" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">width(360) height(420)</text>

  <!-- click right -> context menu -->
  <line x1="650" y1="100" x2="560" y2="190" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#c)"/>
  <text x="640" y="150" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#f59e0b">o'ng bosish -></text>
  <text x="640" y="168" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#f59e0b">kontekst menyu</text>

  <!-- context menu native -->
  <rect x="470" y="190" width="200" height="180" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="570" y="214" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#1e293b">withContextMenu()</text>
  <rect x="486" y="226" width="168" height="24" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="494" y="243" font-family="Segoe UI" font-size="13" fill="#334155">Mening ilovam</text>
  <line x1="490" y1="258" x2="650" y2="258" stroke="#94a3b8"/>
  <rect x="486" y="264" width="168" height="24" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="494" y="281" font-family="Segoe UI" font-size="13" fill="#334155">[x] Bildirishnomalar</text>
  <rect x="486" y="290" width="168" height="24" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="494" y="307" font-family="Segoe UI" font-size="13" fill="#334155">Sayt</text>
  <line x1="490" y1="322" x2="650" y2="322" stroke="#94a3b8"/>
  <rect x="486" y="328" width="168" height="24" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="494" y="345" font-family="Segoe UI" font-size="13" fill="#dc2626">Chiqish</text>

  <text x="380" y="426" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">create() chaqirilganda dock ikonka avtomatik yashiriladi; ko'rsatish uchun ->showDockIcon().</text>

  <defs>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
  </defs>
</svg>
