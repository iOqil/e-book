<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420">
  <title>NativePHP desktop build/packaging pipeline: native:build dan distributivgacha</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b">native:build — build/packaging quvuri</text>

  <!-- Step 1 -->
  <rect x="24" y="64" width="160" height="76" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="104" y="92" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">1. preProcess</text>
  <text x="104" y="114" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">prebuild skriptlar,</text>
  <text x="104" y="131" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">.env tozalash</text>

  <!-- Step 2 -->
  <rect x="208" y="64" width="160" height="76" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="288" y="92" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">2. Bundle</text>
  <text x="288" y="114" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">ilova + PHP binar,</text>
  <text x="288" y="131" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">ikonka, CA sert.</text>

  <!-- Step 3 -->
  <rect x="392" y="64" width="160" height="76" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="472" y="92" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">3. electron-vite</text>
  <text x="472" y="114" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Electron qobiqni</text>
  <text x="472" y="131" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">build qiladi</text>

  <!-- Step 4 -->
  <rect x="576" y="64" width="160" height="76" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="656" y="92" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">4. electron-builder</text>
  <text x="656" y="114" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">platforma paketi,</text>
  <text x="656" y="131" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">imzolash</text>

  <!-- arrows -->
  <line x1="184" y1="102" x2="206" y2="102" stroke="#94a3b8" stroke-width="2" marker-end="url(#a16)"/>
  <line x1="368" y1="102" x2="390" y2="102" stroke="#94a3b8" stroke-width="2" marker-end="url(#a16)"/>
  <line x1="552" y1="102" x2="574" y2="102" stroke="#94a3b8" stroke-width="2" marker-end="url(#a16)"/>

  <!-- outputs -->
  <text x="380" y="190" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">Chiqish artefaktlari (platforma bo'yicha)</text>

  <rect x="40" y="210" width="216" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="148" y="236" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">Windows</text>
  <text x="148" y="262" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">NSIS installer:</text>
  <text x="148" y="282" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">Ilova-1.0.0-setup.exe</text>
  <text x="148" y="306" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Azure Trusted Signing</text>

  <rect x="272" y="210" width="216" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="236" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">macOS</text>
  <text x="380" y="262" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">.dmg + .app</text>
  <text x="380" y="282" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">Ilova-1.0.0-arm64.dmg</text>
  <text x="380" y="306" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">imzo + notarization</text>

  <rect x="504" y="210" width="216" height="120" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="612" y="236" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#b45309">Linux</text>
  <text x="612" y="262" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">AppImage + deb</text>
  <text x="612" y="282" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">Ilova-1.0.0.AppImage</text>
  <text x="612" y="306" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">(imzo ixtiyoriy)</text>

  <text x="380" y="368" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Hammasi: nativephp/electron/dist/ papkasida</text>
  <text x="380" y="396" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">Eslatma: build Node 22+ va Electron vositalarini talab qiladi (illustrativ).</text>

  <defs>
    <marker id="a16" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
