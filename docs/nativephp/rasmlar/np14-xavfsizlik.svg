<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Segoe UI, sans-serif">
  <title>Mobil ma'lumot xavfsizligi qatlamlari: SecureStorage, Crypt+APP_KEY, HTTPS+Sanctum</title>
  <rect width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Ma'lumot xavfsizligi qatlamlari</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#334155">qurilmani potensial dushman muhit deb faraz qiling</text>

  <!-- 1 SecureStorage -->
  <rect x="40" y="76" width="220" height="150" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="150" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#16a34a">SecureStorage</text>
  <text x="150" y="124" text-anchor="middle" font-size="13" fill="#334155">Keychain (iOS) /</text>
  <text x="150" y="142" text-anchor="middle" font-size="13" fill="#334155">Keystore (Android)</text>
  <line x1="60" y1="156" x2="240" y2="156" stroke="#94a3b8"/>
  <text x="150" y="178" text-anchor="middle" font-size="13" fill="#334155">kichik maxfiy matn:</text>
  <text x="150" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">auth_token, parol</text>
  <text x="150" y="216" text-anchor="middle" font-size="13" fill="#334155">set/get/delete</text>

  <!-- 2 Crypt + APP_KEY -->
  <rect x="280" y="76" width="220" height="150" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="390" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">Crypt + APP_KEY</text>
  <text x="390" y="124" text-anchor="middle" font-size="13" fill="#334155">har qurilmada NOYOB</text>
  <text x="390" y="142" text-anchor="middle" font-size="13" fill="#334155">APP_KEY (ilk ochilishda)</text>
  <line x1="300" y1="156" x2="480" y2="156" stroke="#94a3b8"/>
  <text x="390" y="178" text-anchor="middle" font-size="13" fill="#334155">katta ma'lumotni</text>
  <text x="390" y="196" text-anchor="middle" font-size="13" fill="#334155">SQLite'ga yozishdan</text>
  <text x="390" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">oldin shifrlash</text>

  <!-- 3 HTTPS + Sanctum -->
  <rect x="520" y="76" width="220" height="150" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="630" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#f59e0b">HTTPS + token</text>
  <text x="630" y="124" text-anchor="middle" font-size="13" fill="#334155">tarmoq aloqasi:</text>
  <text x="630" y="142" text-anchor="middle" font-size="13" fill="#334155">faqat TLS (https://)</text>
  <line x1="540" y1="156" x2="720" y2="156" stroke="#94a3b8"/>
  <text x="630" y="178" text-anchor="middle" font-size="13" fill="#334155">qisqa muddatli token</text>
  <text x="630" y="196" text-anchor="middle" font-size="13" fill="#334155">(&lt;48 soat), OAuth2</text>
  <text x="630" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Sanctum / muddati o'tadi</text>

  <!-- pastki qoidalar -->
  <rect x="40" y="252" width="700" height="150" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="390" y="280" text-anchor="middle" font-size="15" font-weight="bold" fill="#dc2626">Oltin qoidalar</text>
  <text x="64" y="308" font-size="13" fill="#334155">1. SQLite o'zi shifrlanmagan — maxfiy maydonni Crypt bilan shifrlab yozing.</text>
  <text x="64" y="332" font-size="13" fill="#334155">2. APP_KEY yoki ochiq ma'lumotni log/xato-kuzatuvga (Sentry) chiqarmang.</text>
  <text x="64" y="356" font-size="13" fill="#334155">3. Shifrlangan ma'lumot qurilmada qolsin — kalit yo'qolsa qaytarib bo'lmaydi.</text>
  <text x="64" y="380" font-size="13" fill="#334155">4. Mobil app ichiga MySQL/Postgres ulanish ma'lumotini hech qachon joylamang.</text>

  <defs></defs>
</svg>
