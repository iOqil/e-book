<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460">
  <title>iOS deploy oqimi: sertifikat va provisioning profildan TestFlight va App Store gacha</title>
  <rect width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="34" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">iOS deploy: sertifikatdan App Store gacha</text>

  <!-- Step 1: Apple Developer -->
  <rect x="40" y="64" width="220" height="110" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="90" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">1. Apple Developer</text>
  <text x="150" y="113" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">Team ID</text>
  <text x="150" y="133" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">Distribution sertifikat (.p12)</text>
  <text x="150" y="153" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">Provisioning profil</text>

  <!-- Step 2: native:package -->
  <rect x="300" y="64" width="220" height="110" rx="10" fill="#1e293b"/>
  <text x="410" y="90" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2. native:package ios</text>
  <text x="410" y="113" font-family="Segoe UI" font-size="13" fill="#e2e8f0" text-anchor="middle">--export-method=app-store</text>
  <text x="410" y="133" font-family="Segoe UI" font-size="13" fill="#e2e8f0" text-anchor="middle">Xcode arxiv</text>
  <text x="410" y="153" font-family="Segoe UI" font-size="13" fill="#f59e0b" text-anchor="middle">natija: .ipa</text>

  <!-- Step 3: App Store Connect -->
  <rect x="560" y="64" width="200" height="110" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="90" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">3. App Store Connect</text>
  <text x="660" y="113" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">--upload-to-app-store</text>
  <text x="660" y="133" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">API key (.p8)</text>
  <text x="660" y="153" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">qayta ishlanadi</text>

  <line x1="260" y1="119" x2="298" y2="119" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="520" y1="119" x2="558" y2="119" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Branch: TestFlight vs Review -->
  <rect x="200" y="240" width="160" height="80" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="280" y="268" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="middle">TestFlight</text>
  <text x="280" y="290" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">beta sinovchilar</text>
  <text x="280" y="308" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">tashqi/ichki guruh</text>

  <rect x="420" y="240" width="160" height="80" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="268" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">App Review</text>
  <text x="500" y="290" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">Apple ko'rib chiqadi</text>
  <text x="500" y="308" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">-&gt; App Store</text>

  <line x1="630" y1="174" x2="320" y2="238" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#aw)"/>
  <line x1="660" y1="174" x2="510" y2="238" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>

  <!-- Honest note -->
  <rect x="40" y="370" width="680" height="70" rx="8" fill="#fef9c3" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="60" y="396" font-family="Segoe UI" font-size="13" fill="#1e293b">HALOL: bu oqim macOS + Xcode 16+ va to'lovli Apple Developer hisobi ($99/yil) talab qiladi.</text>
  <text x="60" y="416" font-family="Segoe UI" font-size="13" fill="#1e293b">Diagramma illustrativ — bu muhitda Xcode/qurilma yo'q, hech narsa real build qilinmadi.</text>
  <text x="60" y="434" font-family="Segoe UI" font-size="13" fill="#64748b">Buyruq nomlari va bayroqlar nativephp.com/docs (mobile/3) dan olingan.</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/></marker>
    <marker id="aw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#f59e0b"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/></marker>
  </defs>
</svg>
