<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420">
  <title>NativePHP fake testlash oqimi: facade swap qilinadi, native bridge chaqirilmaydi</title>
  <rect width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b">Native::fake() testda nima qiladi</text>

  <!-- Real oqim -->
  <text x="190" y="72" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#334155">Oddiy ish (real)</text>
  <rect x="40" y="86" width="300" height="56" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="190" y="110" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">Controller: Window::open('settings')</text>
  <text x="190" y="130" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">facade -> haqiqiy WindowManager</text>

  <line x1="190" y1="142" x2="190" y2="172" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="40" y="172" width="300" height="50" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="190" y="194" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">Native bridge (IPC) -> Electron</text>
  <text x="190" y="212" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">Haqiqiy oyna ochiladi</text>

  <!-- Fake oqim -->
  <text x="570" y="72" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#334155">Testda (Window::fake())</text>
  <rect x="420" y="86" width="300" height="56" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="570" y="110" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">Controller: Window::open('settings')</text>
  <text x="570" y="130" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">facade -> WindowManagerFake</text>

  <line x1="570" y1="142" x2="570" y2="172" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>
  <rect x="420" y="172" width="300" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="570" y="194" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">Bridge CHAQIRILMAYDI</text>
  <text x="570" y="212" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">chaqiruv xotirada yoziladi</text>

  <line x1="570" y1="222" x2="570" y2="252" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>
  <rect x="420" y="252" width="300" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="570" y="276" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">Test: Window::assertOpened('settings')</text>
  <text x="570" y="296" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">PASS — Electron/Node kerak emas</text>

  <!-- xulosa -->
  <rect x="40" y="340" width="680" height="56" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="380" y="364" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">fake() facade'ni soxta nusxa bilan almashtiradi: chaqiruvlar qayd etiladi,</text>
  <text x="380" y="384" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">lekin OS/Electron'ga BORMAYDI. Shuning uchun CI'da, displeysiz ishlaydi.</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker>
  </defs>
</svg>
