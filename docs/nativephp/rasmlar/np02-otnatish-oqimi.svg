<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="Segoe UI, sans-serif">
  <title>NativePHP loyihani tayyorlash oqimi: yangi Laravel dan native:install gacha</title>
  <rect x="0" y="0" width="780" height="360" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Muhitdan birinchi native ilovagacha oqim</text>

  <!-- Bosqich 1 -->
  <rect x="30" y="70" width="160" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">1. Muhit</text>
  <text x="110" y="122" text-anchor="middle" font-size="13" fill="#334155">PHP 8.4, Node 22,</text>
  <text x="110" y="140" text-anchor="middle" font-size="13" fill="#334155">Composer</text>

  <!-- Bosqich 2 -->
  <rect x="220" y="70" width="160" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">2. Laravel</text>
  <text x="300" y="122" text-anchor="middle" font-size="13" fill="#334155">laravel new my-app</text>
  <text x="300" y="140" text-anchor="middle" font-size="13" fill="#16a34a">brauzerda sina</text>

  <!-- Bosqich 3 -->
  <rect x="410" y="70" width="160" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="490" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">3. Composer</text>
  <text x="490" y="122" text-anchor="middle" font-size="13" fill="#334155">require nativephp/</text>
  <text x="490" y="140" text-anchor="middle" font-size="13" fill="#334155">desktop</text>

  <!-- Bosqich 4 -->
  <rect x="600" y="70" width="160" height="80" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="680" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#16a34a">4. install</text>
  <text x="680" y="122" text-anchor="middle" font-size="13" fill="#334155">native:install</text>
  <text x="680" y="140" text-anchor="middle" font-size="13" fill="#334155">config + provider</text>

  <!-- O'qlar -->
  <line x1="190" y1="110" x2="218" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="380" y1="110" x2="408" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="570" y1="110" x2="598" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- Pastki qator: dev/run/build -->
  <rect x="220" y="210" width="160" height="80" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="300" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">5. native:dev</text>
  <text x="300" y="262" text-anchor="middle" font-size="13" fill="#334155">Electron + Vite</text>
  <text x="300" y="280" text-anchor="middle" font-size="13" fill="#dc2626">GUI: displey kerak</text>

  <rect x="410" y="210" width="160" height="80" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="490" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">6. native:build</text>
  <text x="490" y="262" text-anchor="middle" font-size="13" fill="#334155">o'rnatgich yasaydi</text>
  <text x="490" y="280" text-anchor="middle" font-size="13" fill="#dc2626">packaging bosqichi</text>

  <line x1="680" y1="150" x2="680" y2="250" stroke="#94a3b8" stroke-width="2"/>
  <line x1="680" y1="250" x2="572" y2="250" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="410" y1="250" x2="382" y2="250" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <text x="390" y="328" text-anchor="middle" font-size="13" fill="#334155">1-4 bosqich bu kitobda tekshirildi · 5-6 bosqich GUI/build talab qiladi (illustrativ)</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
