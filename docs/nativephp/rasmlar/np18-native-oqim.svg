<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420">
  <title>Native xususiyat oqimi: kamera va biometrika OnNative event orqali</title>
  <rect width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b">Native chaqiruv va OnNative javob oqimi</text>

  <!-- Livewire UI -->
  <rect x="40" y="70" width="200" height="90" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="140" y="100" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">Livewire UI</text>
  <text x="140" y="124" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">wire:click="capture"</text>
  <text x="140" y="144" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">(webview ichida)</text>

  <!-- PHP komponent -->
  <rect x="290" y="70" width="200" height="90" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="390" y="100" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">PHP komponent</text>
  <text x="390" y="124" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Camera::getPhoto()</text>
  <text x="390" y="144" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Biometrics::prompt()</text>

  <!-- Native bridge -->
  <rect x="540" y="70" width="200" height="90" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="640" y="100" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#f59e0b">Native bridge</text>
  <text x="640" y="124" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Swift / Kotlin</text>
  <text x="640" y="144" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">OS API (kamera/Face ID)</text>

  <line x1="240" y1="115" x2="288" y2="115" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a2)"/>
  <line x1="490" y1="115" x2="538" y2="115" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a2)"/>

  <!-- pastdan qaytish -->
  <text x="640" y="200" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">OS natija qaytaradi</text>
  <line x1="640" y1="160" x2="640" y2="230" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="640" y1="230" x2="392" y2="230" stroke="#dc2626" stroke-width="2.5" marker-end="url(#a3)"/>

  <!-- Event handler -->
  <rect x="240" y="250" width="300" height="110" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
  <text x="390" y="278" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">OnNative event handler</text>
  <text x="390" y="304" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">#[OnNative(PhotoTaken::class)]</text>
  <text x="390" y="326" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">public function onPhoto($path)</text>
  <text x="390" y="348" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">UI yangilanadi (Livewire)</text>

  <line x1="390" y1="250" x2="390" y2="200" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="240" y1="305" x2="140" y2="305" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a4)"/>
  <line x1="140" y1="305" x2="140" y2="160" stroke="#16a34a" stroke-width="2.5"/>
  <text x="140" y="200" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">re-render</text>

  <text x="380" y="395" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Native chaqiruv sinxron qaytarmaydi — natija EVENT orqali keladi</text>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
</svg>
