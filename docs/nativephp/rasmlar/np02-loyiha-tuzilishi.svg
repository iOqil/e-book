<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Segoe UI, sans-serif">
  <title>Laravel loyiha tuzilishi va NativePHP qayerga ulanadi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Laravel loyihasi va NativePHP ulanish nuqtalari</text>

  <!-- Loyiha quticha -->
  <rect x="40" y="55" width="320" height="380" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="84" font-size="15" font-weight="bold" fill="#1e293b">my-app/</text>

  <text x="78" y="112" font-size="14" fill="#334155">app/</text>
  <text x="78" y="138" font-size="14" fill="#334155">routes/web.php</text>
  <text x="78" y="164" font-size="14" fill="#334155">resources/views/  (Blade)</text>
  <text x="78" y="190" font-size="14" fill="#334155">database/  (SQLite)</text>
  <text x="78" y="216" font-size="14" fill="#334155">public/</text>
  <text x="78" y="242" font-size="14" fill="#334155">vite.config.js</text>

  <!-- NativePHP qator -->
  <rect x="60" y="262" width="280" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="74" y="282" font-size="14" fill="#1e40af">composer.json -&gt; nativephp/desktop</text>

  <rect x="60" y="302" width="280" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="74" y="322" font-size="14" fill="#1e40af">config/nativephp.php  (install)</text>

  <rect x="60" y="342" width="280" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="74" y="362" font-size="14" fill="#166534">app/Providers/NativeAppServiceProvider</text>

  <rect x="60" y="382" width="280" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="74" y="402" font-size="14" fill="#92400e">nativephp/ (install yaratadi)</text>

  <!-- O'ng tomon izoh -->
  <rect x="400" y="100" width="320" height="90" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="416" y="126" font-size="14" font-weight="bold" fill="#2563eb">native:install nima qiladi</text>
  <text x="416" y="150" font-size="13" fill="#334155">config/nativephp.php nashr qiladi,</text>
  <text x="416" y="170" font-size="13" fill="#334155">NativeAppServiceProvider qo'shadi</text>

  <rect x="400" y="205" width="320" height="90" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="416" y="231" font-size="14" font-weight="bold" fill="#16a34a">boot() ichida nima yoziladi</text>
  <text x="416" y="255" font-size="13" fill="#334155">Window::open(), Menu::..., dastlabki</text>
  <text x="416" y="275" font-size="13" fill="#334155">oyna va menyu shu yerda sozlanadi</text>

  <rect x="400" y="310" width="320" height="105" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="416" y="336" font-size="14" font-weight="bold" fill="#1e293b">Qolgan hammasi oddiy Laravel</text>
  <text x="416" y="360" font-size="13" fill="#334155">route, controller, model, Blade,</text>
  <text x="416" y="380" font-size="13" fill="#334155">migratsiya — brauzerda ham bir xil</text>
  <text x="416" y="402" font-size="13" fill="#16a34a">ishlaydi (oldin brauzerda sinab ko'r)</text>
</svg>
