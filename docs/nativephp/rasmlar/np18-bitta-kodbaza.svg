<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440">
  <title>Bitta Laravel kod-bazasidan desktop va mobil ilova</title>
  <rect width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b">Bitta kod-baza, ikki platforma</text>

  <!-- Markaz: shared Laravel codebase -->
  <rect x="250" y="70" width="260" height="150" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="380" y="98" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">Umumiy Laravel kod-bazasi</text>
  <text x="380" y="124" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Expense modeli + migratsiya</text>
  <text x="380" y="146" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Eloquent mantiq + SQLite</text>
  <text x="380" y="168" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Livewire UI (Blade)</text>
  <text x="380" y="190" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Settings + testlar</text>
  <text x="380" y="210" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">~95% kod bir xil</text>

  <!-- Strelkalar -->
  <line x1="250" y1="145" x2="150" y2="280" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="510" y1="145" x2="610" y2="280" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Desktop qobiq -->
  <rect x="40" y="285" width="280" height="120" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="180" y="312" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">DESKTOP</text>
  <text x="180" y="336" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">nativephp/desktop</text>
  <text x="180" y="358" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Electron qobiq + bundle PHP</text>
  <text x="180" y="380" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Notification, Window, Menu</text>
  <text x="180" y="398" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">.exe / .dmg / .AppImage</text>

  <!-- Mobil qobiq -->
  <rect x="440" y="285" width="280" height="120" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="580" y="312" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#f59e0b">MOBIL</text>
  <text x="580" y="336" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">nativephp/mobile</text>
  <text x="580" y="358" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Swift/Kotlin qobiq + on-device PHP</text>
  <text x="580" y="380" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Camera, Biometrics, Push</text>
  <text x="580" y="398" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">App Store / Play Store</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
