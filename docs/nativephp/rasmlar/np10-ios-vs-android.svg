<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Segoe UI, sans-serif">
  <title>iOS Swift qobiq vs Android Kotlin qobiq — bir xil Laravel kod-bazasi</title>
  <rect width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Bitta Laravel kodi, ikki platforma qobig'i</text>

  <!-- shared Laravel code -->
  <rect x="230" y="58" width="300" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Sizning Laravel ilovangiz</text>
  <text x="380" y="106" text-anchor="middle" font-size="13" fill="#334155">routes, Eloquent, Blade, Livewire — O'ZGARMAYDI</text>

  <!-- iOS branch -->
  <line x1="330" y1="122" x2="190" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar10)"/>
  <line x1="430" y1="122" x2="570" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar10)"/>

  <rect x="50" y="164" width="290" height="216" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="195" y="192" text-anchor="middle" font-size="17" font-weight="bold" fill="#16a34a">iOS</text>
  <text x="195" y="218" text-anchor="middle" font-size="14" fill="#1e293b">Swift qobiq ilova</text>
  <text x="70" y="248" font-size="13" fill="#334155">- WKWebView UI ko'rsatadi</text>
  <text x="70" y="274" font-size="13" fill="#334155">- Bundle PHP 8.4 binar</text>
  <text x="70" y="300" font-size="13" fill="#334155">- Swift bridge -&gt; native API</text>
  <text x="70" y="326" font-size="13" fill="#334155">- Build: macOS + Xcode SHART</text>
  <text x="70" y="352" font-size="13" fill="#334155">- Jo'natish: App Store</text>

  <rect x="420" y="164" width="290" height="216" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="565" y="192" text-anchor="middle" font-size="17" font-weight="bold" fill="#f59e0b">Android</text>
  <text x="565" y="218" text-anchor="middle" font-size="14" fill="#1e293b">Kotlin qobiq ilova</text>
  <text x="440" y="248" font-size="13" fill="#334155">- Android WebView UI</text>
  <text x="440" y="274" font-size="13" fill="#334155">- Bundle PHP 8.4 binar</text>
  <text x="440" y="300" font-size="13" fill="#334155">- Kotlin bridge -&gt; native API</text>
  <text x="440" y="326" font-size="13" fill="#334155">- Build: Android SDK SHART</text>
  <text x="440" y="352" font-size="13" fill="#334155">- Jo'natish: Google Play / .apk</text>

  <defs>
    <marker id="ar10" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/></marker>
  </defs>
</svg>
