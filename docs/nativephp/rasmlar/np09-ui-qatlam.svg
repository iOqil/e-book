<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Segoe UI, sans-serif">
  <title>NativePHP desktop UI qatlami: Electron oyna ichidagi webview va undagi Blade/Livewire</title>
  <rect width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">NativePHP UI qatlami</text>

  <!-- Electron qobiq -->
  <rect x="40" y="58" width="680" height="346" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="60" y="84" font-size="15" font-weight="bold" fill="#2563eb">Electron qobiq (native oyna)</text>

  <!-- Sarlavha paneli -->
  <rect x="62" y="96" width="636" height="34" rx="8" fill="#e2e8f0"/>
  <circle cx="82" cy="113" r="6" fill="#dc2626"/>
  <circle cx="100" cy="113" r="6" fill="#f59e0b"/>
  <circle cx="118" cy="113" r="6" fill="#16a34a"/>
  <text x="380" y="118" text-anchor="middle" font-size="14" fill="#334155">Mening Ilovam — sarlavha paneli</text>

  <!-- Webview -->
  <rect x="62" y="138" width="636" height="248" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="80" y="162" font-size="15" font-weight="bold" fill="#16a34a">Webview (Chromium): HTML + CSS + JS</text>

  <rect x="84" y="178" width="288" height="86" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="100" y="202" font-size="14" font-weight="bold" fill="#1e293b">Blade / Livewire</text>
  <text x="100" y="224" font-size="13" fill="#334155">Reaktiv UI, server-render</text>
  <text x="100" y="244" font-size="13" fill="#334155">Tailwind + Vite assets</text>

  <rect x="388" y="178" width="288" height="86" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="404" y="202" font-size="14" font-weight="bold" fill="#1e293b">Yoki Inertia + Vue/React</text>
  <text x="404" y="224" font-size="13" fill="#334155">SPA his, JS komponent</text>
  <text x="404" y="244" font-size="13" fill="#334155">bir xil PHP backend</text>

  <!-- PHP qatlam -->
  <rect x="84" y="280" width="592" height="86" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="100" y="304" font-size="14" font-weight="bold" fill="#2563eb">PHP biznes-mantiq (bundle qilingan binar)</text>
  <text x="100" y="326" font-size="13" fill="#334155">Route, Controller, Eloquent, Livewire klasslari — odatdagi Laravel</text>
  <text x="100" y="348" font-size="13" fill="#334155">Window / System / Menu facade'lari orqali native qobiq bilan gaplashadi</text>

  <text x="380" y="424" text-anchor="middle" font-size="13" fill="#dc2626">NativePHP sof native widget yaratmaydi — UI = webview ichidagi veb sahifa</text>
</svg>
