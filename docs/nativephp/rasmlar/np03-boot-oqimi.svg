<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480">
  <title>NativeAppServiceProvider boot() dan oyna ochilishigacha bo'lgan oqim</title>
  <rect width="820" height="480" fill="#f8fafc"/>
  <text x="410" y="36" text-anchor="middle" font-family="Segoe UI" font-size="22" fill="#1e293b" font-weight="bold">boot() dan birinchi oynagacha</text>

  <!-- 1 -->
  <rect x="250" y="62" width="320" height="58" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="88" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#2563eb" font-weight="bold">native:run / composer native:dev</text>
  <text x="410" y="110" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Electron qobiq ishga tushadi</text>

  <!-- 2 -->
  <rect x="250" y="146" width="320" height="58" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="172" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#2563eb" font-weight="bold">Laravel ilova boot bo'ladi</text>
  <text x="410" y="194" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">config('nativephp.provider') o'qiladi</text>

  <!-- 3 -->
  <rect x="250" y="230" width="320" height="62" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="410" y="256" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#16a34a" font-weight="bold">NativeAppServiceProvider::boot()</text>
  <text x="410" y="278" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Window::open()->route('salom')...</text>

  <!-- 4 -->
  <rect x="250" y="318" width="320" height="58" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="410" y="344" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#f59e0b" font-weight="bold">native bridge: window/open</text>
  <text x="410" y="366" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Electron yangi Chromium oyna yaratadi</text>

  <!-- 5 -->
  <rect x="250" y="402" width="320" height="58" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="410" y="428" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#16a34a" font-weight="bold">Oyna localhost/salom ni yuklaydi</text>
  <text x="410" y="450" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Blade view webview ichida ko'rinadi</text>

  <!-- side note -->
  <rect x="600" y="230" width="200" height="62" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="700" y="252" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155" font-weight="bold">PendingOpenWindow</text>
  <text x="700" y="272" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">zanjir __destruct da</text>
  <text x="700" y="286" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">bridge ga jo'natiladi</text>
  <line x1="570" y1="261" x2="598" y2="261" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>

  <line x1="410" y1="120" x2="410" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#c)"/>
  <line x1="410" y1="204" x2="410" y2="228" stroke="#94a3b8" stroke-width="2" marker-end="url(#c)"/>
  <line x1="410" y1="292" x2="410" y2="316" stroke="#94a3b8" stroke-width="2" marker-end="url(#c)"/>
  <line x1="410" y1="376" x2="410" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#c)"/>
  <defs>
    <marker id="c" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/></marker>
  </defs>
</svg>
