<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460">
  <title>Android deploy oqimi: keystore imzolashdan AAB va Play Console tracklarigacha</title>
  <rect width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="34" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Android deploy: keystore'dan Play Store gacha</text>

  <!-- Step 1: keystore -->
  <rect x="40" y="64" width="220" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="90" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">1. Imzolash kaliti</text>
  <text x="150" y="113" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">native:credentials android</text>
  <text x="150" y="133" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">.keystore fayl</text>
  <text x="150" y="153" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">alias + parol</text>
  <text x="150" y="173" font-family="Segoe UI" font-size="13" fill="#dc2626" text-anchor="middle">YO'QOTMA — saqla!</text>

  <!-- Step 2: native:package -->
  <rect x="300" y="64" width="220" height="120" rx="10" fill="#1e293b"/>
  <text x="410" y="90" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2. native:package</text>
  <text x="410" y="110" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">android</text>
  <text x="410" y="133" font-family="Segoe UI" font-size="13" fill="#e2e8f0" text-anchor="middle">--build-type=bundle</text>
  <text x="410" y="153" font-family="Segoe UI" font-size="13" fill="#e2e8f0" text-anchor="middle">Gradle imzolaydi</text>
  <text x="410" y="173" font-family="Segoe UI" font-size="13" fill="#f59e0b" text-anchor="middle">natija: app-release.aab</text>

  <!-- Step 3: Play Console -->
  <rect x="560" y="64" width="200" height="120" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="90" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">3. Play Console</text>
  <text x="660" y="113" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">--upload-to-play-store</text>
  <text x="660" y="133" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">service-account .json</text>
  <text x="660" y="153" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">Play App Signing</text>
  <text x="660" y="173" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">AAB -&gt; optimal APK</text>

  <line x1="260" y1="124" x2="298" y2="124" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="520" y1="124" x2="558" y2="124" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Tracks -->
  <text x="380" y="248" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">--play-store-track tracklari</text>
  <rect x="120" y="266" width="130" height="56" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="185" y="292" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">internal</text>
  <text x="185" y="311" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">jamoa</text>
  <rect x="265" y="266" width="110" height="56" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="320" y="292" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">alpha</text>
  <text x="320" y="311" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">yopiq</text>
  <rect x="390" y="266" width="110" height="56" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="445" y="292" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">beta</text>
  <text x="445" y="311" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">ochiq sinov</text>
  <rect x="515" y="266" width="130" height="56" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="580" y="292" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">production</text>
  <text x="580" y="311" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">hammaga</text>

  <!-- Honest note -->
  <rect x="40" y="356" width="680" height="84" rx="8" fill="#fef9c3" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="60" y="382" font-family="Segoe UI" font-size="13" fill="#1e293b">HALOL: Android SDK + JDK 17 + Gradle talab qiladi; Windows'da 7zip kerak. Play hisobi bir martalik $25.</text>
  <text x="60" y="402" font-family="Segoe UI" font-size="13" fill="#1e293b">AAB (bundle) Play Store uchun; APK to'g'ridan-to'g'ri tarqatish/sinov uchun. Diagramma illustrativ.</text>
  <text x="60" y="422" font-family="Segoe UI" font-size="13" fill="#64748b">Buyruq/bayroqlar nativephp.com/docs (mobile/3) dan; bu muhitda real build qilinmadi.</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/></marker>
  </defs>
</svg>
