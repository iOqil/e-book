<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430">
  <title>NativePHP mobil build pipeline: bitta Laravel kod bazasidan iOS va Android artefaktlari</title>
  <rect width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Bitta kod bazasi — ikki do'kon</text>

  <!-- Source -->
  <rect x="40" y="70" width="200" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="98" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">Laravel ilova</text>
  <text x="140" y="122" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">Blade / Livewire UI</text>
  <text x="140" y="142" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">PHP biznes-mantiq</text>
  <text x="140" y="162" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">.env: APP_ID, versiya</text>
  <text x="140" y="182" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">nativephp/mobile</text>

  <!-- native:package -->
  <rect x="290" y="95" width="170" height="70" rx="10" fill="#1e293b"/>
  <text x="375" y="125" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">php artisan</text>
  <text x="375" y="146" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="middle">native:package</text>

  <line x1="240" y1="130" x2="288" y2="130" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- iOS branch -->
  <rect x="520" y="60" width="200" height="120" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="88" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">iOS</text>
  <text x="620" y="112" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">Swift qobiq + PHP runtime</text>
  <text x="620" y="134" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">Xcode arxiv -&gt; .ipa</text>
  <text x="620" y="156" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">TestFlight / App Store</text>
  <line x1="460" y1="115" x2="518" y2="100" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arg)"/>
  <text x="486" y="92" font-family="Segoe UI" font-size="13" fill="#16a34a" text-anchor="middle">ios</text>

  <!-- Android branch -->
  <rect x="520" y="200" width="200" height="120" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="620" y="228" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="middle">Android</text>
  <text x="620" y="252" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">Kotlin qobiq + PHP runtime</text>
  <text x="620" y="274" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">Gradle -&gt; .aab / .apk</text>
  <text x="620" y="296" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">Google Play Console</text>
  <line x1="460" y1="150" x2="518" y2="240" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="486" y="210" font-family="Segoe UI" font-size="13" fill="#dc2626" text-anchor="middle">android</text>

  <!-- Honest note -->
  <rect x="40" y="350" width="680" height="56" rx="8" fill="#fef9c3" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="60" y="376" font-family="Segoe UI" font-size="13" fill="#1e293b">HALOL: native:package macOS+Xcode (iOS) yoki Android SDK+JDK (Android) talab qiladi.</text>
  <text x="60" y="396" font-family="Segoe UI" font-size="13" fill="#1e293b">UI = webview ichidagi HTML; PHP esa qurilmaning ichida ishlaydi — sof native widget emas.</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/></marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/></marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/></marker>
  </defs>
</svg>
