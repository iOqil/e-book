<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430">
  <title>Desktop (Electron + bundled PHP) va Mobil (Swift/Kotlin + on-device PHP) farqi</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b">Desktop va Mobil: bir Laravel kod, ikki qobiq</text>

  <!-- Desktop side -->
  <rect x="36" y="58" width="330" height="336" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="201" y="88" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">DESKTOP</text>
  <text x="201" y="110" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Windows · macOS · Linux</text>

  <rect x="58" y="124" width="286" height="40" rx="8" fill="#eff6ff" stroke="#94a3b8"/>
  <text x="201" y="149" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Electron qobiq (Chromium + Node)</text>

  <rect x="58" y="172" width="286" height="40" rx="8" fill="#eff6ff" stroke="#94a3b8"/>
  <text x="201" y="197" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Webview: Blade / Livewire UI</text>

  <rect x="58" y="220" width="286" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="201" y="244" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#15803d">Bundle qilingan PHP binar</text>
  <text x="201" y="264" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">(nativephp/php-bin)</text>

  <rect x="58" y="284" width="286" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="201" y="309" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">composer: nativephp/desktop</text>

  <text x="201" y="350" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">PHP 8.3+ · Laravel 11+ · Node 22+</text>
  <text x="201" y="372" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">native:install · native:dev · native:build</text>

  <!-- Mobile side -->
  <rect x="394" y="58" width="330" height="336" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="559" y="88" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#15803d">MOBIL</text>
  <text x="559" y="110" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">iOS · Android</text>

  <rect x="416" y="124" width="286" height="40" rx="8" fill="#f0fdf4" stroke="#94a3b8"/>
  <text x="559" y="149" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Swift (iOS) / Kotlin (Android) qobiq</text>

  <rect x="416" y="172" width="286" height="40" rx="8" fill="#f0fdf4" stroke="#94a3b8"/>
  <text x="559" y="197" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Webview: Blade / Livewire UI</text>

  <rect x="416" y="220" width="286" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="559" y="244" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#15803d">On-device PHP 8.4 runtime</text>
  <text x="559" y="264" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">qurilmada ishlaydi, server yo'q</text>

  <rect x="416" y="284" width="286" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="559" y="309" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">composer: nativephp/mobile (MIT)</text>

  <text x="559" y="350" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">PHP 8.4 · Xcode (iOS) · Android SDK</text>
  <text x="559" y="372" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">native:install · native:run · native:build</text>
</svg>
