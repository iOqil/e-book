<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420">
  <title>native:install buyrug'i nima qiladi - bosqichlar oqimi</title>
  <rect width="820" height="420" fill="#f8fafc"/>
  <text x="410" y="36" text-anchor="middle" font-family="Segoe UI" font-size="22" fill="#1e293b" font-weight="bold">php artisan native:install nima qiladi</text>

  <!-- step 1 -->
  <rect x="30" y="70" width="350" height="74" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="50" y="100" font-family="Segoe UI" font-size="16" fill="#2563eb" font-weight="bold">1. Service provider chiqaradi</text>
  <text x="50" y="124" font-family="Segoe UI" font-size="14" fill="#334155">app/Providers/NativeAppServiceProvider.php</text>

  <!-- step 2 -->
  <rect x="440" y="70" width="350" height="74" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="460" y="100" font-family="Segoe UI" font-size="16" fill="#2563eb" font-weight="bold">2. Config faylni chiqaradi</text>
  <text x="460" y="124" font-family="Segoe UI" font-size="14" fill="#334155">config/nativephp.php</text>

  <!-- step 3 -->
  <rect x="30" y="176" width="350" height="74" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="50" y="206" font-family="Segoe UI" font-size="16" fill="#2563eb" font-weight="bold">3. composer.json ga script</text>
  <text x="50" y="230" font-family="Segoe UI" font-size="14" fill="#334155">native:dev qo'shiladi; post-update-cmd</text>

  <!-- step 4 -->
  <rect x="440" y="176" width="350" height="74" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="460" y="206" font-family="Segoe UI" font-size="16" fill="#16a34a" font-weight="bold">4. Electron qaramligi</text>
  <text x="460" y="230" font-family="Segoe UI" font-size="14" fill="#334155">Node 22+ orqali o'rnatiladi</text>

  <!-- result box -->
  <rect x="120" y="290" width="580" height="96" rx="12" fill="#f8fafc" stroke="#16a34a" stroke-width="2.5"/>
  <text x="410" y="322" text-anchor="middle" font-family="Segoe UI" font-size="17" fill="#16a34a" font-weight="bold">Natija: loyiha endi desktop ilova bo'lishga tayyor</text>
  <text x="410" y="350" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">php artisan native:run  -yoki-  composer native:dev</text>
  <text x="410" y="372" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#94a3b8">(bu buyruqlar Node + Electron + displey talab qiladi)</text>

  <!-- arrows -->
  <line x1="380" y1="107" x2="438" y2="107" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="205" y1="144" x2="205" y2="174" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="380" y1="213" x2="438" y2="213" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="410" y1="250" x2="410" y2="288" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
