<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Segoe UI, sans-serif">
  <title>NativePHP mobil facade va event oqimi: PHP so'rovi va native javob</title>
  <rect width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Facade chaqiruvi va event qaytishi</text>
  <text x="380" y="56" text-anchor="middle" font-size="14" fill="#334155">Misol: Camera::getPhoto() va PhotoTaken eventi</text>

  <!-- step 1 -->
  <rect x="40" y="86" width="200" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">1. PHP kodingiz</text>
  <text x="140" y="138" text-anchor="middle" font-size="13" fill="#334155">Camera::getPhoto()</text>
  <text x="140" y="156" text-anchor="middle" font-size="13" fill="#64748b">chaqiriladi</text>

  <!-- step 2 -->
  <rect x="290" y="86" width="200" height="80" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="390" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">2. Native bridge</text>
  <text x="390" y="138" text-anchor="middle" font-size="13" fill="#334155">Swift/Kotlin kamerani</text>
  <text x="390" y="156" text-anchor="middle" font-size="13" fill="#334155">ochadi</text>

  <!-- step 3 -->
  <rect x="540" y="86" width="200" height="80" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="640" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">3. Foydalanuvchi</text>
  <text x="640" y="138" text-anchor="middle" font-size="13" fill="#334155">rasm oladi yoki</text>
  <text x="640" y="156" text-anchor="middle" font-size="13" fill="#334155">bekor qiladi</text>

  <line x1="240" y1="126" x2="288" y2="126" stroke="#2563eb" stroke-width="2.5" marker-end="url(#e10)"/>
  <line x1="490" y1="126" x2="538" y2="126" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#f10)"/>

  <!-- down to event -->
  <line x1="640" y1="166" x2="640" y2="232" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g10)"/>

  <!-- step 4 event -->
  <rect x="290" y="234" width="450" height="86" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="515" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">4. PhotoTaken eventi otiladi (natija $path bilan)</text>
  <text x="515" y="288" text-anchor="middle" font-size="13" fill="#334155">#[OnNative(PhotoTaken::class)] bilan belgilangan</text>
  <text x="515" y="308" text-anchor="middle" font-size="13" fill="#334155">Livewire metodi avtomatik ishga tushadi</text>

  <!-- step 5 -->
  <rect x="40" y="234" width="200" height="86" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">5. UI yangilanadi</text>
  <text x="140" y="290" text-anchor="middle" font-size="13" fill="#334155">WebView'da yangi</text>
  <text x="140" y="310" text-anchor="middle" font-size="13" fill="#334155">rasm ko'rsatiladi</text>

  <line x1="288" y1="277" x2="242" y2="277" stroke="#16a34a" stroke-width="2.5" marker-end="url(#h10)"/>

  <text x="380" y="372" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">Muhim: facade ASINXRON — natija qaytariladi EMAS, event orqali keladi</text>
  <text x="380" y="398" text-anchor="middle" font-size="13" fill="#64748b">Shuning uchun $path = Camera::getPhoto() YOZMAYsiz; event metodini kutasiz</text>

  <defs>
    <marker id="e10" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="f10" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f59e0b"/></marker>
    <marker id="g10" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
    <marker id="h10" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
  </defs>
</svg>
