<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Segoe UI, sans-serif">
  <title>Mobil UI qatlami: webview HTML, EDGE native teglar va PHP/Livewire mantiq</title>
  <rect width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Mobil UI qatlami qanday tuziladi</text>
  <text x="380" y="56" text-anchor="middle" font-size="14" fill="#334155">Ko'rinish = webview HTML; native his = EDGE teglar; mantiq = PHP</text>

  <!-- WebView UI -->
  <rect x="40" y="80" width="340" height="180" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="210" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">WebView (foydalanuvchi ko'radigan ekran)</text>
  <text x="210" y="132" text-anchor="middle" font-size="13" fill="#334155">Blade / Livewire / Inertia -> HTML + CSS</text>
  <text x="210" y="154" text-anchor="middle" font-size="13" fill="#334155">Responsive layout, touch hodisalar</text>
  <text x="210" y="176" text-anchor="middle" font-size="13" fill="#334155">safe-area (env(safe-area-inset-*))</text>
  <text x="210" y="200" text-anchor="middle" font-size="13" fill="#64748b">Bu sof webview qism — siz</text>
  <text x="210" y="220" text-anchor="middle" font-size="13" fill="#64748b">CSS bilan to'liq boshqarasiz</text>

  <!-- EDGE native components -->
  <rect x="400" y="80" width="320" height="180" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="560" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">EDGE native teglar (v3)</text>
  <text x="560" y="132" text-anchor="middle" font-size="13" fill="#334155">&lt;native:top-bar&gt;</text>
  <text x="560" y="154" text-anchor="middle" font-size="13" fill="#334155">&lt;native:bottom-nav&gt;</text>
  <text x="560" y="176" text-anchor="middle" font-size="13" fill="#334155">&lt;native:side-nav&gt;</text>
  <text x="560" y="200" text-anchor="middle" font-size="13" fill="#64748b">Bular HOT haqiqiy native widget</text>
  <text x="560" y="220" text-anchor="middle" font-size="13" fill="#64748b">(SF Symbols / Material) ga aylanadi</text>

  <!-- PHP logic -->
  <rect x="40" y="288" width="680" height="78" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="314" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">PHP / Livewire mantiq (qurilmada ishlaydi)</text>
  <text x="380" y="338" text-anchor="middle" font-size="13" fill="#334155">#[OnNative(...)] -> teglar bosilganda PHP metodi chaqiriladi</text>
  <text x="380" y="358" text-anchor="middle" font-size="13" fill="#334155">System::isIos() / isAndroid() -> platformaga qarab UI farqi</text>

  <!-- device frame -->
  <rect x="40" y="394" width="680" height="58" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Native qobiq (iOS WKWebView / Android WebView)</text>
  <text x="380" y="440" text-anchor="middle" font-size="13" fill="#64748b">webview + native teglarni bitta ekranga jamlaydi</text>

  <line x1="210" y1="260" x2="210" y2="286" stroke="#2563eb" stroke-width="2.5" marker-end="url(#m1)"/>
  <line x1="560" y1="260" x2="560" y2="286" stroke="#16a34a" stroke-width="2.5" marker-end="url(#m2)"/>
  <line x1="380" y1="366" x2="380" y2="392" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#m3)"/>

  <defs>
    <marker id="m1" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="m2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
    <marker id="m3" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f59e0b"/></marker>
  </defs>
</svg>
