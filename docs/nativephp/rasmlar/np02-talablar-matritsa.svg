<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Segoe UI, sans-serif">
  <title>NativePHP desktop va mobil talablar matritsasi</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">NativePHP talablari: Desktop va Mobil</text>

  <!-- Desktop ustun -->
  <rect x="30" y="60" width="340" height="330" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="30" y="60" width="340" height="42" rx="10" fill="#2563eb"/>
  <text x="200" y="88" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">DESKTOP (Electron)</text>
  <text x="50" y="130" font-size="15" fill="#334155">paket: nativephp/desktop</text>
  <text x="50" y="160" font-size="15" fill="#334155">PHP 8.3+ (tavsiya 8.4)</text>
  <text x="50" y="190" font-size="15" fill="#334155">Laravel 11+</text>
  <text x="50" y="220" font-size="15" fill="#334155">Node 22+</text>
  <text x="50" y="250" font-size="15" fill="#334155">OS: Windows 10+ / macOS 12+</text>
  <text x="50" y="274" font-size="15" fill="#334155">       / Linux</text>
  <text x="50" y="306" font-size="15" fill="#16a34a">PHP qurilmaga bundle qilinadi</text>
  <text x="50" y="336" font-size="15" fill="#334155">buyruq: native:install / dev</text>
  <text x="50" y="366" font-size="15" fill="#334155">             / run / build</text>

  <!-- Mobil ustun -->
  <rect x="390" y="60" width="340" height="330" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="390" y="60" width="340" height="42" rx="10" fill="#16a34a"/>
  <text x="560" y="88" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">MOBIL (Swift / Kotlin)</text>
  <text x="410" y="130" font-size="15" fill="#334155">paket: nativephp/mobile</text>
  <text x="410" y="160" font-size="15" fill="#334155">PHP 8.3+ (tavsiya 8.4)</text>
  <text x="410" y="190" font-size="15" fill="#334155">Laravel 11+</text>
  <text x="410" y="220" font-size="15" fill="#334155">iOS: Xcode 16+ (faqat macOS)</text>
  <text x="410" y="250" font-size="15" fill="#334155">Android: Studio 2024.2.1+,</text>
  <text x="410" y="274" font-size="15" fill="#334155">       SDK API 29+, JDK 17</text>
  <text x="410" y="306" font-size="15" fill="#16a34a">PHP QURILMADA ishlaydi</text>
  <text x="410" y="336" font-size="15" fill="#dc2626">.env: NATIVEPHP_APP_ID shart</text>
  <text x="410" y="366" font-size="15" fill="#334155">Windows: WSL emas, 7zip kerak</text>
</svg>
