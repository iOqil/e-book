<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 480" width="740" height="480">
  <title>Laravel ekosistemasi xaritasi: markazda Laravel framework, atrofida rasmiy vositalar — frontend (Livewire, Inertia), API va auth (Sanctum, Fortify, Passport), admin panel (Filament, Nova), queue boshqaruv (Horizon), deploy (Forge, Vapor, Cloud), izlash (Scout) va realtime (Reverb)</title>

  <rect x="0" y="0" width="740" height="480" fill="#f8fafc"/>

  <text x="370" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Laravel ekosistemasi — atrofdagi rasmiy vositalar</text>

  <!-- markaz -->
  <circle cx="370" cy="250" r="78" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="370" y="244" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#2563eb">Laravel</text>
  <text x="370" y="268" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e3a8a">framework</text>

  <!-- frontend (chap-yuqori) -->
  <rect x="44" y="78" width="190" height="86" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="139" y="102" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">Frontend / UI</text>
  <text x="139" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#5b21b6">Livewire, Inertia</text>
  <text x="139" y="144" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#5b21b6">(Vue / React)</text>

  <!-- API + Auth (o'ng-yuqori) -->
  <rect x="506" y="78" width="190" height="86" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="601" y="102" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">API / Auth</text>
  <text x="601" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">Sanctum, Fortify</text>
  <text x="601" y="144" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">Passport</text>

  <!-- Admin panel (chap-o'rta) -->
  <rect x="30" y="206" width="178" height="86" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="119" y="230" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">Admin panel</text>
  <text x="119" y="252" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#92400e">Filament, Nova</text>
  <text x="119" y="272" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#92400e">tez boshqaruv</text>

  <!-- Queue / monitoring (o'ng-o'rta) -->
  <rect x="532" y="206" width="178" height="86" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="621" y="230" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">Queue / izlash</text>
  <text x="621" y="252" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#92400e">Horizon, Scout</text>
  <text x="621" y="272" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#92400e">Reverb (realtime)</text>

  <!-- Deploy (chap-past) -->
  <rect x="44" y="334" width="190" height="86" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="139" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#334155">Deploy / hosting</text>
  <text x="139" y="380" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Forge, Vapor</text>
  <text x="139" y="400" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Cloud</text>

  <!-- Dev vositalar (o'ng-past) -->
  <rect x="506" y="334" width="190" height="86" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="601" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#334155">Dasturlash</text>
  <text x="601" y="380" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Sail, Pint, Pest</text>
  <text x="601" y="400" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Telescope, Tinker</text>

  <!-- ulovchi chiziqlar -->
  <line x1="234" y1="130" x2="312" y2="206" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="506" y1="130" x2="428" y2="206" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="208" y1="249" x2="292" y2="250" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="532" y1="249" x2="448" y2="250" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="234" y1="368" x2="312" y2="294" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="506" y1="368" x2="428" y2="294" stroke="#94a3b8" stroke-width="1.5"/>

  <text x="370" y="458" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Bularning hammasini bir kunda o'rganish shart emas — avval framework, keyin kerakligini</text>
</svg>
