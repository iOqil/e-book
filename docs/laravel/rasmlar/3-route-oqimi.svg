<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <title>Route oqimi: brauzerdan kelgan URL routes/web.php dagi mos route'ga tushadi va u closure yoki controller metodini ishga tushirib, javob (Response) qaytaradi</title>

  <rect x="0" y="0" width="720" height="360" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Bitta so'rovning yo'li: URL dan javobgacha</text>

  <!-- Brauzer -->
  <rect x="30" y="80" width="130" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="95" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">Brauzer</text>
  <text x="95" y="134" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">GET /salom</text>

  <!-- strelka 1 -->
  <line x1="160" y1="120" x2="215" y2="120" stroke="#475569" stroke-width="2"/>
  <polygon points="215,120 205,115 205,125" fill="#475569"/>

  <!-- routes/web.php -->
  <rect x="220" y="70" width="170" height="100" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="305" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">routes/web.php</text>
  <text x="305" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Route::get('/salom')</text>
  <text x="305" y="144" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">mos URL qidiriladi</text>
  <text x="305" y="162" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">topildi!</text>

  <!-- strelka 2 -->
  <line x1="390" y1="120" x2="445" y2="120" stroke="#475569" stroke-width="2"/>
  <polygon points="445,120 435,115 435,125" fill="#475569"/>

  <!-- Closure / Controller -->
  <rect x="450" y="70" width="240" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="570" y="96" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Closure yoki Controller</text>
  <line x1="570" y1="106" x2="570" y2="160" stroke="#94a3b8" stroke-width="1"/>
  <text x="510" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">function ()</text>
  <text x="510" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">{ ... }</text>
  <text x="630" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yoki</text>
  <text x="630" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Controller</text>

  <!-- strelka pastga (javob) -->
  <line x1="570" y1="170" x2="570" y2="230" stroke="#2563eb" stroke-width="2"/>
  <polygon points="570,230 565,220 575,220" fill="#2563eb"/>

  <!-- Response -->
  <rect x="450" y="230" width="240" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="570" y="258" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">Response (javob)</text>
  <text x="570" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">matn, HTML yoki JSON</text>

  <!-- javob brauzerga qaytadi -->
  <line x1="450" y1="261" x2="95" y2="261" stroke="#2563eb" stroke-width="2"/>
  <line x1="95" y1="261" x2="95" y2="160" stroke="#2563eb" stroke-width="2"/>
  <polygon points="95,160 90,170 100,170" fill="#2563eb"/>
  <text x="270" y="282" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">javob brauzerga qaytadi</text>

  <text x="360" y="332" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Route — bu URL bilan kod orasidagi "pochtachi": qaysi so'rov qaysi kodga borishini hal qiladi</text>
</svg>
