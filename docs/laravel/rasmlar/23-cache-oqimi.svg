<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>Cache oqimi: birinchi so'rov bazadan o'qiydi va natijani cache'ga yozadi, keyingi so'rovlar bazaga tegmasdan to'g'ridan-to'g'ri cache'dan tez javob oladi</title>

  <defs>
    <marker id="arrBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Cache: bir marta hisobla, ko'p marta tez qaytar</text>

  <!-- ===== 1-so'rov (cache bo'sh): bazadan ===== -->
  <text x="160" y="70" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#f59e0b">1-so'rov — cache bo'sh (miss)</text>

  <!-- so'rov -->
  <rect x="40" y="86" width="120" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="100" y="111" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">So'rov</text>

  <!-- cache (bo'sh) -->
  <rect x="40" y="156" width="120" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="100" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">Cache</text>
  <text x="100" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">bo'sh</text>

  <!-- baza -->
  <rect x="200" y="156" width="130" height="50" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="265" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Baza (MySQL)</text>
  <text x="265" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">sekin so'rov</text>

  <!-- strelkalar 1-so'rov -->
  <line x1="100" y1="126" x2="100" y2="154" stroke="#2563eb" stroke-width="2" marker-end="url(#arrBlue)"/>
  <line x1="160" y1="181" x2="198" y2="181" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
  <text x="180" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">topilmadi</text>

  <!-- natijani cache'ga yozish -->
  <path d="M 265 156 Q 265 130 160 130 Q 130 130 105 152" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrGreen)"/>
  <text x="200" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">natija cache'ga yoziladi (put)</text>

  <text x="185" y="232" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Faqat 1-marta bazaga boriladi — biroz sekin</text>

  <!-- ajratuvchi -->
  <line x1="360" y1="60" x2="360" y2="250" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ===== keyingi so'rovlar (cache to'la): cache'dan ===== -->
  <text x="540" y="70" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">Keyingi so'rovlar — cache to'la (hit)</text>

  <rect x="400" y="86" width="120" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="460" y="111" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">So'rov</text>

  <rect x="400" y="156" width="120" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="460" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Cache</text>
  <text x="460" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">to'la</text>

  <rect x="560" y="156" width="130" height="50" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="625" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#94a3b8">Baza (MySQL)</text>
  <text x="625" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">tegilmaydi</text>

  <line x1="460" y1="126" x2="460" y2="154" stroke="#2563eb" stroke-width="2" marker-end="url(#arrBlue)"/>
  <line x1="460" y1="156" x2="460" y2="130" stroke="#16a34a" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="500" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">darrov qaytadi</text>

  <!-- bazaga bormaydi belgisi -->
  <line x1="525" y1="181" x2="555" y2="181" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="540" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">X</text>

  <text x="540" y="232" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Bazaga umuman borilmaydi — juda tez</text>

  <!-- pastki xulosa -->
  <rect x="40" y="300" width="640" height="100" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="328" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b45309">Cache::remember('kalit', 3600, fn () =&gt; ...) shu mantiqni bitta qatorda bajaradi</text>
  <text x="360" y="356" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Kalit bo'sh bo'lsa — closure ishlaydi, natija saqlanadi (miss)</text>
  <text x="360" y="382" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Kalit to'la bo'lsa — closure umuman ishlamaydi, cache'dan qaytadi (hit)</text>
</svg>
