<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>Sof PHP va Laravel solishtirma: sof PHP'da har bir poydevor qismini (routing, baza, xavfsizlik, forma, sessiya) o'zing yozasan; Laravel'da bular tayyor va sinangan holda keladi, sen faqat ilovaning o'ziga e'tibor berasan</title>

  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Hammasini o'zing yozasanmi yoki tayyor poydevorgami?</text>

  <!-- chap panel: sof PHP -->
  <text x="190" y="72" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#dc2626">Sof PHP</text>
  <rect x="40" y="86" width="300" height="330" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="190" y="110" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">har loyihada qaytadan, o'zing yozasan:</text>

  <rect x="64" y="124" width="252" height="34" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="190" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#991b1b">URL marshrutlash (routing)</text>
  <rect x="64" y="164" width="252" height="34" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="190" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#991b1b">Baza ulanishi + SQL</text>
  <rect x="64" y="204" width="252" height="34" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="190" y="226" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#991b1b">Xavfsizlik (SQL inj., CSRF, XSS)</text>
  <rect x="64" y="244" width="252" height="34" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="190" y="266" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#991b1b">Forma + validatsiya</text>
  <rect x="64" y="284" width="252" height="34" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="190" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#991b1b">Sessiya, parol, login</text>
  <rect x="64" y="324" width="252" height="34" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="190" y="346" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#991b1b">Shablon, mail, fayl yuklash</text>

  <text x="190" y="388" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">ko'p takror, xatoga moyil, sekin</text>

  <!-- o'ng panel: Laravel -->
  <text x="530" y="72" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#16a34a">Laravel</text>
  <rect x="380" y="86" width="300" height="330" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="530" y="110" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">poydevor tayyor va sinangan:</text>

  <rect x="404" y="124" width="252" height="158" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="530" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">routing · Eloquent ORM · Blade</text>
  <text x="530" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">xavfsizlik (avtomatik)</text>
  <text x="530" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">validatsiya · auth · sessiya</text>
  <text x="530" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">migratsiya · queue · mail</text>
  <text x="530" y="244" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">artisan CLI · cache</text>
  <text x="530" y="268" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">— tayyor poydevor —</text>

  <rect x="404" y="294" width="252" height="64" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="530" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#15803d">SENING ILOVANG</text>
  <text x="530" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">faqat biznes mantiqqa e'tibor</text>

  <text x="530" y="388" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">kam kod, tezroq, xavfsizroq</text>

  <text x="360" y="444" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Framework — har safar boshqatdan yasamaslik uchun tayyor va sinangan poydevor</text>
</svg>
