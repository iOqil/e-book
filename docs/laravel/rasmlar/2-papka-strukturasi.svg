<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>Laravel 11+ slim loyiha papka strukturasi: asosiy papkalar (app, routes, resources, database, config, public, bootstrap) va ularning vazifasi</title>
  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Laravel loyiha strukturasi (11+ slim)</text>

  <!-- ildiz -->
  <rect x="30" y="56" width="200" height="34" rx="6" fill="#1e293b"/>
  <text x="48" y="78" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">myapp/ (loyiha ildizi)</text>

  <!-- app -->
  <rect x="60" y="100" width="150" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="74" y="120" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">app/</text>
  <text x="225" y="120" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Models, Http (Controllers) — ilova mantigi</text>

  <!-- routes -->
  <rect x="60" y="136" width="150" height="30" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="74" y="156" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">routes/</text>
  <text x="225" y="156" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">web.php, console.php — manzil-marshrutlar</text>

  <!-- resources -->
  <rect x="60" y="172" width="150" height="30" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="74" y="192" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">resources/</text>
  <text x="225" y="192" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">views (Blade), css, js — koz ko'radigan qism</text>

  <!-- database -->
  <rect x="60" y="208" width="150" height="30" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="74" y="228" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">database/</text>
  <text x="225" y="228" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">migrations, seeders, factories</text>

  <!-- config -->
  <rect x="60" y="244" width="150" height="30" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="74" y="264" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">config/</text>
  <text x="225" y="264" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">app.php, database.php — sozlama fayllar</text>

  <!-- public -->
  <rect x="60" y="280" width="150" height="30" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="74" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#475569">public/</text>
  <text x="225" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">index.php — KIRISH nuqtasi (brauzer shu yerga)</text>

  <!-- bootstrap -->
  <rect x="60" y="316" width="150" height="30" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="74" y="336" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#475569">bootstrap/</text>
  <text x="225" y="336" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">app.php — ilova sozlanadigan markaz (slim!)</text>

  <!-- fayllar -->
  <rect x="60" y="352" width="150" height="30" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="74" y="372" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">.env</text>
  <text x="225" y="372" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">maxfiy sozlamalar (parol, kalit) — git'ga tushmaydi</text>

  <rect x="60" y="388" width="150" height="30" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="74" y="408" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">artisan</text>
  <text x="225" y="408" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">buyruqlar vositasi (php artisan ...)</text>

  <!-- izoh -->
  <text x="360" y="448" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Slim struktura: Kernel.php fayllari yo'q — middleware/sozlama bootstrap/app.php da</text>
</svg>
