<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <title>Test yo'q vaqtdagi qo'lda qayta-qayta tekshirish sikli va test bor vaqtdagi bitta buyruq bilan avtomatik tekshirish farqi</title>

  <rect x="0" y="0" width="720" height="420" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Nega test kerak? Qo'lda vs avtomatik tekshirish</text>

  <!-- chap panel: qo'lda -->
  <text x="185" y="72" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">Testsiz: har o'zgarishda qo'lda</text>
  <rect x="30" y="86" width="310" height="280" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>

  <rect x="55" y="106" width="260" height="38" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="185" y="130" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Brauzerni ochish</text>
  <text x="185" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#dc2626">&#8595;</text>

  <rect x="55" y="170" width="260" height="38" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="185" y="194" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Formani qo'lda to'ldirish</text>
  <text x="185" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#dc2626">&#8595;</text>

  <rect x="55" y="234" width="260" height="38" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="185" y="258" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Natijani ko'z bilan tekshirish</text>

  <!-- aylanma o'q: yana boshidan -->
  <path d="M 70 290 Q 30 300 50 320 L 300 320 Q 320 300 300 290" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="300,285 308,292 296,296" fill="#dc2626"/>
  <text x="185" y="345" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#dc2626" font-weight="bold">Har kichik o'zgarishda QAYTA boshidan</text>

  <!-- o'ng panel: avtomatik -->
  <text x="535" y="72" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">Test bilan: bitta buyruq</text>
  <rect x="380" y="86" width="310" height="280" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>

  <rect x="420" y="118" width="230" height="40" rx="6" fill="#1e293b"/>
  <text x="535" y="143" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#ffffff">php artisan test</text>
  <text x="535" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#16a34a">&#8595;</text>

  <rect x="420" y="192" width="230" height="120" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="437" y="218" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">&#10003; buyurtma beriladi</text>
  <text x="437" y="244" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">&#10003; tugagan mahsulot rad</text>
  <text x="437" y="270" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">&#10003; mehmon to'siladi</text>
  <text x="437" y="298" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">3 passed &#183; 0.42s</text>

  <text x="535" y="345" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#16a34a" font-weight="bold">Bir marta yoz, million marta ishlat</text>

  <!-- pastki xulosa -->
  <text x="360" y="398" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Test = kelajakdagi o'zingizga yozilgan xavfsizlik to'ri</text>
</svg>
