<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>Autentifikatsiya oqimi: ro'yxatdan o'tish yoki kirish, parol hash bilan tekshiriladi, sessiyaga yoziladi, keyin himoyalangan sahifa ochiladi</title>
  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Autentifikatsiya oqimi: kirgandan himoyalangan sahifagacha</text>

  <!-- 1. Register -->
  <rect x="40" y="64" width="180" height="86" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">1. Ro'yxatdan o'tish</text>
  <text x="130" y="114" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">name, email, parol</text>
  <text x="130" y="134" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">parol -&gt; Hash::make</text>

  <!-- OR / 1b. Login -->
  <rect x="40" y="180" width="180" height="86" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="208" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">1b. Kirish (login)</text>
  <text x="130" y="230" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">email + parol</text>
  <text x="130" y="250" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Auth::attempt(...)</text>

  <!-- arrow 1 -> 2 -->
  <line x1="220" y1="107" x2="290" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="220" y1="223" x2="290" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 2. Parol tekshirish -->
  <rect x="295" y="120" width="180" height="96" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="385" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b45309">2. Parol mosmi?</text>
  <text x="385" y="170" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Hash::check(kiritilgan,</text>
  <text x="385" y="188" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">bazadagi_hash)</text>
  <text x="385" y="208" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">bcrypt solishtirish</text>

  <!-- mos emas -> xato -->
  <line x1="385" y1="216" x2="385" y2="266" stroke="#dc2626" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="430" y="245" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">mos emas</text>
  <rect x="305" y="270" width="160" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="385" y="295" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">Xato: orqaga, withErrors</text>

  <!-- mos -> session -->
  <line x1="475" y1="168" x2="540" y2="168" stroke="#16a34a" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="508" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">mos</text>

  <!-- 3. Session -->
  <rect x="545" y="120" width="150" height="96" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">3. Sessiya</text>
  <text x="620" y="170" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">user_id sessiyaga</text>
  <text x="620" y="188" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yoziladi (cookie)</text>
  <text x="620" y="208" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">"endi kirgan"</text>

  <!-- session -> protected -->
  <line x1="620" y1="216" x2="620" y2="300" stroke="#16a34a" stroke-width="2" marker-end="url(#arrG)"/>

  <!-- 4. Protected page -->
  <rect x="500" y="304" width="195" height="84" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="597" y="332" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">4. Himoyalangan sahifa</text>
  <text x="597" y="354" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">middleware('auth') ochadi</text>
  <text x="597" y="374" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">auth()-&gt;user() tayyor</text>

  <!-- bottom note -->
  <text x="360" y="420" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Har keyingi so'rovda sessiyadagi cookie tekshiriladi — qayta parol so'ralmaydi</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#16a34a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#dc2626"/></marker>
  </defs>
</svg>
