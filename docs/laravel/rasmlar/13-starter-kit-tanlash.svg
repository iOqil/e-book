<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 470" width="740" height="470">
  <title>Laravel 13 auth yechimini tanlash: rasmiy starter kit (React/Vue/Livewire, UI bilan), Fortify (faqat backend mantiq, UI yo'q) yoki eski sodda Breeze</title>
  <rect x="0" y="0" width="740" height="470" fill="#f8fafc"/>

  <text x="370" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Auth yechimini qaysi birini tanlash?</text>

  <!-- savol -->
  <rect x="240" y="54" width="260" height="50" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="370" y="78" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">Sizga tayyor UI (sahifalar) kerakmi?</text>
  <text x="370" y="96" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">login/register ekranlari tayyor bo'lsinmi?</text>

  <line x1="370" y1="104" x2="160" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="370" y1="104" x2="580" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="235" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">HA, UI ham kerak</text>
  <text x="520" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">YO'Q, faqat mantiq</text>

  <!-- Starter kit -->
  <rect x="40" y="148" width="245" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="162" y="174" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">Starter Kit</text>
  <text x="162" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">React / Vue / Livewire</text>
  <line x1="60" y1="208" x2="265" y2="208" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="162" y="228" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">login + register sahifalar</text>
  <text x="162" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">parol reset, email tasdiq</text>
  <text x="162" y="268" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">profil sahifasi — hammasi</text>
  <text x="162" y="288" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">laravel new ... bilan tanlanadi</text>

  <!-- Fortify -->
  <rect x="455" y="148" width="245" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="577" y="174" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">Fortify</text>
  <text x="577" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">faqat backend mantiq</text>
  <line x1="475" y1="208" x2="680" y2="208" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="577" y="228" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">route + mantiq tayyor</text>
  <text x="577" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">UI'ni O'ZINGIZ yozasiz</text>
  <text x="577" y="268" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">API/SPA uchun qulay</text>
  <text x="577" y="288" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">to'liq nazorat kerak bo'lsa</text>

  <!-- Breeze (eski) -->
  <rect x="200" y="326" width="340" height="92" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="370" y="352" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#475569">Breeze (eski, sodda variant)</text>
  <text x="370" y="374" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Blade + oddiy sahifalar, o'rganish uchun yaxshi</text>
  <text x="370" y="396" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yangi loyihalarda starter kit tavsiya etiladi</text>

  <text x="370" y="448" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Hamma yechimning yuragi bitta: Auth facade, sessiya va parol hash — faqat ustki qatlam farq qiladi</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
  </defs>
</svg>
