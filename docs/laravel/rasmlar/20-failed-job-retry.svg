<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>Muvaffaqiyatsiz job oqimi: worker ishni bajaradi, xato chiqsa qayta urinadi (tries), urinishlar tugagach failed_jobs jadvaliga tushadi, keyin queue:retry bilan qayta navbatga qo'yiladi</title>
  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Job xato bersa nima bo'ladi? Retry oqimi</text>

  <!-- worker handle -->
  <rect x="280" y="58" width="160" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="82" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Worker: handle()</text>
  <text x="360" y="102" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ishni bajarishga urinadi</text>

  <line x1="360" y1="114" x2="360" y2="148" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- qaror romb -->
  <polygon points="360,150 452,196 360,242 268,196" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="192" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#92400e">Xato</text>
  <text x="360" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#92400e">chiqdimi?</text>

  <!-- yo'q -> muvaffaqiyat -->
  <line x1="452" y1="196" x2="560" y2="196" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <text x="500" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">yo'q</text>
  <rect x="562" y="170" width="138" height="52" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="631" y="194" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">Bajarildi</text>
  <text x="631" y="213" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">job o'chiriladi</text>

  <!-- ha pastga -->
  <line x1="360" y1="242" x2="360" y2="276" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
  <text x="378" y="264" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">ha</text>

  <!-- urinishlar qoldi? -->
  <rect x="252" y="278" width="216" height="54" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="301" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#b45309">urinish qoldimi? (tries)</text>
  <text x="360" y="321" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">--tries=3 yoki $tries</text>

  <!-- ha: qayta navbatga (chapga, yuqoriga loop) -->
  <line x1="252" y1="305" x2="150" y2="305" stroke="#f59e0b" stroke-width="2"/>
  <line x1="150" y1="305" x2="150" y2="86" stroke="#f59e0b" stroke-width="2"/>
  <line x1="150" y1="86" x2="278" y2="86" stroke="#f59e0b" stroke-width="2" marker-end="url(#aw)"/>
  <text x="150" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#b45309" transform="rotate(-90 150 200)">ha: qayta navbatga qo'yiladi</text>

  <!-- yo'q: failed_jobs -->
  <line x1="360" y1="332" x2="360" y2="362" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
  <text x="392" y="350" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">yo'q (tugadi)</text>

  <rect x="248" y="364" width="224" height="48" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="360" y="386" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">failed_jobs jadvaliga tushadi</text>
  <text x="360" y="405" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#991b1b">failed() metodi chaqiriladi</text>

  <!-- queue:retry -->
  <line x1="472" y1="388" x2="560" y2="388" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
  <rect x="500" y="338" width="200" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="600" y="362" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">php artisan queue:retry</text>
  <text x="600" y="380" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">qo'lda qayta navbatga</text>
  <line x1="600" y1="382" x2="600" y2="408" stroke="#2563eb" stroke-width="2"/>
  <line x1="600" y1="408" x2="472" y2="408" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3"/>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="4" refY="7" orient="auto"><path d="M0,0 L8,0 L4,8 Z" fill="#475569"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="4" refY="7" orient="auto"><path d="M0,0 L8,0 L4,8 Z" fill="#dc2626"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
    <marker id="aw" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f59e0b"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
  </defs>
</svg>
