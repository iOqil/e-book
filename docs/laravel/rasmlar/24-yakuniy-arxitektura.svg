<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>Yakuniy loyiha arxitekturasi: brauzerdan kelgan so'rov route, auth middleware, controller, validatsiya, policy va Eloquent model orqali bazaga boradi; qaytishda controller Blade ko'rinishini HTML qilib brauzerga qaytaradi</title>

  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Yakuniy loyiha: to'liq so'rov oqimi (vazifa-menejeri)</text>

  <!-- Brauzer -->
  <rect x="285" y="58" width="150" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="80" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">Brauzer</text>
  <text x="360" y="99" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">POST /tasks</text>

  <!-- arrow down -->
  <line x1="360" y1="108" x2="360" y2="132" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Route -->
  <rect x="260" y="132" width="200" height="46" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="153" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Route (routes/web.php)</text>
  <text x="360" y="171" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Route::resource('tasks', ...)</text>

  <line x1="360" y1="178" x2="360" y2="200" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Middleware auth -->
  <rect x="240" y="200" width="240" height="46" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="221" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">Middleware: auth</text>
  <text x="360" y="239" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">kirmaganni login'ga yo'naltiradi</text>

  <line x1="360" y1="246" x2="360" y2="268" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Controller -->
  <rect x="220" y="268" width="280" height="84" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="360" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">TaskController@store</text>
  <text x="360" y="312" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">1. validate() — forma tekshiruvi</text>
  <text x="360" y="332" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">2. user()->tasks()->create() — saqlash</text>

  <!-- Validatsiya/Policy yon yorliqlar -->
  <rect x="40" y="270" width="150" height="40" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="115" y="288" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">Validatsiya</text>
  <text x="115" y="305" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">xato -> 422/qaytish</text>
  <line x1="220" y1="300" x2="190" y2="295" stroke="#16a34a" stroke-width="2" marker-end="url(#arrg)"/>

  <rect x="525" y="262" width="160" height="56" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="605" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">Policy</text>
  <text x="605" y="298" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">edit/update/destroy:</text>
  <text x="605" y="314" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">begona -> 403</text>
  <line x1="500" y1="300" x2="530" y2="295" stroke="#16a34a" stroke-width="2" marker-end="url(#arrg)"/>

  <line x1="360" y1="352" x2="360" y2="374" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Model -->
  <rect x="255" y="374" width="210" height="46" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="395" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Eloquent: Task model</text>
  <text x="360" y="413" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">user()->tasks()->create()</text>

  <!-- Baza -->
  <rect x="500" y="377" width="180" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="590" y="402" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Baza (tasks jadval)</text>
  <line x1="465" y1="397" x2="500" y2="397" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- qaytish: Blade -->
  <rect x="40" y="374" width="180" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="395" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">Blade -> HTML</text>
  <text x="130" y="413" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">redirect + view</text>

  <text x="360" y="452" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Saqlangach: redirect -> tasks.index -> Blade ro'yxatni HTML qilib brauzerga qaytaradi</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
