<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360">
  <title>Fayl upload oqimi: HTML forma orqali yuborilgan fayl validatsiyadan o'tadi, store() bilan diskka saqlanadi, qaytgan yo'l bazaga yoziladi va Storage::url() bilan URL hosil qilinadi</title>
  <rect x="0" y="0" width="760" height="360" fill="#f8fafc"/>

  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Fayl upload oqimi: formadan diskgacha</text>

  <!-- 1: Forma -->
  <rect x="24" y="70" width="150" height="92" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="99" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">1. Forma</text>
  <text x="99" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">enctype=</text>
  <text x="99" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">multipart/form-data</text>

  <!-- 2: Validate -->
  <rect x="206" y="70" width="150" height="92" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="281" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b45309">2. Validate</text>
  <text x="281" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">image | mimes</text>
  <text x="281" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">max:2048</text>

  <!-- 3: store() -->
  <rect x="388" y="70" width="150" height="92" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="463" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">3. store()</text>
  <text x="463" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">faylni diskka</text>
  <text x="463" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">yozadi</text>

  <!-- 4: Disk -->
  <rect x="570" y="70" width="166" height="92" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/>
  <text x="653" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">4. Disk</text>
  <text x="653" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">local / public / s3</text>
  <text x="653" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">faylni saqlaydi</text>

  <!-- strelkalar (qator 1) -->
  <line x1="174" y1="116" x2="204" y2="116" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a18u)"/>
  <line x1="356" y1="116" x2="386" y2="116" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a18u)"/>
  <line x1="538" y1="116" x2="568" y2="116" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a18u)"/>

  <!-- pastga: yo'l qaytadi -->
  <line x1="463" y1="162" x2="463" y2="226" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a18g)"/>
  <text x="478" y="198" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">qaytadi: nisbiy yo'l</text>

  <!-- 5: bazaga yo'l yoziladi -->
  <rect x="206" y="232" width="320" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="366" y="256" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">5. Bazaga yo'l yoziladi</text>
  <text x="366" y="278" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">rasm = "avatars/x9k.jpg"  (faylning O'ZI emas, yo'li)</text>

  <!-- 6: URL -->
  <rect x="206" y="304" width="320" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="366" y="331" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">6. Storage::url($yol) -&gt; brauzerda ko'rsatiladigan URL</text>

  <line x1="366" y1="288" x2="366" y2="302" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a18u)"/>

  <defs>
    <marker id="a18u" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/></marker>
    <marker id="a18g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#16a34a"/></marker>
  </defs>
</svg>
