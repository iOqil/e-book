<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>Sinxron va queue yondashuvi farqi: sinxron rejimda foydalanuvchi og'ir ish tugaguncha kutadi, queue rejimida esa darhol javob oladi va og'ir ish orqa fonda bajariladi</title>
  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>

  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Sinxron vs Queue — foydalanuvchi qancha kutadi?</text>

  <!-- chap panel: sinxron -->
  <text x="190" y="68" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#dc2626">Sinxron (sekin)</text>
  <rect x="36" y="82" width="308" height="300" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>

  <rect x="60" y="104" width="120" height="40" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="120" y="129" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Foydalanuvchi</text>

  <line x1="180" y1="124" x2="250" y2="124" stroke="#475569" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="215" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">so'rov</text>

  <rect x="200" y="158" width="120" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="260" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Controller</text>
  <text x="260" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">email yuboradi</text>

  <rect x="80" y="224" width="200" height="56" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="180" y="246" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">og'ir ish: 4 soniya</text>
  <text x="180" y="266" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">brauzer aylanib turadi...</text>

  <line x1="120" y1="296" x2="120" y2="334" stroke="#475569" stroke-width="2" marker-end="url(#arrowD)"/>
  <rect x="60" y="338" width="200" height="34" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="160" y="360" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">javob — 4 soniyadan keyin</text>

  <!-- o'ng panel: queue -->
  <text x="530" y="68" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#16a34a">Queue (tez)</text>
  <rect x="376" y="82" width="308" height="300" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>

  <rect x="400" y="104" width="120" height="40" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="460" y="129" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Foydalanuvchi</text>

  <line x1="520" y1="124" x2="590" y2="124" stroke="#475569" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="555" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">so'rov</text>

  <rect x="540" y="158" width="120" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="600" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Controller</text>
  <text x="600" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">ishni navbatga</text>

  <rect x="420" y="224" width="200" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="520" y="249" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">navbatga qo'yish: ~10 ms</text>

  <line x1="460" y1="280" x2="460" y2="316" stroke="#475569" stroke-width="2" marker-end="url(#arrowD)"/>
  <rect x="400" y="320" width="200" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="500" y="342" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">javob — deyarli darhol</text>

  <text x="530" y="372" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">og'ir ish orqa fonda davom etadi</text>

  <!-- pastki izoh -->
  <text x="360" y="412" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Queue: foydalanuvchi kutmaydi — sekin ishni "keyinroq qil" deb navbatga qo'yamiz</text>

  <defs>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="arrowD" markerWidth="9" markerHeight="9" refX="4" refY="7" orient="auto">
      <path d="M0,0 L8,0 L4,8 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
