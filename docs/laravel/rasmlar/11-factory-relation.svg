<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>Factory munosabati: User::factory()->has(Post::factory()->count(5)) bitta user va unga bog'langan 5 ta postni yaratadi, har postda user_id avtomatik to'ldiriladi</title>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Factory munosabati: User va uning 5 ta posti</text>

  <!-- kod qatori -->
  <rect x="80" y="56" width="560" height="40" rx="8" fill="#1e293b"/>
  <text x="360" y="81" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#f8fafc">User::factory()-&gt;has(Post::factory()-&gt;count(5))-&gt;create()</text>

  <!-- User qutisi -->
  <rect x="60" y="128" width="200" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">User</text>
  <line x1="80" y1="166" x2="240" y2="166" stroke="#94a3b8" stroke-width="1"/>
  <text x="160" y="190" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">id: 1</text>
  <text x="160" y="214" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">name: "Aziz Karimov"</text>

  <!-- has belgisi -->
  <text x="360" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#7c3aed">has( 5 )</text>
  <text x="360" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">hasMany</text>

  <!-- strelkalar 5 ta postga -->
  <line x1="260" y1="178" x2="455" y2="120" stroke="#7c3aed" stroke-width="2"/>
  <polygon points="451,116 461,117 453,127" fill="#7c3aed"/>
  <line x1="260" y1="178" x2="455" y2="159" stroke="#7c3aed" stroke-width="2"/>
  <polygon points="451,155 461,159 451,164" fill="#7c3aed"/>
  <line x1="260" y1="178" x2="455" y2="198" stroke="#7c3aed" stroke-width="2"/>
  <polygon points="451,194 461,198 451,203" fill="#7c3aed"/>
  <line x1="260" y1="178" x2="455" y2="237" stroke="#7c3aed" stroke-width="2"/>
  <polygon points="451,233 461,237 451,242" fill="#7c3aed"/>
  <line x1="260" y1="178" x2="455" y2="276" stroke="#7c3aed" stroke-width="2"/>
  <polygon points="451,272 461,273 453,283" fill="#7c3aed"/>

  <!-- 5 ta post qutisi -->
  <rect x="462" y="104" width="200" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="562" y="126" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Post id:1  user_id: 1</text>
  <rect x="462" y="143" width="200" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="562" y="165" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Post id:2  user_id: 1</text>
  <rect x="462" y="182" width="200" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="562" y="204" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Post id:3  user_id: 1</text>
  <rect x="462" y="221" width="200" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="562" y="243" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Post id:4  user_id: 1</text>
  <rect x="462" y="260" width="200" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="562" y="282" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Post id:5  user_id: 1</text>

  <!-- user_id urg'u -->
  <text x="562" y="313" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">user_id avtomatik to'ldiriladi</text>

  <!-- pastki izohlar -->
  <line x1="60" y1="335" x2="660" y2="335" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="360" y="362" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">has() — "ota" tomondan: avval User yaratiladi, keyin unga bog'langan Post'lar.</text>
  <text x="360" y="388" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Teskari yo'l for(): Post::factory()-&gt;for(User::factory()) — postdan boshlab egasini tayinlash.</text>
  <text x="360" y="414" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Natija: 1 user + 5 post, FK to'g'ri bog'langan — qo'lda user_id yozish shart emas.</text>
</svg>
