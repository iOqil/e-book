<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>Eloquent munosabat turlari: bir-birga (1:1 hasOne), bir-koplab (1:N hasMany), koplab-koplab (N:M belongsToMany) — har biri ER ko'rinishida modellar va kalitlar bilan</title>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>

  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Eloquent munosabat turlari</text>

  <!-- ============ 1:1 ============ -->
  <text x="120" y="70" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">1 : 1</text>
  <text x="120" y="90" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">hasOne / belongsTo</text>

  <rect x="40" y="104" width="150" height="64" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="115" y="126" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">User</text>
  <text x="55" y="148" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">id (PK)</text>
  <text x="55" y="162" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">name</text>

  <rect x="40" y="210" width="150" height="64" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="115" y="232" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Profile</text>
  <text x="55" y="254" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">id (PK)</text>
  <text x="55" y="268" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">user_id (FK)</text>

  <line x1="115" y1="168" x2="115" y2="210" stroke="#16a34a" stroke-width="2.5"/>
  <circle cx="115" cy="189" r="13" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="115" y="194" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">1</text>
  <text x="120" y="300" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Bir userda</text>
  <text x="120" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">bitta profil</text>

  <!-- ============ 1:N ============ -->
  <text x="360" y="70" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">1 : N</text>
  <text x="360" y="90" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">hasMany / belongsTo</text>

  <rect x="285" y="104" width="150" height="64" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="126" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">User</text>
  <text x="300" y="148" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">id (PK)</text>
  <text x="300" y="162" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">name</text>

  <rect x="285" y="210" width="150" height="64" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="232" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Post</text>
  <text x="300" y="254" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">id (PK)</text>
  <text x="300" y="268" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">user_id (FK)</text>

  <line x1="360" y1="168" x2="360" y2="210" stroke="#16a34a" stroke-width="2.5"/>
  <circle cx="345" cy="178" r="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="345" y="183" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">1</text>
  <circle cx="375" cy="200" r="11" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="375" y="205" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#b45309">N</text>
  <text x="360" y="300" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Bir user koplab</text>
  <text x="360" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">post yozadi</text>

  <!-- ============ N:M ============ -->
  <text x="600" y="70" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">N : M</text>
  <text x="600" y="90" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">belongsToMany</text>

  <rect x="525" y="104" width="150" height="50" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="600" y="125" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Post</text>
  <text x="540" y="145" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">id (PK)</text>

  <rect x="525" y="186" width="150" height="56" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="206" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#b45309">post_tag</text>
  <text x="540" y="225" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">post_id (FK)</text>
  <text x="540" y="239" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">tag_id (FK)</text>

  <rect x="525" y="274" width="150" height="50" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="600" y="295" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Tag</text>
  <text x="540" y="315" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">id (PK)</text>

  <line x1="600" y1="154" x2="600" y2="186" stroke="#7c3aed" stroke-width="2.5"/>
  <line x1="600" y1="242" x2="600" y2="274" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="600" y="350" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Pivot jadval orqali:</text>
  <text x="600" y="368" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">post koplab tag,</text>
  <text x="600" y="386" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tag koplab post</text>

  <!-- pastki izoh -->
  <rect x="40" y="408" width="640" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="426" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Qoida: FK ("user_id") doim "koplab" tomonda turadi. N:M da esa ikkala FK alohida pivot jadvalda.</text>
  <text x="360" y="444" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">belongsTo — har doim teskari (inverse) munosabat, FK ushlab turgan modelda yoziladi.</text>
</svg>
