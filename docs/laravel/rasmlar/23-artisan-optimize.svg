<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>php artisan optimize buyrug'i config, route va view fayllarini bitta tez yuklanadigan keshlangan faylga birlashtiradi, shunda har so'rovda o'nlab fayl qayta o'qilmaydi</title>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>

  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">php artisan optimize — productionda tezlik</text>

  <!-- ===== chap: optimize'siz (har so'rovda qayta o'qiladi) ===== -->
  <text x="185" y="68" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">Keshsiz — har so'rovda</text>

  <rect x="40" y="84" width="290" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="185" y="109" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Har bir so'rov keladi</text>

  <rect x="40" y="138" width="290" height="32" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="185" y="159" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">config/ dagi ~20 fayl o'qiladi</text>

  <rect x="40" y="176" width="290" height="32" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="185" y="197" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">routes/ fayllari tahlil qilinadi</text>

  <rect x="40" y="214" width="290" height="32" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="185" y="235" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Blade .blade.php PHP'ga aylanadi</text>

  <text x="185" y="276" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">Hammasi har safar qaytadan — sekin</text>

  <!-- ajratuvchi -->
  <line x1="360" y1="60" x2="360" y2="300" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ===== o'ng: optimize bilan ===== -->
  <text x="535" y="68" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">optimize bilan — bir marta</text>

  <!-- buyruq -->
  <rect x="390" y="84" width="290" height="40" rx="8" fill="#1e293b"/>
  <text x="535" y="109" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">$ php artisan optimize</text>

  <!-- uchta manba bitta faylga -->
  <rect x="390" y="140" width="86" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="433" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">config</text>
  <text x="433" y="174" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">:cache</text>

  <rect x="492" y="140" width="86" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="535" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">route</text>
  <text x="535" y="174" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">:cache</text>

  <rect x="594" y="140" width="86" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="637" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">view</text>
  <text x="637" y="174" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">:cache</text>

  <!-- strelkalar pastga -->
  <line x1="433" y1="180" x2="490" y2="216" stroke="#16a34a" stroke-width="2"/>
  <line x1="535" y1="180" x2="535" y2="214" stroke="#16a34a" stroke-width="2"/>
  <line x1="637" y1="180" x2="580" y2="216" stroke="#16a34a" stroke-width="2"/>

  <!-- birlashgan kesh -->
  <rect x="430" y="218" width="210" height="48" rx="8" fill="#16a34a"/>
  <text x="535" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">bootstrap/cache/ ga</text>
  <text x="535" y="258" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dcfce7">bitta tayyor PHP fayl</text>

  <text x="535" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">Har so'rov shu bitta faylni o'qiydi — tez</text>

  <!-- pastki ogohlantirish -->
  <rect x="40" y="320" width="640" height="124" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="348" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b45309">Faqat PRODUCTIONda ishlating</text>
  <text x="360" y="374" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Lokal ishlashda config:cache .env o'zgarishini "muzlatib" qo'yadi —</text>
  <text x="360" y="396" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">o'zgarishlar ko'rinmay sizni chalg'itadi. Tozalash:</text>
  <text x="360" y="424" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">php artisan optimize:clear</text>
</svg>
