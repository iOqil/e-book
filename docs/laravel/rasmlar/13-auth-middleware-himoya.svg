<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <title>auth middleware himoyasi: kirgan foydalanuvchi himoyalangan sahifaga o'tadi, kirmagan mehmon esa login sahifasiga qaytariladi</title>
  <rect x="0" y="0" width="720" height="420" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">auth middleware — eshik qorovuli</text>

  <!-- target page -->
  <rect x="500" y="150" width="180" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="590" y="184" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">/dashboard</text>
  <text x="590" y="206" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">himoyalangan sahifa</text>

  <!-- middleware gate -->
  <rect x="300" y="120" width="140" height="140" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="370" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b45309">auth</text>
  <text x="370" y="170" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">middleware</text>
  <text x="370" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Kirganmi?</text>
  <text x="370" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">auth()-&gt;check()</text>

  <!-- logged user -->
  <rect x="40" y="90" width="170" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="125" y="118" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">Kirgan user</text>
  <text x="125" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">sessiyada user_id bor</text>

  <!-- guest -->
  <rect x="40" y="230" width="170" height="70" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="125" y="258" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#475569">Mehmon (guest)</text>
  <text x="125" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">kirmagan</text>

  <!-- user -> gate -->
  <line x1="210" y1="125" x2="300" y2="155" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
  <!-- guest -> gate -->
  <line x1="210" y1="265" x2="300" y2="225" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>

  <!-- gate -> dashboard (pass) -->
  <line x1="440" y1="175" x2="500" y2="185" stroke="#16a34a" stroke-width="2.5" marker-end="url(#agr)"/>
  <text x="470" y="165" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">o'tkazadi</text>

  <!-- gate -> login (redirect) -->
  <path d="M370,260 L370,330" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <text x="450" y="300" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">redirect -&gt; /login</text>

  <!-- login page -->
  <rect x="280" y="334" width="180" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="370" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">/login</text>
  <text x="370" y="378" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">"Avval kiring"</text>

  <text x="125" y="350" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Mehmon esa qorovuldan</text>
  <text x="125" y="370" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">o'tolmaydi</text>

  <defs>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/></marker>
    <marker id="agr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#16a34a"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#dc2626"/></marker>
  </defs>
</svg>
