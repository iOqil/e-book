<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>x-layout komponenti umumiy karkasni (head, header, footer) saqlaydi; har sahifa faqat o'ziga xos mazmunni $slot orqali uzatadi va nomli x-slot:header bilan sarlavhani to'ldiradi</title>

  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>

  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Layout komponenti: bir karkas, ko'p sahifa</text>

  <!-- left: page using component -->
  <rect x="28" y="62" width="288" height="330" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="172" y="86" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">bosh.blade.php (sahifa)</text>

  <text x="44" y="116" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">&lt;x-layout&gt;</text>

  <rect x="56" y="128" width="248" height="58" rx="6" fill="#fde68a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="68" y="148" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">&lt;x-slot:header&gt;</text>
  <text x="68" y="168" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">  Kutubxona</text>
  <text x="68" y="183" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">&lt;/x-slot:header&gt;</text>

  <rect x="56" y="198" width="248" height="78" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="68" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">  &lt;p&gt;Xush kelibsiz!&lt;/p&gt;</text>
  <text x="68" y="246" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">  &lt;p&gt;Bu — asosiy</text>
  <text x="68" y="264" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">     mazmun ($slot)&lt;/p&gt;</text>

  <text x="44" y="298" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">&lt;/x-layout&gt;</text>
  <text x="172" y="338" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Sahifa faqat O'ZGARADIGAN</text>
  <text x="172" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">qismni yozadi: header + mazmun</text>
  <text x="172" y="380" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(takrorlanuvchi HTML yo'q)</text>

  <!-- arrow -->
  <line x1="320" y1="227" x2="372" y2="227" stroke="#475569" stroke-width="2.5" marker-end="url(#arr2)"/>
  <text x="346" y="217" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">to'ldiradi</text>

  <!-- right: layout component -->
  <rect x="380" y="62" width="312" height="330" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="536" y="86" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#475569">components/layout.blade.php</text>

  <text x="396" y="114" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#7c3aed">@props(['sarlavha' =&gt; '...'])</text>
  <text x="396" y="136" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">&lt;html&gt;&lt;head&gt;&lt;title&gt;</text>
  <text x="396" y="156" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#7c3aed">  {{ $sarlavha }}</text>
  <text x="396" y="176" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">&lt;/title&gt;&lt;/head&gt;&lt;body&gt;</text>

  <rect x="392" y="190" width="288" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="404" y="212" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">  &lt;header&gt; {{ $header }} &lt;/header&gt;</text>

  <rect x="392" y="232" width="288" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="404" y="254" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">  &lt;main&gt; {{ $slot }} &lt;/main&gt;</text>

  <text x="396" y="290" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">  &lt;footer&gt;(c) 2026&lt;/footer&gt;</text>
  <text x="396" y="310" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">&lt;/body&gt;&lt;/html&gt;</text>

  <text x="536" y="344" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Karkas BIR MARTA yoziladi:</text>
  <text x="536" y="364" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">head, header, footer — hamma</text>
  <text x="536" y="384" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">sahifa shuni qayta ishlatadi</text>

  <!-- bottom -->
  <text x="360" y="428" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">$slot — teglar orasidagi asosiy mazmun. $header — nomli &lt;x-slot:header&gt; mazmuni.</text>
  <text x="360" y="452" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">@props — sarlavha kabi atributlarni qabul qilib o'zgaruvchiga aylantiradi.</text>

  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
