<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>Eloquent modelining hayot sikli va observer hooklari: creating/created saqlashda, updating/updated yangilashda, deleting/deleted ochirishda; -ing bazadan oldin, -ed keyin ishlaydi</title>

  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Model hayot sikli: -ing (oldin) va -ed (keyin)</text>

  <text x="360" y="62" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Observer modelning ichki hodisalarini ushlaydi</text>

  <!-- Central DB column -->
  <rect x="300" y="92" width="120" height="338" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="120" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">BAZA</text>
  <text x="360" y="142" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(SQL yoziladi)</text>

  <!-- Row: CREATE -->
  <text x="50" y="180" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">CREATE</text>
  <rect x="120" y="160" width="140" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">creating()</text>
  <text x="190" y="197" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">oldin: slug yasash</text>
  <line x1="260" y1="182" x2="298" y2="182" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="422" y1="182" x2="458" y2="182" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
  <rect x="460" y="160" width="150" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="535" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">created()</text>
  <text x="535" y="197" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">keyin: id endi bor</text>

  <!-- Row: UPDATE -->
  <text x="50" y="280" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">UPDATE</text>
  <rect x="120" y="260" width="140" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">updating()</text>
  <text x="190" y="297" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">oldin</text>
  <line x1="260" y1="282" x2="298" y2="282" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="422" y1="282" x2="458" y2="282" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
  <rect x="460" y="260" width="150" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="535" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">updated()</text>
  <text x="535" y="297" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">keyin</text>

  <!-- Row: DELETE -->
  <text x="50" y="380" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">DELETE</text>
  <rect x="120" y="360" width="140" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="190" y="380" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">deleting()</text>
  <text x="190" y="397" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">oldin: tozalash</text>
  <line x1="260" y1="382" x2="298" y2="382" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="422" y1="382" x2="458" y2="382" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
  <rect x="460" y="360" width="150" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="535" y="380" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">deleted()</text>
  <text x="535" y="397" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">keyin</text>

  <!-- bottom note -->
  <text x="360" y="448" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Eslatma: Post::query()-&gt;update() ommaviy so'rov modelni yuklamaydi — observer ishlamaydi</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/></marker>
  </defs>
</svg>
