<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <title>Authentication (kimsan?) va Authorization (nima qila olasan?) farqi: avval kim ekaningni aniqlaymiz, keyin shu amalga ruxsating bor-yo'qligini tekshiramiz</title>
  <rect x="0" y="0" width="720" height="380" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Authentication vs Authorization</text>

  <!-- chap panel: Authentication -->
  <rect x="40" y="64" width="300" height="250" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="94" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#2563eb">Authentication</text>
  <text x="190" y="118" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">"Sen kimsan?"</text>
  <text x="190" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Email + parol bilan</text>
  <text x="190" y="170" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">tizimga kirish</text>
  <text x="190" y="206" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">13-bobda o'rgandik</text>
  <rect x="70" y="226" width="240" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="190" y="252" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">Natija:</text>
  <text x="190" y="276" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">auth()-&gt;user() = Aziz</text>

  <!-- strelka -->
  <line x1="345" y1="189" x2="375" y2="189" stroke="#475569" stroke-width="2.5"/>
  <polygon points="375,184 388,189 375,194" fill="#475569"/>

  <!-- o'ng panel: Authorization -->
  <rect x="380" y="64" width="300" height="250" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="530" y="94" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#16a34a">Authorization</text>
  <text x="530" y="118" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">"Nima qila olasan?"</text>
  <text x="530" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Bu amalga ruxsating</text>
  <text x="530" y="170" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">bor-yo'qligini tekshirish</text>
  <text x="530" y="206" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">SHU BOB: Gates va Policies</text>
  <rect x="410" y="226" width="240" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="530" y="252" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Natija:</text>
  <text x="530" y="276" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">bu postni tahrirlay oladimi?</text>

  <!-- pastki izoh -->
  <text x="360" y="346" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Tizimga kirgan bo'lish (authn) HAR amalga ruxsat degani EMAS (authz)</text>
</svg>
