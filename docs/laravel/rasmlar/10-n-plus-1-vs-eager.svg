<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>N+1 muammosi va eager loading farqi: with() ishlatmasa har post uchun alohida muallif so'rovi yuboriladi (1+N so'rov), with() ishlatilsa hammasi 2 ta so'rovda olinadi</title>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>

  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">N+1 muammosi va uning yechimi</text>

  <!-- ===== chap panel: N+1 (yomon) ===== -->
  <text x="190" y="66" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">N+1 — with() YO'Q</text>

  <!-- 1-so'rov: postlar -->
  <rect x="40" y="80" width="300" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="105" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">1) SELECT * FROM posts  (3 ta post)</text>

  <!-- har post uchun alohida so'rov -->
  <rect x="40" y="134" width="300" height="34" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="190" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">2) SELECT * FROM users WHERE id = 5</text>

  <rect x="40" y="174" width="300" height="34" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="190" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">3) SELECT * FROM users WHERE id = 8</text>

  <rect x="40" y="214" width="300" height="34" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="190" y="236" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">4) SELECT * FROM users WHERE id = 2</text>

  <text x="190" y="278" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Har post uchun bittadan qo'shimcha so'rov</text>
  <text x="190" y="302" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">Jami: 1 + N = 1 + 3 = 4 so'rov</text>
  <text x="190" y="326" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">1000 post bo'lsa — 1001 so'rov! Sekin.</text>

  <!-- ===== o'ng panel: eager (yaxshi) ===== -->
  <text x="530" y="66" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">Eager — with('user')</text>

  <rect x="380" y="80" width="300" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="530" y="105" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">1) SELECT * FROM posts  (3 ta post)</text>

  <rect x="380" y="134" width="300" height="72" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="530" y="162" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">2) SELECT * FROM users</text>
  <text x="530" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">WHERE id IN (5, 8, 2)</text>

  <text x="530" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Hamma muallif bitta so'rovda olinadi</text>
  <text x="530" y="302" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">Jami: doim 2 so'rov</text>
  <text x="530" y="326" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">1000 post bo'lsa ham — atigi 2 so'rov!</text>

  <!-- pastki xulosa -->
  <line x1="40" y1="360" x2="680" y2="360" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="40" y="378" width="640" height="74" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="406" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b45309">Qoida: munosabatni siklda ishlatadigan bo'lsang — oldindan with() bilan yukla</text>
  <text x="360" y="432" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Post::with('user')->get();   // N+1 yo'qoladi, 2 ta so'rov qoladi</text>
</svg>
