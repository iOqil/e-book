<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360">
  <title>Mail yuborish oqimi: Mailable klassi xat mazmunini tayyorlaydi, Mail::to(...)->send() uni mail driverga (.env dagi MAIL_MAILER) topshiradi, driver esa xatni qabul qiluvchining pochtasiga yetkazadi yoki sinov uchun log faylga yozadi</title>
  <rect x="0" y="0" width="760" height="360" fill="#f8fafc"/>

  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Email qanday yetkaziladi: Mailable -&gt; driver -&gt; pochta</text>

  <!-- 1: Mailable -->
  <rect x="24" y="72" width="172" height="104" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="110" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">1. Mailable klass</text>
  <text x="110" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">WelcomeMail</text>
  <text x="110" y="144" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">mavzu + shablon</text>
  <text x="110" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">+ ma'lumot</text>

  <!-- 2: send -->
  <rect x="228" y="72" width="172" height="104" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="314" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b45309">2. Mail::to()</text>
  <text x="314" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">-&gt;send($mailable)</text>
  <text x="314" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">kimga + jonatish</text>

  <!-- 3: driver -->
  <rect x="432" y="72" width="172" height="104" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="518" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">3. Mail driver</text>
  <text x="518" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">.env: MAIL_MAILER</text>
  <text x="518" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">smtp / log / ...</text>

  <!-- strelkalar -->
  <line x1="196" y1="124" x2="226" y2="124" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a19a)"/>
  <line x1="400" y1="124" x2="430" y2="124" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a19a)"/>

  <!-- 4a: real pochta -->
  <rect x="636" y="48" width="104" height="68" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="688" y="76" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">SMTP</text>
  <text x="688" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">real pochta</text>

  <!-- 4b: log -->
  <rect x="636" y="132" width="104" height="68" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="688" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">log</text>
  <text x="688" y="182" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">faylga yozadi</text>

  <line x1="604" y1="110" x2="634" y2="86" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a19b)"/>
  <line x1="604" y1="138" x2="634" y2="160" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a19a)"/>

  <!-- pastki izoh blok -->
  <rect x="120" y="234" width="520" height="92" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="380" y="262" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">Sinov vaqtida real email YUBORMAYsiz</text>
  <text x="380" y="287" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">MAIL_MAILER=log -&gt; xat storage/logs/laravel.log ga yoziladi</text>
  <text x="380" y="309" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">Mailtrap -&gt; xat soxta pochta qutisida ko'rinadi, hech kimga ketmaydi</text>

  <defs>
    <marker id="a19a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/></marker>
    <marker id="a19b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/></marker>
  </defs>
</svg>
