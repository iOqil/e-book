<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">
  <title>php artisan serve buyrugi mahalliy server ishga tushiradi, brauzer 127.0.0.1:8000 ga so'rov yuboradi, public/index.php orqali Laravel javob qaytaradi</title>
  <rect x="0" y="0" width="720" height="400" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">php artisan serve — so'rovning yo'li</text>

  <!-- terminal -->
  <rect x="40" y="70" width="230" height="110" rx="10" fill="#1e293b"/>
  <text x="60" y="96" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">Terminal</text>
  <text x="60" y="124" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">$ php artisan serve</text>
  <text x="60" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#e2e8f0">Server running on</text>
  <text x="60" y="168" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#f59e0b">http://127.0.0.1:8000</text>

  <!-- brauzer -->
  <rect x="450" y="70" width="230" height="110" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="450" y="70" width="230" height="26" rx="10" fill="#dbeafe"/>
  <circle cx="466" cy="83" r="4" fill="#dc2626"/>
  <circle cx="480" cy="83" r="4" fill="#f59e0b"/>
  <circle cx="494" cy="83" r="4" fill="#16a34a"/>
  <text x="585" y="88" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">127.0.0.1:8000</text>
  <text x="565" y="135" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">Laravel</text>
  <text x="565" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Xush kelibsiz sahifasi</text>

  <!-- server doirasi -->
  <rect x="260" y="220" width="200" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">public/index.php</text>
  <text x="360" y="270" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">kirish nuqtasi -&gt; routes</text>

  <!-- ok: brauzer -> server (so'rov) -->
  <path d="M520 182 C520 210, 470 215, 462 235" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#req)"/>
  <text x="540" y="212" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">1. so'rov (GET /)</text>

  <!-- ok: terminal server qancha -->
  <path d="M155 182 C155 210, 250 215, 258 240" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#run)"/>
  <text x="150" y="232" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">server ushlab turadi</text>

  <!-- ok: server -> brauzer (javob) -->
  <path d="M460 258 C540 258, 560 220, 562 184" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#res)"/>
  <text x="560" y="252" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">2. HTML javob</text>

  <!-- pastki izoh -->
  <text x="360" y="330" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">serve — faqat ishlab chiqish (development) uchun mahalliy server</text>
  <text x="360" y="356" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Haqiqiy saytda Nginx/Apache public/index.php ga so'rovni yo'naltiradi</text>
  <text x="360" y="380" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Terminalni yopsangiz server to'xtaydi (Ctrl + C)</text>

  <defs>
    <marker id="req" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/>
    </marker>
    <marker id="res" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/>
    </marker>
    <marker id="run" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
