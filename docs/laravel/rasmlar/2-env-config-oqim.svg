<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <title>.env faylidagi qiymatlar config papkasidagi sozlama fayllar orqali ilovaga uzatilishi: ilova kodda env() emas, config() ni o'qiydi</title>
  <rect x="0" y="0" width="720" height="380" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">.env -&gt; config -&gt; ilova oqimi</text>

  <!-- .env -->
  <rect x="40" y="80" width="180" height="150" rx="10" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text x="130" y="106" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">.env</text>
  <line x1="40" y1="116" x2="220" y2="116" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="56" y="140" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">APP_NAME=Blog</text>
  <text x="56" y="164" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">APP_ENV=local</text>
  <text x="56" y="188" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">DB_DATABASE=blog</text>
  <text x="56" y="212" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">DB_PASSWORD=secret</text>

  <!-- ok 1 -->
  <line x1="222" y1="155" x2="288" y2="155" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="255" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">env()</text>

  <!-- config -->
  <rect x="290" y="80" width="180" height="150" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="380" y="106" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#7c3aed">config/</text>
  <line x1="290" y1="116" x2="470" y2="116" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="306" y="140" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">app.php</text>
  <text x="306" y="164" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">database.php</text>
  <text x="306" y="194" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">'name' =&gt;</text>
  <text x="306" y="212" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">env('APP_NAME')</text>

  <!-- ok 2 -->
  <line x1="472" y1="155" x2="538" y2="155" stroke="#16a34a" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="505" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">config()</text>

  <!-- ilova -->
  <rect x="540" y="80" width="160" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="106" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">Ilova kodi</text>
  <line x1="540" y1="116" x2="700" y2="116" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="620" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">config('app.name')</text>
  <text x="620" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Controller,</text>
  <text x="620" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Blade, Model</text>

  <!-- pastki izohlar -->
  <text x="360" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Qoida: ilova kodida config() ni o'qing, env() ni EMAS</text>
  <text x="360" y="308" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">config:cache ishlatilganda env() faqat config fayllarda ishlaydi, kodda null qaytaradi</text>
  <text x="360" y="336" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">.env maxfiy: parol va kalitlar shu yerda, git'ga hech qachon yuklanmaydi (.gitignore)</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
