<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>Bitta UserRegistered hodisasi bir nechta mustaqil listenerga tarqaladi: xush kelibsiz email, log yozish va adminga xabar; har biri mustaqil reaksiya</title>

  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Bitta hodisa, ko'p mustaqil reaksiya</text>

  <!-- Controller -->
  <rect x="40" y="80" width="150" height="86" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="115" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Controller</text>
  <text x="115" y="136" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">user yaratdi,</text>
  <text x="115" y="154" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">e'lon qiladi</text>

  <!-- dispatch arrow -->
  <line x1="190" y1="123" x2="276" y2="123" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="233" y="113" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">dispatch</text>

  <!-- Event -->
  <rect x="278" y="86" width="150" height="74" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="353" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">UserRegistered</text>
  <text x="353" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Event (ichida $user)</text>

  <!-- fan-out lines to 3 listeners -->
  <line x1="428" y1="123" x2="520" y2="118" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowg)"/>
  <line x1="428" y1="123" x2="520" y2="225" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowg)"/>
  <line x1="428" y1="123" x2="520" y2="332" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowg)"/>

  <!-- Listener 1 -->
  <rect x="522" y="84" width="170" height="68" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="607" y="111" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">SendWelcomeEmail</text>
  <text x="607" y="133" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">xush kelibsiz email</text>

  <!-- Listener 2 -->
  <rect x="522" y="191" width="170" height="68" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="607" y="218" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">LogRegistration</text>
  <text x="607" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">logga yozadi</text>

  <!-- Listener 3 -->
  <rect x="522" y="298" width="170" height="68" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="607" y="325" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">NotifyAdmin</text>
  <text x="607" y="347" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">adminga xabar</text>

  <!-- bottom note -->
  <text x="360" y="400" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Controller listenerlarni bilmaydi — yangi reaksiya = yangi listener, controllerga tegilmaydi</text>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
