<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460">
  <title>Eloquent CRUD metodlari va ular yaratadigan SQL: create INSERT, find/all/where SELECT, save/update UPDATE, delete DELETE buyrugiga aylanadi</title>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="460" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">CRUD: Eloquent metodi -&gt; SQL buyrugi</text>

  <!-- ustun sarlavhalari -->
  <text x="200" y="68" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#475569">Sen yozasan (PHP)</text>
  <text x="540" y="68" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#475569">Eloquent yuboradi (SQL)</text>

  <!-- CREATE -->
  <rect x="30" y="84" width="60" height="66" rx="8" fill="#16a34a"/>
  <text x="60" y="123" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">C</text>
  <rect x="100" y="84" width="270" height="66" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="116" y="110" font-family="Consolas, monospace" font-size="13" fill="#1e293b">Post::create([...])</text>
  <text x="116" y="134" font-family="Consolas, monospace" font-size="13" fill="#1e293b">$post-&gt;save()</text>
  <text x="385" y="122" font-family="Segoe UI, system-ui, sans-serif" font-size="18" fill="#94a3b8">-&gt;</text>
  <rect x="410" y="84" width="280" height="66" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="426" y="123" font-family="Consolas, monospace" font-size="13" fill="#16a34a">INSERT INTO posts (...)</text>

  <!-- READ -->
  <rect x="30" y="160" width="60" height="84" rx="8" fill="#2563eb"/>
  <text x="60" y="208" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">R</text>
  <rect x="100" y="160" width="270" height="84" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="116" y="184" font-family="Consolas, monospace" font-size="13" fill="#1e293b">Post::find(1)</text>
  <text x="116" y="206" font-family="Consolas, monospace" font-size="13" fill="#1e293b">Post::all()</text>
  <text x="116" y="228" font-family="Consolas, monospace" font-size="13" fill="#1e293b">Post::where(...)-&gt;get()</text>
  <text x="385" y="207" font-family="Segoe UI, system-ui, sans-serif" font-size="18" fill="#94a3b8">-&gt;</text>
  <rect x="410" y="160" width="280" height="84" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="426" y="208" font-family="Consolas, monospace" font-size="13" fill="#2563eb">SELECT * FROM posts ...</text>

  <!-- UPDATE -->
  <rect x="30" y="254" width="60" height="66" rx="8" fill="#f59e0b"/>
  <text x="60" y="293" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">U</text>
  <rect x="100" y="254" width="270" height="66" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="116" y="280" font-family="Consolas, monospace" font-size="13" fill="#1e293b">$post-&gt;update([...])</text>
  <text x="116" y="304" font-family="Consolas, monospace" font-size="13" fill="#1e293b">$post-&gt;save()</text>
  <text x="385" y="292" font-family="Segoe UI, system-ui, sans-serif" font-size="18" fill="#94a3b8">-&gt;</text>
  <rect x="410" y="254" width="280" height="66" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="426" y="293" font-family="Consolas, monospace" font-size="13" fill="#b45309">UPDATE posts SET ...</text>

  <!-- DELETE -->
  <rect x="30" y="330" width="60" height="66" rx="8" fill="#dc2626"/>
  <text x="60" y="369" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">D</text>
  <rect x="100" y="330" width="270" height="66" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="116" y="356" font-family="Consolas, monospace" font-size="13" fill="#1e293b">$post-&gt;delete()</text>
  <text x="116" y="380" font-family="Consolas, monospace" font-size="13" fill="#1e293b">Post::destroy(1)</text>
  <text x="385" y="368" font-family="Segoe UI, system-ui, sans-serif" font-size="18" fill="#94a3b8">-&gt;</text>
  <rect x="410" y="330" width="280" height="66" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="426" y="369" font-family="Consolas, monospace" font-size="13" fill="#dc2626">DELETE FROM posts ...</text>

  <text x="360" y="436" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Sen SQL yozmaysan — Eloquent uni sen tanlagan metoddan o'zi tuzadi</text>
</svg>
