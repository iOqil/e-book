<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Test piramidasi: pastda ko'p va tez unit testlar, o'rtada feature/komponent testlari (Livewire shu yerda), tepada kam va sekin E2E testlar</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Test piramidasi</text>

  <!-- TOP: E2E -->
  <polygon points="380,62 300,138 460,138" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="380" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">E2E</text>
  <text x="380" y="128" text-anchor="middle" font-size="13" fill="#991b1b">uchma-uch</text>

  <!-- MIDDLE: feature/komponent -->
  <polygon points="300,142 460,142 540,258 220,258" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="380" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">Feature / komponent</text>
  <text x="380" y="213" text-anchor="middle" font-size="14" font-weight="700" fill="#fb70a9">Livewire::test(...) shu yerda</text>
  <text x="380" y="237" text-anchor="middle" font-size="13" fill="#475569">komponent + holat + render + baza</text>

  <!-- BOTTOM: unit -->
  <polygon points="220,262 540,262 620,410 140,410" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="380" y="312" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">Unit</text>
  <text x="380" y="336" text-anchor="middle" font-size="13" fill="#475569">eng kichik bo'lak (bitta funksiya)</text>
  <text x="380" y="360" text-anchor="middle" font-size="13" fill="#475569">juda ko'p, juda tez</text>

  <!-- left axis: count -->
  <line x1="105" y1="70" x2="105" y2="410" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="105,66 100,80 110,80" fill="#94a3b8"/>
  <text x="92" y="92" text-anchor="middle" font-size="13" fill="#dc2626" transform="rotate(-90 92 92)">kam</text>
  <text x="92" y="390" text-anchor="middle" font-size="13" fill="#16a34a" transform="rotate(-90 92 390)">ko'p</text>
  <text x="78" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#475569" transform="rotate(-90 78 240)">soni</text>

  <!-- right axis: speed -->
  <line x1="655" y1="70" x2="655" y2="410" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="655,66 650,80 660,80" fill="#94a3b8"/>
  <text x="668" y="92" text-anchor="middle" font-size="13" fill="#dc2626" transform="rotate(90 668 92)">sekin</text>
  <text x="668" y="390" text-anchor="middle" font-size="13" fill="#16a34a" transform="rotate(90 668 390)">tez</text>
  <text x="684" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#475569" transform="rotate(90 684 240)">tezligi</text>

  <!-- footer note -->
  <rect x="140" y="426" width="480" height="32" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="380" y="447" text-anchor="middle" font-size="13" fill="#475569">Livewire ilovasida asosiy kuch — o'rtadagi komponent testlariga</text>
</svg>
