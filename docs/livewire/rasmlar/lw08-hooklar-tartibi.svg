<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="Segoe UI, system-ui, sans-serif">
  <title>Bitta keyingi so'rov ichida hooklar ketma-ketligi: boot, hydrate, booted, updating, updated, rendering, render, rendered, dehydrate</title>
  <rect x="0" y="0" width="760" height="560" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Hooklar tartibi (keyingi so'rovda)</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">Yuqoridan pastga — wire:model bilan xususiyat o'zgargandagi to'liq ketma-ketlik</text>

  <!-- 1 boot -->
  <rect x="250" y="84" width="260" height="40" rx="9" fill="#4f46e5"/>
  <text x="380" y="109" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1. boot()  — eng boshda</text>

  <!-- 2 hydrate -->
  <rect x="250" y="134" width="260" height="40" rx="9" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="380" y="159" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">2. hydrate()  — holat tiklanadi</text>

  <!-- 3 booted -->
  <rect x="250" y="184" width="260" height="40" rx="9" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="380" y="209" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">3. booted()</text>

  <!-- 4 updating (faqat o'zgarishda) -->
  <rect x="250" y="234" width="260" height="40" rx="9" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="259" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">4. updating()  &#8594; updatingProp()</text>

  <!-- 5 updated (faqat o'zgarishda) -->
  <rect x="250" y="284" width="260" height="40" rx="9" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="309" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">5. updated()  &#8594; updatedProp()</text>

  <!-- 6 rendering -->
  <rect x="250" y="334" width="260" height="40" rx="9" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="380" y="359" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">6. rendering()</text>

  <!-- 7 render -->
  <rect x="250" y="384" width="260" height="40" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="380" y="409" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">7. [ render: HTML yasaladi ]</text>

  <!-- 8 rendered -->
  <rect x="250" y="434" width="260" height="40" rx="9" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="380" y="459" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">8. rendered()</text>

  <!-- 9 dehydrate -->
  <rect x="250" y="484" width="260" height="40" rx="9" fill="#16a34a"/>
  <text x="380" y="509" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">9. dehydrate()  — eng oxiri</text>

  <!-- strelkalar -->
  <g stroke="#94a3b8" stroke-width="2" fill="#94a3b8">
    <line x1="380" y1="124" x2="380" y2="132"/><polygon points="380,134 375,127 385,127"/>
    <line x1="380" y1="174" x2="380" y2="182"/><polygon points="380,184 375,177 385,177"/>
    <line x1="380" y1="224" x2="380" y2="232"/><polygon points="380,234 375,227 385,227"/>
    <line x1="380" y1="274" x2="380" y2="282"/><polygon points="380,284 375,277 385,277"/>
    <line x1="380" y1="324" x2="380" y2="332"/><polygon points="380,334 375,327 385,327"/>
    <line x1="380" y1="374" x2="380" y2="382"/><polygon points="380,384 375,377 385,377"/>
    <line x1="380" y1="424" x2="380" y2="432"/><polygon points="380,434 375,427 385,427"/>
    <line x1="380" y1="474" x2="380" y2="482"/><polygon points="380,484 375,477 385,477"/>
  </g>

  <!-- izoh: sariq qutilar faqat o'zgarishda -->
  <rect x="540" y="234" width="190" height="90" rx="9" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="635" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Sariq qadamlar</text>
  <text x="635" y="278" text-anchor="middle" font-size="13" fill="#475569">faqat xususiyat</text>
  <text x="635" y="296" text-anchor="middle" font-size="13" fill="#475569">o'zgarganda bo'ladi.</text>
  <text x="635" y="314" text-anchor="middle" font-size="13" fill="#94a3b8">Action'da ular yo'q.</text>

  <!-- izoh: birinchi so'rov farqi -->
  <rect x="30" y="134" width="190" height="90" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="125" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">Birinchi so'rovda</text>
  <text x="125" y="178" text-anchor="middle" font-size="13" fill="#475569">hydrate o'rnida</text>
  <text x="125" y="196" text-anchor="middle" font-size="13" fill="#1e293b">mount() ishlaydi</text>
  <text x="125" y="214" text-anchor="middle" font-size="13" fill="#94a3b8">(faqat bir marta)</text>
</svg>
