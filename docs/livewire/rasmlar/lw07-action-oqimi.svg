<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Action oqimi: foydalanuvchi tugmani bosadi, wire:click serverga AJAX so'rov yuboradi, server public metodni bajaradi va komponentni qayta render qiladi, faqat o'zgargan diff brauzer DOM'iga qo'llanadi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Action oqimi: tugmadan natijagacha</text>

  <!-- Ustun sarlavhalari -->
  <rect x="40" y="56" width="320" height="36" rx="9" fill="#4f46e5"/>
  <text x="200" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Brauzer (mijoz)</text>
  <rect x="400" y="56" width="320" height="36" rx="9" fill="#fb70a9"/>
  <text x="560" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Server (PHP / Livewire)</text>

  <!-- 1: tugma bosildi -->
  <rect x="34" y="108" width="32" height="24" rx="6" fill="#f59e0b"/>
  <text x="50" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <rect x="74" y="104" width="270" height="56" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="209" y="127" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Foydalanuvchi tugmani bosadi</text>
  <rect x="92" y="134" width="234" height="20" rx="5" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="209" y="149" text-anchor="middle" font-size="13" fill="#4f46e5">wire:click="increment"</text>

  <!-- strelka: AJAX so'rov o'ngga -->
  <rect x="34" y="186" width="32" height="24" rx="6" fill="#4f46e5"/>
  <text x="50" y="203" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <line x1="200" y1="220" x2="556" y2="220" stroke="#4f46e5" stroke-width="2.5"/>
  <polygon points="556,220 544,214 544,226" fill="#4f46e5"/>
  <text x="378" y="213" text-anchor="middle" font-size="13" fill="#4f46e5">AJAX so'rov: snapshot + chaqiriladigan metod nomi</text>

  <!-- 3: server metodni bajaradi -->
  <rect x="34" y="244" width="32" height="24" rx="6" fill="#fb70a9"/>
  <text x="50" y="261" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
  <rect x="400" y="240" width="320" height="74" rx="10" fill="#ffffff" stroke="#fb70a9" stroke-width="2"/>
  <text x="560" y="263" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Server public metodni bajaradi</text>
  <rect x="420" y="272" width="280" height="22" rx="5" fill="#fdf2f8" stroke="#fbcfe8"/>
  <text x="560" y="288" text-anchor="middle" font-size="13" fill="#be185d">public function increment() { $this-&gt;count++; }</text>
  <text x="560" y="308" text-anchor="middle" font-size="13" fill="#475569">so'ng komponent qayta render qilinadi</text>

  <!-- 4: diff qaytadi chapga -->
  <rect x="34" y="332" width="32" height="24" rx="6" fill="#16a34a"/>
  <text x="50" y="349" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
  <line x1="560" y1="344" x2="204" y2="344" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="204,344 216,338 216,350" fill="#16a34a"/>
  <text x="378" y="337" text-anchor="middle" font-size="13" fill="#16a34a">Faqat o'zgargan qism (DIFF) qaytadi</text>

  <!-- 5: DOM yangilanadi -->
  <rect x="34" y="372" width="32" height="24" rx="6" fill="#16a34a"/>
  <text x="50" y="389" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">5</text>
  <rect x="74" y="368" width="270" height="56" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="209" y="391" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Livewire faqat o'zgargan</text>
  <text x="209" y="411" text-anchor="middle" font-size="13" fill="#475569">DOM'ni yangilaydi (sahifa qayta yuklanmaydi)</text>

  <text x="380" y="452" text-anchor="middle" font-size="13" fill="#94a3b8">Har action shu 1–5 oqimni takrorlaydi. Siz hech qanday JavaScript yozmaysiz.</text>
</svg>
