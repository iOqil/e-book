<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Segoe UI, system-ui, sans-serif">
  <title>URL ulashish foydasi: havolani yuborgan va olgan odam aynan bir xil holatni ko'radi</title>
  <rect x="0" y="0" width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">URL ulashish: aynan bir xil holat boshqa odamda</text>

  <!-- Foydalanuvchi A -->
  <rect x="40" y="78" width="270" height="250" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/>
  <circle cx="85" cy="116" r="18" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="85" y="121" text-anchor="middle" font-size="15" fill="#4f46e5">A</text>
  <text x="120" y="113" font-size="15" font-weight="700" fill="#1e293b">Foydalanuvchi A</text>
  <text x="120" y="132" font-size="13" fill="#475569">filtrlab natija topdi</text>

  <rect x="62" y="150" width="226" height="30" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="175" y="170" text-anchor="middle" font-size="13" fill="#16a34a">qidiruv: "noutbuk"</text>
  <rect x="62" y="186" width="226" height="30" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="175" y="206" text-anchor="middle" font-size="13" fill="#16a34a">filtr: Sotuvda</text>
  <rect x="62" y="222" width="226" height="30" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="175" y="242" text-anchor="middle" font-size="13" fill="#16a34a">saralash: nom A-&gt;Z</text>

  <rect x="62" y="266" width="226" height="46" rx="7" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="175" y="287" text-anchor="middle" font-size="13" fill="#4f46e5">URL'da hammasi saqlandi:</text>
  <text x="175" y="305" text-anchor="middle" font-size="13" fill="#4f46e5">?q=noutbuk&amp;status=...</text>

  <!-- O'rta: havola yuborish -->
  <line x1="312" y1="203" x2="446" y2="203" stroke="#f59e0b" stroke-width="3"/>
  <polygon points="448,203 432,195 432,211" fill="#f59e0b"/>
  <rect x="318" y="160" width="124" height="36" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="183" text-anchor="middle" font-size="13" fill="#92400e">havolani yubordi</text>
  <text x="380" y="232" text-anchor="middle" font-size="13" fill="#475569">nusxa -&gt; ulashish</text>

  <!-- Foydalanuvchi B -->
  <rect x="450" y="78" width="270" height="250" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <circle cx="495" cy="116" r="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="495" y="121" text-anchor="middle" font-size="15" fill="#16a34a">B</text>
  <text x="530" y="113" font-size="15" font-weight="700" fill="#1e293b">Foydalanuvchi B</text>
  <text x="530" y="132" font-size="13" fill="#475569">havolani ochdi</text>

  <rect x="472" y="150" width="226" height="30" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="585" y="170" text-anchor="middle" font-size="13" fill="#16a34a">qidiruv: "noutbuk"</text>
  <rect x="472" y="186" width="226" height="30" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="585" y="206" text-anchor="middle" font-size="13" fill="#16a34a">filtr: Sotuvda</text>
  <rect x="472" y="222" width="226" height="30" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="585" y="242" text-anchor="middle" font-size="13" fill="#16a34a">saralash: nom A-&gt;Z</text>

  <rect x="472" y="266" width="226" height="46" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="585" y="294" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">AYNAN bir xil natija!</text>

  <!-- Past izoh -->
  <rect x="40" y="348" width="680" height="40" rx="9" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="373" text-anchor="middle" font-size="14" fill="#92400e">Holat URL'da bo'lgani uchun, havola butun holatni o'zi bilan olib boradi</text>
</svg>
