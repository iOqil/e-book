<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Livewire komponentining hayot sikli: yaratilish (mount) bir marta, keyin har so'rovda uyg'onish va uxlash (boot, hydrate, dehydrate), oxirida o'lim</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Komponentning hayot sikli</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">Bir marta tug'iladi, ko'p marta uyg'onadi-uxlaydi, bir marta o'ladi</text>

  <!-- Vaqt o'qi -->
  <line x1="60" y1="160" x2="700" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="700,160 690,155 690,165" fill="#94a3b8"/>
  <text x="700" y="184" text-anchor="end" font-size="13" fill="#94a3b8">vaqt</text>

  <!-- Tug'ilish: mount -->
  <circle cx="120" cy="160" r="9" fill="#16a34a"/>
  <rect x="40" y="92" width="160" height="56" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="120" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Tug'ilish</text>
  <text x="120" y="135" text-anchor="middle" font-size="13" fill="#16a34a">mount() — BIR MARTA</text>

  <!-- Har so'rov: 1 -->
  <circle cx="320" cy="160" r="9" fill="#4f46e5"/>
  <rect x="232" y="200" width="176" height="92" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="320" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Har so'rov</text>
  <text x="320" y="244" text-anchor="middle" font-size="13" fill="#475569">boot &#8594; hydrate</text>
  <text x="320" y="263" text-anchor="middle" font-size="13" fill="#475569">&#8594; ish &#8594; render</text>
  <text x="320" y="282" text-anchor="middle" font-size="13" fill="#475569">&#8594; dehydrate</text>
  <line x1="320" y1="169" x2="320" y2="200" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Har so'rov: 2 -->
  <circle cx="480" cy="160" r="9" fill="#4f46e5"/>
  <rect x="392" y="200" width="176" height="92" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="480" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Har so'rov</text>
  <text x="480" y="244" text-anchor="middle" font-size="13" fill="#475569">boot &#8594; hydrate</text>
  <text x="480" y="263" text-anchor="middle" font-size="13" fill="#475569">&#8594; ish &#8594; render</text>
  <text x="480" y="282" text-anchor="middle" font-size="13" fill="#475569">&#8594; dehydrate</text>
  <line x1="480" y1="169" x2="480" y2="200" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- takrorlanish belgisi -->
  <text x="400" y="324" text-anchor="middle" font-size="13" fill="#94a3b8">... har tugma bosilganda takrorlanadi (mount endi YO'Q) ...</text>

  <!-- O'lim -->
  <circle cx="640" cy="160" r="9" fill="#dc2626"/>
  <rect x="560" y="92" width="160" height="56" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="640" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">O'lim</text>
  <text x="640" y="135" text-anchor="middle" font-size="13" fill="#dc2626">boshqa sahifaga o'tildi</text>
  <line x1="120" y1="148" x2="120" y2="151" stroke="#16a34a" stroke-width="2"/>
  <line x1="640" y1="148" x2="640" y2="151" stroke="#dc2626" stroke-width="2"/>

  <!-- Izoh pastda -->
  <rect x="60" y="372" width="640" height="68" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="80" y="398" font-size="14" font-weight="700" fill="#1e293b">Eslab qoling:</text>
  <text x="80" y="420" font-size="13" fill="#475569">mount() faqat tug'ilishda — bir marta. boot/hydrate/dehydrate esa HAR so'rovda.</text>
  <text x="80" y="434" font-size="13" fill="#94a3b8">Birinchi so'rovda mount bor, hydrate yo'q; keyingi so'rovlarda aksincha.</text>
</svg>
