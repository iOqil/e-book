<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Yaratilgan fayllarning loyiha ichidagi joylashuvi (daraxt)</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Yaratilgan fayllar qayerda turadi?</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">myapp/ loyihasi ichidagi uchta asosiy fayl</text>

  <!-- root -->
  <rect x="40" y="86" width="140" height="34" rx="8" fill="#4f46e5"/>
  <text x="110" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">myapp/</text>

  <!-- vertical trunk -->
  <line x1="60" y1="120" x2="60" y2="420" stroke="#c7d2fe" stroke-width="2"/>

  <!-- branch 1: resources/views/components -->
  <line x1="60" y1="150" x2="96" y2="150" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="96" y="134" width="300" height="34" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="110" y="156" font-size="14" fill="#1e293b">resources/views/components/</text>

  <line x1="120" y1="168" x2="120" y2="192" stroke="#c7d2fe" stroke-width="2"/>
  <line x1="120" y1="192" x2="150" y2="192" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="150" y="176" width="430" height="34" rx="8" fill="#fff7fb" stroke="#fb70a9" stroke-width="2"/>
  <text x="164" y="198" font-size="14" font-weight="700" fill="#1e293b">&#9889;counter.blade.php</text>
  <text x="372" y="198" font-size="13" fill="#475569">— birinchi komponent (SFC)</text>

  <!-- branch 2: resources/views/layouts -->
  <line x1="60" y1="254" x2="96" y2="254" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="96" y="238" width="280" height="34" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="110" y="260" font-size="14" fill="#1e293b">resources/views/layouts/</text>

  <line x1="120" y1="272" x2="120" y2="296" stroke="#c7d2fe" stroke-width="2"/>
  <line x1="120" y1="296" x2="150" y2="296" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="150" y="280" width="430" height="34" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="164" y="302" font-size="14" font-weight="700" fill="#1e293b">app.blade.php</text>
  <text x="300" y="302" font-size="13" fill="#475569">— umumiy qolip ($slot, @livewireScripts)</text>

  <!-- branch 3: routes -->
  <line x1="60" y1="358" x2="96" y2="358" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="96" y="342" width="160" height="34" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="110" y="364" font-size="14" fill="#1e293b">routes/</text>

  <line x1="120" y1="376" x2="120" y2="400" stroke="#c7d2fe" stroke-width="2"/>
  <line x1="120" y1="400" x2="150" y2="400" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="150" y="384" width="430" height="34" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="164" y="406" font-size="14" font-weight="700" fill="#1e293b">web.php</text>
  <text x="268" y="406" font-size="13" fill="#475569">— Route::livewire('/counter', 'counter')</text>

  <!-- legend -->
  <rect x="608" y="134" width="20" height="20" rx="4" fill="#fff7fb" stroke="#fb70a9" stroke-width="2"/>
  <text x="634" y="149" font-size="13" fill="#475569">komponent</text>
  <rect x="608" y="164" width="20" height="20" rx="4" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="634" y="179" font-size="13" fill="#475569">tayanch</text>
  <text x="634" y="197" font-size="13" fill="#475569">fayl</text>
</svg>
