<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" font-family="Segoe UI, system-ui, sans-serif">
  <title>Modal oynaning to'liq oqimi: Qo'shish tugmasi bosiladi, modal ochiladi, forma to'ldiriladi, Saqlash bosiladi, post bazaga yoziladi, modal yopiladi va ro'yxat avtomatik yangilanadi</title>
  <rect x="0" y="0" width="760" height="480" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Modal oqimi: ochish dan yangilanishgacha</text>
  <text x="380" y="57" text-anchor="middle" font-size="14" fill="#475569">Hammasi bitta sahifada, qayta yuklanmasdan</text>

  <!-- 1 -->
  <rect x="30" y="86" width="216" height="96" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="56" cy="112" r="13" fill="#f59e0b"/>
  <text x="56" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text x="150" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">"+ Yangi post"</text>
  <text x="138" y="142" text-anchor="middle" font-size="13" fill="#475569">wire:click="create"</text>
  <text x="138" y="160" text-anchor="middle" font-size="13" fill="#475569">formani tozalaydi</text>

  <!-- 2 -->
  <rect x="272" y="86" width="216" height="96" rx="10" fill="#ffffff" stroke="#fb70a9" stroke-width="2"/>
  <circle cx="298" cy="112" r="13" fill="#fb70a9"/>
  <text x="298" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <text x="392" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Modal ochiladi</text>
  <text x="380" y="142" text-anchor="middle" font-size="13" fill="#475569">$showModal = true</text>
  <text x="380" y="160" text-anchor="middle" font-size="13" fill="#475569">@if blok ko'rinadi</text>

  <!-- 3 -->
  <rect x="514" y="86" width="216" height="96" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <circle cx="540" cy="112" r="13" fill="#4f46e5"/>
  <text x="540" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
  <text x="634" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Forma to'ldiriladi</text>
  <text x="622" y="142" text-anchor="middle" font-size="13" fill="#475569">wire:model="form.title"</text>
  <text x="622" y="160" text-anchor="middle" font-size="13" fill="#475569">wire:model="form.body"</text>

  <!-- strelka 1->2 -->
  <line x1="246" y1="134" x2="268" y2="134" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="268,134 258,129 258,139" fill="#94a3b8"/>
  <!-- 2->3 -->
  <line x1="488" y1="134" x2="510" y2="134" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="510,134 500,129 500,139" fill="#94a3b8"/>
  <!-- 3->4 (pastga) -->
  <line x1="622" y1="182" x2="622" y2="220" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="622,220 617,210 627,210" fill="#94a3b8"/>

  <!-- 4 -->
  <rect x="514" y="226" width="216" height="96" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <circle cx="540" cy="252" r="13" fill="#16a34a"/>
  <text x="540" y="257" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
  <text x="634" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">"Saqlash"</text>
  <text x="622" y="282" text-anchor="middle" font-size="13" fill="#475569">wire:submit="save"</text>
  <text x="622" y="300" text-anchor="middle" font-size="13" fill="#475569">validatsiya + create</text>

  <!-- 5 -->
  <rect x="272" y="226" width="216" height="96" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <circle cx="298" cy="252" r="13" fill="#16a34a"/>
  <text x="298" y="257" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">5</text>
  <text x="392" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Modal yopiladi</text>
  <text x="380" y="282" text-anchor="middle" font-size="13" fill="#475569">$showModal = false</text>
  <text x="380" y="300" text-anchor="middle" font-size="13" fill="#475569">unset($this->posts)</text>

  <!-- 6 -->
  <rect x="30" y="226" width="216" height="96" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <circle cx="56" cy="252" r="13" fill="#4f46e5"/>
  <text x="56" y="257" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">6</text>
  <text x="150" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Ro'yxat yangilanadi</text>
  <text x="138" y="282" text-anchor="middle" font-size="13" fill="#475569">computed qayta hisoblanadi</text>
  <text x="138" y="300" text-anchor="middle" font-size="13" fill="#475569">yangi post ko'rinadi</text>

  <!-- 4->5 -->
  <line x1="514" y1="274" x2="492" y2="274" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="492,274 502,269 502,279" fill="#94a3b8"/>
  <!-- 5->6 -->
  <line x1="272" y1="274" x2="250" y2="274" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="250,274 260,269 260,279" fill="#94a3b8"/>

  <!-- xato yo'li -->
  <rect x="180" y="368" width="400" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="380" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">Validatsiya o'tmasa?</text>
  <text x="380" y="414" text-anchor="middle" font-size="13" fill="#475569">save() to'xtaydi · modal OCHIQ qoladi · xato xabarlari ko'rinadi</text>

  <text x="380" y="456" text-anchor="middle" font-size="13" fill="#94a3b8">Bekor qilish tugmasi: $set('showModal', false) — saqlamasdan yopadi.</text>
</svg>
