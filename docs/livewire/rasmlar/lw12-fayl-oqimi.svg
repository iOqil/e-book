<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Livewire fayl yuklash oqimi: fayl tanlash, vaqtinchalik papkaga yuklash, preview va validatsiya, submit, doimiy store va bazaga path yozish</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Fayl yuklash oqimi: ikki bosqich</text>
  <text x="380" y="58" text-anchor="middle" font-size="14" fill="#475569">Fayl bir marta vaqtinchalik yuklanadi, faqat submit'da doimiy saqlanadi</text>

  <!-- 1: tanlash -->
  <rect x="30" y="92" width="210" height="96" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <circle cx="56" cy="118" r="13" fill="#4f46e5"/>
  <text x="56" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text x="142" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Fayl tanlash</text>
  <text x="135" y="148" text-anchor="middle" font-size="13" fill="#475569">input type="file"</text>
  <text x="135" y="166" text-anchor="middle" font-size="13" fill="#475569">wire:model="photo"</text>

  <!-- 2: vaqtinchalik yuklash -->
  <rect x="280" y="92" width="210" height="96" rx="10" fill="#ffffff" stroke="#fb70a9" stroke-width="2"/>
  <circle cx="306" cy="118" r="13" fill="#fb70a9"/>
  <text x="306" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <text x="392" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Vaqtinchalik yuklash</text>
  <text x="385" y="148" text-anchor="middle" font-size="13" fill="#475569">fayl darhol serverga,</text>
  <text x="385" y="166" text-anchor="middle" font-size="13" fill="#475569">vaqtinchalik papkaga</text>

  <!-- 3: preview + validate -->
  <rect x="530" y="92" width="200" height="96" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="556" cy="118" r="13" fill="#f59e0b"/>
  <text x="556" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
  <text x="640" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Preview + validate</text>
  <text x="630" y="148" text-anchor="middle" font-size="13" fill="#475569">temporaryUrl() bilan</text>
  <text x="630" y="166" text-anchor="middle" font-size="13" fill="#475569">ko'rsatish, tekshirish</text>

  <!-- strelkalar yuqori qator -->
  <line x1="240" y1="140" x2="278" y2="140" stroke="#94a3b8" stroke-width="2" marker-end="url(#ay)"/>
  <line x1="490" y1="140" x2="528" y2="140" stroke="#94a3b8" stroke-width="2" marker-end="url(#ay)"/>

  <!-- pastga strelka -->
  <line x1="630" y1="188" x2="630" y2="248" stroke="#94a3b8" stroke-width="2" marker-end="url(#ay)"/>
  <text x="648" y="222" font-size="13" fill="#475569">submit</text>

  <!-- 4: submit -->
  <rect x="530" y="250" width="200" height="92" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <circle cx="556" cy="276" r="13" fill="#4f46e5"/>
  <text x="556" y="281" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
  <text x="640" y="280" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Submit (save)</text>
  <text x="630" y="306" text-anchor="middle" font-size="13" fill="#475569">wire:click="save"</text>
  <text x="630" y="324" text-anchor="middle" font-size="13" fill="#475569">$this->validate()</text>

  <!-- 5: doimiy store -->
  <rect x="280" y="250" width="210" height="92" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <circle cx="306" cy="276" r="13" fill="#16a34a"/>
  <text x="306" y="281" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">5</text>
  <text x="392" y="280" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Doimiy saqlash</text>
  <text x="385" y="306" text-anchor="middle" font-size="13" fill="#475569">$photo->store(</text>
  <text x="385" y="324" text-anchor="middle" font-size="13" fill="#475569">'photos', 'public')</text>

  <!-- 6: db path -->
  <rect x="30" y="250" width="210" height="92" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <circle cx="56" cy="276" r="13" fill="#16a34a"/>
  <text x="56" y="281" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">6</text>
  <text x="142" y="280" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Path bazaga</text>
  <text x="135" y="306" text-anchor="middle" font-size="13" fill="#475569">"photos/aBc.jpg"</text>
  <text x="135" y="324" text-anchor="middle" font-size="13" fill="#475569">faylning yo'li saqlanadi</text>

  <!-- strelkalar past qator -->
  <line x1="528" y1="296" x2="492" y2="296" stroke="#94a3b8" stroke-width="2" marker-end="url(#ay)"/>
  <line x1="278" y1="296" x2="242" y2="296" stroke="#94a3b8" stroke-width="2" marker-end="url(#ay)"/>

  <!-- izoh blok -->
  <rect x="30" y="378" width="700" height="66" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="50" y="404" font-size="14" font-weight="700" fill="#4f46e5">Nega ikki bosqich?</text>
  <text x="50" y="426" font-size="13" fill="#475569">Vaqtinchalik bosqich preview va validatsiyani saqlashdan OLDIN qilishga imkon beradi —</text>
  <text x="50" y="442" font-size="13" fill="#475569">xato fayl hech qachon doimiy joyga tushmaydi. Saqlanmagan fayl 24 soatda tozalanadi.</text>

  <defs>
    <marker id="ay" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
