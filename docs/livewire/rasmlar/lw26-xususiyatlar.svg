<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" width="760" height="580" font-family="Segoe UI, system-ui, sans-serif">
  <title>Vazifalar taxtasi ilovasining xususiyatlar xaritasi: har bir xususiyat qaysi bobdan olinganini ko'rsatadi</title>
  <rect x="0" y="0" width="760" height="580" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Qaysi xususiyat qaysi bobdan</text>
  <text x="380" y="58" text-anchor="middle" font-size="13" fill="#475569">Kapston butun kitobni bitta ilovaga birlashtiradi</text>

  <!-- markazda ilova -->
  <rect x="300" y="76" width="160" height="50" rx="25" fill="#4f46e5"/>
  <text x="380" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Vazifalar</text>
  <text x="380" y="117" text-anchor="middle" font-size="13" fill="#e0e7ff">taxtasi</text>

  <!-- 12 xususiyat kartochkasi: 3 ustun x 4 qator -->
  <!-- Ustun X: 30, 270, 510 ; kenglik 220 -->
  <!-- Qator Y: 150, 250, 350, 450 ; balandlik 80 -->

  <!-- 1 -->
  <rect x="30" y="150" width="220" height="80" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="46" y="176" font-size="14" font-weight="700" fill="#1e293b">Yangi vazifa qo'shish</text>
  <text x="46" y="197" font-size="13" fill="#475569">Form Object + validatsiya</text>
  <text x="46" y="218" font-size="13" fill="#4f46e5">10, 11-bob</text>

  <!-- 2 -->
  <rect x="270" y="150" width="220" height="80" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="286" y="176" font-size="14" font-weight="700" fill="#1e293b">Ro'yxat ko'rsatish</text>
  <text x="286" y="197" font-size="13" fill="#475569">computed + wire:key</text>
  <text x="286" y="218" font-size="13" fill="#4f46e5">13, 15-bob</text>

  <!-- 3 -->
  <rect x="510" y="150" width="220" height="80" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="526" y="176" font-size="14" font-weight="700" fill="#1e293b">Holat o'zgartirish</text>
  <text x="526" y="197" font-size="13" fill="#475569">action metodlari</text>
  <text x="526" y="218" font-size="13" fill="#4f46e5">7, 16-bob</text>

  <!-- 4 -->
  <rect x="30" y="250" width="220" height="80" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="46" y="276" font-size="14" font-weight="700" fill="#1e293b">Tasdiq bilan o'chirish</text>
  <text x="46" y="297" font-size="13" fill="#475569">wire:confirm</text>
  <text x="46" y="318" font-size="13" fill="#4f46e5">7-bob</text>

  <!-- 5 -->
  <rect x="270" y="250" width="220" height="80" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="286" y="276" font-size="14" font-weight="700" fill="#1e293b">Qidiruv + filtr</text>
  <text x="286" y="297" font-size="13" fill="#475569">#[Url] · debounce</text>
  <text x="286" y="318" font-size="13" fill="#4f46e5">14, 19-bob</text>

  <!-- 6 -->
  <rect x="510" y="250" width="220" height="80" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="526" y="276" font-size="14" font-weight="700" fill="#1e293b">Faqat o'z vazifasi</text>
  <text x="526" y="297" font-size="13" fill="#475569">authorize + Policy</text>
  <text x="526" y="318" font-size="13" fill="#4f46e5">23-bob</text>

  <!-- 7 -->
  <rect x="30" y="350" width="220" height="80" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="46" y="376" font-size="14" font-weight="700" fill="#1e293b">Toast bildirishnoma</text>
  <text x="46" y="397" font-size="13" fill="#475569">dispatch + #[On]</text>
  <text x="46" y="418" font-size="13" fill="#4f46e5">18-bob</text>

  <!-- 8 -->
  <rect x="270" y="350" width="220" height="80" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="286" y="376" font-size="14" font-weight="700" fill="#1e293b">Jonli yangilanish</text>
  <text x="286" y="397" font-size="13" fill="#475569">wire:poll</text>
  <text x="286" y="418" font-size="13" fill="#4f46e5">21-bob</text>

  <!-- 9 -->
  <rect x="510" y="350" width="220" height="80" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="526" y="376" font-size="14" font-weight="700" fill="#1e293b">Yuklanish holati</text>
  <text x="526" y="397" font-size="13" fill="#475569">wire:loading + disabled</text>
  <text x="526" y="418" font-size="13" fill="#4f46e5">20-bob</text>

  <!-- 10 -->
  <rect x="30" y="450" width="220" height="80" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="46" y="476" font-size="14" font-weight="700" fill="#1e293b">Toza client-side</text>
  <text x="46" y="497" font-size="13" fill="#475569">Alpine.js dropdown</text>
  <text x="46" y="518" font-size="13" fill="#4f46e5">22-bob</text>

  <!-- 11 -->
  <rect x="270" y="450" width="220" height="80" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="286" y="476" font-size="14" font-weight="700" fill="#1e293b">Tezlik</text>
  <text x="286" y="497" font-size="13" fill="#475569">kesh · eager · paginate</text>
  <text x="286" y="518" font-size="13" fill="#4f46e5">15, 25-bob</text>

  <!-- 12 -->
  <rect x="510" y="450" width="220" height="80" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="526" y="476" font-size="14" font-weight="700" fill="#1e293b">Avtomatik testlar</text>
  <text x="526" y="497" font-size="13" fill="#475569">Livewire::test()</text>
  <text x="526" y="518" font-size="13" fill="#4f46e5">24-bob</text>

  <text x="380" y="558" text-anchor="middle" font-size="13" fill="#94a3b8">Asos: komponent (3,4), properties (5), data binding (6), lifecycle (8), formalar (9) — hammasi ostida</text>
</svg>
