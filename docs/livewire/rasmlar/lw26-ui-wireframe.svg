<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="Segoe UI, system-ui, sans-serif">
  <title>Vazifalar taxtasi ilovasining foydalanuvchi interfeysi: sarlavha, statistika, qo'shish formasi, qidiruv va filtr, holatga ko'ra ranglangan vazifa kartochkalari</title>
  <rect x="0" y="0" width="760" height="560" fill="#f8fafc"/>

  <!-- Brauzer ramkasi -->
  <rect x="20" y="20" width="720" height="520" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="20" y="20" width="720" height="40" rx="12" fill="#eef2ff"/>
  <circle cx="44" cy="40" r="6" fill="#fb70a9"/>
  <circle cx="64" cy="40" r="6" fill="#f59e0b"/>
  <circle cx="84" cy="40" r="6" fill="#16a34a"/>
  <rect x="110" y="30" width="610" height="20" rx="10" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="124" y="44" font-size="13" fill="#94a3b8">myapp.test/board</text>

  <!-- Sarlavha + statistika -->
  <text x="44" y="92" font-size="20" font-weight="700" fill="#1e293b">Vazifalar taxtasi</text>
  <text x="44" y="114" font-size="13" fill="#475569">Jami: 6  ·  Kutilmoqda: 2  ·  Jarayonda: 1  ·  Bajarildi: 3</text>

  <!-- Qo'shish formasi -->
  <rect x="44" y="130" width="540" height="40" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="58" y="155" font-size="14" fill="#94a3b8">Yangi vazifa...</text>
  <rect x="596" y="130" width="120" height="40" rx="8" fill="#4f46e5"/>
  <text x="656" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Qo'shish</text>

  <!-- Qidiruv + filtr -->
  <rect x="44" y="184" width="430" height="38" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="58" y="208" font-size="14" fill="#94a3b8">Qidirish...</text>
  <rect x="486" y="184" width="230" height="38" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="500" y="208" font-size="14" fill="#475569">Hammasi</text>
  <text x="700" y="208" text-anchor="end" font-size="14" fill="#94a3b8">▼</text>

  <!-- Vazifa kartochkalari -->
  <!-- Kutilmoqda -->
  <rect x="44" y="238" width="672" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="44" y="238" width="6" height="50" rx="3" fill="#94a3b8"/>
  <text x="66" y="268" font-size="14" fill="#1e293b">Hisobotni tayyorlash</text>
  <rect x="430" y="252" width="90" height="22" rx="11" fill="#f1f5f9"/>
  <text x="475" y="267" text-anchor="middle" font-size="13" fill="#475569">Jarayonda</text>
  <rect x="528" y="252" width="80" height="22" rx="11" fill="#dcfce7"/>
  <text x="568" y="267" text-anchor="middle" font-size="13" fill="#16a34a">Bajarildi</text>
  <rect x="616" y="252" width="84" height="22" rx="11" fill="#fee2e2"/>
  <text x="658" y="267" text-anchor="middle" font-size="13" fill="#dc2626">O'chirish</text>

  <!-- Jarayonda -->
  <rect x="44" y="298" width="672" height="50" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <rect x="44" y="298" width="6" height="50" rx="3" fill="#f59e0b"/>
  <text x="66" y="328" font-size="14" fill="#1e293b">Mijoz bilan uchrashuv</text>
  <rect x="430" y="312" width="90" height="22" rx="11" fill="#f1f5f9"/>
  <text x="475" y="327" text-anchor="middle" font-size="13" fill="#475569">Kutilmoqda</text>
  <rect x="528" y="312" width="80" height="22" rx="11" fill="#dcfce7"/>
  <text x="568" y="327" text-anchor="middle" font-size="13" fill="#16a34a">Bajarildi</text>
  <rect x="616" y="312" width="84" height="22" rx="11" fill="#fee2e2"/>
  <text x="658" y="327" text-anchor="middle" font-size="13" fill="#dc2626">O'chirish</text>

  <!-- Bajarildi -->
  <rect x="44" y="358" width="672" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <rect x="44" y="358" width="6" height="50" rx="3" fill="#16a34a"/>
  <text x="66" y="388" font-size="14" fill="#16a34a" text-decoration="line-through">Kod yozish</text>
  <rect x="616" y="372" width="84" height="22" rx="11" fill="#fee2e2"/>
  <text x="658" y="387" text-anchor="middle" font-size="13" fill="#dc2626">O'chirish</text>

  <!-- Bo'sh holat eslatma -->
  <text x="44" y="440" font-size="13" fill="#94a3b8">Har 15 soniyada jonli yangilanadi (wire:poll) · ranglar holatni bildiradi</text>

  <!-- Rang legendasi -->
  <rect x="44" y="460" width="14" height="14" rx="3" fill="#94a3b8"/>
  <text x="64" y="472" font-size="13" fill="#475569">Kutilmoqda</text>
  <rect x="180" y="460" width="14" height="14" rx="3" fill="#f59e0b"/>
  <text x="200" y="472" font-size="13" fill="#475569">Jarayonda</text>
  <rect x="316" y="460" width="14" height="14" rx="3" fill="#16a34a"/>
  <text x="336" y="472" font-size="13" fill="#475569">Bajarildi</text>
</svg>
