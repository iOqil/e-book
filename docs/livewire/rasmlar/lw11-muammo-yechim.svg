<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Chap tomonda barcha xususiyat va validatsiya qoidalari bitta komponentga to'plangan shishgan komponent, o'ng tomonda esa xususiyat va qoidalar alohida Form Object klassiga ajratilib, komponent yengil va toza qolgan holatni taqqoslovchi diagramma</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Muammo va yechim: Form Object</text>
  <text x="380" y="58" text-anchor="middle" font-size="14" fill="#475569">Formaga oid hamma narsani alohida klassga ajratamiz</text>

  <!-- CHAP: shishgan komponent -->
  <rect x="30" y="80" width="320" height="360" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="30" y="80" width="320" height="40" rx="12" fill="#dc2626"/>
  <text x="190" y="107" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Shishgan komponent</text>

  <text x="50" y="145" font-size="13" fill="#475569">⚡post-create.blade.php</text>

  <rect x="50" y="158" width="280" height="244" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="64" y="180" font-size="13" fill="#1e293b">#[Validate] public $title</text>
  <text x="64" y="202" font-size="13" fill="#1e293b">#[Validate] public $content</text>
  <text x="64" y="224" font-size="13" fill="#1e293b">#[Validate] public $category</text>
  <text x="64" y="246" font-size="13" fill="#1e293b">#[Validate] public $tags</text>
  <text x="64" y="268" font-size="13" fill="#1e293b">#[Validate] public $published</text>
  <text x="64" y="290" font-size="13" fill="#94a3b8">... yana 5-10 ta ...</text>
  <text x="64" y="318" font-size="13" fill="#1e293b">save() { validate; create; }</text>
  <text x="64" y="340" font-size="13" fill="#1e293b">render / Blade markup</text>
  <text x="64" y="370" font-size="13" font-weight="700" fill="#dc2626">+ EDIT da hammasi TAKROR!</text>
  <text x="64" y="390" font-size="13" fill="#dc2626">tartibsiz stol, DRY buzilgan</text>

  <text x="190" y="426" text-anchor="middle" font-size="13" fill="#94a3b8">Hammasi bir uyumda</text>

  <!-- O'q -->
  <line x1="358" y1="260" x2="402" y2="260" stroke="#4f46e5" stroke-width="3"/>
  <polygon points="402,260 392,254 392,266" fill="#4f46e5"/>
  <text x="380" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#4f46e5">ajrat</text>

  <!-- O'NG: Form Object yechimi -->
  <!-- Form Object qutisi -->
  <rect x="410" y="80" width="320" height="180" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="410" y="80" width="320" height="40" rx="12" fill="#4f46e5"/>
  <text x="570" y="107" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">PostForm (maxsus papka)</text>
  <text x="430" y="145" font-size="13" fill="#475569">app/Livewire/Forms/PostForm.php</text>
  <rect x="430" y="156" width="280" height="90" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="444" y="178" font-size="13" fill="#1e293b">#[Validate] public $title</text>
  <text x="444" y="200" font-size="13" fill="#1e293b">#[Validate] public $content</text>
  <text x="444" y="222" font-size="13" fill="#1e293b">store() / update() / setPost()</text>
  <text x="444" y="240" font-size="13" fill="#94a3b8">qoidalar BIR JOYDA</text>

  <!-- Yengil komponent qutisi -->
  <rect x="410" y="280" width="320" height="160" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="410" y="280" width="320" height="40" rx="12" fill="#16a34a"/>
  <text x="570" y="307" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Yengil komponent</text>
  <rect x="430" y="334" width="280" height="90" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="444" y="358" font-size="13" fill="#1e293b">public PostForm $form;</text>
  <text x="444" y="382" font-size="13" fill="#1e293b">save() { $this-&gt;form-&gt;store(); }</text>
  <text x="444" y="406" font-size="13" fill="#16a34a">faqat o'z ishi: ko'rsatish</text>

  <text x="380" y="460" text-anchor="middle" font-size="13" fill="#94a3b8">Bitta PostForm — create va edit komponentlari uchun qayta ishlatiladi</text>
</svg>
