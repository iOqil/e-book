<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Livewire formasining to'liq oqimi: foydalanuvchi formani to'ldiradi, wire:submit serverga yuboradi, server validatsiya qilib bazaga saqlaydi, reset bilan forma tozalanadi va muvaffaqiyat xabari ko'rsatiladi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Forma oqimi: to'ldirish dan xabargacha</text>
  <text x="380" y="58" text-anchor="middle" font-size="14" fill="#475569">Sahifa qayta yuklanmaydi — hammasi fonda, bitta so'rovda</text>

  <!-- 1: To'ldirish -->
  <rect x="30" y="90" width="200" height="92" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <circle cx="56" cy="116" r="13" fill="#4f46e5"/>
  <text x="56" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text x="142" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Formani to'ldirish</text>
  <text x="130" y="146" text-anchor="middle" font-size="13" fill="#475569">wire:model qiymatni</text>
  <text x="130" y="164" text-anchor="middle" font-size="13" fill="#475569">brauzerda saqlaydi (deferred)</text>

  <!-- 2: wire:submit -->
  <rect x="280" y="90" width="200" height="92" rx="10" fill="#ffffff" stroke="#fb70a9" stroke-width="2"/>
  <circle cx="306" cy="116" r="13" fill="#fb70a9"/>
  <text x="306" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <text x="392" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">wire:submit="save"</text>
  <text x="380" y="146" text-anchor="middle" font-size="13" fill="#475569">avtomatik preventDefault</text>
  <text x="380" y="164" text-anchor="middle" font-size="13" fill="#475569">ma'lumot serverga ketadi</text>

  <!-- 3: server -->
  <rect x="530" y="90" width="200" height="92" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <circle cx="556" cy="116" r="13" fill="#4f46e5"/>
  <text x="556" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
  <text x="642" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">save() ishlaydi</text>
  <text x="630" y="146" text-anchor="middle" font-size="13" fill="#475569">validate() tekshiradi</text>
  <text x="630" y="164" text-anchor="middle" font-size="13" fill="#475569">keyin saqlanadi</text>

  <!-- gorizontal strelka 1->2 -->
  <line x1="230" y1="136" x2="276" y2="136" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="276,136 266,131 266,141" fill="#94a3b8"/>
  <!-- 2->3 -->
  <line x1="480" y1="136" x2="526" y2="136" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="526,136 516,131 516,141" fill="#94a3b8"/>

  <!-- 4: DB -->
  <ellipse cx="630" cy="240" rx="60" ry="16" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <path d="M570 240 v34 a60 16 0 0 0 120 0 v-34" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <ellipse cx="630" cy="240" rx="60" ry="16" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="630" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">Ma'lumotlar bazasi</text>
  <text x="630" y="282" text-anchor="middle" font-size="13" fill="#475569">yangi yozuv</text>
  <!-- 3->DB strelka -->
  <line x1="630" y1="182" x2="630" y2="216" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="630,216 625,206 635,206" fill="#16a34a"/>

  <!-- 5: reset -->
  <rect x="280" y="300" width="200" height="86" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="306" cy="326" r="13" fill="#f59e0b"/>
  <text x="306" y="331" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
  <text x="392" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">reset()</text>
  <text x="380" y="356" text-anchor="middle" font-size="13" fill="#475569">maydonlar boshlang'ich</text>
  <text x="380" y="374" text-anchor="middle" font-size="13" fill="#475569">qiymatga qaytadi</text>

  <!-- 6: xabar -->
  <rect x="30" y="300" width="200" height="86" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <circle cx="56" cy="326" r="13" fill="#16a34a"/>
  <text x="56" y="331" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">5</text>
  <text x="142" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Muvaffaqiyat xabari</text>
  <text x="130" y="356" text-anchor="middle" font-size="13" fill="#475569">"Rahmat! Qabul qilindi"</text>
  <text x="130" y="374" text-anchor="middle" font-size="13" fill="#475569">faqat shu qism yangilanadi</text>

  <!-- DB->reset strelka -->
  <line x1="568" y1="330" x2="484" y2="330" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="484,330 494,325 494,335" fill="#94a3b8"/>
  <text x="528" y="322" text-anchor="middle" font-size="13" fill="#475569">so'ng</text>
  <!-- reset->xabar -->
  <line x1="280" y1="343" x2="234" y2="343" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="234,343 244,338 244,348" fill="#94a3b8"/>

  <text x="380" y="430" text-anchor="middle" font-size="14" fill="#475569">Toza forma yana tayyor — foydalanuvchi yangi ma'lumot kirita oladi.</text>
  <text x="380" y="454" text-anchor="middle" font-size="13" fill="#94a3b8">Validatsiya o'tmasa: oqim 3-bosqichda to'xtaydi, xato xabarlari formada ko'rinadi.</text>
</svg>
