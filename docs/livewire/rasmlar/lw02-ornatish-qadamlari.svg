<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" font-family="Segoe UI, system-ui, sans-serif">
  <title>Livewire o'rnatish bosqichlari: Laravel loyihasidan brauzergacha</title>
  <rect x="0" y="0" width="760" height="520" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">O'rnatish bosqichlari oqimi</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">Bo'sh muhitdan tirik sahifagacha — olti qadam</text>

  <!-- Step 1 -->
  <rect x="70" y="86" width="620" height="56" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <circle cx="104" cy="114" r="16" fill="#4f46e5"/>
  <text x="104" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text>
  <text x="138" y="109" font-size="15" font-weight="700" fill="#1e293b">Laravel loyiha tayyorlash</text>
  <text x="138" y="130" font-size="13" fill="#475569">composer create-project laravel/laravel myapp</text>

  <!-- arrow -->
  <line x1="380" y1="142" x2="380" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="380,166 375,158 385,158" fill="#94a3b8"/>

  <!-- Step 2 -->
  <rect x="70" y="168" width="620" height="56" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <circle cx="104" cy="196" r="16" fill="#4f46e5"/>
  <text x="104" y="202" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2</text>
  <text x="138" y="191" font-size="15" font-weight="700" fill="#1e293b">Livewire 4'ni o'rnatish (v4.3)</text>
  <text x="138" y="212" font-size="13" fill="#475569">composer require livewire/livewire</text>

  <line x1="380" y1="224" x2="380" y2="242" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="380,248 375,240 385,240" fill="#94a3b8"/>

  <!-- Step 3 -->
  <rect x="70" y="250" width="620" height="56" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <circle cx="104" cy="278" r="16" fill="#4f46e5"/>
  <text x="104" y="284" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">3</text>
  <text x="138" y="273" font-size="15" font-weight="700" fill="#1e293b">Layout yaratish</text>
  <text x="138" y="294" font-size="13" fill="#475569">php artisan livewire:layout</text>

  <line x1="380" y1="306" x2="380" y2="324" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="380,330 375,322 385,322" fill="#94a3b8"/>

  <!-- Step 4 -->
  <rect x="70" y="332" width="620" height="56" rx="10" fill="#ffffff" stroke="#fb70a9" stroke-width="2"/>
  <circle cx="104" cy="360" r="16" fill="#fb70a9"/>
  <text x="104" y="366" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">4</text>
  <text x="138" y="355" font-size="15" font-weight="700" fill="#1e293b">Birinchi komponent</text>
  <text x="138" y="376" font-size="13" fill="#475569">php artisan make:livewire counter  →  &#9889;counter.blade.php</text>

  <line x1="380" y1="388" x2="380" y2="406" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="380,412 375,404 385,404" fill="#94a3b8"/>

  <!-- Step 5 -->
  <rect x="70" y="414" width="620" height="56" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <circle cx="104" cy="442" r="16" fill="#4f46e5"/>
  <text x="104" y="448" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">5</text>
  <text x="138" y="437" font-size="15" font-weight="700" fill="#1e293b">Route ulash (v4 da SHART)</text>
  <text x="138" y="458" font-size="13" fill="#475569">Route::livewire('/counter', 'counter');</text>

  <line x1="380" y1="470" x2="380" y2="478" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="380,484 375,476 385,476" fill="#94a3b8"/>

  <!-- Step 6 -->
  <rect x="190" y="486" width="380" height="28" rx="14" fill="#16a34a"/>
  <text x="380" y="505" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">6. php artisan serve  →  brauzerda /counter ochildi</text>
</svg>
