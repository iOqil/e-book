<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="Segoe UI, system-ui, sans-serif">
  <title>Ko'p yozuv paginate(10) bilan sahifalarga bo'linadi, har sahifada 10 ta ko'rsatiladi va links() AJAX navigatsiyasini chizadi</title>
  <rect x="0" y="0" width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Sahifalash: ko'p yozuvni javonlarga bo'lish</text>
  <text x="380" y="58" text-anchor="middle" font-size="14" fill="#475569">paginate(10) faqat shu sahifaga kerakli 10 ta yozuvni oladi</text>

  <!-- chap: baza, ko'p yozuv -->
  <rect x="30" y="92" width="190" height="200" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="125" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Ma'lumotlar bazasi</text>
  <text x="125" y="142" text-anchor="middle" font-size="13" fill="#475569">jami 95 ta yozuv</text>
  <text x="125" y="172" text-anchor="middle" font-size="13" fill="#94a3b8">yozuv 1</text>
  <text x="125" y="192" text-anchor="middle" font-size="13" fill="#94a3b8">yozuv 2</text>
  <text x="125" y="212" text-anchor="middle" font-size="13" fill="#94a3b8">yozuv 3</text>
  <text x="125" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">... 95 tagacha</text>
  <text x="125" y="262" text-anchor="middle" font-size="13" fill="#dc2626">hammasi birga = sekin!</text>
  <text x="125" y="280" text-anchor="middle" font-size="13" fill="#dc2626">xotira to'ladi</text>

  <!-- strelka -->
  <line x1="220" y1="180" x2="280" y2="180" stroke="#4f46e5" stroke-width="2.5"/>
  <polygon points="280,180 270,175 270,185" fill="#4f46e5"/>
  <text x="250" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#4f46e5">paginate(10)</text>

  <!-- markaz: faqat 1 sahifa -->
  <rect x="288" y="92" width="200" height="200" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="388" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">Joriy sahifa</text>
  <text x="388" y="140" text-anchor="middle" font-size="13" fill="#475569">faqat 10 ta yozuv</text>
  <rect x="306" y="152" width="164" height="22" rx="4" fill="#eef2ff"/>
  <text x="388" y="168" text-anchor="middle" font-size="13" fill="#1e293b">yozuv 1</text>
  <rect x="306" y="178" width="164" height="22" rx="4" fill="#eef2ff"/>
  <text x="388" y="194" text-anchor="middle" font-size="13" fill="#1e293b">yozuv 2</text>
  <rect x="306" y="204" width="164" height="22" rx="4" fill="#eef2ff"/>
  <text x="388" y="220" text-anchor="middle" font-size="13" fill="#1e293b">... 10 tagacha</text>
  <text x="388" y="252" text-anchor="middle" font-size="13" fill="#16a34a">tez ochiladi</text>
  <text x="388" y="272" text-anchor="middle" font-size="13" fill="#16a34a">xotira tejaladi</text>

  <!-- strelka -->
  <line x1="488" y1="180" x2="548" y2="180" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="548,180 538,175 538,185" fill="#16a34a"/>

  <!-- o'ng: brauzer -->
  <rect x="556" y="92" width="174" height="200" rx="10" fill="#ffffff" stroke="#fb70a9" stroke-width="2"/>
  <text x="643" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Brauzer</text>
  <text x="643" y="142" text-anchor="middle" font-size="13" fill="#475569">jadval ko'rsatiladi</text>
  <rect x="574" y="156" width="138" height="14" rx="3" fill="#e2e8f0"/>
  <rect x="574" y="176" width="138" height="14" rx="3" fill="#e2e8f0"/>
  <rect x="574" y="196" width="138" height="14" rx="3" fill="#e2e8f0"/>
  <text x="643" y="232" text-anchor="middle" font-size="13" fill="#475569">{{ $posts</text>
  <text x="643" y="250" text-anchor="middle" font-size="13" fill="#475569">-&gt;links() }}</text>

  <!-- pastdagi links() navigatsiya -->
  <text x="380" y="338" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">links() — sahifa navigatsiyasi (AJAX, qayta yuklanmaydi)</text>
  <rect x="210" y="356" width="100" height="34" rx="6" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="260" y="378" text-anchor="middle" font-size="13" fill="#475569">‹ Oldingi</text>
  <rect x="318" y="356" width="40" height="34" rx="6" fill="#4f46e5"/>
  <text x="338" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <rect x="366" y="356" width="40" height="34" rx="6" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="386" y="378" text-anchor="middle" font-size="14" fill="#475569">2</text>
  <rect x="414" y="356" width="40" height="34" rx="6" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="434" y="378" text-anchor="middle" font-size="14" fill="#475569">3</text>
  <rect x="462" y="356" width="90" height="34" rx="6" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="507" y="378" text-anchor="middle" font-size="13" fill="#475569">Keyingi ›</text>

  <text x="380" y="428" text-anchor="middle" font-size="13" fill="#94a3b8">Foydalanuvchi "2" ni bosadi -> faqat jadval qismi yangilanadi, butun sahifa emas.</text>
</svg>
