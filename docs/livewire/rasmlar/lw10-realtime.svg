<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Segoe UI, system-ui, sans-serif">
  <title>Real-time validatsiya: foydalanuvchi yozadi, wire:model.live qiymatni serverga yuboradi, validateOnly() darhol tekshiradi va xato yoki to'g'ri belgisi shu zahoti formada ko'rinadi</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Real-time validatsiya: darhol tekshir</text>
  <text x="380" y="58" text-anchor="middle" font-size="14" fill="#475569">Foydalanuvchini "Yuborish"gacha kuttirmaydi — xato yozayotganda chiqadi</text>

  <!-- 1: yozish -->
  <rect x="34" y="96" width="200" height="92" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <circle cx="60" cy="122" r="13" fill="#4f46e5"/>
  <text x="60" y="127" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text x="146" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Foydalanuvchi yozadi</text>
  <text x="134" y="152" text-anchor="middle" font-size="13" fill="#475569">maydonga harf kiritadi</text>
  <text x="134" y="170" text-anchor="middle" font-size="13" fill="#475569">yoki maydondan chiqadi</text>

  <!-- 2: .live yuboradi -->
  <rect x="280" y="96" width="200" height="92" rx="10" fill="#ffffff" stroke="#fb70a9" stroke-width="2"/>
  <circle cx="306" cy="122" r="13" fill="#fb70a9"/>
  <text x="306" y="127" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <text x="392" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">wire:model.live.blur</text>
  <text x="380" y="152" text-anchor="middle" font-size="13" fill="#475569">qiymatni darhol</text>
  <text x="380" y="170" text-anchor="middle" font-size="13" fill="#475569">serverga yuboradi</text>

  <!-- 3: validateOnly -->
  <rect x="526" y="96" width="200" height="92" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <circle cx="552" cy="122" r="13" fill="#4f46e5"/>
  <text x="552" y="127" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
  <text x="638" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">validateOnly('x')</text>
  <text x="626" y="152" text-anchor="middle" font-size="13" fill="#475569">faqat shu maydonni</text>
  <text x="626" y="170" text-anchor="middle" font-size="13" fill="#475569">darhol tekshiradi</text>

  <!-- strelkalar 1->2->3 -->
  <line x1="234" y1="142" x2="276" y2="142" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="276,142 266,137 266,147" fill="#94a3b8"/>
  <line x1="480" y1="142" x2="522" y2="142" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="522,142 512,137 512,147" fill="#94a3b8"/>

  <!-- natija ikki yo'l -->
  <text x="380" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Natija shu zahoti formada ko'rinadi:</text>

  <!-- xato holati (qizil) -->
  <rect x="60" y="248" width="300" height="120" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="210" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">Qoidaga to'g'ri kelmadi</text>
  <rect x="84" y="292" width="252" height="30" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="96" y="312" font-size="13" fill="#1e293b">ab</text>
  <text x="210" y="344" text-anchor="middle" font-size="13" fill="#dc2626">@error: "kamida 3 belgi bo'lsin"</text>
  <text x="210" y="362" text-anchor="middle" font-size="13" fill="#475569">qizil xato darhol chiqadi</text>

  <!-- to'g'ri holati (yashil) -->
  <rect x="400" y="248" width="300" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="550" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">Qoidaga to'g'ri keldi</text>
  <rect x="424" y="292" width="252" height="30" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="436" y="312" font-size="13" fill="#1e293b">oqil</text>
  <text x="660" y="312" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">&#10003;</text>
  <text x="550" y="344" text-anchor="middle" font-size="13" fill="#16a34a">xato yo'q</text>
  <text x="550" y="362" text-anchor="middle" font-size="13" fill="#475569">foydalanuvchi davom etadi</text>

  <text x="380" y="404" text-anchor="middle" font-size="13" fill="#94a3b8">Submit'da $this-&gt;validate() hammasini oxirgi marta tekshiradi — aralash strategiya eng yaxshi.</text>
</svg>
