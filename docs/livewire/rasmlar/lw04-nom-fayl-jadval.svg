<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>Livewire komponent nomidan fayl yo'liga moslik: post.create nomi uchta formatda qaysi faylga to'g'ri kelishi</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Komponent nomi &#8594; fayl yo'li</text>

  <!-- Markaziy nom qutisi -->
  <rect x="270" y="62" width="220" height="58" rx="12" fill="#4f46e5" stroke="#4338ca" stroke-width="2"/>
  <text x="380" y="88" text-anchor="middle" font-size="14" fill="#c7d2fe">Komponent nomi</text>
  <text x="380" y="110" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">post.create</text>
  <text x="380" y="142" text-anchor="middle" font-size="13" fill="#475569">nuqta (.) papka ajratgichi &#8594; post/ ichida create</text>

  <!-- Uchta yo'l strelkasi -->
  <line x1="200" y1="170" x2="135" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="380" y1="170" x2="380" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="560" y1="170" x2="625" y2="200" stroke="#94a3b8" stroke-width="2"/>

  <!-- SFC -->
  <rect x="24" y="202" width="226" height="200" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="24" y="202" width="226" height="36" rx="12" fill="#4f46e5"/>
  <text x="137" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">SFC</text>
  <text x="40" y="262" font-size="13" fill="#475569">resources/views/</text>
  <text x="40" y="282" font-size="13" fill="#475569">components/</text>
  <text x="50" y="302" font-size="13" fill="#475569">post/</text>
  <text x="60" y="322" font-size="13" font-weight="700" fill="#1e293b">&#9889;create.blade.php</text>
  <rect x="40" y="344" width="194" height="44" rx="8" fill="#eef2ff"/>
  <text x="137" y="364" text-anchor="middle" font-size="13" fill="#475569">teg sahifada:</text>
  <text x="137" y="382" text-anchor="middle" font-size="13" font-weight="700" fill="#4f46e5">&lt;livewire:post.create /&gt;</text>

  <!-- MFC -->
  <rect x="267" y="202" width="226" height="200" rx="12" fill="#ffffff" stroke="#fb70a9" stroke-width="2"/>
  <rect x="267" y="202" width="226" height="36" rx="12" fill="#fb70a9"/>
  <text x="380" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">MFC</text>
  <text x="283" y="262" font-size="13" fill="#475569">components/post/</text>
  <text x="293" y="282" font-size="13" font-weight="700" fill="#1e293b">&#9889;create/</text>
  <text x="303" y="302" font-size="13" fill="#475569">create.php</text>
  <text x="303" y="322" font-size="13" fill="#475569">create.blade.php</text>
  <rect x="283" y="344" width="194" height="44" rx="8" fill="#fdf2f8"/>
  <text x="380" y="364" text-anchor="middle" font-size="13" fill="#475569">teg sahifada:</text>
  <text x="380" y="382" text-anchor="middle" font-size="13" font-weight="700" fill="#fb70a9">&lt;livewire:post.create /&gt;</text>

  <!-- Klass -->
  <rect x="510" y="202" width="226" height="200" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="510" y="202" width="226" height="36" rx="12" fill="#94a3b8"/>
  <text x="623" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Klass</text>
  <text x="526" y="262" font-size="13" fill="#475569">app/Livewire/Post/</text>
  <text x="536" y="282" font-size="13" font-weight="700" fill="#1e293b">Create.php</text>
  <text x="526" y="302" font-size="13" fill="#475569">views/livewire/post/</text>
  <text x="536" y="322" font-size="13" font-weight="700" fill="#1e293b">create.blade.php</text>
  <rect x="526" y="344" width="194" height="44" rx="8" fill="#f1f5f9"/>
  <text x="623" y="364" text-anchor="middle" font-size="13" fill="#475569">teg sahifada:</text>
  <text x="623" y="382" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">&lt;livewire:post.create /&gt;</text>

  <text x="380" y="426" text-anchor="middle" font-size="13" fill="#94a3b8">Nom bir xil — teg ham bir xil. Faqat fayl joylashuvi formatga qarab o'zgaradi</text>
</svg>
