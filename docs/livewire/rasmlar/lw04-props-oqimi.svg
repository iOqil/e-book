<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Props oqimi: ota komponentdan statik va dinamik props bola komponentga uzatilib, mount() yoki mos public propertyga tushishi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Props oqimi: ota &#8594; bola</text>

  <!-- Ota komponent -->
  <rect x="30" y="64" width="240" height="170" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="30" y="64" width="240" height="38" rx="12" fill="#4f46e5"/>
  <text x="150" y="89" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Ota Blade (sahifa)</text>
  <text x="46" y="128" font-size="13" font-weight="700" fill="#16a34a">Statik (matn):</text>
  <text x="46" y="150" font-size="13" fill="#1e293b">&lt;livewire:greeting</text>
  <text x="56" y="168" font-size="13" font-weight="700" fill="#4f46e5">name="Oqil" /&gt;</text>
  <text x="46" y="198" font-size="13" font-weight="700" fill="#f59e0b">Dinamik (PHP qiymat):</text>
  <text x="46" y="220" font-size="13" fill="#1e293b">&lt;livewire:greeting</text>
  <text x="180" y="220" font-size="13" font-weight="700" fill="#f59e0b">:user="$u" /&gt;</text>

  <!-- Strelka -->
  <line x1="270" y1="150" x2="345" y2="150" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="307" y="140" text-anchor="middle" font-size="13" fill="#475569">props</text>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Bola komponent -->
  <rect x="350" y="64" width="384" height="290" rx="12" fill="#ffffff" stroke="#fb70a9" stroke-width="2"/>
  <rect x="350" y="64" width="384" height="38" rx="12" fill="#fb70a9"/>
  <text x="542" y="89" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Bola komponent (greeting)</text>

  <!-- Yo'l 1: mount -->
  <rect x="368" y="118" width="348" height="100" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="382" y="140" font-size="14" font-weight="700" fill="#4f46e5">1-yo'l: mount() da qabul qilish</text>
  <text x="382" y="164" font-size="13" fill="#1e293b">public string $name = '';</text>
  <text x="382" y="186" font-size="13" fill="#1e293b">public function mount($name) {</text>
  <text x="392" y="206" font-size="13" fill="#475569">$this-&gt;name = $name;  }</text>

  <!-- Yo'l 2: avto -->
  <rect x="368" y="230" width="348" height="78" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="382" y="252" font-size="14" font-weight="700" fill="#16a34a">2-yo'l: mos nomli property (avto)</text>
  <text x="382" y="276" font-size="13" fill="#1e293b">public string $name = 'Mehmon';</text>
  <text x="382" y="296" font-size="13" fill="#475569">// prop nomi = property nomi &#8594; o'zi to'ladi</text>

  <text x="542" y="334" text-anchor="middle" font-size="13" fill="#94a3b8">mount() faqat bir marta — komponent yaratilganda ishlaydi</text>

  <!-- Natija -->
  <rect x="30" y="378" width="704" height="64" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="50" y="404" font-size="14" font-weight="700" fill="#16a34a">Natija (Blade'da):</text>
  <text x="50" y="428" font-size="14" fill="#1e293b">&lt;p&gt;Assalomu alaykum, {{ $name }}!&lt;/p&gt; &#8594; "Assalomu alaykum, Oqil!"</text>
</svg>
