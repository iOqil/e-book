<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" font-family="Segoe UI, system-ui, sans-serif">
  <title>Action avtorizatsiyadan o'tadi: ruxsat bo'lsa davom etadi, bo'lmasa 403 bilan to'xtaydi</title>
  <rect x="0" y="0" width="760" height="450" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Har action avtorizatsiyadan o'tsin</text>
  <text x="380" y="58" text-anchor="middle" font-size="14" fill="#475569">$this-&gt;authorize('delete', $post) — huquqni serverda tekshiradi</text>

  <!-- Step 1: action chaqiruvi -->
  <rect x="40" y="90" width="220" height="92" rx="11" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="150" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">1. Action chaqirildi</text>
  <text x="150" y="146" text-anchor="middle" font-size="13" fill="#475569">deletePost(999)</text>
  <text x="150" y="166" text-anchor="middle" font-size="13" fill="#94a3b8">(id mijozdan keldi)</text>

  <!-- arrow -->
  <path d="M260 136 L300 136" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Step 2: authorize gate -->
  <rect x="304" y="90" width="220" height="92" rx="11" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="414" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">2. authorize / Policy</text>
  <text x="414" y="146" text-anchor="middle" font-size="13" fill="#475569">"bu post shu</text>
  <text x="414" y="166" text-anchor="middle" font-size="13" fill="#475569">foydalanuvchinikimi?"</text>

  <!-- Branch lines -->
  <path d="M414 182 L414 210 M200 210 L628 210 M200 210 L200 244 M628 210 L628 244" fill="none" stroke="#c7d2fe" stroke-width="2.5"/>

  <!-- Branch ruxsat (yes) -->
  <rect x="80" y="248" width="240" height="120" rx="11" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="200" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">RUXSAT (ha)</text>
  <text x="200" y="302" text-anchor="middle" font-size="13" fill="#475569">egasi — to'g'ri foydalanuvchi</text>
  <text x="200" y="326" text-anchor="middle" font-size="14" fill="#1e293b">$post-&gt;delete()</text>
  <text x="200" y="350" text-anchor="middle" font-size="13" fill="#94a3b8">amal bajariladi</text>
  <text x="160" y="234" font-size="13" font-weight="700" fill="#16a34a">true</text>

  <!-- Branch rad (no) -->
  <rect x="508" y="248" width="240" height="120" rx="11" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="628" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">RAD (yo'q)</text>
  <text x="628" y="302" text-anchor="middle" font-size="13" fill="#475569">begona post — egasi emas</text>
  <text x="628" y="326" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">403 Forbidden</text>
  <text x="628" y="350" text-anchor="middle" font-size="13" fill="#94a3b8">amal bajarilmaydi</text>
  <text x="600" y="234" font-size="13" font-weight="700" fill="#dc2626">false</text>

  <!-- Bottom note -->
  <rect x="40" y="392" width="680" height="44" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="380" y="420" text-anchor="middle" font-size="14" fill="#475569">Ko'rsatilmagan tugma himoya emas — faqat serverdagi tekshiruv himoya qiladi.</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 3 L0 6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
