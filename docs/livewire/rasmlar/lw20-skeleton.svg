<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Segoe UI, system-ui, sans-serif">
  <title>Skeleton ekran: yuklash davomida kulrang soya bloklari ko'rinadi, kontent kelgach ular haqiqiy matnga almashadi</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Skeleton ekran: soyadan kontentgacha</text>
  <text x="380" y="58" text-anchor="middle" font-size="14" fill="#475569">bo'sh ekran emas — kontentning "soyasi" kutib turadi</text>

  <!-- CHAP: skeleton (yuklanmoqda) -->
  <rect x="40" y="86" width="300" height="280" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="190" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">Yuklanmoqda (wire:loading)</text>

  <!-- avatar soya + qatorlar -->
  <circle cx="80" cy="156" r="20" fill="#e2e8f0"/>
  <rect x="116" y="142" width="180" height="14" rx="7" fill="#e2e8f0"/>
  <rect x="116" y="164" width="120" height="12" rx="6" fill="#eef2f6"/>

  <rect x="64" y="200" width="252" height="14" rx="7" fill="#e2e8f0"/>
  <rect x="64" y="224" width="252" height="14" rx="7" fill="#e2e8f0"/>
  <rect x="64" y="248" width="180" height="14" rx="7" fill="#eef2f6"/>

  <rect x="64" y="288" width="252" height="14" rx="7" fill="#e2e8f0"/>
  <rect x="64" y="312" width="200" height="14" rx="7" fill="#eef2f6"/>

  <text x="190" y="352" text-anchor="middle" font-size="13" fill="#94a3b8">kulrang soya bloklari</text>

  <!-- o'rta strelka -->
  <line x1="356" y1="226" x2="404" y2="226" stroke="#6366f1" stroke-width="3"/>
  <polygon points="404,226 392,219 392,233" fill="#6366f1"/>
  <text x="380" y="210" text-anchor="middle" font-size="13" fill="#4f46e5">javob</text>
  <text x="380" y="252" text-anchor="middle" font-size="13" fill="#4f46e5">keldi</text>

  <!-- O'NG: haqiqiy kontent -->
  <rect x="420" y="86" width="300" height="280" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="570" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">Tayyor (wire:loading.remove)</text>

  <circle cx="460" cy="156" r="20" fill="#4f46e5"/>
  <text x="460" y="161" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">A</text>
  <text x="496" y="153" font-size="14" font-weight="700" fill="#1e293b">Ali Valiyev</text>
  <text x="496" y="173" font-size="13" fill="#94a3b8">2 soat oldin</text>

  <text x="444" y="210" font-size="13" fill="#475569">Livewire loading holatlari juda</text>
  <text x="444" y="232" font-size="13" fill="#475569">qulay ekan — bir nechta atribut</text>
  <text x="444" y="254" font-size="13" fill="#475569">bilan ilova jonli his etiladi.</text>

  <text x="444" y="294" font-size="13" fill="#475569">Skeleton ekran ayniqsa yoqdi:</text>
  <text x="444" y="316" font-size="13" fill="#475569">kutish endi bezovta qilmaydi.</text>

  <text x="570" y="352" text-anchor="middle" font-size="13" fill="#16a34a">haqiqiy matn paydo bo'ldi</text>

  <!-- pastki izoh -->
  <rect x="40" y="384" width="680" height="0" fill="none"/>
  <text x="380" y="402" text-anchor="middle" font-size="13" fill="#475569">Foydalanuvchi "ishlayapti, hammasi joyida" deb his qiladi — bo'sh ekran esa "tashlandiq" taassuroti beradi.</text>
</svg>
