<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Mijoz brauzer konsolidan public xususiyatni o'zgartiradi va server unga ishonib qoladi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Public xususiyat — ochiq devor</text>
  <text x="380" y="58" text-anchor="middle" font-size="14" fill="#475569">public xususiyat brauzerga ketadi va o'zgartirilishi mumkin</text>

  <!-- Brauzer (mijoz) -->
  <rect x="40" y="86" width="320" height="320" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
  <text x="200" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">Brauzer (mijoz hududi)</text>

  <!-- HTML snapshot -->
  <rect x="64" y="130" width="272" height="92" rx="9" fill="#f8fafc" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="80" y="153" font-size="13" font-weight="700" fill="#475569">Sahifa HTML ichidagi holat:</text>
  <text x="80" y="176" font-size="14" fill="#1e293b">price: 100</text>
  <text x="80" y="198" font-size="14" fill="#94a3b8">(ko'rinadi — va o'zgartirsa ham bo'ladi)</text>

  <!-- Console -->
  <rect x="64" y="236" width="272" height="148" rx="9" fill="#1e293b"/>
  <text x="80" y="260" font-size="13" font-weight="700" fill="#94a3b8">Konsol (F12):</text>
  <text x="80" y="288" font-size="14" fill="#fb70a9">&gt; $wire.price = 1</text>
  <text x="80" y="314" font-size="14" fill="#fb70a9">&gt; $wire.buy()</text>
  <text x="80" y="346" font-size="13" fill="#f59e0b">narx 100 -&gt; 1 ga o'zgartirildi!</text>
  <text x="80" y="368" font-size="13" fill="#94a3b8">hujumchi qiymatni buzdi</text>

  <!-- Arrow -->
  <path d="M364 246 L452 246" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#redarrow)"/>
  <text x="408" y="238" text-anchor="middle" font-size="13" fill="#dc2626">so'rov</text>

  <!-- Server -->
  <rect x="456" y="86" width="264" height="320" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="588" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#4f46e5">Server</text>

  <rect x="480" y="140" width="216" height="120" rx="9" fill="#f8fafc" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="496" y="166" font-size="14" font-weight="700" fill="#1e293b">buy() metodi:</text>
  <text x="496" y="192" font-size="13" fill="#475569">to'lov = $this-&gt;price</text>
  <text x="496" y="216" font-size="13" fill="#475569">"public'ga ishonyapman"</text>
  <text x="496" y="240" font-size="13" fill="#dc2626">to'lov = 1 so'm (!)</text>

  <!-- Result -->
  <rect x="480" y="276" width="216" height="108" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="588" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">Natija: falokat</text>
  <text x="588" y="330" text-anchor="middle" font-size="13" fill="#475569">mahsulot 100 emas,</text>
  <text x="588" y="350" text-anchor="middle" font-size="13" fill="#475569">1 so'mga sotildi</text>
  <text x="588" y="372" text-anchor="middle" font-size="13" fill="#94a3b8">server soxta qiymatga ishondi</text>

  <!-- Bottom note -->
  <text x="380" y="436" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Saboq: public xususiyatga ishonib qaror qabul qilma</text>
  <text x="380" y="458" text-anchor="middle" font-size="13" fill="#475569">o'zgarmasligi kerak bo'lsa — #[Locked] bilan qulfla</text>

  <defs>
    <marker id="redarrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 3 L0 6 Z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
