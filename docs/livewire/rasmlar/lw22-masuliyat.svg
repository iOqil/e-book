<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Mas'uliyat bo'linishi: Livewire server-side, Alpine client-side</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Kim nima qiladi: Livewire va Alpine</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">Har vazifani to'g'ri ustaga bering</text>

  <!-- LIVEWIRE (server) panel -->
  <rect x="30" y="86" width="340" height="346" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="30" y="86" width="340" height="48" rx="14" fill="#eef2ff"/>
  <rect x="30" y="116" width="340" height="18" fill="#eef2ff"/>
  <text x="200" y="116" text-anchor="middle" font-size="17" font-weight="700" fill="#4f46e5">LIVEWIRE — server tomoni</text>
  <text x="200" y="153" text-anchor="middle" font-size="13" fill="#94a3b8">Har o'zgarishda serverga so'rov ketadi</text>

  <g font-size="14" fill="#1e293b">
    <rect x="52" y="172" width="296" height="40" rx="8" fill="#f8fafc" stroke="#c7d2fe"/>
    <text x="68" y="197" font-size="14">Ma'lumotlar bazasi (DB) bilan ishlash</text>
    <rect x="52" y="220" width="296" height="40" rx="8" fill="#f8fafc" stroke="#c7d2fe"/>
    <text x="68" y="245" font-size="14">Biznes mantiq (hisob-kitob, qoidalar)</text>
    <rect x="52" y="268" width="296" height="40" rx="8" fill="#f8fafc" stroke="#c7d2fe"/>
    <text x="68" y="293" font-size="14">Validatsiya (ma'lumotni tekshirish)</text>
    <rect x="52" y="316" width="296" height="40" rx="8" fill="#f8fafc" stroke="#c7d2fe"/>
    <text x="68" y="341" font-size="14">Saqlash, yangilash, o'chirish (CRUD)</text>
    <rect x="52" y="364" width="296" height="48" rx="8" fill="#f8fafc" stroke="#c7d2fe"/>
    <text x="68" y="384" font-size="14">Maxfiy / muhim mantiq</text>
    <text x="68" y="402" font-size="13" fill="#475569">(brauzerga ishonib bo'lmaydi)</text>
  </g>

  <!-- ALPINE (client) panel -->
  <rect x="390" y="86" width="340" height="346" rx="14" fill="#ffffff" stroke="#fb70a9" stroke-width="2"/>
  <rect x="390" y="86" width="340" height="48" rx="14" fill="#fdeef5"/>
  <rect x="390" y="116" width="340" height="18" fill="#fdeef5"/>
  <text x="560" y="116" text-anchor="middle" font-size="17" font-weight="700" fill="#db2777">ALPINE — brauzer (client) tomoni</text>
  <text x="560" y="153" text-anchor="middle" font-size="13" fill="#94a3b8">Serverga bormaydi — bir zumda ishlaydi</text>

  <g font-size="14" fill="#1e293b">
    <rect x="412" y="172" width="296" height="40" rx="8" fill="#f8fafc" stroke="#fbcfe8"/>
    <text x="428" y="197" font-size="14">Dropdown ochish / yopish</text>
    <rect x="412" y="220" width="296" height="40" rx="8" fill="#f8fafc" stroke="#fbcfe8"/>
    <text x="428" y="245" font-size="14">Tab (varaq) almashtirish</text>
    <rect x="412" y="268" width="296" height="40" rx="8" fill="#f8fafc" stroke="#fbcfe8"/>
    <text x="428" y="293" font-size="14">Modal animatsiya, ko'rinish-yashirish</text>
    <rect x="412" y="316" width="296" height="40" rx="8" fill="#f8fafc" stroke="#fbcfe8"/>
    <text x="428" y="341" font-size="14">Accordion, tooltip, menyu</text>
    <rect x="412" y="364" width="296" height="48" rx="8" fill="#f8fafc" stroke="#fbcfe8"/>
    <text x="428" y="384" font-size="14">Sof tashqi ko'rinish holati</text>
    <text x="428" y="402" font-size="13" fill="#475569">(serverga aloqasi yo'q)</text>
  </g>

  <text x="380" y="456" text-anchor="middle" font-size="14" fill="#16a34a" font-weight="600">Ma'lumot &amp; mantiq -&gt; Livewire   ·   Sof UI holati -&gt; Alpine</text>
</svg>
