<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Segoe UI, system-ui, sans-serif">
  <title>wire:model.live orqali input va property o'rtasidagi jonli ikki tomonlama bog'lanish</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">wire:model.live — jonli bog'lanish</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">yozasiz — darhol, harf-baharf, pastda ko'rinadi</text>

  <!-- INPUT box (left) -->
  <rect x="50" y="100" width="290" height="120" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="195" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">Matn maydoni (input)</text>
  <rect x="78" y="146" width="234" height="40" rx="7" fill="#f8fafc" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="92" y="171" font-size="15" fill="#1e293b" font-family="Consolas, monospace">Oqil|</text>
  <text x="195" y="208" text-anchor="middle" font-size="13" fill="#475569" font-family="Consolas, monospace">wire:model.live="ism"</text>

  <!-- PROPERTY box (right) -->
  <rect x="420" y="100" width="290" height="120" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="565" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">Property (xotira)</text>
  <rect x="448" y="146" width="234" height="40" rx="7" fill="#ecfdf5" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="462" y="171" font-size="15" fill="#1e293b" font-family="Consolas, monospace">$ism = "Oqil"</text>
  <text x="565" y="208" text-anchor="middle" font-size="13" fill="#475569" font-family="Consolas, monospace">public string $ism</text>

  <!-- two-way arrows between input and property -->
  <line x1="340" y1="150" x2="420" y2="150" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrI)"/>
  <text x="380" y="142" text-anchor="middle" font-size="13" fill="#4f46e5">yozganda</text>
  <line x1="420" y1="178" x2="340" y2="178" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrG)"/>
  <text x="380" y="196" text-anchor="middle" font-size="13" fill="#16a34a">qaytadi</text>

  <!-- OUTPUT box (bottom) -->
  <rect x="220" y="278" width="320" height="78" rx="12" fill="#ffffff" stroke="#fb70a9" stroke-width="2"/>
  <text x="380" y="306" text-anchor="middle" font-size="14" font-weight="700" fill="#be3a76">Sahifada ko'rinish</text>
  <text x="380" y="334" text-anchor="middle" font-size="16" fill="#1e293b" font-family="Consolas, monospace">Salom, Oqil!</text>

  <!-- arrow property -> output -->
  <line x1="565" y1="220" x2="430" y2="274" stroke="#fb70a9" stroke-width="2" marker-end="url(#arrP)"/>
  <text x="540" y="256" text-anchor="middle" font-size="13" fill="#be3a76">{{ $ism }}</text>

  <text x="380" y="392" text-anchor="middle" font-size="13" fill="#94a3b8">.live = har o'zgarishda darhol serverga yuboriladi (jonli yangilanish)</text>

  <defs>
    <marker id="arrI" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4f46e5"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker>
    <marker id="arrP" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#fb70a9"/></marker>
  </defs>
</svg>
