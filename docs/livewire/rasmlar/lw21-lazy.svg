<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Lazy yuklash: sahifa darhol ochiladi va placeholder (skeleton) ko'rsatadi, og'ir komponent esa fonda yuklanib keyin almashadi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Lazy yuklash: avval skeleton, keyin haqiqiy komponent</text>

  <!-- 1-qadam: sahifa darhol -->
  <rect x="30" y="62" width="220" height="160" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="140" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#4f46e5">1. Sahifa DARHOL ochildi</text>
  <rect x="50" y="100" width="180" height="20" rx="4" fill="#eef2ff"/>
  <text x="140" y="115" text-anchor="middle" font-size="13" fill="#475569">Yengil qismlar tayyor</text>
  <!-- placeholder skeleton -->
  <rect x="50" y="130" width="180" height="78" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="140" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#94a3b8">placeholder()</text>
  <rect x="64" y="162" width="152" height="11" rx="5" fill="#e2e8f0"/>
  <rect x="64" y="180" width="110" height="11" rx="5" fill="#e2e8f0"/>
  <text x="140" y="203" text-anchor="middle" font-size="13" fill="#94a3b8">skeleton</text>

  <!-- strelka 1->2 -->
  <line x1="256" y1="142" x2="312" y2="142" stroke="#4f46e5" stroke-width="2.5"/>
  <polygon points="314,142 300,136 300,148" fill="#4f46e5"/>
  <text x="285" y="132" text-anchor="middle" font-size="13" fill="#475569">fonda</text>

  <!-- 2-qadam: fonda yuklanmoqda -->
  <rect x="320" y="62" width="200" height="160" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="420" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">2. Fonda yuklanmoqda</text>
  <circle cx="420" cy="138" r="30" fill="none" stroke="#fde68a" stroke-width="7"/>
  <path d="M 420 108 a 30 30 0 0 1 26 15" fill="none" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
  <text x="420" y="192" text-anchor="middle" font-size="13" fill="#92400e">og'ir so'rovlar bajariladi</text>
  <text x="420" y="210" text-anchor="middle" font-size="13" fill="#475569">(2-chi HTTP so'rov)</text>

  <!-- strelka 2->3 -->
  <line x1="526" y1="142" x2="582" y2="142" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="584,142 570,136 570,148" fill="#16a34a"/>
  <text x="555" y="132" text-anchor="middle" font-size="13" fill="#16a34a">tayyor</text>

  <!-- 3-qadam: almashadi -->
  <rect x="590" y="62" width="150" height="160" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="665" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">3. Almashdi</text>
  <rect x="606" y="100" width="118" height="20" rx="4" fill="#eef2ff"/>
  <text x="665" y="115" text-anchor="middle" font-size="13" fill="#475569">Yengil qismlar</text>
  <rect x="606" y="130" width="118" height="78" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="665" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">Haqiqiy</text>
  <text x="665" y="176" text-anchor="middle" font-size="13" fill="#16a34a">komponent</text>
  <text x="665" y="196" text-anchor="middle" font-size="13" fill="#16a34a">(jami: 12345)</text>

  <!-- pastki tushuntirish -->
  <rect x="30" y="250" width="710" height="86" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="385" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Foydalanuvchi nimani his qiladi?</text>
  <text x="385" y="302" text-anchor="middle" font-size="13" fill="#475569">Sahifa darrov ochiladi (kutib o'tirmaydi). Og'ir bo'lim "yuklanmoqda" ko'rinishida turadi,</text>
  <text x="385" y="322" text-anchor="middle" font-size="13" fill="#475569">tayyor bo'lganda esa o'zi almashadi. Sekin komponent boshqasini ushlab turmaydi.</text>

  <!-- taqqoslash: lazysiz vs lazy -->
  <rect x="30" y="350" width="345" height="100" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="202" y="376" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">Lazy YO'Q</text>
  <text x="202" y="400" text-anchor="middle" font-size="13" fill="#475569">Hamma narsa bitta so'rovda.</text>
  <text x="202" y="420" text-anchor="middle" font-size="13" fill="#475569">Og'ir bo'lim butun sahifani</text>
  <text x="202" y="438" text-anchor="middle" font-size="13" fill="#dc2626">3 soniya KUTTIRADI.</text>

  <rect x="395" y="350" width="345" height="100" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="567" y="376" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">Lazy BOR</text>
  <text x="567" y="400" text-anchor="middle" font-size="13" fill="#475569">Sahifa darrov, og'ir bo'lim alohida.</text>
  <text x="567" y="420" text-anchor="middle" font-size="13" fill="#475569">Foydalanuvchi 0.1 soniyada</text>
  <text x="567" y="438" text-anchor="middle" font-size="13" fill="#16a34a">sahifani KO'RADI.</text>
</svg>
