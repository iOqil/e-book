<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Ma'lumot oqimi: foydalanuvchi amal qiladi, komponent metodi ishlaydi, ma'lumotlar bazasi yangilanadi, kesh tozalanadi, render qayta ishlaydi va UI yangilanadi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Bitta amalning yo'li: bosishdan ekrangacha</text>

  <defs>
    <marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- 1 -->
  <rect x="40" y="70" width="200" height="74" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="140" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">1. Foydalanuvchi</text>
  <text x="140" y="120" text-anchor="middle" font-size="13" fill="#475569">"Bajarildi" tugmasi</text>
  <text x="140" y="137" text-anchor="middle" font-size="13" fill="#94a3b8">wire:click="setStatus(...)"</text>

  <!-- 2 -->
  <rect x="280" y="70" width="200" height="74" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="380" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">2. Komponent metodi</text>
  <text x="380" y="120" text-anchor="middle" font-size="13" fill="#475569">authorize('update')</text>
  <text x="380" y="137" text-anchor="middle" font-size="13" fill="#94a3b8">huquq tekshiriladi</text>

  <!-- 3 -->
  <rect x="520" y="70" width="200" height="74" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">3. Ma'lumotlar bazasi</text>
  <text x="620" y="120" text-anchor="middle" font-size="13" fill="#475569">$task-&gt;update([...])</text>
  <text x="620" y="137" text-anchor="middle" font-size="13" fill="#94a3b8">status = 'done'</text>

  <line x1="240" y1="107" x2="276" y2="107" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="480" y1="107" x2="516" y2="107" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- pastga -->
  <line x1="620" y1="144" x2="620" y2="190" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 4 -->
  <rect x="520" y="196" width="200" height="74" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="620" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">4. Kesh tozalanadi</text>
  <text x="620" y="246" text-anchor="middle" font-size="13" fill="#475569">unset($this-&gt;tasks)</text>
  <text x="620" y="263" text-anchor="middle" font-size="13" fill="#94a3b8">eski ro'yxat o'chadi</text>

  <line x1="516" y1="233" x2="480" y2="233" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 5 -->
  <rect x="280" y="196" width="200" height="74" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="380" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">5. render() qayta</text>
  <text x="380" y="246" text-anchor="middle" font-size="13" fill="#475569">computed yangidan</text>
  <text x="380" y="263" text-anchor="middle" font-size="13" fill="#94a3b8">bazadan o'qiydi</text>

  <line x1="276" y1="233" x2="240" y2="233" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 6 -->
  <rect x="40" y="196" width="200" height="74" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="140" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">6. HTML farqi</text>
  <text x="140" y="246" text-anchor="middle" font-size="13" fill="#475569">faqat o'zgargan qism</text>
  <text x="140" y="263" text-anchor="middle" font-size="13" fill="#94a3b8">brauzerga yuboriladi</text>

  <line x1="140" y1="196" x2="140" y2="150" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 7 natija -->
  <rect x="140" y="320" width="480" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="380" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">7. UI yangilanadi — vazifa yashilga aylanadi</text>
  <text x="380" y="368" text-anchor="middle" font-size="13" fill="#475569">sahifa qayta yuklanmaydi · toast: "Holat yangilandi"</text>

  <line x1="140" y1="270" x2="200" y2="316" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr)"/>

  <text x="380" y="420" text-anchor="middle" font-size="13" fill="#94a3b8">Asosiy sir: og'ir o'qishni computed'da qiling, o'zgartirgach unset bilan keshni tozalang (15, 16-bob)</text>
  <text x="380" y="444" text-anchor="middle" font-size="13" fill="#94a3b8">Har 15 soniyada wire:poll shu siklni avtomatik takrorlaydi — boshqalar qo'shgani ham ko'rinadi (21-bob)</text>
</svg>
