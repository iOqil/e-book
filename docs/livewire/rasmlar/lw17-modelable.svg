<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Segoe UI, system-ui, sans-serif">
  <title>Ota wire:model va bola #[Modelable] o'rtasidagi ikki tomonlama bog'lanish</title>
  <rect x="0" y="0" width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">#[Modelable]: ikki tomonlama bog'lanish</text>

  <!-- Parent box -->
  <rect x="48" y="74" width="290" height="150" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="193" y="102" text-anchor="middle" font-size="16" font-weight="700" fill="#4f46e5">Ota: PostForm</text>
  <line x1="64" y1="114" x2="322" y2="114" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="193" y="140" text-anchor="middle" font-size="14" fill="#475569">public $sarlavha;</text>
  <rect x="72" y="156" width="242" height="50" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="193" y="178" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="700">&lt;livewire:custom-input</text>
  <text x="193" y="197" text-anchor="middle" font-size="13" fill="#fb70a9" font-weight="700">wire:model="sarlavha" /&gt;</text>

  <!-- Child box -->
  <rect x="422" y="74" width="290" height="150" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="567" y="102" text-anchor="middle" font-size="16" font-weight="700" fill="#6366f1">Bola: custom-input</text>
  <line x1="438" y1="114" x2="696" y2="114" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="567" y="140" text-anchor="middle" font-size="13" fill="#16a34a" font-weight="700">#[Modelable]</text>
  <text x="567" y="160" text-anchor="middle" font-size="14" fill="#475569">public $value;</text>
  <rect x="446" y="172" width="242" height="38" rx="8" fill="#f8fafc" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="567" y="196" text-anchor="middle" font-size="13" fill="#1e293b">&lt;input wire:model.live="value"&gt;</text>

  <!-- Two-way arrows -->
  <path d="M338 134 L422 134" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrR)"/>
  <path d="M422 178 L338 178" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrL)"/>
  <defs>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#16a34a"/>
    </marker>
    <marker id="arrL" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <text x="380" y="126" text-anchor="middle" font-size="13" fill="#16a34a" font-weight="700">otadan bolaga</text>
  <text x="380" y="200" text-anchor="middle" font-size="13" fill="#f59e0b" font-weight="700">boladan otaga</text>

  <!-- Bottom explanation -->
  <rect x="48" y="252" width="664" height="120" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="68" y="280" font-size="15" font-weight="700" fill="#4f46e5">Qiymat har ikki yo'nalishda oqadi</text>
  <text x="68" y="306" font-size="14" fill="#475569">1. Bola inputiga yozsangiz — otadagi $sarlavha avtomatik o'zgaradi.</text>
  <text x="68" y="328" font-size="14" fill="#475569">2. Otada $sarlavha ni o'zgartirsangiz — bola inputi yangilanadi.</text>
  <text x="68" y="354" font-size="14" fill="#475569">Maxsus input vidjetlari uchun (rang tanlagich, yulduzli reyting va h.k.).</text>
</svg>
