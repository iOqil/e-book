<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="Segoe UI, system-ui, sans-serif">
  <title>Livewire ish oqimi: birinchi marta server to'liq HTML qaytaradi, keyin har action AJAX so'rov bilan snapshot yuboradi, server qayta render qiladi va faqat o'zgargan diff brauzer DOM'iga qo'llanadi</title>
  <rect x="0" y="0" width="760" height="540" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Livewire qanday ishlaydi</text>

  <!-- Ustun sarlavhalari -->
  <rect x="40" y="54" width="300" height="40" rx="10" fill="#4f46e5"/>
  <text x="190" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Brauzer (mijoz)</text>
  <rect x="420" y="54" width="300" height="40" rx="10" fill="#fb70a9"/>
  <text x="570" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Server (PHP / Livewire)</text>

  <!-- Vertikal hayot chiziqlari -->
  <line x1="190" y1="94" x2="190" y2="500" stroke="#c7d2fe" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="570" y1="94" x2="570" y2="500" stroke="#fbcfe8" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- 1-bosqich: birinchi yuklash -->
  <rect x="36" y="108" width="40" height="24" rx="6" fill="#16a34a"/>
  <text x="56" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text x="86" y="125" font-size="14" font-weight="700" fill="#1e293b">Birinchi tashrif: to'liq HTML</text>

  <line x1="190" y1="148" x2="566" y2="148" stroke="#475569" stroke-width="2"/>
  <polygon points="566,148 556,143 556,153" fill="#475569"/>
  <text x="378" y="142" text-anchor="middle" font-size="13" fill="#475569">GET so'rov (oddiy sahifa)</text>

  <line x1="570" y1="172" x2="194" y2="172" stroke="#16a34a" stroke-width="2"/>
  <polygon points="194,172 204,167 204,177" fill="#16a34a"/>
  <text x="378" y="166" text-anchor="middle" font-size="13" fill="#16a34a">To'liq tayyor HTML qaytadi</text>

  <!-- 2-bosqich: action -->
  <rect x="36" y="198" width="40" height="24" rx="6" fill="#f59e0b"/>
  <text x="56" y="215" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <text x="86" y="215" font-size="14" font-weight="700" fill="#1e293b">Foydalanuvchi tugmani bosadi</text>
  <rect x="80" y="226" width="220" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="190" y="246" text-anchor="middle" font-size="13" fill="#4f46e5">wire:click="increment"</text>

  <!-- 3-bosqich: AJAX snapshot -->
  <rect x="36" y="276" width="40" height="24" rx="6" fill="#4f46e5"/>
  <text x="56" y="293" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
  <text x="86" y="293" font-size="14" font-weight="700" fill="#1e293b">AJAX so'rov: snapshot yuboriladi</text>
  <line x1="190" y1="316" x2="566" y2="316" stroke="#4f46e5" stroke-width="2.5"/>
  <polygon points="566,316 556,311 556,321" fill="#4f46e5"/>
  <text x="378" y="310" text-anchor="middle" font-size="13" fill="#4f46e5">Komponent holati (snapshot) + action</text>

  <!-- 4-bosqich: server qayta render -->
  <rect x="420" y="332" width="300" height="56" rx="10" fill="#ffffff" stroke="#fb70a9" stroke-width="2"/>
  <text x="570" y="354" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">4. Server komponentni</text>
  <text x="570" y="374" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">qayta render qiladi (yangi HTML)</text>

  <!-- 5-bosqich: diff qaytadi -->
  <rect x="36" y="404" width="40" height="24" rx="6" fill="#16a34a"/>
  <text x="56" y="421" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">5</text>
  <text x="86" y="421" font-size="14" font-weight="700" fill="#1e293b">Faqat o'zgargan qism (DIFF) qaytadi</text>
  <line x1="570" y1="444" x2="194" y2="444" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="194,444 204,439 204,449" fill="#16a34a"/>
  <text x="378" y="438" text-anchor="middle" font-size="13" fill="#16a34a">Yangi snapshot + DOM farqi</text>

  <!-- 6-bosqich: DOM yangilanadi -->
  <rect x="40" y="462" width="300" height="48" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="190" y="482" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">6. Livewire faqat o'zgargan</text>
  <text x="190" y="500" text-anchor="middle" font-size="13" fill="#475569">DOM'ni yangilaydi — sahifa qayta yuklanmaydi</text>

  <text x="380" y="530" text-anchor="middle" font-size="13" fill="#94a3b8">2–6 bosqichlar har action'da takrorlanadi. Sahifa hech qachon "sakramaydi".</text>
</svg>
