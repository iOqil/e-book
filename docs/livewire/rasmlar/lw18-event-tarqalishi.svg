<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>Event tarqalishi: bitta komponent dispatch qiladi va bir nechta tinglovchi komponent #[On] atributi orqali bir vaqtda eshitadi</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Event = radio e'lon: biri yuboradi, ko'pi eshitadi</text>

  <!-- Yuboruvchi -->
  <rect x="40" y="160" width="220" height="110" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="150" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">TaskForm</text>
  <text x="150" y="212" text-anchor="middle" font-size="13" fill="#475569">(yuboruvchi)</text>
  <rect x="58" y="226" width="184" height="28" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="150" y="245" text-anchor="middle" font-size="13" fill="#4f46e5">dispatch('task-created')</text>

  <!-- Markaziy "efir" tugun -->
  <circle cx="380" cy="215" r="44" fill="#fb70a9"/>
  <text x="380" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">EFIR</text>
  <text x="380" y="228" text-anchor="middle" font-size="13" fill="#ffffff">'task-created'</text>

  <!-- Yuboruvchidan efirga strelka -->
  <line x1="260" y1="215" x2="334" y2="215" stroke="#4f46e5" stroke-width="3"/>
  <polygon points="336,215 322,208 322,222" fill="#4f46e5"/>
  <text x="296" y="205" text-anchor="middle" font-size="13" fill="#4f46e5">yuboradi</text>

  <!-- Tinglovchi 1 -->
  <rect x="520" y="56" width="220" height="92" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="630" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">TaskList</text>
  <rect x="538" y="98" width="184" height="34" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="630" y="113" text-anchor="middle" font-size="13" fill="#16a34a">#[On('task-created')]</text>
  <text x="630" y="128" text-anchor="middle" font-size="13" fill="#475569">addTask() ishlaydi</text>

  <!-- Tinglovchi 2 -->
  <rect x="520" y="168" width="220" height="92" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="630" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">TaskCounter</text>
  <rect x="538" y="210" width="184" height="34" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="630" y="225" text-anchor="middle" font-size="13" fill="#16a34a">#[On('task-created')]</text>
  <text x="630" y="240" text-anchor="middle" font-size="13" fill="#475569">sanoqni oshiradi</text>

  <!-- Tinglovchi 3 -->
  <rect x="520" y="280" width="220" height="92" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="630" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">ActivityFeed</text>
  <rect x="538" y="322" width="184" height="34" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="630" y="337" text-anchor="middle" font-size="13" fill="#16a34a">#[On('task-created')]</text>
  <text x="630" y="352" text-anchor="middle" font-size="13" fill="#475569">tarixga qo'shadi</text>

  <!-- Efirdan tinglovchilarga strelkalar -->
  <line x1="418" y1="195" x2="516" y2="110" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="518,108 504,110 511,121" fill="#16a34a"/>
  <line x1="424" y1="215" x2="516" y2="214" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="518,214 504,208 504,221" fill="#16a34a"/>
  <line x1="418" y1="236" x2="516" y2="318" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="518,320 511,309 504,320" fill="#16a34a"/>

  <text x="380" y="408" text-anchor="middle" font-size="14" fill="#475569">Yuboruvchi kim eshitishini bilmaydi. Yangi tinglovchi qo'shilsa — yuboruvchini o'zgartirish shart emas.</text>
  <text x="380" y="430" text-anchor="middle" font-size="13" fill="#94a3b8">Bu bo'shashgan bog'lanish (loose coupling).</text>
</svg>
