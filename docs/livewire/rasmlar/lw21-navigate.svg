<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Oddiy havola butun sahifani qaytadan yuklaydi (oq miltillash), wire:navigate esa faqat kontentni almashtiradi va sayt SPA kabi tez his beradi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Oddiy havola vs wire:navigate</text>

  <!-- chap: oddiy havola -->
  <rect x="30" y="58" width="345" height="394" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="202" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">Oddiy &lt;a href&gt;</text>
  <rect x="50" y="98" width="305" height="26" rx="6" fill="#fef2f2"/>
  <text x="202" y="116" text-anchor="middle" font-size="13" fill="#475569">&lt;a href="/posts"&gt;</text>

  <!-- 1-holat -->
  <rect x="50" y="136" width="305" height="64" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="62" y="148" width="281" height="14" rx="4" fill="#e2e8f0"/>
  <text x="202" y="184" text-anchor="middle" font-size="13" fill="#475569">1. Eski sahifa</text>

  <line x1="202" y1="206" x2="202" y2="230" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="202,232 196,218 208,218" fill="#dc2626"/>

  <!-- 2-holat: oq ekran -->
  <rect x="50" y="238" width="305" height="64" rx="9" fill="#ffffff" stroke="#dc2626" stroke-dasharray="5 4"/>
  <text x="202" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">2. OQ MILTILLASH</text>
  <text x="202" y="288" text-anchor="middle" font-size="13" fill="#dc2626">butun sahifa o'chadi</text>

  <line x1="202" y1="308" x2="202" y2="332" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="202,334 196,320 208,320" fill="#dc2626"/>

  <!-- 3-holat -->
  <rect x="50" y="340" width="305" height="64" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="62" y="352" width="281" height="14" rx="4" fill="#e2e8f0"/>
  <text x="202" y="390" text-anchor="middle" font-size="13" fill="#475569">3. Yangi sahifa (hammasi qayta)</text>

  <text x="202" y="430" text-anchor="middle" font-size="13" fill="#dc2626">CSS, JS, layout — HAMMASI qayta yuklanadi</text>
  <text x="202" y="446" text-anchor="middle" font-size="13" fill="#475569">sekin, miltillaydi</text>

  <!-- o'ng: wire:navigate -->
  <rect x="385" y="58" width="345" height="394" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="557" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">wire:navigate</text>
  <rect x="405" y="98" width="305" height="26" rx="6" fill="#f0fdf4"/>
  <text x="557" y="116" text-anchor="middle" font-size="13" fill="#475569">&lt;a href="/posts" wire:navigate&gt;</text>

  <!-- doimiy qoladigan layout -->
  <rect x="405" y="136" width="305" height="268" rx="9" fill="#f8fafc" stroke="#16a34a"/>
  <rect x="417" y="148" width="281" height="22" rx="4" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="557" y="164" text-anchor="middle" font-size="13" fill="#4f46e5">Menyu / layout — JOYIDA qoladi</text>

  <!-- faqat kontent almashadi -->
  <rect x="417" y="180" width="281" height="150" rx="8" fill="#ffffff" stroke="#16a34a" stroke-dasharray="5 4"/>
  <text x="557" y="206" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">FAQAT kontent</text>
  <text x="557" y="226" text-anchor="middle" font-size="13" fill="#16a34a">almashadi</text>
  <rect x="435" y="240" width="245" height="12" rx="4" fill="#dcfce7"/>
  <rect x="435" y="260" width="200" height="12" rx="4" fill="#dcfce7"/>
  <rect x="435" y="280" width="225" height="12" rx="4" fill="#dcfce7"/>
  <text x="557" y="316" text-anchor="middle" font-size="13" fill="#475569">oq miltillash YO'Q</text>

  <rect x="417" y="340" width="281" height="22" rx="4" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="557" y="356" text-anchor="middle" font-size="13" fill="#4f46e5">Pastki panel — JOYIDA qoladi</text>

  <text x="557" y="430" text-anchor="middle" font-size="13" fill="#16a34a">CSS/JS bir marta, layout saqlanadi</text>
  <text x="557" y="446" text-anchor="middle" font-size="13" fill="#16a34a">tez, silliq — SPA his beradi</text>
</svg>
