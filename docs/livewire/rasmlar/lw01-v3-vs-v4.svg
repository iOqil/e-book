<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Livewire 3 va Livewire 4 o'rtasidagi asosiy farqlar jadvali: komponent formati, fayl joyi, routing, diffing tezligi, modellar bilan bog'lash va Vue/React ko'priklari</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Livewire 3 va Livewire 4 — asosiy farqlar</text>

  <!-- Ustun sarlavhalari -->
  <rect x="30" y="56" width="220" height="40" rx="8" fill="#1e293b"/>
  <text x="140" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Xususiyat</text>
  <rect x="256" y="56" width="240" height="40" rx="8" fill="#94a3b8"/>
  <text x="376" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Livewire 3</text>
  <rect x="502" y="56" width="228" height="40" rx="8" fill="#4f46e5"/>
  <text x="616" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Livewire 4 (2026)</text>

  <!-- Qator 1 -->
  <rect x="30" y="102" width="220" height="56" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="256" y="102" width="240" height="56" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="502" y="102" width="228" height="56" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="44" y="135" font-size="14" font-weight="700" fill="#1e293b">Komponent formati</text>
  <text x="270" y="135" font-size="13" fill="#475569">PHP klass + alohida Blade</text>
  <text x="516" y="128" font-size="13" fill="#4f46e5">Single-File: PHP + Blade</text>
  <text x="516" y="146" font-size="13" fill="#4f46e5">bitta faylda (default)</text>

  <!-- Qator 2 -->
  <rect x="30" y="158" width="220" height="50" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="256" y="158" width="240" height="50" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="502" y="158" width="228" height="50" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="44" y="187" font-size="14" font-weight="700" fill="#1e293b">Fayl joyi</text>
  <text x="270" y="187" font-size="13" fill="#475569">app/Livewire/...php</text>
  <text x="516" y="187" font-size="13" fill="#4f46e5">views/components/⚡...</text>

  <!-- Qator 3 -->
  <rect x="30" y="208" width="220" height="50" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="256" y="208" width="240" height="50" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="502" y="208" width="228" height="50" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="44" y="237" font-size="14" font-weight="700" fill="#1e293b">Full-page routing</text>
  <text x="270" y="237" font-size="13" fill="#475569">Route::get(..., Class)</text>
  <text x="516" y="237" font-size="13" fill="#4f46e5">Route::livewire(...)</text>

  <!-- Qator 4 -->
  <rect x="30" y="258" width="220" height="50" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="256" y="258" width="240" height="50" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="502" y="258" width="228" height="50" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="44" y="287" font-size="14" font-weight="700" fill="#1e293b">Diffing (yangilash)</text>
  <text x="270" y="287" font-size="13" fill="#475569">Tez</text>
  <text x="516" y="287" font-size="13" fill="#16a34a">~60% kam DOM yangilash</text>

  <!-- Qator 5 -->
  <rect x="30" y="308" width="220" height="50" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="256" y="308" width="240" height="50" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="502" y="308" width="228" height="50" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="44" y="337" font-size="14" font-weight="700" fill="#1e293b">wire:model default</text>
  <text x="270" y="337" font-size="13" fill="#475569">deferred</text>
  <text x="516" y="330" font-size="13" fill="#4f46e5">deferred (.blur/.change =</text>
  <text x="516" y="348" font-size="13" fill="#4f46e5">client-side; server: .live)</text>

  <!-- Qator 6 -->
  <rect x="30" y="358" width="220" height="50" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="256" y="358" width="240" height="50" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="502" y="358" width="228" height="50" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="44" y="387" font-size="14" font-weight="700" fill="#1e293b">Vue / React ko'prik</text>
  <text x="270" y="387" font-size="13" fill="#475569">Yo'q (qo'lda)</text>
  <text x="516" y="387" font-size="13" fill="#16a34a">Rasmiy ko'priklar bor</text>

  <text x="380" y="438" text-anchor="middle" font-size="14" fill="#475569">Bu kitob Livewire 4 asosida. Eski farqlar har bobda</text>
  <text x="380" y="458" text-anchor="middle" font-size="14" font-weight="700" fill="#4f46e5">"Livewire 3 da qanday edi?"</text>
</svg>
