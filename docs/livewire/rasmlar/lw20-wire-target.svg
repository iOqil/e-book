<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>wire:target taqqoslash: target siz har ikkala indikator yonadi, target bilan har amal faqat o'z indikatorini yoqadi</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">wire:target: har amal o'z indikatoriga ega</text>
  <text x="380" y="58" text-anchor="middle" font-size="14" fill="#475569">"Saqlash" bosildi — qaysi indikator yonishi kerak?</text>

  <!-- CHAP: target SIZ (xato) -->
  <rect x="30" y="84" width="340" height="320" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="200" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">target SIZ — chalkash</text>

  <rect x="56" y="132" width="130" height="40" rx="8" fill="#4f46e5"/>
  <text x="121" y="157" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Saqlash ✓</text>
  <rect x="214" y="132" width="130" height="40" rx="8" fill="#e2e8f0"/>
  <text x="279" y="157" text-anchor="middle" font-size="14" font-weight="700" fill="#94a3b8">O'chirish</text>

  <text x="200" y="206" text-anchor="middle" font-size="13" fill="#475569">wire:loading (target yo'q)</text>

  <rect x="56" y="222" width="130" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="121" y="249" text-anchor="middle" font-size="13" fill="#dc2626">Saqlanmoqda...</text>
  <rect x="214" y="222" width="130" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="279" y="249" text-anchor="middle" font-size="13" fill="#dc2626">O'chirilmoqda...</text>

  <rect x="56" y="298" width="288" height="86" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="200" y="326" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">Ikkalasi ham yondi!</text>
  <text x="200" y="350" text-anchor="middle" font-size="13" fill="#475569">Livewire uchun ular bir so'rov —</text>
  <text x="200" y="370" text-anchor="middle" font-size="13" fill="#475569">"O'chirilmoqda..." bekorga chiqdi.</text>

  <!-- O'NG: target BILAN (to'g'ri) -->
  <rect x="390" y="84" width="340" height="320" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="560" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">target BILAN — aniq</text>

  <rect x="416" y="132" width="130" height="40" rx="8" fill="#4f46e5"/>
  <text x="481" y="157" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Saqlash ✓</text>
  <rect x="574" y="132" width="130" height="40" rx="8" fill="#e2e8f0"/>
  <text x="639" y="157" text-anchor="middle" font-size="14" font-weight="700" fill="#94a3b8">O'chirish</text>

  <text x="481" y="200" text-anchor="middle" font-size="13" fill="#475569">target="save"</text>
  <text x="639" y="200" text-anchor="middle" font-size="13" fill="#475569">target="delete"</text>

  <rect x="416" y="212" width="130" height="44" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="481" y="239" text-anchor="middle" font-size="13" fill="#4f46e5">Saqlanmoqda...</text>
  <rect x="574" y="212" width="130" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="639" y="239" text-anchor="middle" font-size="13" fill="#94a3b8">(jim turadi)</text>

  <rect x="416" y="288" width="288" height="96" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="560" y="316" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">Faqat "Saqlanmoqda..." yondi</text>
  <text x="560" y="340" text-anchor="middle" font-size="13" fill="#475569">Har indikator o'z amaliga bog'langan.</text>
  <text x="560" y="362" text-anchor="middle" font-size="13" fill="#475569">delete indikatori bosilmagani uchun</text>
  <text x="560" y="380" text-anchor="middle" font-size="13" fill="#475569">yashirin qoladi.</text>

  <text x="380" y="426" text-anchor="middle" font-size="13" fill="#475569">Xulosa: ko'p tugmali sahifada wire:target majburiy — usiz indikatorlar aralashib ketadi.</text>
</svg>
