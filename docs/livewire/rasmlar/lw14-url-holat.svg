<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>#[Url] atributi search, status, sortBy va sortDir xususiyatlarini URL query string bilan bog'laydi, shuning uchun holatni saqlab va boshqaga ulashib bo'ladi</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">#[Url] — holatni URL'da saqlash va ulashish</text>
  <text x="380" y="58" text-anchor="middle" font-size="14" fill="#475569">Xususiyat o'zgaradi -> URL yangilanadi -> havola ulashiladi</text>

  <!-- chap: komponent xususiyatlari -->
  <rect x="30" y="86" width="240" height="220" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="150" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Komponent xususiyatlari</text>
  <rect x="50" y="130" width="200" height="34" rx="6" fill="#eef2ff"/>
  <text x="60" y="151" font-size="13" fill="#4f46e5">#[Url]</text>
  <text x="118" y="151" font-size="13" fill="#1e293b">$search = 'Laravel'</text>
  <rect x="50" y="170" width="200" height="34" rx="6" fill="#eef2ff"/>
  <text x="60" y="191" font-size="13" fill="#4f46e5">#[Url]</text>
  <text x="118" y="191" font-size="13" fill="#1e293b">$status = 'published'</text>
  <rect x="50" y="210" width="200" height="34" rx="6" fill="#eef2ff"/>
  <text x="60" y="231" font-size="13" fill="#4f46e5">#[Url]</text>
  <text x="118" y="231" font-size="13" fill="#1e293b">$sortBy = 'title'</text>
  <rect x="50" y="250" width="200" height="34" rx="6" fill="#eef2ff"/>
  <text x="60" y="271" font-size="13" fill="#4f46e5">#[Url]</text>
  <text x="118" y="271" font-size="13" fill="#1e293b">$sortDir = 'asc'</text>

  <!-- strelka -->
  <line x1="270" y1="196" x2="330" y2="196" stroke="#4f46e5" stroke-width="2.5"/>
  <polygon points="330,196 320,191 320,201" fill="#4f46e5"/>
  <text x="300" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#4f46e5">bog'lanadi</text>

  <!-- o'ng: brauzer manzil satri -->
  <rect x="340" y="120" width="390" height="150" rx="10" fill="#ffffff" stroke="#fb70a9" stroke-width="2"/>
  <text x="535" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Brauzer manzil satri</text>
  <rect x="360" y="164" width="350" height="34" rx="17" fill="#f1f5f9" stroke="#c7d2fe" stroke-width="1.5"/>
  <circle cx="378" cy="181" r="6" fill="#16a34a"/>
  <text x="396" y="186" font-size="13" fill="#1e293b">/jadval</text>
  <text x="396" y="226" font-size="13" fill="#4f46e5">?search=Laravel</text>
  <text x="396" y="246" font-size="13" fill="#4f46e5">&amp;status=published&amp;sortBy=title</text>
  <text x="535" y="290" text-anchor="middle" font-size="13" fill="#475569">page raqamini WithPagination o'zi qo'shadi (?page=)</text>

  <!-- pastki: ulashish -->
  <rect x="30" y="320" width="700" height="96" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="348" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">Natijani ulashish mumkin</text>
  <text x="380" y="372" text-anchor="middle" font-size="13" fill="#475569">Havolani nusxalab do'stingizga yuborasiz — u AYNAN o'sha qidiruv, filtr va saralashni ko'radi.</text>
  <text x="380" y="394" text-anchor="middle" font-size="13" fill="#475569">F5 (yangilash) yoki "orqaga" tugmasi ham holatni saqlab qoladi. (batafsil: 19-bob)</text>
</svg>
