<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Holat snapshot bo'lib server bilan brauzer orasida borib keladi: har so'rovda holat serverga yuboriladi, server yangilab qaytaradi, shu sababli holat so'rovlar orasida saqlanib qoladi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Holat snapshot bo'lib borib-keladi</text>
  <text x="380" y="58" text-anchor="middle" font-size="14" fill="#475569">PHP so'rovdan keyin "unutadi" — shuning uchun holat har safar birga sayohat qiladi</text>

  <!-- Ikki ustun sarlavhasi -->
  <rect x="40" y="80" width="300" height="40" rx="10" fill="#4f46e5"/>
  <text x="190" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Brauzer (mijoz)</text>
  <rect x="420" y="80" width="300" height="40" rx="10" fill="#fb70a9"/>
  <text x="570" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Server (PHP / Livewire)</text>

  <!-- Hayot chiziqlari -->
  <line x1="190" y1="120" x2="190" y2="420" stroke="#c7d2fe" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="570" y1="120" x2="570" y2="420" stroke="#fbcfe8" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Saqlangan snapshot brauzerda -->
  <rect x="60" y="138" width="260" height="60" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="190" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Snapshot saqlanib turadi</text>
  <text x="190" y="182" text-anchor="middle" font-size="13" fill="#475569">{ count: 0, ism: "Oqil" }</text>

  <!-- 1: yuqoriga so'rov -->
  <rect x="36" y="220" width="40" height="24" rx="6" fill="#4f46e5"/>
  <text x="56" y="237" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <line x1="190" y1="258" x2="566" y2="258" stroke="#4f46e5" stroke-width="2.5"/>
  <polygon points="566,258 556,253 556,263" fill="#4f46e5"/>
  <text x="380" y="252" text-anchor="middle" font-size="13" fill="#4f46e5">Snapshot + action serverga yuboriladi</text>

  <!-- 2: serverda tiklanadi va o'zgaradi -->
  <rect x="420" y="278" width="300" height="74" rx="10" fill="#ffffff" stroke="#fb70a9" stroke-width="2"/>
  <text x="570" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">2. Holat tiklanadi (hydrate)</text>
  <text x="570" y="322" text-anchor="middle" font-size="13" fill="#475569">action ishlaydi: count = 1</text>
  <text x="570" y="342" text-anchor="middle" font-size="13" fill="#475569">qayta render qilinadi</text>

  <!-- 3: pastga qaytadi -->
  <rect x="36" y="372" width="40" height="24" rx="6" fill="#16a34a"/>
  <text x="56" y="389" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
  <line x1="570" y1="384" x2="194" y2="384" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="194,384 204,379 204,389" fill="#16a34a"/>
  <text x="380" y="378" text-anchor="middle" font-size="13" fill="#16a34a">Yangi snapshot { count: 1 } qaytadi</text>

  <text x="380" y="424" text-anchor="middle" font-size="13" fill="#94a3b8">Yangilangan snapshot yana brauzerda saqlanadi va keyingi so'rovda qaytib boradi.</text>
  <text x="380" y="450" text-anchor="middle" font-size="13" fill="#475569">Ana shu aylanish tufayli holat so'rovlar orasida "esda qoladi".</text>
</svg>
