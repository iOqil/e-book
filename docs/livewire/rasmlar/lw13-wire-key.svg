<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>O'rtadagi postni o'chirganda: wire:key bilan to'g'ri element olib tashlanadi, keysiz esa Livewire elementlarni tartibi bo'yicha chalkashtirib yuboradi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">wire:key nima uchun kerak</text>
  <text x="380" y="56" text-anchor="middle" font-size="14" fill="#475569">Vaziyat: o'rtadagi post (B) o'chirildi. A va C qolishi kerak.</text>

  <!-- LEFT: with wire:key -->
  <rect x="24" y="80" width="350" height="360" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="199" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">wire:key BILAN &#10003;</text>

  <text x="48" y="138" font-size="13" fill="#475569">Avval:</text>
  <rect x="48" y="148" width="130" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="113" y="173" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">A (key=1)</text>
  <rect x="48" y="194" width="130" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="113" y="219" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">B (key=2)</text>
  <rect x="48" y="240" width="130" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="113" y="265" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">C (key=3)</text>

  <!-- arrow -->
  <line x1="195" y1="214" x2="232" y2="214" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="232,214 222,209 222,219" fill="#94a3b8"/>

  <text x="246" y="138" font-size="13" fill="#475569">Keyin:</text>
  <rect x="246" y="158" width="110" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="301" y="183" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">A (key=1)</text>
  <rect x="246" y="204" width="110" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="301" y="229" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">C (key=3)</text>

  <text x="199" y="322" text-anchor="middle" font-size="13" fill="#16a34a">key=2 yo'qoldi &#8594; aniq B olib</text>
  <text x="199" y="340" text-anchor="middle" font-size="13" fill="#16a34a">tashlanadi. A va C joyida.</text>
  <text x="199" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Natija: TO'G'RI</text>
  <text x="199" y="404" text-anchor="middle" font-size="13" fill="#475569">Livewire har elementni</text>
  <text x="199" y="422" text-anchor="middle" font-size="13" fill="#475569">kaliti bo'yicha taniydi.</text>

  <!-- RIGHT: without wire:key -->
  <rect x="386" y="80" width="350" height="360" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="561" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">wire:key SIZ &#10007;</text>

  <text x="410" y="138" font-size="13" fill="#475569">Avval:</text>
  <rect x="410" y="148" width="130" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="475" y="173" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">A (1-o'rin)</text>
  <rect x="410" y="194" width="130" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="475" y="219" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">B (2-o'rin)</text>
  <rect x="410" y="240" width="130" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="475" y="265" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">C (3-o'rin)</text>

  <line x1="557" y1="214" x2="594" y2="214" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="594,214 584,209 584,219" fill="#94a3b8"/>

  <text x="608" y="138" font-size="13" fill="#475569">Keyin:</text>
  <rect x="608" y="158" width="110" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="663" y="183" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">A (1-o'rin)</text>
  <rect x="608" y="204" width="110" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="663" y="223" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">A matni +</text>
  <text x="663" y="239" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">B tugmasi?</text>

  <text x="561" y="322" text-anchor="middle" font-size="13" fill="#dc2626">Faqat "3 ta edi, 2 ta" deydi</text>
  <text x="561" y="340" text-anchor="middle" font-size="13" fill="#dc2626">&#8594; oxirgini o'chiradi, qism chalkash.</text>
  <text x="561" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Natija: CHALKASHLIK</text>
  <text x="561" y="404" text-anchor="middle" font-size="13" fill="#475569">Holat (input, ochiq/yopiq)</text>
  <text x="561" y="422" text-anchor="middle" font-size="13" fill="#475569">noto'g'ri elementga yopishadi.</text>
</svg>
