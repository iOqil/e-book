<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Url modifikatorlari taqqoslamasi: as, history va keep o'rtasidagi farq</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">#[Url] modifikatorlari: as / history / keep</text>

  <!-- as -->
  <rect x="30" y="62" width="700" height="118" rx="11" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="46" y="78" width="120" height="86" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="106" y="116" text-anchor="middle" font-size="16" font-weight="700" fill="#4f46e5">as</text>
  <text x="106" y="142" text-anchor="middle" font-size="13" fill="#475569">kalit nomi</text>
  <text x="190" y="104" font-size="14" font-weight="700" fill="#1e293b">URL kalitini qisqartiradi yoki o'zgartiradi</text>
  <rect x="190" y="118" width="240" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="310" y="138" text-anchor="middle" font-size="13" fill="#94a3b8">#[Url]  ->  ?search=noutbuk</text>
  <line x1="442" y1="134" x2="478" y2="134" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="480,134 466,128 466,140" fill="#16a34a"/>
  <rect x="486" y="118" width="232" height="32" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="602" y="138" text-anchor="middle" font-size="13" fill="#16a34a">#[Url(as: 'q')]  ->  ?q=noutbuk</text>

  <!-- history -->
  <rect x="30" y="194" width="700" height="118" rx="11" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="46" y="210" width="120" height="86" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="106" y="248" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">history</text>
  <text x="106" y="274" text-anchor="middle" font-size="13" fill="#92400e">tarix</text>
  <text x="190" y="236" font-size="14" font-weight="700" fill="#1e293b">"Orqaga" tugmasiga har qadamni qo'shadi</text>
  <text x="190" y="262" font-size="13" fill="#475569">history: false (default) -> faqat oldingi sahifaga qaytadi</text>
  <text x="190" y="284" font-size="13" fill="#475569">history: true -> har qidiruv qadamiga qaytib bo'ladi</text>
  <text x="468" y="262" font-size="14" fill="#94a3b8">noutbuk</text>
  <text x="468" y="284" font-size="14" fill="#1e293b">noutbuk pro</text>

  <!-- keep -->
  <rect x="30" y="326" width="700" height="118" rx="11" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="46" y="342" width="120" height="86" rx="8" fill="#fdf2f8" stroke="#fb70a9" stroke-width="2"/>
  <text x="106" y="380" text-anchor="middle" font-size="16" font-weight="700" fill="#be185d">keep</text>
  <text x="106" y="406" text-anchor="middle" font-size="13" fill="#be185d">saqlash</text>
  <text x="190" y="368" font-size="14" font-weight="700" fill="#1e293b">Sahifa almashganda ham parametrni ushlab turadi</text>
  <rect x="190" y="384" width="150" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="265" y="406" text-anchor="middle" font-size="13" fill="#475569">/sahifa-1?lang=uz</text>
  <line x1="346" y1="401" x2="392" y2="401" stroke="#fb70a9" stroke-width="2.5"/>
  <polygon points="394,401 380,395 380,407" fill="#fb70a9"/>
  <rect x="400" y="384" width="160" height="34" rx="6" fill="#fdf2f8" stroke="#fb70a9"/>
  <text x="480" y="406" text-anchor="middle" font-size="13" fill="#be185d">/sahifa-2?lang=uz</text>
  <text x="640" y="406" text-anchor="middle" font-size="13" fill="#be185d">saqlandi</text>
</svg>
