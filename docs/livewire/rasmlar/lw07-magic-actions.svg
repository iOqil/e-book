<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>Magic actions ro'yxati: $set xususiyatga qiymat beradi, $toggle boolean qiymatni almashtiradi, $refresh komponentni qayta render qiladi, $dispatch hodisa yuboradi, $parent ota komponent metodini chaqiradi</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Magic actions — metod yozmasdan</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#475569">$ bilan boshlanadi, to'g'ridan-to'g'ri Blade'da wire:click ichida ishlatiladi</text>

  <!-- $set -->
  <rect x="40" y="74" width="680" height="58" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="56" y="88" width="210" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="161" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#4f46e5">$set('count', 0)</text>
  <text x="288" y="100" font-size="14" font-weight="700" fill="#1e293b">Xususiyatga qiymat beradi</text>
  <text x="288" y="120" font-size="13" fill="#475569">Alohida metod yozmasdan property'ni o'rnatadi</text>

  <!-- $toggle -->
  <rect x="40" y="142" width="680" height="58" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="56" y="156" width="210" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="161" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#4f46e5">$toggle('open')</text>
  <text x="288" y="168" font-size="14" font-weight="700" fill="#1e293b">Boolean qiymatni almashtiradi</text>
  <text x="288" y="188" font-size="13" fill="#475569">true&#8596;false: ochiqni yopadi, yopiqni ochadi</text>

  <!-- $refresh -->
  <rect x="40" y="210" width="680" height="58" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="56" y="224" width="210" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="161" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#4f46e5">$refresh</text>
  <text x="288" y="236" font-size="14" font-weight="700" fill="#1e293b">Komponentni qayta render qiladi</text>
  <text x="288" y="256" font-size="13" fill="#475569">Hech narsa o'zgartirmay so'nggi holatni oladi</text>

  <!-- $dispatch -->
  <rect x="40" y="278" width="680" height="58" rx="10" fill="#ffffff" stroke="#fb70a9" stroke-width="2"/>
  <rect x="56" y="292" width="210" height="30" rx="6" fill="#fdf2f8" stroke="#fbcfe8"/>
  <text x="161" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#be185d">$dispatch('saved')</text>
  <text x="288" y="304" font-size="14" font-weight="700" fill="#1e293b">Hodisa (event) yuboradi</text>
  <text x="288" y="324" font-size="13" fill="#475569">Boshqa komponent yoki brauzer eshitadi (18-bob)</text>

  <!-- $parent -->
  <rect x="40" y="346" width="680" height="58" rx="10" fill="#ffffff" stroke="#fb70a9" stroke-width="2"/>
  <rect x="56" y="360" width="210" height="30" rx="6" fill="#fdf2f8" stroke="#fbcfe8"/>
  <text x="161" y="380" text-anchor="middle" font-size="14" font-weight="700" fill="#be185d">$parent.delete(id)</text>
  <text x="288" y="372" font-size="14" font-weight="700" fill="#1e293b">Ota komponent metodini chaqiradi</text>
  <text x="288" y="392" font-size="13" fill="#475569">Bola komponentdan otaga murojaat (17-bob)</text>
</svg>
