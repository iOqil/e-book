<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Segoe UI, system-ui, sans-serif">
  <title>wire:model orqali input va komponent xususiyatining ikki tomonlama (egizaklar) bog'lanishi: biri o'zgarsa, ikkinchisi ham o'zgaradi</title>
  <rect x="0" y="0" width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">wire:model — ikki tomonlama bog'lanish</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">Input va xususiyat — egizaklar: biri o'zgarsa, ikkinchisi ham</text>

  <!-- Chap: brauzer input -->
  <rect x="50" y="100" width="270" height="200" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/>
  <rect x="50" y="100" width="270" height="42" rx="14" fill="#4f46e5"/>
  <text x="185" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Brauzer: input</text>

  <rect x="78" y="172" width="214" height="44" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="92" y="200" font-size="15" fill="#1e293b">Oqil</text>
  <rect x="262" y="180" width="2" height="28" fill="#4f46e5"/>

  <text x="185" y="252" text-anchor="middle" font-size="13" fill="#475569">Foydalanuvchi shu yerga</text>
  <text x="185" y="272" text-anchor="middle" font-size="13" fill="#475569">matn yozadi</text>

  <!-- O'ng: server xususiyat -->
  <rect x="440" y="100" width="270" height="200" rx="14" fill="#ffffff" stroke="#fb70a9" stroke-width="2.5"/>
  <rect x="440" y="100" width="270" height="42" rx="14" fill="#fb70a9"/>
  <text x="575" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Server: xususiyat</text>

  <rect x="468" y="172" width="214" height="44" rx="8" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1.5"/>
  <text x="482" y="200" font-size="15" fill="#1e293b">public $ism = "Oqil"</text>

  <text x="575" y="252" text-anchor="middle" font-size="13" fill="#475569">PHP komponent</text>
  <text x="575" y="272" text-anchor="middle" font-size="13" fill="#475569">xususiyati (xotira)</text>

  <!-- O'rtadagi ikki strelka -->
  <line x1="328" y1="172" x2="432" y2="172" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="432,172 421,167 421,177" fill="#16a34a"/>
  <text x="380" y="164" text-anchor="middle" font-size="13" fill="#16a34a">input &#8594; xususiyat</text>

  <line x1="432" y1="216" x2="328" y2="216" stroke="#4f46e5" stroke-width="2.5"/>
  <polygon points="328,216 339,211 339,221" fill="#4f46e5"/>
  <text x="380" y="234" text-anchor="middle" font-size="13" fill="#4f46e5">xususiyat &#8594; input</text>

  <!-- wire:model yorlig'i -->
  <rect x="300" y="118" width="160" height="30" rx="8" fill="#1e293b"/>
  <text x="380" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">wire:model="ism"</text>

  <text x="380" y="360" text-anchor="middle" font-size="14" fill="#475569">Bir tomon o'zgarsa, Livewire ikkinchi tomonni ham o'zi yangilaydi</text>
  <text x="380" y="384" text-anchor="middle" font-size="13" fill="#94a3b8">Siz qo'lda "o'qib-yozish" kodi yozmaysiz — bog'lanish avtomatik</text>
</svg>
