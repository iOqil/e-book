<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" font-family="Segoe UI, system-ui, sans-serif">
  <title>Tugma bosishdan DOM yangilanishigacha bo'lgan to'liq sikl</title>
  <rect x="0" y="0" width="760" height="500" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Tugma bosilganda nima bo'ladi?</text>
  <text x="380" y="58" text-anchor="middle" font-size="14" fill="#475569">+ tugmasini bosishdan to ekrandagi raqam yangilanishigacha</text>

  <!-- Two columns: BRAUZER (left) and SERVER (right) -->
  <rect x="30" y="80" width="320" height="380" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="190" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">BRAUZER (mijoz)</text>

  <rect x="410" y="80" width="320" height="380" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="570" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">SERVER (PHP)</text>

  <!-- Step 1 -->
  <rect x="56" y="124" width="268" height="50" rx="9" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="72" y="145" font-size="14" font-weight="700" fill="#1e293b">1. Tugma bosildi</text>
  <text x="72" y="164" font-size="13" fill="#475569">wire:click="increment" ishga tushdi</text>

  <!-- Step 2 -->
  <rect x="56" y="196" width="268" height="50" rx="9" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="72" y="217" font-size="14" font-weight="700" fill="#1e293b">2. AJAX so'rovi yuboriladi</text>
  <text x="72" y="236" font-size="13" fill="#475569">"increment'ni bajar, count=0 edi"</text>

  <!-- Step 3 server -->
  <rect x="436" y="196" width="268" height="50" rx="9" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="452" y="217" font-size="14" font-weight="700" fill="#1e293b">3. Action bajariladi</text>
  <text x="452" y="236" font-size="13" fill="#475569">$this-&gt;count++  =&gt;  count = 1</text>

  <!-- Step 4 server -->
  <rect x="436" y="268" width="268" height="50" rx="9" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="452" y="289" font-size="14" font-weight="700" fill="#1e293b">4. Qayta render</text>
  <text x="452" y="308" font-size="13" fill="#475569">Blade yangi qiymat bilan chiziladi</text>

  <!-- Step 5 browser -->
  <rect x="56" y="340" width="268" height="50" rx="9" fill="#fef9c3" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="72" y="361" font-size="14" font-weight="700" fill="#1e293b">5. Diff: farq topiladi</text>
  <text x="72" y="380" font-size="13" fill="#475569">Faqat "0" -&gt; "1" o'zgargan</text>

  <!-- Step 6 browser -->
  <rect x="56" y="404" width="268" height="44" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="72" y="424" font-size="14" font-weight="700" fill="#1e293b">6. DOM yangilanadi</text>
  <text x="72" y="441" font-size="13" fill="#16a34a">Faqat raqam — reload YO'Q!</text>

  <!-- arrow 2 -> 3 (browser to server) -->
  <line x1="324" y1="221" x2="436" y2="221" stroke="#475569" stroke-width="2" marker-end="url(#arrK)"/>
  <text x="380" y="214" text-anchor="middle" font-size="13" fill="#475569">so'rov</text>

  <!-- arrow 4 -> 5 (server back to browser) -->
  <line x1="436" y1="300" x2="324" y2="355" stroke="#475569" stroke-width="2" marker-end="url(#arrK)"/>
  <text x="380" y="320" text-anchor="middle" font-size="13" fill="#475569">javob (HTML)</text>

  <!-- internal arrows -->
  <line x1="190" y1="174" x2="190" y2="194" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrI)"/>
  <line x1="570" y1="246" x2="570" y2="266" stroke="#16a34a" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="190" y1="390" x2="190" y2="402" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrY)"/>

  <text x="380" y="484" text-anchor="middle" font-size="13" fill="#94a3b8">Mantiq serverda yashaydi — siz JavaScript yozmaysiz.</text>

  <defs>
    <marker id="arrK" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#475569"/></marker>
    <marker id="arrI" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4f46e5"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker>
    <marker id="arrY" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f59e0b"/></marker>
  </defs>
</svg>
