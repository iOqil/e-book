<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>An'anaviy MPA, SPA va Livewire yondashuvlarining til soni, murakkablik va foydalanuvchi tajribasi bo'yicha taqqoslashi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Uch yondashuv: MPA vs SPA vs Livewire</text>

  <!-- MPA ustun -->
  <rect x="24" y="60" width="226" height="380" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="24" y="60" width="226" height="44" rx="12" fill="#94a3b8"/>
  <text x="137" y="89" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">An'anaviy (MPA)</text>

  <text x="44" y="138" font-size="14" font-weight="700" fill="#475569">Tillar:</text>
  <text x="44" y="160" font-size="14" fill="#1e293b">PHP (+ ozgina HTML)</text>
  <rect x="44" y="172" width="60" height="20" rx="5" fill="#16a34a"/>
  <text x="74" y="186" text-anchor="middle" font-size="13" fill="#ffffff">1 til</text>

  <text x="44" y="226" font-size="14" font-weight="700" fill="#475569">Murakkablik:</text>
  <text x="44" y="248" font-size="13" fill="#1e293b">Past — oson boshlanadi</text>
  <rect x="44" y="260" width="60" height="14" rx="5" fill="#16a34a"/>
  <rect x="104" y="260" width="120" height="14" rx="5" fill="#e2e8f0"/>

  <text x="44" y="314" font-size="14" font-weight="700" fill="#475569">Tajriba:</text>
  <text x="44" y="336" font-size="13" fill="#dc2626">Sahifa har bosishda</text>
  <text x="44" y="354" font-size="13" fill="#dc2626">to'liq qayta yuklanadi</text>
  <text x="44" y="378" font-size="13" fill="#475569">"Sakrab" turadi, sekin</text>
  <rect x="44" y="392" width="40" height="14" rx="5" fill="#dc2626"/>
  <rect x="84" y="392" width="140" height="14" rx="5" fill="#e2e8f0"/>

  <!-- SPA ustun -->
  <rect x="267" y="60" width="226" height="380" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <rect x="267" y="60" width="226" height="44" rx="12" fill="#f59e0b"/>
  <text x="380" y="89" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">SPA (React/Vue)</text>

  <text x="287" y="138" font-size="14" font-weight="700" fill="#475569">Tillar:</text>
  <text x="287" y="160" font-size="14" fill="#1e293b">PHP + JavaScript</text>
  <rect x="287" y="172" width="84" height="20" rx="5" fill="#dc2626"/>
  <text x="329" y="186" text-anchor="middle" font-size="13" fill="#ffffff">2 til + API</text>

  <text x="287" y="226" font-size="14" font-weight="700" fill="#475569">Murakkablik:</text>
  <text x="287" y="248" font-size="13" fill="#1e293b">Yuqori — API, build, sozlash</text>
  <rect x="287" y="260" width="180" height="14" rx="5" fill="#dc2626"/>

  <text x="287" y="314" font-size="14" font-weight="700" fill="#475569">Tajriba:</text>
  <text x="287" y="336" font-size="13" fill="#16a34a">Juda jonli, silliq,</text>
  <text x="287" y="354" font-size="13" fill="#16a34a">sahifa yangilanmaydi</text>
  <text x="287" y="378" font-size="13" fill="#475569">Eng kuchli tajriba</text>
  <rect x="287" y="392" width="180" height="14" rx="5" fill="#16a34a"/>

  <!-- Livewire ustun -->
  <rect x="510" y="60" width="226" height="380" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="3"/>
  <rect x="510" y="60" width="226" height="44" rx="12" fill="#4f46e5"/>
  <text x="623" y="89" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Livewire</text>

  <text x="530" y="138" font-size="14" font-weight="700" fill="#475569">Tillar:</text>
  <text x="530" y="160" font-size="14" fill="#1e293b">Asosan PHP (+Blade)</text>
  <rect x="530" y="172" width="60" height="20" rx="5" fill="#16a34a"/>
  <text x="560" y="186" text-anchor="middle" font-size="13" fill="#ffffff">1 til</text>

  <text x="530" y="226" font-size="14" font-weight="700" fill="#475569">Murakkablik:</text>
  <text x="530" y="248" font-size="13" fill="#1e293b">O'rta-past — API yo'q</text>
  <rect x="530" y="260" width="90" height="14" rx="5" fill="#f59e0b"/>
  <rect x="620" y="260" width="96" height="14" rx="5" fill="#e2e8f0"/>

  <text x="530" y="314" font-size="14" font-weight="700" fill="#475569">Tajriba:</text>
  <text x="530" y="336" font-size="13" fill="#16a34a">Jonli — sahifa</text>
  <text x="530" y="354" font-size="13" fill="#16a34a">yangilanmaydi</text>
  <text x="530" y="378" font-size="13" fill="#475569">SPA'ga yaqin, oson</text>
  <rect x="530" y="392" width="150" height="14" rx="5" fill="#16a34a"/>

  <text x="380" y="460" text-anchor="middle" font-size="13" fill="#94a3b8">Livewire — bir til, kam murakkablik, jonli tajriba: o'rtacha "oltin o'rtaliq"</text>
</svg>
