<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Event yo'nalishlari: default barcha tinglovchilarga, ->to(Class) muayyan komponentga, ->self() faqat o'ziga, va brauzer/Alpine window orqali eshitishi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Event qayerga boradi? To'rt yo'nalish</text>

  <!-- 1: default barchaga -->
  <rect x="30" y="58" width="700" height="92" rx="11" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="46" y="74" width="230" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="161" y="94" text-anchor="middle" font-size="13" fill="#4f46e5">dispatch('x')</text>
  <text x="161" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Standart: BARCHAGA</text>
  <!-- ko'p qutilar -->
  <rect x="320" y="74" width="80" height="28" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="360" y="93" text-anchor="middle" font-size="13" fill="#16a34a">A</text>
  <rect x="412" y="74" width="80" height="28" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="452" y="93" text-anchor="middle" font-size="13" fill="#16a34a">B</text>
  <rect x="504" y="74" width="80" height="28" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="544" y="93" text-anchor="middle" font-size="13" fill="#16a34a">C</text>
  <rect x="596" y="74" width="118" height="28" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="655" y="93" text-anchor="middle" font-size="13" fill="#16a34a">... hammasi</text>
  <text x="517" y="138" text-anchor="middle" font-size="13" fill="#475569">Sahifadagi har bir #[On('x')] tinglovchi eshitadi</text>

  <!-- 2: ->to(Class) -->
  <rect x="30" y="162" width="700" height="92" rx="11" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="46" y="178" width="230" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="161" y="198" text-anchor="middle" font-size="13" fill="#4f46e5">dispatch('x')-&gt;to(Dashboard::class)</text>
  <text x="161" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">MUAYYAN komponentga</text>
  <line x1="290" y1="200" x2="370" y2="200" stroke="#4f46e5" stroke-width="2.5"/>
  <polygon points="372,200 358,194 358,206" fill="#4f46e5"/>
  <rect x="376" y="180" width="150" height="40" rx="7" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="451" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#4f46e5">Dashboard</text>
  <rect x="540" y="180" width="80" height="40" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="580" y="205" text-anchor="middle" font-size="13" fill="#94a3b8">boshqa</text>
  <rect x="632" y="180" width="82" height="40" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="673" y="205" text-anchor="middle" font-size="13" fill="#94a3b8">eshitmaydi</text>

  <!-- 3: ->self() -->
  <rect x="30" y="266" width="700" height="92" rx="11" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="46" y="282" width="230" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="161" y="302" text-anchor="middle" font-size="13" fill="#4f46e5">dispatch('x')-&gt;self()</text>
  <text x="161" y="336" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">FAQAT o'ziga</text>
  <rect x="376" y="282" width="170" height="58" rx="9" fill="#fdf2f8" stroke="#fb70a9" stroke-width="2.5"/>
  <text x="461" y="306" text-anchor="middle" font-size="14" font-weight="700" fill="#be185d">Shu komponent</text>
  <text x="461" y="326" text-anchor="middle" font-size="13" fill="#be185d">o'ziga signal beradi</text>
  <path d="M 556 292 a 22 22 0 1 1 0 38" fill="none" stroke="#fb70a9" stroke-width="2.5"/>
  <polygon points="556,330 567,322 569,335" fill="#fb70a9"/>

  <!-- 4: brauzer / Alpine -->
  <rect x="30" y="370" width="700" height="78" rx="11" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="46" y="386" width="230" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="161" y="406" text-anchor="middle" font-size="13" fill="#4f46e5">dispatch('open-modal')</text>
  <text x="161" y="436" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">BRAUZER ham eshitadi</text>
  <line x1="290" y1="404" x2="368" y2="404" stroke="#f59e0b" stroke-width="2.5"/>
  <polygon points="370,404 356,398 356,410" fill="#f59e0b"/>
  <rect x="374" y="384" width="172" height="40" rx="7" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="460" y="409" text-anchor="middle" font-size="13" fill="#92400e">Alpine: x-on:...window</text>
  <rect x="560" y="384" width="154" height="40" rx="7" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="637" y="409" text-anchor="middle" font-size="13" fill="#92400e">JS: Livewire.on(...)</text>
</svg>
