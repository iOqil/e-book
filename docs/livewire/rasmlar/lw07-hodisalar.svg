<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Livewire hodisalar jadvali: wire:click tugma bosish, wire:submit forma yuborish, wire:keydown klavisha, wire:mouseenter sichqoncha, wire:change tanlov o'zgardi, wire:blur fokus ketdi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Asosiy wire: hodisalari</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#475569">Foydalanuvchining har xil harakatiga server metodi bilan javob berish</text>

  <!-- Jadval sarlavhasi -->
  <rect x="40" y="72" width="200" height="34" rx="8" fill="#4f46e5"/>
  <text x="140" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Hodisa</text>
  <rect x="248" y="72" width="280" height="34" rx="8" fill="#4f46e5"/>
  <text x="388" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Qachon ishlaydi</text>
  <rect x="536" y="72" width="184" height="34" rx="8" fill="#4f46e5"/>
  <text x="628" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Misol</text>

  <!-- Qator 1: click -->
  <rect x="40" y="114" width="680" height="50" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="56" y="144" font-size="14" font-weight="700" fill="#4f46e5">wire:click</text>
  <text x="262" y="144" font-size="13" fill="#475569">Element bosilganda</text>
  <text x="550" y="144" font-size="13" fill="#1e293b">&lt;button&gt; "save"</text>

  <!-- Qator 2: submit -->
  <rect x="40" y="170" width="680" height="50" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="56" y="200" font-size="14" font-weight="700" fill="#4f46e5">wire:submit</text>
  <text x="262" y="194" font-size="13" fill="#475569">Forma yuborilganda</text>
  <text x="262" y="211" font-size="13" fill="#16a34a">(avtomatik preventDefault)</text>
  <text x="550" y="200" font-size="13" fill="#1e293b">&lt;form&gt; "save"</text>

  <!-- Qator 3: keydown -->
  <rect x="40" y="226" width="680" height="50" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="56" y="256" font-size="14" font-weight="700" fill="#4f46e5">wire:keydown.enter</text>
  <text x="262" y="256" font-size="13" fill="#475569">Maydonda Enter bosilganda</text>
  <text x="550" y="256" font-size="13" fill="#1e293b">&lt;input&gt; "qidir"</text>

  <!-- Qator 4: mouseenter -->
  <rect x="40" y="282" width="680" height="50" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="56" y="312" font-size="14" font-weight="700" fill="#4f46e5">wire:mouseenter</text>
  <text x="262" y="312" font-size="13" fill="#475569">Sichqoncha ustiga kelganda</text>
  <text x="550" y="312" font-size="13" fill="#1e293b">&lt;div&gt; "korsat"</text>

  <!-- Qator 5: change -->
  <rect x="40" y="338" width="680" height="50" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="56" y="368" font-size="14" font-weight="700" fill="#4f46e5">wire:change</text>
  <text x="262" y="368" font-size="13" fill="#475569">Tanlov / qiymat o'zgarganda</text>
  <text x="550" y="368" font-size="13" fill="#1e293b">&lt;select&gt; "filtrla"</text>

  <!-- Qator 6: blur -->
  <rect x="40" y="394" width="680" height="50" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="56" y="424" font-size="14" font-weight="700" fill="#4f46e5">wire:blur</text>
  <text x="262" y="424" font-size="13" fill="#475569">Element fokusdan chiqqanda</text>
  <text x="550" y="424" font-size="13" fill="#1e293b">&lt;input&gt; "tekshir"</text>
</svg>
