<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>cURL so'rov hayot tsikli: curl_init tutqich yaratadi, curl_setopt sozlaydi, curl_exec so'rovni yuboradi va javobni qaytaradi, curl_getinfo/curl_errno natijani tekshiradi, curl_close resursni bo'shatadi</title>

  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#1e293b">cURL so'rovining hayot tsikli (5 bosqich)</text>

  <defs>
    <marker id="cl-ar" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#475569"/>
    </marker>
    <marker id="cl-down" markerWidth="12" markerHeight="12" refX="4" refY="9" orient="auto">
      <path d="M0,0 L8,0 L4,9 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- 1. curl_init -->
  <rect x="28" y="70" width="150" height="96" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="28" y="70" width="150" height="30" rx="10" fill="#2563eb"/>
  <rect x="28" y="86" width="150" height="14" fill="#2563eb"/>
  <text x="103" y="91" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">1. INIT</text>
  <text x="103" y="122" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#1e293b">curl_init()</text>
  <text x="103" y="142" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">tutqich (handle)</text>
  <text x="103" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">yaratiladi</text>

  <line x1="180" y1="118" x2="246" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#cl-ar)"/>

  <!-- 2. curl_setopt -->
  <rect x="248" y="70" width="150" height="96" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="248" y="70" width="150" height="30" rx="10" fill="#2563eb"/>
  <rect x="248" y="86" width="150" height="14" fill="#2563eb"/>
  <text x="323" y="91" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">2. SOZLASH</text>
  <text x="323" y="122" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="11" fill="#1e293b">curl_setopt_array()</text>
  <text x="323" y="142" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">URL, metod, sarlavha,</text>
  <text x="323" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">timeout, SSL...</text>

  <line x1="400" y1="118" x2="466" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#cl-ar)"/>

  <!-- 3. curl_exec -->
  <rect x="468" y="70" width="156" height="96" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <rect x="468" y="70" width="156" height="30" rx="10" fill="#f59e0b"/>
  <rect x="468" y="86" width="156" height="14" fill="#f59e0b"/>
  <text x="546" y="91" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">3. YUBORISH</text>
  <text x="546" y="122" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#1e293b">curl_exec()</text>
  <text x="546" y="142" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">so'rov serverga ketadi,</text>
  <text x="546" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">javob qaytadi</text>

  <!-- exec -> getinfo (pastga) -->
  <line x1="546" y1="166" x2="546" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#cl-down)"/>

  <!-- 4. tekshirish -->
  <rect x="468" y="218" width="156" height="120" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="468" y="218" width="156" height="30" rx="10" fill="#16a34a"/>
  <rect x="468" y="234" width="156" height="14" fill="#16a34a"/>
  <text x="546" y="239" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">4. TEKSHIRISH</text>
  <text x="546" y="268" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#1e293b">curl_errno() / error()</text>
  <text x="546" y="285" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#1e293b">curl_getinfo()</text>
  <line x1="482" y1="296" x2="610" y2="296" stroke="#e2e8f0" stroke-width="1"/>
  <text x="546" y="314" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#dc2626">false? -> tarmoq xatosi</text>
  <text x="546" y="330" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#475569">status >= 400? -> HTTP xatosi</text>

  <!-- getinfo -> close (chapga) -->
  <line x1="466" y1="278" x2="402" y2="278" stroke="#475569" stroke-width="2" marker-end="url(#cl-ar)"/>

  <!-- 5. close -->
  <rect x="248" y="230" width="150" height="96" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <rect x="248" y="230" width="150" height="30" rx="10" fill="#64748b"/>
  <rect x="248" y="246" width="150" height="14" fill="#64748b"/>
  <text x="323" y="251" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">5. YOPISH</text>
  <text x="323" y="282" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#1e293b">curl_close()</text>
  <text x="323" y="302" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">tutqich yopiladi,</text>
  <text x="323" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">resurs bo'shaydi</text>

  <!-- pastki eslatma -->
  <rect x="30" y="360" width="660" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="360" y="382" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#1e293b">Eng muhim qoida: ikki xil xatoni ajrating</text>
  <text x="360" y="401" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">avval curl_exec() === false (transport), keyin status kod >= 400 (HTTP) — bular alohida holatlar</text>
</svg>
