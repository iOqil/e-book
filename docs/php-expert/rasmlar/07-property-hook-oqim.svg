<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>Property hook oqimi: tashqi kod $obj->property ni o'qiganda get hook ishlaydi (qaytaradi), $obj->property = $value yozilganda set hook $value parametrini oladi, validatsiya/normalizatsiya qiladi va backing-field ($this->property) ga yozadi; virtual propertyda backing-field bo'lmaydi, faqat get hisoblab qaytaradi</title>

  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>
  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#1e293b">Property hook oqimi: get va set</text>

  <defs>
    <marker id="ph-ar" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#475569"/>
    </marker>
    <marker id="ph-arb" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#2563eb"/>
    </marker>
    <marker id="ph-arr" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Tashqi kod -->
  <rect x="30" y="70" width="150" height="290" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="30" y="70" width="150" height="30" rx="10" fill="#7c3aed"/>
  <rect x="30" y="86" width="150" height="14" fill="#7c3aed"/>
  <text x="105" y="91" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Tashqi kod</text>

  <text x="45" y="135" font-family="Consolas, monospace" font-size="11.5" fill="#16a34a">echo $u-&gt;email;</text>
  <text x="45" y="155" font-family="Segoe UI, sans-serif" font-size="10" fill="#94a3b8">(o'qish)</text>

  <text x="45" y="245" font-family="Consolas, monospace" font-size="11.5" fill="#2563eb">$u-&gt;email =</text>
  <text x="45" y="262" font-family="Consolas, monospace" font-size="11.5" fill="#2563eb">  ' X@Y.UZ ';</text>
  <text x="45" y="282" font-family="Segoe UI, sans-serif" font-size="10" fill="#94a3b8">(yozish)</text>

  <!-- GET hook -->
  <rect x="250" y="92" width="210" height="74" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="355" y="114" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#15803d">get hook</text>
  <text x="265" y="135" font-family="Consolas, monospace" font-size="11" fill="#1e293b">get =&gt; ...</text>
  <text x="265" y="153" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">qiymatni hisoblab qaytaradi</text>

  <!-- SET hook -->
  <rect x="250" y="210" width="210" height="100" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="355" y="232" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">set hook ($value)</text>
  <text x="265" y="253" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">1. validatsiya (@ bormi?)</text>
  <text x="265" y="271" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">2. normalizatsiya (trim/lower)</text>
  <text x="265" y="289" font-family="Consolas, monospace" font-size="10.5" fill="#1e293b">3. $this-&gt;email = $value;</text>

  <!-- Backing field -->
  <rect x="540" y="150" width="150" height="92" rx="9" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="615" y="174" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="bold" fill="#b45309">Backing field</text>
  <text x="615" y="196" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#1e293b">$this-&gt;email</text>
  <text x="615" y="216" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">haqiqiy saqlangan</text>
  <text x="615" y="231" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#16a34a">"x@y.uz"</text>

  <!-- O'qish o'qi: tashqi -> get -> tashqi -->
  <line x1="180" y1="128" x2="248" y2="128" stroke="#16a34a" stroke-width="2" marker-end="url(#ph-arb)"/>
  <line x1="540" y1="178" x2="462" y2="148" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ph-arb)"/>
  <text x="500" y="138" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#16a34a">o'qiydi</text>

  <!-- Yozish o'qi: tashqi -> set -> backing -->
  <line x1="180" y1="258" x2="248" y2="258" stroke="#2563eb" stroke-width="2" marker-end="url(#ph-arb)"/>
  <line x1="460" y1="250" x2="538" y2="210" stroke="#2563eb" stroke-width="2" marker-end="url(#ph-arb)"/>

  <!-- Virtual property panel -->
  <rect x="30" y="376" width="660" height="42" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="394" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="bold" fill="#7c3aed">VIRTUAL property:</text>
  <text x="190" y="394" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">backing-field YO'Q. Faqat</text>
  <text x="378" y="394" font-family="Consolas, monospace" font-size="11" fill="#16a34a">get</text>
  <text x="408" y="394" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">hisoblab qaytaradi (masalan $fullName, $domen).</text>
  <text x="48" y="411" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#dc2626">set yo'q -&gt; unga yozish Error.</text>
</svg>
