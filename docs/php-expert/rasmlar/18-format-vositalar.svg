<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>Fayl formati va mos PHP vositasi xaritasi: CSV uchun fgetcsv/fputcsv (yadro), Excel .xlsx uchun PhpSpreadsheet, PDF uchun dompdf/mPDF, rasm uchun GD/Imagick — har biriga moslik strelka bilan</title>

  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Qaysi formatga qaysi vosita?</text>
  <text x="360" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Format &#8594; tanlangan kutubxona &#8594; eslatma</text>

  <!-- ustun sarlavhalari -->
  <text x="120" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#64748b">FORMAT</text>
  <text x="370" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#64748b">VOSITA</text>
  <text x="620" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#64748b">ESLATMA</text>

  <!-- 1. CSV -->
  <rect x="40" y="104" width="160" height="62" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="120" y="130" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#14532d">CSV</text>
  <text x="120" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">jadval, eksport/import</text>
  <line x1="200" y1="135" x2="288" y2="135" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)"/>
  <rect x="290" y="104" width="160" height="62" rx="9" fill="#16a34a"/>
  <text x="370" y="130" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#ffffff">fgetcsv / fputcsv</text>
  <text x="370" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#dcfce7">YADRO &#8212; paket kerakmas</text>
  <text x="540" y="131" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">UTF-8 BOM + oqim:</text>
  <text x="540" y="148" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">millionlab qator OK</text>

  <!-- 2. Excel -->
  <rect x="40" y="180" width="160" height="62" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="206" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e3a8a">Excel .xlsx</text>
  <text x="120" y="226" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">stil, formula, varaq</text>
  <line x1="200" y1="211" x2="288" y2="211" stroke="#2563eb" stroke-width="2.5" marker-end="url(#b)"/>
  <rect x="290" y="180" width="160" height="62" rx="9" fill="#2563eb"/>
  <text x="370" y="204" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#ffffff">PhpSpreadsheet</text>
  <text x="370" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#dbeafe">composer require</text>
  <text x="540" y="200" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">xotira ogir &#8594;</text>
  <text x="540" y="216" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">juda katta uchun</text>
  <text x="540" y="232" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#dc2626">box/spout yoki CSV</text>

  <!-- 3. PDF -->
  <rect x="40" y="256" width="160" height="62" rx="9" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="120" y="282" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#991b1b">PDF</text>
  <text x="120" y="302" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">invoice, hisobot</text>
  <line x1="200" y1="287" x2="288" y2="287" stroke="#dc2626" stroke-width="2.5" marker-end="url(#r)"/>
  <rect x="290" y="256" width="160" height="62" rx="9" fill="#dc2626"/>
  <text x="370" y="280" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#ffffff">dompdf / mPDF</text>
  <text x="370" y="300" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#fee2e2">HTML &#8594; PDF</text>
  <text x="540" y="280" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">o'zbekcha uchun</text>
  <text x="540" y="296" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">UTF-8 shrift</text>
  <text x="540" y="312" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">(DejaVu Sans)</text>

  <!-- 4. Rasm -->
  <rect x="40" y="332" width="160" height="62" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="120" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#5b21b6">Rasm (JPG/PNG)</text>
  <text x="120" y="378" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">thumbnail, WEBP</text>
  <line x1="200" y1="363" x2="288" y2="363" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#p)"/>
  <rect x="290" y="332" width="160" height="62" rx="9" fill="#7c3aed"/>
  <text x="370" y="356" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#ffffff">GD / Imagick</text>
  <text x="370" y="376" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#ede9fe">ext-gd (built-in)</text>
  <text x="540" y="356" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">resize, format,</text>
  <text x="540" y="372" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">EXIF tozalash</text>

  <!-- pastki band -->
  <rect x="40" y="406" width="640" height="26" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="424" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#92400e">Saqlash joyi (local/bulut) dan ALOHIDA: barchasini Flysystem disk ga yozasiz (keyingi diagrammaga qarang)</text>

  <defs>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
</svg>
