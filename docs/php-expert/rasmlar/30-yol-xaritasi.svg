<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>0 dan PHP expertgacha yo'l xaritasi: besh to'lqin (Wave) — REST/auth asoslari (01-04), zamonaviy PHP tip tizimi (05-10), framework internals (11-16), I/O va sifat-muhandislik (17-24), va senior arxitektura (25-29) — barchasi yakuniy 30-kapstonga olib keladi.</title>

  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>
  <text x="360" y="28" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#1e293b">0 &#8594; PHP expert: besh to'lqin, bitta kapston</text>

  <defs>
    <marker id="flow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Boshlanish nuqtasi -->
  <circle cx="56" cy="220" r="30" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.4"/>
  <text x="56" y="216" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#92400e">0</text>
  <text x="56" y="232" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#b45309">asoslar</text>

  <!-- Wave 1 -->
  <rect x="104" y="60" width="132" height="100" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="82" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">Wave 1 (01-04)</text>
  <text x="170" y="102" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#3b82f6">REST API, HTTP</text>
  <text x="170" y="117" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#3b82f6">klient, RBAC, JWT</text>
  <text x="170" y="140" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748b">"so'rovga javob</text>
  <text x="170" y="152" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748b">bera olaman"</text>

  <!-- Wave 2 -->
  <rect x="256" y="60" width="132" height="100" rx="11" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="322" y="82" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#5b21b6">Wave 2 (05-10)</text>
  <text x="322" y="102" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#7c3aed">tip tizimi, VO,</text>
  <text x="322" y="117" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#7c3aed">hooks, reflection</text>
  <text x="322" y="140" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748b">"PHP 8.4 ni</text>
  <text x="322" y="152" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748b">chuqur bilaman"</text>

  <!-- Wave 3 -->
  <rect x="408" y="60" width="132" height="100" rx="11" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="474" y="82" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#166534">Wave 3 (11-16)</text>
  <text x="474" y="102" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#16a34a">PSR-7/15, DI,</text>
  <text x="474" y="117" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#16a34a">routing, mini-fw</text>
  <text x="474" y="140" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748b">"framework</text>
  <text x="474" y="152" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748b">ichini bilaman"</text>

  <!-- Wave 4 -->
  <rect x="560" y="60" width="132" height="100" rx="11" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="626" y="82" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">Wave 4 (17-24)</text>
  <text x="626" y="102" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#dc2626">I/O, SOLID, GoF,</text>
  <text x="626" y="117" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#dc2626">test, static an.</text>
  <text x="626" y="140" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748b">"sifatni mashina</text>
  <text x="626" y="152" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748b">majburlaydi"</text>

  <!-- Wave 5 -->
  <rect x="256" y="244" width="284" height="92" rx="11" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="398" y="266" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#155e75">Wave 5 (25-29) — senior arxitektura</text>
  <text x="398" y="288" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#0e7490">hexagonal, DDD, Redis kesh,</text>
  <text x="398" y="303" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#0e7490">Messenger navbat, observability + deploy</text>
  <text x="398" y="324" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748b">"production-grade xizmat qura olaman"</text>

  <!-- Kapston -->
  <rect x="556" y="240" width="136" height="100" rx="13" fill="#1e293b" stroke="#7c3aed" stroke-width="3"/>
  <text x="624" y="272" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">30 — KAPSTON</text>
  <text x="624" y="294" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#c4b5fd">hamma bobni</text>
  <text x="624" y="308" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#c4b5fd">bitta xizmatga</text>
  <text x="624" y="326" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#a5f3fc">portfolio isboti</text>

  <!-- Oqlar: 0 -> Wave1 -> ... -->
  <line x1="86" y1="210" x2="102" y2="150" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#flow)"/>
  <line x1="236" y1="110" x2="254" y2="110" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#flow)"/>
  <line x1="388" y1="110" x2="406" y2="110" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#flow)"/>
  <line x1="540" y1="110" x2="558" y2="110" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#flow)"/>
  <!-- Wave4 -> Wave5 -->
  <line x1="600" y1="162" x2="470" y2="242" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#flow)"/>
  <!-- Wave5 -> Kapston -->
  <line x1="540" y1="290" x2="554" y2="290" stroke="#7c3aed" stroke-width="2.6" marker-end="url(#flow)"/>

  <!-- Keyingi qadamlar banneri -->
  <rect x="28" y="356" width="664" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="377" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="bold" fill="#1e293b">Kapstondan keyin:</text>
  <text x="44" y="396" font-family="Segoe UI, sans-serif" font-size="10" fill="#475569">real loyiha qurish &#183; open-source hissa &#183; Laravel/Symfony chuqur &#183; system-design intervyu</text>
  <text x="44" y="411" font-family="Segoe UI, sans-serif" font-size="10" fill="#475569">&#183; git-github bilan portfolio &#183; kuzatuv (OpenTelemetry/Sentry) &#183; jamoa kod-review intizomi</text>
</svg>
