<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <title>SOLID 5 prinsipi xaritasi — har harf, ta'rifi va asosiy vositasi</title>
  <rect width="720" height="440" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">SOLID — 5 prinsip xaritasi</text>
  <text x="360" y="56" text-anchor="middle" font-size="13" fill="#475569">Maqsad: o'zgarishga chidamli, test qilinadigan, kengaytiriladigan kod</text>

  <!-- S -->
  <g>
    <rect x="30" y="80" width="660" height="60" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="68" cy="110" r="22" fill="#2563eb"/>
    <text x="68" y="117" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">S</text>
    <text x="108" y="104" font-size="14" font-weight="700" fill="#0f172a">Single Responsibility — bitta o'zgarish sababi</text>
    <text x="108" y="126" font-size="12" fill="#475569">God-class ni vazifalarga ajrat (domen / taqdimot / saqlash)</text>
    <text x="678" y="114" text-anchor="end" font-size="11" fill="#2563eb">vosita: ajratish</text>
  </g>

  <!-- O -->
  <g>
    <rect x="30" y="150" width="660" height="60" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
    <circle cx="68" cy="180" r="22" fill="#16a34a"/>
    <text x="68" y="187" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">O</text>
    <text x="108" y="174" font-size="14" font-weight="700" fill="#0f172a">Open/Closed — kengaytirishga ochiq, o'zgartirishga yopiq</text>
    <text x="108" y="196" font-size="12" fill="#475569">Yangi tur = yangi sinf; mavjud kod tegmaydi</text>
    <text x="678" y="184" text-anchor="end" font-size="11" fill="#16a34a">vosita: Strategy / polimorfizm</text>
  </g>

  <!-- L -->
  <g>
    <rect x="30" y="220" width="660" height="60" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="68" cy="250" r="22" fill="#f59e0b"/>
    <text x="68" y="257" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">L</text>
    <text x="108" y="244" font-size="14" font-weight="700" fill="#0f172a">Liskov Substitution — pastki tur ota o'rnini buzmasin</text>
    <text x="108" y="266" font-size="12" fill="#475569">Kvadrat/to'rtburchak: ko'rinadigan xatti-harakat shartnomasi</text>
    <text x="678" y="254" text-anchor="end" font-size="11" fill="#f59e0b">vosita: to'g'ri abstraksiya</text>
  </g>

  <!-- I -->
  <g>
    <rect x="30" y="290" width="660" height="60" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="68" cy="320" r="22" fill="#7c3aed"/>
    <text x="68" y="327" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">I</text>
    <text x="108" y="314" font-size="14" font-weight="700" fill="#0f172a">Interface Segregation — semiz interfeysni bo'l</text>
    <text x="108" y="336" font-size="12" fill="#475569">Mijoz faqat ishlatadigan metodlariga bog'lansin</text>
    <text x="678" y="324" text-anchor="end" font-size="11" fill="#7c3aed">vosita: kichik interfeyslar</text>
  </g>

  <!-- D -->
  <g>
    <rect x="30" y="360" width="660" height="60" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
    <circle cx="68" cy="390" r="22" fill="#dc2626"/>
    <text x="68" y="397" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">D</text>
    <text x="108" y="384" font-size="14" font-weight="700" fill="#0f172a">Dependency Inversion — abstraksiyaga bog'lan</text>
    <text x="108" y="406" font-size="12" fill="#475569">Yuqori qatlam konkret detalga emas, interfeysga tayanadi</text>
    <text x="678" y="394" text-anchor="end" font-size="11" fill="#dc2626">vosita: DI / interfeys</text>
  </g>
</svg>
