<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>Strategy andozasi ikki ko'rinishda: chapda klassik interfeys + ko'p sinf ierarxiyasi, o'ngda zamonaviy PHP da bitta closure (callable) — bir xil natija, ancha kam kod</title>

  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Strategy: klassik sinflar va zamonaviy closure</text>
  <text x="360" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Bir xil maqsad &#8212; almashtiriladigan algoritm &#8212; ikki xil og'irlikda</text>

  <!-- Chap: klassik -->
  <rect x="24" y="76" width="316" height="316" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="182" y="102" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">Klassik (interfeys + 3 sinf)</text>

  <!-- interfeys -->
  <rect x="112" y="118" width="140" height="40" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="182" y="135" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#991b1b">interface</text>
  <text x="182" y="151" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#7f1d1d">NarxStrategiya</text>

  <!-- 3 implementatsiya -->
  <line x1="182" y1="158" x2="78" y2="196" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="182" y1="158" x2="182" y2="196" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="182" y1="158" x2="286" y2="196" stroke="#dc2626" stroke-width="1.5"/>

  <rect x="36" y="196" width="84" height="46" rx="7" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="78" y="216" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#7f1d1d">VipChegirma</text>
  <text x="78" y="232" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#b91c1c">hisobla()</text>

  <rect x="140" y="196" width="84" height="46" rx="7" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="182" y="216" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#7f1d1d">OddiyNarx</text>
  <text x="182" y="232" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#b91c1c">hisobla()</text>

  <rect x="244" y="196" width="84" height="46" rx="7" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="286" y="216" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#7f1d1d">AksiyaNarx</text>
  <text x="286" y="232" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#b91c1c">hisobla()</text>

  <rect x="44" y="264" width="276" height="68" rx="8" fill="#1e293b"/>
  <text x="58" y="286" font-family="Consolas, monospace" font-size="11" fill="#e2e8f0">new Savatcha(</text>
  <text x="70" y="304" font-family="Consolas, monospace" font-size="11" fill="#fca5a5">new VipChegirma()</text>
  <text x="58" y="322" font-family="Consolas, monospace" font-size="11" fill="#e2e8f0">);</text>

  <text x="182" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#991b1b">~30 qator, 4 ta yangi tip</text>
  <text x="182" y="378" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#b91c1c">Ko'p holat shart emas (over-engineering)</text>

  <!-- o'ng: closure -->
  <rect x="380" y="76" width="316" height="316" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="538" y="102" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#14532d">Idiomatik (bitta closure)</text>

  <rect x="396" y="120" width="284" height="120" rx="8" fill="#0f172a"/>
  <text x="410" y="142" font-family="Consolas, monospace" font-size="11" fill="#94a3b8">// callable(float): float</text>
  <text x="410" y="164" font-family="Consolas, monospace" font-size="11" fill="#86efac">$vip = static fn($s) =&gt;</text>
  <text x="426" y="182" font-family="Consolas, monospace" font-size="11" fill="#e2e8f0">$s * 0.8;</text>
  <text x="410" y="208" font-family="Consolas, monospace" font-size="11" fill="#86efac">new Savatcha($vip);</text>
  <text x="410" y="230" font-family="Consolas, monospace" font-size="11" fill="#cbd5e1">// yoki: intval(...)</text>

  <rect x="396" y="256" width="284" height="76" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="538" y="278" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#14532d">Strategy = $strategiya parametri</text>
  <text x="538" y="298" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#14532d">Yangi qoida = yangi closure</text>
  <text x="538" y="318" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#15803d">first-class callable: foo(...)</text>

  <text x="538" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#14532d">~3 qator, 0 ta yangi tip</text>
  <text x="538" y="378" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#16a34a">Holat/ko'p metod kerak bo'lsa &#8594; sinfga qayt</text>

  <!-- o'rta strelka -->
  <line x1="344" y1="234" x2="376" y2="234" stroke="#f59e0b" stroke-width="3" marker-end="url(#arr)"/>
  <text x="360" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#b45309">bir xil</text>
  <text x="360" y="252" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#b45309">natija</text>

  <defs>
    <marker id="arr" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>
</svg>
