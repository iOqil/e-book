<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>Flysystem abstraksiyasi: bitta dastur kodi (write/read/delete) Filesystem interfeysiga gapiradi, ostida adapterni almashtirib local diskdan S3-mos object storage'ga kodga tegmasdan ko'chiriladi</title>

  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Flysystem: bitta kod, ko'p disk</text>
  <text x="360" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Kod faqat interfeysga gapiradi &#8594; adapter almashadi, kod o'zgarmaydi</text>

  <!-- Dastur kodi -->
  <rect x="250" y="78" width="220" height="84" rx="10" fill="#7c3aed"/>
  <text x="360" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Dastur kodingiz</text>
  <text x="360" y="126" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#ede9fe">$fs->write(...)</text>
  <text x="360" y="143" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#ede9fe">$fs->read(...) / delete()</text>
  <text x="360" y="159" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#ddd6fe">disk turini BILMAYDI</text>

  <!-- Filesystem interfeys -->
  <line x1="360" y1="162" x2="360" y2="186" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#p)"/>
  <rect x="220" y="188" width="280" height="50" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="360" y="210" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#5b21b6">League\Flysystem\Filesystem</text>
  <text x="360" y="228" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">YAGONA interfeys (abstraksiya qatlami)</text>

  <!-- uchta adapter -->
  <line x1="290" y1="238" x2="150" y2="280" stroke="#94a3b8" stroke-width="2" marker-end="url(#s)"/>
  <line x1="360" y1="238" x2="360" y2="280" stroke="#94a3b8" stroke-width="2" marker-end="url(#s)"/>
  <line x1="430" y1="238" x2="570" y2="280" stroke="#94a3b8" stroke-width="2" marker-end="url(#s)"/>

  <text x="360" y="270" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#64748b">adapter (pastda almashtiriladi)</text>

  <!-- Local -->
  <rect x="60" y="282" width="180" height="96" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="150" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#14532d">LocalFilesystemAdapter</text>
  <text x="150" y="328" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">server diski</text>
  <text x="150" y="346" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#16a34a">/var/www/storage</text>
  <text x="150" y="368" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#16a34a">dev / kichik loyiha</text>

  <!-- S3 / object storage -->
  <rect x="270" y="282" width="180" height="96" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#92400e">AwsS3V3Adapter</text>
  <text x="360" y="328" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">S3-mos object storage</text>
  <text x="360" y="346" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#f59e0b">endpoint/key/bucket</text>
  <text x="360" y="368" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#92400e">Contabo / S3 / MinIO</text>

  <!-- boshqa -->
  <rect x="480" y="282" width="180" height="96" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="570" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e3a8a">FTP / SFTP / ...</text>
  <text x="570" y="328" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">boshqa adapterlar</text>
  <text x="570" y="346" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#2563eb">in-memory (test)</text>
  <text x="570" y="368" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#2563eb">testda tez/toza</text>

  <!-- pastki xulosa -->
  <rect x="60" y="396" width="600" height="34" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="360" y="418" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#14532d">Lokaldan bulutga ko'chish = faqat adapter qatorini almashtirish. Biznes kod tegilmaydi.</text>

  <defs>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="s" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/></marker>
  </defs>
</svg>
