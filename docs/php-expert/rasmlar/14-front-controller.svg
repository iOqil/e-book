<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>Front controller naqshi: barcha URL (/, /users/5, /login, /post/salom) nginx/Apache rewrite orqali bitta index.php ga yo'naltiriladi; index.php bootstrap qiladi, so'rovni router'ga beradi, router mos kontrollerni topib chaqiradi va javob qaytaradi</title>

  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>
  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#1e293b">Front controller: hamma URL -&gt; bitta index.php</text>

  <defs>
    <marker id="fc-arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Kelayotgan URL'lar -->
  <text x="20" y="74" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#334155">Kelgan so'rovlar:</text>
  <g font-family="Consolas, monospace" font-size="13">
    <rect x="20" y="86"  width="150" height="26" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
    <text x="32" y="103" fill="#1e3a8a">GET /</text>
    <rect x="20" y="120" width="150" height="26" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
    <text x="32" y="137" fill="#1e3a8a">GET /users/5</text>
    <rect x="20" y="154" width="150" height="26" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
    <text x="32" y="171" fill="#1e3a8a">POST /login</text>
    <rect x="20" y="188" width="150" height="26" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
    <text x="32" y="205" fill="#1e3a8a">GET /post/salom</text>
  </g>

  <!-- Rewrite qatlami -->
  <rect x="206" y="86" width="118" height="128" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="265" y="120" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#92400e">nginx /</text>
  <text x="265" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#92400e">Apache</text>
  <text x="265" y="162" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#78350f">rewrite:</text>
  <text x="265" y="180" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#78350f">try_files</text>
  <text x="265" y="196" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#78350f">-&gt; index.php</text>

  <!-- 4 ta strelka rewrite'ga -->
  <line x1="170" y1="99"  x2="202" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#fc-arr)"/>
  <line x1="170" y1="133" x2="202" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#fc-arr)"/>
  <line x1="170" y1="167" x2="202" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#fc-arr)"/>
  <line x1="170" y1="201" x2="202" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#fc-arr)"/>

  <!-- index.php (front controller) -->
  <rect x="360" y="80" width="170" height="140" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <rect x="360" y="80" width="170" height="30" rx="10" fill="#7c3aed"/>
  <rect x="360" y="95" width="170" height="15" fill="#7c3aed"/>
  <text x="445" y="101" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#ffffff">index.php</text>
  <text x="445" y="130" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b21b6">FRONT CONTROLLER</text>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#4c1d95">
    <text x="374" y="152">1. autoload (Composer)</text>
    <text x="374" y="170">2. .env / config</text>
    <text x="374" y="188">3. middleware / xavfsizlik</text>
    <text x="374" y="206">4. Router-&gt;handle()</text>
  </g>

  <line x1="324" y1="150" x2="356" y2="150" stroke="#475569" stroke-width="2.5" marker-end="url(#fc-arr)"/>

  <!-- Router + kontrollerlar -->
  <rect x="566" y="86" width="134" height="128" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="633" y="110" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#166534">Router</text>
  <line x1="578" y1="120" x2="688" y2="120" stroke="#bbf7d0" stroke-width="1.5"/>
  <g font-family="Consolas, monospace" font-size="10.5" fill="#15803d">
    <text x="578" y="140">/         -&gt; Home</text>
    <text x="578" y="158">/users/5  -&gt; User</text>
    <text x="578" y="176">/login    -&gt; Auth</text>
    <text x="578" y="194">/post/..  -&gt; Blog</text>
  </g>

  <line x1="530" y1="150" x2="562" y2="150" stroke="#475569" stroke-width="2.5" marker-end="url(#fc-arr)"/>

  <!-- Nega? izoh blok -->
  <rect x="20" y="248" width="680" height="96" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="36" y="272" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#3730a3">Nega bitta kirish nuqtasi?</text>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#312e81">
    <text x="36" y="294">• Markaziy bootstrap: autoload, config, DB ulanishi bir joyda — har faylda takrorlanmaydi.</text>
    <text x="36" y="314">• Umumiy middleware: autentifikatsiya, CORS, logging, xavfsizlik HAR so'rovga bir xil qo'llanadi.</text>
    <text x="36" y="334">• Web-ildiz (public/) faqat index.php ni ochadi — boshqa .php fayllar to'g'ridan chaqirilmaydi.</text>
  </g>

  <!-- pastki taqqoslash -->
  <rect x="20" y="358" width="335" height="66" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="187" y="380" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#991b1b">Eski usul (front controllersiz)</text>
  <text x="187" y="400" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#7f1d1d">about.php, login.php, user.php ...</text>
  <text x="187" y="416" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#7f1d1d">har biri o'z bootstrap'i — tarqoq, xavfli</text>

  <rect x="365" y="358" width="335" height="66" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="532" y="380" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#166534">Front controller</text>
  <text x="532" y="400" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#14532d">index.php (yagona)</text>
  <text x="532" y="416" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#14532d">markazlashgan, bir xil, boshqariladigan</text>
</svg>
