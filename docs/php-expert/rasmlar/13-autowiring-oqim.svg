<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>Autowiring oqimi: get(UserService) chaqirilganda konteyner ReflectionClass bilan konstruktorni o'qiydi, har bir parametr tipini aniqlaydi va sinf tiplari uchun rekursiv get() chaqirib bog'liqliklarni avtomatik yaratadi, oxirida newInstanceArgs bilan obyektni quradi</title>

  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>
  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#1e293b">Autowiring: get(id) -&gt; Reflection -&gt; rekursiv resolve</text>

  <defs>
    <marker id="aw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- 1. get() -->
  <rect x="22" y="60" width="200" height="84" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="22" y="60" width="200" height="30" rx="10" fill="#2563eb"/>
  <rect x="22" y="75" width="200" height="15" fill="#2563eb"/>
  <text x="122" y="81" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#ffffff">1. get(UserService)</text>
  <text x="122" y="113" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#1e293b">keshda bormi? bog'lanish?</text>
  <text x="122" y="131" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#64748b">yo'q -&gt; quramiz</text>

  <!-- 2. ReflectionClass -->
  <rect x="262" y="60" width="200" height="84" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="262" y="60" width="200" height="30" rx="10" fill="#7c3aed"/>
  <rect x="262" y="75" width="200" height="15" fill="#7c3aed"/>
  <text x="362" y="81" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#ffffff">2. ReflectionClass</text>
  <text x="362" y="113" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#5b21b6">getConstructor()</text>
  <text x="362" y="131" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#5b21b6">-&gt;getParameters()</text>

  <!-- 3. Har parametr tipi -->
  <rect x="502" y="60" width="196" height="84" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <rect x="502" y="60" width="196" height="30" rx="10" fill="#f59e0b"/>
  <rect x="502" y="75" width="196" height="15" fill="#f59e0b"/>
  <text x="600" y="81" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#ffffff">3. Parametr tipi?</text>
  <text x="600" y="111" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#92400e">ReflectionNamedType</text>
  <text x="600" y="129" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#92400e">-&gt;isBuiltin()?</text>

  <line x1="222" y1="102" x2="258" y2="102" stroke="#475569" stroke-width="2.5" marker-end="url(#aw)"/>
  <line x1="462" y1="102" x2="498" y2="102" stroke="#475569" stroke-width="2.5" marker-end="url(#aw)"/>

  <!-- ikki tarmoq -->
  <!-- sinf tipi -> rekursiv get -->
  <rect x="380" y="186" width="318" height="72" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="539" y="210" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">Sinf/interfeys tipi (builtin = false)</text>
  <text x="539" y="231" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#1e3a8a">$this-&gt;get($type-&gt;getName())</text>
  <text x="539" y="249" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#3b82f6">REKURSIV -&gt; Database, Logger ni quradi</text>

  <!-- skalyar -> default -->
  <rect x="22" y="186" width="318" height="72" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="181" y="210" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#166534">Skalyar tip (builtin = true)</text>
  <text x="181" y="231" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#14532d">isDefaultValueAvailable()?</text>
  <text x="181" y="249" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#22c55e">standart qiymat YOKI xato</text>

  <line x1="600" y1="144" x2="560" y2="182" stroke="#475569" stroke-width="2.5" marker-end="url(#aw)"/>
  <line x1="560" y1="144" x2="220" y2="182" stroke="#475569" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#aw)"/>

  <!-- 4. newInstanceArgs -->
  <rect x="160" y="296" width="400" height="62" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2.2"/>
  <text x="360" y="320" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#166534">4. newInstanceArgs([Database, Logger, ...])</text>
  <text x="360" y="342" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#15803d">Barcha bog'liqliklar tayyor -&gt; UserService obyekti qaytadi</text>

  <line x1="181" y1="258" x2="300" y2="293" stroke="#475569" stroke-width="2.5" marker-end="url(#aw)"/>
  <line x1="539" y1="258" x2="420" y2="293" stroke="#475569" stroke-width="2.5" marker-end="url(#aw)"/>

  <!-- pastki eslatma -->
  <rect x="22" y="382" width="676" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="360" y="402" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="bold" fill="#991b1b">Aylanma bog'liqlik (A-&gt;B-&gt;A): "building" ro'yxati orqali aniqlanadi.</text>
  <text x="360" y="419" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#7f1d1d">Reflection sekin -&gt; production'da grafni bir marta compile qilib keshlang.</text>
</svg>
