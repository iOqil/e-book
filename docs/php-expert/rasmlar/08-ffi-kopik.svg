<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>FFI ko'prigi: PHP kodi FFI::cdef bilan C funksiya imzosini e'lon qiladi, FFI qatlami xotira va turlarni moslab, native C kutubxonasini (masalan libc/msvcrt) to'g'ridan-to'g'ri chaqiradi; bu kuchli, lekin xavfsizlik va portativlik narxi bor</title>

  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#1e293b">FFI ko'prigi: PHP &lt;-&gt; C</text>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
    <marker id="a2b" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto">
      <path d="M10,0 L0,5 L10,10 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- PHP tomoni -->
  <rect x="24" y="66" width="250" height="300" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="149" y="94" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e40af">PHP dunyosi</text>
  <text x="149" y="114" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#3b82f6">boshqariladigan xotira (GC)</text>

  <rect x="40" y="130" width="218" height="100" rx="8" fill="#0f172a"/>
  <text x="52" y="152" font-family="Consolas, monospace" font-size="11.5" fill="#60a5fa">$ffi = FFI::cdef(</text>
  <text x="52" y="170" font-family="Consolas, monospace" font-size="11.5" fill="#f472b6"> "int abs(int n);",</text>
  <text x="52" y="188" font-family="Consolas, monospace" font-size="11.5" fill="#fbbf24"> "msvcrt.dll");</text>
  <text x="52" y="212" font-family="Consolas, monospace" font-size="11.5" fill="#4ade80">$ffi-&gt;abs(-42);</text>

  <rect x="40" y="246" width="218" height="100" rx="8" fill="#dbeafe"/>
  <text x="149" y="270" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#1e3a8a">PHP turlari</text>
  <text x="149" y="292" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#1e40af">int, float, string</text>
  <text x="149" y="312" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#1e40af">FFI\CData (struct, massiv)</text>
  <text x="149" y="332" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#64748b">avtomatik moslanadi</text>

  <!-- FFI qatlami (ko'prik) -->
  <rect x="298" y="120" width="124" height="200" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="360" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#5b21b6">FFI</text>
  <text x="360" y="170" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#5b21b6">qatlami</text>
  <text x="360" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#6d28d9">imzoni</text>
  <text x="360" y="216" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#6d28d9">o'qiydi</text>
  <text x="360" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#6d28d9">tur/xotira</text>
  <text x="360" y="256" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#6d28d9">moslaydi</text>
  <text x="360" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#6d28d9">(marshalling)</text>

  <!-- C tomoni -->
  <rect x="446" y="66" width="250" height="300" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="571" y="94" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#15803d">C / native dunyosi</text>
  <text x="571" y="114" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#16a34a">qo'lda boshqariladigan xotira</text>

  <rect x="462" y="130" width="218" height="100" rx="8" fill="#dcfce7"/>
  <text x="571" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#14532d">kompilyatsiya qilingan</text>
  <text x="571" y="176" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#14532d">.so / .dll / .dylib</text>
  <text x="571" y="200" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#166534">msvcrt.dll, libc,</text>
  <text x="571" y="218" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#166534">libsqlite3, ...</text>

  <rect x="462" y="246" width="218" height="100" rx="8" fill="#dcfce7"/>
  <text x="571" y="272" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#14532d">native tezlik</text>
  <text x="571" y="294" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#166534">hot-loop, mavjud C kod</text>
  <text x="571" y="316" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#166534">qayta yozmasdan ulanish</text>
  <text x="571" y="336" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#dc2626">xato = segfault/crash</text>

  <!-- strelkalar -->
  <line x1="258" y1="180" x2="296" y2="180" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="277" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#7c3aed">chaqiruv</text>
  <line x1="424" y1="180" x2="460" y2="180" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#a2)"/>
  <line x1="460" y1="296" x2="424" y2="296" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a2b)"/>
  <line x1="296" y1="296" x2="258" y2="296" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a2b)"/>
  <text x="360" y="312" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#16a34a">natija</text>

  <!-- pastki xulosa -->
  <rect x="24" y="382" width="672" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="402" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#92400e">FFI = kuch + mas'uliyat: PHP ning xavfsiz "qobig'i"dan tashqariga chiqasiz.</text>
  <text x="360" y="419" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#78350f">Faqat ishonchli kod, preload bilan; deyarli har doim KERAK EMAS — avval toza PHP yechimni o'ylang.</text>
</svg>
