<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>Katta faylni o'qish: file_get_contents butun faylni RAMga oladi (xotira fayl hajmiga teng o'sadi), generator (yield) faqat bitta qatorni ushlaydi (xotira deyarli o'zgarmaydi). 22 MB fayl uchun 24 MB va 0 MB.</title>

  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>

  <text x="360" y="30" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Katta fayl: butun faylmi yoki qatorma-qatormi?</text>
  <text x="360" y="52" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">22 MB fayl &#8212; bir xil natija, mutlaqo boshqa xotira</text>

  <!-- CHAP: file_get_contents -->
  <rect x="28" y="78" width="316" height="320" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="186" y="104" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#991b1b">file_get_contents()</text>
  <text x="186" y="123" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#64748b">butun faylni bir vaqtda RAMga</text>

  <!-- fayl -->
  <rect x="56" y="140" width="80" height="120" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="96" y="156" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#991b1b">fayl 22MB</text>
  <line x1="56" y1="166" x2="136" y2="166" stroke="#fca5a5"/>
  <line x1="56" y1="182" x2="136" y2="182" stroke="#fca5a5"/>
  <line x1="56" y1="198" x2="136" y2="198" stroke="#fca5a5"/>
  <line x1="56" y1="214" x2="136" y2="214" stroke="#fca5a5"/>
  <line x1="56" y1="230" x2="136" y2="230" stroke="#fca5a5"/>
  <line x1="56" y1="246" x2="136" y2="246" stroke="#fca5a5"/>

  <line x1="140" y1="200" x2="172" y2="200" stroke="#dc2626" stroke-width="2.5" marker-end="url(#r)"/>

  <!-- RAM ustun (to'la) -->
  <text x="262" y="156" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">RAM</text>
  <rect x="212" y="162" width="100" height="98" rx="5" fill="#dc2626"/>
  <text x="262" y="206" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">22 MB</text>
  <text x="262" y="226" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#fee2e2">RAMda</text>

  <rect x="56" y="284" width="256" height="92" rx="8" fill="#fef2f2"/>
  <text x="72" y="306" font-family="Segoe UI, sans-serif" font-size="12" fill="#7f1d1d">Peak xotira o'sishi:</text>
  <text x="184" y="334" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="22" font-weight="bold" fill="#dc2626">+24 MB</text>
  <text x="184" y="360" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">fayl kattalashsa &#8212; RAM ham, OOM xavfi</text>

  <!-- O'NG: generator -->
  <rect x="376" y="78" width="316" height="320" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="534" y="104" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#14532d">generator (yield)</text>
  <text x="534" y="123" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#64748b">bir vaqtda faqat bitta qator</text>

  <!-- fayl -->
  <rect x="404" y="140" width="80" height="120" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="444" y="156" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#14532d">fayl 22MB</text>
  <line x1="404" y1="166" x2="484" y2="166" stroke="#86efac"/>
  <line x1="404" y1="182" x2="484" y2="182" stroke="#86efac"/>
  <rect x="404" y="194" width="80" height="16" fill="#16a34a" opacity="0.35"/>
  <text x="444" y="206" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#14532d">joriy qator</text>
  <line x1="404" y1="214" x2="484" y2="214" stroke="#86efac"/>
  <line x1="404" y1="230" x2="484" y2="230" stroke="#86efac"/>
  <line x1="404" y1="246" x2="484" y2="246" stroke="#86efac"/>

  <line x1="488" y1="202" x2="520" y2="202" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)"/>

  <!-- RAM ustun (deyarli bo'sh) -->
  <text x="610" y="156" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">RAM</text>
  <rect x="560" y="162" width="100" height="98" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="560" y="248" width="100" height="12" rx="3" fill="#16a34a"/>
  <text x="610" y="218" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#14532d">bo'sh</text>
  <text x="610" y="282" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#16a34a">1 qator (~KB)</text>

  <rect x="404" y="296" width="256" height="92" rx="8" fill="#f0fdf4"/>
  <text x="420" y="318" font-family="Segoe UI, sans-serif" font-size="12" fill="#14532d">Peak xotira o'sishi:</text>
  <text x="532" y="346" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="22" font-weight="bold" fill="#16a34a">~0 MB</text>
  <text x="532" y="372" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#14532d">fayl 22 MB ham, 22 GB ham &#8212; bir xil</text>

  <defs>
    <marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
</svg>
