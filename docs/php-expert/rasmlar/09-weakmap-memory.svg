<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460">
  <title>WeakMap va oddiy map ning xotira bilan farqi: oddiy map (array yoki SplObjectStorage) obyektni kuchli havola bilan ushlab turadi va u GC tomonidan yig'ilmaydi (memory leak), WeakMap esa obyektga zaif havola qiladi va boshqa havola yo'qolganda yozuv o'zi tashlab yuboriladi</title>

  <rect x="0" y="0" width="720" height="460" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">WeakMap vs oddiy map: xotira xulqi</text>
  <text x="360" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">obyektga oxirgi $havola yo'qolganda nima bo'ladi?</text>

  <!-- CHAP: oddiy map (leak) -->
  <rect x="24" y="78" width="320" height="350" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="24" y="78" width="320" height="36" rx="12" fill="#dc2626"/>
  <rect x="24" y="96" width="320" height="18" fill="#dc2626"/>
  <text x="184" y="103" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Oddiy map (array / SplObjectStorage)</text>

  <rect x="48" y="134" width="120" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="108" y="158" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#991b1b">$map</text>
  <text x="108" y="178" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#7f1d1d">[obyekt =&gt; data]</text>

  <rect x="200" y="134" width="120" height="56" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="260" y="158" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#334155">Obyekt</text>
  <text x="260" y="178" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#475569">xotirada</text>

  <!-- kuchli havola strelka -->
  <line x1="168" y1="162" x2="200" y2="162" stroke="#dc2626" stroke-width="3" marker-end="url(#oqRed)"/>
  <text x="184" y="128" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">kuchli havola</text>

  <text x="184" y="222" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#1e293b">unset($obyekt) qilingach...</text>

  <rect x="200" y="240" width="120" height="56" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="260" y="264" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#334155">Obyekt</text>
  <text x="260" y="284" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#dc2626">HALI TIRIK</text>

  <line x1="168" y1="268" x2="200" y2="268" stroke="#dc2626" stroke-width="3" marker-end="url(#oqRed)"/>
  <rect x="48" y="240" width="120" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="108" y="272" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" font-weight="bold" fill="#991b1b">$map ushlab</text>

  <rect x="48" y="318" width="272" height="92" rx="8" fill="#fef2f2"/>
  <text x="184" y="344" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#991b1b">MEMORY LEAK</text>
  <text x="184" y="366" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#7f1d1d">count($map) o'zgarmaydi</text>
  <text x="184" y="386" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#7f1d1d">obyekt GC ga tushmaydi —</text>
  <text x="184" y="404" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#7f1d1d">qo'lda detach() kerak</text>

  <!-- O'NG: WeakMap (tozalanadi) -->
  <rect x="376" y="78" width="320" height="350" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="376" y="78" width="320" height="36" rx="12" fill="#16a34a"/>
  <rect x="376" y="96" width="320" height="18" fill="#16a34a"/>
  <text x="536" y="103" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">WeakMap (zaif havola)</text>

  <rect x="400" y="134" width="120" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="460" y="158" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#166534">$wm</text>
  <text x="460" y="178" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#14532d">[obyekt =&gt; data]</text>

  <rect x="552" y="134" width="120" height="56" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="612" y="158" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#334155">Obyekt</text>
  <text x="612" y="178" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#475569">xotirada</text>

  <line x1="520" y1="162" x2="552" y2="162" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#oqGreen)"/>
  <text x="536" y="128" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#16a34a">zaif havola</text>

  <text x="536" y="222" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#1e293b">unset($obyekt) qilingach...</text>

  <rect x="552" y="240" width="120" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="612" y="264" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">Obyekt</text>
  <text x="612" y="284" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#16a34a">YIG'ILDI</text>

  <line x1="520" y1="268" x2="552" y2="268" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3 4"/>
  <rect x="400" y="240" width="120" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="460" y="272" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" font-weight="bold" fill="#166534">$wm yozuvi</text>

  <rect x="400" y="318" width="272" height="92" rx="8" fill="#f0fdf4"/>
  <text x="536" y="344" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#166534">LEAK YO'Q</text>
  <text x="536" y="366" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#14532d">count($wm) avtomatik kamayadi</text>
  <text x="536" y="386" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#14532d">yozuv O'ZI tashlanadi —</text>
  <text x="536" y="404" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#14532d">qo'lda tozalash shart emas</text>

  <defs>
    <marker id="oqRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#dc2626"/>
    </marker>
    <marker id="oqGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
