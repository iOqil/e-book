<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>Mutation testing: Infection kodga kichik o'zgartirish (mutant) kiritadi — masalan &gt; ni &gt;= ga aylantiradi — keyin testlarni ishga tushiradi. Agar biror test yiqilsa mutant 'o'ldirildi' (yaxshi), agar hamma test o'taversa mutant 'tirik qoldi' (test zaif). MSI = o'ldirilgan mutantlar foizi</title>

  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>

  <text x="360" y="30" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Mutation testing: mutant &#8594; test tutadimi? &#8594; MSI</text>
  <text x="360" y="52" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Infection kodni "buzadi" va testlaringiz buni sezadimi tekshiradi</text>

  <!-- 1. Original kod -->
  <rect x="36" y="78" width="200" height="78" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="136" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#1e3a8a">1. Original kod</text>
  <text x="136" y="124" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#334155">if ($n &gt; 100)</text>
  <text x="136" y="144" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">testlar HOZIR yashil</text>

  <!-- strelka -->
  <line x1="236" y1="117" x2="288" y2="117" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#mp)"/>
  <text x="262" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#7c3aed">mutatsiya</text>

  <!-- 2. Mutant -->
  <rect x="290" y="78" width="200" height="78" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="390" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#6b21a8">2. Mutant</text>
  <text x="390" y="124" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#7c3aed">if ($n &gt;= 100)</text>
  <text x="390" y="144" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b21a8">&gt; ni &gt;= ga aylantirdi</text>

  <!-- strelka -->
  <line x1="490" y1="117" x2="542" y2="117" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#mp)"/>

  <!-- 3. Testlarni qayta ishga tushir -->
  <rect x="544" y="78" width="148" height="78" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="618" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#92400e">3. Testlar</text>
  <text x="618" y="126" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#92400e">qayta ishga</text>
  <text x="618" y="144" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#92400e">tushadi</text>

  <!-- Ikki natija -->
  <!-- O'ldirildi -->
  <path d="M 618 156 L 618 196 L 230 196 L 230 218" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#mg)"/>
  <rect x="60" y="222" width="300" height="96" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="210" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#15803d">Test YIQILDI &#8594; mutant O'LDIRILDI</text>
  <text x="210" y="272" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#166534">Yaxshi! Test bu o'zgarishni sezdi.</text>
  <text x="210" y="294" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#166534">Demak test haqiqatan natijani tekshiradi.</text>
  <text x="210" y="312" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-style="italic" fill="#15803d">killed</text>

  <!-- Tirik qoldi -->
  <path d="M 618 156 L 618 196 L 510 196 L 510 218" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#mr)"/>
  <rect x="380" y="222" width="300" height="96" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="530" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b91c1c">Test O'TDI &#8594; mutant TIRIK</text>
  <text x="530" y="272" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#991b1b">Yomon! Kod buzildi-yu test sezmadi.</text>
  <text x="530" y="294" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#991b1b">Test zaif yoki assert yo'q (yolg'on).</text>
  <text x="530" y="312" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-style="italic" fill="#b91c1c">escaped / survived</text>

  <!-- MSI formula paneli -->
  <rect x="36" y="338" width="648" height="112" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="54" y="364" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">MSI (Mutation Score Indicator)</text>
  <text x="54" y="390" font-family="Consolas, monospace" font-size="13" fill="#1e3a8a">MSI = o'ldirilgan mutantlar / jami mutantlar &#215; 100%</text>
  <text x="54" y="414" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#334155">&#8226; Covered MSI = faqat coverage qamragan kod bo'yicha MSI (qattiqroq, halolroq metrika).</text>
  <text x="54" y="436" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#334155">&#8226; Coverage "kod bosildimi" deydi; MSI "testlar buzilishni TUTADIMI" deydi — kuchliroq sifat o'lchovi.</text>

  <defs>
    <marker id="mp" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="mg" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="mr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
</svg>
