<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>GoF dizayn andozalarining uch oilasi: Creational (obyekt yaratish), Structural (obyektlarni birlashtirish) va Behavioral (obyektlar o'rtasidagi muloqot), har biriga tegishli andozalar ro'yxati bilan</title>

  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">GoF andozalarining uch oilasi</text>
  <text x="360" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Maqsadiga ko'ra guruhlangan: yaratish &#183; tuzilma &#183; xatti-harakat</text>

  <!-- Creational ustun -->
  <rect x="28" y="78" width="208" height="320" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="132" y="106" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e3a8a">CREATIONAL</text>
  <text x="132" y="126" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#3b82f6">obyektni QANDAY yaratamiz</text>
  <line x1="48" y1="138" x2="216" y2="138" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="48" y="164" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">&#8226; Factory Method</text>
  <text x="48" y="190" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">&#8226; Abstract Factory</text>
  <text x="48" y="216" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">&#8226; Builder</text>
  <text x="48" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">&#8226; Singleton</text>
  <text x="58" y="262" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#dc2626">(ehtiyot bo'l!)</text>
  <text x="48" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569" font-style="italic">Misol: turli eksport</text>
  <text x="48" y="318" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569" font-style="italic">(CSV/JSON), qadamli</text>
  <text x="48" y="336" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569" font-style="italic">so'rov qurish.</text>
  <text x="48" y="372" font-family="Consolas, monospace" font-size="11.5" fill="#1e40af">enum &#8594; eksport()</text>

  <!-- Structural ustun -->
  <rect x="256" y="78" width="208" height="320" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="360" y="106" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#14532d">STRUCTURAL</text>
  <text x="360" y="126" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#16a34a">obyektlarni BIRLASHTIRISH</text>
  <line x1="276" y1="138" x2="444" y2="138" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="276" y="164" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">&#8226; Adapter</text>
  <text x="276" y="190" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">&#8226; Decorator</text>
  <text x="276" y="216" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">&#8226; Proxy</text>
  <text x="276" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">&#8226; Facade</text>
  <text x="276" y="268" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">&#8226; Composite</text>
  <text x="276" y="306" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569" font-style="italic">Misol: mos kelmagan</text>
  <text x="276" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569" font-style="italic">logger, kesh qatlami,</text>
  <text x="276" y="342" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569" font-style="italic">fayl-tizim daraxti.</text>
  <text x="276" y="372" font-family="Consolas, monospace" font-size="11.5" fill="#15803d">Decorator &#8594; middleware</text>

  <!-- Behavioral ustun -->
  <rect x="484" y="78" width="208" height="320" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="588" y="106" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#5b21b6">BEHAVIORAL</text>
  <text x="588" y="126" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#7c3aed">obyektlar MULOQOTI</text>
  <line x1="504" y1="138" x2="672" y2="138" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="504" y="160" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">&#8226; Strategy</text>
  <text x="504" y="182" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">&#8226; Observer</text>
  <text x="504" y="204" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">&#8226; Command</text>
  <text x="504" y="226" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">&#8226; State</text>
  <text x="504" y="248" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">&#8226; Template Method</text>
  <text x="504" y="270" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">&#8226; Chain of Resp.</text>
  <text x="504" y="306" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569" font-style="italic">Misol: chegirma, event,</text>
  <text x="504" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569" font-style="italic">undo, buyurtma holati.</text>
  <text x="504" y="372" font-family="Consolas, monospace" font-size="11.5" fill="#6d28d9">State &#8594; enum + match</text>

  <!-- pastki banner -->
  <rect x="28" y="408" width="664" height="24" rx="8" fill="#fef9c3" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="424" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#92400e">Zamonaviy PHP da ko'p andoza closure / enum / __invoke bilan SINFSIZ ifodalanadi &#8212; soddalik birinchi.</text>
</svg>
