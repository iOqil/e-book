<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>Route matching: route shabloni /foydalanuvchi/{id:\d+} regex'ga (?P&lt;id&gt;\d+) aylantiriladi, kelgan path /foydalanuvchi/42 ga preg_match qilinadi; mos kelsa named guruh id=42 parametr sifatida ajratiladi va handler'ga uzatiladi; metod mos kelmasa 405, hech qaysi path mos kelmasa 404</title>

  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>
  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#1e293b">Path eshlash: shablon -&gt; regex -&gt; parametr</text>

  <defs>
    <marker id="rm-arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- 1. Route shabloni -->
  <rect x="24" y="64" width="210" height="92" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="24" y="64" width="210" height="28" rx="10" fill="#2563eb"/>
  <rect x="24" y="78" width="210" height="14" fill="#2563eb"/>
  <text x="129" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">1. Route shabloni</text>
  <rect x="38" y="102" width="182" height="42" rx="6" fill="#0f172a"/>
  <text x="129" y="121" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#f472b6">/foydalanuvchi/</text>
  <text x="129" y="137" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#fbbf24">{id:\d+}</text>

  <!-- 2. compile -> regex -->
  <rect x="276" y="64" width="210" height="92" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="276" y="64" width="210" height="28" rx="10" fill="#7c3aed"/>
  <rect x="276" y="78" width="210" height="14" fill="#7c3aed"/>
  <text x="381" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">2. compile() -&gt; regex</text>
  <rect x="290" y="102" width="182" height="42" rx="6" fill="#f5f3ff"/>
  <text x="381" y="120" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#5b21b6">#^/foydalanuvchi/</text>
  <text x="381" y="136" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#7c3aed">(?P&lt;id&gt;\d+)$#</text>

  <!-- 3. kelgan path + preg_match -->
  <rect x="528" y="64" width="168" height="92" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="528" y="64" width="168" height="28" rx="10" fill="#16a34a"/>
  <rect x="528" y="78" width="168" height="14" fill="#16a34a"/>
  <text x="612" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">3. preg_match</text>
  <rect x="540" y="102" width="144" height="42" rx="6" fill="#f0fdf4"/>
  <text x="612" y="120" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#14532d">kelgan path:</text>
  <text x="612" y="136" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#166534">/foydalanuvchi/42</text>

  <line x1="234" y1="110" x2="272" y2="110" stroke="#475569" stroke-width="2.5" marker-end="url(#rm-arr)"/>
  <line x1="486" y1="110" x2="524" y2="110" stroke="#475569" stroke-width="2.5" marker-end="url(#rm-arr)"/>
  <text x="253" y="102" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#64748b">{id}</text>

  <!-- MOS keldi -> parametr -->
  <rect x="248" y="186" width="224" height="74" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="208" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">MOS keldi -&gt; named guruh</text>
  <rect x="300" y="218" width="120" height="30" rx="6" fill="#0f172a"/>
  <text x="360" y="238" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#4ade80">['id' =&gt; '42']</text>

  <line x1="612" y1="156" x2="430" y2="184" stroke="#16a34a" stroke-width="2.5" marker-end="url(#rm-arr)"/>

  <!-- handler chaqirish -->
  <rect x="248" y="284" width="224" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#1e3a8a">4. handler chaqiriladi</text>
  <text x="360" y="326" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#1d4ed8">show(id: '42')</text>
  <line x1="360" y1="260" x2="360" y2="282" stroke="#475569" stroke-width="2.5" marker-end="url(#rm-arr)"/>

  <!-- 404 / 405 yon holatlar -->
  <rect x="24" y="186" width="200" height="154" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="124" y="208" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#991b1b">Mos kelmaganda</text>
  <line x1="40" y1="218" x2="208" y2="218" stroke="#fecaca" stroke-width="1.5"/>
  <text x="40" y="240" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#b91c1c">404 Not Found</text>
  <text x="40" y="258" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#7f1d1d">hech bir path regex'iga</text>
  <text x="40" y="273" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#7f1d1d">mos kelmadi.</text>
  <text x="40" y="298" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#b91c1c">405 Not Allowed</text>
  <text x="40" y="316" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#7f1d1d">path MOS, lekin metod</text>
  <text x="40" y="331" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#7f1d1d">boshqa -&gt; Allow sarlavhasi.</text>

  <!-- 496 ustun: pastki maslahat -->
  <rect x="496" y="186" width="200" height="154" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="596" y="208" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#92400e">Eslatma</text>
  <line x1="512" y1="218" x2="680" y2="218" stroke="#fde68a" stroke-width="1.5"/>
  <text x="512" y="240" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#78350f">• {id:\d+} — cheklov:</text>
  <text x="522" y="256" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#78350f">faqat raqam mos keladi.</text>
  <text x="512" y="278" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#78350f">• cheklovsiz {id} -&gt;</text>
  <text x="522" y="294" font-family="Consolas, monospace" font-size="11" fill="#78350f">[^/]+ (slashgacha).</text>
  <text x="512" y="316" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#78350f">• Aniq route'lar param-</text>
  <text x="522" y="332" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#78350f">lidan OLDIN ro'yxatda.</text>

  <!-- pastki natija -->
  <rect x="24" y="362" width="672" height="56" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="360" y="384" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#334155">Router birinchi mos route'da to'xtaydi: regex bilan path tekshiriladi, metod solishtiriladi,</text>
  <text x="360" y="404" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">named parametrlar ajratiladi va handler'ga argument sifatida uzatiladi. Topilmasa 404/405.</text>
</svg>
