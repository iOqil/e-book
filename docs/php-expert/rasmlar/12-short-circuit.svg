<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>Short-circuit: Auth middleware token noto'g'ri bo'lsa darrov 401 javobini qaytaradi va keyingi qatlamlarga (CORS, final handler) umuman o'tmaydi; Logging ning after qismi baribir ishlaydi</title>

  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>

  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Short-circuit: Auth muvaffaqiyatsiz &#8594; 401</text>
  <text x="360" y="54" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Middleware $handler->handle() ni CHAQIRMAY javob qaytarsa, pipeline shu yerda to'xtaydi</text>

  <!-- Qatlam qutilari (chapdan o'ngga) -->
  <rect x="40" y="120" width="130" height="70" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="105" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e3a8a">Logging</text>
  <text x="105" y="170" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">before/after</text>

  <rect x="220" y="120" width="130" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="285" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#991b1b">Auth</text>
  <text x="285" y="170" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#991b1b">token NOTO'G'RI</text>

  <rect x="400" y="120" width="130" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="465" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#94a3b8">CORS</text>
  <text x="465" y="170" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#94a3b8">ISHLAMAYDI</text>

  <rect x="580" y="120" width="110" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="635" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#94a3b8">Handler</text>
  <text x="635" y="170" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#94a3b8">ISHLAMAYDI</text>

  <!-- so'rov kiradi -->
  <line x1="170" y1="155" x2="218" y2="155" stroke="#2563eb" stroke-width="2.5" marker-end="url(#sb)"/>

  <!-- Auth dan keyin X (to'siq) -->
  <line x1="350" y1="155" x2="398" y2="155" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5 4"/>
  <line x1="364" y1="142" x2="384" y2="168" stroke="#dc2626" stroke-width="3"/>
  <line x1="384" y1="142" x2="364" y2="168" stroke="#dc2626" stroke-width="3"/>
  <text x="374" y="125" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">to'silgan</text>

  <!-- 401 javob darrov qaytadi (Auth -> Logging) -->
  <path d="M 285 190 L 285 260 L 105 260 L 105 192" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#sr)"/>
  <rect x="250" y="270" width="220" height="40" rx="8" fill="#dc2626"/>
  <text x="360" y="295" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">401 javob darrov qaytadi</text>

  <!-- pastki izoh -->
  <rect x="40" y="340" width="640" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="58" y="366" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e293b">Nima bo'ldi?</text>
  <text x="58" y="390" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#334155">1. Logging before ishladi, Auth ga uzatdi.</text>
  <text x="58" y="411" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#334155">2. Auth token xato deb topdi &#8594; $handler->handle() ni CHAQIRMADI, o'zi 401 qaytardi.</text>
  <text x="58" y="432" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#334155">3. CORS va final handler UMUMAN ishlamadi. Lekin Logging ning after qismi baribir ishlaydi.</text>

  <defs>
    <marker id="sb" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="sr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
