<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>PSR-4 autoload: namespace prefiks fayl tizimidagi katalogga moslanadi, qolgan namespace qismi fayl yo'liga aylanadi va Composer faylni topib yuklaydi</title>

  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">PSR-4 autoload: namespace → fayl yo'li</text>
  <text x="360" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Composer sinf nomidan fayl yo'lini mexanik hisoblaydi</text>

  <!-- composer.json mapping qutisi -->
  <rect x="40" y="78" width="640" height="58" rx="8" fill="#0f172a"/>
  <text x="56" y="103" font-family="Consolas, Courier New, monospace" font-size="12.5" fill="#94a3b8">"autoload": { "psr-4": {</text>
  <text x="76" y="123" font-family="Consolas, Courier New, monospace" font-size="12.5"><tspan fill="#60a5fa">"App\\"</tspan><tspan fill="#94a3b8"> : </tspan><tspan fill="#4ade80">"src/"</tspan><tspan fill="#94a3b8"> } }   &lt;- prefiks katalogga moslanadi</tspan></text>

  <!-- 1-qadam: kerakli sinf -->
  <rect x="40" y="162" width="640" height="48" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="56" y="184" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#1e3a8a">Kod talab qiladi:</text>
  <text x="56" y="202" font-family="Consolas, Courier New, monospace" font-size="13.5"><tspan fill="#7c3aed">new </tspan><tspan fill="#1e293b">App\Service\Mailer\SmtpMailer()</tspan></text>

  <!-- ajratish chizig'i -->
  <text x="360" y="234" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748b">Composer namespace ni qismlarga ajratadi:</text>

  <!-- prefiks qismi -->
  <rect x="60" y="248" width="130" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="125" y="270" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="bold" fill="#1e3a8a">App\</text>
  <text x="125" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#475569">prefiks</text>

  <!-- qolgan qism -->
  <rect x="210" y="248" width="430" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="425" y="270" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="bold" fill="#14532d">Service\Mailer\SmtpMailer</text>
  <text x="425" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#475569">qolgani — kataloglar + fayl nomi</text>

  <!-- pastga strelka -->
  <line x1="360" y1="304" x2="360" y2="326" stroke="#64748b" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="385" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#64748b">\ → / , oxiriga .php</text>

  <!-- natija fayl yo'li -->
  <rect x="60" y="334" width="130" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="125" y="364" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="bold" fill="#1e3a8a">src/</text>

  <rect x="210" y="334" width="430" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="425" y="364" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="bold" fill="#14532d">Service/Mailer/SmtpMailer.php</text>

  <!-- xulosa -->
  <rect x="40" y="402" width="640" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="425" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#1e293b">Natija: src/Service/Mailer/SmtpMailer.php — Composer shu faylni topib require qiladi.</text>
  <text x="360" y="444" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">Hech qanday require yozmaysiz: katalog tuzilishi namespace bilan AYNAN mos bo'lsa, yetarli.</text>

  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
