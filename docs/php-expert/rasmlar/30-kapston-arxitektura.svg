<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>Kapston arxitekturasi: tashqi HTTP so'rov Controller orqali Application qatlamiga (Command + Handler) kiradi, u Domain yadrosini (Article aggregate, Slug VO, ArticlePublished hodisa) ishlatadi va port'lar orqali Infrastructure (SQLite Repository, Redis kesh, Messenger navbat, Monolog log) bilan gaplashadi. Domen markazda, bog'liqliklar ichkariga yo'naladi.</title>

  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>
  <text x="360" y="26" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#1e293b">Kapston: hexagonal "Maqola" xizmati — bog'liqlik ichkariga yo'naladi</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Tashqi halqa: Infrastructure / Adapters -->
  <rect x="28" y="46" width="664" height="368" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="46" y="66" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="bold" fill="#166534">Infrastructure (adapter'lar) — almashtiriladigan detallar</text>

  <!-- O'rta halqa: Application -->
  <rect x="118" y="86" width="484" height="288" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="136" y="106" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="bold" fill="#5b21b6">Application — Command / Query + Handler (use-case)</text>

  <!-- Ichki yadro: Domain -->
  <rect x="232" y="128" width="256" height="170" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.4"/>
  <text x="360" y="150" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">Domain yadrosi</text>
  <text x="360" y="172" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#1d4ed8">Article (aggregate)</text>
  <text x="360" y="190" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#1d4ed8">Slug (Value Object)</text>
  <text x="360" y="208" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#1d4ed8">ArticlePublished (event)</text>
  <text x="360" y="232" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#3b82f6">biznes qoidasi shu yerda</text>
  <text x="360" y="250" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#3b82f6">framework/DB ni BILMAYDI</text>
  <text x="360" y="274" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#7c3aed">port: ArticleRepository</text>
  <text x="360" y="289" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#7c3aed">port: EventBus, Clock</text>

  <!-- HTTP kirish (chap, tashqarida) -->
  <rect x="40" y="116" width="68" height="56" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="74" y="140" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#92400e">HTTP</text>
  <text x="74" y="156" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#b45309">POST</text>
  <text x="74" y="167" text-anchor="middle" font-family="Consolas, monospace" font-size="8.5" fill="#b45309">/articles</text>

  <!-- Controller (chap, app chetida) -->
  <rect x="128" y="116" width="80" height="56" rx="9" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
  <text x="168" y="138" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="bold" fill="#991b1b">Controller</text>
  <text x="168" y="153" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#b91c1c">+ JWT/RBAC</text>
  <text x="168" y="165" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#b91c1c">middleware</text>

  <!-- Infrastructure adapterlari (pastda qator) -->
  <rect x="44" y="318" width="120" height="80" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="104" y="340" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#166534">SQLite/PDO</text>
  <text x="104" y="357" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#15803d">Repository</text>
  <text x="104" y="372" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#15803d">adapter</text>
  <text x="104" y="388" text-anchor="middle" font-family="Consolas, monospace" font-size="8.5" fill="#15803d">port impl.</text>

  <rect x="184" y="318" width="120" height="80" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="244" y="340" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#166534">Redis kesh</text>
  <text x="244" y="357" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#15803d">PSR-16</text>
  <text x="244" y="372" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#15803d">cache-aside</text>
  <text x="244" y="388" text-anchor="middle" font-family="Consolas, monospace" font-size="8.5" fill="#b45309">array fallback</text>

  <rect x="416" y="318" width="120" height="80" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="476" y="340" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#166534">Messenger</text>
  <text x="476" y="357" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#15803d">navbat</text>
  <text x="476" y="372" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#15803d">email/hisobot</text>
  <text x="476" y="388" text-anchor="middle" font-family="Consolas, monospace" font-size="8.5" fill="#15803d">fon worker</text>

  <rect x="556" y="318" width="120" height="80" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="616" y="340" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#166534">Monolog</text>
  <text x="616" y="357" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#15803d">JSON log</text>
  <text x="616" y="372" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#15803d">correlation</text>
  <text x="616" y="388" text-anchor="middle" font-family="Consolas, monospace" font-size="8.5" fill="#15803d">-id processor</text>

  <!-- Oqlar: tashqaridan ichkariga -->
  <line x1="108" y1="144" x2="126" y2="144" stroke="#2563eb" stroke-width="2.2" marker-end="url(#ar)"/>
  <line x1="208" y1="150" x2="230" y2="170" stroke="#2563eb" stroke-width="2.2" marker-end="url(#ar)"/>
  <line x1="104" y1="316" x2="200" y2="262" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="244" y1="316" x2="270" y2="300" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="476" y1="316" x2="450" y2="300" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="616" y1="316" x2="520" y2="262" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar)"/>

  <text x="360" y="424" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">Adapter'lar port interfeysiga bog'lanadi (DIP) — domen ularni ko'rmaydi; test'da adapter in-memory bilan almashtiriladi.</text>
</svg>
