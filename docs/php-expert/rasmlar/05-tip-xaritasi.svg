<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>PHP 8.4 tip tizimi xaritasi: skalyar turlar, nullable, union, intersection, DNF, hamda maxsus never/void/mixed turlari va ularning o'zaro bog'liqligi</title>

  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">PHP 8.4 tip tizimi xaritasi</text>

  <!-- 1. SKALYAR turlar -->
  <rect x="24" y="58" width="320" height="150" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="24" y="58" width="320" height="30" rx="10" fill="#2563eb"/>
  <rect x="24" y="73" width="320" height="15" fill="#2563eb"/>
  <text x="184" y="79" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">1. Skalyar + nullable</text>
  <text x="40" y="110" font-family="Consolas, monospace" font-size="13" fill="#1e3a8a">int  float  string  bool</text>
  <text x="40" y="132" font-family="Consolas, monospace" font-size="13" fill="#1e3a8a">array  object  callable  iterable</text>
  <text x="40" y="156" font-family="Consolas, monospace" font-size="13" fill="#7c3aed">?int  ?string</text>
  <text x="170" y="156" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748b">= T | null</text>
  <text x="40" y="182" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748b">eng aniq, eng ko'p ishlatiladigan</text>

  <!-- 2. UNION -->
  <rect x="362" y="58" width="334" height="71" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="378" y="82" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">2. UNION:  A | B  ("yoki")</text>
  <text x="378" y="104" font-family="Consolas, monospace" font-size="13" fill="#14532d">int|string    User|null</text>
  <text x="378" y="122" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#64748b">qiymat — bularning BIRI bo'lsa yetarli</text>

  <!-- 3. INTERSECTION -->
  <rect x="362" y="137" width="334" height="71" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="378" y="161" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">3. INTERSECTION:  A &amp; B  ("ham...ham")</text>
  <text x="378" y="183" font-family="Consolas, monospace" font-size="13" fill="#78350f">Countable&amp;Traversable</text>
  <text x="378" y="201" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#64748b">faqat interfeyslar; HAMMASIga mos kelsin</text>

  <!-- 4. DNF -->
  <rect x="24" y="226" width="320" height="92" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="40" y="250" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">4. DNF (8.2):  (A&amp;B) | C</text>
  <text x="40" y="272" font-family="Consolas, monospace" font-size="12.5" fill="#4c1d95">(Countable&amp;Traversable)|null</text>
  <text x="40" y="294" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#64748b">intersection ni union bilan birlashtirish</text>
  <text x="40" y="311" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#64748b">qavslar normal shaklda majburiy</text>

  <!-- 5. Maxsus turlar -->
  <rect x="362" y="226" width="334" height="92" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="378" y="250" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">5. Maxsus (qaytish) turlari</text>
  <text x="378" y="272" font-family="Consolas, monospace" font-size="12.5" fill="#7f1d1d">never</text>
  <text x="440" y="272" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#64748b">hech qachon qaytmaydi (throw/exit)</text>
  <text x="378" y="291" font-family="Consolas, monospace" font-size="12.5" fill="#7f1d1d">void</text>
  <text x="440" y="291" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#64748b">qaytaradi, lekin qiymatsiz</text>
  <text x="378" y="310" font-family="Consolas, monospace" font-size="12.5" fill="#7f1d1d">mixed</text>
  <text x="440" y="310" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#64748b">"tip yo'q" — oxirgi chora</text>

  <!-- pastki aniqlik o'qi -->
  <rect x="24" y="338" width="672" height="64" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="360" y="360" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e293b">Aniqlik o'qi: chapdan o'ngga sari "bilim" kamayadi</text>
  <text x="44" y="386" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#16a34a">int</text>
  <text x="120" y="386" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">→</text>
  <text x="150" y="386" font-family="Consolas, monospace" font-size="13" fill="#2563eb">?int</text>
  <text x="220" y="386" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">→</text>
  <text x="250" y="386" font-family="Consolas, monospace" font-size="13" fill="#f59e0b">int|string</text>
  <text x="370" y="386" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">→</text>
  <text x="400" y="386" font-family="Consolas, monospace" font-size="13" fill="#7c3aed">object</text>
  <text x="490" y="386" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">→</text>
  <text x="520" y="386" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#dc2626">mixed</text>
  <text x="610" y="386" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748b">(qoching)</text>

  <text x="360" y="430" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Qoida: imkon qadar ENG ANIQ turni tanlang — tur shartnoma, hujjat va xatolardan himoya.</text>
  <text x="360" y="452" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">Union faqat zarurat bo'lsa; intersection — interfeys talablari; mixed — deyarli hech qachon.</text>
</svg>
