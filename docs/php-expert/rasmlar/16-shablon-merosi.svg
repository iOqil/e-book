<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450">
  <title>Twig shablon merosi: layout.twig umumiy skeletni va bo'sh block larni belgilaydi, page.twig undan extends qilib faqat block larni to'ldiradi, natijada to'liq HTML hosil bo'ladi</title>

  <rect x="0" y="0" width="720" height="450" fill="#f8fafc"/>

  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Shablon merosi: layout + block</text>
  <text x="360" y="54" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Skeletni bir marta yoz, har sahifa faqat block larni to'ldiradi</text>

  <!-- layout.twig (ota) -->
  <rect x="30" y="80" width="270" height="330" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="30" y="80" width="270" height="32" rx="10" fill="#2563eb"/>
  <text x="165" y="102" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#ffffff">layout.twig (ota skelet)</text>

  <rect x="46" y="124" width="238" height="40" rx="6" fill="#eff6ff"/>
  <text x="58" y="148" font-family="Consolas, monospace" font-size="11.5" fill="#1e3a8a">&lt;html&gt;&lt;head&gt; ... umumiy header</text>

  <rect x="46" y="172" width="238" height="44" rx="6" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="165" y="190" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#7c3aed">{% block title %}</text>
  <text x="165" y="208" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#7c3aed">(bo'sh teshik &#8212; to'ldiriladi)</text>

  <rect x="46" y="224" width="238" height="44" rx="6" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="165" y="242" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#7c3aed">{% block content %}</text>
  <text x="165" y="260" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#7c3aed">(bo'sh teshik &#8212; to'ldiriladi)</text>

  <rect x="46" y="276" width="238" height="40" rx="6" fill="#eff6ff"/>
  <text x="58" y="300" font-family="Consolas, monospace" font-size="11.5" fill="#1e3a8a">&lt;footer&gt; ... umumiy footer</text>
  <text x="165" y="344" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">Skelet + header/footer</text>
  <text x="165" y="362" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">BIR MARTA yoziladi</text>
  <text x="165" y="388" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#16a34a">DRY: takrorlanmaydi</text>

  <!-- extends strelka -->
  <line x1="310" y1="245" x2="400" y2="245" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#o)"/>
  <text x="355" y="234" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#b45309">extends</text>

  <!-- page.twig (bola) -->
  <rect x="410" y="80" width="280" height="150" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="410" y="80" width="280" height="32" rx="10" fill="#16a34a"/>
  <text x="550" y="102" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#ffffff">page.twig (bola)</text>
  <text x="424" y="134" font-family="Consolas, monospace" font-size="11" fill="#14532d">{% extends 'layout.twig' %}</text>
  <text x="424" y="160" font-family="Consolas, monospace" font-size="11" fill="#7c3aed">{% block title %}Profil{% endblock %}</text>
  <text x="424" y="186" font-family="Consolas, monospace" font-size="11" fill="#7c3aed">{% block content %}</text>
  <text x="438" y="204" font-family="Consolas, monospace" font-size="11" fill="#334155">&lt;h1&gt;Salom {{ ism }}&lt;/h1&gt;</text>
  <text x="424" y="222" font-family="Consolas, monospace" font-size="11" fill="#7c3aed">{% endblock %}</text>

  <!-- render strelka pastga -->
  <line x1="550" y1="230" x2="550" y2="262" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>
  <text x="610" y="252" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">render &#8594;</text>

  <!-- natija -->
  <rect x="410" y="270" width="280" height="140" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="550" y="294" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#14532d">Natija: to'liq HTML</text>
  <text x="424" y="318" font-family="Consolas, monospace" font-size="10.5" fill="#334155">&lt;html&gt;&lt;head&gt;...header</text>
  <text x="424" y="338" font-family="Consolas, monospace" font-size="10.5" fill="#7c3aed">  &lt;title&gt;Profil&lt;/title&gt;</text>
  <text x="424" y="358" font-family="Consolas, monospace" font-size="10.5" fill="#7c3aed">  &lt;h1&gt;Salom Oqil&lt;/h1&gt;</text>
  <text x="424" y="378" font-family="Consolas, monospace" font-size="10.5" fill="#334155">  &lt;footer&gt;...footer</text>
  <text x="550" y="400" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#14532d">ota skelet + bola block lari birlashdi</text>

  <defs>
    <marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="s" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
