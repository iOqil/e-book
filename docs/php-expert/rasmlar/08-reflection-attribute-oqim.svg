<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>Atribut-asosli tizimning ish oqimi: kodga yozilgan #[Route] atributi Reflection orqali o'qiladi, getAttributes() ReflectionAttribute beradi, newInstance() esa haqiqiy Route obyektini yaratadi va dispatcher ishlatadi</title>

  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#1e293b">Atributni o'qish oqimi: kod -&gt; Reflection -&gt; obyekt</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- 1. KOD -->
  <rect x="24" y="70" width="200" height="150" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="24" y="70" width="200" height="32" rx="10" fill="#2563eb"/>
  <rect x="24" y="86" width="200" height="16" fill="#2563eb"/>
  <text x="124" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">1. Kod (manba)</text>
  <rect x="38" y="114" width="172" height="92" rx="6" fill="#0f172a"/>
  <text x="50" y="135" font-family="Consolas, monospace" font-size="12" fill="#f472b6">#[Route('/users',</text>
  <text x="50" y="151" font-family="Consolas, monospace" font-size="12" fill="#f472b6">        'GET')]</text>
  <text x="50" y="171" font-family="Consolas, monospace" font-size="12" fill="#60a5fa">public function</text>
  <text x="50" y="187" font-family="Consolas, monospace" font-size="12" fill="#4ade80">  index() {...}</text>
  <text x="124" y="234" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#64748b">atribut = passiv metadata</text>

  <!-- 2. REFLECTION -->
  <rect x="260" y="70" width="200" height="150" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="260" y="70" width="200" height="32" rx="10" fill="#7c3aed"/>
  <rect x="260" y="86" width="200" height="16" fill="#7c3aed"/>
  <text x="360" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">2. Reflection</text>
  <rect x="274" y="114" width="172" height="92" rx="6" fill="#f5f3ff"/>
  <text x="284" y="136" font-family="Consolas, monospace" font-size="11.5" fill="#5b21b6">new ReflectionClass</text>
  <text x="284" y="156" font-family="Consolas, monospace" font-size="11.5" fill="#5b21b6">-&gt;getMethods()</text>
  <text x="284" y="176" font-family="Consolas, monospace" font-size="11.5" fill="#5b21b6">-&gt;getAttributes(</text>
  <text x="284" y="192" font-family="Consolas, monospace" font-size="11.5" fill="#5b21b6">   Route::class)</text>
  <text x="360" y="234" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#64748b">tuzilmani O'QIYDI</text>

  <!-- 3. newInstance -->
  <rect x="496" y="70" width="200" height="150" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="496" y="70" width="200" height="32" rx="10" fill="#16a34a"/>
  <rect x="496" y="86" width="200" height="16" fill="#16a34a"/>
  <text x="596" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">3. newInstance()</text>
  <rect x="510" y="114" width="172" height="92" rx="6" fill="#f0fdf4"/>
  <text x="520" y="138" font-family="Consolas, monospace" font-size="11.5" fill="#14532d">$attr-&gt;newInstance()</text>
  <text x="520" y="160" font-family="Consolas, monospace" font-size="11.5" fill="#166534">=&gt; new Route(</text>
  <text x="520" y="178" font-family="Consolas, monospace" font-size="11.5" fill="#166534">     '/users','GET')</text>
  <text x="520" y="196" font-family="Consolas, monospace" font-size="11.5" fill="#166534">// haqiqiy obyekt!</text>
  <text x="596" y="234" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#64748b">obyektga AYLANTIRADI</text>

  <!-- strelkalar -->
  <line x1="224" y1="145" x2="256" y2="145" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="460" y1="145" x2="492" y2="145" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 4. DISPATCHER -->
  <rect x="180" y="278" width="360" height="74" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="304" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#92400e">4. Dispatcher / Framework "sehri"</text>
  <text x="360" y="326" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#78350f">Route obyektlaridan marshrut jadvali quriladi va</text>
  <text x="360" y="344" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#78350f">kelgan so'rovga mos kontroller chaqiriladi.</text>

  <line x1="596" y1="220" x2="540" y2="300" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- pastki ogohlantirish -->
  <rect x="24" y="378" width="672" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="360" y="398" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#991b1b">Reflection SEKIN: production'da bir marta o'qib, natijani keshlang (massiv/PHP fayl).</text>
  <text x="360" y="415" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#7f1d1d">Har so'rovda qaytadan Reflection ishlatish — eng keng tarqalgan performance xatosi.</text>
</svg>
