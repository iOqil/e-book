<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450">
  <title>Retry va eksponensial backoff sxemasi: 503 va 429 javoblar qayta uriniladi, har urinishda kutish vaqti ikki barobar oshadi (200ms, 400ms, 800ms) ustiga jitter qo'shiladi; 200 muvaffaqiyatda to'xtaydi, 4xx xatolar umuman qayta urinilmaydi</title>

  <rect x="0" y="0" width="720" height="450" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#1e293b">Retry + eksponensial backoff (jitter bilan)</text>

  <defs>
    <marker id="rb-ar" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#475569"/>
    </marker>
    <marker id="rb-arg" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- vaqt o'qi -->
  <line x1="40" y1="160" x2="680" y2="160" stroke="#cbd5e1" stroke-width="2" marker-end="url(#rb-ar)"/>
  <text x="676" y="182" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#94a3b8">vaqt</text>

  <!-- Urinish 1: 503 -->
  <rect x="48" y="118" width="118" height="42" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="107" y="135" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#1e293b">Urinish 1</text>
  <text x="107" y="152" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#dc2626">503</text>

  <!-- backoff 1 -->
  <path d="M166 139 q26 -28 52 0" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#rb-ar)"/>
  <text x="192" y="104" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="11" fill="#b45309">~200ms</text>

  <!-- Urinish 2: 503 -->
  <rect x="220" y="118" width="118" height="42" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="279" y="135" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#1e293b">Urinish 2</text>
  <text x="279" y="152" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#dc2626">503</text>

  <!-- backoff 2 -->
  <path d="M338 139 q34 -36 68 0" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#rb-ar)"/>
  <text x="372" y="96" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="11" fill="#b45309">~400ms</text>

  <!-- Urinish 3: 200 -->
  <rect x="408" y="118" width="118" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="467" y="135" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#1e293b">Urinish 3</text>
  <text x="467" y="152" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="11.5" font-weight="bold" fill="#16a34a">200 OK</text>

  <!-- muvaffaqiyat -> to'xtash -->
  <line x1="526" y1="139" x2="588" y2="139" stroke="#16a34a" stroke-width="2.5" marker-end="url(#rb-arg)"/>
  <rect x="590" y="120" width="96" height="38" rx="8" fill="#16a34a"/>
  <text x="638" y="135" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff">TO'XTASH</text>
  <text x="638" y="151" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#dcfce7">natija qaytadi</text>

  <!-- formula -->
  <rect x="40" y="208" width="640" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="360" y="231" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#1e293b">Kutish vaqti formulasi</text>
  <text x="360" y="252" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" fill="#1e293b">backoff = base * 2^(n-1)  +  jitter (0..backoff/2 tasodifiy)</text>

  <!-- ikki ustun: qayta urin vs urinma -->
  <rect x="40" y="288" width="312" height="142" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="40" y="288" width="312" height="32" rx="10" fill="#16a34a"/>
  <rect x="40" y="304" width="312" height="16" fill="#16a34a"/>
  <text x="196" y="310" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#ffffff">QAYTA URINILADI</text>
  <text x="60" y="346" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="bold" fill="#16a34a">5xx</text>
  <text x="110" y="346" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">server vaqtincha nosoz</text>
  <text x="60" y="372" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="bold" fill="#16a34a">429</text>
  <text x="110" y="372" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">limit oshdi (Retry-After)</text>
  <text x="60" y="398" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">tarmoq</text>
  <text x="130" y="398" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">timeout, ulanmadi</text>
  <text x="60" y="420" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#94a3b8">jitter: "retry bo'roni" ni yoyadi</text>

  <rect x="368" y="288" width="312" height="142" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="368" y="288" width="312" height="32" rx="10" fill="#dc2626"/>
  <rect x="368" y="304" width="312" height="16" fill="#dc2626"/>
  <text x="524" y="310" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#ffffff">QAYTA URINILMAYDI</text>
  <text x="388" y="346" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="bold" fill="#dc2626">400</text>
  <text x="438" y="346" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">xato so'rov</text>
  <text x="388" y="372" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="bold" fill="#dc2626">401</text>
  <text x="438" y="372" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">autentifikatsiya</text>
  <text x="388" y="398" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="bold" fill="#dc2626">404</text>
  <text x="438" y="398" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">topilmadi</text>
  <text x="388" y="420" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#94a3b8">qayta urinish foydasiz -> darhol xato</text>
</svg>
