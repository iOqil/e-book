<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>Fiber suspend/resume oqimi: main thread Fiber::start() bilan fiberni ishga tushiradi; fiber Fiber::suspend(v) bilan boshqaruvni va v qiymatini main'ga qaytaradi; main $fiber->resume(r) bilan r ni suspend'ga qaytarib fiberni davom ettiradi. Stackful: fiber o'z stegini saqlaydi.</title>

  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>

  <text x="360" y="30" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Fiber: suspend / resume oqimi</text>
  <text x="360" y="52" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Stackful koroutina - ikki yo'nalishda qiymat almashinadi, callback hell yo'q</text>

  <!-- ikki ustun: main va fiber -->
  <rect x="40" y="74" width="260" height="300" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e40af">main (asosiy oqim)</text>

  <rect x="420" y="74" width="260" height="300" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="550" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#6d28d9">fiber (koroutina)</text>

  <!-- main qadamlar -->
  <rect x="56" y="116" width="228" height="34" rx="6" fill="#dbeafe"/>
  <text x="170" y="138" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#1e3a8a">$f = new Fiber(fn)</text>

  <rect x="56" y="166" width="228" height="34" rx="6" fill="#dbeafe"/>
  <text x="170" y="188" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#1e3a8a">$v = $f->start()</text>

  <rect x="56" y="256" width="228" height="34" rx="6" fill="#dbeafe"/>
  <text x="170" y="278" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#1e3a8a">$f->resume($r)</text>

  <rect x="56" y="330" width="228" height="34" rx="6" fill="#dbeafe"/>
  <text x="170" y="352" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#1e3a8a">isTerminated() -> true</text>

  <!-- fiber qadamlar -->
  <rect x="436" y="166" width="228" height="34" rx="6" fill="#ede9fe"/>
  <text x="550" y="188" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#5b21b6">ishlaydi... suspend($v)</text>

  <rect x="436" y="256" width="228" height="34" rx="6" fill="#ede9fe"/>
  <text x="550" y="272" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#5b21b6">$r = suspend natijasi</text>
  <text x="550" y="286" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#5b21b6">davom etadi, tugaydi</text>

  <!-- strelkalar: start -> fiber boshlanadi -->
  <path d="M284,183 L432,183" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#a1)"/>
  <text x="358" y="176" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#2563eb">start: fiberga o'tadi</text>

  <!-- suspend(v) -> main ga qaytadi -->
  <path d="M436,196 C360,224 360,214 284,182" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#a2)"/>
  <text x="360" y="222" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#7c3aed">suspend(v): main'ga v qaytadi</text>

  <!-- resume(r) -> fiber davom -->
  <path d="M284,273 L432,273" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#a1)"/>
  <text x="358" y="248" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#2563eb">resume(r): suspend'ga r qaytadi</text>

  <!-- fiber tugadi -> main -->
  <path d="M436,286 C360,320 360,330 284,347" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#a2)"/>
  <text x="360" y="320" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#7c3aed">tugadi: boshqaruv main'ga</text>

  <!-- pastki izoh -->
  <text x="360" y="400" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#334155">Stackful: fiber suspend paytida o'z chaqiruv stegini (lokal o'zgaruvchilar) SAQLAYDI -</text>
  <text x="360" y="420" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#334155">resume'da aynan to'xtagan joyidan davom etadi. async/await aynan shuning ustiga quriladi.</text>

  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
</svg>
