<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>Immutable withX oqimi: dastlabki obyekt o'zgartirilmaydi; withEmail() chaqirilganda mavjud maydonlar nusxalanadi, faqat bitta maydon yangilanadi va YANGI obyekt qaytariladi; eski obyekt o'zgarmaganicha qoladi</title>

  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>

  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#1e293b">Immutable yangilash: withEmail() oqimi</text>
  <text x="360" y="53" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">o'zgartirmaymiz — nusxalaymiz va o'zgartirilgan YANGI nusxani qaytaramiz</text>

  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Eski obyekt -->
  <rect x="34" y="110" width="190" height="150" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="34" y="110" width="190" height="30" rx="12" fill="#2563eb"/>
  <rect x="34" y="126" width="190" height="14" fill="#2563eb"/>
  <text x="129" y="131" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="bold" fill="#ffffff">$u1  (eski)</text>
  <text x="50" y="166" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#1e293b">name  = "Oqil"</text>
  <text x="50" y="190" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#dc2626">email = "a@x.uz"</text>
  <text x="50" y="214" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#1e293b">active = true</text>
  <text x="129" y="244" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#16a34a">O'ZGARMAYDI</text>

  <!-- Markaz: withEmail jarayoni -->
  <rect x="266" y="96" width="188" height="180" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="360" y="120" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12.5" font-weight="bold" fill="#7c3aed">withEmail("b@x.uz")</text>
  <line x1="282" y1="132" x2="438" y2="132" stroke="#7c3aed" stroke-width="1"/>
  <text x="282" y="153" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">1. mavjud maydonlarni</text>
  <text x="298" y="169" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">o'qiymiz (name, active)</text>
  <text x="282" y="192" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">2. email ni YANGISIGA</text>
  <text x="298" y="208" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">almashtiramiz</text>
  <text x="282" y="231" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">3. new self(...) yoki</text>
  <text x="298" y="247" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">clone (8.3) qilamiz</text>
  <text x="360" y="268" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#7c3aed">return new self(...)</text>

  <!-- Yangi obyekt -->
  <rect x="496" y="110" width="190" height="150" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="496" y="110" width="190" height="30" rx="12" fill="#16a34a"/>
  <rect x="496" y="126" width="190" height="14" fill="#16a34a"/>
  <text x="591" y="131" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="bold" fill="#ffffff">$u2  (yangi)</text>
  <text x="512" y="166" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#1e293b">name  = "Oqil"</text>
  <text x="512" y="190" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#16a34a">email = "b@x.uz"</text>
  <text x="512" y="214" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#1e293b">active = true</text>
  <text x="591" y="244" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#7c3aed">ALOHIDA OBYEKT</text>

  <!-- strelkalar -->
  <line x1="224" y1="185" x2="264" y2="185" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="456" y1="185" x2="494" y2="185" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr)"/>

  <!-- pastki xulosa -->
  <rect x="34" y="300" width="652" height="116" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="360" y="324" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">$u1 === $u2  ->  false  (ikki xil obyekt)</text>
  <text x="52" y="350" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#475569">$u1 = new User("Oqil", "a@x.uz");</text>
  <text x="52" y="372" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#475569">$u2 = $u1-&gt;withEmail("b@x.uz");   // $u1 hali ham "a@x.uz"</text>
  <text x="360" y="400" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">Mutatsiya yo'q -> kod oldindan aytib bo'ladigan, thread-xavfsiz, bug kam</text>
</svg>
