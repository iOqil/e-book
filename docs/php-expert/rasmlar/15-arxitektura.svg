<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>Mini-framework arxitekturasi: index.php (front controller) ServerRequest quradi va Application (kernel) ga beradi; kernel ichida DI konteyner, router va middleware pipeline birga ishlaydi; pipeline so'rovni kontrollerga olib boradi, kontroller Response qaytaradi, u emit qilinadi</title>

  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>

  <text x="360" y="30" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#1e293b">Mini-framework arxitekturasi</text>
  <text x="360" y="51" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">index.php -> kernel -> middleware -> router -> controller -> response</text>

  <defs>
    <marker id="aflow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- index.php front controller -->
  <rect x="30" y="180" width="120" height="70" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="90" y="208" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="bold" fill="#2563eb">index.php</text>
  <text x="90" y="227" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">front</text>
  <text x="90" y="242" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">controller</text>

  <!-- KERNEL katta quti -->
  <rect x="200" y="80" width="350" height="290" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="375" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">Application (KERNEL)</text>

  <!-- DI konteyner -->
  <rect x="222" y="120" width="140" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="292" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#7c3aed">DI konteyner</text>
  <text x="292" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#475569">autowire (13-bob)</text>
  <text x="292" y="177" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#64748b">PSR-11</text>

  <!-- Router -->
  <rect x="388" y="120" width="140" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="458" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#16a34a">Router</text>
  <text x="458" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#475569">match (14-bob)</text>
  <text x="458" y="177" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#64748b">/users/{id}</text>

  <!-- Middleware pipeline -->
  <rect x="222" y="206" width="306" height="60" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="375" y="230" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#1e293b">Middleware pipeline (PSR-15)</text>
  <text x="375" y="250" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#475569">Error -> Auth -> ... -> RouteRunner (12-bob)</text>

  <!-- Controller -->
  <rect x="280" y="290" width="190" height="60" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="375" y="314" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#dc2626">Controller</text>
  <text x="375" y="334" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#475569">konteynerdan autowire</text>

  <!-- Response chiqishi -->
  <rect x="588" y="180" width="110" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="643" y="208" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">Response</text>
  <text x="643" y="227" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#475569">emit ()</text>
  <text x="643" y="242" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#64748b">PSR-7</text>

  <!-- oqim chiziqlari -->
  <line x1="150" y1="215" x2="198" y2="215" stroke="#2563eb" stroke-width="2.2" marker-end="url(#aflow)"/>
  <text x="174" y="207" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9.5" fill="#475569">Request</text>

  <line x1="375" y1="184" x2="375" y2="204" stroke="#2563eb" stroke-width="2" marker-end="url(#aflow)"/>
  <line x1="375" y1="266" x2="375" y2="288" stroke="#2563eb" stroke-width="2" marker-end="url(#aflow)"/>

  <line x1="528" y1="215" x2="586" y2="215" stroke="#2563eb" stroke-width="2.2" marker-end="url(#aflow)"/>
  <text x="557" y="207" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9.5" fill="#475569">Response</text>

  <!-- pastki izoh -->
  <text x="360" y="400" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">Laravel'dagi $request, Route::get(), middleware, service container — aslida shu uch qism.</text>
  <text x="360" y="420" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#64748b">DI konteyner (binafsha) + Router (yashil) + Pipeline (sariq) -> Kernel ularni birga bog'laydi.</text>
</svg>
