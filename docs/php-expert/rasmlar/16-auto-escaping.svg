<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>Twig auto-escaping: foydalanuvchidan kelgan xavfli XSS payload ({{ izoh }}) avtomatik escape qilinib, brauzerda matn sifatida ko'rsatiladi va skript ishlamaydi</title>

  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>

  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Twig avtomatik escaping: XSS qalqoni</text>
  <text x="360" y="54" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Xavfli kirish &#8594; {{ }} avto-escape &#8594; xavfsiz chiqish</text>

  <!-- 1. Xavfli kirish -->
  <rect x="30" y="90" width="200" height="120" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="130" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">1. Xavfli kirish</text>
  <text x="130" y="136" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">foydalanuvchi kiritmasi</text>
  <rect x="46" y="148" width="168" height="48" rx="6" fill="#fef2f2"/>
  <text x="130" y="168" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#dc2626">&lt;script&gt;alert(</text>
  <text x="130" y="184" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#dc2626">'XSS')&lt;/script&gt;</text>

  <!-- strelka 1 -->
  <line x1="230" y1="150" x2="300" y2="150" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- 2. Twig dvigatel -->
  <rect x="300" y="90" width="200" height="120" rx="10" fill="#7c3aed"/>
  <text x="400" y="118" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">2. Twig {{ izoh }}</text>
  <text x="400" y="142" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#ede9fe">avtomatik escape</text>
  <text x="400" y="162" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#ede9fe">htmlspecialchars()</text>
  <text x="400" y="182" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#ddd6fe">&lt; &#8594; &amp;lt;   &quot; &#8594; &amp;quot;</text>
  <text x="400" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#ddd6fe">avtomatik, unutib bo'lmaydi</text>

  <!-- strelka 2 -->
  <line x1="500" y1="150" x2="570" y2="150" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)"/>

  <!-- 3. Xavfsiz chiqish -->
  <rect x="570" y="90" width="120" height="120" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="630" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#14532d">3. Xavfsiz</text>
  <text x="630" y="133" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#14532d">chiqish</text>
  <rect x="582" y="146" width="96" height="50" rx="6" fill="#f0fdf4"/>
  <text x="630" y="165" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#16a34a">&amp;lt;script&amp;gt;</text>
  <text x="630" y="180" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#16a34a">...&amp;lt;/script&amp;gt;</text>

  <!-- pastki: brauzer natijasi taqqoslash -->
  <rect x="30" y="240" width="320" height="170" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="190" y="266" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#991b1b">Escape BO'LMASA (xom)</text>
  <text x="48" y="292" font-family="Consolas, monospace" font-size="11" fill="#334155">&lt;p&gt;&lt;script&gt;alert('XSS')&lt;/script&gt;&lt;/p&gt;</text>
  <text x="48" y="316" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">Brauzer buni KOD deb biladi &#8594;</text>
  <rect x="48" y="328" width="284" height="34" rx="6" fill="#dc2626"/>
  <text x="190" y="350" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff">alert oynasi ochiladi &#8212; XSS hujum!</text>
  <text x="190" y="388" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#991b1b">sessiya o'g'irlash, sahifani buzish</text>

  <rect x="370" y="240" width="320" height="170" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="530" y="266" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#14532d">Escape BO'LSA (Twig)</text>
  <text x="388" y="292" font-family="Consolas, monospace" font-size="11" fill="#334155">&lt;p&gt;&amp;lt;script&amp;gt;...&amp;lt;/script&amp;gt;&lt;/p&gt;</text>
  <text x="388" y="316" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">Brauzer buni MATN deb biladi &#8594;</text>
  <rect x="388" y="328" width="284" height="34" rx="6" fill="#16a34a"/>
  <text x="530" y="350" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff">&lt;script&gt;alert('XSS')&lt;/script&gt; matni</text>
  <text x="530" y="388" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#14532d">skript ISHLAMAYDI &#8212; xavfsiz</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
