<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>OPcache va JIT oqimi: PHP manba kod -> tokenize/parse -> opcode kompilyatsiya. OPcache opcode'larni shared memory'da saqlaydi, shuning uchun ikkinchi so'rovda qayta kompilyatsiya bo'lmaydi (kesh hit). JIT esa qaynoq opcode'larni mashina kodiga aylantiradi (CPU-bound ish uchun).</title>

  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>

  <text x="360" y="30" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">OPcache va JIT: kod &#8594; opcode &#8594; kesh &#8594; mashina kodi</text>
  <text x="360" y="52" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">OPcache'siz har so'rovda qayta kompilyatsiya; OPcache bilan bir marta</text>

  <!-- 1-so'rov: COLD -->
  <text x="44" y="86" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">1-so'rov (sovuq): kompilyatsiya bo'ladi</text>

  <!-- manba -->
  <rect x="24" y="96" width="116" height="62" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="82" y="122" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">PHP manba</text>
  <text x="82" y="140" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#1e40af">.php fayl</text>

  <line x1="140" y1="127" x2="166" y2="127" stroke="#475569" stroke-width="2.2" marker-end="url(#ar)"/>

  <!-- parse -->
  <rect x="168" y="96" width="116" height="62" rx="9" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="226" y="120" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#b45309">Tokenize +</text>
  <text x="226" y="137" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#b45309">parse (AST)</text>
  <text x="226" y="152" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#a16207">qimmat</text>

  <line x1="284" y1="127" x2="310" y2="127" stroke="#475569" stroke-width="2.2" marker-end="url(#ar)"/>

  <!-- opcode -->
  <rect x="312" y="96" width="116" height="62" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="370" y="120" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#6d28d9">Opcode</text>
  <text x="370" y="137" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#6d28d9">kompilyatsiya</text>
  <text x="370" y="152" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#6d28d9">Zend VM</text>

  <line x1="428" y1="127" x2="454" y2="127" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>

  <!-- shared memory kesh -->
  <rect x="456" y="86" width="156" height="84" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="534" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="bold" fill="#15803d">OPcache</text>
  <text x="534" y="128" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#166534">shared memory (SHM)</text>
  <text x="534" y="146" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#166534">opcode saqlanadi</text>
  <text x="534" y="162" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#15803d">bir marta</text>

  <!-- 2-so'rov: HOT -->
  <text x="44" y="206" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">2-so'rov (issiq): parse/kompilyatsiya O'TKAZIB yuboriladi (kesh HIT)</text>

  <rect x="24" y="216" width="116" height="50" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="82" y="246" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="bold" fill="#1d4ed8">PHP so'rov</text>

  <path d="M140 241 L300 241 L300 168" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-dasharray="6 4" marker-end="url(#ag)"/>
  <text x="300" y="198" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#15803d" font-weight="bold">to'g'ridan keshdan</text>

  <!-- JIT -->
  <line x1="534" y1="170" x2="534" y2="200" stroke="#dc2626" stroke-width="2.4" marker-end="url(#ad)"/>
  <rect x="440" y="204" width="188" height="74" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="534" y="227" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="bold" fill="#b91c1c">JIT (ixtiyoriy)</text>
  <text x="534" y="245" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#991b1b">qaynoq opcode &#8594; mashina kodi</text>
  <text x="534" y="262" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#b91c1c">tracing / function rejim</text>
  <text x="534" y="274" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#991b1b">jit_buffer_size</text>

  <!-- pastki izoh -->
  <rect x="24" y="296" width="672" height="124" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="320" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Asosiy farq</text>

  <circle cx="52" cy="343" r="4" fill="#16a34a"/>
  <text x="64" y="347" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">OPcache hammaga foyda: parse+kompilyatsiya har so'rovda emas, bir marta &#8212; PRODUCTIONDA SHART.</text>

  <circle cx="52" cy="367" r="4" fill="#dc2626"/>
  <text x="64" y="371" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">JIT faqat CPU-bound (matematika, image, ML) ga yordam beradi; tipik I/O-bound veb'da deyarli 0.</text>

  <circle cx="52" cy="391" r="4" fill="#7c3aed"/>
  <text x="64" y="395" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Productionda: opcache.validate_timestamps=0 (fayl o'zgardimi tekshirmaydi &#8594; tez), deploy'da reset.</text>

  <circle cx="52" cy="414" r="4" fill="#2563eb"/>
  <text x="64" y="418" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Preloading: framework yadrosini start'da bir marta yuklab, cold-start'ni yanada tezlatadi.</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="ad" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#dc2626"/></marker>
  </defs>
</svg>
