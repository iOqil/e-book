<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Segoe UI, sans-serif" font-size="13">
  <title>HTTP so'rov va javob xabarining anatomiyasi: start qatori, sarlavhalar, tana</title>
  <rect width="720" height="440" fill="#f8fafc"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">HTTP xabar anatomiyasi</text>

  <!-- REQUEST -->
  <rect x="24" y="48" width="320" height="360" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="24" y="48" width="320" height="34" rx="10" fill="#2563eb"/>
  <text x="184" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">SO'ROV (Request)</text>

  <!-- request start line -->
  <rect x="40" y="96" width="288" height="40" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="48" y="113" font-weight="bold" fill="#1e3a8a">Start qatori</text>
  <text x="48" y="130" font-family="Consolas, monospace" fill="#0f172a">POST /api/users?role=admin HTTP/1.1</text>

  <text x="40" y="156" font-size="11" fill="#64748b">metod · target/URI · protokol</text>

  <!-- request headers -->
  <rect x="40" y="166" width="288" height="118" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="48" y="183" font-weight="bold" fill="#166534">Sarlavhalar (Headers)</text>
  <text x="48" y="204" font-family="Consolas, monospace" fill="#0f172a">Host: api.example.uz</text>
  <text x="48" y="223" font-family="Consolas, monospace" fill="#0f172a">Content-Type: application/json</text>
  <text x="48" y="242" font-family="Consolas, monospace" fill="#0f172a">Accept: application/json</text>
  <text x="48" y="261" font-family="Consolas, monospace" fill="#0f172a">Content-Length: 24</text>
  <text x="48" y="278" font-size="11" fill="#64748b">nom: qiymat juftliklari</text>

  <!-- request body -->
  <rect x="40" y="294" width="288" height="98" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="48" y="311" font-weight="bold" fill="#92400e">Tana (Body)</text>
  <text x="48" y="334" font-family="Consolas, monospace" fill="#0f172a">{</text>
  <text x="62" y="352" font-family="Consolas, monospace" fill="#0f172a">"name": "Oqil",</text>
  <text x="62" y="370" font-family="Consolas, monospace" fill="#0f172a">"age": 30</text>
  <text x="48" y="388" font-family="Consolas, monospace" fill="#0f172a">}</text>

  <!-- arrow -->
  <line x1="352" y1="228" x2="368" y2="228" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar)"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- RESPONSE -->
  <rect x="376" y="48" width="320" height="360" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="376" y="48" width="320" height="34" rx="10" fill="#dc2626"/>
  <text x="536" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">JAVOB (Response)</text>

  <!-- response status line -->
  <rect x="392" y="96" width="288" height="40" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="400" y="113" font-weight="bold" fill="#991b1b">Status qatori</text>
  <text x="400" y="130" font-family="Consolas, monospace" fill="#0f172a">HTTP/1.1 201 Created</text>
  <text x="392" y="156" font-size="11" fill="#64748b">protokol · status kodi · sabab</text>

  <!-- response headers -->
  <rect x="392" y="166" width="288" height="118" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="400" y="183" font-weight="bold" fill="#166534">Sarlavhalar (Headers)</text>
  <text x="400" y="204" font-family="Consolas, monospace" fill="#0f172a">Content-Type: application/json</text>
  <text x="400" y="223" font-family="Consolas, monospace" fill="#0f172a">Location: /api/users/7</text>
  <text x="400" y="242" font-family="Consolas, monospace" fill="#0f172a">Cache-Control: no-store</text>
  <text x="400" y="261" font-family="Consolas, monospace" fill="#0f172a">X-Powered-By: Mini-FW</text>
  <text x="400" y="278" font-size="11" fill="#64748b">metama'lumot</text>

  <!-- response body -->
  <rect x="392" y="294" width="288" height="98" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="400" y="311" font-weight="bold" fill="#92400e">Tana (Body)</text>
  <text x="400" y="334" font-family="Consolas, monospace" fill="#0f172a">{</text>
  <text x="414" y="352" font-family="Consolas, monospace" fill="#0f172a">"id": 7,</text>
  <text x="414" y="370" font-family="Consolas, monospace" fill="#0f172a">"name": "Oqil"</text>
  <text x="400" y="388" font-family="Consolas, monospace" fill="#0f172a">}</text>

  <text x="360" y="430" text-anchor="middle" font-size="12" fill="#475569">PSR-7 da har bo'lak — obyekt metodi: getMethod(), getHeaderLine(), getBody(), getStatusCode()</text>
</svg>
