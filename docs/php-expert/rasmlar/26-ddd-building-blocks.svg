<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>DDD taktik bloklari: Aggregate Root (Order) consistency chegarasi ichida Entity (OrderLine) va Value Object (Money, ProductId) ni saqlaydi; faqat root orqali ozgartiriladi va invariantlarni qorigaydi. Aggregate joylashtirilganda Domain Event (OrderPlaced) chiqaradi. Repository aggregate ni butunligicha saqlaydi va tiklaydi.</title>

  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>
  <text x="360" y="28" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">DDD taktik bloklari: Aggregate chegarasi</text>

  <defs>
    <marker id="ar26a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
    <marker id="ev26a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- AGGREGATE chegarasi (consistency boundary) -->
  <rect x="40" y="56" width="380" height="252" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="9 5"/>
  <text x="230" y="80" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="bold" fill="#1e40af">AGGREGATE (consistency chegarasi)</text>

  <!-- AGGREGATE ROOT: Order -->
  <rect x="64" y="92" width="332" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="230" y="113" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#1e3a8a">Order  &#171;Aggregate Root&#187;</text>
  <text x="230" y="132" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#1e40af">yagona kirish nuqtasi - identity (id) bilan</text>
  <text x="230" y="147" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#1e40af">invariantlarni qorigaydi: faqat root orqali ozgartirish</text>

  <!-- ENTITY: OrderLine -->
  <rect x="64" y="168" width="160" height="62" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="144" y="189" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#166534">OrderLine</text>
  <text x="144" y="206" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#15803d">&#171;Entity&#187;</text>
  <text x="144" y="221" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#16a34a">tenglik: identity</text>

  <!-- VALUE OBJECTS -->
  <rect x="236" y="168" width="160" height="28" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="316" y="187" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#5b21b6">Money  &#171;Value Object&#187;</text>
  <rect x="236" y="202" width="160" height="28" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="316" y="221" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#5b21b6">ProductId  &#171;VO&#187;</text>

  <!-- VO izoh -->
  <text x="316" y="252" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#7c3aed">immutable - tenglik QIYMAT boyicha</text>

  <!-- root -> entity strelka -->
  <line x1="144" y1="154" x2="144" y2="166" stroke="#475569" stroke-width="1.6" marker-end="url(#ar26a)"/>
  <line x1="290" y1="154" x2="300" y2="166" stroke="#475569" stroke-width="1.6" marker-end="url(#ar26a)"/>

  <!-- invariant izoh -->
  <rect x="64" y="266" width="332" height="30" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="230" y="285" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#991b1b">INVARIANT: bosh buyurtma joylanmaydi, dublikat mahsulot yoq</text>

  <!-- DOMAIN EVENT -->
  <rect x="500" y="92" width="180" height="70" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="590" y="116" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" font-weight="bold" fill="#92400e">OrderPlaced</text>
  <text x="590" y="134" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#b45309">&#171;Domain Event&#187;</text>
  <text x="590" y="150" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#d97706">"muhim narsa sodir boldi"</text>

  <!-- root -> event strelka -->
  <line x1="396" y1="120" x2="498" y2="120" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#ev26a)"/>
  <text x="447" y="112" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#b45309">place()</text>

  <!-- REPOSITORY -->
  <rect x="500" y="200" width="180" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="590" y="224" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#166534">OrderRepository</text>
  <text x="590" y="242" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#15803d">&#171;domen interfeysi&#187;</text>
  <text x="590" y="258" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#16a34a">aggregate ni BUTUNLIGICHA saqlaydi</text>

  <!-- repo <-> aggregate strelka -->
  <line x1="420" y1="220" x2="498" y2="225" stroke="#475569" stroke-width="1.8" marker-end="url(#ar26a)"/>
  <line x1="498" y1="245" x2="422" y2="240" stroke="#475569" stroke-width="1.8" marker-end="url(#ar26a)"/>
  <text x="460" y="218" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#475569">save</text>
  <text x="460" y="258" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#475569">get</text>

  <!-- pastki izoh -->
  <rect x="40" y="324" width="640" height="40" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="360" y="342" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">Qoida: tashqi kod faqat Aggregate Root (Order) bilan gaplashadi - OrderLine ga togridan-togri tegmaydi.</text>
  <text x="360" y="358" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">Bir tranzaksiya = bir aggregate. Boshqa aggregate larga Domain Event orqali (eventual consistency) ulanadi.</text>

  <!-- legend -->
  <rect x="40" y="376" width="640" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="58" y="390" width="16" height="16" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="82" y="403" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">Aggregate Root</text>
  <rect x="190" y="390" width="16" height="16" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="214" y="403" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">Entity</text>
  <rect x="282" y="390" width="16" height="16" rx="3" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="306" y="403" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">Value Object</text>
  <rect x="408" y="390" width="16" height="16" rx="3" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="432" y="403" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">Domain Event</text>
  <rect x="540" y="390" width="16" height="16" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="564" y="403" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">Repository</text>
</svg>
