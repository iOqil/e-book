<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>So'rov oqimi qatlamlar bo'ylab: Controller xom so'rovni DTO (RegisterUserCommand) ga aylantiradi, Application Service DTO'ni qabul qilib Value Object (Email) yaratadi va Repository interfeysi orqali Entity'ni saqlaydi, Repository DB bilan gaplashadi, javob esa UserView DTO sifatida qaytadi. Domen Entity tashqariga oqib chiqmaydi.</title>

  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>
  <text x="360" y="28" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Qatlamlar oqimi: Controller &#8594; Service &#8594; Repository &#8594; DB</text>

  <defs>
    <marker id="fw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
    <marker id="bw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Controller -->
  <rect x="24" y="70" width="150" height="74" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="24" y="70" width="150" height="26" rx="10" fill="#2563eb"/>
  <rect x="24" y="83" width="150" height="13" fill="#2563eb"/>
  <text x="99" y="88" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Controller</text>
  <text x="99" y="116" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">HTTP body &#8594; DTO</text>
  <text x="99" y="133" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">javobni JSON qiladi</text>

  <!-- Application Service -->
  <rect x="208" y="70" width="160" height="74" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="208" y="70" width="160" height="26" rx="10" fill="#7c3aed"/>
  <rect x="208" y="83" width="160" height="13" fill="#7c3aed"/>
  <text x="288" y="88" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">App Service</text>
  <text x="288" y="116" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">use-case mantiq</text>
  <text x="288" y="133" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">VO yaratadi, qoida</text>

  <!-- Repository -->
  <rect x="402" y="70" width="150" height="74" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="402" y="70" width="150" height="26" rx="10" fill="#16a34a"/>
  <rect x="402" y="83" width="150" height="13" fill="#16a34a"/>
  <text x="477" y="88" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Repository</text>
  <text x="477" y="116" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">Entity &#8596; qator</text>
  <text x="477" y="133" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">(Data Mapper)</text>

  <!-- DB -->
  <rect x="586" y="70" width="110" height="74" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="641" y="100" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#92400e">DB</text>
  <text x="641" y="122" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#b45309">sqlite</text>
  <text x="641" y="137" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#b45309">/MySQL</text>

  <!-- oldinga oqlar -->
  <line x1="174" y1="100" x2="204" y2="100" stroke="#2563eb" stroke-width="2.4" marker-end="url(#fw)"/>
  <line x1="368" y1="100" x2="398" y2="100" stroke="#2563eb" stroke-width="2.4" marker-end="url(#fw)"/>
  <line x1="552" y1="100" x2="582" y2="100" stroke="#2563eb" stroke-width="2.4" marker-end="url(#fw)"/>

  <!-- orqaga oqlar (javob) -->
  <line x1="582" y1="158" x2="552" y2="158" stroke="#16a34a" stroke-width="2.2" marker-end="url(#bw)"/>
  <line x1="398" y1="158" x2="368" y2="158" stroke="#16a34a" stroke-width="2.2" marker-end="url(#bw)"/>
  <line x1="204" y1="158" x2="174" y2="158" stroke="#16a34a" stroke-width="2.2" marker-end="url(#bw)"/>

  <!-- ma'lumot turlari banneri -->
  <text x="189" y="178" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#2563eb">Command DTO</text>
  <text x="383" y="178" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#2563eb">Entity+VO</text>
  <text x="567" y="178" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#2563eb">SQL</text>

  <!-- Pastki: ma'lumot turlari legendasi -->
  <rect x="24" y="206" width="672" height="92" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="228" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Qaysi turdagi ma'lumot qaysi qatlamda yashaydi</text>

  <rect x="40" y="240" width="200" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="259" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1e40af">DTO</text>
  <text x="140" y="277" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#3b82f6">qatlamlar orasi, xom, immutable</text>

  <rect x="260" y="240" width="200" height="46" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="360" y="259" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="bold" fill="#5b21b6">Value Object</text>
  <text x="360" y="277" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#7c3aed">o'z-validatsiya, qiymat-tenglik</text>

  <rect x="480" y="240" width="200" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="580" y="259" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="bold" fill="#166534">Entity</text>
  <text x="580" y="277" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#16a34a">id-tenglik, domen ichida qoladi</text>

  <!-- Oltin qoida -->
  <rect x="24" y="312" width="672" height="50" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="360" y="332" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="bold" fill="#991b1b">Oltin qoida: domen Entity controllerga OQIB chiqmaydi.</text>
  <text x="360" y="350" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#7f1d1d">Tashqariga UserView DTO qaytadi &#8212; ichki tuzilma o'zgarsa API buzilmaydi.</text>

  <!-- N+1 eslatma -->
  <rect x="24" y="376" width="672" height="48" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="396" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#92400e">N+1 tuzog'i: Service sikl ichida har element uchun repo chaqirsa &#8594; 1+N so'rov.</text>
  <text x="360" y="414" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#b45309">Yechim: batch/eager yuklash (WHERE id IN (...)) &#8594; doimiy 2 so'rov.</text>
</svg>
