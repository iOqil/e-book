<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>Hexagonal arxitektura (ports and adapters): markazda domen, atrofida portlar (interfeyslar), tashqarida adapterlar. Chap tomonda driving (primary) adapterlar - HTTP, CLI - use-case'ni chaqiradi. O'ng tomonda driven (secondary) adapterlar - PDO, Redis, queue - portlarni amalga oshiradi. Bog'liqlik o'qi har doim ichkariga, domen markazga yo'naladi.</title>

  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>
  <text x="360" y="28" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Hexagonal: ports &amp; adapters</text>

  <defs>
    <marker id="ari" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- markaziy oltiburchak: DOMEN -->
  <polygon points="360,120 440,165 440,275 360,320 280,275 280,165" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="360" y="200" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#5b21b6">DOMEN</text>
  <text x="360" y="220" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#7c3aed">Entity / VO</text>
  <text x="360" y="236" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#7c3aed">biznes qoidalari</text>
  <text x="360" y="258" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#a78bfa">+ use-case (application)</text>

  <!-- PORTLAR (oltiburchak qirralaridagi interfeyslar) -->
  <rect x="246" y="156" width="74" height="26" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="283" y="173" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#1e40af">«port» in</text>

  <rect x="400" y="156" width="74" height="26" rx="7" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
  <text x="437" y="173" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#166534">«port» out</text>

  <rect x="400" y="258" width="74" height="26" rx="7" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
  <text x="437" y="275" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#166534">«port» out</text>

  <!-- CHAP: driving (primary) adapterlar -->
  <text x="120" y="86" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="bold" fill="#2563eb">DRIVING (primary)</text>
  <text x="120" y="102" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#3b82f6">tashqaridan ichkariga chaqiradi</text>

  <rect x="40" y="120" width="160" height="44" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="139" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1e40af">HttpController</text>
  <text x="120" y="155" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#3b82f6">REST so'rov &#8594; use-case</text>

  <rect x="40" y="176" width="160" height="44" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="195" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="bold" fill="#1e40af">CliCommand</text>
  <text x="120" y="211" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#3b82f6">konsol &#8594; use-case</text>

  <!-- O'NG: driven (secondary) adapterlar -->
  <text x="600" y="86" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="bold" fill="#16a34a">DRIVEN (secondary)</text>
  <text x="600" y="102" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#22c55e">portni amalga oshiradi</text>

  <rect x="520" y="120" width="160" height="44" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="139" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="bold" fill="#166534">PdoOrderRepository</text>
  <text x="600" y="155" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#22c55e">sqlite / MySQL</text>

  <rect x="520" y="176" width="160" height="44" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="195" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="bold" fill="#166534">RedisCache</text>
  <text x="600" y="211" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#22c55e">tashqi kesh</text>

  <rect x="520" y="232" width="160" height="44" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="251" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="bold" fill="#166534">QueueNotifier</text>
  <text x="600" y="267" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#22c55e">navbatga e'lon</text>

  <!-- BOG'LIQLIK O'QLARI: hammasi ICHKARIGA (qizil) -->
  <!-- driving: adapter -> port (chaqiradi) -->
  <line x1="200" y1="142" x2="246" y2="166" stroke="#dc2626" stroke-width="2" marker-end="url(#ari)"/>
  <line x1="200" y1="198" x2="246" y2="172" stroke="#dc2626" stroke-width="2" marker-end="url(#ari)"/>
  <!-- driven: adapter -> port (implements, ichkariga bog'liq) -->
  <line x1="520" y1="142" x2="474" y2="166" stroke="#dc2626" stroke-width="2" marker-end="url(#ari)"/>
  <line x1="520" y1="198" x2="474" y2="172" stroke="#dc2626" stroke-width="2" marker-end="url(#ari)"/>
  <line x1="520" y1="254" x2="474" y2="270" stroke="#dc2626" stroke-width="2" marker-end="url(#ari)"/>

  <!-- pastki izoh -->
  <rect x="40" y="304" width="640" height="60" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="360" y="326" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="bold" fill="#92400e">Bog'liqlik o'qi (qizil) HAR DOIM ichkariga, domenga yo'naladi.</text>
  <text x="360" y="346" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#92400e">Adapter portni biladi; domen adapterni BILMAYDI. Adapterni almashtirsang, domen o'zgarmaydi.</text>

  <text x="360" y="392" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#475569">Framework (Laravel/Symfony yoki mini-framework) — shunchaki yana bitta DRIVING adapter, "detal".</text>
  <text x="360" y="414" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">Port = interfeys (domen INFRAdan nimani talab qiladi) · Adapter = implementatsiya</text>
</svg>
