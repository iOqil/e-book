<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>Sifat darvozasi pipeline: composer install -> php-cs-fixer (stil) -> phpstan (tip) -> phpunit/pest (test) -> infection (mutation). Har bosqich xato bersa, pull-request merge bloklanadi (qizil darvoza).</title>

  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>

  <text x="360" y="30" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Sifat darvozasi: PR merge'dan oldingi pipeline</text>
  <text x="360" y="52" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Har bosqich darvoza: xato &#8594; qizil &#8594; merge bloklanadi</text>

  <!-- PR boshi -->
  <rect x="20" y="92" width="92" height="72" rx="10" fill="#2563eb"/>
  <text x="66" y="122" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Pull</text>
  <text x="66" y="140" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Request</text>

  <!-- Pipeline bosqichlari -->
  <!-- 1 lint -->
  <rect x="132" y="86" width="104" height="84" rx="9" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="184" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#b45309">1. Stil</text>
  <text x="184" y="128" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#92400e">php-cs-fixer</text>
  <text x="184" y="144" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#92400e">PSR-12</text>
  <text x="184" y="159" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#a16207">--dry-run</text>

  <!-- 2 stan -->
  <rect x="256" y="86" width="104" height="84" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="308" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#6d28d9">2. Tip</text>
  <text x="308" y="128" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#5b21b6">phpstan</text>
  <text x="308" y="144" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#5b21b6">analyse</text>
  <text x="308" y="159" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#6d28d9">level max</text>

  <!-- 3 test -->
  <rect x="380" y="86" width="104" height="84" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="432" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#15803d">3. Test</text>
  <text x="432" y="128" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#166534">phpunit/pest</text>
  <text x="432" y="144" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#166534">+ coverage</text>
  <text x="432" y="159" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#15803d">xulq-atvor</text>

  <!-- 4 mutation -->
  <rect x="504" y="86" width="104" height="84" rx="9" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="556" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">4. Mutation</text>
  <text x="556" y="128" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#991b1b">infection</text>
  <text x="556" y="144" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#991b1b">MSI &#8805; %</text>
  <text x="556" y="159" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#b91c1c">test sifati</text>

  <!-- strelkalar pipeline -->
  <line x1="112" y1="128" x2="130" y2="128" stroke="#475569" stroke-width="2.2" marker-end="url(#gg)"/>
  <line x1="236" y1="128" x2="254" y2="128" stroke="#475569" stroke-width="2.2" marker-end="url(#gg)"/>
  <line x1="360" y1="128" x2="378" y2="128" stroke="#475569" stroke-width="2.2" marker-end="url(#gg)"/>
  <line x1="484" y1="128" x2="502" y2="128" stroke="#475569" stroke-width="2.2" marker-end="url(#gg)"/>

  <!-- yashil: hammasi o'tdi -> merge -->
  <line x1="608" y1="112" x2="664" y2="112" stroke="#16a34a" stroke-width="2.5" marker-end="url(#gy)"/>
  <rect x="640" y="86" width="60" height="44" rx="8" fill="#16a34a"/>
  <text x="670" y="103" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff">MERGE</text>
  <text x="670" y="120" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#dcfce7">ruxsat</text>

  <!-- qizil darvoza: xato -> bloklandi -->
  <path d="M308 170 L308 200" stroke="#dc2626" stroke-width="2.2" marker-end="url(#gr)"/>
  <path d="M432 170 L432 200" stroke="#dc2626" stroke-width="2.2" marker-end="url(#gr)"/>
  <path d="M184 170 L184 200" stroke="#dc2626" stroke-width="2.2" marker-end="url(#gr)"/>
  <rect x="150" y="204" width="332" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="316" y="222" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">Istalgan bosqich qizil &#8594; exit != 0</text>
  <text x="316" y="238" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">merge tugmasi bloklanadi (branch protection)</text>

  <!-- pastki tushuntirish paneli -->
  <rect x="24" y="266" width="672" height="152" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="292" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Tartib bejiz emas: arzon tekshiruv oldinda</text>

  <circle cx="52" cy="316" r="4" fill="#f59e0b"/>
  <text x="64" y="320" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Stil eng arzon (sekundlar) &#8212; oldin yiqilsin, qimmat testgacha yetmasdan.</text>

  <circle cx="52" cy="340" r="4" fill="#7c3aed"/>
  <text x="64" y="344" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">PHPStan testdan oldin: tip xatosi ko'p bugni testsiz ham tutadi (tez, ishonchli).</text>

  <circle cx="52" cy="364" r="4" fill="#16a34a"/>
  <text x="64" y="368" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Test xulq-atvorni isbotlaydi; coverage qancha kod ishlatilganini o'lchaydi.</text>

  <circle cx="52" cy="388" r="4" fill="#dc2626"/>
  <text x="64" y="392" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Mutation (Infection) eng qimmat &#8212; oxirida; testning O'ZINI sinaydi (MSI).</text>

  <circle cx="52" cy="410" r="4" fill="#2563eb"/>
  <text x="64" y="414" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Lokalda `composer check`, CI'da xuddi shu &#8212; "menda ishlayapti" muammosi yo'qoladi.</text>

  <defs>
    <marker id="gg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
    <marker id="gy" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="gr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#dc2626"/></marker>
  </defs>
</svg>
