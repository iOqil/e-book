<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>JWT ning uch qismli tuzilishi: nuqta bilan ajratilgan header, payload va signature qismlari, har biri base64url kodlangan</title>

  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>

  <text x="360" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">JWT anatomiyasi: header.payload.signature</text>

  <!-- to'liq token satri (rangli qismlar bilan) -->
  <rect x="30" y="58" width="660" height="58" rx="8" fill="#0f172a"/>
  <text x="44" y="92" font-family="Consolas, Courier New, monospace" font-size="13.5" font-weight="bold">
    <tspan fill="#60a5fa">eyJhbGci...VCJ9</tspan><tspan fill="#94a3b8">.</tspan><tspan fill="#4ade80">eyJzdWIi...bWluIn0</tspan><tspan fill="#94a3b8">.</tspan><tspan fill="#f472b6">-Z_SV79-...XY3w</tspan>
  </text>
  <text x="360" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#cbd5e1">nuqta (.) bilan ajratilgan uch qism</text>

  <!-- 1. HEADER qutisi -->
  <rect x="30" y="140" width="210" height="240" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="30" y="140" width="210" height="40" rx="10" fill="#2563eb"/>
  <rect x="30" y="160" width="210" height="20" fill="#2563eb"/>
  <text x="135" y="166" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">1. HEADER</text>
  <text x="135" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">algoritm va token turi</text>
  <rect x="46" y="214" width="178" height="74" rx="6" fill="#eff6ff"/>
  <text x="58" y="236" font-family="Consolas, Courier New, monospace" font-size="12.5" fill="#1e3a8a">{</text>
  <text x="70" y="254" font-family="Consolas, Courier New, monospace" font-size="12.5" fill="#1e3a8a">"alg": "HS256",</text>
  <text x="70" y="272" font-family="Consolas, Courier New, monospace" font-size="12.5" fill="#1e3a8a">"typ": "JWT"</text>
  <text x="58" y="286" font-family="Consolas, Courier New, monospace" font-size="12.5" fill="#1e3a8a">}</text>
  <text x="135" y="316" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#2563eb">base64url kodlangan</text>
  <text x="135" y="338" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#64748b">ochiq o'qiladi</text>
  <text x="135" y="360" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#64748b">(shifrlanmagan)</text>

  <!-- 2. PAYLOAD qutisi -->
  <rect x="255" y="140" width="210" height="240" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="255" y="140" width="210" height="40" rx="10" fill="#16a34a"/>
  <rect x="255" y="160" width="210" height="20" fill="#16a34a"/>
  <text x="360" y="166" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">2. PAYLOAD</text>
  <text x="360" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">claimlar (ma'lumot)</text>
  <rect x="271" y="214" width="178" height="74" rx="6" fill="#f0fdf4"/>
  <text x="283" y="234" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#14532d">"sub": "42",</text>
  <text x="283" y="251" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#14532d">"role": "admin",</text>
  <text x="283" y="268" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#14532d">"exp": 1781199442</text>
  <text x="360" y="316" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#16a34a">base64url kodlangan</text>
  <text x="360" y="338" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#dc2626">HAR KIM O'QIY OLADI</text>
  <text x="360" y="360" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#64748b">sir solmang!</text>

  <!-- 3. SIGNATURE qutisi -->
  <rect x="480" y="140" width="210" height="240" rx="10" fill="#ffffff" stroke="#db2777" stroke-width="2"/>
  <rect x="480" y="140" width="210" height="40" rx="10" fill="#db2777"/>
  <rect x="480" y="160" width="210" height="20" fill="#db2777"/>
  <text x="585" y="166" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">3. SIGNATURE</text>
  <text x="585" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">imzo (butunlik)</text>
  <rect x="496" y="214" width="178" height="74" rx="6" fill="#fdf2f8"/>
  <text x="585" y="236" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#831843">HMAC_SHA256(</text>
  <text x="585" y="252" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#831843">header + "." +</text>
  <text x="585" y="268" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#831843">payload, secret )</text>
  <text x="585" y="316" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#db2777">maxfiy kalit bilan</text>
  <text x="585" y="338" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#64748b">qalbakilashtirishni</text>
  <text x="585" y="360" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#64748b">to'sadi</text>

  <!-- pastki xulosa qutisi -->
  <rect x="30" y="398" width="660" height="56" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="423" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e293b">JWT ning kuchi maxfiylikda EMAS, butunlikda (integrity): ma'lumotni ko'rsa bo'ladi, o'zgartirsa bo'lmaydi.</text>
  <text x="360" y="444" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">Imzo faqat maxfiy kalit egasi tomonidan qayta hisoblanadi — shuning uchun token soxtalashtirib bo'lmaydi.</text>
</svg>
