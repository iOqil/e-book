<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>Repository naqshi: domen qatlami UserRepositoryInterface'ni e'lon qiladi (port), infrastruktura qatlami InMemoryUserRepository va PdoUserRepository bilan amalga oshiradi (adapter). Bog'liqlik o'qi infrastrukturadan domenga qarab yo'naladi (DIP) - domen bazani bilmaydi.</title>

  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>
  <text x="360" y="30" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Repository: domen INTERFEYSi, infra IMPLEMENTATSIYAsi</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
    <marker id="hollow" markerWidth="14" markerHeight="14" refX="12" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- DOMEN qatlami quti -->
  <rect x="200" y="56" width="320" height="150" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="360" y="80" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="bold" fill="#5b21b6">DOMEN qatlami (bazani BILMAYDI)</text>

  <!-- interfeys (port) -->
  <rect x="232" y="94" width="256" height="58" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="360" y="113" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-style="italic" fill="#7c3aed">&#171;interface&#187;</text>
  <text x="360" y="131" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" font-weight="bold" fill="#5b21b6">UserRepositoryInterface</text>
  <text x="360" y="147" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#7c3aed">find / save / findByEmail</text>

  <!-- RegisterUser service -->
  <rect x="232" y="160" width="256" height="34" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="360" y="181" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#1e40af">RegisterUser(UserRepositoryInterface)</text>

  <!-- INFRA qatlami quti -->
  <rect x="40" y="270" width="640" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="293" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="bold" fill="#166534">INFRASTRUKTURA qatlami (interfeysni AMALGA oshiradi)</text>

  <!-- InMemory adapter -->
  <rect x="70" y="306" width="270" height="66" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="205" y="328" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" font-weight="bold" fill="#166534">InMemoryUserRepository</text>
  <text x="205" y="347" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#15803d">array $store</text>
  <text x="205" y="363" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#22c55e">test / prototip uchun</text>

  <!-- Pdo adapter -->
  <rect x="380" y="306" width="270" height="66" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="515" y="328" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" font-weight="bold" fill="#166534">PdoUserRepository</text>
  <text x="515" y="347" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#15803d">PDO sqlite / MySQL</text>
  <text x="515" y="363" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#22c55e">production uchun</text>

  <!-- implements o'qlari (bo'sh uchburchak, infra -> interfeys) -->
  <line x1="205" y1="306" x2="320" y2="156" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#hollow)"/>
  <line x1="515" y1="306" x2="400" y2="156" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#hollow)"/>
  <text x="150" y="245" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#7c3aed">implements</text>
  <text x="575" y="245" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#7c3aed">implements</text>

  <!-- bog'liqlik yo'nalishi izohi -->
  <rect x="40" y="404" width="640" height="28" rx="7" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="360" y="423" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#92400e">Bog'liqlik o'qi PASTDAN YUQORIGA (DIP): infra domenga bog'liq, domen infrani bilmaydi. Ulashni DI konteyner qiladi.</text>
</svg>
