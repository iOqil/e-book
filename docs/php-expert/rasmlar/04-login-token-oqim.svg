<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480">
  <title>Stateless auth oqimi: mijoz login qiladi, server access va refresh token beradi, mijoz access token bilan himoyalangan endpointga so'rov yuboradi, token tugagach refresh orqali yangilanadi</title>

  <rect x="0" y="0" width="720" height="480" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Login -&gt; token -&gt; himoyalangan endpoint oqimi</text>

  <!-- ikkita ustun: Mijoz va Server -->
  <text x="140" y="70" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">MIJOZ (brauzer / mobil)</text>
  <text x="580" y="70" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#7c3aed">SERVER (auth + API)</text>

  <!-- vertikal hayot chiziqlari -->
  <line x1="140" y1="82" x2="140" y2="430" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="580" y1="82" x2="580" y2="430" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- 1. LOGIN so'rovi -->
  <text x="360" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#16a34a">1. POST /login  (email + parol)</text>
  <line x1="150" y1="112" x2="568" y2="112" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="572,112 562,107 562,117" fill="#16a34a"/>

  <!-- server parolni tekshiradi -->
  <rect x="455" y="124" width="250" height="34" rx="6" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="580" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#5b21b6">password_verify() — parolni tasdiqlash</text>

  <!-- 2. tokenlar qaytadi -->
  <text x="360" y="184" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#2563eb">2. access token (15 daq) + refresh token (14 kun)</text>
  <line x1="568" y1="192" x2="152" y2="192" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="148,192 158,187 158,197" fill="#2563eb"/>

  <!-- mijoz tokenlarni saqlaydi -->
  <rect x="18" y="204" width="244" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#1e3a8a">access -&gt; xotirada (JS o'zgaruvchisi)</text>
  <text x="140" y="242" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#1e3a8a">refresh -&gt; httpOnly; Secure cookie</text>

  <!-- 3. himoyalangan so'rov -->
  <text x="360" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#16a34a">3. GET /profile   Authorization: Bearer &lt;access&gt;</text>
  <line x1="150" y1="288" x2="568" y2="288" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="572,288 562,283 562,293" fill="#16a34a"/>

  <!-- server imzoni tekshiradi -->
  <rect x="455" y="300" width="250" height="34" rx="6" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="580" y="322" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#5b21b6">imzo + exp tekshiriladi (DB ga qaramay)</text>

  <!-- 4. 200 OK -->
  <text x="360" y="360" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#2563eb">4. 200 OK  (yoki 401, agar token yaroqsiz/muddati o'tgan)</text>
  <line x1="568" y1="368" x2="152" y2="368" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="148,368 158,363 158,373" fill="#2563eb"/>

  <!-- 5. refresh oqimi (qizil, takroriy) -->
  <text x="360" y="404" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#dc2626">5. access tugagach (401) -&gt; POST /refresh -&gt; yangi access (rotation)</text>
  <line x1="150" y1="412" x2="568" y2="412" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4"/>
  <polygon points="572,412 562,407 562,417" fill="#dc2626"/>

  <!-- pastki xulosa qutisi -->
  <rect x="30" y="436" width="660" height="34" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="458" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Stateless: server har so'rovda imzoni qayta hisoblaydi — sessiya yozuvi saqlamaydi.</text>
</svg>
