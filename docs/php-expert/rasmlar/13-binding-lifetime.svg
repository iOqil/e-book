<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>Binding va lifetime: konteyner bind() bilan interfeysni konkret implementatsiyaga bog'laydi (interfeysga dasturlash), singleton lifetime obyektni bir marta yaratib keshlaydi va qayta ishlatadi, transient lifetime esa har get() chaqiruvida yangi obyekt qaytaradi</title>

  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>
  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#1e293b">Binding: interfeys -&gt; implementatsiya + lifetime</text>

  <defs>
    <marker id="bl" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- BINDING qismi -->
  <text x="200" y="68" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">1. Binding (interfeysga dasturlash)</text>

  <!-- interfeys -->
  <rect x="40" y="84" width="150" height="64" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="115" y="108" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#5b21b6">Logger</text>
  <text x="115" y="128" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#7c3aed">interfeys (kontrakt)</text>
  <text x="115" y="142" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#a78bfa">yaratib bo'lmaydi</text>

  <!-- implementatsiya -->
  <rect x="270" y="84" width="150" height="64" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="345" y="108" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#166534">FileLogger</text>
  <text x="345" y="128" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#16a34a">konkret sinf</text>
  <text x="345" y="142" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#22c55e">new bo'la oladi</text>

  <line x1="190" y1="116" x2="266" y2="116" stroke="#475569" stroke-width="2.5" marker-end="url(#bl)"/>
  <text x="228" y="106" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#475569">bind()</text>

  <!-- kod -->
  <rect x="448" y="80" width="232" height="72" rx="8" fill="#0f172a"/>
  <text x="462" y="104" font-family="Consolas, monospace" font-size="11.5" fill="#60a5fa">$c-&gt;bind(</text>
  <text x="462" y="121" font-family="Consolas, monospace" font-size="11.5" fill="#4ade80">  Logger::class,</text>
  <text x="462" y="138" font-family="Consolas, monospace" font-size="11.5" fill="#4ade80">  FileLogger::class);</text>

  <line x1="360" y1="170" x2="360" y2="196" stroke="#cbd5e1" stroke-width="2"/>

  <!-- LIFETIME qismi -->
  <text x="360" y="190" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">2. Lifetime (umr davomiyligi)</text>

  <!-- SINGLETON -->
  <rect x="40" y="210" width="300" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="234" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">SINGLETON / shared</text>
  <text x="190" y="255" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#1e3a8a">bir marta yaratiladi, keshlanadi</text>

  <rect x="62" y="270" width="100" height="38" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="112" y="294" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#1e40af">get() #1</text>
  <rect x="218" y="270" width="100" height="38" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="268" y="294" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#1e40af">get() #2</text>

  <rect x="120" y="324" width="140" height="28" rx="14" fill="#2563eb"/>
  <text x="190" y="343" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff">BIR XIL obyekt #A1</text>
  <line x1="112" y1="308" x2="170" y2="322" stroke="#2563eb" stroke-width="2" marker-end="url(#bl)"/>
  <line x1="268" y1="308" x2="210" y2="322" stroke="#2563eb" stroke-width="2" marker-end="url(#bl)"/>

  <!-- TRANSIENT -->
  <rect x="380" y="210" width="300" height="150" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="530" y="234" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#92400e">TRANSIENT / factory</text>
  <text x="530" y="255" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#78350f">har get() da YANGI obyekt</text>

  <rect x="402" y="270" width="100" height="38" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="452" y="294" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#92400e">get() #1</text>
  <rect x="558" y="270" width="100" height="38" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="608" y="294" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#92400e">get() #2</text>

  <rect x="402" y="324" width="100" height="28" rx="14" fill="#f59e0b"/>
  <text x="452" y="343" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">obyekt #B1</text>
  <rect x="558" y="324" width="100" height="28" rx="14" fill="#dc2626"/>
  <text x="608" y="343" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">obyekt #B2</text>
  <line x1="452" y1="308" x2="452" y2="322" stroke="#f59e0b" stroke-width="2" marker-end="url(#bl)"/>
  <line x1="608" y1="308" x2="608" y2="322" stroke="#dc2626" stroke-width="2" marker-end="url(#bl)"/>

  <!-- pastki maslahat -->
  <rect x="40" y="384" width="640" height="40" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="360" y="409" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#065f46">Holatsiz (stateless) servislar -&gt; singleton. Har safar toza holat kerak bo'lsa -&gt; transient.</text>
</svg>
