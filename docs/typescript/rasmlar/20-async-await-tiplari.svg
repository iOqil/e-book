<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <title>async/await tiplari: async kalit so'zi qiymatni Promise qutisiga o'raydi, await esa qutini ochib ichidagi T qiymatni qaytaradi — ikkisi bir-birining aksi</title>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="420" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">async o'raydi, await ochadi</text>

  <!-- yuqori qator: async wraps -->
  <text x="360" y="68" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">async funksiya: ichida T qaytaramiz -&gt; tashqaridan Promise&lt;T&gt;</text>

  <!-- T qiymat (ichkarida) -->
  <rect x="60" y="92" width="150" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="135" y="118" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">return "salom"</text>
  <text x="135" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tip: string (T)</text>

  <!-- strelka -->
  <line x1="218" y1="123" x2="288" y2="123" stroke="#475569" stroke-width="2.5"/>
  <polygon points="288,123 278,118 278,128" fill="#475569"/>
  <text x="253" y="113" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">async</text>

  <!-- Promise quti -->
  <rect x="298" y="84" width="180" height="78" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="388" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">Promise&lt;string&gt;</text>
  <rect x="330" y="118" width="116" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="388" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">"salom"</text>

  <text x="560" y="118" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">qiymat hozir emas,</text>
  <text x="560" y="140" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">"quti" ichida kutyapti</text>

  <!-- ajratuvchi -->
  <line x1="60" y1="196" x2="660" y2="196" stroke="#e2e8f0" stroke-width="2"/>

  <!-- pastki qator: await unwraps -->
  <text x="360" y="228" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f59e0b">await: Promise&lt;T&gt; qutisini ochadi -&gt; ichidan T chiqadi</text>

  <!-- Promise quti (kirish) -->
  <rect x="60" y="252" width="180" height="78" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="150" y="276" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">Promise&lt;string&gt;</text>
  <rect x="92" y="286" width="116" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="150" y="308" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">"salom"</text>

  <!-- strelka await -->
  <line x1="248" y1="291" x2="340" y2="291" stroke="#f59e0b" stroke-width="3"/>
  <polygon points="340,291 328,285 328,297" fill="#f59e0b"/>
  <rect x="262" y="262" width="64" height="26" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="294" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">await</text>

  <!-- T natija (ochilgan) -->
  <rect x="350" y="260" width="180" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="440" y="285" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">"salom"</text>
  <text x="440" y="307" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tip: string (T) — ochildi</text>

  <text x="556" y="285" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">endi .length,</text>
  <text x="556" y="305" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">.toUpperCase() OK</text>

  <!-- pastki izoh -->
  <text x="360" y="372" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">await'ni unutsangiz, qo'lingizda ochilmagan Promise&lt;T&gt; qoladi</text>
  <text x="360" y="398" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">p.toFixed(2) ❌ — Promise&lt;number&gt;'da toFixed yo'q</text>
</svg>
