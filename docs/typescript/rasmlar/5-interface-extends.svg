<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450">
  <title>interface extends: bolalar interface ota-onaning hamma maydonlarini meros qilib oladi va ustiga o'zinikini qo'shadi; kengaytirish zanjiri</title>

  <rect x="0" y="0" width="720" height="450" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">interface extends — maydonlarni meros qilib olish</text>

  <!-- bazaviy interface -->
  <rect x="240" y="58" width="240" height="96" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="360" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">interface Jonzot</text>
  <line x1="262" y1="94" x2="458" y2="94" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="360" y="120" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1e293b">nom: string</text>
  <text x="360" y="142" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1e293b">yosh: number</text>

  <!-- o'qlar -->
  <line x1="300" y1="154" x2="180" y2="210" stroke="#475569" stroke-width="2"/>
  <polygon points="180,210 188,200 192,213" fill="#475569"/>
  <line x1="420" y1="154" x2="540" y2="210" stroke="#475569" stroke-width="2"/>
  <polygon points="540,210 528,213 532,200" fill="#475569"/>
  <text x="225" y="188" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">extends</text>
  <text x="495" y="188" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">extends</text>

  <!-- bola 1: It -->
  <rect x="46" y="214" width="270" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="181" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">interface It extends Jonzot</text>
  <line x1="66" y1="250" x2="296" y2="250" stroke="#86efac" stroke-width="1.5"/>
  <text x="68" y="274" font-family="Consolas, Menlo, monospace" font-size="13.5" fill="#94a3b8">nom: string  (meros)</text>
  <text x="68" y="296" font-family="Consolas, Menlo, monospace" font-size="13.5" fill="#94a3b8">yosh: number (meros)</text>
  <text x="68" y="320" font-family="Consolas, Menlo, monospace" font-size="13.5" fill="#16a34a" font-weight="bold">zot: string  (yangi)</text>

  <!-- bola 2: Mushuk -->
  <rect x="404" y="214" width="270" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="539" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">interface Mushuk extends Jonzot</text>
  <line x1="424" y1="250" x2="654" y2="250" stroke="#86efac" stroke-width="1.5"/>
  <text x="426" y="274" font-family="Consolas, Menlo, monospace" font-size="13.5" fill="#94a3b8">nom: string  (meros)</text>
  <text x="426" y="296" font-family="Consolas, Menlo, monospace" font-size="13.5" fill="#94a3b8">yosh: number (meros)</text>
  <text x="426" y="320" font-family="Consolas, Menlo, monospace" font-size="13.5" fill="#16a34a" font-weight="bold">uy_mushukmi: boolean</text>

  <!-- pastki izoh -->
  <text x="360" y="382" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Bola interface = ota-onaning maydonlari + o'ziniki.</text>
  <text x="360" y="412" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Umumiy maydonni bir joyda yozasiz; bir nechta interface'dan ham meros olsa bo'ladi</text>
  <text x="360" y="436" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">(extends A, B) — kod takrorlanmaydi.</text>
</svg>
