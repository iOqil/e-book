<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <title>TypeScript ish jarayoni: .ts faylni yozasiz, tsc compiler uni tekshirib JavaScript .js fayl chiqaradi, so'ng node yoki brauzer o'sha .js ni ishga tushiradi</title>

  <rect x="0" y="0" width="720" height="360" fill="#f8fafc"/>

  <text x="360" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">TypeScript ish jarayoni: yoz -&gt; compile -&gt; ishga tushir</text>

  <!-- 1. .ts fayl -->
  <rect x="40" y="92" width="170" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="125" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">1. Siz yozasiz</text>
  <text x="125" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">salom.ts</text>
  <text x="125" y="184" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tiplar bilan kod</text>

  <!-- strelka 1 -->
  <line x1="214" y1="152" x2="268" y2="152" stroke="#475569" stroke-width="2.5"/>
  <polygon points="268,146 280,152 268,158" fill="#475569"/>

  <!-- 2. tsc -->
  <rect x="282" y="92" width="156" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="360" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">2. tsc</text>
  <text x="360" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">tiplarni tekshiradi</text>
  <text x="360" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">tip belgilarini</text>
  <text x="360" y="190" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">olib tashlaydi</text>

  <!-- strelka 2 -->
  <line x1="442" y1="152" x2="496" y2="152" stroke="#475569" stroke-width="2.5"/>
  <polygon points="496,146 508,152 496,158" fill="#475569"/>

  <!-- 3. .js fayl -->
  <rect x="510" y="92" width="170" height="120" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="595" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#b45309">3. Natija</text>
  <text x="595" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">salom.js</text>
  <text x="595" y="184" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">toza JavaScript</text>

  <!-- pastga strelka -->
  <line x1="595" y1="214" x2="595" y2="258" stroke="#475569" stroke-width="2.5"/>
  <polygon points="589,258 595,270 601,258" fill="#475569"/>

  <!-- 4. ishga tushirish -->
  <rect x="470" y="272" width="210" height="58" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="575" y="297" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">4. node salom.js</text>
  <text x="575" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(yoki brauzer) ishga tushiradi</text>

  <!-- izoh -->
  <text x="240" y="302" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">Node va brauzer faqat .js ni tushunadi,</text>
  <text x="240" y="322" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">.ts ni emas — shuning uchun tsc kerak</text>
</svg>
