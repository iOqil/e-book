<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>Xavfsiz get funksiyasi: get&lt;T, K extends keyof T&gt;(o: T, k: K): T[K]. K kaliti T ning kalitlaridan biri bo'lishga majbur (constraint), qaytadigan tip esa o'sha kalitning aniq tipi T[K] bo'ladi. Noto'g'ri kalit kompilyatsiyada xato beradi</title>
  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Xavfsiz get: K extends keyof T bog'lanishi</text>

  <!-- signatura qutisi -->
  <rect x="90" y="56" width="540" height="48" rx="10" fill="#1e293b"/>
  <text x="360" y="86" text-anchor="middle" font-family="Consolas, Segoe UI, monospace" font-size="16" font-weight="bold" fill="#e2e8f0">get&lt;T, K extends keyof T&gt;(o: T, k: K): T[K]</text>

  <!-- 3 ta rol -->
  <!-- T -->
  <rect x="70" y="130" width="180" height="92" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">T</text>
  <text x="160" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">obyekt tipi</text>
  <text x="160" y="202" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">mas. Kitob</text>

  <!-- K -->
  <rect x="270" y="130" width="180" height="92" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#92400e">K extends keyof T</text>
  <text x="360" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">kalit — faqat T dan</text>
  <text x="360" y="202" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">mas. "nomi"</text>

  <!-- T[K] -->
  <rect x="470" y="130" width="180" height="92" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="560" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#166534">T[K]</text>
  <text x="560" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">qaytadigan tip</text>
  <text x="560" y="202" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">mas. string</text>

  <!-- strelkalar K-> cheklov T ga, K -> T[K] -->
  <line x1="270" y1="176" x2="250" y2="176" stroke="#f59e0b" stroke-width="2.5"/>
  <polygon points="250,170 238,176 250,182" fill="#f59e0b"/>
  <text x="218" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#92400e">keyof T</text>

  <line x1="450" y1="176" x2="470" y2="176" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="470,170 482,176 470,182" fill="#16a34a"/>

  <!-- to'g'ri chaqiruv -->
  <rect x="70" y="252" width="580" height="64" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="92" y="280" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">&#10003; get(kitob, "nomi")</text>
  <text x="92" y="304" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">"nomi" — Kitob kaliti, demak natija aniq string. O'tadi.</text>
  <text x="560" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#166534">: string</text>

  <!-- xato chaqiruv -->
  <rect x="70" y="328" width="580" height="64" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="92" y="356" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">&#10007; get(kitob, "narx")</text>
  <text x="92" y="380" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">"narx" Kitob kaliti emas — keyof T cheklovidan o'tmaydi.</text>
  <text x="560" y="364" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#dc2626">TS2345</text>

  <!-- pastki izoh -->
  <text x="360" y="426" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Ikki parametr bir-biriga bog'langan: K — T ga, qaytadigan tip — K ga</text>
  <text x="360" y="452" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Natijada xato kalit yozsangiz, dastur ishga tushmasdan oldin xato chiqadi</text>
</svg>
