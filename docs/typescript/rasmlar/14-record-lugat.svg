<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410">
  <title>Record K V lug'at tuzilishi: K tanlangan kalitlar to'plamini, V esa har bir kalitning qiymat tipini belgilaydi. Misolda Record Rang string har bir rang nomiga HEX kod biriktiradi</title>
  <rect x="0" y="0" width="720" height="410" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Record&lt;K, V&gt; — kalit-qiymat lug'ati</text>

  <!-- formula -->
  <text x="360" y="72" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" fill="#1e293b">Record&lt;<tspan fill="#2563eb" font-weight="bold">K</tspan>, <tspan fill="#16a34a" font-weight="bold">V</tspan>&gt;</text>
  <text x="200" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">K = kalitlar (qaysi nomlar bo'lishi mumkin)</text>
  <text x="540" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">V = har bir qiymatning tipi</text>

  <!-- misol sarlavha -->
  <text x="360" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#475569">Record&lt;Rang, string&gt;  bu yerda  Rang = "qizil" | "yashil" | "kok"</text>

  <!-- lug'at jadvali -->
  <rect x="120" y="150" width="480" height="180" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <!-- ustun sarlavhalari -->
  <rect x="120" y="150" width="240" height="36" fill="#dbeafe"/>
  <rect x="360" y="150" width="240" height="36" fill="#dcfce7"/>
  <text x="240" y="174" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">kalit (K)</text>
  <text x="480" y="174" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">qiymat (V: string)</text>
  <line x1="360" y1="150" x2="360" y2="330" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="120" y1="186" x2="600" y2="186" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="120" y1="234" x2="600" y2="234" stroke="#94a3b8" stroke-width="1"/>
  <line x1="120" y1="282" x2="600" y2="282" stroke="#94a3b8" stroke-width="1"/>

  <text x="240" y="216" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">"qizil"</text>
  <text x="480" y="216" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">"#dc2626"</text>
  <text x="240" y="264" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">"yashil"</text>
  <text x="480" y="264" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">"#16a34a"</text>
  <text x="240" y="312" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">"kok"</text>
  <text x="480" y="312" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">"#2563eb"</text>

  <!-- izoh -->
  <text x="360" y="362" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">Har bir kalit MAJBURIY: biror rang qoldirilsa, TS xato beradi</text>
  <text x="360" y="388" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">K = string bo'lsa esa istalgan nomdagi kalit qo'shsa bo'ladi (ochiq lug'at)</text>
</svg>
