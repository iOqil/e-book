<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>React komponent props'ini interface bilan tiplash: interface shartnomani belgilaydi, komponent uni qabul qiladi, to'g'ri prop o'tadi, noto'g'ri prop kompilyatsiyadan o'tmaydi</title>
  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Props'ni interface bilan tiplash</text>

  <!-- interface (shartnoma) -->
  <rect x="40" y="60" width="280" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="86" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">interface TugmaProps</text>
  <text x="180" y="106" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(shartnoma — nima kerak)</text>
  <line x1="60" y1="118" x2="300" y2="118" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="64" y="142" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">matn: string</text>
  <text x="64" y="168" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">rang: "kok" | "qizil"</text>
  <text x="64" y="194" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">ochiq?: boolean  <tspan fill="#94a3b8">(ixtiyoriy)</tspan></text>

  <!-- arrow interface -> component -->
  <line x1="320" y1="135" x2="400" y2="135" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="360" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">qabul qiladi</text>

  <!-- component -->
  <rect x="400" y="60" width="280" height="150" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="540" y="86" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">function Tugma</text>
  <text x="540" y="106" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(komponent)</text>
  <line x1="420" y1="118" x2="660" y2="118" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="424" y="144" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">{ matn, rang,</text>
  <text x="424" y="166" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">&#160;&#160;ochiq = true </text>
  <text x="424" y="188" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">}: TugmaProps</text>

  <!-- usage row: correct -->
  <rect x="40" y="250" width="640" height="62" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="62" y="278" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">&#10003;</text>
  <text x="86" y="278" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">&lt;Tugma matn="Saqlash" rang="kok" /&gt;</text>
  <text x="86" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">to'g'ri: hamma shart bajarilgan — kompilyatsiya o'tadi</text>

  <!-- usage row: wrong union -->
  <rect x="40" y="324" width="640" height="58" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="62" y="350" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">&#10007;</text>
  <text x="86" y="350" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">&lt;Tugma matn="..." rang="yashil" /&gt;</text>
  <text x="86" y="371" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">"yashil" — "kok" | "qizil" emas: o'tmaydi</text>

  <!-- usage row: missing -->
  <rect x="40" y="394" width="640" height="58" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="62" y="420" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">&#10007;</text>
  <text x="86" y="420" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">&lt;Tugma rang="kok" /&gt;</text>
  <text x="86" y="441" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">'matn' propi yetishmayapti: o'tmaydi</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
