<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>Tip xatosi: number turidagi yosh o'zgaruvchisiga string qiymat berishga urinilganda kompilyator mos kelmaslikni aniqlaydi va "Type string is not assignable to type number" xatosini chiqaradi</title>

  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Tip xatosi: mos kelmaydigan qiymat rad etiladi</text>

  <!-- 1-qator: o'zgaruvchi e'loni (OK) -->
  <rect x="60" y="64" width="600" height="50" rx="8" fill="#1e293b"/>
  <text x="82" y="96" font-family="Consolas, 'Courier New', monospace" font-size="21" fill="#e2e8f0">let yosh</text>
  <text x="200" y="96" font-family="Consolas, 'Courier New', monospace" font-size="21" font-weight="bold" fill="#2563eb">: number</text>
  <text x="320" y="96" font-family="Consolas, 'Courier New', monospace" font-size="21" fill="#e2e8f0">= 25;</text>
  <text x="640" y="96" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="17" fill="#16a34a">OK</text>

  <!-- yosh "qutisi": faqat number qabul qiladi -->
  <rect x="230" y="138" width="260" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="360" y="162" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e40af">yosh — number qutisi</text>
  <text x="360" y="183" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e40af">faqat son qabul qiladi</text>

  <!-- chap: son qiymat kiradi (yashil) -->
  <rect x="40" y="232" width="150" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="115" y="260" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="bold" fill="#15803d">30</text>
  <line x1="190" y1="218" x2="270" y2="196" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="278,193 264,193 271,205" fill="#16a34a"/>
  <text x="115" y="300" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">number -&gt; number</text>
  <text x="115" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">o'tadi</text>

  <!-- o'ng: string qiymat rad etiladi (qizil) -->
  <rect x="530" y="232" width="150" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="605" y="260" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="bold" fill="#b91c1c">"yosh"</text>
  <line x1="530" y1="218" x2="455" y2="196" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4"/>
  <!-- rad belgisi (X) -->
  <circle cx="475" cy="206" r="13" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <line x1="469" y1="200" x2="481" y2="212" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="481" y1="200" x2="469" y2="212" stroke="#dc2626" stroke-width="2.5"/>
  <text x="605" y="300" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">string -&gt; number</text>
  <text x="605" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">RAD ETILADI</text>

  <!-- Kompilyator xato xabari -->
  <rect x="60" y="346" width="600" height="62" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="80" y="372" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b91c1c">Kompilyator xatosi (yozish paytida, dasturdan oldin):</text>
  <text x="80" y="396" font-family="Consolas, 'Courier New', monospace" font-size="14.5" fill="#991b1b">Type 'string' is not assignable to type 'number'.</text>
</svg>
