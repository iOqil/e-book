<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>Union (A yoki B) va intersection (A va B) farqi Venn diagramma orqali: union A yoki B ikkala doiraning birlashmasi, intersection A va B esa faqat kesishgan markaz</title>

  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>

  <text x="360" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">union ( | ) va intersection ( &amp; ) — aksincha narsa</text>

  <!-- chap panel: UNION -->
  <text x="190" y="78" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#2563eb">A | B  —  union (A YOKI B)</text>

  <!-- union doiralari: ikkalasi ham ko'k bo'yalgan (birlashma) -->
  <circle cx="155" cy="200" r="80" fill="#2563eb" fill-opacity="0.30" stroke="#2563eb" stroke-width="2"/>
  <circle cx="225" cy="200" r="80" fill="#2563eb" fill-opacity="0.30" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="205" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">A</text>
  <text x="260" y="205" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">B</text>
  <text x="190" y="312" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Hammasi: A bo'lsa ham, B bo'lsa ham yaraydi</text>
  <text x="190" y="334" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">qiymat ikkitadan BIRI bo'lishi mumkin</text>

  <!-- o'ng panel: INTERSECTION -->
  <text x="530" y="78" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#16a34a">A &amp; B  —  intersection (A VA B)</text>

  <!-- intersection: faqat kesishgan markaz bo'yalgan -->
  <defs>
    <clipPath id="leftCircle">
      <circle cx="495" cy="200" r="80"/>
    </clipPath>
  </defs>
  <circle cx="495" cy="200" r="80" fill="#e2e8f0" stroke="#16a34a" stroke-width="2"/>
  <circle cx="565" cy="200" r="80" fill="#e2e8f0" stroke="#16a34a" stroke-width="2"/>
  <circle cx="565" cy="200" r="80" fill="#16a34a" fill-opacity="0.40" clip-path="url(#leftCircle)"/>
  <text x="460" y="205" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">A</text>
  <text x="600" y="205" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">B</text>
  <text x="530" y="312" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Faqat markaz: HAM A, HAM B xossalari</text>
  <text x="530" y="334" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">qiymat IKKALASINI birga qondiradi</text>

  <!-- pastki xulosa qatori -->
  <rect x="60" y="368" width="600" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="390" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">union — variantlardan biri ( "poyezd bileti yoki samolyot bileti" )</text>
  <text x="360" y="410" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">intersection — hamma narsa birga ( "ham ism, ham yosh, ham manzil" )</text>
</svg>
