<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>To'liq tiplangan loyiha arxitekturasi: markazda domen tiplari (interface va union), undan utility tiplar va generic store, chetda esa API/UI chegarasi turadi va tashqi unknown ma'lumot runtime validatsiyadan o'tib ichkariga kiradi</title>
  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Tiplangan loyiha arxitekturasi (tip oqimi)</text>

  <!-- Markaz: domen tiplari -->
  <rect x="270" y="60" width="180" height="86" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="360" y="86" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">Domen tiplari</text>
  <text x="360" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">interface Vazifa</text>
  <text x="360" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">type Holat (union)</text>

  <!-- Strelka pastga -->
  <line x1="360" y1="146" x2="360" y2="178" stroke="#475569" stroke-width="2"/>
  <polygon points="360,186 355,176 365,176" fill="#475569"/>

  <!-- Utility + Generic store qatori -->
  <rect x="60" y="188" width="200" height="78" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="160" y="214" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Utility tiplar</text>
  <text x="160" y="236" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Omit&lt;Vazifa, "id"&gt;</text>
  <text x="160" y="256" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Partial&lt;...&gt;</text>

  <rect x="460" y="188" width="200" height="78" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="560" y="214" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Generic store</text>
  <text x="560" y="236" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Store&lt;T extends</text>
  <text x="560" y="256" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">{ id: number }&gt;</text>

  <!-- domen -> utility/store strelkalari -->
  <line x1="290" y1="160" x2="160" y2="186" stroke="#16a34a" stroke-width="1.8"/>
  <polygon points="160,188 162,177 169,184" fill="#16a34a"/>
  <line x1="430" y1="160" x2="560" y2="186" stroke="#16a34a" stroke-width="1.8"/>
  <polygon points="560,188 551,184 558,177" fill="#16a34a"/>

  <!-- Tiplangan funksiyalar markazda -->
  <rect x="270" y="290" width="180" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="360" y="316" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">Tiplangan funksiyalar</text>
  <text x="360" y="338" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">narrowing, type guard</text>

  <line x1="160" y1="266" x2="300" y2="288" stroke="#7c3aed" stroke-width="1.8"/>
  <polygon points="300,290 291,286 298,279" fill="#7c3aed"/>
  <line x1="560" y1="266" x2="420" y2="288" stroke="#7c3aed" stroke-width="1.8"/>
  <polygon points="420,290 422,279 429,286" fill="#7c3aed"/>

  <!-- Chegara: API / UI -->
  <rect x="270" y="378" width="180" height="62" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="360" y="404" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Chegara: API / UI</text>
  <text x="360" y="426" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">JSON, form, tarmoq</text>

  <line x1="360" y1="350" x2="360" y2="376" stroke="#475569" stroke-width="2"/>
  <polygon points="360,378 355,368 365,368" fill="#475569"/>

  <!-- Tashqi unknown -> validatsiya -->
  <rect x="500" y="378" width="180" height="62" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="590" y="402" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">Tashqi: unknown</text>
  <text x="590" y="424" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">runtime validatsiya</text>

  <line x1="500" y1="409" x2="452" y2="409" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="450,409 460,404 460,414" fill="#f59e0b"/>
  <text x="475" y="464" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">tekshirilgach ishonchli tip bo'lib kiradi</text>
</svg>
