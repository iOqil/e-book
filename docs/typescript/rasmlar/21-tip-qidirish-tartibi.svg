<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>import paytida TypeScript tipni qidirish tartibi: avval paketning o'z .d.ts fayli, keyin node_modules/@types, topilmasa o'z deklaratsiyangiz kerak, aks holda TS7016 xato</title>

  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">import "x" — TypeScript tipni qanday qidiradi</text>

  <!-- boshlanish -->
  <rect x="250" y="56" width="220" height="44" rx="10" fill="#1e293b"/>
  <text x="360" y="84" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#ffffff">import x from "paket"</text>

  <!-- 1-qadam: paket o'z tipi -->
  <line x1="360" y1="100" x2="360" y2="120" stroke="#475569" stroke-width="2"/>
  <polygon points="360,120 355,110 365,110" fill="#475569"/>
  <rect x="120" y="120" width="480" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="145" y="146" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">1) Paketning o'zida tip bormi?</text>
  <text x="145" y="168" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">package.json "types" maydoni yoki birga kelgan index.d.ts</text>
  <text x="575" y="155" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">bor → ✓</text>

  <!-- yo'q strelka -->
  <line x1="360" y1="178" x2="360" y2="198" stroke="#dc2626" stroke-width="2"/>
  <polygon points="360,198 355,188 365,188" fill="#dc2626"/>
  <text x="385" y="193" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">yo'q</text>

  <!-- 2-qadam: @types -->
  <rect x="120" y="198" width="480" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="145" y="224" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">2) node_modules/@types/paket bormi?</text>
  <text x="145" y="246" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">npm i -D @types/paket bilan o'rnatilgan bo'lsa</text>
  <text x="575" y="233" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">bor → ✓</text>

  <line x1="360" y1="256" x2="360" y2="276" stroke="#dc2626" stroke-width="2"/>
  <polygon points="360,276 355,266 365,266" fill="#dc2626"/>
  <text x="385" y="271" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">yo'q</text>

  <!-- 3-qadam: o'z deklaratsiyangiz -->
  <rect x="120" y="276" width="480" height="58" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="145" y="302" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b45309">3) Loyihada o'z .d.ts faylingiz bormi?</text>
  <text x="145" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">declare module "paket" — o'zingiz yozgan</text>
  <text x="575" y="311" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">bor → ✓</text>

  <line x1="360" y1="334" x2="360" y2="354" stroke="#dc2626" stroke-width="2"/>
  <polygon points="360,354 355,344 365,344" fill="#dc2626"/>
  <text x="385" y="349" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">yo'q</text>

  <!-- xato -->
  <rect x="120" y="354" width="480" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="360" y="380" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">XATO TS7016</text>
  <text x="360" y="404" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#991b1b">Could not find a declaration file for module 'paket'</text>

  <text x="360" y="448" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Yashil topilsa, qidiruv to'xtaydi. Qizil yo'l — 1, 2, 3 ham bo'lmaganda xato chiqadi.</text>
</svg>
