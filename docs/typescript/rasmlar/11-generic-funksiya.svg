<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <title>Generic funksiya identity: kirgan T tipi funksiya orqali o'tib, xuddi shu T tipi chiqadi — kirish va chiqish bir tip bilan bog'lanadi (string -> string, number -> number)</title>
  <rect x="0" y="0" width="720" height="380" fill="#f8fafc"/>

  <text x="360" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Generic funksiya: nima kirsa, shu chiqadi</text>

  <!-- kod -->
  <rect x="200" y="56" width="320" height="34" rx="6" fill="#1e293b"/>
  <text x="360" y="79" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#e2e8f0">function identity&lt;T&gt;(q: T): T</text>

  <!-- 1-qator: string -->
  <text x="60" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">kirish</text>
  <rect x="40" y="160" width="120" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="100" y="183" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#1e293b">"salom"</text>
  <text x="100" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">string</text>

  <!-- quvur -->
  <rect x="270" y="158" width="180" height="50" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#475569">identity&lt;T&gt;</text>
  <text x="360" y="199" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#7c3aed">T = string</text>

  <rect x="560" y="160" width="120" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="620" y="183" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#1e293b">"salom"</text>
  <text x="620" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">string</text>
  <text x="620" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">chiqish</text>

  <!-- strelkalar 1-qator -->
  <line x1="160" y1="183" x2="266" y2="183" stroke="#2563eb" stroke-width="2.5" marker-end="url(#strelka-kok)"/>
  <line x1="450" y1="183" x2="556" y2="183" stroke="#2563eb" stroke-width="2.5" marker-end="url(#strelka-kok)"/>

  <!-- 2-qator: number -->
  <rect x="40" y="252" width="120" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="100" y="275" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#1e293b">42</text>
  <text x="100" y="292" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">number</text>

  <rect x="270" y="250" width="180" height="50" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="272" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#475569">identity&lt;T&gt;</text>
  <text x="360" y="291" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#7c3aed">T = number</text>

  <rect x="560" y="252" width="120" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="275" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#1e293b">42</text>
  <text x="620" y="292" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">number</text>

  <line x1="160" y1="275" x2="266" y2="275" stroke="#16a34a" stroke-width="2.5" marker-end="url(#strelka-yashil)"/>
  <line x1="450" y1="275" x2="556" y2="275" stroke="#16a34a" stroke-width="2.5" marker-end="url(#strelka-yashil)"/>

  <text x="360" y="345" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">T chaqiruvdagi argumentdan topiladi va kirish-chiqish bitta tip bilan bog'lanadi</text>

  <defs>
    <marker id="strelka-kok" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
    <marker id="strelka-yashil" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
