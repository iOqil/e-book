<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>Template literal type ichida ikki union birlashtirilganda natija ularning ko'paytmasi bo'ladi: 2 ta vertikal x 2 ta gorizontal = 4 ta aniq string varianti</title>

  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Union x Union = ko'paytma (har juftlik)</text>

  <text x="360" y="68" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">type Burchak = `${Vertikal}-${Gorizontal}`</text>

  <!-- chap union -->
  <text x="130" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">Vertikal</text>
  <rect x="60" y="116" width="140" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="143" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">"top"</text>
  <rect x="60" y="166" width="140" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="193" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">"bottom"</text>

  <!-- belgisi x -->
  <text x="250" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#7c3aed">x</text>

  <!-- o'ng union -->
  <text x="370" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">Gorizontal</text>
  <rect x="300" y="116" width="140" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="370" y="143" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">"left"</text>
  <rect x="300" y="166" width="140" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="370" y="193" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">"right"</text>

  <!-- belgisi = -->
  <text x="490" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#475569">=</text>

  <!-- natija ustuni -->
  <text x="610" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b45309">Burchak (4 ta)</text>
  <rect x="528" y="116" width="164" height="200" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="610" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">"top-left"</text>
  <text x="610" y="176" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">"top-right"</text>
  <text x="610" y="206" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">"bottom-left"</text>
  <text x="610" y="236" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">"bottom-right"</text>
  <line x1="540" y1="256" x2="680" y2="256" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="610" y="282" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">2 x 2 = 4 variant</text>
  <text x="610" y="304" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">hammasi avtomatik</text>

  <!-- bog'lovchi chiziqlar -->
  <line x1="200" y1="137" x2="300" y2="137" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="200" y1="137" x2="300" y2="187" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="200" y1="187" x2="300" y2="137" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="200" y1="187" x2="300" y2="187" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- pastki izoh / ogohlantirish -->
  <rect x="60" y="346" width="600" height="62" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="360" y="372" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">Diqqat: variantlar son KO'PAYTMA bo'lib o'sadi</text>
  <text x="360" y="396" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">3 union x 3 x 3 = 27 ... katta unionlarda partlab ketishi mumkin (me'yorida ishlating)</text>
</svg>
