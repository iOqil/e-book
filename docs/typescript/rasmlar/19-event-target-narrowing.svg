<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>event.target tipi EventTarget yoki null bo'lib value xossasi yo'q; instanceof HTMLInputElement tekshiruvi orqali aniq input turiga torayadi va value ishlatish mumkin bo'ladi</title>
  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">event.target tuzog'i va narrowing</text>

  <!-- e.target boshlang'ich tipi -->
  <rect x="210" y="58" width="300" height="58" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="360" y="82" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">e.target</text>
  <text x="360" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">EventTarget | null</text>

  <!-- nega kambag'al izohi -->
  <text x="360" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">null bo'lishi mumkin · EventTarget umumiy: .value u yoqda tursin, .tagName ham yo'q</text>

  <!-- strelka pastga -->
  <line x1="360" y1="148" x2="360" y2="172" stroke="#475569" stroke-width="2"/>
  <polygon points="360,180 354,170 366,170" fill="#475569"/>

  <!-- instanceof tekshiruv romb -->
  <polygon points="360,182 510,227 360,272 210,227" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="360" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">e.target instanceof</text>
  <text x="360" y="242" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#b45309">HTMLInputElement ?</text>

  <!-- ROST shoxi (chap) -->
  <line x1="210" y1="227" x2="130" y2="227" stroke="#16a34a" stroke-width="2"/>
  <line x1="130" y1="227" x2="130" y2="306" stroke="#16a34a" stroke-width="2"/>
  <polygon points="130,314 124,304 136,304" fill="#16a34a"/>
  <text x="170" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">rost</text>

  <rect x="30" y="316" width="200" height="74" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="130" y="342" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">shox ichida</text>
  <text x="130" y="363" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">HTMLInputElement</text>
  <text x="130" y="383" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">e.target.value ✅ ishlaydi</text>

  <!-- YOLG'ON shoxi (o'ng) -->
  <line x1="510" y1="227" x2="590" y2="227" stroke="#dc2626" stroke-width="2"/>
  <line x1="590" y1="227" x2="590" y2="306" stroke="#dc2626" stroke-width="2"/>
  <polygon points="590,314 584,304 596,304" fill="#dc2626"/>
  <text x="550" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">yolg'on</text>

  <rect x="490" y="316" width="200" height="74" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="590" y="342" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#475569">boshqa element</text>
  <text x="590" y="363" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">value'ga tegmaymiz</text>
  <text x="590" y="383" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">qulash xavfi yo'q</text>

  <!-- pastki izoh -->
  <text x="360" y="416" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">instanceof runtime'da HAQIQATAN tekshiriladi — shu sababli cast'dan xavfsizroq</text>
</svg>
