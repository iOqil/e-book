<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <title>Type annotation anatomiyasi: let ism: string = "Oqil" qatorining beshta qismi (let kalit so'zi, o'zgaruvchi nomi, ikki nuqta, tur, qiymat) ajratib izohlangan</title>

  <rect x="0" y="0" width="720" height="420" fill="#f8fafc"/>

  <text x="360" y="38" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Type annotation anatomiyasi</text>

  <!-- Kod qatori (katta) -->
  <rect x="70" y="70" width="580" height="64" rx="8" fill="#1e293b"/>
  <text x="92" y="112" font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#e2e8f0">let </text>
  <text x="150" y="112" font-family="Consolas, 'Courier New', monospace" font-size="26" font-weight="bold" fill="#f59e0b">ism</text>
  <text x="202" y="112" font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#e2e8f0">:</text>
  <text x="224" y="112" font-family="Consolas, 'Courier New', monospace" font-size="26" font-weight="bold" fill="#2563eb">string</text>
  <text x="334" y="112" font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#e2e8f0">=</text>
  <text x="364" y="112" font-family="Consolas, 'Courier New', monospace" font-size="26" font-weight="bold" fill="#16a34a">"Oqil"</text>
  <text x="478" y="112" font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#e2e8f0">;</text>

  <!-- Ko'rsatkich chiziqlari -->
  <!-- let -->
  <line x1="108" y1="138" x2="108" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <text x="108" y="202" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#475569">kalit so'z</text>
  <text x="108" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(e'lon)</text>

  <!-- ism -->
  <line x1="172" y1="138" x2="172" y2="250" stroke="#f59e0b" stroke-width="2"/>
  <rect x="100" y="252" width="160" height="56" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="180" y="276" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b45309">o'zgaruvchi nomi</text>
  <text x="180" y="298" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#92400e">o'zingiz tanlaysiz</text>

  <!-- ikki nuqta -->
  <line x1="213" y1="138" x2="213" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <text x="213" y="202" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#475569">:</text>
  <text x="213" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">"turi —"</text>

  <!-- string (tur) -->
  <line x1="279" y1="138" x2="279" y2="330" stroke="#2563eb" stroke-width="2"/>
  <rect x="290" y="252" width="170" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="375" y="276" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">TUR (annotation)</text>
  <text x="375" y="298" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e40af">qanday qiymat kelishi</text>

  <!-- qiymat -->
  <line x1="412" y1="138" x2="412" y2="362" stroke="#16a34a" stroke-width="2"/>
  <rect x="490" y="252" width="160" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="570" y="276" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">QIYMAT</text>
  <text x="570" y="298" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#15803d">boshlang'ich ma'lumot</text>

  <!-- pastki izoh -->
  <text x="360" y="360" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">O'qilishi: "ism nomli o'zgaruvchi string turida, qiymati Oqil"</text>
  <text x="360" y="392" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">Endi ism'ga faqat string qiymat keladi — son yoki boolean rad etiladi</text>
</svg>
