<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>Access modifiers ko'rinish doiralari: public hamma joydan, protected klass va avlodlardan, private va #private faqat klass ichidan ko'rinadi</title>

  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Access modifiers — maydon qayerdan ko'rinadi?</text>

  <!-- Tashqi doira: public ko'rinish maydoni -->
  <rect x="40" y="56" width="640" height="330" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="58" y="80" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">Tashqi kod (boshqa fayllar, foydalanuvchilar)</text>

  <!-- O'rta doira: avlod klasslar -->
  <rect x="90" y="98" width="540" height="248" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="108" y="122" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b45309">Avlod klasslar (extends bilan meros olganlar)</text>

  <!-- Ichki doira: klassning o'zi -->
  <rect x="150" y="142" width="420" height="184" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="170" y="166" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">Klassning o'zi (ichki metodlar)</text>

  <!-- public qatori -->
  <text x="360" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">public ism</text>
  <text x="360" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">hamma joydan ko'rinadi (default)</text>

  <!-- protected qatori -->
  <text x="360" y="250" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b45309">protected nom</text>
  <text x="360" y="270" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">klass + avlodlardan ko'rinadi</text>

  <!-- private qatori -->
  <text x="360" y="300" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">private balans   /   #parol</text>
  <text x="360" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">faqat shu klass ichidan ko'rinadi</text>

  <!-- pastki izoh -->
  <text x="360" y="416" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">private — TS tekshiruvi (compile); #private — JS native, run paytida ham qulflangan</text>
  <text x="360" y="444" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Doira qancha ichkari bo'lsa, maydon shuncha kam joydan ko'rinadi</text>
</svg>
