<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>Pick va Omit farqi: Pick faqat tanlangan maydonlarni oladi, Omit esa tanlangan maydonlardan tashqari hammasini qoldiradi. Ikkalasi bir xil Maqola tipidan turli natija beradi</title>
  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Pick vs Omit — maydon tanlash yoki olib tashlash</text>

  <!-- Asl tip markazda yuqorida -->
  <rect x="260" y="56" width="200" height="150" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="280" y="82" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Maqola</text>
  <line x1="260" y1="92" x2="460" y2="92" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="280" y="114" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#2563eb">id: number</text>
  <text x="280" y="138" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#2563eb">sarlavha: string</text>
  <text x="280" y="162" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">matn: string</text>
  <text x="280" y="186" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">muallifId: number</text>

  <!-- Pick chap -->
  <text x="160" y="252" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">Pick&lt;Maqola, "id" | "sarlavha"&gt;</text>
  <text x="160" y="274" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">faqat sanab o'tilganlarini OL</text>
  <rect x="40" y="288" width="240" height="100" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">id: number</text>
  <text x="60" y="350" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">sarlavha: string</text>
  <text x="60" y="378" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">2 ta maydon olindi</text>

  <!-- Omit o'ng -->
  <text x="560" y="252" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">Omit&lt;Maqola, "id" | "sarlavha"&gt;</text>
  <text x="560" y="274" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">sanab o'tilganlardan TASHQARI hammasi</text>
  <rect x="440" y="288" width="240" height="100" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="460" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">matn: string</text>
  <text x="460" y="350" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">muallifId: number</text>
  <text x="460" y="378" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">id va sarlavha olib tashlandi</text>

  <!-- strelkalar -->
  <line x1="300" y1="206" x2="160" y2="284" stroke="#2563eb" stroke-width="2"/>
  <polygon points="160,290 153,279 166,279" fill="#2563eb"/>
  <line x1="420" y1="206" x2="560" y2="284" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="560,290 554,279 567,279" fill="#f59e0b"/>

  <text x="360" y="416" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Qoida: Pick = "shularni qoldir", Omit = "shularni tashla". Omit = qolgan hammasi.</text>
</svg>
