<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470">
  <title>TypeScript JavaScript'ning ustki to'plami: tashqi katta doira TypeScript, uning ichidagi kichik doira JavaScript; har qanday to'g'ri JavaScript bir vaqtning o'zida to'g'ri TypeScript, lekin TypeScript qo'shadigan tip imkoniyatlari JS'da ishlamaydi</title>
  <rect x="0" y="0" width="700" height="470" fill="#f8fafc"/>

  <text x="350" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">TypeScript — JavaScript'ning ustki to'plami</text>

  <!-- tashqi doira: TypeScript -->
  <circle cx="350" cy="250" r="178" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="350" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#2563eb">TypeScript</text>

  <!-- ichki doira: JavaScript -->
  <circle cx="350" cy="285" r="110" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="350" y="250" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#16a34a">JavaScript</text>
  <text x="350" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">let, const, funksiya,</text>
  <text x="350" y="300" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">obyekt, massiv, map,</text>
  <text x="350" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">async/await ...</text>

  <!-- halqa (TS qo'shgan qism) yorliqlari -->
  <text x="350" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e293b">+ type, interface, generic,</text>
  <text x="350" y="168" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e293b">union, narrowing (TS qo'shadi)</text>

  <text x="350" y="408" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">tip yozuvlari faqat tashqi (TS) qatlamda yashaydi</text>

  <!-- pastki izohlar -->
  <text x="350" y="446" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" fill="#16a34a">Har qanday to'g'ri JavaScript = to'g'ri TypeScript</text>
  <text x="350" y="466" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">Lekin teskarisi yo'q: tipli kod sof JS'da ishlamaydi</text>
</svg>
