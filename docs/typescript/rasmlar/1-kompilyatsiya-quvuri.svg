<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <title>TypeScript kompilyatsiya quvuri: .ts fayl tsc kompilyatori orqali tekshiriladi va sof .js faylga aylanadi; bu jarayonda tiplar o'chib ketadi (type erasure), shuning uchun brauzer va Node faqat tiplarsiz JavaScript'ni ishlatadi</title>
  <rect x="0" y="0" width="720" height="380" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">.ts &#8594; tsc &#8594; .js (tiplar o'chadi)</text>

  <!-- 1: .ts fayl -->
  <rect x="36" y="78" width="190" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="131" y="102" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">manba.ts</text>
  <text x="50" y="130" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1e293b">function ikki(</text>
  <text x="50" y="150" font-family="Consolas, Menlo, monospace" font-size="13" fill="#dc2626">  x: number</text>
  <text x="50" y="170" font-family="Consolas, Menlo, monospace" font-size="13" fill="#dc2626">): number {</text>
  <text x="50" y="190" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1e293b">  return x * 2;</text>
  <text x="50" y="210" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1e293b">}</text>

  <!-- strelka 1 -->
  <line x1="230" y1="153" x2="282" y2="153" stroke="#475569" stroke-width="2.5"/>
  <polygon points="284,153 274,148 274,158" fill="#475569"/>

  <!-- 2: tsc -->
  <rect x="288" y="108" width="144" height="92" rx="10" fill="#f59e0b" stroke="#b45309" stroke-width="2.5"/>
  <text x="360" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#1e293b">tsc</text>
  <text x="360" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">tekshiradi +</text>
  <text x="360" y="190" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">o'giradi</text>

  <!-- strelka 2 -->
  <line x1="436" y1="153" x2="488" y2="153" stroke="#475569" stroke-width="2.5"/>
  <polygon points="490,153 480,148 480,158" fill="#475569"/>

  <!-- 3: .js fayl -->
  <rect x="494" y="78" width="190" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="589" y="102" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">manba.js</text>
  <text x="508" y="138" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1e293b">function ikki(</text>
  <text x="508" y="158" font-family="Consolas, Menlo, monospace" font-size="13" fill="#16a34a">  x</text>
  <text x="508" y="178" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1e293b">) {</text>
  <text x="508" y="198" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1e293b">  return x * 2;</text>
  <text x="508" y="218" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1e293b">}</text>

  <!-- type erasure izohi -->
  <rect x="300" y="232" width="290" height="32" rx="8" fill="#fef3c7" stroke="#dc2626" stroke-width="1.5"/>
  <text x="445" y="253" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#dc2626">: number qizil &#8594; o'chdi (type erasure)</text>

  <!-- brauzer/node -->
  <rect x="494" y="290" width="190" height="50" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="589" y="312" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Brauzer / Node</text>
  <text x="589" y="331" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">faqat .js ni ishlatadi</text>

  <line x1="589" y1="228" x2="589" y2="286" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="589,288 584,278 594,278" fill="#94a3b8"/>

  <text x="360" y="366" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Tiplar faqat yozish va tekshirishda yashaydi; tayyor JavaScript'da ular yo'q</text>
</svg>
