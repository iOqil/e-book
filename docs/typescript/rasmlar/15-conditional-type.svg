<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460">
  <title>Conditional type bir if-shartiga o'xshaydi: T extends U ? X : Y. T tipi U ga mos kelsa X tip, aks holda Y tip tanlanadi. Misolda IsString tipi string uchun ha, number uchun yoq qaytaradi</title>
  <rect x="0" y="0" width="720" height="460" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Conditional type: tip darajasidagi if</text>

  <!-- formula -->
  <rect x="150" y="52" width="420" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="79" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#2563eb">T extends U ? X : Y</text>

  <!-- savol qutisi -->
  <rect x="270" y="120" width="180" height="56" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="144" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">T tipi U ga</text>
  <text x="360" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">mos keladimi?</text>

  <!-- ha shoxi -->
  <line x1="300" y1="176" x2="200" y2="226" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="196,217 192,231 207,228" fill="#16a34a"/>
  <text x="232" y="206" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">HA (extends)</text>
  <rect x="90" y="230" width="200" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="190" y="261" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">X tipni tanla</text>

  <!-- yoq shoxi -->
  <line x1="420" y1="176" x2="520" y2="226" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="524,217 528,231 513,228" fill="#dc2626"/>
  <text x="500" y="206" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">YO'Q</text>
  <rect x="430" y="230" width="200" height="50" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="530" y="261" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">Y tipni tanla</text>

  <!-- misol -->
  <rect x="40" y="310" width="642" height="130" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="338" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Misol: type IsString&lt;T&gt; = T extends string ? "ha" : "yoq"</text>

  <text x="60" y="372" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">IsString&lt;string&gt;</text>
  <text x="230" y="372" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">string extends string ?</text>
  <text x="430" y="372" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a" font-weight="bold">HA</text>
  <text x="560" y="372" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">"ha"</text>

  <text x="60" y="408" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">IsString&lt;number&gt;</text>
  <text x="230" y="408" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">number extends string ?</text>
  <text x="430" y="408" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626" font-weight="bold">YO'Q</text>
  <text x="560" y="408" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">"yoq"</text>
</svg>
