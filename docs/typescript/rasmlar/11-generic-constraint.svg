<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>Generic constraint T extends { length: number }: length xususiyati bor tiplar (string, massiv, mos obyekt) o'tadi; length'i yo'q tiplar (number, boolean) rad etiladi</title>
  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Constraint: T ga "eng kam talab" qo'yish</text>

  <!-- shart qutisi (filtr) -->
  <rect x="240" y="60" width="240" height="56" rx="10" fill="#1e293b"/>
  <text x="360" y="84" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#e2e8f0">&lt;T extends</text>
  <text x="360" y="104" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#f59e0b">{ length: number }&gt;</text>

  <text x="360" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#475569">"length xususiyating bormi?"</text>

  <!-- O'TADI ustuni -->
  <text x="180" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">O'tadi (length bor)</text>

  <rect x="60" y="192" width="240" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="80" y="217" font-family="Consolas, monospace" font-size="14" fill="#1e293b">"salom"</text>
  <text x="288" y="217" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">length = 5</text>

  <rect x="60" y="242" width="240" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="80" y="267" font-family="Consolas, monospace" font-size="14" fill="#1e293b">[1, 2, 3]</text>
  <text x="288" y="267" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">length = 3</text>

  <rect x="60" y="292" width="240" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="80" y="317" font-family="Consolas, monospace" font-size="13" fill="#1e293b">{ length: 10 }</text>
  <text x="288" y="317" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">length = 10</text>

  <!-- RAD ETILADI ustuni -->
  <text x="540" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">Rad etiladi (length yo'q)</text>

  <rect x="420" y="192" width="240" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="440" y="217" font-family="Consolas, monospace" font-size="14" fill="#1e293b">42</text>
  <text x="648" y="217" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">number — length yo'q</text>

  <rect x="420" y="242" width="240" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="440" y="267" font-family="Consolas, monospace" font-size="14" fill="#1e293b">true</text>
  <text x="648" y="267" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">boolean — length yo'q</text>

  <!-- strelkalar shartdan ustunlarga -->
  <line x1="300" y1="100" x2="180" y2="166" stroke="#16a34a" stroke-width="2.5" marker-end="url(#c-yashil)"/>
  <line x1="420" y1="100" x2="540" y2="166" stroke="#dc2626" stroke-width="2.5" marker-end="url(#c-qizil)"/>

  <!-- pastki izoh -->
  <rect x="60" y="358" width="600" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="380" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Shart tufayli funksiya ICHIDA narsa.length xavfsiz ishlaydi —</text>
  <text x="360" y="400" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">TS T'da length borligiga kafolat bergan</text>

  <defs>
    <marker id="c-yashil" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/></marker>
    <marker id="c-qizil" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/></marker>
  </defs>
</svg>
