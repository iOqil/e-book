<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>Kompozitsiya: kichik mustaqil tiplar (Ismli, Yoshli, Manzilli, Vaqtlangan) intersection ampersand belgisi bilan birlashtirilib, katta Mijoz tipi quriladi</title>

  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>

  <text x="360" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Kompozitsiya: kichik bloklardan katta tip qurish</text>
  <text x="360" y="60" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">har bir blok mustaqil va qayta ishlatiladi; ularni &amp; bilan ulab katta tip hosil qilamiz</text>

  <!-- yuqori qator: kichik bloklar -->
  <!-- blok 1 -->
  <rect x="40" y="92" width="140" height="78" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">Ismli</text>
  <line x1="52" y1="126" x2="168" y2="126" stroke="#93c5fd" stroke-width="1"/>
  <text x="110" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">ism: string</text>

  <!-- blok 2 -->
  <rect x="210" y="92" width="140" height="78" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="280" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">Yoshli</text>
  <line x1="222" y1="126" x2="338" y2="126" stroke="#93c5fd" stroke-width="1"/>
  <text x="280" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">yosh: number</text>

  <!-- blok 3 -->
  <rect x="380" y="92" width="140" height="78" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">Manzilli</text>
  <line x1="392" y1="126" x2="508" y2="126" stroke="#93c5fd" stroke-width="1"/>
  <text x="450" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">manzil: string</text>

  <!-- blok 4 -->
  <rect x="550" y="92" width="140" height="78" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="620" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">Vaqtlangan</text>
  <line x1="562" y1="126" x2="678" y2="126" stroke="#93c5fd" stroke-width="1"/>
  <text x="620" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">yaratilgan: Date</text>

  <!-- & belgilari bloklar orasida -->
  <text x="195" y="137" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#16a34a">&amp;</text>
  <text x="365" y="137" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#16a34a">&amp;</text>
  <text x="535" y="137" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#16a34a">&amp;</text>

  <!-- pastga tushuvchi strelkalar -->
  <line x1="110" y1="170" x2="280" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <line x1="280" y1="170" x2="320" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <line x1="450" y1="170" x2="400" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <line x1="620" y1="170" x2="440" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="360,242 352,228 368,228" fill="#94a3b8"/>

  <!-- pastki katta tip -->
  <rect x="180" y="252" width="360" height="170" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="360" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#16a34a">type Mijoz = Ismli &amp; Yoshli &amp; Manzilli &amp; Vaqtlangan</text>
  <line x1="200" y1="294" x2="520" y2="294" stroke="#86efac" stroke-width="1.5"/>
  <text x="360" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">ism: string</text>
  <text x="360" y="344" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">yosh: number</text>
  <text x="360" y="368" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">manzil: string</text>
  <text x="360" y="392" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">yaratilgan: Date</text>
  <text x="360" y="414" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">HAMMA blokning xossalari birga</text>

  <text x="360" y="450" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Lego kabi: kichik bo'laklar tayyor, ularni kerakli tartibda yig'asiz</text>
</svg>
