<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">
  <title>Funksiya tipining anatomiyasi: nom, parametr tiplari va return tipi qanday joylashgani</title>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="400" fill="#f8fafc"/>

  <text x="360" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Funksiya tipining anatomiyasi</text>

  <!-- kod qatori -->
  <text x="360" y="118" text-anchor="middle" font-family="Consolas, Segoe UI, monospace" font-size="22" fill="#1e293b">
    <tspan fill="#7c3aed">function</tspan> <tspan fill="#1e293b">qosh</tspan>(<tspan fill="#2563eb">a: number</tspan>, <tspan fill="#2563eb">b: number</tspan>)<tspan fill="#16a34a">: number</tspan> {</text>
  <text x="360" y="148" text-anchor="middle" font-family="Consolas, Segoe UI, monospace" font-size="18" fill="#475569">&#160;&#160;&#160;return a + b;</text>
  <text x="360" y="172" text-anchor="middle" font-family="Consolas, Segoe UI, monospace" font-size="18" fill="#1e293b">}</text>

  <!-- parametr strelkalari -->
  <line x1="205" y1="135" x2="205" y2="225" stroke="#2563eb" stroke-width="2"/>
  <line x1="335" y1="135" x2="335" y2="225" stroke="#2563eb" stroke-width="2"/>
  <rect x="120" y="225" width="300" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="270" y="247" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">Parametr tiplari (kirish)</text>
  <text x="270" y="263" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">funksiya nimani qabul qiladi</text>

  <!-- return strelkasi -->
  <line x1="475" y1="125" x2="475" y2="225" stroke="#16a34a" stroke-width="2"/>
  <rect x="440" y="225" width="240" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="560" y="247" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Return tipi (chiqish)</text>
  <text x="560" y="263" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">funksiya nimani qaytaradi</text>

  <!-- pastki izoh -->
  <rect x="60" y="300" width="600" height="74" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="328" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b45309">Annotation = TS bilan tuzilgan shartnoma</text>
  <text x="360" y="352" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Notogri tip bersangiz yoki notogri tip qaytarsangiz — compiler darrov ogohlantiradi</text>
</svg>
