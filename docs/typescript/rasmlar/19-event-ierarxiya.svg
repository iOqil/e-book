<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>Event tiplari ierarxiyasi: eng umumiy Event'dan UIEvent, undan MouseEvent va KeyboardEvent kabi maxsus turlar kelib chiqadi; pastga tushgan sari xossalar ko'payadi</title>
  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>

  <text x="360" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Event tiplari ierarxiyasi</text>

  <!-- Event (tepa) -->
  <rect x="280" y="56" width="160" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="360" y="80" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">Event</text>
  <text x="360" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">type, target, preventDefault()</text>

  <!-- strelka Event -> UIEvent -->
  <line x1="360" y1="112" x2="360" y2="138" stroke="#475569" stroke-width="2"/>
  <polygon points="360,146 354,136 366,136" fill="#475569"/>

  <!-- UIEvent -->
  <rect x="280" y="148" width="160" height="50" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="170" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">UIEvent</text>
  <text x="360" y="189" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">+ view, detail</text>

  <!-- tarmoqlanish chiziqlari UIEvent -> 3 ta bola -->
  <line x1="360" y1="198" x2="360" y2="218" stroke="#475569" stroke-width="2"/>
  <line x1="150" y1="218" x2="570" y2="218" stroke="#475569" stroke-width="2"/>
  <line x1="150" y1="218" x2="150" y2="248" stroke="#475569" stroke-width="2"/>
  <polygon points="150,256 144,246 156,246" fill="#475569"/>
  <line x1="360" y1="218" x2="360" y2="248" stroke="#475569" stroke-width="2"/>
  <polygon points="360,256 354,246 366,246" fill="#475569"/>
  <line x1="570" y1="218" x2="570" y2="248" stroke="#475569" stroke-width="2"/>
  <polygon points="570,256 564,246 576,246" fill="#475569"/>

  <!-- MouseEvent -->
  <rect x="40" y="258" width="220" height="72" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="150" y="282" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">MouseEvent</text>
  <text x="150" y="302" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">+ clientX, clientY, button</text>
  <text x="150" y="321" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">"click", "mousemove"</text>

  <!-- KeyboardEvent -->
  <rect x="280" y="258" width="160" height="72" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="360" y="282" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">KeyboardEvent</text>
  <text x="360" y="302" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">+ key, code</text>
  <text x="360" y="321" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">"keydown", "keyup"</text>

  <!-- InputEvent -->
  <rect x="460" y="258" width="220" height="72" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="570" y="282" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">InputEvent</text>
  <text x="570" y="302" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">+ data, inputType</text>
  <text x="570" y="321" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">"input", "beforeinput"</text>

  <!-- PointerEvent eslatma -->
  <rect x="40" y="346" width="220" height="40" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="150" y="364" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">"click" aslida PointerEvent —</text>
  <text x="150" y="380" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">MouseEvent'dan kelib chiqqan</text>

  <!-- pastki xulosa -->
  <text x="360" y="416" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Pastga tushgan sari xossalar ko'payadi: Event'da clientX yo'q, MouseEvent'da bor</text>
  <text x="360" y="444" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">addEventListener event nomiga qarab to'g'ri tipni O'ZI tanlaydi</text>
</svg>
