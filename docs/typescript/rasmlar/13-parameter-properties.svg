<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>Parameter properties: konstruktor parametriga public/private/readonly yozilsa, TypeScript maydonni avtomatik yaratadi va o'zlashtiradi</title>

  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Parameter properties — qisqa konstruktor</text>

  <!-- Chap: uzun yo'l -->
  <text x="180" y="74" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">Uzun yo'l (qo'lda)</text>
  <rect x="30" y="88" width="300" height="246" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="48" y="116" font-family="Consolas, monospace" font-size="13" fill="#1e293b">class Talaba {</text>
  <text x="62" y="140" font-family="Consolas, monospace" font-size="13" fill="#dc2626">  private ism: string;</text>
  <text x="62" y="160" font-family="Consolas, monospace" font-size="13" fill="#dc2626">  private ball: number;</text>
  <text x="62" y="190" font-family="Consolas, monospace" font-size="13" fill="#1e293b">  constructor(</text>
  <text x="76" y="210" font-family="Consolas, monospace" font-size="13" fill="#1e293b">    ism: string,</text>
  <text x="76" y="230" font-family="Consolas, monospace" font-size="13" fill="#1e293b">    ball: number) {</text>
  <text x="76" y="256" font-family="Consolas, monospace" font-size="13" fill="#dc2626">    this.ism = ism;</text>
  <text x="76" y="276" font-family="Consolas, monospace" font-size="13" fill="#dc2626">    this.ball = ball;</text>
  <text x="62" y="300" font-family="Consolas, monospace" font-size="13" fill="#1e293b">  }</text>
  <text x="48" y="324" font-family="Consolas, monospace" font-size="13" fill="#1e293b">}</text>

  <!-- O'q -->
  <line x1="340" y1="210" x2="392" y2="210" stroke="#16a34a" stroke-width="3"/>
  <polygon points="392,202 408,210 392,218" fill="#16a34a"/>

  <!-- O'ng: qisqa yo'l -->
  <text x="540" y="74" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">Qisqa yo'l (parameter properties)</text>
  <rect x="416" y="88" width="280" height="150" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="434" y="116" font-family="Consolas, monospace" font-size="13" fill="#1e293b">class Talaba {</text>
  <text x="448" y="140" font-family="Consolas, monospace" font-size="13" fill="#1e293b">  constructor(</text>
  <text x="462" y="164" font-family="Consolas, monospace" font-size="13" fill="#16a34a">    private ism: string,</text>
  <text x="462" y="188" font-family="Consolas, monospace" font-size="13" fill="#16a34a">    private ball: number</text>
  <text x="448" y="212" font-family="Consolas, monospace" font-size="13" fill="#1e293b">  ) {}</text>
  <text x="434" y="232" font-family="Consolas, monospace" font-size="13" fill="#1e293b">}</text>

  <!-- Pastki tushuntirish -->
  <rect x="416" y="256" width="280" height="84" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="556" y="282" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#2563eb">TS avtomatik bajaradi:</text>
  <text x="556" y="304" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">1) maydonni yaratadi</text>
  <text x="556" y="324" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">2) this.x = x ni qo'shadi</text>

  <text x="360" y="380" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">public / private / protected / readonly — parametrga yozilsa, maydon "tug'iladi"</text>
  <text x="360" y="406" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Hech qanday modifier bo'lmasa — oddiy parametr, maydon yaratilmaydi</text>
</svg>
