<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>@types/lodash paketi DefinitelyTyped jamoat repozitoriysidan npm orqali node_modules/@types papkasiga o'rnatiladi va TypeScript uni avtomatik topadi</title>

  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">@types paketi qayerdan keladi?</text>

  <!-- DefinitelyTyped manba -->
  <rect x="40" y="64" width="220" height="130" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">DefinitelyTyped</text>
  <text x="150" y="113" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">jamoat GitHub repo</text>
  <text x="150" y="135" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">minglab kutubxona uchun</text>
  <text x="150" y="157" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">qo'lda yozilgan tiplar</text>
  <text x="150" y="181" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#2563eb">@types/* paketlari</text>

  <!-- strelka 1 -->
  <line x1="265" y1="129" x2="335" y2="129" stroke="#475569" stroke-width="2.5"/>
  <polygon points="335,129 325,124 325,134" fill="#475569"/>
  <text x="300" y="118" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">nashr</text>

  <!-- npm registry -->
  <rect x="340" y="84" width="160" height="90" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="420" y="118" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">npm registry</text>
  <text x="420" y="142" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">npmjs.com</text>
  <text x="420" y="162" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">(public paketlar)</text>

  <!-- strelka 2 -->
  <line x1="505" y1="129" x2="575" y2="129" stroke="#475569" stroke-width="2.5"/>
  <polygon points="575,129 565,124 565,134" fill="#475569"/>

  <!-- terminal buyruq -->
  <rect x="500" y="186" width="200" height="40" rx="6" fill="#1e293b"/>
  <text x="600" y="211" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#ffffff">npm i -D @types/lodash</text>

  <!-- loyiha -->
  <rect x="560" y="64" width="130" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="625" y="96" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">Loyihangiz</text>
  <text x="625" y="120" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">node_modules/</text>
  <text x="625" y="142" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#16a34a">@types/lodash</text>

  <!-- pastki blok: TS avtomatik topadi -->
  <rect x="120" y="252" width="480" height="120" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">TypeScript uni AVTOMATIK topadi</text>
  <text x="360" y="304" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">node_modules/@types ichidagi hamma paket o'z-o'zidan ulanadi</text>

  <rect x="160" y="320" width="400" height="36" rx="6" fill="#0f172a"/>
  <text x="180" y="343" font-family="Consolas, monospace" font-size="13" fill="#7dd3fc">import</text>
  <text x="242" y="343" font-family="Consolas, monospace" font-size="13" fill="#ffffff"> _ </text>
  <text x="266" y="343" font-family="Consolas, monospace" font-size="13" fill="#7dd3fc">from</text>
  <text x="316" y="343" font-family="Consolas, monospace" font-size="13" fill="#86efac">"lodash"</text>
  <text x="404" y="343" font-family="Consolas, monospace" font-size="13" fill="#64748b"> // endi tipli ✓</text>

  <text x="360" y="404" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">-D = devDependencies: tiplar faqat ishlab chiqishda kerak, ishga tushishda emas</text>
</svg>
