<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <title>Promise.all tuple natija: uchta har xil tipdagi Promise parallel kutiladi va natija tartibli tuple bo'lib chiqadi, har bir element o'z tipini saqlaydi</title>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="420" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Promise.all — parallel kutish, tuple natija</text>

  <!-- kirish: 3 ta Promise -->
  <text x="150" y="68" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#475569">Kirish: Promise massivi</text>

  <rect x="40" y="80" width="220" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="107" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#2563eb">Promise&lt;Foydalanuvchi&gt;</text>

  <rect x="40" y="132" width="220" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="159" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#2563eb">Promise&lt;Buyurtma[]&gt;</text>

  <rect x="40" y="184" width="220" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="211" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#2563eb">Promise&lt;number&gt;</text>

  <!-- Promise.all qutisi -->
  <rect x="300" y="118" width="120" height="72" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="360" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">Promise</text>
  <text x="360" y="170" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">.all + await</text>

  <!-- strelkalar kirishdan all'ga -->
  <line x1="262" y1="102" x2="298" y2="138" stroke="#94a3b8" stroke-width="2"/>
  <line x1="262" y1="154" x2="298" y2="154" stroke="#94a3b8" stroke-width="2"/>
  <line x1="262" y1="206" x2="298" y2="170" stroke="#94a3b8" stroke-width="2"/>

  <!-- strelka all'dan natijaga -->
  <line x1="422" y1="154" x2="468" y2="154" stroke="#475569" stroke-width="2.5"/>
  <polygon points="468,154 458,149 458,159" fill="#475569"/>

  <!-- natija: tuple -->
  <text x="585" y="68" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Natija: tartibli tuple</text>

  <rect x="470" y="80" width="230" height="148" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="585" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">[Foydalanuvchi, Buyurtma[], number]</text>

  <line x1="482" y1="116" x2="688" y2="116" stroke="#16a34a" stroke-width="1.5"/>
  <text x="496" y="142" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">[0] user</text>
  <text x="660" y="142" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Foydalanuvchi</text>
  <text x="496" y="170" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">[1] orders</text>
  <text x="660" y="170" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Buyurtma[]</text>
  <text x="496" y="198" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">[2] count</text>
  <text x="660" y="198" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">number</text>
  <text x="585" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">tartib va tip SAQLANADI</text>

  <!-- destrukturizatsiya kodi -->
  <rect x="40" y="256" width="640" height="56" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="58" y="280" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">const [user, orders, count] = await Promise.all([ ... ]);</text>
  <text x="58" y="302" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">user: Foydalanuvchi · orders: Buyurtma[] · count: number — har biri o'z tipini oladi</text>

  <!-- xato eslatma -->
  <rect x="40" y="328" width="640" height="36" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="58" y="352" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#dc2626">user.toFixed(2) ❌ — user Foydalanuvchi obyekti, number emas; toFixed number metodi</text>

  <!-- pastki izoh -->
  <text x="360" y="392" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Bir xil tipdagi Promise'lar uchun Promise.all oddiy massiv (T[]) qaytaradi</text>
  <text x="360" y="412" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Bittasi yiqilsa butun Promise.all reject bo'ladi — ajratish kerak bo'lsa Promise.allSettled</text>
</svg>
