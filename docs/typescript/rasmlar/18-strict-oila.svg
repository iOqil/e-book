<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500">
  <title>strict: true bitta flag — lekin u butun bir oila qattiq tekshiruvlarni yoqadi: noImplicitAny, strictNullChecks, strictFunctionTypes, strictBindCallApply, strictPropertyInitialization, noImplicitThis, useUnknownInCatchVariables, alwaysStrict</title>
  <rect x="0" y="0" width="720" height="500" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">"strict": true  —  bitta tugma, sakkizta tekshiruv</text>
  <text x="360" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Bu bittasini yoqsangiz, quyidagilarning HAMMASI birga yonadi</text>

  <!-- markaziy strict tugmasi -->
  <rect x="270" y="78" width="180" height="56" rx="12" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <text x="360" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">"strict": true</text>
  <text x="360" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dbeafe">asosiy rubilnik</text>

  <!-- ulovchi chiziqlar markazdan pastga -->
  <line x1="360" y1="134" x2="360" y2="158" stroke="#94a3b8" stroke-width="2"/>
  <line x1="130" y1="158" x2="590" y2="158" stroke="#94a3b8" stroke-width="2"/>

  <!-- 8 ta flag katakchasi (2 qator x 4) -->
  <!-- 1-qator -->
  <line x1="130" y1="158" x2="130" y2="178" stroke="#94a3b8" stroke-width="2"/>
  <rect x="40" y="178" width="180" height="68" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="130" y="202" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#15803d">strictNullChecks</text>
  <text x="130" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">null/undefined alohida</text>
  <text x="130" y="238" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tekshiriladi (eng muhim)</text>

  <line x1="283" y1="158" x2="283" y2="178" stroke="#94a3b8" stroke-width="2"/>
  <rect x="240" y="178" width="180" height="68" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="330" y="202" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#15803d">noImplicitAny</text>
  <text x="330" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tipsiz parametr/o'zgaruvchi</text>
  <text x="330" y="238" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">"yashirin any" ta'qiqlanadi</text>

  <line x1="490" y1="158" x2="490" y2="178" stroke="#94a3b8" stroke-width="2"/>
  <rect x="440" y="178" width="180" height="68" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="530" y="202" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#15803d">strictFunctionTypes</text>
  <text x="530" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">funksiya parametrlari</text>
  <text x="530" y="238" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">qattiqroq solishtiriladi</text>

  <!-- 2-qator -->
  <rect x="40" y="262" width="180" height="68" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="130" y="286" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#15803d">strictBindCallApply</text>
  <text x="130" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">call/apply/bind</text>
  <text x="130" y="322" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">argumentlari tekshiriladi</text>

  <rect x="240" y="262" width="180" height="68" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="330" y="282" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#15803d">strictProperty</text>
  <text x="330" y="298" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#15803d">Initialization</text>
  <text x="330" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">class maydoni boshlanishi shart</text>

  <rect x="440" y="262" width="180" height="68" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="530" y="286" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#15803d">noImplicitThis</text>
  <text x="530" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">noaniq "this" — any bo'lsa</text>
  <text x="530" y="322" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">xato beriladi</text>

  <!-- 3-qator: yana 2 ta -->
  <rect x="140" y="346" width="200" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="240" y="370" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#15803d">useUnknownInCatch</text>
  <text x="240" y="390" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">catch (e) -> e: unknown</text>

  <rect x="380" y="346" width="200" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="480" y="370" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#15803d">alwaysStrict</text>
  <text x="480" y="390" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">JS faylga "use strict" qo'shadi</text>

  <!-- pastki izoh -->
  <rect x="40" y="428" width="640" height="52" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="450" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#92400e">Maslahat: bittasini alohida emas, "strict": true yozing — hammasini birga oladi.</text>
  <text x="360" y="470" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#92400e">Birortasini istisno qilmoqchi bo'lsangizgina uni alohida false qilasiz (kamdan-kam holat).</text>
</svg>
