<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <title>any vs generic: any har qanday kirishni 'any' chiqishiga aylantirib tip bog'lanishini yo'qotadi; generic esa kirish tipini chiqish tipi bilan bog'lab saqlaydi</title>
  <rect x="0" y="0" width="720" height="420" fill="#f8fafc"/>

  <text x="360" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">any tipni yo'qotadi, generic saqlaydi</text>

  <!-- CHAP PANEL: any -->
  <rect x="30" y="60" width="320" height="320" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="190" y="90" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#dc2626">any[] -&gt; any</text>

  <rect x="60" y="108" width="120" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="128" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#1e293b">[1, 2, 3]</text>
  <text x="120" y="144" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">number[]</text>

  <rect x="115" y="178" width="150" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="190" y="203" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">birinchiAny()</text>

  <rect x="120" y="248" width="140" height="42" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="190" y="274" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#dc2626">any</text>

  <line x1="120" y1="150" x2="170" y2="174" stroke="#94a3b8" stroke-width="2" marker-end="url(#a-kulrang)"/>
  <line x1="190" y1="218" x2="190" y2="244" stroke="#dc2626" stroke-width="2.5" marker-end="url(#a-qizil)"/>

  <text x="190" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">number ekani UNUTILDI</text>
  <text x="190" y="344" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">.toFixed() o'tadi-yu,</text>
  <text x="190" y="364" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">runtime'da yiqilishi mumkin</text>

  <!-- O'NG PANEL: generic -->
  <rect x="370" y="60" width="320" height="320" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="530" y="90" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#16a34a">T[] -&gt; T | undefined</text>

  <rect x="400" y="108" width="120" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="460" y="128" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#1e293b">[1, 2, 3]</text>
  <text x="460" y="144" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">number[]</text>

  <rect x="455" y="178" width="150" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="530" y="203" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">birinchi&lt;T&gt;()</text>

  <rect x="440" y="248" width="180" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="530" y="274" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#16a34a">number | undefined</text>

  <line x1="460" y1="150" x2="510" y2="174" stroke="#2563eb" stroke-width="2" marker-end="url(#a-kok)"/>
  <line x1="530" y1="218" x2="530" y2="244" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a-yashil)"/>

  <text x="530" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">number ekani SAQLANDI</text>
  <text x="530" y="344" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">noto'g'ri metod kompilyatsiyada</text>
  <text x="530" y="364" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">darrov ushlanadi</text>

  <text x="360" y="404" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Generic: kirish tipi chiqish tipini belgilaydi</text>

  <defs>
    <marker id="a-kulrang" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/></marker>
    <marker id="a-qizil" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/></marker>
    <marker id="a-kok" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker>
    <marker id="a-yashil" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/></marker>
  </defs>
</svg>
