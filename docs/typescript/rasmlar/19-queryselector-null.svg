<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>querySelector Element yoki null qaytaradi: element topilsa Element, topilmasa null; null tekshirilgandan keyingina element ishlatilishi mumkin</title>
  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">querySelector -&gt; Element | null</text>

  <!-- chaqiruv qutisi -->
  <rect x="230" y="58" width="260" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="360" y="89" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">document.querySelector(".saqlash")</text>

  <!-- strelka pastga -->
  <line x1="360" y1="108" x2="360" y2="134" stroke="#475569" stroke-width="2"/>
  <polygon points="360,142 354,132 366,132" fill="#475569"/>

  <!-- tekshiruv romb: element topildimi -->
  <polygon points="360,144 480,189 360,234 240,189" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="360" y="184" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">selektorga mos</text>
  <text x="360" y="204" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#b45309">element bormi?</text>

  <!-- HA shoxi (chap) -->
  <line x1="240" y1="189" x2="150" y2="189" stroke="#16a34a" stroke-width="2"/>
  <line x1="150" y1="189" x2="150" y2="272" stroke="#16a34a" stroke-width="2"/>
  <polygon points="150,280 144,270 156,270" fill="#16a34a"/>
  <text x="194" y="182" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">topildi</text>

  <rect x="50" y="282" width="200" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="150" y="308" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">Element</text>
  <text x="150" y="328" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">.classList, .textContent ...</text>

  <!-- YO'Q shoxi (o'ng) -->
  <line x1="480" y1="189" x2="570" y2="189" stroke="#dc2626" stroke-width="2"/>
  <line x1="570" y1="189" x2="570" y2="272" stroke="#dc2626" stroke-width="2"/>
  <polygon points="570,280 564,270 576,270" fill="#dc2626"/>
  <text x="525" y="182" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">topilmadi</text>

  <rect x="470" y="282" width="200" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="570" y="308" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">null</text>
  <text x="570" y="328" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">hech qanday xossa yo'q</text>

  <!-- pastki xulosa qatori -->
  <rect x="90" y="364" width="540" height="50" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="385" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Natija — Element | null. strictNullChecks: ishlatishdan oldin</text>
  <text x="360" y="405" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">if (tugma) yoki tugma?.  bilan null'ni ushlash MAJBUR</text>
</svg>
