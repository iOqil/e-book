<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <title>tsc ning uchta rejimi: oddiy tsc tiplarni tekshiradi va .js fayl chiqaradi; --noEmit faqat tekshiradi, fayl chiqarmaydi; --watch fayllarni kuzatib o'zgarganda avtomatik qayta compile qiladi</title>

  <rect x="0" y="0" width="720" height="420" fill="#f8fafc"/>

  <text x="360" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">tsc ning uchta rejimi</text>

  <!-- ustun 1: oddiy tsc -->
  <rect x="30" y="64" width="206" height="316" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="133" y="94" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">tsc</text>
  <text x="133" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(oddiy rejim)</text>
  <line x1="50" y1="130" x2="216" y2="130" stroke="#2563eb" stroke-width="1.2"/>
  <text x="133" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">tekshiradi</text>
  <text x="133" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">+ .js chiqaradi</text>
  <rect x="58" y="208" width="150" height="40" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="133" y="233" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">.ts -&gt; .js</text>
  <text x="133" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Qachon: compile</text>
  <text x="133" y="312" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">qilib, natijani</text>
  <text x="133" y="334" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ishlatmoqchi</text>
  <text x="133" y="356" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">bo'lganda</text>

  <!-- ustun 2: noEmit rejimi -->
  <rect x="257" y="64" width="206" height="316" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="360" y="94" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#b45309">tsc --noEmit</text>
  <text x="360" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(faqat tekshirish)</text>
  <line x1="277" y1="130" x2="443" y2="130" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="360" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">tekshiradi</text>
  <text x="360" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">fayl chiqarMAYDI</text>
  <rect x="282" y="208" width="156" height="40" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="233" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">.ts -&gt; (xato?)</text>
  <text x="360" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Qachon: faqat</text>
  <text x="360" y="312" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">"tip xatosi bormi?"</text>
  <text x="360" y="334" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">deb tekshirmoqchi</text>
  <text x="360" y="356" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">bo'lganda</text>

  <!-- ustun 3: watch rejimi -->
  <rect x="484" y="64" width="206" height="316" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="587" y="94" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">tsc --watch</text>
  <text x="587" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(kuzatuv rejimi)</text>
  <line x1="504" y1="130" x2="670" y2="130" stroke="#16a34a" stroke-width="1.2"/>
  <text x="587" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">ishlab turadi va</text>
  <text x="587" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">fayllarni kuzatadi</text>
  <rect x="509" y="208" width="156" height="40" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="587" y="233" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">saqla -&gt; auto compile</text>
  <text x="587" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Qachon: kod</text>
  <text x="587" y="312" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yozayotganda har</text>
  <text x="587" y="334" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">saqlashda darhol</text>
  <text x="587" y="356" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">natija olmoqchi bo'lsa</text>
</svg>
