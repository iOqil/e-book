<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <title>JavaScript runtime xatosi compile-time xatosiga qarama-qarshi: JS xatoni faqat dastur ishlaganda foydalanuvchi brauzerida topadi, TypeScript esa kod yozilayotganda muharrirda topadi</title>
  <rect x="0" y="0" width="720" height="420" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Xato qachon topiladi?</text>

  <!-- JS yo'li -->
  <text x="50" y="78" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#f59e0b">JavaScript</text>

  <rect x="40" y="92" width="150" height="56" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="115" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Kod yoziladi</text>
  <text x="115" y="136" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">jim, xato yo'q</text>

  <rect x="230" y="92" width="150" height="56" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="305" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Brauzerga yetadi</text>
  <text x="305" y="136" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">hali ham jim</text>

  <rect x="420" y="92" width="180" height="56" rx="8" fill="#fef3c7" stroke="#dc2626" stroke-width="2.5"/>
  <text x="510" y="115" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">Dastur ISHLAYDI</text>
  <text x="510" y="135" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">runtime: xato portlaydi!</text>

  <!-- JS strelkalar -->
  <line x1="190" y1="120" x2="226" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="226,120 218,116 218,124" fill="#94a3b8"/>
  <line x1="380" y1="120" x2="416" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="416,120 408,116 408,124" fill="#94a3b8"/>

  <text x="608" y="124" font-family="Segoe UI, system-ui, sans-serif" font-size="26" fill="#dc2626">&#9760;</text>
  <text x="360" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">Xatoni FOYDALANUVCHI ko'radi — eng kech va eng qimmat</text>

  <line x1="40" y1="206" x2="680" y2="206" stroke="#e2e8f0" stroke-width="2"/>

  <!-- TS yo'li -->
  <text x="50" y="248" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#2563eb">TypeScript</text>

  <rect x="40" y="262" width="180" height="56" rx="8" fill="#fef3c7" stroke="#dc2626" stroke-width="2.5"/>
  <text x="130" y="285" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">Kod YOZILADI</text>
  <text x="130" y="305" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">compile-time: xato tutiladi</text>

  <rect x="260" y="262" width="150" height="56" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="335" y="286" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Tuzatiladi</text>
  <text x="335" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">bir necha soniyada</text>

  <rect x="450" y="262" width="150" height="56" rx="8" fill="#e2e8f0" stroke="#16a34a" stroke-width="2"/>
  <text x="525" y="286" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Brauzerda toza</text>
  <text x="525" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">foydalanuvchi xotirjam</text>

  <line x1="220" y1="290" x2="256" y2="290" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="256,290 248,286 248,294" fill="#94a3b8"/>
  <line x1="410" y1="290" x2="446" y2="290" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="446,290 438,286 438,294" fill="#94a3b8"/>

  <text x="628" y="294" font-family="Segoe UI, system-ui, sans-serif" font-size="26" fill="#16a34a">&#10003;</text>
  <text x="360" y="348" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">Xatoni DASTURCHI yozayotganda ko'radi — eng erta va eng arzon</text>

  <!-- xulosa -->
  <rect x="40" y="372" width="640" height="34" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="360" y="394" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#1e293b">Qoida: xato qancha erta topilsa, shuncha arzon tuzatiladi</text>
</svg>
