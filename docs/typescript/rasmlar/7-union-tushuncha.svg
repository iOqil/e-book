<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420">
  <title>Union tip string | number: qiymat ikki tipdan birortasiga tegishli bo'lishi mumkin, birlashma to'plamni hosil qiladi</title>
  <rect x="0" y="0" width="700" height="420" fill="#f8fafc"/>

  <text x="350" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Union tip: string | number</text>
  <text x="350" y="60" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">"yo satr, yo son" — qiymat ikki tipdan birortasi bo'lishi mumkin</text>

  <!-- chap doira: string -->
  <circle cx="270" cy="220" r="115" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5" fill-opacity="0.7"/>
  <text x="205" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#2563eb">string</text>
  <text x="205" y="205" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">"ABC-42"</text>
  <text x="205" y="232" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">"salom"</text>
  <text x="205" y="259" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">"uz"</text>

  <!-- o'ng doira: number -->
  <circle cx="430" cy="220" r="115" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" fill-opacity="0.7"/>
  <text x="495" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#16a34a">number</text>
  <text x="495" y="205" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">42</text>
  <text x="495" y="232" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">3.14</text>
  <text x="495" y="259" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">-7</text>

  <!-- birlashma yorlig'i -->
  <text x="350" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#7c3aed">|</text>

  <!-- pastki izoh -->
  <rect x="120" y="358" width="460" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="350" y="386" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">id qiymati ikki doiradan birortasiga tushadi — boshqasiga (mas. boolean) yo'q</text>
</svg>
