<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <title>Distributive conditional type: conditional union tipga qo'llanganda, union har bir a'zosi ustidan alohida-alohida ishlaydi va natijalar yana union bo'lib birlashadi. ToArray union string number ga string[] number[] beradi</title>
  <rect x="0" y="0" width="720" height="420" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Distributive: union har a'zosi alohida o'tadi</text>

  <text x="360" y="64" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#475569">type ToArray&lt;T&gt; = T extends any ? T[] : never</text>

  <!-- kirish union -->
  <rect x="270" y="84" width="180" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">string | number</text>

  <!-- bo'linish -->
  <line x1="320" y1="128" x2="220" y2="172" stroke="#7c3aed" stroke-width="2.5"/>
  <line x1="400" y1="128" x2="500" y2="172" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="360" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#7c3aed">har a'zoga alohida qo'llanadi</text>

  <!-- a'zo 1 -->
  <rect x="120" y="178" width="200" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="220" y="206" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">string extends any ? string[]</text>

  <!-- a'zo 2 -->
  <rect x="400" y="178" width="200" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="500" y="206" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">number extends any ? number[]</text>

  <!-- natija1 -->
  <line x1="220" y1="222" x2="220" y2="254" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="214,254 220,266 226,254" fill="#16a34a"/>
  <rect x="150" y="270" width="140" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="220" y="296" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">string[]</text>

  <!-- natija2 -->
  <line x1="500" y1="222" x2="500" y2="254" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="494,254 500,266 506,254" fill="#16a34a"/>
  <rect x="430" y="270" width="140" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="296" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">number[]</text>

  <!-- birlashish -->
  <line x1="220" y1="310" x2="330" y2="354" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="500" y1="310" x2="390" y2="354" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="250" y="360" width="220" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="388" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">string[] | number[]</text>
</svg>
