<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 430" width="740" height="430">
  <title>Express tiplangan req/res oqimi: brauzerdan so'rov keladi, Request tipidagi req orqali tiplangan ma'lumot o'qiladi, handler ishlov beradi, Response tipidagi res orqali tiplangan JSON javob qaytariladi</title>
  <rect x="0" y="0" width="740" height="430" fill="#f8fafc"/>

  <text x="370" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Express: tiplangan req &#8594; handler &#8594; res</text>

  <!-- Client -->
  <rect x="30" y="80" width="150" height="120" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="105" y="110" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Brauzer</text>
  <text x="105" y="134" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(mijoz)</text>
  <text x="105" y="166" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">POST</text>
  <text x="105" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">/foydalanuvchi</text>

  <!-- arrow req -->
  <line x1="180" y1="120" x2="270" y2="120" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrE)"/>
  <text x="225" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">so'rov</text>

  <!-- Server handler -->
  <rect x="270" y="64" width="200" height="290" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="370" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">Server (handler)</text>
  <line x1="288" y1="104" x2="452" y2="104" stroke="#93c5fd" stroke-width="1.5"/>

  <!-- req block -->
  <rect x="288" y="116" width="164" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="370" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">req: Request&lt;...&gt;</text>
  <text x="370" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">req.body.ism: string</text>
  <text x="370" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">req.body.yosh: number</text>

  <text x="370" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">ishlov: tekshirish,</text>
  <text x="370" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">saqlash, hisoblash</text>

  <!-- res block -->
  <rect x="288" y="256" width="164" height="80" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="370" y="278" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">res: Response</text>
  <text x="370" y="300" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">res.status(201)</text>
  <text x="370" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">.json({ ... })</text>

  <!-- arrow res -->
  <line x1="470" y1="296" x2="560" y2="296" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrE2)"/>
  <text x="515" y="284" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#b45309">javob</text>

  <!-- response box -->
  <rect x="560" y="256" width="150" height="80" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="635" y="284" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">JSON javob</text>
  <text x="635" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tiplangan shakl</text>
  <text x="635" y="326" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(201 Created)</text>

  <!-- bottom note -->
  <text x="370" y="392" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">@types/express bilan req va res to'liq tiplangan: noto'g'ri maydon yoki metod kompilyatsiyadan o'tmaydi</text>
  <text x="370" y="414" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">Eslatma: req.body tipi faqat kompilyatsiya va'dasi &#8212; runtime'da haqiqatdan tekshirilmaydi</text>

  <defs>
    <marker id="arrE" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrE2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>
</svg>
