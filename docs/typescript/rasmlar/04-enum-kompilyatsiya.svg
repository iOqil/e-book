<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>Numeric enum kompilyatsiyadan keyin JavaScript obyektiga aylanadi va ikki tomonlama bog'lanish (nomdan songa va sondan nomga) hosil qiladi</title>
  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Enum kompilyatsiyadan keyin nimaga aylanadi?</text>

  <!-- chap: TypeScript manba -->
  <text x="170" y="74" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">TypeScript (yozasiz)</text>
  <rect x="40" y="90" width="260" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="122" font-family="Consolas, monospace" font-size="15" fill="#1e293b">enum Yonalish {</text>
  <text x="80" y="148" font-family="Consolas, monospace" font-size="15" fill="#1e293b">Yuqori,</text>
  <text x="80" y="174" font-family="Consolas, monospace" font-size="15" fill="#1e293b">Past,</text>
  <text x="60" y="200" font-family="Consolas, monospace" font-size="15" fill="#1e293b">}</text>

  <!-- strelka -->
  <text x="360" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">tsc</text>
  <line x1="310" y1="160" x2="410" y2="160" stroke="#16a34a" stroke-width="3"/>
  <polygon points="410,154 422,160 410,166" fill="#16a34a"/>

  <!-- o'ng: JS obyekt -->
  <text x="555" y="74" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">JavaScript obyekt (chiqishda)</text>
  <rect x="430" y="90" width="250" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="120" font-family="Consolas, monospace" font-size="14" fill="#1e293b">{</text>
  <text x="470" y="144" font-family="Consolas, monospace" font-size="14" fill="#1e293b">Yuqori: 0,  Past: 1,</text>
  <text x="470" y="172" font-family="Consolas, monospace" font-size="14" fill="#1e293b">0: "Yuqori", 1: "Past"</text>
  <text x="450" y="196" font-family="Consolas, monospace" font-size="14" fill="#1e293b">}</text>

  <!-- ikki tomonlama bog'lanish -->
  <text x="360" y="252" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Reverse mapping — ikki tomonlama bog'lanish</text>

  <rect x="130" y="272" width="180" height="56" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="297" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#1e293b">Yonalish.Yuqori</text>
  <text x="220" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">nom -&gt; son</text>

  <rect x="410" y="272" width="180" height="56" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="297" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#1e293b">Yonalish[0]</text>
  <text x="500" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">son -&gt; nom</text>

  <line x1="310" y1="290" x2="410" y2="290" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="404,284 416,290 404,296" fill="#94a3b8"/>
  <polygon points="316,284 304,290 316,296" fill="#94a3b8"/>
  <text x="360" y="284" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">0</text>

  <!-- pastki eslatma -->
  <rect x="40" y="352" width="640" height="64" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="378" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">Muhim: ko'p tiplar kompilyatsiyada o'chadi, ammo enum — istisno</text>
  <text x="360" y="402" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">enum chiqishda JS obyekt qoldiradi. const enum esa butunlay o'chadi — qiymat o'rniga to'g'ridan-to'g'ri qo'yiladi.</text>
</svg>
