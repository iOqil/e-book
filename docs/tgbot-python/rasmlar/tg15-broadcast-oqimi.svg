<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Segoe UI, sans-serif">
  <title>Broadcast oqimi: admin xabari koplab foydalanuvchilarga, har xil natija bilan</title>
  <rect width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Broadcast: bitta xabar - minglab foydalanuvchi</text>

  <!-- Admin -->
  <rect x="40" y="80" width="150" height="60" rx="10" fill="#2563eb"/>
  <text x="115" y="106" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Admin</text>
  <text x="115" y="126" font-size="13" fill="#dbeafe" text-anchor="middle">/send -&gt; matn</text>

  <!-- Bot loop -->
  <rect x="280" y="70" width="200" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="98" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Bot: sikl + sekunda</text>
  <text x="380" y="118" font-size="13" fill="#334155" text-anchor="middle">DB dan faol id lar</text>
  <text x="380" y="136" font-size="13" fill="#334155" text-anchor="middle">sleep(1/25) pauza</text>

  <!-- arrow admin->bot -->
  <line x1="190" y1="110" x2="276" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Three outcomes -->
  <!-- ok -->
  <rect x="560" y="60" width="170" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="645" y="80" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">OK - yetib bordi</text>
  <text x="645" y="98" font-size="13" fill="#166534" text-anchor="middle">success += 1</text>

  <!-- blocked -->
  <rect x="560" y="125" width="170" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="645" y="145" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">Forbidden - bloklagan</text>
  <text x="645" y="163" font-size="13" fill="#991b1b" text-anchor="middle">DB: active = 0</text>

  <!-- retry -->
  <rect x="560" y="190" width="170" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="645" y="210" font-size="13" font-weight="bold" fill="#92400e" text-anchor="middle">RetryAfter - flood</text>
  <text x="645" y="228" font-size="13" fill="#92400e" text-anchor="middle">sleep, qayta urin</text>

  <!-- arrows bot->outcomes -->
  <line x1="480" y1="100" x2="556" y2="85" stroke="#16a34a" stroke-width="2" marker-end="url(#arrg)"/>
  <line x1="480" y1="115" x2="556" y2="150" stroke="#dc2626" stroke-width="2" marker-end="url(#arrr)"/>
  <line x1="480" y1="130" x2="556" y2="215" stroke="#f59e0b" stroke-width="2" marker-end="url(#arro)"/>

  <!-- Users row -->
  <text x="40" y="290" font-size="15" font-weight="bold" fill="#1e293b">Foydalanuvchilar bazasi (DB):</text>
  <g>
    <rect x="40" y="305" width="100" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="90" y="331" font-size="13" fill="#166534" text-anchor="middle">user 1 active</text>
    <rect x="155" y="305" width="100" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="205" y="331" font-size="13" fill="#991b1b" text-anchor="middle">user 2 blok</text>
    <rect x="270" y="305" width="100" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="320" y="331" font-size="13" fill="#166534" text-anchor="middle">user 3 active</text>
    <rect x="385" y="305" width="100" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="435" y="331" font-size="13" fill="#166534" text-anchor="middle">user 4 active</text>
    <rect x="500" y="305" width="120" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="560" y="331" font-size="13" fill="#334155" text-anchor="middle">... minglab</text>
  </g>

  <!-- bottom note -->
  <rect x="40" y="372" width="680" height="34" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="380" y="394" font-size="13" fill="#1e3a8a" text-anchor="middle">Qoida: hech qachon birdan hammaga otib yuborma - sekunda ~25 ta, har birini try/except ichida yubor.</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="arro" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/></marker>
  </defs>
</svg>
