<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Segoe UI, sans-serif">
  <title>Telegram Bot API arxitekturasi: klient - Telegram serveri - bot</title>
  <rect width="760" height="360" fill="#f8fafc"/>
  <text x="380" y="34" font-size="19" font-weight="bold" fill="#1e293b" text-anchor="middle">Telegram Bot API arxitekturasi</text>

  <!-- Foydalanuvchi (klient) -->
  <rect x="30" y="120" width="180" height="120" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="150" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Foydalanuvchi</text>
  <text x="120" y="176" font-size="14" fill="#334155" text-anchor="middle">Telegram klienti</text>
  <text x="120" y="198" font-size="13" fill="#334155" text-anchor="middle">(telefon, desktop)</text>
  <text x="120" y="222" font-size="13" fill="#64748b" text-anchor="middle">xabar yozadi</text>

  <!-- Telegram serveri -->
  <rect x="290" y="110" width="180" height="140" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="142" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Telegram serveri</text>
  <text x="380" y="168" font-size="14" fill="#334155" text-anchor="middle">Bot API</text>
  <text x="380" y="190" font-size="13" fill="#334155" text-anchor="middle">api.telegram.org</text>
  <text x="380" y="214" font-size="13" fill="#64748b" text-anchor="middle">xabarlarni saqlaydi</text>
  <text x="380" y="234" font-size="13" fill="#64748b" text-anchor="middle">va yetkazadi</text>

  <!-- Bot (sizning serveringiz) -->
  <rect x="550" y="120" width="180" height="120" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="640" y="150" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Sizning botingiz</text>
  <text x="640" y="176" font-size="14" fill="#334155" text-anchor="middle">Python + aiogram</text>
  <text x="640" y="198" font-size="13" fill="#334155" text-anchor="middle">mantiqni bajaradi</text>
  <text x="640" y="222" font-size="13" fill="#64748b" text-anchor="middle">javob qaytaradi</text>

  <!-- Klient -> Telegram -->
  <line x1="210" y1="160" x2="288" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="248" y="150" font-size="13" fill="#334155" text-anchor="middle">xabar</text>
  <!-- Telegram -> Klient -->
  <line x1="288" y1="200" x2="210" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="248" y="218" font-size="13" fill="#334155" text-anchor="middle">javob</text>

  <!-- Telegram -> Bot (update) -->
  <line x1="470" y1="160" x2="548" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrb)"/>
  <text x="510" y="150" font-size="13" fill="#2563eb" text-anchor="middle">update</text>
  <!-- Bot -> Telegram (sendMessage) -->
  <line x1="548" y1="200" x2="470" y2="200" stroke="#16a34a" stroke-width="2" marker-end="url(#arrg)"/>
  <text x="510" y="218" font-size="13" fill="#16a34a" text-anchor="middle">sendMessage</text>

  <text x="380" y="300" font-size="14" fill="#334155" text-anchor="middle">Bot foydalanuvchi bilan TO'G'RIDAN-TO'G'RI gaplashmaydi —</text>
  <text x="380" y="322" font-size="14" fill="#334155" text-anchor="middle">hammasi Telegram serveri (Bot API) orqali o'tadi.</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
</svg>
