<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="Segoe UI, sans-serif">
  <title>Kapston bot arxitekturasi: foydalanuvchi, dispatcher, middleware, router, servis va DB qatlamlari</title>
  <rect x="0" y="0" width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Vazifa-menejeri boti — qatlamli arxitektura</text>

  <!-- Telegram / user -->
  <rect x="30" y="70" width="150" height="70" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="105" y="100" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Foydalanuvchi</text>
  <text x="105" y="122" font-size="13" fill="#334155" text-anchor="middle">Telegram klient</text>

  <!-- Telegram API -->
  <rect x="30" y="180" width="150" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="105" y="206" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Telegram Bot API</text>
  <text x="105" y="226" font-size="13" fill="#334155" text-anchor="middle">long polling</text>

  <!-- Dispatcher -->
  <rect x="250" y="70" width="190" height="50" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="345" y="100" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Dispatcher (dp)</text>

  <!-- Middleware chain -->
  <rect x="250" y="135" width="190" height="105" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="345" y="158" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Middleware zanjiri</text>
  <text x="345" y="182" font-size="13" fill="#334155" text-anchor="middle">DbMiddleware (DI)</text>
  <text x="345" y="204" font-size="13" fill="#334155" text-anchor="middle">ThrottleMiddleware</text>
  <text x="345" y="226" font-size="13" fill="#334155" text-anchor="middle">IsAdmin (admin_router)</text>

  <!-- Routers -->
  <rect x="510" y="135" width="220" height="50" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="620" y="165" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">admin_router (/stats, /broadcast)</text>
  <rect x="510" y="195" width="220" height="50" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="620" y="217" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">user_router</text>
  <text x="620" y="235" font-size="13" fill="#334155" text-anchor="middle">/start, FSM, callback</text>

  <!-- Services / business logic -->
  <rect x="510" y="285" width="220" height="55" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="310" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Biznes-logika</text>
  <text x="620" y="330" font-size="13" fill="#334155" text-anchor="middle">parse_due / fmt_due</text>

  <!-- DB -->
  <rect x="510" y="365" width="220" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="392" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Database (aiosqlite)</text>
  <text x="620" y="412" font-size="13" fill="#334155" text-anchor="middle">users + tasks jadvallari</text>

  <!-- Scheduler -->
  <rect x="250" y="285" width="190" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="345" y="312" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">APScheduler</text>
  <text x="345" y="332" font-size="13" fill="#334155" text-anchor="middle">rejali eslatma (interval)</text>

  <!-- arrows -->
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <line x1="105" y1="140" x2="105" y2="178" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="105" y1="70" x2="105" y2="50" stroke="#94a3b8" stroke-width="2"/>
  <line x1="180" y1="100" x2="248" y2="95" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <text x="210" y="86" font-size="13" fill="#334155">update</text>
  <line x1="345" y1="120" x2="345" y2="133" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="440" y1="170" x2="508" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="440" y1="215" x2="508" y2="220" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="620" y1="245" x2="620" y2="283" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="620" y1="340" x2="620" y2="363" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="440" y1="320" x2="508" y2="395" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <text x="455" y="365" font-size="13" fill="#334155">DB</text>
</svg>
