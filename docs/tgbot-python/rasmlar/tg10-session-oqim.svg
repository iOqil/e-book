<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420">
  <title>Middleware orqali DB sessiya oqimi (har update uchun)</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b">Har update uchun session hayot tsikli</text>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- step 1 -->
  <rect x="40" y="70" width="680" height="46" rx="8" fill="#e0e7ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="98" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">1. Update keladi</text>
  <text x="260" y="98" font-family="Segoe UI" font-size="14" fill="#334155">dp.feed_update(bot, update) chaqiriladi</text>

  <line x1="380" y1="116" x2="380" y2="138" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a2)"/>

  <!-- step 2 -->
  <rect x="40" y="142" width="680" height="46" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="60" y="170" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">2. Middleware</text>
  <text x="260" y="170" font-family="Segoe UI" font-size="14" fill="#334155">async with pool() as session: data["repo"] = UserRepo(session)</text>

  <line x1="380" y1="188" x2="380" y2="210" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a2)"/>

  <!-- step 3 -->
  <rect x="40" y="214" width="680" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="60" y="242" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">3. Handler</text>
  <text x="260" y="242" font-family="Segoe UI" font-size="14" fill="#334155">async def start(message, repo): repo'dan foydalanadi</text>

  <line x1="380" y1="260" x2="380" y2="282" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a2)"/>

  <!-- step 4 -->
  <rect x="40" y="286" width="680" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="60" y="314" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">4. commit</text>
  <text x="260" y="314" font-family="Segoe UI" font-size="14" fill="#334155">middleware: await session.commit() — o'zgarish saqlanadi</text>

  <line x1="380" y1="332" x2="380" y2="354" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a2)"/>

  <!-- step 5 -->
  <rect x="40" y="358" width="680" height="46" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="60" y="386" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">5. yopiladi</text>
  <text x="260" y="386" font-family="Segoe UI" font-size="14" fill="#334155">async with bloki tugaydi — session avtomatik yopiladi</text>
</svg>
