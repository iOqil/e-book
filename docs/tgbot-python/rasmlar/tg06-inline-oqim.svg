<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430">
  <title>Inline tugma bosilganda callback_query oqimi</title>
  <rect width="780" height="430" fill="#f8fafc"/>
  <text x="390" y="34" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">Inline tugma -&gt; callback_query oqimi</text>

  <!-- Step 1: bot sends message with inline kb -->
  <rect x="30" y="64" width="220" height="150" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="140" y="90" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">1. Bot xabar yuboradi</text>
  <rect x="50" y="104" width="180" height="34" rx="8" fill="#dcfce7"/>
  <text x="62" y="126" font-family="Segoe UI" font-size="13" fill="#1e293b">Ovoz bering:</text>
  <rect x="50" y="146" width="86" height="32" rx="7" fill="#ffffff" stroke="#16a34a" stroke-width="1.3"/>
  <text x="93" y="167" font-family="Segoe UI" font-size="13" fill="#1e293b" text-anchor="middle">Ha</text>
  <rect x="144" y="146" width="86" height="32" rx="7" fill="#ffffff" stroke="#16a34a" stroke-width="1.3"/>
  <text x="187" y="167" font-family="Segoe UI" font-size="13" fill="#1e293b" text-anchor="middle">Yo'q</text>
  <text x="140" y="200" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">callback_data="vote:yes"</text>

  <!-- arrow 1 -->
  <line x1="252" y1="139" x2="296" y2="139" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="304,139 292,133 292,145" fill="#94a3b8"/>

  <!-- Step 2: user taps -->
  <rect x="306" y="64" width="170" height="150" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="391" y="90" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#f59e0b" text-anchor="middle">2. User bosadi</text>
  <rect x="326" y="110" width="130" height="40" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="391" y="135" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Ha</text>
  <text x="391" y="180" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">MATN yuborilmaydi</text>
  <text x="391" y="198" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">chatga hech narsa yozilmaydi</text>

  <!-- arrow 2 -->
  <line x1="478" y1="139" x2="522" y2="139" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="530,139 518,133 518,145" fill="#94a3b8"/>

  <!-- Step 3: callback_query -->
  <rect x="532" y="64" width="220" height="150" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="642" y="90" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">3. Botga keladi</text>
  <text x="642" y="116" font-family="Segoe UI" font-size="14" fill="#1e293b" text-anchor="middle">CallbackQuery</text>
  <text x="642" y="142" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">.data = "vote:yes"</text>
  <text x="642" y="166" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">.from_user, .message</text>
  <text x="642" y="194" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">@router.callback_query(...)</text>

  <!-- handler row -->
  <rect x="120" y="252" width="540" height="92" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="390" y="278" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">4. Handler ichida (har doim!)</text>
  <text x="390" y="304" font-family="Segoe UI" font-size="14" fill="#1e293b" text-anchor="middle">await callback.answer("Rahmat!")   # soatchani to'xtatadi</text>
  <text x="390" y="328" font-family="Segoe UI" font-size="14" fill="#1e293b" text-anchor="middle">await callback.message.edit_text("...")   # xabarni tahrirlash (ixtiyoriy)</text>

  <!-- warning -->
  <rect x="120" y="362" width="540" height="46" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="390" y="390" font-family="Segoe UI" font-size="13" fill="#dc2626" text-anchor="middle">answer() chaqirilmasa: tugmada "soatcha" bir necha soniya aylanaveradi.</text>
</svg>
