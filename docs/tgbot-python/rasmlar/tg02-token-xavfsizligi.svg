<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400">
  <title>Token xavfsizligi: kodga yozish (xato) va .env faylda saqlash (to'g'ri)</title>
  <rect x="0" y="0" width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI" font-size="19" font-weight="bold" fill="#1e293b">Tokenni qayerda saqlash kerak?</text>

  <!-- WRONG side -->
  <rect x="30" y="60" width="340" height="300" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="200" y="88" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">XATO: kodga yozish</text>

  <rect x="55" y="106" width="290" height="78" rx="8" fill="#1e293b"/>
  <text x="70" y="132" font-family="Consolas, Segoe UI" font-size="13" fill="#e2e8f0">bot = Bot(</text>
  <text x="86" y="154" font-family="Consolas, Segoe UI" font-size="13" fill="#fca5a5">  token="8012:AAH-secret"</text>
  <text x="70" y="176" font-family="Consolas, Segoe UI" font-size="13" fill="#e2e8f0">)</text>

  <rect x="55" y="200" width="290" height="50" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="200" y="222" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">git commit -> GitHub'ga ketadi</text>
  <text x="200" y="240" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#dc2626">token ommaga oshkor!</text>

  <text x="70" y="278" font-family="Segoe UI" font-size="13" fill="#334155">- har kim botingizni egallaydi</text>
  <text x="70" y="302" font-family="Segoe UI" font-size="13" fill="#334155">- BotFather tokenni bekor qiladi</text>
  <text x="70" y="326" font-family="Segoe UI" font-size="13" fill="#334155">- tarixdan o'chirish qiyin</text>
  <text x="70" y="350" font-family="Segoe UI" font-size="22" fill="#dc2626">&#10007;</text>

  <!-- RIGHT side -->
  <rect x="390" y="60" width="340" height="300" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="560" y="88" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">TO'G'RI: .env faylda</text>

  <rect x="415" y="106" width="290" height="40" rx="8" fill="#1e293b"/>
  <text x="430" y="124" font-family="Consolas, Segoe UI" font-size="13" fill="#94a3b8"># .env (gitignore'da)</text>
  <text x="430" y="140" font-family="Consolas, Segoe UI" font-size="13" fill="#86efac">BOT_TOKEN=8012:AAH-secret</text>

  <rect x="415" y="158" width="290" height="58" rx="8" fill="#1e293b"/>
  <text x="430" y="180" font-family="Consolas, Segoe UI" font-size="13" fill="#94a3b8"># bot.py</text>
  <text x="430" y="200" font-family="Consolas, Segoe UI" font-size="13" fill="#e2e8f0">token = os.getenv(</text>
  <text x="430" y="216" font-family="Consolas, Segoe UI" font-size="13" fill="#93c5fd">  "BOT_TOKEN")</text>

  <rect x="415" y="230" width="290" height="40" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="560" y="248" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">.gitignore -> .env commit'ga</text>
  <text x="560" y="264" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a">tushmaydi</text>

  <text x="435" y="296" font-family="Segoe UI" font-size="13" fill="#334155">- maxfiy ma'lumot kodda emas</text>
  <text x="435" y="320" font-family="Segoe UI" font-size="13" fill="#334155">- serverda boshqa token oson</text>
  <text x="435" y="344" font-family="Segoe UI" font-size="13" fill="#334155">- jamoa bilan ulashish xavfsiz</text>
  <text x="435" y="350" font-family="Segoe UI" font-size="22" fill="#16a34a">&#10003;</text>

  <text x="380" y="388" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Qoida: maxfiy token hech qachon manba kodga yozilmaydi.</text>
</svg>
