<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450">
  <title>Reply klaviatura va inline klaviatura solishtiruvi</title>
  <rect width="760" height="450" fill="#f8fafc"/>
  <text x="380" y="34" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">Ikki turdagi klaviatura</text>

  <!-- Reply panel -->
  <rect x="28" y="58" width="344" height="368" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="200" y="88" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#2563eb" text-anchor="middle">Reply klaviatura</text>
  <text x="200" y="110" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">input maydoni o'rnida turadi</text>

  <rect x="50" y="128" width="210" height="40" rx="10" fill="#e0e7ff"/>
  <text x="66" y="153" font-family="Segoe UI" font-size="14" fill="#1e293b">Menyudan tanlang:</text>

  <text x="200" y="262" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle" font-style="italic">bosilsa MATN sifatida yuboriladi</text>
  <text x="200" y="282" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle" font-style="italic">-&gt; @router.message(...)</text>

  <rect x="50" y="300" width="140" height="40" rx="8" fill="#f1f5f9" stroke="#2563eb" stroke-width="1.5"/>
  <text x="120" y="325" font-family="Segoe UI" font-size="14" fill="#1e293b" text-anchor="middle">Katalog</text>
  <rect x="210" y="300" width="140" height="40" rx="8" fill="#f1f5f9" stroke="#2563eb" stroke-width="1.5"/>
  <text x="280" y="325" font-family="Segoe UI" font-size="14" fill="#1e293b" text-anchor="middle">Savatcha</text>
  <rect x="50" y="348" width="300" height="40" rx="8" fill="#f1f5f9" stroke="#16a34a" stroke-width="1.5"/>
  <text x="200" y="373" font-family="Segoe UI" font-size="14" fill="#16a34a" text-anchor="middle">Telefon yuborish (request_contact)</text>

  <!-- Inline panel -->
  <rect x="388" y="58" width="344" height="368" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="560" y="88" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#16a34a" text-anchor="middle">Inline klaviatura</text>
  <text x="560" y="110" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">xabarning ostiga yopishadi</text>

  <rect x="410" y="128" width="300" height="172" rx="10" fill="#dcfce7"/>
  <text x="426" y="154" font-family="Segoe UI" font-size="14" fill="#1e293b">Ovoz bering:</text>
  <rect x="426" y="170" width="130" height="40" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="491" y="195" font-family="Segoe UI" font-size="14" fill="#1e293b" text-anchor="middle">Ha</text>
  <rect x="566" y="170" width="130" height="40" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="631" y="195" font-family="Segoe UI" font-size="14" fill="#1e293b" text-anchor="middle">Yo'q</text>
  <rect x="426" y="218" width="270" height="40" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="561" y="243" font-family="Segoe UI" font-size="14" fill="#2563eb" text-anchor="middle">Saytga o'tish (url=...)</text>

  <text x="560" y="338" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle" font-style="italic">bosilsa CALLBACK_QUERY keladi</text>
  <text x="560" y="358" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle" font-style="italic">(matn yuborilmaydi)</text>
  <text x="560" y="378" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle" font-style="italic">-&gt; @router.callback_query(...)</text>
</svg>
