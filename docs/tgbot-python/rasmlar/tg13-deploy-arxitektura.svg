<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430">
  <title>Webhook deploy arxitekturasi: internet, nginx reverse proxy va aiohttp</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b">Webhook deploy arxitekturasi (VPS)</text>

  <!-- Internet zone -->
  <rect x="24" y="64" width="180" height="320" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="114" y="90" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#334155">Internet</text>

  <rect x="44" y="130" width="140" height="64" rx="8" fill="#e0e7ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="114" y="158" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Telegram</text>
  <text x="114" y="178" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">serverlari</text>

  <rect x="44" y="250" width="140" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="114" y="278" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Foydalanuvchi</text>
  <text x="114" y="298" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">telefonda</text>

  <!-- VPS zone -->
  <rect x="280" y="64" width="456" height="320" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="508" y="90" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">VPS / Server (sizniki)</text>

  <!-- nginx -->
  <rect x="310" y="120" width="180" height="90" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="148" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">nginx</text>
  <text x="400" y="170" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">reverse proxy</text>
  <text x="400" y="190" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">port 443, SSL (Let's Encrypt)</text>

  <!-- aiohttp -->
  <rect x="540" y="120" width="170" height="90" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="625" y="148" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">aiohttp + aiogram</text>
  <text x="625" y="170" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">127.0.0.1:8080</text>
  <text x="625" y="190" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">(faqat lokal)</text>

  <!-- DB / service -->
  <rect x="310" y="260" width="400" height="80" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="510" y="288" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155">systemd service: bot doim ishlab turadi</text>
  <text x="510" y="312" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">(qayta yuklanganda avto-start, log, restart)</text>

  <!-- arrows -->
  <line x1="184" y1="162" x2="308" y2="162" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="246" y="152" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">HTTPS 443</text>

  <line x1="490" y1="165" x2="538" y2="165" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="514" y="155" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">HTTP</text>

  <line x1="114" y1="250" x2="114" y2="196" stroke="#94a3b8" stroke-width="2" marker-end="url(#agr)"/>

  <text x="380" y="412" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Telegram tashqaridan faqat nginx (443) ko'radi; aiohttp ichkarida himoyada turadi.</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="agr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
