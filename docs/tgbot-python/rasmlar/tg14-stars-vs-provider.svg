<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400">
  <title>Telegram Stars (XTR) va tashqi provider to'lovi farqi</title>
  <rect width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b">Ikki xil to'lov: Stars (XTR) va provider token</text>

  <!-- Stars panel -->
  <rect x="30" y="60" width="340" height="300" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="30" y="60" width="340" height="42" rx="12" fill="#16a34a"/>
  <text x="200" y="88" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#ffffff">Telegram Stars (XTR)</text>

  <text x="50" y="132" font-family="Segoe UI" font-size="14" fill="#16a34a" font-weight="bold">currency = "XTR"</text>
  <text x="50" y="160" font-family="Segoe UI" font-size="13" fill="#334155">provider_token = "" (bo'sh)</text>
  <text x="50" y="186" font-family="Segoe UI" font-size="13" fill="#334155">amount = Stars soni (50 = 50 ⭐)</text>
  <text x="50" y="212" font-family="Segoe UI" font-size="13" fill="#334155">Raqamli tovar: PDF, obuna, kontent</text>
  <text x="50" y="238" font-family="Segoe UI" font-size="13" fill="#334155">Provider ro'yxatdan o'tish KERAK EMAS</text>
  <text x="50" y="264" font-family="Segoe UI" font-size="13" fill="#334155">refund_star_payment bilan qaytarish</text>
  <text x="50" y="290" font-family="Segoe UI" font-size="13" fill="#334155">Bemalol botlarda ishlaydi</text>
  <rect x="50" y="306" width="300" height="38" rx="8" fill="#dcfce7"/>
  <text x="200" y="330" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">Boshlash uchun eng oson yo'l</text>

  <!-- Provider panel -->
  <rect x="390" y="60" width="340" height="300" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="390" y="60" width="340" height="42" rx="12" fill="#2563eb"/>
  <text x="560" y="88" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#ffffff">Tashqi provider</text>

  <text x="410" y="132" font-family="Segoe UI" font-size="14" fill="#2563eb" font-weight="bold">currency = "USD" / "UZS" ...</text>
  <text x="410" y="160" font-family="Segoe UI" font-size="13" fill="#334155">provider_token = BotFather'dan olingan</text>
  <text x="410" y="186" font-family="Segoe UI" font-size="13" fill="#334155">amount = eng kichik birlik (1$ = 100)</text>
  <text x="410" y="212" font-family="Segoe UI" font-size="13" fill="#334155">Jismoniy/raqamli tovar (karta)</text>
  <text x="410" y="238" font-family="Segoe UI" font-size="13" fill="#334155">Provider (Stripe va h.k.) ulanadi</text>
  <text x="410" y="264" font-family="Segoe UI" font-size="13" fill="#334155">Provider qoidalariga bog'liq</text>
  <text x="410" y="290" font-family="Segoe UI" font-size="13" fill="#334155">Test rejimi alohida token beradi</text>
  <rect x="410" y="306" width="300" height="38" rx="8" fill="#dbeafe"/>
  <text x="560" y="330" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e3a8a">Haqiqiy pul, mintaqaga bog'liq</text>

  <text x="380" y="388" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">Kod oqimi (invoice -> pre_checkout -> successful_payment) IKKALASIDA bir xil.</text>
</svg>
