<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440">
  <title>Tap oqimi: tugma -> server hisobi -> balans/energiya -> UI</title>
  <rect width="780" height="440" fill="#f8fafc"/>
  <text x="390" y="36" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b">Bitta tap nima bo'ladi</text>

  <!-- Step 1: tap -->
  <rect x="40" y="74" width="170" height="84" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <text x="125" y="104" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#f59e0b">1. Tap tugma</text>
  <text x="125" y="128" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">client UI'ni darrov</text>
  <text x="125" y="148" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">"optimistik" oshiradi</text>

  <!-- arrow -->
  <line x1="210" y1="116" x2="258" y2="116" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="258,110 270,116 258,122" fill="#94a3b8"/>

  <!-- Step 2: POST -->
  <rect x="270" y="74" width="200" height="84" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="370" y="104" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">2. POST /api/tap</text>
  <text x="370" y="128" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">{count} + initData</text>
  <text x="370" y="148" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Authorization: tma ...</text>

  <!-- arrow -->
  <line x1="470" y1="116" x2="518" y2="116" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="518,110 530,116 518,122" fill="#94a3b8"/>

  <!-- Step 3: server -->
  <rect x="530" y="74" width="210" height="84" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="635" y="104" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">3. Server hisobi</text>
  <text x="635" y="128" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">imzo OK? count chekla</text>
  <text x="635" y="148" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">regen -&gt; tap -&gt; saqla</text>

  <!-- middle computation block -->
  <rect x="160" y="200" width="460" height="118" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="390" y="226" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">Serverda (game.py):</text>
  <text x="180" y="252" font-family="Segoe UI" font-size="13" fill="#334155">a) regen: o'tgan vaqt x 3 energiya tiklanadi (sig'imgacha)</text>
  <text x="180" y="276" font-family="Segoe UI" font-size="13" fill="#334155">b) affordable = energiya // 1  (energiya nechta tap'ga yetadi)</text>
  <text x="180" y="300" font-family="Segoe UI" font-size="13" fill="#334155">c) balans += min(count, affordable) x tap_reward; energiya -= shuncha</text>

  <!-- arrow down from server to compute -->
  <line x1="635" y1="158" x2="635" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <line x1="635" y1="180" x2="500" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <line x1="500" y1="180" x2="500" y2="198" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="494,198 500,210 506,198" fill="#94a3b8"/>

  <!-- arrow back to UI -->
  <line x1="160" y1="259" x2="125" y2="259" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="125" y1="259" x2="125" y2="160" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="119,160 125,148 131,160" fill="#2563eb"/>
  <text x="100" y="200" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#2563eb">JSON</text>

  <!-- note -->
  <rect x="40" y="350" width="700" height="74" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="62" y="378" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">Diqqat:</text>
  <text x="128" y="378" font-family="Segoe UI" font-size="13" fill="#334155">UI darrov oshadi (optimistik), lekin HAQIQIY balans serverdan kelgan JSON.</text>
  <text x="62" y="404" font-family="Segoe UI" font-size="13" fill="#334155">Server javobi UI'dan farq qilsa — server raqamiga moslang. Server = haqiqat manbai.</text>
</svg>
