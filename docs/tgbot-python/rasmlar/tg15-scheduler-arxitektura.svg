<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Segoe UI, sans-serif">
  <title>Rejalashtiruvchi arxitekturasi: APScheduler va asyncio bilan rejali xabar</title>
  <rect width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Rejali xabar: ikki yondashuv</text>

  <!-- LEFT: asyncio -->
  <rect x="30" y="60" width="330" height="320" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="195" y="88" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">1. asyncio (oddiy)</text>

  <rect x="60" y="108" width="270" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="195" y="130" font-size="13" fill="#1e3a8a" text-anchor="middle">asyncio.create_task(</text>
  <text x="195" y="148" font-size="13" fill="#1e3a8a" text-anchor="middle">eslatma(delay, matn))</text>

  <line x1="195" y1="154" x2="195" y2="178" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="60" y="180" width="270" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="195" y="207" font-size="13" fill="#92400e" text-anchor="middle">await asyncio.sleep(delay)</text>

  <line x1="195" y1="224" x2="195" y2="248" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="60" y="250" width="270" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="195" y="277" font-size="13" fill="#166534" text-anchor="middle">bot.send_message(uid, matn)</text>

  <text x="195" y="322" font-size="13" fill="#334155" text-anchor="middle">+ Yengil, kutubxona kerakmas</text>
  <text x="195" y="344" font-size="13" fill="#dc2626" text-anchor="middle">- Bot ochsa eslatma yoqoladi</text>
  <text x="195" y="366" font-size="13" fill="#dc2626" text-anchor="middle">- Cron (har kuni 9:00) qiyin</text>

  <!-- RIGHT: APScheduler -->
  <rect x="400" y="60" width="330" height="320" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="565" y="88" font-size="16" font-weight="bold" fill="#16a34a" text-anchor="middle">2. APScheduler (kuchli)</text>

  <rect x="430" y="108" width="270" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="565" y="130" font-size="13" fill="#166534" text-anchor="middle">AsyncIOScheduler()</text>
  <text x="565" y="148" font-size="13" fill="#166534" text-anchor="middle">.start()</text>

  <line x1="565" y1="154" x2="565" y2="178" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="430" y="180" width="270" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="565" y="201" font-size="13" fill="#1e3a8a" text-anchor="middle">add_job(job, trigger)</text>
  <text x="565" y="221" font-size="13" fill="#334155" text-anchor="middle">DateTrigger / IntervalTrigger</text>
  <text x="565" y="237" font-size="13" fill="#334155" text-anchor="middle">CronTrigger(hour=9)</text>

  <line x1="565" y1="242" x2="565" y2="266" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="430" y="268" width="270" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="565" y="293" font-size="13" fill="#166534" text-anchor="middle">vaqti kelganda job ishlaydi</text>

  <text x="565" y="332" font-size="13" fill="#334155" text-anchor="middle">+ Cron, interval, sana</text>
  <text x="565" y="354" font-size="13" fill="#334155" text-anchor="middle">+ JobStore: DB ga saqlash</text>
  <text x="565" y="376" font-size="13" fill="#16a34a" text-anchor="middle">+ Bot ochsa ham tiklanadi</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>
</svg>
