<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Segoe UI, sans-serif">
  <title>HMAC validatsiya bosqichlari: data_check_string -> secret_key -> hash</title>
  <rect width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">HMAC tekshiruv bosqichlari</text>

  <defs>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <rect x="60" y="64" width="640" height="76" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="92" cy="102" r="16" fill="#2563eb"/>
  <text x="92" y="107" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">1</text>
  <text x="124" y="92" font-size="15" font-weight="bold" fill="#1e293b">hash'ni ajratib ol, qolganini saralab tuz</text>
  <text x="124" y="114" font-size="13" fill="#334155">data_check_string = sorted(k=v) ni "\n" bilan ulash</text>
  <text x="124" y="132" font-size="13" fill="#64748b">masalan: auth_date=...\nquery_id=...\nuser=...</text>

  <line x1="380" y1="140" x2="380" y2="166" stroke="#334155" stroke-width="2.5" marker-end="url(#b)"/>

  <!-- Step 2 -->
  <rect x="60" y="170" width="640" height="76" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <circle cx="92" cy="208" r="16" fill="#16a34a"/>
  <text x="92" y="213" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">2</text>
  <text x="124" y="198" font-size="15" font-weight="bold" fill="#1e293b">secret_key ni token'dan ol</text>
  <text x="124" y="222" font-size="13" fill="#334155">secret_key = HMAC_SHA256(key=b"WebAppData", msg=token)</text>
  <text x="124" y="240" font-size="13" fill="#64748b">token sir — faqat backendda; client uni ko'rmaydi</text>

  <line x1="380" y1="246" x2="380" y2="272" stroke="#334155" stroke-width="2.5" marker-end="url(#b)"/>

  <!-- Step 3 -->
  <rect x="60" y="276" width="640" height="76" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="92" cy="314" r="16" fill="#f59e0b"/>
  <text x="92" y="319" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">3</text>
  <text x="124" y="304" font-size="15" font-weight="bold" fill="#1e293b">o'z hash'ingni hisobla</text>
  <text x="124" y="328" font-size="13" fill="#334155">calc = HMAC_SHA256(key=secret_key, msg=data_check_string)</text>
  <text x="124" y="346" font-size="13" fill="#64748b">.hexdigest()</text>

  <line x1="380" y1="352" x2="380" y2="378" stroke="#334155" stroke-width="2.5" marker-end="url(#b)"/>

  <!-- Step 4 -->
  <rect x="60" y="382" width="640" height="76" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <circle cx="92" cy="420" r="16" fill="#dc2626"/>
  <text x="92" y="425" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">4</text>
  <text x="124" y="410" font-size="15" font-weight="bold" fill="#1e293b">xavfsiz solishtir</text>
  <text x="124" y="434" font-size="13" fill="#334155">hmac.compare_digest(calc, kelgan_hash) -> True / False</text>
  <text x="124" y="452" font-size="13" fill="#64748b">vaqt-hujumiga (timing attack) chidamli solishtirish</text>
</svg>
