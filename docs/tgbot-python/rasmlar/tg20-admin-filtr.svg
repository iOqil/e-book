<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Segoe UI, sans-serif">
  <title>Admin-only buyruq filtri: get_chat_member status tekshiruvi</title>
  <rect width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Admin-only buyruq: /ban kim tomonidan?</text>

  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- step 1 -->
  <rect x="250" y="60" width="260" height="56" rx="10" fill="#2563eb"/>
  <text x="380" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">/ban xabari keldi</text>
  <text x="380" y="103" text-anchor="middle" font-size="13" fill="#dbeafe">from_user.id = X</text>

  <line x1="380" y1="116" x2="380" y2="146" stroke="#334155" stroke-width="2.5" marker-end="url(#a2)"/>

  <!-- step 2: get_chat_member -->
  <rect x="220" y="146" width="320" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="380" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">bot.get_chat_member(chat_id, X)</text>
  <text x="380" y="191" text-anchor="middle" font-size="13" fill="#334155">member.status ni o'qiymiz</text>

  <line x1="380" y1="206" x2="380" y2="236" stroke="#334155" stroke-width="2.5" marker-end="url(#a2)"/>

  <!-- decision -->
  <polygon points="380,236 530,296 380,356 230,296" fill="#f59e0b"/>
  <text x="380" y="290" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">status in</text>
  <text x="380" y="310" text-anchor="middle" font-size="13" fill="#fff7ed">{creator, administrator}?</text>

  <!-- yes -->
  <line x1="530" y1="296" x2="620" y2="296" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="560" y="286" font-size="13" fill="#16a34a" font-weight="bold">HA</text>
  <rect x="620" y="266" width="120" height="60" rx="10" fill="#16a34a"/>
  <text x="680" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">ban bajariladi</text>
  <text x="680" y="312" text-anchor="middle" font-size="13" fill="#dcfce7">ban_chat_member</text>

  <!-- no -->
  <line x1="230" y1="296" x2="140" y2="296" stroke="#dc2626" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="160" y="286" font-size="13" fill="#dc2626" font-weight="bold">YO'Q</text>
  <rect x="20" y="266" width="120" height="60" rx="10" fill="#dc2626"/>
  <text x="80" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">rad etiladi</text>
  <text x="80" y="312" text-anchor="middle" font-size="13" fill="#fee2e2">"faqat admin"</text>

  <text x="380" y="398" text-anchor="middle" font-size="13" fill="#64748b">Maslahat: tekshiruvni alohida filtr (IsAdmin) qilib har bir buyruqqa ulang</text>
  <text x="380" y="418" text-anchor="middle" font-size="13" fill="#64748b">Bot ham can_restrict_members huquqiga ega admin bo'lishi shart</text>
</svg>
