<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430">
  <title>Privacy mode: bot guruhda qaysi xabarlarni ko'radi (yoqilgan va o'chirilgan holatda)</title>
  <rect width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b">Privacy mode — bot nimani ko'radi?</text>

  <!-- ON column -->
  <rect x="40" y="60" width="330" height="320" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="205" y="88" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">Privacy ON (default)</text>
  <text x="205" y="110" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">/setprivacy = Enable</text>

  <!-- ON: sees -->
  <rect x="60" y="128" width="290" height="38" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="76" y="152" font-family="Segoe UI" font-size="13" fill="#166534">KO'RADI: /buyruq (komandalar)</text>

  <rect x="60" y="174" width="290" height="38" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="76" y="198" font-family="Segoe UI" font-size="13" fill="#166534">KO'RADI: botga reply qilingan xabar</text>

  <rect x="60" y="220" width="290" height="38" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="76" y="244" font-family="Segoe UI" font-size="13" fill="#166534">KO'RADI: @bot eslatib yozilgan</text>

  <rect x="60" y="266" width="290" height="38" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="76" y="290" font-family="Segoe UI" font-size="13" fill="#991b1b">KO'RMAYDI: oddiy chat xabarlari</text>

  <text x="205" y="340" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Maxfiyroq, kamroq update —</text>
  <text x="205" y="360" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">komandali botlar uchun yaxshi.</text>

  <!-- OFF column -->
  <rect x="390" y="60" width="330" height="320" rx="12" fill="#fff" stroke="#dc2626" stroke-width="2.5"/>
  <text x="555" y="88" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">Privacy OFF</text>
  <text x="555" y="110" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">/setprivacy = Disable</text>

  <rect x="410" y="128" width="290" height="38" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="426" y="152" font-family="Segoe UI" font-size="13" fill="#166534">KO'RADI: /buyruq (komandalar)</text>

  <rect x="410" y="174" width="290" height="38" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="426" y="198" font-family="Segoe UI" font-size="13" fill="#166534">KO'RADI: reply va @mention</text>

  <rect x="410" y="220" width="290" height="38" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="426" y="244" font-family="Segoe UI" font-size="13" fill="#166534">KO'RADI: HAR QANDAY chat xabari</text>

  <rect x="410" y="266" width="290" height="38" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="426" y="290" font-family="Segoe UI" font-size="13" fill="#92400e">Ko'p update — moderatsiya uchun</text>

  <text x="555" y="340" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Filtr/moderatsiya botiga kerak,</text>
  <text x="555" y="360" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">lekin bot guruhga qayta qo'shilsin.</text>

  <text x="380" y="410" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Sozlash: @BotFather -> /setprivacy -> botni tanlang -> Enable/Disable</text>
</svg>
