<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430">
  <title>Matnni formatlash oqimi: raw matn, escape, parse_mode va natija</title>
  <rect width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b">Formatlangan xabar qanday yetadi</text>

  <!-- 1: raw matn -->
  <rect x="30" y="70" width="200" height="90" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="130" y="98" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">1. Sizning kodingiz</text>
  <text x="130" y="122" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">"&lt;b&gt;Salom&lt;/b&gt;"</text>
  <text x="130" y="142" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">+ xavfli kirish</text>

  <!-- arrow -->
  <line x1="230" y1="115" x2="285" y2="115" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- 2: escape -->
  <rect x="290" y="70" width="200" height="90" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="390" y="98" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#92400e">2. Escape</text>
  <text x="390" y="122" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">html_decoration.quote()</text>
  <text x="390" y="142" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">kirish xavfsiz bo'ladi</text>

  <line x1="490" y1="115" x2="545" y2="115" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- 3: parse_mode -->
  <rect x="550" y="70" width="190" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="645" y="98" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e40af">3. parse_mode</text>
  <text x="645" y="122" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">HTML yoki</text>
  <text x="645" y="142" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">MarkdownV2</text>

  <!-- down to telegram -->
  <line x1="645" y1="160" x2="645" y2="205" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- telegram servers -->
  <rect x="500" y="210" width="240" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="620" y="240" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Telegram serverlari</text>
  <text x="620" y="263" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">teglarni o'qib, stil qiladi</text>

  <line x1="500" y1="245" x2="290" y2="245" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- chat result -->
  <rect x="30" y="210" width="240" height="160" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="150" y="238" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">4. Foydalanuvchi ekrani</text>
  <rect x="50" y="252" width="200" height="44" rx="10" fill="#dbeafe"/>
  <text x="68" y="280" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#1e293b">Salom</text>
  <text x="150" y="324" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">qalin matn ko'rinadi,</text>
  <text x="150" y="344" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">teglar ko'rinmaydi</text>

  <!-- note -->
  <rect x="30" y="392" width="710" height="28" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="385" y="411" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#991b1b">Escape qadamini tashlab ketsangiz, foydalanuvchi matni teg buzib "can't parse entities" xatosi chiqadi</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
</svg>
