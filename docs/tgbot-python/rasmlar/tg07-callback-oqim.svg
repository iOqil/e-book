<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Segoe UI, sans-serif">
  <title>Inline tugma bosilganda callback_query oqimi</title>
  <rect width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Inline tugma bosilganda: callback_query oqimi</text>

  <!-- 1 user -->
  <rect x="30" y="70" width="160" height="70" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">1. Foydalanuvchi</text>
  <text x="110" y="122" text-anchor="middle" font-size="13" fill="#334155">tugmani bosadi</text>

  <!-- 2 telegram -->
  <rect x="300" y="70" width="160" height="70" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">2. Telegram</text>
  <text x="380" y="122" text-anchor="middle" font-size="13" fill="#334155">Update yuboradi</text>

  <!-- 3 dispatcher -->
  <rect x="570" y="70" width="160" height="70" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="650" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">3. Dispatcher</text>
  <text x="650" y="122" text-anchor="middle" font-size="13" fill="#334155">handler topadi</text>

  <!-- arrows row1 -->
  <line x1="190" y1="105" x2="296" y2="105" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="460" y1="105" x2="566" y2="105" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- callback_data box -->
  <rect x="250" y="170" width="260" height="58" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="194" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">callback_data = "prod:view:42"</text>
  <text x="380" y="216" text-anchor="middle" font-size="13" fill="#334155">(tugmaga oldindan yozilgan satr)</text>
  <line x1="380" y1="140" x2="380" y2="168" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- 4 handler -->
  <rect x="570" y="170" width="160" height="70" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="650" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">4. Handler</text>
  <text x="650" y="222" text-anchor="middle" font-size="13" fill="#334155">ishga tushadi</text>
  <line x1="650" y1="140" x2="650" y2="168" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- 5 answer -->
  <rect x="300" y="280" width="430" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="515" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">5. cq.answer()  — "soat aylanishini" to'xtatadi (MAJBURIY)</text>
  <text x="515" y="325" text-anchor="middle" font-size="13" fill="#334155">+ cq.message.edit_text(...) bilan xabarni yangilash</text>
  <line x1="650" y1="240" x2="585" y2="278" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- warning -->
  <rect x="30" y="360" width="700" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="380" y="382" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">Diqqat: answer() chaqirilmasa, tugmada soat aylanaverib qoladi (~30 soniya)</text>
  <text x="380" y="402" text-anchor="middle" font-size="13" fill="#334155">callback_data uzunligi 1..64 bayt; undan oshsa Telegram tugmani qabul qilmaydi</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
