<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" font-family="Segoe UI, sans-serif">
  <title>Inline rejim: @bot soroviga javob (inline_query)</title>
  <rect width="760" height="410" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Inline rejim: istalgan chatda @bot bilan qidirish</text>

  <!-- 1 user types -->
  <rect x="30" y="64" width="220" height="84" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">1. Foydalanuvchi yozadi</text>
  <rect x="48" y="104" width="184" height="30" rx="6" fill="#eff6ff" stroke="#94a3b8"/>
  <text x="60" y="124" font-size="14" fill="#2563eb" font-weight="700">@mybot pizza</text>

  <!-- 2 telegram inline_query -->
  <rect x="290" y="64" width="180" height="84" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">2. Telegram</text>
  <text x="380" y="118" text-anchor="middle" font-size="13" fill="#334155">inline_query</text>
  <text x="380" y="136" text-anchor="middle" font-size="13" fill="#334155">yuboradi</text>

  <!-- 3 bot answers -->
  <rect x="510" y="64" width="220" height="84" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">3. Bot javob beradi</text>
  <text x="620" y="116" text-anchor="middle" font-size="13" fill="#334155">iq.answer([results])</text>
  <text x="620" y="136" text-anchor="middle" font-size="13" fill="#334155">natijalar ro'yxati</text>

  <line x1="250" y1="106" x2="286" y2="106" stroke="#94a3b8" stroke-width="2" marker-end="url(#i)"/>
  <line x1="470" y1="106" x2="506" y2="106" stroke="#94a3b8" stroke-width="2" marker-end="url(#i)"/>

  <!-- results dropdown -->
  <rect x="180" y="184" width="400" height="150" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="380" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Natijalar (foydalanuvchi tanlaydi):</text>
  <rect x="196" y="220" width="368" height="32" rx="6" fill="#eff6ff"/>
  <text x="208" y="241" font-size="13" fill="#1e293b">Pepperoni pizza</text>
  <rect x="196" y="258" width="368" height="32" rx="6" fill="#eff6ff"/>
  <text x="208" y="279" font-size="13" fill="#1e293b">Margarita pizza</text>
  <rect x="196" y="296" width="368" height="32" rx="6" fill="#eff6ff"/>
  <text x="208" y="317" font-size="13" fill="#1e293b">Tort pizza</text>
  <line x1="620" y1="148" x2="470" y2="184" stroke="#16a34a" stroke-width="2" marker-end="url(#i)"/>

  <!-- bottom note -->
  <rect x="30" y="350" width="700" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="380" y="370" text-anchor="middle" font-size="13" fill="#1e293b">Inline rejimni @BotFather -> /setinline orqali yoqish SHART, aks holda @bot ... ishlamaydi.</text>
  <text x="380" y="390" text-anchor="middle" font-size="13" fill="#334155">Tanlangan natija bot nomidan istalgan chatga yuboriladi — guruhga a'zo bo'lish shart emas.</text>

  <defs>
    <marker id="i" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
