<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Segoe UI, sans-serif">
  <title>channel_post update oqimi: kanal posti handlerga qanday yetib boradi</title>
  <rect width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Kanaldagi post -&gt; @router.channel_post</text>

  <rect x="250" y="58" width="260" height="48" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="80" font-size="14" font-weight="bold" fill="#166534" text-anchor="middle">Kanalda yangi post chiqdi</text>
  <text x="380" y="98" font-size="13" fill="#166534" text-anchor="middle">(bot admin bo'lgan kanal)</text>

  <line x1="380" y1="106" x2="380" y2="132" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="250" y="134" width="260" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="161" font-size="13" fill="#1e3a8a" text-anchor="middle">Telegram -&gt; Update(channel_post=...)</text>

  <line x1="380" y1="178" x2="380" y2="204" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="250" y="206" width="260" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="233" font-size="13" fill="#1e3a8a" text-anchor="middle">Dispatcher -&gt; channel_post observer</text>

  <line x1="380" y1="250" x2="380" y2="276" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="200" y="278" width="360" height="62" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="302" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">@router.channel_post(F.text)</text>
  <text x="380" y="324" font-size="13" fill="#334155" text-anchor="middle">async def yangi_post(message): ...</text>

  <!-- right note: NOT message -->
  <rect x="560" y="206" width="180" height="134" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="650" y="232" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">DIQQAT</text>
  <text x="650" y="258" font-size="13" fill="#334155" text-anchor="middle">Kanal posti</text>
  <text x="650" y="278" font-size="13" fill="#334155" text-anchor="middle">@router.message</text>
  <text x="650" y="298" font-size="13" fill="#dc2626" text-anchor="middle">ga TUSHMAYDI!</text>
  <text x="650" y="320" font-size="13" fill="#334155" text-anchor="middle">channel_post</text>
  <text x="650" y="336" font-size="13" fill="#334155" text-anchor="middle">kerak</text>

  <line x1="560" y1="273" x2="510" y2="300" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#r)"/>

  <!-- bottom: message has no from_user, sender_chat instead -->
  <rect x="120" y="372" width="520" height="50" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="393" font-size="13" fill="#334155" text-anchor="middle">message.from_user = None (kanal nomidan), message.sender_chat = kanal</text>
  <text x="380" y="412" font-size="13" fill="#334155" text-anchor="middle">message.chat.type == "channel"</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
</svg>
