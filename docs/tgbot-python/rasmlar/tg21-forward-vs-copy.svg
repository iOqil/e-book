<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Segoe UI, sans-serif">
  <title>forward_message va copy_message farqi: manba yorlig'i bilan yoki yorliqsiz</title>
  <rect width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">forward_message va copy_message</text>

  <!-- source -->
  <rect x="300" y="56" width="160" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="78" font-size="14" font-weight="bold" fill="#166534" text-anchor="middle">Asl post</text>
  <text x="380" y="97" font-size="13" fill="#166534" text-anchor="middle">(kanal / chat)</text>

  <line x1="320" y1="106" x2="200" y2="148" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="440" y1="106" x2="560" y2="148" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- LEFT forward -->
  <rect x="40" y="150" width="300" height="210" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="178" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">forward_message</text>
  <rect x="68" y="196" width="244" height="58" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="190" y="218" font-size="13" fill="#1e3a8a" text-anchor="middle">"Forwarded from</text>
  <text x="190" y="237" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Mening kanalim"</text>
  <text x="190" y="282" font-size="13" fill="#334155" text-anchor="middle">+ manba korinadi</text>
  <text x="190" y="304" font-size="13" fill="#334155" text-anchor="middle">+ original havola</text>
  <text x="190" y="326" font-size="13" fill="#64748b" text-anchor="middle">"qayta yo'naltirish"</text>

  <!-- RIGHT copy -->
  <rect x="420" y="150" width="300" height="210" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="570" y="178" font-size="16" font-weight="bold" fill="#16a34a" text-anchor="middle">copy_message</text>
  <rect x="448" y="196" width="244" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="570" y="218" font-size="13" fill="#166534" text-anchor="middle">(yorliqsiz)</text>
  <text x="570" y="237" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">toza nusxa</text>
  <text x="570" y="282" font-size="13" fill="#334155" text-anchor="middle">- manba korinmaydi</text>
  <text x="570" y="304" font-size="13" fill="#334155" text-anchor="middle">+ o'z postingdek</text>
  <text x="570" y="326" font-size="13" fill="#64748b" text-anchor="middle">"nusxa olish"</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>
</svg>
