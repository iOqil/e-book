<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Segoe UI, sans-serif">
  <title>Inline tugmalar bilan sahifalash (pagination)</title>
  <rect width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Sahifalash: bitta xabar, navigatsiya tugmalari</text>

  <!-- page 1 -->
  <rect x="40" y="64" width="320" height="300" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="200" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">Sahifa 1 / 5</text>
  <rect x="60" y="104" width="280" height="26" rx="5" fill="#eff6ff"/>
  <text x="70" y="122" font-size="13" fill="#334155">Mahsulot 1</text>
  <rect x="60" y="136" width="280" height="26" rx="5" fill="#eff6ff"/>
  <text x="70" y="154" font-size="13" fill="#334155">Mahsulot 2</text>
  <rect x="60" y="168" width="280" height="26" rx="5" fill="#eff6ff"/>
  <text x="70" y="186" font-size="13" fill="#334155">Mahsulot 3 ... 5</text>
  <!-- nav buttons -->
  <rect x="170" y="300" width="74" height="34" rx="8" fill="#e0e7ff" stroke="#94a3b8"/>
  <text x="207" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">1/5</text>
  <rect x="252" y="300" width="74" height="34" rx="8" fill="#2563eb"/>
  <text x="289" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">&#187;&#187;</text>
  <text x="200" y="354" text-anchor="middle" font-size="13" fill="#64748b">birinchi sahifada "&#171;&#171;" yo'q</text>

  <!-- arrow -->
  <line x1="368" y1="214" x2="396" y2="214" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>
  <text x="382" y="200" text-anchor="middle" font-size="13" fill="#16a34a">edit_text</text>

  <!-- page 2 -->
  <rect x="400" y="64" width="320" height="300" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="560" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">Sahifa 2 / 5</text>
  <rect x="420" y="104" width="280" height="26" rx="5" fill="#eff6ff"/>
  <text x="430" y="122" font-size="13" fill="#334155">Mahsulot 6</text>
  <rect x="420" y="136" width="280" height="26" rx="5" fill="#eff6ff"/>
  <text x="430" y="154" font-size="13" fill="#334155">Mahsulot 7</text>
  <rect x="420" y="168" width="280" height="26" rx="5" fill="#eff6ff"/>
  <text x="430" y="186" font-size="13" fill="#334155">Mahsulot 8 ... 10</text>
  <rect x="470" y="300" width="60" height="34" rx="8" fill="#2563eb"/>
  <text x="500" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">&#171;&#171;</text>
  <rect x="538" y="300" width="60" height="34" rx="8" fill="#e0e7ff" stroke="#94a3b8"/>
  <text x="568" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">2/5</text>
  <rect x="606" y="300" width="60" height="34" rx="8" fill="#2563eb"/>
  <text x="636" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">&#187;&#187;</text>
  <text x="560" y="354" text-anchor="middle" font-size="13" fill="#64748b">ikkala yo'nalish ham bor</text>

  <!-- bottom note -->
  <rect x="40" y="378" width="680" height="32" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="380" y="399" text-anchor="middle" font-size="13" fill="#1e293b">Har tugma callback_data ichida sahifa raqamini olib yuradi: Page(num=1).pack() -> "pg:1"</text>

  <defs>
    <marker id="g" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
