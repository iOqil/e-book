<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400">
  <title>my_chat_member: bot a'zoligi holatining o'zgarish diagrammasi</title>
  <rect width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b">Bot a'zoligi holatlari (my_chat_member)</text>

  <!-- States -->
  <!-- left / not member -->
  <rect x="60" y="150" width="160" height="80" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="140" y="185" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#334155">LEFT</text>
  <text x="140" y="208" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">guruhda emas</text>

  <!-- member -->
  <rect x="300" y="150" width="160" height="80" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="380" y="185" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">MEMBER</text>
  <text x="380" y="208" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">oddiy a'zo</text>

  <!-- admin -->
  <rect x="300" y="20" width="160" height="80" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="380" y="55" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">ADMINISTRATOR</text>
  <text x="380" y="78" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">admin huquqlari</text>

  <!-- banned -->
  <rect x="540" y="150" width="160" height="80" rx="12" fill="#fff" stroke="#dc2626" stroke-width="2.5"/>
  <text x="620" y="185" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">KICKED</text>
  <text x="620" y="208" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">banlangan</text>

  <!-- transitions -->
  <!-- LEFT -> MEMBER (JOIN) -->
  <line x1="220" y1="180" x2="298" y2="180" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="298,174 310,180 298,186" fill="#16a34a"/>
  <text x="260" y="170" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a">JOIN_TRANSITION</text>

  <!-- MEMBER -> LEFT (LEAVE) -->
  <line x1="298" y1="205" x2="222" y2="205" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="222,199 210,205 222,211" fill="#94a3b8"/>
  <text x="260" y="225" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">LEAVE_TRANSITION</text>

  <!-- MEMBER -> ADMIN (PROMOTED) -->
  <line x1="380" y1="150" x2="380" y2="102" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="374,102 380,90 386,102" fill="#2563eb"/>
  <text x="495" y="128" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#2563eb">PROMOTED_TRANSITION</text>

  <!-- MEMBER -> KICKED -->
  <line x1="460" y1="190" x2="538" y2="190" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="538,184 550,190 538,196" fill="#dc2626"/>
  <text x="500" y="180" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#dc2626">KICKED</text>

  <!-- legend -->
  <rect x="60" y="290" width="640" height="90" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="80" y="316" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Filtr:</text>
  <text x="80" y="340" font-family="Segoe UI" font-size="13" fill="#334155">@router.my_chat_member(</text>
  <text x="290" y="340" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a">ChatMemberUpdatedFilter(member_status_changed=JOIN_TRANSITION)</text>
  <text x="80" y="364" font-family="Segoe UI" font-size="13" fill="#334155">old_chat_member -> new_chat_member o'zgarishini tutadi</text>
</svg>
