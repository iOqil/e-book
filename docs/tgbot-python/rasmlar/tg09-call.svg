<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380">
  <title>BaseMiddleware __call__ uch argumenti: handler, event, data</title>
  <rect width="760" height="380" fill="#f8fafc"/>
  <text x="380" y="34" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">__call__(self, handler, event, data)</text>

  <!-- code-like box -->
  <rect x="40" y="60" width="680" height="120" rx="10" fill="#0f172a"/>
  <text x="60" y="90" font-family="Consolas, monospace" font-size="14" fill="#93c5fd">async def __call__(self, handler, event, data):</text>
  <text x="80" y="114" font-family="Consolas, monospace" font-size="14" fill="#cbd5e1"># ... event keldi (oldidan ish)</text>
  <text x="80" y="138" font-family="Consolas, monospace" font-size="14" fill="#86efac">result = await handler(event, data)</text>
  <text x="80" y="162" font-family="Consolas, monospace" font-size="14" fill="#cbd5e1"># ... handler tugadi (keyingi ish)</text>

  <!-- handler -->
  <rect x="40" y="220" width="210" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="145" y="248" font-family="Segoe UI" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">handler</text>
  <text x="145" y="274" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">zanjirdagi keyingi</text>
  <text x="145" y="294" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">qadam (mw yoki</text>
  <text x="145" y="314" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">handler'ning o'zi)</text>

  <!-- event -->
  <rect x="275" y="220" width="210" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="248" font-family="Segoe UI" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="bold">event</text>
  <text x="380" y="274" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">Message,</text>
  <text x="380" y="294" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">CallbackQuery yoki</text>
  <text x="380" y="314" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">Update (outer'da)</text>

  <!-- data -->
  <rect x="510" y="220" width="210" height="120" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="615" y="248" font-family="Segoe UI" font-size="15" fill="#b45309" text-anchor="middle" font-weight="bold">data (dict)</text>
  <text x="615" y="274" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">bu yerga yozsangiz,</text>
  <text x="615" y="294" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">handler argument</text>
  <text x="615" y="314" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">sifatida oladi</text>

  <line x1="145" y1="190" x2="145" y2="218" stroke="#94a3b8" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="380" y1="190" x2="380" y2="218" stroke="#94a3b8" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="615" y1="190" x2="615" y2="218" stroke="#94a3b8" stroke-width="2" marker-end="url(#a2)"/>

  <text x="380" y="368" font-family="Segoe UI" font-size="13" fill="#dc2626" text-anchor="middle">await handler(...) chaqirmasangiz — update yo'qoladi (throttle/ban shunday ishlaydi).</text>

  <defs><marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/></marker></defs>
</svg>
