<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Segoe UI, sans-serif">
  <title>Birinchi-mos qoidasi: bir observer ichida handlerlar yozilish tartibida sinaladi</title>
  <rect width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" font-size="19" font-weight="bold" fill="#1e293b" text-anchor="middle">Birinchi-mos qoidasi (message observer ichida)</text>
  <text x="380" y="58" font-size="13" fill="#64748b" text-anchor="middle">Kelgan xabar: text = "salom"</text>

  <!-- handler list -->
  <!-- h1 -->
  <rect x="120" y="84" width="520" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="140" y="115" font-size="14" fill="#334155">@router.message(CommandStart())  ->  filtr FALSE</text>
  <text x="610" y="115" font-size="14" fill="#dc2626" text-anchor="end">skip</text>

  <!-- h2 -->
  <rect x="120" y="146" width="520" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="140" y="177" font-size="14" fill="#334155">@router.message(Command("help"))  ->  filtr FALSE</text>
  <text x="610" y="177" font-size="14" fill="#dc2626" text-anchor="end">skip</text>

  <!-- h3 MATCH -->
  <rect x="120" y="208" width="520" height="50" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2.5"/>
  <text x="140" y="239" font-size="14" font-weight="bold" fill="#1e293b">@router.message(F.text == "salom")  ->  filtr TRUE</text>
  <text x="612" y="239" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="end">ISHLADI</text>

  <!-- h4 never -->
  <rect x="120" y="270" width="520" height="50" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="140" y="301" font-size="14" fill="#94a3b8">@router.message(F.text)  ->  bu ham mos, lekin</text>
  <text x="612" y="301" font-size="14" fill="#94a3b8" text-anchor="end">ishlamaydi</text>

  <!-- flow arrow -->
  <line x1="70" y1="100" x2="70" y2="233" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="56" y="170" font-size="13" fill="#2563eb" text-anchor="middle" transform="rotate(-90 56 170)">tartib bilan tekshiradi</text>

  <line x1="70" y1="233" x2="118" y2="233" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>

  <!-- note -->
  <rect x="120" y="344" width="520" height="58" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="380" y="368" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Faqat BIRINCHI mos kelgan handler chaqiriladi.</text>
  <text x="380" y="390" font-size="13" fill="#334155" text-anchor="middle">Shuning uchun aniqroq filtrlarni TEPAGA, catch-all (F.text) ni ENG OXIRGA yozing.</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
</svg>
