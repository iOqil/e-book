<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Segoe UI, sans-serif">
  <title>Kapston botni serverga joylashtirish: kod, systemd xizmati, .env, SQLite fayl va Telegram</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Deploy: VPS serverda 24/7 ishlovchi bot</text>

  <!-- Telegram cloud -->
  <ellipse cx="380" cy="90" rx="130" ry="40" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="86" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Telegram serverlari</text>
  <text x="380" y="108" font-size="13" fill="#334155" text-anchor="middle">getUpdates / sendMessage</text>

  <!-- VPS box -->
  <rect x="80" y="170" width="600" height="220" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="110" y="198" font-size="15" font-weight="bold" fill="#1e293b">VPS server (Ubuntu) — Python 3.14 venv</text>

  <!-- systemd -->
  <rect x="110" y="220" width="200" height="80" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="210" y="246" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">systemd xizmati</text>
  <text x="210" y="268" font-size="13" fill="#334155" text-anchor="middle">tgbot.service</text>
  <text x="210" y="288" font-size="13" fill="#334155" text-anchor="middle">Restart=always</text>

  <!-- bot process -->
  <rect x="350" y="220" width="200" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="246" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">main.py jarayoni</text>
  <text x="450" y="268" font-size="13" fill="#334155" text-anchor="middle">dp.start_polling(bot)</text>
  <text x="450" y="288" font-size="13" fill="#334155" text-anchor="middle">+ APScheduler</text>

  <!-- .env -->
  <rect x="110" y="320" width="200" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="210" y="344" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">.env (maxfiy)</text>
  <text x="210" y="364" font-size="13" fill="#334155" text-anchor="middle">BOT_TOKEN, ADMIN_IDS</text>

  <!-- sqlite -->
  <rect x="350" y="320" width="200" height="56" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="344" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">tasks.db (SQLite)</text>
  <text x="450" y="364" font-size="13" fill="#334155" text-anchor="middle">backup kerak</text>

  <!-- arrows -->
  <defs>
    <marker id="a3" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <line x1="380" y1="130" x2="450" y2="218" stroke="#94a3b8" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="450" y1="218" x2="380" y2="132" stroke="#94a3b8" stroke-width="2" marker-end="url(#a3)"/>
  <text x="560" y="180" font-size="13" fill="#334155">HTTPS (polling)</text>
  <line x1="310" y1="260" x2="348" y2="260" stroke="#94a3b8" stroke-width="2" marker-end="url(#a3)"/>
  <text x="330" y="252" font-size="13" fill="#334155" text-anchor="middle">ishga tushiradi</text>
  <line x1="310" y1="348" x2="348" y2="348" stroke="#94a3b8" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="450" y1="300" x2="450" y2="318" stroke="#94a3b8" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="210" y1="320" x2="370" y2="300" stroke="#94a3b8" stroke-width="2" marker-end="url(#a3)"/>
</svg>
