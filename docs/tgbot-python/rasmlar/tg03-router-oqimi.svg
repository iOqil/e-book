<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Segoe UI, sans-serif">
  <title>Update bir nechta router orqali ketma-ket tekshiriladi (include tartibida)</title>
  <rect width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="34" font-size="19" font-weight="bold" fill="#1e293b" text-anchor="middle">Dispatcher update'ni routerlarga tartib bilan uzatadi</text>

  <!-- Update -->
  <rect x="40" y="70" width="130" height="64" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="105" y="98" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Update</text>
  <text x="105" y="120" font-size="13" fill="#64748b" text-anchor="middle">/admin</text>

  <!-- Dispatcher -->
  <rect x="40" y="170" width="130" height="64" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="105" y="198" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Dispatcher</text>
  <text x="105" y="220" font-size="13" fill="#64748b" text-anchor="middle">bosh router</text>

  <line x1="105" y1="134" x2="105" y2="168" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- Router 1: start -->
  <rect x="250" y="80" width="220" height="62" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="270" y="106" font-size="14" font-weight="bold" fill="#1e293b">1. start_router</text>
  <text x="270" y="128" font-size="13" fill="#dc2626">/start, /help -> mos EMAS</text>

  <!-- Router 2: admin -->
  <rect x="250" y="170" width="220" height="62" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="270" y="196" font-size="14" font-weight="bold" fill="#1e293b">2. admin_router</text>
  <text x="270" y="218" font-size="13" fill="#16a34a">/admin -> MOS! ishladi</text>

  <!-- Router 3: echo -->
  <rect x="250" y="260" width="220" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="270" y="286" font-size="14" font-weight="bold" fill="#94a3b8">3. echo_router</text>
  <text x="270" y="308" font-size="13" fill="#94a3b8">tekshirilmaydi (to'xtadi)</text>

  <!-- arrows down between routers -->
  <line x1="170" y1="202" x2="248" y2="111" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="360" y1="142" x2="360" y2="168" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- Handler box -->
  <rect x="540" y="170" width="180" height="62" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="630" y="196" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">on_admin()</text>
  <text x="630" y="218" font-size="13" fill="#64748b" text-anchor="middle">async def handler</text>

  <line x1="470" y1="201" x2="538" y2="201" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>

  <!-- stop note -->
  <rect x="540" y="260" width="180" height="62" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="630" y="286" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">Propagatsiya to'xtaydi</text>
  <text x="630" y="307" font-size="13" fill="#334155" text-anchor="middle">qolgan routerlar yo'q</text>

  <line x1="540" y1="291" x2="472" y2="291" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ar)"/>

  <text x="380" y="372" font-size="14" fill="#334155" text-anchor="middle">Routerlar include_router() bilan qo'shilgan TARTIBDA tekshiriladi.</text>
  <text x="380" y="396" font-size="13" fill="#64748b" text-anchor="middle">Birinchi mos handler topilsa, izlash to'xtaydi. Hech biri mos kelmasa: UNHANDLED (xato emas).</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
</svg>
