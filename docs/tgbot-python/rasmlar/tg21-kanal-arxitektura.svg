<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Segoe UI, sans-serif">
  <title>Bot kanal admin sifatida: bot, kanal va obunachilar munosabati</title>
  <rect width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Bot kanal admin sifatida</text>

  <!-- BOT -->
  <rect x="40" y="150" width="180" height="120" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="185" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">BOT</text>
  <text x="130" y="212" font-size="13" fill="#334155" text-anchor="middle">kanal ADMINi</text>
  <text x="130" y="234" font-size="13" fill="#334155" text-anchor="middle">post yuborish</text>
  <text x="130" y="254" font-size="13" fill="#334155" text-anchor="middle">huquqi bilan</text>

  <!-- KANAL -->
  <rect x="290" y="60" width="190" height="130" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="385" y="95" font-size="16" font-weight="bold" fill="#16a34a" text-anchor="middle">KANAL</text>
  <text x="385" y="120" font-size="13" fill="#334155" text-anchor="middle">@kanal yoki</text>
  <text x="385" y="140" font-size="13" fill="#334155" text-anchor="middle">-100... ID</text>
  <text x="385" y="164" font-size="13" fill="#334155" text-anchor="middle">faqat admin yozadi</text>

  <!-- DISCUSSION GROUP -->
  <rect x="290" y="250" width="190" height="130" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="385" y="285" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">MUHOKAMA GURUHI</text>
  <text x="385" y="310" font-size="13" fill="#334155" text-anchor="middle">(linked group)</text>
  <text x="385" y="332" font-size="13" fill="#334155" text-anchor="middle">post auto-forward</text>
  <text x="385" y="354" font-size="13" fill="#334155" text-anchor="middle">+ izohlar shu yerda</text>

  <!-- SUBSCRIBERS -->
  <rect x="560" y="150" width="170" height="120" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="645" y="185" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">OBUNACHILAR</text>
  <text x="645" y="212" font-size="13" fill="#334155" text-anchor="middle">postni o'qiydi</text>
  <text x="645" y="234" font-size="13" fill="#334155" text-anchor="middle">reaksiya bosadi</text>
  <text x="645" y="254" font-size="13" fill="#334155" text-anchor="middle">izoh yozadi</text>

  <!-- arrows -->
  <line x1="220" y1="190" x2="288" y2="140" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="245" y="150" font-size="13" fill="#2563eb" text-anchor="middle">send</text>

  <line x1="480" y1="125" x2="558" y2="185" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="528" y="140" font-size="13" fill="#16a34a" text-anchor="middle">post</text>

  <line x1="385" y1="190" x2="385" y2="248" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="455" y="222" font-size="13" fill="#b45309" text-anchor="middle">auto-forward</text>

  <line x1="560" y1="240" x2="482" y2="300" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="540" y="290" font-size="13" fill="#334155" text-anchor="middle">izoh</text>

  <text x="130" y="320" font-size="13" fill="#64748b" text-anchor="middle">@router.channel_post</text>
  <text x="130" y="340" font-size="13" fill="#64748b" text-anchor="middle">guruhdagi izohni ushlaydi</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>
</svg>
