<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Segoe UI, sans-serif">
  <title>chat_member o'tishlari: yangi a'zo, chiqish, ban, mute, admin</title>
  <rect width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">chat_member: a'zolik holatlari va o'tishlari</text>

  <!-- center: MEMBER -->
  <rect x="310" y="180" width="140" height="60" rx="10" fill="#16a34a"/>
  <text x="380" y="206" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">MEMBER</text>
  <text x="380" y="226" text-anchor="middle" font-size="13" fill="#dcfce7">a'zo</text>

  <!-- LEFT (top) -->
  <rect x="310" y="60" width="140" height="56" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="380" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">LEFT</text>
  <text x="380" y="103" text-anchor="middle" font-size="13" fill="#334155">a'zo emas</text>

  <!-- KICKED (right) -->
  <rect x="560" y="180" width="160" height="60" rx="10" fill="#dc2626"/>
  <text x="640" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">KICKED</text>
  <text x="640" y="226" text-anchor="middle" font-size="13" fill="#fee2e2">ban (kicked)</text>

  <!-- RESTRICTED (bottom) -->
  <rect x="300" y="320" width="160" height="60" rx="10" fill="#f59e0b"/>
  <text x="380" y="346" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">RESTRICTED</text>
  <text x="380" y="366" text-anchor="middle" font-size="13" fill="#fff7ed">mute / restrict</text>

  <!-- ADMINISTRATOR (left) -->
  <rect x="40" y="180" width="170" height="60" rx="10" fill="#2563eb"/>
  <text x="125" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">ADMINISTRATOR</text>
  <text x="125" y="226" text-anchor="middle" font-size="13" fill="#dbeafe">promote</text>

  <!-- arrows -->
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- LEFT <-> MEMBER : JOIN / LEAVE -->
  <line x1="372" y1="180" x2="372" y2="116" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="250" y="150" font-size="13" fill="#16a34a" font-weight="bold">JOIN_TRANSITION</text>
  <line x1="392" y1="116" x2="392" y2="180" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="402" y="150" font-size="13" fill="#64748b" font-weight="bold">LEAVE (left)</text>

  <!-- MEMBER -> KICKED : ban -->
  <line x1="450" y1="206" x2="560" y2="206" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="470" y="196" font-size="13" fill="#dc2626" font-weight="bold">ban_chat_member</text>

  <!-- MEMBER -> RESTRICTED : mute -->
  <line x1="380" y1="240" x2="380" y2="320" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="392" y="285" font-size="13" fill="#f59e0b" font-weight="bold">restrict_chat_member</text>

  <!-- MEMBER -> ADMIN : promote -->
  <line x1="310" y1="210" x2="210" y2="210" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="160" y="172" font-size="13" fill="#2563eb" font-weight="bold">promote_chat_member</text>

  <text x="380" y="408" text-anchor="middle" font-size="13" fill="#64748b">@router.chat_member + ChatMemberUpdatedFilter (eski_holat &gt;&gt; yangi_holat)</text>
</svg>
