<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360">
  <title>Middleware zanjiri: outer va inner middleware orqali handler'ga oqim</title>
  <rect width="760" height="360" fill="#f8fafc"/>
  <text x="380" y="34" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Middleware zanjiri (update -&gt; handler)</text>

  <!-- Update -->
  <rect x="30" y="70" width="120" height="56" rx="10" fill="#2563eb"/>
  <text x="90" y="96" font-family="Segoe UI" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Update</text>
  <text x="90" y="115" font-family="Segoe UI" font-size="13" fill="#dbeafe" text-anchor="middle">Telegram'dan</text>

  <!-- Outer middleware -->
  <rect x="190" y="60" width="160" height="76" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="270" y="86" font-family="Segoe UI" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="bold">OUTER</text>
  <text x="270" y="106" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">filtrlashdan OLDIN</text>
  <text x="270" y="124" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">(ban, log, til)</text>

  <!-- Filter -->
  <rect x="390" y="70" width="120" height="56" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="450" y="96" font-family="Segoe UI" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="bold">Filtrlar</text>
  <text x="450" y="115" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">Command, F...</text>

  <!-- Inner middleware -->
  <rect x="550" y="60" width="160" height="76" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="630" y="86" font-family="Segoe UI" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="bold">INNER</text>
  <text x="630" y="106" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">filtrlashdan KEYIN</text>
  <text x="630" y="124" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">(DB, user in'ekt.)</text>

  <!-- arrows row1 -->
  <line x1="150" y1="98" x2="188" y2="98" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="350" y1="98" x2="388" y2="98" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="510" y1="98" x2="548" y2="98" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- down to handler -->
  <line x1="630" y1="136" x2="630" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="540" y="206" width="180" height="60" rx="10" fill="#16a34a"/>
  <text x="630" y="232" font-family="Segoe UI" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">HANDLER</text>
  <text x="630" y="252" font-family="Segoe UI" font-size="13" fill="#dcfce7" text-anchor="middle">data['db'], data['user']</text>

  <!-- short circuit note -->
  <rect x="190" y="206" width="160" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="270" y="230" font-family="Segoe UI" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">return (handler'siz)</text>
  <text x="270" y="250" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">= update tashlanadi</text>
  <line x1="270" y1="136" x2="270" y2="204" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrR)"/>

  <text x="380" y="312" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">Outer hamma update'da ishlaydi; inner faqat filtr o'tgan event'da. data dict handler argumentiga aylanadi.</text>
  <text x="380" y="336" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">await handler(event, data) -&gt; davom; return -&gt; to'xtatish</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker>
  </defs>
</svg>
