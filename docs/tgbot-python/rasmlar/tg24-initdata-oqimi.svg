<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Segoe UI, sans-serif">
  <title>initData autentifikatsiya oqimi: client -> backend -> tekshiruv</title>
  <rect width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">initData autentifikatsiya oqimi</text>

  <!-- Telegram -->
  <rect x="40" y="70" width="180" height="90" rx="10" fill="#2563eb"/>
  <text x="130" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Telegram</text>
  <text x="130" y="124" text-anchor="middle" font-size="13" fill="#e0e7ff">user, auth_date</text>
  <text x="130" y="144" text-anchor="middle" font-size="13" fill="#e0e7ff">+ hash imzolanadi</text>

  <!-- Mini App (client) -->
  <rect x="290" y="70" width="180" height="90" rx="10" fill="#16a34a"/>
  <text x="380" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Mini App (client)</text>
  <text x="380" y="124" text-anchor="middle" font-size="13" fill="#dcfce7">window.Telegram</text>
  <text x="380" y="144" text-anchor="middle" font-size="13" fill="#dcfce7">.WebApp.initData</text>

  <!-- Backend -->
  <rect x="540" y="70" width="180" height="90" rx="10" fill="#f59e0b"/>
  <text x="630" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Backend (siz)</text>
  <text x="630" y="124" text-anchor="middle" font-size="13" fill="#1e293b">check_webapp_</text>
  <text x="630" y="144" text-anchor="middle" font-size="13" fill="#1e293b">signature(token, ..)</text>

  <!-- arrows -->
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <line x1="220" y1="115" x2="288" y2="115" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="254" y="106" text-anchor="middle" font-size="13" fill="#334155">beradi</text>
  <line x1="470" y1="115" x2="538" y2="115" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="504" y="106" text-anchor="middle" font-size="13" fill="#334155">HTTP header</text>

  <!-- decision -->
  <rect x="490" y="210" width="230" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="605" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">hash to'g'rimi?</text>
  <text x="605" y="262" text-anchor="middle" font-size="13" fill="#334155">hmac.compare_digest</text>
  <line x1="630" y1="160" x2="630" y2="208" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- True -->
  <rect x="490" y="330" width="230" height="56" rx="10" fill="#16a34a"/>
  <text x="605" y="353" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">✓ True: user'ga ishon</text>
  <text x="605" y="374" text-anchor="middle" font-size="13" fill="#dcfce7">safe_parse -> user.id</text>
  <line x1="605" y1="280" x2="605" y2="328" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="640" y="308" text-anchor="middle" font-size="13" fill="#16a34a">ha</text>

  <!-- False -->
  <rect x="40" y="330" width="230" height="56" rx="10" fill="#dc2626"/>
  <text x="155" y="353" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">✗ False: 403 rad et</text>
  <text x="155" y="374" text-anchor="middle" font-size="13" fill="#fee2e2">soxta / buzilgan</text>
  <line x1="490" y1="255" x2="272" y2="345" stroke="#dc2626" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="360" y="296" text-anchor="middle" font-size="13" fill="#dc2626">yo'q</text>

  <text x="380" y="420" text-anchor="middle" font-size="13" fill="#64748b">Clientga ishonmaymiz — imzoni serverda token bilan tekshiramiz</text>
</svg>
