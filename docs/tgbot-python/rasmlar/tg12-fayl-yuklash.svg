<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360">
  <title>Telegram fayl yuklab olish oqimi: file_id -> get_file -> download</title>
  <rect width="760" height="360" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b">Fayl yuklab olish: 3 bosqich</text>

  <!-- Step 1: user sends file -->
  <rect x="30" y="70" width="200" height="90" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="100" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">1. Foydalanuvchi</text>
  <text x="130" y="122" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">rasm/hujjat yuboradi</text>
  <text x="130" y="142" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">message.document</text>

  <!-- arrow -->
  <line x1="230" y1="115" x2="290" y2="115" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="290,109 302,115 290,121" fill="#94a3b8"/>

  <!-- Step 2: file_id -->
  <rect x="302" y="70" width="200" height="90" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <text x="402" y="100" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#f59e0b">2. file_id</text>
  <text x="402" y="122" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">message.document</text>
  <text x="402" y="142" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">.file_id</text>

  <!-- arrow -->
  <line x1="502" y1="115" x2="562" y2="115" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="562,109 574,115 562,121" fill="#94a3b8"/>

  <!-- Step 3: download -->
  <rect x="574" y="70" width="160" height="90" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="654" y="100" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">3. Diskka</text>
  <text x="654" y="122" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">await bot.download</text>
  <text x="654" y="142" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">(doc, "fayl.pdf")</text>

  <!-- bottom: two ways -->
  <rect x="80" y="210" width="600" height="120" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="238" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Ikki usul</text>

  <text x="105" y="268" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#2563eb">Qisqa (tavsiya):</text>
  <text x="105" y="290" font-family="Segoe UI" font-size="13" fill="#334155">await bot.download(message.document, "kelgan.pdf")</text>

  <text x="105" y="316" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#334155">Qo'lda:</text>
  <text x="180" y="316" font-family="Segoe UI" font-size="13" fill="#334155">get_file() -> download_file(file.file_path, ...)</text>
</svg>
