<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Segoe UI, sans-serif">
  <title>aiogram update oqimi: update - Dispatcher - Router - Handler</title>
  <rect width="760" height="380" fill="#f8fafc"/>
  <text x="380" y="34" font-size="19" font-weight="bold" fill="#1e293b" text-anchor="middle">aiogram'da update qanday yo'l bosadi</text>

  <!-- Update -->
  <rect x="40" y="80" width="140" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="112" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Update</text>
  <text x="110" y="134" font-size="13" fill="#64748b" text-anchor="middle">Telegram'dan</text>
  <text x="110" y="151" font-size="13" fill="#64748b" text-anchor="middle">kelgan hodisa</text>

  <!-- Dispatcher -->
  <rect x="230" y="80" width="140" height="80" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="300" y="112" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Dispatcher</text>
  <text x="300" y="134" font-size="13" fill="#64748b" text-anchor="middle">bosh marshrutchi</text>
  <text x="300" y="151" font-size="13" fill="#64748b" text-anchor="middle">feed_update()</text>

  <!-- Router -->
  <rect x="420" y="80" width="140" height="80" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="490" y="112" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Router</text>
  <text x="490" y="134" font-size="13" fill="#64748b" text-anchor="middle">filtrlarni</text>
  <text x="490" y="151" font-size="13" fill="#64748b" text-anchor="middle">tekshiradi</text>

  <!-- Handler -->
  <rect x="610" y="80" width="120" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="670" y="112" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Handler</text>
  <text x="670" y="134" font-size="13" fill="#64748b" text-anchor="middle">async def</text>
  <text x="670" y="151" font-size="13" fill="#64748b" text-anchor="middle">ishni bajaradi</text>

  <line x1="180" y1="120" x2="228" y2="120" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="370" y1="120" x2="418" y2="120" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="560" y1="120" x2="608" y2="120" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- Filter detail -->
  <rect x="230" y="210" width="330" height="120" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="395" y="236" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Router filtrlarni tartib bilan sinaydi</text>
  <text x="250" y="262" font-size="13" fill="#334155">@router.message(CommandStart())  -> /start mos?</text>
  <text x="250" y="286" font-size="13" fill="#334155">@router.message(Command("help")) -> /help mos?</text>
  <text x="250" y="310" font-size="13" fill="#16a34a">Birinchi MOS kelgan handler ishlaydi, qolganlari yo'q.</text>

  <line x1="490" y1="160" x2="430" y2="208" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#af)"/>

  <text x="380" y="362" font-size="13" fill="#64748b" text-anchor="middle">Hech bir filtr mos kelmasa, update e'tiborsiz qoldiriladi (xato emas).</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="af" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/></marker>
  </defs>
</svg>
