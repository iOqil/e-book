<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <title>Private kanal: invite link va chat_join_request approve oqimi</title>
  <rect width="800" height="400" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b">Private kanal: join request -> approve</text>

  <!-- step 1: invite link -->
  <rect x="40" y="80" width="170" height="90" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="125" y="110" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">1. Invite link</text>
  <text x="125" y="132" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">create_chat_invite_link</text>
  <text x="125" y="152" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">creates_join_request=True</text>

  <!-- step 2: user requests -->
  <rect x="250" y="80" width="170" height="90" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="335" y="110" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155">2. Foydalanuvchi</text>
  <text x="335" y="132" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">link orqali "Join"</text>
  <text x="335" y="152" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">so'rovi yuboradi</text>

  <!-- step 3: update -->
  <rect x="460" y="80" width="180" height="90" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="550" y="110" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">3. chat_join_request</text>
  <text x="550" y="132" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">update botga keladi</text>
  <text x="550" y="152" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">@router.chat_join_request</text>

  <!-- arrows row -->
  <line x1="210" y1="125" x2="248" y2="125" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="248,119 260,125 248,131" fill="#94a3b8"/>
  <line x1="420" y1="125" x2="458" y2="125" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="458,119 470,125 458,131" fill="#94a3b8"/>

  <!-- decision -->
  <polygon points="550,210 615,250 550,290 485,250" fill="#fff" stroke="#1e293b" stroke-width="2"/>
  <text x="550" y="246" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#1e293b">shartlar</text>
  <text x="550" y="262" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#1e293b">bajarildimi?</text>
  <line x1="550" y1="170" x2="550" y2="208" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="544,208 550,220 556,208" fill="#94a3b8"/>

  <!-- approve -->
  <rect x="350" y="320" width="180" height="60" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="440" y="346" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">approve()</text>
  <text x="440" y="368" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">kanalga qabul qilinadi</text>
  <line x1="510" y1="278" x2="460" y2="318" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="464,312 455,322 472,320" fill="#16a34a"/>
  <text x="455" y="300" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a">HA</text>

  <!-- decline -->
  <rect x="570" y="320" width="180" height="60" rx="12" fill="#fff" stroke="#dc2626" stroke-width="2.5"/>
  <text x="660" y="346" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">decline()</text>
  <text x="660" y="368" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">rad etiladi</text>
  <line x1="590" y1="278" x2="640" y2="318" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="628,316 644,319 634,306" fill="#dc2626"/>
  <text x="650" y="300" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#dc2626">YO'Q</text>

  <!-- note -->
  <text x="40" y="360" font-family="Segoe UI" font-size="13" fill="#334155">Eslatma: bot kanalda</text>
  <text x="40" y="378" font-family="Segoe UI" font-size="13" fill="#334155">admin bo'lishi shart.</text>
</svg>
