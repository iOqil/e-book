<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400">
  <title>Repository naqsh: handler SQL bilan to'g'ridan-to'g'ri ishlamaydi</title>
  <rect x="0" y="0" width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b">Repository naqsh nima beradi?</text>

  <!-- WITHOUT -->
  <text x="190" y="70" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">Repository'siz (chalkash)</text>
  <rect x="40" y="85" width="300" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="190" y="112" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Handler 1</text>
  <text x="190" y="131" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">SELECT ... ichida yozilgan</text>

  <rect x="40" y="150" width="300" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="190" y="177" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Handler 2</text>
  <text x="190" y="196" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">o'sha SQL takrorlangan</text>

  <ellipse cx="190" cy="310" rx="60" ry="20" fill="#475569"/>
  <path d="M130 310 V350 A60 20 0 0 0 250 350 V310" fill="#334155"/>
  <ellipse cx="190" cy="310" rx="60" ry="20" fill="#475569"/>
  <text x="190" y="338" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#ffffff">DB</text>
  <line x1="190" y1="205" x2="190" y2="288" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="160" y1="140" x2="175" y2="290" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- divider -->
  <line x1="380" y1="60" x2="380" y2="370" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- WITH -->
  <text x="570" y="70" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">Repository bilan (tartibli)</text>
  <rect x="420" y="85" width="300" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="570" y="112" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Handler 1</text>
  <text x="570" y="131" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">repo.get(uid)</text>

  <rect x="420" y="150" width="300" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="570" y="177" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Handler 2</text>
  <text x="570" y="196" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">repo.count()</text>

  <rect x="470" y="225" width="200" height="55" rx="8" fill="#2563eb"/>
  <text x="570" y="252" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff">UserRepo</text>
  <text x="570" y="271" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#e0e7ff">barcha SQL shu yerda</text>

  <ellipse cx="570" cy="320" rx="55" ry="18" fill="#475569"/>
  <path d="M515 320 V355 A55 18 0 0 0 625 355 V320" fill="#334155"/>
  <ellipse cx="570" cy="320" rx="55" ry="18" fill="#475569"/>
  <text x="570" y="346" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#ffffff">DB</text>

  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <line x1="570" y1="140" x2="570" y2="223" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a3)"/>
  <line x1="540" y1="205" x2="560" y2="223" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a3)"/>
  <line x1="570" y1="280" x2="570" y2="300" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a3)"/>
</svg>
