<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Segoe UI, sans-serif">
  <title>Vazifa qo'shish FSM formasi holat diagrammasi: bo'sh, waiting_title, waiting_due va saqlash</title>
  <rect x="0" y="0" width="760" height="320" fill="#f8fafc"/>
  <text x="380" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">FSM forma: yangi vazifa qo'shish</text>

  <defs>
    <marker id="a2" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- holat: yo'q -->
  <rect x="30" y="120" width="140" height="64" rx="32" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="100" y="148" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Holat: yo'q</text>
  <text x="100" y="168" font-size="13" fill="#334155" text-anchor="middle">(menyu)</text>

  <!-- waiting_title -->
  <rect x="240" y="115" width="160" height="74" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="146" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">waiting_title</text>
  <text x="320" y="168" font-size="13" fill="#334155" text-anchor="middle">nom kutilmoqda</text>

  <!-- waiting_due -->
  <rect x="470" y="115" width="160" height="74" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="550" y="146" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">waiting_due</text>
  <text x="550" y="168" font-size="13" fill="#334155" text-anchor="middle">muddat kutilmoqda</text>

  <!-- saqlandi -->
  <rect x="660" y="120" width="80" height="64" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="700" y="148" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">DB ga</text>
  <text x="700" y="166" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">saqlash</text>

  <!-- transitions -->
  <line x1="170" y1="152" x2="238" y2="152" stroke="#2563eb" stroke-width="2" marker-end="url(#a2)"/>
  <text x="204" y="142" font-size="13" fill="#334155" text-anchor="middle">"Yangi</text>
  <text x="204" y="112" font-size="13" fill="#334155" text-anchor="middle">vazifa"</text>

  <line x1="400" y1="152" x2="468" y2="152" stroke="#2563eb" stroke-width="2" marker-end="url(#a2)"/>
  <text x="434" y="112" font-size="13" fill="#334155" text-anchor="middle">nom</text>
  <text x="434" y="142" font-size="13" fill="#334155" text-anchor="middle">(>=2)</text>

  <line x1="630" y1="152" x2="658" y2="152" stroke="#16a34a" stroke-width="2" marker-end="url(#a2)"/>

  <!-- cancel arrows back to none -->
  <path d="M320,189 Q320,260 100,260 Q70,260 80,186" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a2)"/>
  <path d="M550,189 Q550,290 100,290 Q60,290 75,186" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a2)"/>
  <text x="330" y="278" font-size="13" fill="#dc2626" text-anchor="middle">/cancel -> state.clear()</text>

  <!-- save -> none -->
  <path d="M700,184 Q700,250 130,238 Q118,236 110,186" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#a2)"/>
  <text x="430" y="232" font-size="13" fill="#16a34a" text-anchor="middle">saqlandi -> state.clear() -> menyu</text>
</svg>
