<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Segoe UI, sans-serif">
  <title>Captcha oqimi: yangi a'zoni restrict qilib, tugma bosgach ochish</title>
  <rect width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Captcha: yangi a'zoni tekshirish</text>

  <defs>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- 1 join -->
  <rect x="40" y="70" width="200" height="64" rx="10" fill="#16a34a"/>
  <text x="140" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">1. Yangi a'zo kirdi</text>
  <text x="140" y="118" text-anchor="middle" font-size="13" fill="#dcfce7">JOIN_TRANSITION</text>

  <line x1="240" y1="102" x2="300" y2="102" stroke="#334155" stroke-width="2.5" marker-end="url(#a3)"/>

  <!-- 2 restrict -->
  <rect x="300" y="70" width="220" height="64" rx="10" fill="#f59e0b"/>
  <text x="410" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">2. Bot restrict qiladi</text>
  <text x="410" y="116" text-anchor="middle" font-size="13" fill="#fff7ed">can_send_messages=False</text>

  <line x1="520" y1="102" x2="580" y2="102" stroke="#334155" stroke-width="2.5" marker-end="url(#a3)"/>

  <!-- 3 button -->
  <rect x="580" y="70" width="160" height="64" rx="10" fill="#2563eb"/>
  <text x="660" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">3. Tugma</text>
  <text x="660" y="116" text-anchor="middle" font-size="13" fill="#dbeafe">"Men robot emasman"</text>

  <line x1="660" y1="134" x2="660" y2="200" stroke="#334155" stroke-width="2.5" marker-end="url(#a3)"/>

  <!-- 4 press -->
  <rect x="540" y="200" width="200" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="640" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">4. Foydalanuvchi bosdi</text>
  <text x="640" y="246" text-anchor="middle" font-size="13" fill="#334155">callback_query</text>

  <line x1="540" y1="232" x2="480" y2="232" stroke="#334155" stroke-width="2.5" marker-end="url(#a3)"/>

  <!-- 5 check id -->
  <polygon points="350,200 480,232 350,264 220,232" fill="#f59e0b"/>
  <text x="350" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">callback id ==</text>
  <text x="350" y="246" text-anchor="middle" font-size="13" fill="#fff7ed">yangi a'zo id?</text>

  <!-- yes -->
  <line x1="350" y1="264" x2="350" y2="320" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a3)"/>
  <text x="362" y="296" font-size="13" fill="#16a34a" font-weight="bold">HA</text>
  <rect x="230" y="320" width="240" height="64" rx="10" fill="#16a34a"/>
  <text x="350" y="346" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">5. Restrict olib tashlanadi</text>
  <text x="350" y="366" text-anchor="middle" font-size="13" fill="#dcfce7">to'liq ruxsatlar qaytariladi</text>

  <!-- no -->
  <line x1="220" y1="232" x2="150" y2="232" stroke="#dc2626" stroke-width="2.5" marker-end="url(#a3)"/>
  <text x="160" y="222" font-size="13" fill="#dc2626" font-weight="bold">YO'Q</text>
  <rect x="20" y="200" width="120" height="64" rx="10" fill="#dc2626"/>
  <text x="80" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">"Bu sizning</text>
  <text x="80" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">tugmangiz emas"</text>

  <text x="380" y="420" text-anchor="middle" font-size="13" fill="#64748b">Bot admin + can_restrict_members shart. Timeout: bosmasa kick (illustrativ).</text>
</svg>
