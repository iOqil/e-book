<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <title>Map tuzilishi: kalit -> qiymat juftliklari, kalit har qanday tur bo'lishi mumkin</title>

  <defs>
    <marker id="okMAP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Sarlavha -->
  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Map — kalit va qiymat juftliklari</text>
  <text x="360" y="54" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Har yozuv: kalit -> qiymat. Kalit HAR QANDAY tur bo'lishi mumkin (string, son, boolean, obyekt)</text>

  <!-- Map konteyner -->
  <rect x="60" y="76" width="600" height="206" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="100" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#2563eb">const m = new Map()</text>
  <text x="600" y="100" text-anchor="end" font-family="Consolas, monospace" font-size="13" fill="#475569">m.size = 3</text>

  <!-- Ustun sarlavhalari -->
  <text x="200" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Kalit (key)</text>
  <text x="520" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Qiymat (value)</text>

  <!-- Yozuv 1: string kalit -->
  <rect x="86" y="140" width="228" height="36" rx="7" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="200" y="163" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#1e293b">"ism"  (string)</text>
  <line x1="316" y1="158" x2="404" y2="158" stroke="#475569" stroke-width="2" marker-end="url(#okMAP)"/>
  <rect x="406" y="140" width="228" height="36" rx="7" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="1.5"/>
  <text x="520" y="163" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#1e293b">"Oqil"</text>

  <!-- Yozuv 2: son kalit -->
  <rect x="86" y="184" width="228" height="36" rx="7" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="200" y="207" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#1e293b">1  (son / number)</text>
  <line x1="316" y1="202" x2="404" y2="202" stroke="#475569" stroke-width="2" marker-end="url(#okMAP)"/>
  <rect x="406" y="184" width="228" height="36" rx="7" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="1.5"/>
  <text x="520" y="207" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#1e293b">"son kalit"</text>

  <!-- Yozuv 3: boolean kalit -->
  <rect x="86" y="228" width="228" height="36" rx="7" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="200" y="251" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#1e293b">true  (boolean)</text>
  <line x1="316" y1="246" x2="404" y2="246" stroke="#475569" stroke-width="2" marker-end="url(#okMAP)"/>
  <rect x="406" y="228" width="228" height="36" rx="7" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="1.5"/>
  <text x="520" y="251" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#1e293b">"boolean kalit"</text>

  <!-- Pastki: metodlar va Object farqi -->
  <rect x="60" y="298" width="290" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="205" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Asosiy metodlar</text>
  <text x="205" y="340" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">.set(k, v) · .get(k) · .has(k)</text>
  <text x="205" y="356" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">.delete(k) · .size · for...of</text>

  <rect x="370" y="298" width="290" height="64" rx="10" fill="#f59e0b" fill-opacity="0.10" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="515" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#b45309">Object'dan farqi</text>
  <text x="515" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Object kaliti faqat string/symbol;</text>
  <text x="515" y="356" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Map'da .size bor, tartib kafolatli</text>
</svg>
