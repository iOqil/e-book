<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320">
  <title>Function composition — pipe: data bir funksiyadan ikkinchisiga oqadi</title>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="320" fill="#f8fafc"/>
  <text x="380" y="34" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">pipe(trim, kichik, boshKatta) — data oqadi</text>

  <!-- input -->
  <rect x="20" y="120" width="120" height="56" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="80" y="145" font-family="monospace" font-size="14" fill="#1e293b" text-anchor="middle">kirish</text>
  <text x="80" y="166" font-family="monospace" font-size="14" fill="#2563eb" text-anchor="middle">"  SALOM  "</text>

  <!-- f1 -->
  <rect x="200" y="110" width="120" height="76" rx="10" fill="#2563eb" stroke="#1e293b"/>
  <text x="260" y="142" font-family="monospace" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">trim</text>
  <text x="260" y="166" font-family="monospace" font-size="13" fill="#dbeafe" text-anchor="middle">probelni olib</text>

  <!-- f2 -->
  <rect x="380" y="110" width="120" height="76" rx="10" fill="#2563eb" stroke="#1e293b"/>
  <text x="440" y="142" font-family="monospace" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">kichik</text>
  <text x="440" y="166" font-family="monospace" font-size="13" fill="#dbeafe" text-anchor="middle">kichik harf</text>

  <!-- f3 -->
  <rect x="560" y="110" width="120" height="76" rx="10" fill="#2563eb" stroke="#1e293b"/>
  <text x="620" y="142" font-family="monospace" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">boshKatta</text>
  <text x="620" y="166" font-family="monospace" font-size="13" fill="#dbeafe" text-anchor="middle">bosh harf</text>

  <!-- arrows + intermediate values -->
  <line x1="140" y1="148" x2="196" y2="148" stroke="#475569" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="320" y1="148" x2="376" y2="148" stroke="#475569" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="348" y="100" font-family="monospace" font-size="14" fill="#16a34a" text-anchor="middle">"SALOM"</text>
  <line x1="500" y1="148" x2="556" y2="148" stroke="#475569" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="528" y="100" font-family="monospace" font-size="14" fill="#16a34a" text-anchor="middle">"salom"</text>

  <!-- output -->
  <line x1="620" y1="186" x2="620" y2="232" stroke="#475569" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="540" y="236" width="160" height="56" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="620" y="261" font-family="monospace" font-size="14" fill="#1e293b" text-anchor="middle">natija</text>
  <text x="620" y="282" font-family="monospace" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="bold">"Salom"</text>

  <text x="80" y="232" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569" text-anchor="middle">chapdan o'ngga</text>
  <text x="380" y="262" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">compose esa o'ngdan chapga: aynan teskari yo'nalish</text>
</svg>
