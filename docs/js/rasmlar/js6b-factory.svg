<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360">
  <title>Factory pattern: kirish (tur) -&gt; factory funksiya -&gt; tayyor obyekt</title>

  <defs>
    <marker id="facArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="760" height="360" fill="#f8fafc"/>

  <!-- Sarlavha -->
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Factory: "buyurtma" bo'yicha obyekt qaytaradi</text>
  <text x="380" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Chaqiruvchi faqat "nima kerakligini" aytadi, "qanday yaratilishi" yashirin</text>

  <!-- Kirish qutisi -->
  <rect x="36" y="140" width="180" height="90" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="126" y="170" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Kirish (so'rov)</text>
  <text x="126" y="194" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">userYarat("admin",</text>
  <text x="126" y="212" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">"Oqil")</text>

  <line x1="216" y1="185" x2="290" y2="185" stroke="#475569" stroke-width="2.5" marker-end="url(#facArrow)"/>

  <!-- Factory qutisi -->
  <rect x="292" y="125" width="190" height="120" rx="10" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2.5"/>
  <text x="387" y="153" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">Factory</text>
  <text x="387" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">turga qarab tanlaydi</text>
  <text x="387" y="203" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">switch (tur) { ... }</text>
  <text x="387" y="227" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yaratish mantig'i bir joyda</text>

  <line x1="482" y1="185" x2="556" y2="185" stroke="#475569" stroke-width="2.5" marker-end="url(#facArrow)"/>

  <!-- Mahsulot qutisi -->
  <rect x="558" y="140" width="180" height="90" rx="10" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="2.5"/>
  <text x="648" y="170" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">Mahsulot</text>
  <text x="648" y="194" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">{ rol: "admin",</text>
  <text x="648" y="212" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">huquqlar: [...] }</text>

  <!-- Yorliqlar strelkalar tepasida -->
  <text x="253" y="174" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">nima kerak</text>
  <text x="519" y="174" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tayyor obyekt</text>

  <!-- Pastki izoh -->
  <rect x="36" y="290" width="702" height="44" rx="9" fill="#f59e0b" fill-opacity="0.10" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="387" y="317" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">Yangi tur qo'shilsa, faqat factory ichi o'zgaradi -- chaqiruvchi kod tegmaydi</text>
</svg>
