<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>querySelector CSS selektor bo'yicha birinchi mos tugunni tanlaydi</title>
  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">querySelector -- bitta tugunni tanlash</text>

  <!-- kod chaqiruvi -->
  <rect x="150" y="56" width="420" height="40" rx="8" fill="#1e293b"/>
  <text x="360" y="82" text-anchor="middle" font-family="monospace" font-size="16" fill="#ffffff">document.querySelector(".btn")</text>

  <!-- strelka pastga -->
  <defs>
    <marker id="strelka" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <line x1="360" y1="100" x2="360" y2="134" stroke="#2563eb" stroke-width="2.5" marker-end="url(#strelka)"/>
  <text x="376" y="124" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">".btn" selektori bo'yicha qidiradi</text>

  <!-- DOM qatlam: ul -> 3 li -->
  <rect x="60" y="150" width="600" height="200" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="80" y="176" font-family="monospace" font-size="15" fill="#1e293b">&lt;ul&gt;</text>

  <!-- li 1: class btn (boshqa joyda) -->
  <g>
    <rect x="100" y="196" width="240" height="42" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="118" y="222" font-family="monospace" font-size="15" fill="#1e293b">&lt;li class="btn"&gt;</text>
  </g>
  <text x="356" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">1-mos -> TANLANADI</text>

  <!-- li 2: class btn (e'tiborsiz qoladi) -->
  <g>
    <rect x="100" y="252" width="240" height="42" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="118" y="278" font-family="monospace" font-size="15" fill="#1e293b">&lt;li class="btn"&gt;</text>
  </g>
  <text x="356" y="278" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">2-mos -> tashlab ketiladi</text>

  <!-- li 3: boshqa class -->
  <g>
    <rect x="100" y="308" width="240" height="32" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="118" y="330" font-family="monospace" font-size="14" fill="#1e293b">&lt;li class="boshqa"&gt;</text>
  </g>
  <text x="356" y="330" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">mos emas</text>

  <!-- 1-mos tanlanganini ko'rsatuvchi ramka -->
  <rect x="96" y="192" width="248" height="50" rx="8" fill="none" stroke="#16a34a" stroke-width="3"/>

  <!-- natija -->
  <line x1="500" y1="217" x2="500" y2="376" stroke="#16a34a" stroke-width="2.5" marker-end="url(#strelka2)"/>
  <defs>
    <marker id="strelka2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="380" y="380" width="260" height="34" rx="8" fill="#16a34a"/>
  <text x="510" y="403" text-anchor="middle" font-family="monospace" font-size="15" fill="#ffffff">-> bitta element qaytadi</text>

  <text x="170" y="405" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">querySelectorAll esa hammasini oladi</text>
</svg>
