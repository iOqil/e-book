<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380">
  <title>Oddiy funksiya va arrow funksiya yozuvini taqqoslash: bir xil natija, qisqaroq sintaksis</title>
  <defs>
    <marker id="oa-arrow" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="380" fill="#f8fafc"/>
  <text x="390" y="40" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">Oddiy funksiya vs Arrow funksiya</text>

  <!-- Oddiy funksiya quti -->
  <rect x="40" y="70" width="320" height="120" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="40" y="70" width="320" height="32" rx="12" fill="#2563eb"/>
  <text x="200" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#f8fafc">Oddiy (function)</text>
  <text x="60" y="132" font-family="Consolas, Courier New, monospace" font-size="16" fill="#1e293b"><tspan fill="#2563eb">const</tspan> summa = <tspan fill="#2563eb">function</tspan>(a, b) {</text>
  <text x="60" y="158" font-family="Consolas, Courier New, monospace" font-size="16" fill="#1e293b">  <tspan fill="#16a34a">return</tspan> a + b;</text>
  <text x="60" y="180" font-family="Consolas, Courier New, monospace" font-size="16" fill="#1e293b">};</text>

  <!-- Arrow funksiya quti -->
  <rect x="420" y="70" width="320" height="120" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="420" y="70" width="320" height="32" rx="12" fill="#16a34a"/>
  <text x="580" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#f8fafc">Arrow (=&gt;)</text>
  <text x="440" y="132" font-family="Consolas, Courier New, monospace" font-size="16" fill="#1e293b"><tspan fill="#2563eb">const</tspan> summa = (a, b) <tspan fill="#dc2626">=&gt;</tspan> {</text>
  <text x="440" y="158" font-family="Consolas, Courier New, monospace" font-size="16" fill="#1e293b">  <tspan fill="#16a34a">return</tspan> a + b;</text>
  <text x="440" y="180" font-family="Consolas, Courier New, monospace" font-size="16" fill="#1e293b">};</text>

  <!-- O'rtadagi tenglik -->
  <text x="390" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="26" font-weight="bold" fill="#475569">=</text>

  <!-- Qisqartirish bosqichlari -->
  <text x="390" y="226" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Arrowni yanada qisqartirish</text>

  <!-- Bosqich 1 -->
  <rect x="120" y="244" width="540" height="34" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="135" y="266" font-family="Consolas, Courier New, monospace" font-size="15" fill="#1e293b">(a, b) =&gt; a + b</text>
  <text x="650" y="266" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">faqat return -&gt; { } va return tashlandi</text>

  <line x1="390" y1="278" x2="390" y2="296" stroke="#475569" stroke-width="2" marker-end="url(#oa-arrow)"/>

  <!-- Bosqich 2 -->
  <rect x="120" y="300" width="540" height="34" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="135" y="322" font-family="Consolas, Courier New, monospace" font-size="15" fill="#1e293b">n =&gt; n * n</text>
  <text x="650" y="322" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">bitta parametr -&gt; qavslar ham tashlandi</text>

  <text x="390" y="364" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Ikkalasi bir xil ishlaydi; arrow qisqaroq (lekin this boshqacha — 18-modul).</text>
</svg>
