<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>JavaScript ma'lumot turlari daraxti: primitiv va obyekt</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>

  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Ma'lumot turlari daraxti</text>

  <defs>
    <marker id="ln" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Root -->
  <rect x="300" y="52" width="160" height="46" rx="8" fill="#2563eb" stroke="#2563eb"/>
  <text x="380" y="81" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Ma'lumot turlari</text>

  <!-- Two branches -->
  <line x1="380" y1="98" x2="190" y2="138" stroke="#94a3b8" stroke-width="2" marker-end="url(#ln)"/>
  <line x1="380" y1="98" x2="570" y2="138" stroke="#94a3b8" stroke-width="2" marker-end="url(#ln)"/>

  <!-- Primitive branch header -->
  <rect x="60" y="140" width="260" height="46" rx="8" fill="#16a34a" stroke="#16a34a"/>
  <text x="190" y="162" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Primitiv (oddiy qiymat)</text>
  <text x="190" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff">qiymatning o'zi saqlanadi</text>

  <!-- Object branch header -->
  <rect x="440" y="140" width="260" height="46" rx="8" fill="#f59e0b" stroke="#f59e0b"/>
  <text x="570" y="162" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Obyekt (reference)</text>
  <text x="570" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">havola (manzil) saqlanadi</text>

  <!-- Primitive children -->
  <line x1="190" y1="186" x2="190" y2="206" stroke="#94a3b8" stroke-width="2"/>
  <line x1="120" y1="206" x2="260" y2="206" stroke="#94a3b8" stroke-width="2"/>

  <g font-family="monospace" font-size="13" fill="#1e293b">
    <line x1="100" y1="206" x2="100" y2="224" stroke="#94a3b8" stroke-width="2" marker-end="url(#ln)"/>
    <rect x="62" y="226" width="76" height="34" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="100" y="248" text-anchor="middle">String</text>

    <line x1="190" y1="206" x2="190" y2="224" stroke="#94a3b8" stroke-width="2" marker-end="url(#ln)"/>
    <rect x="152" y="226" width="76" height="34" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="190" y="248" text-anchor="middle">Number</text>

    <line x1="280" y1="206" x2="280" y2="224" stroke="#94a3b8" stroke-width="2" marker-end="url(#ln)"/>
    <rect x="242" y="226" width="76" height="34" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="280" y="248" text-anchor="middle">Boolean</text>
  </g>

  <g font-family="monospace" font-size="13" fill="#1e293b">
    <line x1="190" y1="260" x2="190" y2="280" stroke="#94a3b8" stroke-width="2"/>
    <line x1="80" y1="280" x2="300" y2="280" stroke="#94a3b8" stroke-width="2"/>

    <line x1="80" y1="280" x2="80" y2="298" stroke="#94a3b8" stroke-width="2" marker-end="url(#ln)"/>
    <rect x="44" y="300" width="86" height="34" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="87" y="322" text-anchor="middle">undefined</text>

    <line x1="160" y1="280" x2="160" y2="298" stroke="#94a3b8" stroke-width="2" marker-end="url(#ln)"/>
    <rect x="142" y="300" width="56" height="34" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="170" y="322" text-anchor="middle">null</text>

    <line x1="240" y1="280" x2="240" y2="298" stroke="#94a3b8" stroke-width="2" marker-end="url(#ln)"/>
    <rect x="210" y="300" width="64" height="34" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="242" y="322" text-anchor="middle">BigInt</text>

    <line x1="300" y1="280" x2="300" y2="298" stroke="#94a3b8" stroke-width="2" marker-end="url(#ln)"/>
    <rect x="278" y="300" width="64" height="34" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="310" y="322" text-anchor="middle">Symbol</text>
  </g>

  <!-- Object children -->
  <line x1="570" y1="186" x2="570" y2="206" stroke="#94a3b8" stroke-width="2"/>
  <line x1="490" y1="206" x2="650" y2="206" stroke="#94a3b8" stroke-width="2"/>

  <g font-family="monospace" font-size="13" fill="#1e293b">
    <line x1="490" y1="206" x2="490" y2="224" stroke="#94a3b8" stroke-width="2" marker-end="url(#ln)"/>
    <rect x="450" y="226" width="80" height="34" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="490" y="248" text-anchor="middle">Object</text>

    <line x1="570" y1="206" x2="570" y2="224" stroke="#94a3b8" stroke-width="2" marker-end="url(#ln)"/>
    <rect x="532" y="226" width="76" height="34" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="570" y="248" text-anchor="middle">Array</text>

    <line x1="650" y1="206" x2="650" y2="224" stroke="#94a3b8" stroke-width="2" marker-end="url(#ln)"/>
    <rect x="612" y="226" width="84" height="34" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="654" y="248" text-anchor="middle">Function</text>
  </g>

  <!-- Notes -->
  <rect x="60" y="360" width="640" height="86" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="80" y="386" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a" font-weight="bold">Primitiv:</text>
  <text x="156" y="386" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">7 ta tur. Qiymat nusxalanadi. typeof aniq turni aytadi.</text>
  <text x="80" y="412" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#f59e0b" font-weight="bold">Obyekt:</text>
  <text x="150" y="412" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">manzil (havola) nusxalanadi. typeof null === "object" — bu eski xato.</text>
  <text x="80" y="436" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Diqqat: null primitiv, lekin typeof uni "object" deb ko'rsatadi.</text>
</svg>
