<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540">
  <title>Bitta katta jadvalning kasalliklari: takrorlash, yangilash, bitta katakda ko'p qiymat, o'chirish va kiritish anomaliyalari</title>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="540" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Bitta katta jadvalning kasalliklari</text>

  <!-- jadval qutisi -->
  <rect x="80" y="55" width="560" height="135" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="79" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">buyurtmalar_HAMMASI</text>

  <!-- ustun sarlavhalari -->
  <text x="110" y="104" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">mijoz_ism</text>
  <text x="235" y="104" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">mijoz_tel</text>
  <text x="375" y="104" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">mahsulotlar</text>
  <text x="540" y="104" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">summa</text>
  <line x1="95" y1="112" x2="625" y2="112" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- 1-qator -->
  <text x="110" y="134" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#d97706">Davron</text>
  <text x="235" y="134" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#d97706">+998911234567</text>
  <text x="375" y="134" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">Telefon, Chexol</text>
  <text x="540" y="134" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">2 850 000</text>

  <!-- 2-qator -->
  <text x="110" y="158" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#d97706">Davron</text>
  <text x="235" y="158" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#d97706">+998911234567</text>
  <text x="375" y="158" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Noutbuk</text>
  <text x="540" y="158" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">6 500 000</text>

  <!-- jadval ichidagi izohlar -->
  <text x="180" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#d97706">takror!</text>
  <text x="440" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">bitta katakda 2 qiymat!</text>

  <!-- 1-kasallik -->
  <rect x="40" y="215" width="310" height="85" rx="10" fill="#e2e8f0" stroke="#dc2626" stroke-width="2"/>
  <text x="195" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#dc2626">1. Takrorlash</text>
  <text x="195" y="262" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Bir xil ma'lumot yuzlab nusxada —</text>
  <text x="195" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">joy isrofi va chalkashlik xavfi</text>

  <!-- 2-kasallik -->
  <rect x="370" y="215" width="310" height="85" rx="10" fill="#e2e8f0" stroke="#dc2626" stroke-width="2"/>
  <text x="525" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#dc2626">2. Yangilash anomaliyasi</text>
  <text x="525" y="262" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Telefon o'zgarsa — yuzlab joyda</text>
  <text x="525" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">yangilash kerak, bittasi qolib ketadi</text>

  <!-- 3-kasallik -->
  <rect x="40" y="315" width="310" height="85" rx="10" fill="#e2e8f0" stroke="#dc2626" stroke-width="2"/>
  <text x="195" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#dc2626">3. Bitta katakda ko'p qiymat</text>
  <text x="195" y="362" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">"Telefon, Chexol" — SQL uchun bu</text>
  <text x="195" y="380" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">ro'yxat emas, matn: qidirish/sanash azob</text>

  <!-- 4-kasallik -->
  <rect x="370" y="315" width="310" height="85" rx="10" fill="#e2e8f0" stroke="#dc2626" stroke-width="2"/>
  <text x="525" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#dc2626">4. O'chirish anomaliyasi</text>
  <text x="525" y="362" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Yagona buyurtmani o'chirsak —</text>
  <text x="525" y="380" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">mijoz haqidagi ma'lumot ham yo'qoladi</text>

  <!-- 5-kasallik -->
  <rect x="205" y="415" width="310" height="85" rx="10" fill="#e2e8f0" stroke="#dc2626" stroke-width="2"/>
  <text x="360" y="440" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#dc2626">5. Kiritish anomaliyasi</text>
  <text x="360" y="462" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Hali buyurtma qilmagan mijozni</text>
  <text x="360" y="480" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">jadvalga qo'shishning iloji yo'q</text>

  <!-- pastki xulosa -->
  <text x="360" y="528" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Davo — normalizatsiya: har fakt o'z jadvalida, bir marta</text>
</svg>
