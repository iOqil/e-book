<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>SELECT * va aniq ustunlar taqqoslash hamda AS alias misoli</title>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <!-- sarlavha -->
  <text x="360" y="38" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">SELECT * yoki aniq ustunlar?</text>

  <!-- Chap panel: SELECT * -->
  <rect x="30" y="60" width="315" height="215" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="80" y="75" width="215" height="28" rx="6" fill="#d97706"/>
  <text x="187" y="94" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">SELECT * FROM mahsulotlar;</text>
  <text x="52" y="130" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">• Hamma ustun keladi — kerak-nokerak</text>
  <text x="52" y="157" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">• Keng natija, o'qish noqulay</text>
  <text x="52" y="184" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">• Ortiqcha ma'lumot uzatiladi</text>
  <text x="52" y="211" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">• Qaysi ustun kerakligi noaniq</text>
  <text x="187" y="250" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#d97706">O'rganishda — mayli</text>

  <!-- O'ng panel: aniq ustunlar -->
  <rect x="375" y="60" width="315" height="215" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="405" y="75" width="255" height="28" rx="6" fill="#16a34a"/>
  <text x="532" y="94" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">SELECT nomi, narx FROM mahsulotlar;</text>
  <text x="397" y="130" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">• Faqat kerakli ustunlar keladi</text>
  <text x="397" y="157" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">• Natija ixcham va tushunarli</text>
  <text x="397" y="184" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">• Tezroq ishlaydi</text>
  <text x="397" y="211" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">• Kodning maqsadi ko'rinib turadi</text>
  <text x="532" y="250" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Real loyihada — shu yo'l</text>

  <!-- Alias bo'limi -->
  <rect x="30" y="300" width="660" height="105" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="327" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">AS — natijadagi ustunga vaqtincha nom (alias)</text>
  <rect x="190" y="338" width="340" height="26" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="360" y="356" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">SELECT narx AS mahsulot_narxi FROM mahsulotlar;</text>
  <text x="360" y="388" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Natijada ustun sarlavhasi: mahsulot_narxi — jadvaldagi asl nom o'zgarmaydi</text>
</svg>
