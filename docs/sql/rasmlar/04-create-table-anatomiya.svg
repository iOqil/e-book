<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <title>CREATE TABLE sintaksisining anatomiyasi: buyruq, jadval nomi, ustun nomi, ma'lumot turi, qoida</title>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="420" fill="#f8fafc"/>

  <!-- sarlavha -->
  <text x="360" y="38" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">CREATE TABLE anatomiyasi</text>

  <!-- 1-qator: CREATE TABLE talabalar ( -->
  <rect x="60" y="70" width="145" height="34" rx="8" fill="#2563eb"/>
  <text x="132" y="93" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">CREATE TABLE</text>
  <rect x="215" y="70" width="110" height="34" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="270" y="93" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">talabalar</text>
  <rect x="335" y="70" width="34" height="34" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="352" y="93" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">(</text>

  <!-- 1-qator yorliqlari -->
  <line x1="132" y1="106" x2="132" y2="122" stroke="#94a3b8" stroke-width="2"/>
  <text x="132" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">buyruq: jadval yarat</text>
  <line x1="270" y1="106" x2="270" y2="122" stroke="#94a3b8" stroke-width="2"/>
  <text x="290" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">jadval nomi (siz tanlaysiz)</text>

  <!-- 2-qator: ism VARCHAR(100) NOT NULL , -->
  <rect x="100" y="180" width="70" height="34" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="135" y="203" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">ism</text>
  <rect x="180" y="180" width="150" height="34" rx="8" fill="#16a34a"/>
  <text x="255" y="203" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">VARCHAR(100)</text>
  <rect x="340" y="180" width="115" height="34" rx="8" fill="#d97706"/>
  <text x="397" y="203" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">NOT NULL</text>
  <rect x="465" y="180" width="34" height="34" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="482" y="203" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">,</text>
  <text x="510" y="203" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">← ustunlar orasiga vergul</text>

  <!-- 2-qator yorliqlari -->
  <line x1="135" y1="214" x2="135" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <text x="135" y="246" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ustun nomi</text>
  <line x1="255" y1="214" x2="255" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <text x="255" y="246" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">ma'lumot turi (5-bob)</text>
  <line x1="397" y1="214" x2="397" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <text x="397" y="246" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#d97706">qoida / cheklov</text>

  <!-- 3-qator: ); -->
  <rect x="60" y="290" width="50" height="34" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="85" y="313" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">);</text>
  <text x="125" y="313" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">qavs yopiladi va buyruq nuqta-vergul bilan tugaydi</text>

  <!-- ogohlantirish -->
  <rect x="60" y="352" width="600" height="36" rx="10" fill="#f8fafc" stroke="#dc2626" stroke-width="2"/>
  <text x="360" y="375" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">Diqqat: OXIRGI ustundan keyin vergul qo'yilmaydi!</text>
</svg>
