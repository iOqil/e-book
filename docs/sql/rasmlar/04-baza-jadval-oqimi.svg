<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330">
  <title>Baza va jadval yaratish tartibi: CREATE DATABASE, USE, CREATE TABLE</title>
  <defs>
    <marker id="oq-strelka" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="330" fill="#f8fafc"/>

  <!-- sarlavha -->
  <text x="360" y="40" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Baza va jadval yaratishning uch qadami</text>

  <!-- 1-qadam: CREATE DATABASE -->
  <text x="120" y="105" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#2563eb">1. Baza yaratish</text>
  <rect x="20" y="120" width="200" height="120" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="120" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">CREATE DATABASE maktab;</text>
  <text x="120" y="188" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">bino quriladi</text>
  <text x="120" y="212" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(yangi, bo'sh baza)</text>

  <!-- strelka 1 -->
  <line x1="222" y1="180" x2="256" y2="180" stroke="#475569" stroke-width="2.5" marker-end="url(#oq-strelka)"/>

  <!-- 2-qadam: USE -->
  <text x="360" y="105" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#d97706">2. Bazaga kirish</text>
  <rect x="260" y="120" width="200" height="120" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">USE maktab;</text>
  <text x="360" y="188" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">binoga kiramiz</text>
  <text x="360" y="212" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(endi shu bazadamiz)</text>

  <!-- strelka 2 -->
  <line x1="462" y1="180" x2="496" y2="180" stroke="#475569" stroke-width="2.5" marker-end="url(#oq-strelka)"/>

  <!-- 3-qadam: CREATE TABLE -->
  <text x="600" y="105" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#16a34a">3. Jadval yaratish</text>
  <rect x="500" y="120" width="200" height="120" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="600" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">CREATE TABLE talabalar</text>
  <text x="600" y="168" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">( ... );</text>
  <text x="600" y="192" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">xona jihozlanadi</text>
  <text x="600" y="214" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(ustunlar belgilanadi)</text>

  <!-- pastdagi izoh -->
  <text x="360" y="285" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">Tartibni buzib bo'lmaydi: jadval yaratishdan oldin USE bilan bazaga kiring!</text>
  <text x="360" y="312" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">USE'siz CREATE TABLE yozsangiz: ERROR 1046 — No database selected</text>
</svg>
