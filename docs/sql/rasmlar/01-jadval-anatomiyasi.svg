<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <title>Jadval anatomiyasi: ustun, qator va id — kitoblar jadvali misolida</title>
  <defs>
    <marker id="ja-ok-kok" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="ja-ok-yashil" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="ja-ok-amber" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="360" fill="#f8fafc"/>

  <!-- sarlavha -->
  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Jadval anatomiyasi — kitoblar jadvali</text>

  <!-- sarlavha qatori (header) -->
  <rect x="120" y="80" width="60" height="36" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="180" y="80" width="175" height="36" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="355" y="80" width="155" height="36" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="510" y="80" width="70" height="36" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="150" y="103" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">id</text>
  <text x="268" y="103" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">nomi</text>
  <text x="433" y="103" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">muallif</text>
  <text x="545" y="103" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">yil</text>

  <!-- 1-qator -->
  <rect x="120" y="116" width="60" height="34" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="180" y="116" width="175" height="34" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="355" y="116" width="155" height="34" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="510" y="116" width="70" height="34" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="150" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">1</text>
  <text x="268" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">O'tkan kunlar</text>
  <text x="433" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">A. Qodiriy</text>
  <text x="545" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">1925</text>

  <!-- 2-qator -->
  <rect x="120" y="150" width="60" height="34" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="180" y="150" width="175" height="34" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="355" y="150" width="155" height="34" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="510" y="150" width="70" height="34" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="150" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">2</text>
  <text x="268" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Mehrobdan chayon</text>
  <text x="433" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">A. Qodiriy</text>
  <text x="545" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">1928</text>

  <!-- 3-qator -->
  <rect x="120" y="184" width="60" height="34" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="180" y="184" width="175" height="34" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="355" y="184" width="155" height="34" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="510" y="184" width="70" height="34" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="150" y="206" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">3</text>
  <text x="268" y="206" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Sariq devni minib</text>
  <text x="433" y="206" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">X. To'xtaboyev</text>
  <text x="545" y="206" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">1968</text>

  <!-- belgilash ramkalari -->
  <rect x="355" y="80" width="155" height="138" rx="6" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="120" y="150" width="460" height="34" rx="6" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <rect x="120" y="80" width="60" height="138" rx="6" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6 4"/>

  <!-- ustun yorlig'i (yuqorida, ko'k) -->
  <text x="433" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">Ustun (column) — ma'lumot turi</text>
  <line x1="433" y1="62" x2="433" y2="76" stroke="#2563eb" stroke-width="2" marker-end="url(#ja-ok-kok)"/>

  <!-- qator yorlig'i (o'ngda, yashil) -->
  <line x1="612" y1="167" x2="586" y2="167" stroke="#16a34a" stroke-width="2" marker-end="url(#ja-ok-yashil)"/>
  <text x="618" y="162" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Qator (row)</text>
  <text x="618" y="181" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">bitta yozuv</text>

  <!-- id yorlig'i (pastda, amber) -->
  <line x1="150" y1="248" x2="150" y2="224" stroke="#d97706" stroke-width="2" marker-end="url(#ja-ok-amber)"/>
  <text x="175" y="270" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#d97706">id — takrorlanmas raqam</text>
  <text x="175" y="289" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(pasport raqami kabi)</text>

  <!-- pastki izoh -->
  <text x="360" y="332" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Ustun — ma'lumot turi · Qator — bitta yozuv · id — qatorning takrorlanmas raqami</text>
</svg>
