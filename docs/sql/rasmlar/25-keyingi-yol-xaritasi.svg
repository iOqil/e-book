<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500">
  <title>Kitobdan keyingi yo'l xaritasi: masala yechish, o'z loyihangiz, dasturlash tiliga ulash, kengayish (PostgreSQL, ORM) va chuqurlashish (B-Tree, replikatsiya) — backend developer tomon</title>
  <defs>
    <marker id="yx-strelka" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="500" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Kitobdan keyin — yo'l xaritasi</text>

  <!-- Boshlanish: siz shu yerdasiz -->
  <rect x="25" y="201" width="175" height="110" rx="10" fill="#e2e8f0" stroke="#2563eb" stroke-width="2.5"/>
  <text x="112" y="235" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">SIZ SHU YERDASIZ</text>
  <text x="112" y="261" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">SQL + MySQL</text>
  <text x="112" y="285" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">25 bob · 500 masala</text>

  <!-- 1: Masala yechish -->
  <rect x="275" y="58" width="215" height="60" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="382" y="79" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">1. Masala yechish</text>
  <text x="382" y="96" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">sql-practice.com, LeetCode —</text>
  <text x="382" y="111" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">haftasiga 5 ta masala</text>

  <!-- 2: O'z loyihangiz -->
  <rect x="275" y="142" width="215" height="60" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="382" y="163" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">2. O'z loyihangiz</text>
  <text x="382" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">real muammoga baza yasang</text>
  <text x="382" y="195" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">(kutubxona? byudjet?)</text>

  <!-- 3: Dasturlash tili -->
  <rect x="275" y="226" width="215" height="60" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="382" y="247" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#d97706">3. Dasturlash tili</text>
  <text x="382" y="264" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">PHP (PDO), Python, JS (mysql2)</text>
  <text x="382" y="279" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">mini-ilova yozing</text>

  <!-- 4: Kengayish -->
  <rect x="275" y="310" width="215" height="60" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="382" y="331" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#475569">4. Kengayish</text>
  <text x="382" y="348" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">PostgreSQL — 90% tanish sintaksis</text>
  <text x="382" y="363" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">ORM (Django, Prisma, Eloquent)</text>

  <!-- 5: Chuqurlashish -->
  <rect x="275" y="394" width="215" height="60" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="382" y="415" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">5. Chuqurlashish</text>
  <text x="382" y="432" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">B-Tree, isolation levels,</text>
  <text x="382" y="447" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">replikatsiya — keyingi bosqich</text>

  <!-- Maqsad -->
  <rect x="545" y="201" width="150" height="110" rx="10" fill="#e2e8f0" stroke="#16a34a" stroke-width="2.5"/>
  <text x="620" y="239" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">MAQSAD</text>
  <text x="620" y="265" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">Backend</text>
  <text x="620" y="287" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">developer</text>

  <!-- strelkalar: boshlanishdan 5 yo'nalishga -->
  <line x1="202" y1="218" x2="271" y2="90" stroke="#475569" stroke-width="2" marker-end="url(#yx-strelka)"/>
  <line x1="202" y1="237" x2="271" y2="173" stroke="#475569" stroke-width="2" marker-end="url(#yx-strelka)"/>
  <line x1="202" y1="256" x2="271" y2="256" stroke="#475569" stroke-width="2" marker-end="url(#yx-strelka)"/>
  <line x1="202" y1="275" x2="271" y2="339" stroke="#475569" stroke-width="2" marker-end="url(#yx-strelka)"/>
  <line x1="202" y1="294" x2="271" y2="422" stroke="#475569" stroke-width="2" marker-end="url(#yx-strelka)"/>

  <!-- strelkalar: 5 yo'nalishdan maqsadga -->
  <line x1="492" y1="90" x2="541" y2="218" stroke="#475569" stroke-width="2" marker-end="url(#yx-strelka)"/>
  <line x1="492" y1="173" x2="541" y2="237" stroke="#475569" stroke-width="2" marker-end="url(#yx-strelka)"/>
  <line x1="492" y1="256" x2="541" y2="256" stroke="#475569" stroke-width="2" marker-end="url(#yx-strelka)"/>
  <line x1="492" y1="339" x2="541" y2="275" stroke="#475569" stroke-width="2" marker-end="url(#yx-strelka)"/>
  <line x1="492" y1="422" x2="541" y2="294" stroke="#475569" stroke-width="2" marker-end="url(#yx-strelka)"/>

  <!-- pastdagi izoh -->
  <text x="360" y="488" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">1–4 parallel ketishi mumkin, 5-chuqurlashish keyinroq — eng muhimi: har kuni ozgina bo'lsa ham YOZISH.</text>
</svg>
