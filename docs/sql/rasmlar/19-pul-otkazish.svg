<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>Pul o'tkazish misoli: tranzaksiyasiz yarmida uzilsa pul g'oyib bo'ladi, tranzaksiya bilan hammasi bekor qilinadi</title>
  <defs>
    <marker id="pul-strelka" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#1e293b">Pul o'tkazish: nega ikkala UPDATE birga bo'lishi shart?</text>

  <!-- Chap panel: tranzaksiyasiz -->
  <rect x="25" y="60" width="330" height="320" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="190" y="90" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">Tranzaksiyasiz — xavfli</text>

  <rect x="45" y="104" width="290" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="190" y="131" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">1) Azizdan 100 000 ayirildi</text>
  <line x1="190" y1="148" x2="190" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#pul-strelka)"/>

  <rect x="45" y="164" width="290" height="44" rx="8" fill="#f8fafc" stroke="#d97706" stroke-width="2"/>
  <text x="190" y="191" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#d97706">UZILISH — server o'chdi!</text>
  <line x1="190" y1="208" x2="190" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#pul-strelka)"/>

  <rect x="45" y="224" width="290" height="44" rx="8" fill="#f8fafc" stroke="#dc2626" stroke-width="1.5"/>
  <text x="190" y="251" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">2) Malikaga qo'shilmadi</text>

  <text x="190" y="310" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">Natija: 100 000 g'oyib bo'ldi!</text>
  <text x="190" y="335" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">baza yolg'on holatda qolib ketdi</text>

  <!-- O'ng panel: tranzaksiya bilan -->
  <rect x="365" y="60" width="330" height="320" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="530" y="90" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">Tranzaksiya bilan — ishonchli</text>

  <rect x="385" y="100" width="290" height="40" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
  <text x="530" y="125" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">START TRANSACTION</text>
  <line x1="530" y1="140" x2="530" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#pul-strelka)"/>

  <rect x="385" y="152" width="290" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="530" y="177" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">1) Azizdan 100 000 ayirildi</text>
  <line x1="530" y1="192" x2="530" y2="202" stroke="#475569" stroke-width="2" marker-end="url(#pul-strelka)"/>

  <rect x="385" y="204" width="290" height="40" rx="8" fill="#f8fafc" stroke="#d97706" stroke-width="2"/>
  <text x="530" y="229" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#d97706">UZILISH — server o'chdi!</text>
  <line x1="530" y1="244" x2="530" y2="254" stroke="#475569" stroke-width="2" marker-end="url(#pul-strelka)"/>

  <rect x="385" y="256" width="290" height="40" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5"/>
  <text x="530" y="281" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">COMMIT yo'q — hammasi bekor</text>

  <text x="530" y="330" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">Natija: pul joyida!</text>
  <text x="530" y="355" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">o'tkazmani qaytadan urinish mumkin</text>

  <!-- Pastdagi izoh -->
  <text x="360" y="416" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Tranzaksiya — bo'linmas paket: yo ikkala UPDATE birga, yo hech biri.</text>
</svg>
