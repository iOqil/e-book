<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450">
  <title>Event scheduler bazadagi budilnik: event_scheduler ON bo'lsa, belgilangan vaqtda (AT) yoki har N daqiqada (EVERY) uyg'onib SQL bajaradi; bir martalik event ON COMPLETION PRESERVE bilan saqlanadi, aks holda o'chadi</title>
  <defs>
    <marker id="ev-ok" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="450" fill="#f8fafc"/>

  <!-- sarlavha -->
  <text x="360" y="38" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Event scheduler: bazadagi budilnik</text>

  <!-- event_scheduler kalit -->
  <rect x="40" y="72" width="200" height="86" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="140" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">event_scheduler</text>
  <rect x="60" y="114" width="74" height="28" rx="14" fill="#16a34a"/>
  <text x="97" y="133" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">ON</text>
  <rect x="146" y="114" width="74" height="28" rx="14" fill="#cbd5e1"/>
  <text x="183" y="133" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#64748b">OFF</text>
  <text x="140" y="152" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#dc2626">OFF bo'lsa hech bir event ishlamaydi</text>

  <!-- budilnik (soat) -->
  <circle cx="360" cy="115" r="44" fill="#e2e8f0" stroke="#2563eb" stroke-width="3"/>
  <line x1="360" y1="115" x2="360" y2="88" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <line x1="360" y1="115" x2="382" y2="124" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <circle cx="360" cy="115" r="4" fill="#2563eb"/>
  <line x1="332" y1="72" x2="342" y2="84" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <line x1="388" y1="72" x2="378" y2="84" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <text x="360" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#2563eb">vaqt kelganda uyg'onadi</text>

  <!-- scheduler -> budilnik strelka -->
  <line x1="240" y1="115" x2="312" y2="115" stroke="#475569" stroke-width="2.5" marker-end="url(#ev-ok)"/>

  <!-- ikki reja: AT va EVERY -->
  <!-- AT (bir martalik) -->
  <rect x="40" y="220" width="310" height="120" rx="10" fill="#e2e8f0" stroke="#d97706" stroke-width="2"/>
  <text x="195" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#d97706">AT — bir martalik</text>
  <rect x="60" y="262" width="270" height="26" rx="6" fill="#d97706"/>
  <text x="195" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#f8fafc">ON SCHEDULE AT '2026-12-31 23:00:00'</text>
  <text x="195" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">aynan belgilangan paytda bir marta</text>
  <text x="195" y="326" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#1e293b">ishlab bo'lgach o'chadi (NOT PRESERVE)</text>

  <!-- EVERY (takroriy) -->
  <rect x="370" y="220" width="310" height="120" rx="10" fill="#e2e8f0" stroke="#16a34a" stroke-width="2"/>
  <text x="525" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">EVERY — takroriy</text>
  <rect x="390" y="262" width="270" height="26" rx="6" fill="#16a34a"/>
  <text x="525" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#f8fafc">ON SCHEDULE EVERY 1 DAY STARTS ...</text>
  <text x="525" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">har N vaqtda qayta-qayta ishlaydi</text>
  <text x="525" y="326" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#1e293b">o'z-o'zidan saqlanadi (tugamaydi)</text>

  <!-- budilnikdan ikki rejaga strelkalar -->
  <path d="M340,150 V190 H195 V216" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#ev-ok)"/>
  <path d="M380,150 V190 H525 V216" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#ev-ok)"/>

  <!-- PRESERVE izohi -->
  <rect x="40" y="358" width="640" height="44" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="385" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b"><tspan font-weight="bold">ON COMPLETION PRESERVE</tspan> — bir martalik eventni ishlab bo'lgach ham (o'chgan holatda) saqlab qoladi</text>

  <!-- pastki izoh -->
  <text x="360" y="430" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">"Eventim ishlamayapti" — birinchi tekshiring: event_scheduler ON mi?</text>
</svg>
