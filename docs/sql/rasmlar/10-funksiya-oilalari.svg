<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">
  <title>MySQL built-in funksiyalarning to'rt oilasi: matn, son, sana va shartli/NULL funksiyalar</title>
  <defs>
    <marker id="oila-strelka" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="400" fill="#f8fafc"/>

  <!-- sarlavha -->
  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">MySQL built-in funksiyalar oilasi</text>

  <!-- markaziy tugun -->
  <rect x="245" y="56" width="230" height="44" rx="10" fill="#2563eb"/>
  <text x="360" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">Built-in funksiyalar</text>

  <!-- strelkalar -->
  <line x1="300" y1="100" x2="100" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#oila-strelka)"/>
  <line x1="340" y1="100" x2="274" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#oila-strelka)"/>
  <line x1="380" y1="100" x2="446" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#oila-strelka)"/>
  <line x1="420" y1="100" x2="620" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#oila-strelka)"/>

  <!-- MATN qutisi -->
  <rect x="12" y="140" width="165" height="185" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="94" y="166" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">MATN</text>
  <text x="94" y="192" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">UPPER / LOWER</text>
  <text x="94" y="213" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">CONCAT, CONCAT_WS</text>
  <text x="94" y="234" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">SUBSTRING, REPLACE</text>
  <text x="94" y="255" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">TRIM</text>
  <text x="94" y="276" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">LEFT / RIGHT</text>
  <text x="94" y="308" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">matn bilan ishlash</text>

  <!-- SON qutisi -->
  <rect x="189" y="140" width="165" height="185" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="271" y="166" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">SON</text>
  <text x="271" y="192" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">ROUND, TRUNCATE</text>
  <text x="271" y="213" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">CEIL / FLOOR</text>
  <text x="271" y="234" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">ABS, MOD</text>
  <text x="271" y="255" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">POW, RAND</text>
  <text x="271" y="308" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">yaxlitlash, hisob</text>

  <!-- SANA qutisi -->
  <rect x="366" y="140" width="165" height="185" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="448" y="166" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#d97706">SANA</text>
  <text x="448" y="192" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">NOW, CURDATE</text>
  <text x="448" y="213" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">YEAR, MONTH, DAY</text>
  <text x="448" y="234" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">DATEDIFF, DATE_ADD</text>
  <text x="448" y="255" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">DATE_FORMAT</text>
  <text x="448" y="276" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">TIMESTAMPDIFF</text>
  <text x="448" y="308" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">sana va vaqt</text>

  <!-- SHARTLI qutisi -->
  <rect x="543" y="140" width="165" height="185" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="625" y="166" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#475569">SHARTLI va NULL</text>
  <text x="625" y="192" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">IF</text>
  <text x="625" y="213" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">CASE ... WHEN</text>
  <text x="625" y="234" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">IFNULL</text>
  <text x="625" y="255" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">COALESCE</text>
  <text x="625" y="308" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">shartga qarab qiymat</text>

  <!-- pastki izoh -->
  <text x="360" y="368" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Hammasi SELECT ichida ishlaydi — jadvaldagi asl ma'lumot o'zgarmaydi</text>
</svg>
