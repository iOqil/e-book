<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" width="720" height="390">
  <title>Uchta alohida INSERT bilan bitta ko'p qatorli INSERT taqqoslanmoqda: bitta INSERT tezroq</title>
  <defs>
    <marker id="kq-strelka" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="390" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">3 ta alohida INSERT yoki bitta INSERT?</text>

  <!-- CHAP panel: 3 ta alohida INSERT -->
  <rect x="30" y="56" width="320" height="260" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="190" y="82" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#d97706">3 ta alohida INSERT</text>

  <rect x="46" y="96" width="192" height="28" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="56" y="115" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1e293b">INSERT INTO azolar ...;</text>
  <rect x="46" y="134" width="192" height="28" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="56" y="153" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1e293b">INSERT INTO azolar ...;</text>
  <rect x="46" y="172" width="192" height="28" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="56" y="191" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1e293b">INSERT INTO azolar ...;</text>

  <rect x="256" y="118" width="80" height="66" rx="8" fill="#475569"/>
  <text x="296" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">MySQL</text>
  <text x="296" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#f8fafc">server</text>

  <line x1="240" y1="110" x2="252" y2="136" stroke="#475569" stroke-width="2" marker-end="url(#kq-strelka)"/>
  <line x1="240" y1="148" x2="252" y2="151" stroke="#475569" stroke-width="2" marker-end="url(#kq-strelka)"/>
  <line x1="240" y1="186" x2="252" y2="166" stroke="#475569" stroke-width="2" marker-end="url(#kq-strelka)"/>

  <text x="190" y="234" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">har so'rov — alohida xarajat</text>
  <text x="190" y="264" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#d97706">Sekinroq</text>

  <!-- O'NG panel: bitta ko'p qatorli INSERT -->
  <rect x="370" y="56" width="320" height="260" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="530" y="82" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">Bitta INSERT — 3 qator</text>

  <rect x="386" y="96" width="196" height="110" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="396" y="114" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1e293b">INSERT INTO azolar (...)</text>
  <text x="396" y="132" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#2563eb">VALUES</text>
  <text x="396" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1e293b">('Aziz', ...),</text>
  <text x="396" y="168" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1e293b">('Vali', ...),</text>
  <text x="396" y="186" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1e293b">('Soli', ...);</text>

  <rect x="596" y="118" width="80" height="66" rx="8" fill="#475569"/>
  <text x="636" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">MySQL</text>
  <text x="636" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#f8fafc">server</text>

  <line x1="584" y1="151" x2="592" y2="151" stroke="#475569" stroke-width="2.5" marker-end="url(#kq-strelka)"/>

  <text x="530" y="234" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">bitta so'rov — bitta xarajat</text>
  <text x="530" y="264" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">Tezroq va qulayroq</text>

  <!-- pastki izoh -->
  <text x="360" y="346" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Maslahat: bir nechta qator kiritganda bitta INSERT ishlating.</text>
  <text x="360" y="370" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Qavs guruhlari orasida vergul, eng oxirida nuqta-vergul (;).</text>
</svg>
