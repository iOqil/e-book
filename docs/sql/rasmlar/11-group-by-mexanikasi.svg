<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>GROUP BY mexanikasi: 10 qator janr bo'yicha 4 to'pga bo'linadi, har to'pdan bitta natija qatori chiqadi</title>
  <defs>
    <marker id="grp-strelka" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
