  <text x="522" y="293" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">ertak</text>
  <text x="676" y="293" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">1</text>

  <!-- pastki izoh -->
  <text x="360" y="380" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">SELECT janr, COUNT(*) AS soni FROM kitoblar GROUP BY janr;</text>
  <text x="360" y="406" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Nechta to'p bo'lsa — natijada shuncha qator.</text>
