  <text x="469" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">har to'pga COUNT(*)</text>
  <line x1="434" y1="112" x2="504" y2="112" stroke="#475569" stroke-width="1.5" marker-end="url(#grp-strelka)"/>
  <line x1="434" y1="176" x2="504" y2="176" stroke="#475569" stroke-width="1.5" marker-end="url(#grp-strelka)"/>
  <line x1="434" y1="234" x2="504" y2="234" stroke="#475569" stroke-width="1.5" marker-end="url(#grp-strelka)"/>
  <line x1="434" y1="288" x2="504" y2="288" stroke="#475569" stroke-width="1.5" marker-end="url(#grp-strelka)"/>

  <!-- o'ng: natija qatorlari -->
  <rect x="510" y="99" width="180" height="26" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="522" y="117" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">roman</text>
  <text x="676" y="117" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">4</text>
