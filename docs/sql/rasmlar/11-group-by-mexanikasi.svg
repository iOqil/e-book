  <text x="522" y="181" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">sarguzasht</text>
  <text x="676" y="181" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">3</text>
