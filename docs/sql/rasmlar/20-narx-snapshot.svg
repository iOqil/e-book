<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <title>Narx snapshot'i: mahsulot narxi o'zgaradi, buyurtmadagi narx tarixiy fakt bo'lib qoladi</title>
  <defs>
    <marker id="sn-strelka" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="360" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Qachon ataylab takrorlaymiz: narx snapshot'i</text>

  <!-- chap quti: mahsulotlar -->
  <text x="175" y="72" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">mahsulotlar — joriy holat</text>
  <rect x="50" y="82" width="250" height="130" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="175" y="110" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">Noutbuk</text>
  <text x="175" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#94a3b8" text-decoration="line-through">eski narx: 6 500 000</text>
  <text x="175" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#d97706">yangi narx: 6 900 000</text>
  <text x="175" y="192" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">narx "yashaydi" — o'zgarib turadi</text>

  <!-- o'ng quti: buyurtma_qatorlari -->
  <text x="545" y="72" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">buyurtma_qatorlari — tarix</text>
  <rect x="420" y="82" width="250" height="130" rx="10" fill="#e2e8f0" stroke="#16a34a" stroke-width="2"/>
  <text x="545" y="110" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">Buyurtma #17 — 5-iyun</text>
  <text x="545" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">narx: 6 500 000</text>
  <text x="545" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">o'sha kungi narx — o'zgarmaydi</text>
  <text x="545" y="192" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">tarixiy fakt (snapshot)</text>

  <!-- o'rta strelka -->
  <rect x="297" y="108" width="126" height="24" rx="6" fill="#2563eb"/>
  <text x="360" y="125" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#f8fafc">nusxalanadi</text>
  <line x1="302" y1="147" x2="416" y2="147" stroke="#475569" stroke-width="2.5" marker-end="url(#sn-strelka)"/>
  <text x="360" y="168" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">buyurtma paytida</text>

  <!-- pastki qoida -->
  <rect x="50" y="250" width="620" height="78" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="282" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Joriy qiymat kerakmi? — saqlamang, JOIN bilan mahsulotlar'dan oling</text>
  <text x="360" y="308" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">O'sha paytdagi qiymat kerakmi? — nusxalang: bu snapshot, tarixiy fakt</text>
</svg>
