  <!-- pastki izoh -->
  <text x="360" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">COUNT(ustun) — faqat NULL bo'lmagan qiymatlarni sanaydi.</text>
  <text x="360" y="342" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">SUM va AVG ham NULL'ni e'tiborsiz qoldiradi.</text>
