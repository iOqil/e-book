<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">
  <title>Normalizatsiyadan keyin: bitta katta jadval o'rniga beshta bog'langan jadval</title>
  <defs>
    <marker id="nk-strelka" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="400" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Normalizatsiyadan keyin: 5 ta bog'langan jadval</text>

  <!-- chap: bitta katta jadval -->
  <rect x="30" y="70" width="215" height="250" rx="10" fill="#e2e8f0" stroke="#dc2626" stroke-width="2"/>
  <text x="137" y="96" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">buyurtmalar_HAMMASI</text>
  <text x="50" y="122" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">mijoz_ism</text>
  <text x="50" y="144" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">mijoz_tel</text>
  <text x="50" y="166" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">mahsulot_nomi</text>
  <text x="50" y="188" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">mahsulot_narxi</text>
  <text x="50" y="210" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">kategoriya</text>
  <text x="50" y="232" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">soni, summa, sana</text>
  <text x="50" y="254" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">...</text>
  <text x="137" y="295" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#dc2626">takror + anomaliyalar!</text>

  <!-- o'rta strelka -->
  <text x="300" y="133" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#475569">normalizatsiya</text>
  <line x1="255" y1="140" x2="320" y2="140" stroke="#475569" stroke-width="2.5" marker-end="url(#nk-strelka)"/>

  <!-- o'ng: 5 jadval -->
  <rect x="330" y="80" width="160" height="36" rx="10" fill="#e2e8f0" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">kategoriyalar</text>

  <rect x="530" y="80" width="160" height="36" rx="10" fill="#e2e8f0" stroke="#16a34a" stroke-width="2"/>
  <text x="610" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">mijozlar</text>

  <rect x="330" y="170" width="160" height="36" rx="10" fill="#e2e8f0" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="194" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">mahsulotlar</text>

  <rect x="530" y="170" width="160" height="36" rx="10" fill="#e2e8f0" stroke="#16a34a" stroke-width="2"/>
  <text x="610" y="194" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">buyurtmalar</text>

  <rect x="430" y="265" width="180" height="36" rx="10" fill="#e2e8f0" stroke="#16a34a" stroke-width="2"/>
  <text x="520" y="289" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">buyurtma_qatorlari</text>

  <!-- FK strelkalari -->
  <line x1="410" y1="170" x2="410" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#nk-strelka)"/>
  <text x="418" y="148" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">kategoriya_id</text>

  <line x1="610" y1="170" x2="610" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#nk-strelka)"/>
  <text x="618" y="148" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">mijoz_id</text>

  <line x1="490" y1="265" x2="425" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#nk-strelka)"/>
  <text x="455" y="245" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">mahsulot_id</text>

  <line x1="560" y1="265" x2="605" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#nk-strelka)"/>
  <text x="585" y="245" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">buyurtma_id</text>

  <!-- pastki izohlar -->
  <text x="360" y="352" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Har fakt bitta joyda — jadvallar id (FOREIGN KEY) orqali bog'lanadi</text>
  <text x="360" y="376" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Bu — siz 3-bobdan beri ishlatayotgan dokon bazasi!</text>
</svg>
