<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">
  <title>JOIN gorizontal birlashtiradi (ustun qo'shadi), UNION vertikal birlashtiradi (qator qo'shadi)</title>
  <defs>
    <marker id="strelka13j" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="400" fill="#f8fafc"/>

  <!-- sarlavha -->
  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">JOIN ustun qo'shadi, UNION qator qo'shadi</text>

  <!-- o'rta ajratuvchi -->
  <line x1="360" y1="52" x2="360" y2="385" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- ===== CHAP: JOIN ===== -->
  <text x="180" y="70" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">JOIN — yonma-yon (gorizontal)</text>

  <rect x="75" y="90" width="90" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="127" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">A jadval</text>

  <text x="180" y="129" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#475569">+</text>

  <rect x="195" y="90" width="90" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="240" y="127" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">B jadval</text>

  <line x1="180" y1="162" x2="180" y2="204" stroke="#475569" stroke-width="2.5" marker-end="url(#strelka13j)"/>
  <text x="192" y="188" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ON sharti kerak</text>

  <rect x="70" y="212" width="110" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="125" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">A ustunlari</text>
  <rect x="180" y="212" width="110" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="235" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">B ustunlari</text>

  <text x="180" y="308" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#475569">Natija KENGAYADI</text>
  <text x="180" y="332" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Misol: kitob nomi + muallif ismi</text>

  <!-- ===== O'NG: UNION ===== -->
  <text x="540" y="70" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">UNION — tagma-tag (vertikal)</text>

  <rect x="470" y="90" width="140" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="540" y="117" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">A qatorlari</text>

  <text x="540" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#475569">+</text>

  <rect x="470" y="166" width="140" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="540" y="193" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">B qatorlari</text>

  <line x1="540" y1="214" x2="540" y2="240" stroke="#475569" stroke-width="2.5" marker-end="url(#strelka13j)"/>
  <text x="552" y="232" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ustun soni mos bo'lsin</text>

  <rect x="470" y="248" width="140" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="540" y="273" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">A qatorlari</text>
  <rect x="470" y="288" width="140" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="540" y="313" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">B qatorlari</text>

  <text x="540" y="356" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#475569">Natija UZAYADI</text>
  <text x="540" y="380" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Misol: bemorlar + shifokorlar ro'yxati</text>
</svg>
