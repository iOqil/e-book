<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <title>SELECT oqimi: jadvaldan kerakli ustunlar tanlanib, natija to'plami hosil bo'ladi</title>
  <defs>
    <marker id="strelka07" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="360" fill="#f8fafc"/>

  <!-- sarlavha -->
  <text x="360" y="40" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">SELECT qanday ishlaydi</text>

  <!-- Chap: jadval -->
  <text x="155" y="105" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#2563eb">Jadval: kitoblar</text>
  <rect x="30" y="120" width="250" height="136" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <!-- tanlangan ustunlar (nomi, yil) -->
  <rect x="66" y="120" width="108" height="136" fill="#dbeafe"/>
  <rect x="174" y="120" width="46" height="136" fill="#dbeafe"/>
  <!-- jadval chiziqlari -->
  <line x1="66" y1="120" x2="66" y2="256" stroke="#94a3b8" stroke-width="1"/>
  <line x1="174" y1="120" x2="174" y2="256" stroke="#94a3b8" stroke-width="1"/>
  <line x1="220" y1="120" x2="220" y2="256" stroke="#94a3b8" stroke-width="1"/>
  <line x1="30" y1="154" x2="280" y2="154" stroke="#94a3b8" stroke-width="1"/>
  <line x1="30" y1="188" x2="280" y2="188" stroke="#94a3b8" stroke-width="1"/>
  <line x1="30" y1="222" x2="280" y2="222" stroke="#94a3b8" stroke-width="1"/>
  <!-- sarlavha qatori -->
  <text x="48" y="142" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">id</text>
  <text x="120" y="142" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">nomi</text>
  <text x="197" y="142" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">yil</text>
  <text x="250" y="142" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">sahifa</text>
  <!-- qatorlar -->
  <text x="48" y="176" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">1</text>
  <text x="120" y="176" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Otkan kunlar</text>
  <text x="197" y="176" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">1925</text>
  <text x="250" y="176" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">432</text>
  <text x="48" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">5</text>
  <text x="120" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Ozbegim</text>
  <text x="197" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">1981</text>
  <text x="250" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">120</text>
  <text x="48" y="244" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">8</text>
  <text x="120" y="244" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Oq soyloq</text>
  <text x="197" y="244" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">1906</text>
  <text x="250" y="244" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">320</text>

  <!-- so'rov pilli -->
  <rect x="290" y="128" width="180" height="46" rx="8" fill="#2563eb"/>
  <text x="380" y="147" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#f8fafc">SELECT nomi, yil</text>
  <text x="380" y="166" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#f8fafc">FROM kitoblar;</text>

  <!-- strelka -->
  <line x1="285" y1="205" x2="472" y2="205" stroke="#475569" stroke-width="2.5" marker-end="url(#strelka07)"/>
  <text x="380" y="228" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">faqat tanlangan ustunlar o'tadi</text>

  <!-- O'ng: natija to'plami -->
  <text x="570" y="105" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#16a34a">Natija to'plami</text>
  <rect x="480" y="120" width="180" height="136" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <line x1="600" y1="120" x2="600" y2="256" stroke="#94a3b8" stroke-width="1"/>
  <line x1="480" y1="154" x2="660" y2="154" stroke="#94a3b8" stroke-width="1"/>
  <line x1="480" y1="188" x2="660" y2="188" stroke="#94a3b8" stroke-width="1"/>
  <line x1="480" y1="222" x2="660" y2="222" stroke="#94a3b8" stroke-width="1"/>
  <text x="540" y="142" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">nomi</text>
  <text x="630" y="142" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">yil</text>
  <text x="540" y="176" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Otkan kunlar</text>
  <text x="630" y="176" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">1925</text>
  <text x="540" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Ozbegim</text>
  <text x="630" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">1981</text>
  <text x="540" y="244" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Oq soyloq</text>
  <text x="630" y="244" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">1906</text>

  <!-- pastki izoh va legenda -->
  <text x="360" y="300" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">SELECT jadvalni o'zgartirmaydi — faqat o'qiydi va natijani ko'rsatadi</text>
  <rect x="170" y="316" width="16" height="12" fill="#dbeafe" stroke="#94a3b8" stroke-width="1"/>
  <text x="192" y="326" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tanlangan ustunlar</text>
  <rect x="390" y="316" width="16" height="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="412" y="326" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">natija to'plami</text>
</svg>
