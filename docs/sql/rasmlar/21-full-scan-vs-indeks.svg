<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">
  <title>Full scan million qatorni tekshiradi, indeksli qidiruv bir necha sakrash bilan topadi</title>
  <defs>
    <marker id="fs-qizil" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="fs-yashil" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="400" fill="#f8fafc"/>

  <text x="360" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">1 000 000 qator: full scan va indeksli qidiruv</text>

  <!-- Chap panel: full scan -->
  <text x="190" y="78" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">Full scan (indekssiz)</text>
  <rect x="40" y="90" width="300" height="240" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>

  <rect x="85" y="106" width="210" height="26" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="190" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#1e293b">id=1 · User1</text>
  <rect x="85" y="138" width="210" height="26" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="190" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#1e293b">id=2 · User2</text>
  <rect x="85" y="170" width="210" height="26" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="190" y="188" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#1e293b">id=3 · User3</text>
  <rect x="85" y="202" width="210" height="26" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="190" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">... (hammasi tekshiriladi)</text>
  <rect x="85" y="234" width="210" height="26" rx="5" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="252" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#2563eb">id=777777 · User777777</text>
  <rect x="85" y="266" width="210" height="26" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="190" y="284" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#1e293b">id=1000000 · User1000000</text>

  <!-- har qatorga qizil strelka -->
  <line x1="56" y1="119" x2="78" y2="119" stroke="#dc2626" stroke-width="2" marker-end="url(#fs-qizil)"/>
  <line x1="56" y1="151" x2="78" y2="151" stroke="#dc2626" stroke-width="2" marker-end="url(#fs-qizil)"/>
  <line x1="56" y1="183" x2="78" y2="183" stroke="#dc2626" stroke-width="2" marker-end="url(#fs-qizil)"/>
  <line x1="56" y1="215" x2="78" y2="215" stroke="#dc2626" stroke-width="2" marker-end="url(#fs-qizil)"/>
  <line x1="56" y1="247" x2="78" y2="247" stroke="#dc2626" stroke-width="2" marker-end="url(#fs-qizil)"/>
  <line x1="56" y1="279" x2="78" y2="279" stroke="#dc2626" stroke-width="2" marker-end="url(#fs-qizil)"/>

  <text x="190" y="316" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#dc2626">1 000 000 qator o'qildi — ~0.4 s</text>

  <!-- O'ng panel: indeks orqali -->
  <text x="530" y="78" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">Indeks orqali (idx_ism)</text>
  <rect x="380" y="90" width="300" height="240" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>

  <rect x="400" y="106" width="140" height="150" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="470" y="126" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#475569">Indeks (saralangan)</text>
  <text x="410" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#1e293b">User1 → qator</text>
  <text x="410" y="172" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#1e293b">User10 → qator</text>
  <text x="410" y="194" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">...</text>
  <text x="410" y="216" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#2563eb">User777777</text>
  <text x="410" y="238" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">...</text>

  <line x1="544" y1="211" x2="572" y2="209" stroke="#16a34a" stroke-width="2.5" marker-end="url(#fs-yashil)"/>
  <rect x="578" y="190" width="92" height="36" rx="6" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/>
  <text x="624" y="213" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#1e293b">id=777777</text>
  <text x="624" y="246" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">1 qator o'qildi</text>

  <text x="530" y="316" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#16a34a">bir necha sakrash — ~0.001 s</text>

  <!-- pastki izoh -->
  <text x="360" y="372" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Farq — yuzlab baravar. Buni hozir o'zingiz o'lchab ko'rasiz!</text>
</svg>
