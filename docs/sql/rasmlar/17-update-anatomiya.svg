<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <title>UPDATE anatomiyasi: WHERE bilan faqat kerakli qator, WHERE'siz hamma qator o'zgaradi</title>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="420" fill="#f8fafc"/>

  <!-- sarlavha -->
  <text x="360" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">UPDATE anatomiyasi: WHERE — xavfsizlik kamaringiz</text>

  <!-- buyruq bo'laklari -->
  <rect x="60" y="62" width="180" height="34" rx="8" fill="#2563eb"/>
  <text x="150" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">UPDATE mahsulotlar</text>

  <rect x="250" y="62" width="190" height="34" rx="8" fill="#d97706"/>
  <text x="345" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">SET narx = 2600000</text>

  <rect x="450" y="62" width="150" height="34" rx="8" fill="#16a34a"/>
  <text x="525" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">WHERE id = 3</text>

  <text x="150" y="118" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">qaysi jadvalda</text>
  <text x="345" y="118" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">nima qanday o'zgaradi</text>
  <text x="525" y="118" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">qaysi qatorlarda</text>

  <!-- chap panel: WHERE bilan -->
  <rect x="40" y="146" width="310" height="216" rx="10" fill="#e2e8f0" stroke="#16a34a" stroke-width="2"/>
