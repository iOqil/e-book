  <rect x="65" y="188" width="260" height="26" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="75" y="205" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">id=1 · Samsung · o'zgarmadi</text>
  <rect x="65" y="220" width="260" height="26" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="75" y="237" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">id=2 · iPhone · o'zgarmadi</text>
  <rect x="65" y="252" width="260" height="26" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <text x="75" y="269" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">id=3 · Redmi · narx: 2 600 000 ✓</text>
  <rect x="65" y="284" width="260" height="26" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="75" y="301" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">id=4 · Lenovo · o'zgarmadi</text>

  <text x="195" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Faqat kerakli qator o'zgardi</text>

  <!-- o'ng panel: WHERE'siz -->
  <rect x="370" y="146" width="310" height="216" rx="10" fill="#e2e8f0" stroke="#dc2626" stroke-width="2"/>
  <text x="525" y="174" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">WHERE'siz (unutdingiz!)</text>

  <rect x="395" y="188" width="260" height="26" rx="5" fill="#fee2e2" stroke="#dc2626"/>
  <text x="405" y="205" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">id=1 · Samsung · narx: 0 ✗</text>
  <rect x="395" y="220" width="260" height="26" rx="5" fill="#fee2e2" stroke="#dc2626"/>
  <text x="405" y="237" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">id=2 · iPhone · narx: 0 ✗</text>
  <rect x="395" y="252" width="260" height="26" rx="5" fill="#fee2e2" stroke="#dc2626"/>
  <text x="405" y="269" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">id=3 · Redmi · narx: 0 ✗</text>
  <rect x="395" y="284" width="260" height="26" rx="5" fill="#fee2e2" stroke="#dc2626"/>
  <text x="405" y="301" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">id=4 · Lenovo · narx: 0 ✗</text>

  <text x="525" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">HAMMA qator o'zgarib ketdi!</text>

  <!-- pastki izoh -->
  <text x="360" y="398" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">Qoida: UPDATE/DELETE yozdingizmi — avval WHERE bormi, to'g'rimi deb tekshiring!</text>
