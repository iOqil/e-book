<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">
  <title>Stored procedure oqimi: CALL chaqiruvi parametrlar bilan keladi, tana bajariladi va natija qaytadi</title>
  <defs>
    <marker id="strelka-p" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="400" fill="#f8fafc"/>

  <text x="360" y="40" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Stored procedure: CALL'dan natijagacha</text>

  <!-- 1. Chaqiruv -->
  <text x="125" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">1. Chaqiruv</text>
  <rect x="25" y="110" width="200" height="100" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="125" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">CALL kitob_berish(3, 5);</text>
  <text x="125" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">klientdan yoki dasturdan</text>

  <!-- 2. Parametrlar -->
  <text x="360" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#d97706">2. Parametrlar</text>
  <rect x="270" y="110" width="180" height="100" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="145" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">p_kitob_id = 3</text>
  <text x="360" y="170" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">p_azo_id = 5</text>
  <text x="360" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">IN / OUT / INOUT</text>

  <!-- 3. Tana -->
  <text x="595" y="85" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">3. Tana (BEGIN..END)</text>
  <rect x="495" y="95" width="200" height="130" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="595" y="125" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">START TRANSACTION</text>
  <text x="595" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">INSERT INTO ijaralar</text>
  <text x="595" y="175" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">UPDATE kitoblar</text>
  <text x="595" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">COMMIT</text>

  <!-- strelkalar -->
  <line x1="225" y1="160" x2="266" y2="160" stroke="#475569" stroke-width="2.5" marker-end="url(#strelka-p)"/>
  <line x1="450" y1="160" x2="491" y2="160" stroke="#475569" stroke-width="2.5" marker-end="url(#strelka-p)"/>

  <!-- natijaga strelka -->
  <line x1="595" y1="225" x2="595" y2="262" stroke="#475569" stroke-width="2.5" marker-end="url(#strelka-p)"/>

  <!-- natija qutisi -->
  <rect x="445" y="268" width="250" height="56" rx="8" fill="#16a34a"/>
  <text x="570" y="291" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Natija: yangi ijara qo'shildi,</text>
  <text x="570" y="312" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">nusxa_soni kamaydi</text>

  <!-- chap izoh -->
  <text x="200" y="285" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Procedure bazaning o'zida saqlanadi —</text>
  <text x="200" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">istalgan klient CALL qila oladi</text>

  <!-- Pastdagi izoh -->
  <text x="360" y="370" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Bitta CALL = bir nechta SQL buyruq + tranzaksiya bitta joyda</text>
</svg>
