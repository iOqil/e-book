<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>Kompozit indeks (shahar, yosh) va chap prefiks qoidasi: qaysi WHERE shartlari indeksdan foydalanadi</title>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>

  <text x="360" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Kompozit indeks (shahar, yosh): chap prefiks qoidasi</text>

  <!-- Chap: saralangan indeks daftari -->
  <text x="160" y="74" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#475569">Indeks (saralangan)</text>
  <rect x="40" y="84" width="240" height="232" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="70" y="110" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e293b">shahar</text>
  <text x="218" y="110" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e293b">yosh</text>
  <line x1="52" y1="120" x2="268" y2="120" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="70" y="144" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">Andijon</text>
  <text x="218" y="144" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">19</text>
  <text x="70" y="170" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">Andijon</text>
  <text x="218" y="170" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">25</text>
  <text x="70" y="196" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">Buxoro</text>
  <text x="218" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">22</text>
  <text x="70" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">Buxoro</text>
  <text x="218" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">31</text>
  <text x="70" y="248" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#2563eb">Toshkent</text>
  <text x="218" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#2563eb">25</text>
  <text x="70" y="274" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#2563eb">Toshkent</text>
  <text x="218" y="274" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#2563eb">25</text>
  <text x="70" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">Toshkent</text>
  <text x="218" y="300" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">40</text>
  <text x="160" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">avval shahar bo'yicha,</text>
  <text x="160" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">ichida yosh bo'yicha saralangan</text>

  <!-- O'ng: uchta WHERE varianti -->
  <rect x="320" y="84" width="370" height="62" rx="10" fill="#e2e8f0" stroke="#16a34a" stroke-width="2"/>
  <text x="336" y="110" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">WHERE shahar = 'Toshkent'</text>
  <text x="336" y="132" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#16a34a">✓ ishlaydi — chap ustun bor</text>

  <rect x="320" y="158" width="370" height="62" rx="10" fill="#e2e8f0" stroke="#16a34a" stroke-width="2"/>
  <text x="336" y="184" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">WHERE shahar = 'Toshkent' AND yosh = 25</text>
  <text x="336" y="206" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#16a34a">✓ eng zo'r — ikkala ustun ham indeksdan</text>

  <rect x="320" y="232" width="370" height="62" rx="10" fill="#e2e8f0" stroke="#dc2626" stroke-width="2"/>
  <text x="336" y="258" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">WHERE yosh = 25</text>
  <text x="336" y="280" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#dc2626">✗ ishlamaydi — chap qism (shahar) yo'q</text>

  <!-- pastki izoh -->
  <text x="360" y="382" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">Telefon kitobchasi ham shunday: familiya+ism bo'yicha saralangan —</text>
  <text x="360" y="402" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">faqat ismni bilib qidirsangiz, hammasini varaqlashga to'g'ri keladi.</text>
  <text x="360" y="428" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">(shahar, yosh) va (yosh, shahar) — ikki xil indeks: tartib muhim!</text>
</svg>
