<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330">
  <title>JOIN zanjiri: ijaralar ko'prik jadval — azo_id orqali azolar, kitob_id orqali kitoblar ulanadi, mualliflar esa kitoblar jadvalidagi muallif_id orqali ulanadi</title>
  <defs>
    <marker id="jz-strelka" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="330" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">3-4 jadval zanjiri: ijaralar — ko'prik jadval</text>

  <!-- ON yorliqlari -->
  <text x="160" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">azo_id = id</text>
  <text x="370" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">kitob_id = id</text>
  <text x="570" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">muallif_id = id</text>

  <!-- azolar -->
  <rect x="15" y="100" width="120" height="130" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="75" y="126" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">azolar</text>
  <text x="75" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">id (PK)</text>
  <text x="75" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">ism</text>
  <text x="75" y="204" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">telefon</text>

  <!-- ijaralar (ko'prik) -->
  <rect x="185" y="100" width="160" height="130" rx="10" fill="#e2e8f0" stroke="#d97706" stroke-width="2.5"/>
  <text x="265" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#d97706">ijaralar</text>
  <text x="265" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">id (PK)</text>
  <text x="265" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">azo_id (FK)</text>
  <text x="265" y="194" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">kitob_id (FK)</text>
  <text x="265" y="216" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">olingan_sana</text>

  <!-- kitoblar -->
  <rect x="395" y="100" width="150" height="130" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="470" y="126" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">kitoblar</text>
  <text x="470" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">id (PK)</text>
  <text x="470" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">nomi</text>
  <text x="470" y="204" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">muallif_id (FK)</text>

  <!-- mualliflar -->
  <rect x="595" y="100" width="110" height="130" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="650" y="126" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">mualliflar</text>
  <text x="650" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">id (PK)</text>
  <text x="650" y="184" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">ism</text>

  <!-- strelkalar: FK -> PK -->
  <line x1="185" y1="165" x2="142" y2="165" stroke="#475569" stroke-width="2.5" marker-end="url(#jz-strelka)"/>
  <line x1="345" y1="165" x2="388" y2="165" stroke="#475569" stroke-width="2.5" marker-end="url(#jz-strelka)"/>
  <line x1="545" y1="165" x2="588" y2="165" stroke="#475569" stroke-width="2.5" marker-end="url(#jz-strelka)"/>

  <!-- pastki izoh -->
  <text x="360" y="272" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">FROM ijaralar'dan boshlaymiz — ikkala FK shu yerda turibdi</text>
  <text x="360" y="298" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Keyin har bir FK orqali kerakli jadvalni JOIN bilan ulayveramiz</text>
</svg>
