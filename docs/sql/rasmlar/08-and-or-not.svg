<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" width="720" height="390">
  <title>AND, OR, NOT mantiq jadvali: AND ikkalasi rost bo'lsa, OR kamida bittasi rost bo'lsa, NOT teskarisiga aylantiradi</title>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="390" fill="#f8fafc"/>

  <!-- sarlavha -->
  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">AND, OR, NOT — mantiq jadvali</text>

  <!-- jadval nomlari -->
  <text x="142" y="68" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">AND</text>
  <text x="372" y="68" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">OR</text>
  <text x="587" y="68" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#d97706">NOT</text>

  <!-- AND jadvali -->
  <rect x="40" y="78" width="205" height="32" fill="#2563eb"/>
  <rect x="40" y="110" width="205" height="128" fill="#e2e8f0"/>
  <line x1="95" y1="78" x2="95" y2="238" stroke="#94a3b8" stroke-width="1"/>
  <line x1="150" y1="78" x2="150" y2="238" stroke="#94a3b8" stroke-width="1"/>
  <line x1="40" y1="142" x2="245" y2="142" stroke="#94a3b8" stroke-width="1"/>
  <line x1="40" y1="174" x2="245" y2="174" stroke="#94a3b8" stroke-width="1"/>
  <line x1="40" y1="206" x2="245" y2="206" stroke="#94a3b8" stroke-width="1"/>
  <rect x="40" y="78" width="205" height="160" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text x="67" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">A</text>
  <text x="122" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">B</text>
  <text x="197" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">A AND B</text>
  <text x="67" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#16a34a">✓</text>
  <text x="122" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#16a34a">✓</text>
  <text x="197" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">✓</text>
  <text x="67" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#16a34a">✓</text>
  <text x="122" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#dc2626">✗</text>
  <text x="197" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">✗</text>
  <text x="67" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#dc2626">✗</text>
  <text x="122" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#16a34a">✓</text>
  <text x="197" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">✗</text>
  <text x="67" y="228" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#dc2626">✗</text>
  <text x="122" y="228" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#dc2626">✗</text>
  <text x="197" y="228" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">✗</text>
  <text x="142" y="262" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ikkalasi ham rost bo'lsa</text>

  <!-- OR jadvali -->
  <rect x="270" y="78" width="205" height="32" fill="#16a34a"/>
  <rect x="270" y="110" width="205" height="128" fill="#e2e8f0"/>
  <line x1="325" y1="78" x2="325" y2="238" stroke="#94a3b8" stroke-width="1"/>
  <line x1="380" y1="78" x2="380" y2="238" stroke="#94a3b8" stroke-width="1"/>
  <line x1="270" y1="142" x2="475" y2="142" stroke="#94a3b8" stroke-width="1"/>
  <line x1="270" y1="174" x2="475" y2="174" stroke="#94a3b8" stroke-width="1"/>
  <line x1="270" y1="206" x2="475" y2="206" stroke="#94a3b8" stroke-width="1"/>
  <rect x="270" y="78" width="205" height="160" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text x="297" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">A</text>
  <text x="352" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">B</text>
  <text x="427" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">A OR B</text>
  <text x="297" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#16a34a">✓</text>
  <text x="352" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#16a34a">✓</text>
  <text x="427" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">✓</text>
  <text x="297" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#16a34a">✓</text>
  <text x="352" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#dc2626">✗</text>
  <text x="427" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">✓</text>
  <text x="297" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#dc2626">✗</text>
  <text x="352" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#16a34a">✓</text>
  <text x="427" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">✓</text>
  <text x="297" y="228" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#dc2626">✗</text>
  <text x="352" y="228" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#dc2626">✗</text>
  <text x="427" y="228" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">✗</text>
  <text x="372" y="262" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">kamida bittasi rost bo'lsa</text>

  <!-- NOT jadvali -->
  <rect x="510" y="78" width="155" height="32" fill="#d97706"/>
  <rect x="510" y="110" width="155" height="64" fill="#e2e8f0"/>
  <line x1="565" y1="78" x2="565" y2="174" stroke="#94a3b8" stroke-width="1"/>
  <line x1="510" y1="142" x2="665" y2="142" stroke="#94a3b8" stroke-width="1"/>
  <rect x="510" y="78" width="155" height="96" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text x="537" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">A</text>
  <text x="615" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">NOT A</text>
  <text x="537" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#16a34a">✓</text>
  <text x="615" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">✗</text>
  <text x="537" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#dc2626">✗</text>
  <text x="615" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">✓</text>
  <text x="587" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">teskarisiga aylantiradi</text>

  <!-- izohlar -->
  <text x="360" y="298" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569"><tspan fill="#16a34a">✓</tspan> = shart rost (TRUE) · <tspan fill="#dc2626">✗</tspan> = shart yolg'on (FALSE)</text>
  <text x="360" y="330" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Bajarilish tartibi: avval NOT, keyin AND, oxirida OR</text>
  <text x="360" y="356" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Aralash shartlarda qavs ishlating: (janr='roman' OR janr='ertak') AND sahifa &lt; 400</text>
</svg>
