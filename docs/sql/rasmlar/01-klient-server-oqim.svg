<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350">
  <title>Klient-server oqimi: siz SQL buyruq yuborasiz, MySQL server natija qaytaradi</title>
  <defs>
    <marker id="ks-ok" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="350" fill="#f8fafc"/>

  <!-- sarlavha -->
  <text x="360" y="40" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">MySQL qanday ishlaydi: buyruq va natija</text>

  <!-- Klient qutisi -->
  <text x="140" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#2563eb">Siz (klient)</text>
  <rect x="40" y="115" width="200" height="130" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="140" y="162" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Terminal yoki DBeaver</text>
  <text x="140" y="187" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">SQL buyruq yozasiz</text>
  <text x="140" y="212" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">natijani ko'rasiz</text>

  <!-- Server qutisi -->
  <text x="580" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#16a34a">MySQL server</text>
  <rect x="480" y="115" width="200" height="130" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="580" y="162" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Doim ishlab turadi</text>
  <text x="580" y="187" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">bazalarni saqlaydi</text>
  <text x="580" y="212" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">buyruqni bajaradi</text>

  <!-- Buyruq strelkasi (chapdan o'ngga) -->
  <line x1="240" y1="158" x2="478" y2="158" stroke="#475569" stroke-width="2.5" marker-end="url(#ks-ok)"/>
  <rect x="250" y="122" width="220" height="26" rx="6" fill="#2563eb"/>
  <text x="360" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#f8fafc">SELECT nomi FROM kitoblar;</text>

  <!-- Natija strelkasi (o'ngdan chapga) -->
  <line x1="478" y1="205" x2="242" y2="205" stroke="#475569" stroke-width="2.5" marker-end="url(#ks-ok)"/>
  <rect x="255" y="212" width="210" height="26" rx="6" fill="#16a34a"/>
  <text x="360" y="230" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#f8fafc">Natija: kitoblar ro'yxati</text>

  <!-- pastki izohlar -->
  <text x="360" y="292" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">1) Buyruq yozasiz  →  2) Server bajaradi  →  3) Natija qaytadi</text>
  <text x="360" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Server sizning kompyuteringizda ham, uzoqdagi mashinada ham bo'lishi mumkin</text>
</svg>
