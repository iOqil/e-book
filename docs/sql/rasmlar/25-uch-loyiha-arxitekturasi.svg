<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">
  <title>Uch loyiha bir qarashda: kinoteatr 4 jadval, onlayn kurslar 5 jadval, yetkazib berish 6 jadval</title>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="400" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Uch loyiha bir qarashda</text>

  <!-- LOYIHA A: Kinoteatr -->
  <rect x="25" y="58" width="210" height="272" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="130" y="86" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">A — Kinoteatr</text>
  <text x="130" y="105" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">oson-o'rta · 4 jadval</text>
  <line x1="40" y1="116" x2="220" y2="116" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="40" y="130" width="180" height="24" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="130" y="147" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">filmlar</text>
  <rect x="40" y="162" width="180" height="24" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="130" y="179" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">zallar</text>
  <rect x="40" y="194" width="180" height="24" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="130" y="211" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">seanslar</text>
  <rect x="40" y="226" width="180" height="24" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="130" y="243" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">chiptalar</text>
  <text x="130" y="284" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">UNIQUE(seans, o'rin)</text>
  <text x="130" y="302" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">PROCEDURE · VIEW</text>

  <!-- LOYIHA B: Onlayn kurslar -->
  <rect x="255" y="58" width="210" height="272" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="86" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">B — Onlayn kurslar</text>
  <text x="360" y="105" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">o'rta · 5 jadval</text>
  <line x1="270" y1="116" x2="450" y2="116" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="270" y="130" width="180" height="24" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="360" y="147" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">kurslar</text>
  <rect x="270" y="162" width="180" height="24" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="360" y="179" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">talabalar</text>
  <rect x="270" y="194" width="180" height="24" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="360" y="211" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">yozilishlar (snapshot)</text>
  <rect x="270" y="226" width="180" height="24" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="360" y="243" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">darslar</text>
  <rect x="270" y="258" width="180" height="24" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="360" y="275" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">korishlar</text>
  <text x="360" y="302" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">progress % · LAG · TRIGGER</text>

  <!-- LOYIHA C: Yetkazib berish -->
  <rect x="485" y="58" width="210" height="272" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="590" y="86" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#d97706">C — Yetkazib berish</text>
  <text x="590" y="105" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">murakkab · 6 jadval</text>
  <line x1="500" y1="116" x2="680" y2="116" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="500" y="126" width="180" height="24" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="590" y="143" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">restoranlar</text>
  <rect x="500" y="156" width="180" height="24" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="590" y="173" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">taomlar</text>
  <rect x="500" y="186" width="180" height="24" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="590" y="203" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">kuryerlar</text>
  <rect x="500" y="216" width="180" height="24" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="590" y="233" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">mijozlar</text>
  <rect x="500" y="246" width="180" height="24" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="590" y="263" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">buyurtmalar (holat)</text>
  <rect x="500" y="276" width="180" height="24" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="590" y="293" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">buyurtma_taomlari</text>
  <text x="590" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">tranzaksiya · EXPLAIN · backup</text>

  <!-- topshiriq belgilari -->
  <rect x="65" y="346" width="130" height="26" rx="13" fill="#16a34a"/>
  <text x="130" y="364" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">10 topshiriq</text>
  <rect x="295" y="346" width="130" height="26" rx="13" fill="#2563eb"/>
  <text x="360" y="364" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">10 topshiriq</text>
  <rect x="525" y="346" width="130" height="26" rx="13" fill="#d97706"/>
  <text x="590" y="364" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">12 topshiriq</text>

  <!-- pastdagi izoh -->
  <text x="360" y="392" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Murakkablik A → C tomon oshadi. C loyihani GitHub portfolio'ingizga qo'ying!</text>
</svg>
