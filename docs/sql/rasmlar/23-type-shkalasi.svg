<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300">
  <title>type shkalasi: const'dan ALL'gacha — yaxshidan yomonga</title>
  <defs>
    <marker id="strelka23b" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="300" fill="#f8fafc"/>

  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">type shkalasi: yaxshidan yomonga</text>

  <!-- yo'nalish strelkasi -->
  <text x="62" y="66" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">YAXSHI</text>
  <line x1="110" y1="61" x2="608" y2="61" stroke="#475569" stroke-width="2" marker-end="url(#strelka23b)"/>
  <text x="658" y="66" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">YOMON</text>

  <!-- shkala qutilari -->
  <rect x="30" y="90" width="100" height="52" rx="10" fill="#16a34a"/>
  <text x="80" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">const</text>
  <rect x="142" y="90" width="100" height="52" rx="10" fill="#16a34a"/>
  <text x="192" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">eq_ref</text>
  <rect x="254" y="90" width="100" height="52" rx="10" fill="#16a34a"/>
  <text x="304" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">ref</text>
  <rect x="366" y="90" width="100" height="52" rx="10" fill="#16a34a"/>
  <text x="416" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">range</text>
  <rect x="478" y="90" width="100" height="52" rx="10" fill="#d97706"/>
  <text x="528" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">index</text>
  <rect x="590" y="90" width="100" height="52" rx="10" fill="#dc2626"/>
  <text x="640" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">ALL</text>

  <!-- izohlar -->
  <text x="80" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">PK / UNIQUE</text>
  <text x="80" y="182" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">WHERE id=500</text>

  <text x="192" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">JOIN'da PK</text>
  <text x="192" y="182" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">orqali 1 tadan</text>

  <text x="304" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">indeks bo'yicha</text>
  <text x="304" y="182" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tenglik</text>

  <text x="416" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">oraliq:</text>
  <text x="416" y="182" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">BETWEEN, &gt;, &lt;</text>

  <text x="528" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">BUTUN indeksni</text>
  <text x="528" y="182" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">o'qiydi</text>

  <text x="640" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">full scan —</text>
  <text x="640" y="182" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">qizil bayroq!</text>

  <!-- xulosa -->
  <text x="360" y="232" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Katta jadvalda ref yoki range ko'rsangiz — yaxshi natija. Xavotir ALL'dan boshlanadi.</text>
  <text x="360" y="258" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Kichik jadvalda ALL ham normal: 50 qatorni to'g'ridan-to'g'ri o'qish indeksdan arzon.</text>
</svg>
