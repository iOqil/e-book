<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <title>LIKE naqsh belgilari: % istalgan sondagi belgi, _ aynan bitta belgi — misollar bilan</title>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="420" fill="#f8fafc"/>

  <!-- sarlavha -->
  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">LIKE naqsh belgilari</text>

  <!-- % kartasi -->
  <rect x="40" y="58" width="310" height="74" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="78" y="106" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="30" font-weight="bold" fill="#d97706">%</text>
  <text x="108" y="90" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">istalgan sondagi istalgan belgi</text>
  <text x="108" y="113" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(0 ta bo'lishi ham mumkin)</text>

  <!-- _ kartasi -->
  <rect x="370" y="58" width="310" height="74" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="408" y="102" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="30" font-weight="bold" fill="#2563eb">_</text>
  <text x="438" y="90" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">aynan BITTA belgi</text>
  <text x="438" y="113" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(ko'p ham, kam ham emas)</text>

  <!-- 1-misol: 'A%' -->
  <rect x="40" y="156" width="640" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="52" y="164" width="112" height="28" rx="6" fill="#1e293b"/>
  <text x="108" y="183" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#f8fafc">'A%'</text>
  <text x="180" y="184" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">A bilan boshlanadi</text>
  <text x="420" y="184" font-family="Segoe UI, system-ui, sans-serif" font-size="14"><tspan fill="#16a34a">Aziz ✓</tspan><tspan fill="#475569"> · </tspan><tspan fill="#dc2626">Malika ✗</tspan></text>

  <!-- 2-misol: '%ova' -->
  <rect x="40" y="212" width="640" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="52" y="220" width="112" height="28" rx="6" fill="#1e293b"/>
  <text x="108" y="239" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#f8fafc">'%ova'</text>
  <text x="180" y="240" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">ova bilan tugaydi</text>
  <text x="420" y="240" font-family="Segoe UI, system-ui, sans-serif" font-size="14"><tspan fill="#16a34a">Rahimova ✓</tspan><tspan fill="#475569"> · </tspan><tspan fill="#dc2626">Tosheva ✗</tspan></text>

  <!-- 3-misol: '%kar%' -->
  <rect x="40" y="268" width="640" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="52" y="276" width="112" height="28" rx="6" fill="#1e293b"/>
  <text x="108" y="295" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#f8fafc">'%kar%'</text>
  <text x="180" y="296" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">ichida 'kar' bor</text>
  <text x="420" y="296" font-family="Segoe UI, system-ui, sans-serif" font-size="14"><tspan fill="#16a34a">Hulkar ✓</tspan><tspan fill="#475569"> · </tspan><tspan fill="#16a34a">Karimov ✓</tspan><tspan fill="#475569"> · </tspan><tspan fill="#dc2626">Bobur ✗</tspan></text>

  <!-- 4-misol: '_ariq%' -->
  <rect x="40" y="324" width="640" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="52" y="332" width="112" height="28" rx="6" fill="#1e293b"/>
  <text x="108" y="351" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#f8fafc">'_ariq%'</text>
  <text x="180" y="352" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">1-belgi istalgan, keyin 'ariq'</text>
  <text x="420" y="352" font-family="Segoe UI, system-ui, sans-serif" font-size="14"><tspan fill="#16a34a">Sariq ✓</tspan><tspan fill="#475569"> · </tspan><tspan fill="#dc2626">ariq ✗</tspan></text>

  <!-- pastdagi izoh -->
  <text x="360" y="392" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Bizning sozlamada (utf8mb4_unicode_ci) LIKE katta-kichik harfni farqlamaydi:</text>
  <text x="360" y="410" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">'a%' ham, 'A%' ham Aziz'ni topadi</text>
</svg>
