<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <title>SQL — buyruq berish tili, MySQL esa shu tilni tushunadigan dasturlardan biri</title>
  <defs>
    <marker id="sm-ok" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="380" fill="#f8fafc"/>

  <!-- sarlavha -->
  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">SQL — til, MySQL — dastur</text>

  <!-- SQL qutisi (til) -->
  <rect x="235" y="58" width="250" height="72" rx="10" fill="#e2e8f0" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="88" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#2563eb">SQL — til</text>
  <text x="360" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">bazaga buyruq berish tili</text>

  <!-- strelkalar: til -> dasturlar -->
  <line x1="360" y1="132" x2="107" y2="192" stroke="#475569" stroke-width="2" marker-end="url(#sm-ok)"/>
  <line x1="360" y1="132" x2="276" y2="192" stroke="#475569" stroke-width="2" marker-end="url(#sm-ok)"/>
  <line x1="360" y1="132" x2="444" y2="192" stroke="#475569" stroke-width="2" marker-end="url(#sm-ok)"/>
  <line x1="360" y1="132" x2="613" y2="192" stroke="#475569" stroke-width="2" marker-end="url(#sm-ok)"/>

  <!-- MySQL qutisi -->
  <rect x="30" y="196" width="150" height="92" rx="10" fill="#e2e8f0" stroke="#16a34a" stroke-width="2.5"/>
  <text x="105" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">MySQL</text>
  <text x="105" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#1e293b">bepul, ochiq kodli</text>
  <text x="105" y="268" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#1e293b">eng ommabop</text>
  <text x="105" y="312" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">biz shuni o'rganamiz</text>

  <!-- PostgreSQL qutisi -->
  <rect x="200" y="196" width="150" height="92" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="275" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#475569">PostgreSQL</text>
  <text x="275" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#1e293b">bepul, kuchli</text>
  <text x="275" y="268" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#1e293b">jiddiy loyihalarda</text>

  <!-- SQLite qutisi -->
  <rect x="370" y="196" width="150" height="92" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="445" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#475569">SQLite</text>
  <text x="445" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#1e293b">mitti, fayl ichida</text>
  <text x="445" y="268" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#1e293b">telefon ilovalarida</text>

  <!-- Oracle qutisi -->
  <rect x="540" y="196" width="150" height="92" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="615" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#475569">Oracle</text>
  <text x="615" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#1e293b">pullik</text>
  <text x="615" y="268" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#1e293b">yirik korxonalarda</text>

  <!-- pastki izoh -->
  <text x="360" y="352" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Hammasi bitta SQL tilida gaplashadi — faqat kichik "sheva" farqlari bor</text>
</svg>
