<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350">
  <title>EXPLAIN natijasini o'qish xaritasi: type, key, rows va Extra ustunlari nimani anglatadi</title>
  <defs>
    <marker id="strelka23a" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="350" fill="#f8fafc"/>

  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">EXPLAIN natijasini o'qish xaritasi</text>

  <!-- ustun sarlavhalari -->
  <rect x="125" y="54" width="140" height="30" rx="6" fill="#2563eb"/>
  <text x="195" y="74" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">type</text>
  <rect x="272" y="54" width="140" height="30" rx="6" fill="#2563eb"/>
  <text x="342" y="74" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">key</text>
  <rect x="419" y="54" width="140" height="30" rx="6" fill="#2563eb"/>
  <text x="489" y="74" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">rows</text>
  <rect x="566" y="54" width="140" height="30" rx="6" fill="#2563eb"/>
  <text x="636" y="74" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">Extra</text>

  <!-- qator yorliqlari -->
  <text x="115" y="116" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">Indekssiz:</text>
  <text x="115" y="158" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Indeks bilan:</text>

  <!-- kasal qator -->
  <rect x="125" y="94" width="140" height="34" rx="8" fill="#e2e8f0" stroke="#dc2626" stroke-width="2"/>
  <text x="195" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">ALL</text>
  <rect x="272" y="94" width="140" height="34" rx="8" fill="#e2e8f0" stroke="#dc2626" stroke-width="2"/>
  <text x="342" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">NULL</text>
  <rect x="419" y="94" width="140" height="34" rx="8" fill="#e2e8f0" stroke="#dc2626" stroke-width="2"/>
  <text x="489" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">≈996 000</text>
  <rect x="566" y="94" width="140" height="34" rx="8" fill="#e2e8f0" stroke="#dc2626" stroke-width="2"/>
  <text x="636" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Using where</text>

  <!-- sog'lom qator -->
  <rect x="125" y="136" width="140" height="34" rx="8" fill="#e2e8f0" stroke="#16a34a" stroke-width="2"/>
  <text x="195" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">ref</text>
  <rect x="272" y="136" width="140" height="34" rx="8" fill="#e2e8f0" stroke="#16a34a" stroke-width="2"/>
  <text x="342" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">idx_yosh</text>
  <rect x="419" y="136" width="140" height="34" rx="8" fill="#e2e8f0" stroke="#16a34a" stroke-width="2"/>
  <text x="489" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">≈20 000</text>
  <rect x="566" y="136" width="140" height="34" rx="8" fill="#e2e8f0" stroke="#16a34a" stroke-width="2"/>
  <text x="636" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">NULL</text>

  <!-- strelkalar -->
  <line x1="195" y1="176" x2="195" y2="198" stroke="#475569" stroke-width="2" marker-end="url(#strelka23a)"/>
  <line x1="342" y1="176" x2="342" y2="198" stroke="#475569" stroke-width="2" marker-end="url(#strelka23a)"/>
  <line x1="489" y1="176" x2="489" y2="198" stroke="#475569" stroke-width="2" marker-end="url(#strelka23a)"/>
  <line x1="636" y1="176" x2="636" y2="198" stroke="#475569" stroke-width="2" marker-end="url(#strelka23a)"/>

  <!-- izoh qutilari -->
  <rect x="125" y="204" width="140" height="68" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="195" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Qidiruv usuli.</text>
  <text x="195" y="242" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">ALL = full scan —</text>
  <text x="195" y="260" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">qizil bayroq!</text>

  <rect x="272" y="204" width="140" height="68" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="342" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Real ishlatilgan</text>
  <text x="342" y="242" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">indeks. NULL =</text>
  <text x="342" y="260" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">indekssiz ishladi</text>

  <rect x="419" y="204" width="140" height="68" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="489" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Taxminan nechta</text>
  <text x="489" y="242" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">qator o'qiladi.</text>
  <text x="489" y="260" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">Kam = yaxshi</text>

  <rect x="566" y="204" width="140" height="68" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="636" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Belgilar: filesort,</text>
  <text x="636" y="242" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">temporary —</text>
  <text x="636" y="260" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#d97706">ogohlantirish</text>

  <!-- xulosa -->
  <text x="360" y="304" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">Tezkor tekshiruv: type = ALL'mi? key = NULL'mi? rows juda kattami?</text>
  <text x="360" y="328" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">Sog'lom reja: type ref/range, key to'ldirilgan, rows kichik</text>
</svg>
