<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <title>Toplam-asosli bitta buyruq million qatorni birvarakay qamrab oladi; cursor esa har qatorni alohida aylantiradi (RBAR)</title>
  <defs>
    <marker id="strelka-sc" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="420" fill="#f8fafc"/>

  <text x="360" y="38" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Toplam-asosli vs qatorma-qator (RBAR)</text>

  <!-- chap: toplam-asosli -->
  <text x="185" y="78" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">Toplam-asosli (set-based)</text>

  <rect x="40" y="92" width="290" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="185" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">UPDATE kitoblar SET ...</text>
  <text x="185" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">bitta buyruq</text>
  <text x="185" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">1 000 000 qator</text>
  <text x="185" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">bir o'tishda qamraladi</text>

  <line x1="185" y1="212" x2="185" y2="252" stroke="#475569" stroke-width="2.5" marker-end="url(#strelka-sc)"/>
  <rect x="60" y="258" width="250" height="50" rx="8" fill="#16a34a"/>
  <text x="185" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Tez: 1 marta MySQL ishi</text>
  <text x="185" y="299" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#dcfce7">optimizator o'zi joylaydi</text>

  <!-- ajratuvchi -->
  <line x1="360" y1="70" x2="360" y2="360" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- ong: cursor / RBAR -->
  <text x="535" y="78" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">Cursor (RBAR)</text>

  <rect x="400" y="92" width="270" height="120" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="535" y="120" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#991b1b">FETCH ... INTO (siklda)</text>
  <text x="430" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#991b1b">1-qator &#8594; ish</text>
  <text x="430" y="170" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#991b1b">2-qator &#8594; ish</text>
  <text x="430" y="190" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#991b1b">3-qator &#8594; ish</text>
  <text x="585" y="170" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#991b1b">... 1 000 000 marta</text>

  <line x1="535" y1="212" x2="535" y2="252" stroke="#475569" stroke-width="2.5" marker-end="url(#strelka-sc)"/>
  <rect x="410" y="258" width="250" height="50" rx="8" fill="#dc2626"/>
  <text x="535" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Sekin: har qator alohida</text>
  <text x="535" y="299" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#fee2e2">"Row By Agonizing Row"</text>

  <!-- pastdagi xulosa -->
  <text x="360" y="392" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Avval so'rang: shuni bitta UPDATE / INSERT ... SELECT bilan qila olamanmi?</text>
</svg>
