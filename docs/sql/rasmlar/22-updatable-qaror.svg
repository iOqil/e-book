<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560">
  <title>Updatable yoki read-only? Qaror daraxti: GROUP BY/agregat, DISTINCT, UNION, HAVING, oyna funksiya yoki ko'p jadval JOIN bo'lsa view faqat-o'qish; aks holda yangilanadi</title>
  <defs>
    <marker id="ok-strelka" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="yoq-strelka" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="560" fill="#f8fafc"/>

  <text x="360" y="38" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">View yangilanadimi? — qaror daraxti</text>
  <text x="360" y="60" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Yo'l davomida HAR savolga "yo'q" desangizgina view yangilanadi</text>

  <!-- Boshlanish -->
  <rect x="270" y="82" width="180" height="44" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="110" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">View ta'rifi (SELECT)</text>

  <!-- Savol 1: GROUP BY / agregat -->
  <line x1="360" y1="126" x2="360" y2="148" stroke="#475569" stroke-width="2.5"/>
  <polygon points="360,148 200,176 360,204 520,176" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="360" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#713f12">GROUP BY yoki agregat</text>
  <text x="360" y="190" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#713f12">(SUM/COUNT/AVG...) bormi?</text>

  <!-- Savol 1 -> HA -->
  <line x1="520" y1="176" x2="600" y2="176" stroke="#dc2626" stroke-width="2.5" marker-end="url(#yoq-strelka)"/>
  <text x="560" y="167" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">HA</text>

  <!-- Savol 1 -> YO'Q -->
  <line x1="360" y1="204" x2="360" y2="226" stroke="#16a34a" stroke-width="2.5"/>
  <text x="378" y="222" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">yo'q</text>

  <!-- Savol 2: DISTINCT / UNION -->
  <polygon points="360,226 200,254 360,282 520,254" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="360" y="250" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#713f12">DISTINCT, UNION</text>
  <text x="360" y="268" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#713f12">yoki HAVING bormi?</text>

  <!-- Savol 2 -> HA -->
  <line x1="520" y1="254" x2="600" y2="254" stroke="#dc2626" stroke-width="2.5" marker-end="url(#yoq-strelka)"/>
  <text x="560" y="245" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">HA</text>

  <!-- Savol 2 -> YO'Q -->
  <line x1="360" y1="282" x2="360" y2="304" stroke="#16a34a" stroke-width="2.5"/>
  <text x="378" y="300" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">yo'q</text>

  <!-- Savol 3: oyna funksiya / subquery -->
  <polygon points="360,304 200,332 360,360 520,332" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="360" y="328" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#713f12">Oyna funksiya OVER()</text>
  <text x="360" y="346" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#713f12">yoki ba'zi subquery bormi?</text>

  <!-- Savol 3 -> HA -->
  <line x1="520" y1="332" x2="600" y2="332" stroke="#dc2626" stroke-width="2.5" marker-end="url(#yoq-strelka)"/>
  <text x="560" y="323" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">HA</text>

  <!-- Savol 3 -> YO'Q -->
  <line x1="360" y1="360" x2="360" y2="382" stroke="#16a34a" stroke-width="2.5"/>
  <text x="378" y="378" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">yo'q</text>

  <!-- Savol 4: ko'p jadval / faqat hisoblangan ustun -->
  <polygon points="360,382 200,410 360,438 520,410" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="360" y="406" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#713f12">Ko'p jadval JOIN yoki faqat</text>
  <text x="360" y="424" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#713f12">doimiy/hisoblangan ustunmi?</text>

  <!-- Savol 4 -> HA -->
  <line x1="520" y1="410" x2="600" y2="410" stroke="#dc2626" stroke-width="2.5" marker-end="url(#yoq-strelka)"/>
  <text x="560" y="401" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">HA</text>

  <!-- Savol 4 -> YO'Q -->
  <line x1="360" y1="438" x2="360" y2="462" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ok-strelka)"/>
  <text x="378" y="456" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">yo'q</text>

  <!-- Natija: UPDATABLE -->
  <rect x="230" y="464" width="260" height="60" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="360" y="490" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#15803d">YANGILANADIGAN (updatable)</text>
  <text x="360" y="512" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#166534">INSERT / UPDATE / DELETE asl jadvalga tushadi</text>

  <!-- Natija: READ-ONLY -->
  <rect x="600" y="170" width="100" height="280" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="650" y="295" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b91c1c">FAQAT</text>
  <text x="650" y="315" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b91c1c">O'QISH</text>
  <text x="650" y="338" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#991b1b">(read-only)</text>
  <text x="650" y="362" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#991b1b">o'zgartirib</text>
  <text x="650" y="377" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#991b1b">bo'lmaydi</text>

  <!-- Pastdagi izoh -->
  <text x="280" y="548" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">Aniqni bilish: INFORMATION_SCHEMA.VIEWS.IS_UPDATABLE = YES/NO</text>
</svg>
