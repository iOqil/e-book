<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <title>Indeks — kitob oxiridagi alfavit ko'rsatkich: varaqlab qidirish va ko'rsatkich orqali topish</title>
  <defs>
    <marker id="ind-ok" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="380" fill="#f8fafc"/>

  <text x="360" y="40" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Indeks — kitob oxiridagi alfavit ko'rsatkich</text>

  <!-- Chap panel: indekssiz -->
  <text x="190" y="80" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">Indekssiz — varaqlab qidirish</text>
  <rect x="40" y="92" width="300" height="210" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="60" y="126" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">1-bet ... «fotosintez» yo'q</text>
  <text x="60" y="153" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">2-bet ... yo'q</text>
  <text x="60" y="180" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">3-bet ... yo'q</text>
  <text x="60" y="207" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">... (har bir sahifa o'qiladi)</text>
  <text x="60" y="234" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#2563eb">217-bet — topildi!</text>
  <text x="190" y="278" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">Vaqt: soatlab (yarim kungacha)</text>

  <!-- O'ng panel: indeks bilan -->
  <text x="530" y="80" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">Indeks bilan — to'g'ri manzil</text>
  <rect x="380" y="92" width="300" height="210" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>

  <!-- ko'rsatkich qutisi -->
  <rect x="398" y="110" width="156" height="118" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="476" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">Ko'rsatkich</text>
  <text x="408" y="156" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">daraxt — 84</text>
  <text x="408" y="178" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">fotosintez — 217</text>
  <text x="408" y="200" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">hujayra — 305</text>

  <!-- strelka va sahifa -->
  <line x1="556" y1="173" x2="586" y2="171" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ind-ok)"/>
  <rect x="590" y="140" width="76" height="64" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/>
  <text x="628" y="168" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">217-bet</text>
  <text x="628" y="188" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#16a34a">fotosintez</text>

  <text x="530" y="278" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">Vaqt: 10 soniya</text>

  <!-- pastki izoh -->
  <text x="360" y="348" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">MySQL'da ham shunday: indekssiz — full scan, indeks bilan — to'g'ridan-to'g'ri qatorga</text>
</svg>
