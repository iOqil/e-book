<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <title>WHERE filtri: barcha qatorlardan faqat shartga mos kelganlari natijaga o'tadi</title>
  <defs>
    <marker id="wf-strelka" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="420" fill="#f8fafc"/>

  <!-- sarlavha va so'rov -->
  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">WHERE — qatorlarni filtrlash</text>
  <text x="360" y="62" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">SELECT * FROM kitoblar WHERE yil &gt; 1950;</text>

  <!-- chap quti: barcha qatorlar -->
  <text x="130" y="105" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">kitoblar — 10 qator</text>
  <rect x="24" y="115" width="212" height="240" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="38" y="143" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Otkan kunlar — 1925</text>
  <text x="38" y="171" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Mehrobdan chayon — 1928</text>
  <text x="38" y="199" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Sariq devni minib — 1968</text>
  <text x="38" y="227" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Sariq devning olimi — 1973</text>
  <text x="38" y="255" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Ozbegim — 1981</text>
  <text x="38" y="283" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Urush va tinchlik — 1869</text>
  <text x="38" y="311" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Hayot chorrahalari — 1975</text>
  <text x="38" y="339" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">... yana 3 qator (mos emas)</text>

  <!-- filtr voronkasi -->
  <path d="M264,165 L450,205 L450,265 L264,305 Z" fill="#2563eb"/>
  <text x="360" y="228" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">WHERE</text>
  <text x="360" y="251" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#f8fafc">yil &gt; 1950</text>

  <!-- strelkalar -->
  <line x1="240" y1="235" x2="259" y2="235" stroke="#475569" stroke-width="2.5" marker-end="url(#wf-strelka)"/>
  <line x1="454" y1="235" x2="476" y2="235" stroke="#475569" stroke-width="2.5" marker-end="url(#wf-strelka)"/>

  <!-- o'ng quti: natija -->
  <text x="589" y="155" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">Natija — 4 qator</text>
  <rect x="482" y="165" width="214" height="140" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="496" y="195" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Sariq devni minib — 1968</text>
  <text x="496" y="223" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Sariq devning olimi — 1973</text>
  <text x="496" y="251" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Ozbegim — 1981</text>
  <text x="496" y="279" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Hayot chorrahalari — 1975</text>

  <!-- pastdagi izoh -->
  <text x="360" y="392" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Yashil qatorlar shartga mos — faqat shular natijaga o'tadi. Jadvalning o'zi o'zgarmaydi!</text>
</svg>
