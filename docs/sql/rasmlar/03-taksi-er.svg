<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460">
  <title>Taksi bazasi ER-diagrammasi: haydovchilar, mashinalar va safarlar jadvallari</title>
  <defs>
    <marker id="fk-strelka-taksi" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="460" fill="#f8fafc"/>

  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">TAKSI bazasi — 3 jadval (ER)</text>

  <!-- haydovchilar -->
  <text x="135" y="152" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">haydovchilar</text>
  <rect x="40" y="160" width="190" height="118" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="54" y="184" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">id (PK)</text>
  <text x="54" y="204" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">ism</text>
  <text x="54" y="224" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">telefon</text>
  <text x="54" y="244" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">reyting</text>
  <text x="54" y="264" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">ishga_kirgan</text>
  <text x="135" y="304" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">bitta haydovchi — ko'p safar,</text>
  <text x="135" y="322" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">har mashina bitta haydovchiga tegishli</text>

  <!-- mashinalar -->
  <text x="565" y="70" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">mashinalar</text>
  <rect x="470" y="78" width="190" height="118" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="484" y="102" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">id (PK)</text>
  <text x="484" y="122" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">haydovchi_id (FK)</text>
  <text x="484" y="142" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">model</text>
  <text x="484" y="162" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">raqam</text>
  <text x="484" y="182" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">yil</text>

  <!-- safarlar -->
  <text x="570" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">safarlar</text>
  <rect x="470" y="232" width="200" height="198" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="484" y="256" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">id (PK)</text>
  <text x="484" y="276" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">haydovchi_id (FK)</text>
  <text x="484" y="296" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">mijoz_ism</text>
  <text x="484" y="316" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">boshlanish</text>
  <text x="484" y="336" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">tugash</text>
  <text x="484" y="356" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">masofa_km</text>
  <text x="484" y="376" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">narx</text>
  <text x="484" y="396" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">sana</text>
  <text x="484" y="416" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">baho (NULL mumkin)</text>

  <!-- strelkalar: FK -> ishora qilingan jadval -->
  <path d="M468,117 L300,117 L300,200 L234,200" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#fk-strelka-taksi)"/>
  <line x1="468" y1="271" x2="234" y2="271" stroke="#475569" stroke-width="2.5" marker-end="url(#fk-strelka-taksi)"/>

  <!-- izoh -->
  <text x="360" y="452" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">PK — asosiy kalit · FK — tashqi kalit · strelka: FK qaysi jadvalga ishora qilmoqda</text>
</svg>
