<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>SQL injection: matn yopishtirish xavfli, prepared statement qiymatni alohida yuboradi va xavfsiz</title>
  <defs>
    <marker id="inj-ok" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>

  <!-- sarlavha -->
  <text x="360" y="38" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">SQL injection: ikkita yo'l — xavfli va xavfsiz</text>

  <!-- o'rta ajratuvchi -->
  <line x1="360" y1="58" x2="360" y2="378" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- ustun sarlavhalari -->
  <text x="190" y="74" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">1) Matn yopishtirish — XAVFLI</text>
  <text x="530" y="74" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">2) Prepared statement — XAVFSIZ</text>

  <!-- kiritish qutilari -->
  <rect x="65" y="88" width="250" height="52" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="190" y="110" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Foydalanuvchi kiritdi:</text>
  <text x="190" y="131" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">' OR '1'='1</text>

  <rect x="405" y="88" width="250" height="52" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="530" y="110" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Foydalanuvchi kiritdi:</text>
  <text x="530" y="131" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">' OR '1'='1</text>

  <!-- strelkalar 1 -->
  <line x1="190" y1="142" x2="190" y2="166" stroke="#475569" stroke-width="2.5" marker-end="url(#inj-ok)"/>
  <line x1="530" y1="142" x2="530" y2="166" stroke="#475569" stroke-width="2.5" marker-end="url(#inj-ok)"/>

  <!-- qayta ishlash qutilari -->
  <rect x="50" y="170" width="280" height="86" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="190" y="193" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Qiymat query MATNIGA yopishadi:</text>
  <text x="190" y="216" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#dc2626">WHERE login = '' OR '1'='1'</text>
  <text x="190" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">server hammasini KOD deb o'qiydi</text>

  <rect x="390" y="170" width="280" height="86" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="530" y="193" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Shablon ALOHIDA, qiymat ALOHIDA:</text>
  <text x="530" y="216" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#16a34a">WHERE login = ?  +  qiymat</text>
  <text x="530" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">? faqat BITTA qiymat kutadi</text>

  <!-- strelkalar 2 -->
  <line x1="190" y1="258" x2="190" y2="282" stroke="#475569" stroke-width="2.5" marker-end="url(#inj-ok)"/>
  <line x1="530" y1="258" x2="530" y2="282" stroke="#475569" stroke-width="2.5" marker-end="url(#inj-ok)"/>

  <!-- natija qutilari -->
  <rect x="50" y="286" width="280" height="84" rx="10" fill="#e2e8f0" stroke="#dc2626" stroke-width="2.5"/>
  <text x="190" y="310" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">'1'='1' doim TRUE</text>
  <text x="190" y="332" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">hamma userlar qaytadi —</text>
  <text x="190" y="354" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">parolsiz kirish!</text>

  <rect x="390" y="286" width="280" height="84" rx="10" fill="#e2e8f0" stroke="#16a34a" stroke-width="2.5"/>
  <text x="530" y="310" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Injection ishlamaydi</text>
  <text x="530" y="332" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">' OR '1'='1 — oddiy login matni,</text>
  <text x="530" y="354" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">kod sifatida bajarilMAYDI</text>

  <!-- pastki qoida -->
  <text x="360" y="414" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Qoida: foydalanuvchidan kelgan HAR QANDAY qiymat — faqat parametr (?) orqali</text>
</svg>
