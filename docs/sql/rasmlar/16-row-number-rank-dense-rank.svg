<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <title>ROW_NUMBER, RANK va DENSE_RANK teng qiymatlarda qanday farq qiladi</title>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="360" fill="#f8fafc"/>

  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Teng qiymatlarda: ROW_NUMBER, RANK, DENSE_RANK</text>

  <!-- Jadval -->
  <rect x="90" y="60" width="540" height="148" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <!-- teng qiymatli qatorlar foni -->
  <rect x="90" y="118" width="540" height="60" fill="#d97706" opacity="0.10"/>
  <line x1="90" y1="88" x2="630" y2="88" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="220" y1="60" x2="220" y2="208" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="370" y1="60" x2="370" y2="208" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="480" y1="60" x2="480" y2="208" stroke="#94a3b8" stroke-width="1.5"/>

  <text x="155" y="79" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">narx</text>
  <text x="295" y="79" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">ROW_NUMBER</text>
  <text x="425" y="79" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#d97706">RANK</text>
  <text x="555" y="79" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">DENSE_RANK</text>

  <!-- 1-qator: 100 000 -->
  <text x="155" y="111" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">100 000</text>
  <text x="295" y="111" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#2563eb">1</text>
  <text x="425" y="111" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#d97706">1</text>
  <text x="555" y="111" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#16a34a">1</text>

  <!-- 2-qator: 90 000 -->
  <text x="155" y="141" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">90 000</text>
  <text x="295" y="141" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#2563eb">2</text>
  <text x="425" y="141" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#d97706">2</text>
  <text x="555" y="141" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#16a34a">2</text>

  <!-- 3-qator: 90 000 (teng) -->
  <text x="155" y="171" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">90 000</text>
  <text x="295" y="171" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#2563eb">3</text>
  <text x="425" y="171" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#d97706">2</text>
  <text x="555" y="171" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#16a34a">2</text>

  <!-- 4-qator: 80 000 -->
  <text x="155" y="201" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">80 000</text>
  <text x="295" y="201" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#2563eb">4</text>
  <text x="425" y="201" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#d97706">4</text>
  <text x="555" y="201" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">3</text>

  <!-- teng narx belgisi -->
  <text x="48" y="143" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#d97706">teng</text>
  <text x="48" y="159" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#d97706">narx</text>
  <line x1="66" y1="148" x2="86" y2="148" stroke="#d97706" stroke-width="2"/>

  <!-- Izohlar -->
  <text x="360" y="245" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#2563eb">ROW_NUMBER: tenglarga ham har xil raqam beradi (2, 3)</text>
  <text x="360" y="272" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#d97706">RANK: tenglarga teng o'rin, keyin sakraydi (2, 2, keyin 4)</text>
  <text x="360" y="299" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#16a34a">DENSE_RANK: teng o'rin, sakramaydi (2, 2, keyin 3)</text>
  <text x="360" y="334" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Tenglik bo'lmasa — uchalasi ham bir xil natija beradi</text>
</svg>
