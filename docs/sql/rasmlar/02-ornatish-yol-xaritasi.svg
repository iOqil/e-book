<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">
  <title>O'rnatishdan birinchi buyruqqacha yo'l xaritasi: Windows, macOS va Linux uchun qadamlar va yakuniy mysql prompti</title>
  <defs>
    <marker id="yo-strelka" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="400" fill="#f8fafc"/>

  <!-- sarlavha -->
  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">O'rnatishdan birinchi buyruqqacha — yo'l xaritasi</text>

  <!-- ustun sarlavhalari -->
  <text x="185" y="66" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">1. O'rnatish</text>
  <text x="375" y="66" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">2. Ishga tushirish</text>
  <text x="610" y="66" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">3. Ulanish</text>

  <!-- Windows qatori -->
  <text x="22" y="115" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">Windows</text>
  <rect x="105" y="82" width="160" height="56" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="185" y="105" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Laragon o'rnatish</text>
  <text x="185" y="125" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">laragon.org (Full)</text>
  <line x1="265" y1="110" x2="291" y2="110" stroke="#475569" stroke-width="2.5" marker-end="url(#yo-strelka)"/>
  <rect x="295" y="82" width="160" height="56" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="375" y="105" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">"Start All" tugmasi</text>
  <text x="375" y="125" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">Laragon oynasida</text>

  <!-- macOS qatori -->
  <text x="22" y="203" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#d97706">macOS</text>
  <rect x="105" y="170" width="160" height="56" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="185" y="193" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">brew install mysql</text>
  <text x="185" y="213" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">Terminal orqali</text>
  <line x1="265" y1="198" x2="291" y2="198" stroke="#475569" stroke-width="2.5" marker-end="url(#yo-strelka)"/>
  <rect x="295" y="170" width="160" height="56" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="375" y="193" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">brew services</text>
  <text x="375" y="213" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">start mysql</text>

  <!-- Linux qatori -->
  <text x="22" y="291" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">Linux</text>
  <rect x="105" y="258" width="160" height="56" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="185" y="281" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">apt install</text>
  <text x="185" y="301" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">mysql-server</text>
  <line x1="265" y1="286" x2="291" y2="286" stroke="#475569" stroke-width="2.5" marker-end="url(#yo-strelka)"/>
  <rect x="295" y="258" width="160" height="56" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="375" y="278" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">systemctl start mysql</text>
  <text x="375" y="298" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#dc2626">1-marta: sudo mysql</text>

  <!-- yakuniy quti -->
  <rect x="520" y="140" width="180" height="120" rx="10" fill="#e2e8f0" stroke="#16a34a" stroke-width="2.5"/>
  <text x="610" y="168" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">Ulanish</text>
  <text x="610" y="194" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">mysql -u root -p</text>
  <text x="610" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">mysql&gt;</text>
  <text x="610" y="244" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">SHOW DATABASES;</text>

  <!-- B -> yakuniy strelkalar -->
  <line x1="455" y1="110" x2="516" y2="165" stroke="#475569" stroke-width="2.5" marker-end="url(#yo-strelka)"/>
  <line x1="455" y1="198" x2="516" y2="200" stroke="#475569" stroke-width="2.5" marker-end="url(#yo-strelka)"/>
  <line x1="455" y1="286" x2="516" y2="235" stroke="#475569" stroke-width="2.5" marker-end="url(#yo-strelka)"/>

  <!-- pastdagi izoh -->
  <text x="360" y="372" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">Qaysi OS bo'lmasin — manzil bitta: mysql&gt; prompti</text>
</svg>
