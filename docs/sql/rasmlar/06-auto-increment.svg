<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>AUTO_INCREMENT hisoblagichi: INSERT'da id yozilmaydi, MySQL navbatdagi raqamni o'zi beradi</title>
  <defs>
    <marker id="ai-kok" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="ai-yashil" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">AUTO_INCREMENT: id'ni MySQL o'zi beradi</text>

  <!-- jadval (azolar) -->
  <text x="155" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">azolar jadvali (3-bobdagi seed: 6 qator)</text>
  <rect x="40" y="64" width="230" height="30" fill="#475569"/>
  <text x="70" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">id</text>
  <text x="185" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">ism</text>

  <rect x="40" y="94" width="230" height="30" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="70" y="114" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">1</text>
  <text x="110" y="114" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Aziz Karimov</text>
  <rect x="40" y="124" width="230" height="30" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="70" y="144" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">2</text>
  <text x="110" y="144" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Malika Tosheva</text>
  <rect x="40" y="154" width="230" height="30" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="70" y="174" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">3</text>
  <text x="110" y="174" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Jasur Aliyev</text>
  <rect x="40" y="184" width="230" height="30" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="70" y="204" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">4</text>
  <text x="110" y="204" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Nilufar Rahimova</text>
  <rect x="40" y="214" width="230" height="30" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="70" y="234" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">5</text>
  <text x="110" y="234" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Bobur Saidov</text>
  <rect x="40" y="244" width="230" height="30" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="70" y="264" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">6</text>
  <text x="110" y="264" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Zilola Ergasheva</text>

  <!-- yangi qator (yashil) -->
  <rect x="40" y="274" width="230" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="70" y="294" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">7</text>
  <text x="110" y="294" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Umid Rasulov</text>
  <line x1="100" y1="94" x2="100" y2="304" stroke="#94a3b8" stroke-width="1"/>
  <text x="155" y="326" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">yangi qator — id 7 avtomatik</text>

  <!-- hisoblagich qutisi -->
  <rect x="470" y="64" width="210" height="84" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="575" y="90" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Ichki hisoblagich</text>
  <text x="575" y="114" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">keyingi id = 7</text>
  <text x="575" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">INSERT'dan keyin: 8</text>

  <!-- hisoblagich -> kod strelkasi -->
  <line x1="575" y1="150" x2="575" y2="246" stroke="#2563eb" stroke-width="2" marker-end="url(#ai-kok)"/>
  <text x="585" y="202" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">id = 7 ni beradi</text>

  <!-- INSERT kod qutisi -->
  <rect x="300" y="250" width="390" height="64" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="316" y="274" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">INSERT INTO azolar (ism, telefon, ...)</text>
  <text x="316" y="296" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">VALUES ('Umid Rasulov', ...); <tspan fill="#dc2626" font-weight="bold">← id yozilmadi!</tspan></text>

  <!-- kod -> yangi qator strelkasi -->
  <path d="M298,284 C284,286 278,288 274,289" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#ai-yashil)"/>

  <!-- pastki izohlar -->
  <text x="40" y="356" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b"><tspan font-weight="bold" fill="#2563eb">SELECT LAST_INSERT_ID();</tspan> — hozirgina berilgan id'ni qaytaradi (bu yerda 7).</text>
  <text x="40" y="384" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Hisoblagich faqat oldinga yuradi: qator o'chirilsa ham id qayta ishlatilmaydi.</text>
  <text x="40" y="412" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">Shuning uchun id'larda "teshiklar" (1, 2, 5, 9...) bo'lishi normal holat.</text>
</svg>
