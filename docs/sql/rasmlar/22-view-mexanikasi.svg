<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <title>VIEW mexanikasi: siz view'ga so'rov berasiz, view ichidagi saqlangan query asl jadvallarda bajariladi va natija jadvaldek qaytadi</title>
  <defs>
    <marker id="strelka" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="380" fill="#f8fafc"/>

  <text x="360" y="40" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">VIEW — saqlangan query'ga qo'yilgan nom</text>

  <!-- Siz (query) qutisi -->
  <text x="120" y="110" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">Siz</text>
  <rect x="30" y="120" width="180" height="110" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="120" y="152" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">SELECT *</text>
  <text x="120" y="174" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">FROM v_ijara_toliq</text>
  <text x="120" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">WHERE ...</text>
  <text x="120" y="218" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">xuddi oddiy jadvaldek</text>

  <!-- VIEW qutisi -->
  <text x="365" y="85" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#d97706">VIEW (v_ijara_toliq)</text>
  <rect x="270" y="95" width="190" height="160" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="365" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Ichida faqat</text>
  <text x="365" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">query MATNI:</text>
  <text x="365" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">4 jadvalli JOIN</text>
  <text x="365" y="202" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">ma'lumot saqlamaydi!</text>
  <text x="365" y="236" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">"oyna" / "yorliq"</text>

  <!-- Asl jadvallar -->
  <text x="610" y="75" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">Asl jadvallar</text>
  <rect x="530" y="85" width="160" height="44" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="610" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">ijaralar</text>
  <rect x="530" y="140" width="160" height="44" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="610" y="167" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">azolar</text>
  <rect x="530" y="195" width="160" height="44" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="610" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">kitoblar</text>
  <rect x="530" y="250" width="160" height="44" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="610" y="277" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">mualliflar</text>

  <!-- Strelkalar: so'rov -->
  <line x1="210" y1="150" x2="266" y2="150" stroke="#475569" stroke-width="2.5" marker-end="url(#strelka)"/>
  <text x="239" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">so'rov</text>

  <line x1="460" y1="150" x2="526" y2="150" stroke="#475569" stroke-width="2.5" marker-end="url(#strelka)"/>
  <text x="493" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">bajaradi</text>

  <!-- Strelkalar: natija qaytadi -->
  <line x1="528" y1="210" x2="464" y2="210" stroke="#16a34a" stroke-width="2.5" marker-end="url(#strelka)"/>
  <text x="496" y="228" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#16a34a">qatorlar</text>

  <line x1="270" y1="210" x2="214" y2="210" stroke="#16a34a" stroke-width="2.5" marker-end="url(#strelka)"/>
  <text x="241" y="228" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#16a34a">natija</text>

  <!-- Pastdagi izoh -->
  <text x="360" y="330" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Har murojaatda asl query QAYTA bajariladi — view nusxa emas</text>
  <text x="360" y="354" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Jadvallarga yangi qator qo'shilsa, view'da darhol ko'rinadi</text>
</svg>
