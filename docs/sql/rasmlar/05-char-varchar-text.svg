<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">
  <title>CHAR, VARCHAR va TEXT taqqoslash: 'abc' matni har bir turda qancha joy egallaydi</title>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="400" fill="#f8fafc"/>

  <text x="360" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">CHAR, VARCHAR va TEXT — joyni qanday egallaydi?</text>

  <!-- CHAR(10) qatori -->
  <text x="40" y="106" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">CHAR(10)</text>
  <!-- 3 ta to'lgan katak -->
  <rect x="160" y="82" width="30" height="36" fill="#2563eb" stroke="#94a3b8"/>
  <text x="175" y="106" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#f8fafc">a</text>
  <rect x="190" y="82" width="30" height="36" fill="#2563eb" stroke="#94a3b8"/>
  <text x="205" y="106" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#f8fafc">b</text>
  <rect x="220" y="82" width="30" height="36" fill="#2563eb" stroke="#94a3b8"/>
  <text x="235" y="106" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#f8fafc">c</text>
  <!-- 7 ta bo'sh (probel) katak -->
  <rect x="250" y="82" width="30" height="36" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <rect x="280" y="82" width="30" height="36" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <rect x="310" y="82" width="30" height="36" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <rect x="340" y="82" width="30" height="36" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <rect x="370" y="82" width="30" height="36" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <rect x="400" y="82" width="30" height="36" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <rect x="430" y="82" width="30" height="36" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="355" y="106" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">probellar</text>
  <text x="480" y="100" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">doim 10 joy band</text>
  <text x="480" y="118" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(qolganini to'ldiradi)</text>

  <!-- VARCHAR(10) qatori -->
  <text x="40" y="184" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">VARCHAR(10)</text>
  <!-- uzunlik bayti -->
  <rect x="160" y="160" width="30" height="36" fill="#d97706" stroke="#94a3b8"/>
  <text x="175" y="184" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#f8fafc">3</text>
  <rect x="190" y="160" width="30" height="36" fill="#16a34a" stroke="#94a3b8"/>
  <text x="205" y="184" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#f8fafc">a</text>
  <rect x="220" y="160" width="30" height="36" fill="#16a34a" stroke="#94a3b8"/>
  <text x="235" y="184" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#f8fafc">b</text>
  <rect x="250" y="160" width="30" height="36" fill="#16a34a" stroke="#94a3b8"/>
  <text x="265" y="184" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#f8fafc">c</text>
  <text x="300" y="184" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">uzunlik + 3 belgi</text>
  <text x="480" y="178" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">faqat kerakli joy</text>
  <text x="480" y="196" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(joy tejaladi)</text>

  <!-- TEXT qatori -->
  <text x="40" y="262" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#475569">TEXT</text>
  <rect x="160" y="238" width="300" height="40" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="310" y="263" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Uzun maqola, izoh... (~64 KB gacha)</text>
  <text x="480" y="256" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">katta matnlar uchun</text>
  <text x="480" y="274" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(hajmi baytda o'lchanadi)</text>

  <!-- Qoida -->
  <rect x="40" y="312" width="640" height="62" rx="10" fill="#e2e8f0" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="338" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Qoida: oddiy matn → VARCHAR(N) · qat'iy uzunlikdagi kod → CHAR(N)</text>
  <text x="360" y="360" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">maqola, katta izoh → TEXT</text>
</svg>
