<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340">
  <title>Loyiha qurish yo'li: talablar, schema, CREATE, test ma'lumot, query'lar, hisobot va jilo</title>
  <defs>
    <marker id="lq-strelka" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="340" fill="#f8fafc"/>

  <text x="360" y="38" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Loyiha qurish yo'li — 6 qadam</text>

  <!-- 1: Talablar -->
  <rect x="30" y="70" width="200" height="80" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="54" cy="94" r="12" fill="#2563eb"/>
  <text x="54" y="99" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">1</text>
  <text x="74" y="99" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Talablar</text>
  <text x="50" y="120" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">tizim nimani saqlaydi,</text>
  <text x="50" y="137" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">qanday savollar bor?</text>

  <!-- 2: Schema -->
  <rect x="260" y="70" width="200" height="80" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="284" cy="94" r="12" fill="#2563eb"/>
  <text x="284" y="99" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">2</text>
  <text x="304" y="99" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Schema (qog'ozda)</text>
  <text x="280" y="120" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">jadvallar, ustunlar,</text>
  <text x="280" y="137" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">bog'lanishlar (3, 20-bob)</text>

  <!-- 3: CREATE -->
  <rect x="490" y="70" width="200" height="80" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="514" cy="94" r="12" fill="#2563eb"/>
  <text x="514" y="99" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">3</text>
  <text x="534" y="99" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">CREATE</text>
  <text x="510" y="120" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">FK, CHECK, UNIQUE</text>
  <text x="510" y="137" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">(4, 18-boblar)</text>

  <!-- 4: Test ma'lumot -->
  <rect x="490" y="200" width="200" height="80" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="514" cy="224" r="12" fill="#d97706"/>
  <text x="514" y="229" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">4</text>
  <text x="534" y="229" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Test ma'lumot</text>
  <text x="510" y="250" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">INSERT — boy, xilma-xil</text>
  <text x="510" y="267" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">data (6-bob)</text>

  <!-- 5: Query'lar -->
  <rect x="260" y="200" width="200" height="80" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="284" cy="224" r="12" fill="#d97706"/>
  <text x="284" y="229" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">5</text>
  <text x="304" y="229" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Query'lar</text>
  <text x="280" y="250" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">savollarga javob</text>
  <text x="280" y="267" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">(7–16-boblar)</text>

  <!-- 6: Hisobot va jilo -->
  <rect x="30" y="200" width="200" height="80" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="54" cy="224" r="12" fill="#16a34a"/>
  <text x="54" y="229" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">6</text>
  <text x="74" y="229" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Hisobot va jilo</text>
  <text x="50" y="250" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">VIEW, indeks, EXPLAIN</text>
  <text x="50" y="267" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">(21–23-boblar)</text>

  <!-- strelkalar -->
  <line x1="230" y1="110" x2="256" y2="110" stroke="#475569" stroke-width="2.5" marker-end="url(#lq-strelka)"/>
  <line x1="460" y1="110" x2="486" y2="110" stroke="#475569" stroke-width="2.5" marker-end="url(#lq-strelka)"/>
  <line x1="590" y1="150" x2="590" y2="196" stroke="#475569" stroke-width="2.5" marker-end="url(#lq-strelka)"/>
  <line x1="490" y1="240" x2="464" y2="240" stroke="#475569" stroke-width="2.5" marker-end="url(#lq-strelka)"/>
  <line x1="260" y1="240" x2="234" y2="240" stroke="#475569" stroke-width="2.5" marker-end="url(#lq-strelka)"/>

  <!-- pastdagi izoh -->
  <text x="360" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Qiynalsangiz — tegishli bobga qayting. Real ishda ham yo'l xuddi shunday.</text>
</svg>
