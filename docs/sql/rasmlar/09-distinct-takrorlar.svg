  <text x="160" y="346" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">sheriyat</text>

  <!-- pill va strelka -->
  <rect x="278" y="180" width="164" height="26" rx="13" fill="#2563eb"/>
  <text x="360" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#f8fafc">SELECT DISTINCT janr</text>
  <line x1="265" y1="230" x2="455" y2="230" stroke="#475569" stroke-width="2.5" marker-end="url(#strelka9b)"/>

  <!-- o'ng panel: takrorsiz -->
