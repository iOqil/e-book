<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460">
  <title>DISTINCT takror qiymatlarni olib tashlaydi: 10 qatordan 4 ta takrorsiz janr qoladi</title>
