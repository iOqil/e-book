  <!-- pastki izohlar -->
  <text x="360" y="408" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">10 qator → 4 qator: har bir qiymatdan faqat bittasi qoladi</text>
  <text x="360" y="434" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">DISTINCT SELECT'dagi barcha ustunlarga birgalikda taalluqli — faqat birinchisiga emas</text>
