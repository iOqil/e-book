<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>Cursor sikli: OPEN natija toplamini tayyorlaydi, har FETCH qatorni o'qiydi, qator tugaganda NOT FOUND handler done=TRUE qiladi va sikl LEAVE bilan to'xtaydi, oxirida CLOSE</title>
  <defs>
    <marker id="strelka-cs" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>

  <text x="360" y="38" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Cursor sikli: OPEN &#8594; FETCH &#8594; CLOSE</text>

  <!-- 1. OPEN -->
  <rect x="270" y="62" width="180" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="88" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e40af">OPEN cur</text>
  <text x="360" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">SELECT bajariladi, natija tayyor</text>

  <line x1="360" y1="118" x2="360" y2="150" stroke="#475569" stroke-width="2.5" marker-end="url(#strelka-cs)"/>

  <!-- 2. FETCH -->
  <rect x="260" y="155" width="200" height="58" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="181" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">FETCH cur INTO v_id, ...</text>
  <text x="360" y="202" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">joriy qatorni o'zgaruvchiga ko'chiradi</text>

  <line x1="360" y1="213" x2="360" y2="245" stroke="#475569" stroke-width="2.5" marker-end="url(#strelka-cs)"/>

  <!-- 3. IF done? -->
  <polygon points="360,250 470,300 360,350 250,300" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="296" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#92400e">IF done?</text>
  <text x="360" y="316" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#92400e">NOT FOUND handler</text>

  <!-- HA (chiqish) -->
  <line x1="470" y1="300" x2="560" y2="300" stroke="#dc2626" stroke-width="2.5" marker-end="url(#strelka-cs)"/>
  <text x="515" y="291" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">HA</text>
  <rect x="560" y="272" width="135" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="627" y="298" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">LEAVE sikl</text>
  <text x="627" y="317" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#991b1b">qatorlar tugadi</text>

  <!-- YO'Q (ishlov) -->
  <line x1="250" y1="300" x2="150" y2="300" stroke="#16a34a" stroke-width="2.5" marker-end="url(#strelka-cs)"/>
  <text x="200" y="291" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">YO'Q</text>
  <rect x="25" y="272" width="125" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="87" y="298" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#166534">Qator bilan</text>
  <text x="87" y="317" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#166534">ish bajar</text>

  <!-- qaytish FETCH ga -->
  <line x1="87" y1="272" x2="87" y2="184" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="87" y1="184" x2="256" y2="184" stroke="#16a34a" stroke-width="2.5" marker-end="url(#strelka-cs)"/>
  <text x="120" y="176" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#16a34a">keyingi FETCH</text>

  <!-- CLOSE -->
  <line x1="627" y1="328" x2="627" y2="375" stroke="#475569" stroke-width="2.5" marker-end="url(#strelka-cs)"/>
  <rect x="540" y="380" width="175" height="48" rx="10" fill="#1e293b"/>
  <text x="627" y="409" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">CLOSE cur</text>

  <!-- izoh -->
  <text x="300" y="400" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">FETCH dan keyin darrov IF done tekshiruvi &#8594;</text>
  <text x="300" y="420" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">aks holda oxirgi qator ikki marta ishlanadi</text>
</svg>
