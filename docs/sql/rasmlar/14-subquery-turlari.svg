<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <title>Subquery turlari: skalyar (bitta qiymat), ro'yxat (IN bilan) va correlated (tashqi qatorga bog'langan)</title>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="360" fill="#f8fafc"/>

  <text x="360" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Subquery'ning uch turi</text>

  <!-- 1: Skalyar -->
  <rect x="30" y="60" width="210" height="220" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="135" y="90" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">Skalyar</text>
  <text x="135" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">bitta qiymat qaytaradi</text>
  <line x1="50" y1="124" x2="220" y2="124" stroke="#94a3b8" stroke-width="1"/>
  <text x="45" y="150" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1e293b">narx &gt; (SELECT</text>
  <text x="45" y="168" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1e293b">  AVG(narx) ...)</text>
  <text x="135" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">=, &gt;, &lt; bilan ishlatiladi</text>
  <text x="135" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Ko'p qator qaytsa &#8212;</text>
  <text x="135" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">ERROR 1242!</text>

  <!-- 2: Ro'yxat -->
  <rect x="255" y="60" width="210" height="220" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="90" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">Ro'yxat (IN)</text>
  <text x="360" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">bir ustunli ro'yxat</text>
  <line x1="275" y1="124" x2="445" y2="124" stroke="#94a3b8" stroke-width="1"/>
  <text x="270" y="150" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1e293b">id IN (SELECT</text>
  <text x="270" y="168" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1e293b">  kitob_id ...)</text>
  <text x="360" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">IN / NOT IN bilan</text>
  <text x="360" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">xuddi (1, 2, 3) ro'yxati</text>
  <text x="360" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">kabi ishlaydi</text>

  <!-- 3: Correlated -->
  <rect x="480" y="60" width="210" height="220" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="585" y="90" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#d97706">Correlated</text>
  <text x="585" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tashqi qatorga bog'langan</text>
  <line x1="500" y1="124" x2="670" y2="124" stroke="#94a3b8" stroke-width="1"/>
  <text x="495" y="150" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1e293b">EXISTS (SELECT 1 ...</text>
  <text x="495" y="168" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1e293b">  i.azo_id = a.id)</text>
  <text x="585" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">tashqi querydagi HAR BIR</text>
  <text x="585" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">qator uchun qayta</text>
  <text x="585" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">tekshiriladi</text>

  <text x="360" y="322" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Subquery doim qavs ( ) ichida yoziladi &#8212; avval ichkisini alohida sinab ko'ring</text>
</svg>
