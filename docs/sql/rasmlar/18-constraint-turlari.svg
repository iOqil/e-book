<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <title>Constraint turlari: NOT NULL, UNIQUE, DEFAULT, CHECK, PRIMARY KEY, FOREIGN KEY — har biri jadvalni noto'g'ri ma'lumotdan qo'riqlaydi</title>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="360" fill="#f8fafc"/>

  <text x="360" y="40" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Constraint — jadvalning "qoidalari"</text>

  <!-- 1-qator -->
  <rect x="30" y="68" width="200" height="100" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="130" y="96" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">NOT NULL</text>
  <text x="130" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Bo'sh qiymat (NULL)</text>
  <text x="130" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">kiritib bo'lmaydi</text>

  <rect x="260" y="68" width="200" height="100" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="96" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">UNIQUE</text>
  <text x="360" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Qiymat takrorlanmaydi</text>
  <text x="360" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(bir nechta NULL mumkin)</text>

  <rect x="490" y="68" width="200" height="100" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="590" y="96" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#d97706">DEFAULT</text>
  <text x="590" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Qiymat berilmasa,</text>
  <text x="590" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">shu qiymat yoziladi</text>

  <!-- 2-qator -->
  <rect x="30" y="188" width="200" height="100" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="130" y="216" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#d97706">CHECK</text>
  <text x="130" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Shart bajarilishi kerak</text>
  <text x="130" y="258" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">masalan: narx &gt; 0</text>
  <text x="130" y="276" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">(MySQL 8.0.16+)</text>

  <rect x="260" y="188" width="200" height="100" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="216" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">PRIMARY KEY</text>
  <text x="360" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">NOT NULL + UNIQUE</text>
  <text x="360" y="258" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">qatorning asosiy</text>
  <text x="360" y="276" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">identifikatori</text>

  <rect x="490" y="188" width="200" height="100" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="590" y="216" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">FOREIGN KEY</text>
  <text x="590" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Boshqa jadvaldagi</text>
  <text x="590" y="258" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">mavjud qiymatga</text>
  <text x="590" y="276" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">ishora qilishi shart</text>

  <!-- pastdagi izoh -->
  <text x="360" y="330" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Dastur tekshirishni unutsa ham, baza unutmaydi — noto'g'ri ma'lumot KIRMAYDI</text>
</svg>
