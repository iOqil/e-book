<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410">
  <title>INNER JOIN va LEFT JOIN farqi: INNER faqat mosi bor qatorlarni, LEFT esa chap jadvalning hamma qatorini qaytaradi, mosi yo'qlarda NULL (jadvallar qisqartirilgan, davomi bor)</title>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="410" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">INNER JOIN vs LEFT JOIN — farq qayerda?</text>

  <!-- chap panel: INNER JOIN -->
  <text x="190" y="74" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#2563eb">INNER JOIN</text>
  <rect x="40" y="84" width="300" height="148" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <line x1="40" y1="114" x2="340" y2="114" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="40" y1="144" x2="340" y2="144" stroke="#94a3b8" stroke-width="1"/>
  <line x1="40" y1="174" x2="340" y2="174" stroke="#94a3b8" stroke-width="1"/>
  <line x1="40" y1="204" x2="340" y2="204" stroke="#94a3b8" stroke-width="1"/>
  <line x1="190" y1="84" x2="190" y2="232" stroke="#94a3b8" stroke-width="1"/>
  <text x="115" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">ism</text>
  <text x="265" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">olingan_sana</text>
  <text x="115" y="134" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Aziz Karimov</text>
  <text x="265" y="134" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">2026-05-01</text>
  <text x="115" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Malika Tosheva</text>
  <text x="265" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">2026-05-10</text>
  <text x="115" y="194" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Jasur Aliyev</text>
  <text x="265" y="194" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">2026-04-01</text>
  <text x="115" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">... (davomi bor)</text>
  <text x="265" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">...</text>
  <text x="190" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">Kitob olmagan a'zo ro'yxatdan tushib qoladi</text>

  <!-- o'ng panel: LEFT JOIN -->
  <text x="530" y="74" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#16a34a">LEFT JOIN</text>
  <rect x="380" y="84" width="300" height="178" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="382" y="205" width="296" height="27" fill="#fef3c7"/>
  <line x1="380" y1="114" x2="680" y2="114" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="380" y1="144" x2="680" y2="144" stroke="#94a3b8" stroke-width="1"/>
  <line x1="380" y1="174" x2="680" y2="174" stroke="#94a3b8" stroke-width="1"/>
  <line x1="380" y1="204" x2="680" y2="204" stroke="#94a3b8" stroke-width="1"/>
  <line x1="380" y1="234" x2="680" y2="234" stroke="#94a3b8" stroke-width="1"/>
  <line x1="530" y1="84" x2="530" y2="262" stroke="#94a3b8" stroke-width="1"/>
  <text x="455" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">ism</text>
  <text x="605" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">olingan_sana</text>
  <text x="455" y="134" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Aziz Karimov</text>
  <text x="605" y="134" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">2026-05-01</text>
  <text x="455" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Malika Tosheva</text>
  <text x="605" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">2026-05-10</text>
  <text x="455" y="194" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Jasur Aliyev</text>
  <text x="605" y="194" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">2026-04-01</text>
  <text x="455" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Sevara Nizomova</text>
  <text x="605" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">NULL</text>
  <text x="455" y="254" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">... (davomi bor)</text>
  <text x="605" y="254" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">...</text>
  <text x="530" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">HAMMA a'zo bor, mosi yo'q bo'lsa — NULL</text>

  <!-- pastki izoh -->
  <text x="360" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Rasmda qatorlarning bir qismi ko'rsatilgan: ko'p kitob olgan a'zo (mas. Aziz) har ijarasi uchun alohida qatorda chiqadi</text>
  <text x="360" y="350" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">INNER JOIN: faqat ikkala tomonda ham mosi bor qatorlar</text>
  <text x="360" y="378" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">LEFT JOIN: chap (FROM'dagi) jadval to'liq saqlanadi</text>
</svg>
