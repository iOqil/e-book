<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>UNION va UNION ALL farqi: UNION takror qatorlarni olib tashlaydi, UNION ALL hammasini qoldiradi</title>
  <defs>
    <marker id="strelka13u" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>

  <!-- sarlavha -->
  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">UNION va UNION ALL — farq takrorlarda</text>

  <!-- 1-SELECT qutisi -->
  <text x="255" y="68" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">1-SELECT natijasi</text>
  <rect x="180" y="78" width="150" height="90" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="255" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Olma</text>
  <text x="255" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Anor</text>
  <text x="255" y="152" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Uzum</text>

  <!-- 2-SELECT qutisi -->
  <text x="465" y="68" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">2-SELECT natijasi</text>
  <rect x="390" y="78" width="150" height="90" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="465" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Anor</text>
  <text x="465" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Nok</text>

  <!-- plyus belgisi -->
  <text x="360" y="130" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="24" font-weight="bold" fill="#475569">+</text>

  <!-- birlashish chiziqlari -->
  <line x1="255" y1="170" x2="360" y2="198" stroke="#94a3b8" stroke-width="2"/>
  <line x1="465" y1="170" x2="360" y2="198" stroke="#94a3b8" stroke-width="2"/>

  <!-- ikki natijaga strelkalar -->
  <line x1="360" y1="198" x2="235" y2="242" stroke="#475569" stroke-width="2.5" marker-end="url(#strelka13u)"/>
  <line x1="360" y1="198" x2="485" y2="242" stroke="#475569" stroke-width="2.5" marker-end="url(#strelka13u)"/>

  <!-- UNION yorlig'i -->
  <rect x="195" y="200" width="80" height="24" rx="6" fill="#16a34a"/>
  <text x="235" y="217" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#f8fafc">UNION</text>

  <!-- UNION ALL yorlig'i -->
  <rect x="435" y="200" width="100" height="24" rx="6" fill="#2563eb"/>
  <text x="485" y="217" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#f8fafc">UNION ALL</text>

  <!-- UNION natijasi -->
  <text x="235" y="266" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">UNION natijasi</text>
  <rect x="135" y="276" width="200" height="110" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="235" y="302" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Olma</text>
  <text x="235" y="326" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Anor</text>
  <text x="235" y="350" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Uzum</text>
  <text x="235" y="374" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Nok</text>
  <text x="235" y="412" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">4 qator — takror 'Anor' bitta qoldi</text>

  <!-- UNION ALL natijasi -->
  <text x="485" y="266" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">UNION ALL natijasi</text>
  <rect x="385" y="276" width="200" height="122" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="485" y="300" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Olma</text>
  <text x="485" y="321" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Anor</text>
  <text x="485" y="342" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Uzum</text>
  <text x="485" y="363" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">Anor</text>
  <text x="514" y="363" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#dc2626">← takror!</text>
  <text x="485" y="384" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Nok</text>
  <text x="485" y="422" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">5 qator — takror ham qoldi (tezroq)</text>
</svg>
