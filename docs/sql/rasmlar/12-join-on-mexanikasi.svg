<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>JOIN ON mexanikasi: kitoblar jadvalidagi muallif_id qiymati mualliflar jadvalidagi id bilan ulanadi va qatorlar yonma-yon qo'shiladi</title>
  <defs>
    <marker id="jm-blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="jm-green" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="jm-amber" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">JOIN ON: ikki jadval qatorlari qanday ulanadi</text>

  <!-- kitoblar jadvali -->
  <text x="190" y="72" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">kitoblar</text>
  <rect x="40" y="82" width="300" height="120" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <line x1="40" y1="112" x2="340" y2="112" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="40" y1="142" x2="340" y2="142" stroke="#94a3b8" stroke-width="1"/>
  <line x1="40" y1="172" x2="340" y2="172" stroke="#94a3b8" stroke-width="1"/>
  <line x1="85" y1="82" x2="85" y2="202" stroke="#94a3b8" stroke-width="1"/>
  <line x1="235" y1="82" x2="235" y2="202" stroke="#94a3b8" stroke-width="1"/>
  <text x="62" y="102" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">id</text>
  <text x="160" y="102" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">nomi</text>
  <text x="287" y="102" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">muallif_id</text>
  <text x="62" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">1</text>
  <text x="160" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Otkan kunlar</text>
  <text x="287" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">1</text>
  <text x="62" y="162" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">3</text>
  <text x="160" y="162" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Sariq devni minib</text>
  <text x="287" y="162" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">2</text>
  <text x="62" y="192" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">5</text>
  <text x="160" y="192" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Ozbegim</text>
  <text x="287" y="192" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#d97706">3</text>

  <!-- mualliflar jadvali -->
  <text x="575" y="72" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">mualliflar</text>
  <rect x="460" y="82" width="230" height="120" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <line x1="460" y1="112" x2="690" y2="112" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="460" y1="142" x2="690" y2="142" stroke="#94a3b8" stroke-width="1"/>
  <line x1="460" y1="172" x2="690" y2="172" stroke="#94a3b8" stroke-width="1"/>
  <line x1="505" y1="82" x2="505" y2="202" stroke="#94a3b8" stroke-width="1"/>
  <text x="482" y="102" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">id</text>
  <text x="597" y="102" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">ism</text>
  <text x="482" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">1</text>
  <text x="597" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Abdulla Qodiriy</text>
  <text x="482" y="162" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">2</text>
  <text x="597" y="162" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Xudoyberdi Toxtaboyev</text>
  <text x="482" y="192" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#d97706">3</text>
  <text x="597" y="192" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Erkin Vohidov</text>

  <!-- ulanish chiziqlari -->
  <text x="400" y="76" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">ON muallif_id = id</text>
  <line x1="344" y1="127" x2="452" y2="127" stroke="#2563eb" stroke-width="2" marker-end="url(#jm-blue)"/>
  <line x1="344" y1="157" x2="452" y2="157" stroke="#16a34a" stroke-width="2" marker-end="url(#jm-green)"/>
  <line x1="344" y1="187" x2="452" y2="187" stroke="#d97706" stroke-width="2" marker-end="url(#jm-amber)"/>

  <!-- natija jadvali -->
  <text x="360" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#475569">Natija (JOIN'dan keyin):</text>
  <rect x="110" y="260" width="500" height="120" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <line x1="110" y1="290" x2="610" y2="290" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="110" y1="320" x2="610" y2="320" stroke="#94a3b8" stroke-width="1"/>
  <line x1="110" y1="350" x2="610" y2="350" stroke="#94a3b8" stroke-width="1"/>
  <line x1="360" y1="260" x2="360" y2="380" stroke="#94a3b8" stroke-width="1"/>
  <text x="235" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">nomi</text>
  <text x="485" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">ism</text>
  <text x="235" y="310" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Otkan kunlar</text>
  <text x="485" y="310" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Abdulla Qodiriy</text>
  <text x="235" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Sariq devni minib</text>
  <text x="485" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Xudoyberdi Toxtaboyev</text>
  <text x="235" y="370" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Ozbegim</text>
  <text x="485" y="370" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Erkin Vohidov</text>

  <text x="360" y="416" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Har bir kitob qatoriga ON sharti mos kelgan muallif qatori yonma-yon yelimlanadi</text>
</svg>
