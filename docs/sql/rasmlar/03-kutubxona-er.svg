<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460">
  <title>Kutubxona bazasi ER-diagrammasi: mualliflar, kitoblar, azolar va ijaralar jadvallari, FK bog'lanishlari bilan</title>
  <defs>
    <marker id="fk-strelka-kutubxona" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="460" fill="#f8fafc"/>

  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">KUTUBXONA bazasi — 4 jadval (ER)</text>

  <!-- mualliflar -->
  <text x="115" y="78" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">mualliflar</text>
  <rect x="30" y="86" width="170" height="98" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="44" y="110" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">id (PK)</text>
  <text x="44" y="130" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">ism</text>
  <text x="44" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">davlat</text>
  <text x="44" y="170" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">tugilgan_yil</text>

  <!-- kitoblar -->
  <text x="360" y="78" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">kitoblar</text>
  <rect x="270" y="86" width="180" height="158" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="284" y="110" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">id (PK)</text>
  <text x="284" y="130" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">nomi</text>
  <text x="284" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">muallif_id (FK)</text>
  <text x="284" y="170" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">yil</text>
  <text x="284" y="190" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">sahifa</text>
  <text x="284" y="210" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">janr</text>
  <text x="284" y="230" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">nusxa_soni</text>

  <!-- azolar -->
  <text x="605" y="78" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">azolar</text>
  <rect x="520" y="86" width="170" height="98" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="534" y="110" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">id (PK)</text>
  <text x="534" y="130" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">ism</text>
  <text x="534" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">telefon</text>
  <text x="534" y="170" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">qoshilgan_sana</text>

  <!-- ijaralar (bog'lovchi) -->
  <text x="360" y="308" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#d97706">ijaralar</text>
  <rect x="270" y="316" width="180" height="118" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="284" y="340" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">id (PK)</text>
  <text x="284" y="360" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">kitob_id (FK)</text>
  <text x="284" y="380" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">azo_id (FK)</text>
  <text x="284" y="400" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">olingan_sana</text>
  <text x="284" y="420" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">qaytarilgan_sana</text>

  <!-- strelkalar: FK -> ishora qilingan jadval -->
  <line x1="268" y1="145" x2="206" y2="145" stroke="#475569" stroke-width="2.5" marker-end="url(#fk-strelka-kutubxona)"/>
  <line x1="310" y1="314" x2="310" y2="250" stroke="#475569" stroke-width="2.5" marker-end="url(#fk-strelka-kutubxona)"/>
  <path d="M452,375 L605,375 L605,190" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#fk-strelka-kutubxona)"/>

  <!-- izoh -->
  <text x="360" y="452" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">PK — asosiy kalit · FK — tashqi kalit · to'q sariq nom — bog'lovchi jadval</text>
</svg>
