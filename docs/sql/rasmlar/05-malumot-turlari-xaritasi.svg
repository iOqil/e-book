<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450">
  <title>MySQL ma'lumot turlari xaritasi: sonlar, matnlar, sana-vaqt va maxsus turlar</title>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="450" fill="#f8fafc"/>

  <text x="360" y="38" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">MySQL ma'lumot turlari xaritasi</text>

  <!-- Sonlar -->
  <rect x="40" y="65" width="310" height="155" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="195" y="93" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#2563eb">Sonlar</text>
  <text x="60" y="122" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">TINYINT, INT, BIGINT — butun</text>
  <text x="60" y="147" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">DECIMAL(M,D) — pul, aniq kasr</text>
  <text x="60" y="172" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">FLOAT / DOUBLE — taxminiy kasr</text>
  <text x="60" y="200" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">narx DECIMAL(12,2), yosh TINYINT</text>

  <!-- Matnlar -->
  <rect x="370" y="65" width="310" height="155" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="525" y="93" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#16a34a">Matnlar</text>
  <text x="390" y="122" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">CHAR(N) — qat'iy uzunlik</text>
  <text x="390" y="147" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">VARCHAR(N) — eng ko'p ishlatiladi</text>
  <text x="390" y="172" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">TEXT — katta matn (maqola)</text>
  <text x="390" y="200" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ism VARCHAR(100), kod CHAR(2)</text>

  <!-- Sana va vaqt -->
  <rect x="40" y="240" width="310" height="155" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="195" y="268" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#d97706">Sana va vaqt</text>
  <text x="60" y="297" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">DATE — 2026-06-09</text>
  <text x="60" y="322" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">TIME — 14:30:00</text>
  <text x="60" y="347" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">DATETIME — sana + vaqt birga</text>
  <text x="60" y="372" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">TIMESTAMP — vaqt mintaqasini biladi</text>

  <!-- Maxsus turlar -->
  <rect x="370" y="240" width="310" height="155" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="525" y="268" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#475569">Maxsus turlar</text>
  <text x="390" y="297" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">ENUM — ro'yxatdan faqat bittasi</text>
  <text x="390" y="322" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">BOOLEAN — 0 yoki 1</text>
  <text x="390" y="347" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">JSON — strukturali ma'lumot</text>
  <text x="390" y="375" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">holat ENUM('yangi','tugadi')</text>

  <!-- Pastdagi izoh -->
  <text x="360" y="428" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">Har bir ustunga savol bering: bu yerda NIMA saqlanadi?</text>
</svg>
