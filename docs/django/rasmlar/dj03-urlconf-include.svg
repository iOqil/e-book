<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Segoe UI, sans-serif">
  <title>URLconf qidiruvi: root urls.py include() orqali app urls.py ga uzatadi</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">URL qidiruvi: include() bilan tarmoqlanish</text>

  <!-- kiruvchi URL -->
  <rect x="270" y="55" width="220" height="46" rx="8" fill="#2563eb"/>
  <text x="380" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">GET /blog/maqola/42/</text>

  <!-- root urls -->
  <rect x="180" y="135" width="400" height="100" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="380" y="160" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">mysite/urls.py (root URLconf)</text>
  <text x="200" y="186" font-size="13" fill="#334155" font-family="Consolas, monospace">path("admin/", admin.site.urls)</text>
  <text x="200" y="210" font-size="13" fill="#16a34a" font-family="Consolas, monospace">path("blog/", include("blog.urls"))  &#8592; mos</text>
  <text x="380" y="228" text-anchor="middle" font-size="13" fill="#64748b">"blog/" qismi olib tashlanadi, qolgani uzatiladi</text>

  <!-- app urls -->
  <rect x="180" y="275" width="400" height="105" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#16a34a">blog/urls.py  (app_name = "blog")</text>
  <text x="200" y="326" font-size="13" fill="#334155" font-family="Consolas, monospace">path("", views.home)</text>
  <text x="200" y="350" font-size="13" fill="#16a34a" font-family="Consolas, monospace">path("maqola/&lt;int:id&gt;/", views.maqola_detali)  &#8592; mos</text>
  <text x="380" y="370" text-anchor="middle" font-size="13" fill="#64748b">qolgan "maqola/42/" shu yerda topiladi, id=42</text>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <line x1="380" y1="101" x2="380" y2="131" stroke="#334155" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="380" y1="235" x2="380" y2="271" stroke="#334155" stroke-width="2" marker-end="url(#a2)"/>
  <text x="470" y="258" font-size="13" fill="#64748b">"maqola/42/"</text>
</svg>
