<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Segoe UI, sans-serif">
  <title>Django signal oqimi: jo'natuvchi, signal va qabul qiluvchi o'rtasidagi aloqa</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">Signal oqimi: kim kimga xabar beradi</text>

  <!-- Sender -->
  <rect x="40" y="80" width="200" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563eb">Jo'natuvchi (sender)</text>
  <text x="140" y="135" text-anchor="middle" font-size="14" fill="#334155">Post.save()</text>
  <text x="140" y="158" text-anchor="middle" font-size="14" fill="#334155">User.save()</text>
  <text x="140" y="181" text-anchor="middle" font-size="14" fill="#334155">post.delete()</text>

  <!-- Signal -->
  <rect x="300" y="80" width="200" height="120" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#b45309">Signal</text>
  <text x="400" y="135" text-anchor="middle" font-size="14" fill="#334155">post_save</text>
  <text x="400" y="158" text-anchor="middle" font-size="14" fill="#334155">pre_delete</text>
  <text x="400" y="181" text-anchor="middle" font-size="14" fill="#334155">m2m_changed</text>

  <!-- Receiver -->
  <rect x="560" y="80" width="200" height="120" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#16a34a">Qabul qiluvchi</text>
  <text x="660" y="131" text-anchor="middle" font-size="14" fill="#334155">@receiver</text>
  <text x="660" y="154" text-anchor="middle" font-size="14" fill="#334155">def profil_yarat</text>
  <text x="660" y="177" text-anchor="middle" font-size="14" fill="#334155">(sender, instance...)</text>

  <!-- Arrows -->
  <defs>
    <marker id="a19" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <line x1="240" y1="140" x2="296" y2="140" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a19)"/>
  <text x="268" y="130" text-anchor="middle" font-size="13" fill="#64748b">jo'natadi</text>
  <line x1="500" y1="140" x2="556" y2="140" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a19)"/>
  <text x="528" y="130" text-anchor="middle" font-size="13" fill="#64748b">chaqiradi</text>

  <!-- Connect line description -->
  <rect x="120" y="250" width="520" height="58" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="380" y="276" text-anchor="middle" font-size="14" fill="#1e293b">Bog'lanish: @receiver(post_save, sender=Post) yoki signal.connect(func)</text>
  <text x="380" y="297" text-anchor="middle" font-size="13" fill="#64748b">Jo'natuvchi qabul qiluvchini bilmaydi -- bu bo'shashtirilgan (loose) aloqa</text>

  <!-- Bottom note -->
  <rect x="40" y="340" width="680" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="366" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Muhim: signal sinxron ishlaydi</text>
  <text x="380" y="389" text-anchor="middle" font-size="13" fill="#334155">Qabul qiluvchi save() tugagunicha to'liq bajariladi -- sekin bo'lsa, so'rov ham sekinlashadi</text>
</svg>
