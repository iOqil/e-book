<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360">
  <title>Test Client so'rov-javob oqimi (server ishlamasdan)</title>
  <rect x="0" y="0" width="760" height="360" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Test Client: server ishga tushmaydi</text>

  <!-- client -->
  <rect x="30" y="100" width="160" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="140" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">self.client</text>
  <text x="110" y="168" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">.get(url)</text>
  <text x="110" y="190" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">.post(url, data)</text>

  <line x1="190" y1="160" x2="285" y2="160" stroke="#2563eb" stroke-width="3" marker-end="url(#m)"/>
  <text x="237" y="148" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">to'g'ridan</text>

  <!-- django -->
  <rect x="290" y="80" width="200" height="160" rx="10" fill="#eff6ff" stroke="#16a34a" stroke-width="2"/>
  <text x="390" y="108" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">URLconf -> view</text>
  <text x="390" y="135" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">middleware</text>
  <text x="390" y="158" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">view mantiq</text>
  <text x="390" y="181" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">template render</text>
  <text x="390" y="210" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">(HTTP/socket yo'q)</text>

  <line x1="490" y1="160" x2="575" y2="160" stroke="#16a34a" stroke-width="3" marker-end="url(#n)"/>

  <!-- response -->
  <rect x="580" y="90" width="150" height="140" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="655" y="118" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#f59e0b">response</text>
  <text x="655" y="146" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">.status_code</text>
  <text x="655" y="168" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">.content</text>
  <text x="655" y="190" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">.context</text>
  <text x="655" y="212" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">.json()</text>

  <text x="380" y="290" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">assertEqual / assertContains / assertRedirects / assertTemplateUsed</text>
  <text x="380" y="320" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Client view'ni Python ichida chaqiradi: tarmoq ham, runserver ham kerakmas.</text>

  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="n" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
