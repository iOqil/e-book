<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420">
  <title>JWT autentifikatsiya va egalik tekshiruvi oqimi</title>
  <rect width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b">JWT olish, ishlatish va egalik tekshiruvi</text>

  <!-- step 1 -->
  <rect x="30" y="70" width="200" height="70" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="98" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">1. POST /api/token/</text>
  <text x="130" y="120" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">username + parol</text>

  <!-- step 2 -->
  <rect x="280" y="70" width="200" height="70" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="98" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">2. Token qaytadi</text>
  <text x="380" y="120" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">access + refresh</text>

  <!-- step 3 -->
  <rect x="530" y="70" width="200" height="70" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="630" y="92" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">3. Har so'rovda</text>
  <text x="630" y="113" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Authorization:</text>
  <text x="630" y="131" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Bearer &lt;access&gt;</text>

  <line x1="230" y1="105" x2="278" y2="105" stroke="#64748b" stroke-width="2" marker-end="url(#b)"/>
  <line x1="480" y1="105" x2="528" y2="105" stroke="#64748b" stroke-width="2" marker-end="url(#b)"/>

  <!-- permission gate -->
  <rect x="180" y="200" width="400" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="380" y="226" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">IsAuthenticatedOrReadOnly</text>
  <text x="380" y="248" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">GET hammaga ochiq, yozish uchun token shart</text>
  <line x1="630" y1="140" x2="450" y2="198" stroke="#64748b" stroke-width="2" marker-end="url(#b)"/>

  <!-- object level -->
  <rect x="180" y="300" width="400" height="60" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="326" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">IsAuthorOrReadOnly (obyekt darajasi)</text>
  <text x="380" y="348" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">obj.author == request.user bo'lsa o'zgartirish mumkin</text>
  <line x1="380" y1="260" x2="380" y2="298" stroke="#64748b" stroke-width="2" marker-end="url(#b)"/>

  <!-- outcomes -->
  <rect x="120" y="385" width="220" height="26" rx="6" fill="#16a34a"/>
  <text x="230" y="403" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#ffffff">Ega -> 200 / 204 OK</text>
  <rect x="420" y="385" width="220" height="26" rx="6" fill="#dc2626"/>
  <text x="530" y="403" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#ffffff">Begona -> 403 Forbidden</text>
  <line x1="300" y1="360" x2="240" y2="383" stroke="#16a34a" stroke-width="2" marker-end="url(#b)"/>
  <line x1="460" y1="360" x2="520" y2="383" stroke="#dc2626" stroke-width="2" marker-end="url(#b)"/>

  <defs>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
