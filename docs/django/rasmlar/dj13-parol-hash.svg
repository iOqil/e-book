<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="Segoe UI, sans-serif">
  <title>Parol hashlash: set_password va check_password</title>
  <rect width="780" height="400" fill="#f8fafc"/>
  <text x="390" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Parol hech qachon ochiq saqlanmaydi</text>

  <!-- set_password flow -->
  <rect x="30" y="70" width="170" height="56" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="115" y="94" font-size="14" fill="#334155" text-anchor="middle" font-weight="bold">Ochiq parol</text>
  <text x="115" y="115" font-size="13" fill="#334155" text-anchor="middle">"Parol12345"</text>

  <rect x="270" y="64" width="220" height="68" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="90" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="bold">set_password()</text>
  <text x="380" y="112" font-size="13" fill="#334155" text-anchor="middle">PBKDF2 + tasodifiy tuz (salt)</text>
  <line x1="200" y1="98" x2="268" y2="98" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="560" y="64" width="200" height="68" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="660" y="90" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="bold">DB'da hash</text>
  <text x="660" y="112" font-size="13" fill="#334155" text-anchor="middle">pbkdf2_sha256$...</text>
  <line x1="490" y1="98" x2="558" y2="98" stroke="#16a34a" stroke-width="2" marker-end="url(#ar)"/>

  <!-- check_password flow -->
  <rect x="30" y="220" width="170" height="56" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="115" y="244" font-size="14" fill="#334155" text-anchor="middle" font-weight="bold">Kirgan parol</text>
  <text x="115" y="265" font-size="13" fill="#334155" text-anchor="middle">foydalanuvchidan</text>

  <rect x="270" y="214" width="220" height="68" rx="8" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="240" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="bold">check_password()</text>
  <text x="380" y="262" font-size="13" fill="#334155" text-anchor="middle">xuddi shu salt bilan hashlab</text>
  <line x1="200" y1="248" x2="268" y2="248" stroke="#f59e0b" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="560" y="200" width="200" height="44" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="660" y="227" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="bold">mos -> True</text>
  <rect x="560" y="254" width="200" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="660" y="281" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">mos emas -> False</text>
  <line x1="490" y1="240" x2="558" y2="224" stroke="#16a34a" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="490" y1="258" x2="558" y2="274" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>

  <text x="390" y="350" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="bold">Hashdan ochiq parolni qaytarib bo'lmaydi (bir tomonlama)</text>
  <text x="390" y="376" font-size="13" fill="#64748b" text-anchor="middle">create_user / UserCreationForm bularni avtomatik bajaradi</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
