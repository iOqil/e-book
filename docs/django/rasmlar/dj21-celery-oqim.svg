<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Segoe UI, sans-serif">
  <title>Celery arxitekturasi: ishlab chiqaruvchi, broker va ishchi orasidagi vazifa oqimi</title>
  <rect width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Celery: broker, ishchi, vazifa</text>
  <text x="380" y="58" font-size="13" fill="#64748b" text-anchor="middle">og'ir ishni so'rov-javob siklidan tashqariga chiqarish</text>

  <!-- Producer: Django view -->
  <rect x="40" y="120" width="180" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="148" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">Django view</text>
  <text x="130" y="172" font-size="13" fill="#334155" text-anchor="middle">(ishlab chiqaruvchi)</text>
  <text x="130" y="196" font-size="13" fill="#1e293b" text-anchor="middle">task.delay(arg)</text>
  <text x="130" y="216" font-size="13" fill="#16a34a" text-anchor="middle">darhol javob qaytaradi</text>

  <!-- Broker -->
  <rect x="290" y="120" width="180" height="110" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="148" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">Broker</text>
  <text x="380" y="172" font-size="13" fill="#334155" text-anchor="middle">(Redis / RabbitMQ)</text>
  <text x="380" y="196" font-size="13" fill="#1e293b" text-anchor="middle">vazifalar navbati</text>
  <text x="380" y="216" font-size="13" fill="#64748b" text-anchor="middle">xabar saqlovchi</text>

  <!-- Worker -->
  <rect x="540" y="120" width="180" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="630" y="148" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">Worker</text>
  <text x="630" y="172" font-size="13" fill="#334155" text-anchor="middle">(ishchi jarayon)</text>
  <text x="630" y="196" font-size="13" fill="#1e293b" text-anchor="middle">vazifani bajaradi</text>
  <text x="630" y="216" font-size="13" fill="#64748b" text-anchor="middle">alohida process</text>

  <!-- arrows -->
  <line x1="220" y1="160" x2="288" y2="160" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="254" y="150" font-size="13" fill="#2563eb" text-anchor="middle">1. yuborish</text>
  <line x1="470" y1="160" x2="538" y2="160" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="504" y="150" font-size="13" fill="#16a34a" text-anchor="middle">2. olish</text>

  <!-- result backend -->
  <rect x="290" y="300" width="180" height="90" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="380" y="328" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">Result backend</text>
  <text x="380" y="352" font-size="13" fill="#334155" text-anchor="middle">(ixtiyoriy)</text>
  <text x="380" y="374" font-size="13" fill="#64748b" text-anchor="middle">natijani saqlaydi</text>
  <line x1="630" y1="230" x2="450" y2="298" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5" marker-end="url(#ar2)"/>
  <text x="560" y="285" font-size="13" fill="#64748b">3. natija</text>

  <!-- eager note -->
  <rect x="40" y="300" width="220" height="90" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="150" y="326" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">Eager rejim (test)</text>
  <text x="150" y="348" font-size="13" fill="#334155" text-anchor="middle">broker va worker YO'Q</text>
  <text x="150" y="370" font-size="13" fill="#334155" text-anchor="middle">delay() darhol bajaradi</text>

  <text x="380" y="420" font-size="13" fill="#1e293b" text-anchor="middle">Ishlab chiqarishda: 3 ta alohida narsa kerak — broker, worker, (ixtiyoriy) result backend</text>

  <defs>
    <marker id="ar" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#16a34a"/>
    </marker>
    <marker id="ar2" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
