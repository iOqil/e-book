<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Segoe UI, sans-serif">
  <title>Django ORM Python kodini SQL so'roviga aylantiradi va baza javobini Python obyektlariga qaytaradi</title>
  <rect x="0" y="0" width="760" height="360" fill="#f8fafc"/>
  <text x="380" y="32" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">ORM: Python kodi -&gt; SQL -&gt; Python obyektlari</text>

  <!-- Python ORM box -->
  <rect x="30" y="70" width="300" height="90" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="96" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">Python (siz yozasiz)</text>
  <text x="50" y="124" font-size="14" fill="#1e293b" font-family="Consolas, monospace">Maqola.objects.filter(</text>
  <text x="66" y="146" font-size="14" fill="#1e293b" font-family="Consolas, monospace">sarlavha__startswith="Django")</text>

  <!-- SQL box -->
  <rect x="430" y="70" width="300" height="90" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="580" y="96" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">SQL (Django yaratadi)</text>
  <text x="448" y="124" font-size="13" fill="#1e293b" font-family="Consolas, monospace">SELECT * FROM blog_maqola</text>
  <text x="448" y="146" font-size="13" fill="#1e293b" font-family="Consolas, monospace">WHERE sarlavha LIKE 'Django%'</text>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <!-- arrow python -> sql -->
  <line x1="330" y1="100" x2="426" y2="100" stroke="#334155" stroke-width="2" marker-end="url(#a2)"/>
  <text x="378" y="92" font-size="13" fill="#334155" text-anchor="middle">tarjima</text>

  <!-- DB box -->
  <rect x="430" y="220" width="300" height="60" rx="8" fill="#eef2ff" stroke="#94a3b8" stroke-width="2"/>
  <text x="580" y="256" font-size="15" fill="#334155" text-anchor="middle">Ma'lumotlar bazasi</text>

  <!-- sql -> db -->
  <line x1="580" y1="160" x2="580" y2="216" stroke="#334155" stroke-width="2" marker-end="url(#a2)"/>
  <text x="620" y="192" font-size="13" fill="#334155" text-anchor="middle">bajaradi</text>

  <!-- db -> python obyektlari -->
  <rect x="30" y="220" width="300" height="60" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="180" y="248" font-size="15" font-weight="bold" fill="#f59e0b" text-anchor="middle">QuerySet (obyektlar)</text>
  <text x="180" y="269" font-size="13" fill="#334155" text-anchor="middle">[&lt;Maqola: Django asoslari&gt;]</text>

  <path d="M430,250 L336,250" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a2)"/>
  <text x="383" y="242" font-size="13" fill="#dc2626" text-anchor="middle">qatorlar</text>

  <text x="380" y="325" font-size="14" fill="#334155" text-anchor="middle">SQL yozmaysiz: ORM uni siz uchun ishlab beradi. Baza turini almashtirsangiz ham kod o'zgarmaydi.</text>
</svg>
