<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Segoe UI, sans-serif">
  <title>APIView so'rov-javob sikli: request.data dan Response gacha</title>
  <rect width="800" height="420" fill="#f8fafc"/>
  <text x="400" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">APIView so'rov-javob sikli (POST)</text>

  <!-- client -->
  <rect x="30" y="170" width="150" height="70" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="105" y="200" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="bold">Klient</text>
  <text x="105" y="222" font-size="13" fill="#334155" text-anchor="middle">JSON yuboradi</text>

  <!-- parser -->
  <rect x="230" y="80" width="170" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="315" y="106" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="bold">Parser</text>
  <text x="315" y="126" font-size="13" fill="#334155" text-anchor="middle">JSON -&gt; request.data</text>

  <!-- serializer in -->
  <rect x="430" y="80" width="170" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="515" y="106" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="bold">Serializer(data=...)</text>
  <text x="515" y="126" font-size="13" fill="#334155" text-anchor="middle">is_valid() + save()</text>

  <!-- DB -->
  <rect x="640" y="170" width="140" height="70" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="710" y="200" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="bold">Baza</text>
  <text x="710" y="222" font-size="13" fill="#334155" text-anchor="middle">yangi qator</text>

  <!-- serializer out -->
  <rect x="430" y="278" width="170" height="62" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="515" y="304" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="bold">serializer.data</text>
  <text x="515" y="324" font-size="13" fill="#334155" text-anchor="middle">obyekt -&gt; dict</text>

  <!-- response -->
  <rect x="230" y="278" width="170" height="62" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="315" y="304" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="bold">Response(data, 201)</text>
  <text x="315" y="324" font-size="13" fill="#334155" text-anchor="middle">JSON + status kod</text>

  <!-- arrows -->
  <line x1="180" y1="195" x2="290" y2="144" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="400" y1="111" x2="428" y2="111" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="600" y1="125" x2="650" y2="168" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="650" y1="225" x2="600" y2="290" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="428" y1="309" x2="402" y2="309" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="290" y1="290" x2="180" y2="240" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>

  <text x="315" y="380" font-size="13" fill="#64748b" text-anchor="middle">Xato bo'lsa: is_valid() False -&gt; Response(serializer.errors, status=400)</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
