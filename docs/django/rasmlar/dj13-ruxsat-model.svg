<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="Segoe UI, sans-serif">
  <title>Ruxsatlar modeli: User, Group, Permission munosabati</title>
  <rect width="780" height="430" fill="#f8fafc"/>
  <text x="390" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Kim nimaga ruxsatli: User, Group, Permission</text>

  <!-- User -->
  <rect x="40" y="150" width="180" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="178" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="bold">User</text>
  <line x1="55" y1="190" x2="205" y2="190" stroke="#94a3b8" stroke-width="1"/>
  <text x="55" y="212" font-size="13" fill="#334155">is_superuser</text>
  <text x="55" y="234" font-size="13" fill="#334155">groups (M2M)</text>
  <text x="55" y="256" font-size="13" fill="#334155">user_permissions</text>

  <!-- Group -->
  <rect x="300" y="60" width="180" height="96" rx="8" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <text x="390" y="88" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="bold">Group</text>
  <line x1="315" y1="100" x2="465" y2="100" stroke="#94a3b8" stroke-width="1"/>
  <text x="315" y="122" font-size="13" fill="#334155">name = "Muharrirlar"</text>
  <text x="315" y="144" font-size="13" fill="#334155">permissions (M2M)</text>

  <!-- Permission -->
  <rect x="560" y="150" width="190" height="120" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="655" y="178" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="bold">Permission</text>
  <line x1="575" y1="190" x2="735" y2="190" stroke="#94a3b8" stroke-width="1"/>
  <text x="575" y="212" font-size="13" fill="#334155">codename: add_post</text>
  <text x="575" y="234" font-size="13" fill="#334155">change_post</text>
  <text x="575" y="256" font-size="13" fill="#334155">delete_post, view_post</text>

  <!-- User -> Group -->
  <line x1="220" y1="200" x2="300" y2="120" stroke="#f59e0b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="248" y="150" font-size="13" fill="#f59e0b" font-weight="bold">a'zo</text>

  <!-- Group -> Permission -->
  <line x1="480" y1="120" x2="560" y2="200" stroke="#16a34a" stroke-width="2" marker-end="url(#ar)"/>
  <text x="535" y="150" font-size="13" fill="#16a34a" font-weight="bold">ega</text>

  <!-- User -> Permission (direct) -->
  <line x1="220" y1="232" x2="560" y2="232" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="390" y="224" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">to'g'ridan-to'g'ri ruxsat (kamroq ishlatiladi)</text>

  <!-- result box -->
  <rect x="200" y="320" width="380" height="80" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="390" y="348" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="bold">user.has_perm("app.add_post")</text>
  <text x="390" y="372" font-size="13" fill="#334155" text-anchor="middle">guruh ruxsatlari + shaxsiy ruxsatlar tekshiriladi</text>
  <text x="390" y="392" font-size="13" fill="#16a34a" text-anchor="middle">superuser bo'lsa -> har doim True</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
