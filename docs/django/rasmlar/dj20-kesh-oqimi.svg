<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440">
  <title>Low-level kesh oqimi: cache miss va cache hit yo'llari</title>
  <rect width="800" height="440" fill="#f8fafc"/>
  <text x="400" y="34" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">cache.get(kalit) — hit bo'lsa tez, miss bo'lsa bazaga boradi</text>

  <!-- request -->
  <rect x="40" y="80" width="150" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="106" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">So'rov keldi</text>
  <text x="115" y="126" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">qiymat kerak</text>

  <!-- decision -->
  <polygon points="320,108 390,72 460,108 390,144" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="390" y="104" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">cache.get()</text>
  <text x="390" y="124" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">keshda bormi?</text>

  <line x1="190" y1="108" x2="318" y2="108" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="318,108 306,103 306,113" fill="#94a3b8"/>

  <!-- HIT path -->
  <line x1="460" y1="108" x2="620" y2="108" stroke="#16a34a" stroke-width="3"/>
  <polygon points="620,108 608,103 608,113" fill="#16a34a"/>
  <text x="535" y="98" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">HIT (bor)</text>
  <rect x="620" y="80" width="150" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="695" y="106" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">Keshdan qaytar</text>
  <text x="695" y="126" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">baza tegilmaydi</text>

  <!-- MISS path -->
  <line x1="390" y1="144" x2="390" y2="210" stroke="#dc2626" stroke-width="3"/>
  <polygon points="390,210 385,198 395,198" fill="#dc2626"/>
  <text x="430" y="180" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">MISS (yo'q)</text>

  <rect x="270" y="214" width="240" height="56" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="390" y="240" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="middle">Og'ir hisob / ORM so'rov</text>
  <text x="390" y="260" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">SELECT ... (sekin)</text>

  <line x1="390" y1="270" x2="390" y2="320" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="390,320 385,308 395,308" fill="#94a3b8"/>
  <rect x="270" y="324" width="240" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="390" y="350" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">cache.set(kalit, qiymat)</text>
  <text x="390" y="370" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">keyingi so'rov uchun saqlanadi</text>

  <text x="400" y="416" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">Birinchi so'rov sekin (miss), keyingilari tez (hit) — bu get_or_set ning ichki mantig'i.</text>
</svg>
