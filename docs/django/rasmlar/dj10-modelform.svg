<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Segoe UI, sans-serif">
  <title>ModelForm: model va forma o'rtasidagi ko'prik</title>
  <rect width="760" height="380" fill="#f8fafc"/>
  <text x="380" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">ModelForm: modeldan formaga avtomatik</text>

  <!-- Model -->
  <rect x="40" y="70" width="200" height="180" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="98" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="bold">models.py</text>
  <line x1="40" y1="110" x2="240" y2="110" stroke="#94a3b8" stroke-width="1"/>
  <text x="60" y="136" font-size="13" fill="#334155">class Maqola(Model):</text>
  <text x="74" y="160" font-size="13" fill="#334155">sarlavha = CharField</text>
  <text x="74" y="184" font-size="13" fill="#334155">matn = TextField</text>
  <text x="74" y="208" font-size="13" fill="#334155">email = EmailField</text>
  <text x="74" y="232" font-size="13" fill="#334155">yoshi = IntegerField</text>

  <!-- ModelForm -->
  <rect x="290" y="70" width="200" height="180" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="390" y="98" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">ModelForm</text>
  <line x1="290" y1="110" x2="490" y2="110" stroke="#94a3b8" stroke-width="1"/>
  <text x="310" y="136" font-size="13" fill="#334155">class Meta:</text>
  <text x="324" y="160" font-size="13" fill="#334155">model = Maqola</text>
  <text x="324" y="184" font-size="13" fill="#334155">fields = [...]</text>
  <text x="310" y="220" font-size="13" fill="#64748b">maydonlar avtomatik</text>
  <text x="310" y="238" font-size="13" fill="#64748b">yaratiladi</text>

  <!-- arrow model -> form -->
  <line x1="240" y1="160" x2="288" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#m)"/>

  <!-- HTML / DB -->
  <rect x="540" y="70" width="190" height="80" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <text x="635" y="96" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="bold">HTML forma</text>
  <text x="635" y="118" font-size="13" fill="#334155" text-anchor="middle">{{ form.as_p }}</text>
  <text x="635" y="138" font-size="13" fill="#334155" text-anchor="middle">input, textarea...</text>
  <line x1="490" y1="120" x2="538" y2="105" stroke="#f59e0b" stroke-width="2" marker-end="url(#m)"/>

  <rect x="540" y="178" width="190" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="635" y="204" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="bold">form.save()</text>
  <text x="635" y="226" font-size="13" fill="#334155" text-anchor="middle">-> baza qatori</text>
  <text x="635" y="246" font-size="13" fill="#334155" text-anchor="middle">INSERT INTO ...</text>
  <line x1="490" y1="200" x2="538" y2="210" stroke="#16a34a" stroke-width="2" marker-end="url(#m)"/>

  <text x="380" y="318" font-size="14" fill="#334155" text-anchor="middle" font-weight="bold">Bir marta model yozasiz -> forma, validatsiya, saqlash bepul keladi</text>
  <text x="380" y="344" font-size="13" fill="#64748b" text-anchor="middle">forms.Form -da har maydonni qo'lda yozardingiz; ModelForm uni modeldan oladi</text>

  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
