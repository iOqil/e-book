<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Segoe UI, sans-serif">
  <title>sync_to_async oqimi: sinxron ORM chaqiruvini alohida thread'ga ko'chirib await qilish</title>
  <rect width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">sync_to_async oqimi</text>
  <text x="380" y="58" font-size="13" fill="#64748b" text-anchor="middle">sinxron ORM'ni async view ichida xavfsiz chaqirish</text>

  <!-- arrow marker -->
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- async view (event loop) lane -->
  <rect x="30" y="90" width="700" height="120" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="50" y="116" font-size="15" font-weight="bold" fill="#2563eb">async view (event loop)</text>

  <rect x="55" y="132" width="180" height="56" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="145" y="156" font-size="13" fill="#1e293b" text-anchor="middle">async def view</text>
  <text x="145" y="176" font-size="13" fill="#64748b" text-anchor="middle">await sync_to_async(...)()</text>

  <rect x="520" y="132" width="190" height="56" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="615" y="156" font-size="13" fill="#1e293b" text-anchor="middle">natija await orqali</text>
  <text x="615" y="176" font-size="13" fill="#16a34a" text-anchor="middle">qaytadi, loop davom etadi</text>

  <!-- event loop free note -->
  <text x="380" y="162" font-size="13" fill="#64748b" text-anchor="middle">kutish paytida</text>
  <text x="380" y="180" font-size="13" fill="#64748b" text-anchor="middle">loop boshqa so'rovga xizmat qiladi</text>

  <!-- separate thread lane -->
  <rect x="30" y="250" width="700" height="120" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <text x="50" y="276" font-size="15" font-weight="bold" fill="#f59e0b">alohida thread (sinxron)</text>

  <rect x="55" y="292" width="200" height="56" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="155" y="316" font-size="13" fill="#1e293b" text-anchor="middle">sinxron funksiya</text>
  <text x="155" y="336" font-size="13" fill="#64748b" text-anchor="middle">Maqola.objects.count()</text>

  <rect x="300" y="292" width="180" height="56" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="390" y="316" font-size="13" fill="#1e293b" text-anchor="middle">ORM bazaga so'rov</text>
  <text x="390" y="336" font-size="13" fill="#64748b" text-anchor="middle">bloklab kutadi (xavfsiz)</text>

  <!-- arrows: view -> thread (down) -->
  <line x1="145" y1="188" x2="145" y2="290" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/>
  <text x="160" y="240" font-size="13" fill="#2563eb">1. sync chaqiruvni thread'ga ko'chiradi</text>

  <!-- arrow inside thread: sync fn -> ORM -->
  <line x1="255" y1="320" x2="298" y2="320" stroke="#f59e0b" stroke-width="2"/>

  <!-- arrow: thread result -> view result (up) -->
  <line x1="480" y1="320" x2="615" y2="190" stroke="#16a34a" stroke-width="2" marker-end="url(#arg)"/>
  <text x="500" y="260" font-size="13" fill="#16a34a">2. tugagach natija await'ga qaytadi</text>

  <text x="380" y="404" font-size="13" fill="#1e293b" text-anchor="middle">SynchronousOnlyOperation xatosi bo'lmaydi: bloklash event loop'da emas, alohida thread'da</text>
</svg>
