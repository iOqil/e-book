<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Segoe UI, sans-serif">
  <title>Inline tahrirlash: ota model formasi ichida bog'liq farzand yozuvlarini boshqarish</title>
  <rect width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="32" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">Inline: ota va farzandni bir sahifada</text>

  <!-- parent form -->
  <rect x="60" y="60" width="640" height="320" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="90" font-size="16" font-weight="bold" fill="#2563eb">Maqola formasi (ota)</text>

  <rect x="80" y="106" width="600" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="92" y="126" font-size="13" fill="#64748b">Sarlavha: Django admin panel</text>
  <rect x="80" y="144" width="600" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="92" y="164" font-size="13" fill="#64748b">Muallif: Oqil</text>

  <!-- inline section -->
  <rect x="80" y="190" width="600" height="170" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="96" y="216" font-size="15" font-weight="bold" fill="#16a34a">Izohlar (TabularInline — farzand)</text>

  <!-- inline table header -->
  <rect x="96" y="228" width="568" height="28" fill="#16a34a"/>
  <text x="108" y="247" font-size="13" font-weight="bold" fill="#ffffff">Muallif ismi</text>
  <text x="300" y="247" font-size="13" font-weight="bold" fill="#ffffff">Matn</text>
  <text x="560" y="247" font-size="13" font-weight="bold" fill="#ffffff">Tasdiqlangan</text>

  <rect x="96" y="256" width="568" height="28" fill="#ffffff"/>
  <text x="108" y="275" font-size="13" fill="#1e293b">Ali</text>
  <text x="300" y="275" font-size="13" fill="#1e293b">Juda foydali maqola!</text>
  <text x="590" y="275" font-size="13" fill="#16a34a">ha</text>

  <rect x="96" y="284" width="568" height="28" fill="#f8fafc"/>
  <text x="108" y="303" font-size="13" fill="#1e293b">Vali</text>
  <text x="300" y="303" font-size="13" fill="#1e293b">Rahmat ustoz</text>
  <text x="590" y="303" font-size="13" fill="#dc2626">yo'q</text>

  <rect x="96" y="320" width="200" height="26" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="108" y="338" font-size="13" fill="#2563eb">+ Yana bitta izoh qo'shish</text>

  <!-- relation note -->
  <text x="380" y="400" font-size="14" fill="#334155" text-anchor="middle">Izoh modelida Maqola'ga ForeignKey bor — shuning uchun u inline bo'la oladi</text>
</svg>
