<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Segoe UI, sans-serif">
  <title>as_view() va dispatch: so'rov metodi qaysi funksiyaga boradi</title>
  <rect width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">CBV ichida: as_view() -&gt; dispatch() -&gt; get()/post()</text>

  <!-- request -->
  <rect x="40" y="70" width="180" height="64" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <text x="130" y="98" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">HTTP so'rov</text>
  <text x="130" y="120" font-size="13" fill="#334155" text-anchor="middle">GET /maqola/5/</text>

  <line x1="220" y1="102" x2="288" y2="102" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- as_view -->
  <rect x="290" y="70" width="200" height="64" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="390" y="96" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">as_view()</text>
  <text x="390" y="118" font-size="13" fill="#334155" text-anchor="middle">instans yasab, dispatch ga uzatadi</text>

  <line x1="390" y1="134" x2="390" y2="172" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- dispatch -->
  <rect x="270" y="174" width="240" height="78" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="390" y="200" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">dispatch(request)</text>
  <text x="390" y="224" font-size="13" fill="#334155" text-anchor="middle">request.method ni o'qiydi</text>
  <text x="390" y="244" font-size="13" fill="#334155" text-anchor="middle">mos metodga yo'naltiradi</text>

  <!-- branches -->
  <line x1="320" y1="252" x2="200" y2="300" stroke="#16a34a" stroke-width="2" marker-end="url(#g)"/>
  <line x1="390" y1="252" x2="390" y2="300" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
  <line x1="460" y1="252" x2="580" y2="300" stroke="#dc2626" stroke-width="2" marker-end="url(#r)"/>

  <rect x="100" y="302" width="190" height="60" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="195" y="328" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="bold">GET -&gt; self.get()</text>
  <text x="195" y="350" font-size="13" fill="#334155" text-anchor="middle">sahifani ko'rsatadi</text>

  <rect x="295" y="302" width="190" height="60" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="390" y="328" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">POST -&gt; self.post()</text>
  <text x="390" y="350" font-size="13" fill="#334155" text-anchor="middle">formani qayta ishlaydi</text>

  <rect x="490" y="302" width="200" height="60" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="590" y="328" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">DELETE (yo'q)</text>
  <text x="590" y="350" font-size="13" fill="#334155" text-anchor="middle">405 Method Not Allowed</text>

  <text x="380" y="408" font-size="14" fill="#334155" text-anchor="middle">Siz faqat get/post yozasiz; dispatch va as_view tayyor — bu CBV ning yuragi</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
</svg>
