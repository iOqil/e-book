<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Segoe UI, sans-serif">
  <title>Changelist sahifasi: list_display, list_filter, search_fields va list_editable qaysi qismni boshqaradi</title>
  <rect width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="32" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">Changelist: qaysi sozlama qayerda</text>

  <!-- main panel -->
  <rect x="40" y="60" width="500" height="380" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- search bar -->
  <rect x="60" y="80" width="300" height="34" rx="6" fill="#f1f5f9" stroke="#dc2626" stroke-width="2"/>
  <text x="74" y="102" font-size="14" fill="#64748b">Qidiruv...</text>

  <!-- table header -->
  <rect x="60" y="128" width="460" height="34" fill="#2563eb"/>
  <text x="74" y="150" font-size="13" font-weight="bold" fill="#ffffff">Sarlavha</text>
  <text x="240" y="150" font-size="13" font-weight="bold" fill="#ffffff">Muallif</text>
  <text x="340" y="150" font-size="13" font-weight="bold" fill="#ffffff">Holat</text>
  <text x="440" y="150" font-size="13" font-weight="bold" fill="#ffffff">Korishlar</text>

  <!-- rows -->
  <rect x="60" y="162" width="460" height="32" fill="#ffffff"/>
  <text x="74" y="183" font-size="13" fill="#1e293b">Django nima</text>
  <text x="240" y="183" font-size="13" fill="#1e293b">Oqil</text>
  <rect x="335" y="168" width="90" height="20" rx="4" fill="#fef3c7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="340" y="183" font-size="13" fill="#1e293b">nashr</text>
  <text x="440" y="183" font-size="13" fill="#1e293b">120</text>

  <rect x="60" y="194" width="460" height="32" fill="#f8fafc"/>
  <text x="74" y="215" font-size="13" fill="#1e293b">ORM asoslari</text>
  <text x="240" y="215" font-size="13" fill="#1e293b">Oqil</text>
  <rect x="335" y="200" width="90" height="20" rx="4" fill="#fef3c7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="340" y="215" font-size="13" fill="#1e293b">qoralama</text>
  <text x="440" y="215" font-size="13" fill="#1e293b">5</text>

  <rect x="60" y="226" width="460" height="32" fill="#ffffff"/>
  <text x="74" y="247" font-size="13" fill="#1e293b">Admin panel</text>
  <text x="240" y="247" font-size="13" fill="#1e293b">Oqil</text>
  <rect x="335" y="232" width="90" height="20" rx="4" fill="#fef3c7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="340" y="247" font-size="13" fill="#1e293b">nashr</text>
  <text x="440" y="247" font-size="13" fill="#1e293b">88</text>

  <!-- action bar -->
  <rect x="60" y="276" width="280" height="32" rx="6" fill="#f1f5f9" stroke="#2563eb" stroke-width="2"/>
  <text x="74" y="297" font-size="13" fill="#1e293b">Amal: Tanlanganlarni nashr qilish...</text>

  <!-- filter sidebar -->
  <rect x="560" y="60" width="160" height="380" rx="10" fill="#eff6ff" stroke="#f59e0b" stroke-width="2"/>
  <text x="640" y="86" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="middle">Filtr</text>
  <text x="576" y="116" font-size="13" fill="#334155" font-weight="bold">Holat:</text>
  <text x="588" y="138" font-size="13" fill="#1e293b">Hammasi</text>
  <text x="588" y="160" font-size="13" fill="#2563eb">Nashr qilingan</text>
  <text x="588" y="182" font-size="13" fill="#1e293b">Qoralama</text>
  <text x="576" y="214" font-size="13" fill="#334155" font-weight="bold">Kategoriya:</text>
  <text x="588" y="236" font-size="13" fill="#1e293b">Hammasi</text>

  <!-- labels with leaders -->
  <text x="60" y="408" font-size="13" fill="#dc2626" font-weight="bold">search_fields → qidiruv qutisi</text>
  <text x="60" y="428" font-size="13" fill="#2563eb" font-weight="bold">list_display → ustunlar · list_editable → tahrirlanadigan ustun (sariq)</text>
  <text x="560" y="460" font-size="13" fill="#f59e0b" font-weight="bold">list_filter → o'ng panel</text>
</svg>
