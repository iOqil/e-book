<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" font-family="Segoe UI, sans-serif">
  <title>Django xavfsizlik qatlamlari: HTTPS/HSTS, ALLOWED_HOSTS, CSRF, clickjacking, XSS himoyasi va check --deploy ularning hammasini tekshiradi</title>
  <rect x="0" y="0" width="840" height="500" fill="#f8fafc"/>
  <text x="30" y="40" font-size="22" font-weight="bold" fill="#1e293b">Xavfsizlik qatlamlari (so'rov yo'lida)</text>

  <!-- request -->
  <rect x="30" y="70" width="150" height="60" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="105" y="98" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">Brauzer</text>
  <text x="105" y="118" font-size="13" fill="#334155" text-anchor="middle">HTTP so'rov</text>

  <line x1="180" y1="100" x2="240" y2="100" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- layers stack -->
  <rect x="245" y="65" width="560" height="70" rx="8" fill="#16a34a" opacity="0.12" stroke="#16a34a" stroke-width="2"/>
  <text x="262" y="92" font-size="15" font-weight="bold" fill="#16a34a">1. SecurityMiddleware</text>
  <text x="262" y="116" font-size="13" fill="#334155">HTTPS'ga yo'naltirish (SSL_REDIRECT) + HSTS header + nosniff</text>

  <rect x="245" y="145" width="560" height="60" rx="8" fill="#2563eb" opacity="0.10" stroke="#2563eb" stroke-width="2"/>
  <text x="262" y="170" font-size="15" font-weight="bold" fill="#2563eb">2. ALLOWED_HOSTS tekshiruvi</text>
  <text x="262" y="192" font-size="13" fill="#334155">notanish Host -&gt; 400 Bad Request (Host header hujumiga qarshi)</text>

  <rect x="245" y="215" width="560" height="60" rx="8" fill="#f59e0b" opacity="0.16" stroke="#f59e0b" stroke-width="2"/>
  <text x="262" y="240" font-size="15" font-weight="bold" fill="#1e293b">3. CsrfViewMiddleware</text>
  <text x="262" y="262" font-size="13" fill="#334155">POST/PUT/DELETE'da CSRF token -&gt; yo'q bo'lsa 403 Forbidden</text>

  <rect x="245" y="285" width="560" height="60" rx="8" fill="#dc2626" opacity="0.10" stroke="#dc2626" stroke-width="2"/>
  <text x="262" y="310" font-size="15" font-weight="bold" fill="#dc2626">4. XFrameOptionsMiddleware</text>
  <text x="262" y="332" font-size="13" fill="#334155">X-Frame-Options: DENY (clickjacking himoyasi)</text>

  <!-- view -->
  <rect x="345" y="365" width="360" height="50" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="525" y="396" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">View + Template (XSS: autoescape)</text>
  <line x1="525" y1="345" x2="525" y2="363" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- check deploy banner -->
  <rect x="30" y="435" width="780" height="48" rx="8" fill="#2563eb" opacity="0.14" stroke="#2563eb" stroke-width="2"/>
  <text x="420" y="465" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">manage.py check --deploy -- bu qatlamlarning hammasi to'g'ri yoqilganini tekshiradi</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
