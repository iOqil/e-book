<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="Segoe UI, sans-serif">
  <title>.env fayl va muhit o'zgaruvchilari orqali maxfiy ma'lumotlar settings.py ga keladi, kod ichida saqlanmaydi va git'ga tushmaydi</title>
  <rect x="0" y="0" width="820" height="460" fill="#f8fafc"/>
  <text x="30" y="42" font-size="22" font-weight="bold" fill="#1e293b">Maxfiy ma'lumotlar: .env -&gt; muhit -&gt; settings</text>

  <!-- .env file -->
  <rect x="40" y="80" width="230" height="180" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="155" y="108" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">.env (mahalliy fayl)</text>
  <text x="60" y="138" font-size="13" fill="#334155" font-family="monospace">DJANGO_SECRET_KEY=...</text>
  <text x="60" y="162" font-size="13" fill="#334155" font-family="monospace">DJANGO_DEBUG=False</text>
  <text x="60" y="186" font-size="13" fill="#334155" font-family="monospace">DJANGO_ALLOWED_HOSTS=..</text>
  <text x="60" y="210" font-size="13" fill="#334155" font-family="monospace">DATABASE_URL=...</text>
  <text x="155" y="244" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">.gitignore ichida!</text>

  <!-- arrow -->
  <line x1="270" y1="170" x2="340" y2="170" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="305" y="158" font-size="13" fill="#64748b" text-anchor="middle">o'qiladi</text>

  <!-- process env -->
  <rect x="345" y="120" width="180" height="100" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="435" y="150" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">os.environ</text>
  <text x="435" y="174" font-size="13" fill="#334155" text-anchor="middle">jarayon muhiti</text>
  <text x="435" y="196" font-size="13" fill="#334155" text-anchor="middle">o'zgaruvchilari</text>

  <!-- arrow -->
  <line x1="525" y1="170" x2="595" y2="170" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="560" y="158" font-size="13" fill="#64748b" text-anchor="middle">env()</text>

  <!-- settings -->
  <rect x="600" y="120" width="180" height="100" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="690" y="150" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">settings.py</text>
  <text x="690" y="174" font-size="13" fill="#334155" text-anchor="middle">SECRET_KEY =</text>
  <text x="690" y="196" font-size="13" fill="#334155" text-anchor="middle">env("...")</text>

  <!-- prod note -->
  <rect x="345" y="280" width="435" height="70" rx="8" fill="#16a34a" opacity="0.12" stroke="#16a34a" stroke-width="2"/>
  <text x="562" y="308" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Production: .env yo'q — server panel/CI</text>
  <text x="562" y="332" font-size="14" fill="#334155" text-anchor="middle">to'g'ridan-to'g'ri muhit o'zgaruvchilarini beradi</text>

  <!-- bad note -->
  <rect x="40" y="370" width="740" height="60" rx="8" fill="#dc2626" opacity="0.10" stroke="#dc2626" stroke-width="2"/>
  <text x="410" y="398" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">XATO: SECRET_KEY ni to'g'ridan settings.py ichiga yozish</text>
  <text x="410" y="420" font-size="13" fill="#334155" text-anchor="middle">u git tarixiga tushadi va abadiy oshkor bo'ladi</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
