<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <title>Query optimizatsiya: N+1 muammosi va select_related yechimi</title>
  <rect width="800" height="450" fill="#f8fafc"/>
  <text x="400" y="34" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">So'rovlar soni — keshlashdan oldin shuni kamaytiring</text>

  <!-- LEFT: N+1 -->
  <rect x="30" y="58" width="350" height="350" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="205" y="86" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">N+1 muammosi (sekin)</text>
  <text x="205" y="108" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">Post.objects.all()  +  har post uchun .category</text>

  <rect x="60" y="124" width="290" height="34" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="74" y="146" font-family="Segoe UI" font-size="13" fill="#1e293b">1) SELECT * FROM post   (10 post)</text>

  <rect x="60" y="166" width="290" height="30" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="74" y="186" font-family="Segoe UI" font-size="13" fill="#1e293b">2) SELECT * FROM category WHERE id=1</text>
  <rect x="60" y="200" width="290" height="30" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="74" y="220" font-family="Segoe UI" font-size="13" fill="#1e293b">3) SELECT * FROM category WHERE id=2</text>
  <rect x="60" y="234" width="290" height="30" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="74" y="254" font-family="Segoe UI" font-size="13" fill="#1e293b">...   (har post uchun yana 1 ta)</text>
  <rect x="60" y="268" width="290" height="30" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="74" y="288" font-family="Segoe UI" font-size="13" fill="#1e293b">11) SELECT * FROM category WHERE id=2</text>

  <rect x="60" y="320" width="290" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="205" y="345" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#dc2626" text-anchor="middle">Jami: 11 so'rov</text>
  <text x="205" y="368" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">1 + N (N = 10 post)</text>

  <!-- RIGHT: select_related -->
  <rect x="420" y="58" width="350" height="350" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="595" y="86" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a" text-anchor="middle">select_related (tez)</text>
  <text x="595" y="108" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">Post.objects.select_related("category")</text>

  <rect x="450" y="150" width="290" height="120" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="595" y="180" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">1) SELECT post.*, category.*</text>
  <text x="595" y="204" font-family="Segoe UI" font-size="13" fill="#1e293b" text-anchor="middle">FROM post</text>
  <text x="595" y="226" font-family="Segoe UI" font-size="13" fill="#1e293b" text-anchor="middle">INNER JOIN category</text>
  <text x="595" y="248" font-family="Segoe UI" font-size="13" fill="#1e293b" text-anchor="middle">ON post.category_id = category.id</text>

  <rect x="450" y="320" width="290" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="595" y="345" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#16a34a" text-anchor="middle">Jami: 1 so'rov</text>
  <text x="595" y="368" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">JOIN bilan hammasi birga</text>

  <text x="400" y="432" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">assertNumQueries bilan buni testda aniq raqam bilan isbotlash mumkin.</text>
</svg>
