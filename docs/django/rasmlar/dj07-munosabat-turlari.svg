<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Segoe UI, sans-serif">
  <title>Django model munosabatlari uch turi: one-to-many, many-to-many, one-to-one</title>
  <rect width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Model munosabatlarining uch turi</text>

  <!-- One-to-many -->
  <text x="130" y="78" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563eb">One-to-Many (FK)</text>
  <rect x="60" y="92" width="140" height="40" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="117" text-anchor="middle" font-size="14" fill="#1e293b">Author (1)</text>
  <rect x="20" y="170" width="100" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="70" y="192" text-anchor="middle" font-size="13" fill="#334155">Post</text>
  <rect x="130" y="170" width="100" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="180" y="192" text-anchor="middle" font-size="13" fill="#334155">Post</text>
  <line x1="110" y1="132" x2="70" y2="170" stroke="#2563eb" stroke-width="2"/>
  <line x1="150" y1="132" x2="180" y2="170" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="232" text-anchor="middle" font-size="13" fill="#16a34a">1 muallif &#8594; ko'p post</text>

  <!-- Many-to-many -->
  <text x="380" y="78" text-anchor="middle" font-size="16" font-weight="bold" fill="#f59e0b">Many-to-Many (M2M)</text>
  <rect x="300" y="92" width="70" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="335" y="114" text-anchor="middle" font-size="13" fill="#334155">Post</text>
  <rect x="390" y="92" width="70" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="425" y="114" text-anchor="middle" font-size="13" fill="#334155">Post</text>
  <rect x="300" y="178" width="70" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="335" y="200" text-anchor="middle" font-size="13" fill="#334155">Tag</text>
  <rect x="390" y="178" width="70" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="425" y="200" text-anchor="middle" font-size="13" fill="#334155">Tag</text>
  <line x1="335" y1="126" x2="335" y2="178" stroke="#f59e0b" stroke-width="2"/>
  <line x1="335" y1="126" x2="425" y2="178" stroke="#f59e0b" stroke-width="2"/>
  <line x1="425" y1="126" x2="335" y2="178" stroke="#f59e0b" stroke-width="2"/>
  <line x1="425" y1="126" x2="425" y2="178" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="232" text-anchor="middle" font-size="13" fill="#16a34a">ko'p &#8596; ko'p</text>

  <!-- One-to-one -->
  <text x="640" y="78" text-anchor="middle" font-size="16" font-weight="bold" fill="#dc2626">One-to-One (O2O)</text>
  <rect x="570" y="92" width="140" height="40" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="640" y="117" text-anchor="middle" font-size="14" fill="#1e293b">User</text>
  <rect x="570" y="170" width="140" height="40" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="640" y="195" text-anchor="middle" font-size="14" fill="#1e293b">Profile</text>
  <line x1="640" y1="132" x2="640" y2="170" stroke="#dc2626" stroke-width="2"/>
  <text x="640" y="232" text-anchor="middle" font-size="13" fill="#16a34a">1 &#8596; 1</text>

  <!-- M2M join table tushuntirish -->
  <rect x="60" y="270" width="640" height="120" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="380" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">M2M ortida yashirin "join" jadval</text>
  <rect x="120" y="312" width="120" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="180" y="334" text-anchor="middle" font-size="13" fill="#1e293b">blog_post</text>
  <rect x="320" y="312" width="160" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="400" y="334" text-anchor="middle" font-size="13" fill="#1e293b">blog_post_tags</text>
  <rect x="560" y="312" width="120" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="620" y="334" text-anchor="middle" font-size="13" fill="#1e293b">blog_tag</text>
  <line x1="240" y1="329" x2="320" y2="329" stroke="#94a3b8" stroke-width="2"/>
  <line x1="480" y1="329" x2="560" y2="329" stroke="#94a3b8" stroke-width="2"/>
  <text x="400" y="372" text-anchor="middle" font-size="13" fill="#334155">Django bu jadvalni avtomatik yaratadi (post_id, tag_id)</text>
</svg>
