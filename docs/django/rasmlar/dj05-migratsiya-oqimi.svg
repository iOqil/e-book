<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="Segoe UI, sans-serif">
  <title>Migratsiya oqimi: model o'zgarishidan bazagacha</title>
  <rect x="0" y="0" width="780" height="440" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Migratsiya hayot sikli</text>

  <!-- 1. models.py -->
  <rect x="40" y="70" width="180" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">1. models.py</text>
  <text x="130" y="124" text-anchor="middle" font-size="13" fill="#334155">Modelni yozasiz</text>
  <text x="130" y="142" text-anchor="middle" font-size="13" fill="#334155">yoki o'zgartirasiz</text>

  <!-- strelka 1->2 -->
  <line x1="220" y1="110" x2="288" y2="110" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="288,110 274,103 274,117" fill="#94a3b8"/>
  <text x="254" y="60" text-anchor="middle" font-size="13" fill="#64748b">makemigrations</text>

  <!-- 2. migration fayl -->
  <rect x="290" y="70" width="200" height="80" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="390" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#f59e0b">2. 0001_initial.py</text>
  <text x="390" y="124" text-anchor="middle" font-size="13" fill="#334155">Django o'zgarishni</text>
  <text x="390" y="142" text-anchor="middle" font-size="13" fill="#334155">Python rejaga yozadi</text>

  <!-- strelka 2->3 -->
  <line x1="490" y1="110" x2="558" y2="110" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="558,110 544,103 544,117" fill="#94a3b8"/>
  <text x="524" y="60" text-anchor="middle" font-size="13" fill="#64748b">migrate</text>

  <!-- 3. baza -->
  <rect x="560" y="70" width="180" height="80" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="650" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#16a34a">3. Baza (DB)</text>
  <text x="650" y="124" text-anchor="middle" font-size="13" fill="#334155">SQL ishga tushadi,</text>
  <text x="650" y="142" text-anchor="middle" font-size="13" fill="#334155">jadval yaratiladi</text>

  <!-- middle: makemigrations vs migrate detail -->
  <rect x="60" y="200" width="300" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="210" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">makemigrations</text>
  <text x="78" y="252" font-size="13" fill="#334155">- Modelni o'qiydi</text>
  <text x="78" y="274" font-size="13" fill="#334155">- Oldingi holat bilan solishtiradi</text>
  <text x="78" y="296" font-size="13" fill="#334155">- Migratsiya FAYLI yozadi</text>
  <text x="78" y="314" font-size="13" fill="#dc2626">- Bazaga TEGMAYDI</text>

  <rect x="420" y="200" width="300" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="570" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">migrate</text>
  <text x="438" y="252" font-size="13" fill="#334155">- Qaysi fayl qo'llanmaganini biladi</text>
  <text x="438" y="274" font-size="13" fill="#334155">- Faylni SQL ga aylantiradi</text>
  <text x="438" y="296" font-size="13" fill="#334155">- SQL ni bazada ishlatadi</text>
  <text x="438" y="314" font-size="13" fill="#16a34a">- django_migrations ga belgilaydi</text>

  <!-- bottom note -->
  <rect x="120" y="356" width="540" height="56" rx="8" fill="#fef9c3" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="390" y="380" text-anchor="middle" font-size="13" fill="#1e293b">django_migrations jadvali qaysi migratsiyalar qo'llanganini eslab qoladi.</text>
  <text x="390" y="400" text-anchor="middle" font-size="13" fill="#1e293b">Shuning uchun migrate ni qayta ishlatish xavfsiz — ikki marta qo'llanmaydi.</text>
</svg>
