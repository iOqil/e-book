<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Segoe UI, sans-serif">
  <title>WSGI va ASGI: sinxron va asinxron so'rovlarni qayta ishlash farqi</title>
  <rect width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">WSGI va ASGI farqi</text>
  <text x="380" y="58" font-size="13" fill="#64748b" text-anchor="middle">bitta so'rov uzoq kutganda nima bo'ladi</text>

  <!-- WSGI side -->
  <rect x="30" y="80" width="340" height="320" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <text x="200" y="108" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">WSGI (sinxron)</text>
  <text x="200" y="128" font-size="13" fill="#334155" text-anchor="middle">har so'rov bitta ishchini band qiladi</text>

  <rect x="55" y="150" width="290" height="40" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="70" y="175" font-size="13" fill="#1e293b">So'rov A: API kutadi (band)</text>
  <rect x="55" y="200" width="290" height="40" rx="6" fill="#fef2f2" stroke="#94a3b8" stroke-dasharray="4"/>
  <text x="70" y="225" font-size="13" fill="#64748b">So'rov B: navbatda kutadi...</text>
  <rect x="55" y="250" width="290" height="40" rx="6" fill="#fef2f2" stroke="#94a3b8" stroke-dasharray="4"/>
  <text x="70" y="275" font-size="13" fill="#64748b">So'rov C: navbatda kutadi...</text>
  <text x="200" y="330" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">A tugamaguncha B va C kutadi</text>
  <text x="200" y="352" font-size="13" fill="#334155" text-anchor="middle">ishchi tashqi javobni kutib turibdi</text>
  <text x="200" y="380" font-size="13" fill="#64748b" text-anchor="middle">CPU ishlamaydi, lekin ishchi band</text>

  <!-- ASGI side -->
  <rect x="390" y="80" width="340" height="320" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="560" y="108" font-size="16" font-weight="bold" fill="#16a34a" text-anchor="middle">ASGI (asinxron)</text>
  <text x="560" y="128" font-size="13" fill="#334155" text-anchor="middle">await paytida ishchi bo'shaydi</text>

  <rect x="415" y="150" width="290" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="430" y="175" font-size="13" fill="#1e293b">So'rov A: await (uxlab kutadi)</text>
  <rect x="415" y="200" width="290" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="430" y="225" font-size="13" fill="#1e293b">So'rov B: shu vaqtda ishlaydi</text>
  <rect x="415" y="250" width="290" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="430" y="275" font-size="13" fill="#1e293b">So'rov C: u ham ishlaydi</text>
  <text x="560" y="330" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">bitta ishchi ko'p so'rovga xizmat qiladi</text>
  <text x="560" y="352" font-size="13" fill="#334155" text-anchor="middle">await paytida boshqasiga o'tadi</text>
  <text x="560" y="380" font-size="13" fill="#64748b" text-anchor="middle">I/O-og'ir yuk uchun ideal</text>

  <text x="380" y="420" font-size="13" fill="#1e293b" text-anchor="middle">Muhim: ASGI tezroq EMAS — u kutish paytida ishchini band qilmaydi</text>
</svg>
