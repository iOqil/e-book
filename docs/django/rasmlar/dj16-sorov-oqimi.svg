<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="Segoe UI, sans-serif">
  <title>ViewSet so'rov oqimi: URL dan ViewSet metodi va serializer orqali javobgacha</title>
  <rect width="780" height="420" fill="#f8fafc"/>
  <text x="390" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">So'rov oqimi: ViewSet ichida nima bo'ladi</text>

  <!-- client -->
  <rect x="30" y="80" width="150" height="70" rx="10" fill="#fff" stroke="#475569" stroke-width="2"/>
  <text x="105" y="110" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Klient</text>
  <text x="105" y="132" font-size="13" fill="#334155" text-anchor="middle">POST /api/maqolalar/</text>

  <!-- router -->
  <rect x="230" y="80" width="150" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="305" y="106" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">Router</text>
  <text x="305" y="128" font-size="13" fill="#334155" text-anchor="middle">URL + POST</text>
  <text x="305" y="146" font-size="13" fill="#64748b" text-anchor="middle">-> create()</text>

  <!-- viewset method -->
  <rect x="430" y="80" width="160" height="70" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="510" y="106" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">ViewSet.create()</text>
  <text x="510" y="128" font-size="13" fill="#334155" text-anchor="middle">get_queryset()</text>
  <text x="510" y="146" font-size="13" fill="#334155" text-anchor="middle">get_serializer()</text>

  <line x1="180" y1="115" x2="228" y2="115" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="380" y1="115" x2="428" y2="115" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- serializer down -->
  <rect x="430" y="200" width="160" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="510" y="226" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">Serializer</text>
  <text x="510" y="248" font-size="13" fill="#334155" text-anchor="middle">is_valid() -> tekshir</text>
  <text x="510" y="268" font-size="13" fill="#334155" text-anchor="middle">save() -> model</text>
  <line x1="510" y1="150" x2="510" y2="198" stroke="#16a34a" stroke-width="2" marker-end="url(#g)"/>

  <!-- DB -->
  <rect x="630" y="200" width="120" height="80" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <text x="690" y="234" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">Baza</text>
  <text x="690" y="256" font-size="13" fill="#334155" text-anchor="middle">INSERT</text>
  <line x1="590" y1="240" x2="628" y2="240" stroke="#f59e0b" stroke-width="2" marker-end="url(#o)"/>

  <!-- response back -->
  <rect x="30" y="320" width="720" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="56" y="345" font-size="14" font-weight="bold" fill="#2563eb">Response(ser.data, 201)</text>
  <text x="56" y="365" font-size="13" fill="#334155">serializer model -> JSON ga aylantiradi; status 201 Created bilan klientga qaytadi</text>
  <line x1="510" y1="280" x2="510" y2="318" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>

  <text x="220" y="200" font-size="13" fill="#64748b">ModelViewSet bu metodlarni</text>
  <text x="220" y="220" font-size="13" fill="#64748b">o'zi taqdim etadi —</text>
  <text x="220" y="240" font-size="13" fill="#64748b">siz faqat queryset va</text>
  <text x="220" y="260" font-size="13" fill="#64748b">serializer_class beresiz</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/></marker>
  </defs>
</svg>
