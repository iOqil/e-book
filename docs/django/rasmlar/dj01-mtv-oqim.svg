<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Segoe UI, sans-serif">
  <title>Django MTV arxitekturasi: brauzer so'rovi URL -> View -> Model va Template orqali javobga aylanadi</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="30" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Django MTV: so'rovdan javobgacha</text>

  <!-- Brauzer -->
  <rect x="20" y="70" width="130" height="70" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="85" y="100" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Brauzer</text>
  <text x="85" y="122" font-size="13" fill="#334155" text-anchor="middle">foydalanuvchi</text>

  <!-- URLconf -->
  <rect x="220" y="70" width="150" height="70" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="295" y="98" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">URLconf</text>
  <text x="295" y="120" font-size="13" fill="#334155" text-anchor="middle">urls.py / path()</text>

  <!-- View -->
  <rect x="450" y="70" width="150" height="70" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="525" y="98" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">View</text>
  <text x="525" y="120" font-size="13" fill="#334155" text-anchor="middle">views.py (mantiq)</text>

  <!-- Model -->
  <rect x="450" y="220" width="150" height="80" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="525" y="250" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">Model</text>
  <text x="525" y="272" font-size="13" fill="#334155" text-anchor="middle">models.py / ORM</text>
  <text x="525" y="290" font-size="13" fill="#334155" text-anchor="middle">ma'lumotlar bazasi</text>

  <!-- Template -->
  <rect x="640" y="220" width="100" height="80" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="690" y="250" font-size="15" font-weight="bold" fill="#f59e0b" text-anchor="middle">Template</text>
  <text x="690" y="272" font-size="13" fill="#334155" text-anchor="middle">.html</text>
  <text x="690" y="290" font-size="13" fill="#334155" text-anchor="middle">ko'rinish</text>

  <!-- DB -->
  <rect x="450" y="350" width="150" height="55" rx="8" fill="#eef2ff" stroke="#94a3b8" stroke-width="2"/>
  <text x="525" y="383" font-size="14" fill="#334155" text-anchor="middle">SQLite / Postgres</text>

  <!-- arrows: brauzer -> urlconf -->
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <line x1="150" y1="95" x2="216" y2="95" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>
  <text x="183" y="86" font-size="13" fill="#334155" text-anchor="middle">1. so'rov</text>

  <line x1="370" y1="105" x2="446" y2="105" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>
  <text x="408" y="96" font-size="13" fill="#334155" text-anchor="middle">2. moslash</text>

  <!-- view -> model -->
  <line x1="525" y1="140" x2="525" y2="216" stroke="#16a34a" stroke-width="2" marker-end="url(#ah)"/>
  <text x="585" y="182" font-size="13" fill="#16a34a" text-anchor="middle">3. ma'lumot</text>

  <!-- model -> db -->
  <line x1="525" y1="300" x2="525" y2="346" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
  <text x="525" y="332" font-size="13" fill="#334155" text-anchor="middle">SQL</text>

  <!-- view -> template -->
  <line x1="600" y1="120" x2="690" y2="216" stroke="#f59e0b" stroke-width="2" marker-end="url(#ah)"/>
  <text x="668" y="170" font-size="13" fill="#f59e0b" text-anchor="middle">4. render</text>

  <!-- view -> brauzer (javob) -->
  <path d="M450,130 C250,180 90,170 85,144" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ah)"/>
  <text x="250" y="200" font-size="13" fill="#dc2626" text-anchor="middle">5. HTTP javob (HTML / JSON)</text>
</svg>
