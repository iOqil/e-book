<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410">
  <title>Production deploy arxitekturasi: nginx, gunicorn, Django, Postgres</title>
  <rect width="760" height="410" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b">Production deploy arxitekturasi</text>

  <!-- internet -->
  <ellipse cx="90" cy="200" rx="60" ry="40" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="90" y="195" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">Internet</text>
  <text x="90" y="215" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">HTTPS</text>

  <!-- nginx -->
  <rect x="200" y="150" width="140" height="100" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="270" y="180" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">nginx</text>
  <text x="270" y="204" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">reverse proxy</text>
  <text x="270" y="224" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">TLS, static fayllar</text>

  <!-- gunicorn -->
  <rect x="390" y="150" width="150" height="100" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="465" y="180" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">gunicorn</text>
  <text x="465" y="204" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">WSGI workerlar</text>
  <text x="465" y="224" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Django ilova</text>

  <!-- postgres -->
  <ellipse cx="660" cy="120" rx="65" ry="30" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="660" y="116" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">PostgreSQL</text>
  <text x="660" y="135" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">baza</text>

  <!-- redis -->
  <ellipse cx="660" cy="280" rx="65" ry="30" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="660" y="276" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Redis</text>
  <text x="660" y="295" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">kesh / Celery</text>

  <line x1="150" y1="200" x2="198" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#c)"/>
  <line x1="340" y1="200" x2="388" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#c)"/>
  <line x1="540" y1="180" x2="600" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#c)"/>
  <line x1="540" y1="220" x2="600" y2="270" stroke="#64748b" stroke-width="2" marker-end="url(#c)"/>

  <!-- bottom note -->
  <rect x="200" y="320" width="340" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="370" y="345" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">DEBUG=False, ALLOWED_HOSTS, SECRET_KEY env'dan</text>
  <text x="370" y="367" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">collectstatic, migrate, check --deploy</text>

  <defs>
    <marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
