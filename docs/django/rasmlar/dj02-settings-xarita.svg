<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Segoe UI, sans-serif">
  <title>settings.py asosiy sozlamalari xaritasi: DEBUG, INSTALLED_APPS, DATABASES, TIME_ZONE</title>
  <rect x="0" y="0" width="800" height="480" fill="#f8fafc"/>
  <text x="30" y="40" font-size="22" font-weight="bold" fill="#1e293b">settings.py — asosiy sozlamalar xaritasi</text>

  <!-- markaz -->
  <rect x="320" y="60" width="160" height="56" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="88" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">settings.py</text>
  <text x="400" y="107" font-size="13" fill="#334155" text-anchor="middle">loyiha miyasi</text>

  <!-- chiziqlar markazdan -->
  <line x1="400" y1="116" x2="170" y2="170" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="400" y1="116" x2="630" y2="170" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="400" y1="116" x2="170" y2="320" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="400" y1="116" x2="630" y2="320" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- DEBUG -->
  <rect x="40" y="170" width="260" height="120" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="60" y="198" font-size="16" font-weight="bold" fill="#1e293b">DEBUG = True</text>
  <text x="60" y="222" font-size="13" fill="#334155">development'da batafsil xato</text>
  <text x="60" y="242" font-size="13" fill="#334155">sahifasini ko'rsatadi.</text>
  <text x="60" y="266" font-size="13" fill="#dc2626" font-weight="bold">Production'da DEBUG = False!</text>

  <!-- INSTALLED_APPS -->
  <rect x="500" y="170" width="260" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="520" y="198" font-size="16" font-weight="bold" fill="#1e293b">INSTALLED_APPS</text>
  <text x="520" y="222" font-size="13" fill="#334155">faol ilovalar ro'yxati:</text>
  <text x="520" y="242" font-size="13" fill="#334155">admin, auth, sessions ...</text>
  <text x="520" y="266" font-size="13" fill="#334155">o'z ilovangizni shu yerga qo'shasiz.</text>

  <!-- DATABASES -->
  <rect x="40" y="320" width="260" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="348" font-size="16" font-weight="bold" fill="#1e293b">DATABASES</text>
  <text x="60" y="372" font-size="13" fill="#334155">qaysi bazaga ulanish.</text>
  <text x="60" y="392" font-size="13" fill="#334155">standart: SQLite (fayl).</text>
  <text x="60" y="416" font-size="13" fill="#334155">keyin: PostgreSQL / MySQL.</text>

  <!-- TIME_ZONE -->
  <rect x="500" y="320" width="260" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="520" y="348" font-size="16" font-weight="bold" fill="#1e293b">TIME_ZONE + LANGUAGE_CODE</text>
  <text x="520" y="372" font-size="13" fill="#334155">vaqt zonasi va til.</text>
  <text x="520" y="392" font-size="13" fill="#334155">masalan: Asia/Tashkent,</text>
  <text x="520" y="416" font-size="13" fill="#334155">LANGUAGE_CODE = 'uz'.</text>

  <text x="30" y="466" font-size="13" fill="#64748b">settings.py — oddiy Python fayli; har sozlama katta harfli o'zgaruvchi. django.conf.settings orqali kodda o'qiladi.</text>
</svg>
