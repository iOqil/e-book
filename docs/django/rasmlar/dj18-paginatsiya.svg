<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" font-family="Segoe UI, sans-serif">
  <title>PageNumberPagination va LimitOffsetPagination solishtiruvi</title>
  <rect width="820" height="450" fill="#f8fafc"/>
  <text x="410" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Ikki paginatsiya uslubi: bir xil 12 qator</text>

  <!-- 12 items strip top -->
  <text x="410" y="64" font-size="13" fill="#64748b" text-anchor="middle">Bazada 12 ta mahsulot (1..12)</text>

  <!-- PageNumber -->
  <text x="210" y="100" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">PageNumberPagination</text>
  <text x="210" y="122" font-size="13" fill="#334155" text-anchor="middle">?page=2  (page_size=5)</text>

  <!-- page boxes -->
  <g>
    <rect x="40" y="140" width="100" height="46" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="90" y="168" font-size="13" fill="#334155" text-anchor="middle">1-5</text>
    <text x="90" y="200" font-size="13" fill="#64748b" text-anchor="middle">page 1</text>

    <rect x="150" y="140" width="100" height="46" rx="6" fill="#2563eb" stroke="#1e40af"/>
    <text x="200" y="168" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">6-10</text>
    <text x="200" y="200" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">page 2</text>

    <rect x="260" y="140" width="100" height="46" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="310" y="168" font-size="13" fill="#334155" text-anchor="middle">11-12</text>
    <text x="310" y="200" font-size="13" fill="#64748b" text-anchor="middle">page 3</text>
  </g>
  <text x="200" y="234" font-size="13" fill="#334155" text-anchor="middle">"sahifa raqami" bilan o'ylaydi</text>
  <text x="200" y="254" font-size="13" fill="#64748b" text-anchor="middle">foydalanuvchiga qulay (1, 2, 3...)</text>

  <!-- divider -->
  <line x1="410" y1="90" x2="410" y2="280" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- LimitOffset -->
  <text x="610" y="100" font-size="16" fill="#16a34a" text-anchor="middle" font-weight="bold">LimitOffsetPagination</text>
  <text x="610" y="122" font-size="13" fill="#334155" text-anchor="middle">?limit=3&amp;offset=6</text>

  <g>
    <rect x="450" y="140" width="46" height="46" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="473" y="168" font-size="13" fill="#64748b" text-anchor="middle">1-6</text>
    <rect x="500" y="140" width="120" height="46" rx="6" fill="#16a34a" stroke="#15803d"/>
    <text x="560" y="168" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">7,8,9</text>
    <rect x="624" y="140" width="46" height="46" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="647" y="168" font-size="13" fill="#64748b" text-anchor="middle">10-12</text>
  </g>
  <text x="540" y="200" font-size="13" fill="#64748b" text-anchor="middle">offset=6 (o'tkaz)</text>
  <text x="560" y="220" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">limit=3 (ol)</text>
  <text x="610" y="248" font-size="13" fill="#334155" text-anchor="middle">"qancha o'tkazib, qancha ol"</text>
  <text x="610" y="268" font-size="13" fill="#64748b" text-anchor="middle">API/cheksiz scroll uchun qulay</text>

  <!-- response shapes -->
  <rect x="60" y="310" width="300" height="110" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="334" font-size="13" fill="#334155" font-family="monospace">{</text>
  <text x="96" y="354" font-size="13" fill="#334155" font-family="monospace">"count": 12,</text>
  <text x="96" y="374" font-size="13" fill="#334155" font-family="monospace">"next": ".../?page=3",</text>
  <text x="96" y="394" font-size="13" fill="#334155" font-family="monospace">"previous": ".../?page=1",</text>
  <text x="96" y="414" font-size="13" fill="#334155" font-family="monospace">"results": [ ... ] }</text>

  <rect x="460" y="310" width="300" height="110" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="334" font-size="13" fill="#334155" font-family="monospace">{</text>
  <text x="496" y="354" font-size="13" fill="#334155" font-family="monospace">"count": 12,</text>
  <text x="496" y="374" font-size="13" fill="#334155" font-family="monospace">"next": ".../?limit=3&amp;offset=9",</text>
  <text x="496" y="394" font-size="13" fill="#334155" font-family="monospace">"previous": ".../?limit=3&amp;offset=3",</text>
  <text x="496" y="414" font-size="13" fill="#334155" font-family="monospace">"results": [ ... ] }</text>

  <defs></defs>
</svg>
