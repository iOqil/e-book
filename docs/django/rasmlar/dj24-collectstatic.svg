<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420">
  <title>collectstatic: tarqoq statik fayllarni bitta STATIC_ROOT papkaga yig'ish</title>
  <rect width="820" height="420" fill="#f8fafc"/>
  <text x="410" y="34" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">collectstatic — fayllarni bir joyga yig'ish</text>

  <!-- sources -->
  <rect x="30" y="70" width="240" height="60" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="50" y="98" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">blog/static/blog/</text>
  <text x="50" y="120" font-family="Segoe UI" font-size="13" fill="#334155">site.css</text>

  <rect x="30" y="150" width="240" height="60" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="50" y="178" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">django.contrib.admin</text>
  <text x="50" y="200" font-family="Segoe UI" font-size="13" fill="#334155">admin/css, admin/js ...</text>

  <rect x="30" y="230" width="240" height="60" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="50" y="258" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">boshqa ilovalar/</text>
  <text x="50" y="280" font-family="Segoe UI" font-size="13" fill="#334155">har birida static/</text>

  <!-- command box -->
  <rect x="320" y="150" width="180" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="410" y="176" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">manage.py</text>
  <text x="410" y="198" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">collectstatic</text>

  <!-- arrows in -->
  <line x1="270" y1="100" x2="316" y2="170" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="270" y1="180" x2="316" y2="180" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="270" y1="260" x2="316" y2="190" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="320,180 308,174 308,186" fill="#94a3b8"/>

  <!-- arrow out -->
  <line x1="500" y1="180" x2="556" y2="180" stroke="#16a34a" stroke-width="3"/>
  <polygon points="560,180 548,174 548,186" fill="#16a34a"/>

  <!-- destination -->
  <rect x="562" y="120" width="230" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="677" y="148" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">STATIC_ROOT/</text>
  <text x="582" y="174" font-family="Segoe UI" font-size="13" fill="#1e293b">staticfiles/blog/site.css</text>
  <text x="582" y="196" font-family="Segoe UI" font-size="13" fill="#1e293b">staticfiles/admin/...</text>
  <text x="582" y="218" font-family="Segoe UI" font-size="13" fill="#334155">131 fayl ko'chirildi</text>

  <text x="410" y="335" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">DEBUG=True'da Django statikni o'zi xizmat qiladi (sekin, faqat ishlab chiqish uchun).</text>
  <text x="410" y="362" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">DEBUG=False'da xizmat qilmaydi — nginx yoki WhiteNoise STATIC_ROOT'dan beradi.</text>
  <text x="410" y="396" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">Har deploy'da collectstatic'ni qayta ishga tushiring.</text>
</svg>
