<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540">
  <title>Qatlamli himoya: ilova validatsiyasi birinchi qatlam, baza constraint esa oxirgi qal'a — bir necha yo'l bazaga yetib boradi</title>
  <rect x="0" y="0" width="800" height="540" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="bold" fill="#1e293b">Baza constraint — yaxlitlikning OXIRGI qal'asi</text>
  <text x="400" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Ilova validatsiyasi foydali, lekin bazaga ko'p yo'l olib boradi — faqat baza hammasini ushlaydi</text>

  <!-- sources on the left -->
  <text x="40" y="92" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Ma'lumot manbalari</text>

  <rect x="32" y="104" width="200" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="132" y="131" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Veb ilova (validatsiyali)</text>

  <rect x="32" y="160" width="200" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="132" y="187" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Mobil/eski ilova (bag'li)</text>

  <rect x="32" y="216" width="200" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="132" y="243" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Boshqa servis / cron</text>

  <rect x="32" y="272" width="200" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="132" y="293" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Qo'lda psql / migratsiya</text>
  <text x="132" y="309" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">(validatsiyani CHETLAB)</text>

  <rect x="32" y="328" width="200" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="132" y="349" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Bag', bulk-import,</text>
  <text x="132" y="365" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">race condition</text>

  <!-- arrows to DB -->
  <defs>
    <marker id="arq" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#475569"/>
    </marker>
  </defs>
  <line x1="232" y1="126" x2="540" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arq)"/>
  <line x1="232" y1="182" x2="540" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#arq)"/>
  <line x1="232" y1="238" x2="540" y2="262" stroke="#475569" stroke-width="2" marker-end="url(#arq)"/>
  <line x1="232" y1="294" x2="540" y2="294" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arq)"/>
  <line x1="232" y1="350" x2="540" y2="326" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arq)"/>

  <!-- the castle: DB constraints -->
  <rect x="544" y="150" width="228" height="226" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3.5"/>
  <text x="658" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">BAZA (qal'a)</text>
  <text x="658" y="202" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Constraint hamma yo'lni</text>
  <text x="658" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">teng tekshiradi:</text>
  <rect x="566" y="232" width="184" height="26" rx="5" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="658" y="250" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">NOT NULL · CHECK</text>
  <rect x="566" y="264" width="184" height="26" rx="5" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="658" y="282" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">UNIQUE · PK · FK</text>
  <rect x="566" y="296" width="184" height="26" rx="5" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="658" y="314" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">EXCLUDE</text>
  <text x="658" y="346" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">Yagona haqiqat manbai</text>
  <text x="658" y="366" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">noto'g'ri qator KIRMAYDI</text>

  <!-- bottom principle box -->
  <rect x="32" y="396" width="740" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="52" y="422" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Tamoyil: qatlamli himoya (defence in depth)</text>
  <text x="52" y="446" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb" font-weight="bold">1-qatlam (ilova):</text>
  <text x="200" y="446" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tez, do'stona xato xabari (UX uchun). Lekin chetlab o'tilishi mumkin.</text>
  <text x="52" y="470" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" font-weight="bold">2-qatlam (baza):</text>
  <text x="200" y="470" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">so'nggi, chetlab o'tilmaydigan kafolat. Ma'lumot HAR DOIM to'g'ri qoladi.</text>
  <text x="52" y="498" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626" font-weight="bold">Xulosa:</text>
  <text x="200" y="498" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ilova validatsiyasi qulaylik uchun, baza constraint esa to'g'rilik uchun — ikkalasi ham kerak.</text>
</svg>
