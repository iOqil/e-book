<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
  <title>Yomon sxema narxi: takror, anomaliya, sekinlik va bug bitta xato jadvaldan kelib chiqadi</title>

  <!-- fon -->
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>

  <!-- sarlavha -->
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Yomon sxema narxi</text>
  <text x="380" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Bitta o'ylanmagan jadval to'rt yo'nalishda ziyon keltiradi</text>

  <!-- markaziy yomon jadval -->
  <rect x="280" y="80" width="200" height="92" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="380" y="106" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">buyurtmalar</text>
  <text x="380" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">mijoz_ismi, mijoz_tel,</text>
  <text x="380" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">mahsulotlar (vergulli ro'yxat),</text>
  <text x="380" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">jami, "narx1, narx2..."</text>

  <!-- to'rt oqim chiziqlari -->
  <line x1="300" y1="172" x2="160" y2="220" stroke="#dc2626" stroke-width="2"/>
  <line x1="345" y1="172" x2="320" y2="220" stroke="#dc2626" stroke-width="2"/>
  <line x1="415" y1="172" x2="445" y2="220" stroke="#dc2626" stroke-width="2"/>
  <line x1="460" y1="172" x2="600" y2="220" stroke="#dc2626" stroke-width="2"/>

  <!-- 1: takror -->
  <rect x="40" y="222" width="170" height="150" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="125" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">1. Takror</text>
  <text x="125" y="272" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Bir mijoz ismi va</text>
  <text x="125" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">telefoni har</text>
  <text x="125" y="308" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">buyurtmada qayta</text>
  <text x="125" y="326" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yoziladi. Joy va</text>
  <text x="125" y="344" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">vaqt isrof bo'ladi.</text>

  <!-- 2: anomaliya -->
  <rect x="225" y="222" width="170" height="150" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="310" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#d97706">2. Anomaliya</text>
  <text x="310" y="272" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Telefon o'zgarsa,</text>
  <text x="310" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yuzlab qatorni</text>
  <text x="310" y="308" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tahrirlash kerak.</text>
  <text x="310" y="326" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Bittasi unutilsa —</text>
  <text x="310" y="344" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ma'lumot ziddiyatli.</text>

  <!-- 3: sekinlik -->
  <rect x="410" y="222" width="170" height="150" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="495" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">3. Sekinlik</text>
  <text x="495" y="272" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">"Mahsulot X qancha</text>
  <text x="495" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">sotildi?" — vergulli</text>
  <text x="495" y="308" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ro'yxat ichidan</text>
  <text x="495" y="326" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">qidirish indekssiz,</text>
  <text x="495" y="344" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">to'liq skan, sekin.</text>

  <!-- 4: bug -->
  <rect x="595" y="222" width="170" height="150" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="680" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">4. Bug</text>
  <text x="680" y="272" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">"jami" qo'lda</text>
  <text x="680" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yoziladi va</text>
  <text x="680" y="308" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">narxlardan farq</text>
  <text x="680" y="326" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">qiladi. Ilova xato</text>
  <text x="680" y="344" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">hisob ko'rsatadi.</text>

  <!-- pastki izoh -->
  <text x="380" y="400" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Narx dasturda emas — sxemada tug'iladi. Tuzatish kechiksa, qimmatlashadi.</text>
</svg>
