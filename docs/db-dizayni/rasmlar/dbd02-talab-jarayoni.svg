<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430">
  <title>Talab tahlili jarayoni: talab to'plash, intervyu, tahlil, domen tili va dastlabki model qadamlari</title>
  <defs>
    <marker id="dbd02b-strelka" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Talabdan modelga: 5 qadam</text>

  <!-- Qadam 1 -->
  <rect x="40" y="70" width="200" height="86" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">1. Talabni to'plash</text>
  <text x="140" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">biznesdan eshit:</text>
  <text x="140" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">"nima kerak?"</text>

  <!-- Qadam 2 -->
  <rect x="280" y="70" width="200" height="86" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">2. Intervyu / savol</text>
  <text x="380" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">aniqlovchi savol:</text>
  <text x="380" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">"bittami, ko'pmi?"</text>

  <!-- Qadam 3 -->
  <rect x="520" y="70" width="200" height="86" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="620" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">3. Domen tili</text>
  <text x="620" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">atamalar lug'ati:</text>
  <text x="620" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">"buyurtma" = ?</text>

  <!-- Qadam 4 -->
  <rect x="160" y="230" width="200" height="86" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="260" y="258" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">4. Ajratish</text>
  <text x="260" y="282" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">entity / atribut /</text>
  <text x="260" y="300" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">bog'lanish + qoidalar</text>

  <!-- Qadam 5 -->
  <rect x="400" y="230" width="200" height="86" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="258" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">5. Dastlabki model</text>
  <text x="500" y="282" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">konseptual ER +</text>
  <text x="500" y="300" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">scope chegarasi</text>

  <!-- strelkalar 1->2->3 -->
  <line x1="240" y1="113" x2="278" y2="113" stroke="#2563eb" stroke-width="2.5" marker-end="url(#dbd02b-strelka)"/>
  <line x1="480" y1="113" x2="518" y2="113" stroke="#2563eb" stroke-width="2.5" marker-end="url(#dbd02b-strelka)"/>
  <!-- 3 -> 4 (pastga burilish) -->
  <path d="M620,158 L620,195 L260,195 L260,228" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#dbd02b-strelka)"/>
  <!-- 4 -> 5 -->
  <line x1="360" y1="273" x2="398" y2="273" stroke="#2563eb" stroke-width="2.5" marker-end="url(#dbd02b-strelka)"/>

  <!-- takroriy halqa izohi -->
  <path d="M460,228 L460,200 L760,200 L760,330 L500,330 L500,318" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="690" y="225" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" font-style="italic">takroriy</text>

  <!-- pastki izoh -->
  <rect x="40" y="356" width="680" height="56" rx="10" fill="#fef9c3" stroke="#d97706" stroke-width="2"/>
  <text x="380" y="380" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#92400e">Tahlil = takroriy jarayon: model loyihachi va biznesni bir tilga keltiradi</text>
  <text x="380" y="402" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">har qaytishda savol aniqroq, model haqiqatga yaqinroq bo'ladi</text>
</svg>
