<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" width="780" height="540">
  <title>Onlayn-do'kon ER-diagrammasi: MIJOZ, BUYURTMA, BUYURTMA_QATORI va MAHSULOT (Crow's foot)</title>
  <rect x="0" y="0" width="780" height="540" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Onlayn-do'kon ER-diagrammasi (Crow's foot)</text>

  <!-- MIJOZ entity -->
  <g>
    <rect x="40" y="80" width="190" height="150" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect x="40" y="80" width="190" height="30" rx="6" fill="#2563eb"/>
    <text x="135" y="101" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">MIJOZ</text>
    <text x="52" y="132" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">PK</text>
    <text x="90" y="132" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-decoration="underline">mijoz_id</text>
    <line x1="52" y1="142" x2="218" y2="142" stroke="#e2e8f0" stroke-width="1"/>
    <text x="52" y="160" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ism</text>
    <text x="52" y="182" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">email (UNIQUE)</text>
    <text x="52" y="204" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">telefon</text>
  </g>

  <!-- BUYURTMA entity -->
  <g>
    <rect x="300" y="80" width="190" height="150" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect x="300" y="80" width="190" height="30" rx="6" fill="#2563eb"/>
    <text x="395" y="101" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">BUYURTMA</text>
    <text x="312" y="132" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">PK</text>
    <text x="350" y="132" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-decoration="underline">buyurtma_id</text>
    <line x1="312" y1="142" x2="478" y2="142" stroke="#e2e8f0" stroke-width="1"/>
    <text x="312" y="160" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">FK</text>
    <text x="350" y="160" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">mijoz_id</text>
    <text x="312" y="182" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">sana</text>
    <text x="312" y="204" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">holat</text>
  </g>

  <!-- BUYURTMA_QATORI (kuchsiz/junction) -->
  <g>
    <rect x="300" y="330" width="190" height="150" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2.5"/>
    <rect x="300" y="330" width="190" height="30" rx="6" fill="#d97706"/>
    <text x="395" y="351" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">BUYURTMA_QATORI</text>
    <text x="312" y="382" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">FK</text>
    <text x="350" y="382" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-decoration="underline">buyurtma_id</text>
    <text x="312" y="404" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">FK</text>
    <text x="350" y="404" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-decoration="underline">mahsulot_id</text>
    <line x1="312" y1="414" x2="478" y2="414" stroke="#e2e8f0" stroke-width="1"/>
    <text x="312" y="434" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">miqdor</text>
    <text x="312" y="456" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">narx</text>
  </g>

  <!-- MAHSULOT entity -->
  <g>
    <rect x="560" y="330" width="190" height="150" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect x="560" y="330" width="190" height="30" rx="6" fill="#2563eb"/>
    <text x="655" y="351" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">MAHSULOT</text>
    <text x="572" y="382" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">PK</text>
    <text x="610" y="382" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-decoration="underline">mahsulot_id</text>
    <line x1="572" y1="392" x2="738" y2="392" stroke="#e2e8f0" stroke-width="1"/>
    <text x="572" y="412" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">nomi</text>
    <text x="572" y="434" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">narx</text>
    <text x="572" y="456" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">qoldiq</text>
  </g>

  <!-- Relationship MIJOZ 1 -> N BUYURTMA -->
  <line x1="230" y1="155" x2="300" y2="155" stroke="#475569" stroke-width="2.5"/>
  <!-- one mandatory at mijoz side -->
  <line x1="252" y1="139" x2="252" y2="171" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="262" y1="139" x2="262" y2="171" stroke="#2563eb" stroke-width="2.5"/>
  <!-- zero or many at buyurtma side -->
  <circle cx="282" cy="155" r="9" fill="#f8fafc" stroke="#d97706" stroke-width="2.5"/>
  <line x1="300" y1="155" x2="290" y2="142" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="300" y1="155" x2="290" y2="155" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="300" y1="155" x2="290" y2="168" stroke="#16a34a" stroke-width="2.5"/>
  <text x="265" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">beradi (1:N)</text>

  <!-- Relationship BUYURTMA 1 -> N BUYURTMA_QATORI -->
  <line x1="395" y1="230" x2="395" y2="330" stroke="#475569" stroke-width="2.5"/>
  <line x1="379" y1="252" x2="411" y2="252" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="379" y1="262" x2="411" y2="262" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="395" cy="308" r="9" fill="#f8fafc" stroke="#d97706" stroke-width="2.5"/>
  <line x1="395" y1="330" x2="382" y2="320" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="395" y1="330" x2="395" y2="320" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="395" y1="330" x2="408" y2="320" stroke="#16a34a" stroke-width="2.5"/>
  <text x="500" y="285" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">tarkib (1:N)</text>

  <!-- Relationship MAHSULOT 1 -> N BUYURTMA_QATORI -->
  <line x1="490" y1="405" x2="560" y2="405" stroke="#475569" stroke-width="2.5"/>
  <circle cx="512" cy="405" r="9" fill="#f8fafc" stroke="#d97706" stroke-width="2.5"/>
  <line x1="490" y1="405" x2="500" y2="392" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="490" y1="405" x2="500" y2="405" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="490" y1="405" x2="500" y2="418" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="540" y1="389" x2="540" y2="421" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="550" y1="389" x2="550" y2="421" stroke="#2563eb" stroke-width="2.5"/>
  <text x="525" y="380" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">o'z ichiga oladi</text>

  <!-- note -->
  <rect x="40" y="290" width="230" height="190" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="155" y="314" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">O'qish</text>
  <text x="54" y="340" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">BUYURTMA va MAHSULOT</text>
  <text x="54" y="360" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">orasida N:M bog'lanish bor.</text>
  <text x="54" y="384" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">U BUYURTMA_QATORI</text>
  <text x="54" y="404" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">bog'lovchi (junction)</text>
  <text x="54" y="424" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">jadval orqali ikkita</text>
  <text x="54" y="444" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">1:N ga ajraladi.</text>
  <text x="54" y="468" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#d97706">Sariq = bog'lovchi entity</text>
</svg>
