<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>Kardinallikning uch turi: 1:1 (foydalanuvchi-profil), 1:N (muallif-kitoblar), N:M (talaba-kurs) yonma-yon hayotiy misol bilan</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="bold" fill="#1e293b">Kardinallikning uch turi</text>

  <!-- ====== 1:1 ====== -->
  <text x="130" y="74" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#2563eb">1 : 1</text>
  <text x="130" y="96" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">foydalanuvchi - profil</text>

  <rect x="40" y="110" width="180" height="38" rx="6" fill="#2563eb"/>
  <text x="130" y="134" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">foydalanuvchi</text>
  <line x1="130" y1="148" x2="130" y2="196" stroke="#475569" stroke-width="2.5"/>
  <text x="116" y="166" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">1</text>
  <text x="116" y="190" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">1</text>
  <rect x="40" y="196" width="180" height="38" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="130" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">profil</text>
  <text x="130" y="262" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">har birga aniq</text>
  <text x="130" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">bittadan</text>

  <!-- ====== 1:N ====== -->
  <text x="380" y="74" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#16a34a">1 : N</text>
  <text x="380" y="96" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">muallif - kitoblar</text>

  <rect x="290" y="110" width="180" height="38" rx="6" fill="#16a34a"/>
  <text x="380" y="134" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">muallif</text>
  <line x1="380" y1="148" x2="320" y2="196" stroke="#475569" stroke-width="2.5"/>
  <line x1="380" y1="148" x2="380" y2="196" stroke="#475569" stroke-width="2.5"/>
  <line x1="380" y1="148" x2="440" y2="196" stroke="#475569" stroke-width="2.5"/>
  <text x="368" y="168" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">1</text>
  <text x="396" y="168" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">N</text>
  <rect x="298" y="196" width="44" height="38" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="358" y="196" width="44" height="38" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="418" y="196" width="44" height="38" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="320" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">kitob</text>
  <text x="380" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">kitob</text>
  <text x="440" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">kitob</text>
  <text x="380" y="262" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">bir muallif - ko'p</text>
  <text x="380" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">kitob; kitobda bir muallif</text>

  <!-- ====== N:M ====== -->
  <text x="630" y="74" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#d97706">N : M</text>
  <text x="630" y="96" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">talaba - kurs</text>

  <rect x="540" y="110" width="80" height="34" rx="6" fill="#f59e0b"/>
  <text x="580" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">talaba</text>
  <rect x="540" y="152" width="80" height="34" rx="6" fill="#f59e0b"/>
  <text x="580" y="174" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">talaba</text>
  <rect x="640" y="110" width="80" height="34" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="680" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">kurs</text>
  <rect x="640" y="152" width="80" height="34" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="680" y="174" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">kurs</text>
  <rect x="640" y="194" width="80" height="34" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="680" y="216" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">kurs</text>
  <line x1="620" y1="127" x2="640" y2="127" stroke="#475569" stroke-width="2"/>
  <line x1="620" y1="127" x2="640" y2="169" stroke="#475569" stroke-width="2"/>
  <line x1="620" y1="169" x2="640" y2="127" stroke="#475569" stroke-width="2"/>
  <line x1="620" y1="169" x2="640" y2="211" stroke="#475569" stroke-width="2"/>
  <line x1="620" y1="169" x2="640" y2="169" stroke="#475569" stroke-width="2"/>
  <text x="630" y="262" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">talaba - ko'p kurs;</text>
  <text x="630" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">kursda - ko'p talaba</text>

  <!-- pastki tushuntirish paneli -->
  <line x1="40" y1="312" x2="720" y2="312" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="40" y="330" width="680" height="116" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="358" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">1:1</text>
  <text x="110" y="358" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">FK + UNIQUE (yoki FK ustini PK qil) — bitta tomonda saqlanadi</text>
  <text x="60" y="392" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">1:N</text>
  <text x="110" y="392" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">FK "ko'p" tomonida (kitoblar.muallif_id) — eng tabiiy holat</text>
  <text x="60" y="426" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#d97706">N:M</text>
  <text x="110" y="426" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">to'g'ridan-to'g'ri saqlab bo'lmaydi — bog'lovchi (junction) jadval kerak</text>
</svg>
