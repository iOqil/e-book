<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520">
  <title>Expand-contract (parallel change) naqshi: ustun nomini xavfsiz ozgartirish uch bosqichda - EXPAND (yangi ustun qosh), BACKFILL (eski malumotni partiyalar bilan kochir), CONTRACT (eski ustunni tashla); har bosqich orasida eski va yangi kod birga ishlaydi</title>
  <rect x="0" y="0" width="860" height="520" fill="#f8fafc"/>
  <text x="430" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Expand-Contract: ustun nomini xavfsiz o'zgartirish</text>
  <text x="430" y="54" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">ismi -> toliq_ism (zero-downtime, 3 bosqich)</text>

  <!-- STAGE 1: EXPAND -->
  <rect x="20" y="78" width="260" height="380" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <rect x="20" y="78" width="260" height="34" rx="10" fill="#16a34a"/>
  <text x="150" y="101" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">1. EXPAND</text>
  <text x="150" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">Yangi ustun qo'sh (NULL bilan)</text>
  <!-- table mini -->
  <rect x="40" y="148" width="220" height="96" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="52" y="170" font-family="Consolas, monospace" font-size="13" fill="#1e293b">mijoz</text>
  <line x1="40" y1="178" x2="260" y2="178" stroke="#94a3b8" stroke-width="1"/>
  <text x="52" y="198" font-family="Consolas, monospace" font-size="13" fill="#1e293b">ismi      = "Ali"</text>
  <text x="52" y="222" font-family="Consolas, monospace" font-size="13" fill="#16a34a">toliq_ism = NULL  (yangi)</text>
  <text x="40" y="272" font-family="Consolas, monospace" font-size="13" fill="#475569">ALTER TABLE mijoz</text>
  <text x="40" y="290" font-family="Consolas, monospace" font-size="13" fill="#475569">  ADD COLUMN toliq_ism text;</text>
  <text x="40" y="318" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">+ Trigger: yangi yozuvlar</text>
  <text x="40" y="334" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">  IKKALA ustunni to'ldiradi</text>
  <rect x="40" y="356" width="220" height="86" rx="6" fill="#ecfccb" stroke="#16a34a" stroke-width="1"/>
  <text x="52" y="378" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">Kod holati:</text>
  <text x="52" y="398" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">eski kod -> ismi o'qiydi</text>
  <text x="52" y="416" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tez, metadata-only</text>
  <text x="52" y="434" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">downtime YO'Q</text>

  <!-- arrow 1->2 -->
  <line x1="282" y1="268" x2="300" y2="268" stroke="#475569" stroke-width="3"/>
  <polygon points="306,268 294,262 294,274" fill="#475569"/>

  <!-- STAGE 2: BACKFILL -->
  <rect x="308" y="78" width="260" height="380" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="308" y="78" width="260" height="34" rx="10" fill="#2563eb"/>
  <text x="438" y="101" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">2. BACKFILL</text>
  <text x="438" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">Eski ma'lumotni partiyalab ko'chir</text>
  <rect x="328" y="148" width="220" height="96" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="340" y="170" font-family="Consolas, monospace" font-size="13" fill="#1e293b">mijoz</text>
  <line x1="328" y1="178" x2="548" y2="178" stroke="#94a3b8" stroke-width="1"/>
  <text x="340" y="198" font-family="Consolas, monospace" font-size="13" fill="#1e293b">ismi      = "Ali"</text>
  <text x="340" y="222" font-family="Consolas, monospace" font-size="13" fill="#2563eb">toliq_ism = "Ali"  (ko'chdi)</text>
  <text x="328" y="272" font-family="Consolas, monospace" font-size="13" fill="#475569">UPDATE mijoz SET</text>
  <text x="328" y="290" font-family="Consolas, monospace" font-size="13" fill="#475569">  toliq_ism = ismi</text>
  <text x="328" y="308" font-family="Consolas, monospace" font-size="13" fill="#475569">WHERE toliq_ism IS NULL</text>
  <text x="328" y="326" font-family="Consolas, monospace" font-size="13" fill="#2563eb">  LIMIT 10000;  -- partiya</text>
  <rect x="328" y="346" width="220" height="96" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="340" y="368" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">Nega partiyalab?</text>
  <text x="340" y="388" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">bitta katta UPDATE jadvalni</text>
  <text x="340" y="406" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">uzoq qulflaydi, WAL toshadi.</text>
  <text x="340" y="426" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">downtime YO'Q</text>

  <!-- arrow 2->3 -->
  <line x1="570" y1="268" x2="588" y2="268" stroke="#475569" stroke-width="3"/>
  <polygon points="594,268 582,262 582,274" fill="#475569"/>

  <!-- STAGE 3: CONTRACT -->
  <rect x="596" y="78" width="244" height="380" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <rect x="596" y="78" width="244" height="34" rx="10" fill="#dc2626"/>
  <text x="718" y="101" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">3. CONTRACT</text>
  <text x="718" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#991b1b">Eski ustunni tashla</text>
  <rect x="616" y="148" width="204" height="96" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="628" y="170" font-family="Consolas, monospace" font-size="13" fill="#1e293b">mijoz</text>
  <line x1="616" y1="178" x2="820" y2="178" stroke="#94a3b8" stroke-width="1"/>
  <text x="628" y="198" font-family="Consolas, monospace" font-size="13" text-decoration="line-through" fill="#dc2626">ismi  (tashlandi)</text>
  <text x="628" y="222" font-family="Consolas, monospace" font-size="13" fill="#1e293b">toliq_ism = "Ali"</text>
  <text x="616" y="272" font-family="Consolas, monospace" font-size="13" fill="#475569">-- avval kod yangilandi:</text>
  <text x="616" y="290" font-family="Consolas, monospace" font-size="13" fill="#475569">-- hamma toliq_ism ishlatadi</text>
  <text x="616" y="314" font-family="Consolas, monospace" font-size="13" fill="#dc2626">ALTER TABLE mijoz</text>
  <text x="616" y="332" font-family="Consolas, monospace" font-size="13" fill="#dc2626">  DROP COLUMN ismi;</text>
  <rect x="616" y="352" width="204" height="90" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="628" y="374" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#991b1b">MUHIM tartib:</text>
  <text x="628" y="394" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">DROP'dan OLDIN eski kod</text>
  <text x="628" y="412" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">to'liq deploy'dan chiqsin,</text>
  <text x="628" y="430" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">aks holda eski kod sinadi.</text>
</svg>
