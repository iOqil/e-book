<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>Talab matnidan model ajratish: ot -> entity, sifat -> atribut, fe'l -> bog'lanish evristikasi</title>
  <defs>
    <marker id="dbd02a-strelka" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Matndan modelga: ot / sifat / fe'l evristikasi</text>

  <!-- Talab matni qutisi -->
  <rect x="30" y="58" width="700" height="92" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="46" y="84" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#475569">Talab matni:</text>
  <text x="46" y="110" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b"><tspan fill="#2563eb" font-weight="bold">Mijoz</tspan> faol <tspan fill="#16a34a" font-weight="bold">mahsulot</tspan>larga <tspan fill="#dc2626" font-weight="bold">buyurtma beradi</tspan>. Har</text>
  <text x="46" y="134" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b"><tspan fill="#16a34a" font-weight="bold">mahsulot</tspan>ning <tspan fill="#d97706" font-weight="bold">nomi</tspan> va <tspan fill="#d97706" font-weight="bold">narxi</tspan> bor.</text>

  <!-- 3 ta strelka pastga -->
  <line x1="150" y1="152" x2="150" y2="190" stroke="#475569" stroke-width="2.5" marker-end="url(#dbd02a-strelka)"/>
  <line x1="380" y1="152" x2="380" y2="190" stroke="#475569" stroke-width="2.5" marker-end="url(#dbd02a-strelka)"/>
  <line x1="610" y1="152" x2="610" y2="190" stroke="#475569" stroke-width="2.5" marker-end="url(#dbd02a-strelka)"/>

  <!-- OT -> entity -->
  <rect x="40" y="194" width="220" height="116" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">OT (ism)</text>
  <text x="150" y="244" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">-&gt; ENTITY (jadval)</text>
  <text x="56" y="272" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">mijoz, mahsulot,</text>
  <text x="56" y="294" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">buyurtma</text>

  <!-- SIFAT -> atribut -->
  <rect x="270" y="194" width="220" height="116" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="380" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#d97706">SIFAT / xossa</text>
  <text x="380" y="244" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">-&gt; ATRIBUT (ustun)</text>
  <text x="286" y="272" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">nomi, narxi, faol,</text>
  <text x="286" y="294" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">email, sana</text>

  <!-- FE'L -> boglanish -->
  <rect x="500" y="194" width="220" height="116" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="610" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">FE'L (harakat)</text>
  <text x="610" y="244" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">-&gt; BOG'LANISH (FK)</text>
  <text x="516" y="272" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">beradi -&gt; buyurtma</text>
  <text x="516" y="294" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">mijozga bog'lanadi</text>

  <!-- pastga umumiy strelka -->
  <line x1="380" y1="312" x2="380" y2="348" stroke="#475569" stroke-width="2.5" marker-end="url(#dbd02a-strelka)"/>

  <!-- Natija: kichik ER -->
  <rect x="120" y="352" width="160" height="96" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="200" y="376" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">mijozlar</text>
  <text x="136" y="398" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">id (PK)</text>
  <text x="136" y="418" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">ism</text>
  <text x="136" y="438" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">email</text>

  <rect x="480" y="352" width="170" height="96" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="565" y="376" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">buyurtmalar</text>
  <text x="496" y="398" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">id (PK)</text>
  <text x="496" y="418" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">mijoz_id (FK)</text>
  <text x="496" y="438" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">sana</text>

  <!-- boglanish chizigi -->
  <line x1="478" y1="400" x2="282" y2="400" stroke="#475569" stroke-width="2.5" marker-end="url(#dbd02a-strelka)"/>
  <text x="380" y="392" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626" font-weight="bold">beradi (1:N)</text>
</svg>
