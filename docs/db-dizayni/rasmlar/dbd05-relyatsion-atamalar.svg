<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440">
  <title>Relyatsion atamalar: relation jadval, tuple qator, atribut ustun, domen ustun qiymatlar to'plami</title>

  <!-- fon -->
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>

  <!-- sarlavha -->
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Relyatsion atamalar bitta jadval ustida</text>
  <text x="380" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Matematik nom (chapda) va kundalik nom (qavsda)</text>

  <!-- relation ramkasi -->
  <rect x="210" y="92" width="340" height="172" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>

  <!-- ustun sarlavhalari -->
  <rect x="210" y="92" width="340" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="262" y="114" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">id</text>
  <text x="360" y="114" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">ism</text>
  <text x="480" y="114" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">bahosi</text>

  <!-- qatorlar -->
  <line x1="210" y1="160" x2="550" y2="160" stroke="#94a3b8" stroke-width="1"/>
  <line x1="210" y1="194" x2="550" y2="194" stroke="#94a3b8" stroke-width="1"/>
  <line x1="210" y1="228" x2="550" y2="228" stroke="#94a3b8" stroke-width="1"/>
  <line x1="312" y1="126" x2="312" y2="264" stroke="#94a3b8" stroke-width="1"/>
  <line x1="420" y1="126" x2="420" y2="264" stroke="#94a3b8" stroke-width="1"/>

  <text x="262" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">1</text>
  <text x="360" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Aziz</text>
  <text x="480" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">85</text>

  <text x="262" y="182" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">2</text>
  <text x="360" y="182" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Bobur</text>
  <text x="480" y="182" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">72</text>

  <text x="262" y="216" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">3</text>
  <text x="360" y="216" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Davron</text>
  <text x="480" y="216" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">90</text>

  <text x="262" y="250" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">4</text>
  <text x="360" y="250" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Eldor</text>
  <text x="480" y="250" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">66</text>

  <!-- relation yorlig'i (butun jadval) -->
  <text x="380" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">relation (butun jadval)</text>

  <!-- tuple yorlig'i (qator) -->
  <line x1="210" y1="177" x2="120" y2="177" stroke="#16a34a" stroke-width="2"/>
  <rect x="14" y="160" width="106" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="67" y="181" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">tuple (qator)</text>

  <!-- atribut yorlig'i (ustun) -->
  <line x1="480" y1="92" x2="480" y2="62" stroke="#d97706" stroke-width="2"/>
  <rect x="600" y="100" width="148" height="34" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="674" y="121" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#d97706">atribut (ustun)</text>
  <line x1="550" y1="109" x2="600" y2="116" stroke="#d97706" stroke-width="2"/>

  <!-- domen izohi -->
  <rect x="560" y="170" width="190" height="94" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="655" y="194" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#475569">domen</text>
  <text x="655" y="216" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">bahosi uchun:</text>
  <text x="655" y="234" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">0..100 oraligidagi</text>
  <text x="655" y="252" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">butun sonlar</text>
  <line x1="550" y1="205" x2="560" y2="205" stroke="#475569" stroke-width="2"/>

  <!-- pastki qoidalar paneli -->
  <rect x="40" y="318" width="680" height="100" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="342" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Relyatsion model qoidalari</text>
  <text x="60" y="366" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">1. Qatorlar tartibsiz — "birinchi qator" degan tushuncha yo'q (ORDER BY bilan tartiblanadi).</text>
  <text x="60" y="388" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">2. Har katak atomik — bitta qiymat, vergulli ro'yxat yoki ichki struktura emas.</text>
  <text x="60" y="410" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">3. Takror qator yo'q — har tuple kalit orqali noyob (multiset emas, to'plam).</text>
</svg>
