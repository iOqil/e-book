<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <title>Sharding strategiyalari, master-replica replikatsiya va CAP teoremasi</title>
  <rect x="0" y="0" width="800" height="560" fill="#f8fafc"/>
  <text x="400" y="30" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Sharding, replikatsiya va CAP</text>

  <!-- SHARDING -->
  <text x="200" y="62" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">1. Sharding: ma'lumotni ko'p bazaga bo'lish</text>

  <!-- router -->
  <rect x="120" y="76" width="160" height="38" rx="6" fill="#1e293b"/>
  <text x="200" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#f8fafc">shard kaliti -> qaysi shard?</text>

  <line x1="160" y1="114" x2="100" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="200" y1="114" x2="200" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="240" y1="114" x2="300" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="48" y="154" width="100" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="98" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Shard A</text>
  <text x="98" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">id 1..1M</text>
  <rect x="150" y="154" width="100" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="200" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Shard B</text>
  <text x="200" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">id 1M..2M</text>
  <rect x="252" y="154" width="100" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="302" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Shard C</text>
  <text x="302" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">id 2M..3M</text>

  <!-- strategy list -->
  <text x="40" y="238" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Strategiyalar:</text>
  <text x="40" y="260" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">range  - oraliq bo'yicha (issiq nuqta xavfi)</text>
  <text x="40" y="282" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">hash   - teng tarqaladi, range so'rov og'ir</text>
  <text x="40" y="304" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">directory - lookup jadval (moslashuvchan)</text>
  <text x="40" y="326" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">consistent hashing - shard qo'shganda kam ko'chish</text>
  <text x="40" y="352" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">Cross-shard JOIN/tranzaksiya — og'riq nuqtasi</text>

  <!-- REPLICATION -->
  <text x="600" y="62" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">2. Replikatsiya: o'qishni masshtablash</text>

  <rect x="540" y="80" width="120" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">MASTER</text>
  <text x="600" y="118" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yozish (write)</text>

  <line x1="560" y1="126" x2="520" y2="168" stroke="#16a34a" stroke-width="1.5" marker-end="url(#g2)"/>
  <line x1="640" y1="126" x2="680" y2="168" stroke="#16a34a" stroke-width="1.5" marker-end="url(#g2)"/>
  <text x="600" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">repl. oqimi</text>

  <rect x="452" y="172" width="120" height="46" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="512" y="192" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">REPLICA 1</text>
  <text x="512" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">o'qish (read)</text>
  <rect x="628" y="172" width="120" height="46" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="688" y="192" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">REPLICA 2</text>
  <text x="688" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">o'qish (read)</text>

  <text x="452" y="246" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">sinxron  - kafolat, lekin sekinroq</text>
  <text x="452" y="268" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">asinxron - tez, lekin kechikish (lag)</text>
  <text x="452" y="290" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">master-master - konflikt xavfi (ehtiyot bo'l)</text>
  <text x="452" y="312" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Eslatma: replica != shard — bu nusxa, taqsim emas</text>

  <!-- CAP -->
  <rect x="24" y="378" width="752" height="160" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="400" y="406" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">3. CAP teoremasi: tarmoq bo'linganda (P) ikkitasidan birini tanla</text>

  <!-- triangle -->
  <polygon points="160,430 100,510 220,510" fill="none" stroke="#475569" stroke-width="1.5"/>
  <circle cx="160" cy="430" r="6" fill="#2563eb"/>
  <text x="160" y="424" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">C</text>
  <circle cx="100" cy="510" r="6" fill="#16a34a"/>
  <text x="86" y="514" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">A</text>
  <circle cx="220" cy="510" r="6" fill="#d97706"/>
  <text x="234" y="514" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#d97706">P</text>

  <text x="300" y="442" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">C (Consistency) - hamma bir xil eng yangi qiymat ko'radi</text>
  <text x="300" y="466" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">A (Availability) - har so'rov javob oladi</text>
  <text x="300" y="490" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#d97706">P (Partition tolerance) - tarmoq uzilsa ham ishlaydi</text>
  <text x="300" y="520" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Taqsimlangan tizimda P majburiy -> CP (bank) yoki AP (savat) tanlanadi</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
    <marker id="g2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
