<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 580" width="820" height="580">
  <title>Logik ER modeldan fizik DDL skriptga o'tish oqimi: schema, ota jadvallar, bola jadvallar, junction, indekslar tartibi</title>
  <rect x="0" y="0" width="820" height="580" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="bold" fill="#1e293b">Modeldan kodga: DDL skript oqimi va tartibi</text>
  <text x="410" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Tartib muhim: FK ishlashi uchun ota jadval bola jadvaldan AVVAL yaratiladi</text>

  <defs>
    <marker id="arr09c" markerWidth="12" markerHeight="12" refX="6" refY="9" orient="auto" markerUnits="strokeWidth">
      <path d="M2,0 L10,0 L6,9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- left: logical ER -->
  <rect x="24" y="82" width="250" height="466" rx="10" fill="#eef2ff" stroke="#2563eb" stroke-width="2"/>
  <text x="149" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">1. Logik ER model</text>

  <rect x="44" y="124" width="210" height="48" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="149" y="144" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">KATEGORIYA</text>
  <text x="149" y="162" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">1 &#8212;&#8212; N MAHSULOT</text>

  <rect x="44" y="184" width="210" height="48" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="149" y="204" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">MIJOZ</text>
  <text x="149" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">1 &#8212;&#8212; N BUYURTMA</text>

  <rect x="44" y="244" width="210" height="48" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="149" y="264" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">BUYURTMA</text>
  <text x="149" y="282" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">N &#8212;&#8212; M MAHSULOT</text>

  <rect x="44" y="304" width="210" height="48" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="149" y="324" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">MIJOZ_PROFIL</text>
  <text x="149" y="342" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">1 &#8212;&#8212; 1 MIJOZ</text>

  <rect x="44" y="364" width="210" height="48" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="149" y="384" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">MIJOZ_TELEFON</text>
  <text x="149" y="402" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">kuchsiz entity</text>

  <text x="149" y="446" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Bog'lanishni</text>
  <text x="149" y="466" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">kardinallik bo'yicha</text>
  <text x="149" y="486" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tahlil qil &#8594; o'tkazish</text>
  <text x="149" y="506" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">qoidasini tanla</text>

  <!-- arrow -->
  <line x1="280" y1="310" x2="328" y2="310" stroke="#2563eb" stroke-width="3" marker-end="url(#arr09c)"/>

  <!-- right: physical DDL ordered -->
  <rect x="338" y="82" width="458" height="466" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="567" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">2. Fizik DDL skript (tartibda)</text>

  <!-- step boxes -->
  <rect x="358" y="124" width="418" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="382" cy="144" r="13" fill="#16a34a"/><text x="382" y="149" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">1</text>
  <text x="406" y="149" font-family="Consolas, monospace" font-size="14" fill="#1e293b">CREATE SCHEMA shop; SET search_path = shop;</text>

  <rect x="358" y="172" width="418" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="382" cy="192" r="13" fill="#16a34a"/><text x="382" y="197" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">2</text>
  <text x="406" y="197" font-family="Consolas, monospace" font-size="14" fill="#1e293b">OTA jadvallar: kategoriya, mijoz</text>

  <rect x="358" y="220" width="418" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="382" cy="240" r="13" fill="#16a34a"/><text x="382" y="245" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">3</text>
  <text x="406" y="245" font-family="Consolas, monospace" font-size="14" fill="#1e293b">1:N BOLA: mahsulot, buyurtma (FK)</text>

  <rect x="358" y="268" width="418" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="382" cy="288" r="13" fill="#16a34a"/><text x="382" y="293" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">4</text>
  <text x="406" y="293" font-family="Consolas, monospace" font-size="14" fill="#1e293b">1:1 jadval: mijoz_profil (FK=PK)</text>

  <rect x="358" y="316" width="418" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="382" cy="336" r="13" fill="#16a34a"/><text x="382" y="341" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">5</text>
  <text x="406" y="341" font-family="Consolas, monospace" font-size="14" fill="#1e293b">N:M JUNCTION: buyurtma_satri</text>

  <rect x="358" y="364" width="418" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="382" cy="384" r="13" fill="#16a34a"/><text x="382" y="389" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">6</text>
  <text x="406" y="389" font-family="Consolas, monospace" font-size="14" fill="#1e293b">KUCHSIZ: mijoz_telefon (kompozit PK)</text>

  <rect x="358" y="412" width="418" height="40" rx="6" fill="#fef9c3" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="382" cy="432" r="13" fill="#d97706"/><text x="382" y="437" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">7</text>
  <text x="406" y="437" font-family="Consolas, monospace" font-size="14" fill="#1e293b">INDEKSlar: FK ustunlariga (ix_...)</text>

  <rect x="358" y="464" width="418" height="68" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="567" y="488" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">Qoida: avval ota, keyin bola</text>
  <text x="567" y="510" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">REFERENCES ko'rsatgan jadval allaqachon mavjud bo'lishi shart.</text>
</svg>
