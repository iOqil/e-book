<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>Natural kalit va surrogate kalit yondashuvlarining trade-off taqqoslashi</title>

  <!-- fon -->
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>

  <!-- sarlavha -->
  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Natural kalit vs Surrogate kalit</text>
  <text x="380" y="54" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Kalitni "ma'lumotning o'zidan" olamizmi yoki baza o'ylab topadimi?</text>

  <!-- chap: natural -->
  <rect x="30" y="78" width="340" height="360" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="200" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#16a34a">Natural (tabiiy) kalit</text>
  <text x="200" y="130" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-style="italic" fill="#475569">passport_raqami, ISBN, SKU, email</text>

  <text x="50" y="160" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">+ Afzalliklari</text>
  <text x="54" y="182" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">+ Allaqachon ma'noli, biznesga tanish</text>
  <text x="54" y="202" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">+ Qo'shimcha ustun shart emas</text>
  <text x="54" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">+ JOIN da qiymat o'zi tushunarli</text>

  <text x="50" y="256" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">- Kamchiliklari</text>
  <text x="54" y="278" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">- O'zgarishi mumkin (email almashadi)</text>
  <text x="54" y="298" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">- O'zgarsa: hamma FK ham o'zgaradi</text>
  <text x="54" y="318" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">- Uzun/kompozit bo'lsa indeks og'ir</text>
  <text x="54" y="338" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">- Maxfiy ma'lumot ochilib qolishi mumkin</text>

  <text x="50" y="378" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">Qachon:</text>
  <text x="54" y="400" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Qiymat haqiqatan barqaror, qisqa va</text>
  <text x="54" y="418" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">hech qachon o'zgarmasa (masalan ISO kod).</text>

  <!-- o'ng: surrogate -->
  <rect x="390" y="78" width="340" height="360" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="560" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#2563eb">Surrogate (sun'iy) kalit</text>
  <text x="560" y="130" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-style="italic" fill="#475569">id BIGINT IDENTITY, UUID</text>

  <text x="410" y="160" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">+ Afzalliklari</text>
  <text x="414" y="182" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">+ Hech qachon o'zgarmaydi (barqaror)</text>
  <text x="414" y="202" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">+ Qisqa, bir xil tur, JOIN tez</text>
  <text x="414" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">+ Biznes mantiqdan mustaqil</text>

  <text x="410" y="256" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">- Kamchiliklari</text>
  <text x="414" y="278" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">- O'zi hech ma'no bermaydi (98765?)</text>
  <text x="414" y="298" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">- Qo'shimcha ustun va indeks kerak</text>
  <text x="414" y="318" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">- Tabiiy dublikatni o'zi to'smaydi</text>
  <text x="414" y="338" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">  (UNIQUE constraint qo'shish kerak)</text>

  <text x="410" y="378" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">Qachon:</text>
  <text x="414" y="400" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Deyarli har doim (standart tanlov).</text>
  <text x="414" y="418" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Tabiiy qiymatni UNIQUE bilan saqlang.</text>

  <!-- pastki maslahat -->
  <text x="380" y="460" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#d97706">Ekspert tanlovi: surrogate PK + tabiiy ustunga UNIQUE (ikkalasining yaxshisini ol).</text>
</svg>
