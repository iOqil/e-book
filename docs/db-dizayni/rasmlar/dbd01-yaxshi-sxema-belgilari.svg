<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440">
  <title>Yaxshi va yomon sxema belgilari taqqoslash jadvali</title>

  <!-- fon -->
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>

  <!-- sarlavha -->
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Yaxshi sxemani qanday taniydi?</text>

  <!-- ikki ustun sarlavhasi -->
  <rect x="30" y="56" width="350" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="205" y="82" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">Yaxshi sxema</text>

  <rect x="390" y="56" width="350" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="565" y="82" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">Yomon sxema</text>

  <!-- qator 1 -->
  <rect x="30" y="102" width="350" height="52" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="58" y="124" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">+</text>
  <text x="78" y="124" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Har fakt bir joyda saqlanadi</text>
  <text x="78" y="143" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(takrorsiz, yagona haqiqat manbasi)</text>
  <rect x="390" y="102" width="350" height="52" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="418" y="124" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">-</text>
  <text x="438" y="124" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Bir fakt o'nlab joyda takrorlanadi</text>
  <text x="438" y="143" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(o'zgartirish anomaliyasi)</text>

  <!-- qator 2 -->
  <rect x="30" y="154" width="350" height="52" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="58" y="176" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">+</text>
  <text x="78" y="176" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Qoidalar bazada majburlanadi</text>
  <text x="78" y="195" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(PK, FK, CHECK, NOT NULL)</text>
  <rect x="390" y="154" width="350" height="52" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="418" y="176" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">-</text>
  <text x="438" y="176" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Qoidalar faqat ilovada (yoki yo'q)</text>
  <text x="438" y="195" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(buzuq ma'lumot oqib kiradi)</text>

  <!-- qator 3 -->
  <rect x="30" y="206" width="350" height="52" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="58" y="228" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">+</text>
  <text x="78" y="228" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Nomlar tushunarli va izchil</text>
  <text x="78" y="247" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(mijoz_id, yaratilgan_vaqt)</text>
  <rect x="390" y="206" width="350" height="52" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="418" y="228" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">-</text>
  <text x="438" y="228" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Sirli nomlar: data1, data2, flag</text>
  <text x="438" y="247" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(hech kim ma'nosini bilmaydi)</text>

  <!-- qator 4 -->
  <rect x="30" y="258" width="350" height="52" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="58" y="280" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">+</text>
  <text x="78" y="280" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">To'g'ri turlar tanlangan</text>
  <text x="78" y="299" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(pul NUMERIC, vaqt timestamptz)</text>
  <rect x="390" y="258" width="350" height="52" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="418" y="280" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">-</text>
  <text x="438" y="280" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Hamma narsa TEXT yoki float pul</text>
  <text x="438" y="299" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(dumaloqlash xatosi, yashirin bug)</text>

  <!-- qator 5 -->
  <rect x="30" y="310" width="350" height="52" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="58" y="332" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">+</text>
  <text x="78" y="332" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">O'sishga va o'zgarishga tayyor</text>
  <text x="78" y="351" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(yangi talab sxemani sindirmaydi)</text>
  <rect x="390" y="310" width="350" height="52" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="418" y="332" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">-</text>
  <text x="438" y="332" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Har yangi talab katta refaktoring</text>
  <text x="438" y="351" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(qotib qolgan, mo'rt struktura)</text>

  <!-- pastki izoh -->
  <text x="380" y="400" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Yaxshi sxema — soddaroq emas, balki haqiqatga to'g'riroq mos kelgan sxema.</text>
  <text x="380" y="424" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">"Avval o'lcha, keyin kes" — ma'lumotni tushunmasdan jadval tuzma.</text>
</svg>
