<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 580" width="820" height="580">
  <title>FK ON DELETE strategiyasini tanlash: CASCADE, RESTRICT, SET NULL qachon to'g'ri degan qaror jadvali</title>
  <rect x="0" y="0" width="820" height="580" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="bold" fill="#1e293b">FK ON DELETE: qaysi strategiya, qachon?</text>
  <text x="410" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">"Ota qator o'chsa, bog'liq bola qatorlarga nima bo'ladi?" degan savolga javob</text>

  <!-- central question -->
  <rect x="290" y="80" width="240" height="56" rx="28" fill="#1e293b"/>
  <text x="410" y="106" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Bola ota qatorsiz</text>
  <text x="410" y="126" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">ma'noga egami?</text>

  <!-- CASCADE -->
  <rect x="24" y="164" width="248" height="172" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="148" y="190" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">CASCADE</text>
  <text x="148" y="212" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" font-weight="bold">Bola ham o'chadi</text>
  <line x1="40" y1="222" x2="256" y2="222" stroke="#fca5a5" stroke-width="1"/>
  <text x="40" y="244" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Bola otaga "tegishli",</text>
  <text x="40" y="262" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">otasiz ma'nosiz</text>
  <text x="40" y="280" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(composition).</text>
  <text x="40" y="304" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" font-weight="bold">Masalan:</text>
  <text x="40" y="322" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">post o'chsa -&gt; izohlari</text>

  <!-- RESTRICT -->
  <rect x="286" y="164" width="248" height="172" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="410" y="190" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#d97706">RESTRICT / NO ACTION</text>
  <text x="410" y="212" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" font-weight="bold">O'chirishni TAQIQLAYDI</text>
  <line x1="302" y1="222" x2="518" y2="222" stroke="#fcd34d" stroke-width="1"/>
  <text x="302" y="244" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Bola bor ekan, otani</text>
  <text x="302" y="262" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">o'chirib bo'lmaydi</text>
  <text x="302" y="280" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(eng xavfsiz, default).</text>
  <text x="302" y="304" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" font-weight="bold">Masalan:</text>
  <text x="302" y="322" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tovarli kategoriya</text>

  <!-- SET NULL -->
  <rect x="548" y="164" width="248" height="172" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="672" y="190" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">SET NULL / SET DEFAULT</text>
  <text x="672" y="212" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" font-weight="bold">Bola yashaydi, bog' uziladi</text>
  <line x1="564" y1="222" x2="780" y2="222" stroke="#93c5fd" stroke-width="1"/>
  <text x="564" y="244" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Bola otasiz ham mavjud</text>
  <text x="564" y="262" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">bo'la oladi (FK ustun</text>
  <text x="564" y="280" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">NULL bo'lishi shart).</text>
  <text x="564" y="304" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" font-weight="bold">Masalan:</text>
  <text x="564" y="322" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">xodim o'chsa -&gt; vazifa</text>

  <!-- arrows from question -->
  <defs>
    <marker id="ard" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#475569"/>
    </marker>
  </defs>
  <line x1="330" y1="136" x2="160" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#ard)"/>
  <text x="210" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">Yo'q, otaning bir qismi</text>
  <line x1="410" y1="138" x2="410" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#ard)"/>
  <line x1="490" y1="136" x2="660" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#ard)"/>
  <text x="600" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">Ha, mustaqil</text>

  <!-- decision table -->
  <text x="40" y="378" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Tezkor qaror jadvali</text>
  <rect x="24" y="392" width="772" height="32" fill="#1e293b"/>
  <text x="40" y="413" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Vaziyat</text>
  <text x="430" y="413" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Tavsiya etilgan strategiya</text>

  <rect x="24" y="424" width="772" height="30" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="444" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Bola otaning ajralmas qismi (buyurtma satri, izoh, rasm)</text>
  <text x="430" y="444" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">CASCADE</text>

  <rect x="24" y="454" width="772" height="30" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="40" y="474" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Muhim ma'lumotni tasodifan yo'qotishdan saqlash (to'lov, hisob)</text>
  <text x="430" y="474" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#d97706">RESTRICT (default tanlov)</text>

  <rect x="24" y="484" width="772" height="30" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="504" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Bog'lanish ixtiyoriy; ota ketsa ham bola saqlanadi (vazifa egasi)</text>
  <text x="430" y="504" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">SET NULL</text>

  <rect x="24" y="514" width="772" height="30" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="40" y="534" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Ota ketsa, "zaxira" qiymatga o'tsin (muallif -&gt; "Anonim")</text>
  <text x="430" y="534" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">SET DEFAULT</text>

  <rect x="24" y="544" width="772" height="30" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="564" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Shubha bo'lsa — eng xavfsizidan boshla, keyin zarurat bo'yicha bo'shat</text>
  <text x="430" y="564" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#d97706">RESTRICT -&gt; keyin yumshat</text>
</svg>
