<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <title>Jaywalking anti-naqshi: vergulli ro'yxat bitta ustunda (yomon) va junction (bog'lovchi) jadval (yaxshi)</title>
  <rect x="0" y="0" width="800" height="520" fill="#f8fafc"/>
  <text x="400" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Jaywalking: vergulli ro'yxat vs junction jadval</text>
  <text x="400" y="54" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Savol: "5-tegli maqolalar?"</text>

  <!-- LEFT: bad -->
  <rect x="24" y="74" width="344" height="200" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="196" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">YOMON: teglar bitta ustunda</text>

  <rect x="44" y="112" width="120" height="26" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
  <rect x="164" y="112" width="184" height="26" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
  <text x="104" y="130" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">nomi</text>
  <text x="256" y="130" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">teglar (text)</text>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">
    <rect x="44" y="138" width="304" height="24" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
    <text x="104" y="155" text-anchor="middle">PostgreSQL</text><text x="256" y="155" text-anchor="middle" font-weight="bold" fill="#16a34a">1,5,9</text>
    <rect x="44" y="162" width="304" height="24" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
    <text x="104" y="179" text-anchor="middle">Indekslar</text><text x="256" y="179" text-anchor="middle" font-weight="bold" fill="#dc2626">12,15</text>
    <rect x="44" y="186" width="304" height="24" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
    <text x="104" y="203" text-anchor="middle">Normalizatsiya</text><text x="256" y="203" text-anchor="middle" font-weight="bold" fill="#dc2626">2,50</text>
  </g>
  <text x="44" y="232" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">WHERE teglar LIKE '%5%'</text>
  <text x="44" y="252" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">15 va 50 ham "topiladi" — NOTOG'RI!</text>
  <text x="44" y="268" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Indeks yo'q, FK yo'q, JOIN qiyin.</text>

  <!-- arrow -->
  <line x1="376" y1="174" x2="424" y2="174" stroke="#16a34a" stroke-width="3" marker-end="url(#ar13j)"/>
  <defs>
    <marker id="ar13j" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#16a34a"/>
    </marker>
  </defs>
  <text x="400" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">N:M</text>

  <!-- RIGHT: good (3 tables) -->
  <rect x="436" y="74" width="158" height="92" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="515" y="94" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">maqola</text>
  <line x1="436" y1="102" x2="594" y2="102" stroke="#2563eb" stroke-width="1"/>
  <text x="448" y="122" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">id (PK)</text>
  <text x="448" y="142" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">nomi</text>

  <rect x="622" y="74" width="154" height="92" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="699" y="94" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">teg</text>
  <line x1="622" y1="102" x2="776" y2="102" stroke="#2563eb" stroke-width="1"/>
  <text x="634" y="122" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">id (PK)</text>
  <text x="634" y="142" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">nomi</text>

  <rect x="512" y="206" width="190" height="116" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="607" y="226" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">maqola_teg</text>
  <line x1="512" y1="234" x2="702" y2="234" stroke="#16a34a" stroke-width="1"/>
  <text x="524" y="254" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">maqola_id (FK, PK)</text>
  <text x="524" y="274" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">teg_id (FK, PK)</text>
  <text x="524" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" font-weight="bold">bog'lovchi (junction)</text>

  <!-- crow's foot-ish connectors -->
  <line x1="515" y1="166" x2="560" y2="206" stroke="#475569" stroke-width="1.5"/>
  <line x1="699" y1="166" x2="655" y2="206" stroke="#475569" stroke-width="1.5"/>
  <text x="520" y="196" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">1</text>
  <text x="690" y="196" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">1</text>
  <text x="556" y="200" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">N</text>
  <text x="650" y="200" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">N</text>

  <!-- bottom explanation -->
  <rect x="24" y="330" width="752" height="174" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="40" y="354" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Nega junction (bog'lovchi) jadval yaxshi?</text>
  <text x="40" y="380" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" font-weight="bold">Aniq:</text>
  <text x="92" y="380" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">WHERE teg_id = 5 — chegara muammosi yo'q (15, 50 false-positive bermaydi).</text>
  <text x="40" y="404" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" font-weight="bold">Tez:</text>
  <text x="84" y="404" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">teg_id ustuniga indeks qo'yiladi (vergulli matnga indeks ishlamaydi).</text>
  <text x="40" y="428" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" font-weight="bold">Yaxlit:</text>
  <text x="96" y="428" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">FK mavjud bo'lmagan tegga ishora qilishni to'xtatadi (yetim ID yo'q).</text>
  <text x="40" y="452" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" font-weight="bold">Boy:</text>
  <text x="84" y="452" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">"har teg nechta maqolada" kabi agregat oson — bitta GROUP BY.</text>
  <text x="40" y="482" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb" font-weight="bold">Qoida: ko'p qiymatni vergul bilan emas, alohida qatorlarda saqlang (1NF + junction).</text>
</svg>
