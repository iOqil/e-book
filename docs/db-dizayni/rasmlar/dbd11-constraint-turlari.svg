<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <title>Olti constraint turi va ularning har biri ma'lumotning qaysi yaxlitlik xususiyatini himoya qilishi</title>
  <rect x="0" y="0" width="800" height="560" fill="#f8fafc"/>
  <text x="400" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="bold" fill="#1e293b">Constraint turlari: har biri nimani himoya qiladi</text>
  <text x="400" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Yaxlitlik qoidasi BAZADA majburlanadi — ilova kodi xato qilsa ham himoya turadi</text>

  <!-- NOT NULL -->
  <rect x="24" y="80" width="240" height="140" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="144" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#2563eb">NOT NULL</text>
  <text x="144" y="134" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" font-weight="bold">Mavjudlik</text>
  <text x="144" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Ustun bo'sh (NULL)</text>
  <text x="144" y="176" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">qolmasligini kafolatlaydi.</text>
  <text x="144" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Masalan: email majburiy</text>

  <!-- DEFAULT -->
  <rect x="280" y="80" width="240" height="140" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="400" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#2563eb">DEFAULT</text>
  <text x="400" y="134" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" font-weight="bold">Standart qiymat</text>
  <text x="400" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Qiymat berilmasa,</text>
  <text x="400" y="176" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">baza o'zi to'ldiradi.</text>
  <text x="400" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Masalan: holat = 'faol'</text>

  <!-- UNIQUE -->
  <rect x="536" y="80" width="240" height="140" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="656" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#2563eb">UNIQUE</text>
  <text x="656" y="134" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" font-weight="bold">Takrorlanmaslik</text>
  <text x="656" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Qiymat (yoki ustunlar</text>
  <text x="656" y="176" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">jufti) bir marta uchraydi.</text>
  <text x="656" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Masalan: email yagona</text>

  <!-- CHECK -->
  <rect x="24" y="240" width="240" height="140" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="144" y="268" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#d97706">CHECK</text>
  <text x="144" y="294" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" font-weight="bold">Qiymat qoidasi</text>
  <text x="144" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Mantiqiy shartni</text>
  <text x="144" y="336" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">qondiradigan qiymatlar.</text>
  <text x="144" y="360" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Masalan: narx &gt;= 0</text>

  <!-- PRIMARY KEY -->
  <rect x="280" y="240" width="240" height="140" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="400" y="268" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#16a34a">PRIMARY KEY</text>
  <text x="400" y="294" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" font-weight="bold">Entity yaxlitligi</text>
  <text x="400" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Har qator yakka-yagona</text>
  <text x="400" y="336" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(UNIQUE + NOT NULL).</text>
  <text x="400" y="360" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Masalan: id</text>

  <!-- FOREIGN KEY -->
  <rect x="536" y="240" width="240" height="140" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="656" y="268" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#16a34a">FOREIGN KEY</text>
  <text x="656" y="294" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" font-weight="bold">Murojaat yaxlitligi</text>
  <text x="656" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Ko'rsatilgan qator</text>
  <text x="656" y="336" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">haqiqatan mavjud.</text>
  <text x="656" y="360" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Masalan: post_id -&gt; post</text>

  <!-- EXCLUDE (full width) -->
  <rect x="24" y="400" width="752" height="84" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="44" y="430" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#7c3aed">EXCLUDE</text>
  <text x="44" y="456" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Oraliq yaxlitligi (PostgreSQL)</text>
  <text x="44" y="476" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Ikki qator bir vaqtda "ziddiyatli" bo'lolmaydi — masalan bir xona uchun bron oraliqlari UST-UST tushmaydi.</text>
  <text x="640" y="448" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">btree_gist kengaytmasi</text>
  <text x="640" y="466" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">bilan: davr WITH &amp;&amp;</text>

  <!-- footer legend -->
  <rect x="24" y="504" width="752" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="40" y="514" width="18" height="18" fill="#dbeafe" stroke="#2563eb"/>
  <text x="66" y="528" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Ustun darajasi</text>
  <rect x="200" y="514" width="18" height="18" fill="#fef3c7" stroke="#d97706"/>
  <text x="226" y="528" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Qiymat qoidasi</text>
  <rect x="360" y="514" width="18" height="18" fill="#dcfce7" stroke="#16a34a"/>
  <text x="386" y="528" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Bog'lanish/kalit yaxlitligi</text>
  <rect x="580" y="514" width="18" height="18" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="606" y="528" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Oraliq/ziddiyat (PG)</text>
</svg>
