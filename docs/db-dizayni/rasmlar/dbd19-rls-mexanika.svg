<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560">
  <title>Row-Level Security mexanikasi: SET app.tenant_id va policy USING filtri har bir tenant qatorlarini izolyatsiya qiladi</title>
  <rect x="0" y="0" width="880" height="560" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">RLS qanday ishlaydi: policy ko'rinmas WHERE qo'shadi</text>
  <text x="440" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">PostgreSQL har so'rovga avtomatik: WHERE tenant_id = current_setting('app.tenant_id')</text>

  <!-- App layer two tenants -->
  <rect x="40" y="84" width="260" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="110" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Ulanish: Acme foydalanuvchisi</text>
  <text x="56" y="138" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">SET app.tenant_id = '1';</text>
  <text x="56" y="162" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">SELECT * FROM kurs;</text>
  <text x="56" y="188" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">(WHERE yozmaydi!)</text>

  <rect x="40" y="216" width="260" height="120" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="170" y="242" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Ulanish: Globex foydalanuvchisi</text>
  <text x="56" y="270" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">SET app.tenant_id = '2';</text>
  <text x="56" y="294" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">SELECT * FROM kurs;</text>
  <text x="56" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#d97706">(WHERE yozmaydi!)</text>

  <!-- arrows to policy engine -->
  <line x1="300" y1="144" x2="372" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="300" y1="276" x2="372" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Policy engine -->
  <rect x="376" y="150" width="200" height="140" rx="10" fill="#475569" stroke="#1e293b" stroke-width="2"/>
  <text x="476" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">RLS Policy</text>
  <text x="476" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#e2e8f0">kurs_tenant_izol</text>
  <rect x="392" y="212" width="168" height="62" rx="4" fill="#ffffff"/>
  <text x="400" y="232" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">USING (</text>
  <text x="408" y="250" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">tenant_id = </text>
  <text x="408" y="268" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">current_setting(...)::int )</text>

  <!-- arrow to table -->
  <line x1="576" y1="220" x2="636" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Table -->
  <rect x="640" y="120" width="200" height="200" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="740" y="144" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">kurs (jadval)</text>
  <rect x="656" y="156" width="168" height="26" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="664" y="174" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">id=1 tenant_id=1 Python</text>
  <rect x="656" y="184" width="168" height="26" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="664" y="202" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">id=2 tenant_id=1 SQL</text>
  <rect x="656" y="212" width="168" height="26" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="664" y="230" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#92400e">id=3 tenant_id=2 IELTS</text>
  <rect x="656" y="240" width="168" height="26" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="664" y="258" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#92400e">id=4 tenant_id=2 Ingliz</text>
  <rect x="656" y="268" width="168" height="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="664" y="286" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">id=5 tenant_id=3 Dizayn</text>

  <!-- Results -->
  <rect x="40" y="364" width="380" height="130" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="230" y="390" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#166534">Acme (tenant 1) ko'radi:</text>
  <rect x="60" y="402" width="340" height="26" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="72" y="420" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">id=1 Python · id=2 SQL</text>
  <text x="230" y="452" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">tenant 2 va 3 qatorlari UMUMAN ko'rinmaydi</text>
  <text x="230" y="476" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">(2/5 qator — baza filtrladi)</text>

  <rect x="460" y="364" width="380" height="130" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="650" y="390" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#92400e">Globex (tenant 2) ko'radi:</text>
  <rect x="480" y="402" width="340" height="26" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="492" y="420" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#92400e">id=3 IELTS · id=4 Ingliz</text>
  <text x="650" y="452" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#92400e">tenant 1 va 3 qatorlari UMUMAN ko'rinmaydi</text>
  <text x="650" y="476" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#92400e">(2/5 qator — baza filtrladi)</text>

  <!-- warning -->
  <rect x="40" y="508" width="800" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="56" y="533" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#991b1b">Diqqat: superuser va BYPASSRLS rolli foydalanuvchi RLS ni AYLANIB o'tadi. Ilova oddiy (NOSUPERUSER) rol bilan ulansin; egasiga ham qo'llash uchun FORCE ROW LEVEL SECURITY.</text>
</svg>
