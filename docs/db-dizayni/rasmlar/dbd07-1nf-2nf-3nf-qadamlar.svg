<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 640" width="860" height="640">
  <title>Bitta jadvalning 1NF, 2NF va 3NF bo'ylab qadam-baqadam parchalanishi</title>
  <rect x="0" y="0" width="860" height="640" fill="#f8fafc"/>
  <text x="430" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Normalizatsiya qadamlari: 0NF -&gt; 1NF -&gt; 2NF -&gt; 3NF</text>

  <!-- 0NF -->
  <text x="40" y="72" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">Boshlang'ich (normallashmagan): buyurtma</text>
  <rect x="40" y="84" width="780" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="56" y="106" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">buyurtma_id, mijoz_id, mijoz_ism, mahsulotlar="Telefon; Chexol", mahsulot_narx, miqdor</text>
  <text x="56" y="126" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">Muammo: "mahsulotlar" katagida ro'yxat (atomik emas) + kompozit kalit kerak bo'ladi</text>

  <!-- arrow -->
  <line x1="430" y1="138" x2="430" y2="160" stroke="#16a34a" stroke-width="2" marker-end="url(#ar)"/>
  <text x="448" y="154" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">1NF: ro'yxatni qatorlarga yoy (atomiklik)</text>

  <!-- 1NF -->
  <text x="40" y="186" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#d97706">1NF: har katak atomik. PK = (buyurtma_id, mahsulot_id)</text>
  <rect x="40" y="198" width="780" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="56" y="220" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b"><tspan font-weight="bold" fill="#2563eb">buyurtma_id</tspan>, <tspan font-weight="bold" fill="#2563eb">mahsulot_id</tspan>, mijoz_id, mijoz_ism, mahsulot_nomi, mahsulot_narx, miqdor</text>
  <text x="56" y="240" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#d97706">Muammo: mijoz_ism faqat buyurtma_id ga bog'liq (kalitning QISMI) -&gt; qisman bog'liqlik</text>

  <!-- arrow -->
  <line x1="430" y1="252" x2="430" y2="274" stroke="#16a34a" stroke-width="2" marker-end="url(#ar)"/>
  <text x="448" y="268" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">2NF: qisman bog'liq atributlarni ajrat</text>

  <!-- 2NF: two tables -->
  <text x="40" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">2NF: kalit qismiga bog'liqlik yo'q</text>
  <rect x="40" y="312" width="250" height="92" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="56" y="334" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">buyurtmalar</text>
  <text x="56" y="356" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">buyurtma_id (PK)</text>
  <text x="56" y="376" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">mijoz_id, mijoz_ism,</text>
  <text x="56" y="394" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">mahsulot_narx?</text>

  <rect x="310" y="312" width="250" height="92" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="326" y="334" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">mahsulotlar</text>
  <text x="326" y="356" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">mahsulot_id (PK)</text>
  <text x="326" y="376" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">mahsulot_nomi,</text>
  <text x="326" y="394" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">mahsulot_narx</text>

  <rect x="580" y="312" width="240" height="92" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="596" y="334" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">buyurtma_qatorlari</text>
  <text x="596" y="356" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">(buyurtma_id, mahsulot_id) PK</text>
  <text x="596" y="376" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">miqdor</text>
  <text x="596" y="394" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">+ narx_snapshot</text>

  <text x="40" y="424" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#d97706">Muammo (buyurtmalar): mijoz_ism mijoz_id ga bog'liq, mijoz_id esa PK emas -&gt; tranzitiv bog'liqlik</text>

  <!-- arrow -->
  <line x1="430" y1="432" x2="430" y2="456" stroke="#16a34a" stroke-width="2" marker-end="url(#ar)"/>
  <text x="448" y="450" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">3NF: tranzitiv bog'liqlikni ajrat</text>

  <!-- 3NF -->
  <text x="40" y="482" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">3NF: nokalit atribut faqat kalitga bog'liq</text>
  <rect x="40" y="494" width="250" height="96" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="56" y="516" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">mijozlar</text>
  <text x="56" y="538" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">mijoz_id (PK)</text>
  <text x="56" y="558" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">ism, telefon</text>

  <rect x="310" y="494" width="250" height="96" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="326" y="516" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">buyurtmalar</text>
  <text x="326" y="538" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">buyurtma_id (PK)</text>
  <text x="326" y="558" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#f59e0b">mijoz_id (FK)</text>
  <text x="326" y="578" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">sana, holat</text>

  <rect x="580" y="494" width="240" height="96" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="596" y="516" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">mahsulotlar + buyurtma_qatorlari</text>
  <text x="596" y="538" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">(2NF dagidek, FK lar bilan</text>
  <text x="596" y="558" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">bog'langan)</text>
  <text x="596" y="578" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Har fakt — bir joyda.</text>

  <text x="430" y="618" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">Natija: takror yo'q, har anomaliya bartaraf, FK bilan bog'langan toza sxema.</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
