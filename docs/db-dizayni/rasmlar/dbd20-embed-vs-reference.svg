<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" width="860" height="620">
  <title>MongoDB embed va reference qarori: qaror daraxti</title>
  <rect x="0" y="0" width="860" height="620" fill="#f8fafc"/>
  <text x="430" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="bold" fill="#1e293b">EMBED yoki REFERENCE? &#8212; Qaror daraxti</text>
  <text x="430" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Document modellashtirishning markaziy qarori (MongoDB)</text>

  <!-- Start -->
  <rect x="300" y="78" width="260" height="48" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="430" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">A bola-ma'lumotni qayerga?</text>

  <!-- Q1 -->
  <line x1="430" y1="126" x2="430" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <rect x="230" y="150" width="400" height="58" rx="8" fill="#fef9c3" stroke="#d97706" stroke-width="2"/>
  <text x="430" y="174" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Bola ota bilan birga o'qiladimi va kam o'zgaradimi?</text>
  <text x="430" y="195" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">("bir marta o'qisang, hammasi kerakmi")</text>

  <!-- Yes -> embed -->
  <line x1="230" y1="179" x2="150" y2="179" stroke="#16a34a" stroke-width="2"/>
  <line x1="150" y1="179" x2="150" y2="240" stroke="#16a34a" stroke-width="2"/>
  <text x="190" y="171" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">HA</text>
  <rect x="40" y="240" width="280" height="150" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="180" y="266" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">EMBED (ichiga joyla)</text>
  <text x="56" y="290" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">order: { items: [ ... ] }</text>
  <text x="56" y="312" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">+ bitta o'qish, atomik yozuv</text>
  <text x="56" y="332" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">+ JOIN kerak emas</text>
  <text x="56" y="354" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Misol: buyurtma satrlari,</text>
  <text x="56" y="372" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">manzil, sozlamalar</text>

  <!-- No -> Q2 -->
  <line x1="630" y1="179" x2="710" y2="179" stroke="#475569" stroke-width="2"/>
  <line x1="710" y1="179" x2="710" y2="240" stroke="#475569" stroke-width="2"/>
  <text x="672" y="171" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">YO'Q</text>
  <rect x="560" y="240" width="280" height="78" rx="8" fill="#fef9c3" stroke="#d97706" stroke-width="2"/>
  <text x="700" y="266" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Cheksiz o'sadimi yoki</text>
  <text x="700" y="286" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">mustaqil so'raladimi?</text>
  <text x="700" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(N:M, ko'p egada ulashiladi)</text>

  <!-- Q2 yes -> reference -->
  <line x1="700" y1="318" x2="700" y2="362" stroke="#d97706" stroke-width="2"/>
  <text x="742" y="344" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#d97706">HA</text>
  <rect x="560" y="362" width="280" height="170" rx="8" fill="#fed7aa" stroke="#d97706" stroke-width="2"/>
  <text x="700" y="388" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#d97706">REFERENCE (ishora)</text>
  <text x="576" y="412" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">order: { userId: ObjectId(..) }</text>
  <text x="576" y="434" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">+ cheksiz o'sishga chidaydi</text>
  <text x="576" y="454" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">+ bir egani ko'p joy ulashadi</text>
  <text x="576" y="476" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">&#8722; $lookup / 2-so'rov kerak</text>
  <text x="576" y="496" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Misol: user, mahsulot katalogi,</text>
  <text x="576" y="514" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">komment oqimi (cheksiz)</text>

  <!-- Q2 no -> embed (small/stable) -->
  <line x1="560" y1="280" x2="430" y2="280" stroke="#16a34a" stroke-width="2"/>
  <line x1="430" y1="280" x2="430" y2="362" stroke="#16a34a" stroke-width="2"/>
  <text x="495" y="272" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">YO'Q</text>
  <rect x="300" y="362" width="240" height="170" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="420" y="388" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">EMBED (chegarali)</text>
  <text x="316" y="412" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Kichik, chegarali massiv</text>
  <text x="316" y="432" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">ichiga joylanadi, ammo</text>
  <text x="316" y="454" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">o'sishni cheklash kerak</text>
  <text x="316" y="478" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">&#8722; 16MB hujjat chegarasi</text>
  <text x="316" y="498" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">&#8722; massiv o'sishi = sekinlik</text>
  <text x="316" y="518" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Hibrid: oxirgi 10 ta embed,</text>

  <!-- footer rule -->
  <rect x="40" y="552" width="780" height="50" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="430" y="574" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Qoida: "birga so'raladigan, chegarali, kam o'zgaradigan" &#8594; embed. "Cheksiz, ulashiladigan, mustaqil" &#8594; reference.</text>
  <text x="430" y="594" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" font-style="italic">Denormalizatsiya NoSQL da norma &#8212; lekin nusxa ko'paygach, yangilash mas'uliyati ilovaga o'tadi.</text>
</svg>
