<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560">
  <title>Chap: recursive CTE adjacency list daraxtni qadam-baqadam aylanadi (iteratsiyalar). O'ng: graf munosabati qirralar (edges) jadvali bilan modellashtiriladi</title>
  <rect x="0" y="0" width="880" height="560" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="bold" fill="#1e293b">Recursive CTE aylanishi va graf qirralar jadvali</text>

  <!-- divider -->
  <line x1="440" y1="56" x2="440" y2="540" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- LEFT: recursive CTE -->
  <text x="220" y="80" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">Recursive CTE: shoxni qadamlab aylanish</text>
  <text x="220" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">WITH RECURSIVE — adjacency list ustida</text>

  <!-- step 0: anchor -->
  <rect x="24" y="116" width="392" height="74" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="36" y="136" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">Anchor (boshlang'ich): WHERE id = 2</text>
  <text x="36" y="158" font-family="Consolas, monospace" font-size="13" fill="#1e293b">SELECT id, nom, 0 AS daraja</text>
  <text x="36" y="178" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">-&gt; {2 Kompyuter, daraja 0}</text>

  <text x="220" y="206" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" fill="#475569">&#8595; UNION ALL (takror)</text>

  <!-- iteration 1 -->
  <rect x="24" y="216" width="392" height="66" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="36" y="236" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">Iteratsiya 1: parent_id IN (2)</text>
  <text x="36" y="258" font-family="Consolas, monospace" font-size="13" fill="#1e293b">JOIN shox ON k.parent_id = s.id</text>
  <text x="36" y="276" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">-&gt; {4 Noutbuk, 5 Stol — daraja 1}</text>

  <text x="220" y="300" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#475569">&#8595;</text>

  <!-- iteration 2 -->
  <rect x="24" y="308" width="392" height="66" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="36" y="328" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#d97706">Iteratsiya 2: parent_id IN (4, 5)</text>
  <text x="36" y="350" font-family="Consolas, monospace" font-size="13" fill="#1e293b">JOIN shox ON k.parent_id = s.id</text>
  <text x="36" y="368" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">-&gt; {6 Gaming — daraja 2}</text>

  <text x="220" y="392" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#475569">&#8595;</text>

  <!-- stop -->
  <rect x="24" y="400" width="392" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="36" y="420" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">Iteratsiya 3: yangi qator YO'Q -&gt; TO'XTAYDI</text>
  <text x="36" y="438" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Natija = barcha iteratsiyalar yig'indisi</text>

  <!-- result -->
  <rect x="24" y="456" width="392" height="74" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="36" y="476" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Yakuniy natija (daraja bo'yicha):</text>
  <text x="36" y="496" font-family="Consolas, monospace" font-size="13" fill="#1e293b">0  Kompyuter | 1  Noutbuk | 1  Stol</text>
  <text x="36" y="514" font-family="Consolas, monospace" font-size="13" fill="#1e293b">2  Gaming noutbuk</text>

  <!-- RIGHT: graph edges -->
  <text x="660" y="80" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">Graf: ko'p-ko'p munosabat = qirralar jadvali</text>
  <text x="660" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">"kuzatuv" (follow) — yo'naltirilgan qirra</text>

  <!-- graph nodes -->
  <defs>
    <marker id="garr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <!-- positions: Ali(1) center, Vali(2), Guli(3), Hasan(4), Laylo(5) -->
  <!-- edges: 1->2,1->3,2->3,3->1,4->1,5->1,2->4 -->
  <line x1="565" y1="150" x2="640" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#garr)"/>
  <line x1="555" y1="160" x2="500" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#garr)"/>
  <line x1="650" y1="210" x2="520" y2="225" stroke="#475569" stroke-width="2" marker-end="url(#garr)"/>
  <line x1="495" y1="215" x2="550" y2="165" stroke="#16a34a" stroke-width="2.5" marker-end="url(#garr)"/>
  <line x1="600" y1="280" x2="560" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#garr)"/>
  <line x1="730" y1="270" x2="575" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#garr)"/>
  <line x1="660" y1="215" x2="615" y2="275" stroke="#475569" stroke-width="2" marker-end="url(#garr)"/>

  <circle cx="560" cy="148" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="560" y="153" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Ali</text>
  <circle cx="660" cy="210" r="24" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="215" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Vali</text>
  <circle cx="480" cy="222" r="24" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="227" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Guli</text>
  <circle cx="600" cy="298" r="24" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="600" y="303" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Hasan</text>
  <circle cx="748" cy="284" r="24" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="748" y="289" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Laylo</text>

  <text x="500" y="195" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" font-weight="bold">o'zaro</text>

  <!-- edges table -->
  <text x="660" y="350" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">kuzatuv (edges) jadvali</text>
  <rect x="500" y="362" width="160" height="30" fill="#475569"/>
  <rect x="660" y="362" width="160" height="30" fill="#475569"/>
  <text x="580" y="382" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#ffffff">kim_id</text>
  <text x="740" y="382" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#ffffff">kimni_id</text>
  <g font-family="Consolas, monospace" font-size="13" fill="#1e293b">
    <rect x="500" y="392" width="320" height="24" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="580" y="409" text-anchor="middle">1 (Ali)</text><text x="740" y="409" text-anchor="middle">2 (Vali)</text>
    <rect x="500" y="416" width="320" height="24" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="580" y="433" text-anchor="middle">1 (Ali)</text><text x="740" y="433" text-anchor="middle">3 (Guli)</text>
    <rect x="500" y="440" width="320" height="24" fill="#dcfce7" stroke="#e2e8f0"/>
    <text x="580" y="457" text-anchor="middle">3 (Guli)</text><text x="740" y="457" text-anchor="middle">1 (Ali)</text>
    <rect x="500" y="464" width="320" height="24" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="580" y="481" text-anchor="middle">2 (Vali)</text><text x="740" y="481" text-anchor="middle">4 (Hasan)</text>
  </g>
  <text x="660" y="508" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" font-weight="bold">1&#8596;3 ikki yo'nalishda -&gt; o'zaro (mutual)</text>
  <text x="660" y="528" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">PK (kim_id, kimni_id), CHECK kim_id&lt;&gt;kimni_id</text>
</svg>
