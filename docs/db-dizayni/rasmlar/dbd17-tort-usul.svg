<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560">
  <title>Daraxtni modellashtirish 4 usuli (adjacency list, materialized path, nested set, closure table) va ularning o'qish/yozish trade-off taqqoslashi</title>
  <rect x="0" y="0" width="880" height="560" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="bold" fill="#1e293b">Daraxtni modellashtirish 4 usuli</text>
  <text x="440" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Bir xil ierarxiya, to'rt xil dizayn — har birida o'qish va yozish narxi boshqacha</text>

  <!-- 1. Adjacency list -->
  <rect x="20" y="74" width="205" height="220" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="122" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">1. Adjacency list</text>
  <text x="122" y="118" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">har qator -> parent_id</text>
  <rect x="34" y="130" width="177" height="58" rx="4" fill="#ffffff" stroke="#94a3b8"/>
  <text x="44" y="148" font-family="Consolas, monospace" font-size="13" fill="#1e293b">id | nom  | parent_id</text>
  <text x="44" y="166" font-family="Consolas, monospace" font-size="13" fill="#1e293b">2  | Komp | 1</text>
  <text x="44" y="184" font-family="Consolas, monospace" font-size="13" fill="#1e293b">4  | Nout | 2</text>
  <text x="34" y="208" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">+ Sodda, yozish ARZON</text>
  <text x="34" y="228" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">+ Ko'chirish = 1 UPDATE</text>
  <text x="34" y="248" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">- To'liq shox = recursive CTE</text>
  <text x="34" y="268" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">- Chuqur daraxt sekin</text>
  <text x="34" y="288" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">Default tanlov</text>

  <!-- 2. Materialized path -->
  <rect x="237" y="74" width="205" height="220" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="339" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">2. Materialized path</text>
  <text x="339" y="118" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yo'l string: '1.2.4'</text>
  <rect x="251" y="130" width="177" height="58" rx="4" fill="#ffffff" stroke="#94a3b8"/>
  <text x="261" y="148" font-family="Consolas, monospace" font-size="13" fill="#1e293b">id | nom  | yol</text>
  <text x="261" y="166" font-family="Consolas, monospace" font-size="13" fill="#1e293b">2  | Komp | 1.2</text>
  <text x="261" y="184" font-family="Consolas, monospace" font-size="13" fill="#1e293b">4  | Nout | 1.2.4</text>
  <text x="251" y="208" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">+ Shox = LIKE '1.2.%'</text>
  <text x="251" y="228" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">+ Tartiblash oson</text>
  <text x="251" y="248" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">- Ko'chirish = butun shox UPDATE</text>
  <text x="251" y="268" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">- String shishadi, butunlik zaif</text>
  <text x="251" y="288" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">PG: ltree turi</text>

  <!-- 3. Nested set -->
  <rect x="454" y="74" width="205" height="220" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="556" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#d97706">3. Nested set</text>
  <text x="556" y="118" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">lft / rgt raqamlar</text>
  <rect x="468" y="130" width="177" height="58" rx="4" fill="#ffffff" stroke="#94a3b8"/>
  <text x="478" y="148" font-family="Consolas, monospace" font-size="13" fill="#1e293b">id | nom  | lft|rgt</text>
  <text x="478" y="166" font-family="Consolas, monospace" font-size="13" fill="#1e293b">2  | Komp | 2 | 9</text>
  <text x="478" y="184" font-family="Consolas, monospace" font-size="13" fill="#1e293b">4  | Nout | 3 | 6</text>
  <text x="468" y="208" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">+ Shox = lft BETWEEN (JOINsiz)</text>
  <text x="468" y="228" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">+ O'qish JUDA tez</text>
  <text x="468" y="248" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">- Bitta qo'shish = ko'p UPDATE</text>
  <text x="468" y="268" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">- Yozish QIMMAT, xatoga moyil</text>
  <text x="468" y="288" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">O'qish-og'ir, kam o'zgaradi</text>

  <!-- 4. Closure table -->
  <rect x="671" y="74" width="190" height="220" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="766" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">4. Closure table</text>
  <text x="766" y="118" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">alohida bog'lanish jadvali</text>
  <rect x="685" y="130" width="162" height="58" rx="4" fill="#ffffff" stroke="#94a3b8"/>
  <text x="695" y="148" font-family="Consolas, monospace" font-size="13" fill="#1e293b">ajdod|avlod|masofa</text>
  <text x="695" y="166" font-family="Consolas, monospace" font-size="13" fill="#1e293b">1 | 4 | 2</text>
  <text x="695" y="184" font-family="Consolas, monospace" font-size="13" fill="#1e293b">2 | 4 | 1</text>
  <text x="685" y="208" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">+ Shox/ajdod = oddiy SELECT</text>
  <text x="685" y="228" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">+ Eng moslashuvchan</text>
  <text x="685" y="248" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">- KO'P joy (har juftlik qator)</text>
  <text x="685" y="268" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">- 2-jadval, sinxron tutish</text>
  <text x="685" y="288" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">Ko'p o'qish + chuqur</text>

  <!-- trade-off table -->
  <text x="20" y="326" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">O'qish / Yozish trade-off (qaysi operatsiya qaysi usulda arzon)</text>

  <!-- header row -->
  <rect x="20" y="340" width="220" height="34" fill="#475569"/>
  <rect x="240" y="340" width="160" height="34" fill="#475569"/>
  <rect x="400" y="340" width="160" height="34" fill="#475569"/>
  <rect x="560" y="340" width="160" height="34" fill="#475569"/>
  <rect x="720" y="340" width="141" height="34" fill="#475569"/>
  <text x="30" y="362" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Operatsiya</text>
  <text x="250" y="362" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Adjacency</text>
  <text x="410" y="362" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Mat. path</text>
  <text x="570" y="362" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Nested set</text>
  <text x="730" y="362" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Closure</text>

  <!-- rows -->
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="13">
    <!-- row 1 -->
    <rect x="20" y="374" width="841" height="30" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="30" y="394" fill="#1e293b">To'g'ridan bolalar</text>
    <text x="250" y="394" fill="#16a34a" font-weight="bold">arzon</text>
    <text x="410" y="394" fill="#f59e0b">o'rta</text>
    <text x="570" y="394" fill="#16a34a" font-weight="bold">arzon</text>
    <text x="730" y="394" fill="#16a34a" font-weight="bold">arzon</text>
    <!-- row 2 -->
    <rect x="20" y="404" width="841" height="30" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="30" y="424" fill="#1e293b">To'liq shox (descendants)</text>
    <text x="250" y="424" fill="#dc2626">qimmat (CTE)</text>
    <text x="410" y="424" fill="#16a34a" font-weight="bold">arzon (LIKE)</text>
    <text x="570" y="424" fill="#16a34a" font-weight="bold">arzon</text>
    <text x="730" y="424" fill="#16a34a" font-weight="bold">arzon</text>
    <!-- row 3 -->
    <rect x="20" y="434" width="841" height="30" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="30" y="454" fill="#1e293b">Barcha ajdod (yo'l)</text>
    <text x="250" y="454" fill="#dc2626">qimmat (CTE)</text>
    <text x="410" y="454" fill="#16a34a" font-weight="bold">arzon</text>
    <text x="570" y="454" fill="#16a34a" font-weight="bold">arzon</text>
    <text x="730" y="454" fill="#16a34a" font-weight="bold">arzon</text>
    <!-- row 4 -->
    <rect x="20" y="464" width="841" height="30" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="30" y="484" fill="#1e293b">Tugun qo'shish (insert)</text>
    <text x="250" y="484" fill="#16a34a" font-weight="bold">arzon</text>
    <text x="410" y="484" fill="#16a34a" font-weight="bold">arzon</text>
    <text x="570" y="484" fill="#dc2626">qimmat</text>
    <text x="730" y="484" fill="#f59e0b">o'rta</text>
    <!-- row 5 -->
    <rect x="20" y="494" width="841" height="30" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="30" y="514" fill="#1e293b">Shoxni ko'chirish (move)</text>
    <text x="250" y="514" fill="#16a34a" font-weight="bold">arzon (1 row)</text>
    <text x="410" y="514" fill="#dc2626">qimmat</text>
    <text x="570" y="514" fill="#dc2626">juda qimmat</text>
    <text x="730" y="514" fill="#f59e0b">o'rta</text>
  </g>
  <text x="20" y="546" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Qoida: ko'p O'QILADI, kam o'zgaradi -> nested set / closure. Ko'p O'ZGARADI -> adjacency list (+ recursive CTE).</text>
</svg>
