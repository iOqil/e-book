<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500">
  <title>Surrogate PK, tabiiy business key UNIQUE va N:M junction jadval kompozit kaliti misoli</title>
  <defs>
    <marker id="kb-ok" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="760" height="500" fill="#f8fafc"/>

  <!-- sarlavha -->
  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Surrogate PK + Business UNIQUE + Kompozit kalit</text>
  <text x="380" y="54" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Ekspert naqshi: ichki barqaror kalit, tashqi tabiiy noyoblik, bog'lovchida juftlik</text>

  <!-- mahsulotlar jadvali -->
  <rect x="40" y="84" width="300" height="170" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <rect x="40" y="84" width="300" height="32" rx="8" fill="#2563eb"/>
  <text x="190" y="106" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#fff">mahsulotlar</text>

  <text x="56" y="140" font-family="Consolas, Segoe UI, monospace" font-size="14" font-weight="bold" fill="#d97706">id</text>
  <text x="120" y="140" font-family="Consolas, Segoe UI, monospace" font-size="13" fill="#1e293b">bigint IDENTITY</text>
  <rect x="245" y="127" width="86" height="20" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="288" y="142" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">PK (surrogate)</text>

  <text x="56" y="170" font-family="Consolas, Segoe UI, monospace" font-size="14" font-weight="bold" fill="#16a34a">sku</text>
  <text x="120" y="170" font-family="Consolas, Segoe UI, monospace" font-size="13" fill="#1e293b">text</text>
  <rect x="218" y="157" width="113" height="20" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="274" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">UNIQUE (business)</text>

  <text x="56" y="200" font-family="Consolas, Segoe UI, monospace" font-size="14" fill="#1e293b">nom</text>
  <text x="120" y="200" font-family="Consolas, Segoe UI, monospace" font-size="13" fill="#1e293b">text</text>
  <text x="56" y="228" font-family="Consolas, Segoe UI, monospace" font-size="14" fill="#1e293b">narx</text>
  <text x="120" y="228" font-family="Consolas, Segoe UI, monospace" font-size="13" fill="#1e293b">numeric(12,2)</text>

  <!-- izoh -->
  <text x="370" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb" font-weight="bold">id</text>
  <text x="392" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">: FK lar shunga ulanadi</text>
  <text x="392" y="170" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(o'zgarmaydi -> xavfsiz).</text>
  <text x="370" y="200" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" font-weight="bold">sku</text>
  <text x="400" y="200" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">: dublikat SKU ni</text>
  <text x="400" y="220" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">baza rad etadi.</text>
  <text x="370" y="244" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-style="italic" fill="#475569">Ikkala dunyo ham himoyalangan.</text>

  <!-- kompozit blok -->
  <text x="380" y="294" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">N:M bog'lanish -> kompozit kalit (junction jadval)</text>

  <!-- talabalar -->
  <rect x="40" y="312" width="170" height="100" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <rect x="40" y="312" width="170" height="28" rx="8" fill="#2563eb"/>
  <text x="125" y="332" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fff">talabalar</text>
  <text x="56" y="364" font-family="Consolas, Segoe UI, monospace" font-size="13" font-weight="bold" fill="#d97706">id</text>
  <text x="90" y="364" font-family="Consolas, Segoe UI, monospace" font-size="13" fill="#1e293b">bigint PK</text>
  <text x="56" y="390" font-family="Consolas, Segoe UI, monospace" font-size="13" fill="#1e293b">ism</text>

  <!-- royxat (junction) -->
  <rect x="295" y="300" width="200" height="124" rx="8" fill="#fff" stroke="#d97706" stroke-width="2.5"/>
  <rect x="295" y="300" width="200" height="28" rx="8" fill="#d97706"/>
  <text x="395" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fff">royxat</text>
  <text x="311" y="350" font-family="Consolas, Segoe UI, monospace" font-size="13" font-weight="bold" fill="#d97706">talaba_id</text>
  <text x="311" y="372" font-family="Consolas, Segoe UI, monospace" font-size="13" font-weight="bold" fill="#d97706">kurs_id</text>
  <text x="311" y="394" font-family="Consolas, Segoe UI, monospace" font-size="13" fill="#1e293b">baho</text>
  <rect x="305" y="402" width="180" height="18" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="395" y="416" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#d97706">PK (talaba_id, kurs_id)</text>

  <!-- kurslar -->
  <rect x="580" y="312" width="150" height="100" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <rect x="580" y="312" width="150" height="28" rx="8" fill="#2563eb"/>
  <text x="655" y="332" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fff">kurslar</text>
  <text x="596" y="364" font-family="Consolas, Segoe UI, monospace" font-size="13" font-weight="bold" fill="#d97706">id</text>
  <text x="630" y="364" font-family="Consolas, Segoe UI, monospace" font-size="13" fill="#1e293b">bigint PK</text>
  <text x="596" y="390" font-family="Consolas, Segoe UI, monospace" font-size="13" fill="#1e293b">nom</text>

  <!-- chiziqlar -->
  <line x1="210" y1="362" x2="295" y2="356" stroke="#475569" stroke-width="2" marker-end="url(#kb-ok)"/>
  <line x1="580" y1="362" x2="495" y2="368" stroke="#475569" stroke-width="2" marker-end="url(#kb-ok)"/>
  <text x="252" y="345" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">1:N</text>
  <text x="538" y="345" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">N:1</text>

  <!-- pastki xulosa -->
  <text x="380" y="456" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Ikki FK ning JUFTLIGI kompozit PK bo'ladi: ayni talaba ayni kursga faqat bir marta yoziladi.</text>
  <text x="380" y="484" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#d97706">Surrogate -> barqarorlik | Business UNIQUE -> tabiiy noyoblik | Kompozit -> N:M juftligi</text>
</svg>
