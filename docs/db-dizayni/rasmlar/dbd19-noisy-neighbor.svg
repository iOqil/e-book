<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520">
  <title>Noisy neighbor muammosi va izolyatsiya spektri: bitta ijarachi resursni yutsa boshqalar sekinlashadi; izolyatsiya darajasi qancha yuqori bo'lsa, ta'sir shuncha kam</title>
  <rect x="0" y="0" width="880" height="520" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">"Noisy neighbor" va izolyatsiya spektri</text>
  <text x="440" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Bitta ochko'z ijarachi umumiy resursni yutsa, qo'shnilar sekinlashadi</text>

  <!-- Noisy neighbor scene -->
  <rect x="40" y="80" width="800" height="180" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="56" y="106" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Shared resurs (bitta PostgreSQL server: CPU, RAM, disk I/O, ulanish pooli)</text>

  <!-- noisy tenant -->
  <rect x="60" y="120" width="220" height="120" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="170" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">Tenant A (shovqinli)</text>
  <text x="170" y="170" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#991b1b">og'ir hisobot so'rovi</text>
  <text x="170" y="190" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#991b1b">10M qator full scan</text>
  <rect x="80" y="204" width="180" height="22" fill="#dc2626"/>
  <text x="170" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff">CPU 85% yutilgan</text>

  <!-- victims -->
  <rect x="300" y="120" width="170" height="120" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="385" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#92400e">Tenant B</text>
  <text x="385" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#92400e">oddiy login so'rovi</text>
  <text x="385" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">2 sekund kutadi</text>
  <text x="385" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">(odatda 20ms)</text>

  <rect x="490" y="120" width="170" height="120" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="575" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#92400e">Tenant C</text>
  <text x="575" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#92400e">sahifa ochishi</text>
  <text x="575" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">timeout xatosi</text>
  <text x="575" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">(o'z aybi yo'q!)</text>

  <rect x="680" y="120" width="140" height="120" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="750" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Muammo:</text>
  <text x="750" y="174" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">A o'z hisobini</text>
  <text x="750" y="194" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">to'lasa ham,</text>
  <text x="750" y="214" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">B/C jabr ko'radi</text>

  <!-- Isolation spectrum -->
  <text x="440" y="300" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Resurs izolyatsiyasi spektri (shovqin ta'siri)</text>

  <!-- bar -->
  <rect x="60" y="320" width="253" height="44" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="186" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">Shared table</text>
  <text x="186" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#991b1b">shovqin TO'LIQ o'tadi</text>

  <rect x="313" y="320" width="253" height="44" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="439" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#92400e">Schema-per-tenant</text>
  <text x="439" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#92400e">qisman (bir server)</text>

  <rect x="566" y="320" width="254" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="693" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#166534">DB-per-tenant (alohida server)</text>
  <text x="693" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">shovqin to'silgan</text>

  <line x1="60" y1="378" x2="820" y2="378" stroke="#94a3b8" stroke-width="2"/>
  <text x="60" y="396" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">qo'shnilar bir-biriga ta'sir qiladi</text>
  <text x="820" y="396" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">to'liq ajratilgan</text>

  <!-- mitigations -->
  <rect x="40" y="412" width="800" height="92" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="56" y="436" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Yumshatish (shared/schema bo'lsa ham):</text>
  <text x="56" y="458" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">statement_timeout va per-tenant ulanish limiti; og'ir hisobotni read-replica yoki navbatga; rate limit;</text>
  <text x="56" y="478" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">premium ijarachini alohida server (database-per-tenant)ga ko'chirish; per-tenant resurs monitoring.</text>
  <text x="56" y="498" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">RLS faqat MA'LUMOTNI izolyatsiya qiladi — RESURSNI emas. Bu ikki alohida muammo.</text>
</svg>
