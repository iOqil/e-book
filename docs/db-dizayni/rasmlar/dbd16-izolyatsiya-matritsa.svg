<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470">
  <title>Izolyatsiya darajalari va ular oldini oladigan anomaliyalar matritsasi (SQL standarti va PostgreSQL)</title>
  <rect x="0" y="0" width="820" height="470" fill="#f8fafc"/>
  <text x="410" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Izolyatsiya darajasi x Anomaliya matritsasi</text>
  <text x="410" y="54" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Yashil = anomaliya OLDINI OLADI · Qizil = anomaliya MUMKIN</text>

  <!-- column headers -->
  <rect x="24" y="74" width="220" height="50" fill="#475569"/>
  <text x="134" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Izolyatsiya darajasi</text>

  <rect x="244" y="74" width="138" height="50" fill="#334155"/>
  <text x="313" y="96" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Dirty</text>
  <text x="313" y="113" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">read</text>

  <rect x="382" y="74" width="138" height="50" fill="#334155"/>
  <text x="451" y="96" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Non-repeatable</text>
  <text x="451" y="113" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">read</text>

  <rect x="520" y="74" width="138" height="50" fill="#334155"/>
  <text x="589" y="96" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Phantom</text>
  <text x="589" y="113" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">read</text>

  <rect x="658" y="74" width="138" height="50" fill="#334155"/>
  <text x="727" y="96" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Serialization</text>
  <text x="727" y="113" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">anomaliya</text>

  <!-- Row 1: READ UNCOMMITTED -->
  <rect x="24" y="124" width="220" height="60" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="38" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">READ UNCOMMITTED</text>
  <text x="38" y="170" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">eng past</text>
  <rect x="244" y="124" width="138" height="60" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
  <text x="313" y="159" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#991b1b">mumkin*</text>
  <rect x="382" y="124" width="138" height="60" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
  <text x="451" y="159" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#991b1b">mumkin</text>
  <rect x="520" y="124" width="138" height="60" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
  <text x="589" y="159" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#991b1b">mumkin</text>
  <rect x="658" y="124" width="138" height="60" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
  <text x="727" y="159" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#991b1b">mumkin</text>

  <!-- Row 2: READ COMMITTED -->
  <rect x="24" y="184" width="220" height="60" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="38" y="210" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">READ COMMITTED</text>
  <text x="38" y="230" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">PG default</text>
  <rect x="244" y="184" width="138" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="313" y="219" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">oldini oladi</text>
  <rect x="382" y="184" width="138" height="60" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
  <text x="451" y="219" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#991b1b">mumkin</text>
  <rect x="520" y="184" width="138" height="60" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
  <text x="589" y="219" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#991b1b">mumkin</text>
  <rect x="658" y="184" width="138" height="60" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
  <text x="727" y="219" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#991b1b">mumkin</text>

  <!-- Row 3: REPEATABLE READ -->
  <rect x="24" y="244" width="220" height="60" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="38" y="270" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">REPEATABLE READ</text>
  <text x="38" y="290" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#d97706">MySQL default</text>
  <rect x="244" y="244" width="138" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="313" y="279" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">oldini oladi</text>
  <rect x="382" y="244" width="138" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="451" y="279" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">oldini oladi</text>
  <rect x="520" y="244" width="138" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="589" y="273" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">oldini oladi**</text>
  <text x="589" y="291" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(PG: ha)</text>
  <rect x="658" y="244" width="138" height="60" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
  <text x="727" y="279" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#991b1b">mumkin</text>

  <!-- Row 4: SERIALIZABLE -->
  <rect x="24" y="304" width="220" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="38" y="330" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">SERIALIZABLE</text>
  <text x="38" y="350" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">eng qattiq</text>
  <rect x="244" y="304" width="138" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="313" y="339" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">oldini oladi</text>
  <rect x="382" y="304" width="138" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="451" y="339" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">oldini oladi</text>
  <rect x="520" y="304" width="138" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="589" y="339" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">oldini oladi</text>
  <rect x="658" y="304" width="138" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="727" y="339" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">oldini oladi</text>

  <!-- notes -->
  <rect x="24" y="378" width="772" height="78" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="38" y="400" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">* PostgreSQL READ UNCOMMITTED ni qabul qiladi, lekin uni READ COMMITTED kabi ishlatadi (MVCC dirty read ga yol qoymaydi).</text>
  <text x="38" y="420" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">** Standart REPEATABLE READ da phantom read mumkin; PostgreSQL MVCC tufayli uni ham oldini oladi (snapshot izolyatsiya).</text>
  <text x="38" y="442" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Qattiqroq daraja = kamroq anomaliya, lekin kop konflikt/qayta urinish. Dizayn = kerakli minimal darajani tanlash.</text>
</svg>
