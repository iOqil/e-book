<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <title>Ko'lam (scope) chegarasi: ichkaridagi entity'lar va tashqaridagilar, hamda biznes qoidalari misoli</title>

  <rect x="0" y="0" width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Scope chegarasi va biznes qoidalari</text>

  <!-- SCOPE doirasi (ichkari) -->
  <rect x="30" y="58" width="420" height="372" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="240" y="86" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">SCOPE ICHIDA (1-versiya)</text>

  <rect x="60" y="104" width="160" height="50" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="140" y="135" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">mijozlar</text>

  <rect x="260" y="104" width="160" height="50" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="340" y="135" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">mahsulotlar</text>

  <rect x="60" y="170" width="160" height="50" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="140" y="201" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">buyurtmalar</text>

  <rect x="260" y="170" width="160" height="50" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="340" y="195" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">buyurtma</text>
  <text x="340" y="212" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">qatorlari</text>

  <!-- biznes qoidalari ro'yxati -->
  <text x="60" y="252" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Biznes qoidalari:</text>
  <text x="60" y="278" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">- Har buyurtma 1 ta mijozga tegishli</text>
  <text x="60" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">- Email takrorlanmas (UNIQUE)</text>
  <text x="60" y="322" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">- Narx &gt;= 0, soni &gt; 0</text>
  <text x="60" y="344" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">- Holat: yangi / tolangan /</text>
  <text x="74" y="364" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">yetkazildi / bekor</text>
  <text x="60" y="386" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">- Buyurtma bo'shroq bo'lmaydi</text>
  <text x="74" y="406" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">(kamida 1 qator)</text>

  <!-- SCOPE TASHQARISI -->
  <rect x="480" y="58" width="250" height="372" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="605" y="86" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">SCOPE TASHQARISIDA</text>
  <text x="605" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" font-style="italic">(keyingi versiyaga)</text>

  <rect x="510" y="128" width="190" height="44" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="605" y="155" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">to'lov shlyuzi</text>

  <rect x="510" y="186" width="190" height="44" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="605" y="213" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">yetkazish kuryeri</text>

  <rect x="510" y="244" width="190" height="44" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="605" y="271" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">sharh / reyting</text>

  <rect x="510" y="302" width="190" height="44" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="605" y="329" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">chegirma / kupon</text>

  <rect x="510" y="360" width="190" height="44" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="605" y="387" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">ombor logistikasi</text>

  <!-- pastki izoh -->
  <text x="380" y="448" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Scope chegarasi = "hozir nimani modellaymiz" — keraksiz murakkablikni keyinga qoldiramiz</text>
</svg>
