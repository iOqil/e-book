<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" width="840" height="540">
  <title>Zero-downtime uchun xavfsiz va xavfli ALTER amallari: chap tomonda tez (metadata-only yoki yengil qulf) amallar, ong tomonda jadvalni qayta yozadigan yoki ACCESS EXCLUSIVE qulf ushlab navbatni bloklaydigan xavfli amallar va ularning xavfsiz muqobillari</title>
  <rect x="0" y="0" width="840" height="540" fill="#f8fafc"/>
  <text x="420" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Zero-downtime: xavfsiz vs xavfli ALTER</text>
  <text x="420" y="54" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">PostgreSQL 18 da o'lchangan (1 mln qatorli jadval)</text>

  <!-- SAFE column -->
  <rect x="20" y="74" width="395" height="430" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="217" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">XAVFSIZ (tez / yengil qulf)</text>

  <rect x="36" y="116" width="363" height="58" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="48" y="138" font-family="Consolas, monospace" font-size="13" fill="#1e293b">ADD COLUMN ... DEFAULT 'const'</text>
  <text x="48" y="160" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">metadata-only, ~2 ms — jadval skanlanmaydi</text>

  <rect x="36" y="180" width="363" height="58" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="48" y="202" font-family="Consolas, monospace" font-size="13" fill="#1e293b">ADD COLUMN ... (NULL, default yo'q)</text>
  <text x="48" y="224" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">metadata-only, deyarli bir zumda</text>

  <rect x="36" y="244" width="363" height="58" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="48" y="266" font-family="Consolas, monospace" font-size="13" fill="#1e293b">ADD CONSTRAINT ... CHECK (...) NOT VALID</text>
  <text x="48" y="288" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">~4 ms — mavjud qatorlar skanlanmaydi</text>

  <rect x="36" y="308" width="363" height="58" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="48" y="330" font-family="Consolas, monospace" font-size="13" fill="#1e293b">VALIDATE CONSTRAINT ...</text>
  <text x="48" y="352" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">SHARE UPDATE EXCLUSIVE — yozuvni bloklamaydi</text>

  <rect x="36" y="372" width="363" height="58" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="48" y="394" font-family="Consolas, monospace" font-size="13" fill="#1e293b">CREATE INDEX CONCURRENTLY ...</text>
  <text x="48" y="416" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">sekinroq, lekin yozuvni bloklamaydi</text>

  <rect x="36" y="436" width="363" height="54" rx="6" fill="#ecfccb" stroke="#16a34a" stroke-width="1.5"/>
  <text x="48" y="458" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">DROP COLUMN — metadata-only (tez),</text>
  <text x="48" y="478" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">lekin avval kod o'sha ustunni ishlatmasin!</text>

  <!-- DANGER column -->
  <rect x="425" y="74" width="395" height="430" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="622" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">XAVFLI (rewrite / uzoq qulf)</text>

  <rect x="441" y="116" width="363" height="78" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="453" y="138" font-family="Consolas, monospace" font-size="13" fill="#1e293b">ADD COLUMN ... DEFAULT gen_random_uuid()</text>
  <text x="453" y="160" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">VOLATILE default -> TO'LIQ rewrite, ~2.9 s</text>
  <text x="453" y="180" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Xavfsiz: ustun qo'sh -> partiyalab backfill</text>

  <rect x="441" y="200" width="363" height="78" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="453" y="222" font-family="Consolas, monospace" font-size="13" fill="#1e293b">ALTER COLUMN ... SET NOT NULL</text>
  <text x="453" y="244" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">to'liq skan + ACCESS EXCLUSIVE, ~235 ms</text>
  <text x="453" y="264" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Xavfsiz: CHECK NOT VALID -> VALIDATE</text>

  <rect x="441" y="284" width="363" height="78" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="453" y="306" font-family="Consolas, monospace" font-size="13" fill="#1e293b">CREATE INDEX ... (CONCURRENTLY'siz)</text>
  <text x="453" y="328" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">indeks tugaguncha YOZUV bloklanadi</text>
  <text x="453" y="348" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Xavfsiz: CONCURRENTLY ishlat</text>

  <rect x="441" y="368" width="363" height="62" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="453" y="390" font-family="Consolas, monospace" font-size="13" fill="#1e293b">RENAME COLUMN / ALTER TYPE</text>
  <text x="453" y="412" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">eski kodni sindiradi / rewrite</text>
  <text x="453" y="424" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Xavfsiz: expand-contract naqshi</text>

  <rect x="441" y="436" width="363" height="54" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="453" y="458" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#991b1b">Oltin qoida: lock_timeout o'rnat —</text>
  <text x="453" y="478" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ALTER navbatni cheksiz ushlab qolmasin.</text>

  <!-- footer -->
  <text x="420" y="524" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ACCESS EXCLUSIVE qulf = hatto SELECT ham kutadi. Xavfli amalni issiq vaqtda EMAS, oz yuklamada bajar.</text>
</svg>
