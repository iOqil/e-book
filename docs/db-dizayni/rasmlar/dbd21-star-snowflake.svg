<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560">
  <title>Star schema (markaziy fakt jadval atrofida denormallashgan o'lchamlar) va snowflake schema (o'lchamlar normallashtirilgan, kichik jadvallarga bo'lingan) taqqoslashi</title>
  <rect x="0" y="0" width="880" height="560" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Star vs Snowflake schema</text>
  <text x="440" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Markazda FAKT, atrofda O'LCHAM jadvallar — farq o'lchamlar normallashganmi yo'qmi</text>

  <!-- divider -->
  <line x1="440" y1="74" x2="440" y2="500" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- ===== LEFT: STAR ===== -->
  <text x="220" y="96" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">STAR (yulduz) — denormallashgan</text>

  <!-- dimensions (corners) -->
  <rect x="34" y="120" width="120" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="94" y="142" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">dim_vaqt</text>
  <text x="94" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yil, oy, chorak</text>

  <rect x="288" y="120" width="120" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="348" y="142" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">dim_mahsulot</text>
  <text x="348" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">nom, kategoriya</text>

  <rect x="34" y="320" width="120" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="94" y="342" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">dim_mijoz</text>
  <text x="94" y="360" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">shahar, segment</text>

  <rect x="288" y="320" width="120" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="348" y="342" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">dim_dokon</text>
  <text x="348" y="360" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">viloyat, kanal</text>

  <!-- fact center -->
  <rect x="146" y="218" width="150" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="221" y="242" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#92400e">fakt_sotuv</text>
  <text x="221" y="262" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">miqdor, jami</text>

  <!-- spokes -->
  <line x1="154" y1="176" x2="190" y2="218" stroke="#475569" stroke-width="2"/>
  <line x1="288" y1="176" x2="252" y2="218" stroke="#475569" stroke-width="2"/>
  <line x1="154" y1="320" x2="190" y2="278" stroke="#475569" stroke-width="2"/>
  <line x1="288" y1="320" x2="252" y2="278" stroke="#475569" stroke-width="2"/>

  <rect x="34" y="408" width="374" height="78" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="48" y="430" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">+ Kam JOIN (1 fakt + 1 o'lcham) -> tez so'rov</text>
  <text x="48" y="450" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">+ Sodda, BI vositalar uchun qulay</text>
  <text x="48" y="470" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">- Takror ma'lumot (brend har qatorda)</text>

  <!-- ===== RIGHT: SNOWFLAKE ===== -->
  <text x="662" y="96" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">SNOWFLAKE (qor uchqun) — normallashgan</text>

  <!-- fact center -->
  <rect x="588" y="218" width="148" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="662" y="242" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#92400e">fakt_sotuv</text>
  <text x="662" y="262" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">miqdor, jami</text>

  <!-- dim_mahsulot -->
  <rect x="588" y="120" width="148" height="48" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="662" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">dim_mahsulot</text>
  <text x="662" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">nom, kategoriya_id</text>
  <line x1="662" y1="218" x2="662" y2="168" stroke="#475569" stroke-width="2"/>

  <!-- normalized sub-tables of mahsulot -->
  <rect x="760" y="96" width="100" height="44" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="810" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">dim_kategoriya</text>
  <text x="810" y="133" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">nom</text>
  <line x1="736" y1="138" x2="760" y2="124" stroke="#94a3b8" stroke-width="2"/>

  <rect x="760" y="150" width="100" height="44" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="810" y="170" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">dim_brend</text>
  <text x="810" y="187" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">nom</text>
  <line x1="736" y1="150" x2="760" y2="166" stroke="#94a3b8" stroke-width="2"/>

  <!-- dim_dokon -->
  <rect x="488" y="320" width="148" height="48" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="562" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">dim_dokon</text>
  <text x="562" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">nom, viloyat_id</text>
  <line x1="588" y1="278" x2="600" y2="320" stroke="#475569" stroke-width="2"/>

  <rect x="488" y="392" width="148" height="44" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="562" y="412" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">dim_viloyat</text>
  <text x="562" y="429" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">nom, mintaqa</text>
  <line x1="562" y1="368" x2="562" y2="392" stroke="#94a3b8" stroke-width="2"/>

  <rect x="666" y="392" width="194" height="94" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="680" y="414" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">+ Kam takror, kam joy</text>
  <text x="680" y="434" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">+ O'lcham yangilash oson</text>
  <text x="680" y="454" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">- KO'P JOIN -> sekinroq</text>
  <text x="680" y="474" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">- Murakkabroq so'rov</text>

  <!-- bottom note -->
  <rect x="20" y="510" width="840" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="34" y="535" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Amaliyot: ko'pchilik analitik ombor STAR ni tanlaydi — so'rov tezligi joydan muhimroq. Snowflake faqat juda katta o'lchamlar uchun.</text>
</svg>
