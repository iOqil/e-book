<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600">
  <title>ADR namunasi (kontekst, qaror, oqibat) va kitobdan keyingi yo'l xaritasi: ORM, DBA, Data Engineering</title>
  <rect x="0" y="0" width="880" height="600" fill="#f8fafc"/>
  <text x="440" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">ADR namunasi va kitobdan keyingi yo'l xaritasi</text>

  <!-- ADR card -->
  <rect x="40" y="60" width="380" height="490" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="40" y="60" width="380" height="40" rx="10" fill="#2563eb"/>
  <text x="230" y="86" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">ADR-002: Multi-tenancy strategiyasi</text>

  <text x="60" y="128" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#475569">Holat:</text>
  <text x="130" y="128" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">Qabul qilindi</text>

  <text x="60" y="160" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">Kontekst</text>
  <text x="60" y="184" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">EduCore minglab maktab-ijarachiga</text>
  <text x="60" y="204" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">xizmat qiladi. Izolyatsiya, narx va</text>
  <text x="60" y="224" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">operatsion soddalik muvozanati kerak.</text>

  <text x="60" y="256" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Qaror</text>
  <text x="60" y="280" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Shared-schema + tenant_id ustun.</text>
  <text x="60" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Himoya: Row-Level Security (RLS)</text>
  <text x="60" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">policy har jadvalda.</text>

  <text x="60" y="352" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#d97706">Oqibat (+)</text>
  <text x="60" y="376" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Eng arzon, bitta migratsiya,</text>
  <text x="60" y="396" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">oson masshtab.</text>

  <text x="60" y="428" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">Oqibat (-)</text>
  <text x="60" y="452" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">"Noisy neighbor"; RLS unutilsa</text>
  <text x="60" y="472" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ma'lumot sizishi xavfi.</text>

  <text x="60" y="504" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#475569">Alternativalar</text>
  <text x="60" y="528" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">schema-per-tenant, db-per-tenant —</text>
  <text x="60" y="544" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">rad: erta bosqichda qimmat.</text>

  <!-- Roadmap -->
  <text x="650" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Kitobdan keyin: yo'nalishlar</text>

  <!-- ORM -->
  <rect x="460" y="110" width="380" height="100" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="478" y="138" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">1. ORM bilan amaliyot</text>
  <text x="478" y="162" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Sxemani kod orqali: Prisma (Node),</text>
  <text x="478" y="182" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">SQLAlchemy (Django/Python), Eloquent</text>
  <text x="478" y="202" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(Laravel). Migratsiya, model, query.</text>

  <!-- DBA -->
  <rect x="460" y="226" width="380" height="100" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="478" y="254" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">2. DBA / operatsiya</text>
  <text x="478" y="278" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Backup/restore, replication, monitoring,</text>
  <text x="478" y="298" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">VACUUM/tuning, connection pooling,</text>
  <text x="478" y="318" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">xavfsizlik va rol boshqaruvi.</text>

  <!-- Data engineering -->
  <rect x="460" y="342" width="380" height="100" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="478" y="370" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#d97706">3. Data engineering</text>
  <text x="478" y="394" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ETL/ELT pipeline, dbt, ma'lumot ombori</text>
  <text x="478" y="414" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(warehouse/lake), streaming (Kafka),</text>
  <text x="478" y="434" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">columnar analitika (ClickHouse).</text>

  <!-- distributed -->
  <rect x="460" y="458" width="380" height="92" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="478" y="486" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">4. Taqsimlangan tizimlar</text>
  <text x="478" y="510" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Sharding (Citus), distributed SQL</text>
  <text x="478" y="530" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(CockroachDB), event sourcing, CQRS.</text>
</svg>
