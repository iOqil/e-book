<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440">
  <title>Vertikal masshtab (bitta kuchli server) vs gorizontal masshtab (ko'p server)</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Vertikal masshtab vs Gorizontal masshtab</text>

  <!-- VERTIKAL -->
  <rect x="24" y="56" width="340" height="356" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="194" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#2563eb">Vertikal (scale up)</text>
  <text x="194" y="106" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">bitta serverni kuchaytir</text>

  <!-- kichik server -->
  <rect x="70" y="130" width="60" height="50" rx="5" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="100" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">2 CPU</text>
  <!-- arrow -->
  <line x1="140" y1="155" x2="210" y2="155" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="175" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">RAM+CPU</text>
  <!-- katta server -->
  <rect x="222" y="120" width="100" height="76" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="272" y="155" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">64 CPU</text>
  <text x="272" y="174" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">512 GB</text>

  <text x="44" y="230" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">+ Sodda: kod o'zgarmaydi</text>
  <text x="44" y="254" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">+ Tranzaksiya/JOIN oson qoladi</text>
  <text x="44" y="278" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">- Narx eksponensial oshadi</text>
  <text x="44" y="302" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">- Fizik chegara bor (shift yo'q)</text>
  <text x="44" y="326" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">- Bitta nuqta (SPOF)</text>
  <text x="44" y="362" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">Qachon: birinchi tanlov,</text>
  <text x="44" y="384" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">to'siqqa urilguncha.</text>

  <!-- GORIZONTAL -->
  <rect x="396" y="56" width="340" height="356" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="566" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#d97706">Gorizontal (scale out)</text>
  <text x="566" y="106" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ko'p oddiy server qo'sh</text>

  <rect x="430" y="124" width="56" height="46" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="458" y="152" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">node 1</text>
  <rect x="496" y="124" width="56" height="46" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="524" y="152" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">node 2</text>
  <rect x="562" y="124" width="56" height="46" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="590" y="152" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">node 3</text>
  <rect x="628" y="124" width="56" height="46" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="656" y="152" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">node N</text>

  <text x="416" y="210" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">+ Deyarli cheksiz masshtab</text>
  <text x="416" y="234" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">+ Arzon serverlar, bardoshlilik</text>
  <text x="416" y="258" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">- Kod murakkablashadi</text>
  <text x="416" y="282" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">- Cross-node JOIN/tranzaksiya og'ir</text>
  <text x="416" y="306" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">- Operatsion yuk ortadi</text>
  <text x="416" y="362" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">Qachon: vertikal chegaraga</text>
  <text x="416" y="384" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">yetganda — oxirgi chora.</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
