<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="Segoe UI, sans-serif">
  <title>Polling va webhook: ishlash sikli va tanlash mezonlari</title>
  <rect width="780" height="470" fill="#f8fafc"/>
  <text x="390" y="34" font-size="19" font-weight="bold" fill="#1e293b" text-anchor="middle">Polling va webhook: ishlash sikli</text>

  <!-- POLLING -->
  <rect x="28" y="56" width="350" height="252" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="203" y="84" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">Polling (bot so'rab turadi)</text>

  <rect x="56" y="104" width="120" height="50" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="116" y="134" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Bot (CLI)</text>
  <rect x="232" y="104" width="120" height="50" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="292" y="134" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Telegram</text>

  <line x1="176" y1="120" x2="230" y2="120" stroke="#94a3b8" stroke-width="2" marker-end="url(#ab)"/>
  <text x="203" y="114" font-size="13" fill="#334155" text-anchor="middle">getUpdates</text>
  <line x1="230" y1="140" x2="176" y2="140" stroke="#94a3b8" stroke-width="2" marker-end="url(#ab)"/>
  <text x="203" y="153" font-size="13" fill="#334155" text-anchor="middle">update'lar</text>

  <text x="203" y="184" font-size="13" fill="#475569" text-anchor="middle">Doimiy halqa: $bot->run()</text>
  <text x="203" y="210" font-size="13" fill="#16a34a" text-anchor="middle">+ Public URL / SSL kerak emas</text>
  <text x="203" y="232" font-size="13" fill="#16a34a" text-anchor="middle">+ localhost'da darrov ishlaydi</text>
  <text x="203" y="254" font-size="13" fill="#dc2626" text-anchor="middle">- Doimiy ishlovchi jarayon kerak</text>
  <text x="203" y="276" font-size="13" fill="#dc2626" text-anchor="middle">- Yagona instans (offset ziddiyati)</text>
  <text x="203" y="298" font-size="13" fill="#f59e0b" text-anchor="middle">Maqsad: rivojlash / kichik bot</text>

  <!-- WEBHOOK -->
  <rect x="402" y="56" width="350" height="252" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="577" y="84" font-size="16" font-weight="bold" fill="#f59e0b" text-anchor="middle">Webhook (Telegram itaradi)</text>

  <rect x="430" y="104" width="120" height="50" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="490" y="134" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Telegram</text>
  <rect x="606" y="104" width="120" height="50" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="666" y="128" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">HTTPS server</text>
  <text x="666" y="146" font-size="13" fill="#334155" text-anchor="middle">index.php</text>

  <line x1="550" y1="129" x2="604" y2="129" stroke="#f59e0b" stroke-width="2" marker-end="url(#aw)"/>
  <text x="577" y="122" font-size="13" fill="#f59e0b" text-anchor="middle">POST update</text>

  <text x="577" y="184" font-size="13" fill="#475569" text-anchor="middle">Event-driven: bir so'rov = bir update</text>
  <text x="577" y="210" font-size="13" fill="#16a34a" text-anchor="middle">+ Tezkor, kam resurs, kengayadi</text>
  <text x="577" y="232" font-size="13" fill="#16a34a" text-anchor="middle">+ php-fpm bir nechta so'rovga</text>
  <text x="577" y="254" font-size="13" fill="#dc2626" text-anchor="middle">- Public HTTPS URL + SSL kerak</text>
  <text x="577" y="276" font-size="13" fill="#dc2626" text-anchor="middle">- secret_token bilan himoya shart</text>
  <text x="577" y="298" font-size="13" fill="#f59e0b" text-anchor="middle">Maqsad: production / katta yuk</text>

  <!-- decision bar -->
  <rect x="28" y="328" width="724" height="118" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="390" y="354" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Qaysi birini tanlash?</text>
  <text x="48" y="382" font-size="13" fill="#2563eb" font-weight="bold">Polling tanlang, agar:</text>
  <text x="48" y="404" font-size="13" fill="#334155">- noutbukda rivojlanyapsiz</text>
  <text x="48" y="424" font-size="13" fill="#334155">- domen/SSL yo'q, foydalanuvchi kam</text>

  <text x="412" y="382" font-size="13" fill="#f59e0b" font-weight="bold">Webhook tanlang, agar:</text>
  <text x="412" y="404" font-size="13" fill="#334155">- production'da, ko'p foydalanuvchi</text>
  <text x="412" y="424" font-size="13" fill="#334155">- HTTPS domen + nginx/php-fpm bor</text>

  <defs>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="aw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/></marker>
  </defs>
</svg>
