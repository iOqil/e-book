<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Segoe UI, sans-serif">
  <title>Reply klaviatura va Inline klaviatura farqi</title>
  <rect width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Reply vs Inline klaviatura</text>

  <!-- Reply panel -->
  <rect x="30" y="60" width="330" height="330" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="30" y="60" width="330" height="40" rx="12" fill="#2563eb"/>
  <text x="195" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">ReplyKeyboardMarkup</text>

  <!-- chat bubble -->
  <rect x="50" y="120" width="200" height="40" rx="10" fill="#e0e7ff"/>
  <text x="62" y="145" font-size="14" fill="#1e293b">Menyuni tanlang:</text>

  <!-- reply buttons sit below input -->
  <text x="50" y="200" font-size="13" fill="#64748b">Input maydoni ostida turadi</text>
  <rect x="50" y="212" width="135" height="38" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="117" y="236" text-anchor="middle" font-size="14" fill="#334155">Katalog</text>
  <rect x="200" y="212" width="135" height="38" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="267" y="236" text-anchor="middle" font-size="14" fill="#334155">Savat</text>
  <rect x="50" y="258" width="285" height="38" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="192" y="282" text-anchor="middle" font-size="14" fill="#334155">Yordam</text>

  <text x="50" y="328" font-size="13" fill="#16a34a" font-weight="bold">Bosilsa -&gt; oddiy MATN yuboradi</text>
  <text x="50" y="350" font-size="13" fill="#334155">onText / onMessage tutadi</text>
  <text x="50" y="372" font-size="13" fill="#334155">resize, one_time, request_contact</text>

  <!-- Inline panel -->
  <rect x="400" y="60" width="330" height="330" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="400" y="60" width="330" height="40" rx="12" fill="#16a34a"/>
  <text x="565" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">InlineKeyboardMarkup</text>

  <!-- inline buttons attached to message -->
  <rect x="420" y="120" width="290" height="100" rx="10" fill="#e0e7ff"/>
  <text x="432" y="145" font-size="14" fill="#1e293b">Ovoz bering:</text>
  <rect x="432" y="158" width="130" height="34" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="497" y="180" text-anchor="middle" font-size="14" fill="#2563eb">Ha</text>
  <rect x="572" y="158" width="126" height="34" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="635" y="180" text-anchor="middle" font-size="14" fill="#2563eb">Yo'q</text>

  <text x="420" y="252" font-size="13" fill="#64748b">Xabar tagiga "yopishadi"</text>
  <text x="420" y="328" font-size="13" fill="#dc2626" font-weight="bold">Bosilsa -&gt; callback_query</text>
  <text x="420" y="350" font-size="13" fill="#334155">onCallbackQueryData tutadi</text>
  <text x="420" y="372" font-size="13" fill="#334155">url, web_app, copy_text qo'llaydi</text>
</svg>
