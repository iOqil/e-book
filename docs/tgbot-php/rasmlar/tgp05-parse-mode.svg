<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Segoe UI, sans-serif">
  <title>parse_mode: HTML va MarkdownV2 formatlash oqimi</title>
  <rect width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">parse_mode bilan formatlash</text>
  <text x="380" y="58" text-anchor="middle" font-size="14" fill="#334155">bir xil natija — ikki sintaksis</text>

  <!-- Manba matn -->
  <rect x="270" y="78" width="220" height="56" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Sizning matn (PHP)</text>
  <text x="380" y="122" text-anchor="middle" font-size="13" fill="#334155">"Qalin va kursiv"</text>

  <!-- HTML branch -->
  <rect x="40" y="180" width="320" height="200" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="208" text-anchor="middle" font-size="17" font-weight="bold" fill="#2563eb">ParseMode::HTML</text>
  <rect x="62" y="224" width="276" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="76" y="249" font-size="13" fill="#1e293b">&lt;b&gt;Qalin&lt;/b&gt; &lt;i&gt;kursiv&lt;/i&gt;</text>
  <text x="200" y="290" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">Escape: htmlspecialchars()</text>
  <text x="200" y="312" text-anchor="middle" font-size="13" fill="#334155">faqat 3 belgi: &amp;lt; &amp;gt; &amp;amp;</text>
  <text x="200" y="338" text-anchor="middle" font-size="13" fill="#16a34a">o'qish oson, xatoga chidamli</text>
  <text x="200" y="362" text-anchor="middle" font-size="13" fill="#334155">tavsiya: kundalik ish uchun</text>

  <!-- MarkdownV2 branch -->
  <rect x="400" y="180" width="320" height="200" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <text x="560" y="208" text-anchor="middle" font-size="17" font-weight="bold" fill="#f59e0b">ParseMode::MARKDOWN</text>
  <text x="560" y="226" text-anchor="middle" font-size="13" fill="#334155">(qiymati = MarkdownV2)</text>
  <rect x="422" y="234" width="276" height="34" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="436" y="256" font-size="13" fill="#1e293b">*Qalin* _kursiv_</text>
  <text x="560" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">Escape: 18 maxsus belgi</text>
  <text x="560" y="316" text-anchor="middle" font-size="13" fill="#334155">_ * [ ] ( ) ~ ` &gt; # + - = | { } . !</text>
  <text x="560" y="342" text-anchor="middle" font-size="13" fill="#334155">har birini \ bilan belgilang</text>
  <text x="560" y="364" text-anchor="middle" font-size="13" fill="#334155">e'tiborsizlik = "Bad Request"</text>

  <!-- arrows -->
  <line x1="330" y1="134" x2="210" y2="178" stroke="#2563eb" stroke-width="2"/>
  <polygon points="210,178 206,166 218,168" fill="#2563eb"/>
  <line x1="430" y1="134" x2="550" y2="178" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="550,178 542,168 554,166" fill="#f59e0b"/>

  <text x="380" y="408" text-anchor="middle" font-size="14" fill="#16a34a" font-weight="bold">Telegram natija: Qalin va kursiv — bir xil ko'rinadi</text>
</svg>
