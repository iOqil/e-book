<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="Segoe UI, sans-serif">
  <title>Echo bot oqimi: foydalanuvchi xabari handlerga, handler javobni qaytaradi</title>
  <rect width="720" height="430" fill="#f8fafc"/>
  <text x="360" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Echo: xabar keladi → handler ishlaydi → javob qaytadi</text>

  <!-- user -->
  <rect x="40" y="90" width="170" height="90" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="125" y="124" text-anchor="middle" font-size="17" font-weight="bold" fill="#2563eb">Foydalanuvchi</text>
  <text x="125" y="150" text-anchor="middle" font-size="14" fill="#334155">yozadi:</text>
  <text x="125" y="170" text-anchor="middle" font-size="14" fill="#16a34a" font-weight="bold">"Salom"</text>

  <!-- nutgram dispatcher -->
  <rect x="275" y="80" width="180" height="200" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="365" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#16a34a">Nutgram</text>
  <text x="365" y="130" text-anchor="middle" font-size="13" fill="#64748b">(routing)</text>

  <rect x="298" y="146" width="134" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="365" y="166" text-anchor="middle" font-size="13" fill="#2563eb">/start bormi?</text>
  <text x="365" y="184" text-anchor="middle" font-size="13" fill="#64748b">onCommand</text>

  <rect x="298" y="202" width="134" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="365" y="222" text-anchor="middle" font-size="13" fill="#16a34a" font-weight="bold">aks holda:</text>
  <text x="365" y="240" text-anchor="middle" font-size="13" fill="#16a34a">onMessage</text>
  <text x="365" y="256" text-anchor="middle" font-size="13" fill="#64748b">(echo)</text>

  <!-- handler action -->
  <rect x="510" y="90" width="180" height="90" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="600" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">handler</text>
  <text x="600" y="144" text-anchor="middle" font-size="13" fill="#334155">$bot-&gt;sendMessage(</text>
  <text x="600" y="164" text-anchor="middle" font-size="13" fill="#334155">"Siz yozdingiz: ...")</text>

  <!-- reply back to user -->
  <rect x="510" y="300" width="180" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="600" y="330" text-anchor="middle" font-size="14" fill="#334155">Foydalanuvchi oladi:</text>
  <text x="600" y="356" text-anchor="middle" font-size="14" fill="#16a34a" font-weight="bold">"Siz yozdingiz:</text>
  <text x="600" y="374" text-anchor="middle" font-size="14" fill="#16a34a" font-weight="bold">Salom"</text>

  <!-- arrows -->
  <line x1="210" y1="135" x2="273" y2="135" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a2)"/>
  <line x1="455" y1="232" x2="555" y2="182" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a3)"/>
  <text x="486" y="220" text-anchor="middle" font-size="13" fill="#16a34a">mos handler</text>
  <line x1="600" y1="180" x2="600" y2="298" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#a4)"/>
  <text x="660" y="245" text-anchor="middle" font-size="13" fill="#b45309">javob</text>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/></marker>
  </defs>
</svg>
