<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Segoe UI, sans-serif">
  <title>Loyiha tuzilishi: composer.json, index.php, .env, vendor</title>
  <rect width="720" height="440" fill="#f8fafc"/>
  <text x="360" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Minimal loyiha tuzilishi</text>

  <!-- folder root -->
  <rect x="60" y="70" width="600" height="340" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="60" y="70" width="220" height="34" rx="12" fill="#2563eb"/>
  <text x="80" y="93" font-size="15" font-weight="bold" fill="#ffffff">my-bot/  (loyiha papkasi)</text>

  <!-- composer.json -->
  <rect x="100" y="124" width="520" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="118" y="146" font-size="15" font-weight="bold" fill="#2563eb">composer.json</text>
  <text x="118" y="166" font-size="13" fill="#334155">bog'liqliklar: "nutgram/nutgram": "^4.46" — composer require bilan</text>

  <!-- index.php -->
  <rect x="100" y="184" width="520" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="118" y="206" font-size="15" font-weight="bold" fill="#16a34a">index.php</text>
  <text x="118" y="226" font-size="13" fill="#334155">bot kodi: new Nutgram(...), handlerlar, $bot-&gt;run()</text>

  <!-- .env -->
  <rect x="100" y="244" width="520" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="118" y="266" font-size="15" font-weight="bold" fill="#b45309">.env</text>
  <text x="118" y="286" font-size="13" fill="#334155">BOT_TOKEN=123:ABC — MAXFIY, .gitignore'ga qo'shiladi</text>

  <!-- vendor -->
  <rect x="100" y="304" width="520" height="50" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="118" y="326" font-size="15" font-weight="bold" fill="#475569">vendor/</text>
  <text x="118" y="346" font-size="13" fill="#334155">composer o'rnatadi (autoload.php shu yerda) — git'ga kiritilmaydi</text>

  <!-- .gitignore -->
  <rect x="100" y="364" width="520" height="34" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="118" y="386" font-size="13" fill="#dc2626" font-weight="bold">.gitignore  →  /vendor   .env   (sirlar va kutubxonalar git'ga tushmaydi)</text>
</svg>
