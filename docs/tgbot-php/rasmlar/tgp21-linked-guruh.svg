<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Segoe UI, sans-serif">
  <title>Linked discussion guruh: kanal posti avtomatik forward va izohlar</title>
  <rect width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Kanal + bog'langan izoh guruhi</text>

  <!-- Channel post -->
  <rect x="40" y="80" width="230" height="100" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">1. Kanal posti</text>
  <text x="155" y="142" text-anchor="middle" font-size="13" fill="#334155">onChannelPost</text>
  <text x="155" y="164" text-anchor="middle" font-size="13" fill="#94a3b8">chat.type = channel</text>

  <!-- auto-forward arrow -->
  <line x1="270" y1="130" x2="490" y2="130" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#a21l)"/>
  <text x="380" y="120" text-anchor="middle" font-size="13" fill="#f59e0b" font-weight="bold">avto-forward (Telegram)</text>

  <!-- Group auto message -->
  <rect x="495" y="80" width="230" height="100" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="610" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#16a34a">2. Guruhga tushdi</text>
  <text x="610" y="136" text-anchor="middle" font-size="13" fill="#334155">onMessage</text>
  <text x="610" y="158" text-anchor="middle" font-size="13" fill="#dc2626">is_automatic_forward</text>
  <text x="610" y="173" text-anchor="middle" font-size="13" fill="#dc2626">= true  -> e'tibormang</text>

  <!-- user comment -->
  <rect x="495" y="230" width="230" height="110" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <line x1="610" y1="180" x2="610" y2="230" stroke="#94a3b8" stroke-width="2" marker-end="url(#a21l)"/>
  <text x="610" y="264" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">3. Foydalanuvchi izohi</text>
  <text x="610" y="290" text-anchor="middle" font-size="13" fill="#334155">onMessage, from != null</text>
  <text x="610" y="312" text-anchor="middle" font-size="13" fill="#16a34a">is_automatic_forward yo'q</text>
  <text x="610" y="330" text-anchor="middle" font-size="13" fill="#334155">reply_to = forward posti</text>

  <!-- bot reacts -->
  <rect x="40" y="230" width="230" height="110" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <line x1="495" y1="285" x2="270" y2="285" stroke="#94a3b8" stroke-width="2" marker-end="url(#a21l)"/>
  <text x="155" y="264" text-anchor="middle" font-size="15" font-weight="bold" fill="#f59e0b">4. Bot javob beradi</text>
  <text x="155" y="290" text-anchor="middle" font-size="13" fill="#334155">sendMessage / reply</text>
  <text x="155" y="312" text-anchor="middle" font-size="13" fill="#334155">setMessageReaction</text>
  <text x="155" y="330" text-anchor="middle" font-size="13" fill="#94a3b8">izohni moderatsiya</text>

  <text x="380" y="400" text-anchor="middle" font-size="13" fill="#94a3b8">Kanal sozlamasida "Discussion" guruh ulanadi — keyin izohlar guruhga oqadi.</text>

  <defs>
    <marker id="a21l" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
