<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" font-family="Segoe UI, sans-serif">
  <title>Inline rejim: @bot so'rovi, answerInlineQuery va istalgan chatga natija qo'yish</title>
  <rect x="0" y="0" width="760" height="410" fill="#f8fafc"/>
  <text x="380" y="34" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e293b">Inline rejim (@bot ...)</text>
  <text x="380" y="58" font-size="14" text-anchor="middle" fill="#64748b">Bot istalgan chatda, unga a'zo bo'lmasa ham, ishlaydi</text>

  <!-- step 1: user types @bot olma -->
  <rect x="40" y="86" width="240" height="80" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="113" font-size="15" font-weight="bold" text-anchor="middle" fill="#2563eb">1. Istalgan chatda</text>
  <rect x="58" y="124" width="204" height="30" rx="6" fill="#eff6ff" stroke="#94a3b8"/>
  <text x="160" y="145" font-size="14" text-anchor="middle" fill="#1e293b">@mybot olma</text>

  <!-- arrow down -->
  <line x1="160" y1="166" x2="160" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="160,200 155,190 165,190" fill="#94a3b8"/>

  <!-- step 2: inline_query update -->
  <rect x="40" y="200" width="240" height="80" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <text x="160" y="227" font-size="15" font-weight="bold" text-anchor="middle" fill="#f59e0b">2. inline_query</text>
  <text x="160" y="251" font-size="14" text-anchor="middle" fill="#334155">update botga keladi</text>
  <text x="160" y="271" font-size="13" text-anchor="middle" fill="#64748b">query = "olma"</text>

  <!-- arrow right -->
  <line x1="280" y1="240" x2="350" y2="240" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="350,240 340,235 340,245" fill="#94a3b8"/>

  <!-- step 3: bot handler answerInlineQuery -->
  <rect x="350" y="200" width="370" height="80" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="535" y="227" font-size="15" font-weight="bold" text-anchor="middle" fill="#16a34a">3. onInlineQuery</text>
  <text x="535" y="251" font-size="13" text-anchor="middle" fill="#334155">answerInlineQuery([</text>
  <text x="535" y="271" font-size="13" text-anchor="middle" fill="#334155">InlineQueryResultArticle::make(...) ])</text>

  <!-- arrow down to results -->
  <line x1="535" y1="280" x2="535" y2="312" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="535,312 530,302 540,302" fill="#94a3b8"/>

  <!-- step 4: results list -->
  <rect x="350" y="312" width="370" height="78" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="370" y="336" font-size="14" font-weight="bold" fill="#1e293b">4. Natijalar ro'yxati</text>
  <rect x="368" y="346" width="334" height="34" rx="6" fill="#eff6ff" stroke="#94a3b8"/>
  <text x="382" y="368" font-size="14" fill="#1e293b">Olma — Narx: 1000 so'm</text>

  <!-- left note: chosen result -->
  <rect x="40" y="312" width="290" height="78" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="58" y="336" font-size="14" font-weight="bold" fill="#16a34a">Tanlanganda</text>
  <text x="58" y="360" font-size="13" fill="#334155">input_message_content chatga</text>
  <text x="58" y="380" font-size="13" fill="#334155">yuboriladi (foydalanuvchi nomidan).</text>
</svg>
