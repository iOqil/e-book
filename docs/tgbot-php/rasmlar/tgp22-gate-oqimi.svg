<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Segoe UI, sans-serif">
  <title>Majburiy obuna gate oqimi: update -> middleware -> getChatMember -> handler yoki gate</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Majburiy-obuna middleware oqimi</text>

  <!-- Update -->
  <rect x="30" y="70" width="150" height="56" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="105" y="94" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Update keldi</text>
  <text x="105" y="114" font-size="13" fill="#334155" text-anchor="middle">/start, xabar...</text>

  <!-- arrow -->
  <line x1="180" y1="98" x2="240" y2="98" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Middleware gate -->
  <rect x="240" y="62" width="190" height="72" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="335" y="88" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Obuna middleware</text>
  <text x="335" y="110" font-size="13" fill="#334155" text-anchor="middle">getChatMember(kanal,</text>
  <text x="335" y="126" font-size="13" fill="#334155" text-anchor="middle">userId) -> status</text>

  <!-- decision -->
  <polygon points="555,98 620,62 685,98 620,134" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="620" y="94" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Obuna</text>
  <text x="620" y="112" font-size="13" fill="#334155" text-anchor="middle">bormi?</text>
  <line x1="430" y1="98" x2="555" y2="98" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- HA -> next(handler) -->
  <line x1="620" y1="134" x2="620" y2="210" stroke="#16a34a" stroke-width="2" marker-end="url(#arrg)"/>
  <text x="640" y="176" font-size="14" font-weight="bold" fill="#16a34a">HA</text>
  <rect x="500" y="210" width="240" height="68" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="238" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">$next($bot)</text>
  <text x="620" y="260" font-size="13" fill="#334155" text-anchor="middle">handler ishlaydi -> javob</text>

  <!-- YO'Q -> short-circuit gate -->
  <line x1="555" y1="98" x2="420" y2="98" stroke="#dc2626" stroke-width="0"/>
  <path d="M 620 62 L 620 40 L 200 40 L 200 210" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrr)"/>
  <text x="400" y="32" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">YO'Q (short-circuit: $next chaqirilmaydi)</text>

  <rect x="60" y="210" width="290" height="120" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="205" y="236" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Obuna gate ko'rsatiladi</text>
  <text x="205" y="262" font-size="13" fill="#334155" text-anchor="middle">"Kanalga obuna boling"</text>
  <rect x="90" y="276" width="230" height="22" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="205" y="291" font-size="13" fill="#2563eb" text-anchor="middle">[ Obuna: @kanal ] (URL)</text>
  <rect x="90" y="302" width="230" height="22" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="205" y="317" font-size="13" fill="#16a34a" text-anchor="middle">[ Tekshirish ] (callback)</text>

  <!-- check loop back -->
  <path d="M 205 330 L 205 372 L 620 372 L 620 278" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrg)"/>
  <text x="412" y="390" font-size="13" fill="#16a34a" text-anchor="middle">"Tekshirish" bosilgach -> qayta getChatMember</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L8,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L8,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L8,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
</svg>
