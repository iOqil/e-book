<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Segoe UI, sans-serif">
  <title>CRUD: bot buyruqlari va SQL amallari mosligi</title>
  <rect x="0" y="0" width="760" height="380" fill="#f8fafc"/>
  <text x="380" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">CRUD: buyruq -> repository metodi -> SQL</text>

  <!-- Create -->
  <rect x="40" y="70" width="160" height="120" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="120" y="98" font-size="16" fill="#16a34a" text-anchor="middle" font-weight="bold">Create</text>
  <text x="120" y="124" font-size="13" fill="#334155" text-anchor="middle">/add Sut olish</text>
  <text x="120" y="146" font-size="13" fill="#334155" text-anchor="middle">notes-&gt;add()</text>
  <text x="120" y="170" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">INSERT</text>

  <!-- Read -->
  <rect x="220" y="70" width="160" height="120" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="98" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">Read</text>
  <text x="300" y="124" font-size="13" fill="#334155" text-anchor="middle">/list</text>
  <text x="300" y="146" font-size="13" fill="#334155" text-anchor="middle">notes-&gt;allFor()</text>
  <text x="300" y="170" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">SELECT</text>

  <!-- Update -->
  <rect x="400" y="70" width="160" height="120" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="480" y="98" font-size="16" fill="#b45309" text-anchor="middle" font-weight="bold">Update</text>
  <text x="480" y="124" font-size="13" fill="#334155" text-anchor="middle">/edit 3 Non</text>
  <text x="480" y="146" font-size="13" fill="#334155" text-anchor="middle">notes-&gt;update()</text>
  <text x="480" y="170" font-size="13" fill="#b45309" text-anchor="middle" font-weight="bold">UPDATE</text>

  <!-- Delete -->
  <rect x="580" y="70" width="160" height="120" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="660" y="98" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">Delete</text>
  <text x="660" y="124" font-size="13" fill="#334155" text-anchor="middle">/del 3</text>
  <text x="660" y="146" font-size="13" fill="#334155" text-anchor="middle">notes-&gt;delete()</text>
  <text x="660" y="170" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">DELETE</text>

  <!-- prepared statement banner -->
  <rect x="120" y="232" width="520" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="258" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">Har doim: prepare() + execute([':param' =&gt; $qiymat])</text>
  <text x="380" y="280" font-size="13" fill="#334155" text-anchor="middle">SQL in'ektsiyadan himoya — qiymatlarni hech qachon SQL satriga yopishtirmang</text>

  <!-- arrows to banner -->
  <line x1="120" y1="190" x2="300" y2="230" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="660" y1="190" x2="460" y2="230" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>

  <text x="380" y="334" font-size="14" fill="#334155" text-anchor="middle">user_id bilan filtrlash — har kim faqat o'z ma'lumotini ko'radi va o'chiradi</text>
  <text x="380" y="358" font-size="13" fill="#64748b" text-anchor="middle">CRUD = ma'lumot bilan ishlashning to'rt asosiy amali</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>
</svg>
