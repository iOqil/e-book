<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Segoe UI, sans-serif">
  <title>Mini App nima: HTML/JS UI Telegram ilovasi ichida ochiladi</title>
  <rect width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="36" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">Mini App = to'liq HTML/JS UI Telegram ICHIDA</text>

  <!-- Telegram client frame -->
  <rect x="60" y="64" width="300" height="330" rx="22" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="210" y="92" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">Telegram ilovasi</text>

  <!-- chat header -->
  <rect x="78" y="104" width="264" height="30" rx="6" fill="#2563eb"/>
  <text x="92" y="124" font-size="14" fill="#ffffff">@dokon_bot</text>

  <!-- embedded webview -->
  <rect x="78" y="146" width="264" height="200" rx="10" fill="#f8fafc" stroke="#16a34a" stroke-width="2.5"/>
  <text x="210" y="170" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">Web App (webview)</text>
  <rect x="96" y="184" width="228" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="110" y="206" font-size="13" fill="#334155">index.html — sizning sahifangiz</text>
  <rect x="96" y="226" width="110" height="50" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="151" y="256" font-size="13" fill="#334155" text-anchor="middle">CSS/JS</text>
  <rect x="214" y="226" width="110" height="50" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="269" y="256" font-size="13" fill="#334155" text-anchor="middle">SDK</text>
  <rect x="96" y="284" width="228" height="46" rx="8" fill="#16a34a"/>
  <text x="210" y="313" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">MainButton: Sotib olish</text>

  <!-- bot side -->
  <rect x="78" y="356" width="264" height="28" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="210" y="375" font-size="13" fill="#334155" text-anchor="middle">tugma -> Web App ochiladi</text>

  <!-- right column: your server -->
  <rect x="430" y="100" width="270" height="120" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="565" y="128" font-size="15" font-weight="bold" fill="#f59e0b" text-anchor="middle">Sizning HTTPS server</text>
  <text x="565" y="154" font-size="13" fill="#334155" text-anchor="middle">index.html + style.css + app.js</text>
  <text x="565" y="178" font-size="13" fill="#334155" text-anchor="middle">telegram-web-app.js (SDK)</text>
  <text x="565" y="202" font-size="13" fill="#334155" text-anchor="middle">backend: initData tekshiradi</text>

  <rect x="430" y="248" width="270" height="146" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
  <text x="565" y="276" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="middle">Oddiy botdan farqi</text>
  <text x="448" y="302" font-size="13" fill="#334155">Bot: matn + tugma (cheklangan UI)</text>
  <text x="448" y="326" font-size="13" fill="#334155">Mini App: butun veb-ilova</text>
  <text x="448" y="350" font-size="13" fill="#334155">grafik, animatsiya, formalar</text>
  <text x="448" y="374" font-size="13" fill="#334155">Telegram'dan chiqmasdan</text>

  <!-- arrow client -> server -->
  <line x1="360" y1="200" x2="426" y2="160" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="426,160 414,158 419,169" fill="#94a3b8"/>
  <text x="392" y="178" font-size="13" fill="#334155" text-anchor="middle">URL</text>
</svg>
