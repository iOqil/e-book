<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="Segoe UI, sans-serif">
  <title>Har API so'rovida initData tekshirish: auth guard oqimi</title>
  <rect x="0" y="0" width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Auth guard: har so'rovda tekshiriladi</text>

  <defs>
    <marker id="af" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <!-- incoming request -->
  <rect x="40" y="70" width="200" height="56" rx="8" fill="#16a34a"/>
  <text x="140" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">API so'rov keldi</text>
  <text x="140" y="114" text-anchor="middle" font-size="13" fill="#dcfce7">Authorization: tma ...</text>

  <line x1="240" y1="98" x2="295" y2="98" stroke="#334155" stroke-width="2" marker-end="url(#af)"/>

  <!-- check 1: header bor? -->
  <rect x="300" y="64" width="220" height="68" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="410" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">1. initData bormi?</text>
  <text x="410" y="112" text-anchor="middle" font-size="13" fill="#334155">sarlavhadan ajratib olamiz</text>

  <line x1="410" y1="132" x2="410" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#af)"/>

  <!-- check 2: HMAC -->
  <rect x="300" y="172" width="220" height="68" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="410" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">2. HMAC hash to'g'rimi?</text>
  <text x="410" y="220" text-anchor="middle" font-size="13" fill="#334155">bot token bilan qayta hisoblash</text>

  <line x1="410" y1="240" x2="410" y2="278" stroke="#334155" stroke-width="2" marker-end="url(#af)"/>

  <!-- check 3: auth_date -->
  <rect x="300" y="280" width="220" height="68" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="410" y="306" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">3. auth_date eski emasmi?</text>
  <text x="410" y="328" text-anchor="middle" font-size="13" fill="#334155">qo'lda: time() - auth_date</text>

  <!-- success path -->
  <line x1="520" y1="314" x2="600" y2="314" stroke="#16a34a" stroke-width="2" marker-end="url(#af)"/>
  <rect x="600" y="288" width="130" height="56" rx="8" fill="#16a34a"/>
  <text x="665" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">hammasi OK</text>
  <text x="665" y="332" text-anchor="middle" font-size="13" fill="#dcfce7">200 + holat</text>

  <!-- reject path: any check fails -->
  <line x1="300" y1="98" x2="200" y2="98" stroke="#dc2626" stroke-width="0"/>
  <path d="M300,206 C250,206 200,250 200,300 L200,378" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#af)"/>
  <rect x="120" y="380" width="200" height="56" rx="8" fill="#dc2626"/>
  <text x="220" y="404" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">birortasi yiqilsa</text>
  <text x="220" y="424" text-anchor="middle" font-size="13" fill="#fee2e2">401 Unauthorized</text>
  <text x="230" y="250" text-anchor="middle" font-size="13" fill="#dc2626">yiqildi</text>

  <text x="600" y="404" text-anchor="middle" font-size="13" fill="#64748b">user'ni initData'dan</text>
  <text x="600" y="424" text-anchor="middle" font-size="13" fill="#64748b">aniqlaymiz (ishonchli)</text>
</svg>
