<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Segoe UI, sans-serif">
  <title>Ishonch chegarasi: client soxta user yuborishi mumkin, faqat HMAC tekshiruvi himoya qiladi</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Nega client'ga ishonmaymiz?</text>

  <!-- trust boundary -->
  <line x1="380" y1="56" x2="380" y2="400" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="380" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">ISHONCH CHEGARASI</text>

  <!-- untrusted side -->
  <text x="190" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#dc2626">Ishonchsiz tomon (client)</text>

  <rect x="40" y="116" width="300" height="84" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="56" y="140" font-size="13" fill="#334155">Haqiqiy foydalanuvchi:</text>
  <text x="56" y="162" font-size="13" font-family="Consolas, monospace" fill="#16a34a">user_id = 99281932</text>
  <text x="56" y="186" font-size="13" fill="#64748b">(Telegram bergan, hash to'g'ri)</text>

  <rect x="40" y="216" width="300" height="104" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="56" y="240" font-size="13" fill="#334155">Hujumchi curl bilan yuboradi:</text>
  <text x="56" y="262" font-size="13" font-family="Consolas, monospace" fill="#dc2626">user_id = 1 (admin?)</text>
  <text x="56" y="284" font-size="13" fill="#334155">balance = 999999</text>
  <text x="56" y="306" font-size="13" fill="#64748b">-> har qanday qiymat soxta!</text>

  <!-- trusted side -->
  <text x="570" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#16a34a">Ishonchli tomon (server)</text>

  <rect x="420" y="130" width="300" height="170" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="436" y="156" font-size="14" font-weight="bold" fill="#166534">validateWebAppData($initData)</text>
  <text x="436" y="184" font-size="13" fill="#334155">Bot token FAQAT serverda.</text>
  <text x="436" y="208" font-size="13" fill="#334155">Hujumchi to'g'ri hash yasay</text>
  <text x="436" y="226" font-size="13" fill="#334155">olmaydi (tokensiz).</text>
  <text x="436" y="254" font-size="13" font-weight="bold" fill="#16a34a">Soxta data -> hash mos kelmaydi</text>
  <text x="436" y="276" font-size="13" font-weight="bold" fill="#dc2626">-> InvalidDataException</text>

  <!-- arrow across boundary -->
  <defs>
    <marker id="ar3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <line x1="340" y1="268" x2="418" y2="220" stroke="#dc2626" stroke-width="2" marker-end="url(#ar3)"/>

  <text x="380" y="392" text-anchor="middle" font-size="13" fill="#64748b">Qoida: client yuborgan har narsa SOXTA bo'lishi mumkin — serverda hash bilan tekshir.</text>
</svg>
