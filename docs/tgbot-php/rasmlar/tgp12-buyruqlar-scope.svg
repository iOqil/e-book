<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="Segoe UI, sans-serif">
  <title>setMyCommands va scope: bir bot, har xil foydalanuvchiga har xil menyu</title>
  <rect width="780" height="430" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Buyruqlar menyusi va scope</text>
  <text x="390" y="58" text-anchor="middle" font-size="14" fill="#334155">setMyCommands(commands, scope) — kim qanday menyuni ko'radi</text>

  <!-- center: bot -->
  <rect x="310" y="84" width="160" height="58" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="390" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">setMyCommands()</text>
  <text x="390" y="132" text-anchor="middle" font-size="13" fill="#334155">"/" tugmasidagi ro'yxat</text>

  <!-- default scope -->
  <rect x="40" y="186" width="216" height="118" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="148" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Default (hamma)</text>
  <text x="148" y="234" text-anchor="middle" font-size="13" fill="#94a3b8">scope berilmasa</text>
  <text x="148" y="258" text-anchor="middle" font-size="13" fill="#334155">/start</text>
  <text x="148" y="278" text-anchor="middle" font-size="13" fill="#334155">/yordam</text>
  <text x="148" y="298" text-anchor="middle" font-size="13" fill="#334155">/til</text>

  <!-- private scope -->
  <rect x="282" y="186" width="216" height="118" rx="12" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="390" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">AllPrivateChats</text>
  <text x="390" y="234" text-anchor="middle" font-size="13" fill="#94a3b8">shaxsiy chatlarda</text>
  <text x="390" y="258" text-anchor="middle" font-size="13" fill="#334155">/profil</text>
  <text x="390" y="278" text-anchor="middle" font-size="13" fill="#334155">/balans</text>
  <text x="390" y="298" text-anchor="middle" font-size="13" fill="#334155">/sozlama</text>

  <!-- admin chat scope -->
  <rect x="524" y="186" width="216" height="118" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="632" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">Chat(adminId)</text>
  <text x="632" y="234" text-anchor="middle" font-size="13" fill="#94a3b8">aniq foydalanuvchi</text>
  <text x="632" y="258" text-anchor="middle" font-size="13" fill="#334155">/panel</text>
  <text x="632" y="278" text-anchor="middle" font-size="13" fill="#334155">/statistika</text>
  <text x="632" y="298" text-anchor="middle" font-size="13" fill="#334155">/broadcast</text>

  <!-- arrows -->
  <line x1="350" y1="142" x2="180" y2="186" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="180,186 192,181 186,191" fill="#94a3b8"/>
  <line x1="390" y1="142" x2="390" y2="186" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="390,186 384,174 396,174" fill="#94a3b8"/>
  <line x1="430" y1="142" x2="600" y2="186" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="600,186 588,181 594,191" fill="#94a3b8"/>

  <!-- note -->
  <rect x="40" y="330" width="700" height="74" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="390" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#f59e0b">Aniqroq scope ustun keladi</text>
  <text x="390" y="380" text-anchor="middle" font-size="13" fill="#334155">Admin /panel'ni ham, /profil'ni ham, /start'ni ham ko'radi — Telegram eng aniq scope'dan boshlab birlashtiradi</text>
  <text x="390" y="398" text-anchor="middle" font-size="13" fill="#94a3b8">make(): Chat/ChatMember static; AllPrivateChats/Default uchun esa new ishlat</text>
</svg>
