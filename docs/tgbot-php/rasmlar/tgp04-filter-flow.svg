<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Segoe UI, sans-serif">
  <title>Update filtrlash va handler tanlash oqimi</title>
  <rect x="0" y="0" width="720" height="420" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Filtr oqimi: update qaysi handlerga boradi?</text>

  <!-- incoming update -->
  <rect x="280" y="56" width="160" height="48" rx="10" fill="#2563eb"/>
  <text x="360" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Kelgan update</text>

  <line x1="360" y1="104" x2="360" y2="134" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- decision 1: command? -->
  <polygon points="360,134 460,174 360,214 260,174" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">Buyruqmi?</text>
  <text x="360" y="190" text-anchor="middle" font-size="13" fill="#334155">/cmd</text>

  <!-- yes -> onCommand -->
  <line x1="460" y1="174" x2="560" y2="174" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
  <text x="500" y="166" text-anchor="middle" font-size="13" fill="#16a34a">ha</text>
  <rect x="560" y="150" width="140" height="48" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="630" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#16a34a">onCommand</text>
  <text x="630" y="190" text-anchor="middle" font-size="13" fill="#334155">+ {param}/where</text>

  <!-- no -> decision 2 -->
  <line x1="360" y1="214" x2="360" y2="244" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="375" y="234" font-size="13" fill="#dc2626">yoq</text>

  <polygon points="360,244 470,284 360,324 250,284" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#f59e0b">Matn naqshi</text>
  <text x="360" y="300" text-anchor="middle" font-size="13" fill="#334155">mosmi?</text>

  <line x1="470" y1="284" x2="560" y2="284" stroke="#f59e0b" stroke-width="2" marker-end="url(#a)"/>
  <text x="510" y="276" text-anchor="middle" font-size="13" fill="#f59e0b">ha</text>
  <rect x="560" y="260" width="140" height="48" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <text x="630" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#f59e0b">onText / type</text>

  <!-- no -> fallback -->
  <line x1="360" y1="324" x2="360" y2="356" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="375" y="346" font-size="13" fill="#dc2626">yoq</text>
  <rect x="280" y="356" width="160" height="48" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <text x="360" y="384" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">fallback</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
