<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Segoe UI, sans-serif">
  <title>getChatMember bilan a'zolik va admin tekshiruvi: status oqimi</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">getChatMember(chatId, userId) -&gt; status</text>

  <!-- so'rov -->
  <rect x="250" y="56" width="260" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="80" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">$bot-&gt;getChatMember($chatId, $uid)</text>
  <text x="380" y="100" font-size="13" fill="#334155" text-anchor="middle">-&gt; ChatMember (->status enum)</text>

  <line x1="380" y1="112" x2="380" y2="140" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="380,148 374,136 386,136" fill="#94a3b8"/>

  <text x="380" y="168" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="bold">ChatMemberStatus qiymatlari</text>

  <!-- admin guruhi -->
  <rect x="40" y="186" width="340" height="100" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="60" y="212" font-size="14" fill="#16a34a" font-weight="bold">ADMIN (isAdmin = true)</text>
  <text x="60" y="236" font-size="13" fill="#334155">CREATOR — guruh egasi</text>
  <text x="60" y="258" font-size="13" fill="#334155">ADMINISTRATOR — tayinlangan admin</text>
  <text x="60" y="278" font-size="13" fill="#64748b">-&gt; pin / ban / sozlama ruxsat</text>

  <!-- a'zo guruhi -->
  <rect x="400" y="186" width="320" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="420" y="212" font-size="14" fill="#2563eb" font-weight="bold">A'ZO (isMember = true)</text>
  <text x="420" y="236" font-size="13" fill="#334155">MEMBER — oddiy a'zo</text>
  <text x="420" y="258" font-size="13" fill="#334155">RESTRICTED — cheklangan a'zo</text>
  <text x="420" y="278" font-size="13" fill="#64748b">-&gt; guruhda, lekin admin emas</text>

  <!-- chiqqan guruhi -->
  <rect x="40" y="302" width="680" height="86" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="328" font-size="14" fill="#dc2626" font-weight="bold">GURUHDA EMAS (isMember = false)</text>
  <text x="60" y="352" font-size="13" fill="#334155">LEFT — o'zi chiqib ketgan       KICKED — ban qilingan (chiqarilgan)</text>
  <text x="60" y="374" font-size="13" fill="#64748b">-&gt; majburiy obuna tekshiruvida "obuna emas" deb hisoblanadi (22-bob)</text>

  <text x="380" y="416" font-size="13" fill="#64748b" text-anchor="middle">in_array($member?->status, [...], strict: true) bilan enum'ni solishtiring</text>
</svg>
