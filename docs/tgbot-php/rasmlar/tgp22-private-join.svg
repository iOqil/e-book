<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Segoe UI, sans-serif">
  <title>Yopiq (private) kanal uchun join-request oqimi: createChatInviteLink -> foydalanuvchi sorov yuboradi -> onChatJoinRequest -> approveChatJoinRequest</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Yopiq kanal: join-request bilan obuna</text>

  <!-- step 1 -->
  <rect x="30" y="70" width="210" height="100" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="135" y="96" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">1) Bot havola yaratadi</text>
  <text x="135" y="122" font-size="13" fill="#334155" text-anchor="middle">createChatInviteLink(</text>
  <text x="135" y="140" font-size="13" fill="#334155" text-anchor="middle">creates_join_request:</text>
  <text x="135" y="158" font-size="13" fill="#334155" text-anchor="middle">true)</text>

  <line x1="240" y1="120" x2="300" y2="120" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- step 2 -->
  <rect x="300" y="70" width="210" height="100" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="405" y="96" font-size="15" font-weight="bold" fill="#f59e0b" text-anchor="middle">2) Foydalanuvchi</text>
  <text x="405" y="122" font-size="13" fill="#334155" text-anchor="middle">havolani bosadi va</text>
  <text x="405" y="140" font-size="13" fill="#334155" text-anchor="middle">"so'rov yuborish"</text>
  <text x="405" y="158" font-size="13" fill="#334155" text-anchor="middle">tugmasini bosadi</text>

  <line x1="510" y1="120" x2="570" y2="120" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- step 3 -->
  <rect x="570" y="70" width="170" height="100" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="655" y="96" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">3) Telegram</text>
  <text x="655" y="122" font-size="13" fill="#334155" text-anchor="middle">chat_join_request</text>
  <text x="655" y="140" font-size="13" fill="#334155" text-anchor="middle">update'ini botga</text>
  <text x="655" y="158" font-size="13" fill="#334155" text-anchor="middle">yuboradi</text>

  <!-- down arrow -->
  <line x1="655" y1="170" x2="655" y2="220" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- step 4 handler -->
  <rect x="430" y="220" width="310" height="90" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="585" y="246" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">4) onChatJoinRequest handler</text>
  <text x="585" y="272" font-size="13" fill="#334155" text-anchor="middle">(ixtiyoriy) shartni tekshir,</text>
  <text x="585" y="290" font-size="13" fill="#334155" text-anchor="middle">so'ng qaror qabul qil</text>

  <!-- decision -->
  <line x1="430" y1="265" x2="370" y2="265" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="180" y="222" width="190" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="275" y="247" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">approveChatJoinRequest</text>

  <rect x="180" y="270" width="190" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="275" y="295" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">declineChatJoinRequest</text>

  <text x="275" y="335" font-size="13" fill="#334155" text-anchor="middle">Tasdiqlasa -&gt; foydalanuvchi yopiq kanalga kiradi.</text>
  <text x="275" y="354" font-size="13" fill="#334155" text-anchor="middle">Eslatma: bot kanalda ADMIN bo'lishi shart.</text>

  <text x="380" y="392" font-size="13" fill="#94a3b8" text-anchor="middle">Public kanalda esa to'g'ridan-to'g'ri @username/t.me havola + getChatMember yetarli.</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L8,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
</svg>
