<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Segoe UI, sans-serif">
  <title>Conversation holat diagrammasi: start, ism, yosh, shahar va end</title>
  <rect width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Forma conversation: qadamlar mashinasi</text>

  <!-- start -->
  <circle cx="90" cy="120" r="34" fill="#2563eb"/>
  <text x="90" y="116" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">start()</text>
  <text x="90" y="135" font-size="13" fill="#dbeafe" text-anchor="middle">begin</text>

  <!-- ism -->
  <rect x="200" y="86" width="140" height="68" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="270" y="116" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">ismni_qabul()</text>
  <text x="270" y="137" font-size="13" fill="#334155" text-anchor="middle">ism -&gt; xossa</text>

  <!-- yosh -->
  <rect x="390" y="86" width="140" height="68" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="460" y="116" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">yoshni_qabul()</text>
  <text x="460" y="137" font-size="13" fill="#334155" text-anchor="middle">yosh -&gt; xossa</text>

  <!-- shahar -->
  <rect x="580" y="86" width="150" height="68" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="655" y="116" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">shaharni_qabul()</text>
  <text x="655" y="137" font-size="13" fill="#334155" text-anchor="middle">shahar -&gt; xossa</text>

  <!-- end -->
  <circle cx="655" cy="290" r="38" fill="#16a34a"/>
  <circle cx="655" cy="290" r="30" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <text x="655" y="288" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">end()</text>
  <text x="655" y="307" font-size="13" fill="#dcfce7" text-anchor="middle">tugadi</text>

  <!-- arrows -->
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <line x1="124" y1="120" x2="196" y2="120" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="160" y="108" font-size="13" fill="#2563eb" text-anchor="middle">next</text>

  <line x1="340" y1="120" x2="386" y2="120" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="363" y="108" font-size="13" fill="#2563eb" text-anchor="middle">next</text>

  <line x1="530" y1="120" x2="576" y2="120" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="553" y="108" font-size="13" fill="#2563eb" text-anchor="middle">next</text>

  <line x1="655" y1="154" x2="655" y2="248" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="700" y="205" font-size="13" fill="#2563eb" text-anchor="middle">next</text>

  <!-- validation self-loop on yosh -->
  <path d="M 430 86 C 420 50 500 50 490 86" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="460" y="46" font-size="13" fill="#f59e0b" text-anchor="middle">raqam emas: next YO'Q</text>

  <!-- cancel arrows to end -->
  <path d="M 270 154 C 270 360 560 360 627 318" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <path d="M 460 154 C 460 340 560 340 622 314" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="360" y="390" font-size="14" fill="#dc2626" text-anchor="middle">istalgan qadamda /cancel -&gt; conversation avto-to'xtaydi</text>
</svg>
