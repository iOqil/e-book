<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Segoe UI, sans-serif">
  <title>Middleware darajalari: global, guruh va handler</title>
  <rect x="0" y="0" width="760" height="380" fill="#f8fafc"/>
  <text x="380" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Middleware qo'llanish darajalari</text>

  <!-- Global qatlam -->
  <rect x="40" y="56" width="680" height="296" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="84" font-size="16" fill="#2563eb" font-weight="bold">Global: $bot-&gt;middleware(...) — HAR update uchun</text>

  <!-- Guruh qatlam -->
  <rect x="70" y="104" width="340" height="220" rx="12" fill="#fef9ec" stroke="#f59e0b" stroke-width="2"/>
  <text x="90" y="132" font-size="15" fill="#b45309" font-weight="bold">Guruh: $bot-&gt;group(fn)-&gt;middleware(...)</text>
  <text x="90" y="154" font-size="13" fill="#334155">faqat shu guruh ichidagi handlerlar</text>

  <rect x="96" y="172" width="288" height="58" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="240" y="198" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="bold">/stats handler</text>
  <text x="240" y="218" font-size="13" fill="#334155" text-anchor="middle">guruh MW + global MW</text>

  <rect x="96" y="244" width="288" height="58" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="240" y="270" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="bold">/users handler</text>
  <text x="240" y="290" font-size="13" fill="#334155" text-anchor="middle">guruh MW + global MW</text>

  <!-- Handler qatlam (yakka) -->
  <rect x="440" y="140" width="250" height="170" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="460" y="168" font-size="15" fill="#16a34a" font-weight="bold">Handler darajasi</text>
  <text x="460" y="190" font-size="13" fill="#334155">$bot-&gt;onCommand('admin', ...)</text>
  <text x="460" y="210" font-size="13" fill="#334155">    -&gt;middleware(...)</text>

  <rect x="466" y="228" width="200" height="62" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="566" y="254" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">/admin handler</text>
  <text x="566" y="274" font-size="13" fill="#334155" text-anchor="middle">o'z MW + global MW</text>

  <text x="380" y="368" font-size="13" fill="#64748b" text-anchor="middle">Tashqi qatlam ichkilarini o'rab oladi: global -&gt; guruh -&gt; handler -&gt; nihoyat handler kodi</text>
</svg>
