<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Segoe UI, sans-serif">
  <title>Modulyar loyiha tuzilishi: papkalar va PSR-4 autoload</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="32" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Modulyar loyiha tuzilishi (PSR-4)</text>

  <!-- Kirish nuqtalari -->
  <rect x="30" y="60" width="200" height="56" rx="8" fill="#2563eb"/>
  <text x="130" y="84" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">bot.php</text>
  <text x="130" y="104" font-size="13" fill="#ffffff" text-anchor="middle">long-polling kirishi</text>

  <rect x="30" y="128" width="200" height="56" rx="8" fill="#2563eb"/>
  <text x="130" y="152" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">public/index.php</text>
  <text x="130" y="172" font-size="13" fill="#ffffff" text-anchor="middle">webhook kirishi</text>

  <!-- bootstrap -->
  <rect x="290" y="92" width="180" height="62" rx="10" fill="#16a34a"/>
  <text x="380" y="118" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">src/bootstrap.php</text>
  <text x="380" y="138" font-size="13" fill="#ffffff" text-anchor="middle">buildBot()</text>

  <line x1="230" y1="88" x2="288" y2="112" stroke="#94a3b8" stroke-width="2" marker-end="url(#a11)"/>
  <line x1="230" y1="156" x2="288" y2="134" stroke="#94a3b8" stroke-width="2" marker-end="url(#a11)"/>
  <text x="250" y="78" font-size="13" fill="#334155" text-anchor="middle">bir xil</text>

  <!-- config/handlers -->
  <rect x="530" y="92" width="200" height="62" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="630" y="118" font-size="15" fill="#b45309" text-anchor="middle" font-weight="bold">config/handlers.php</text>
  <text x="630" y="138" font-size="13" fill="#334155" text-anchor="middle">handlerlarni ro'yxatlash</text>
  <line x1="470" y1="123" x2="528" y2="123" stroke="#94a3b8" stroke-width="2" marker-end="url(#a11)"/>

  <!-- src/ papkalar -->
  <text x="380" y="222" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">src/  — sinf nomi = fayl nomi (PSR-4: App\ -> src/)</text>

  <rect x="30" y="240" width="160" height="58" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="266" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">Commands/</text>
  <text x="110" y="286" font-size="13" fill="#334155" text-anchor="middle">StartCommand</text>

  <rect x="205" y="240" width="160" height="58" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="285" y="266" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">Handlers/</text>
  <text x="285" y="286" font-size="13" fill="#334155" text-anchor="middle">callback, text</text>

  <rect x="380" y="240" width="170" height="58" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="465" y="266" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">Conversations/</text>
  <text x="465" y="286" font-size="13" fill="#334155" text-anchor="middle">FSM oqimlar</text>

  <rect x="565" y="240" width="165" height="58" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="647" y="266" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">Middleware/</text>
  <text x="647" y="286" font-size="13" fill="#334155" text-anchor="middle">qatlamlar</text>

  <rect x="205" y="312" width="160" height="58" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="285" y="338" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="bold">Services/</text>
  <text x="285" y="358" font-size="13" fill="#334155" text-anchor="middle">biznes-mantiq</text>

  <!-- .env -->
  <rect x="380" y="312" width="170" height="58" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="465" y="338" font-size="14" fill="#b45309" text-anchor="middle" font-weight="bold">.env (maxfiy)</text>
  <text x="465" y="358" font-size="13" fill="#334155" text-anchor="middle">token, sozlamalar</text>

  <!-- vendor -->
  <rect x="565" y="312" width="165" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="647" y="338" font-size="14" fill="#334155" text-anchor="middle" font-weight="bold">vendor/</text>
  <text x="647" y="358" font-size="13" fill="#64748b" text-anchor="middle">composer paketlari</text>

  <text x="380" y="404" font-size="13" fill="#64748b" text-anchor="middle">.env va vendor/ -> .gitignore'ga; har sinf o'z faylida, require'siz avtomatik yuklanadi</text>

  <defs>
    <marker id="a11" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>
</svg>
