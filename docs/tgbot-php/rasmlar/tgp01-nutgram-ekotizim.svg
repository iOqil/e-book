<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Segoe UI, sans-serif">
  <title>Nutgram ekotizimi: Update qabul qilish, handlerga yo'naltirish va javob qaytarish</title>
  <rect width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="34" font-size="19" font-weight="bold" fill="#1e293b" text-anchor="middle">Nutgram ichida Update qanday yo'l bosadi</text>

  <!-- Update -->
  <rect x="30" y="150" width="140" height="90" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="100" y="186" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Update</text>
  <text x="100" y="210" font-size="13" fill="#334155" text-anchor="middle">message,</text>
  <text x="100" y="228" font-size="13" fill="#334155" text-anchor="middle">callback_query...</text>

  <!-- Nutgram yadrosi -->
  <rect x="220" y="130" width="170" height="130" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="305" y="160" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">Nutgram</text>
  <text x="305" y="184" font-size="13" fill="#334155" text-anchor="middle">$bot (yadro)</text>
  <text x="305" y="208" font-size="13" fill="#64748b" text-anchor="middle">middleware -&gt;</text>
  <text x="305" y="228" font-size="13" fill="#64748b" text-anchor="middle">handlerlarni</text>
  <text x="305" y="246" font-size="13" fill="#64748b" text-anchor="middle">tartib bilan tekshiradi</text>

  <!-- Handlerlar -->
  <rect x="440" y="70" width="180" height="50" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="530" y="100" font-size="13" fill="#1e293b" text-anchor="middle">onCommand('start', ...)</text>

  <rect x="440" y="135" width="180" height="50" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="530" y="165" font-size="13" fill="#1e293b" text-anchor="middle">onText('/regex/', ...)</text>

  <rect x="440" y="200" width="180" height="50" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="530" y="230" font-size="13" fill="#1e293b" text-anchor="middle">onCallbackQuery(...)</text>

  <rect x="440" y="265" width="180" height="50" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="530" y="295" font-size="13" fill="#334155" text-anchor="middle">fallback(...)</text>

  <!-- Javob -->
  <rect x="660" y="135" width="80" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="700" y="180" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">send</text>
  <text x="700" y="200" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Message</text>
  <text x="700" y="222" font-size="13" fill="#64748b" text-anchor="middle">javob</text>

  <!-- Oqlar -->
  <line x1="170" y1="195" x2="218" y2="195" stroke="#94a3b8" stroke-width="2" marker-end="url(#e1)"/>
  <line x1="390" y1="180" x2="438" y2="95" stroke="#94a3b8" stroke-width="2" marker-end="url(#e1)"/>
  <line x1="390" y1="190" x2="438" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#e1)"/>
  <line x1="390" y1="205" x2="438" y2="225" stroke="#94a3b8" stroke-width="2" marker-end="url(#e1)"/>
  <line x1="390" y1="215" x2="438" y2="290" stroke="#94a3b8" stroke-width="2" marker-end="url(#e1)"/>
  <line x1="620" y1="160" x2="658" y2="180" stroke="#16a34a" stroke-width="2" marker-end="url(#e2)"/>

  <text x="380" y="360" font-size="14" fill="#334155" text-anchor="middle">Birinchi mos kelgan handler ishlaydi. Hech biri mos kelmasa — fallback (yoki e'tiborsiz).</text>
  <text x="380" y="384" font-size="13" fill="#64748b" text-anchor="middle">Handler ichida: $bot-&gt;message(), $bot-&gt;user(), $bot-&gt;chatId() — kontekst $bot orqali keladi.</text>

  <defs>
    <marker id="e1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="e2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
</svg>
