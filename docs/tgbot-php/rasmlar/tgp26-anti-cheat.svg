<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Segoe UI, sans-serif">
  <title>Anti-cheat: client soxta katta tap soni va balans yuboradi, server energiya bilan cheklaydi va soxta balansni e'tiborsiz qoldiradi</title>
  <rect width="800" height="470" fill="#f8fafc"/>
  <text x="400" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Anti-cheat: clientga ISHONMA</text>

  <defs>
    <marker id="ar3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Soxta client -->
  <rect x="40" y="90" width="220" height="200" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
  <text x="150" y="118" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="middle">SOXTA CLIENT</text>
  <text x="150" y="140" font-size="13" fill="#64748b" text-anchor="middle">(buzilgan brauzer)</text>
  <rect x="58" y="154" width="184" height="34" rx="6" fill="#fee2e2"/>
  <text x="150" y="176" font-size="13" fill="#991b1b" text-anchor="middle">taps = 999999</text>
  <rect x="58" y="196" width="184" height="34" rx="6" fill="#fee2e2"/>
  <text x="150" y="218" font-size="13" fill="#991b1b" text-anchor="middle">balance = 1000000000</text>
  <text x="150" y="256" font-size="13" fill="#64748b" text-anchor="middle">POST /api/tap</text>
  <text x="150" y="276" font-size="13" fill="#dc2626" text-anchor="middle">+ initData</text>

  <!-- Server -->
  <rect x="370" y="70" width="390" height="250" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="565" y="98" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">SERVER (PHP) — yagona haqiqat</text>

  <rect x="390" y="112" width="350" height="38" rx="6" fill="#dcfce7"/>
  <text x="565" y="136" font-size="13" fill="#166534" text-anchor="middle">1. initData VALIDATE (HMAC) — kim ekanini aniqlaydi</text>

  <rect x="390" y="158" width="350" height="38" rx="6" fill="#dcfce7"/>
  <text x="565" y="182" font-size="13" fill="#166534" text-anchor="middle">2. energiya = serverda regen (DB'dagi last_ts)</text>

  <rect x="390" y="204" width="350" height="38" rx="6" fill="#dcfce7"/>
  <text x="565" y="228" font-size="13" fill="#166534" text-anchor="middle">3. accepted = min(taps, energiya) -> 1000, mln EMAS</text>

  <rect x="390" y="250" width="350" height="38" rx="6" fill="#fef3c7"/>
  <text x="565" y="274" font-size="13" fill="#92400e" text-anchor="middle">4. soxta "balance" O'QILMAYDI -> e'tiborsiz</text>

  <text x="565" y="306" font-size="13" fill="#dc2626" text-anchor="middle">initData noto'g'ri -> 401, hech narsa hisoblanmaydi</text>

  <line x1="260" y1="200" x2="366" y2="200" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar3)"/>

  <text x="400" y="372" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Qoida: client NIYAT bildiradi ("tapdim"), server QAROR qiladi ("nechtasi haqiqiy")</text>
  <text x="400" y="402" font-size="13" fill="#64748b" text-anchor="middle">Balans, energiya, narx — hammasi serverda. Client raqamlari faqat ko'rsatkich uchun.</text>
  <text x="400" y="430" font-size="13" fill="#94a3b8" text-anchor="middle">Anti-cheat php -S + curl bilan REAL tekshirilgan: soxta 999999 -> server 1000 ga chekladi</text>
  <text x="400" y="452" font-size="13" fill="#94a3b8" text-anchor="middle">soxta balance 1000000000 e'tiborsiz qoldi (401 buzilgan initData'da)</text>
</svg>
