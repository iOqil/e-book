<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Segoe UI, sans-serif">
  <title>Telegram to'lov oqimi: sendInvoice dan onSuccessfulPayment gacha</title>
  <rect width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">To'lov oqimi: invoice -> pre-checkout -> to'lov</text>

  <!-- lanes -->
  <text x="120" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">Bot</text>
  <text x="380" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#f59e0b">Telegram</text>
  <text x="640" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#16a34a">Foydalanuvchi</text>
  <line x1="120" y1="80" x2="120" y2="440" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="380" y1="80" x2="380" y2="440" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="640" y1="80" x2="640" y2="440" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- 1 sendInvoice -->
  <line x1="120" y1="110" x2="635" y2="110" stroke="#2563eb" stroke-width="2"/>
  <polygon points="635,110 625,105 625,115" fill="#2563eb"/>
  <text x="375" y="103" text-anchor="middle" font-size="13" fill="#334155">1. sendInvoice(title, prices, currency)</text>

  <!-- 2 invoice ko'rsatildi -->
  <rect x="560" y="125" width="160" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="640" y="146" text-anchor="middle" font-size="13" fill="#166534">Invoice + "To'lash" tugma</text>

  <!-- 3 user pays -->
  <line x1="640" y1="180" x2="385" y2="180" stroke="#16a34a" stroke-width="2"/>
  <polygon points="385,180 395,175 395,185" fill="#16a34a"/>
  <text x="512" y="173" text-anchor="middle" font-size="13" fill="#334155">2. "To'lash" bosildi</text>

  <!-- 4 pre_checkout_query -->
  <line x1="380" y1="215" x2="125" y2="215" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="125,215 135,210 135,220" fill="#f59e0b"/>
  <text x="252" y="208" text-anchor="middle" font-size="13" fill="#334155">3. pre_checkout_query (10s ichida!)</text>

  <!-- 5 answerPreCheckoutQuery -->
  <line x1="120" y1="250" x2="375" y2="250" stroke="#2563eb" stroke-width="2"/>
  <polygon points="375,250 365,245 365,255" fill="#2563eb"/>
  <text x="248" y="243" text-anchor="middle" font-size="13" fill="#334155">4. answerPreCheckoutQuery(ok: true)</text>

  <!-- charge -->
  <rect x="300" y="265" width="160" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="285" text-anchor="middle" font-size="13" fill="#92400e">Telegram pul yechadi</text>

  <!-- 6 successful_payment -->
  <line x1="380" y1="320" x2="125" y2="320" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="125,320 135,315 135,325" fill="#f59e0b"/>
  <text x="252" y="313" text-anchor="middle" font-size="13" fill="#334155">5. message.successful_payment</text>

  <!-- 7 deliver + sendMessage -->
  <line x1="120" y1="355" x2="635" y2="355" stroke="#16a34a" stroke-width="2"/>
  <polygon points="635,355 625,350 625,360" fill="#16a34a"/>
  <text x="375" y="348" text-anchor="middle" font-size="13" fill="#334155">6. Tovar beriladi + "Rahmat!" (charge_id saqlanadi)</text>

  <!-- note -->
  <rect x="60" y="385" width="640" height="62" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="80" y="408" font-size="13" fill="#1e3a8a">Muhim: 4-qadamda 10 soniya ichida javob bering — aks holda Telegram</text>
  <text x="80" y="428" font-size="13" fill="#1e3a8a">to'lovni bekor qiladi. telegram_payment_charge_id ni refund uchun saqlang.</text>
</svg>
