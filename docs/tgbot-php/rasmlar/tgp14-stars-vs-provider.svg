<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Segoe UI, sans-serif">
  <title>Telegram Stars (XTR) va provider token to'lovlarini solishtirish</title>
  <rect width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Stars (XTR) va Provider token</text>

  <!-- Stars card -->
  <rect x="40" y="60" width="330" height="350" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="205" y="92" text-anchor="middle" font-size="17" font-weight="bold" fill="#2563eb">Telegram Stars (XTR)</text>
  <text x="205" y="116" text-anchor="middle" font-size="13" fill="#64748b">Raqamli tovar / xizmat</text>

  <text x="62" y="150" font-size="13" fill="#166534">+ provider_token = '' (BO'SH)</text>
  <text x="62" y="176" font-size="13" fill="#166534">+ currency = 'XTR'</text>
  <text x="62" y="202" font-size="13" fill="#166534">+ BotFather provider sozlash KERAK EMAS</text>
  <text x="62" y="228" font-size="13" fill="#166534">+ Hamma davlatda ishlaydi</text>
  <text x="62" y="254" font-size="13" fill="#166534">+ refundStarPayment bilan qaytarish</text>
  <text x="62" y="280" font-size="13" fill="#dc2626">- Faqat RAQAMLI mahsulot (App Store qoidasi)</text>
  <text x="62" y="306" font-size="13" fill="#dc2626">- Foydalanuvchi avval Stars sotib oladi</text>

  <rect x="62" y="328" width="286" height="62" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="74" y="350" font-size="13" fill="#1e3a8a">prices: 150 -> "150 Stars"</text>
  <text x="74" y="372" font-size="13" fill="#1e3a8a">(XTR uchun amount = Stars soni)</text>

  <!-- Provider card -->
  <rect x="390" y="60" width="330" height="350" rx="12" fill="#fefce8" stroke="#f59e0b" stroke-width="2"/>
  <text x="555" y="92" text-anchor="middle" font-size="17" font-weight="bold" fill="#b45309">Provider token</text>
  <text x="555" y="116" text-anchor="middle" font-size="13" fill="#64748b">Jismoniy tovar / xizmat</text>

  <text x="412" y="150" font-size="13" fill="#166534">+ Haqiqiy pul (UZS, USD, EUR...)</text>
  <text x="412" y="176" font-size="13" fill="#166534">+ need_shipping_address mumkin</text>
  <text x="412" y="202" font-size="13" fill="#166534">+ Jismoniy tovar sotish mumkin</text>
  <text x="412" y="228" font-size="13" fill="#dc2626">- BotFather'da provider ulash KERAK</text>
  <text x="412" y="254" font-size="13" fill="#dc2626">- provider_token = '111:TEST:...'</text>
  <text x="412" y="280" font-size="13" fill="#dc2626">- Refund — provider tomonida</text>
  <text x="412" y="306" font-size="13" fill="#dc2626">- Davlat/provider cheklovlari</text>

  <rect x="412" y="328" width="286" height="62" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="424" y="350" font-size="13" fill="#92400e">prices: 5000000 -> "50 000.00 UZS"</text>
  <text x="424" y="372" font-size="13" fill="#92400e">(eng kichik birlik: tiyin/sent)</text>
</svg>
