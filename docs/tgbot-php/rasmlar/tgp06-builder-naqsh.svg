<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" font-family="Segoe UI, sans-serif">
  <title>Inline klaviatura builder naqshi: ma'lumotdan dinamik qatorlar</title>
  <rect width="760" height="410" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Builder naqsh: ma'lumotdan klaviatura</text>

  <!-- Step 1: data -->
  <rect x="30" y="70" width="190" height="160" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="125" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">1. Ma'lumot</text>
  <text x="48" y="124" font-size="13" fill="#334155">[ Olma  (id 1) ]</text>
  <text x="48" y="148" font-size="13" fill="#334155">[ Banan (id 2) ]</text>
  <text x="48" y="172" font-size="13" fill="#334155">[ Uzum  (id 3) ]</text>
  <text x="48" y="206" font-size="13" fill="#64748b">DB / array / API</text>

  <!-- arrow -->
  <line x1="225" y1="150" x2="280" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="280,144 292,150 280,156" fill="#94a3b8"/>

  <!-- Step 2: builder -->
  <rect x="295" y="70" width="200" height="160" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="395" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#f59e0b">2. Builder (loop)</text>
  <text x="312" y="122" font-size="13" fill="#334155">$kb = Inline...::make();</text>
  <text x="312" y="144" font-size="13" fill="#334155">array_chunk(items, 2)</text>
  <text x="312" y="166" font-size="13" fill="#334155">foreach -&gt; addRow(</text>
  <text x="322" y="186" font-size="13" fill="#334155">Button::make(title,</text>
  <text x="322" y="206" font-size="13" fill="#334155">callback_data:'item:'.id))</text>

  <!-- arrow -->
  <line x1="500" y1="150" x2="555" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="555,144 567,150 555,156" fill="#94a3b8"/>

  <!-- Step 3: keyboard -->
  <rect x="570" y="70" width="160" height="160" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="650" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#16a34a">3. Klaviatura</text>
  <rect x="586" y="112" width="60" height="32" rx="7" fill="#e0e7ff" stroke="#2563eb"/>
  <text x="616" y="133" text-anchor="middle" font-size="13" fill="#2563eb">Olma</text>
  <rect x="654" y="112" width="60" height="32" rx="7" fill="#e0e7ff" stroke="#2563eb"/>
  <text x="684" y="133" text-anchor="middle" font-size="13" fill="#2563eb">Banan</text>
  <rect x="586" y="150" width="60" height="32" rx="7" fill="#e0e7ff" stroke="#2563eb"/>
  <text x="616" y="171" text-anchor="middle" font-size="13" fill="#2563eb">Uzum</text>
  <text x="650" y="210" text-anchor="middle" font-size="13" fill="#64748b">2 ta/qator</text>

  <!-- callback flow -->
  <rect x="30" y="270" width="700" height="110" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="50" y="298" font-size="15" font-weight="bold" fill="#dc2626">callback_data — KALIT g'oya</text>
  <text x="50" y="324" font-size="13" fill="#334155">Har tugma 'item:3' kabi yorliq tashiydi (max 64 bayt). Foydalanuvchi bossa,</text>
  <text x="50" y="346" font-size="13" fill="#334155">bot onCallbackQueryData('item:{id}', ...) bilan id ni ushlaydi va kerakli amalni bajaradi.</text>
  <text x="50" y="368" font-size="13" fill="#16a34a" font-weight="bold">Ma'lumot o'zgarsa — klaviatura ham avtomatik o'zgaradi.</text>
</svg>
