<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Segoe UI, sans-serif">
  <title>Middleware zanjiri: update handlergacha va orqaga</title>
  <rect x="0" y="0" width="760" height="360" fill="#f8fafc"/>
  <text x="380" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Middleware zanjiri (onion / piyoz modeli)</text>

  <!-- Update kirishi -->
  <rect x="20" y="150" width="92" height="56" rx="8" fill="#2563eb"/>
  <text x="66" y="176" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Update</text>
  <text x="66" y="194" font-size="13" fill="#ffffff" text-anchor="middle">keladi</text>

  <!-- MW1 -->
  <rect x="140" y="120" width="150" height="120" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="215" y="146" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="bold">MW 1 (log)</text>
  <text x="215" y="170" font-size="13" fill="#334155" text-anchor="middle">before</text>
  <text x="215" y="226" font-size="13" fill="#334155" text-anchor="middle">after</text>

  <!-- MW2 -->
  <rect x="180" y="148" width="150" height="64" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="255" y="170" font-size="15" fill="#b45309" text-anchor="middle" font-weight="bold">MW 2 (auth)</text>
  <text x="255" y="200" font-size="13" fill="#334155" text-anchor="middle">$next($bot)</text>

  <!-- Handler -->
  <rect x="360" y="150" width="150" height="56" rx="8" fill="#16a34a"/>
  <text x="435" y="174" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Handler</text>
  <text x="435" y="194" font-size="13" fill="#ffffff" text-anchor="middle">onCommand</text>

  <!-- oqim oldinga -->
  <line x1="112" y1="178" x2="138" y2="178" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="330" y1="178" x2="358" y2="178" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <text x="345" y="170" font-size="13" fill="#334155" text-anchor="middle">to'g'ri</text>

  <!-- qaytish -->
  <line x1="510" y1="240" x2="215" y2="240" stroke="#dc2626" stroke-width="2" marker-end="url(#arr)"/>
  <text x="360" y="262" font-size="13" fill="#dc2626" text-anchor="middle">javobdan keyin (after) — teskari tartibda</text>

  <!-- short circuit -->
  <rect x="540" y="120" width="200" height="120" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="640" y="148" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">Short-circuit</text>
  <text x="640" y="174" font-size="13" fill="#334155" text-anchor="middle">$next CHAQIRILMASA</text>
  <text x="640" y="196" font-size="13" fill="#334155" text-anchor="middle">handler ISHLAMAYDI,</text>
  <text x="640" y="218" font-size="13" fill="#334155" text-anchor="middle">zanjir shu yerda uziladi</text>

  <text x="380" y="316" font-size="14" fill="#334155" text-anchor="middle">Har middleware: kirishda kod ishlaydi -> $next($bot) -> chiqishda kod ishlaydi</text>
  <text x="380" y="338" font-size="13" fill="#64748b" text-anchor="middle">Tartib: ro'yxatdan o'tish bo'yicha kiriladi, teskarisiga qaytiladi</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
</svg>
