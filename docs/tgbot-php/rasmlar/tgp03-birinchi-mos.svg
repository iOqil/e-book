<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Segoe UI, sans-serif">
  <title>Birinchi-mos qoidasi: handlerlar ro'yxat tartibida tekshiriladi, faqat bittasi ishlaydi</title>
  <rect width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Birinchi-mos qoidasi</text>
  <text x="380" y="58" font-size="13" fill="#334155" text-anchor="middle">Kiruvchi xabar: "/start" — handlerlar yuqoridan pastga tekshiriladi</text>

  <!-- handler list -->
  <!-- 1 onCommand start -->
  <rect x="120" y="84" width="380" height="52" rx="8" fill="#16a34a"/>
  <text x="138" y="116" font-size="14" font-weight="bold" fill="#ffffff">1. onCommand('start')</text>
  <text x="490" y="116" font-size="13" fill="#dcfce7" text-anchor="end">MOS</text>
  <text x="600" y="116" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">ISHGA TUSHADI</text>

  <!-- 2 onText -->
  <rect x="120" y="150" width="380" height="52" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="138" y="182" font-size="14" fill="#64748b">2. onText('/regex/')</text>
  <text x="600" y="182" font-size="13" fill="#94a3b8" text-anchor="middle">tekshirilmaydi</text>

  <!-- 3 onMessage -->
  <rect x="120" y="216" width="380" height="52" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="138" y="248" font-size="14" fill="#64748b">3. onMessage(...)</text>
  <text x="600" y="248" font-size="13" fill="#94a3b8" text-anchor="middle">tekshirilmaydi</text>

  <!-- 4 fallback -->
  <rect x="120" y="282" width="380" height="52" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="138" y="314" font-size="14" fill="#64748b">4. fallback(...)</text>
  <text x="600" y="314" font-size="13" fill="#94a3b8" text-anchor="middle">tekshirilmaydi</text>

  <!-- flow arrow down then stop -->
  <line x1="90" y1="110" x2="90" y2="110" stroke="#94a3b8"/>
  <path d="M90,84 L90,110" stroke="#16a34a" stroke-width="3" marker-end="url(#ar2)"/>
  <text x="60" y="115" font-size="13" fill="#16a34a" text-anchor="middle">kirish</text>

  <!-- stop sign -->
  <line x1="310" y1="136" x2="310" y2="150" stroke="#dc2626" stroke-width="3"/>
  <circle cx="310" cy="150" r="0" fill="none"/>
  <rect x="262" y="362" width="236" height="36" rx="6" fill="#dc2626"/>
  <text x="380" y="386" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Mos topilgach to'xtaydi (faqat 1 ta)</text>

  <!-- priority note -->
  <rect x="80" y="416" width="600" height="42" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="100" y="434" font-size="13" fill="#1e293b">Aniqlik ustun: onCommand / onText (naqshli) — umumiy onMessage'dan oldin.</text>
  <text x="100" y="452" font-size="13" fill="#1e293b">Bir xil aniqlikdagilar orasida — ro'yxatga olish tartibi hal qiladi.</text>

  <defs>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
