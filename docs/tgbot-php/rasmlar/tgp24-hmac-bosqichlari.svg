<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Segoe UI, sans-serif">
  <title>initData hash hisoblash bosqichlari: data_check_string, secret key va yakuniy HMAC</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Hash hisoblash bosqichlari</text>

  <defs>
    <marker id="ar2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Step 1: raw initData -->
  <rect x="40" y="56" width="680" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="56" y="80" font-size="14" font-weight="bold" fill="#1e3a8a">1. Xom initData (query string)</text>
  <text x="56" y="100" font-size="13" fill="#334155">user=...&amp;auth_date=...&amp;query_id=...&amp;hash=abc123...</text>

  <line x1="380" y1="112" x2="380" y2="134" stroke="#334155" stroke-width="2" marker-end="url(#ar2)"/>

  <!-- Step 2: data_check_string -->
  <rect x="40" y="136" width="680" height="74" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="56" y="160" font-size="14" font-weight="bold" fill="#166534">2. data_check_string (hash OLIB TASHLANADI)</text>
  <text x="56" y="180" font-size="13" fill="#334155">kalit bo'yicha sarala -> "key=value" -> \n bilan birlashtir:</text>
  <text x="56" y="200" font-size="13" font-family="Consolas, monospace" fill="#334155">auth_date=...\nquery_id=...\nuser=...</text>

  <line x1="380" y1="210" x2="380" y2="232" stroke="#334155" stroke-width="2" marker-end="url(#ar2)"/>

  <!-- Step 3: secret -->
  <rect x="40" y="234" width="680" height="62" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="56" y="258" font-size="14" font-weight="bold" fill="#92400e">3. secret = HMAC-SHA256(bot_token), kalit="WebAppData", XOM bayt</text>
  <text x="56" y="280" font-size="13" font-family="Consolas, monospace" fill="#334155">hash_hmac('sha256', $token, 'WebAppData', true)</text>

  <line x1="380" y1="296" x2="380" y2="318" stroke="#334155" stroke-width="2" marker-end="url(#ar2)"/>

  <!-- Step 4: final hash -->
  <rect x="40" y="320" width="680" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="56" y="344" font-size="14" font-weight="bold" fill="#1e3a8a">4. hisoblangan = HMAC-SHA256(data_check_string), kalit=secret, hex</text>
  <text x="56" y="366" font-size="13" font-family="Consolas, monospace" fill="#334155">hash_hmac('sha256', $dcs, $secret)</text>

  <line x1="380" y1="382" x2="380" y2="404" stroke="#334155" stroke-width="2" marker-end="url(#ar2)"/>

  <!-- Step 5: compare -->
  <rect x="160" y="406" width="200" height="48" rx="8" fill="#16a34a"/>
  <text x="260" y="430" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">hash_equals = TRUE</text>
  <text x="260" y="448" text-anchor="middle" font-size="13" fill="#dcfce7">-> QABUL</text>

  <rect x="400" y="406" width="200" height="48" rx="8" fill="#dc2626"/>
  <text x="500" y="430" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">FALSE</text>
  <text x="500" y="448" text-anchor="middle" font-size="13" fill="#fee2e2">-> RAD (soxta)</text>
</svg>
