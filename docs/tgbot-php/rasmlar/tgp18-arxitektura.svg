<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="Segoe UI, sans-serif">
  <title>Vazifa-menejer bot arxitekturasi: update -> middleware -> handlerlar -> DB</title>
  <rect width="780" height="470" fill="#f8fafc"/>
  <text x="390" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Bot arxitekturasi: qatlamlar va ma'lumot oqimi</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Telegram update -->
  <rect x="40" y="80" width="150" height="68" rx="10" fill="#2563eb"/>
  <text x="115" y="110" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Telegram</text>
  <text x="115" y="131" font-size="13" fill="#dbeafe" text-anchor="middle">update keladi</text>

  <!-- Middleware stack -->
  <rect x="250" y="62" width="270" height="170" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="385" y="86" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Middleware zanjiri</text>
  <rect x="270" y="98" width="230" height="30" rx="6" fill="#fef3c7"/>
  <text x="385" y="118" font-size="13" fill="#334155" text-anchor="middle">1. RegisterUser (upsert)</text>
  <rect x="270" y="134" width="230" height="30" rx="6" fill="#fef3c7"/>
  <text x="385" y="154" font-size="13" fill="#334155" text-anchor="middle">2. BlockBanned (gate)</text>
  <rect x="270" y="170" width="230" height="30" rx="6" fill="#fef3c7"/>
  <text x="385" y="190" font-size="13" fill="#334155" text-anchor="middle">3. Repozitoriy -&gt; konteyner</text>
  <text x="385" y="220" font-size="13" fill="#64748b" text-anchor="middle">before -&gt; $next($bot) -&gt; after</text>

  <!-- Handlers -->
  <rect x="580" y="62" width="160" height="170" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="660" y="86" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Handlerlar</text>
  <text x="660" y="112" font-size="13" fill="#334155" text-anchor="middle">onCommand</text>
  <text x="660" y="134" font-size="13" fill="#334155" text-anchor="middle">onText (menyu)</text>
  <text x="660" y="156" font-size="13" fill="#334155" text-anchor="middle">Conversation</text>
  <text x="660" y="178" font-size="13" fill="#334155" text-anchor="middle">onCallbackQueryData</text>
  <text x="660" y="206" font-size="13" fill="#16a34a" text-anchor="middle">admin group + gate</text>

  <line x1="190" y1="114" x2="246" y2="114" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="520" y1="147" x2="576" y2="147" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- Repositories -->
  <rect x="300" y="300" width="180" height="80" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="390" y="328" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Repozitoriylar</text>
  <text x="390" y="350" font-size="13" fill="#334155" text-anchor="middle">TaskRepository</text>
  <text x="390" y="370" font-size="13" fill="#334155" text-anchor="middle">UserRepository</text>

  <!-- DB -->
  <rect x="540" y="300" width="180" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="630" y="328" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">PDO (SQLite)</text>
  <text x="630" y="350" font-size="13" fill="#334155" text-anchor="middle">users</text>
  <text x="630" y="370" font-size="13" fill="#334155" text-anchor="middle">tasks</text>

  <line x1="660" y1="232" x2="540" y2="300" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="480" y1="340" x2="536" y2="340" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>

  <text x="390" y="430" font-size="14" fill="#64748b" text-anchor="middle">Har bir update bir xil yo'ldan o'tadi: middleware avval, so'ng handler, ma'lumot esa DB'da</text>
  <text x="390" y="452" font-size="13" fill="#94a3b8" text-anchor="middle">FakeNutgram + PDO sqlite bilan offline tekshirilgan</text>
</svg>
