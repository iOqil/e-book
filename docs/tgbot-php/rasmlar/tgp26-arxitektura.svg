<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Segoe UI, sans-serif">
  <title>Clicker Mini App arxitekturasi: bot -> Mini App (frontend) -> backend (PHP) -> DB</title>
  <rect width="800" height="480" fill="#f8fafc"/>
  <text x="400" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Clicker Mini App arxitekturasi</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Bot (Nutgram) -->
  <rect x="40" y="90" width="170" height="100" rx="12" fill="#2563eb"/>
  <text x="125" y="124" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">BOT (Nutgram)</text>
  <text x="125" y="148" font-size="13" fill="#dbeafe" text-anchor="middle">/start -></text>
  <text x="125" y="168" font-size="13" fill="#dbeafe" text-anchor="middle">web_app tugma</text>

  <!-- Frontend (Mini App) -->
  <rect x="300" y="70" width="200" height="150" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="400" y="96" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">FRONTEND</text>
  <text x="400" y="116" font-size="13" fill="#64748b" text-anchor="middle">HTML/JS + web-app.js</text>
  <rect x="318" y="128" width="164" height="28" rx="6" fill="#fef3c7"/>
  <text x="400" y="147" font-size="13" fill="#334155" text-anchor="middle">tap tugma</text>
  <rect x="318" y="162" width="164" height="28" rx="6" fill="#fef3c7"/>
  <text x="400" y="181" font-size="13" fill="#334155" text-anchor="middle">balans / energiya</text>
  <text x="400" y="208" font-size="13" fill="#dc2626" text-anchor="middle">initData yuboradi</text>

  <!-- Backend (PHP) -->
  <rect x="590" y="70" width="180" height="150" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="680" y="96" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">BACKEND (PHP)</text>
  <text x="680" y="120" font-size="13" fill="#334155" text-anchor="middle">/api/state</text>
  <text x="680" y="142" font-size="13" fill="#334155" text-anchor="middle">/api/tap</text>
  <text x="680" y="164" font-size="13" fill="#334155" text-anchor="middle">/api/upgrade</text>
  <text x="680" y="192" font-size="13" fill="#dc2626" text-anchor="middle">initData VALIDATE</text>
  <text x="680" y="211" font-size="13" fill="#16a34a" text-anchor="middle">balans = serverda</text>

  <!-- DB -->
  <rect x="590" y="300" width="180" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="680" y="330" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">PDO (SQLite)</text>
  <text x="680" y="354" font-size="13" fill="#334155" text-anchor="middle">players jadvali</text>
  <text x="680" y="376" font-size="13" fill="#334155" text-anchor="middle">balance, energy, ts</text>

  <!-- Game logic -->
  <rect x="320" y="300" width="200" height="90" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="420" y="330" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Game (sof PHP)</text>
  <text x="420" y="354" font-size="13" fill="#334155" text-anchor="middle">applyTaps, regenEnergy</text>
  <text x="420" y="376" font-size="13" fill="#334155" text-anchor="middle">buyUpgrade, passiv</text>

  <!-- arrows -->
  <line x1="210" y1="130" x2="296" y2="130" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="253" y="122" font-size="13" fill="#64748b" text-anchor="middle">ochadi</text>
  <line x1="500" y1="135" x2="586" y2="135" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="543" y="127" font-size="13" fill="#64748b" text-anchor="middle">fetch</text>
  <line x1="680" y1="220" x2="680" y2="296" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="586" y1="345" x2="524" y2="345" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="555" y="337" font-size="13" fill="#64748b" text-anchor="middle">hisob</text>

  <text x="400" y="438" font-size="14" fill="#64748b" text-anchor="middle">Client faqat NIYAT yuboradi (tap soni); barcha raqam SERVERDA hisoblanadi</text>
  <text x="400" y="460" font-size="13" fill="#94a3b8" text-anchor="middle">O'yin mantig'i + backend offline (phpunit + php -S) bilan tekshirilgan</text>
</svg>
