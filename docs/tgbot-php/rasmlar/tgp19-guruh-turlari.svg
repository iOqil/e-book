<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Segoe UI, sans-serif">
  <title>Guruh turlari va privacy mode: bot qaysi xabarlarni ko'radi</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Guruh turlari va privacy mode</text>

  <!-- Group vs Supergroup -->
  <rect x="40" y="56" width="320" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="84" font-size="16" fill="#2563eb" font-weight="bold">type: "group"</text>
  <text x="60" y="108" font-size="13" fill="#334155">Oddiy guruh, ~200 a'zogacha</text>
  <text x="60" y="130" font-size="13" fill="#334155">id manfiy: -123456</text>
  <text x="60" y="156" font-size="13" fill="#64748b">a'zo ko'paysa supergruhga aylanadi</text>

  <rect x="400" y="56" width="320" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="420" y="84" font-size="16" fill="#16a34a" font-weight="bold">type: "supergroup"</text>
  <text x="420" y="108" font-size="13" fill="#334155">Katta guruh, moderatsiya, topiclar</text>
  <text x="420" y="130" font-size="13" fill="#334155">id: -100... bilan boshlanadi</text>
  <text x="420" y="156" font-size="13" fill="#64748b">ban/restrict/pin shu yerda to'liq</text>

  <!-- Privacy mode -->
  <text x="380" y="210" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Privacy mode (@BotFather /setprivacy)</text>

  <rect x="40" y="228" width="320" height="150" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="256" font-size="15" fill="#dc2626" font-weight="bold">ENABLED (standart)</text>
  <text x="60" y="282" font-size="13" fill="#334155">Bot KO'RADI:</text>
  <text x="74" y="304" font-size="13" fill="#16a34a">+ buyruqlar: /start, /rules</text>
  <text x="74" y="324" font-size="13" fill="#16a34a">+ botga reply / @mention</text>
  <text x="60" y="350" font-size="13" fill="#334155">Bot KO'RMAYDI:</text>
  <text x="74" y="370" font-size="13" fill="#dc2626">- oddiy odamiy xabarlar</text>

  <rect x="400" y="228" width="320" height="150" rx="12" fill="#fef9ec" stroke="#f59e0b" stroke-width="2"/>
  <text x="420" y="256" font-size="15" fill="#b45309" font-weight="bold">DISABLED</text>
  <text x="420" y="282" font-size="13" fill="#334155">Bot HAMMA xabarni ko'radi</text>
  <text x="420" y="304" font-size="13" fill="#334155">(moderatsiya, anti-spam uchun)</text>
  <text x="420" y="330" font-size="13" fill="#64748b">Yoki botni admin qiling —</text>
  <text x="420" y="350" font-size="13" fill="#64748b">admin har doim hammasini ko'radi</text>
  <text x="420" y="370" font-size="13" fill="#64748b">(privacy holatidan qat'i nazar)</text>

  <text x="380" y="404" font-size="13" fill="#64748b" text-anchor="middle">Sozlamani o'zgartirgach botni guruhdan chiqarib qayta qo'shing</text>
</svg>
