<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Segoe UI, sans-serif">
  <title>Media yuborish: send metodlari va InputFile manbalari</title>
  <rect width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Media yuborish</text>
  <text x="380" y="58" text-anchor="middle" font-size="14" fill="#334155">bir manba uch xil yo'l bilan beriladi</text>

  <!-- 3 manba -->
  <text x="130" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Fayl manbasi</text>

  <rect x="30" y="106" width="200" height="56" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="130" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">1. Lokal fayl</text>
  <text x="130" y="150" text-anchor="middle" font-size="13" fill="#334155">InputFile::make($path)</text>

  <rect x="30" y="172" width="200" height="56" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">2. URL (Internet)</text>
  <text x="130" y="216" text-anchor="middle" font-size="13" fill="#334155">'https://.../cat.jpg'</text>

  <rect x="30" y="238" width="200" height="56" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <text x="130" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#f59e0b">3. file_id</text>
  <text x="130" y="282" text-anchor="middle" font-size="13" fill="#334155">qayta yuborish (tez)</text>

  <!-- arrow to methods -->
  <line x1="232" y1="200" x2="320" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="320,200 308,194 308,206" fill="#94a3b8"/>

  <!-- send metodlari -->
  <rect x="330" y="92" width="400" height="216" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="530" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">send* metodlari</text>

  <rect x="350" y="132" width="170" height="44" rx="8" fill="#f8fafc" stroke="#2563eb"/>
  <text x="435" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">sendPhoto</text>
  <text x="435" y="169" text-anchor="middle" font-size="13" fill="#334155">rasm + caption</text>

  <rect x="540" y="132" width="170" height="44" rx="8" fill="#f8fafc" stroke="#16a34a"/>
  <text x="625" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">sendDocument</text>
  <text x="625" y="169" text-anchor="middle" font-size="13" fill="#334155">istalgan fayl</text>

  <rect x="350" y="184" width="170" height="44" rx="8" fill="#f8fafc" stroke="#f59e0b"/>
  <text x="435" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">sendAudio</text>
  <text x="435" y="221" text-anchor="middle" font-size="13" fill="#334155">title, performer</text>

  <rect x="540" y="184" width="170" height="44" rx="8" fill="#f8fafc" stroke="#dc2626"/>
  <text x="625" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">sendVideo</text>
  <text x="625" y="221" text-anchor="middle" font-size="13" fill="#334155">width, height</text>

  <rect x="350" y="236" width="360" height="56" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="530" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">caption + parse_mode</text>
  <text x="530" y="278" text-anchor="middle" font-size="13" fill="#334155">media tagiga formatli matn (0-1024 belgi)</text>

  <!-- result -->
  <rect x="180" y="336" width="400" height="74" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="364" text-anchor="middle" font-size="15" font-weight="bold" fill="#16a34a">Telegram javobi</text>
  <text x="380" y="388" text-anchor="middle" font-size="13" fill="#334155">Message obyekti -> photo/document/audio/video</text>
  <text x="380" y="406" text-anchor="middle" font-size="13" fill="#334155">file_id ni saqlang: keyingi safar tez yuborasiz</text>
</svg>
