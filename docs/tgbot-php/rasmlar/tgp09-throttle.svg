<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Segoe UI, sans-serif">
  <title>Throttling: anti-flood middleware vaqt oynasi bilan</title>
  <rect x="0" y="0" width="760" height="380" fill="#f8fafc"/>
  <text x="380" y="34" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Throttling (anti-flood) middleware</text>
  <text x="380" y="58" font-size="14" fill="#334155" text-anchor="middle">Qoida: 2 soniyada 1 marta. Tez bosilsa — rad etiladi.</text>

  <!-- vaqt o'qi -->
  <line x1="60" y1="300" x2="700" y2="300" stroke="#94a3b8" stroke-width="2" marker-end="url(#ax)"/>
  <text x="700" y="324" font-size="13" fill="#64748b" text-anchor="end">vaqt (soniya)</text>

  <!-- so'rov 1 -->
  <line x1="120" y1="300" x2="120" y2="150" stroke="#16a34a" stroke-width="2"/>
  <circle cx="120" cy="150" r="10" fill="#16a34a"/>
  <text x="120" y="138" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">t=0</text>
  <rect x="60" y="170" width="120" height="40" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="120" y="195" font-size="13" fill="#166534" text-anchor="middle">QABUL: pong</text>

  <!-- so'rov 2 (flood) -->
  <line x1="220" y1="300" x2="220" y2="200" stroke="#dc2626" stroke-width="2"/>
  <circle cx="220" cy="200" r="10" fill="#dc2626"/>
  <text x="220" y="188" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">t=0.5</text>
  <rect x="200" y="218" width="130" height="40" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="265" y="243" font-size="13" fill="#991b1b" text-anchor="middle">RAD: Sekinroq!</text>

  <!-- so'rov 3 (flood) -->
  <line x1="320" y1="300" x2="320" y2="230" stroke="#dc2626" stroke-width="2"/>
  <circle cx="320" cy="230" r="9" fill="#dc2626"/>
  <text x="320" y="218" font-size="13" fill="#dc2626" text-anchor="middle">t=1.2</text>

  <!-- oyna chizig'i -->
  <line x1="120" y1="332" x2="420" y2="332" stroke="#f59e0b" stroke-width="3"/>
  <text x="270" y="354" font-size="13" fill="#b45309" text-anchor="middle">2 soniyalik oyna (bloklangan)</text>

  <!-- so'rov 4 (yangi oyna) -->
  <line x1="440" y1="300" x2="440" y2="150" stroke="#16a34a" stroke-width="2"/>
  <circle cx="440" cy="150" r="10" fill="#16a34a"/>
  <text x="440" y="138" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold">t=2.1</text>
  <rect x="380" y="170" width="120" height="40" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="440" y="195" font-size="13" fill="#166534" text-anchor="middle">QABUL: pong</text>

  <!-- izoh -->
  <rect x="540" y="120" width="180" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="630" y="146" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="bold">Saqlash</text>
  <text x="630" y="170" font-size="13" fill="#334155" text-anchor="middle">getUserData</text>
  <text x="630" y="190" font-size="13" fill="#334155" text-anchor="middle">('last_action')</text>
  <text x="630" y="214" font-size="13" fill="#334155" text-anchor="middle">yoki RateLimit</text>
  <text x="630" y="232" font-size="13" fill="#334155" text-anchor="middle">middleware sinfi</text>

  <defs>
    <marker id="ax" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>
</svg>
