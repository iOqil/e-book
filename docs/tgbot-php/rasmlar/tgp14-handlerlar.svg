<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Segoe UI, sans-serif">
  <title>To'lov bilan bog'liq Nutgram handlerlari va metodlari</title>
  <rect width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">To'lov handlerlari va metodlari</text>

  <!-- step boxes -->
  <rect x="40" y="70" width="220" height="96" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">1. Invoice yuborish</text>
  <text x="150" y="124" text-anchor="middle" font-size="13" fill="#334155">sendInvoice(...)</text>
  <text x="150" y="146" text-anchor="middle" font-size="13" fill="#334155">yoki createInvoiceLink(...)</text>

  <rect x="270" y="70" width="220" height="96" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">2. Pre-checkout</text>
  <text x="380" y="124" text-anchor="middle" font-size="13" fill="#334155">onPreCheckoutQuery(...)</text>
  <text x="380" y="146" text-anchor="middle" font-size="13" fill="#334155">-> answerPreCheckoutQuery(true)</text>

  <rect x="500" y="70" width="220" height="96" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="610" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">3. Muvaffaqiyat</text>
  <text x="610" y="124" text-anchor="middle" font-size="13" fill="#334155">onSuccessfulPayment(...)</text>
  <text x="610" y="146" text-anchor="middle" font-size="13" fill="#334155">-> tovar berish</text>

  <!-- arrows -->
  <line x1="260" y1="118" x2="270" y2="118" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="270,118 260,113 260,123" fill="#94a3b8"/>
  <line x1="490" y1="118" x2="500" y2="118" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="500,118 490,113 490,123" fill="#94a3b8"/>

  <!-- data accessors -->
  <rect x="40" y="200" width="680" height="92" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="60" y="226" font-size="15" font-weight="bold" fill="#1e293b">Handler ichida ma'lumot:</text>
  <text x="60" y="252" font-size="13" fill="#334155">$bot-&gt;preCheckoutQuery()-&gt;invoice_payload, -&gt;currency, -&gt;total_amount</text>
  <text x="60" y="276" font-size="13" fill="#334155">$bot-&gt;message()-&gt;successful_payment-&gt;telegram_payment_charge_id  (refund uchun saqlang)</text>

  <!-- refund + stars admin -->
  <rect x="40" y="320" width="335" height="86" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="207" y="346" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">Pulni qaytarish (Stars)</text>
  <text x="207" y="372" text-anchor="middle" font-size="13" fill="#334155">refundStarPayment(charge_id, user_id)</text>
  <text x="207" y="394" text-anchor="middle" font-size="13" fill="#334155">-> Stars foydalanuvchiga qaytadi</text>

  <rect x="385" y="320" width="335" height="86" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="552" y="346" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Bot balansi va tarix</text>
  <text x="552" y="372" text-anchor="middle" font-size="13" fill="#334155">getMyStarBalance()-&gt;amount</text>
  <text x="552" y="394" text-anchor="middle" font-size="13" fill="#334155">getStarTransactions(offset, limit)</text>
</svg>
