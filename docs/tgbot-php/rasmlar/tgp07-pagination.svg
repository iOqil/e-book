<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Segoe UI, sans-serif">
  <title>Inline tugmalar bilan sahifalash (pagination): bitta xabar tahrirlanadi</title>
  <rect x="0" y="0" width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="34" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e293b">Sahifalash (pagination)</text>
  <text x="380" y="58" font-size="14" text-anchor="middle" fill="#64748b">Yangi xabar emas — editMessageText bitta xabarni almashtiradi</text>

  <!-- page 1 message bubble -->
  <rect x="40" y="90" width="300" height="250" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="120" font-size="15" font-weight="bold" fill="#1e293b">Katalog (1-sahifa):</text>
  <rect x="60" y="135" width="260" height="34" rx="6" fill="#eff6ff" stroke="#94a3b8"/>
  <text x="190" y="157" font-size="14" text-anchor="middle" fill="#1e293b">Olma</text>
  <rect x="60" y="174" width="260" height="34" rx="6" fill="#eff6ff" stroke="#94a3b8"/>
  <text x="190" y="196" font-size="14" text-anchor="middle" fill="#1e293b">Banan</text>
  <rect x="60" y="213" width="260" height="34" rx="6" fill="#eff6ff" stroke="#94a3b8"/>
  <text x="190" y="235" font-size="14" text-anchor="middle" fill="#1e293b">Gilos</text>
  <!-- nav row -->
  <rect x="60" y="258" width="125" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="122" y="281" font-size="14" text-anchor="middle" fill="#64748b">1 / 4</text>
  <rect x="195" y="258" width="125" height="36" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="257" y="281" font-size="15" text-anchor="middle" fill="#2563eb" font-weight="bold">Keyingi ➡️</text>
  <text x="190" y="322" font-size="13" text-anchor="middle" fill="#64748b">callback_data: "page:1"</text>

  <!-- arrow -->
  <line x1="350" y1="215" x2="420" y2="215" stroke="#16a34a" stroke-width="3"/>
  <polygon points="420,215 408,209 408,221" fill="#16a34a"/>
  <text x="385" y="205" font-size="13" text-anchor="middle" fill="#16a34a" font-weight="bold">edit</text>

  <!-- page 2 message bubble (same message, edited) -->
  <rect x="430" y="90" width="300" height="250" rx="14" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="120" font-size="15" font-weight="bold" fill="#1e293b">Katalog (2-sahifa):</text>
  <rect x="450" y="135" width="260" height="34" rx="6" fill="#f0fdf4" stroke="#94a3b8"/>
  <text x="580" y="157" font-size="14" text-anchor="middle" fill="#1e293b">Uzum</text>
  <rect x="450" y="174" width="260" height="34" rx="6" fill="#f0fdf4" stroke="#94a3b8"/>
  <text x="580" y="196" font-size="14" text-anchor="middle" fill="#1e293b">Limon</text>
  <rect x="450" y="213" width="260" height="34" rx="6" fill="#f0fdf4" stroke="#94a3b8"/>
  <text x="580" y="235" font-size="14" text-anchor="middle" fill="#1e293b">Mango</text>
  <!-- nav row -->
  <rect x="450" y="258" width="82" height="36" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="491" y="281" font-size="15" text-anchor="middle" fill="#2563eb" font-weight="bold">⬅️</text>
  <rect x="538" y="258" width="82" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="579" y="281" font-size="14" text-anchor="middle" fill="#64748b">2 / 4</text>
  <rect x="626" y="258" width="84" height="36" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="668" y="281" font-size="15" text-anchor="middle" fill="#2563eb" font-weight="bold">➡️</text>
  <text x="580" y="322" font-size="13" text-anchor="middle" fill="#64748b">page:0 · page:2</text>
</svg>
