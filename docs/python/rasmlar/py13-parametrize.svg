<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470">
  <title>parametrize: bitta test funksiyasi jadvaldagi har bir (kirish, kutilgan) juftligi uchun alohida test sifatida ishlaydi</title>
  <defs>
    <marker id="pm-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="470" fill="#f8fafc"/>
  <text x="400" y="38" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">parametrize: bitta test, ko'p holat</text>
  <text x="400" y="62" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">jadvaldagi har qator -&gt; alohida test (4 qator = 4 ta test)</text>

  <!-- Chap: bitta test + jadval -->
  <rect x="40" y="100" width="320" height="290" rx="12" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb" stroke-width="2.5"/>
  <text x="200" y="128" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="14" fill="#b45309">@pytest.mark.parametrize(</text>
  <text x="200" y="150" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="14" fill="#475569">"kirish, kutilgan", [</text>

  <!-- jadval qatorlari -->
  <rect x="70" y="162" width="260" height="32" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="200" y="184" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1e293b">(2, 4)</text>
  <rect x="70" y="198" width="260" height="32" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="200" y="220" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1e293b">(3, 9)</text>
  <rect x="70" y="234" width="260" height="32" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="200" y="256" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1e293b">(4, 16)</text>
  <rect x="70" y="270" width="260" height="32" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="200" y="292" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1e293b">(0, 0)</text>

  <text x="200" y="324" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="14" fill="#475569">])</text>
  <text x="200" y="350" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#2563eb">def test_kvadrat(kirish, kutilgan):</text>
  <text x="200" y="374" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#1e293b">assert kirish ** 2 == kutilgan</text>

  <!-- O'ng: 4 alohida test -->
  <text x="595" y="120" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">pytest 4 ta alohida test ishlatadi</text>

  <!-- run rows -->
  <line x1="360" y1="178" x2="440" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#pm-arrow)"/>
  <rect x="450" y="135" width="300" height="40" rx="8" fill="#16a34a" fill-opacity="0.10" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="160" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="14" fill="#16a34a">test_kvadrat[2-4] PASSED</text>

  <line x1="360" y1="214" x2="440" y2="201" stroke="#475569" stroke-width="2" marker-end="url(#pm-arrow)"/>
  <rect x="450" y="185" width="300" height="40" rx="8" fill="#16a34a" fill-opacity="0.10" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="210" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="14" fill="#16a34a">test_kvadrat[3-9] PASSED</text>

  <line x1="360" y1="250" x2="440" y2="251" stroke="#475569" stroke-width="2" marker-end="url(#pm-arrow)"/>
  <rect x="450" y="235" width="300" height="40" rx="8" fill="#16a34a" fill-opacity="0.10" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="260" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="14" fill="#16a34a">test_kvadrat[4-16] PASSED</text>

  <line x1="360" y1="286" x2="440" y2="301" stroke="#475569" stroke-width="2" marker-end="url(#pm-arrow)"/>
  <rect x="450" y="285" width="300" height="40" rx="8" fill="#16a34a" fill-opacity="0.10" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="310" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="14" fill="#16a34a">test_kvadrat[0-0] PASSED</text>

  <!-- izoh -->
  <rect x="120" y="406" width="560" height="50" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="400" y="436" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">10 ta holat = 10 ta test yozish o'rniga bitta jadval yetadi.</text>
</svg>
