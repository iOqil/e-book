<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360">
  <title>list, dict, set va tuple tuzilmalarini taqqoslash jadvali</title>
  <rect x="0" y="0" width="760" height="360" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Tort tuzilma — taqqoslash</text>

  <!-- Header row -->
  <rect x="30" y="55" width="200" height="50" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="230" y="55" width="160" height="50" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="390" y="55" width="160" height="50" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="550" y="55" width="180" height="50" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="130" y="86" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Xususiyat</text>
  <text x="310" y="86" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#2563eb">list [ ]</text>
  <text x="470" y="86" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#16a34a">dict { : }</text>
  <text x="640" y="78" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#f59e0b">set { }</text>
  <text x="640" y="96" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#dc2626">tuple ( )</text>

  <!-- Row 1: ozgaruvchanmi -->
  <rect x="30" y="105" width="200" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="230" y="105" width="160" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="390" y="105" width="160" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="550" y="105" width="90" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="640" y="105" width="90" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <text x="130" y="135" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">O'zgaruvchanmi?</text>
  <text x="310" y="135" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">Ha</text>
  <text x="470" y="135" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">Ha</text>
  <text x="595" y="135" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">Ha</text>
  <text x="685" y="135" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">Yo'q</text>

  <!-- Row 2: tartiblimi -->
  <rect x="30" y="155" width="200" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="230" y="155" width="160" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="390" y="155" width="160" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="550" y="155" width="90" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="640" y="155" width="90" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <text x="130" y="185" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Tartiblimi?</text>
  <text x="310" y="185" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">Ha</text>
  <text x="470" y="185" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">Ha</text>
  <text x="595" y="185" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">Yo'q</text>
  <text x="685" y="185" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">Ha</text>

  <!-- Row 3: takror -->
  <rect x="30" y="205" width="200" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="230" y="205" width="160" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="390" y="205" width="160" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="550" y="205" width="90" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="640" y="205" width="90" height="50" fill="#ffffff" stroke="#94a3b8"/>
  <text x="130" y="235" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Takror mumkinmi?</text>
  <text x="310" y="235" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">Ha</text>
  <text x="470" y="228" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Kalit yo'q,</text>
  <text x="470" y="244" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">qiymat ha</text>
  <text x="595" y="235" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">Yo'q</text>
  <text x="685" y="235" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">Ha</text>

  <!-- Row 4: misol -->
  <rect x="30" y="255" width="200" height="55" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="230" y="255" width="160" height="55" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="390" y="255" width="160" height="55" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="550" y="255" width="180" height="55" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="130" y="288" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Misol</text>
  <text x="310" y="288" text-anchor="middle" font-family="monospace" font-size="13" fill="#1e293b">[1, 2, 3]</text>
  <text x="470" y="288" text-anchor="middle" font-family="monospace" font-size="13" fill="#1e293b">{"a": 1}</text>
  <text x="640" y="280" text-anchor="middle" font-family="monospace" font-size="13" fill="#1e293b">{1, 2, 3}</text>
  <text x="640" y="300" text-anchor="middle" font-family="monospace" font-size="13" fill="#1e293b">(1, 2)</text>

  <text x="380" y="338" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Faqat tuple o'zgarmas; faqat set tartibsiz va takrorsiz.</text>
</svg>
