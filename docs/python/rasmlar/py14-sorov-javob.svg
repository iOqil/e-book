<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380">
  <title>HTTP so'rov/javob aylanishi: klient FastAPI serverga so'rov yuboradi, server JSON javob qaytaradi</title>
  <defs>
    <marker id="arrPy14a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="380" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">So'rov va javob aylanishi</text>
  <text x="380" y="60" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Klient so'rov yuboradi, FastAPI funksiyani ishlatib JSON javob qaytaradi</text>

  <!-- Klient qutisi (chap) -->
  <rect x="40" y="120" width="200" height="130" rx="12" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">Klient</text>
  <text x="140" y="176" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">brauzer / mobil ilova</text>
  <text x="140" y="212" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">so'rovni boshlaydi</text>
  <text x="140" y="232" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">javobni ko'rsatadi</text>

  <!-- FastAPI server qutisi (o'ng) -->
  <rect x="520" y="120" width="200" height="130" rx="12" fill="#16a34a" fill-opacity="0.08" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">FastAPI server</text>
  <text x="620" y="176" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">app = FastAPI()</text>
  <text x="620" y="212" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">mos funksiyani topadi</text>
  <text x="620" y="232" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">va ishlatadi</text>

  <!-- So'rov strelka (chapdan o'ngga) -->
  <line x1="242" y1="160" x2="518" y2="160" stroke="#475569" stroke-width="2.5" marker-end="url(#arrPy14a)"/>
  <text x="380" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">So'rov (request)</text>
  <text x="380" y="178" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">GET /talabalar</text>

  <!-- Javob strelka (o'ngdan chapga) -->
  <line x1="518" y1="210" x2="242" y2="210" stroke="#475569" stroke-width="2.5" marker-end="url(#arrPy14a)"/>
  <text x="380" y="202" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Javob (response)</text>
  <text x="380" y="230" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">JSON: {"xabar": ...}</text>

  <!-- Pastki izoh -->
  <rect x="120" y="290" width="520" height="68" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="316" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Har so'rovda metod bor: GET olish, POST qo'shish,</text>
  <text x="380" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">PUT yangilash, DELETE o'chirish</text>
</svg>
