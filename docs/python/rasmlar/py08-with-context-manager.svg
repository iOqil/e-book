<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>with (context manager): faylni ochib avtomatik yopishi (__enter__ va __exit__)</title>

  <defs>
    <marker id="arrPy08w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Sarlavha -->
  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">with bloki faylni avtomatik yopadi</text>
  <text x="380" y="54" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">blokka kirganda fayl ochiladi (__enter__), chiqqanda yopiladi (__exit__) — xato bo'lsa ham</text>

  <!-- with qatori -->
  <rect x="200" y="74" width="360" height="46" rx="10" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="103" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#2563eb">with open("salom.txt", "w") as f:</text>

  <!-- __enter__ strelka -->
  <line x1="380" y1="120" x2="380" y2="150" stroke="#16a34a" stroke-width="2" marker-end="url(#arrPy08w)"/>
  <text x="396" y="140" text-anchor="start" font-family="Consolas, monospace" font-size="13" fill="#16a34a" font-weight="bold">__enter__()</text>

  <!-- 1-bosqich: ochish -->
  <rect x="170" y="152" width="420" height="50" rx="10" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">1. Fayl OCHILADI, f ga bog'lanadi</text>
  <text x="380" y="192" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">resurs tayyor: endi yozish/o'qish mumkin</text>

  <!-- Strelka blok ichiga -->
  <line x1="380" y1="202" x2="380" y2="226" stroke="#475569" stroke-width="2" marker-end="url(#arrPy08w)"/>

  <!-- 2-bosqich: blok tanasi -->
  <rect x="170" y="228" width="420" height="68" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="252" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">2. Blok tanasi bajariladi</text>
  <text x="380" y="276" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">f.write("Salom, dunyo!")</text>

  <!-- Ayri yo'llar: normal va xato -->
  <line x1="300" y1="296" x2="220" y2="332" stroke="#16a34a" stroke-width="2" marker-end="url(#arrPy08w)"/>
  <text x="210" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" font-weight="bold">normal tugadi</text>

  <line x1="460" y1="296" x2="540" y2="332" stroke="#dc2626" stroke-width="2" marker-end="url(#arrPy08w)"/>
  <text x="556" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626" font-weight="bold">xato chiqdi</text>

  <!-- normal natija qutisi -->
  <rect x="90" y="334" width="260" height="44" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="220" y="361" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">blok oxiriga yetdi</text>

  <!-- xato natija qutisi -->
  <rect x="410" y="334" width="260" height="44" rx="10" fill="#dc2626" fill-opacity="0.10" stroke="#dc2626" stroke-width="1.5"/>
  <text x="540" y="361" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">exception ko'tarildi</text>

  <!-- Ikkala yo'l __exit__ ga -->
  <line x1="220" y1="378" x2="320" y2="404" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrPy08w)"/>
  <line x1="540" y1="378" x2="440" y2="404" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrPy08w)"/>

  <!-- 3-bosqich: __exit__ — yopish -->
  <rect x="200" y="406" width="360" height="54" rx="10" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="380" y="428" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#b45309">3. __exit__()  =&gt;  f.close()</text>
  <text x="380" y="449" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">fayl HAR IKKI holatda ham avtomatik yopiladi</text>
</svg>
