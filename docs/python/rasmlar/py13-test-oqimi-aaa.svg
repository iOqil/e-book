<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470">
  <title>Test oqimi: Arrange (tayyorla) - Act (ishlat) - Assert (tekshir); pytest yashil PASSED yoki qizil FAILED chiqaradi</title>
  <defs>
    <marker id="aaa-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="470" fill="#f8fafc"/>
  <text x="400" y="38" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">Bitta testning oqimi: Arrange -&gt; Act -&gt; Assert</text>
  <text x="400" y="62" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">tayyorla, funksiyani ishlat, natijani assert bilan tekshir</text>

  <!-- 1. Arrange -->
  <rect x="40" y="100" width="220" height="120" rx="12" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="2.5"/>
  <text x="150" y="130" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">1. Arrange (tayyorla)</text>
  <text x="150" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">kirish ma'lumotini</text>
  <text x="150" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">tayyorlaysan</text>
  <text x="150" y="204" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1e293b">a, b = 2, 3</text>

  <!-- arrow 1->2 -->
  <line x1="260" y1="160" x2="295" y2="160" stroke="#475569" stroke-width="2.5" marker-end="url(#aaa-arrow)"/>

  <!-- 2. Act -->
  <rect x="300" y="100" width="220" height="120" rx="12" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="410" y="130" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#b45309">2. Act (ishlat)</text>
  <text x="410" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">tekshiriladigan</text>
  <text x="410" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">funksiyani chaqirasan</text>
  <text x="410" y="204" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1e293b">n = qosh(a, b)</text>

  <!-- arrow 2->3 -->
  <line x1="520" y1="160" x2="555" y2="160" stroke="#475569" stroke-width="2.5" marker-end="url(#aaa-arrow)"/>

  <!-- 3. Assert -->
  <rect x="560" y="100" width="220" height="120" rx="12" fill="#16a34a" fill-opacity="0.10" stroke="#16a34a" stroke-width="2.5"/>
  <text x="670" y="130" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">3. Assert (tekshir)</text>
  <text x="670" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">natija kutilganga</text>
  <text x="670" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">teng ekanini tekshir</text>
  <text x="670" y="204" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1e293b">assert n == 5</text>

  <!-- assert ayri yo'l -->
  <line x1="670" y1="220" x2="670" y2="252" stroke="#475569" stroke-width="2.5"/>
  <line x1="300" y1="252" x2="670" y2="252" stroke="#475569" stroke-width="2.5"/>
  <line x1="300" y1="252" x2="300" y2="278" stroke="#16a34a" stroke-width="2.5" marker-end="url(#aaa-arrow)"/>
  <line x1="540" y1="252" x2="540" y2="278" stroke="#dc2626" stroke-width="2.5" marker-end="url(#aaa-arrow)"/>

  <text x="220" y="270" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">shart True</text>
  <text x="620" y="270" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">shart False</text>

  <!-- PASSED -->
  <rect x="180" y="280" width="240" height="56" rx="10" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="2.5"/>
  <text x="300" y="306" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="bold" fill="#16a34a">PASSED (yashil)</text>
  <text x="300" y="326" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">test o'tdi, kod to'g'ri</text>

  <!-- FAILED -->
  <rect x="440" y="280" width="240" height="56" rx="10" fill="#dc2626" fill-opacity="0.10" stroke="#dc2626" stroke-width="2.5"/>
  <text x="560" y="306" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="16" font-weight="bold" fill="#dc2626">FAILED (qizil)</text>
  <text x="560" y="326" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">pytest sababni ko'rsatadi</text>

  <!-- pytest izoh -->
  <rect x="120" y="370" width="560" height="74" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="400" y="398" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">pytest test_ funksiyalarini o'zi topib ishga tushiradi</text>
  <text x="400" y="424" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">assert False bo'lsa: kutilgan va chiqqan qiymatni ko'rsatadi (4 == 5)</text>
</svg>
