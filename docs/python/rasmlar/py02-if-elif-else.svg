<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560">
  <title>if / elif / else qaror oqimi: shartlar yuqoridan pastga tekshiriladi, birinchi True topilganda to'xtaydi</title>
  <defs>
    <marker id="ie-arrow" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="560" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">if / elif / else - qaror oqimi</text>
  <text x="380" y="62" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">birinchi True shartda to'xtaydi, qolganlariga qaramaydi</text>

  <!-- if shart -->
  <polygon points="280,90 480,90 510,130 480,170 280,170 250,130" fill="#e2e8f0" stroke="#2563eb" stroke-width="2.5"/>
  <text x="380" y="125" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="15" fill="#1e293b">if ball &gt;= 90 ?</text>
  <text x="380" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">shart tekshiriladi</text>

  <!-- if True -> A'lo -->
  <line x1="510" y1="130" x2="600" y2="130" stroke="#475569" stroke-width="2.5" marker-end="url(#ie-arrow)"/>
  <text x="555" y="120" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">True</text>
  <rect x="600" y="106" width="130" height="48" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/>
  <text x="665" y="136" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="15" fill="#16a34a">"A'lo"</text>

  <!-- if False down -->
  <line x1="380" y1="170" x2="380" y2="210" stroke="#475569" stroke-width="2.5" marker-end="url(#ie-arrow)"/>
  <text x="398" y="195" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">False</text>

  <!-- elif shart 1 -->
  <polygon points="280,210 480,210 510,250 480,290 280,290 250,250" fill="#e2e8f0" stroke="#2563eb" stroke-width="2.5"/>
  <text x="380" y="245" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="15" fill="#1e293b">elif ball &gt;= 70 ?</text>
  <text x="380" y="268" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">keyingisini tekshir</text>

  <line x1="510" y1="250" x2="600" y2="250" stroke="#475569" stroke-width="2.5" marker-end="url(#ie-arrow)"/>
  <text x="555" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">True</text>
  <rect x="600" y="226" width="130" height="48" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/>
  <text x="665" y="256" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="15" fill="#16a34a">"Yaxshi"</text>

  <line x1="380" y1="290" x2="380" y2="330" stroke="#475569" stroke-width="2.5" marker-end="url(#ie-arrow)"/>
  <text x="398" y="315" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">False</text>

  <!-- elif shart 2 -->
  <polygon points="280,330 480,330 510,370 480,410 280,410 250,370" fill="#e2e8f0" stroke="#2563eb" stroke-width="2.5"/>
  <text x="380" y="365" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="15" fill="#1e293b">elif ball &gt;= 60 ?</text>
  <text x="380" y="388" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yana tekshir</text>

  <line x1="510" y1="370" x2="600" y2="370" stroke="#475569" stroke-width="2.5" marker-end="url(#ie-arrow)"/>
  <text x="555" y="360" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">True</text>
  <rect x="600" y="346" width="130" height="48" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/>
  <text x="665" y="376" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="14" fill="#16a34a">"Qoniqarli"</text>

  <line x1="380" y1="410" x2="380" y2="450" stroke="#475569" stroke-width="2.5" marker-end="url(#ie-arrow)"/>
  <text x="398" y="435" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">False (hech biri)</text>

  <!-- else -->
  <rect x="280" y="450" width="200" height="56" rx="10" fill="#e2e8f0" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="380" y="476" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="15" fill="#1e293b">else</text>
  <text x="380" y="497" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="14" fill="#f59e0b">"Qoniqarsiz"</text>

  <text x="380" y="540" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Bitta shoxgina bajariladi; tartib muhim - yuqoridan pastga.</text>
</svg>
