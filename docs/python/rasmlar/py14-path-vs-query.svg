<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
  <title>Path parametr manzil ichida, query parametr esa ? dan keyin kalit=qiymat ko'rinishida bo'ladi</title>
  <defs>
    <marker id="arrPy14b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">Path parametr va Query parametr</text>
  <text x="380" y="60" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Bir manzilda ikkala turdagi qiymat ham bo'lishi mumkin</text>

  <!-- URL chizig'i -->
  <rect x="60" y="92" width="640" height="50" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="80" y="124" font-family="Consolas, monospace" font-size="18" fill="#1e293b">/talaba/</text>
  <text x="178" y="124" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#2563eb">5</text>
  <text x="196" y="124" font-family="Consolas, monospace" font-size="18" fill="#1e293b">/kurslar</text>
  <text x="308" y="124" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#f59e0b">?</text>
  <text x="322" y="124" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#f59e0b">limit=10&amp;tur=faol</text>

  <!-- Path strelka -->
  <line x1="182" y1="150" x2="182" y2="196" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrPy14b)"/>
  <!-- Query strelka -->
  <line x1="430" y1="150" x2="430" y2="196" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrPy14b)"/>

  <!-- Path quti (chap) -->
  <rect x="40" y="204" width="330" height="180" rx="12" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb" stroke-width="2"/>
  <text x="205" y="232" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">Path parametr</text>
  <text x="205" y="256" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">manzilning bir qismi ({} ichida)</text>
  <text x="60" y="290" font-family="Consolas, monospace" font-size="13" fill="#1e293b">@app.get("/talaba/{id}")</text>
  <text x="60" y="312" font-family="Consolas, monospace" font-size="13" fill="#1e293b">def f(id: int):</text>
  <text x="205" y="346" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">odatda MAJBURIY — qaysi</text>
  <text x="205" y="366" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">resurs kerakligini ko'rsatadi</text>

  <!-- Query quti (o'ng) -->
  <rect x="390" y="204" width="330" height="180" rx="12" fill="#f59e0b" fill-opacity="0.10" stroke="#f59e0b" stroke-width="2"/>
  <text x="555" y="232" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#f59e0b">Query parametr</text>
  <text x="555" y="256" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">? dan keyin kalit=qiymat</text>
  <text x="410" y="290" font-family="Consolas, monospace" font-size="13" fill="#1e293b">@app.get("/qidiruv")</text>
  <text x="410" y="312" font-family="Consolas, monospace" font-size="13" fill="#1e293b">def f(q: str, limit: int = 10):</text>
  <text x="555" y="346" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">standart qiymatli bo'lsa —</text>
  <text x="555" y="366" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">IXTIYORIY (filtrlash uchun)</text>
</svg>
