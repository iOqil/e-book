<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 480" width="740" height="480">
  <title>Closure: ichki funksiya tashqi funksiyaning o'zgaruvchisini eslab qoladi</title>
  <rect x="0" y="0" width="740" height="480" fill="#f8fafc"/>

  <text x="370" y="30" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#1e293b">Closure (yopilma)</text>
  <text x="370" y="52" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Ichki funksiya tashqi 'n' ni eslab qoladi — tashqi funksiya tugagandan keyin ham.</text>

  <!-- outer function call -->
  <rect x="30" y="72" width="320" height="150" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="190" y="96" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#2563eb">kopaytiruvchi(n)</text>
  <text x="190" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tashqi funksiya (chaqirilganda)</text>

  <!-- captured var -->
  <rect x="55" y="130" width="120" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="115" y="155" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e293b">n = 2</text>

  <!-- inner func def -->
  <rect x="195" y="125" width="135" height="80" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="262" y="147" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#2563eb">kopaytir(x)</text>
  <text x="262" y="168" text-anchor="middle" font-family="monospace" font-size="13" fill="#1e293b">return x * n</text>
  <text x="262" y="192" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ichki funksiya</text>

  <!-- remember arrow from inner to captured n -->
  <defs>
    <marker id="arrC" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <line x1="195" y1="160" x2="178" y2="152" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrC)"/>
  <text x="262" y="218" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#f59e0b">eslab qoladi →</text>

  <!-- return arrow -->
  <line x1="350" y1="160" x2="430" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrC)"/>
  <text x="390" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">return</text>
  <text x="390" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">funksiyani qaytaradi</text>

  <!-- ikki closure -->
  <rect x="440" y="120" width="270" height="100" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="575" y="144" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#16a34a">ikki = kopaytiruvchi(2)</text>
  <text x="575" y="166" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">closure: funksiya + esda qolgan</text>
  <rect x="520" y="178" width="110" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="575" y="200" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e293b">n = 2</text>

  <!-- second call uch -->
  <rect x="440" y="240" width="270" height="100" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="575" y="264" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#16a34a">uch = kopaytiruvchi(3)</text>
  <text x="575" y="286" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">alohida closure, alohida 'n'</text>
  <rect x="520" y="298" width="110" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="575" y="320" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e293b">n = 3</text>

  <!-- usage / results -->
  <rect x="30" y="365" width="680" height="95" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="370" y="390" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Chaqirilganda har biri o'z 'n' ini ishlatadi:</text>
  <text x="190" y="423" text-anchor="middle" font-family="monospace" font-size="15" fill="#1e293b">ikki(10) → 10 * 2 = 20</text>
  <text x="550" y="423" text-anchor="middle" font-family="monospace" font-size="15" fill="#1e293b">uch(10) → 10 * 3 = 30</text>
  <text x="370" y="448" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">LEGB: ichki funksiya 'n' ni Enclosing (tashqi) sohadan topadi.</text>
</svg>
