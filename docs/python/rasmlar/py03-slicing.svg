<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">
  <title>Slicing [start:stop:step] — ro'yxatdan qism olish</title>
  <rect x="0" y="0" width="720" height="400" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Slicing — [start : stop : step]</text>
  <text x="360" y="58" text-anchor="middle" font-family="monospace" font-size="15" fill="#475569">sonlar = [0, 1, 2, 3, 4, 5]</text>

  <!-- Cells -->
  <g font-family="monospace">
    <rect x="60" y="80" width="100" height="55" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="160" y="80" width="100" height="55" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="260" y="80" width="100" height="55" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="360" y="80" width="100" height="55" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="460" y="80" width="100" height="55" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="560" y="80" width="100" height="55" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="110" y="115" text-anchor="middle" font-size="18" fill="#1e293b">0</text>
    <text x="210" y="115" text-anchor="middle" font-size="18" fill="#2563eb">1</text>
    <text x="310" y="115" text-anchor="middle" font-size="18" fill="#2563eb">2</text>
    <text x="410" y="115" text-anchor="middle" font-size="18" fill="#2563eb">3</text>
    <text x="510" y="115" text-anchor="middle" font-size="18" fill="#1e293b">4</text>
    <text x="610" y="115" text-anchor="middle" font-size="18" fill="#1e293b">5</text>
    <!-- index numbers -->
    <text x="110" y="72" text-anchor="middle" font-size="14" fill="#475569">0</text>
    <text x="210" y="72" text-anchor="middle" font-size="14" fill="#475569">1</text>
    <text x="310" y="72" text-anchor="middle" font-size="14" fill="#475569">2</text>
    <text x="410" y="72" text-anchor="middle" font-size="14" fill="#475569">3</text>
    <text x="510" y="72" text-anchor="middle" font-size="14" fill="#475569">4</text>
    <text x="610" y="72" text-anchor="middle" font-size="14" fill="#475569">5</text>
  </g>

  <!-- start / stop markers -->
  <text x="160" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">start=1</text>
  <text x="160" y="177" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">(kiradi)</text>
  <text x="460" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">stop=4</text>
  <text x="460" y="177" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">(KIRMAYDI)</text>

  <!-- Result of [1:4] -->
  <text x="360" y="205" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#2563eb">sonlar[1:4]  →  [1, 2, 3]</text>

  <!-- step examples -->
  <line x1="40" y1="225" x2="680" y2="225" stroke="#cbd5e1" stroke-width="1"/>

  <rect x="40" y="240" width="200" height="60" fill="#ffffff" stroke="#94a3b8"/>
  <text x="140" y="265" text-anchor="middle" font-family="monospace" font-size="15" fill="#1e293b">[:3] → [0, 1, 2]</text>
  <text x="140" y="288" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">start bo'sh = boshidan</text>

  <rect x="260" y="240" width="200" height="60" fill="#ffffff" stroke="#94a3b8"/>
  <text x="360" y="265" text-anchor="middle" font-family="monospace" font-size="15" fill="#1e293b">[3:] → [3, 4, 5]</text>
  <text x="360" y="288" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">stop bo'sh = oxirigacha</text>

  <rect x="480" y="240" width="200" height="60" fill="#ffffff" stroke="#94a3b8"/>
  <text x="580" y="265" text-anchor="middle" font-family="monospace" font-size="15" fill="#f59e0b">[::2] → [0, 2, 4]</text>
  <text x="580" y="288" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">step=2, har 2-element</text>

  <!-- negative -->
  <rect x="40" y="315" width="640" height="45" fill="#fef2f2" stroke="#dc2626"/>
  <text x="360" y="343" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Manfiy: sonlar[-2:] → [4, 5]  (oxirgi 2 ta).  Slicing YANGI ro'yxat qaytaradi.</text>
</svg>
