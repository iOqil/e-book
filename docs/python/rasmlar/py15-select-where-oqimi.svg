<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>SELECT ... FROM ... WHERE so'rov oqimi: baza qaysi jadvaldan, qaysi shartga mos qatorlarni qaytaradi</title>

  <defs>
    <marker id="arrPy15s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>

  <!-- Sarlavha -->
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">SQL so'rov oqimi: SELECT ... FROM ... WHERE</text>
  <text x="380" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">So'rov uch qismdan iborat; baza shartga mos qatorlarni qaytaradi</text>

  <!-- So'rov satri (3 qismli) -->
  <g font-family="Consolas, monospace" font-size="14">
    <!-- SELECT -->
    <rect x="40" y="84" width="180" height="58" rx="8" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="2"/>
    <text x="130" y="110" text-anchor="middle" font-weight="bold" fill="#2563eb">SELECT *</text>
    <text x="130" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">qaysi ustunlar</text>

    <!-- FROM -->
    <rect x="250" y="84" width="200" height="58" rx="8" fill="#16a34a" fill-opacity="0.10" stroke="#16a34a" stroke-width="2"/>
    <text x="350" y="110" text-anchor="middle" font-weight="bold" fill="#16a34a">FROM talabalar</text>
    <text x="350" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">qaysi jadval</text>

    <!-- WHERE -->
    <rect x="480" y="84" width="240" height="58" rx="8" fill="#f59e0b" fill-opacity="0.16" stroke="#f59e0b" stroke-width="2"/>
    <text x="600" y="110" text-anchor="middle" font-weight="bold" fill="#b45309">WHERE yosh &gt; 20</text>
    <text x="600" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">qaysi qatorlar (shart)</text>
  </g>

  <!-- Strelka pastga -->
  <line x1="380" y1="178" x2="380" y2="210" stroke="#475569" stroke-width="2.5" marker-end="url(#arrPy15s)"/>
  <text x="400" y="200" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">baza filtrlaydi</text>

  <!-- To'liq jadval (chap) -->
  <text x="180" y="234" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Butun jadval</text>
  <g font-family="Consolas, monospace" font-size="13">
    <rect x="60" y="244" width="240" height="34" fill="#2563eb"/><text x="180" y="266" text-anchor="middle" font-weight="bold" fill="#ffffff">id | ism | yosh | ball</text>
    <rect x="60" y="278" width="240" height="34" fill="#ffffff" stroke="#94a3b8"/><text x="180" y="300" text-anchor="middle" fill="#475569">1 | Aziz | 20 | 85</text>
    <rect x="60" y="312" width="240" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="180" y="334" text-anchor="middle" fill="#16a34a">2 | Malika | 22 | 90</text>
    <rect x="60" y="346" width="240" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="180" y="368" text-anchor="middle" fill="#16a34a">3 | Bobur | 21 | 78</text>
  </g>
  <text x="180" y="400" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yosh &gt; 20 shartiga mos = yashil</text>

  <!-- Strelka o'ngga -->
  <line x1="310" y1="330" x2="430" y2="330" stroke="#475569" stroke-width="2.5" marker-end="url(#arrPy15s)"/>
  <text x="370" y="322" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">WHERE</text>

  <!-- Natija (o'ng) -->
  <text x="580" y="234" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Natija (fetchall)</text>
  <g font-family="Consolas, monospace" font-size="13">
    <rect x="460" y="278" width="240" height="34" fill="#2563eb"/><text x="580" y="300" text-anchor="middle" font-weight="bold" fill="#ffffff">id | ism | yosh | ball</text>
    <rect x="460" y="312" width="240" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="580" y="334" text-anchor="middle" fill="#16a34a">2 | Malika | 22 | 90</text>
    <rect x="460" y="346" width="240" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="580" y="368" text-anchor="middle" fill="#16a34a">3 | Bobur | 21 | 78</text>
  </g>
  <text x="580" y="400" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">faqat shartga mos qatorlar</text>

  <!-- Pastki izoh -->
  <rect x="120" y="420" width="520" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="445" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">ORDER BY tartiblaydi, DESC/ASC = kamayish/o'sish tartibi</text>
</svg>
