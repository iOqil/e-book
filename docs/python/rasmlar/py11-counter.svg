<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
  <title>Counter — ro'yxatdagi har element nechta marta uchraganini sanaydi</title>
  <defs>
    <marker id="c-arrow" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">Counter — elementlarni sanash</text>
  <text x="380" y="60" text-anchor="middle" font-family="monospace" font-size="14" fill="#475569">Counter(["ha", "yo'q", "ha", "ha", "yo'q"])</text>

  <!-- Kirish ro'yxati -->
  <text x="120" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">Kirish ro'yxati</text>

  <rect x="50" y="120" width="80" height="42" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="90" y="147" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e293b">"ha"</text>
  <rect x="50" y="170" width="80" height="42" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="90" y="197" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e293b">"yo'q"</text>
  <rect x="50" y="220" width="80" height="42" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="90" y="247" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e293b">"ha"</text>
  <rect x="50" y="270" width="80" height="42" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="90" y="297" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e293b">"ha"</text>
  <rect x="50" y="320" width="80" height="42" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="90" y="347" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e293b">"yo'q"</text>

  <!-- Strelka: sanaydi -->
  <line x1="150" y1="241" x2="290" y2="241" stroke="#475569" stroke-width="2.5" marker-end="url(#c-arrow)"/>
  <text x="220" y="228" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">sanaydi</text>
  <text x="220" y="262" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">har xil qiymatni</text>

  <!-- Natija: chastota lug'ati -->
  <text x="500" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">Natija (chastota)</text>

  <rect x="310" y="120" width="380" height="120" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="340" y="158" font-family="monospace" font-size="15" fill="#1e293b">"ha"</text>
  <text x="460" y="158" font-family="monospace" font-size="15" fill="#2563eb">3</text>
  <rect x="490" y="146" width="160" height="16" rx="3" fill="#2563eb"/>
  <text x="340" y="200" font-family="monospace" font-size="15" fill="#1e293b">"yo'q"</text>
  <text x="460" y="200" font-family="monospace" font-size="15" fill="#f59e0b">2</text>
  <rect x="490" y="188" width="107" height="16" rx="3" fill="#f59e0b"/>

  <!-- most_common -->
  <rect x="310" y="262" width="380" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="500" y="290" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e293b">most_common(1) -> [('ha', 3)]</text>

  <!-- Izoh -->
  <rect x="50" y="362" width="640" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="370" y="390" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Counter — bu dict: kalit = element, qiymat = nechta marta uchragani.</text>
</svg>
