<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380">
  <title>filter shartga mos elementlarni tanlaydi: [1..6] dan juftlar [2,4,6] o'tadi, toqlar tushib qoladi</title>
  <defs>
    <marker id="flt-arrow" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="flt-drop" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="380" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">filter — shartga mos elementlarni tanlash</text>
  <text x="380" y="62" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="15" fill="#475569">list(filter(lambda x: x % 2 == 0, sonlar))</text>

  <!-- Kirish ro'yxati -->
  <text x="90" y="98" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">Kirish: sonlar</text>
  <rect x="60" y="110" width="60" height="230" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="90" y="142" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="16" fill="#1e293b">1</text>
  <text x="90" y="180" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="16" fill="#1e293b">2</text>
  <text x="90" y="218" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="16" fill="#1e293b">3</text>
  <text x="90" y="256" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="16" fill="#1e293b">4</text>
  <text x="90" y="294" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="16" fill="#1e293b">5</text>
  <text x="90" y="332" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="16" fill="#1e293b">6</text>

  <!-- Shart darvozasi -->
  <rect x="300" y="150" width="160" height="80" rx="12" fill="#f59e0b"/>
  <text x="380" y="184" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="15" fill="#1e293b">x % 2 == 0 ?</text>
  <text x="380" y="208" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">shart darvozasi</text>

  <!-- True -> o'tadi -->
  <text x="610" y="98" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">True: o'tadi</text>
  <line x1="120" y1="175" x2="298" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#flt-arrow)"/>
  <line x1="460" y1="180" x2="600" y2="142" stroke="#16a34a" stroke-width="2" marker-end="url(#flt-arrow)"/>
  <rect x="600" y="120" width="70" height="40" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/>
  <text x="635" y="146" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="16" fill="#16a34a">2</text>
  <rect x="600" y="168" width="70" height="40" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/>
  <text x="635" y="194" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="16" fill="#16a34a">4</text>
  <rect x="600" y="216" width="70" height="40" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/>
  <text x="635" y="242" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="16" fill="#16a34a">6</text>

  <!-- False -> tushib qoladi -->
  <text x="300" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">False: tushib qoladi</text>
  <line x1="380" y1="230" x2="380" y2="310" stroke="#dc2626" stroke-width="2" marker-end="url(#flt-drop)"/>
  <text x="395" y="338" font-family="Consolas, Courier New, monospace" font-size="15" fill="#dc2626">1, 3, 5 — toq, qoldirilmaydi</text>

  <text x="380" y="368" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">map'dan farqi: filter elementni o'zgartirmaydi, faqat tanlaydi (soni kamayishi mumkin).</text>
</svg>
