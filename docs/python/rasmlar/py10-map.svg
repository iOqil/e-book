<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360">
  <title>map har bir elementga funksiyani qo'llaydi: [1,2,3,4] dan kvadratlar [1,4,9,16]</title>
  <defs>
    <marker id="map-arrow" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="360" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">map — har elementga funksiya qo'llash</text>
  <text x="380" y="62" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="15" fill="#475569">list(map(lambda x: x ** 2, sonlar))</text>

  <!-- Kirish ro'yxati sarlavhasi -->
  <text x="90" y="100" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">Kirish: sonlar</text>
  <!-- Chiqish ro'yxati sarlavhasi -->
  <text x="560" y="100" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">Chiqish: kvadratlar</text>

  <!-- 1 -> 1 -->
  <rect x="60" y="118" width="70" height="42" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="95" y="145" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="16" fill="#1e293b">1</text>
  <line x1="135" y1="139" x2="320" y2="139" stroke="#475569" stroke-width="2" marker-end="url(#map-arrow)"/>
  <rect x="600" y="118" width="80" height="42" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/>
  <text x="640" y="145" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="16" fill="#16a34a">1</text>

  <!-- 2 -> 4 -->
  <rect x="60" y="168" width="70" height="42" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="95" y="195" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="16" fill="#1e293b">2</text>
  <line x1="135" y1="189" x2="320" y2="189" stroke="#475569" stroke-width="2" marker-end="url(#map-arrow)"/>
  <rect x="600" y="168" width="80" height="42" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/>
  <text x="640" y="195" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="16" fill="#16a34a">4</text>

  <!-- 3 -> 9 -->
  <rect x="60" y="218" width="70" height="42" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="95" y="245" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="16" fill="#1e293b">3</text>
  <line x1="135" y1="239" x2="320" y2="239" stroke="#475569" stroke-width="2" marker-end="url(#map-arrow)"/>
  <rect x="600" y="218" width="80" height="42" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/>
  <text x="640" y="245" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="16" fill="#16a34a">9</text>

  <!-- 4 -> 16 -->
  <rect x="60" y="268" width="70" height="42" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="95" y="295" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="16" fill="#1e293b">4</text>
  <line x1="135" y1="289" x2="320" y2="289" stroke="#475569" stroke-width="2" marker-end="url(#map-arrow)"/>
  <rect x="600" y="268" width="80" height="42" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/>
  <text x="640" y="295" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="16" fill="#16a34a">16</text>

  <!-- Markazdagi funksiya qutisi -->
  <rect x="325" y="178" width="190" height="62" rx="12" fill="#2563eb"/>
  <text x="420" y="204" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="16" fill="#f8fafc">x =&gt; x ** 2</text>
  <text x="420" y="226" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#e2e8f0">har elementga bir xil</text>

  <text x="380" y="344" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Element soni o'zgarmaydi: 4 ta kirsa, 4 ta chiqadi.</text>
</svg>
