<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
  <title>Bitta klassdan (qolip) ko'p obyekt yasash</title>
  <defs>
    <marker id="ok" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>

  <!-- Klass (qolip) -->
  <rect x="40" y="120" width="220" height="160" rx="10" fill="#e2e8f0" stroke="#2563eb" stroke-width="2.5"/>
  <text x="150" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#2563eb">KLASS — qolip</text>
  <text x="150" y="178" text-anchor="middle" font-family="monospace" font-size="15" fill="#1e293b">class Talaba:</text>
  <text x="150" y="204" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e293b">def __init__(self,</text>
  <text x="150" y="224" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e293b">        ism, yosh):</text>
  <text x="150" y="252" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">qiymat saqlamaydi —</text>
  <text x="150" y="270" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">faqat chizma</text>

  <!-- Strelka: Talaba() chaqiruvi -->
  <text x="395" y="60" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">Talaba("Aziz", 20)</text>
  <text x="395" y="360" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a34a">Talaba("Malika", 22)</text>

  <line x1="262" y1="160" x2="470" y2="90" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/>
  <line x1="262" y1="240" x2="470" y2="330" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/>
  <text x="345" y="120" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">yasaydi →</text>
  <text x="345" y="300" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">yasaydi →</text>

  <!-- Obyekt 1: t1 -->
  <rect x="480" y="50" width="240" height="110" rx="10" fill="#f8fafc" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="600" y="76" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#f59e0b">OBYEKT — t1</text>
  <text x="600" y="104" text-anchor="middle" font-family="monospace" font-size="15" fill="#1e293b">self.ism  = "Aziz"</text>
  <text x="600" y="130" text-anchor="middle" font-family="monospace" font-size="15" fill="#1e293b">self.yosh = 20</text>

  <!-- Obyekt 2: t2 -->
  <rect x="480" y="290" width="240" height="110" rx="10" fill="#f8fafc" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="600" y="316" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#f59e0b">OBYEKT — t2</text>
  <text x="600" y="344" text-anchor="middle" font-family="monospace" font-size="15" fill="#1e293b">self.ism  = "Malika"</text>
  <text x="600" y="370" text-anchor="middle" font-family="monospace" font-size="15" fill="#1e293b">self.yosh = 22</text>

  <!-- Pastki izoh -->
  <text x="380" y="408" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Bitta klassdan ko'p obyekt — har biri o'z atributlariga ega (t1.ism va t2.ism boshqa-boshqa)</text>
</svg>
