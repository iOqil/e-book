<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430">
  <title>Paket strukturasi: papka __init__.py fayli orqali paketga aylanadi va ichidagi modullar nuqta bilan import qilinadi</title>
  <defs>
    <marker id="py06p-strelka" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>

  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Modul, paket va __init__.py</text>

  <!-- Daraxt: chap tomon -->
  <text x="60" y="76" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#475569">Papka tuzilishi</text>

  <!-- loyiha papkasi -->
  <rect x="60" y="90" width="300" height="36" rx="8" fill="#f59e0b"/>
  <text x="80" y="113" text-anchor="start" font-family="monospace" font-size="15" font-weight="bold" fill="#1e293b">loyiha/</text>

  <!-- main.py -->
  <rect x="92" y="134" width="268" height="32" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="110" y="155" text-anchor="start" font-family="monospace" font-size="14" fill="#1e293b">main.py</text>
  <text x="190" y="155" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(modul)</text>

  <!-- paket papkasi -->
  <rect x="92" y="174" width="268" height="34" rx="8" fill="#2563eb"/>
  <text x="110" y="196" text-anchor="start" font-family="monospace" font-size="14" font-weight="bold" fill="#f8fafc">hisoblar/</text>
  <text x="210" y="196" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#f8fafc">(paket)</text>

  <!-- __init__.py -->
  <rect x="124" y="216" width="236" height="32" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="142" y="237" text-anchor="start" font-family="monospace" font-size="14" fill="#1e293b">__init__.py</text>

  <!-- geometriya.py -->
  <rect x="124" y="256" width="236" height="32" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="142" y="277" text-anchor="start" font-family="monospace" font-size="14" fill="#1e293b">geometriya.py</text>

  <!-- statistika.py -->
  <rect x="124" y="296" width="236" height="32" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="142" y="317" text-anchor="start" font-family="monospace" font-size="14" fill="#1e293b">statistika.py</text>

  <!-- daraxt chiziqlari -->
  <line x1="76" y1="126" x2="76" y2="318" stroke="#94a3b8" stroke-width="2"/>
  <line x1="76" y1="150" x2="92" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <line x1="76" y1="191" x2="92" y2="191" stroke="#94a3b8" stroke-width="2"/>
  <line x1="108" y1="191" x2="108" y2="312" stroke="#94a3b8" stroke-width="2"/>
  <line x1="108" y1="232" x2="124" y2="232" stroke="#94a3b8" stroke-width="2"/>
  <line x1="108" y1="272" x2="124" y2="272" stroke="#94a3b8" stroke-width="2"/>
  <line x1="108" y1="312" x2="124" y2="312" stroke="#94a3b8" stroke-width="2"/>

  <!-- O'ng tomon: izohlar -->
  <text x="430" y="76" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#475569">Ma'nosi</text>

  <rect x="430" y="90" width="280" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="446" y="112" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b">Paket = papka</text>
  <text x="446" y="133" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">bog'liq modullarni bitta papkaga</text>
  <text x="446" y="148" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">guruhlaydi</text>

  <rect x="430" y="160" width="280" height="60" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5"/>
  <text x="446" y="182" text-anchor="start" font-family="monospace" font-size="14" font-weight="bold" fill="#16a34a">__init__.py</text>
  <text x="446" y="203" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">papkani paketga aylantiradi</text>
  <text x="446" y="218" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">(bo'sh ham bo'lishi mumkin)</text>

  <rect x="430" y="230" width="280" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="446" y="252" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">Modul = .py fayl</text>
  <text x="446" y="273" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">funksiya va klasslarni saqlaydi</text>

  <!-- pastki: import sintaksisi -->
  <rect x="60" y="350" width="650" height="62" rx="10" fill="#1e293b"/>
  <text x="80" y="374" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b">Nuqta bilan ichkariga kirasan:</text>
  <text x="80" y="398" text-anchor="start" font-family="monospace" font-size="15" fill="#f8fafc">from hisoblar.geometriya import doira_yuza</text>
  <text x="560" y="398" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">paket.modul</text>
</svg>
