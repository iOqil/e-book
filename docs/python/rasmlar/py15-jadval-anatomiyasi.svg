<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430">
  <title>Jadval anatomiyasi: ustun (maydon), qator (yozuv) va birlamchi kalit (PRIMARY KEY id)</title>

  <defs>
    <marker id="arrPy15a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>

  <!-- Sarlavha -->
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">talabalar jadvali tuzilishi</text>
  <text x="380" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Jadval = ustunlar (maydonlar) + qatorlar (yozuvlar)</text>

  <!-- Jadval (markazda) -->
  <!-- Sarlavha qatori (ustun nomlari) -->
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="14">
    <rect x="200" y="100" width="90" height="40" fill="#2563eb" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="290" y="100" width="120" height="40" fill="#2563eb" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="410" y="100" width="90" height="40" fill="#2563eb" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="500" y="100" width="90" height="40" fill="#2563eb" stroke="#1e293b" stroke-width="1.5"/>
    <text x="245" y="125" text-anchor="middle" font-weight="bold" fill="#ffffff">id</text>
    <text x="350" y="125" text-anchor="middle" font-weight="bold" fill="#ffffff">ism</text>
    <text x="455" y="125" text-anchor="middle" font-weight="bold" fill="#ffffff">yosh</text>
    <text x="545" y="125" text-anchor="middle" font-weight="bold" fill="#ffffff">ball</text>
  </g>

  <!-- 1-qator -->
  <g font-family="Consolas, monospace" font-size="14">
    <rect x="200" y="140" width="90" height="40" fill="#fef3c7" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="290" y="140" width="120" height="40" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="410" y="140" width="90" height="40" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="500" y="140" width="90" height="40" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="245" y="165" text-anchor="middle" font-weight="bold" fill="#b45309">1</text>
    <text x="350" y="165" text-anchor="middle" fill="#1e293b">Aziz</text>
    <text x="455" y="165" text-anchor="middle" fill="#1e293b">20</text>
    <text x="545" y="165" text-anchor="middle" fill="#1e293b">85</text>
  </g>

  <!-- 2-qator -->
  <g font-family="Consolas, monospace" font-size="14">
    <rect x="200" y="180" width="90" height="40" fill="#fef3c7" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="290" y="180" width="120" height="40" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="410" y="180" width="90" height="40" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="500" y="180" width="90" height="40" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="245" y="205" text-anchor="middle" font-weight="bold" fill="#b45309">2</text>
    <text x="350" y="205" text-anchor="middle" fill="#1e293b">Malika</text>
    <text x="455" y="205" text-anchor="middle" fill="#1e293b">22</text>
    <text x="545" y="205" text-anchor="middle" fill="#1e293b">90</text>
  </g>

  <!-- USTUN belgisi (yuqoridan) -->
  <line x1="455" y1="92" x2="455" y2="78" stroke="#16a34a" stroke-width="2"/>
  <line x1="290" y1="92" x2="620" y2="92" stroke="#16a34a" stroke-width="0"/>
  <text x="455" y="74" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">USTUN (maydon)</text>
  <line x1="455" y1="100" x2="455" y2="220" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- QATOR strelkasi (o'ngdan) -->
  <line x1="660" y1="200" x2="595" y2="200" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrPy15a)"/>
  <text x="665" y="196" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">QATOR</text>
  <text x="665" y="214" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">(yozuv)</text>

  <!-- KALIT strelkasi (chapdan) -->
  <line x1="120" y1="160" x2="198" y2="160" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrPy15a)"/>
  <text x="60" y="148" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#b45309">Birlamchi</text>
  <text x="60" y="166" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#b45309">kalit (id)</text>
  <text x="60" y="184" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">har qatorni</text>
  <text x="60" y="202" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">noyob belgilaydi</text>

  <!-- Pastki izoh -->
  <rect x="120" y="252" width="520" height="148" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">CREATE TABLE shu tuzilishni belgilaydi:</text>
  <text x="150" y="308" font-family="Consolas, monospace" font-size="13" fill="#2563eb">id   INTEGER PRIMARY KEY AUTOINCREMENT</text>
  <text x="150" y="332" font-family="Consolas, monospace" font-size="13" fill="#1e293b">ism  TEXT NOT NULL</text>
  <text x="150" y="356" font-family="Consolas, monospace" font-size="13" fill="#1e293b">yosh INTEGER</text>
  <text x="150" y="380" font-family="Consolas, monospace" font-size="13" fill="#1e293b">ball REAL</text>
</svg>
