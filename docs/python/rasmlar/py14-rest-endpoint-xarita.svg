<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>REST endpoint xaritasi: HTTP metod va manzil birikmasi qaysi CRUD amalni bajarishini ko'rsatadi</title>

  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">REST endpoint xaritasi (CRUD)</text>
  <text x="380" y="60" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Metod + manzil birikmasi bitta amalni belgilaydi</text>

  <!-- Sarlavha qatori -->
  <text x="120" y="96" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Metod</text>
  <text x="360" y="96" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Manzil</text>
  <text x="630" y="96" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Amal</text>

  <!-- GET hammasi -->
  <rect x="40" y="110" width="160" height="48" rx="8" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="2"/>
  <text x="120" y="140" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#16a34a">GET</text>
  <rect x="220" y="110" width="280" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="360" y="140" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#1e293b">/talabalar</text>
  <text x="630" y="139" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">hammasini o'qish</text>

  <!-- GET bittasi -->
  <rect x="40" y="168" width="160" height="48" rx="8" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="2"/>
  <text x="120" y="198" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#16a34a">GET</text>
  <rect x="220" y="168" width="280" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="360" y="198" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#1e293b">/talabalar/{id}</text>
  <text x="630" y="197" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">bittasini o'qish</text>

  <!-- POST -->
  <rect x="40" y="226" width="160" height="48" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="256" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#2563eb">POST</text>
  <rect x="220" y="226" width="280" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="360" y="256" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#1e293b">/talabalar</text>
  <text x="630" y="255" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">yangi qo'shish</text>

  <!-- PUT -->
  <rect x="40" y="284" width="160" height="48" rx="8" fill="#f59e0b" fill-opacity="0.16" stroke="#f59e0b" stroke-width="2"/>
  <text x="120" y="314" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#f59e0b">PUT</text>
  <rect x="220" y="284" width="280" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="360" y="314" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#1e293b">/talabalar/{id}</text>
  <text x="630" y="313" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">yangilash</text>

  <!-- DELETE -->
  <rect x="40" y="342" width="160" height="48" rx="8" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-width="2"/>
  <text x="120" y="372" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#dc2626">DELETE</text>
  <rect x="220" y="342" width="280" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="360" y="372" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#1e293b">/talabalar/{id}</text>
  <text x="630" y="371" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">o'chirish</text>

  <!-- Pastki izoh -->
  <rect x="40" y="408" width="680" height="46" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="436" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Bir xil manzil (/talabalar/{id}) turli metod bilan turli amal bajaradi.</text>
</svg>
