<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>Dastur va baza orasidagi sikl: cursor.execute(INSERT) + commit yozadi, execute(SELECT) + fetchall o'qiydi</title>

  <defs>
    <marker id="arrPy15i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>

  <!-- Sarlavha -->
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Dastur &#8596; baza: yozish va o'qish sikli</text>
  <text x="380" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">cursor buyruq yuboradi, commit yozadi, fetchall natijani qaytaradi</text>

  <!-- Dastur qutisi (chap) -->
  <rect x="40" y="86" width="280" height="340" rx="12" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="114" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">Python dastur</text>

  <g font-family="Consolas, monospace" font-size="13" fill="#1e293b">
    <text x="60" y="148">conn = sqlite3.connect(</text>
    <text x="80" y="166">"maktab.db")</text>
    <text x="60" y="190">cursor = conn.cursor()</text>
  </g>

  <!-- INSERT bloki -->
  <rect x="60" y="206" width="240" height="86" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="72" y="228" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">1) Yozish</text>
  <text x="72" y="250" font-family="Consolas, monospace" font-size="13" fill="#1e293b">cursor.execute(</text>
  <text x="88" y="268" font-family="Consolas, monospace" font-size="13" fill="#1e293b">"INSERT ...", (...))</text>
  <text x="72" y="286" font-family="Consolas, monospace" font-size="13" fill="#16a34a">conn.commit()</text>

  <!-- SELECT bloki -->
  <rect x="60" y="304" width="240" height="106" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="72" y="326" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#b45309">2) O'qish</text>
  <text x="72" y="348" font-family="Consolas, monospace" font-size="13" fill="#1e293b">cursor.execute(</text>
  <text x="88" y="366" font-family="Consolas, monospace" font-size="13" fill="#1e293b">"SELECT ...")</text>
  <text x="72" y="386" font-family="Consolas, monospace" font-size="13" fill="#b45309">cursor.fetchall()</text>
  <text x="72" y="404" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">qatorlar ro'yxati</text>

  <!-- Baza qutisi (o'ng) -->
  <rect x="440" y="86" width="280" height="340" rx="12" fill="#16a34a" fill-opacity="0.06" stroke="#16a34a" stroke-width="2"/>
  <text x="580" y="114" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">maktab.db (fayl)</text>
  <text x="580" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">doimiy saqlanadi (diskda)</text>

  <!-- Jadval baza ichida -->
  <g font-family="Consolas, monospace" font-size="13">
    <rect x="470" y="160" width="220" height="32" fill="#2563eb"/><text x="580" y="181" text-anchor="middle" font-weight="bold" fill="#ffffff">talabalar</text>
    <rect x="470" y="192" width="220" height="32" fill="#ffffff" stroke="#94a3b8"/><text x="580" y="213" text-anchor="middle" fill="#1e293b">1 | Aziz | 20 | 85.5</text>
    <rect x="470" y="224" width="220" height="32" fill="#ffffff" stroke="#94a3b8"/><text x="580" y="245" text-anchor="middle" fill="#1e293b">2 | Malika | 22 | 90</text>
    <rect x="470" y="256" width="220" height="32" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="580" y="277" text-anchor="middle" fill="#16a34a">3 | Bobur | 21 | 78</text>
  </g>
  <text x="580" y="308" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">yangi qator commit'dan keyin qoladi</text>

  <!-- INSERT strelkasi (chapdan o'ngga) -->
  <line x1="322" y1="248" x2="438" y2="225" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrPy15i)"/>
  <text x="380" y="232" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">INSERT</text>

  <!-- SELECT strelkasi (o'ngdan chapga) -->
  <line x1="438" y1="356" x2="322" y2="356" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrPy15i)"/>
  <text x="380" y="348" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#b45309">SELECT</text>
  <text x="380" y="374" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">qatorlar</text>

  <!-- Pastki ogohlantirish -->
  <rect x="120" y="436" width="520" height="30" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="380" y="456" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">commit() bo'lmasa, yozilgan o'zgarish faylga saqlanmaydi!</text>
</svg>
