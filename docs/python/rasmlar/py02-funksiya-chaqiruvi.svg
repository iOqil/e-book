<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540">
  <title>Funksiya chaqiruvi: argumentlar parametrlarga kiradi, tana ishlaydi, return natijani qaytaradi; *args va **kwargs</title>
  <defs>
    <marker id="fn-arrow" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="540" fill="#f8fafc"/>
  <text x="400" y="38" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">Funksiya chaqiruvi: kiradi -&gt; ishlaydi -&gt; qaytaradi</text>
  <text x="400" y="62" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">argument parametrga bog'lanadi, return qiymatni tashqariga uzatadi</text>

  <!-- Kirish: argument -->
  <rect x="30" y="150" width="150" height="70" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="105" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">Argument</text>
  <text x="105" y="206" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="16" fill="#2563eb">3, 5</text>

  <!-- Strelka kirish -> funksiya -->
  <line x1="180" y1="185" x2="265" y2="185" stroke="#475569" stroke-width="2.5" marker-end="url(#fn-arrow)"/>
  <text x="222" y="175" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">kiradi</text>

  <!-- Funksiya tanasi -->
  <rect x="275" y="115" width="260" height="160" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2.5"/>
  <text x="405" y="145" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="16" fill="#1e293b">def qosh(<tspan fill="#f59e0b">a, b</tspan>):</text>
  <text x="405" y="185" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">tana: amallar bajariladi</text>
  <text x="405" y="220" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="16" fill="#1e293b"><tspan fill="#16a34a">return</tspan> a + b</text>

  <!-- Parametr yorlig'i -->
  <line x1="405" y1="113" x2="405" y2="85" stroke="#475569" stroke-width="2" marker-end="url(#fn-arrow)"/>
  <rect x="320" y="60" width="170" height="26" rx="6" fill="#f59e0b"/>
  <text x="405" y="78" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Parametrlar (a, b)</text>

  <!-- Strelka funksiya -> chiqish -->
  <line x1="535" y1="185" x2="620" y2="185" stroke="#475569" stroke-width="2.5" marker-end="url(#fn-arrow)"/>
  <text x="577" y="175" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">chiqadi</text>

  <!-- Chiqish: return qiymat -->
  <rect x="630" y="150" width="150" height="70" rx="10" fill="#e2e8f0" stroke="#16a34a" stroke-width="2"/>
  <text x="705" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Natija (return)</text>
  <text x="705" y="206" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="16" fill="#16a34a">8</text>

  <!-- *args / **kwargs qism -->
  <rect x="60" y="320" width="680" height="160" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="400" y="348" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Ko'p argument: *args va **kwargs</text>

  <text x="200" y="382" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="15" fill="#2563eb">*args</text>
  <text x="200" y="406" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">nomsiz argumentlar -&gt;</text>
  <rect x="100" y="420" width="200" height="40" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="445" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1e293b">tuple: (3, 5, 7)</text>

  <text x="600" y="382" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="15" fill="#16a34a">**kwargs</text>
  <text x="600" y="406" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">nomli argumentlar -&gt;</text>
  <rect x="490" y="420" width="220" height="40" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="445" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#1e293b">dict: {ism: "Aziz"}</text>

  <text x="400" y="512" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">return bo'lmasa, funksiya None qaytaradi.</text>
</svg>
