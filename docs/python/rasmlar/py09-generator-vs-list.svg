<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>Generator (dangasa, bittadan beradi) va ro'yxat (hammasi xotirada) taqqosi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>

  <text x="380" y="30" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#1e293b">Generator vs ro'yxat</text>

  <!-- LIST (eager) side -->
  <rect x="20" y="55" width="350" height="380" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="195" y="83" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#dc2626">[ i*i for i in range(N) ]</text>
  <text x="195" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Ro'yxat — ochko'z (eager)</text>

  <!-- memory block: all stored -->
  <text x="195" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Hammasi BIRDANIGA xotirada:</text>
  <rect x="45" y="145" width="300" height="120" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <g font-family="monospace" font-size="14" fill="#1e293b" text-anchor="middle">
    <rect x="60" y="160" width="42" height="34" rx="4" fill="#ffffff" stroke="#dc2626"/><text x="81" y="182">0</text>
    <rect x="110" y="160" width="42" height="34" rx="4" fill="#ffffff" stroke="#dc2626"/><text x="131" y="182">1</text>
    <rect x="160" y="160" width="42" height="34" rx="4" fill="#ffffff" stroke="#dc2626"/><text x="181" y="182">4</text>
    <rect x="210" y="160" width="42" height="34" rx="4" fill="#ffffff" stroke="#dc2626"/><text x="231" y="182">9</text>
    <rect x="260" y="160" width="42" height="34" rx="4" fill="#ffffff" stroke="#dc2626"/><text x="281" y="182">16</text>
    <rect x="60" y="205" width="42" height="34" rx="4" fill="#ffffff" stroke="#dc2626"/><text x="81" y="227">25</text>
    <rect x="110" y="205" width="42" height="34" rx="4" fill="#ffffff" stroke="#dc2626"/><text x="131" y="227">36</text>
    <rect x="160" y="205" width="42" height="34" rx="4" fill="#ffffff" stroke="#dc2626"/><text x="181" y="227">49</text>
    <rect x="210" y="205" width="42" height="34" rx="4" fill="#ffffff" stroke="#dc2626"/><text x="231" y="227">...</text>
    <rect x="260" y="205" width="42" height="34" rx="4" fill="#ffffff" stroke="#dc2626"/><text x="281" y="227">N</text>
  </g>
  <text x="195" y="295" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">Ko'p xotira egallaydi</text>
  <text x="195" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">N ta qiymat yaratiladi va</text>
  <text x="195" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">saqlanadi — bo'sh joy kerak.</text>
  <text x="195" y="375" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">Cheksiz ketma-ketlik:</text>
  <text x="195" y="395" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">mumkin emas (xotira tugaydi).</text>

  <!-- GENERATOR (lazy) side -->
  <rect x="390" y="55" width="350" height="380" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="565" y="83" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#16a34a">( i*i for i in range(N) )</text>
  <text x="565" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Generator — dangasa (lazy)</text>

  <text x="565" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Har safar BITTASINI beradi:</text>

  <!-- generator engine box -->
  <rect x="420" y="145" width="120" height="120" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="480" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">generator</text>
  <text x="480" y="195" text-anchor="middle" font-family="monospace" font-size="13" fill="#1e293b">yield</text>
  <text x="480" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">to'xtab</text>
  <text x="480" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">turadi</text>

  <!-- arrow giving one value -->
  <defs>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#16a34a"/>
    </marker>
  </defs>
  <line x1="540" y1="205" x2="640" y2="205" stroke="#16a34a" stroke-width="2" marker-end="url(#arrG)"/>
  <rect x="648" y="188" width="50" height="34" rx="4" fill="#ffffff" stroke="#16a34a"/>
  <text x="673" y="210" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e293b">0</text>
  <text x="595" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">bittasi</text>

  <text x="565" y="295" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Xotira deyarli ishlatilmaydi</text>
  <text x="565" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Qiymat faqat so'ralganda</text>
  <text x="565" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">hisoblanadi, keyin yana to'xtaydi.</text>
  <text x="565" y="375" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Cheksiz ketma-ketlik:</text>
  <text x="565" y="395" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">mumkin (hammasi bir vaqtda emas).</text>

  <text x="380" y="460" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yield = qiymatni "berib", keyingi so'rovgacha pauza qiladi (pause/resume).</text>
</svg>
