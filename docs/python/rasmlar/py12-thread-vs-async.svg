<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470">
  <title>Threadlar va asyncio farqi: ko'p OS thread vs bitta threadda event loop</title>
  <rect x="0" y="0" width="780" height="470" fill="#f8fafc"/>

  <text x="390" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Threadlar va asyncio - farqi</text>
  <text x="390" y="55" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Ikkalasi ham KUTISH (I/O) ishlari uchun; ishlash modeli boshqacha</text>

  <!-- THREADS side -->
  <rect x="20" y="72" width="360" height="360" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="200" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">threading</text>
  <text x="200" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Bir nechta OS thread; OS almashtiradi</text>

  <!-- three OS threads -->
  <rect x="50" y="142" width="300" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="173" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Thread A - mustaqil ishlaydi</text>
  <rect x="50" y="200" width="300" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="231" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Thread B - mustaqil ishlaydi</text>
  <rect x="50" y="258" width="300" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="289" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Thread C - mustaqil ishlaydi</text>

  <text x="50" y="338" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">+ Oson, mavjud kodga mos.</text>
  <text x="50" y="360" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">+ Kam sonli ishlar uchun qulay.</text>
  <text x="50" y="382" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">- Har thread xotira/almashinuv xarajati.</text>
  <text x="50" y="404" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">- GIL: CPU hisobini tezlashtirmaydi.</text>

  <!-- ASYNCIO side -->
  <rect x="400" y="72" width="360" height="360" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="580" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">asyncio</text>
  <text x="580" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Bitta thread; event loop navbatlashtiradi</text>

  <!-- single thread box containing event loop with coroutines -->
  <rect x="430" y="142" width="300" height="166" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="580" y="166" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">Bitta thread + event loop</text>

  <rect x="450" y="180" width="80" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="490" y="207" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">coro A</text>
  <rect x="540" y="180" width="80" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="580" y="207" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">coro B</text>
  <rect x="630" y="180" width="80" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="670" y="207" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">coro C</text>
  <text x="580" y="252" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">await da navbat boshqasiga o'tadi</text>
  <text x="580" y="276" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#1e293b">await asyncio.sleep(...)</text>

  <text x="430" y="338" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">+ Minglab kutish ishi uchun samarali.</text>
  <text x="430" y="360" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">+ Kam xotira xarajati.</text>
  <text x="430" y="382" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">- async/await yozuvini talab qiladi.</text>
  <text x="430" y="404" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">- await joyida blok qilsang (time.sleep) - hamma to'xtaydi.</text>

  <text x="390" y="456" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Og'ir HISOB (CPU) uchun ikkalasi ham yaramaydi - multiprocessing kerak.</text>
</svg>
