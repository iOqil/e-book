<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470">
  <title>__init__ va self qanday ishlaydi (obyekt yaratish bosqichlari)</title>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="470" fill="#f8fafc"/>

  <!-- Boshlang'ich chaqiruv -->
  <rect x="250" y="20" width="280" height="48" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="390" y="50" text-anchor="middle" font-family="monospace" font-size="17" fill="#1e293b">t1 = Talaba("Aziz", 20)</text>

  <line x1="390" y1="68" x2="390" y2="98" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Bosqich 1 -->
  <rect x="40" y="100" width="700" height="64" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
  <circle cx="68" cy="132" r="15" fill="#2563eb"/>
  <text x="68" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">1</text>
  <text x="96" y="126" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">Python avval bo'sh yangi obyekt yaratadi (xotirada joy).</text>
  <text x="96" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#475569">Shu yangi obyekt keyin self ga uzatiladi.</text>

  <line x1="390" y1="164" x2="390" y2="192" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Bosqich 2 -->
  <rect x="40" y="194" width="700" height="92" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
  <circle cx="68" cy="240" r="15" fill="#2563eb"/>
  <text x="68" y="246" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">2</text>
  <text x="96" y="220" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">__init__ avtomatik chaqiriladi. Python parametrlarni shunday joylaydi:</text>
  <text x="120" y="248" font-family="monospace" font-size="15" fill="#16a34a">self ← yangi obyekt</text>
  <text x="360" y="248" font-family="monospace" font-size="15" fill="#1e293b">ism ← "Aziz"</text>
  <text x="555" y="248" font-family="monospace" font-size="15" fill="#1e293b">yosh ← 20</text>
  <text x="96" y="274" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">self ni o'zing yozmaysan — Python avtomatik uzatadi</text>

  <line x1="390" y1="286" x2="390" y2="314" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Bosqich 3 -->
  <rect x="40" y="316" width="700" height="72" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
  <circle cx="68" cy="352" r="15" fill="#2563eb"/>
  <text x="68" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">3</text>
  <text x="96" y="344" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">Tana bajariladi — atributlar shu obyektga yoziladi:</text>
  <text x="120" y="372" font-family="monospace" font-size="15" fill="#1e293b">self.ism = ism</text>
  <text x="330" y="372" font-family="monospace" font-size="15" fill="#1e293b">self.yosh = yosh</text>

  <line x1="390" y1="388" x2="390" y2="412" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Natija -->
  <rect x="230" y="414" width="320" height="44" rx="8" fill="#f8fafc" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="390" y="442" text-anchor="middle" font-family="monospace" font-size="15" fill="#1e293b">t1 → ism="Aziz", yosh=20</text>
</svg>
