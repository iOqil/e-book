<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>Float aniqligi muammosi: 0.1 + 0.2 nega 0.3 ga teng emas</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>

  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Float aniqligi muammosi</text>
  <text x="380" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">0.1 va 0.2 binar (ikkilik) kasrda aniq saqlanmaydi</text>

  <!-- left: what we write -->
  <rect x="30" y="80" width="200" height="150" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="130" y="106" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Biz yozamiz</text>
  <rect x="55" y="124" width="150" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="130" y="148" text-anchor="middle" font-family="monospace" font-size="16" fill="#1e293b">0.1</text>
  <rect x="55" y="172" width="150" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="130" y="196" text-anchor="middle" font-family="monospace" font-size="16" fill="#1e293b">0.2</text>

  <!-- arrow -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <line x1="234" y1="155" x2="286" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- right: what computer stores -->
  <rect x="290" y="80" width="440" height="150" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="510" y="106" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Kompyuter saqlaydi (taxminan)</text>
  <rect x="315" y="124" width="390" height="38" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="510" y="148" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e293b">0.1000000000000000055511...</text>
  <rect x="315" y="172" width="390" height="38" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="510" y="196" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e293b">0.2000000000000000111022...</text>

  <!-- result row -->
  <rect x="30" y="250" width="700" height="92" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="380" y="280" text-anchor="middle" font-family="monospace" font-size="16" fill="#1e293b">0.1 + 0.2  ==  0.30000000000000004</text>
  <text x="380" y="312" text-anchor="middle" font-family="monospace" font-size="16" fill="#1e293b">0.1 + 0.2 == 0.3   ->   </text>
  <text x="556" y="312" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#dc2626">False</text>

  <!-- fix box -->
  <rect x="30" y="362" width="700" height="78" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="388" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">To'g'ri yo'l</text>
  <text x="380" y="414" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e293b">math.isclose(a, b)   |   pul uchun: Decimal("0.1") + Decimal("0.2")</text>
  <text x="380" y="432" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">float'ni == bilan solishtirma; narx/pulda Decimal ishlat</text>

  <text x="380" y="460" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#94a3b8">Bu Python xatosi emas — IEEE 754 standarti, barcha tillarda bir xil</text>
</svg>
