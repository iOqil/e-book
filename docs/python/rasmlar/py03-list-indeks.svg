<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320">
  <title>Ro'yxat (list) ichki ko'rinishi — indeks va element bog'lanishi</title>
  <rect x="0" y="0" width="700" height="320" fill="#f8fafc"/>
  <text x="350" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">list — indeks → element</text>
  <text x="350" y="60" text-anchor="middle" font-family="monospace" font-size="15" fill="#475569">mevalar = ["olma", "banan", "uzum"]</text>

  <!-- Cells -->
  <rect x="100" y="95" width="160" height="70" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="270" y="95" width="160" height="70" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="440" y="95" width="160" height="70" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="180" y="138" text-anchor="middle" font-family="monospace" font-size="17" fill="#2563eb">"olma"</text>
  <text x="350" y="138" text-anchor="middle" font-family="monospace" font-size="17" fill="#2563eb">"banan"</text>
  <text x="520" y="138" text-anchor="middle" font-family="monospace" font-size="17" fill="#2563eb">"uzum"</text>

  <!-- Positive index labels (top) -->
  <text x="180" y="86" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#16a34a">indeks 0</text>
  <text x="350" y="86" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#16a34a">indeks 1</text>
  <text x="520" y="86" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#16a34a">indeks 2</text>

  <!-- Negative index labels (bottom) -->
  <text x="180" y="195" text-anchor="middle" font-family="monospace" font-size="15" fill="#dc2626">-3</text>
  <text x="350" y="195" text-anchor="middle" font-family="monospace" font-size="15" fill="#dc2626">-2</text>
  <text x="520" y="195" text-anchor="middle" font-family="monospace" font-size="15" fill="#dc2626">-1</text>
  <text x="350" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">manfiy indeks — oxiridan sanaydi</text>

  <!-- Access examples -->
  <rect x="60" y="245" width="280" height="55" fill="#ffffff" stroke="#94a3b8"/>
  <text x="200" y="270" text-anchor="middle" font-family="monospace" font-size="15" fill="#1e293b">mevalar[0]  →  "olma"</text>
  <text x="200" y="291" text-anchor="middle" font-family="monospace" font-size="15" fill="#1e293b">mevalar[-1] →  "uzum"</text>

  <rect x="360" y="245" width="280" height="55" fill="#ffffff" stroke="#94a3b8"/>
  <text x="500" y="270" text-anchor="middle" font-family="monospace" font-size="15" fill="#1e293b">len(mevalar) → 3</text>
  <text x="500" y="291" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">indeks 0 dan boshlanadi</text>
</svg>
