<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>CSV jadval va Python qatorlari orasidagi moslik: csv.writer, csv.reader va DictReader</title>

  <defs>
    <marker id="arrPy08c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Sarlavha -->
  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">CSV jadval  &lt;=&gt;  Python qatorlari</text>
  <text x="380" y="54" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">writer ro'yxatlarni qatorga yozadi; reader qatorlarni o'qiydi (sonlar ham matn keladi)</text>

  <!-- CSV fayl qutisi (chap) -->
  <rect x="36" y="84" width="300" height="174" rx="12" fill="#16a34a" fill-opacity="0.08" stroke="#16a34a" stroke-width="2"/>
  <text x="186" y="110" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">talabalar.csv (matn)</text>
  <text x="186" y="142" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#475569">ism,yosh,ball</text>
  <line x1="56" y1="152" x2="316" y2="152" stroke="#94a3b8" stroke-width="1"/>
  <text x="186" y="174" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#1e293b">Aziz,20,85</text>
  <text x="186" y="198" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#1e293b">Malika,22,90</text>
  <text x="186" y="232" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">har qator = vergul bilan</text>
  <text x="186" y="250" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ajratilgan qiymatlar</text>

  <!-- Python qatorlar qutisi (o'ng) -->
  <rect x="424" y="84" width="300" height="174" rx="12" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb" stroke-width="2"/>
  <text x="574" y="110" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">Python ro'yxatlar</text>
  <text x="574" y="142" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">["ism","yosh","ball"]</text>
  <line x1="444" y1="152" x2="704" y2="152" stroke="#94a3b8" stroke-width="1"/>
  <text x="574" y="174" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">["Aziz", "20", "85"]</text>
  <text x="574" y="198" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">["Malika", "22", "90"]</text>
  <text x="574" y="232" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626" font-weight="bold">diqqat: "20" — matn,</text>
  <text x="574" y="250" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626" font-weight="bold">son emas (int() kerak)</text>

  <!-- writer strelka (o'ngdan chapga: ro'yxat -> CSV) -->
  <line x1="422" y1="150" x2="338" y2="150" stroke="#475569" stroke-width="2.5" marker-end="url(#arrPy08c)"/>
  <text x="380" y="142" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#1e293b">writer</text>
  <text x="380" y="166" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">writerow</text>

  <!-- reader strelka (chapdan o'ngga: CSV -> ro'yxat) -->
  <line x1="338" y1="200" x2="422" y2="200" stroke="#475569" stroke-width="2.5" marker-end="url(#arrPy08c)"/>
  <text x="380" y="194" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#1e293b">reader</text>

  <!-- DictReader izoh -->
  <rect x="90" y="296" width="580" height="150" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="322" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">csv.DictReader — har qatorni lug'at qiladi</text>
  <text x="380" y="344" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">sarlavha qatori kalit bo'ladi, har keyingi qator unga moslanadi</text>

  <!-- DictReader natija qutisi -->
  <rect x="160" y="358" width="440" height="72" rx="10" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="384" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#b45309">{"ism": "Aziz", "yosh": "20", "ball": "85"}</text>
  <text x="380" y="410" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#b45309">{"ism": "Malika", "yosh": "22", "ball": "90"}</text>
</svg>
