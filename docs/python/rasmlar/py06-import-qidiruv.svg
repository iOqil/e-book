<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>import qanday topadi: Python modulni sys.modules keshida, so'ng sys.path bo'yicha tartib bilan qidiradi</title>
  <defs>
    <marker id="py06i-strelka" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>

  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">import math — Python modulni qanday topadi</text>

  <!-- import buyrug'i -->
  <rect x="270" y="56" width="220" height="40" rx="8" fill="#2563eb"/>
  <text x="380" y="82" text-anchor="middle" font-family="monospace" font-size="17" fill="#f8fafc">import math</text>

  <!-- strelka pastga -->
  <line x1="380" y1="96" x2="380" y2="120" stroke="#475569" stroke-width="2.5" marker-end="url(#py06i-strelka)"/>

  <!-- 0-qadam: sys.modules kesh -->
  <rect x="190" y="124" width="380" height="56" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="380" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">0. sys.modules keshi</text>
  <text x="380" y="170" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Allaqachon import qilingan bo'lsa — shu yerdan oladi (qayta yuklamaydi)</text>

  <!-- agar topilmasa -->
  <line x1="380" y1="180" x2="380" y2="204" stroke="#475569" stroke-width="2.5" marker-end="url(#py06i-strelka)"/>
  <text x="468" y="198" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">topilmasa ↓</text>

  <!-- sys.path sarlavhasi -->
  <rect x="150" y="208" width="460" height="34" rx="8" fill="#f59e0b"/>
  <text x="380" y="231" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">sys.path — papkalar ro'yxati (yuqoridan pastga tartib bilan)</text>

  <!-- 1-qadam -->
  <rect x="150" y="252" width="460" height="46" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="178" cy="275" r="14" fill="#2563eb"/>
  <text x="178" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">1</text>
  <text x="206" y="270" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Joriy skript papkasi</text>
  <text x="206" y="290" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">o'z modullaring shu yerdan topiladi (masalan hisob.py)</text>

  <line x1="380" y1="298" x2="380" y2="312" stroke="#475569" stroke-width="2" marker-end="url(#py06i-strelka)"/>

  <!-- 2-qadam -->
  <rect x="150" y="316" width="460" height="46" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="178" cy="339" r="14" fill="#2563eb"/>
  <text x="178" y="344" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">2</text>
  <text x="206" y="334" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Standart kutubxona</text>
  <text x="206" y="354" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Python bilan keladigan modullar (math, random, datetime)</text>

  <line x1="380" y1="362" x2="380" y2="376" stroke="#475569" stroke-width="2" marker-end="url(#py06i-strelka)"/>

  <!-- 3-qadam -->
  <rect x="150" y="380" width="460" height="46" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="178" cy="403" r="14" fill="#2563eb"/>
  <text x="178" y="408" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">3</text>
  <text x="206" y="398" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">site-packages</text>
  <text x="206" y="418" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">pip o'rnatgan kutubxonalar (requests, rich)</text>

  <!-- topilmasa xatosi -->
  <text x="380" y="452" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">Hech qayerdan topilmasa → ModuleNotFoundError</text>
