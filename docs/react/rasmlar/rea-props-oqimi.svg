<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <title>Props oqimi: otadan bolaga, bir tomonlama, faqat o'qish uchun</title>
  <defs>
    <marker id="flow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="ban" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="380" fill="#f8fafc"/>
  <text x="360" y="32" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#1e293b" text-anchor="middle">Props: bir tomonlama oqim (parent -&gt; child)</text>

  <!-- Parent -->
  <rect x="250" y="62" width="220" height="74" rx="8" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <text x="360" y="90" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt;App /&gt; (ota)</text>
  <text x="360" y="118" font-family="monospace" font-size="13" fill="#dbeafe" text-anchor="middle">&lt;Card title="Salom" /&gt;</text>

  <!-- down arrow: props flow -->
  <line x1="360" y1="138" x2="360" y2="226" stroke="#16a34a" stroke-width="3" marker-end="url(#flow)"/>
  <rect x="378" y="160" width="180" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="468" y="178" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a" text-anchor="middle">props pastga oqadi</text>
  <text x="468" y="196" font-family="monospace" font-size="13" fill="#16a34a" text-anchor="middle">title = "Salom"</text>

  <!-- Child -->
  <rect x="250" y="230" width="220" height="74" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="258" font-family="monospace" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">&lt;Card /&gt; (bola)</text>
  <text x="360" y="286" font-family="monospace" font-size="13" fill="#1e293b" text-anchor="middle">{ title } faqat o'qiladi</text>

  <!-- forbidden up arrow -->
  <line x1="200" y1="226" x2="200" y2="146" stroke="#dc2626" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ban)"/>
  <text x="150" y="186" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626" text-anchor="middle">bola props ni</text>
  <text x="150" y="204" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626" text-anchor="middle">o'zgartira olmaydi</text>
  <text x="200" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#dc2626" text-anchor="middle">×</text>

  <text x="360" y="344" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Props read-only: bola faqat oladi va ko'rsatadi, hech qachon o'zgartirmaydi</text>
  <text x="360" y="366" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Bola pastdan ta'sir qilmoqchi bo'lsa — ota callback (funksiya) prop beradi</text>
</svg>
