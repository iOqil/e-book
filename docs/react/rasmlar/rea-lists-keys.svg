<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 420" width="740" height="420">
  <title>Lists va keys: key reconciliation jarayonida elementni aniqlaydi</title>
  <rect x="0" y="0" width="740" height="420" fill="#f8fafc"/>
  <text x="370" y="32" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#1e293b" text-anchor="middle">key nega kerak: React qaysi element o'zgarganini aniqlaydi</text>

  <!-- LEFT: stable id (good) -->
  <text x="200" y="68" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">key = barqaror id  (to'g'ri)</text>

  <!-- old list -->
  <text x="120" y="96" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Oldin</text>
  <rect x="70" y="106" width="100" height="34" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="120" y="128" font-family="monospace" font-size="13" fill="#1e293b" text-anchor="middle">id:1 Ali</text>
  <rect x="70" y="146" width="100" height="34" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="120" y="168" font-family="monospace" font-size="13" fill="#1e293b" text-anchor="middle">id:2 Vali</text>

  <!-- new list -->
  <text x="290" y="96" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Keyin (boshiga qo'shildi)</text>
  <rect x="240" y="106" width="100" height="34" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="290" y="128" font-family="monospace" font-size="13" fill="#16a34a" text-anchor="middle">id:3 Hasan</text>
  <rect x="240" y="146" width="100" height="34" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="290" y="168" font-family="monospace" font-size="13" fill="#1e293b" text-anchor="middle">id:1 Ali</text>
  <rect x="240" y="186" width="100" height="34" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="290" y="208" font-family="monospace" font-size="13" fill="#1e293b" text-anchor="middle">id:2 Vali</text>

  <text x="200" y="252" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a" text-anchor="middle">id:1, id:2 o'zgarmadi —</text>
  <text x="200" y="272" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a" text-anchor="middle">React faqat id:3 ni qo'shadi</text>

  <!-- divider -->
  <line x1="375" y1="56" x2="375" y2="300" stroke="#cbd5e1" stroke-width="2"/>

  <!-- RIGHT: index (bad) -->
  <text x="555" y="68" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="middle">key = index  (xato)</text>

  <text x="475" y="96" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Oldin</text>
  <rect x="425" y="106" width="100" height="34" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="475" y="128" font-family="monospace" font-size="13" fill="#1e293b" text-anchor="middle">key:0 Ali</text>
  <rect x="425" y="146" width="100" height="34" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="475" y="168" font-family="monospace" font-size="13" fill="#1e293b" text-anchor="middle">key:1 Vali</text>

  <text x="645" y="96" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Keyin</text>
  <rect x="595" y="106" width="100" height="34" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="645" y="128" font-family="monospace" font-size="13" fill="#dc2626" text-anchor="middle">key:0 Hasan</text>
  <rect x="595" y="146" width="100" height="34" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="645" y="168" font-family="monospace" font-size="13" fill="#dc2626" text-anchor="middle">key:1 Ali</text>
  <rect x="595" y="186" width="100" height="34" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="645" y="208" font-family="monospace" font-size="13" fill="#dc2626" text-anchor="middle">key:2 Vali</text>

  <text x="555" y="252" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626" text-anchor="middle">key:0 endi "Hasan" —</text>
  <text x="555" y="272" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626" text-anchor="middle">React hammasini noto'g'ri yangilaydi</text>

  <!-- bottom note -->
  <rect x="60" y="320" width="620" height="76" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="370" y="348" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Reconciliation (solishtirish): React eski va yangi ro'yxatni key bo'yicha taqqoslaydi.</text>
  <text x="370" y="372" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Barqaror key (id) elementni ro'yxat o'zgarsa ham aniq taniydi — holat va DOM joyida qoladi.</text>
</svg>
