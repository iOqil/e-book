<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>Lifting state up: umumiy holatni ota komponentga ko'tarish</title>
  <defs>
    <marker id="dn" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="up" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>
  <text x="360" y="32" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#1e293b" text-anchor="middle">Lifting state up: state umumiy otaga ko'tariladi</text>

  <!-- Parent holds state -->
  <rect x="240" y="58" width="240" height="80" rx="8" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <text x="360" y="84" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt;Parent /&gt;</text>
  <text x="360" y="108" font-family="monospace" font-size="13" fill="#dbeafe" text-anchor="middle">[value, setValue]</text>
  <text x="360" y="128" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dbeafe" text-anchor="middle">yagona manba (source of truth)</text>

  <!-- Child A: Input -->
  <rect x="60" y="250" width="240" height="90" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="180" y="276" font-family="monospace" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">&lt;Input /&gt;</text>
  <text x="180" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">yozadi -&gt; onChange chaqiradi</text>
  <text x="180" y="322" font-family="monospace" font-size="13" fill="#1e293b" text-anchor="middle">props: value, onChange</text>

  <!-- Child B: Display -->
  <rect x="420" y="250" width="240" height="90" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="540" y="276" font-family="monospace" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">&lt;Display /&gt;</text>
  <text x="540" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">o'qiydi -&gt; ko'rsatadi</text>
  <text x="540" y="322" font-family="monospace" font-size="13" fill="#1e293b" text-anchor="middle">props: value</text>

  <!-- arrows down: value prop -->
  <path d="M300 138 Q200 180 180 246" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#dn)"/>
  <path d="M420 138 Q520 180 540 246" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#dn)"/>
  <text x="120" y="200" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">value (pastga)</text>
  <text x="600" y="200" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">value (pastga)</text>

  <!-- arrow up from Input: setValue callback -->
  <path d="M210 246 Q300 195 320 142" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#up)"/>
  <text x="305" y="225" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#f59e0b" text-anchor="middle">setValue (yuqoriga)</text>

  <text x="360" y="378" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Ikki bola bitta ma'lumotni ulashadi — state ularning umumiy otasida turadi</text>
  <text x="360" y="404" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Input setValue bilan o'zgartiradi, Parent qayta render qiladi, Display yangi qiymatni ko'radi</text>
</svg>
