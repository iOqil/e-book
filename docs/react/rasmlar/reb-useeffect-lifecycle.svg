<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>useEffect hayot sikli: mount, dependency o'zgarishi, cleanup va unmount</title>
  <defs>
    <marker id="ef-arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="ef-blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="32" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#1e293b" text-anchor="middle">useEffect hayot sikli (deps massivi rolini bilan)</text>

  <!-- Mount -->
  <rect x="40" y="70" width="180" height="74" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="130" y="98" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">1. Mount</text>
  <text x="130" y="119" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">komponent paydo bo'ldi</text>
  <text x="130" y="137" font-family="monospace" font-size="13" fill="#1e293b" text-anchor="middle">effect ishlaydi</text>

  <!-- Render with deps -->
  <rect x="290" y="70" width="200" height="74" rx="8" fill="#e2e8f0" stroke="#2563eb" stroke-width="2"/>
  <text x="390" y="96" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">2. Qayta render</text>
  <text x="390" y="116" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">deps o'zgardimi?</text>
  <text x="390" y="134" font-family="monospace" font-size="13" fill="#1e293b" text-anchor="middle">[userId]</text>

  <!-- Cleanup -->
  <rect x="560" y="70" width="170" height="74" rx="8" fill="#e2e8f0" stroke="#f59e0b" stroke-width="2"/>
  <text x="645" y="96" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f59e0b" text-anchor="middle">3. Cleanup</text>
  <text x="645" y="116" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">eski effect tozalanadi</text>
  <text x="645" y="134" font-family="monospace" font-size="13" fill="#1e293b" text-anchor="middle">return () =&gt; {...}</text>

  <!-- Re-run effect -->
  <rect x="290" y="220" width="200" height="74" rx="8" fill="#e2e8f0" stroke="#2563eb" stroke-width="2"/>
  <text x="390" y="246" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">4. Effect qayta ishlaydi</text>
  <text x="390" y="266" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">yangi deps qiymati bilan</text>
  <text x="390" y="284" font-family="monospace" font-size="13" fill="#1e293b" text-anchor="middle">fetch(userId)</text>

  <!-- Unmount -->
  <rect x="40" y="220" width="180" height="74" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="130" y="246" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="middle">5. Unmount</text>
  <text x="130" y="266" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">komponent yo'qoldi</text>
  <text x="130" y="284" font-family="monospace" font-size="13" fill="#1e293b" text-anchor="middle">oxirgi cleanup</text>

  <!-- arrows -->
  <path d="M220 107 L286 107" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#ef-arr)"/>
  <path d="M490 107 L556 107" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#ef-arr)"/>
  <text x="525" y="62" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">deps o'zgargan</text>
  <path d="M620 144 Q560 200 492 245" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ef-blue)"/>
  <path d="M290 257 L222 257" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ef-arr)"/>
  <text x="256" y="248" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">olib tashlandi</text>

  <!-- deps legend -->
  <rect x="40" y="340" width="690" height="100" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="366" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">deps massivi roli:</text>
  <text x="60" y="392" font-family="monospace" font-size="13" fill="#2563eb">[]</text>
  <text x="100" y="392" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">faqat mount va unmount (effect bir marta ishlaydi)</text>
  <text x="60" y="414" font-family="monospace" font-size="13" fill="#2563eb">[userId]</text>
  <text x="140" y="414" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">userId o'zgarsa: avval cleanup, keyin effect qayta ishlaydi</text>
  <text x="60" y="434" font-family="monospace" font-size="13" fill="#2563eb">yo'q</text>
  <text x="140" y="434" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">har renderdan keyin (kamdan-kam kerak)</text>
</svg>
