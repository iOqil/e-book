<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <title>Komponent daraxti: App ildizdan bola komponentlarga</title>
  <rect x="0" y="0" width="720" height="420" fill="#f8fafc"/>
  <text x="360" y="32" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#1e293b" text-anchor="middle">Komponent daraxti (UI = ichma-ich komponentlar)</text>

  <!-- Edges -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M360 96 L180 168"/>
    <path d="M360 96 L360 168"/>
    <path d="M360 96 L540 168"/>
    <path d="M180 204 L110 276"/>
    <path d="M180 204 L250 276"/>
    <path d="M540 204 L470 276"/>
    <path d="M540 204 L610 276"/>
  </g>

  <!-- Root: App -->
  <rect x="300" y="60" width="120" height="40" rx="6" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <text x="360" y="85" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt;App /&gt;</text>

  <!-- Level 2 -->
  <rect x="120" y="168" width="120" height="38" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="180" y="192" font-family="monospace" font-size="15" fill="#1e293b" text-anchor="middle">&lt;Header /&gt;</text>

  <rect x="300" y="168" width="120" height="38" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="192" font-family="monospace" font-size="15" fill="#1e293b" text-anchor="middle">&lt;Main /&gt;</text>

  <rect x="480" y="168" width="120" height="38" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="540" y="192" font-family="monospace" font-size="15" fill="#1e293b" text-anchor="middle">&lt;Footer /&gt;</text>

  <!-- Level 3 -->
  <rect x="52" y="276" width="116" height="38" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="110" y="300" font-family="monospace" font-size="14" fill="#1e293b" text-anchor="middle">&lt;Logo /&gt;</text>

  <rect x="192" y="276" width="116" height="38" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="250" y="300" font-family="monospace" font-size="14" fill="#1e293b" text-anchor="middle">&lt;Nav /&gt;</text>

  <rect x="412" y="276" width="116" height="38" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="470" y="300" font-family="monospace" font-size="14" fill="#1e293b" text-anchor="middle">&lt;Card /&gt;</text>

  <rect x="552" y="276" width="116" height="38" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="610" y="300" font-family="monospace" font-size="14" fill="#1e293b" text-anchor="middle">&lt;Card /&gt;</text>

  <!-- Legend -->
  <rect x="160" y="350" width="22" height="22" rx="4" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <text x="190" y="367" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Ildiz komponent (App)</text>
  <rect x="400" y="350" width="22" height="22" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="430" y="367" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Bola komponentlar</text>

  <text x="360" y="402" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Bitta ildizdan tarmoqlanadi — har komponent qayta ishlatiladi</text>
</svg>
