<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400">
  <title>Error Boundary: bola komponentdagi xato ushlanib, fallback UI ko'rsatiladi</title>
  <defs>
    <marker id="rc5-green" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="rc5-red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="400" fill="#f8fafc"/>
  <text x="390" y="30" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#1e293b" text-anchor="middle">Error Boundary — xatoni ushlab, fallback ko'rsatadi</text>

  <!-- LEFT: normal -->
  <text x="195" y="62" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">Xato yo'q — odatdagi holat</text>

  <rect x="40" y="78" width="310" height="220" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="195" y="102" font-family="monospace" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">&lt;ErrorBoundary&gt;</text>
  <text x="195" y="122" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">hasError: false</text>

  <rect x="70" y="140" width="250" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="195" y="164" font-family="monospace" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">&lt;Profile /&gt;</text>
  <text x="195" y="186" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">bola normal render bo'ladi</text>

  <rect x="70" y="216" width="250" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="195" y="240" font-family="monospace" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">&lt;Feed /&gt;</text>
  <text x="195" y="262" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">children ko'rsatiladi</text>

  <!-- divider -->
  <line x1="390" y1="56" x2="390" y2="306" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- RIGHT: error -->
  <text x="585" y="62" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="middle">Bola'da xato — fallback UI</text>

  <rect x="430" y="78" width="310" height="220" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="585" y="102" font-family="monospace" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">&lt;ErrorBoundary&gt;</text>
  <text x="585" y="122" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">getDerivedStateFromError → hasError: true</text>

  <rect x="460" y="140" width="250" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="585" y="161" font-family="monospace" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">&lt;Profile /&gt; — throw ×</text>
  <text x="585" y="181" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">render paytida xato tashlandi</text>

  <rect x="460" y="206" width="250" height="70" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="585" y="232" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="middle">Fallback UI</text>
  <text x="585" y="256" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">"Nimadir xato ketdi"</text>
  <text x="585" y="272" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">ilova qulamaydi</text>

  <path d="M585 190 L585 204" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#rc5-red)"/>

  <!-- note -->
  <rect x="40" y="322" width="700" height="62" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="58" y="346" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Bola'dagi render xatosi yuqoriga "ko'tariladi" → eng yaqin Error Boundary uni ushlaydi va butun</text>
  <text x="58" y="368" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">ilova o'rniga faqat fallback'ni chizadi. componentDidCatch'da xatoni Sentry'ga log qilish mumkin.</text>
</svg>
