<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
  <title>React render fazalari: Render fazasi, reconciliation, Commit fazasi, DOM</title>
  <defs>
    <marker id="rc3-blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="rc3-green" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="350" fill="#f8fafc"/>
  <text x="400" y="30" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#1e293b" text-anchor="middle">React render fazalari (state/props o'zgargach)</text>

  <!-- trigger -->
  <rect x="40" y="64" width="160" height="56" rx="8" fill="#e2e8f0" stroke="#f59e0b" stroke-width="2"/>
  <text x="120" y="88" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="middle">Trigger</text>
  <text x="120" y="109" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">setState / props o'zgardi</text>

  <!-- render phase box -->
  <rect x="40" y="156" width="500" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="290" y="180" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">Render fazasi (toza, side-effect yo'q)</text>

  <rect x="62" y="198" width="190" height="86" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="157" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">1. Komponent chaqiriladi</text>
  <text x="157" y="246" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">yangi virtual DOM</text>
  <text x="157" y="268" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">(JSX daraxti) hosil bo'ladi</text>

  <rect x="328" y="198" width="190" height="86" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="423" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">2. Reconciliation</text>
  <text x="423" y="246" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">eski va yangi daraxt</text>
  <text x="423" y="268" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">solishtiriladi (diff)</text>

  <path d="M252 241 L324 241" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#rc3-blue)"/>

  <!-- commit phase box -->
  <rect x="580" y="156" width="180" height="150" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="670" y="180" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">Commit fazasi</text>
  <rect x="600" y="198" width="140" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="670" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">3. DOM yangilanadi</text>
  <text x="670" y="240" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">faqat farqlar yoziladi</text>
  <text x="670" y="270" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">so'ng useEffect / ref</text>
  <text x="670" y="290" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">(brauzer chizgandan keyin)</text>

  <!-- trigger to render -->
  <path d="M120 120 L120 154" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#rc3-blue)"/>
  <!-- render to commit -->
  <path d="M540 231 L576 231" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#rc3-green)"/>

  <!-- note -->
  <text x="400" y="332" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">Render fazasi toza bo'lishi shart (DOM'ga tegmang) — barqaror key reconciliation'ni aniq qiladi.</text>
</svg>
