<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>app papkasidagi fayllar mos marshrutlarga qanday aylanishi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Fayl = marshrut (file-based routing)</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">app/ papkasidagi har bir fayl avtomatik marshrutga (manzilga) aylanadi</text>

  <!-- Ustun sarlavhalari -->
  <text x="190" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#4f46e5">Fayl (app/ ichida)</text>
  <text x="570" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#0ea5e9">Marshrut (manzil)</text>

  <!-- Qator 1 -->
  <rect x="40" y="118" width="300" height="48" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="58" y="148" font-size="15" fill="#1e293b" font-family="Consolas, monospace">app/index.tsx</text>
  <text x="370" y="148" font-size="20" fill="#94a3b8">&#8594;</text>
  <rect x="420" y="118" width="300" height="48" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
  <text x="438" y="148" font-size="15" fill="#0ea5e9" font-family="Consolas, monospace">/</text>
  <text x="470" y="148" font-size="14" fill="#94a3b8">bosh ekran (ildiz)</text>

  <!-- Qator 2 -->
  <rect x="40" y="174" width="300" height="48" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="58" y="204" font-size="15" fill="#1e293b" font-family="Consolas, monospace">app/profil.tsx</text>
  <text x="370" y="204" font-size="20" fill="#94a3b8">&#8594;</text>
  <rect x="420" y="174" width="300" height="48" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
  <text x="438" y="204" font-size="15" fill="#0ea5e9" font-family="Consolas, monospace">/profil</text>

  <!-- Qator 3 -->
  <rect x="40" y="230" width="300" height="48" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="58" y="260" font-size="15" fill="#1e293b" font-family="Consolas, monospace">app/sozlamalar.tsx</text>
  <text x="370" y="260" font-size="20" fill="#94a3b8">&#8594;</text>
  <rect x="420" y="230" width="300" height="48" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
  <text x="438" y="260" font-size="15" fill="#0ea5e9" font-family="Consolas, monospace">/sozlamalar</text>

  <!-- Qator 4 -->
  <rect x="40" y="286" width="300" height="48" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="58" y="316" font-size="15" fill="#1e293b" font-family="Consolas, monospace">app/profil/index.tsx</text>
  <text x="370" y="316" font-size="20" fill="#94a3b8">&#8594;</text>
  <rect x="420" y="286" width="300" height="48" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
  <text x="438" y="316" font-size="15" fill="#0ea5e9" font-family="Consolas, monospace">/profil</text>

  <!-- Qator 5 -->
  <rect x="40" y="342" width="300" height="48" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="58" y="372" font-size="15" fill="#1e293b" font-family="Consolas, monospace">app/profil/tahrir.tsx</text>
  <text x="370" y="372" font-size="20" fill="#94a3b8">&#8594;</text>
  <rect x="420" y="342" width="300" height="48" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
  <text x="438" y="372" font-size="15" fill="#0ea5e9" font-family="Consolas, monospace">/profil/tahrir</text>

  <!-- Maxsus fayllar izohi -->
  <rect x="40" y="406" width="680" height="46" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="58" y="430" font-size="14" fill="#475569" font-family="Consolas, monospace">_layout.tsx</text>
  <text x="170" y="430" font-size="13" fill="#475569">= navigator (marshrut emas)</text>
  <text x="400" y="430" font-size="14" fill="#475569" font-family="Consolas, monospace">+not-found.tsx</text>
  <text x="535" y="430" font-size="13" fill="#475569">= 404 sahifa</text>
</svg>
