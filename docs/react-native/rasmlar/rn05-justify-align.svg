<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="Segoe UI, system-ui, sans-serif">
  <title>justifyContent (asosiy o'q bo'ylab) va alignItems (ko'ndalang o'q bo'ylab) qiymatlarining vizual taqqoslashi</title>
  <rect x="0" y="0" width="760" height="560" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">justifyContent va alignItems</text>

  <!-- justifyContent section header -->
  <text x="380" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#0284c7">justifyContent — asosiy o'q bo'ylab (bu yerda row, chapdan o'ngga)</text>

  <!-- flex-start -->
  <rect x="40" y="76" width="340" height="48" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="48" y="68" font-size="13" font-weight="700" fill="#475569">flex-start</text>
  <rect x="48" y="84" width="28" height="32" rx="4" fill="#0ea5e9"/>
  <rect x="80" y="84" width="28" height="32" rx="4" fill="#0ea5e9"/>
  <rect x="112" y="84" width="28" height="32" rx="4" fill="#0ea5e9"/>

  <!-- center -->
  <rect x="400" y="76" width="340" height="48" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="408" y="68" font-size="13" font-weight="700" fill="#475569">center</text>
  <rect x="528" y="84" width="28" height="32" rx="4" fill="#0ea5e9"/>
  <rect x="560" y="84" width="28" height="32" rx="4" fill="#0ea5e9"/>
  <rect x="592" y="84" width="28" height="32" rx="4" fill="#0ea5e9"/>

  <!-- flex-end -->
  <rect x="40" y="148" width="340" height="48" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="48" y="140" font-size="13" font-weight="700" fill="#475569">flex-end</text>
  <rect x="284" y="156" width="28" height="32" rx="4" fill="#0ea5e9"/>
  <rect x="316" y="156" width="28" height="32" rx="4" fill="#0ea5e9"/>
  <rect x="348" y="156" width="28" height="32" rx="4" fill="#0ea5e9"/>

  <!-- space-between -->
  <rect x="400" y="148" width="340" height="48" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="408" y="140" font-size="13" font-weight="700" fill="#475569">space-between</text>
  <rect x="408" y="156" width="28" height="32" rx="4" fill="#0ea5e9"/>
  <rect x="556" y="156" width="28" height="32" rx="4" fill="#0ea5e9"/>
  <rect x="704" y="156" width="28" height="32" rx="4" fill="#0ea5e9"/>

  <!-- space-around -->
  <rect x="40" y="220" width="340" height="48" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="48" y="212" font-size="13" font-weight="700" fill="#475569">space-around</text>
  <rect x="78" y="228" width="28" height="32" rx="4" fill="#0ea5e9"/>
  <rect x="196" y="228" width="28" height="32" rx="4" fill="#0ea5e9"/>
  <rect x="314" y="228" width="28" height="32" rx="4" fill="#0ea5e9"/>

  <!-- space-evenly -->
  <rect x="400" y="220" width="340" height="48" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="408" y="212" font-size="13" font-weight="700" fill="#475569">space-evenly</text>
  <rect x="466" y="228" width="28" height="32" rx="4" fill="#0ea5e9"/>
  <rect x="556" y="228" width="28" height="32" rx="4" fill="#0ea5e9"/>
  <rect x="646" y="228" width="28" height="32" rx="4" fill="#0ea5e9"/>

  <!-- alignItems section header -->
  <text x="380" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">alignItems — ko'ndalang o'q bo'ylab (asosiy o'qqa ko'ndalang)</text>

  <!-- stretch -->
  <rect x="40" y="334" width="160" height="120" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="120" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">stretch (default)</text>
  <rect x="56" y="362" width="40" height="84" rx="4" fill="#6366f1"/>
  <rect x="104" y="362" width="40" height="84" rx="4" fill="#6366f1"/>
  <rect x="152" y="362" width="40" height="84" rx="4" fill="#6366f1"/>

  <!-- flex-start (cross) -->
  <rect x="220" y="334" width="160" height="120" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="300" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">flex-start</text>
  <rect x="236" y="362" width="40" height="40" rx="4" fill="#6366f1"/>
  <rect x="284" y="362" width="40" height="40" rx="4" fill="#6366f1"/>
  <rect x="332" y="362" width="40" height="40" rx="4" fill="#6366f1"/>

  <!-- center (cross) -->
  <rect x="400" y="334" width="160" height="120" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="480" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">center</text>
  <rect x="416" y="382" width="40" height="40" rx="4" fill="#6366f1"/>
  <rect x="464" y="382" width="40" height="40" rx="4" fill="#6366f1"/>
  <rect x="512" y="382" width="40" height="40" rx="4" fill="#6366f1"/>

  <!-- flex-end (cross) -->
  <rect x="580" y="334" width="160" height="120" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="660" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">flex-end</text>
  <rect x="596" y="406" width="40" height="40" rx="4" fill="#6366f1"/>
  <rect x="644" y="406" width="40" height="40" rx="4" fill="#6366f1"/>
  <rect x="692" y="406" width="40" height="40" rx="4" fill="#6366f1"/>

  <!-- bottom tip -->
  <rect x="40" y="486" width="700" height="54" rx="10" fill="#fef9c3" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="60" y="510" font-size="13" font-weight="700" fill="#b45309">Markazga qo'yish:</text>
  <text x="60" y="530" font-size="13" fill="#475569">justifyContent: 'center' + alignItems: 'center' — har ikki o'q bo'ylab markazda</text>
</svg>
