<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" font-family="Segoe UI, system-ui, sans-serif">
  <title>FlatList anatomiyasi: data massivi, renderItem funksiyasi va keyExtractor birlashib telefondagi ro'yxat ko'rinishini hosil qiladi</title>
  <rect x="0" y="0" width="760" height="500" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">FlatList anatomiyasi</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">Uch asosiy prop birlashib ro'yxatni chizadi</text>

  <!-- data -->
  <rect x="36" y="86" width="230" height="120" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="36" y="86" width="230" height="34" rx="12" fill="#e0e7ff"/>
  <text x="151" y="109" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">data = massiv</text>
  <text x="52" y="142" font-size="13" fill="#475569">[{ id: 1, nomi: 'Non' },</text>
  <text x="52" y="164" font-size="13" fill="#475569">&#160;{ id: 2, nomi: 'Sut' },</text>
  <text x="52" y="186" font-size="13" fill="#475569">&#160;{ id: 3, nomi: 'Tuxum' }]</text>

  <!-- keyExtractor -->
  <rect x="36" y="222" width="230" height="96" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <rect x="36" y="222" width="230" height="34" rx="12" fill="#e0f2fe"/>
  <text x="151" y="245" text-anchor="middle" font-size="15" font-weight="700" fill="#0284c7">keyExtractor</text>
  <text x="52" y="278" font-size="13" fill="#475569">(item) =&gt;</text>
  <text x="52" y="299" font-size="13" fill="#475569">&#160;&#160;item.id.toString()</text>
  <text x="151" y="335" text-anchor="middle" font-size="13" fill="#94a3b8">har element uchun noyob kalit</text>

  <!-- renderItem -->
  <rect x="36" y="354" width="230" height="118" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="36" y="354" width="230" height="34" rx="12" fill="#dcfce7"/>
  <text x="151" y="377" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">renderItem</text>
  <text x="52" y="410" font-size="13" fill="#475569">({ item }) =&gt;</text>
  <text x="52" y="431" font-size="13" fill="#475569">&#160;&#160;&lt;Text&gt;{item.nomi}&lt;/Text&gt;</text>
  <text x="151" y="461" text-anchor="middle" font-size="13" fill="#94a3b8">har element qanday ko'rinadi</text>

  <!-- O'qlar -->
  <line x1="270" y1="240" x2="320" y2="240" stroke="#475569" stroke-width="2.5"/>
  <polygon points="320,240 308,233 308,247" fill="#475569"/>
  <text x="295" y="228" text-anchor="middle" font-size="13" fill="#475569">FlatList</text>

  <!-- Telefon mokap -->
  <rect x="500" y="80" width="220" height="392" rx="28" fill="#1e293b"/>
  <rect x="512" y="100" width="196" height="352" rx="10" fill="#ffffff"/>
  <!-- status bar -->
  <rect x="512" y="100" width="196" height="34" rx="10" fill="#4f46e5"/>
  <text x="610" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Xaridlar ro'yxati</text>

  <!-- 1-element -->
  <rect x="524" y="148" width="172" height="56" rx="10" fill="#f8fafc" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="540" y="182" font-size="15" fill="#1e293b">Non</text>
  <text x="684" y="182" text-anchor="end" font-size="13" fill="#94a3b8">key: 1</text>

  <rect x="524" y="216" width="172" height="56" rx="10" fill="#f8fafc" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="540" y="250" font-size="15" fill="#1e293b">Sut</text>
  <text x="684" y="250" text-anchor="end" font-size="13" fill="#94a3b8">key: 2</text>

  <rect x="524" y="284" width="172" height="56" rx="10" fill="#f8fafc" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="540" y="318" font-size="15" fill="#1e293b">Tuxum</text>
  <text x="684" y="318" text-anchor="end" font-size="13" fill="#94a3b8">key: 3</text>

  <text x="610" y="372" text-anchor="middle" font-size="13" fill="#94a3b8" font-style="italic">har element = bitta karta</text>

  <!-- home indicator -->
  <rect x="572" y="436" width="76" height="6" rx="3" fill="#cbd5e1"/>
</svg>
