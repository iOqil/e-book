<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Segoe UI, system-ui, sans-serif">
  <title>flexDirection column (React Native default, yuqoridan pastga) va row (gorizontal) farqi</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">flexDirection: column vs row</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">React Native'da DEFAULT = column (web'da row edi) — eng muhim farq!</text>

  <!-- LEFT: column (default) -->
  <rect x="50" y="84" width="310" height="312" rx="14" fill="#ffffff" stroke="#0ea5e9" stroke-width="2.5"/>
  <text x="205" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#0284c7">column  (default)</text>
  <text x="205" y="134" text-anchor="middle" font-size="13" fill="#475569">elementlar yuqoridan pastga</text>

  <!-- column boxes stacked vertically -->
  <rect x="95" y="150" width="220" height="56" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="205" y="184" text-anchor="middle" font-size="15" font-weight="700" fill="#0284c7">1</text>
  <rect x="95" y="216" width="220" height="56" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="205" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#0284c7">2</text>
  <rect x="95" y="282" width="220" height="56" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="205" y="316" text-anchor="middle" font-size="15" font-weight="700" fill="#0284c7">3</text>

  <!-- main axis arrow (down) -->
  <line x1="72" y1="150" x2="72" y2="332" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="72,340 66,328 78,328" fill="#16a34a"/>
  <text x="68" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">asosiy o'q</text>

  <!-- RIGHT: row -->
  <rect x="400" y="84" width="310" height="312" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="555" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#4f46e5">row</text>
  <text x="555" y="134" text-anchor="middle" font-size="13" fill="#475569">elementlar chapdan o'ngga</text>

  <!-- row boxes side by side -->
  <rect x="430" y="170" width="80" height="120" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="470" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">1</text>
  <rect x="518" y="170" width="80" height="120" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="558" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">2</text>
  <rect x="606" y="170" width="80" height="120" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="646" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">3</text>

  <!-- main axis arrow (right) -->
  <line x1="430" y1="312" x2="668" y2="312" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="676,312 664,306 664,318" fill="#16a34a"/>
  <text x="555" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">asosiy o'q</text>

  <text x="380" y="418" text-anchor="middle" font-size="13" fill="#94a3b8">flexDirection asosiy o'q yo'nalishini belgilaydi — justifyContent shu o'q bo'ylab joylashtiradi</text>
</svg>
