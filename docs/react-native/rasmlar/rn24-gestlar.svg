<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Gestlar: Pan (surish), Tap (bosish), Pinch (cho'zish), LongPress (uzoq bosish) va GestureDetector ularni elementga bog'laydi (telefon mokap)</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Gestlar — barmoq harakatlarini tushunish</text>

  <!-- Telefon mokap -->
  <rect x="60" y="70" width="220" height="360" rx="28" fill="#ffffff" stroke="#0ea5e9" stroke-width="3"/>
  <rect x="78" y="96" width="184" height="308" rx="12" fill="#f0f9ff"/>
  <text x="170" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#0369a1">GestureDetector</text>

  <!-- suriladigan karta ichida -->
  <rect x="100" y="200" width="140" height="80" rx="14" fill="#0ea5e9"/>
  <text x="170" y="245" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Kartochka</text>
  <!-- surish strelkasi -->
  <line x1="130" y1="320" x2="220" y2="320" stroke="#4f46e5" stroke-width="3" stroke-dasharray="6 5"/>
  <polygon points="220,320 206,313 206,327" fill="#4f46e5"/>
  <circle cx="125" cy="320" r="11" fill="#6366f1"/>
  <text x="170" y="350" text-anchor="middle" font-size="13" fill="#475569">barmoq suriladi (Pan)</text>

  <!-- O'NG: 4 gest -->
  <rect x="320" y="80" width="420" height="78" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="350" y="112" font-size="16" font-weight="700" fill="#4f46e5">Gesture.Pan()</text>
  <text x="350" y="138" font-size="13" fill="#475569">surish — barmoqni siljitish (eng ko'p)</text>

  <rect x="320" y="170" width="420" height="78" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="350" y="202" font-size="16" font-weight="700" fill="#0369a1">Gesture.Tap()</text>
  <text x="350" y="228" font-size="13" fill="#475569">bir bosish — tez tegib olish</text>

  <rect x="320" y="260" width="420" height="78" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="350" y="292" font-size="16" font-weight="700" fill="#16a34a">Gesture.Pinch()</text>
  <text x="350" y="318" font-size="13" fill="#475569">chimchilab cho'zish — ikki barmoq (e.scale)</text>

  <rect x="320" y="350" width="420" height="78" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="350" y="382" font-size="16" font-weight="700" fill="#b45309">Gesture.LongPress()</text>
  <text x="350" y="408" font-size="13" fill="#475569">uzoq bosish — menyu, tanlash</text>

  <!-- bog'lovchi strelka telefondan gestlarga -->
  <line x1="280" y1="135" x2="316" y2="119" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="316,119 302,118 307,130" fill="#94a3b8"/>
</svg>
