<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>useState ilova yopilganda yo'qoladi, lokal saqlash esa qoladi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Ilova yopilganda nima bo'ladi?</text>

  <!-- LEFT: useState -->
  <rect x="30" y="64" width="340" height="372" rx="14" fill="#ffffff" stroke="#fecaca" stroke-width="2"/>
  <text x="200" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">useState (vaqtinchalik xotira)</text>

  <!-- phone open with data -->
  <rect x="64" y="110" width="120" height="150" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <rect x="76" y="126" width="96" height="118" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="124" y="146" text-anchor="middle" font-size="13" fill="#475569">Ochiq</text>
  <rect x="84" y="156" width="80" height="16" rx="4" fill="#e0f2fe"/>
  <rect x="84" y="178" width="80" height="16" rx="4" fill="#e0f2fe"/>
  <rect x="84" y="200" width="80" height="16" rx="4" fill="#e0f2fe"/>
  <text x="124" y="234" text-anchor="middle" font-size="13" fill="#16a34a">3 vazifa bor</text>

  <!-- arrow + close -->
  <text x="218" y="190" text-anchor="middle" font-size="22" fill="#dc2626">&#8594;</text>
  <text x="218" y="210" text-anchor="middle" font-size="13" fill="#dc2626">yopildi</text>

  <!-- phone closed empty -->
  <rect x="246" y="110" width="120" height="150" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <rect x="258" y="126" width="96" height="118" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
  <text x="306" y="146" text-anchor="middle" font-size="13" fill="#475569">Qayta ochildi</text>
  <text x="306" y="195" text-anchor="middle" font-size="26" fill="#94a3b8">&#9633;</text>
  <text x="306" y="234" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">Bo'm-bo'sh!</text>

  <text x="200" y="296" text-anchor="middle" font-size="14" fill="#475569">Holat faqat ilova ishlaganda</text>
  <text x="200" y="316" text-anchor="middle" font-size="14" fill="#475569">yashaydi. Yopilsa &#8212; o'chadi.</text>
  <rect x="64" y="338" width="272" height="78" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="200" y="365" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">Doskaga bo'r bilan yozish</text>
  <text x="200" y="388" text-anchor="middle" font-size="13" fill="#475569">dars tugab doska artilsa</text>
  <text x="200" y="406" text-anchor="middle" font-size="13" fill="#475569">yozuv yo'qoladi</text>

  <!-- RIGHT: lokal saqlash -->
  <rect x="390" y="64" width="340" height="372" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
  <text x="560" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">Lokal saqlash (disk)</text>

  <rect x="424" y="110" width="120" height="150" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <rect x="436" y="126" width="96" height="118" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="484" y="146" text-anchor="middle" font-size="13" fill="#475569">Ochiq</text>
  <rect x="444" y="156" width="80" height="16" rx="4" fill="#e0f2fe"/>
  <rect x="444" y="178" width="80" height="16" rx="4" fill="#e0f2fe"/>
  <rect x="444" y="200" width="80" height="16" rx="4" fill="#e0f2fe"/>
  <text x="484" y="234" text-anchor="middle" font-size="13" fill="#16a34a">diskka yozildi</text>

  <text x="578" y="184" text-anchor="middle" font-size="22" fill="#16a34a">&#8594;</text>
  <text x="578" y="204" text-anchor="middle" font-size="13" fill="#16a34a">yopildi</text>

  <rect x="606" y="110" width="120" height="150" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <rect x="618" y="126" width="96" height="118" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="666" y="146" text-anchor="middle" font-size="13" fill="#475569">Qayta ochildi</text>
  <rect x="626" y="156" width="80" height="16" rx="4" fill="#dcfce7"/>
  <rect x="626" y="178" width="80" height="16" rx="4" fill="#dcfce7"/>
  <rect x="626" y="200" width="80" height="16" rx="4" fill="#dcfce7"/>
  <text x="666" y="234" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">3 vazifa joyida!</text>

  <text x="560" y="296" text-anchor="middle" font-size="14" fill="#475569">Disk &#8212; doimiy xotira. Yopilsa</text>
  <text x="560" y="316" text-anchor="middle" font-size="14" fill="#475569">ham qoladi, qayta yuklanadi.</text>
  <rect x="424" y="338" width="272" height="78" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="560" y="365" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">Daftarga ko'chirish</text>
  <text x="560" y="388" text-anchor="middle" font-size="13" fill="#475569">yozuv saqlanadi, keyin</text>
  <text x="560" y="406" text-anchor="middle" font-size="13" fill="#475569">qayta o'qib olish mumkin</text>
</svg>
