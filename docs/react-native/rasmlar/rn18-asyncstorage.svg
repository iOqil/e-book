<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>AsyncStorage setItem va getItem oqimi JSON.stringify va JSON.parse bilan</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">AsyncStorage: saqlash va o'qish oqimi</text>

  <!-- Center: disk -->
  <rect x="300" y="180" width="160" height="100" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="380" y="218" text-anchor="middle" font-size="16" font-weight="700" fill="#4f46e5">Disk (xotira)</text>
  <text x="380" y="244" text-anchor="middle" font-size="13" fill="#475569">kalit &#8594; matn</text>
  <text x="380" y="264" text-anchor="middle" font-size="13" fill="#94a3b8">"sozlama" : "{...}"</text>

  <!-- TOP: SAQLASH -->
  <text x="100" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">SAQLASH (setItem)</text>

  <rect x="40" y="100" width="180" height="64" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
  <text x="130" y="128" text-anchor="middle" font-size="14" fill="#1e293b">JS obyekt / massiv</text>
  <text x="130" y="150" text-anchor="middle" font-size="13" fill="#94a3b8">{ tema: 'dark' }</text>

  <!-- arrow obyekt -> stringify -->
  <line x1="220" y1="132" x2="268" y2="132" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="268,132 258,127 258,137" fill="#16a34a"/>

  <rect x="270" y="100" width="170" height="64" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="355" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">JSON.stringify</text>
  <text x="355" y="146" text-anchor="middle" font-size="13" fill="#475569">obyekt &#8594; matn</text>

  <!-- arrow stringify -> setItem -->
  <line x1="440" y1="132" x2="500" y2="132" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="500,132 490,127 490,137" fill="#16a34a"/>

  <rect x="502" y="100" width="218" height="64" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="611" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">await setItem(kalit, matn)</text>
  <text x="611" y="146" text-anchor="middle" font-size="13" fill="#475569">asinxron &#8212; diskka yozadi</text>

  <!-- arrow setItem -> disk -->
  <line x1="540" y1="164" x2="448" y2="208" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="448,208 460,206 455,196" fill="#16a34a"/>

  <!-- BOTTOM: O'QISH -->
  <text x="100" y="338" text-anchor="middle" font-size="16" font-weight="700" fill="#0ea5e9">O'QISH (getItem)</text>

  <rect x="502" y="350" width="218" height="64" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="611" y="375" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">await getItem(kalit)</text>
  <text x="611" y="396" text-anchor="middle" font-size="13" fill="#475569">matn YOKI null qaytaradi</text>

  <!-- arrow disk -> getItem -->
  <line x1="455" y1="264" x2="552" y2="346" stroke="#0ea5e9" stroke-width="2.5"/>
  <polygon points="552,346 540,344 545,335" fill="#0ea5e9"/>

  <!-- arrow getItem -> parse -->
  <line x1="500" y1="382" x2="442" y2="382" stroke="#0ea5e9" stroke-width="2.5"/>
  <polygon points="442,382 452,377 452,387" fill="#0ea5e9"/>

  <rect x="270" y="350" width="170" height="64" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="355" y="375" text-anchor="middle" font-size="14" font-weight="700" fill="#0ea5e9">JSON.parse</text>
  <text x="355" y="396" text-anchor="middle" font-size="13" fill="#475569">matn &#8594; obyekt</text>

  <!-- arrow parse -> obyekt -->
  <line x1="270" y1="382" x2="222" y2="382" stroke="#0ea5e9" stroke-width="2.5"/>
  <polygon points="222,382 232,377 232,387" fill="#0ea5e9"/>

  <rect x="40" y="350" width="180" height="64" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
  <text x="130" y="375" text-anchor="middle" font-size="14" fill="#1e293b">JS obyekt qayta tayyor</text>
  <text x="130" y="396" text-anchor="middle" font-size="13" fill="#94a3b8">null bo'lsa tekshir!</text>

  <!-- note -->
  <text x="380" y="312" text-anchor="middle" font-size="13" fill="#94a3b8">Disk faqat MATN (string) saqlaydi &#8212; shuning uchun JSON kerak</text>
</svg>
