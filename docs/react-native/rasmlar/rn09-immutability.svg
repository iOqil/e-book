<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Immutability: yangi massiv yaratish (to'g'ri, React sezadi) va eski massivni push bilan o'zgartirish (xato, React sezmaydi)</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Immutability — nega yangi nusxa kerak?</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">React o'zgarishni HAVOLA (manzil) bo'yicha sezadi, ichidagi qiymatlarni emas</text>

  <!-- LEFT: TO'G'RI -->
  <rect x="40" y="84" width="330" height="334" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="205" y="114" text-anchor="middle" font-size="17" font-weight="700" fill="#15803d">TO'G'RI — yangi massiv</text>
  <rect x="64" y="130" width="282" height="30" rx="6" fill="#dcfce7"/>
  <text x="205" y="150" text-anchor="middle" font-size="14" fill="#15803d" font-family="monospace">setRoyxat([...royxat, yangi])</text>

  <!-- old array box -->
  <rect x="70" y="180" width="120" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="130" y="202" text-anchor="middle" font-size="13" fill="#475569">eski</text>
  <text x="130" y="226" text-anchor="middle" font-size="13" fill="#94a3b8">manzil #A1</text>
  <!-- new array box -->
  <rect x="220" y="180" width="120" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="280" y="202" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">yangi</text>
  <text x="280" y="226" text-anchor="middle" font-size="13" fill="#15803d">manzil #B2</text>

  <text x="205" y="278" text-anchor="middle" font-size="14" fill="#475569">manzil o'zgardi: #A1 -> #B2</text>
  <rect x="64" y="296" width="282" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="205" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">React: "manzil boshqa!"</text>
  <rect x="64" y="354" width="282" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="205" y="382" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">-> qayta chizadi (re-render)</text>

  <!-- RIGHT: XATO -->
  <rect x="390" y="84" width="330" height="334" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
  <text x="555" y="114" text-anchor="middle" font-size="17" font-weight="700" fill="#dc2626">XATO — eski massivni o'zgartirish</text>
  <rect x="414" y="130" width="282" height="30" rx="6" fill="#fee2e2"/>
  <text x="555" y="150" text-anchor="middle" font-size="14" fill="#dc2626" font-family="monospace">royxat.push(yangi)</text>

  <!-- same array box mutated -->
  <rect x="495" y="180" width="120" height="64" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="555" y="202" text-anchor="middle" font-size="13" fill="#dc2626">o'zgartirildi</text>
  <text x="555" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">manzil #A1</text>

  <text x="555" y="278" text-anchor="middle" font-size="14" fill="#475569">manzil o'zgarmadi: #A1 -> #A1</text>
  <rect x="414" y="296" width="282" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="555" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">React: "manzil o'sha-o'sha"</text>
  <rect x="414" y="354" width="282" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="555" y="382" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">-> ekran YANGILANMAYDI</text>

  <text x="380" y="446" text-anchor="middle" font-size="13" fill="#94a3b8">Qoida: massiv/obyektni hech qachon to'g'ridan o'zgartirma — har doim yangi nusxa yarat</text>
</svg>
