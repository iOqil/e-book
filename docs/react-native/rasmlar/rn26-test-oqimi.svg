<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" font-family="Segoe UI, system-ui, sans-serif">
  <title>Test oqimi: render qilish, getByText/press/changeText bilan muloqot, expect bilan tekshirish, natijada yashil (o'tdi) yoki qizil (yiqildi)</title>
  <rect x="0" y="0" width="760" height="480" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Komponent testi oqimi</text>
  <text x="380" y="62" text-anchor="middle" font-size="14" fill="#475569">render → so'rov → harakat → tekshiruv</text>

  <!-- 1. render -->
  <rect x="40" y="92" width="320" height="86" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <rect x="40" y="92" width="320" height="32" rx="12" fill="#e0f2fe"/>
  <text x="200" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#0284c7">1. render</text>
  <text x="58" y="150" font-size="14" fill="#475569">await render(&lt;Komponent /&gt;)</text>
  <text x="58" y="170" font-size="13" fill="#94a3b8">komponentni xotirada chizadi (await!)</text>

  <!-- 2. so'rov -->
  <rect x="40" y="194" width="320" height="86" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="40" y="194" width="320" height="32" rx="12" fill="#e0e7ff"/>
  <text x="200" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">2. so'rov</text>
  <text x="58" y="252" font-size="14" fill="#475569">screen.getByText / getByTestId</text>
  <text x="58" y="272" font-size="13" fill="#94a3b8">elementni topadi</text>

  <!-- 3. harakat -->
  <rect x="40" y="296" width="320" height="86" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <rect x="40" y="296" width="320" height="32" rx="12" fill="#fef3c7"/>
  <text x="200" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">3. harakat</text>
  <text x="58" y="354" font-size="14" fill="#475569">await fireEvent.press / changeText</text>
  <text x="58" y="374" font-size="13" fill="#94a3b8">foydalanuvchini taqlid qiladi</text>

  <!-- 4. tekshiruv -->
  <rect x="40" y="398" width="320" height="62" rx="12" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text x="200" y="426" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">4. expect(...).matcher(...)</text>
  <text x="200" y="448" text-anchor="middle" font-size="13" fill="#94a3b8">kutilgan natijani tekshiradi</text>

  <!-- vertikal o'qlar chap blok orasida -->
  <line x1="200" y1="178" x2="200" y2="194" stroke="#475569" stroke-width="2"/>
  <polygon points="200,194 194,184 206,184" fill="#475569"/>
  <line x1="200" y1="280" x2="200" y2="296" stroke="#475569" stroke-width="2"/>
  <polygon points="200,296 194,286 206,286" fill="#475569"/>
  <line x1="200" y1="382" x2="200" y2="398" stroke="#475569" stroke-width="2"/>
  <polygon points="200,398 194,388 206,388" fill="#475569"/>

  <!-- natija o'qi o'ngga -->
  <line x1="360" y1="429" x2="430" y2="429" stroke="#475569" stroke-width="2.5"/>
  <polygon points="430,429 418,422 418,436" fill="#475569"/>

  <!-- natija: yashil -->
  <rect x="450" y="180" width="270" height="110" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <circle cx="500" cy="222" r="18" fill="#16a34a"/>
  <path d="M492 222 l6 7 l11 -14" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="530" y="218" font-size="17" font-weight="700" fill="#16a34a">PASS — o'tdi</text>
  <text x="530" y="240" font-size="13" fill="#475569">mos keldi</text>
  <text x="470" y="272" font-size="13" fill="#475569">Tests: 11 passed — yashil</text>

  <!-- natija: qizil -->
  <rect x="450" y="306" width="270" height="110" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="500" cy="348" r="18" fill="#dc2626"/>
  <path d="M493 341 l14 14 M507 341 l-14 14" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <text x="530" y="344" font-size="17" font-weight="700" fill="#dc2626">FAIL — yiqildi</text>
  <text x="530" y="366" font-size="13" fill="#475569">mos kelmadi</text>
  <text x="470" y="398" font-size="13" fill="#475569">Expected / Received farqi</text>
</svg>
