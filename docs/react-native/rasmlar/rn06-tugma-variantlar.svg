<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Tugma variantlari: Button vs Pressable vs TouchableOpacity taqqoslash</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Tugmaning 3 varianti</text>
  <text x="380" y="64" text-anchor="middle" font-size="14" fill="#475569">Qaysi birini tanlash kerak? Pressable — zamonaviy tavsiya</text>

  <!-- Button -->
  <rect x="40" y="92" width="220" height="330" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="150" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#475569">&lt;Button&gt;</text>
  <rect x="78" y="142" width="144" height="42" rx="6" fill="#4f46e5"/>
  <text x="150" y="169" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Bos</text>
  <text x="150" y="208" text-anchor="middle" font-size="13" fill="#16a34a">Eng oddiy</text>
  <text x="60" y="240" font-size="13" fill="#475569">+ bir qatorda tayyor</text>
  <text x="60" y="264" font-size="13" fill="#475569">+ title + onPress</text>
  <text x="60" y="296" font-size="13" fill="#dc2626">- stil cheklangan</text>
  <text x="60" y="320" font-size="13" fill="#dc2626">- ichiga ikonka qo'shib</text>
  <text x="60" y="338" font-size="13" fill="#dc2626">&#160;&#160;bo'lmaydi</text>
  <text x="60" y="370" font-size="13" fill="#dc2626">- platformaga qarab</text>
  <text x="60" y="388" font-size="13" fill="#dc2626">&#160;&#160;turlicha ko'rinadi</text>
  <text x="150" y="412" text-anchor="middle" font-size="13" fill="#94a3b8">tez prototip uchun</text>

  <!-- Pressable -->
  <rect x="280" y="92" width="220" height="330" rx="14" fill="#ffffff" stroke="#0ea5e9" stroke-width="3"/>
  <rect x="280" y="92" width="220" height="30" rx="14" fill="#0ea5e9"/>
  <text x="390" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">TAVSIYA ETILADI</text>
  <text x="390" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#0284c7">&lt;Pressable&gt;</text>
  <rect x="318" y="166" width="144" height="46" rx="12" fill="#0ea5e9"/>
  <text x="390" y="195" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Bos meni</text>
  <text x="390" y="234" text-anchor="middle" font-size="13" fill="#16a34a">Zamonaviy, kuchli</text>
  <text x="300" y="266" font-size="13" fill="#475569">+ to'liq stil erkinligi</text>
  <text x="300" y="290" font-size="13" fill="#475569">+ View/Text/ikonka ichida</text>
  <text x="300" y="314" font-size="13" fill="#475569">+ pressed holatiga stil</text>
  <text x="300" y="338" font-size="13" fill="#475569">+ onLongPress, PressIn/Out</text>
  <text x="300" y="362" font-size="13" fill="#475569">+ ikkala platformada bir xil</text>
  <text x="390" y="396" text-anchor="middle" font-size="13" font-weight="600" fill="#0284c7">deyarli hamma joyda</text>

  <!-- TouchableOpacity -->
  <rect x="520" y="92" width="220" height="330" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="630" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#475569">&lt;TouchableOpacity&gt;</text>
  <rect x="558" y="142" width="144" height="46" rx="12" fill="#0ea5e9" opacity="0.6"/>
  <text x="630" y="171" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Eski tugma</text>
  <text x="630" y="210" text-anchor="middle" font-size="13" fill="#f59e0b">Eski, hali ishlatiladi</text>
  <text x="540" y="242" font-size="13" fill="#475569">+ stil beriladi</text>
  <text x="540" y="266" font-size="13" fill="#475569">+ bosilganda xira bo'ladi</text>
  <text x="540" y="290" font-size="13" fill="#475569">&#160;&#160;(activeOpacity)</text>
  <text x="540" y="322" font-size="13" fill="#dc2626">- eski kod bazalarida</text>
  <text x="540" y="346" font-size="13" fill="#dc2626">- Pressable uni qoplaydi</text>
  <text x="630" y="394" text-anchor="middle" font-size="13" fill="#94a3b8">eski loyihalarda uchraydi</text>

  <text x="380" y="450" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Yangi loyiha boshlayotgan bo'lsangiz — Pressable</text>
</svg>
