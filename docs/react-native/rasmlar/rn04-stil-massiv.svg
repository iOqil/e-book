<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Stil massivi: bazaviy stil va shartli stilni birlashtirish, oxirgi stil ustun keladi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Stil massivi: birlashtirish va shartli stil</text>

  <text x="380" y="64" text-anchor="middle" font-size="14" fill="#475569" font-family="Consolas, monospace">style={[ styles.tugma, faol &amp;&amp; styles.faol ]}</text>

  <!-- base style -->
  <rect x="40" y="92" width="200" height="150" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <rect x="40" y="92" width="200" height="36" rx="12" fill="#e0f2fe"/>
  <text x="140" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#0284c7">styles.tugma (baza)</text>
  <text x="58" y="152" font-size="13" fill="#475569" font-family="Consolas, monospace">padding: 12,</text>
  <text x="58" y="176" font-size="13" fill="#475569" font-family="Consolas, monospace">borderRadius: 10,</text>
  <text x="58" y="200" font-size="13" fill="#475569" font-family="Consolas, monospace">backgroundColor:</text>
  <text x="58" y="218" font-size="13" fill="#475569" font-family="Consolas, monospace">  '#e2e8f0'</text>

  <!-- plus -->
  <text x="270" y="175" text-anchor="middle" font-size="30" font-weight="700" fill="#94a3b8">+</text>

  <!-- conditional style -->
  <rect x="300" y="92" width="200" height="150" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="300" y="92" width="200" height="36" rx="12" fill="#e0e7ff"/>
  <text x="400" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">styles.faol (shartli)</text>
  <text x="318" y="152" font-size="13" fill="#94a3b8" font-family="Consolas, monospace">faqat faol === true</text>
  <text x="318" y="170" font-size="13" fill="#94a3b8" font-family="Consolas, monospace">bo'lganda qo'shiladi</text>
  <text x="318" y="200" font-size="13" fill="#475569" font-family="Consolas, monospace">backgroundColor:</text>
  <text x="318" y="218" font-size="13" fill="#475569" font-family="Consolas, monospace">  '#4f46e5'</text>

  <!-- equals arrow -->
  <text x="530" y="175" text-anchor="middle" font-size="26" font-weight="700" fill="#94a3b8">=</text>

  <!-- result -->
  <rect x="560" y="92" width="170" height="150" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <rect x="560" y="92" width="170" height="36" rx="12" fill="#dcfce7"/>
  <text x="645" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">Yakuniy stil</text>
  <text x="578" y="152" font-size="13" fill="#475569" font-family="Consolas, monospace">padding: 12,</text>
  <text x="578" y="176" font-size="13" fill="#475569" font-family="Consolas, monospace">borderRadius: 10,</text>
  <text x="578" y="200" font-size="13" fill="#475569" font-family="Consolas, monospace">bgColor:</text>
  <text x="578" y="218" font-size="13" font-weight="700" fill="#4f46e5" font-family="Consolas, monospace">  '#4f46e5'</text>

  <!-- rule -->
  <rect x="40" y="270" width="690" height="40" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="385" y="295" text-anchor="middle" font-size="14" font-weight="600" fill="#b45309">Qoida: massivda oxirgi stil ustun keladi (bir xil xossa qayta yoziladi)</text>

  <!-- two button states -->
  <text x="200" y="344" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">faol = false</text>
  <rect x="120" y="356" width="160" height="56" rx="10" fill="#e2e8f0"/>
  <text x="200" y="390" text-anchor="middle" font-size="16" font-weight="600" fill="#475569">Tugma</text>

  <text x="560" y="344" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">faol = true</text>
  <rect x="480" y="356" width="160" height="56" rx="10" fill="#4f46e5"/>
  <text x="560" y="390" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">Tugma</text>

  <text x="380" y="392" text-anchor="middle" font-size="22" fill="#94a3b8">-&gt;</text>

  <text x="380" y="444" text-anchor="middle" font-size="13" fill="#16a34a" font-weight="600">Bir xil komponent, holatga qarab ikki xil ko'rinish</text>
</svg>
