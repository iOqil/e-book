<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Reanimated animatsiyani UI ip-tolasida bajaradi (JS band bo'lsa ham silliq), eski Animated esa JS ipida band bo'lsa to'xtab-to'xtab ketadi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Nega Reanimated silliq? — ip-tolalar</text>

  <!-- CHAP: eski Animated -->
  <rect x="30" y="70" width="340" height="360" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="200" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">Eski Animated — bitta yo'lak</text>

  <rect x="56" y="120" width="288" height="120" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="200" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">JS ip-tolasi (band!)</text>
  <text x="200" y="170" text-anchor="middle" font-size="13" fill="#475569">holat, useEffect, API,</text>
  <text x="200" y="190" text-anchor="middle" font-size="13" fill="#475569">ro'yxat hisobi...</text>
  <text x="200" y="218" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">+ animatsiya HAM shu yerda</text>

  <!-- to'xtab-to'xtab kadrlar -->
  <rect x="56" y="262" width="288" height="60" rx="8" fill="#fee2e2"/>
  <text x="200" y="286" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">Natija: to'xtab-to'xtab</text>
  <text x="200" y="306" text-anchor="middle" font-size="13" fill="#991b1b">(lag) animatsiya</text>
  <rect x="70" y="335" width="24" height="60" rx="3" fill="#dc2626"/>
  <rect x="110" y="355" width="24" height="40" rx="3" fill="#dc2626"/>
  <rect x="150" y="345" width="24" height="50" rx="3" fill="#dc2626"/>
  <rect x="190" y="375" width="24" height="20" rx="3" fill="#dc2626"/>
  <rect x="230" y="350" width="24" height="45" rx="3" fill="#dc2626"/>
  <rect x="270" y="380" width="24" height="15" rx="3" fill="#dc2626"/>
  <text x="200" y="415" text-anchor="middle" font-size="13" fill="#991b1b">notekis kadrlar</text>

  <!-- O'NG: Reanimated -->
  <rect x="390" y="70" width="340" height="360" rx="14" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="560" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#0369a1">Reanimated — ikki yo'lak</text>

  <rect x="416" y="120" width="288" height="74" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="560" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">JS ip-tolasi (band bo'lsa ham)</text>
  <text x="560" y="172" text-anchor="middle" font-size="13" fill="#94a3b8">holat, API, hisob...</text>

  <rect x="416" y="206" width="288" height="74" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="560" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">UI ip-tolasi (worklet)</text>
  <text x="560" y="258" text-anchor="middle" font-size="13" fill="#475569">animatsiya ALOHIDA yo'lakda</text>

  <!-- silliq kadrlar -->
  <rect x="416" y="300" width="288" height="50" rx="8" fill="#dcfce7"/>
  <text x="560" y="330" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">Natija: har doim silliq (60 fps)</text>
  <rect x="430" y="360" width="24" height="55" rx="3" fill="#16a34a"/>
  <rect x="470" y="360" width="24" height="55" rx="3" fill="#16a34a"/>
  <rect x="510" y="360" width="24" height="55" rx="3" fill="#16a34a"/>
  <rect x="550" y="360" width="24" height="55" rx="3" fill="#16a34a"/>
  <rect x="590" y="360" width="24" height="55" rx="3" fill="#16a34a"/>
  <rect x="630" y="360" width="24" height="55" rx="3" fill="#16a34a"/>
  <rect x="670" y="360" width="24" height="55" rx="3" fill="#16a34a"/>
</svg>
