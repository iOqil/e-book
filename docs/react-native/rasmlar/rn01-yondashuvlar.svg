<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Mobil ilova yaratish yo'llari: Native, Web/PWA va Cross-platform (React Native) taqqoslash</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Mobil ilova yaratishning uch yo'li</text>

  <!-- Native column -->
  <rect x="30" y="64" width="222" height="370" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="30" y="64" width="222" height="46" rx="14" fill="#fee2e2"/>
  <text x="141" y="94" text-anchor="middle" font-size="18" font-weight="700" fill="#dc2626">Native</text>
  <text x="141" y="132" text-anchor="middle" font-size="14" fill="#475569">Kotlin/Java (Android)</text>
  <text x="141" y="154" text-anchor="middle" font-size="14" fill="#475569">Swift (iOS)</text>

  <text x="50" y="192" font-size="14" font-weight="600" fill="#1e293b">Tillar soni</text>
  <text x="232" y="192" text-anchor="end" font-size="15" font-weight="700" fill="#dc2626">2 ta</text>
  <text x="50" y="224" font-size="14" font-weight="600" fill="#1e293b">Narx / vaqt</text>
  <text x="232" y="224" text-anchor="end" font-size="15" font-weight="700" fill="#dc2626">Yuqori</text>
  <text x="50" y="256" font-size="14" font-weight="600" fill="#1e293b">Kod bazasi</text>
  <text x="232" y="256" text-anchor="end" font-size="15" font-weight="700" fill="#dc2626">2 ta</text>
  <text x="50" y="288" font-size="14" font-weight="600" fill="#1e293b">Native his</text>
  <text x="232" y="288" text-anchor="end" font-size="15" font-weight="700" fill="#16a34a">A'lo</text>

  <text x="141" y="360" text-anchor="middle" font-size="13" fill="#94a3b8">Eng tez, ammo</text>
  <text x="141" y="380" text-anchor="middle" font-size="13" fill="#94a3b8">ikki marta ish:</text>
  <text x="141" y="400" text-anchor="middle" font-size="13" fill="#94a3b8">qimmat va sekin</text>

  <!-- Web/PWA column -->
  <rect x="269" y="64" width="222" height="370" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <rect x="269" y="64" width="222" height="46" rx="14" fill="#fef3c7"/>
  <text x="380" y="94" text-anchor="middle" font-size="18" font-weight="700" fill="#b45309">Web / PWA</text>
  <text x="380" y="132" text-anchor="middle" font-size="14" fill="#475569">HTML, CSS, JS</text>
  <text x="380" y="154" text-anchor="middle" font-size="14" fill="#475569">brauzerda ishlaydi</text>

  <text x="289" y="192" font-size="14" font-weight="600" fill="#1e293b">Tillar soni</text>
  <text x="471" y="192" text-anchor="end" font-size="15" font-weight="700" fill="#16a34a">1 ta</text>
  <text x="289" y="224" font-size="14" font-weight="600" fill="#1e293b">Narx / vaqt</text>
  <text x="471" y="224" text-anchor="end" font-size="15" font-weight="700" fill="#16a34a">Past</text>
  <text x="289" y="256" font-size="14" font-weight="600" fill="#1e293b">Kod bazasi</text>
  <text x="471" y="256" text-anchor="end" font-size="15" font-weight="700" fill="#16a34a">1 ta</text>
  <text x="289" y="288" font-size="14" font-weight="600" fill="#1e293b">Native his</text>
  <text x="471" y="288" text-anchor="end" font-size="15" font-weight="700" fill="#dc2626">Cheklangan</text>

  <text x="380" y="360" text-anchor="middle" font-size="13" fill="#94a3b8">Oson va arzon,</text>
  <text x="380" y="380" text-anchor="middle" font-size="13" fill="#94a3b8">ammo kamera/GPS</text>
  <text x="380" y="400" text-anchor="middle" font-size="13" fill="#94a3b8">va his cheklangan</text>

  <!-- Cross-platform column -->
  <rect x="508" y="64" width="222" height="370" rx="14" fill="#ffffff" stroke="#0ea5e9" stroke-width="3"/>
  <rect x="508" y="64" width="222" height="46" rx="14" fill="#e0f2fe"/>
  <text x="619" y="94" text-anchor="middle" font-size="18" font-weight="700" fill="#0284c7">Cross-platform</text>
  <text x="619" y="132" text-anchor="middle" font-size="14" font-weight="600" fill="#4f46e5">React Native (Expo)</text>
  <text x="619" y="154" text-anchor="middle" font-size="14" fill="#475569">JavaScript / React</text>

  <text x="528" y="192" font-size="14" font-weight="600" fill="#1e293b">Tillar soni</text>
  <text x="710" y="192" text-anchor="end" font-size="15" font-weight="700" fill="#16a34a">1 ta</text>
  <text x="528" y="224" font-size="14" font-weight="600" fill="#1e293b">Narx / vaqt</text>
  <text x="710" y="224" text-anchor="end" font-size="15" font-weight="700" fill="#16a34a">Past</text>
  <text x="528" y="256" font-size="14" font-weight="600" fill="#1e293b">Kod bazasi</text>
  <text x="710" y="256" text-anchor="end" font-size="15" font-weight="700" fill="#16a34a">1 ta</text>
  <text x="528" y="288" font-size="14" font-weight="600" fill="#1e293b">Native his</text>
  <text x="710" y="288" text-anchor="end" font-size="15" font-weight="700" fill="#16a34a">Haqiqiy native</text>

  <text x="619" y="360" text-anchor="middle" font-size="13" fill="#0284c7" font-weight="600">Bitta kod -></text>
  <text x="619" y="380" text-anchor="middle" font-size="13" fill="#0284c7" font-weight="600">iOS + Android,</text>
  <text x="619" y="400" text-anchor="middle" font-size="13" fill="#0284c7" font-weight="600">native natija</text>

  <text x="619" y="426" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">&#9733; Bu kitob shu yo'lda</text>
</svg>
