<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" font-family="Segoe UI, system-ui, sans-serif">
  <title>Debugging asboblari: React Native DevTools, console.log, LogBox ogohlantirishlari va element inspector</title>
  <rect x="0" y="0" width="760" height="480" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Debugging asboblari</text>
  <text x="380" y="62" text-anchor="middle" font-size="14" fill="#475569">Xatoni topish va tuzatishning to'rt yo'li</text>

  <!-- 1. React Native DevTools -->
  <rect x="40" y="92" width="330" height="160" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/>
  <rect x="40" y="92" width="330" height="36" rx="14" fill="#e0e7ff"/>
  <text x="205" y="116" text-anchor="middle" font-size="16" font-weight="700" fill="#4f46e5">React Native DevTools</text>
  <rect x="60" y="142" width="40" height="26" rx="6" fill="#4f46e5"/>
  <text x="80" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">j</text>
  <text x="112" y="160" font-size="13" fill="#475569">terminalda bosing (zamonaviy)</text>
  <text x="60" y="190" font-size="13" fill="#475569">• Console · Sources (breakpoint)</text>
  <text x="60" y="212" font-size="13" fill="#475569">• Components (props/state)</text>
  <text x="60" y="234" font-size="13" fill="#475569">• Network so'rovlari</text>

  <!-- 2. console.log -->
  <rect x="390" y="92" width="330" height="160" rx="14" fill="#ffffff" stroke="#0ea5e9" stroke-width="2.5"/>
  <rect x="390" y="92" width="330" height="36" rx="14" fill="#e0f2fe"/>
  <text x="555" y="116" text-anchor="middle" font-size="16" font-weight="700" fill="#0284c7">console.log</text>
  <text x="410" y="152" font-size="13" fill="#475569">Eng sodda, eng tez usul:</text>
  <rect x="410" y="164" width="290" height="64" rx="8" fill="#1e293b"/>
  <text x="424" y="188" font-size="13" fill="#7dd3fc" font-family="Consolas, monospace">console.log('narx:', narx);</text>
  <text x="424" y="212" font-size="13" fill="#86efac" font-family="Consolas, monospace">&gt; narx: 800</text>
  <text x="410" y="246" font-size="13" fill="#94a3b8">teg qo'shib qiymatni kuzating</text>

  <!-- 3. LogBox -->
  <rect x="40" y="272" width="330" height="170" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <rect x="40" y="272" width="330" height="36" rx="14" fill="#fef3c7"/>
  <text x="205" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">LogBox (ekrandagi xabar)</text>
  <!-- sariq -->
  <rect x="60" y="322" width="290" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="82" cy="344" r="9" fill="#f59e0b"/>
  <text x="82" y="349" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">!</text>
  <text x="102" y="340" font-size="13" font-weight="700" fill="#b45309">Warning (sariq)</text>
  <text x="102" y="358" font-size="13" fill="#475569">jiddiy emas, e'tibor bering</text>
  <!-- qizil -->
  <rect x="60" y="376" width="290" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="82" cy="401" r="9" fill="#dc2626"/>
  <text x="82" y="406" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">x</text>
  <text x="102" y="396" font-size="13" font-weight="700" fill="#dc2626">Error (qizil ekran)</text>
  <text x="102" y="414" font-size="13" fill="#475569">stack trace'ni o'qing</text>

  <!-- 4. Element inspector -->
  <rect x="390" y="272" width="330" height="170" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <rect x="390" y="272" width="330" height="36" rx="14" fill="#dcfce7"/>
  <text x="555" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">Element inspector</text>
  <rect x="410" y="322" width="40" height="26" rx="6" fill="#16a34a"/>
  <text x="430" y="340" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">m</text>
  <text x="462" y="340" font-size="13" fill="#475569">terminalda yoki chayqatib</text>
  <!-- mini telefon ramka -->
  <rect x="410" y="360" width="120" height="68" rx="10" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="430" y="378" width="80" height="32" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="555" y="386" font-size="13" fill="#475569">element o'lchami,</text>
  <text x="555" y="406" font-size="13" fill="#475569">padding, stillarini</text>
  <text x="555" y="426" font-size="13" fill="#475569">ko'rsatadi</text>
</svg>
