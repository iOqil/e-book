<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" font-family="Segoe UI, system-ui, sans-serif">
  <title>SectionList: bo'limli ro'yxat — har bo'lim sarlavhasi (alifbo harfi) va uning ostidagi kontaktlar elementlari</title>
  <rect x="0" y="0" width="760" height="500" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">SectionList: bo'limli ro'yxat</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">Elementlar guruhlarga (bo'limlarga) ajraladi — masalan alifbo bo'yicha kontaktlar</text>

  <!-- sections strukturasi (chap) -->
  <rect x="36" y="90" width="290" height="370" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="36" y="90" width="290" height="34" rx="12" fill="#e0e7ff"/>
  <text x="181" y="113" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">sections = bo'limlar massivi</text>

  <text x="52" y="150" font-size="13" fill="#475569">[</text>
  <text x="64" y="174" font-size="13" fill="#1e293b">{ title: 'A', data: [Aziz, Anvar] },</text>
  <text x="64" y="206" font-size="13" fill="#1e293b">{ title: 'B', data: [Bobur] },</text>
  <text x="64" y="238" font-size="13" fill="#1e293b">{ title: 'D', data: [Dilnoza,</text>
  <text x="76" y="258" font-size="13" fill="#1e293b">Davron] },</text>
  <text x="52" y="282" font-size="13" fill="#475569">]</text>

  <line x1="52" y1="300" x2="310" y2="300" stroke="#e2e8f0" stroke-width="1"/>

  <text x="52" y="328" font-size="14" font-weight="700" fill="#0284c7">renderSectionHeader</text>
  <text x="52" y="350" font-size="13" fill="#475569">bo'lim sarlavhasini chizadi (A, B, D)</text>

  <text x="52" y="384" font-size="14" font-weight="700" fill="#16a34a">renderItem</text>
  <text x="52" y="406" font-size="13" fill="#475569">har bir kontaktni chizadi</text>

  <text x="52" y="440" font-size="14" font-weight="700" fill="#0284c7">keyExtractor</text>
  <text x="200" y="440" font-size="13" fill="#475569">har element uchun kalit</text>

  <!-- O'q -->
  <line x1="330" y1="270" x2="382" y2="270" stroke="#475569" stroke-width="2.5"/>
  <polygon points="382,270 370,263 370,277" fill="#475569"/>

  <!-- Telefon mokap (o'ng) -->
  <rect x="500" y="80" width="220" height="392" rx="28" fill="#1e293b"/>
  <rect x="512" y="100" width="196" height="352" rx="10" fill="#ffffff"/>
  <rect x="512" y="100" width="196" height="34" rx="10" fill="#4f46e5"/>
  <text x="610" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Kontaktlar</text>

  <!-- Bo'lim A -->
  <rect x="512" y="142" width="196" height="26" fill="#e0f2fe"/>
  <text x="524" y="160" font-size="14" font-weight="700" fill="#0284c7">A</text>
  <text x="528" y="190" font-size="15" fill="#1e293b">Aziz</text>
  <line x1="524" y1="202" x2="696" y2="202" stroke="#f1f5f9" stroke-width="1"/>
  <text x="528" y="224" font-size="15" fill="#1e293b">Anvar</text>

  <!-- Bo'lim B -->
  <rect x="512" y="238" width="196" height="26" fill="#e0f2fe"/>
  <text x="524" y="256" font-size="14" font-weight="700" fill="#0284c7">B</text>
  <text x="528" y="286" font-size="15" fill="#1e293b">Bobur</text>

  <!-- Bo'lim D -->
  <rect x="512" y="300" width="196" height="26" fill="#e0f2fe"/>
  <text x="524" y="318" font-size="14" font-weight="700" fill="#0284c7">D</text>
  <text x="528" y="348" font-size="15" fill="#1e293b">Dilnoza</text>
  <line x1="524" y1="360" x2="696" y2="360" stroke="#f1f5f9" stroke-width="1"/>
  <text x="528" y="382" font-size="15" fill="#1e293b">Davron</text>

  <text x="610" y="424" text-anchor="middle" font-size="13" fill="#94a3b8" font-style="italic">sticky sarlavha tepada qoladi</text>
  <rect x="572" y="436" width="76" height="6" rx="3" fill="#cbd5e1"/>
</svg>
