<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Segoe UI, system-ui, sans-serif">
<title>Marshrut turlari: statik, dinamik va catch-all taqqoslash jadvali</title>
<rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
<text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Marshrut turlari</text>

<!-- ustun sarlavhalari -->
<rect x="30" y="60" width="220" height="40" rx="8" fill="#e0f2fe"/>
<text x="140" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#0ea5e9">Statik</text>
<rect x="270" y="60" width="220" height="40" rx="8" fill="#e0e7ff"/>
<text x="380" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">Dinamik</text>
<rect x="510" y="60" width="220" height="40" rx="8" fill="#fef3c7"/>
<text x="620" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">Catch-all</text>

<!-- fayl qatori -->
<text x="140" y="138" text-anchor="middle" font-size="14" fill="#94a3b8">Fayl:</text>
<text x="380" y="138" text-anchor="middle" font-size="14" fill="#94a3b8">Fayl:</text>
<text x="620" y="138" text-anchor="middle" font-size="14" fill="#94a3b8">Fayl:</text>
<rect x="30" y="148" width="220" height="40" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
<text x="140" y="173" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">profil.tsx</text>
<rect x="270" y="148" width="220" height="40" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
<text x="380" y="173" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">[id].tsx</text>
<rect x="510" y="148" width="220" height="40" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="2"/>
<text x="620" y="173" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">[...slug].tsx</text>

<!-- mos keladi qatori -->
<text x="140" y="226" text-anchor="middle" font-size="14" fill="#94a3b8">Mos keladi:</text>
<text x="380" y="226" text-anchor="middle" font-size="14" fill="#94a3b8">Mos keladi:</text>
<text x="620" y="226" text-anchor="middle" font-size="14" fill="#94a3b8">Mos keladi:</text>
<rect x="30" y="236" width="220" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="140" y="262" text-anchor="middle" font-size="13.5" fill="#0ea5e9">/profil</text>
<text x="140" y="284" text-anchor="middle" font-size="13" fill="#94a3b8">faqat bitta manzil</text>
<rect x="270" y="236" width="220" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="380" y="262" text-anchor="middle" font-size="13.5" fill="#4f46e5">/post/1, /post/42</text>
<text x="380" y="284" text-anchor="middle" font-size="13" fill="#94a3b8">bitta segment</text>
<rect x="510" y="236" width="220" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="620" y="262" text-anchor="middle" font-size="13.5" fill="#b45309">/a/b/c</text>
<text x="620" y="284" text-anchor="middle" font-size="13" fill="#94a3b8">bir nechta segment</text>

<!-- param qatori -->
<text x="140" y="336" text-anchor="middle" font-size="14" fill="#94a3b8">Parametr:</text>
<text x="380" y="336" text-anchor="middle" font-size="14" fill="#94a3b8">Parametr:</text>
<text x="620" y="336" text-anchor="middle" font-size="14" fill="#94a3b8">Parametr:</text>
<rect x="30" y="346" width="220" height="48" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="140" y="375" text-anchor="middle" font-size="13.5" fill="#475569">yo'q</text>
<rect x="270" y="346" width="220" height="48" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="380" y="375" text-anchor="middle" font-size="13.5" fill="#475569">id = "42" (string)</text>
<rect x="510" y="346" width="220" height="48" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="620" y="375" text-anchor="middle" font-size="13.5" fill="#475569">slug = ['a','b','c']</text>
</svg>
