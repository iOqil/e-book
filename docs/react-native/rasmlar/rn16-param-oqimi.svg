<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Segoe UI, system-ui, sans-serif">
<title>Parametr oqimi: ro'yxatdan Link orqali detal ekraniga id uzatilishi</title>
<rect x="0" y="0" width="760" height="300" fill="#f8fafc"/>
<text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Parametr qanday oqadi</text>

<!-- 1: royxat -->
<rect x="24" y="80" width="150" height="120" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
<text x="99" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#0ea5e9">Ro'yxat</text>
<rect x="40" y="120" width="118" height="22" rx="5" fill="#e0f2fe"/>
<text x="99" y="135" text-anchor="middle" font-size="13" fill="#475569">Post #5</text>
<rect x="40" y="150" width="118" height="22" rx="5" fill="#f1f5f9"/>
<text x="99" y="165" text-anchor="middle" font-size="13" fill="#94a3b8">Post #6</text>
<text x="99" y="190" text-anchor="middle" font-size="13" fill="#94a3b8">bosildi</text>

<!-- 2: Link -->
<rect x="210" y="100" width="160" height="80" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
<text x="290" y="134" text-anchor="middle" font-size="13.5" font-weight="600" fill="#4f46e5">Link href=</text>
<text x="290" y="156" text-anchor="middle" font-size="13.5" font-weight="600" fill="#4f46e5">"/post/5"</text>

<!-- 3: [id].tsx -->
<rect x="406" y="100" width="160" height="80" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
<text x="486" y="128" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4f46e5">post/[id].tsx</text>
<text x="486" y="150" text-anchor="middle" font-size="13" fill="#475569">useLocalSearch-</text>
<text x="486" y="166" text-anchor="middle" font-size="13" fill="#475569">Params()</text>

<!-- 4: natija -->
<rect x="602" y="80" width="134" height="120" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
<text x="669" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">Natija</text>
<text x="669" y="134" text-anchor="middle" font-size="14" fill="#1e293b">id = "5"</text>
<text x="669" y="160" text-anchor="middle" font-size="13" fill="#475569">5-post</text>
<text x="669" y="178" text-anchor="middle" font-size="13" fill="#475569">ma'lumoti</text>

<!-- strelkalar -->
<g stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#ok)">
<path d="M 174 140 L 206 140"/>
<path d="M 370 140 L 402 140"/>
<path d="M 566 140 L 598 140"/>
</g>
<defs>
<marker id="ok" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
<path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
</marker>
</defs>

<text x="380" y="240" text-anchor="middle" font-size="13.5" fill="#475569">id ro'yxatdan URL'ga, URL'dan detal ekraniga oqadi —</text>
<text x="380" y="262" text-anchor="middle" font-size="13.5" font-weight="600" fill="#475569">va har doim matn (string) bo'lib keladi</text>
</svg>
