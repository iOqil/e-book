<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Segoe UI, system-ui, sans-serif">
  <title>Cleanup: setInterval ochiladi, komponent yo'qolganda clearInterval bilan tozalanadi</title>
  <rect x="0" y="0" width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Cleanup — tozalash funksiyasi</text>
  <text x="380" y="62" text-anchor="middle" font-size="14" fill="#475569">return () =&gt; {...} effekt qoldirgan "izlarni" tozalaydi</text>

  <!-- mount -->
  <rect x="40" y="100" width="200" height="130" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="40" y="100" width="200" height="40" rx="12" fill="#dcfce7"/>
  <text x="140" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">Komponent paydo</text>
  <text x="140" y="170" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="600">useEffect ishlaydi</text>
  <text x="140" y="198" text-anchor="middle" font-size="13" fill="#475569">const id =</text>
  <text x="140" y="216" text-anchor="middle" font-size="13" fill="#16a34a">setInterval(...)</text>

  <!-- arrow -->
  <line x1="240" y1="165" x2="300" y2="165" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="300,165 288,159 288,171" fill="#94a3b8"/>
  <text x="270" y="152" text-anchor="middle" font-size="13" fill="#94a3b8">taymer</text>
  <text x="270" y="186" text-anchor="middle" font-size="13" fill="#94a3b8">ishlaydi</text>

  <!-- ishlamoqda -->
  <rect x="300" y="100" width="160" height="130" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <rect x="300" y="100" width="160" height="40" rx="12" fill="#e0f2fe"/>
  <text x="380" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#0369a1">Ekranda</text>
  <text x="380" y="172" text-anchor="middle" font-size="13" fill="#475569">soat har soniyada</text>
  <text x="380" y="192" text-anchor="middle" font-size="13" fill="#475569">yangilanadi</text>
  <text x="380" y="214" text-anchor="middle" font-size="22" fill="#0ea5e9">⏱</text>

  <!-- arrow -->
  <line x1="460" y1="165" x2="520" y2="165" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="520,165 508,159 508,171" fill="#94a3b8"/>
  <text x="490" y="152" text-anchor="middle" font-size="13" fill="#94a3b8">chiqib</text>
  <text x="490" y="186" text-anchor="middle" font-size="13" fill="#94a3b8">ketdi</text>

  <!-- unmount + cleanup -->
  <rect x="520" y="100" width="200" height="130" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="520" y="100" width="200" height="40" rx="12" fill="#fee2e2"/>
  <text x="620" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">Komponent yo'qoldi</text>
  <text x="620" y="170" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="600">cleanup chaqiriladi</text>
  <text x="620" y="198" text-anchor="middle" font-size="13" fill="#475569">return () =&gt;</text>
  <text x="620" y="216" text-anchor="middle" font-size="13" fill="#dc2626">clearInterval(id)</text>

  <!-- bottom note -->
  <rect x="120" y="280" width="520" height="80" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="310" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">Tozalanmasa nima bo'ladi?</text>
  <text x="380" y="335" text-anchor="middle" font-size="13" fill="#475569">Taymer fonda ishlayveradi — xotira "oqadi" (memory leak),</text>
  <text x="380" y="353" text-anchor="middle" font-size="13" fill="#475569">yo'q komponentni yangilashga urinadi → ogohlantirish/sekinlashuv</text>
</svg>
