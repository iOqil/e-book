<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" font-family="Segoe UI, system-ui, sans-serif">
  <title>Profil kartochkasi komponent daraxti: View ichida Image, Text va ichma-ich View komponentlari</title>
  <rect x="0" y="0" width="760" height="500" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Komponentlar daraxti (profil kartochkasi)</text>
  <text x="380" y="62" text-anchor="middle" font-size="14" fill="#475569">Komponentlar bir-birining ichida joylashadi — daraxt kabi</text>

  <!-- Chap: daraxt -->
  <!-- Ildiz View -->
  <rect x="40" y="86" width="330" height="44" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2.5"/>
  <text x="56" y="114" font-size="15" font-weight="700" fill="#0284c7">&lt;View&gt; (karta — ildiz)</text>

  <!-- Bog'lovchi chiziqlar -->
  <line x1="70" y1="130" x2="70" y2="420" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Image -->
  <line x1="70" y1="166" x2="92" y2="166" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="92" y="148" width="278" height="40" rx="9" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="108" y="173" font-size="14" font-weight="600" fill="#4f46e5">&lt;Image&gt; — avatar rasmi</text>

  <!-- Text ism -->
  <line x1="70" y1="214" x2="92" y2="214" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="92" y="196" width="278" height="40" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="108" y="221" font-size="14" font-weight="600" fill="#16a34a">&lt;Text&gt; — ism</text>

  <!-- Text kasb -->
  <line x1="70" y1="262" x2="92" y2="262" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="92" y="244" width="278" height="40" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="108" y="269" font-size="14" font-weight="600" fill="#16a34a">&lt;Text&gt; — kasb</text>

  <!-- Ichki View (qator) -->
  <line x1="70" y1="310" x2="92" y2="310" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="92" y="292" width="278" height="78" rx="9" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="108" y="316" font-size="14" font-weight="700" fill="#0284c7">&lt;View&gt; (ichki — holat qatori)</text>
  <line x1="118" y1="320" x2="118" y2="356" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="118" y1="346" x2="138" y2="346" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="146" y="351" font-size="13" font-weight="600" fill="#16a34a">&lt;Text&gt; — Onlayn</text>

  <!-- Pressable -->
  <line x1="70" y1="398" x2="92" y2="398" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="92" y="380" width="278" height="56" rx="9" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="108" y="404" font-size="14" font-weight="600" fill="#b45309">&lt;Pressable&gt; tugma</text>
  <line x1="118" y1="408" x2="118" y2="424" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="118" y1="424" x2="138" y2="424" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="146" y="429" font-size="13" font-weight="600" fill="#16a34a">&lt;Text&gt; — Obuna</text>

  <!-- O'ng: telefon mokap -->
  <rect x="430" y="92" width="280" height="360" rx="28" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
  <rect x="492" y="104" width="156" height="14" rx="7" fill="#e2e8f0"/>

  <!-- Karta ichidagi UI -->
  <rect x="468" y="142" width="204" height="278" rx="16" fill="#f8fafc" stroke="#bae6fd" stroke-width="2"/>
  <circle cx="570" cy="194" r="34" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="570" y="201" text-anchor="middle" font-size="22">&#128100;</text>
  <text x="570" y="250" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Oqil I.</text>
  <text x="570" y="272" text-anchor="middle" font-size="13" fill="#475569">Mobil dasturchi</text>
  <text x="570" y="298" text-anchor="middle" font-size="13" font-weight="600" fill="#16a34a">&#9679; Onlayn</text>
  <rect x="498" y="320" width="144" height="40" rx="10" fill="#4f46e5"/>
  <text x="570" y="345" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Obuna bo'lish</text>

  <text x="570" y="446" text-anchor="middle" font-size="13" fill="#94a3b8">Daraxt -> ekranda shunday ko'rinadi</text>
</svg>
