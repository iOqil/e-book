<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>MapView va Marker: telefon ekranida xarita va belgilar</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Xarita: MapView va Marker</text>

  <!-- Phone mockup -->
  <rect x="60" y="64" width="250" height="380" rx="28" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
  <rect x="130" y="76" width="110" height="14" rx="7" fill="#e2e8f0"/>

  <!-- Map area inside phone -->
  <clipPath id="ekran"><rect x="74" y="104" width="222" height="300" rx="10"/></clipPath>
  <g clip-path="url(#ekran)">
    <rect x="74" y="104" width="222" height="300" fill="#e0f2fe"/>
    <!-- roads -->
    <line x1="74" y1="200" x2="296" y2="230" stroke="#bae6fd" stroke-width="8"/>
    <line x1="150" y1="104" x2="190" y2="404" stroke="#bae6fd" stroke-width="8"/>
    <line x1="74" y1="320" x2="296" y2="300" stroke="#bae6fd" stroke-width="6"/>
    <!-- green blocks -->
    <rect x="90" y="130" width="44" height="40" rx="4" fill="#bbf7d0"/>
    <rect x="220" y="250" width="50" height="40" rx="4" fill="#bbf7d0"/>
    <!-- marker pin -->
    <g>
      <path d="M185 250 C185 232 211 232 211 250 C211 266 198 282 198 282 C198 282 185 266 185 250 Z" fill="#dc2626"/>
      <circle cx="198" cy="250" r="7" fill="#ffffff"/>
    </g>
    <!-- user location dot -->
    <circle cx="140" cy="330" r="14" fill="#0ea5e9" opacity="0.25"/>
    <circle cx="140" cy="330" r="6" fill="#0ea5e9" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="185" y="428" text-anchor="middle" font-size="13" fill="#475569">flex: 1 — butun ekran</text>

  <!-- Annotations -->
  <!-- Marker -->
  <line x1="211" y1="252" x2="360" y2="170" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="360" y="138" width="360" height="74" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="378" y="166" font-size="16" font-weight="700" fill="#dc2626">&lt;Marker /&gt;</text>
  <text x="378" y="190" font-size="13" fill="#475569">coordinate=&#123;&#123; latitude, longitude &#125;&#125;</text>
  <text x="378" y="206" font-size="13" fill="#94a3b8">title="..." — bosilganda nom chiqadi</text>

  <!-- User location -->
  <line x1="154" y1="330" x2="360" y2="262" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="360" y="232" width="360" height="70" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="378" y="260" font-size="16" font-weight="700" fill="#0ea5e9">showsUserLocation</text>
  <text x="378" y="284" font-size="13" fill="#475569">foydalanuvchining ko'k nuqtasi</text>

  <!-- MapView base -->
  <line x1="296" y1="380" x2="360" y2="360" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="360" y="322" width="360" height="90" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="378" y="350" font-size="16" font-weight="700" fill="#4f46e5">&lt;MapView /&gt;</text>
  <text x="378" y="374" font-size="13" fill="#475569">initialRegion=&#123;&#123; lat, lng, latDelta, lngDelta &#125;&#125;</text>
  <text x="378" y="392" font-size="13" fill="#475569">onPress — xaritaga bosishni ushlaydi</text>
  <text x="378" y="408" font-size="13" fill="#94a3b8">iOS: Apple Maps · Android: Google Maps</text>

  <text x="380" y="452" text-anchor="middle" font-size="13" fill="#94a3b8">react-native-maps · Markerlar MapView ichida bola sifatida joylanadi</text>
</svg>
