<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>StyleSheet anatomiyasi: StyleSheet.create obyekti, style proporqali ulanish va komponent ko'rinishi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Stil JavaScript obyektidan ekrangacha</text>

  <!-- 1. StyleSheet.create -->
  <rect x="30" y="64" width="290" height="220" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="30" y="64" width="290" height="40" rx="14" fill="#e0e7ff"/>
  <text x="175" y="91" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">1. Stil ta'rifi (JS obyekt)</text>

  <text x="48" y="134" font-size="14" fill="#475569" font-family="Consolas, monospace">const styles =</text>
  <text x="48" y="156" font-size="14" fill="#475569" font-family="Consolas, monospace">  StyleSheet.create({</text>
  <text x="64" y="184" font-size="14" font-weight="700" fill="#0ea5e9" font-family="Consolas, monospace">box</text>
  <text x="92" y="184" font-size="14" fill="#475569" font-family="Consolas, monospace">: {</text>
  <text x="80" y="208" font-size="13" fill="#16a34a" font-family="Consolas, monospace">padding: 16,</text>
  <text x="80" y="230" font-size="13" fill="#16a34a" font-family="Consolas, monospace">borderRadius: 10,</text>
  <text x="80" y="252" font-size="13" fill="#16a34a" font-family="Consolas, monospace">backgroundColor:</text>
  <text x="80" y="270" font-size="13" fill="#16a34a" font-family="Consolas, monospace">  '#4f46e5',</text>

  <!-- arrow 1 -> 2 -->
  <line x1="320" y1="174" x2="380" y2="174" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="380,174 370,169 370,179" fill="#94a3b8"/>
  <text x="350" y="164" text-anchor="middle" font-size="13" fill="#94a3b8">style=</text>

  <!-- 2. komponent -->
  <rect x="386" y="64" width="344" height="220" rx="14" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <rect x="386" y="64" width="344" height="40" rx="14" fill="#e0f2fe"/>
  <text x="558" y="91" text-anchor="middle" font-size="16" font-weight="700" fill="#0284c7">2. Komponentga biriktirish</text>

  <text x="406" y="140" font-size="14" fill="#475569" font-family="Consolas, monospace">&lt;View style={</text>
  <text x="406" y="168" font-size="14" font-weight="700" fill="#4f46e5" font-family="Consolas, monospace">  styles.box</text>
  <text x="406" y="196" font-size="14" fill="#475569" font-family="Consolas, monospace">}&gt;</text>
  <text x="424" y="226" font-size="14" fill="#475569" font-family="Consolas, monospace">&lt;Text&gt;Salom&lt;/Text&gt;</text>
  <text x="406" y="256" font-size="14" fill="#475569" font-family="Consolas, monospace">&lt;/View&gt;</text>

  <!-- arrow 2 -> 3 (down) -->
  <line x1="558" y1="284" x2="558" y2="324" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="558,324 553,314 563,314" fill="#94a3b8"/>
  <text x="618" y="310" text-anchor="middle" font-size="13" fill="#94a3b8">native render</text>

  <!-- 3. natija (telefon ekran) -->
  <rect x="280" y="326" width="200" height="124" rx="20" fill="#0f172a"/>
  <rect x="292" y="338" width="176" height="100" rx="10" fill="#f8fafc"/>
  <text x="380" y="356" text-anchor="middle" font-size="13" font-weight="600" fill="#94a3b8">3. Ekrandagi natija</text>
  <rect x="320" y="372" width="120" height="50" rx="10" fill="#4f46e5"/>
  <text x="380" y="403" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Salom</text>

  <!-- annotations -->
  <text x="500" y="360" font-size="13" fill="#475569">padding=16: ichki bo'shliq</text>
  <text x="500" y="384" font-size="13" fill="#475569">borderRadius=10: yumaloq</text>
  <text x="500" y="408" font-size="13" fill="#475569">backgroundColor: indigo fon</text>
  <text x="500" y="432" font-size="13" fill="#16a34a" font-weight="600">Stil = komponentning "kiyimi"</text>
</svg>
