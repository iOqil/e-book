<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, system-ui, sans-serif">
<title>Route guruhi: qavs ichidagi (tabs) papka URL manziliga qo'shilmaydi</title>
<rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
<text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Route guruhi (tabs) — URL'ga qo'shilmaydi</text>
<text x="380" y="64" text-anchor="middle" font-size="14" fill="#475569">Qavs ichidagi papka faqat tashkil etish va layout uchun</text>

