<text x="64" y="156" font-size="14" font-weight="700" fill="#1e293b">app/</text>
<!-- (tabs) papka urg'ulangan -->
<rect x="78" y="168" width="244" height="30" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="92" y="188" font-size="14" font-weight="700" fill="#4f46e5">(tabs)/</text>
<text x="382" y="188" font-size="13" fill="#dc2626">&lt;- qavs!</text>

<text x="112" y="222" font-size="14" fill="#1e293b">_layout.tsx</text>
<text x="240" y="222" font-size="13" fill="#94a3b8">Tabs navigator</text>
<text x="112" y="248" font-size="14" fill="#1e293b">index.tsx</text>
<text x="112" y="274" font-size="14" fill="#1e293b">qidiruv.tsx</text>
<text x="112" y="300" font-size="14" fill="#1e293b">profil.tsx</text>

<text x="64" y="338" font-size="14" fill="#1e293b">app/_layout.tsx</text>
<text x="64" y="362" font-size="14" fill="#1e293b">app/modal.tsx</text>

<!-- O'ng: URL natija -->
<rect x="420" y="92" width="300" height="300" rx="12" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
<text x="570" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#0ea5e9">Haqiqiy URL manzil</text>

<rect x="440" y="146" width="260" height="36" rx="8" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.5"/>
<text x="452" y="169" font-size="14" fill="#475569">index.tsx</text>
<text x="690" y="169" text-anchor="end" font-size="15" font-weight="700" fill="#16a34a">/</text>

<rect x="440" y="194" width="260" height="36" rx="8" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.5"/>
<text x="452" y="217" font-size="14" fill="#475569">qidiruv.tsx</text>
<text x="690" y="217" text-anchor="end" font-size="15" font-weight="700" fill="#16a34a">/qidiruv</text>

<rect x="440" y="242" width="260" height="36" rx="8" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.5"/>
<text x="452" y="265" font-size="14" fill="#475569">profil.tsx</text>
<text x="690" y="265" text-anchor="end" font-size="15" font-weight="700" fill="#16a34a">/profil</text>

<text x="570" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">(tabs) yo'q!</text>
<text x="570" y="334" text-anchor="middle" font-size="13" fill="#475569">/tabs/index EMAS</text>
<text x="570" y="354" text-anchor="middle" font-size="13" fill="#475569">balki shunchaki  /</text>

<!-- Strelka -->
<path d="M348 240 L412 240" stroke="#6366f1" stroke-width="2.5" fill="none" marker-end="url(#strelka)"/>
<defs>
  <marker id="strelka" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/>
  </marker>
</defs>

<text x="380" y="420" text-anchor="middle" font-size="13" fill="#94a3b8">Qoida: papka nomi ( ) qavs ichida bo'lsa — manzilga ta'sir qilmaydi.</text>
