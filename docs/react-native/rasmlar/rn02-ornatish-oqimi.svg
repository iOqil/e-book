<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Muhit sozlashdan birinchi ilovaning telefonda ishlashigacha bo'lgan qadamlar oqimi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Birinchi ilovaga yo'l: 5 qadam</text>

  <!-- Qadam 1: Node -->
  <rect x="40" y="80" width="200" height="92" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <circle cx="68" cy="108" r="15" fill="#0ea5e9"/>
  <text x="68" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text>
  <text x="92" y="113" font-size="16" font-weight="700" fill="#1e293b">Node.js o'rnatish</text>
  <text x="60" y="140" font-size="14" fill="#475569">Asboblar yashigi (18+)</text>
  <text x="60" y="160" font-size="13" fill="#94a3b8">tekshir: node -v</text>

  <!-- strelka 1->2 -->
  <path d="M 245 126 L 290 126" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#ok)"/>

  <!-- Qadam 2: Expo Go -->
  <rect x="295" y="80" width="200" height="92" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <circle cx="323" cy="108" r="15" fill="#4f46e5"/>
  <text x="323" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2</text>
  <text x="347" y="113" font-size="16" font-weight="700" fill="#1e293b">Expo Go</text>
  <text x="315" y="140" font-size="14" fill="#475569">Telefonga o'rnatish</text>
  <text x="315" y="160" font-size="13" fill="#94a3b8">Play Store / App Store</text>

  <!-- strelka 2->3 -->
  <path d="M 500 126 L 545 126" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#ok)"/>

  <!-- Qadam 3: create-expo-app -->
  <rect x="550" y="80" width="200" height="92" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <circle cx="578" cy="108" r="15" fill="#0ea5e9"/>
  <text x="578" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">3</text>
  <text x="602" y="113" font-size="16" font-weight="700" fill="#1e293b">Loyiha yaratish</text>
  <text x="570" y="140" font-size="13" fill="#475569">npx create-expo-app</text>
  <text x="570" y="160" font-size="13" fill="#94a3b8">cd MyApp</text>

  <!-- strelka 3->4 (pastga) -->
  <path d="M 650 175 L 650 215" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#ok)"/>

  <!-- Qadam 4: expo start -->
  <rect x="550" y="220" width="200" height="92" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <circle cx="578" cy="248" r="15" fill="#4f46e5"/>
  <text x="578" y="254" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">4</text>
  <text x="602" y="253" font-size="16" font-weight="700" fill="#1e293b">Ishga tushirish</text>
  <text x="570" y="280" font-size="13" fill="#475569">npx expo start</text>
  <text x="570" y="300" font-size="13" fill="#94a3b8">QR kod chiqadi</text>

  <!-- strelka 4->5 (chapga) -->
  <path d="M 545 266 L 500 266" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#ok)"/>

  <!-- Qadam 5: QR skan -->
  <rect x="295" y="220" width="200" height="92" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <circle cx="323" cy="248" r="15" fill="#16a34a"/>
  <text x="323" y="254" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">5</text>
  <text x="347" y="253" font-size="16" font-weight="700" fill="#1e293b">QR skan</text>
  <text x="315" y="280" font-size="14" fill="#475569">Expo Go bilan</text>
  <text x="315" y="300" font-size="13" fill="#94a3b8">bir Wi-Fi'da bo'lsin</text>

  <!-- strelka 5 -> telefon (pastga) -->
  <path d="M 380 315 L 380 350" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#okg)"/>

  <!-- Natija: telefon mokap -->
  <rect x="310" y="352" width="140" height="96" rx="20" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <rect x="322" y="368" width="116" height="64" rx="8" fill="#f0fdf4"/>
  <text x="380" y="396" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">Salom,</text>
  <text x="380" y="416" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">dunyo!</text>
  <text x="380" y="463" text-anchor="middle" font-size="14" fill="#475569">Ilova telefonda ishlamoqda</text>

  <defs>
    <marker id="ok" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
    <marker id="okg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
