<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>HTML elementlari va React Native komponentlari moslik jadvali: div-View, p-Text, img-Image</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">HTML emas! Web tegidan RN komponentiga</text>

  <!-- Ustun sarlavhalari -->
  <rect x="40" y="64" width="300" height="44" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="190" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#b45309">Web (HTML)</text>

  <rect x="420" y="64" width="300" height="44" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="570" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#0284c7">React Native</text>

  <!-- Strelka markazda -->
  <text x="380" y="92" text-anchor="middle" font-size="20" font-weight="700" fill="#94a3b8">&#8594;</text>

  <!-- Qator 1: div -> View -->
  <rect x="40" y="122" width="300" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="148" font-size="16" font-family="monospace" font-weight="700" fill="#1e293b">&lt;div&gt;</text>
  <text x="60" y="170" font-size="13" fill="#94a3b8">konteyner, quti</text>
  <text x="380" y="156" text-anchor="middle" font-size="18" fill="#0ea5e9">&#8594;</text>
  <rect x="420" y="122" width="300" height="56" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="440" y="148" font-size="16" font-family="monospace" font-weight="700" fill="#0284c7">&lt;View&gt;</text>
  <text x="440" y="170" font-size="13" fill="#475569">elementlarni o'rab turadi</text>

  <!-- Qator 2: p/span -> Text -->
  <rect x="40" y="186" width="300" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="212" font-size="16" font-family="monospace" font-weight="700" fill="#1e293b">&lt;p&gt; &lt;span&gt; &lt;h1&gt;</text>
  <text x="60" y="234" font-size="13" fill="#94a3b8">matn</text>
  <text x="380" y="220" text-anchor="middle" font-size="18" fill="#0ea5e9">&#8594;</text>
  <rect x="420" y="186" width="300" height="56" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="440" y="212" font-size="16" font-family="monospace" font-weight="700" fill="#0284c7">&lt;Text&gt;</text>
  <text x="440" y="234" font-size="13" fill="#475569">HAR QANDAY matn shu yerda</text>

  <!-- Qator 3: img -> Image -->
  <rect x="40" y="250" width="300" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="276" font-size="16" font-family="monospace" font-weight="700" fill="#1e293b">&lt;img&gt;</text>
  <text x="60" y="298" font-size="13" fill="#94a3b8">rasm</text>
  <text x="380" y="284" text-anchor="middle" font-size="18" fill="#0ea5e9">&#8594;</text>
  <rect x="420" y="250" width="300" height="56" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="440" y="276" font-size="16" font-family="monospace" font-weight="700" fill="#0284c7">&lt;Image&gt;</text>
  <text x="440" y="298" font-size="13" fill="#475569">width/height SHART</text>

  <!-- Qator 4: button/input -> Pressable/TextInput -->
  <rect x="40" y="314" width="300" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="340" font-size="16" font-family="monospace" font-weight="700" fill="#1e293b">&lt;button&gt; &lt;input&gt;</text>
  <text x="60" y="362" font-size="13" fill="#94a3b8">tugma, kiritish</text>
  <text x="380" y="348" text-anchor="middle" font-size="18" fill="#0ea5e9">&#8594;</text>
  <rect x="420" y="314" width="300" height="56" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="440" y="340" font-size="15" font-family="monospace" font-weight="700" fill="#0284c7">&lt;Pressable&gt; &lt;TextInput&gt;</text>
  <text x="440" y="362" font-size="13" fill="#475569">keyingi boblarda</text>

  <!-- Pastki kritik eslatma -->
  <rect x="40" y="392" width="680" height="54" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="418" font-size="15" font-weight="700" fill="#dc2626">Eng muhim qoida:</text>
  <text x="60" y="438" font-size="14" fill="#475569">har qanday matn ALBATTA &lt;Text&gt; ichida. &lt;View&gt;Salom&lt;/View&gt; — XATO!</text>
</svg>
