<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>Fast Refresh sikli: kod saqlanadi, Metro bundler yangilaydi, telefonda darhol ko'rinadi</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Fast Refresh sikli</text>
  <text x="380" y="64" text-anchor="middle" font-size="14" fill="#475569">Saqlaysiz — telefonda darhol ko'rinadi</text>

  <!-- 1: Kod yozish / saqlash (chap) -->
  <rect x="50" y="120" width="200" height="150" rx="14" fill="#ffffff" stroke="#0ea5e9" stroke-width="2.5"/>
  <text x="150" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">1. Kodni saqlash</text>
  <rect x="70" y="166" width="160" height="86" rx="8" fill="#0f172a"/>
  <text x="84" y="190" font-size="13" fill="#38bdf8" font-family="Consolas, monospace">&lt;Text&gt;</text>
  <text x="84" y="210" font-size="13" fill="#e2e8f0" font-family="Consolas, monospace">  Salom!</text>
  <text x="84" y="230" font-size="13" fill="#38bdf8" font-family="Consolas, monospace">&lt;/Text&gt;</text>
  <text x="150" y="290" text-anchor="middle" font-size="13" fill="#94a3b8">Ctrl+S</text>

  <!-- strelka 1->2 -->
  <path d="M 255 195 L 300 195" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#fr)"/>

  <!-- 2: Metro bundler (markaz) -->
  <rect x="305" y="120" width="200" height="150" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="405" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#4f46e5">2. Metro bundler</text>
  <circle cx="405" cy="200" r="34" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <path d="M 405 178 A 22 22 0 1 1 387 189" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round"/>
  <path d="M 384 184 L 387 192 L 395 188 Z" fill="#4f46e5"/>
  <text x="405" y="258" text-anchor="middle" font-size="13" fill="#94a3b8">faqat o'zgargan qism</text>

  <!-- strelka 2->3 -->
  <path d="M 510 195 L 555 195" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#fr)"/>

  <!-- 3: Telefon (o'ng) -->
  <rect x="600" y="108" width="120" height="174" rx="20" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <rect x="612" y="126" width="96" height="124" rx="8" fill="#f0fdf4"/>
  <text x="660" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">Salom!</text>
  <circle cx="660" cy="266" r="6" fill="#16a34a"/>
  <text x="660" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">3. Darhol</text>
  <text x="660" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">ko'rinadi</text>

  <!-- Sikl strelkasi: telefon -> kod (pastdan aylanib) -->
  <path d="M 660 350 Q 660 400 380 400 Q 150 400 150 290" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#frg)"/>
  <text x="380" y="424" text-anchor="middle" font-size="14" fill="#16a34a">Yana o'zgartiring — sikl takrorlanadi (sekundlarda)</text>

  <defs>
    <marker id="fr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/>
    </marker>
    <marker id="frg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
