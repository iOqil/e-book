<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Lokal va push bildirishnoma oqimlari taqqoslashi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Ikki xil bildirishnoma</text>

  <!-- LOKAL bo'lim -->
  <rect x="30" y="62" width="700" height="172" rx="14" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
  <text x="50" y="92" font-size="17" font-weight="700" fill="#0ea5e9">1. Lokal bildirishnoma (qurilmaning o'zidan)</text>
  <text x="50" y="115" font-size="13" fill="#475569">Server kerak emas. Ilovaning o'zi vaqtni rejalashtiradi (eslatma, taymer, aksiya).</text>

  <!-- lokal oqim -->
  <rect x="60" y="140" width="170" height="66" rx="12" fill="#f8fafc" stroke="#0ea5e9" stroke-width="2"/>
  <text x="145" y="168" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Ilova kodi</text>
  <text x="145" y="189" text-anchor="middle" font-size="13" fill="#475569">scheduleNotification</text>

  <path d="M232 173 L300 173" stroke="#94a3b8" stroke-width="2" marker-end="url(#ok)"/>

  <rect x="302" y="140" width="160" height="66" rx="12" fill="#f8fafc" stroke="#f59e0b" stroke-width="2"/>
  <text x="382" y="168" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Tizim (OS)</text>
  <text x="382" y="189" text-anchor="middle" font-size="13" fill="#475569">vaqtni kutadi</text>

  <path d="M464 173 L532 173" stroke="#94a3b8" stroke-width="2" marker-end="url(#ok)"/>

  <rect x="534" y="140" width="166" height="66" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="617" y="168" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Foydalanuvchi</text>
  <text x="617" y="189" text-anchor="middle" font-size="13" fill="#16a34a">xabarni ko'radi</text>

  <!-- PUSH bo'lim -->
  <rect x="30" y="252" width="700" height="200" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="50" y="282" font-size="17" font-weight="700" fill="#4f46e5">2. Push bildirishnoma (serverdan)</text>
  <text x="50" y="305" font-size="13" fill="#475569">Server qurilmaga uzoqdan xabar yuboradi (yangi xabar, yangilik). Token kerak.</text>

  <rect x="48" y="330" width="146" height="72" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="121" y="360" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Sizning</text>
  <text x="121" y="380" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">serveringiz</text>

  <path d="M196 366 L242 366" stroke="#94a3b8" stroke-width="2" marker-end="url(#ok2)"/>

  <rect x="244" y="330" width="160" height="72" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="324" y="360" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Expo Push</text>
  <text x="324" y="380" text-anchor="middle" font-size="13" fill="#475569">xizmati</text>

  <path d="M406 366 L452 366" stroke="#94a3b8" stroke-width="2" marker-end="url(#ok2)"/>

  <rect x="454" y="330" width="160" height="72" rx="12" fill="#f8fafc" stroke="#f59e0b" stroke-width="2"/>
  <text x="534" y="360" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">APNs / FCM</text>
  <text x="534" y="380" text-anchor="middle" font-size="13" fill="#475569">(Apple/Google)</text>

  <path d="M616 366 L662 366" stroke="#94a3b8" stroke-width="2" marker-end="url(#ok2)"/>

  <!-- telefon -->
  <rect x="664" y="324" width="50" height="84" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="671" y="334" width="36" height="56" rx="4" fill="#dcfce7"/>
  <text x="689" y="430" text-anchor="middle" font-size="13" fill="#16a34a">qurilma</text>

  <defs>
    <marker id="ok" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#94a3b8"/></marker>
    <marker id="ok2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#94a3b8"/></marker>
  </defs>
</svg>
