<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>Haptics: tugma bosildi, qurilma tebranadi (light, medium, heavy)</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Haptik javob: barmoq ostidagi his</text>

  <!-- oqim: tugma -> impactAsync -> tebranish -->
  <rect x="40" y="80" width="190" height="84" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="135" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Tugma bosildi</text>
  <text x="135" y="136" text-anchor="middle" font-size="13" fill="#475569">onPress = () =&gt; ...</text>

  <path d="M232 122 L300 122" stroke="#94a3b8" stroke-width="2" marker-end="url(#h)"/>

  <rect x="302" y="80" width="210" height="84" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="407" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Haptics.impactAsync</text>
  <text x="407" y="136" text-anchor="middle" font-size="13" fill="#475569">tizimga buyruq beradi</text>

  <path d="M514 122 L582 122" stroke="#94a3b8" stroke-width="2" marker-end="url(#h)"/>

  <!-- telefon tebranadi -->
  <rect x="600" y="70" width="60" height="104" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <rect x="608" y="82" width="44" height="72" rx="5" fill="#e0f2fe"/>
  <path d="M585 90 q-8 8 0 16" stroke="#0ea5e9" stroke-width="2" fill="none"/>
  <path d="M578 84 q-12 14 0 28" stroke="#bae6fd" stroke-width="2" fill="none"/>
  <path d="M675 90 q8 8 0 16" stroke="#0ea5e9" stroke-width="2" fill="none"/>
  <path d="M682 84 q12 14 0 28" stroke="#bae6fd" stroke-width="2" fill="none"/>
  <text x="630" y="195" text-anchor="middle" font-size="13" fill="#0ea5e9">tebranadi</text>

  <!-- kuch turlari -->
  <text x="380" y="248" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">Tebranish kuchi (ImpactFeedbackStyle)</text>

  <!-- Light -->
  <rect x="60" y="272" width="200" height="120" rx="14" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
  <text x="160" y="302" text-anchor="middle" font-size="16" font-weight="700" fill="#0ea5e9">Light</text>
  <text x="160" y="326" text-anchor="middle" font-size="13" fill="#475569">yengil "tiq"</text>
  <circle cx="160" cy="356" r="8" fill="#bae6fd"/>
  <text x="160" y="384" text-anchor="middle" font-size="13" fill="#94a3b8">tanlash, ozgina</text>

  <!-- Medium -->
  <rect x="280" y="272" width="200" height="120" rx="14" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="380" y="302" text-anchor="middle" font-size="16" font-weight="700" fill="#4f46e5">Medium</text>
  <text x="380" y="326" text-anchor="middle" font-size="13" fill="#475569">o'rtacha "tuk"</text>
  <circle cx="380" cy="356" r="12" fill="#c7d2fe"/>
  <text x="380" y="384" text-anchor="middle" font-size="13" fill="#94a3b8">tasdiq, tugma</text>

  <!-- Heavy -->
  <rect x="500" y="272" width="200" height="120" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="302" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">Heavy</text>
  <text x="600" y="326" text-anchor="middle" font-size="13" fill="#475569">kuchli "dak"</text>
  <circle cx="600" cy="356" r="16" fill="#fecaca"/>
  <text x="600" y="384" text-anchor="middle" font-size="13" fill="#94a3b8">muhim hodisa</text>

  <text x="380" y="424" text-anchor="middle" font-size="13" fill="#475569">Bonus: notificationAsync (success/warning/error) va selectionAsync (g'ildirakli tanlovda)</text>

  <defs>
    <marker id="h" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#94a3b8"/></marker>
  </defs>
</svg>
