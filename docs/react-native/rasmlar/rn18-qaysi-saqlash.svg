<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>AsyncStorage, SecureStore, SQLite va MMKV qachon qaysi birini ishlatish jadvali</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Qachon qaysi saqlash vositasi?</text>

  <!-- header row -->
  <rect x="30" y="58" width="200" height="44" rx="8" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="130" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">Vosita</text>
  <rect x="238" y="58" width="290" height="44" rx="8" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="383" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">Nima uchun</text>
  <rect x="536" y="58" width="194" height="44" rx="8" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="633" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">Xavfsizlik</text>

  <!-- Row 1: AsyncStorage -->
  <rect x="30" y="110" width="200" height="80" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
  <text x="130" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#0ea5e9">AsyncStorage</text>
  <text x="130" y="166" text-anchor="middle" font-size="13" fill="#94a3b8">oddiy kalit-qiymat</text>
  <rect x="238" y="110" width="290" height="80" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="383" y="142" text-anchor="middle" font-size="14" fill="#1e293b">Oddiy sozlama</text>
  <text x="383" y="166" text-anchor="middle" font-size="13" fill="#475569">tema, til, belgilar</text>
  <rect x="536" y="110" width="194" height="80" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="633" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">Yo'q (ochiq)</text>
  <text x="633" y="168" text-anchor="middle" font-size="13" fill="#475569">token saqlama!</text>

  <!-- Row 2: SecureStore -->
  <rect x="30" y="198" width="200" height="80" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
  <text x="130" y="230" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">SecureStore</text>
  <text x="130" y="254" text-anchor="middle" font-size="13" fill="#94a3b8">shifrlangan</text>
  <rect x="238" y="198" width="290" height="80" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="383" y="230" text-anchor="middle" font-size="14" fill="#1e293b">Maxfiy ma'lumot</text>
  <text x="383" y="254" text-anchor="middle" font-size="13" fill="#475569">token, parol</text>
  <rect x="536" y="198" width="194" height="80" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="633" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">Ha (shifrlangan)</text>
  <text x="633" y="256" text-anchor="middle" font-size="13" fill="#475569">Keychain/Keystore</text>

  <!-- Row 3: SQLite -->
  <rect x="30" y="286" width="200" height="80" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="130" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#6366f1">SQLite</text>
  <text x="130" y="342" text-anchor="middle" font-size="13" fill="#94a3b8">SQL bazasi</text>
  <rect x="238" y="286" width="290" height="80" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="383" y="318" text-anchor="middle" font-size="14" fill="#1e293b">Ko'p, strukturalangan</text>
  <text x="383" y="342" text-anchor="middle" font-size="13" fill="#475569">so'rov, saralash, filtr</text>
  <rect x="536" y="286" width="194" height="80" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <text x="633" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">Yo'q (lokal)</text>
  <text x="633" y="344" text-anchor="middle" font-size="13" fill="#475569">qurilma ichida</text>

  <!-- Row 4: MMKV -->
  <rect x="30" y="374" width="200" height="80" rx="8" fill="#ffffff" stroke="#fde68a" stroke-width="2"/>
  <text x="130" y="406" text-anchor="middle" font-size="15" font-weight="700" fill="#f59e0b">MMKV</text>
  <text x="130" y="430" text-anchor="middle" font-size="13" fill="#94a3b8">sinxron, tez</text>
  <rect x="238" y="374" width="290" height="80" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="383" y="406" text-anchor="middle" font-size="14" fill="#1e293b">Tezlik kerak bo'lsa</text>
  <text x="383" y="430" text-anchor="middle" font-size="13" fill="#475569">tez-tez o'qiladigan kesh</text>
  <rect x="536" y="374" width="194" height="80" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <text x="633" y="410" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">Shifr ixtiyoriy</text>
  <text x="633" y="432" text-anchor="middle" font-size="13" fill="#475569">dev build kerak</text>
</svg>
