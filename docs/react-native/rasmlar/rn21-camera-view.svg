<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="Segoe UI, system-ui, sans-serif">
  <title>CameraView komponenti: old va orqa kamera o'rtasida almashish, takePictureAsync chaqirish va olingan suratni telefon ekranida ko'rsatish</title>
  <rect x="0" y="0" width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">CameraView bilan suratga olish</text>

  <!-- phone mockup: live camera -->
  <rect x="70" y="64" width="220" height="360" rx="24" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <rect x="84" y="92" width="192" height="304" rx="8" fill="#0f172a"/>
  <text x="180" y="86" text-anchor="middle" font-size="13" fill="#94a3b8">&lt;CameraView /&gt; — jonli</text>
  <!-- viewfinder content -->
  <circle cx="180" cy="200" r="42" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="180" y="206" text-anchor="middle" font-size="13" fill="#bae6fd">old / orqa</text>
  <!-- flip button -->
  <rect x="96" y="330" width="78" height="32" rx="16" fill="#334155"/>
  <text x="135" y="351" text-anchor="middle" font-size="13" fill="#e2e8f0">Aylantir</text>
  <!-- shutter -->
  <circle cx="232" cy="346" r="22" fill="#ffffff" stroke="#0ea5e9" stroke-width="3"/>
  <circle cx="232" cy="346" r="12" fill="#0ea5e9"/>

  <!-- arrow -->
  <line x1="300" y1="244" x2="378" y2="244" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="384,244 372,238 372,250" fill="#94a3b8"/>
  <text x="342" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">takePicture</text>
  <text x="342" y="262" text-anchor="middle" font-size="13" fill="#94a3b8">Async()</text>

  <!-- phone mockup: captured photo -->
  <rect x="470" y="64" width="220" height="360" rx="24" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <rect x="484" y="92" width="192" height="304" rx="8" fill="#e0f2fe"/>
  <text x="580" y="86" text-anchor="middle" font-size="13" fill="#94a3b8">surat.uri -&gt; &lt;Image /&gt;</text>
  <!-- captured photo content -->
  <rect x="500" y="118" width="160" height="160" rx="8" fill="#bae6fd" stroke="#0ea5e9" stroke-width="2"/>
  <circle cx="580" cy="180" r="34" fill="#38bdf8"/>
  <path d="M 520 270 L 562 218 L 600 256 L 624 232 L 644 270 Z" fill="#0ea5e9"/>
  <text x="580" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#0369a1">Surat olindi</text>
  <text x="580" y="350" text-anchor="middle" font-size="13" fill="#475569">galereyaga saqlash mumkin</text>

  <text x="380" y="448" text-anchor="middle" font-size="13" fill="#94a3b8">facing="back" / "front" — kamerani almashtiradi</text>
</svg>
