<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>API oqimi: ilova fetch so'rov yuboradi, server JSON javob qaytaradi (ofitsiant o'xshatishi)</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">API oqimi — "restoran ofitsianti" o'xshatishi</text>

  <!-- Ilova (telefon) -->
  <rect x="40" y="80" width="190" height="300" rx="24" fill="#ffffff" stroke="#0ea5e9" stroke-width="2.5"/>
  <rect x="56" y="104" width="158" height="252" rx="10" fill="#f0f9ff"/>
  <text x="135" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#0ea5e9">Sizning ilovangiz</text>
  <text x="135" y="156" text-anchor="middle" font-size="13" fill="#475569">(mehmon / mijoz)</text>
  <rect x="72" y="184" width="126" height="40" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="135" y="209" text-anchor="middle" font-size="13" fill="#1e293b">Post 1</text>
  <rect x="72" y="232" width="126" height="40" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="135" y="257" text-anchor="middle" font-size="13" fill="#1e293b">Post 2</text>
  <rect x="72" y="280" width="126" height="40" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="135" y="305" text-anchor="middle" font-size="13" fill="#1e293b">Post 3</text>

  <!-- Server -->
  <rect x="530" y="120" width="190" height="220" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/>
  <rect x="556" y="148" width="138" height="26" rx="6" fill="#eef2ff"/>
  <rect x="556" y="182" width="138" height="26" rx="6" fill="#eef2ff"/>
  <rect x="556" y="216" width="138" height="26" rx="6" fill="#eef2ff"/>
  <text x="625" y="290" text-anchor="middle" font-size="16" font-weight="700" fill="#4f46e5">Server (REST API)</text>
  <text x="625" y="314" text-anchor="middle" font-size="13" fill="#475569">(oshxona)</text>

  <!-- So'rov strelkasi (yuqori) -->
  <line x1="230" y1="180" x2="525" y2="180" stroke="#0ea5e9" stroke-width="3"/>
  <polygon points="525,180 511,173 511,187" fill="#0ea5e9"/>
  <rect x="262" y="146" width="232" height="28" rx="14" fill="#e0f2fe"/>
  <text x="378" y="165" text-anchor="middle" font-size="13" font-weight="600" fill="#0369a1">1. fetch(url) — so'rov (buyurtma)</text>

  <!-- Javob strelkasi (past) -->
  <line x1="525" y1="280" x2="232" y2="280" stroke="#16a34a" stroke-width="3"/>
  <polygon points="232,280 246,273 246,287" fill="#16a34a"/>
  <rect x="262" y="290" width="232" height="28" rx="14" fill="#dcfce7"/>
  <text x="378" y="309" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">3. JSON javob (taom keldi)</text>

  <!-- Kutish -->
  <text x="378" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#f59e0b">2. Kutish (await)...</text>

  <!-- Pastki izoh -->
  <rect x="40" y="410" width="680" height="40" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="380" y="435" text-anchor="middle" font-size="13" fill="#92400e">Ofitsiant kabi: buyurtma berasiz (so'rov) → kutasiz (await) → taom keladi (JSON). JSON = ma'lumot formati.</text>
</svg>
