<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" font-family="Segoe UI, system-ui, sans-serif">
  <title>Telefon ekranida header, kontent (flex 1 bilan bo'sh joyni egallaydi) va footer joylashuvi</title>
  <rect x="0" y="0" width="760" height="520" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">To'liq ekran layout: header / kontent / footer</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">Ildiz View'da flex: 1 — butun ekranni egallaydi; kontent ham flex: 1 — qolgan bo'shliqni</text>

  <!-- Phone frame -->
  <rect x="250" y="80" width="260" height="420" rx="28" fill="#1e293b"/>
  <rect x="262" y="92" width="236" height="396" rx="18" fill="#f8fafc"/>
  <!-- notch -->
  <rect x="345" y="96" width="70" height="14" rx="7" fill="#1e293b"/>

  <!-- header -->
  <rect x="262" y="110" width="236" height="56" fill="#4f46e5"/>
  <text x="380" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Header</text>

  <!-- content (flex:1) -->
  <rect x="262" y="166" width="236" height="278" fill="#e0f2fe"/>
  <text x="380" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#0284c7">Kontent</text>
  <text x="380" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">flex: 1</text>
  <text x="380" y="342" text-anchor="middle" font-size="13" fill="#475569">qolgan joyni egallaydi</text>

  <!-- footer -->
  <rect x="262" y="444" width="236" height="44" fill="#e2e8f0"/>
  <text x="380" y="471" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">Footer</text>

  <!-- LEFT annotation: code -->
  <rect x="30" y="120" width="200" height="220" rx="12" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
  <text x="46" y="148" font-size="14" font-weight="700" fill="#1e293b">Tuzilish:</text>
  <text x="46" y="176" font-size="13" fill="#4f46e5">&lt;View flex:1&gt;</text>
  <text x="58" y="200" font-size="13" fill="#0284c7">&lt;View&gt; Header</text>
  <text x="58" y="224" font-size="13" fill="#16a34a">&lt;View flex:1&gt;</text>
  <text x="70" y="246" font-size="13" fill="#475569">Kontent</text>
  <text x="58" y="268" font-size="13" fill="#16a34a">&lt;/View&gt;</text>
  <text x="58" y="292" font-size="13" fill="#475569">&lt;View&gt; Footer</text>
  <text x="46" y="316" font-size="13" fill="#4f46e5">&lt;/View&gt;</text>

  <!-- RIGHT annotation: explanation -->
  <rect x="530" y="120" width="206" height="100" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="546" y="146" font-size="14" font-weight="700" fill="#4f46e5">Header / Footer</text>
  <text x="546" y="170" font-size="13" fill="#475569">aniq balandlik (dp),</text>
  <text x="546" y="190" font-size="13" fill="#475569">flex yo'q — o'zgarmas</text>
  <text x="546" y="210" font-size="13" fill="#475569">balandlikda turadi</text>

  <rect x="530" y="236" width="206" height="104" rx="12" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
  <text x="546" y="262" font-size="14" font-weight="700" fill="#16a34a">Kontent flex: 1</text>
  <text x="546" y="286" font-size="13" fill="#475569">header va footer'dan</text>
  <text x="546" y="306" font-size="13" fill="#475569">qolgan BARCHA bo'sh</text>
  <text x="546" y="326" font-size="13" fill="#475569">joyni cho'zilib oladi</text>

  <text x="380" y="510" text-anchor="middle" font-size="13" fill="#94a3b8">Bu — deyarli har bir mobil ekranning asosiy karkasi</text>
</svg>
