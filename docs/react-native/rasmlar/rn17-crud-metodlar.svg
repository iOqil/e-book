<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Segoe UI, system-ui, sans-serif">
  <title>HTTP CRUD metodlari jadvali: GET olish, POST qo'shish, PUT yangilash, DELETE o'chirish</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">HTTP metodlari — CRUD amallari</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">Serverga nima qilmoqchi ekanligingizni metod bildiradi</text>

  <!-- Jadval ustun sarlavhalari -->
  <rect x="40" y="80" width="150" height="40" rx="8" fill="#e0f2fe"/>
  <text x="115" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#0369a1">Metod</text>
  <rect x="198" y="80" width="200" height="40" rx="8" fill="#e0f2fe"/>
  <text x="298" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#0369a1">Amal (o'zbekcha)</text>
  <rect x="406" y="80" width="314" height="40" rx="8" fill="#e0f2fe"/>
  <text x="563" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#0369a1">Misol</text>

  <!-- GET -->
  <rect x="40" y="128" width="150" height="60" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="115" y="164" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">GET</text>
  <rect x="198" y="128" width="200" height="60" rx="8" fill="#f0fdf4"/>
  <text x="298" y="156" text-anchor="middle" font-size="14" fill="#1e293b">Olish (o'qish)</text>
  <text x="298" y="176" text-anchor="middle" font-size="13" fill="#94a3b8">Read</text>
  <rect x="406" y="128" width="314" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="422" y="163" font-size="13" fill="#475569">Postlar ro'yxatini ko'rsatish</text>

  <!-- POST -->
  <rect x="40" y="196" width="150" height="60" rx="8" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="115" y="232" text-anchor="middle" font-size="16" font-weight="700" fill="#0ea5e9">POST</text>
  <rect x="198" y="196" width="200" height="60" rx="8" fill="#f0f9ff"/>
  <text x="298" y="224" text-anchor="middle" font-size="14" fill="#1e293b">Qo'shish (yaratish)</text>
  <text x="298" y="244" text-anchor="middle" font-size="13" fill="#94a3b8">Create</text>
  <rect x="406" y="196" width="314" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="422" y="231" font-size="13" fill="#475569">Yangi post yuborish</text>

  <!-- PUT -->
  <rect x="40" y="264" width="150" height="60" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="115" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#d97706">PUT</text>
  <rect x="198" y="264" width="200" height="60" rx="8" fill="#fff7ed"/>
  <text x="298" y="292" text-anchor="middle" font-size="14" fill="#1e293b">Yangilash (o'zgartirish)</text>
  <text x="298" y="312" text-anchor="middle" font-size="13" fill="#94a3b8">Update</text>
  <rect x="406" y="264" width="314" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="422" y="299" font-size="13" fill="#475569">Mavjud postni tahrirlash</text>

  <!-- DELETE -->
  <rect x="40" y="332" width="150" height="60" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="115" y="368" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">DELETE</text>
  <rect x="198" y="332" width="200" height="60" rx="8" fill="#fef2f2"/>
  <text x="298" y="360" text-anchor="middle" font-size="14" fill="#1e293b">O'chirish</text>
  <text x="298" y="380" text-anchor="middle" font-size="13" fill="#94a3b8">Delete</text>
  <rect x="406" y="332" width="314" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="422" y="367" font-size="13" fill="#475569">Postni butunlay o'chirish</text>
</svg>
