<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 620" width="780" height="620" font-family="Segoe UI, system-ui, sans-serif">
  <title>To'liq ilova arxitekturasi: ekranlar, navigatsiya, holat, saqlash va API qatlamlari</title>
  <rect x="0" y="0" width="780" height="620" fill="#f8fafc"/>
  <text x="390" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">VazifaPro — to'liq ilova arxitekturasi</text>

  <!-- UI / Ekranlar qatlami -->
  <rect x="30" y="64" width="720" height="150" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="48" y="90" font-size="16" font-weight="700" fill="#0ea5e9">1. UI qatlami — ekranlar va komponentlar</text>
  <text x="48" y="112" font-size="13" fill="#94a3b8">14–16 navigatsiya · 7 SafeArea · 8 FlatList · 20 forma · 24 animatsiya</text>

  <rect x="48" y="124" width="160" height="74" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="128" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">(auth) guruhi</text>
  <text x="128" y="170" text-anchor="middle" font-size="13" fill="#475569">login · signup</text>
  <text x="128" y="188" text-anchor="middle" font-size="13" fill="#475569">Stack</text>

  <rect x="224" y="124" width="240" height="74" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="344" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">(tabs) guruhi — js-tabs</text>
  <text x="344" y="170" text-anchor="middle" font-size="13" fill="#475569">Ro'yxat · Qo'shish · Profil</text>
  <text x="344" y="188" text-anchor="middle" font-size="13" fill="#475569">[id] detal (dinamik)</text>

  <rect x="480" y="124" width="254" height="74" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="607" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Umumiy komponentlar</text>
  <text x="607" y="170" text-anchor="middle" font-size="13" fill="#475569">VazifaKarta · Bo'sh holat</text>
  <text x="607" y="188" text-anchor="middle" font-size="13" fill="#475569">Tugma · Input · Spinner</text>

  <!-- strelka pastga -->
  <line x1="390" y1="214" x2="390" y2="244" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="390,250 385,240 395,240" fill="#94a3b8"/>

  <!-- Holat qatlami -->
  <rect x="30" y="252" width="720" height="120" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="48" y="278" font-size="16" font-weight="700" fill="#4f46e5">2. Holat qatlami — global "yagona haqiqat manbai"</text>
  <text x="48" y="300" font-size="13" fill="#94a3b8">19 global holat · 25 autentifikatsiya</text>

  <rect x="48" y="312" width="330" height="48" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="213" y="332" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Zustand store — vazifalar (CRUD)</text>
  <text x="213" y="351" text-anchor="middle" font-size="13" fill="#475569">qo'shish · tahrirlash · o'chirish · belgilash</text>

  <rect x="394" y="312" width="340" height="48" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="564" y="332" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">AuthContext — token va foydalanuvchi</text>
  <text x="564" y="351" text-anchor="middle" font-size="13" fill="#475569">login · logout · himoyalangan marshrut</text>

  <line x1="390" y1="372" x2="390" y2="402" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="390,408 385,398 395,398" fill="#94a3b8"/>

  <!-- Saqlash / API qatlami -->
  <rect x="30" y="410" width="720" height="140" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="48" y="436" font-size="16" font-weight="700" fill="#16a34a">3. Saqlash va tarmoq qatlami — barqaror ma'lumot</text>
  <text x="48" y="458" font-size="13" fill="#94a3b8">17 API · 18 lokal saqlash</text>

  <rect x="48" y="470" width="210" height="66" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="153" y="496" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">AsyncStorage</text>
  <text x="153" y="518" text-anchor="middle" font-size="13" fill="#475569">vazifalar (persist)</text>

  <rect x="274" y="470" width="210" height="66" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="379" y="496" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">SecureStore</text>
  <text x="379" y="518" text-anchor="middle" font-size="13" fill="#475569">token (shifrlangan)</text>

  <rect x="500" y="470" width="234" height="66" rx="8" fill="#fef9c3" stroke="#fde68a" stroke-width="1.5"/>
  <text x="617" y="496" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Backend API (fetch)</text>
  <text x="617" y="518" text-anchor="middle" font-size="13" fill="#475569">login · sinxronlash</text>

  <text x="390" y="580" text-anchor="middle" font-size="14" fill="#475569">Native: 21 rasm (avatar) · 23 bildirishnoma (eslatma) · 27 expo-image + EAS build</text>
  <text x="390" y="602" text-anchor="middle" font-size="13" fill="#94a3b8">Har qatlam mustaqil — pastki qatlam yuqorisini bilmaydi (toza ajratish)</text>
</svg>
