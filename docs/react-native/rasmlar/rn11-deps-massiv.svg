<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Segoe UI, system-ui, sans-serif">
  <title>Bog'liqliklar massivi uch holati: yo'q, bo'sh, qiymatli</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Bog'liqliklar massivi — 3 holat</text>
  <text x="380" y="62" text-anchor="middle" font-size="14" fill="#475569">useEffect ning ikkinchi argumenti effekt QACHON qayta ishlashini belgilaydi</text>

  <!-- 1: massiv yo'q -->
  <rect x="40" y="90" width="220" height="290" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <rect x="40" y="90" width="220" height="44" rx="14" fill="#fef3c7"/>
  <text x="150" y="119" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">Massiv YO'Q</text>
  <text x="150" y="162" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="600">useEffect(fn)</text>
  <line x1="64" y1="182" x2="236" y2="182" stroke="#fde68a" stroke-width="1.5"/>
  <text x="150" y="214" text-anchor="middle" font-size="14" fill="#475569">HAR renderda</text>
  <text x="150" y="236" text-anchor="middle" font-size="14" fill="#475569">ishlaydi</text>
  <text x="150" y="292" text-anchor="middle" font-size="13" fill="#dc2626">⚠ kam ishlatiladi</text>
  <text x="150" y="314" text-anchor="middle" font-size="13" fill="#94a3b8">(odatda kerakmas)</text>

  <!-- 2: bo'sh massiv -->
  <rect x="280" y="90" width="220" height="290" rx="14" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <rect x="280" y="90" width="220" height="44" rx="14" fill="#e0f2fe"/>
  <text x="390" y="119" text-anchor="middle" font-size="16" font-weight="700" fill="#0369a1">Bo'sh massiv [ ]</text>
  <text x="390" y="162" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="600">useEffect(fn, [])</text>
  <line x1="304" y1="182" x2="476" y2="182" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="390" y="214" text-anchor="middle" font-size="14" fill="#475569">FAQAT BIR MARTA</text>
  <text x="390" y="236" text-anchor="middle" font-size="14" fill="#475569">(mount'da)</text>
  <text x="390" y="292" text-anchor="middle" font-size="13" fill="#16a34a">✓ ma'lumot yuklash</text>
  <text x="390" y="314" text-anchor="middle" font-size="13" fill="#94a3b8">obuna ochish</text>

  <!-- 3: qiymatli massiv -->
  <rect x="520" y="90" width="220" height="290" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="520" y="90" width="220" height="44" rx="14" fill="#e0e7ff"/>
  <text x="630" y="119" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">Qiymatli [x]</text>
  <text x="630" y="162" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="600">useEffect(fn, [x])</text>
  <line x1="544" y1="182" x2="716" y2="182" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="630" y="214" text-anchor="middle" font-size="14" fill="#475569">x O'ZGARGANDA</text>
  <text x="630" y="236" text-anchor="middle" font-size="14" fill="#475569">qayta ishlaydi</text>
  <text x="630" y="292" text-anchor="middle" font-size="13" fill="#16a34a">✓ qidiruv, filtr</text>
  <text x="630" y="314" text-anchor="middle" font-size="13" fill="#94a3b8">id o'zgarsa qayta yukla</text>

  <text x="380" y="406" text-anchor="middle" font-size="13" fill="#94a3b8">Qoida: effekt ichida ishlatilgan HAR state/prop massivga yozilishi kerak</text>
</svg>
