<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Qo'lda validatsiya va react-hook-form + zod taqqoslashi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Qo'lda  vs  react-hook-form + zod</text>

  <!-- LEFT: manual -->
  <rect x="36" y="60" width="330" height="180" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="201" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#475569">Qo'lda (useState)</text>
  <text x="56" y="114" font-size="13" fill="#475569">• Har maydonga alohida useState</text>
  <text x="56" y="138" font-size="13" fill="#475569">• Validatsiyani qo'lda yozasiz</text>
  <text x="56" y="162" font-size="13" fill="#475569">• Xato holatini o'zingiz boshqarasiz</text>
  <text x="56" y="186" font-size="13" fill="#dc2626">• Har bosishda butun forma re-render</text>
  <text x="56" y="210" font-size="13" fill="#dc2626">• Tip va qoida ALOHIDA — moslik yo'q</text>
  <text x="56" y="230" font-size="13" fill="#475569">Kichik forma uchun yetarli</text>

  <!-- RIGHT: rhf+zod -->
  <rect x="394" y="60" width="330" height="180" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="559" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#4f46e5">react-hook-form + zod</text>
  <text x="414" y="114" font-size="13" fill="#475569">• useForm hammasini boshqaradi</text>
  <text x="414" y="138" font-size="13" fill="#475569">• Sxema = barcha qoidalar bir joyda</text>
  <text x="414" y="162" font-size="13" fill="#16a34a">• Kam re-render (tezroq)</text>
  <text x="414" y="186" font-size="13" fill="#16a34a">• errors avtomatik to'ldiriladi</text>
  <text x="414" y="210" font-size="13" fill="#16a34a">• Tip sxemadan CHIQADI — bir manba</text>
  <text x="414" y="230" font-size="13" fill="#475569">Katta forma uchun ideal</text>

  <!-- bottom flow: zod schema -> type + validation -->
  <text x="380" y="278" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Zod sxemasi — bitta haqiqat manbai</text>

  <rect x="270" y="294" width="220" height="64" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="380" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#4f46e5">z.object(&#123; ... &#125;)</text>
  <text x="380" y="340" text-anchor="middle" font-size="13" fill="#475569">email, parol, min(6)...</text>

  <!-- two arrows out -->
  <path d="M300 358 L180 400" stroke="#16a34a" stroke-width="2" marker-end="url(#g)"/>
  <path d="M460 358 L580 400" stroke="#0ea5e9" stroke-width="2" marker-end="url(#b)"/>

  <rect x="40" y="404" width="280" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="180" y="428" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">Ish vaqtida tekshiruv</text>
  <text x="180" y="448" text-anchor="middle" font-size="13" fill="#475569">zodResolver &#8594; errors</text>

  <rect x="440" y="404" width="280" height="56" rx="10" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="580" y="428" text-anchor="middle" font-size="14" font-weight="700" fill="#0ea5e9">Kompilyatsiyada tip</text>
  <text x="580" y="448" text-anchor="middle" font-size="13" fill="#475569">z.infer&lt;typeof sxema&gt;</text>

  <defs>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#16a34a"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#0ea5e9"/></marker>
  </defs>
</svg>
