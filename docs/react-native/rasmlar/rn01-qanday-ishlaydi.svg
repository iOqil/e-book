<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>React Native qanday ishlaydi: JavaScript kod Hermes dvigatelida, JSI orqali native modullar bilan, Fabric native UI chizadi</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">React Native ichida nima sodir bo'ladi</text>

  <!-- Layer 1: Your code -->
  <rect x="60" y="62" width="640" height="74" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="380" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#4f46e5">1. Sizning kodingiz: React + JSX</text>
  <text x="380" y="116" text-anchor="middle" font-size="14" fill="#475569">&lt;View&gt;, &lt;Text&gt;, useState — komponentlar va hooklar (JavaScript / TypeScript)</text>

  <!-- arrow -->
  <line x1="380" y1="136" x2="380" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="380,168 374,156 386,156" fill="#94a3b8"/>

  <!-- Layer 2: Hermes -->
  <rect x="60" y="170" width="640" height="74" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="380" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="#0284c7">2. Hermes dvigateli</text>
  <text x="380" y="224" text-anchor="middle" font-size="14" fill="#475569">JS kodni mobilga moslab tez ishga tushiradigan dvigatel (brauzer EMAS)</text>

  <!-- arrow with JSI label -->
  <line x1="380" y1="244" x2="380" y2="270" stroke="#16a34a" stroke-width="3"/>
  <polygon points="380,278 373,265 387,265" fill="#16a34a"/>
  <rect x="300" y="248" width="160" height="24" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="380" y="265" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">JSI ko'prik (to'g'ridan-to'g'ri)</text>

  <!-- Layer 3: Native (Fabric) -->
  <rect x="60" y="282" width="640" height="120" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="310" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">3. Native qatlam: Fabric renderer + TurboModules</text>

  <!-- iOS phone -->
  <rect x="150" y="324" width="180" height="62" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="240" y="350" text-anchor="middle" font-size="14" font-weight="700" fill="#0284c7">iOS</text>
  <text x="240" y="372" text-anchor="middle" font-size="13" fill="#475569">&lt;View&gt; -> UIView</text>

  <!-- Android phone -->
  <rect x="430" y="324" width="180" height="62" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="520" y="350" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">Android</text>
  <text x="520" y="372" text-anchor="middle" font-size="13" fill="#475569">&lt;View&gt; -> android.view</text>

  <text x="380" y="426" text-anchor="middle" font-size="13" fill="#94a3b8">Natija: ekranda haqiqiy native tugma, ro'yxat va matn — HTML emas</text>
</svg>
