<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" width="780" height="520" font-family="Segoe UI, system-ui, sans-serif">
  <title>Ma'lumot oqimi: foydalanuvchi amali komponentdan store va saqlashga, so'ng qayta renderga</title>
  <rect x="0" y="0" width="780" height="520" fill="#f8fafc"/>
  <text x="390" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Ma'lumot oqimi: "Yangi vazifa qo'shildi"</text>

  <!-- 1 Foydalanuvchi -->
  <rect x="40" y="70" width="200" height="80" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="140" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#f59e0b">1. Foydalanuvchi</text>
  <text x="140" y="124" text-anchor="middle" font-size="13" fill="#475569">"Saqlash" tugmasini</text>
  <text x="140" y="142" text-anchor="middle" font-size="13" fill="#475569">bosadi</text>

  <!-- 2 Komponent -->
  <rect x="290" y="70" width="200" height="80" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="390" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#0ea5e9">2. Komponent</text>
  <text x="390" y="124" text-anchor="middle" font-size="13" fill="#475569">onPress -&gt; forma</text>
  <text x="390" y="142" text-anchor="middle" font-size="13" fill="#475569">validatsiya (20)</text>

  <!-- 3 Store -->
  <rect x="540" y="70" width="200" height="80" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="640" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">3. Zustand store</text>
  <text x="640" y="124" text-anchor="middle" font-size="13" fill="#475569">qoshish(vazifa)</text>
  <text x="640" y="142" text-anchor="middle" font-size="13" fill="#475569">holatni yangilaydi (19)</text>

  <!-- strelkalar 1->2->3 -->
  <line x1="240" y1="110" x2="284" y2="110" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="290,110 280,105 280,115" fill="#94a3b8"/>
  <line x1="490" y1="110" x2="534" y2="110" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="540,110 530,105 530,115" fill="#94a3b8"/>

  <!-- pastga store->saqlash -->
  <line x1="640" y1="150" x2="640" y2="208" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="640,214 635,204 645,204" fill="#94a3b8"/>

  <!-- 4 Saqlash -->
  <rect x="490" y="216" width="250" height="96" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="615" y="244" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">4. Barqaror saqlash</text>
  <text x="615" y="268" text-anchor="middle" font-size="13" fill="#475569">persist -&gt; AsyncStorage (18)</text>
  <text x="615" y="288" text-anchor="middle" font-size="13" fill="#475569">(ixtiyoriy) API'ga POST (17)</text>
  <text x="615" y="306" text-anchor="middle" font-size="13" fill="#94a3b8">ilova yopilsa ham qoladi</text>

  <!-- store->subscriber qayta render: chapga past -->
  <line x1="540" y1="130" x2="400" y2="130" stroke="#cbd5e1" stroke-width="0"/>
  <path d="M 590 150 Q 590 360 410 360" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="6 5"/>
  <polygon points="410,360 420,355 420,365" fill="#0ea5e9"/>
  <text x="560" y="340" text-anchor="middle" font-size="13" fill="#0ea5e9">store obunachilarni xabardor qiladi</text>

  <!-- 5 Qayta render -->
  <rect x="120" y="330" width="280" height="96" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="260" y="358" text-anchor="middle" font-size="15" font-weight="700" fill="#0ea5e9">5. Qayta render</text>
  <text x="260" y="382" text-anchor="middle" font-size="13" fill="#475569">FlatList yangi vazifani ko'rsatadi (8)</text>
  <text x="260" y="402" text-anchor="middle" font-size="13" fill="#475569">FadeIn animatsiyasi bilan (24)</text>
  <text x="260" y="420" text-anchor="middle" font-size="13" fill="#94a3b8">faqat o'zgargan qism yangilanadi</text>

  <!-- pastki izoh -->
  <rect x="40" y="452" width="700" height="52" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="390" y="476" text-anchor="middle" font-size="14" font-weight="600" fill="#4f46e5">Bir tomonlama oqim: amal -&gt; holat o'zgaradi -&gt; UI avtomatik yangilanadi</text>
  <text x="390" y="496" text-anchor="middle" font-size="13" fill="#475569">UI'ni qo'lda o'zgartirmaysiz — holatni o'zgartirasiz, React qolganini bajaradi</text>
</svg>
