<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" font-family="Segoe UI, system-ui, sans-serif">
  <title>Ilova ekranlari mokapi: login, vazifalar ro'yxati, qo'shish formasi va detal ekrani</title>
  <rect x="0" y="0" width="820" height="520" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Ekranlar mokapi (wireframe)</text>

  <!-- 1: LOGIN -->
  <rect x="24" y="60" width="180" height="380" rx="24" fill="#ffffff" stroke="#0ea5e9" stroke-width="2.5"/>
  <rect x="84" y="72" width="60" height="10" rx="5" fill="#bae6fd"/>
  <text x="114" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#0ea5e9">VazifaPro</text>
  <text x="114" y="150" text-anchor="middle" font-size="13" fill="#94a3b8">Tizimga kirish</text>
  <rect x="44" y="174" width="140" height="34" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="56" y="196" font-size="13" fill="#94a3b8">Email</text>
  <rect x="44" y="220" width="140" height="34" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="56" y="242" font-size="13" fill="#94a3b8">Parol</text>
  <rect x="44" y="270" width="140" height="38" rx="8" fill="#4f46e5"/>
  <text x="114" y="294" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Kirish</text>
  <text x="114" y="332" text-anchor="middle" font-size="13" fill="#0ea5e9">Hisob yo'qmi? Ro'yxat</text>
  <text x="114" y="466" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Login (25)</text>

  <!-- 2: RO'YXAT -->
  <rect x="220" y="60" width="180" height="380" rx="24" fill="#ffffff" stroke="#0ea5e9" stroke-width="2.5"/>
  <text x="238" y="96" font-size="15" font-weight="700" fill="#1e293b">Vazifalar</text>
  <rect x="238" y="108" width="144" height="30" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="250" y="128" font-size="13" fill="#94a3b8">Qidirish...</text>
  <rect x="238" y="148" width="144" height="42" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
  <circle cx="252" cy="169" r="6" fill="#16a34a"/>
  <text x="266" y="166" font-size="13" fill="#1e293b">Sut sotib olish</text>
  <text x="266" y="182" font-size="13" fill="#94a3b8">Bugun</text>
  <rect x="238" y="196" width="144" height="42" rx="8" fill="#fef9c3" stroke="#fde68a" stroke-width="1.5"/>
  <circle cx="252" cy="217" r="6" fill="#f59e0b"/>
  <text x="266" y="214" font-size="13" fill="#1e293b">Hisobot (muhim)</text>
  <text x="266" y="230" font-size="13" fill="#94a3b8">Ertaga</text>
  <rect x="238" y="244" width="144" height="42" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
  <circle cx="252" cy="265" r="6" fill="#cbd5e1"/>
  <text x="266" y="262" font-size="13" fill="#1e293b">Kitob o'qish</text>
  <text x="266" y="278" font-size="13" fill="#94a3b8">Hafta</text>
  <circle cx="358" cy="384" r="22" fill="#4f46e5"/>
  <text x="358" y="392" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">+</text>
  <text x="310" y="466" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Ro'yxat (8)</text>

  <!-- 3: QO'SHISH -->
  <rect x="416" y="60" width="180" height="380" rx="24" fill="#ffffff" stroke="#0ea5e9" stroke-width="2.5"/>
  <text x="434" y="96" font-size="15" font-weight="700" fill="#1e293b">Yangi vazifa</text>
  <text x="434" y="124" font-size="13" fill="#94a3b8">Sarlavha</text>
  <rect x="434" y="130" width="144" height="34" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="434" y="186" font-size="13" fill="#94a3b8">Izoh</text>
  <rect x="434" y="192" width="144" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="434" y="276" font-size="13" fill="#94a3b8">Muhimligi</text>
  <rect x="434" y="282" width="60" height="28" rx="14" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="464" y="300" text-anchor="middle" font-size="13" fill="#4f46e5">Past</text>
  <rect x="500" y="282" width="60" height="28" rx="14" fill="#4f46e5"/>
  <text x="530" y="300" text-anchor="middle" font-size="13" fill="#ffffff">Yuqori</text>
  <rect x="434" y="330" width="144" height="38" rx="8" fill="#16a34a"/>
  <text x="506" y="354" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Saqlash</text>
  <text x="506" y="466" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Forma (20)</text>

  <!-- 4: DETAL -->
  <rect x="612" y="60" width="180" height="380" rx="24" fill="#ffffff" stroke="#0ea5e9" stroke-width="2.5"/>
  <text x="630" y="96" font-size="13" fill="#0ea5e9">&lt; Orqaga</text>
  <text x="630" y="130" font-size="15" font-weight="700" fill="#1e293b">Hisobot tayyorlash</text>
  <rect x="630" y="146" width="60" height="24" rx="12" fill="#fef9c3" stroke="#fde68a" stroke-width="1.5"/>
  <text x="660" y="162" text-anchor="middle" font-size="13" fill="#f59e0b">Muhim</text>
  <text x="630" y="200" font-size="13" fill="#475569">Choraklik hisobotni</text>
  <text x="630" y="216" font-size="13" fill="#475569">ertaga topshirish kerak.</text>
  <text x="630" y="248" font-size="13" fill="#94a3b8">Muddat: ertaga</text>
  <rect x="630" y="290" width="144" height="36" rx="8" fill="#0ea5e9"/>
  <text x="702" y="313" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Tahrirlash</text>
  <rect x="630" y="334" width="144" height="36" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="702" y="357" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">O'chirish</text>
  <text x="702" y="466" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Detal (16)</text>

  <text x="410" y="500" text-anchor="middle" font-size="13" fill="#94a3b8">Har bir ekran kitobning aniq boblariga tayanadi — qavs ichida bob raqami</text>
</svg>
