<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Props va State taqqoslash: tashqaridan o'zgarmas vs ichki o'zgaruvchan</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Props va State — farqi</text>

  <!-- PROPS ustuni -->
  <rect x="50" y="70" width="320" height="350" rx="14" fill="#ffffff" stroke="#0ea5e9" stroke-width="2.5"/>
  <rect x="50" y="70" width="320" height="50" rx="14" fill="#0ea5e9"/>
  <rect x="50" y="100" width="320" height="20" fill="#0ea5e9"/>
  <text x="210" y="103" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">PROPS</text>

  <text x="74" y="152" font-size="15" font-weight="700" fill="#1e293b">Kimdan?</text>
  <text x="74" y="176" font-size="14" fill="#475569">Tashqaridan — ota komponentdan</text>

  <text x="74" y="214" font-size="15" font-weight="700" fill="#1e293b">O'zgaradimi?</text>
  <text x="74" y="238" font-size="14" fill="#dc2626">Yo'q — o'zgarmas (read-only)</text>

  <text x="74" y="276" font-size="15" font-weight="700" fill="#1e293b">Kim boshqaradi?</text>
  <text x="74" y="300" font-size="14" fill="#475569">Ota komponent</text>

  <text x="74" y="338" font-size="15" font-weight="700" fill="#1e293b">Misol</text>
  <text x="74" y="362" font-size="14" fill="#475569">nom, yosh, rang, onBos</text>
  <text x="74" y="392" font-size="13" fill="#94a3b8">Anketadagi tayyor maydonlar</text>

  <!-- STATE ustuni -->
  <rect x="390" y="70" width="320" height="350" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <rect x="390" y="70" width="320" height="50" rx="14" fill="#16a34a"/>
  <rect x="390" y="100" width="320" height="20" fill="#16a34a"/>
  <text x="550" y="103" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">STATE</text>

  <text x="414" y="152" font-size="15" font-weight="700" fill="#1e293b">Kimdan?</text>
  <text x="414" y="176" font-size="14" fill="#475569">Ichkaridan — komponentning o'zidan</text>

  <text x="414" y="214" font-size="15" font-weight="700" fill="#1e293b">O'zgaradimi?</text>
  <text x="414" y="238" font-size="14" fill="#16a34a">Ha — o'zgaruvchan (setState)</text>

  <text x="414" y="276" font-size="15" font-weight="700" fill="#1e293b">Kim boshqaradi?</text>
  <text x="414" y="300" font-size="14" fill="#475569">Komponentning o'zi</text>

  <text x="414" y="338" font-size="15" font-weight="700" fill="#1e293b">Misol</text>
  <text x="414" y="362" font-size="14" fill="#475569">soni, matn, ochiqmi, yuklanmoqda</text>
  <text x="414" y="392" font-size="13" fill="#94a3b8">Komponentning ichki xotirasi</text>

  <text x="380" y="448" text-anchor="middle" font-size="14" fill="#475569">Props "yuqoridan keladi", state "ichkarida yashaydi" — ikkalasi o'zgarsa UI qayta chiziladi.</text>
</svg>
