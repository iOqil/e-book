<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Sensor obunasi: addListener, data oqimi va cleanup .remove</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Sensorga obuna bo'lish hayoti</text>

  <!-- 1. obuna -->
  <rect x="40" y="74" width="220" height="92" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="150" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">1. Obuna ochiladi</text>
  <text x="150" y="128" text-anchor="middle" font-size="13" fill="#475569">Accelerometer</text>
  <text x="150" y="148" text-anchor="middle" font-size="13" fill="#475569">.addListener(...)</text>

  <!-- 2. data oqimi (sensor -> komponent) -->
  <rect x="300" y="74" width="220" height="92" rx="14" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="410" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#0ea5e9">2. Data oqimi</text>
  <text x="410" y="128" text-anchor="middle" font-size="13" fill="#475569">{ x, y, z } qaytadi</text>
  <text x="410" y="148" text-anchor="middle" font-size="13" fill="#475569">setUpdateInterval(200)</text>

  <!-- 3. cleanup -->
  <rect x="560" y="74" width="200" height="92" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="660" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">3. Cleanup</text>
  <text x="660" y="128" text-anchor="middle" font-size="13" fill="#475569">return () =&gt;</text>
  <text x="660" y="148" text-anchor="middle" font-size="13" fill="#475569">obuna.remove()</text>

  <path d="M262 120 L298 120" stroke="#94a3b8" stroke-width="2" marker-end="url(#s)"/>
  <path d="M522 120 L558 120" stroke="#94a3b8" stroke-width="2" marker-end="url(#s)"/>

  <!-- doimiy oqim ko'rsatish -->
  <text x="380" y="206" text-anchor="middle" font-size="15" fill="#475569">Obuna faol turganda data TO'XTOVSIZ oqib turadi (har ~200 ms):</text>

  <g>
    <rect x="90" y="226" width="120" height="48" rx="10" fill="#f8fafc" stroke="#bae6fd" stroke-width="2"/>
    <text x="150" y="255" text-anchor="middle" font-size="13" fill="#1e293b">x=0.01</text>
    <rect x="230" y="226" width="120" height="48" rx="10" fill="#f8fafc" stroke="#bae6fd" stroke-width="2"/>
    <text x="290" y="255" text-anchor="middle" font-size="13" fill="#1e293b">x=0.42</text>
    <rect x="370" y="226" width="120" height="48" rx="10" fill="#f8fafc" stroke="#bae6fd" stroke-width="2"/>
    <text x="430" y="255" text-anchor="middle" font-size="13" fill="#1e293b">x=0.91</text>
    <rect x="510" y="226" width="120" height="48" rx="10" fill="#f8fafc" stroke="#bae6fd" stroke-width="2"/>
    <text x="570" y="255" text-anchor="middle" font-size="13" fill="#1e293b">y=-0.3</text>
    <text x="668" y="255" font-size="18" fill="#94a3b8">...</text>
    <path d="M212 250 L228 250" stroke="#cbd5e1" stroke-width="2" marker-end="url(#s)"/>
    <path d="M352 250 L368 250" stroke="#cbd5e1" stroke-width="2" marker-end="url(#s)"/>
    <path d="M492 250 L508 250" stroke="#cbd5e1" stroke-width="2" marker-end="url(#s)"/>
  </g>

  <!-- ogohlantirish -->
  <rect x="60" y="312" width="640" height="124" rx="14" fill="#fef9c3" stroke="#f59e0b" stroke-width="2"/>
  <text x="80" y="342" font-size="16" font-weight="700" fill="#1e293b">Nega cleanup SHART?</text>
  <text x="80" y="370" font-size="14" fill="#475569">Agar ekrandan chiqqanda obunani yopmasangiz, sensor data yuborishda davom etadi.</text>
  <text x="80" y="394" font-size="14" fill="#475569">Bu batareyani yeydi va olib tashlangan komponentni yangilashga urinib xato beradi.</text>
  <text x="80" y="418" font-size="14" font-weight="600" fill="#dc2626">useEffect ichida obuna och, return ()  =&gt;  obuna.remove() bilan yop.</text>

  <defs>
    <marker id="s" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#94a3b8"/></marker>
  </defs>
</svg>
