<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" font-family="Segoe UI, system-ui, sans-serif">
<title>Nested navigatorlar daraxti: ildiz Stack ichida Tabs, har tab ichida ekranlar</title>
<rect x="0" y="0" width="760" height="480" fill="#f8fafc"/>
<text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Nested (ichma-ich) navigatorlar daraxti</text>
<text x="380" y="64" text-anchor="middle" font-size="14" fill="#475569">Navigatorni navigator ichiga joylash — katta ilovaning skeleti</text>

<!-- Ildiz Stack -->
<rect x="290" y="90" width="180" height="52" rx="10" fill="#4f46e5"/>
<text x="380" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Ildiz Stack</text>
<text x="380" y="132" text-anchor="middle" font-size="13" fill="#c7d2fe">app/_layout.tsx</text>

<!-- Stack chiziqlari -->
<path d="M380 142 L380 168 L250 168 L250 192" stroke="#6366f1" stroke-width="2" fill="none"/>
<path d="M380 142 L380 168 L530 168 L530 192" stroke="#6366f1" stroke-width="2" fill="none"/>

<!-- (tabs) Tabs -->
<rect x="160" y="192" width="180" height="56" rx="10" fill="#0ea5e9"/>
<text x="250" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">(tabs) — Tabs</text>
<text x="250" y="236" text-anchor="middle" font-size="13" fill="#e0f2fe">(tabs)/_layout.tsx</text>

<!-- modal -->
<rect x="440" y="192" width="180" height="56" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
<text x="530" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">modal ekran</text>
<text x="530" y="236" text-anchor="middle" font-size="13" fill="#b45309">presentation: modal</text>

<!-- Tabs dan tarmoqlar -->
<path d="M250 248 L250 270 L130 270 L130 300" stroke="#38bdf8" stroke-width="2" fill="none"/>
<path d="M250 248 L250 285 L250 300" stroke="#38bdf8" stroke-width="2" fill="none"/>
<path d="M250 248 L250 270 L380 270 L380 300" stroke="#38bdf8" stroke-width="2" fill="none"/>

<!-- Tab 1: Bosh (ichki Stack) -->
<rect x="46" y="300" width="168" height="52" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
<text x="130" y="323" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Bosh tab</text>
<text x="130" y="342" text-anchor="middle" font-size="13" fill="#475569">ichki Stack</text>

<!-- Tab 2: Qidiruv -->
<rect x="166" y="300" width="168" height="52" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
<text x="250" y="323" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Qidiruv tab</text>
<text x="250" y="342" text-anchor="middle" font-size="13" fill="#475569">oddiy ekran</text>

<!-- Tab 3: Profil -->
<rect x="346" y="300" width="168" height="52" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
<text x="430" y="323" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Profil tab</text>
<text x="430" y="342" text-anchor="middle" font-size="13" fill="#475569">oddiy ekran</text>

<!-- Bosh tab ichidagi ekranlar -->
<path d="M90 352 L90 372 L70 372 L70 392" stroke="#94a3b8" stroke-width="1.8" fill="none"/>
<path d="M170 352 L170 372 L200 372 L200 392" stroke="#94a3b8" stroke-width="1.8" fill="none"/>

<rect x="14" y="392" width="112" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="70" y="412" text-anchor="middle" font-size="13" fill="#475569">lenta</text>
<text x="70" y="431" text-anchor="middle" font-size="13" fill="#94a3b8">(index)</text>

<rect x="146" y="392" width="112" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="202" y="412" text-anchor="middle" font-size="13" fill="#475569">maqola/[id]</text>
<text x="202" y="431" text-anchor="middle" font-size="13" fill="#94a3b8">push detal</text>

<!-- Izoh blok -->
<rect x="540" y="300" width="206" height="140" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
<text x="643" y="326" text-anchor="middle" font-size="14" font-weight="700" fill="#4f46e5">O'qish tartibi</text>
<text x="556" y="352" font-size="13" fill="#475569">1. Ildiz Stack — hammasini</text>
<text x="556" y="372" font-size="13" fill="#475569">    o'raydi (modal ham).</text>
<text x="556" y="396" font-size="13" fill="#475569">2. Tabs — pastki menyu.</text>
<text x="556" y="420" font-size="13" fill="#475569">3. Tab ichida push —</text>
<text x="556" y="438" font-size="13" fill="#475569">    detal ochiladi.</text>
</svg>
