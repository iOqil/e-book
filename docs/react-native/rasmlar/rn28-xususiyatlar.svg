<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="Segoe UI, system-ui, sans-serif">
  <title>Yakuniy xususiyatlar xaritasi: qaysi xususiyat kitobning qaysi bobidan kelganini ko'rsatadi</title>
  <rect x="0" y="0" width="800" height="600" fill="#f8fafc"/>
  <text x="400" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Xususiyatlar xaritasi — har biri qaysi bobdan</text>

  <!-- markaz -->
  <circle cx="400" cy="300" r="62" fill="#4f46e5"/>
  <text x="400" y="294" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">VazifaPro</text>
  <text x="400" y="314" text-anchor="middle" font-size="13" fill="#c7d2fe">kapston</text>

  <!-- 8 xususiyat tugun -->
  <!-- 1 Navigatsiya (yuqori chap) -->
  <line x1="352" y1="262" x2="200" y2="120" stroke="#bae6fd" stroke-width="2"/>
  <rect x="40" y="86" width="240" height="70" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="160" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#0ea5e9">Navigatsiya</text>
  <text x="160" y="134" text-anchor="middle" font-size="13" fill="#475569">Stack · js-tabs · [id] detal</text>
  <text x="160" y="150" text-anchor="middle" font-size="13" fill="#94a3b8">14 · 15 · 16</text>

  <!-- 2 Autentifikatsiya (yuqori o'ng) -->
  <line x1="448" y1="262" x2="600" y2="120" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="520" y="86" width="240" height="70" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="640" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#4f46e5">Autentifikatsiya</text>
  <text x="640" y="134" text-anchor="middle" font-size="13" fill="#475569">login · token · himoya</text>
  <text x="640" y="150" text-anchor="middle" font-size="13" fill="#94a3b8">25</text>

  <!-- 3 Global holat (chap) -->
  <line x1="338" y1="290" x2="200" y2="240" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="40" y="206" width="240" height="70" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="160" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#4f46e5">Global holat</text>
  <text x="160" y="254" text-anchor="middle" font-size="13" fill="#475569">Zustand · Context</text>
  <text x="160" y="270" text-anchor="middle" font-size="13" fill="#94a3b8">19</text>

  <!-- 4 Saqlash & API (o'ng) -->
  <line x1="462" y1="290" x2="600" y2="240" stroke="#bbf7d0" stroke-width="2"/>
  <rect x="520" y="206" width="240" height="70" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="640" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">Saqlash &amp; API</text>
  <text x="640" y="254" text-anchor="middle" font-size="13" fill="#475569">AsyncStorage · fetch · CRUD</text>
  <text x="640" y="270" text-anchor="middle" font-size="13" fill="#94a3b8">17 · 18</text>

  <!-- 5 Ro'yxat (chap past) -->
  <line x1="338" y1="318" x2="200" y2="370" stroke="#bae6fd" stroke-width="2"/>
  <rect x="40" y="346" width="240" height="70" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="160" y="372" text-anchor="middle" font-size="14" font-weight="700" fill="#0ea5e9">Ro'yxat &amp; forma</text>
  <text x="160" y="394" text-anchor="middle" font-size="13" fill="#475569">FlatList · qidiruv · validatsiya</text>
  <text x="160" y="410" text-anchor="middle" font-size="13" fill="#94a3b8">8 · 20</text>

  <!-- 6 Native (o'ng past) -->
  <line x1="462" y1="318" x2="600" y2="370" stroke="#fde68a" stroke-width="2"/>
  <rect x="520" y="346" width="240" height="70" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="640" y="372" text-anchor="middle" font-size="14" font-weight="700" fill="#f59e0b">Native imkoniyat</text>
  <text x="640" y="394" text-anchor="middle" font-size="13" fill="#475569">avatar rasm · eslatma push</text>
  <text x="640" y="410" text-anchor="middle" font-size="13" fill="#94a3b8">21 · 23</text>

  <!-- 7 Animatsiya (past chap) -->
  <line x1="372" y1="356" x2="280" y2="470" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="120" y="450" width="240" height="70" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="240" y="476" text-anchor="middle" font-size="14" font-weight="700" fill="#6366f1">Animatsiya &amp; gest</text>
  <text x="240" y="498" text-anchor="middle" font-size="13" fill="#475569">FadeIn · surib o'chirish</text>
  <text x="240" y="514" text-anchor="middle" font-size="13" fill="#94a3b8">24</text>

  <!-- 8 Sifat (past o'ng) -->
  <line x1="428" y1="356" x2="520" y2="470" stroke="#bbf7d0" stroke-width="2"/>
  <rect x="440" y="450" width="240" height="70" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="560" y="476" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">Sifat &amp; chiqarish</text>
  <text x="560" y="498" text-anchor="middle" font-size="13" fill="#475569">test · tezlik · EAS build</text>
  <text x="560" y="514" text-anchor="middle" font-size="13" fill="#94a3b8">26 · 27</text>

  <text x="400" y="566" text-anchor="middle" font-size="14" fill="#475569">SafeArea (7) · loading/xato holatlari (17) — har ekranda</text>
  <text x="400" y="588" text-anchor="middle" font-size="13" fill="#94a3b8">Kapston = butun kitob bilimini bitta ilovada birlashtirish</text>
</svg>
