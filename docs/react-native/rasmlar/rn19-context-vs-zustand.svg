<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Context va Zustand taqqoslash jadvali</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Context va Zustand: qaysi biri qachon?</text>

  <!-- column headers -->
  <rect x="40" y="60" width="220" height="48" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="150" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">Xususiyat</text>

  <rect x="270" y="60" width="220" height="48" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="380" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#4f46e5">Context API</text>

  <rect x="500" y="60" width="220" height="48" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="610" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#0ea5e9">Zustand</text>

  <!-- row 1: o'rnatish -->
  <rect x="40" y="116" width="220" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="55" y="152" font-size="14" font-weight="700" fill="#1e293b">O'rnatish</text>
  <rect x="270" y="116" width="220" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="380" y="143" text-anchor="middle" font-size="14" fill="#16a34a">React'da bor</text>
  <text x="380" y="163" text-anchor="middle" font-size="13" fill="#475569">qo'shimcha paket yo'q</text>
  <rect x="500" y="116" width="220" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="610" y="143" text-anchor="middle" font-size="14" fill="#475569">npm i zustand</text>
  <text x="610" y="163" text-anchor="middle" font-size="13" fill="#475569">kichik paket</text>

  <!-- row 2: Provider -->
  <rect x="40" y="184" width="220" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="55" y="220" font-size="14" font-weight="700" fill="#1e293b">Provider kerakmi?</text>
  <rect x="270" y="184" width="220" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="380" y="220" text-anchor="middle" font-size="14" fill="#dc2626">Ha — ildizda o'rash shart</text>
  <rect x="500" y="184" width="220" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="610" y="220" text-anchor="middle" font-size="14" fill="#16a34a">Yo'q — kerak emas</text>

  <!-- row 3: re-render -->
  <rect x="40" y="252" width="220" height="68" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="55" y="290" font-size="14" font-weight="700" fill="#1e293b">Re-render</text>
  <rect x="270" y="252" width="220" height="68" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="380" y="282" text-anchor="middle" font-size="13" fill="#dc2626">value o'zgarsa BARCHA</text>
  <text x="380" y="301" text-anchor="middle" font-size="13" fill="#dc2626">iste'molchi qayta chiziladi</text>
  <rect x="500" y="252" width="220" height="68" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="610" y="282" text-anchor="middle" font-size="13" fill="#16a34a">selektor bilan faqat</text>
  <text x="610" y="301" text-anchor="middle" font-size="13" fill="#16a34a">kerakli qism — optimal</text>

  <!-- row 4: qachon -->
  <rect x="40" y="326" width="220" height="72" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="55" y="366" font-size="14" font-weight="700" fill="#1e293b">Eng mos holat</text>
  <rect x="270" y="326" width="220" height="72" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="380" y="356" text-anchor="middle" font-size="13" fill="#475569">kichik, kam o'zgaradigan:</text>
  <text x="380" y="376" text-anchor="middle" font-size="13" fill="#4f46e5">tema, til, auth</text>
  <rect x="500" y="326" width="220" height="72" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="610" y="356" text-anchor="middle" font-size="13" fill="#475569">katta, tez o'zgaradigan:</text>
  <text x="610" y="376" text-anchor="middle" font-size="13" fill="#0ea5e9">savatcha, ro'yxat, filtr</text>

  <text x="380" y="436" text-anchor="middle" font-size="14" fill="#475569">Ikkalasini birga ham ishlatsa bo'ladi: auth = Context, savatcha = Zustand</text>
  <text x="380" y="458" text-anchor="middle" font-size="13" fill="#94a3b8">Juda katta jamoaviy ilova uchun: Redux Toolkit</text>
</svg>
