<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Autentifikatsiya oqimi: login formasidan tokengacha va himoyalangan ekrangacha</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Token asosidagi auth oqimi</text>
  <text x="380" y="58" text-anchor="middle" font-size="14" fill="#475569">Login formasidan himoyalangan ekrangacha — to'liq sikl</text>

  <!-- 1. Login formasi (phone mockup) -->
  <rect x="40" y="92" width="170" height="300" rx="24" fill="#ffffff" stroke="#0ea5e9" stroke-width="2.5"/>
  <text x="125" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">1. Login formasi</text>
  <rect x="62" y="140" width="126" height="30" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="74" y="160" font-size="13" fill="#94a3b8">Email</text>
  <rect x="62" y="180" width="126" height="30" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="74" y="200" font-size="13" fill="#94a3b8">Parol ••••</text>
  <rect x="62" y="224" width="126" height="34" rx="8" fill="#4f46e5"/>
  <text x="125" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Kirish</text>
  <text x="125" y="300" text-anchor="middle" font-size="13" fill="#475569">email + parol</text>
  <text x="125" y="320" text-anchor="middle" font-size="13" fill="#475569">kiritiladi</text>

  <!-- 2. Server -->
  <rect x="300" y="120" width="170" height="100" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="385" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">2. Server</text>
  <text x="385" y="174" text-anchor="middle" font-size="13" fill="#475569">POST /login</text>
  <text x="385" y="195" text-anchor="middle" font-size="13" fill="#475569">tekshiradi va</text>
  <text x="385" y="212" text-anchor="middle" font-size="13" fill="#16a34a">token qaytaradi</text>

  <!-- 3. SecureStore -->
  <rect x="560" y="120" width="170" height="100" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="645" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">3. SecureStore</text>
  <text x="645" y="174" text-anchor="middle" font-size="13" fill="#475569">token shifrlangan</text>
  <text x="645" y="192" text-anchor="middle" font-size="13" fill="#475569">holda saqlanadi</text>
  <text x="645" y="210" text-anchor="middle" font-size="13" fill="#f59e0b">(Keychain/Keystore)</text>

  <!-- 4. So'rovga token -->
  <rect x="560" y="280" width="170" height="92" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="645" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">4. Har so'rovga</text>
  <text x="645" y="332" text-anchor="middle" font-size="13" fill="#475569">Authorization:</text>
  <text x="645" y="351" text-anchor="middle" font-size="13" fill="#0ea5e9">Bearer &lt;token&gt;</text>

  <!-- 5. Himoyalangan ekran -->
  <rect x="300" y="280" width="170" height="92" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="385" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">5. Himoyalangan</text>
  <text x="385" y="328" text-anchor="middle" font-size="14" fill="#16a34a">ekran ochiladi</text>
  <text x="385" y="350" text-anchor="middle" font-size="13" fill="#475569">faqat kirgan uchun</text>

  <!-- arrows -->
  <!-- 1 -> 2 -->
  <line x1="210" y1="170" x2="296" y2="170" stroke="#475569" stroke-width="2"/>
  <polygon points="300,170 290,165 290,175" fill="#475569"/>
  <!-- 2 -> 3 -->
  <line x1="470" y1="170" x2="556" y2="170" stroke="#16a34a" stroke-width="2"/>
  <polygon points="560,170 550,165 550,175" fill="#16a34a"/>
  <!-- 3 -> 4 -->
  <line x1="645" y1="220" x2="645" y2="276" stroke="#0ea5e9" stroke-width="2"/>
  <polygon points="645,280 640,270 650,270" fill="#0ea5e9"/>
  <!-- 4 -> 5 -->
  <line x1="560" y1="326" x2="474" y2="326" stroke="#0ea5e9" stroke-width="2"/>
  <polygon points="470,326 480,321 480,331" fill="#0ea5e9"/>

  <!-- token yo'q -> login (back loop) -->
  <line x1="300" y1="345" x2="160" y2="345" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="160" y1="345" x2="160" y2="262" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="160,258 155,268 165,268" fill="#dc2626"/>
  <text x="232" y="364" text-anchor="middle" font-size="13" fill="#dc2626">token yo'q / logout</text>
  <text x="232" y="382" text-anchor="middle" font-size="13" fill="#dc2626">-&gt; login'ga qaytadi</text>

  <text x="380" y="448" text-anchor="middle" font-size="13" fill="#94a3b8">Token bor ekan — ilova ochiq; token o'chsa — yana login</text>
</svg>
