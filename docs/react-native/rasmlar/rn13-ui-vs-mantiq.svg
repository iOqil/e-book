<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="Segoe UI, system-ui, sans-serif">
  <title>Komponent UI bilan, custom hook mantiq bilan shug'ullanadi</title>
  <rect x="0" y="0" width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">UI va mantiqni ajratish</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">Restoran: ofitsiant joylaydi (UI), oshxona pishiradi (mantiq)</text>

  <!-- chap: KOMPONENT (UI) -->
  <rect x="44" y="86" width="320" height="320" rx="14" fill="#ffffff" stroke="#0ea5e9" stroke-width="2.5"/>
  <rect x="44" y="86" width="320" height="44" rx="14" fill="#e0f2fe"/>
  <text x="204" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#0369a1">Komponent (UI)</text>
  <text x="204" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">"Qanday KO'RINADI"</text>

  <!-- telefon mokap -->
  <rect x="124" y="170" width="160" height="208" rx="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <rect x="140" y="190" width="128" height="34" rx="8" fill="#eff6ff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="204" y="212" text-anchor="middle" font-size="13" fill="#475569">Sarlavha</text>
  <rect x="140" y="232" width="128" height="44" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="204" y="259" text-anchor="middle" font-size="13" fill="#475569">PostKarta</text>
  <rect x="140" y="284" width="128" height="44" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="204" y="311" text-anchor="middle" font-size="13" fill="#475569">PostKarta</text>
  <rect x="140" y="336" width="128" height="30" rx="8" fill="#4f46e5"/>
  <text x="204" y="356" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Tugma</text>

  <!-- ko'prik strelkalar -->
  <g>
    <line x1="364" y1="220" x2="430" y2="220" stroke="#16a34a" stroke-width="2.5"/>
    <polygon points="430,213 446,220 430,227" fill="#16a34a"/>
    <text x="405" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">chaqiradi</text>
  </g>
  <g>
    <line x1="446" y1="262" x2="364" y2="262" stroke="#0ea5e9" stroke-width="2.5"/>
    <polygon points="364,255 348,262 364,269" fill="#0ea5e9"/>
    <text x="405" y="282" text-anchor="middle" font-size="13" font-weight="700" fill="#0ea5e9">data qaytaradi</text>
  </g>

  <!-- o'ng: CUSTOM HOOK (mantiq) -->
  <rect x="446" y="86" width="270" height="320" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <rect x="446" y="86" width="270" height="44" rx="14" fill="#ecfdf5"/>
  <text x="581" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#15803d">Custom hook (mantiq)</text>
  <text x="581" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">"Qanday ISHLAYDI"</text>

  <text x="466" y="186" font-size="14" font-weight="700" fill="#0ea5e9">useFetch&lt;T&gt;(url)</text>
  <line x1="466" y1="196" x2="696" y2="196" stroke="#e2e8f0" stroke-width="1"/>
  <text x="466" y="222" font-size="13" fill="#475569">• fetch(url) — so'rov</text>
  <text x="466" y="248" font-size="13" fill="#475569">• useState: data</text>
  <text x="466" y="274" font-size="13" fill="#475569">• useState: yuklanmoqda</text>
  <text x="466" y="300" font-size="13" fill="#475569">• useState: xato</text>
  <text x="466" y="326" font-size="13" fill="#475569">• useEffect + cleanup</text>
  <rect x="462" y="342" width="238" height="36" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="581" y="365" text-anchor="middle" font-size="13" fill="#15803d">return data, yuklanmoqda, xato</text>

  <!-- pastki izoh -->
  <rect x="44" y="418" width="672" height="34" rx="10" fill="#eff6ff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="380" y="441" text-anchor="middle" font-size="14" fill="#1e293b">Har kim o'z ishini qiladi: komponent toza qoladi, mantiq qayta ishlatiladi va oson sinaladi</text>
</svg>
