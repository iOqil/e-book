<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Segoe UI, system-ui, sans-serif">
<title>Bitta [id].tsx fayli barcha /post/N manzillarini ishlaydi</title>
<rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
<text x="380" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Bitta shablon — minglab manzil</text>
<text x="380" y="62" text-anchor="middle" font-size="14" fill="#475569">app/post/[id].tsx — [id] o'zgaruvchi qism</text>

<!-- markazdagi fayl -->
<rect x="280" y="90" width="200" height="78" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/>
<text x="380" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#4f46e5">post/[id].tsx</text>
<text x="380" y="146" text-anchor="middle" font-size="13" fill="#475569">bitta fayl-shablon</text>

<!-- URL'lar -->
<g>
<rect x="60" y="250" width="180" height="56" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
<text x="150" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#0ea5e9">/post/1</text>
<text x="150" y="296" text-anchor="middle" font-size="13" fill="#94a3b8">id = "1"</text>
</g>
<g>
<rect x="290" y="250" width="180" height="56" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
<text x="380" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#0ea5e9">/post/42</text>
<text x="380" y="296" text-anchor="middle" font-size="13" fill="#94a3b8">id = "42"</text>
</g>
<g>
<rect x="520" y="250" width="180" height="56" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
<text x="610" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#0ea5e9">/post/1000</text>
<text x="610" y="296" text-anchor="middle" font-size="13" fill="#94a3b8">id = "1000"</text>
</g>

<!-- strelkalar fayl -> URL -->
<g stroke="#c7d2fe" stroke-width="2.5" fill="none">
<path d="M 330 168 C 260 200, 180 215, 150 250"/>
<path d="M 380 168 L 380 250"/>
<path d="M 430 168 C 500 200, 580 215, 610 250"/>
</g>
<circle cx="150" cy="250" r="3.5" fill="#4f46e5"/>
<circle cx="380" cy="250" r="3.5" fill="#4f46e5"/>
<circle cx="610" cy="250" r="3.5" fill="#4f46e5"/>

<text x="380" y="360" text-anchor="middle" font-size="14" fill="#475569">Har bir manzil shu bitta faylga keladi — faqat</text>
<text x="380" y="382" text-anchor="middle" font-size="14" font-weight="600" fill="#16a34a">id qiymati har xil bo'ladi</text>
</svg>
