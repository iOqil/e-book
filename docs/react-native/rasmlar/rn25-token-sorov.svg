<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Segoe UI, system-ui, sans-serif">
  <title>Token har so'rovga qo'shilishi: Authorization Bearer header bilan serverga yuborish</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Tokenni so'rovga qo'shish</text>
  <text x="380" y="58" text-anchor="middle" font-size="14" fill="#475569">Har bir himoyalangan so'rovga Authorization: Bearer token qo'shiladi</text>

  <!-- App -->
  <rect x="50" y="150" width="150" height="110" rx="14" fill="#ffffff" stroke="#0ea5e9" stroke-width="2.5"/>
  <text x="125" y="195" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Ilova</text>
  <text x="125" y="220" text-anchor="middle" font-size="13" fill="#475569">so'rov yuboradi</text>
  <text x="125" y="238" text-anchor="middle" font-size="13" fill="#475569">(fetch / axios)</text>

  <!-- SecureStore feeding token -->
  <rect x="50" y="296" width="150" height="80" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="125" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">SecureStore</text>
  <text x="125" y="346" text-anchor="middle" font-size="13" fill="#475569">tokenOqi()</text>
  <text x="125" y="364" text-anchor="middle" font-size="13" fill="#f59e0b">tokenni beradi</text>
  <line x1="125" y1="296" x2="125" y2="264" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="125,260 120,270 130,270" fill="#f59e0b"/>

  <!-- Request packet (header) -->
  <rect x="250" y="120" width="280" height="170" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="390" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">HTTP so'rovi</text>
  <rect x="272" y="164" width="236" height="36" rx="7" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="284" y="187" font-size="13" fill="#1e293b">GET /profil</text>
  <rect x="272" y="208" width="236" height="62" rx="7" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="284" y="230" font-size="13" font-weight="700" fill="#1e293b">headers:</text>
  <text x="284" y="252" font-size="13" fill="#4f46e5">Authorization:</text>
  <text x="296" y="268" font-size="13" fill="#4f46e5">Bearer eyJhbGci...</text>

  <!-- Server -->
  <rect x="580" y="150" width="150" height="110" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="655" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Server</text>
  <text x="655" y="214" text-anchor="middle" font-size="13" fill="#475569">tokenni</text>
  <text x="655" y="232" text-anchor="middle" font-size="13" fill="#16a34a">tekshiradi</text>
  <text x="655" y="250" text-anchor="middle" font-size="13" fill="#475569">javob beradi</text>

  <!-- arrows -->
  <line x1="200" y1="180" x2="246" y2="180" stroke="#475569" stroke-width="2"/>
  <polygon points="250,180 240,175 240,185" fill="#475569"/>
  <line x1="530" y1="200" x2="576" y2="200" stroke="#16a34a" stroke-width="2"/>
  <polygon points="580,200 570,195 570,205" fill="#16a34a"/>

  <!-- 401 note -->
  <rect x="250" y="318" width="480" height="62" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="270" y="344" font-size="14" font-weight="700" fill="#dc2626">401 = token yaroqsiz / eskirgan</text>
  <text x="270" y="366" font-size="13" fill="#475569">-&gt; refresh token bilan yangilash yoki logout qilib login'ga qaytarish</text>

  <text x="380" y="410" text-anchor="middle" font-size="13" fill="#94a3b8">Bitta "sorov" o'ram funksiyasi (yoki axios interceptor) tokenni avtomatik qo'shadi</text>
</svg>
