<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" font-family="Segoe UI, system-ui, sans-serif">
  <title>MyApp loyihasining papka tuzilishi: src/app ildizi, components, assets va konfiguratsiya fayllari</title>
  <rect x="0" y="0" width="760" height="520" fill="#f8fafc"/>
  <text x="380" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Loyiha tuzilishi</text>
  <text x="380" y="64" text-anchor="middle" font-size="14" fill="#475569">Har bir fayl va papka nima uchun kerak</text>

  <!-- Daraxt asosiy panel -->
  <rect x="40" y="88" width="380" height="404" rx="12" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>

  <!-- MyApp ildiz -->
  <text x="64" y="124" font-size="16" font-weight="700" fill="#4f46e5">MyApp/</text>

  <!-- src/ -->
  <text x="88" y="154" font-size="15" font-weight="700" fill="#0ea5e9">src/</text>

  <!-- src/app/ -->
  <text x="116" y="182" font-size="15" font-weight="700" fill="#0ea5e9">app/</text>
  <text x="290" y="182" font-size="13" fill="#94a3b8">navigatsiya ildizi</text>

  <!-- index.tsx -->
  <text x="148" y="208" font-size="14" fill="#1e293b">index.tsx</text>
  <text x="290" y="208" font-size="13" fill="#94a3b8">bosh ekran</text>

  <!-- _layout.tsx -->
  <text x="148" y="232" font-size="14" fill="#1e293b">_layout.tsx</text>
  <text x="290" y="232" font-size="13" fill="#94a3b8">navigator</text>

  <!-- components/ -->
  <text x="116" y="262" font-size="15" font-weight="700" fill="#0ea5e9">components/</text>
  <text x="290" y="262" font-size="13" fill="#94a3b8">UI bo'laklari</text>

  <!-- assets/ -->
  <text x="88" y="294" font-size="15" font-weight="700" fill="#f59e0b">assets/</text>
  <text x="290" y="294" font-size="13" fill="#94a3b8">rasm, ikonka</text>

  <!-- app.json -->
  <text x="88" y="328" font-size="14" fill="#1e293b">app.json</text>
  <text x="290" y="328" font-size="13" fill="#94a3b8">ilova sozlamalari</text>

  <!-- package.json -->
  <text x="88" y="362" font-size="14" fill="#1e293b">package.json</text>
  <text x="290" y="362" font-size="13" fill="#94a3b8">kutubxonalar</text>

  <!-- tsconfig.json -->
  <text x="88" y="396" font-size="14" fill="#1e293b">tsconfig.json</text>
  <text x="290" y="396" font-size="13" fill="#94a3b8">TypeScript</text>

  <!-- chiziqlar (daraxt shoxlari) -->
  <line x1="72" y1="132" x2="72" y2="386" stroke="#c7d2fe" stroke-width="1.5"/>
  <line x1="72" y1="148" x2="84" y2="148" stroke="#c7d2fe" stroke-width="1.5"/>
  <line x1="72" y1="288" x2="84" y2="288" stroke="#c7d2fe" stroke-width="1.5"/>
  <line x1="72" y1="322" x2="84" y2="322" stroke="#c7d2fe" stroke-width="1.5"/>
  <line x1="72" y1="356" x2="84" y2="356" stroke="#c7d2fe" stroke-width="1.5"/>
  <line x1="72" y1="390" x2="84" y2="390" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="64" y="440" font-size="13" fill="#94a3b8">Ildiz app/ yoki src/app/ — qoidalar bir xil</text>

  <!-- O'ng panel: izoh -->
  <rect x="440" y="88" width="280" height="190" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="464" y="118" font-size="16" font-weight="700" fill="#4f46e5">Eng muhimlari</text>
  <circle cx="470" cy="146" r="5" fill="#0ea5e9"/>
  <text x="486" y="151" font-size="14" fill="#475569">src/app/ — har fayl bir ekran</text>
  <circle cx="470" cy="176" r="5" fill="#0ea5e9"/>
  <text x="486" y="181" font-size="14" fill="#475569">index.tsx — ilova ochilganda</text>
  <circle cx="470" cy="206" r="5" fill="#4f46e5"/>
  <text x="486" y="211" font-size="14" fill="#475569">_layout.tsx — ekranlarni o'rar</text>
  <circle cx="470" cy="236" r="5" fill="#f59e0b"/>
  <text x="486" y="241" font-size="14" fill="#475569">app.json — ilova pasporti</text>

  <!-- O'ng pastki panel: main -->
  <rect x="440" y="298" width="280" height="194" rx="12" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
  <text x="464" y="328" font-size="16" font-weight="700" fill="#0ea5e9">package.json ichida</text>
  <rect x="464" y="346" width="232" height="34" rx="7" fill="#f1f5f9"/>
  <text x="476" y="368" font-size="13" fill="#1e293b">"main": "expo-router/entry"</text>
  <text x="464" y="406" font-size="13" fill="#475569">expo ~56 · react-native 0.85</text>
  <text x="464" y="428" font-size="13" fill="#475569">react 19</text>
  <rect x="464" y="444" width="232" height="34" rx="7" fill="#eef2ff"/>
  <text x="476" y="466" font-size="13" fill="#4f46e5">tsconfig: @/* -&gt; ./src/*</text>
</svg>
