<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" font-family="Segoe UI, system-ui, sans-serif">
  <title>Loyiha papka tuzilishi va har papkaning vazifasi</title>
  <rect x="0" y="0" width="760" height="500" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Professional loyiha tuzilishi</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">Har papka — bitta aniq vazifa (kutubxonadagi javonlar kabi)</text>

  <!-- ildiz -->
  <rect x="40" y="84" width="150" height="34" rx="8" fill="#4f46e5"/>
  <text x="115" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">src/</text>

  <!-- vertikal chiziq -->
  <line x1="60" y1="118" x2="60" y2="452" stroke="#c7d2fe" stroke-width="2"/>

  <!-- qatorlar: nom + tavsif -->
  <!-- app -->
  <line x1="60" y1="148" x2="84" y2="148" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="84" y="130" width="150" height="36" rx="8" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="99" y="153" font-size="14" font-weight="700" fill="#0ea5e9">app/</text>
  <text x="252" y="153" font-size="14" fill="#475569">Marshrutlar (ekranlar) — Expo Router shu yerdan o'qiydi</text>

  <!-- components -->
  <line x1="60" y1="192" x2="84" y2="192" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="84" y="174" width="150" height="36" rx="8" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="99" y="197" font-size="14" font-weight="700" fill="#0ea5e9">components/</text>
  <text x="252" y="197" font-size="14" fill="#475569">Qayta ishlatiladigan UI bo'laklari (Tugma, Karta)</text>

  <!-- hooks -->
  <line x1="60" y1="236" x2="84" y2="236" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="84" y="218" width="150" height="36" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="99" y="241" font-size="14" font-weight="700" fill="#16a34a">hooks/</text>
  <text x="252" y="241" font-size="14" fill="#475569">Custom hooklar (useFetch, useToggle, useDebounce)</text>

  <!-- lib -->
  <line x1="60" y1="280" x2="84" y2="280" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="84" y="262" width="150" height="36" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="99" y="285" font-size="14" font-weight="700" fill="#6366f1">lib/ (utils/)</text>
  <text x="252" y="285" font-size="14" fill="#475569">Sof yordamchi funksiyalar (sana formati, validatsiya)</text>

  <!-- constants -->
  <line x1="60" y1="324" x2="84" y2="324" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="84" y="306" width="150" height="36" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="99" y="329" font-size="14" font-weight="700" fill="#6366f1">constants/</text>
  <text x="252" y="329" font-size="14" fill="#475569">O'zgarmaslar: tema (ranglar), config, base URL</text>

  <!-- types -->
  <line x1="60" y1="368" x2="84" y2="368" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="84" y="350" width="150" height="36" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="99" y="373" font-size="14" font-weight="700" fill="#f59e0b">types/</text>
  <text x="252" y="373" font-size="14" fill="#475569">Umumiy TypeScript tiplari (Post, Foydalanuvchi)</text>

  <!-- services -->
  <line x1="60" y1="412" x2="84" y2="412" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="84" y="394" width="150" height="36" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="99" y="417" font-size="14" font-weight="700" fill="#f59e0b">services/ (api/)</text>
  <text x="252" y="417" font-size="14" fill="#475569">Tarmoq qatlami: server bilan ishlash (fetch)</text>

  <!-- pastki izoh: alias -->
  <rect x="40" y="450" width="680" height="38" rx="10" fill="#eff6ff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="380" y="474" text-anchor="middle" font-size="14" fill="#1e293b">Import uchun "@/" alias: import useFetch from '@/hooks/useFetch'  (../../../ jahannami yo'q)</text>
</svg>
