<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Segoe UI, system-ui, sans-serif">
  <title>Joylashuvni olish oqimi: ruxsat, getCurrentPositionAsync, koordinatalar, ishlatish</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Joylashuvni olish oqimi</text>

  <!-- 1. Ruxsat -->
  <rect x="40" y="70" width="200" height="96" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="140" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#4f46e5">1. Ruxsat so'rash</text>
  <text x="140" y="124" text-anchor="middle" font-size="13" fill="#475569">requestForeground</text>
  <text x="140" y="142" text-anchor="middle" font-size="13" fill="#475569">PermissionsAsync()</text>
  <text x="140" y="160" text-anchor="middle" font-size="13" fill="#94a3b8">status === 'granted' ?</text>

  <!-- arrow -->
  <line x1="240" y1="118" x2="296" y2="118" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="296,113 308,118 296,123" fill="#94a3b8"/>

  <!-- 2. So'rov -->
  <rect x="308" y="70" width="200" height="96" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="408" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#0ea5e9">2. Joyni so'rash</text>
  <text x="408" y="124" text-anchor="middle" font-size="13" fill="#475569">getCurrentPosition</text>
  <text x="408" y="142" text-anchor="middle" font-size="13" fill="#475569">Async(&#123; accuracy &#125;)</text>
  <text x="408" y="160" text-anchor="middle" font-size="13" fill="#94a3b8">await — GPS ishlaydi</text>

  <!-- arrow -->
  <line x1="508" y1="118" x2="564" y2="118" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="564,113 576,118 564,123" fill="#94a3b8"/>

  <!-- 3. Natija -->
  <rect x="576" y="70" width="160" height="96" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="656" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">3. Natija</text>
  <text x="656" y="124" text-anchor="middle" font-size="13" fill="#475569">LocationObject</text>
  <text x="656" y="142" text-anchor="middle" font-size="13" fill="#475569">&#123; coords, ... &#125;</text>

  <!-- down arrow from natija -->
  <line x1="656" y1="166" x2="656" y2="212" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="651,212 656,224 661,212" fill="#94a3b8"/>

  <!-- coords box -->
  <rect x="220" y="226" width="436" height="110" rx="12" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
  <text x="438" y="254" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">joy.coords — koordinatalar</text>
  <text x="320" y="286" text-anchor="middle" font-size="14" fill="#0ea5e9" font-weight="600">latitude</text>
  <text x="320" y="306" text-anchor="middle" font-size="13" fill="#475569">kenglik (41.31)</text>
  <text x="438" y="286" text-anchor="middle" font-size="14" fill="#0ea5e9" font-weight="600">longitude</text>
  <text x="438" y="306" text-anchor="middle" font-size="13" fill="#475569">uzunlik (69.27)</text>
  <text x="556" y="286" text-anchor="middle" font-size="14" fill="#0ea5e9" font-weight="600">accuracy</text>
  <text x="556" y="306" text-anchor="middle" font-size="13" fill="#475569">aniqlik (metr)</text>

  <!-- usage -->
  <line x1="220" y1="281" x2="180" y2="281" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="180,276 168,281 180,286" fill="#94a3b8"/>
  <rect x="24" y="244" width="144" height="74" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="96" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">4. Ishlatish</text>
  <text x="96" y="298" text-anchor="middle" font-size="13" fill="#475569">xarita, marker,</text>
  <text x="96" y="314" text-anchor="middle" font-size="13" fill="#475569">yaqin joylar</text>

  <text x="380" y="382" text-anchor="middle" font-size="14" fill="#475569">Ruxsatsiz joylashuv olinmaydi — har doim avval ruxsatni tekshiring.</text>
  <text x="380" y="406" text-anchor="middle" font-size="13" fill="#94a3b8">expo-location paketi · accuracy qancha yuqori bo'lsa, batareyaga shuncha og'ir</text>
</svg>
