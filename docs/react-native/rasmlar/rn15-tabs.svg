<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
<title>Pastki tab menyu: Bosh, Qidiruv, Profil ikonkalari, faol tab belgilangan</title>
<rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
<text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Tab navigatsiya — pastki menyu</text>
<text x="380" y="64" text-anchor="middle" font-size="14" fill="#475569">Instagram/Telegram kabi: bir bosishda ekranlar orasida o'tish</text>

<!-- Telefon ramkasi -->
<rect x="270" y="90" width="220" height="350" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
<!-- Notch -->
<rect x="345" y="100" width="70" height="10" rx="5" fill="#cbd5e1"/>

<!-- Ekran mazmuni (faol tab = Bosh) -->
<rect x="284" y="124" width="192" height="276" rx="10" fill="#f1f5f9"/>
<text x="380" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Bosh sahifa</text>
<rect x="300" y="180" width="160" height="44" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
<text x="380" y="207" text-anchor="middle" font-size="13" fill="#475569">Yangiliklar lentasi</text>
<rect x="300" y="234" width="160" height="44" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
<text x="380" y="261" text-anchor="middle" font-size="13" fill="#475569">Post #1</text>
<rect x="300" y="288" width="160" height="44" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
<text x="380" y="315" text-anchor="middle" font-size="13" fill="#475569">Post #2</text>

<!-- Pastki tab paneli -->
<rect x="284" y="346" width="192" height="54" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<line x1="284" y1="346" x2="476" y2="346" stroke="#e2e8f0" stroke-width="1.5"/>

<!-- Tab 1: Bosh (FAOL) -->
<circle cx="316" cy="368" r="12" fill="#eef2ff"/>
<path d="M310 369 L316 363 L322 369 L322 374 L318 374 L318 370 L314 370 L314 374 L310 374 Z" fill="#4f46e5"/>
<text x="316" y="392" text-anchor="middle" font-size="13" font-weight="700" fill="#4f46e5">Bosh</text>

<!-- Tab 2: Qidiruv -->
<circle cx="380" cy="368" r="9" fill="none" stroke="#94a3b8" stroke-width="2.2"/>
<line x1="386" y1="374" x2="392" y2="380" stroke="#94a3b8" stroke-width="2.2"/>
<text x="380" y="392" text-anchor="middle" font-size="13" fill="#94a3b8">Qidiruv</text>

<!-- Tab 3: Profil + badge -->
<circle cx="444" cy="364" r="5" fill="none" stroke="#94a3b8" stroke-width="2.2"/>
<path d="M436 378 Q444 370 452 378" fill="none" stroke="#94a3b8" stroke-width="2.2"/>
<circle cx="453" cy="357" r="7" fill="#dc2626"/>
<text x="453" y="361" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
<text x="444" y="392" text-anchor="middle" font-size="13" fill="#94a3b8">Profil</text>

<!-- O'ng izoh -->
<rect x="520" y="150" width="220" height="56" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
<text x="630" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#4f46e5">Faol tab</text>
<text x="630" y="194" text-anchor="middle" font-size="13" fill="#475569">rang + qalin yozuv</text>

<rect x="520" y="222" width="220" height="56" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="630" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">Nofaol tablar</text>
<text x="630" y="266" text-anchor="middle" font-size="13" fill="#475569">och kulrang ikonka</text>

<rect x="520" y="294" width="220" height="56" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
<text x="630" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">Badge (belgicha)</text>
<text x="630" y="338" text-anchor="middle" font-size="13" fill="#475569">tabBarBadge: 3</text>

<text x="380" y="430" text-anchor="middle" font-size="13" fill="#94a3b8">Har tab — alohida ekran. Holat saqlanadi: qaytganda joyida turadi.</text>
</svg>
