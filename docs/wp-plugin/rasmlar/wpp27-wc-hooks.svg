<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
  <title>WooCommerce oqimi: mahsulot, savat, checkout, buyurtma va email bosqichlari, har bir bosqich ustida plugin ulanishi mumkin bo'lgan hook nuqtalari</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">WooCommerce oqimi va hook nuqtalari</text>

  <!-- 5 ta bosqich qutilari -->
  <!-- product -->
  <rect x="24" y="120" width="128" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="88" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e40af">Mahsulot</text>
  <text x="88" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(product)</text>

  <!-- cart -->
  <rect x="178" y="120" width="128" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="242" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e40af">Savat</text>
  <text x="242" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(cart)</text>

  <!-- checkout -->
  <rect x="332" y="120" width="128" height="70" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="396" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Checkout</text>
  <text x="396" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(to'lov)</text>

  <!-- order -->
  <rect x="486" y="120" width="128" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="550" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">Buyurtma</text>
  <text x="550" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(order)</text>

  <!-- email -->
  <rect x="640" y="120" width="96" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="688" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#7c3aed">Email</text>
  <text x="688" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(xabar)</text>

  <!-- strelkalar -->
  <line x1="152" y1="155" x2="176" y2="155" stroke="#475569" stroke-width="2"/>
  <polygon points="176,155 167,150 167,160" fill="#475569"/>
  <line x1="306" y1="155" x2="330" y2="155" stroke="#475569" stroke-width="2"/>
  <polygon points="330,155 321,150 321,160" fill="#475569"/>
  <line x1="460" y1="155" x2="484" y2="155" stroke="#475569" stroke-width="2"/>
  <polygon points="484,155 475,150 475,160" fill="#475569"/>
  <line x1="614" y1="155" x2="638" y2="155" stroke="#475569" stroke-width="2"/>
  <polygon points="638,155 629,150 629,160" fill="#475569"/>

  <!-- hook nuqtalari (har bosqich ostida) -->
  <text x="88" y="216" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">hook'lar:</text>
  <text x="88" y="238" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">_product_options_</text>
  <text x="88" y="256" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">general_product_data</text>
  <text x="88" y="276" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">_admin_process_</text>
  <text x="88" y="294" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">product_object</text>

  <text x="242" y="216" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">hook:</text>
  <text x="242" y="238" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">_before_add_</text>
  <text x="242" y="256" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">to_cart_button</text>

  <text x="396" y="216" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f59e0b">hook'lar:</text>
  <text x="396" y="238" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">_checkout_fields</text>
  <text x="396" y="256" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(filter)</text>
  <text x="396" y="276" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">_checkout_process</text>
  <text x="396" y="294" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">_create_order</text>

  <text x="550" y="216" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">hook:</text>
  <text x="550" y="238" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">_thankyou</text>
  <text x="550" y="262" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">CRUD: wc_get_order</text>
  <text x="550" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">get_total / get_status</text>

  <text x="688" y="216" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#7c3aed">hook:</text>
  <text x="688" y="238" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">_email_</text>
  <text x="688" y="256" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">order_details</text>

  <!-- pastki izoh -->
  <rect x="60" y="330" width="640" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="356" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Naqsh: WooCommerce har bosqichda hook ochadi -> siz ulanasiz</text>
  <text x="380" y="380" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Hook prefiksi 'woocommerce_' (joy tejash uchun yuqorida qisqartirilgan). Filter qiymat qaytaradi, action yo'q.</text>
</svg>
