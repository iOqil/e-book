<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
  <title>AJAX oqimi: JavaScript fetch action va nonce bilan admin-ajax.php ga so'rov yuboradi, WordPress wp_ajax hook handler'ini chaqiradi, handler tekshirib JSON qaytaradi</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">admin-ajax.php AJAX oqimi</text>

  <!-- Klient (JS) -->
  <rect x="30" y="70" width="200" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e40af">1. Klient (JS)</text>
  <text x="130" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">fetch(ajaxUrl, POST)</text>
  <text x="130" y="142" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">action + nonce + ma'lumot</text>
  <text x="130" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">credentials: same-origin</text>

  <!-- admin-ajax.php -->
  <rect x="285" y="70" width="190" height="100" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#92590a">2. admin-ajax.php</text>
  <text x="380" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">action qiymatidan</text>
  <text x="380" y="143" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">hook nomi yasaydi</text>

  <!-- Handler -->
  <rect x="530" y="70" width="200" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="630" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#15803d">3. Handler (PHP)</text>
  <text x="630" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">check_ajax_referer()</text>
  <text x="630" y="141" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">current_user_can()</text>
  <text x="630" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">sanitize + ish</text>

  <!-- arrows top row -->
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <line x1="230" y1="120" x2="283" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="475" y1="120" x2="528" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <!-- hook label -->
  <rect x="270" y="200" width="220" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="380" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#5b21b6">hook nomi (action = kk_add_favorite):</text>
  <text x="380" y="245" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">wp_ajax_kk_add_favorite</text>

  <line x1="380" y1="170" x2="380" y2="198" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="490" y1="228" x2="600" y2="228" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="630" y1="226" x2="630" y2="172" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar)"/>

  <!-- JSON response -->
  <rect x="530" y="300" width="200" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="630" y="326" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#15803d">4. JSON javob</text>
  <text x="630" y="349" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">wp_send_json_success()</text>
  <text x="630" y="368" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">{ success: true, data }</text>

  <line x1="630" y1="170" x2="630" y2="298" stroke="#16a34a" stroke-width="2" marker-end="url(#ar)"/>

  <!-- back to client -->
  <rect x="30" y="300" width="200" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="326" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e40af">5. Klient UI yangilash</text>
  <text x="130" y="349" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">.then(result =&gt; ...)</text>
  <text x="130" y="368" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tugma = "Sevimlida"</text>

  <line x1="528" y1="340" x2="232" y2="340" stroke="#16a34a" stroke-width="2" marker-end="url(#ar)"/>
  <text x="380" y="333" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#15803d">JSON javob (sahifa qayta yuklanmaydi)</text>
</svg>
