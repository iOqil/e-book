<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430">
  <title>Autoloaded options muammosi: har bir sahifa so'rovida wp_load_alloptions barcha autoload=yes optionlarni bitta so'rovda xotiraga yuklaydi, katta autoload yuki saytni sekinlashtiradi</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Autoloaded options: har so'rovda yuklanadi</text>

  <!-- Every request -->
  <rect x="40" y="64" width="190" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="135" y="90" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">HAR sahifa so'rovi</text>
  <text x="135" y="111" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">(har bir tashrif)</text>

  <path d="M230 94 L296 94" stroke="#94a3b8" stroke-width="2"/>
  <path d="M296 94 l-10 -5 l0 10 z" fill="#94a3b8"/>

  <!-- wp_load_alloptions -->
  <rect x="300" y="58" width="220" height="72" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="410" y="86" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">wp_load_alloptions()</text>
  <text x="410" y="107" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">autoload='yes' optionlarni</text>
  <text x="410" y="123" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">BITTA so'rovda yuklaydi</text>

  <path d="M520 94 L586 94" stroke="#94a3b8" stroke-width="2"/>
  <path d="M586 94 l-10 -5 l0 10 z" fill="#94a3b8"/>

  <rect x="590" y="64" width="140" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="90" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Xotiraga (cache)</text>
  <text x="660" y="111" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">get_option uchun</text>

  <!-- divider -->
  <line x1="40" y1="156" x2="720" y2="156" stroke="#e2e8f0" stroke-width="2"/>

  <!-- GOOD small -->
  <rect x="60" y="178" width="300" height="210" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="210" y="206" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">YAXSHI: kichik autoload</text>
  <rect x="84" y="222" width="252" height="30" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="98" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">sozlamalar (kichik massiv)</text>
  <rect x="84" y="258" width="252" height="30" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="98" y="278" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">db_version (qisqa string)</text>
  <text x="210" y="318" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">tez-tez kerak, kichik →</text>
  <text x="210" y="338" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">autoload: true</text>
  <text x="210" y="368" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">yengil yuk, tez so'rov</text>

  <!-- BAD big -->
  <rect x="400" y="178" width="300" height="210" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="550" y="206" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="middle">YOMON: shishgan autoload</text>
  <rect x="424" y="222" width="252" height="30" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="438" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">import_log (500 KB)</text>
  <rect x="424" y="258" width="252" height="30" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="438" y="278" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">kesh natijasi (katta, kam kerak)</text>
  <text x="550" y="318" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">katta/kam kerak, lekin</text>
  <text x="550" y="338" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">autoload: true (xato!)</text>
  <text x="550" y="368" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">har so'rovda ortiqcha yuk</text>

  <text x="380" y="414" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Katta yoki kam kerak ma'lumotni add_option(..., autoload: false) bilan saqlang.</text>
</svg>
