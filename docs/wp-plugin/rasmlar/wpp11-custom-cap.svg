<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430">
  <title>Custom capability oqimi: register_post_type capability_type 'kitob' va map_meta_cap true dan cap'lar quriladi, meta cap edit_kitob map_meta_cap filteri orqali kontekstga qarab primitive cap edit_kitoblar yoki edit_others_kitoblar ga aylanadi</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Custom cap: meta cap to primitive cap</text>

  <defs>
    <marker id="ccarrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- register_post_type -->
  <rect x="40" y="70" width="240" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="98" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">register_post_type('kitob')</text>
  <text x="160" y="122" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e40af" text-anchor="middle">capability_type:</text>
  <text x="160" y="140" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e40af" text-anchor="middle">['kitob','kitoblar']</text>
  <text x="160" y="156" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">map_meta_cap: true</text>

  <!-- generated caps -->
  <rect x="40" y="200" width="240" height="190" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="160" y="226" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Quriladigan cap'lar</text>
  <text x="160" y="252" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">META (ID bilan):</text>
  <text x="160" y="272" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">edit_kitob, read_kitob,</text>
  <text x="160" y="290" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">delete_kitob</text>
  <text x="160" y="316" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">PRIMITIVE (rolga):</text>
  <text x="160" y="336" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">edit_kitoblar,</text>
  <text x="160" y="354" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">edit_others_kitoblar,</text>
  <text x="160" y="372" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">publish_kitoblar ...</text>

  <path d="M160 160 L160 198" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ccarrow)"/>

  <!-- check -->
  <rect x="330" y="90" width="220" height="70" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="440" y="118" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">current_user_can(</text>
  <text x="440" y="140" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">'edit_kitob', $id )  // META</text>

  <!-- map_meta_cap -->
  <rect x="330" y="200" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="440" y="230" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">map_meta_cap()</text>
  <text x="440" y="252" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">kitob kimniki + holati?</text>
  <text x="440" y="268" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">(+ map_meta_cap filteri)</text>

  <path d="M440 160 L440 198" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#ccarrow)"/>

  <!-- primitive result own -->
  <rect x="590" y="186" width="150" height="56" rx="10" fill="#16a34a"/>
  <text x="665" y="210" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">o'ziniki:</text>
  <text x="665" y="229" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dcfce7" text-anchor="middle">edit_kitoblar</text>

  <!-- primitive result others -->
  <rect x="590" y="256" width="150" height="56" rx="10" fill="#2563eb"/>
  <text x="665" y="280" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">boshqaniki:</text>
  <text x="665" y="299" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dbeafe" text-anchor="middle">edit_others_kitoblar</text>

  <path d="M550 230 L588 214" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#ccarrow)"/>
  <path d="M550 244 L588 280" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#ccarrow)"/>

  <text x="380" y="412" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Meta cap kontekstga qarab primitive cap'ga aylanadi; foydalanuvchida o'sha primitive cap bormi tekshiriladi</text>
</svg>
