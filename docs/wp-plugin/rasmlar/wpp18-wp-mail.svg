<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380">
  <title>wp_mail oqimi: to, subject, message va headers tayyorlanadi, Content-Type text/html qo'shiladi, wp_mail xatni topshiradi, natijada true topshirildi yoki false xato qaytadi</title>
  <rect x="0" y="0" width="760" height="380" fill="#f8fafc"/>
  <text x="380" y="34" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">wp_mail: HTML email yuborish oqimi</text>

  <!-- Inputs box -->
  <rect x="40" y="64" width="220" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="88" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">Argumentlar</text>
  <text x="60" y="114" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">$to — qabul qiluvchi</text>
  <text x="60" y="137" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">$subject — mavzu</text>
  <text x="60" y="160" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">$message — HTML matn</text>
  <text x="60" y="183" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">$headers — From,</text>
  <text x="60" y="202" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Reply-To, Content-Type</text>

  <path d="M260 139 L320 139" stroke="#94a3b8" stroke-width="2"/>
  <path d="M320 139 l-10 -5 l0 10 z" fill="#94a3b8"/>

  <!-- Content-Type step -->
  <rect x="320" y="100" width="200" height="78" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="420" y="128" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Content-Type:</text>
  <text x="420" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">text/html</text>
  <text x="420" y="170" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">(HTML uchun)</text>

  <path d="M520 139 L580 139" stroke="#94a3b8" stroke-width="2"/>
  <path d="M580 139 l-10 -5 l0 10 z" fill="#94a3b8"/>

  <!-- wp_mail call -->
  <rect x="580" y="108" width="160" height="62" rx="10" fill="#2563eb"/>
  <text x="660" y="135" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">wp_mail()</text>
  <text x="660" y="156" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dbeafe" text-anchor="middle">topshiradi</text>

  <path d="M660 170 L660 220" stroke="#94a3b8" stroke-width="2"/>
  <path d="M660 220 l-5 -10 l10 0 z" fill="#94a3b8"/>

  <!-- Return decision -->
  <path d="M660 220 L740 256 L660 292 L580 256 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="660" y="252" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">qaytaruv</text>
  <text x="660" y="270" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">bool</text>

  <!-- true -->
  <rect x="360" y="226" width="180" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="252" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">true = topshirildi</text>
  <text x="450" y="272" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">(yetkazildi emas!)</text>
  <path d="M580 256 L540 256" stroke="#16a34a" stroke-width="2"/>
  <path d="M540 256 l10 -5 l0 10 z" fill="#16a34a"/>

  <!-- false -->
  <rect x="560" y="312" width="200" height="48" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="660" y="341" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">false = topshirilmadi</text>
  <path d="M660 292 L660 312" stroke="#dc2626" stroke-width="2"/>
  <path d="M660 312 l-5 -10 l10 0 z" fill="#dc2626"/>

  <!-- SMTP note -->
  <rect x="40" y="296" width="490" height="64" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="60" y="322" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Ishonchli yetkazish uchun sayt egasi SMTP plugin (WP Mail SMTP)</text>
  <text x="60" y="344" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">o'rnatadi — sizning wp_mail() kodingiz o'zgarmaydi.</text>
</svg>
