<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430">
  <title>PSR-4 autoload sinf toliq nomini fayl yoliga aylantiradi: Oqil\KitobKatalog\PostTypes src bopgicha PostTypes.php fayliga moslanadi</title>
  <defs>
    <marker id="p4-arr" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>

  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">PSR-4: sinf nomi to'g'ridan fayl yo'liga</text>
  <text x="380" y="54" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">require yozmaysiz — autoloader sinf birinchi ishlatilganda faylni topadi</text>

  <!-- composer.json mapping qutisi -->
  <rect x="180" y="76" width="400" height="64" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">composer.json   autoload.psr-4</text>
  <text x="380" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#7c3aed">"Oqil\KitobKatalog\\"  =&gt;  "src/"</text>

  <!-- Sinf to'liq nomi -->
  <rect x="60" y="178" width="640" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="200" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Sinfning to'liq nomi (FQCN):</text>
  <text x="92" y="226" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Oqil\KitobKatalog</text>
  <text x="320" y="226" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">\</text>
  <text x="332" y="226" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">PostTypes</text>

  <!-- prefiks va qoldiq yoriqlari -->
  <text x="200" y="262" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">prefiks =&gt; src/ ga almashadi</text>
  <text x="430" y="262" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">qoldiq =&gt; yo'l + .php</text>

  <!-- pastga strelka -->
  <line x1="380" y1="270" x2="380" y2="306" stroke="#2563eb" stroke-width="2.5" marker-end="url(#p4-arr)"/>

  <!-- Fayl yo'li natijasi -->
  <rect x="60" y="312" width="640" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="80" y="334" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Autoloader topadigan fayl:</text>
  <text x="92" y="360" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">src/</text>
  <text x="138" y="360" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">PostTypes.php</text>

  <text x="380" y="402" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-style="italic" fill="#475569">Qoida: namespace daraxti = papka daraxti. Sinf nomi = fayl nomi (katta-kichik harf MUHIM).</text>
</svg>
