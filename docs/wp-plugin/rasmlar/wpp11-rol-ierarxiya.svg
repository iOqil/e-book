<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>WordPress rol ierarxiyasi: subscriber eng kam, undan contributor, author, editor, eng yuqorida administrator eng keng capability to'plamiga ega; har rol pastdagining capability'larini o'z ichiga oladi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Rol ierarxiyasi: capability to'plamlari</text>

  <!-- Subscriber -->
  <rect x="280" y="58" width="200" height="60" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="380" y="82" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Subscriber</text>
  <text x="380" y="104" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">read</text>

  <!-- Contributor -->
  <rect x="240" y="134" width="280" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="158" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Contributor</text>
  <text x="380" y="180" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">+ edit_posts, delete_posts (nashr YO'Q)</text>

  <!-- Author -->
  <rect x="200" y="212" width="360" height="62" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="236" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Author</text>
  <text x="380" y="258" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">+ publish_posts, upload_files, edit_published_posts</text>

  <!-- Editor -->
  <rect x="150" y="290" width="460" height="62" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="314" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Editor</text>
  <text x="380" y="336" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">+ edit_others_posts, read_private_posts, moderate_comments</text>

  <!-- Administrator -->
  <rect x="90" y="368" width="580" height="68" rx="10" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <text x="380" y="396" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Administrator (eng keng)</text>
  <text x="380" y="420" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dbeafe" text-anchor="middle">+ manage_options, install_plugins, edit_users, switch_themes</text>

  <!-- Arrow legend on the left -->
  <path d="M55 100 L55 405" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#strel)"/>
  <defs>
    <marker id="strel" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="42" y="250" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle" transform="rotate(-90 42 250)">ko'proq capability</text>
</svg>
