<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>WordPress so'rov hayot sikli: wp-config.php dan render gacha bosqichlar va plugin hook nuqtalari</title>
  <defs>
    <marker id="lc-ok" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>

  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">WordPress so'rov hayot sikli</text>
  <text x="380" y="54" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Brauzer so'rovidan sahifa render gacha — plugin shu oqimga hook orqali kiradi</text>

  <!-- Bosqichlar (chap ustun: yuklash) -->
  <!-- 1 wp-config -->
  <rect x="40" y="80" width="300" height="42" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="190" y="106" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">wp-config.php — sozlama, DB ulanishi</text>

  <line x1="190" y1="122" x2="190" y2="138" stroke="#475569" stroke-width="2" marker-end="url(#lc-ok)"/>

  <!-- 2 wp-load -->
  <rect x="40" y="138" width="300" height="42" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="190" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">wp-load.php — yadroni yuklaydi</text>

  <line x1="190" y1="180" x2="190" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#lc-ok)"/>

  <!-- 3 muplugins_loaded HOOK -->
  <rect x="40" y="196" width="300" height="42" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="190" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">muplugins_loaded — mu-plugin'lar</text>

  <line x1="190" y1="238" x2="190" y2="254" stroke="#475569" stroke-width="2" marker-end="url(#lc-ok)"/>

  <!-- 4 plugins_loaded HOOK -->
  <rect x="40" y="254" width="300" height="42" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="190" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">plugins_loaded — plugin'lar yuklandi</text>

  <line x1="190" y1="296" x2="190" y2="312" stroke="#475569" stroke-width="2" marker-end="url(#lc-ok)"/>

  <!-- 5 init HOOK -->
  <rect x="40" y="312" width="300" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="190" y="338" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">init — CPT, taxonomy, shortcode</text>

  <line x1="190" y1="354" x2="190" y2="370" stroke="#475569" stroke-width="2" marker-end="url(#lc-ok)"/>

  <!-- 6 wp_loaded HOOK -->
  <rect x="40" y="370" width="300" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="190" y="396" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">wp_loaded — WP to'liq tayyor</text>

  <!-- O'ng ustun: so'rov ishlovi -->
  <line x1="340" y1="391" x2="420" y2="391" stroke="#475569" stroke-width="2"/>
  <line x1="420" y1="391" x2="420" y2="100" stroke="#475569" stroke-width="2"/>
  <line x1="420" y1="100" x2="436" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#lc-ok)"/>

  <!-- 7 so'rov tahlili -->
  <rect x="440" y="80" width="280" height="42" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="580" y="106" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">So'rov tahlili — qaysi sahifa?</text>

  <line x1="580" y1="122" x2="580" y2="138" stroke="#475569" stroke-width="2" marker-end="url(#lc-ok)"/>

  <!-- 8 template_redirect HOOK -->
  <rect x="440" y="138" width="280" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="580" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">template_redirect — shablon oldidan</text>

  <line x1="580" y1="180" x2="580" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#lc-ok)"/>

  <!-- 9 render -->
  <rect x="440" y="196" width="280" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="580" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Render — HTML brauzerga</text>

  <!-- Izoh quti -->
  <rect x="440" y="262" width="280" height="150" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <text x="580" y="288" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">Plugin qayerga ulanadi?</text>
  <text x="455" y="314" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Binafsha = erta yuklash bosqichi.</text>
  <text x="455" y="336" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Ko'k = ro'yxatdan o'tkazish (init).</text>
  <text x="455" y="358" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Yashil = chiqishni o'zgartirish.</text>
  <text x="455" y="384" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Har hook — plugin uchun</text>
  <text x="455" y="402" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">"so'zlash navbati".</text>

  <text x="380" y="446" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Hook'lar har doim shu tartibda ishlaydi. To'g'ri hook'ni tanlash — vaqtni to'g'ri tanlash demakdir.</text>
</svg>
