<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
  <title>Ierarxik taxonomiya daraxt ko'rinishida va tekis teg taxonomiyasi yonma-yon taqqoslangan</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Taxonomiyaning ikki turi</text>

  <!-- Chap: ierarxik -->
  <rect x="30" y="56" width="340" height="334" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#1e40af">hierarchical = true</text>
  <text x="200" y="106" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">kategoriya-kabi (daraxt, checkbox)</text>

  <!-- daraxt root -->
  <rect x="120" y="128" width="160" height="38" rx="8" fill="#2563eb"/>
  <text x="200" y="152" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Ilmiy</text>

  <!-- shoxlar -->
  <path d="M200 166 L200 196 L110 196 L110 214" fill="none" stroke="#1e40af" stroke-width="2"/>
  <path d="M200 196 L290 196 L290 214" fill="none" stroke="#1e40af" stroke-width="2"/>
  <rect x="48" y="214" width="124" height="36" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="237" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Fizika</text>
  <rect x="228" y="214" width="124" height="36" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="290" y="237" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Biologiya</text>

  <!-- ikkinchi root -->
  <rect x="120" y="278" width="160" height="38" rx="8" fill="#2563eb"/>
  <text x="200" y="302" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Tarix</text>
  <path d="M200 316 L200 344 L200 344" fill="none" stroke="#1e40af" stroke-width="2"/>
  <rect x="120" y="344" width="160" height="34" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="366" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Qadimgi davr</text>

  <!-- O'ng: tekis -->
  <rect x="390" y="56" width="340" height="334" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="560" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#475569">hierarchical = false</text>
  <text x="560" y="106" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">teg-kabi (tekis, vergulli)</text>

  <rect x="416" y="140" width="130" height="38" rx="19" fill="#f59e0b"/>
  <text x="481" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">bestseller</text>
  <rect x="566" y="140" width="100" height="38" rx="19" fill="#f59e0b"/>
  <text x="616" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">yangi</text>

  <rect x="416" y="196" width="120" height="38" rx="19" fill="#f59e0b"/>
  <text x="476" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">chegirma</text>
  <rect x="556" y="196" width="120" height="38" rx="19" fill="#f59e0b"/>
  <text x="616" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">tavsiya</text>

  <rect x="446" y="252" width="170" height="38" rx="19" fill="#f59e0b"/>
  <text x="531" y="276" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">qattiq muqova</text>

  <text x="560" y="332" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Term'lar teng huquqli,</text>
  <text x="560" y="354" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">ota-bola munosabati YO'Q</text>
</svg>
