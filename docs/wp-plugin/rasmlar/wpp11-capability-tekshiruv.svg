<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
  <title>Capability tekshiruvi oqimi: so'rov keladi, is_user_logged_in tekshiriladi, keyin current_user_can capability bilan chaqiriladi; ha bo'lsa amal bajariladi, yo'q bo'lsa wp_die yoki 403 bilan rad etiladi</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="34" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Ruxsat tekshiruvi: current_user_can</text>

  <defs>
    <marker id="ctarrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Request -->
  <rect x="40" y="80" width="180" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="108" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">So'rov keladi</text>
  <text x="130" y="129" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">forma / AJAX / REST</text>

  <!-- logged in check -->
  <rect x="290" y="76" width="190" height="72" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="385" y="106" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">is_user_logged_in()?</text>
  <text x="385" y="128" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">login qilganmi</text>

  <path d="M220 112 L288 112" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ctarrow)"/>

  <!-- capability check -->
  <rect x="290" y="200" width="190" height="84" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="385" y="230" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">current_user_can(</text>
  <text x="385" y="252" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e40af" text-anchor="middle">'edit_kitoblar' )?</text>
  <text x="385" y="273" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">CAPABILITY (rol emas)</text>

  <path d="M385 148 L385 198" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ctarrow)"/>
  <text x="400" y="178" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" text-anchor="start">ha</text>

  <!-- allowed -->
  <rect x="540" y="206" width="190" height="72" rx="10" fill="#16a34a"/>
  <text x="635" y="236" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Ruxsat: amalni</text>
  <text x="635" y="258" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">bajaramiz</text>
  <path d="M480 242 L538 242" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#ctarrow)"/>
  <text x="510" y="232" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle">ha</text>

  <!-- denied -->
  <rect x="290" y="328" width="440" height="64" rx="10" fill="#dc2626"/>
  <text x="510" y="356" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Rad etiladi: wp_die(...) yoki 403</text>
  <text x="510" y="378" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#fecaca" text-anchor="middle">login yo'q YOKI capability yo'q</text>

  <path d="M385 284 L385 326" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#ctarrow)"/>
  <text x="402" y="312" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626" text-anchor="start">yo'q</text>
  <path d="M250 148 L250 360 L288 360" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#ctarrow)"/>
  <text x="232" y="250" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">yo'q</text>
</svg>
