<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>Plugin header doc-block: har bir maydon (Plugin Name, Version, Requires PHP, Text Domain, License) izohi bilan</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Plugin header (doc-block)</text>
  <text x="380" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">asosiy faylning eng tepasidagi izoh &#8212; WordPress shuni o'qiydi</text>

  <!-- code panel -->
  <rect x="40" y="78" width="380" height="368" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="58" y="106" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">/**</text>
  <text x="58" y="130" font-family="Consolas, monospace" font-size="13" fill="#dbeafe"> * Plugin Name: Kitoblar katalogi</text>
  <text x="58" y="154" font-family="Consolas, monospace" font-size="13" fill="#dcfce7"> * Description: Kitoblar CPT...</text>
  <text x="58" y="178" font-family="Consolas, monospace" font-size="13" fill="#dcfce7"> * Version: 0.1.0</text>
  <text x="58" y="202" font-family="Consolas, monospace" font-size="13" fill="#fef3c7"> * Requires at least: 7.0</text>
  <text x="58" y="226" font-family="Consolas, monospace" font-size="13" fill="#fef3c7"> * Requires PHP: 8.3</text>
  <text x="58" y="250" font-family="Consolas, monospace" font-size="13" fill="#dcfce7"> * Author: Oqil Imomnazarov</text>
  <text x="58" y="274" font-family="Consolas, monospace" font-size="13" fill="#ede9fe"> * Text Domain: kitoblar-katalogi</text>
  <text x="58" y="298" font-family="Consolas, monospace" font-size="13" fill="#ede9fe"> * Domain Path: /languages</text>
  <text x="58" y="322" font-family="Consolas, monospace" font-size="13" fill="#fecaca"> * License: GPL-2.0-or-later</text>
  <text x="58" y="346" font-family="Consolas, monospace" font-size="13" fill="#94a3b8"> */</text>

  <!-- annotations -->
  <text x="440" y="124" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">&#9656; MAJBURIY &#8212; busiz ko'rinmaydi</text>
  <text x="440" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">&#9656; ro'yxatdagi qisqa tavsif</text>
  <text x="440" y="176" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">&#9656; yangilanish/kesh uchun versiya</text>
  <text x="440" y="216" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#92400e">&#9656; min. WP/PHP &#8212; mos kelmasa</text>
  <text x="440" y="234" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#92400e">&#160;&#160;&#160;aktivatsiya bloklanadi</text>
  <text x="440" y="262" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">&#9656; muallif (admin'da havola)</text>
  <text x="440" y="288" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#7c3aed">&#9656; i18n kaliti &#8212; slug bilan bir xil</text>
  <text x="440" y="314" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#7c3aed">&#9656; tarjima fayllari papkasi</text>
  <text x="440" y="340" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">&#9656; GPL-mos litsenziya (shart)</text>

  <!-- bottom rule box -->
  <rect x="440" y="362" width="280" height="84" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="456" y="386" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">Qoida</text>
  <text x="456" y="408" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Faqat Plugin Name majburiy,</text>
  <text x="456" y="426" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">lekin professional plugin</text>
  <text x="456" y="444" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">hamma maydonni to'ldiradi.</text>
</svg>
