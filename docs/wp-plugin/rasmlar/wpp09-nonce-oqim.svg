<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">
  <title>Nonce oqimi: formada wp_nonce_field yashirin token chiqaradi, foydalanuvchi yuborganda wp_verify_nonce tokenni tasdiqlaydi va saqlaydi, soxta yoki tokensiz so'rovni esa rad etadi</title>

  <rect x="0" y="0" width="760" height="400" fill="#f8fafc"/>

  <text x="380" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Nonce: soxta so'rovni rad etish (CSRF himoyasi)</text>

  <!-- 1 forma -->
  <rect x="40" y="80" width="220" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="150" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e40af">1. Forma chiziladi</text>
  <text x="150" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">wp_nonce_field(</text>
  <text x="150" y="151" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">'kitob_meta_saqlash')</text>
  <text x="150" y="171" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">-> yashirin token</text>

  <line x1="260" y1="130" x2="320" y2="130" stroke="#94a3b8" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 2 submit -->
  <rect x="320" y="80" width="180" height="100" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="410" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b45309">2. Submit</text>
  <text x="410" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">token $_POST bilan</text>
  <text x="410" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">serverga yuboriladi</text>

  <line x1="500" y1="130" x2="560" y2="130" stroke="#94a3b8" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 3 verify -->
  <rect x="560" y="80" width="180" height="100" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="650" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#6d28d9">3. Tekshiruv</text>
  <text x="650" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">wp_verify_nonce(</text>
  <text x="650" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">$token, $action)</text>

  <!-- ikki tarmoq -->
  <line x1="650" y1="180" x2="560" y2="232" stroke="#16a34a" stroke-width="3" marker-end="url(#arrG)"/>
  <line x1="650" y1="180" x2="650" y2="232" stroke="#dc2626" stroke-width="3" marker-end="url(#arrR)"/>

  <!-- yaroqli -->
  <rect x="420" y="234" width="270" height="78" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="555" y="261" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#15803d">Yaroqli (1 yoki 2)</text>
  <text x="555" y="285" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">capability + sanitize -></text>
  <text x="555" y="304" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#15803d">update_post_meta()</text>

  <!-- yaroqsiz -->
  <rect x="555" y="332" width="185" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="647" y="357" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b91c1c">false -> RAD ETILADI</text>
  <text x="647" y="378" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">return (hech narsa yozilmaydi)</text>

  <!-- hujumchi -->
  <rect x="40" y="234" width="300" height="78" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="190" y="261" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b91c1c">Soxta sayt (CSRF)</text>
  <text x="190" y="285" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yashirin so'rov yuboradi —</text>
  <text x="190" y="305" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tokeni yo'q/noto'g'ri</text>
  <line x1="340" y1="270" x2="555" y2="125" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrR)"/>
  <text x="430" y="215" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b91c1c">token tekshiruvda yiqiladi</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
</svg>
