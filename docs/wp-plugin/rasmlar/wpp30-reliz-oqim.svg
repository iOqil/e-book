<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430">
  <title>Reliz oqimi: ishlab chiqishdan npm build, phpcs, phpunit, readme stable tag va SVN orqali wordpress.org ga chiqarish</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Reliz oqimi: dev -&gt; wordpress.org</text>

  <defs>
    <marker id="ok" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <g font-family="Segoe UI, system-ui, sans-serif">
    <!-- 1 dev -->
    <rect x="40" y="64" width="200" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="140" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">1. Dev</text>
    <text x="140" y="110" text-anchor="middle" font-size="13" fill="#475569">kod yozish · git branch</text>

    <!-- 2 build -->
    <rect x="280" y="64" width="200" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="380" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#6d28d9">2. npm run build</text>
    <text x="380" y="110" text-anchor="middle" font-size="13" fill="#475569">@wordpress/scripts -&gt; build/</text>

    <!-- 3 phpcs -->
    <rect x="520" y="64" width="200" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="620" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">3. phpcs (WPCS)</text>
    <text x="620" y="110" text-anchor="middle" font-size="13" fill="#475569">coding standard + security</text>

    <!-- 4 phpunit -->
    <rect x="520" y="172" width="200" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="620" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">4. phpunit</text>
    <text x="620" y="218" text-anchor="middle" font-size="13" fill="#475569">wp-env test (25-bob)</text>

    <!-- 5 readme/stable -->
    <rect x="280" y="172" width="200" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="380" y="194" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">5. readme.txt</text>
    <text x="380" y="213" text-anchor="middle" font-size="13" fill="#475569">Stable tag + Changelog</text>
    <text x="380" y="227" text-anchor="middle" font-size="13" fill="#475569">+ versiya header</text>

    <!-- 6 SVN -->
    <rect x="40" y="172" width="200" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="140" y="194" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">6. SVN</text>
    <text x="140" y="213" text-anchor="middle" font-size="13" fill="#475569">trunk -&gt; tags/1.0.0</text>
    <text x="140" y="227" text-anchor="middle" font-size="13" fill="#475569">assets/ (28-bob)</text>

    <!-- 7 wordpress.org -->
    <rect x="220" y="300" width="320" height="64" rx="10" fill="#16a34a"/>
    <text x="380" y="328" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">7. wordpress.org</text>
    <text x="380" y="350" text-anchor="middle" font-size="13" fill="#dcfce7">foydalanuvchilar avtomatik yangilanish oladi</text>
  </g>

  <!-- strelkalar -->
  <g stroke="#16a34a" stroke-width="2" fill="none">
    <line x1="240" y1="94" x2="276" y2="94" marker-end="url(#ok)"/>
    <line x1="480" y1="94" x2="516" y2="94" marker-end="url(#ok)"/>
    <line x1="620" y1="124" x2="620" y2="168" marker-end="url(#ok)"/>
    <line x1="520" y1="202" x2="484" y2="202" marker-end="url(#ok)"/>
    <line x1="280" y1="202" x2="244" y2="202" marker-end="url(#ok)"/>
    <line x1="140" y1="232" x2="320" y2="296" marker-end="url(#ok)"/>
  </g>

  <!-- gate izoh -->
  <rect x="40" y="386" width="680" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="380" y="407" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">Har darvoza qizil bo'lsa -&gt; reliz to'xtaydi: build, phpcs va phpunit YASHIL bo'lmaguncha SVN ga chiqarmang.</text>
</svg>
