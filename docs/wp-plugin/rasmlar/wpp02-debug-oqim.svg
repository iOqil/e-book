<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360">
  <title>WordPress debug oqimi: kodda xato yuz beradi, WP_DEBUG va WP_DEBUG_LOG yoqilgan bo'lsa xato wp-content/debug.log fayliga yoziladi, siz log faylni kuzatib o'qiysiz va tuzatasiz</title>

  <rect x="0" y="0" width="760" height="360" fill="#f8fafc"/>

  <text x="380" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Xatoni debug.log orqali topish</text>
  <text x="380" y="60" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">WP_DEBUG_DISPLAY false bo'lsa, ekran toza qoladi — xato logga ketadi</text>

  <!-- 1 xato -->
  <rect x="28" y="92" width="170" height="150" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="113" y="120" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">1. Xato</text>
  <text x="113" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">PHP notice / warning</text>
  <text x="113" y="166" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">fatal error</text>
  <text x="113" y="194" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yoki o'zingiz:</text>
  <text x="113" y="214" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">error_log($x)</text>

  <line x1="198" y1="167" x2="258" y2="167" stroke="#94a3b8" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 2 konstantalar -->
  <rect x="258" y="92" width="232" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="374" y="120" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">2. wp-config.php</text>
  <text x="374" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">WP_DEBUG = true</text>
  <text x="374" y="168" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">WP_DEBUG_LOG = true</text>
  <text x="374" y="190" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">WP_DEBUG_DISPLAY = false</text>
  <text x="374" y="216" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">bu yoqilsa, xato yo'naltiriladi</text>

  <line x1="490" y1="167" x2="550" y2="167" stroke="#94a3b8" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 3 log fayl -->
  <rect x="550" y="92" width="184" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="642" y="120" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">3. Log fayl</text>
  <text x="642" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">wp-content/</text>
  <text x="642" y="168" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">debug.log</text>
  <text x="642" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">vaqt + xabar + manba</text>
  <text x="642" y="216" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">fayli to'planib boradi</text>

  <!-- 4 o'qish -->
  <rect x="258" y="270" width="232" height="62" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="374" y="296" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">4. Siz o'qiysiz</text>
  <text x="374" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tail -f debug.log · Query Monitor</text>
  <line x1="642" y1="242" x2="642" y2="301" stroke="#f59e0b" stroke-width="3"/>
  <line x1="642" y1="301" x2="494" y2="301" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrY)"/>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrY" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <text x="380" y="352" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Xatoni topdingiz, kodni tuzatdingiz — sahifani yangilab, log toza qolishini tekshiring</text>
</svg>
