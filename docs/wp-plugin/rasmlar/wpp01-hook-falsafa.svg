<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
  <title>Hook falsafasi: yadro o'zgarmaydi, plugin yadroning hook nuqtalaridan o'z kodini ulaydi</title>
  <defs>
    <marker id="hf-ok" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>

  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Hook falsafasi</text>
  <text x="380" y="54" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Yadroni ochmaysan — u o'zi senga "kengaytirish nuqtalari" beradi</text>

  <!-- Yadro oqimi (markaziy chiziq) -->
  <rect x="40" y="96" width="680" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="60" y="124" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">Yadro oqimi (o'zgarmaydi)</text>

  <!-- yadro ichidagi hook nuqtalari -->
  <circle cx="180" cy="156" r="9" fill="#f59e0b" stroke="#1e293b" stroke-width="1.5"/>
  <text x="180" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">1</text>
  <circle cx="380" cy="156" r="9" fill="#f59e0b" stroke="#1e293b" stroke-width="1.5"/>
  <text x="380" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">2</text>
  <circle cx="580" cy="156" r="9" fill="#f59e0b" stroke="#1e293b" stroke-width="1.5"/>
  <text x="580" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">3</text>
  <line x1="60" y1="156" x2="171" y2="156" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="189" y1="156" x2="371" y2="156" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="389" y1="156" x2="571" y2="156" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="589" y1="156" x2="700" y2="156" stroke="#2563eb" stroke-width="2.5"/>
  <text x="660" y="160" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">...</text>

  <!-- Pastdagi plugin kodlari hook nuqtalariga ulanadi -->
  <line x1="180" y1="220" x2="180" y2="167" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#hf-ok)"/>
  <line x1="380" y1="220" x2="380" y2="167" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#hf-ok)"/>
  <line x1="580" y1="220" x2="580" y2="167" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#hf-ok)"/>

  <!-- plugin quti 1 -->
  <rect x="70" y="224" width="220" height="92" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="180" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">init nuqtasida</text>
  <text x="180" y="270" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">add_action('init', ...)</text>
  <text x="180" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">"kitob" CPT'sini</text>
  <text x="180" y="308" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">ro'yxatga olaman</text>

  <!-- plugin quti 2 -->
  <rect x="300" y="224" width="160" height="92" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="380" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">filter nuqtasida</text>
  <text x="380" y="270" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">add_filter(...)</text>
  <text x="380" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">sarlavhani</text>
  <text x="380" y="308" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">o'zgartiraman</text>

  <!-- plugin quti 3 -->
  <rect x="470" y="224" width="220" height="92" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="580" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">render nuqtasida</text>
  <text x="580" y="270" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">add_filter('the_content')</text>
  <text x="580" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">matn oxiriga</text>
  <text x="580" y="308" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">blok qo'shaman</text>

  <!-- Pastki taqqoslash -->
  <rect x="70" y="344" width="290" height="52" rx="9" fill="#fef3c7" stroke="#dc2626" stroke-width="2"/>
  <text x="215" y="368" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">Yadroni tahrirlasang</text>
  <text x="215" y="388" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">yangilanishda yo'qoladi</text>

  <rect x="400" y="344" width="290" height="52" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="545" y="368" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">Hook ishlatsang</text>
  <text x="545" y="388" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">yangilanishdan keyin ham yashaydi</text>
</svg>
