<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380">
  <title>PHP-only blok faqat block.json va render.php fayllaridan iborat, JS build qadami umuman yo'q, register_block_type papkani o'qiydi</title>
  <rect x="0" y="0" width="760" height="380" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">PHP-only blok (JS build YO'Q)</text>

  <!-- folder -->
  <rect x="40" y="66" width="300" height="240" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="190" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">bloklar/eslatma/</text>

  <rect x="64" y="110" width="252" height="74" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="80" y="136" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">block.json</text>
  <text x="80" y="158" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">"render": "file:./render.php"</text>
  <text x="80" y="177" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">editorScript YO'Q</text>

  <rect x="64" y="196" width="252" height="74" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="80" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">render.php</text>
  <text x="80" y="244" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">get_block_wrapper_attributes()</text>
  <text x="80" y="263" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">+ escape qilingan HTML</text>

  <text x="190" y="296" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Atigi 2 fayl</text>

  <!-- no build cross -->
  <rect x="390" y="96" width="150" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="465" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">npm run build</text>
  <line x1="405" y1="108" x2="525" y2="184" stroke="#dc2626" stroke-width="3"/>
  <line x1="525" y1="108" x2="405" y2="184" stroke="#dc2626" stroke-width="3"/>
  <text x="465" y="216" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">webpack/JSX KERAK EMAS</text>

  <!-- arrow folder -> register -->
  <line x1="340" y1="240" x2="585" y2="240" stroke="#475569" stroke-width="2"/>
  <polygon points="585,240 575,235 575,245" fill="#475569"/>
  <text x="462" y="232" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">init hook</text>

  <!-- register box -->
  <rect x="588" y="196" width="150" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="663" y="228" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">register_</text>
  <text x="663" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">block_type()</text>
  <text x="663" y="272" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">papkani o'qiydi</text>

  <!-- bottom note -->
  <rect x="40" y="324" width="698" height="42" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="389" y="350" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Mos: sodda server bloklar (banner, eslatma, minimal ro'yxat). Boy muharrir UI uchun esa edit.js (JS) kerak.</text>
</svg>
