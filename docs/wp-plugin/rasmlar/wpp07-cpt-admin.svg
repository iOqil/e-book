<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430">
  <title>CPT admin ro'yxati va unga qo'shilgan maxsus Muqova va Muallif ustunlari</title>
  <defs>
    <marker id="ad-arr" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>

  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Admin ro'yxatiga maxsus ustunlar</text>
  <text x="380" y="54" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">manage_kitob_posts_columns (filter) + manage_kitob_posts_custom_column (action)</text>

  <!-- jadval konteyner -->
  <rect x="40" y="80" width="680" height="230" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="2"/>

  <!-- header qatori -->
  <rect x="40" y="80" width="680" height="40" rx="8" fill="#e2e8f0"/>
  <rect x="40" y="100" width="680" height="20" fill="#e2e8f0"/>
  <text x="70" y="106" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Muqova</text>
  <text x="200" y="106" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Sarlavha</text>
  <text x="420" y="106" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Muallif</text>
  <text x="630" y="106" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Sana</text>

  <!-- maxsus ustunlarni belgilash -->
  <rect x="56" y="84" width="120" height="32" rx="5" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="408" y="84" width="120" height="32" rx="5" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- 1-qator -->
  <rect x="62" y="132" width="36" height="48" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="80" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">img</text>
  <text x="200" y="160" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e40af">Qardoshlar</text>
  <text x="420" y="160" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Tog'ay Murod</text>
  <text x="630" y="160" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">2026-06-01</text>
  <line x1="56" y1="192" x2="704" y2="192" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 2-qator -->
  <rect x="62" y="204" width="36" height="48" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="80" y="232" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">img</text>
  <text x="200" y="232" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e40af">O'tkan kunlar</text>
  <text x="420" y="232" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">A. Qodiriy</text>
  <text x="630" y="232" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">2026-06-03</text>
  <line x1="56" y1="264" x2="704" y2="264" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 3-qator: bo'sh meta -->
  <text x="80" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#94a3b8">—</text>
  <text x="200" y="290" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e40af">Mehrobdan chayon</text>
  <text x="420" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#94a3b8">—</text>
  <text x="630" y="290" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">2026-06-05</text>

  <!-- izoh strelkalari -->
  <line x1="116" y1="84" x2="116" y2="64" stroke="#7c3aed" stroke-width="2"/>
  <line x1="116" y1="64" x2="116" y2="64" stroke="#7c3aed" stroke-width="2"/>

  <!-- pastki izoh quti -->
  <rect x="40" y="330" width="335" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="207" y="356" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">Filter: ustun SARLAVHASI</text>
  <text x="58" y="380" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">manage_kitob_posts_columns</text>
  <text x="58" y="400" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">$columns massiviga kalit qo'shadi</text>

  <rect x="385" y="330" width="335" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="552" y="356" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Action: ustun QIYMATI</text>
  <text x="403" y="380" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">manage_kitob_posts_custom_column</text>
  <text x="403" y="400" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">($column, $post_id) — escape qiling!</text>
</svg>
