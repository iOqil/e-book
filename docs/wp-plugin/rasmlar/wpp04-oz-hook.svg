<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">
  <title>Plugin do_action va apply_filters chiqaradi, boshqa kod shularga ulanib plugin'ni kengaytiradi</title>
  <rect x="0" y="0" width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="36" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle">O'z hook'laring = kengaytiriladigan plugin</text>

  <!-- Your plugin box -->
  <rect x="40" y="70" width="290" height="280" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="185" y="100" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e40af" text-anchor="middle">Sizning plugin'ingiz</text>
  <text x="185" y="122" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">kitoblar-katalogi</text>

  <rect x="64" y="146" width="242" height="74" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="185" y="170" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">kitob saqlangach:</text>
  <text x="185" y="192" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">do_action(</text>
  <text x="185" y="210" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">'kitkat_kitob_saqlandi', $id )</text>

  <rect x="64" y="232" width="242" height="92" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="185" y="256" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">narxni hisoblashda:</text>
  <text x="185" y="278" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">apply_filters(</text>
  <text x="185" y="296" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">'kitkat_narx',</text>
  <text x="185" y="314" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">$narx, $kitob )</text>

  <!-- arrows out -->
  <line x1="330" y1="183" x2="446" y2="160" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrb)"/>
  <line x1="330" y1="278" x2="446" y2="300" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrg)"/>
  <text x="388" y="158" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">e'lon</text>
  <text x="388" y="312" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">e'lon</text>

  <!-- Other code that hooks in -->
  <rect x="448" y="78" width="272" height="118" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="584" y="104" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">Boshqa plugin / tema</text>
  <rect x="468" y="118" width="232" height="30" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="584" y="138" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">add_action(...saqlandi, telegram)</text>
  <rect x="468" y="154" width="232" height="30" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="584" y="174" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">add_action(...saqlandi, index)</text>

  <rect x="448" y="244" width="272" height="106" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="584" y="270" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">Mijoz kodi</text>
  <rect x="468" y="284" width="232" height="30" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1"/>
  <text x="584" y="304" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">add_filter(...narx, chegirma)</text>
  <text x="584" y="336" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#92400e" text-anchor="middle">narxni o'zgartiradi, kod tegmaydi</text>

  <text x="380" y="384" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Siz YADRONI ochasiz: boshqalar plugin'ingizni o'zgartirmasdan kengaytiradi (extensibility).</text>

  <defs>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
  </defs>
</svg>
