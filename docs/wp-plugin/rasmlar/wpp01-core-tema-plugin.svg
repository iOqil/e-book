<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440">
  <title>WordPress uch qatlami: yadro, tema va plugin — plugin yadroga hook orqali ulanadi</title>
  <defs>
    <marker id="ct-ok" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>

  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">WordPress uch qatlami</text>
  <text x="380" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Har qatlamning aniq vazifasi bor — chegaralarni buzma</text>

  <!-- Yadro -->
  <rect x="40" y="86" width="220" height="300" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="150" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">Yadro (core)</text>
  <text x="150" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">wp-admin/ wp-includes/</text>
  <text x="150" y="168" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">WordPress motori.</text>
  <text x="150" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">So'rovni boshqaradi,</text>
  <text x="150" y="204" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">bazani o'qiydi, hook'lar</text>
  <text x="150" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ishga tushiradi.</text>
  <rect x="62" y="246" width="176" height="46" rx="6" fill="#fef3c7" stroke="#dc2626" stroke-width="2"/>
  <text x="150" y="266" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">HECH QACHON</text>
  <text x="150" y="284" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">o'zgartirma!</text>
  <text x="150" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Yangilanishda o'zgargan</text>
  <text x="150" y="336" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">kod ustiga yoziladi.</text>
  <text x="150" y="368" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-style="italic" fill="#2563eb">Faqat hook nuqtalari ochiq</text>

  <!-- Tema -->
  <rect x="290" y="86" width="180" height="300" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="380" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">Tema</text>
  <text x="380" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">wp-content/themes/</text>
  <text x="380" y="168" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">KO'RINISH:</text>
  <text x="380" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">shablon, dizayn,</text>
  <text x="380" y="204" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">stil, joylashuv.</text>
  <text x="380" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Almashtirsa bo'ladi —</text>
  <text x="380" y="258" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">sayt o'zgaradi, lekin</text>
  <text x="380" y="276" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ma'lumot qoladi.</text>
  <text x="380" y="316" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">functions.php</text>
  <text x="380" y="338" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">biznes-mantiq uchun</text>
  <text x="380" y="356" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">NOTO'G'RI joy.</text>

  <!-- Plugin -->
  <rect x="500" y="86" width="220" height="300" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="610" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#7c3aed">Plugin</text>
  <text x="610" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">wp-content/plugins/</text>
  <text x="610" y="168" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">FUNKSIONALLIK:</text>
  <text x="610" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">CPT, REST, blok,</text>
  <text x="610" y="204" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">admin sahifa, shortcode.</text>
  <text x="610" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Tema almashsa ham</text>
  <text x="610" y="258" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">YASHAB qoladi.</text>
  <text x="610" y="276" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Yoqib-o'chsa bo'ladi.</text>
  <rect x="522" y="300" width="176" height="64" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <text x="610" y="322" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#7c3aed">Biznes-mantiq</text>
  <text x="610" y="342" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">SHU YERDA yashaydi.</text>
  <text x="610" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-style="italic" fill="#7c3aed">add_action / add_filter</text>

  <!-- Plugin -> Yadro hook strelkalari -->
  <line x1="500" y1="200" x2="262" y2="200" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ct-ok)"/>
  <text x="380" y="416" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Plugin yadroni TAHRIRLAMAYDI — uning hook nuqtalariga ULANADI.</text>
</svg>
