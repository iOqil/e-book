<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440">
  <title>WP_Query yomon va yaxshi konfiguratsiyasini taqqoslash: cheklanmagan posts_per_page va sekin meta_query qarshisida cheklangan, no_found_rows va fields=ids bilan optimallashtirilgan so'rov</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">WP_Query: yomon vs yaxshi</text>

  <!-- BAD column -->
  <rect x="30" y="60" width="330" height="340" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="195" y="88" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">YOMON (sekin)</text>

  <rect x="52" y="104" width="286" height="34" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="66" y="126" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">'posts_per_page' =&gt; -1</text>
  <text x="324" y="126" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626" text-anchor="end">xavfli</text>

  <rect x="52" y="146" width="286" height="34" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="66" y="168" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">'meta_query' =&gt; [...]</text>
  <text x="324" y="168" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626" text-anchor="end">indekssiz</text>

  <rect x="52" y="188" width="286" height="34" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="66" y="210" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">SQL_CALC_FOUND_ROWS</text>
  <text x="324" y="210" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626" text-anchor="end">qo'sh skan</text>

  <rect x="52" y="230" width="286" height="34" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="66" y="252" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">to'liq post obyektlari</text>
  <text x="324" y="252" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626" text-anchor="end">og'ir</text>

  <rect x="52" y="290" width="286" height="80" rx="8" fill="#dc2626"/>
  <text x="195" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Natija: minglab qator,</text>
  <text x="195" y="342" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#fee2e2" text-anchor="middle">meta JOIN, ortiqcha</text>
  <text x="195" y="361" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#fee2e2" text-anchor="middle">xotira — sayt sekin</text>

  <!-- GOOD column -->
  <rect x="400" y="60" width="330" height="340" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="565" y="88" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a" text-anchor="middle">YAXSHI (tez)</text>

  <rect x="422" y="104" width="286" height="34" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="436" y="126" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">'posts_per_page' =&gt; 12</text>
  <text x="694" y="126" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" text-anchor="end">cheklangan</text>

  <rect x="422" y="146" width="286" height="34" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="436" y="168" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">'tax_query' =&gt; [...]</text>
  <text x="694" y="168" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" text-anchor="end">indeksli</text>

  <rect x="422" y="188" width="286" height="34" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="436" y="210" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">'no_found_rows' =&gt; true</text>
  <text x="694" y="210" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" text-anchor="end">skan yo'q</text>

  <rect x="422" y="230" width="286" height="34" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="436" y="252" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">'fields' =&gt; 'ids'</text>
  <text x="694" y="252" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" text-anchor="end">faqat ID</text>

  <rect x="422" y="290" width="286" height="80" rx="8" fill="#16a34a"/>
  <text x="565" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Natija: kichik, indeksli,</text>
  <text x="565" y="342" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dcfce7" text-anchor="middle">keshlangan so'rov —</text>
  <text x="565" y="361" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dcfce7" text-anchor="middle">sayt tez ishlaydi</text>

  <text x="380" y="424" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Faqat kerakli ma'lumotni so'ra: kam qator, indeksli shart, yengil maydonlar.</text>
</svg>
