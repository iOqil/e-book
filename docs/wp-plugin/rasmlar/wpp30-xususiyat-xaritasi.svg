<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500">
  <title>Xususiyat xaritasi: kitob bo'ylab o'rganilgan har bir mavzu kapston plugin'ining qaysi qismida ishlatilgani, bob raqamlari bilan</title>
  <rect x="0" y="0" width="760" height="500" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Kitob -&gt; kapston: qaysi bob qayerda ishlatilgan</text>

  <!-- ustun sarlavhalari -->
  <text x="180" y="62" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">O'rganilgan mavzu (bob)</text>
  <text x="560" y="62" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Kapstondagi joyi</text>

  <g font-family="Segoe UI, system-ui, sans-serif" font-size="13">
    <!-- qatorlar: chap (mavzu) -> o'ng (joy) -->
    <!-- 1 -->
    <rect x="30" y="74" width="300" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
    <text x="44" y="95" fill="#1e293b">03/05 — tuzilma, autoload, OOP</text>
    <rect x="430" y="74" width="300" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="444" y="95" fill="#1e293b">Plugin sinfi + src/ daraxt + PSR-4</text>
    <line x1="330" y1="91" x2="430" y2="91" stroke="#94a3b8" stroke-width="1.3"/>

    <!-- 2 -->
    <rect x="30" y="114" width="300" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
    <text x="44" y="135" fill="#1e293b">04 — hooks (action / filter)</text>
    <rect x="430" y="114" width="300" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="444" y="135" fill="#1e293b">har komponent register() -&gt; add_action</text>
    <line x1="330" y1="131" x2="430" y2="131" stroke="#94a3b8" stroke-width="1.3"/>

    <!-- 3 -->
    <rect x="30" y="154" width="300" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
    <text x="44" y="175" fill="#1e293b">07/08 — CPT va taxonomy</text>
    <rect x="430" y="154" width="300" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="444" y="175" fill="#1e293b">kitob CPT + janr taxonomy</text>
    <line x1="330" y1="171" x2="430" y2="171" stroke="#94a3b8" stroke-width="1.3"/>

    <!-- 4 -->
    <rect x="30" y="194" width="300" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
    <text x="44" y="215" fill="#1e293b">09 — meta box / register_post_meta</text>
    <rect x="430" y="194" width="300" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="444" y="215" fill="#1e293b">muallif + ISBN maydonlari</text>
    <line x1="330" y1="211" x2="430" y2="211" stroke="#94a3b8" stroke-width="1.3"/>

    <!-- 5 -->
    <rect x="30" y="234" width="300" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
    <text x="44" y="255" fill="#1e293b">06 — Settings API</text>
    <rect x="430" y="234" width="300" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="444" y="255" fill="#1e293b">Admin\Settings sahifasi</text>
    <line x1="330" y1="251" x2="430" y2="251" stroke="#94a3b8" stroke-width="1.3"/>

    <!-- 6 -->
    <rect x="30" y="274" width="300" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
    <text x="44" y="295" fill="#1e293b">16 — REST API</text>
    <rect x="430" y="274" width="300" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="444" y="295" fill="#1e293b">kitkat/v1/kitoblar endpoint</text>
    <line x1="330" y1="291" x2="430" y2="291" stroke="#94a3b8" stroke-width="1.3"/>

    <!-- 7 -->
    <rect x="30" y="314" width="300" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="44" y="335" fill="#1e293b">19-21 — blok muharriri (dynamic)</text>
    <rect x="430" y="314" width="300" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="444" y="335" fill="#1e293b">"Kitoblar ro'yxati" blok + render.php</text>
    <line x1="330" y1="331" x2="430" y2="331" stroke="#94a3b8" stroke-width="1.3"/>

    <!-- 8 -->
    <rect x="30" y="354" width="300" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="44" y="375" fill="#1e293b">12/29 — xavfsizlik</text>
    <rect x="430" y="354" width="300" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="444" y="375" fill="#1e293b">nonce/sanitize/escape/cap HAMMA joyda</text>
    <line x1="330" y1="371" x2="430" y2="371" stroke="#94a3b8" stroke-width="1.3"/>

    <!-- 9 -->
    <rect x="30" y="394" width="300" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
    <text x="44" y="415" fill="#1e293b">24 / 25 — i18n va testlash</text>
    <rect x="430" y="394" width="300" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="444" y="415" fill="#1e293b">text domain + PHPUnit testlar</text>
    <line x1="330" y1="411" x2="430" y2="411" stroke="#94a3b8" stroke-width="1.3"/>

    <!-- 10 -->
    <rect x="30" y="434" width="300" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
    <text x="44" y="455" fill="#1e293b">27 / 28 — Woo + distribution</text>
    <rect x="430" y="434" width="300" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="444" y="455" fill="#1e293b">HPOS hook + readme.txt / SVN</text>
    <line x1="330" y1="451" x2="430" y2="451" stroke="#94a3b8" stroke-width="1.3"/>
  </g>

  <text x="380" y="488" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Har bir bobning bilimi kapstonda bitta aniq qismga aylandi — kitob = bitta plugin.</text>
</svg>
