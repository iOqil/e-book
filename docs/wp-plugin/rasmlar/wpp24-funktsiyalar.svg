<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440">
  <title>PHP tarjima funksiyalari taqqoslangan: __ qaytaradi, _e echo qiladi, esc_html__ escape va tarjima qiladi, _n koplik, _x kontekst</title>

  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>

  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">PHP tarjima funksiyalari</text>
  <text x="380" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">har birida oxirgi argument — text domain ('kitoblar-katalogi')</text>

  <!-- __ -->
  <rect x="30" y="80" width="345" height="78" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="48" y="108" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e40af">__( $text, $domain )</text>
  <text x="48" y="132" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">tarjimani QAYTARADI (echo emas)</text>
  <text x="48" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">escape qilmaydi</text>

  <!-- _e -->
  <rect x="385" y="80" width="345" height="78" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="403" y="108" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e40af">_e( $text, $domain )</text>
  <text x="403" y="132" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">tarjimani ECHO qiladi</text>
  <text x="403" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">escape qilmaydi</text>

  <!-- esc_html__ -->
  <rect x="30" y="170" width="345" height="92" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="48" y="198" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">esc_html__() / esc_html_e()</text>
  <text x="48" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">tarjima + HTML escape (XAVFSIZ)</text>
  <text x="48" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">__ qaytaradi / _e echo qiladi</text>

  <!-- esc_attr__ -->
  <rect x="385" y="170" width="345" height="92" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="403" y="198" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">esc_attr__() / esc_attr_e()</text>
  <text x="403" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">tarjima + ATRIBUT escape</text>
  <text x="403" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">placeholder, title, value uchun</text>

  <!-- _n -->
  <rect x="30" y="274" width="345" height="92" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="48" y="302" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">_n( $single, $plural, $number, $domain )</text>
  <text x="48" y="326" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">KO'PLIK: songa qarab shakl tanlaydi</text>
  <text x="48" y="346" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">son %d -> sprintf bilan qo'yiladi</text>

  <!-- _x -->
  <rect x="385" y="274" width="345" height="92" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="403" y="302" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">_x( $text, $context, $domain )</text>
  <text x="403" y="326" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">KONTEKST: bir so'z, ikki ma'no</text>
  <text x="403" y="346" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">_nx = ko'plik + kontekst birga</text>

  <text x="380" y="402" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">Foydalanuvchiga chiqadigan matn uchun deyarli har doim esc_html__ / esc_html_e</text>
  <text x="380" y="426" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">text domain HAR DOIM literal satr — make-pot shuni talab qiladi</text>
</svg>
