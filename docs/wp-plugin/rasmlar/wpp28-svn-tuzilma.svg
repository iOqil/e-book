<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450">
  <title>wordpress.org SVN ombori tuzilishi: trunk papkasi rivojlanish kodi, tags papkasi relizlar, assets papkasi banner va ikonka foydalanuvchiga yetkazilmaydi</title>
  <rect x="0" y="0" width="760" height="450" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">wordpress.org SVN tuzilishi (Git emas!)</text>

  <!-- repo root -->
  <rect x="280" y="50" width="200" height="40" rx="8" fill="#1e40af" stroke="#1e293b" stroke-width="2"/>
  <text x="380" y="76" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">plugins.svn.wordpress.org</text>

  <!-- connectors -->
  <line x1="380" y1="90" x2="380" y2="110" stroke="#94a3b8" stroke-width="2"/>
  <line x1="140" y1="110" x2="620" y2="110" stroke="#94a3b8" stroke-width="2"/>
  <line x1="140" y1="110" x2="140" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <line x1="380" y1="110" x2="380" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <line x1="620" y1="110" x2="620" y2="130" stroke="#94a3b8" stroke-width="2"/>

  <!-- trunk -->
  <rect x="40" y="130" width="200" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e40af">trunk/</text>
  <text x="140" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">rivojlanish (eng yangi)</text>
  <text x="56" y="202" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">kitoblar-katalogi.php</text>
  <text x="56" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">readme.txt</text>
  <text x="56" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">build/ src/ ...</text>

  <!-- tags -->
  <rect x="280" y="130" width="200" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">tags/</text>
  <text x="380" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">relizlar (o'zgarmas)</text>
  <text x="296" y="202" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">tags/1.0.0/</text>
  <text x="296" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">tags/1.1.0/</text>
  <text x="296" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">tags/1.2.0/  &lt;- jonli</text>

  <!-- assets -->
  <rect x="520" y="130" width="200" height="120" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="620" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#b45309">assets/</text>
  <text x="620" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">katalog ko'rinishi</text>
  <text x="536" y="202" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">banner-1544x500.png</text>
  <text x="536" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">icon-256x256.png</text>
  <text x="536" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">screenshot-1.png</text>

  <!-- assets note: not shipped -->
  <rect x="520" y="262" width="200" height="34" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="620" y="284" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">ZIP'ga KIRMAYDI</text>

  <!-- workflow commands -->
  <rect x="40" y="320" width="680" height="110" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="346" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Reliz oqimi (buyruqlar):</text>
  <text x="60" y="372" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">1. svn co https://plugins.svn.wordpress.org/kitoblar-katalogi  (bir marta klonlash)</text>
  <text x="60" y="394" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">2. trunk/ ga kod + readme.txt ko'chir,  svn add trunk/*,  svn ci -m "1.2.0"</text>
  <text x="60" y="416" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">3. svn cp trunk tags/1.2.0   ->   svn ci -m "tag 1.2.0"   (reliz teglash)</text>
</svg>
