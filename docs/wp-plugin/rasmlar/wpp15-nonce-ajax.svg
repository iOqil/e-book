<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">
  <title>Nonce hayot sikli AJAX da: wp_create_nonce token yasaydi, fetch nonce'ni yuboradi, check_ajax_referer tekshiradi, mos kelsa handler davom etadi, mos kelmasa wp_die 403 bilan rad etadi</title>
  <rect x="0" y="0" width="720" height="400" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Nonce hayot sikli (AJAX)</text>

  <defs>
    <marker id="arn" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 1 create nonce -->
  <rect x="40" y="70" width="280" height="74" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e40af">1. PHP: token yasash</text>
  <text x="180" y="121" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">wp_create_nonce('kk_favorite_nonce')</text>
  <text x="180" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">-&gt; wp_add_inline_script bilan JS'ga</text>

  <!-- 2 send -->
  <rect x="40" y="172" width="280" height="68" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e40af">2. JS: nonce'ni yuborish</text>
  <text x="180" y="223" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">fetch( ... nonce: kkFavorite.nonce )</text>

  <line x1="180" y1="144" x2="180" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arn)"/>

  <!-- 3 check -->
  <rect x="40" y="268" width="280" height="74" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="180" y="296" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#92590a">3. Server: tekshirish</text>
  <text x="180" y="319" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">check_ajax_referer(</text>
  <text x="180" y="336" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">'kk_favorite_nonce', 'nonce' )</text>

  <line x1="180" y1="240" x2="180" y2="266" stroke="#475569" stroke-width="2" marker-end="url(#arn)"/>

  <!-- decision -->
  <text x="180" y="372" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">nonce mos keladimi?</text>

  <!-- OK branch -->
  <rect x="400" y="100" width="280" height="96" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="540" y="130" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#15803d">HA -&gt; davom etadi</text>
  <text x="540" y="155" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">current_user_can() tekshiruvi</text>
  <text x="540" y="176" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">ish + wp_send_json_success</text>

  <!-- FAIL branch -->
  <rect x="400" y="250" width="280" height="96" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="540" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b91c1c">YO'Q -&gt; rad etiladi</text>
  <text x="540" y="305" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">wp_die( -1, 403 )</text>
  <text x="540" y="326" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">handler ishga tushmaydi</text>

  <line x1="320" y1="300" x2="398" y2="160" stroke="#16a34a" stroke-width="2" marker-end="url(#arg)"/>
  <text x="372" y="218" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#15803d">HA</text>
  <line x1="320" y1="305" x2="398" y2="300" stroke="#dc2626" stroke-width="2" marker-end="url(#arr)"/>
  <text x="360" y="324" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#b91c1c">YO'Q</text>
</svg>
