<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440">
  <title>Kitoblar katalogi plugin papkasining fayl tuzilishi: asosiy fayl, includes, uninstall.php va languages</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Plugin fayl tuzilishi</text>
  <text x="380" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">wp-content/plugins/ ichida</text>

  <!-- Root folder -->
  <rect x="40" y="80" width="320" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="105" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e40af">kitoblar-katalogi/</text>

  <!-- Tree vertical line -->
  <line x1="64" y1="120" x2="64" y2="404" stroke="#94a3b8" stroke-width="2"/>

  <!-- main file -->
  <line x1="64" y1="148" x2="92" y2="148" stroke="#94a3b8" stroke-width="2"/>
  <rect x="92" y="130" width="268" height="38" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="106" y="154" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">kitoblar-katalogi.php</text>
  <text x="372" y="154" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">&#8592; asosiy fayl (header shu yerda)</text>

  <!-- includes folder -->
  <line x1="64" y1="196" x2="92" y2="196" stroke="#94a3b8" stroke-width="2"/>
  <rect x="92" y="178" width="160" height="38" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="106" y="202" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#92400e">includes/</text>
  <text x="372" y="202" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">&#8592; mantiq (sinflar, funksiyalar)</text>

  <!-- includes children -->
  <line x1="116" y1="216" x2="116" y2="288" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="116" y1="240" x2="140" y2="240" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="140" y="224" width="200" height="32" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="152" y="245" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">class-cpt.php</text>
  <line x1="116" y1="272" x2="140" y2="272" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="140" y="256" width="200" height="32" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="152" y="277" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">class-settings.php</text>

  <!-- uninstall.php -->
  <line x1="64" y1="316" x2="92" y2="316" stroke="#94a3b8" stroke-width="2"/>
  <rect x="92" y="298" width="268" height="38" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="106" y="322" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">uninstall.php</text>
  <text x="372" y="322" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">&#8592; o'chirishda ma'lumotni tozalaydi</text>

  <!-- languages -->
  <line x1="64" y1="364" x2="92" y2="364" stroke="#94a3b8" stroke-width="2"/>
  <rect x="92" y="346" width="160" height="38" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="106" y="370" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#5b21b6">languages/</text>
  <text x="372" y="370" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">&#8592; tarjima fayllari (.pot/.po/.mo)</text>

  <!-- footnote -->
  <text x="40" y="420" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Asosiy fayl nomi papka nomi bilan bir xil bo'lsa eng yaxshi amaliyot.</text>
</svg>
