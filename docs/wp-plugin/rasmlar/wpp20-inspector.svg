<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440">
  <title>Blok muharriri ko'rinishi: markazda RichText asosiy maydon tahrirlanadi, o'ngdagi InspectorControls yon panelida PanelBody ichida TextControl, ToggleControl va ColorPalette sozlamalari joylashadi</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Blok muharriri: asosiy maydon va InspectorControls</text>

  <!-- editor canvas (main) -->
  <rect x="30" y="60" width="430" height="350" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="245" y="86" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#475569">Tahrir maydoni (canvas)</text>

  <rect x="55" y="104" width="380" height="280" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="245" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e40af">kitkat-karta (useBlockProps)</text>

  <rect x="78" y="142" width="334" height="56" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="92" y="164" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">RichText (sarlavha) — h3</text>
  <text x="92" y="186" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">"PHP asoslari" | kursor shu yerda</text>

  <rect x="78" y="210" width="334" height="34" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="92" y="232" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Muallif: Oqil Imomnazarov</text>

  <rect x="78" y="256" width="334" height="110" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="92" y="278" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">RichText (tavsif) — p</text>
  <text x="92" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Boshlovchilar uchun chuqur</text>
  <text x="92" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">qo'llanma. Tahrirlanadigan matn.</text>
  <text x="92" y="346" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">bold / italic formatlash mumkin</text>

  <!-- Inspector panel (right) -->
  <rect x="478" y="60" width="252" height="350" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="604" y="86" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#7c3aed">InspectorControls</text>
  <text x="604" y="106" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(o'ng yon panel)</text>

  <rect x="496" y="120" width="216" height="272" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="510" y="144" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">PanelBody</text>
  <text x="510" y="162" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">"Karta sozlamalari"</text>

  <rect x="510" y="176" width="188" height="48" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="520" y="196" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">TextControl</text>
  <text x="520" y="214" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Muallif: [ ........... ]</text>

  <rect x="510" y="234" width="188" height="48" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="520" y="254" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">ToggleControl</text>
  <text x="520" y="272" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Chegara chizig'i  [ON]</text>

  <rect x="510" y="292" width="188" height="88" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="520" y="312" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">ColorPalette (fon rangi)</text>
  <circle cx="528" cy="338" r="9" fill="#dbeafe" stroke="#94a3b8"/>
  <circle cx="552" cy="338" r="9" fill="#dcfce7" stroke="#94a3b8"/>
  <circle cx="576" cy="338" r="9" fill="#fef3c7" stroke="#94a3b8"/>
  <circle cx="600" cy="338" r="9" fill="#fee2e2" stroke="#94a3b8"/>
  <circle cx="624" cy="338" r="9" fill="#ede9fe" stroke="#94a3b8"/>
  <text x="520" y="370" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">setAttributes({ fonRangi })</text>
</svg>
