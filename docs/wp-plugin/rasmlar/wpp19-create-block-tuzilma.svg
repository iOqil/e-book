<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430">
  <title>create-block manba src papkasi wp-scripts npm run build orqali build papkasiga kompilyatsiya qilinadi va index.asset.php hosil boladi</title>
  <defs>
    <marker id="b-arr" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>

  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">create-block: src -&gt; build pipeline</text>
  <text x="380" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">manba kodni brauzer tushunadigan koprga aylantirish</text>

  <!-- src/ -->
  <rect x="40" y="92" width="230" height="260" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="155" y="120" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">src/  (siz yozasiz)</text>
  <text x="60" y="152" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">block.json</text>
  <text x="60" y="180" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">index.js</text>
  <text x="60" y="208" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">edit.js   (JSX)</text>
  <text x="60" y="236" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">save.js   (JSX)</text>
  <text x="60" y="264" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">style.scss</text>
  <text x="60" y="292" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">editor.scss</text>
  <text x="60" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">zamonaviy JSX/ESM/SCSS</text>

  <!-- wp-scripts -->
  <rect x="300" y="170" width="160" height="100" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="380" y="202" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">npm run build</text>
  <text x="380" y="226" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">@wordpress/scripts</text>
  <text x="380" y="246" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Webpack + Babel</text>
  <text x="380" y="263" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(zero-config)</text>

  <line x1="270" y1="220" x2="298" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#b-arr)"/>
  <line x1="460" y1="220" x2="488" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#b-arr)"/>

  <!-- build/ -->
  <rect x="490" y="92" width="230" height="260" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="605" y="120" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">build/  (avtomatik)</text>
  <text x="510" y="152" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">block.json</text>
  <text x="510" y="180" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">index.js  (minified)</text>
  <text x="510" y="208" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">index.asset.php</text>
  <text x="510" y="228" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(deps + version)</text>
  <text x="510" y="256" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">style-index.css</text>
  <text x="510" y="284" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">index.css</text>
  <text x="510" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">PHP shu papkani o'qiydi</text>

  <text x="380" y="392" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">npm run start = watch rejimi (har saqlashda qayta quradi).  build/ ni git'ga qo'shing.</text>
</svg>
