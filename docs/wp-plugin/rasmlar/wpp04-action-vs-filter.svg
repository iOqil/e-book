<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380">
  <title>Action ish bajaradi va hech narsa qaytarmaydi; filter qiymatni oladi, o'zgartiradi va qaytaradi</title>
  <rect x="0" y="0" width="760" height="380" fill="#f8fafc"/>
  <text x="380" y="36" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle">action vs filter — asosiy farq</text>

  <!-- ACTION panel -->
  <rect x="30" y="64" width="330" height="276" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="195" y="96" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1e40af" text-anchor="middle">ACTION</text>
  <text x="195" y="120" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">do_action() — ish bajaradi</text>

  <!-- action flow -->
  <rect x="70" y="146" width="120" height="46" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="130" y="167" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">hodisa yuz</text>
  <text x="130" y="183" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">berdi</text>

  <line x1="190" y1="169" x2="232" y2="169" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrB)"/>

  <rect x="234" y="146" width="96" height="46" rx="8" fill="#2563eb"/>
  <text x="282" y="167" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">callback</text>
  <text x="282" y="183" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">ish qiladi</text>

  <line x1="282" y1="192" x2="282" y2="226" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrG)"/>
  <rect x="206" y="228" width="152" height="40" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="282" y="253" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#92400e" text-anchor="middle">yon ta'sir (log, email)</text>

  <text x="195" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#dc2626" text-anchor="middle">return YO'Q</text>
  <text x="195" y="322" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">qaytgan qiymat e'tiborga olinmaydi</text>

  <!-- FILTER panel -->
  <rect x="400" y="64" width="330" height="276" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="565" y="96" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#15803d" text-anchor="middle">FILTER</text>
  <text x="565" y="120" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">apply_filters() — qiymat qaytaradi</text>

  <rect x="418" y="150" width="84" height="44" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="460" y="170" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">$value</text>
  <text x="460" y="187" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">kiradi</text>

  <line x1="502" y1="172" x2="524" y2="172" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrGr)"/>

  <rect x="526" y="150" width="92" height="44" rx="8" fill="#16a34a"/>
  <text x="572" y="170" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">callback</text>
  <text x="572" y="187" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">o'zgartiradi</text>

  <line x1="618" y1="172" x2="642" y2="172" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrGr)"/>

  <rect x="644" y="150" width="74" height="44" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="681" y="170" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">yangi</text>
  <text x="681" y="187" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">$value</text>

  <text x="565" y="248" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">return $value;  SHART</text>
  <rect x="430" y="266" width="270" height="56" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="565" y="290" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#92400e" text-anchor="middle">qaytarmasang — ma'lumot YO'QOLADI</text>
  <text x="565" y="310" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#92400e" text-anchor="middle">(NULL qaytadi, sayt buziladi)</text>

  <defs>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="arrGr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/></marker>
  </defs>
</svg>
