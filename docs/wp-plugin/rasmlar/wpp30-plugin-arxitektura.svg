<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>Kitoblar katalogi plugini arxitekturasi: asosiy Plugin sinfi komponentlarni yig'adi va har biri WordPress hook'lariga ulanadi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Kitoblar katalogi: plugin arxitekturasi</text>

  <!-- Kirish nuqtasi -->
  <rect x="40" y="56" width="680" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="380" y="78" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">kitoblar-katalogi.php — header, autoload, plugins_loaded -&gt; Plugin::instance()-&gt;boot()</text>
  <text x="380" y="95" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">activation/deactivation hook (rewrite flush)  ·  03 / 05-bob</text>

  <!-- Plugin sinfi -->
  <rect x="270" y="124" width="220" height="56" rx="8" fill="#2563eb"/>
  <text x="380" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Plugin (singleton)</text>
  <text x="380" y="168" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dbeafe">komponentlarni yig'adi -&gt; register()</text>

  <!-- bog'lovchi chiziq -->
  <line x1="380" y1="102" x2="380" y2="124" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="120" y1="200" x2="640" y2="200" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="380" y1="180" x2="380" y2="200" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Komponentlar -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <!-- PostTypes -->
    <rect x="40" y="212" width="160" height="92" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <line x1="120" y1="200" x2="120" y2="212" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="120" y="234" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">PostTypes</text>
    <text x="120" y="254" text-anchor="middle" font-size="13" fill="#1e293b">Kitob CPT (07)</text>
    <text x="120" y="272" text-anchor="middle" font-size="13" fill="#1e293b">Janr taxonomy (08)</text>
    <text x="120" y="290" text-anchor="middle" font-size="13" fill="#1e293b">Meta: muallif/ISBN (09)</text>

    <!-- Admin -->
    <rect x="216" y="212" width="148" height="92" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="290" y1="200" x2="290" y2="212" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="290" y="234" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">Admin</text>
    <text x="290" y="256" text-anchor="middle" font-size="13" fill="#1e293b">Settings API (06)</text>
    <text x="290" y="276" text-anchor="middle" font-size="13" fill="#1e293b">sozlamalar sahifasi</text>

    <!-- Rest -->
    <rect x="380" y="212" width="148" height="92" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="454" y1="200" x2="454" y2="212" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="454" y="234" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Rest</text>
    <text x="454" y="256" text-anchor="middle" font-size="13" fill="#1e293b">kitkat/v1/kitoblar</text>
    <text x="454" y="276" text-anchor="middle" font-size="13" fill="#1e293b">permission_callback (16)</text>

    <!-- Blocks -->
    <rect x="544" y="212" width="80" height="92" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <line x1="584" y1="200" x2="584" y2="212" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="584" y="234" text-anchor="middle" font-size="14" font-weight="bold" fill="#6d28d9">Blocks</text>
    <text x="584" y="256" text-anchor="middle" font-size="13" fill="#1e293b">dynamic</text>
    <text x="584" y="274" text-anchor="middle" font-size="13" fill="#1e293b">blok (19-21)</text>

    <!-- Woo -->
    <rect x="640" y="212" width="80" height="92" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="680" y1="200" x2="680" y2="212" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="680" y="234" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">Woo</text>
    <text x="680" y="256" text-anchor="middle" font-size="13" fill="#1e293b">ixtiyoriy</text>
    <text x="680" y="274" text-anchor="middle" font-size="13" fill="#1e293b">HPOS (27)</text>
  </g>

  <!-- Hook qatlami -->
  <rect x="40" y="328" width="680" height="50" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="380" y="349" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">WordPress hook qatlami</text>
  <text x="380" y="369" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">init · admin_menu · admin_init · rest_api_init · save_post · add_meta_boxes (04-bob)</text>
  <g stroke="#16a34a" stroke-width="1.3">
    <line x1="120" y1="304" x2="120" y2="328"/>
    <line x1="290" y1="304" x2="290" y2="328"/>
    <line x1="454" y1="304" x2="454" y2="328"/>
    <line x1="584" y1="304" x2="584" y2="328"/>
    <line x1="680" y1="304" x2="680" y2="328"/>
  </g>

  <!-- Yadro -->
  <rect x="40" y="396" width="680" height="50" rx="8" fill="#1e293b"/>
  <text x="380" y="417" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">WordPress yadrosi (core) — hook'larni o'qiydi, plugin'ni hech narsa o'zgartirmasdan ishlatadi</text>
  <text x="380" y="436" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">Xavfsizlik HAR komponentda: nonce · sanitize · escape · capability · prepare (12 / 29)</text>
  <line x1="380" y1="378" x2="380" y2="396" stroke="#94a3b8" stroke-width="1.5"/>
</svg>
