<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440">
  <title>Bir qiymat to'rt xil chiqish kontekstida turli escape funksiyasini talab qiladi: HTML matnda esc_html, atributda esc_attr, URL da esc_url, inline JS da esc_js</title>

  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>

  <text x="380" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Escape kontekstga bog'liq: bir qiymat, to'rt funksiya</text>

  <!-- manba qiymat -->
  <rect x="280" y="58" width="200" height="58" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="380" y="82" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">$muallif (ishonchsiz)</text>
  <text x="380" y="103" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">get_post_meta(...)</text>

  <!-- to'rt tarmoq chizig'i -->
  <line x1="330" y1="116" x2="120" y2="168" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="360" y1="116" x2="320" y2="168" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="400" y1="116" x2="520" y2="168" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="430" y1="116" x2="640" y2="168" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 1: HTML matn -->
  <rect x="24" y="172" width="220" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="134" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e40af">HTML matn</text>
  <text x="134" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">&lt;p&gt;...HERE...&lt;/p&gt;</text>
  <rect x="44" y="236" width="180" height="30" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="134" y="256" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">esc_html()</text>
  <text x="134" y="284" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">&lt; &gt; &amp; -> entity</text>

  <!-- 2: atribut -->
  <rect x="262" y="172" width="220" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="372" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#15803d">Atribut</text>
  <text x="372" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">value="...HERE..."</text>
  <rect x="282" y="236" width="180" height="30" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="372" y="256" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#15803d">esc_attr()</text>
  <text x="372" y="284" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tirnoqdan chiqmaydi</text>

  <!-- 3: URL -->
  <rect x="500" y="172" width="240" height="120" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="620" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#6d28d9">URL (href/src)</text>
  <text x="620" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">href="...HERE..."</text>
  <rect x="520" y="236" width="200" height="30" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="620" y="256" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#6d28d9">esc_url()</text>
  <text x="620" y="284" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">javascript: bloklanadi</text>

  <!-- 4: inline JS -->
  <rect x="262" y="312" width="220" height="110" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="372" y="338" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b45309">Inline JS string</text>
  <text x="372" y="362" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">var x = "...HERE...";</text>
  <rect x="282" y="376" width="180" height="30" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="372" y="396" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">esc_js()</text>

  <!-- ogohlantirish -->
  <rect x="24" y="312" width="220" height="110" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="134" y="338" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b91c1c">Noto'g'ri kontekst</text>
  <text x="134" y="364" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">value="esc_html(...)"</text>
  <text x="134" y="384" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">atributda esc_html =</text>
  <text x="134" y="406" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b91c1c">ZAIFLIK xavfi</text>

  <!-- xulosa -->
  <rect x="500" y="312" width="240" height="110" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="620" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Qoida</text>
  <text x="620" y="364" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Funksiyani QAYERGA</text>
  <text x="620" y="383" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">chiqarayotganingga</text>
  <text x="620" y="402" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">qarab tanlanadi</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>
</svg>
