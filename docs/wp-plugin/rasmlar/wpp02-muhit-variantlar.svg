<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440">
  <title>Lokal WordPress muhiti variantlarini taqqoslash: wp-env (rasmiy, Docker, plugin dev uchun afzal), Local (GUI, oson), Docker compose (moslashuvchan), MAMP/XAMPP (klassik) — har biri uchun talab va qulaylik</title>

  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>

  <text x="380" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Lokal WordPress muhiti: 4 variant</text>
  <text x="380" y="60" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">plugin ishlab chiqish uchun afzali: wp-env</text>

  <!-- wp-env (afzal) -->
  <rect x="30" y="84" width="340" height="148" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="200" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">@wordpress/env (wp-env) ★</text>
  <text x="200" y="136" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Rasmiy WordPress jamoasi asbobi</text>
  <text x="200" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Talab: Docker · Node/npm</text>
  <text x="200" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Config: .wp-env.json (versiyaga kiradi)</text>
  <text x="200" y="202" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Bitta komanda: wp-env start</text>
  <text x="200" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">+ dev/tests sayt, WP-CLI, takrorlanadi</text>

  <!-- Local -->
  <rect x="390" y="84" width="340" height="148" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="560" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">Local (Flywheel)</text>
  <text x="560" y="136" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Grafik (GUI) ilova, "klik bilan sayt"</text>
  <text x="560" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Talab: yo'q (Docker o'zida bor)</text>
  <text x="560" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Config: terminal emas, oyna orqali</text>
  <text x="560" y="202" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Boshlovchiga eng oson</text>
  <text x="560" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">+ SSL, mail, ko'p sayt; - skript emas</text>

  <!-- Docker compose -->
  <rect x="30" y="248" width="340" height="148" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="200" y="276" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#7c3aed">Sof Docker compose</text>
  <text x="200" y="300" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">O'z docker-compose.yml ingiz</text>
  <text x="200" y="322" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Talab: Docker · YAML bilim</text>
  <text x="200" y="344" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">To'liq nazorat (versiya, xizmatlar)</text>
  <text x="200" y="366" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#7c3aed">+ moslashuvchan; - ko'proq sozlash</text>

  <!-- MAMP/XAMPP -->
  <rect x="390" y="248" width="340" height="148" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="560" y="276" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#b45309">MAMP / XAMPP</text>
  <text x="560" y="300" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Klassik Apache + MySQL + PHP paketi</text>
  <text x="560" y="322" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Talab: Docker yo'q (to'g'ridan)</text>
  <text x="560" y="344" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">WP ni qo'lda o'rnatasiz</text>
  <text x="560" y="366" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">- versiya boshqaruvi qiyin, eski uslub</text>

  <text x="380" y="424" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Bu kitobda asosiy yo'l: wp-env (takrorlanadi va jamoa bilan bir xil bo'ladi)</text>
</svg>
