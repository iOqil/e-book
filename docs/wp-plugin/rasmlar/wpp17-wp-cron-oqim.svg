<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440">
  <title>WP-Cron oqimi: brauzerdan so'rov keladi, WordPress yuklanadi, muddati o'tgan rejalashtirilgan event bormi tekshiriladi, bo'lsa fon so'rovi sifatida spawn qilinib hook action ishga tushadi, bo'lmasa oddiy sahifa qaytadi</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">WP-Cron ishlash oqimi (traffic'ga bog'liq)</text>

  <!-- 1. request -->
  <rect x="40" y="66" width="200" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="92" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">Brauzerdan so'rov keladi</text>
  <text x="140" y="111" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">(kimdir sahifa ochadi)</text>

  <!-- arrow down -->
  <path d="M140 124 L140 162" stroke="#94a3b8" stroke-width="2"/>
  <path d="M140 162 l-5 -10 l10 0 z" fill="#94a3b8"/>

  <!-- 2. WP loads -->
  <rect x="40" y="162" width="200" height="58" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="140" y="188" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">WordPress yuklanadi</text>
  <text x="140" y="207" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">wp_cron() chaqiriladi</text>

  <!-- arrow down -->
  <path d="M140 220 L140 258" stroke="#94a3b8" stroke-width="2"/>
  <path d="M140 258 l-5 -10 l10 0 z" fill="#94a3b8"/>

  <!-- 3. decision -->
  <path d="M140 252 L260 312 L140 372 L20 312 Z" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="140" y="305" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">Muddati o'tgan</text>
  <text x="140" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">event bormi?</text>

  <!-- NO branch (down) -->
  <path d="M140 372 L140 408" stroke="#94a3b8" stroke-width="2"/>
  <path d="M140 408 l-5 -10 l10 0 z" fill="#94a3b8"/>
  <text x="186" y="396" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">YO'Q</text>
  <text x="140" y="427" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">oddiy sahifa qaytadi</text>

  <!-- YES branch (right) -->
  <path d="M260 312 L340 312" stroke="#16a34a" stroke-width="2"/>
  <path d="M340 312 l-10 -5 l0 10 z" fill="#16a34a"/>
  <text x="300" y="302" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">HA</text>

  <!-- 4. spawn -->
  <rect x="340" y="283" width="200" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="440" y="308" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">Fon so'rovi sifatida</text>
  <text x="440" y="327" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">"spawn" qilinadi</text>

  <!-- arrow right -->
  <path d="M540 312 L600 312" stroke="#16a34a" stroke-width="2"/>
  <path d="M600 312 l-10 -5 l0 10 z" fill="#16a34a"/>

  <!-- 5. action runs -->
  <rect x="600" y="283" width="140" height="58" rx="10" fill="#16a34a"/>
  <text x="670" y="308" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">hook action</text>
  <text x="670" y="327" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dcfce7" text-anchor="middle">ishga tushadi</text>

  <!-- callout box -->
  <rect x="300" y="70" width="440" height="150" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="320" y="98" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">Diqqat: trigger = kelgan so'rov</text>
  <text x="320" y="124" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">WP-Cron demon EMAS. Vazifa faqat so'rov</text>
  <text x="320" y="144" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">kelganda tekshiriladi va ishga tushadi.</text>
  <text x="320" y="170" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Hech kim kirmasa -> vazifa KECHIKADI.</text>
  <text x="320" y="196" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Spawn alohida so'rov: foydalanuvchi sahifasi</text>
  <text x="320" y="216" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">uni kutib turmaydi.</text>
</svg>
