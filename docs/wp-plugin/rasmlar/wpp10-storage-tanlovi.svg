<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <title>Ma'lumotni qayerga saqlash bo'yicha qaror daraxti: bitta postga post meta, global sozlamaga Options, vaqtinchalik keshga Transient, ko'p strukturali ma'lumotga o'z jadval</title>
  <rect x="0" y="0" width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="34" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Ma'lumotni qayerga saqlayman?</text>

  <!-- Root question -->
  <rect x="280" y="56" width="200" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="79" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">Ma'lumot qanday</text>
  <text x="380" y="98" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">tabiatga ega?</text>

  <!-- Connectors -->
  <path d="M380 108 L100 168" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M380 108 L290 168" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M380 108 L480 168" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M380 108 L670 168" stroke="#94a3b8" stroke-width="2" fill="none"/>

  <!-- Branch 1: post meta -->
  <rect x="20" y="168" width="200" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="120" y="192" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">Bitta post'ga</text>
  <text x="120" y="212" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">tegishlimi?</text>
  <rect x="20" y="252" width="200" height="78" rx="10" fill="#16a34a"/>
  <text x="120" y="282" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Post meta</text>
  <text x="120" y="306" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dcfce7" text-anchor="middle">ISBN, sahifa soni</text>
  <text x="120" y="323" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dcfce7" text-anchor="middle">(wp_postmeta)</text>
  <path d="M120 228 L120 252" stroke="#16a34a" stroke-width="2"/>

  <!-- Branch 2: options -->
  <rect x="240" y="168" width="200" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="340" y="192" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">Global, kam</text>
  <text x="340" y="212" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">o'zgaruvchi sozlama?</text>
  <rect x="240" y="252" width="200" height="78" rx="10" fill="#2563eb"/>
  <text x="340" y="282" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Options API</text>
  <text x="340" y="306" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dbeafe" text-anchor="middle">per_page, API kalit</text>
  <text x="340" y="323" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dbeafe" text-anchor="middle">(wp_options)</text>
  <path d="M340 228 L340 252" stroke="#2563eb" stroke-width="2"/>

  <!-- Branch 3: transient -->
  <rect x="460" y="168" width="200" height="60" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="560" y="192" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">Vaqtinchalik kesh,</text>
  <text x="560" y="212" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">eskirsa mayli?</text>
  <rect x="460" y="252" width="200" height="78" rx="10" fill="#f59e0b"/>
  <text x="560" y="282" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Transients API</text>
  <text x="560" y="306" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">Top 10, API javobi</text>
  <text x="560" y="323" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">(muddatli)</text>
  <path d="M560 228 L560 252" stroke="#f59e0b" stroke-width="2"/>

  <!-- Branch 4: own table -->
  <rect x="560" y="356" width="180" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="650" y="380" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">Ko'p qatorli,</text>
  <text x="650" y="400" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">strukturali?</text>
  <rect x="20" y="356" width="520" height="60" rx="10" fill="#7c3aed"/>
  <text x="280" y="383" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">O'z jadval (dbDelta)</text>
  <text x="280" y="403" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ede9fe" text-anchor="middle">kitob_korishlar logi, reyting jadvali — tez WHERE/ORDER BY uchun</text>
  <path d="M560 386 L540 386" stroke="#7c3aed" stroke-width="2"/>
</svg>
