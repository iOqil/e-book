<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">
  <title>kitob CPT janr taxonomiyasi va uning Ilmiy, Tarix term'lari bilan bog'lanishi diagrammasi</title>
  <rect x="0" y="0" width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">CPT &#8596; Taxonomiya &#8596; Term'lar</text>

  <!-- CPT blok -->
  <rect x="40" y="120" width="200" height="150" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">CPT</text>
  <rect x="64" y="166" width="152" height="34" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="188" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">kitob</text>
  <text x="140" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">register_post_type()</text>
  <text x="140" y="246" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">post'lar: kitob #1, #2...</text>

  <!-- Taxonomy blok -->
  <rect x="300" y="120" width="200" height="150" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e40af">Taxonomiya</text>
  <rect x="324" y="166" width="152" height="34" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="188" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">janr</text>
  <text x="400" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">register_taxonomy(</text>
  <text x="400" y="244" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">'janr', ['kitob'] )</text>

  <!-- Terms blok -->
  <rect x="560" y="92" width="170" height="210" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="645" y="120" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#7c3aed">Term'lar</text>
  <rect x="582" y="136" width="126" height="36" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="645" y="159" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Ilmiy</text>
  <rect x="582" y="180" width="126" height="36" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="645" y="203" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Tarix</text>
  <rect x="582" y="224" width="126" height="36" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="645" y="247" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Badiiy</text>
  <text x="645" y="284" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">wp_insert_term()</text>

  <!-- strelka CPT -> taxonomy -->
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <line x1="240" y1="195" x2="298" y2="195" stroke="#475569" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="269" y="184" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">$object_type</text>

  <!-- strelka taxonomy -> terms -->
  <line x1="500" y1="195" x2="558" y2="195" stroke="#475569" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="529" y="184" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ichida</text>

  <text x="380" y="344" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Bitta kitob post'i bir nechta janr term'iga biriktiriladi (wp_set_object_terms)</text>
  <text x="380" y="368" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Bitta janr term'i ko'plab kitobni guruhlaydi &#8212; ko'pdan-ko'pga munosabat</text>
</svg>
