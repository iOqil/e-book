<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">
  <title>REST so'rov permission_callback darvozasidan o'tadi: true bo'lsa callback ishlaydi va 200 qaytadi, false yoki WP_Error bo'lsa 401/403 rad etiladi va callback chaqirilmaydi</title>
  <rect x="0" y="0" width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">permission_callback — MAJBURIY darvoza</text>

  <!-- request -->
  <rect x="30" y="150" width="170" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="115" y="182" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e40af">REST so'rov</text>
  <text x="115" y="206" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">POST /kitoblar</text>

  <line x1="200" y1="190" x2="265" y2="190" stroke="#94a3b8" stroke-width="3" marker-end="url(#arr16b)"/>

  <!-- gate (diamond) -->
  <path d="M385 120 L490 190 L385 260 L280 190 Z" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="385" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b45309">permission_</text>
  <text x="385" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b45309">callback</text>
  <text x="385" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">current_user_can?</text>

  <!-- true branch -->
  <line x1="490" y1="190" x2="560" y2="120" stroke="#16a34a" stroke-width="3" marker-end="url(#arr16g)"/>
  <text x="540" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">true</text>

  <rect x="560" y="78" width="180" height="84" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="650" y="106" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#15803d">callback ishlaydi</text>
  <text x="650" y="130" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">WP_REST_Response</text>
  <text x="650" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#15803d">200 / 201 JSON</text>

  <!-- false branch -->
  <line x1="490" y1="190" x2="560" y2="260" stroke="#dc2626" stroke-width="3" marker-end="url(#arr16r)"/>
  <text x="540" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">false / WP_Error</text>

  <rect x="560" y="232" width="180" height="84" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="650" y="260" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b91c1c">RAD ETILADI</text>
  <text x="650" y="284" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b91c1c">401 / 403</text>
  <text x="650" y="304" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">callback chaqirilmaydi</text>

  <!-- warning box -->
  <rect x="30" y="300" width="490" height="74" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="48" y="326" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b91c1c">permission_callback ni TUSHIRIB QOLDIRMANG</text>
  <text x="48" y="348" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">WP 5.5+ _doing_it_wrong ogohlantiradi. Ochiq endpoint uchun</text>
  <text x="48" y="367" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ham ANIQ '__return_true' yozing — "esimdan chiqdi" emas, qaror.</text>

  <defs>
    <marker id="arr16b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="arr16g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="arr16r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
</svg>
