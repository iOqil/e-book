<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="Segoe UI">
  <title>Ishonchsiz tashqi manbalar validatsiya darvozasidan o'tib, ishonchli ichki zonaga kiradi</title>
  <rect x="0" y="0" width="880" height="470" fill="#f8fafc"/>

  <text x="440" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Kirishga hech qachon ishonma</text>
  <text x="440" y="62" text-anchor="middle" font-size="14" fill="#64748b">Har bir tashqi manba dushman bo'lishi mumkin: darvozada tekshir, tozala</text>

  <!-- LEFT: untrusted zone -->
  <rect x="30" y="92" width="240" height="330" rx="12" fill="#fff7ed" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="150" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#dc2626">Ishonchsiz tashqi zona</text>

  <rect x="54" y="138" width="192" height="48" rx="8" fill="#ffffff" stroke="#dc2626"/>
  <text x="150" y="167" text-anchor="middle" font-size="14" fill="#991b1b">Foydalanuvchi kiritmasi</text>

  <rect x="54" y="196" width="192" height="48" rx="8" fill="#ffffff" stroke="#dc2626"/>
  <text x="150" y="225" text-anchor="middle" font-size="14" fill="#991b1b">Tashqi API javobi</text>

  <rect x="54" y="254" width="192" height="48" rx="8" fill="#ffffff" stroke="#dc2626"/>
  <text x="150" y="283" text-anchor="middle" font-size="14" fill="#991b1b">Fayl / yuklama</text>

  <rect x="54" y="312" width="192" height="48" rx="8" fill="#ffffff" stroke="#dc2626"/>
  <text x="150" y="341" text-anchor="middle" font-size="14" fill="#991b1b">URL / so'rov parametri</text>

  <text x="150" y="392" text-anchor="middle" font-size="13" fill="#991b1b">Hech biriga ishonma</text>
  <text x="150" y="410" text-anchor="middle" font-size="13" fill="#991b1b">(forma to'g'ri ko'rinsa ham)</text>

  <!-- arrows to gate -->
  <line x1="270" y1="162" x2="356" y2="220" stroke="#94a3b8" stroke-width="2"/>
  <line x1="270" y1="220" x2="356" y2="232" stroke="#94a3b8" stroke-width="2"/>
  <line x1="270" y1="278" x2="356" y2="244" stroke="#94a3b8" stroke-width="2"/>
  <line x1="270" y1="336" x2="356" y2="256" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="360,238 350,233 351,244" fill="#94a3b8"/>

  <!-- MIDDLE: gate -->
  <rect x="360" y="150" width="160" height="170" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="440" y="180" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">Validatsiya</text>
  <text x="440" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">darvozasi</text>
  <text x="440" y="234" text-anchor="middle" font-size="13" fill="#1e3a8a">tip / format / oraliq</text>
  <text x="440" y="256" text-anchor="middle" font-size="13" fill="#1e3a8a">allowlist (ruxsat)</text>
  <text x="440" y="278" text-anchor="middle" font-size="13" fill="#1e3a8a">sanitizatsiya</text>
  <text x="440" y="300" text-anchor="middle" font-size="13" fill="#dc2626">yaroqsiz -&gt; rad et</text>

  <line x1="520" y1="235" x2="606" y2="235" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="610,235 600,230 600,240" fill="#16a34a"/>
  <text x="563" y="226" text-anchor="middle" font-size="13" fill="#166534">tozalangan</text>

  <!-- RIGHT: trusted zone -->
  <rect x="610" y="92" width="240" height="330" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="730" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#16a34a">Ishonchli ichki zona</text>

  <rect x="634" y="150" width="192" height="58" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="730" y="176" text-anchor="middle" font-size="14" fill="#166534">Biznes mantig'i</text>
  <text x="730" y="196" text-anchor="middle" font-size="13" fill="#166534">toza ma'lumotga tayanadi</text>

  <rect x="634" y="220" width="192" height="58" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="730" y="246" text-anchor="middle" font-size="14" fill="#166534">Ma'lumotlar bazasi</text>
  <text x="730" y="266" text-anchor="middle" font-size="13" fill="#166534">parametrlangan so'rov</text>

  <rect x="634" y="290" width="192" height="58" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="730" y="316" text-anchor="middle" font-size="14" fill="#166534">Ichki funksiyalar</text>
  <text x="730" y="336" text-anchor="middle" font-size="13" fill="#166534">invariantga ishonadi</text>

  <text x="730" y="388" text-anchor="middle" font-size="13" fill="#166534">Bu yerda ishonsa bo'ladi --</text>
  <text x="730" y="406" text-anchor="middle" font-size="13" fill="#166534">chunki darvoza kafolat berdi</text>
</svg>
