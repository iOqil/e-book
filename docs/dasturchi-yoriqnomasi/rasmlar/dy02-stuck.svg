<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" font-family="Segoe UI">
  <title>Qotib qolganda nima qilish: qaror oqimi</title>
  <rect x="0" y="0" width="860" height="500" fill="#f8fafc"/>

  <text x="430" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Qotib qolganda (stuck) qaror oqimi</text>

  <defs>
    <marker id="ar2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Start -->
  <rect x="320" y="64" width="220" height="56" rx="28" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="430" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#dc2626">15-20 daqiqa qotib qoldim</text>
  <text x="430" y="111" text-anchor="middle" font-size="13" fill="#64748b">aylanib yuribman, oldinga yo'q</text>

  <!-- Step 1 -->
  <rect x="120" y="170" width="270" height="58" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="255" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">1. Tanaffus qil</text>
  <text x="255" y="216" text-anchor="middle" font-size="13" fill="#64748b">ekrandan uzoqlash, miya orqa fonda ishlaydi</text>

  <!-- Step 2 -->
  <rect x="470" y="170" width="270" height="58" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="605" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c3aed">2. Qayta ifodala</text>
  <text x="605" y="216" text-anchor="middle" font-size="13" fill="#64748b">ovoz chiqarib ayt - rubber duck</text>

  <!-- Step 3 -->
  <rect x="120" y="262" width="270" height="58" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="255" y="288" text-anchor="middle" font-size="15" font-weight="bold" fill="#16a34a">3. Soddalashtir</text>
  <text x="255" y="308" text-anchor="middle" font-size="13" fill="#64748b">eng kichik ishlaydigan qismni izola qil</text>

  <!-- Step 4 -->
  <rect x="470" y="262" width="270" height="58" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="605" y="288" text-anchor="middle" font-size="15" font-weight="bold" fill="#f59e0b">4. Qidir</text>
  <text x="605" y="308" text-anchor="middle" font-size="13" fill="#64748b">xato matni, hujjat, o'xshash masala</text>

  <!-- Step 5 -->
  <rect x="295" y="356" width="270" height="58" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
  <text x="430" y="382" text-anchor="middle" font-size="15" font-weight="bold" fill="#dc2626">5. Yordam so'ra</text>
  <text x="430" y="402" text-anchor="middle" font-size="13" fill="#64748b">nima sinadim/kutdim/oldim bilan</text>

  <!-- arrows -->
  <line x1="370" y1="120" x2="280" y2="170" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="390" y1="199" x2="470" y2="199" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="255" y1="228" x2="255" y2="262" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="390" y1="291" x2="470" y2="291" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="605" y1="320" x2="490" y2="356" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar2)"/>

  <text x="430" y="450" text-anchor="middle" font-size="14" fill="#64748b">Tartib qat'iy emas - lekin yordam so'rashdan oldin o'zingiz urinib ko'ring</text>
  <text x="430" y="472" text-anchor="middle" font-size="13" fill="#94a3b8">Har qadamda muammo yechilsa - to'xtang, hammasini bajarish shart emas</text>
</svg>
