<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="Segoe UI">
  <title>Katta muammoni kichik yechiladigan bo'laklarga ajratish daraxti</title>
  <rect x="0" y="0" width="860" height="480" fill="#f8fafc"/>

  <text x="430" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Bo'laklash: filni bo'lakma-bo'lak yeyish</text>

  <!-- Root -->
  <rect x="290" y="70" width="280" height="64" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
  <text x="430" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#dc2626">Katta muammo</text>
  <text x="430" y="122" text-anchor="middle" font-size="13" fill="#64748b">&quot;Foydalanuvchi ro'yxatdan o'tsin&quot;</text>

  <!-- Level 2 -->
  <rect x="60" y="220" width="220" height="60" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="246" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">Forma va validatsiya</text>
  <text x="170" y="267" text-anchor="middle" font-size="13" fill="#64748b">kirish maydonlari</text>

  <rect x="320" y="220" width="220" height="60" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="430" y="246" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">Bazaga saqlash</text>
  <text x="430" y="267" text-anchor="middle" font-size="13" fill="#64748b">parolni hash qilish</text>

  <rect x="580" y="220" width="220" height="60" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="690" y="246" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">Tasdiq xati</text>
  <text x="690" y="267" text-anchor="middle" font-size="13" fill="#64748b">email yuborish</text>

  <!-- Level 3 (leaves under first branch) -->
  <rect x="40" y="360" width="120" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="100" y="388" text-anchor="middle" font-size="13" fill="#16a34a">email bo'shmi?</text>
  <text x="100" y="406" text-anchor="middle" font-size="13" fill="#16a34a">format to'g'rimi?</text>

  <rect x="180" y="360" width="120" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="240" y="388" text-anchor="middle" font-size="13" fill="#16a34a">parol uzunligi</text>
  <text x="240" y="406" text-anchor="middle" font-size="13" fill="#16a34a">tekshiruvi</text>

  <text x="650" y="392" font-size="14" fill="#64748b">...har bo'lak</text>
  <text x="650" y="412" font-size="14" fill="#64748b">o'zicha yechiladi</text>

  <!-- Lines -->
  <line x1="430" y1="134" x2="170" y2="220" stroke="#94a3b8" stroke-width="2"/>
  <line x1="430" y1="134" x2="430" y2="220" stroke="#94a3b8" stroke-width="2"/>
  <line x1="430" y1="134" x2="690" y2="220" stroke="#94a3b8" stroke-width="2"/>

  <line x1="170" y1="280" x2="100" y2="360" stroke="#94a3b8" stroke-width="2"/>
  <line x1="170" y1="280" x2="240" y2="360" stroke="#94a3b8" stroke-width="2"/>

  <text x="430" y="455" text-anchor="middle" font-size="14" fill="#64748b">Har bir bargni alohida, ishonchli yechib bo'ladi - katta muammo endi qo'rqinchli emas</text>
</svg>
