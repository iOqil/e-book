<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI">
  <title>Coding intervyu qadamlari: savolni aniqlashtir, misol, yondashuvni ovoz chiqarib ayt, kod yoz, test qil, murakkablikni bahola</title>
  <rect x="0" y="0" width="900" height="470" fill="#f8fafc"/>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Coding intervyu: jarayon koddan muhim</text>
  <text x="450" y="62" text-anchor="middle" font-size="14" fill="#64748b">"To'g'ri javob" emas, qanday fikrlashingiz baholanadi</text>

  <!-- step boxes -->
  <rect x="40" y="100" width="240" height="74" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">1. Aniqlashtir</text>
  <text x="160" y="152" text-anchor="middle" font-size="13" fill="#334155">savol ber: chegara, kirish,</text>
  <text x="160" y="168" text-anchor="middle" font-size="13" fill="#334155">kutilgan chiqish</text>

  <rect x="330" y="100" width="240" height="74" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">2. Misol</text>
  <text x="450" y="152" text-anchor="middle" font-size="13" fill="#334155">qo'lda bitta misolni</text>
  <text x="450" y="168" text-anchor="middle" font-size="13" fill="#334155">ishlab ko'r</text>

  <rect x="620" y="100" width="240" height="74" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="740" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">3. Yondashuv</text>
  <text x="740" y="152" text-anchor="middle" font-size="13" fill="#334155">ovoz chiqarib ayt,</text>
  <text x="740" y="168" text-anchor="middle" font-size="13" fill="#334155">tasdiqlat, keyin kod</text>

  <rect x="620" y="250" width="240" height="74" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="740" y="280" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">4. Kod</text>
  <text x="740" y="302" text-anchor="middle" font-size="13" fill="#334155">toza, kichik qadamlar,</text>
  <text x="740" y="318" text-anchor="middle" font-size="13" fill="#334155">gapirib yozaver</text>

  <rect x="330" y="250" width="240" height="74" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="280" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">5. Test</text>
  <text x="450" y="302" text-anchor="middle" font-size="13" fill="#334155">misol + chegara holat,</text>
  <text x="450" y="318" text-anchor="middle" font-size="13" fill="#334155">o'zing tekshir</text>

  <rect x="40" y="250" width="240" height="74" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="160" y="280" text-anchor="middle" font-size="16" font-weight="bold" fill="#6d28d9">6. Murakkablik</text>
  <text x="160" y="302" text-anchor="middle" font-size="13" fill="#334155">vaqt/xotira O(...),</text>
  <text x="160" y="318" text-anchor="middle" font-size="13" fill="#334155">yaxshilash imkoni</text>

  <!-- arrows -->
  <line x1="280" y1="137" x2="330" y2="137" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
  <line x1="570" y1="137" x2="620" y2="137" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
  <line x1="740" y1="174" x2="740" y2="250" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
  <line x1="620" y1="287" x2="570" y2="287" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
  <line x1="330" y1="287" x2="280" y2="287" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="450" y="378" text-anchor="middle" font-size="14" fill="#dc2626" font-weight="bold">Jim qotib kod yozish = eng katta xato</text>
  <text x="450" y="404" text-anchor="middle" font-size="13" fill="#64748b">Intervyuer fikringizni ko'ra olsin: think aloud</text>
</svg>
