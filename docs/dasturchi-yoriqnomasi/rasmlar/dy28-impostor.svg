<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Segoe UI">
  <title>Impostor sindromi: his qilingan bilim haqiqiy bilimdan past, ayni vaqtda bilim chegarasi cheksiz kengayadi</title>
  <rect x="0" y="0" width="900" height="480" fill="#f8fafc"/>

  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Impostor sindromi: his vs haqiqat</text>
  <text x="450" y="60" text-anchor="middle" font-size="14" fill="#64748b">"Men aslida bilmayman, fosh bo'laman" &#8212; deyarli hamma dasturchida</text>

  <!-- baseline -->
  <line x1="120" y1="380" x2="820" y2="380" stroke="#94a3b8" stroke-width="2"/>
  <text x="470" y="412" text-anchor="middle" font-size="14" fill="#64748b">vaqt va tajriba &#8594;</text>
  <line x1="120" y1="110" x2="120" y2="380" stroke="#94a3b8" stroke-width="2"/>
  <text x="80" y="245" text-anchor="middle" font-size="14" fill="#64748b" transform="rotate(-90 80 245)">daraja</text>

  <!-- real knowledge bar -->
  <rect x="560" y="250" width="180" height="130" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="650" y="300" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">Haqiqiy</text>
  <text x="650" y="322" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">bilim</text>
  <text x="650" y="346" text-anchor="middle" font-size="13" fill="#334155">(yuqori)</text>

  <!-- felt knowledge bar -->
  <rect x="180" y="320" width="180" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="270" y="346" text-anchor="middle" font-size="16" font-weight="bold" fill="#b91c1c">His qilingan</text>
  <text x="270" y="368" text-anchor="middle" font-size="13" fill="#334155">"men bilmayman" (past)</text>

  <!-- gap arrow -->
  <line x1="650" y1="240" x2="270" y2="312" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="450" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c3aed">jarlik = impostor hissi</text>

  <!-- expanding frontier note -->
  <path d="M 130 150 C 300 150 350 140 470 130 C 600 120 700 118 810 116" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <text x="470" y="105" text-anchor="middle" font-size="14" fill="#b45309">bilim chegarasi har kun kengayadi &#8594; "bilmaganim" ham o'sadi</text>

  <text x="450" y="450" text-anchor="middle" font-size="14" fill="#16a34a" font-weight="bold">Davo: faktni yoz, taqqoslama, gaplash &#8212; bu his yolg'on baho beradi</text>
</svg>
