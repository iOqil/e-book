<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" font-family="Segoe UI">
  <title>Kitobning oltita qismi beshta asosiy saboqqa quyiladi: muhandislik kod emas, odamlar va kontekst, trade-off, uzluksiz o'rganish, barqarorlik</title>
  <rect x="0" y="0" width="920" height="540" fill="#f8fafc"/>

  <text x="460" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Kitobning sintezi: 6 qism -- 5 saboq</text>
  <text x="460" y="60" text-anchor="middle" font-size="14" fill="#64748b">Hamma boblar shu beshta asosiy g'oyaga olib keladi</text>

  <!-- Left column: 6 parts -->
  <text x="190" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">Kitobning 6 qismi</text>

  <rect x="40" y="108" width="300" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="135" font-size="13" fill="#1e293b">I -- Tafakkur va muammo yechish</text>

  <rect x="40" y="160" width="300" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="187" font-size="13" fill="#1e293b">II -- Toza kod hunari</text>

  <rect x="40" y="212" width="300" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="239" font-size="13" fill="#1e293b">III -- Sifat, test, xavfsizlik</text>

  <rect x="40" y="264" width="300" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="291" font-size="13" fill="#1e293b">IV -- Jamoada ishlash</text>

  <rect x="40" y="316" width="300" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="343" font-size="13" fill="#1e293b">V -- Unumdorlik va o'sish</text>

  <rect x="40" y="368" width="300" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="395" font-size="13" fill="#1e293b">VI -- Karyera va kasb</text>

  <!-- funnel arrow -->
  <path d="M 350 260 L 470 260" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#sn)"/>
  <text x="410" y="248" text-anchor="middle" font-size="13" fill="#64748b">quyiladi</text>

  <!-- Right column: 5 lessons -->
  <text x="710" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">5 asosiy saboq</text>

  <rect x="500" y="108" width="380" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="520" y="132" font-size="14" font-weight="bold" fill="#166534">1. Muhandislik = kod emas</text>
  <text x="520" y="154" font-size="13" fill="#334155">kod yozuvchidan muhandisgacha jarlik</text>

  <rect x="500" y="176" width="380" height="60" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="520" y="200" font-size="14" font-weight="bold" fill="#6d28d9">2. Odamlar va kontekst</text>
  <text x="520" y="222" font-size="13" fill="#334155">jamoa, kommunikatsiya, biznes konteksti</text>

  <rect x="500" y="244" width="380" height="60" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="520" y="268" font-size="14" font-weight="bold" fill="#b45309">3. Trade-off har joyda</text>
  <text x="520" y="290" font-size="13" fill="#334155">"to'g'ri javob" bitta emas -- kontekst hal qiladi</text>

  <rect x="500" y="312" width="380" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="520" y="336" font-size="14" font-weight="bold" fill="#1d4ed8">4. Uzluksiz o'rganish</text>
  <text x="520" y="358" font-size="13" fill="#334155">hunar hech qachon "tugamaydi"</text>

  <rect x="500" y="380" width="380" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="520" y="404" font-size="14" font-weight="bold" fill="#991b1b">5. Barqarorlik</text>
  <text x="520" y="426" font-size="13" fill="#334155">karyera -- marafon, sprint emas</text>

  <text x="460" y="488" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Texnologiya o'zgaradi -- bu saboqlar qoladi</text>
  <text x="460" y="512" text-anchor="middle" font-size="13" fill="#64748b">O'qib qo'ymang -- qo'llang: har bobdan bittasini ishingizda sinab ko'ring</text>

  <defs>
    <marker id="sn" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
