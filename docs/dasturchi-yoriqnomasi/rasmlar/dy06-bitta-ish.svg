<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="Segoe UI">
  <title>Hammasini qiluvchi katta funksiya bir nechta kichik, bir maqsadli funksiyaga bo'linadi</title>
  <rect x="0" y="0" width="880" height="470" fill="#f8fafc"/>

  <text x="440" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Bir funksiya, bir ish</text>
  <text x="440" y="60" text-anchor="middle" font-size="14" fill="#64748b">"Hammasini qiladigan" funksiya -&gt; har biri bir ishni qiladigan funksiyalar</text>

  <!-- BEFORE: one big function -->
  <rect x="40" y="88" width="300" height="332" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
  <text x="190" y="118" text-anchor="middle" font-size="18" font-weight="bold" fill="#dc2626">Oldin</text>

  <rect x="66" y="138" width="248" height="262" rx="8" fill="#fef2f2"/>
  <text x="190" y="168" text-anchor="middle" font-size="15" font-weight="bold" fill="#dc2626">buyurtmaniBajar()</text>
  <line x1="90" y1="182" x2="290" y2="182" stroke="#fecaca" stroke-width="1.5"/>
  <text x="190" y="208" text-anchor="middle" font-size="13" fill="#334155">savatni tekshirish</text>
  <text x="190" y="232" text-anchor="middle" font-size="13" fill="#334155">narxni hisoblash</text>
  <text x="190" y="256" text-anchor="middle" font-size="13" fill="#334155">to'lovni o'tkazish</text>
  <text x="190" y="280" text-anchor="middle" font-size="13" fill="#334155">bazaga yozish</text>
  <text x="190" y="304" text-anchor="middle" font-size="13" fill="#334155">email yuborish</text>
  <text x="190" y="328" text-anchor="middle" font-size="13" fill="#334155">log yozish</text>
  <text x="190" y="372" text-anchor="middle" font-size="13" fill="#dc2626">120 qator, 6 ish</text>
  <text x="190" y="390" text-anchor="middle" font-size="13" fill="#dc2626">test qilish qiyin</text>

  <!-- arrow -->
  <text x="400" y="258" text-anchor="middle" font-size="34" fill="#2563eb">-&gt;</text>

  <!-- AFTER: small functions -->
  <rect x="456" y="88" width="384" height="332" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="648" y="118" text-anchor="middle" font-size="18" font-weight="bold" fill="#16a34a">Keyin</text>

  <text x="648" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#16a34a">buyurtmaniBajar() (dirijor)</text>

  <rect x="484" y="166" width="160" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="564" y="191" text-anchor="middle" font-size="13" fill="#334155">savatniTekshir()</text>

  <rect x="660" y="166" width="160" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="740" y="191" text-anchor="middle" font-size="13" fill="#334155">narxniHisobla()</text>

  <rect x="484" y="216" width="160" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="564" y="241" text-anchor="middle" font-size="13" fill="#334155">to'lovniOtkaz()</text>

  <rect x="660" y="216" width="160" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="740" y="241" text-anchor="middle" font-size="13" fill="#334155">buyurtmaniSaqla()</text>

  <rect x="484" y="266" width="160" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="564" y="291" text-anchor="middle" font-size="13" fill="#334155">xabarYubor()</text>

  <rect x="660" y="266" width="160" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="740" y="291" text-anchor="middle" font-size="13" fill="#334155">hodisaniYozib()</text>

  <text x="648" y="346" text-anchor="middle" font-size="13" fill="#16a34a">Har biri kichik, nom o'zi gapiradi</text>
  <text x="648" y="368" text-anchor="middle" font-size="13" fill="#16a34a">alohida test qilinadi, qayta ishlatiladi</text>
  <text x="648" y="390" text-anchor="middle" font-size="13" fill="#64748b">dirijor faqat tartibni boshqaradi</text>
</svg>
