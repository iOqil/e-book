<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Segoe UI">
  <title>O'rganish piramidasi: passiv usullar pastda kam saqlash, faol usullar yuqorida ko'p saqlash</title>
  <rect x="0" y="0" width="880" height="520" fill="#f8fafc"/>

  <text x="440" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">O'rganish piramidasi: passiv &#8594; faol</text>
  <text x="440" y="62" text-anchor="middle" font-size="14" fill="#64748b">Yuqoriga ko'tarilgan sari saqlanish (esda qolish) ortadi</text>

  <!-- Pyramid, inverted bands: top widest (passive, low retention), bottom narrowest (active, high) -->
  <!-- Band 1 (top, passive, low) -->
  <polygon points="120,100 760,100 690,160 190,160" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="440" y="125" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">O'qish / video ko'rish (passiv)</text>
  <text x="440" y="147" text-anchor="middle" font-size="13" fill="#7f1d1d">past saqlash &#8776; 10-20%</text>

  <!-- Band 2 -->
  <polygon points="190,160 690,160 640,220 240,220" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="440" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">Demo ko'rish / namoyish</text>
  <text x="440" y="207" text-anchor="middle" font-size="13" fill="#92400e">o'rtacha &#8776; 30%</text>

  <!-- Band 3 -->
  <polygon points="240,220 640,220 585,290 295,290" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="248" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">Muhokama / mashq qilish</text>
  <text x="440" y="272" text-anchor="middle" font-size="13" fill="#1e40af">o'rtadan yuqori &#8776; 50-60%</text>

  <!-- Band 4 (bottom, active, high) -->
  <polygon points="295,290 585,290 510,380 370,380" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="440" y="320" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">QURISH / boshqaga tushuntirish</text>
  <text x="440" y="345" text-anchor="middle" font-size="14" fill="#166534">(Feynman texnikasi)</text>
  <text x="440" y="368" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">yuqori saqlash &#8776; 75-90%</text>

  <!-- side axis arrow: retention grows downward -->
  <line x1="60" y1="110" x2="60" y2="375" stroke="#475569" stroke-width="3"/>
  <polygon points="60,375 54,360 66,360" fill="#475569"/>
  <text x="42" y="245" text-anchor="middle" font-size="14" fill="#475569" transform="rotate(-90 42 245)">esda qolish ortadi</text>

  <!-- labels -->
  <text x="800" y="130" text-anchor="middle" font-size="14" fill="#991b1b" transform="rotate(90 800 130)">PASSIV</text>
  <text x="800" y="345" text-anchor="middle" font-size="14" fill="#166534" transform="rotate(90 800 345)">FAOL</text>

  <!-- footer note -->
  <rect x="120" y="420" width="640" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="440" y="448" text-anchor="middle" font-size="14" fill="#1e293b">Faqat ko'rsangiz &#8594; "tushunaman" tuyg'usi, lekin sayoz iz.</text>
  <text x="440" y="473" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">Qursangiz va tushuntirsangiz &#8594; chuqur, mustahkam bilim.</text>
</svg>
