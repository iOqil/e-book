<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="Segoe UI">
  <title>Ko'rinish doirasi qancha katta bo'lsa, nom shuncha tavsifiy bo'lishi kerak</title>
  <rect x="0" y="0" width="860" height="470" fill="#f8fafc"/>

  <text x="430" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Ko'rinish doirasi va nom uzunligi</text>
  <text x="430" y="62" text-anchor="middle" font-size="14" fill="#64748b">Scope qancha keng - nom shuncha tavsifiy bo'lsin</text>

  <!-- axes -->
  <line x1="120" y1="400" x2="800" y2="400" stroke="#1e293b" stroke-width="2"/>
  <line x1="120" y1="400" x2="120" y2="110" stroke="#1e293b" stroke-width="2"/>

  <!-- arrowheads -->
  <defs>
    <marker id="axar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 Z" fill="#1e293b"/>
    </marker>
  </defs>
  <line x1="800" y1="400" x2="816" y2="400" stroke="#1e293b" stroke-width="2" marker-end="url(#axar)"/>
  <line x1="120" y1="110" x2="120" y2="96" stroke="#1e293b" stroke-width="2" marker-end="url(#axar)"/>

  <!-- y label -->
  <text x="70" y="100" font-size="14" font-weight="bold" fill="#334155">Nom uzunligi /</text>
  <text x="70" y="118" font-size="14" font-weight="bold" fill="#334155">tavsifiyligi</text>

  <!-- x label -->
  <text x="820" y="426" text-anchor="end" font-size="14" font-weight="bold" fill="#334155">Ko'rinish doirasi (scope) kengligi</text>

  <!-- trend line -->
  <line x1="150" y1="370" x2="770" y2="150" stroke="#2563eb" stroke-width="3"/>

  <!-- point 1: kichik scope -->
  <circle cx="200" cy="352" r="7" fill="#16a34a"/>
  <text x="200" y="384" text-anchor="middle" font-size="13" fill="#64748b">sikl ichi</text>
  <rect x="158" y="300" width="120" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="218" y="326" text-anchor="middle" font-size="14" fill="#16a34a" font-family="monospace">i</text>

  <!-- point 2: funksiya ichi -->
  <circle cx="420" cy="272" r="7" fill="#7c3aed"/>
  <text x="420" y="384" text-anchor="middle" font-size="13" fill="#64748b">funksiya ichi</text>
  <rect x="350" y="218" width="180" height="40" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="440" y="244" text-anchor="middle" font-size="14" fill="#7c3aed" font-family="monospace">jamiNarx</text>

  <!-- point 3: global/modul -->
  <circle cx="680" cy="192" r="7" fill="#dc2626"/>
  <text x="680" y="384" text-anchor="middle" font-size="13" fill="#64748b">global / modul</text>
  <rect x="560" y="120" width="260" height="42" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="690" y="147" text-anchor="middle" font-size="14" fill="#dc2626" font-family="monospace">MAKSIMAL_URINISH_SONI</text>

  <text x="430" y="450" text-anchor="middle" font-size="13" fill="#64748b">Kichik scope'da qisqa nom joiz; keng scope'da nom o'zini izohlasin</text>
</svg>
