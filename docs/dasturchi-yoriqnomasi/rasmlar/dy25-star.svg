<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Segoe UI">
  <title>STAR ramka behavioral javob uchun: Situation, Task, Action, Result to'rt bosqichi</title>
  <rect x="0" y="0" width="900" height="460" fill="#f8fafc"/>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">STAR: behavioral javob ramkasi</text>
  <text x="450" y="62" text-anchor="middle" font-size="14" fill="#64748b">"Bir konfliktni qanday hal qilgansiz?" kabi savollarga tartibli javob</text>

  <!-- S -->
  <rect x="50" y="100" width="800" height="68" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="92" cy="134" r="22" fill="#2563eb"/>
  <text x="92" y="141" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">S</text>
  <text x="134" y="128" font-size="16" font-weight="bold" fill="#1e40af">Situation (vaziyat)</text>
  <text x="134" y="152" font-size="13" fill="#334155">Qisqa kontekst: qaysi loyiha, qanday holat edi. 1-2 jumla, ortiqcha tafsilotsiz.</text>

  <!-- T -->
  <rect x="50" y="180" width="800" height="68" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <circle cx="92" cy="214" r="22" fill="#16a34a"/>
  <text x="92" y="221" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">T</text>
  <text x="134" y="208" font-size="16" font-weight="bold" fill="#166534">Task (vazifa)</text>
  <text x="134" y="232" font-size="13" fill="#334155">Sizning aniq mas'uliyatingiz nima edi? Muammo yoki maqsad nimadan iborat.</text>

  <!-- A -->
  <rect x="50" y="260" width="800" height="68" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="92" cy="294" r="22" fill="#f59e0b"/>
  <text x="92" y="301" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">A</text>
  <text x="134" y="288" font-size="16" font-weight="bold" fill="#92400e">Action (harakat)</text>
  <text x="134" y="312" font-size="13" fill="#334155">SIZ aniq nima qildingiz ("biz" emas, "men"). Javobning eng katta qismi shu.</text>

  <!-- R -->
  <rect x="50" y="340" width="800" height="68" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="92" cy="374" r="22" fill="#7c3aed"/>
  <text x="92" y="381" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">R</text>
  <text x="134" y="368" font-size="16" font-weight="bold" fill="#6d28d9">Result (natija)</text>
  <text x="134" y="392" font-size="13" fill="#334155">Nima bilan tugadi? Iloji bo'lsa raqam bilan. Nima o'rgandingiz.</text>
</svg>
