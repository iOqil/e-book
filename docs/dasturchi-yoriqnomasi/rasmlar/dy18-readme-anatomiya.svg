<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" font-family="Segoe UI">
  <title>README anatomiyasi: nom, nima/nega, tez boshlash, foydalanish misoli, konfiguratsiya, hissa qoshish va litsenziya ketma-ketligi</title>
  <rect x="0" y="0" width="820" height="600" fill="#ffffff"/>

  <text x="410" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">README anatomiyasi</text>
  <text x="410" y="62" text-anchor="middle" font-size="14" fill="#64748b">Yuqoridan pastga: o'quvchi shu tartibda o'qiydi</text>

  <!-- 1 nom -->
  <rect x="240" y="84" width="340" height="52" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="270" y="110" font-size="15" font-weight="bold" fill="#1d4ed8">1. Loyiha nomi + bir qatorli tavsif</text>
  <text x="270" y="128" font-size="13" fill="#334155">"Bu nima va kim uchun" -- bir jumlada</text>

  <!-- 2 nima/nega -->
  <rect x="240" y="150" width="340" height="52" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="270" y="176" font-size="15" font-weight="bold" fill="#166534">2. Nima / Nega (muammo)</text>
  <text x="270" y="194" font-size="13" fill="#334155">Qaysi muammoni yechadi, nega mavjud</text>

  <!-- 3 tez boshlash -->
  <rect x="240" y="216" width="340" height="52" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="270" y="242" font-size="15" font-weight="bold" fill="#6d28d9">3. Tez boshlash (o'rnatish + ishga tushir)</text>
  <text x="270" y="260" font-size="13" fill="#334155">Eng muhim qism: 30 soniyada ishga tushsin</text>

  <!-- 4 foydalanish -->
  <rect x="240" y="282" width="340" height="52" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="270" y="308" font-size="15" font-weight="bold" fill="#b45309">4. Foydalanish misoli</text>
  <text x="270" y="326" font-size="13" fill="#334155">Eng tipik holat -- ishlaydigan kod bloki</text>

  <!-- 5 konfig -->
  <rect x="240" y="348" width="340" height="52" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="270" y="374" font-size="15" font-weight="bold" fill="#1d4ed8">5. Konfiguratsiya</text>
  <text x="270" y="392" font-size="13" fill="#334155">Sozlamalar, muhit o'zgaruvchilari (env)</text>

  <!-- 6 hissa -->
  <rect x="240" y="414" width="340" height="52" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="270" y="440" font-size="15" font-weight="bold" fill="#166534">6. Hissa qo'shish</text>
  <text x="270" y="458" font-size="13" fill="#334155">Qanday yordam berish, qoidalar, aloqa</text>

  <!-- 7 litsenziya -->
  <rect x="240" y="480" width="340" height="52" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="270" y="506" font-size="15" font-weight="bold" fill="#334155">7. Litsenziya</text>
  <text x="270" y="524" font-size="13" fill="#64748b">Foydalanish huquqi -- bir qator</text>

  <!-- down arrows -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M410 136 L410 150"/>
    <path d="M410 202 L410 216"/>
    <path d="M410 268 L410 282"/>
    <path d="M410 334 L410 348"/>
    <path d="M410 400 L410 414"/>
    <path d="M410 466 L410 480"/>
  </g>
  <g fill="#94a3b8">
    <path d="M406 148 l4 6 l4 -6 z"/>
    <path d="M406 214 l4 6 l4 -6 z"/>
    <path d="M406 280 l4 6 l4 -6 z"/>
    <path d="M406 346 l4 6 l4 -6 z"/>
    <path d="M406 412 l4 6 l4 -6 z"/>
    <path d="M406 478 l4 6 l4 -6 z"/>
  </g>

  <!-- side note -->
  <text x="610" y="246" font-size="13" fill="#16a34a" font-weight="bold">Eng ko'p</text>
  <text x="610" y="264" font-size="13" fill="#16a34a" font-weight="bold">o'qiladigan qism</text>
  <path d="M600 250 L585 248" stroke="#16a34a" stroke-width="2" fill="none"/>

  <text x="410" y="566" text-anchor="middle" font-size="13" fill="#64748b">Birinchi taassurot: ko'pchilik o'quvchi 3-4 dan narida o'qimaydi.</text>
</svg>
