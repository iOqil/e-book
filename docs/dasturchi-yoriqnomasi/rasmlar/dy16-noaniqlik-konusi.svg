<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="Segoe UI">
  <title>Noaniqlik konusi: loyiha boshida baho juda keng, oxiriga yaqin aniqlashadi</title>
  <rect x="0" y="0" width="880" height="480" fill="#f8fafc"/>

  <text x="440" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Noaniqlik konusi (cone of uncertainty)</text>
  <text x="440" y="60" text-anchor="middle" font-size="14" fill="#64748b">Loyiha boshida baho juda keng; bilim ortgani sari konus torayadi</text>

  <!-- axes -->
  <line x1="110" y1="100" x2="110" y2="410" stroke="#1e293b" stroke-width="2"/>
  <line x1="110" y1="255" x2="820" y2="255" stroke="#1e293b" stroke-width="2"/>
  <text x="455" y="445" text-anchor="middle" font-size="14" fill="#334155">Loyiha vaqti (boshidan oxirigacha)</text>
  <text x="46" y="255" text-anchor="middle" font-size="14" fill="#334155" transform="rotate(-90 46 255)">Baho xatosi</text>

  <!-- cone area -->
  <path d="M110 95 L820 240 L820 270 L110 415 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>

  <!-- ideal estimate line -->
  <line x1="110" y1="255" x2="820" y2="255" stroke="#16a34a" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="610" y="248" font-size="13" fill="#166534" font-weight="bold">aniq baho (haqiqat)</text>

  <!-- markers on Y -->
  <text x="100" y="100" text-anchor="end" font-size="13" fill="#64748b">+4x</text>
  <text x="100" y="259" text-anchor="end" font-size="13" fill="#64748b">1x</text>
  <text x="100" y="418" text-anchor="end" font-size="13" fill="#64748b">-4x</text>

  <!-- phase markers -->
  <line x1="110" y1="255" x2="110" y2="425" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="465" y1="255" x2="465" y2="425" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="150" y="135" font-size="14" fill="#1e293b" font-weight="bold">Boshlanish</text>
  <text x="150" y="153" font-size="13" fill="#64748b">baho +-4x</text>
  <text x="380" y="180" font-size="14" fill="#1e293b" font-weight="bold">Dizayn</text>
  <text x="380" y="198" font-size="13" fill="#64748b">baho +-2x</text>
  <text x="690" y="215" font-size="14" fill="#1e293b" font-weight="bold">Yakun</text>
  <text x="690" y="233" font-size="13" fill="#64748b">baho +-1.1x</text>

  <text x="440" y="468" text-anchor="middle" font-size="13" fill="#64748b">Eng noaniq paytda (boshida) aniq raqam emas, diapazon bering</text>
</svg>
