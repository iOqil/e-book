<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="Segoe UI">
  <title>Maker jadvali uzun bloklarda, manager jadvali yarim soatlarda; bitta yig'ilish maker kunini buzadi</title>
  <rect x="0" y="0" width="820" height="500" fill="#f8fafc"/>

  <text x="410" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Maker jadvali vs Manager jadvali</text>
  <text x="410" y="60" text-anchor="middle" font-size="14" fill="#64748b">Dasturchi uzun bloklarda ishlaydi; bitta yig'ilish kunni ikkiga sindiradi</text>

  <!-- LEFT: maker schedule -->
  <text x="220" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">Maker (dasturchi)</text>
  <rect x="120" y="115" width="200" height="320" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <!-- big morning block -->
  <rect x="132" y="127" width="176" height="130" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Ertalabki blok</text>
  <text x="220" y="202" text-anchor="middle" font-size="13" fill="#1e40af">09:00 - 12:00</text>
  <text x="220" y="222" text-anchor="middle" font-size="13" fill="#1e40af">chuqur ish</text>
  <!-- lunch -->
  <rect x="132" y="263" width="176" height="24" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="220" y="280" text-anchor="middle" font-size="13" fill="#64748b">tushlik</text>
  <!-- big afternoon block -->
  <rect x="132" y="293" width="176" height="130" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="346" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Tushdan keyingi blok</text>
  <text x="220" y="368" text-anchor="middle" font-size="13" fill="#1e40af">13:00 - 16:00</text>
  <text x="220" y="388" text-anchor="middle" font-size="13" fill="#1e40af">chuqur ish</text>

  <!-- RIGHT: manager schedule -->
  <text x="600" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#6d28d9">Manager (menejer)</text>
  <rect x="500" y="115" width="200" height="320" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <!-- half-hour slots -->
  <rect x="512" y="127" width="176" height="34" rx="4" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="600" y="149" text-anchor="middle" font-size="13" fill="#6d28d9">09:00 1:1</text>
  <rect x="512" y="165" width="176" height="34" rx="4" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="600" y="187" text-anchor="middle" font-size="13" fill="#6d28d9">09:30 sync</text>
  <rect x="512" y="203" width="176" height="34" rx="4" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="600" y="225" text-anchor="middle" font-size="13" fill="#6d28d9">10:00 review</text>
  <rect x="512" y="241" width="176" height="34" rx="4" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="600" y="263" text-anchor="middle" font-size="13" fill="#6d28d9">10:30 planlash</text>
  <rect x="512" y="279" width="176" height="34" rx="4" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="600" y="301" text-anchor="middle" font-size="13" fill="#6d28d9">11:00 1:1</text>
  <rect x="512" y="317" width="176" height="34" rx="4" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="600" y="339" text-anchor="middle" font-size="13" fill="#6d28d9">11:30 demo</text>
  <rect x="512" y="355" width="176" height="34" rx="4" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="600" y="377" text-anchor="middle" font-size="13" fill="#6d28d9">13:00 sync</text>
  <rect x="512" y="393" width="176" height="34" rx="4" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="600" y="415" text-anchor="middle" font-size="13" fill="#6d28d9">13:30 standup</text>

  <!-- the broken-block arrow: a meeting at 11:00 splits maker's morning -->
  <rect x="335" y="200" width="150" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="410" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">11:00 yig'ilish</text>
  <text x="410" y="256" text-anchor="middle" font-size="13" fill="#b91c1c">maker uchun</text>
  <text x="410" y="276" text-anchor="middle" font-size="13" fill="#b91c1c">ertalabki blokni</text>
  <text x="410" y="294" text-anchor="middle" font-size="13" fill="#b91c1c">ikkiga sindiradi</text>

  <text x="410" y="462" text-anchor="middle" font-size="14" fill="#334155">Yig'ilishlarni blok qilib guruhlang; maker bloklarini bo'lmang</text>
  <text x="410" y="486" text-anchor="middle" font-size="13" fill="#64748b">Paul Graham: maker va manager jadvali turli mantiqda ishlaydi</text>
</svg>
