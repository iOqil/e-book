<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Segoe UI">
  <title>Bitta kod qatori real odamlarga ta'sir qiladi: pul, sog'liq, maxfiylik va jamiyat tarmog'i</title>
  <rect x="0" y="0" width="900" height="480" fill="#f8fafc"/>

  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Kod shunchaki matn emas — u real odamlarga ta'sir qiladi</text>
  <text x="450" y="60" text-anchor="middle" font-size="14" fill="#64748b">"Men shunchaki kod yozdim" — yetarli javob emas</text>

  <!-- code line in center -->
  <rect x="320" y="210" width="260" height="60" rx="10" fill="#1e293b"/>
  <text x="450" y="237" text-anchor="middle" font-size="15" font-weight="bold" fill="#f8fafc">if (balance &lt; 0) ...</text>
  <text x="450" y="258" text-anchor="middle" font-size="13" fill="#94a3b8">bitta kod qatori</text>

  <!-- Pul (top-left) -->
  <rect x="60" y="90" width="220" height="64" rx="10" fill="#fef9c3" stroke="#f59e0b" stroke-width="2"/>
  <text x="170" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">Pul</text>
  <text x="170" y="138" text-anchor="middle" font-size="13" fill="#334155">bank, hisob-faktura, maosh</text>
  <line x1="280" y1="135" x2="330" y2="220" stroke="#f59e0b" stroke-width="2"/>

  <!-- Sog'liq (top-right) -->
  <rect x="620" y="90" width="220" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="730" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">Sog'liq va xavfsizlik</text>
  <text x="730" y="138" text-anchor="middle" font-size="13" fill="#334155">tibbiyot, transport, sanoat</text>
  <line x1="620" y1="135" x2="570" y2="220" stroke="#dc2626" stroke-width="2"/>

  <!-- Maxfiylik (bottom-left) -->
  <rect x="60" y="330" width="220" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="170" y="356" text-anchor="middle" font-size="16" font-weight="bold" fill="#6d28d9">Maxfiylik</text>
  <text x="170" y="378" text-anchor="middle" font-size="13" fill="#334155">shaxsiy ma'lumot, joylashuv</text>
  <line x1="280" y1="350" x2="330" y2="262" stroke="#7c3aed" stroke-width="2"/>

  <!-- Jamiyat (bottom-right) -->
  <rect x="620" y="330" width="220" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="730" y="356" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">Jamiyat va huquq</text>
  <text x="730" y="378" text-anchor="middle" font-size="13" fill="#334155">ovoz berish, ish, adolat</text>
  <line x1="620" y1="350" x2="570" y2="262" stroke="#16a34a" stroke-width="2"/>

  <text x="450" y="430" text-anchor="middle" font-size="14" fill="#334155" font-weight="bold">Kasb — kuch; kuch — mas'uliyat. Yozgan kodingiz oqibatlariga javobgar siz.</text>
  <text x="450" y="455" text-anchor="middle" font-size="13" fill="#64748b">Bitta xato shart, bitta yashirin yig'ilgan maydon — minglab odamga teginadi</text>
</svg>
