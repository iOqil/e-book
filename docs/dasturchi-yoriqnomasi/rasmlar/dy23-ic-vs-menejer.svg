<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Segoe UI">
  <title>Ikki karyera yo'li: IC (texnik chuqurlik) va menejer (odamlar) bir xil balandlikka olib boradi, biri yaxshiroq emas</title>
  <rect x="0" y="0" width="880" height="520" fill="#f8fafc"/>

  <text x="440" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Ikki yo'l, bir balandlik</text>
  <text x="440" y="60" text-anchor="middle" font-size="14" fill="#64748b">IC va menejer — teng qadrli, har biri boshqacha mahorat talab qiladi</text>

  <!-- equal-height baseline marker -->
  <line x1="60" y1="110" x2="820" y2="110" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 5"/>
  <text x="440" y="102" text-anchor="middle" font-size="13" fill="#94a3b8">bir xil tashkiliy balandlik / ta'sir</text>

  <!-- IC arrow up -->
  <line x1="240" y1="430" x2="240" y2="120" stroke="#16a34a" stroke-width="4"/>
  <polygon points="240,112 232,128 248,128" fill="#16a34a"/>

  <!-- Manager arrow up -->
  <line x1="640" y1="430" x2="640" y2="120" stroke="#7c3aed" stroke-width="4"/>
  <polygon points="640,112 632,128 648,128" fill="#7c3aed"/>

  <!-- IC box -->
  <rect x="80" y="160" width="320" height="250" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="240" y="190" text-anchor="middle" font-size="18" font-weight="bold" fill="#166534">IC — texnik yo'l</text>
  <text x="240" y="212" text-anchor="middle" font-size="14" fill="#166534">(Individual Contributor)</text>
  <text x="100" y="246" font-size="14" fill="#1e293b">&#8226; Chuqurroq texnik ekspertiza</text>
  <text x="100" y="276" font-size="14" fill="#1e293b">&#8226; Murakkab tizimlarni dizayn qiladi</text>
  <text x="100" y="306" font-size="14" fill="#1e293b">&#8226; Texnik yo'nalish belgilaydi</text>
  <text x="100" y="336" font-size="14" fill="#1e293b">&#8226; Ta'sir: kod, arxitektura, mentor</text>
  <text x="100" y="366" font-size="14" fill="#1e293b">&#8226; Senior &#8594; Staff &#8594; Principal</text>
  <text x="240" y="396" text-anchor="middle" font-size="13" fill="#166534">Sevadigan: chuqur muammo yechish</text>

  <!-- Manager box -->
  <rect x="480" y="160" width="320" height="250" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="640" y="190" text-anchor="middle" font-size="18" font-weight="bold" fill="#6d28d9">Menejer — boshqaruv</text>
  <text x="640" y="212" text-anchor="middle" font-size="14" fill="#6d28d9">(People Management)</text>
  <text x="500" y="246" font-size="14" fill="#1e293b">&#8226; Odamlarni o'stiradi, qo'llaydi</text>
  <text x="500" y="276" font-size="14" fill="#1e293b">&#8226; Jamoa va etkazib berishga javobgar</text>
  <text x="500" y="306" font-size="14" fill="#1e293b">&#8226; Prioritet, hiring, 1:1</text>
  <text x="500" y="336" font-size="14" fill="#1e293b">&#8226; Ta'sir: jamoa orqali ko'payadi</text>
  <text x="500" y="366" font-size="14" fill="#1e293b">&#8226; Lead &#8594; Manager &#8594; Director</text>
  <text x="640" y="396" text-anchor="middle" font-size="13" fill="#6d28d9">Sevadigan: odamlar muvaffaqiyati</text>

  <text x="440" y="460" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Tanlov: nimadan zavq olasiz? Kodmi yoki odamlarmi?</text>
  <text x="440" y="486" text-anchor="middle" font-size="13" fill="#64748b">Ko'p kompaniyada o'tish ikki tomonlama — qaytib kelish ham mumkin</text>
</svg>
