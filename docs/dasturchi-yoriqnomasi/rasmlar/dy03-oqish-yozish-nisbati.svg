<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="Segoe UI">
  <title>Kod yozish va o'qish nisbati taxminan 1 ga 10</title>
  <rect x="0" y="0" width="860" height="420" fill="#f8fafc"/>

  <text x="430" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Kodni qancha yozasiz, qancha o'qiysiz?</text>
  <text x="430" y="70" text-anchor="middle" font-size="14" fill="#64748b">Bir qator yozish uchun atrofdagi o'nlab qatorni o'qiysiz</text>

  <!-- Yozish ustuni -->
  <rect x="120" y="300" width="120" height="60" rx="8" fill="#2563eb"/>
  <text x="180" y="338" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Yozish</text>
  <text x="180" y="290" text-anchor="middle" font-size="15" fill="#334155">~10%</text>
  <text x="180" y="386" text-anchor="middle" font-size="14" fill="#64748b">1 ulush</text>

  <!-- O'qish ustuni -->
  <rect x="380" y="120" width="120" height="240" rx="8" fill="#16a34a"/>
  <text x="440" y="244" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">O'qish</text>
  <text x="440" y="110" text-anchor="middle" font-size="15" fill="#334155">~90%</text>
  <text x="440" y="386" text-anchor="middle" font-size="14" fill="#64748b">10 ulush</text>

  <!-- Nisbat belgisi -->
  <text x="310" y="240" text-anchor="middle" font-size="28" font-weight="bold" fill="#dc2626">:</text>

  <!-- O'ng izoh paneli -->
  <rect x="580" y="110" width="250" height="250" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="705" y="142" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Demak:</text>
  <text x="600" y="178" font-size="14" fill="#334155">- O'qish = asosiy ish</text>
  <text x="600" y="210" font-size="14" fill="#334155">- Yozish undan kichik</text>
  <text x="600" y="242" font-size="14" fill="#334155">- Tez yozgan kod</text>
  <text x="618" y="264" font-size="14" fill="#64748b">qayta-qayta o'qiladi</text>
  <text x="600" y="300" font-size="14" fill="#dc2626">- Lekin o'qishni</text>
  <text x="618" y="322" font-size="14" fill="#dc2626">hech kim o'rgatmaydi</text>
  <text x="600" y="348" font-size="13" fill="#7c3aed">O'qish = mashq qilinadigan ko'nikma</text>
</svg>
