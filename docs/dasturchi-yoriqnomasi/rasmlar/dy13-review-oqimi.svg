<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="Segoe UI">
  <title>Code review oqimi: kod yoz, o'zingni review qil, PR och, sharh ol, tuzat, merge qil</title>
  <rect x="0" y="0" width="880" height="470" fill="#f8fafc"/>

  <text x="440" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Code review oqimi</text>
  <text x="440" y="62" text-anchor="middle" font-size="14" fill="#64748b">Kod tayyor bo'lgandan merge'gacha — sharh shu zanjirning bir bo'g'ini</text>

  <!-- Step 1 -->
  <rect x="40" y="100" width="180" height="74" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">1. Kod yoz</text>
  <text x="130" y="154" text-anchor="middle" font-size="13" fill="#64748b">kichik, fokuslangan</text>

  <!-- Step 2 -->
  <rect x="260" y="100" width="180" height="74" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="350" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">2. O'zingni</text>
  <text x="350" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">review qil</text>
  <text x="350" y="166" text-anchor="middle" font-size="13" fill="#64748b">diff'ni o'qib chiq</text>

  <!-- Step 3 -->
  <rect x="480" y="100" width="180" height="74" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="570" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">3. PR och</text>
  <text x="570" y="154" text-anchor="middle" font-size="13" fill="#64748b">tavsif + kontekst</text>

  <!-- Step 4 -->
  <rect x="700" y="100" width="140" height="74" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="770" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">4. Sharh</text>
  <text x="770" y="146" text-anchor="middle" font-size="13" fill="#64748b">reviewer</text>
  <text x="770" y="164" text-anchor="middle" font-size="13" fill="#64748b">o'qiydi, izoh</text>

  <!-- arrows row 1 -->
  <line x1="220" y1="137" x2="256" y2="137" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="256,137 248,133 248,141" fill="#94a3b8"/>
  <line x1="440" y1="137" x2="476" y2="137" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="476,137 468,133 468,141" fill="#94a3b8"/>
  <line x1="660" y1="137" x2="696" y2="137" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="696,137 688,133 688,141" fill="#94a3b8"/>

  <!-- down arrow to step 5 -->
  <line x1="770" y1="174" x2="770" y2="240" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="770,240 766,232 774,232" fill="#94a3b8"/>

  <!-- Step 5 -->
  <rect x="640" y="248" width="200" height="74" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="740" y="280" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">5. Tuzat / javob ber</text>
  <text x="740" y="302" text-anchor="middle" font-size="13" fill="#64748b">muhokama, kelishuv</text>

  <!-- loop back arrow 5 -> 4 -->
  <path d="M 700 248 C 640 210, 700 190, 760 178" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="760,178 754,185 762,187" fill="#f59e0b"/>
  <text x="612" y="208" font-size="13" fill="#b45309">qayta sharh sikli</text>

  <!-- arrow 5 -> 6 -->
  <line x1="640" y1="285" x2="470" y2="285" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="470,285 478,281 478,289" fill="#94a3b8"/>
  <text x="540" y="276" text-anchor="middle" font-size="13" fill="#64748b">tasdiq</text>

  <!-- Step 6 -->
  <rect x="270" y="248" width="190" height="74" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="365" y="280" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">6. Merge</text>
  <text x="365" y="302" text-anchor="middle" font-size="13" fill="#16a34a">jamoaviy egalik</text>

  <!-- bottom note -->
  <rect x="40" y="372" width="800" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="398" font-size="14" font-weight="bold" fill="#1e293b">Maqsad:</text>
  <text x="135" y="398" font-size="14" fill="#334155">sifat + bilim almashish + jamoaviy egalik + izchillik — "ayb topish" emas.</text>
  <text x="60" y="422" font-size="13" fill="#64748b">2 va 3-qadam reviewer ishini yengillashtiradi: kichik PR = tez va sifatli sharh.</text>
</svg>
