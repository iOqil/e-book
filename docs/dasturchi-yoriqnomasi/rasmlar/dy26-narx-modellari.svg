<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" font-family="Segoe UI">
  <title>Frilans narx modellari taqqoslash kartalari: soatbay, loyihabay va qiymatbay narx belgilashning afzalliklari va xavflari</title>
  <rect x="0" y="0" width="920" height="500" fill="#f8fafc"/>

  <text x="460" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Narx belgilash modellari</text>
  <text x="460" y="62" text-anchor="middle" font-size="14" fill="#64748b">Chapdan o'ngga: vaqt sotishdan qiymat sotishga</text>

  <!-- Hourly -->
  <rect x="40" y="90" width="270" height="370" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="175" y="124" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e40af">Soatbay</text>
  <text x="175" y="146" text-anchor="middle" font-size="13" fill="#64748b">$X / soat</text>
  <line x1="64" y1="160" x2="286" y2="160" stroke="#bfdbfe" stroke-width="1"/>
  <text x="64" y="186" font-size="13" font-weight="bold" fill="#16a34a">Mos:</text>
  <text x="64" y="208" font-size="13" fill="#334155">noaniq ko'lam, uzoq</text>
  <text x="64" y="226" font-size="13" fill="#334155">qo'llab-quvvatlash ishi</text>
  <text x="64" y="252" font-size="13" font-weight="bold" fill="#16a34a">+ Yutuq:</text>
  <text x="64" y="274" font-size="13" fill="#334155">adolatli, oson hisob</text>
  <text x="64" y="292" font-size="13" fill="#334155">o'zgarish xavfi yo'q</text>
  <text x="64" y="318" font-size="13" font-weight="bold" fill="#dc2626">- Xavf:</text>
  <text x="64" y="340" font-size="13" fill="#334155">daromad = vaqt cheki</text>
  <text x="64" y="358" font-size="13" fill="#334155">tez ishlasang kam olasan</text>
  <text x="64" y="376" font-size="13" fill="#334155">mijoz soatni sanaydi</text>
  <rect x="64" y="398" width="222" height="46" rx="8" fill="#dbeafe"/>
  <text x="175" y="418" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Vaqtingizni</text>
  <text x="175" y="436" text-anchor="middle" font-size="13" fill="#334155">sotasiz</text>

  <!-- Fixed -->
  <rect x="325" y="90" width="270" height="370" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="460" y="124" text-anchor="middle" font-size="18" font-weight="bold" fill="#166534">Loyihabay</text>
  <text x="460" y="146" text-anchor="middle" font-size="13" fill="#64748b">butun loyiha = $Y</text>
  <line x1="349" y1="160" x2="571" y2="160" stroke="#bbf7d0" stroke-width="1"/>
  <text x="349" y="186" font-size="13" font-weight="bold" fill="#16a34a">Mos:</text>
  <text x="349" y="208" font-size="13" fill="#334155">aniq, yozma TZ bor</text>
  <text x="349" y="226" font-size="13" fill="#334155">ko'lam o'zgarmas</text>
  <text x="349" y="252" font-size="13" font-weight="bold" fill="#16a34a">+ Yutuq:</text>
  <text x="349" y="274" font-size="13" fill="#334155">mijozga aniq narx</text>
  <text x="349" y="292" font-size="13" fill="#334155">tez ishlasang ko'p olasan</text>
  <text x="349" y="318" font-size="13" font-weight="bold" fill="#dc2626">- Xavf:</text>
  <text x="349" y="340" font-size="13" fill="#334155">ko'lam o'sishi (scope creep)</text>
  <text x="349" y="358" font-size="13" fill="#334155">noto'g'ri baholash = zarar</text>
  <text x="349" y="376" font-size="13" fill="#334155">yozma TZ shart</text>
  <rect x="349" y="398" width="222" height="46" rx="8" fill="#dcfce7"/>
  <text x="460" y="418" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">Natijani</text>
  <text x="460" y="436" text-anchor="middle" font-size="13" fill="#334155">sotasiz</text>

  <!-- Value -->
  <rect x="610" y="90" width="270" height="370" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="745" y="124" text-anchor="middle" font-size="18" font-weight="bold" fill="#6d28d9">Qiymatbay</text>
  <text x="745" y="146" text-anchor="middle" font-size="13" fill="#64748b">biznes qiymatiga bog'liq</text>
  <line x1="634" y1="160" x2="856" y2="160" stroke="#e9d5ff" stroke-width="1"/>
  <text x="634" y="186" font-size="13" font-weight="bold" fill="#16a34a">Mos:</text>
  <text x="634" y="208" font-size="13" fill="#334155">aniq biznes natijasi</text>
  <text x="634" y="226" font-size="13" fill="#334155">(savdo, tejam) bor</text>
  <text x="634" y="252" font-size="13" font-weight="bold" fill="#16a34a">+ Yutuq:</text>
  <text x="634" y="274" font-size="13" fill="#334155">eng yuqori daromad</text>
  <text x="634" y="292" font-size="13" fill="#334155">vaqtga bog'liq emas</text>
  <text x="634" y="318" font-size="13" font-weight="bold" fill="#dc2626">- Xavf:</text>
  <text x="634" y="340" font-size="13" fill="#334155">ishonch va tajriba kerak</text>
  <text x="634" y="358" font-size="13" fill="#334155">qiymatni o'lchash qiyin</text>
  <text x="634" y="376" font-size="13" fill="#334155">boshlovchi uchun erta</text>
  <rect x="634" y="398" width="222" height="46" rx="8" fill="#f3e8ff"/>
  <text x="745" y="418" text-anchor="middle" font-size="13" font-weight="bold" fill="#6d28d9">Qiymatni</text>
  <text x="745" y="436" text-anchor="middle" font-size="13" fill="#334155">sotasiz</text>

  <text x="460" y="486" text-anchor="middle" font-size="13" fill="#64748b">Tajriba oshgan sari soatbaydan qiymatbay tomon siljiysiz</text>
</svg>
