<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Segoe UI">
  <title>Keng tarqalgan kod hidlari kartasi: har biri qisqa ta'rif bilan</title>
  <rect x="0" y="0" width="880" height="500" fill="#f8fafc"/>

  <text x="440" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Keng tarqalgan kod hidlari</text>
  <text x="440" y="62" text-anchor="middle" font-size="14" fill="#64748b">Hid = "bu yerda nimadir noto'g'ri" degan ogohlantiruvchi belgi, xato emas</text>

  <!-- Row 1 -->
  <rect x="40" y="86" width="260" height="92" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="114" font-size="16" font-weight="bold" fill="#dc2626">Uzun funksiya</text>
  <text x="60" y="138" font-size="13" fill="#334155">Bir funksiya juda ko'p ish</text>
  <text x="60" y="158" font-size="13" fill="#334155">qiladi, ekranga sig'maydi.</text>

  <rect x="310" y="86" width="260" height="92" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="330" y="114" font-size="16" font-weight="bold" fill="#dc2626">Katta klass</text>
  <text x="330" y="138" font-size="13" fill="#334155">Bir klass o'nlab maydon va</text>
  <text x="330" y="158" font-size="13" fill="#334155">mas'uliyatni jamlab olgan.</text>

  <rect x="580" y="86" width="260" height="92" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="114" font-size="16" font-weight="bold" fill="#dc2626">Takror kod</text>
  <text x="600" y="138" font-size="13" fill="#334155">Bir mantiq bir necha joyda</text>
  <text x="600" y="158" font-size="13" fill="#334155">nusxalanib yotibdi.</text>

  <!-- Row 2 -->
  <rect x="40" y="194" width="260" height="92" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="60" y="222" font-size="16" font-weight="bold" fill="#b45309">Uzun parametr</text>
  <text x="60" y="246" font-size="13" fill="#334155">Funksiya 5+ argument</text>
  <text x="60" y="266" font-size="13" fill="#334155">oladi, chaqirish chalkash.</text>

  <rect x="310" y="194" width="260" height="92" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="330" y="222" font-size="16" font-weight="bold" fill="#b45309">Ma'lumot loyqasi</text>
  <text x="330" y="246" font-size="13" fill="#334155">Bir guruh maydon doim</text>
  <text x="330" y="266" font-size="13" fill="#334155">birga yuradi (data clump).</text>

  <rect x="580" y="194" width="260" height="92" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="222" font-size="16" font-weight="bold" fill="#b45309">Primitiv obsessiya</text>
  <text x="600" y="246" font-size="13" fill="#334155">Tushuncha o'rniga string/</text>
  <text x="600" y="266" font-size="13" fill="#334155">son ishlatiladi.</text>

  <!-- Row 3 -->
  <rect x="40" y="302" width="260" height="92" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="60" y="330" font-size="16" font-weight="bold" fill="#7c3aed">Feature envy</text>
  <text x="60" y="354" font-size="13" fill="#334155">Metod o'zinikidan ko'ra</text>
  <text x="60" y="374" font-size="13" fill="#334155">boshqa obyekt ma'lumotiga osilgan.</text>

  <rect x="310" y="302" width="260" height="92" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="330" y="330" font-size="16" font-weight="bold" fill="#7c3aed">Shotgun surgery</text>
  <text x="330" y="354" font-size="13" fill="#334155">Bitta o'zgarish uchun 10 ta</text>
  <text x="330" y="374" font-size="13" fill="#334155">faylga tegish kerak.</text>

  <rect x="580" y="302" width="260" height="92" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="600" y="330" font-size="16" font-weight="bold" fill="#7c3aed">Ichma-ich shartlar</text>
  <text x="600" y="354" font-size="13" fill="#334155">if ichida if ichida if —</text>
  <text x="600" y="374" font-size="13" fill="#334155">o'qib bo'lmas piramida.</text>

  <!-- footer note -->
  <rect x="40" y="416" width="800" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="442" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">Hid != xato</text>
  <text x="440" y="463" text-anchor="middle" font-size="13" fill="#334155">Kod ishlayotgan bo'lishi mumkin; hid faqat "bu yerga yana qarang" deydi. Har hid darhol tuzatishni talab qilmaydi.</text>
</svg>
