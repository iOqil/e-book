<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Segoe UI">
  <title>Kanban doska: To Do, In Progress WIP limiti 2 bilan, Review va Done ustunlari, kartalar chapdan o'ngga oqadi</title>
  <rect x="0" y="0" width="880" height="520" fill="#f8fafc"/>

  <text x="440" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Kanban doska: ishni vizual qil, oqimni cheklab boshqar</text>
  <text x="440" y="60" text-anchor="middle" font-size="14" fill="#64748b">Ko'p boshlama, ko'p tugat: WIP limiti yarim tugagan ishlarni cheklaydi</text>

  <!-- columns -->
  <!-- To Do -->
  <rect x="30" y="90" width="190" height="400" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="125" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">To Do</text>

  <!-- In Progress (WIP=2) -->
  <rect x="235" y="90" width="190" height="400" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="330" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">In Progress</text>
  <rect x="290" y="128" width="80" height="24" rx="12" fill="#dc2626"/>
  <text x="330" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">WIP = 2</text>

  <!-- Review -->
  <rect x="440" y="90" width="190" height="400" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="535" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#6b21a8">Review</text>
  <rect x="500" y="128" width="80" height="24" rx="12" fill="#7c3aed"/>
  <text x="540" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">WIP = 2</text>

  <!-- Done -->
  <rect x="650" y="90" width="200" height="400" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="750" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">Done</text>

  <!-- To Do cards -->
  <rect x="48" y="170" width="154" height="50" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="62" y="192" font-size="13" fill="#334155">Login bug tuzatish</text>
  <text x="62" y="210" font-size="13" fill="#94a3b8">#231</text>
  <rect x="48" y="232" width="154" height="50" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="62" y="254" font-size="13" fill="#334155">Eksport CSV</text>
  <text x="62" y="272" font-size="13" fill="#94a3b8">#235</text>
  <rect x="48" y="294" width="154" height="50" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="62" y="316" font-size="13" fill="#334155">Profil sahifa</text>
  <text x="62" y="334" font-size="13" fill="#94a3b8">#238</text>

  <!-- In Progress cards (2 = at limit) -->
  <rect x="253" y="170" width="154" height="50" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="267" y="192" font-size="13" fill="#334155">Qidiruv API</text>
  <text x="267" y="210" font-size="13" fill="#94a3b8">#228 · Aziz</text>
  <rect x="253" y="232" width="154" height="50" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="267" y="254" font-size="13" fill="#334155">Email shabloni</text>
  <text x="267" y="272" font-size="13" fill="#94a3b8">#230 · Lola</text>
  <!-- blocked slot -->
  <rect x="253" y="294" width="154" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="5 4"/>
  <text x="330" y="316" text-anchor="middle" font-size="13" fill="#991b1b">limit to'ldi</text>
  <text x="330" y="334" text-anchor="middle" font-size="13" fill="#991b1b">yangi boshlamang</text>

  <!-- Review cards -->
  <rect x="458" y="170" width="154" height="50" rx="6" fill="#ffffff" stroke="#7c3aed"/>
  <text x="472" y="192" font-size="13" fill="#334155">Hisobot PDF</text>
  <text x="472" y="210" font-size="13" fill="#94a3b8">#224 · PR ochiq</text>

  <!-- Done cards -->
  <rect x="666" y="170" width="168" height="50" rx="6" fill="#ffffff" stroke="#16a34a"/>
  <text x="680" y="192" font-size="13" fill="#334155">Dark mode</text>
  <text x="680" y="210" font-size="13" fill="#94a3b8">#219</text>
  <rect x="666" y="232" width="168" height="50" rx="6" fill="#ffffff" stroke="#16a34a"/>
  <text x="680" y="254" font-size="13" fill="#334155">Logout tugma</text>
  <text x="680" y="272" font-size="13" fill="#94a3b8">#221</text>

  <!-- flow arrows -->
  <line x1="222" y1="430" x2="648" y2="430" stroke="#16a34a" stroke-width="2"/>
  <polygon points="648,430 638,425 638,435" fill="#16a34a"/>
  <text x="435" y="423" text-anchor="middle" font-size="13" fill="#166534">oqim yo'nalishi: chapdan o'ngga, uzluksiz</text>

  <text x="48" y="470" font-size="13" fill="#64748b">Sprint yo'q: ish tugashi bilan keyingisi tortiladi (pull). Maqsad — boshlanganni tugatish, oqim vaqtini qisqartirish.</text>
</svg>
