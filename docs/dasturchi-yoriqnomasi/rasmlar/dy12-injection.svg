<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="Segoe UI">
  <title>Ma'lumot va kodning aralashuvi injection xatosini keltiradi, parametrlangan so'rov ularni ajratib xavfsiz qiladi</title>
  <rect x="0" y="0" width="880" height="480" fill="#f8fafc"/>

  <text x="440" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Injection: ma'lumot va kod aralashuvi</text>
  <text x="440" y="60" text-anchor="middle" font-size="14" fill="#64748b">Sabab: ma'lumotni kod sifatida talqin qilish. Davo: ularni ajratish</text>

  <!-- LEFT: bad -->
  <rect x="30" y="84" width="400" height="368" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
  <text x="52" y="112" font-size="17" font-weight="bold" fill="#dc2626">Aralashtirish (injection)</text>

  <rect x="52" y="128" width="160" height="44" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="132" y="148" text-anchor="middle" font-size="13" fill="#991b1b">Foydalanuvchi kiritdi:</text>
  <text x="132" y="166" text-anchor="middle" font-size="13" fill="#991b1b">' OR '1'='1</text>

  <line x1="212" y1="150" x2="252" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="256,150 246,145 246,155" fill="#94a3b8"/>

  <rect x="256" y="120" width="152" height="60" rx="8" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="332" y="144" text-anchor="middle" font-size="13" fill="#92400e">Satr birlashtirish</text>
  <text x="332" y="164" text-anchor="middle" font-size="13" fill="#92400e">("...WHERE x='" + k)</text>

  <rect x="52" y="200" width="356" height="86" rx="8" fill="#1e293b"/>
  <text x="72" y="226" font-size="14" font-family="Segoe UI" fill="#94a3b8">SELECT * FROM users</text>
  <text x="72" y="248" font-size="14" font-family="Segoe UI" fill="#94a3b8">WHERE name = '<tspan fill="#fca5a5">'</tspan></text>
  <text x="72" y="270" font-size="14" font-family="Segoe UI" fill="#fca5a5">OR '1'='1</text>

  <rect x="52" y="306" width="356" height="58" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="230" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">Kiritma KOD'ga aylandi</text>
  <text x="230" y="352" text-anchor="middle" font-size="13" fill="#991b1b">butun jadval o'g'irlandi</text>

  <text x="52" y="396" font-size="13" fill="#991b1b">Bir xil idea: shell komandasi (command</text>
  <text x="52" y="416" font-size="13" fill="#991b1b">injection), HTML/JS sahifada (XSS).</text>
  <text x="52" y="438" font-size="13" fill="#991b1b">Hammasi -- ma'lumot kod bo'lib ketdi.</text>

  <!-- RIGHT: good -->
  <rect x="450" y="84" width="400" height="368" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="472" y="112" font-size="17" font-weight="bold" fill="#16a34a">Ajratish (parametrlangan)</text>

  <rect x="472" y="128" width="160" height="44" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="552" y="148" text-anchor="middle" font-size="13" fill="#991b1b">Foydalanuvchi kiritdi:</text>
  <text x="552" y="166" text-anchor="middle" font-size="13" fill="#991b1b">' OR '1'='1</text>

  <line x1="632" y1="150" x2="672" y2="150" stroke="#16a34a" stroke-width="2"/>
  <polygon points="676,150 666,145 666,155" fill="#16a34a"/>

  <rect x="676" y="120" width="152" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="752" y="144" text-anchor="middle" font-size="13" fill="#166534">Parametr sifatida</text>
  <text x="752" y="164" text-anchor="middle" font-size="13" fill="#166534">uzatiladi (?, :ism)</text>

  <rect x="472" y="200" width="356" height="86" rx="8" fill="#1e293b"/>
  <text x="492" y="226" font-size="14" font-family="Segoe UI" fill="#94a3b8">SELECT * FROM users</text>
  <text x="492" y="248" font-size="14" font-family="Segoe UI" fill="#94a3b8">WHERE name = <tspan fill="#86efac">?</tspan></text>
  <text x="492" y="272" font-size="13" font-family="Segoe UI" fill="#64748b">params: ["' OR '1'='1"]</text>

  <rect x="472" y="306" width="356" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="650" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">Kiritma -- shunchaki QIYMAT</text>
  <text x="650" y="352" text-anchor="middle" font-size="13" fill="#166534">"bunday ismli odam yo'q"</text>

  <text x="472" y="396" font-size="13" fill="#166534">Bir xil davo: komanda uchun argument</text>
  <text x="472" y="416" font-size="13" fill="#166534">massivi; HTML uchun kontekstga mos</text>
  <text x="472" y="438" font-size="13" fill="#166534">escaping/kodlash. Ma'lumot kod emas.</text>
</svg>
