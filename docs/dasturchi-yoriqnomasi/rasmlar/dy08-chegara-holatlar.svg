<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Segoe UI">
  <title>Har bir kirishni sinash kerak bo'lgan chegaraviy holatlar ro'yxati: bo'sh, null, nol, manfiy, juda katta, takror, unicode va vaqt zonasi</title>
  <rect x="0" y="0" width="880" height="520" fill="#f8fafc"/>

  <text x="440" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Chegaraviy holatlar tekshiruv kartasi</text>
  <text x="440" y="62" text-anchor="middle" font-size="14" fill="#64748b">Yangi funksiya yozsangiz, har birini ataylab sinab ko'ring</text>

  <!-- Row 1 -->
  <rect x="40" y="86" width="260" height="92" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="116" font-size="17" font-weight="bold" fill="#2563eb">Bo'sh</text>
  <text x="60" y="140" font-size="13" fill="#334155">Bo'sh ro'yxat, bo'sh matn ""</text>
  <text x="60" y="160" font-size="13" fill="#64748b">Misol: 0 ta element bilan jami?</text>

  <rect x="310" y="86" width="260" height="92" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="330" y="116" font-size="17" font-weight="bold" fill="#7c3aed">Null / nil</text>
  <text x="330" y="140" font-size="13" fill="#334155">Qiymat umuman yo'q</text>
  <text x="330" y="160" font-size="13" fill="#64748b">Misol: profil topilmadi -> null</text>

  <rect x="580" y="86" width="260" height="92" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="116" font-size="17" font-weight="bold" fill="#16a34a">Nol (0)</text>
  <text x="600" y="140" font-size="13" fill="#334155">Bo'lish, indeks, hisoblagich</text>
  <text x="600" y="160" font-size="13" fill="#64748b">Misol: 0 ga bo'lish?</text>

  <!-- Row 2 -->
  <rect x="40" y="194" width="260" height="92" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="224" font-size="17" font-weight="bold" fill="#dc2626">Manfiy</text>
  <text x="60" y="248" font-size="13" fill="#334155">Kutilmagan -5, -1</text>
  <text x="60" y="268" font-size="13" fill="#64748b">Misol: manfiy miqdor savatda?</text>

  <rect x="310" y="194" width="260" height="92" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="330" y="224" font-size="17" font-weight="bold" fill="#b45309">Juda katta</text>
  <text x="330" y="248" font-size="13" fill="#334155">Toshish (overflow), sekinlik</text>
  <text x="330" y="268" font-size="13" fill="#64748b">Misol: 10 mln qatorli fayl?</text>

  <rect x="580" y="194" width="260" height="92" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="600" y="224" font-size="17" font-weight="bold" fill="#2563eb">Takror</text>
  <text x="600" y="248" font-size="13" fill="#334155">Bir xil element / so'rov</text>
  <text x="600" y="268" font-size="13" fill="#64748b">Misol: ikki marta to'lov?</text>

  <!-- Row 3 -->
  <rect x="40" y="302" width="260" height="92" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="60" y="332" font-size="17" font-weight="bold" fill="#7c3aed">Unicode</text>
  <text x="60" y="356" font-size="13" fill="#334155">Emoji, harf bilan harf-belgi</text>
  <text x="60" y="376" font-size="13" fill="#64748b">Misol: nom uzunligi to'g'rimi?</text>

  <rect x="310" y="302" width="260" height="92" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="330" y="332" font-size="17" font-weight="bold" fill="#16a34a">Vaqt zonasi</text>
  <text x="330" y="356" font-size="13" fill="#334155">UTC, yoz/qish vaqti, sana chegarasi</text>
  <text x="330" y="376" font-size="13" fill="#64748b">Misol: yarim tundagi buyurtma?</text>

  <rect x="580" y="302" width="260" height="92" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="332" font-size="17" font-weight="bold" fill="#dc2626">Bir / chegara</text>
  <text x="600" y="356" font-size="13" fill="#334155">1 ta element, oxirgi indeks</text>
  <text x="600" y="376" font-size="13" fill="#64748b">Misol: off-by-one xato?</text>

  <!-- Rule banner -->
  <rect x="40" y="416" width="800" height="74" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="448" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e3a8a">"0, 1, ko'p" qoidasi</text>
  <text x="440" y="474" text-anchor="middle" font-size="14" fill="#334155">Hech bo'lmasa shu uchtasini sinang: hech narsa, bitta, ko'p. Ko'p bug shu yerda yashiringan.</text>
</svg>
