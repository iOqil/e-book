<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Segoe UI">
  <title>Yangi ishda birinchi 90 kun: 1-30 kun o'rganish va kuzatish, 31-60 kun hissa qo'shish, 61-90 kun mustaqillik</title>
  <rect x="0" y="0" width="900" height="480" fill="#f8fafc"/>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Birinchi 90 kun: uchta bosqich</text>
  <text x="450" y="62" text-anchor="middle" font-size="14" fill="#64748b">Shoshilmang -- avval o'rganing, keyin hissa qo'shing, so'ng mustaqil bo'ling</text>

  <!-- timeline base -->
  <line x1="80" y1="120" x2="820" y2="120" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="80" cy="120" r="6" fill="#2563eb"/>
  <circle cx="450" cy="120" r="6" fill="#16a34a"/>
  <circle cx="820" cy="120" r="6" fill="#7c3aed"/>

  <!-- Stage 1: 1-30 -->
  <rect x="60" y="150" width="240" height="270" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="182" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d4ed8">1-30 kun</text>
  <text x="180" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">O'rgan va kuzat</text>
  <text x="180" y="240" text-anchor="middle" font-size="13" fill="#334155">Muhitni sozla (20-bob)</text>
  <text x="180" y="264" text-anchor="middle" font-size="13" fill="#334155">Kod bazasini o'qi (03-bob)</text>
  <text x="180" y="288" text-anchor="middle" font-size="13" fill="#334155">Yaxshi savol ber (17-bob)</text>
  <text x="180" y="312" text-anchor="middle" font-size="13" fill="#334155">Odamlarni tani</text>
  <text x="180" y="336" text-anchor="middle" font-size="13" fill="#334155">Kutishlarni aniqla</text>
  <text x="180" y="360" text-anchor="middle" font-size="13" fill="#dc2626">Tezkor g'alabaga shoshilma</text>
  <text x="180" y="396" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">Fokus: kontekst</text>

  <!-- Stage 2: 31-60 -->
  <rect x="330" y="150" width="240" height="270" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="182" text-anchor="middle" font-size="17" font-weight="bold" fill="#166534">31-60 kun</text>
  <text x="450" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Hissa qo'sh</text>
  <text x="450" y="240" text-anchor="middle" font-size="13" fill="#334155">Birinchi PR'lar (13/14-bob)</text>
  <text x="450" y="264" text-anchor="middle" font-size="13" fill="#334155">Kichik vazifalar</text>
  <text x="450" y="288" text-anchor="middle" font-size="13" fill="#334155">Jarayonga qo'shil (15-bob)</text>
  <text x="450" y="312" text-anchor="middle" font-size="13" fill="#334155">Feedback so'ra (19-bob)</text>
  <text x="450" y="336" text-anchor="middle" font-size="13" fill="#334155">Hujjatla (18-bob)</text>
  <text x="450" y="360" text-anchor="middle" font-size="13" fill="#16a34a">Ishonch qura boshla</text>
  <text x="450" y="396" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">Fokus: yetkazish</text>

  <!-- Stage 3: 61-90 -->
  <rect x="600" y="150" width="240" height="270" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="720" y="182" text-anchor="middle" font-size="17" font-weight="bold" fill="#6d28d9">61-90 kun</text>
  <text x="720" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Mustaqil bo'l</text>
  <text x="720" y="240" text-anchor="middle" font-size="13" fill="#334155">Kattaroq mas'uliyat</text>
  <text x="720" y="264" text-anchor="middle" font-size="13" fill="#334155">O'z fikrini bildir</text>
  <text x="720" y="288" text-anchor="middle" font-size="13" fill="#334155">Noaniqlikni o'zing hal qil</text>
  <text x="720" y="312" text-anchor="middle" font-size="13" fill="#334155">Impostor bilan kurash (28)</text>
  <text x="720" y="336" text-anchor="middle" font-size="13" fill="#334155">"Men jamoa a'zosiman"</text>
  <text x="720" y="360" text-anchor="middle" font-size="13" fill="#7c3aed">Yo'nalishga ta'sir qil</text>
  <text x="720" y="396" text-anchor="middle" font-size="13" font-weight="bold" fill="#6d28d9">Fokus: egalik</text>

  <text x="450" y="452" text-anchor="middle" font-size="13" fill="#64748b">Kamtarlik + qiziquvchanlik har bosqichda -- bu shablon, har joy har xil</text>
</svg>
