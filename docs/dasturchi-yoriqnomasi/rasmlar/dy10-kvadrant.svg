<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="Segoe UI">
  <title>Martin Fowler texnik qarz kvadranti: ataylab yoki tasodifiy va ehtiyotkor yoki beparvo</title>
  <rect x="0" y="0" width="860" height="520" fill="#f8fafc"/>

  <text x="430" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Fowler texnik qarz kvadranti</text>
  <text x="430" y="60" text-anchor="middle" font-size="14" fill="#64748b">Ataylab/tasodifiy x Ehtiyotkor/beparvo</text>

  <!-- axis labels -->
  <text x="270" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">Ataylab</text>
  <text x="600" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">Tasodifiy</text>
  <text x="58" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155" transform="rotate(-90 58 200)">Ehtiyotkor</text>
  <text x="58" y="390" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155" transform="rotate(-90 58 390)">Beparvo</text>

  <!-- top-left: deliberate + prudent (best) -->
  <rect x="100" y="110" width="330" height="180" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="265" y="142" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">Ataylab + Ehtiyotkor</text>
  <text x="265" y="172" text-anchor="middle" font-size="14" fill="#1e293b">"Tez chiqaramiz, keyin tuzatamiz"</text>
  <text x="265" y="196" text-anchor="middle" font-size="13" fill="#334155">Narxni bilamiz, ataylab olamiz</text>
  <text x="265" y="218" text-anchor="middle" font-size="13" fill="#334155">va ro'yxatga yozamiz.</text>
  <text x="265" y="252" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">Sog'lom strategiya</text>

  <!-- top-right: inadvertent + prudent -->
  <rect x="440" y="110" width="330" height="180" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="605" y="142" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">Tasodifiy + Ehtiyotkor</text>
  <text x="605" y="172" text-anchor="middle" font-size="14" fill="#1e293b">"Endi tushundik, yaxshiroq yo'l bor edi"</text>
  <text x="605" y="196" text-anchor="middle" font-size="13" fill="#334155">O'rganib, eski qarorni</text>
  <text x="605" y="218" text-anchor="middle" font-size="13" fill="#334155">qayta ko'rib chiqamiz.</text>
  <text x="605" y="252" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">Tabiiy, qabul qilsa bo'ladi</text>

  <!-- bottom-left: deliberate + reckless -->
  <rect x="100" y="300" width="330" height="180" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="265" y="332" text-anchor="middle" font-size="16" font-weight="bold" fill="#b45309">Ataylab + Beparvo</text>
  <text x="265" y="362" text-anchor="middle" font-size="14" fill="#1e293b">"Dizaynga vaqt yo'q, shoshamiz"</text>
  <text x="265" y="386" text-anchor="middle" font-size="13" fill="#334155">Narxni bilib turib,</text>
  <text x="265" y="408" text-anchor="middle" font-size="13" fill="#334155">e'tiborsiz qoldiramiz.</text>
  <text x="265" y="442" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">Xavfli odat</text>

  <!-- bottom-right: inadvertent + reckless (worst) -->
  <rect x="440" y="300" width="330" height="180" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="605" y="332" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">Tasodifiy + Beparvo</text>
  <text x="605" y="362" text-anchor="middle" font-size="14" fill="#1e293b">"Qatlam nima ekanini bilmaymiz"</text>
  <text x="605" y="386" text-anchor="middle" font-size="13" fill="#334155">Bilim yo'q, qarz</text>
  <text x="605" y="408" text-anchor="middle" font-size="13" fill="#334155">sezilmasdan to'planadi.</text>
  <text x="605" y="442" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">Eng yomon holat</text>
</svg>
