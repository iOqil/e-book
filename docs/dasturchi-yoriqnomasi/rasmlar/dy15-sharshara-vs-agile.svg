<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Segoe UI">
  <title>Sharshara: uzun bir martalik bosqichlar va oxirida yetkazish vs Agile: qisqa takrorlanuvchi iteratsiyalar, har birida ishlaydigan qiymat</title>
  <rect x="0" y="0" width="880" height="500" fill="#f8fafc"/>

  <text x="440" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Sharshara vs Agile: bir martalik yetkazish vs qisqa iteratsiyalar</text>
  <text x="440" y="60" text-anchor="middle" font-size="14" fill="#64748b">Qiymat oxirida bir marta yetadimi yoki har necha haftada bir bo'lakmi?</text>

  <!-- Waterfall row -->
  <text x="40" y="110" font-size="16" font-weight="bold" fill="#dc2626">Sharshara (waterfall)</text>

  <rect x="40" y="125" width="120" height="48" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="100" y="154" text-anchor="middle" font-size="13" fill="#991b1b">Talablar</text>
  <rect x="180" y="125" width="120" height="48" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="240" y="154" text-anchor="middle" font-size="13" fill="#991b1b">Dizayn</text>
  <rect x="320" y="125" width="160" height="48" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="400" y="154" text-anchor="middle" font-size="13" fill="#991b1b">Kodlash (uzun)</text>
  <rect x="500" y="125" width="120" height="48" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="560" y="154" text-anchor="middle" font-size="13" fill="#991b1b">Test</text>
  <rect x="640" y="125" width="160" height="48" rx="6" fill="#16a34a" stroke="#15803d" stroke-width="1.5"/>
  <text x="720" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Yetkazish</text>
  <text x="720" y="164" text-anchor="middle" font-size="13" fill="#ffffff">(oxirida)</text>

  <line x1="160" y1="149" x2="180" y2="149" stroke="#dc2626" stroke-width="2"/>
  <line x1="300" y1="149" x2="320" y2="149" stroke="#dc2626" stroke-width="2"/>
  <line x1="480" y1="149" x2="500" y2="149" stroke="#dc2626" stroke-width="2"/>
  <line x1="620" y1="149" x2="640" y2="149" stroke="#dc2626" stroke-width="2"/>

  <text x="40" y="200" font-size="13" fill="#991b1b">Qiymat 6-12 oydan keyin ko'rinadi · noaniqlik oxirigacha yashirin · keyin oqibati qaytarish qimmat</text>

  <line x1="40" y1="225" x2="840" y2="225" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Agile row -->
  <text x="40" y="270" font-size="16" font-weight="bold" fill="#2563eb">Agile (iterativ)</text>

  <!-- iteration blocks, each a mini cycle producing value -->
  <g>
    <rect x="40" y="290" width="150" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="115" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Iteratsiya 1</text>
    <text x="115" y="332" text-anchor="middle" font-size="13" fill="#334155">reja-yoz-test</text>
    <rect x="55" y="342" width="120" height="20" rx="4" fill="#16a34a"/>
    <text x="115" y="357" text-anchor="middle" font-size="13" fill="#ffffff">qiymat</text>
  </g>
  <g>
    <rect x="210" y="290" width="150" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="285" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Iteratsiya 2</text>
    <text x="285" y="332" text-anchor="middle" font-size="13" fill="#334155">reja-yoz-test</text>
    <rect x="225" y="342" width="120" height="20" rx="4" fill="#16a34a"/>
    <text x="285" y="357" text-anchor="middle" font-size="13" fill="#ffffff">qiymat</text>
  </g>
  <g>
    <rect x="380" y="290" width="150" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="455" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Iteratsiya 3</text>
    <text x="455" y="332" text-anchor="middle" font-size="13" fill="#334155">reja-yoz-test</text>
    <rect x="395" y="342" width="120" height="20" rx="4" fill="#16a34a"/>
    <text x="455" y="357" text-anchor="middle" font-size="13" fill="#ffffff">qiymat</text>
  </g>
  <g>
    <rect x="550" y="290" width="150" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="625" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Iteratsiya 4</text>
    <text x="625" y="332" text-anchor="middle" font-size="13" fill="#334155">reja-yoz-test</text>
    <rect x="565" y="342" width="120" height="20" rx="4" fill="#16a34a"/>
    <text x="625" y="357" text-anchor="middle" font-size="13" fill="#ffffff">qiymat</text>
  </g>

  <line x1="190" y1="330" x2="210" y2="330" stroke="#2563eb" stroke-width="2"/>
  <line x1="360" y1="330" x2="380" y2="330" stroke="#2563eb" stroke-width="2"/>
  <line x1="530" y1="330" x2="550" y2="330" stroke="#2563eb" stroke-width="2"/>
  <text x="730" y="335" font-size="20" fill="#2563eb">...</text>

  <text x="40" y="400" font-size="13" fill="#1e40af">Har 1-3 haftada ishlaydigan bo'lak yetadi · fikr erta keladi · yo'nalishni tez tuzatish mumkin</text>

  <rect x="40" y="420" width="800" height="56" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="60" y="444" font-size="14" font-weight="bold" fill="#b45309">Asosiy farq:</text>
  <text x="60" y="464" font-size="13" fill="#334155">Sharshara xatoni oxirida topadi (qimmat); Agile har iteratsiyada topadi (arzon). Bu jarayon emas — moslashuv mentaliteti.</text>
</svg>
