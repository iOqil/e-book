<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="Segoe UI">
  <title>Texnik qarz turlari: kod, dizayn arxitektura, test, hujjat, infratuzilma va bilim qarzi</title>
  <rect x="0" y="0" width="880" height="470" fill="#f8fafc"/>

  <text x="440" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Texnik qarz turlari</text>
  <text x="440" y="60" text-anchor="middle" font-size="14" fill="#64748b">Qarz faqat kodda emas: u har qatlamda to'planadi</text>

  <!-- kod -->
  <rect x="34" y="90" width="262" height="110" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="165" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">Kod qarzi</text>
  <text x="165" y="146" text-anchor="middle" font-size="13" fill="#334155">Tartibsiz, takror, hidli kod;</text>
  <text x="165" y="166" text-anchor="middle" font-size="13" fill="#334155">o'qish va o'zgartirish qiyin.</text>
  <text x="165" y="188" text-anchor="middle" font-size="13" fill="#64748b">misol: kopiya-pasta mantiq</text>

  <!-- dizayn -->
  <rect x="309" y="90" width="262" height="110" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="440" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#6d28d9">Dizayn / arxitektura</text>
  <text x="440" y="146" text-anchor="middle" font-size="13" fill="#334155">Noto'g'ri tuzilma, qattiq</text>
  <text x="440" y="166" text-anchor="middle" font-size="13" fill="#334155">bog'liqlik, eskirgan qaror.</text>
  <text x="440" y="188" text-anchor="middle" font-size="13" fill="#64748b">misol: hammasi bitta modul</text>

  <!-- test -->
  <rect x="584" y="90" width="262" height="110" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="715" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">Test qarzi</text>
  <text x="715" y="146" text-anchor="middle" font-size="13" fill="#334155">Test yo'q yoki kam; har</text>
  <text x="715" y="166" text-anchor="middle" font-size="13" fill="#334155">o'zgarish qo'rquv tug'diradi.</text>
  <text x="715" y="188" text-anchor="middle" font-size="13" fill="#64748b">misol: qo'lda tekshirish</text>

  <!-- hujjat -->
  <rect x="34" y="220" width="262" height="110" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="165" y="250" text-anchor="middle" font-size="16" font-weight="bold" fill="#b45309">Hujjat qarzi</text>
  <text x="165" y="276" text-anchor="middle" font-size="13" fill="#334155">Eskirgan yoki yo'q hujjat;</text>
  <text x="165" y="296" text-anchor="middle" font-size="13" fill="#334155">bilim faqat boshlarda.</text>
  <text x="165" y="318" text-anchor="middle" font-size="13" fill="#64748b">misol: README mos kelmaydi</text>

  <!-- infra -->
  <rect x="309" y="220" width="262" height="110" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <text x="440" y="250" text-anchor="middle" font-size="16" font-weight="bold" fill="#0e7490">Infratuzilma qarzi</text>
  <text x="440" y="276" text-anchor="middle" font-size="13" fill="#334155">Eskirgan kutubxona, qo'lda</text>
  <text x="440" y="296" text-anchor="middle" font-size="13" fill="#334155">deploy, CI/CD yo'qligi.</text>
  <text x="440" y="318" text-anchor="middle" font-size="13" fill="#64748b">misol: 3 yillik bog'liqlik</text>

  <!-- bilim -->
  <rect x="584" y="220" width="262" height="110" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="715" y="250" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">Bilim qarzi</text>
  <text x="715" y="276" text-anchor="middle" font-size="13" fill="#334155">Tizimni faqat bir kishi biladi;</text>
  <text x="715" y="296" text-anchor="middle" font-size="13" fill="#334155">u ketsa, qarz portlaydi.</text>
  <text x="715" y="318" text-anchor="middle" font-size="13" fill="#64748b">misol: avtobus omili = 1</text>

  <rect x="180" y="356" width="520" height="80" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="440" y="386" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">Hammasi bir narsaga olib keladi</text>
  <text x="440" y="412" text-anchor="middle" font-size="14" fill="#475569">har bir o'zgarish qimmatroq va sekinroq bo'ladi</text>
</svg>
