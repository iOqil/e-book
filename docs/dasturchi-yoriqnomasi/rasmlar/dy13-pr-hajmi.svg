<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Segoe UI">
  <title>Kichik PR tez va sifatli review oladi, ulkan PR esa yuzaki LGTM oladi — PR hajmi va review sifati taqqoslash</title>
  <rect x="0" y="0" width="880" height="500" fill="#f8fafc"/>

  <text x="440" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">PR hajmi review sifatini belgilaydi</text>
  <text x="440" y="62" text-anchor="middle" font-size="14" fill="#64748b">Kichik o'zgarish chuqur ko'riladi; ulkan o'zgarish ko'z chetidan o'tadi</text>

  <!-- SMALL PR -->
  <rect x="40" y="90" width="380" height="370" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="230" y="120" text-anchor="middle" font-size="17" font-weight="bold" fill="#166534">&#9989; Kichik PR (~50-200 qator)</text>

  <!-- small diff block -->
  <rect x="80" y="140" width="300" height="70" rx="8" fill="#ffffff" stroke="#86efac"/>
  <rect x="92" y="152" width="220" height="9" rx="3" fill="#bbf7d0"/>
  <rect x="92" y="168" width="180" height="9" rx="3" fill="#bbf7d0"/>
  <rect x="92" y="184" width="240" height="9" rx="3" fill="#bbf7d0"/>
  <text x="335" y="200" text-anchor="end" font-size="13" fill="#16a34a">3 fayl</text>

  <text x="80" y="250" font-size="14" fill="#1e293b">&#9989; Reviewer har qatorni o'qiydi</text>
  <text x="80" y="282" font-size="14" fill="#1e293b">&#9989; Aniq, mazmunli izohlar</text>
  <text x="80" y="314" font-size="14" fill="#1e293b">&#9989; 15-30 daqiqada ko'rib chiqiladi</text>
  <text x="80" y="346" font-size="14" fill="#1e293b">&#9989; Bug erta tutiladi</text>
  <text x="80" y="378" font-size="14" fill="#1e293b">&#9989; Tez merge, kam konflikt</text>

  <rect x="80" y="402" width="300" height="42" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="230" y="428" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">Chuqur, foydali review</text>

  <!-- HUGE PR -->
  <rect x="460" y="90" width="380" height="370" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="650" y="120" text-anchor="middle" font-size="17" font-weight="bold" fill="#991b1b">&#10060; Ulkan PR (2000+ qator)</text>

  <!-- big diff block -->
  <rect x="500" y="140" width="300" height="70" rx="8" fill="#ffffff" stroke="#fca5a5"/>
  <rect x="512" y="148" width="270" height="7" rx="2" fill="#fecaca"/>
  <rect x="512" y="160" width="240" height="7" rx="2" fill="#fecaca"/>
  <rect x="512" y="172" width="280" height="7" rx="2" fill="#fecaca"/>
  <rect x="512" y="184" width="220" height="7" rx="2" fill="#fecaca"/>
  <rect x="512" y="196" width="265" height="7" rx="2" fill="#fecaca"/>
  <text x="755" y="200" text-anchor="end" font-size="13" fill="#dc2626">47 fayl</text>

  <text x="500" y="250" font-size="14" fill="#1e293b">&#10060; Reviewer charchaydi, yuzaki o'qiydi</text>
  <text x="500" y="282" font-size="14" fill="#1e293b">&#10060; "LGTM" — chuqur tekshirmasdan</text>
  <text x="500" y="314" font-size="14" fill="#1e293b">&#10060; Kunlar kutadi, blok bo'ladi</text>
  <text x="500" y="346" font-size="14" fill="#1e293b">&#10060; Bug ko'z chetidan o'tadi</text>
  <text x="500" y="378" font-size="14" fill="#1e293b">&#10060; Katta konflikt, qiyin merge</text>

  <rect x="500" y="402" width="300" height="42" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="650" y="428" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">Yuzaki, foydasiz review</text>

  <!-- center arrow hint -->
  <text x="440" y="300" text-anchor="middle" font-size="13" fill="#64748b" transform="rotate(90 440 300)">hajm oshgani sari sifat tushadi</text>
</svg>
