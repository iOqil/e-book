<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="Segoe UI">
  <title>Nimani takrorlovchi izoh (yomon) va nega tushuntiruvchi izoh (yaxshi) yonma-yon</title>
  <rect x="0" y="0" width="880" height="480" fill="#f8fafc"/>

  <text x="440" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Izoh "nima"ni emas, "nega"ni aytsin</text>
  <text x="440" y="62" text-anchor="middle" font-size="14" fill="#64748b">Kod nima qilishini ko'rsatadi; izoh sababni qo'shadi</text>

  <!-- NIMA: yomon -->
  <rect x="40" y="92" width="380" height="350" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
  <text x="230" y="124" text-anchor="middle" font-size="18" font-weight="bold" fill="#dc2626">"Nima"ni takrorlovchi</text>

  <rect x="64" y="146" width="332" height="200" rx="8" fill="#fef2f2"/>
  <text x="80" y="176" font-size="14" fill="#334155" font-family="monospace">// soni 1 ga oshiramiz</text>
  <text x="80" y="202" font-size="14" fill="#334155" font-family="monospace">soni = soni + 1;</text>
  <text x="80" y="240" font-size="14" fill="#334155" font-family="monospace">// foydalanuvchini saqla</text>
  <text x="80" y="266" font-size="14" fill="#334155" font-family="monospace">saqla(foydalanuvchi);</text>
  <text x="80" y="304" font-size="14" fill="#334155" font-family="monospace">// narxni qaytar</text>
  <text x="80" y="330" font-size="14" fill="#334155" font-family="monospace">return narx;</text>

  <text x="230" y="378" text-anchor="middle" font-size="13" fill="#dc2626">Kodni o'qiy oladigan har kim</text>
  <text x="230" y="398" text-anchor="middle" font-size="13" fill="#dc2626">buni izohsiz ham biladi</text>
  <text x="230" y="424" text-anchor="middle" font-size="13" fill="#64748b">Shovqin: foydasiz, eskirib qoladi</text>

  <!-- NEGA: yaxshi -->
  <rect x="460" y="92" width="380" height="350" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="650" y="124" text-anchor="middle" font-size="18" font-weight="bold" fill="#16a34a">"Nega"ni tushuntiruvchi</text>

  <rect x="484" y="146" width="332" height="200" rx="8" fill="#f0fdf4"/>
  <text x="500" y="172" font-size="13" fill="#334155" font-family="monospace">// To'lov shlyuzi 1-dan</text>
  <text x="500" y="190" font-size="13" fill="#334155" font-family="monospace">// boshlaydi, biz 0-dan</text>
  <text x="500" y="208" font-size="13" fill="#334155" font-family="monospace">soni = soni + 1;</text>
  <text x="500" y="240" font-size="13" fill="#334155" font-family="monospace">// Tartib muhim: avval</text>
  <text x="500" y="258" font-size="13" fill="#334155" font-family="monospace">// saqla, keyin email (#412)</text>
  <text x="500" y="276" font-size="13" fill="#334155" font-family="monospace">saqla(foydalanuvchi);</text>
  <text x="500" y="308" font-size="13" fill="#334155" font-family="monospace">// Soliq formulasi: hujjat</text>
  <text x="500" y="326" font-size="13" fill="#334155" font-family="monospace">return narx;</text>

  <text x="650" y="378" text-anchor="middle" font-size="13" fill="#16a34a">Kodda ko'rinmaydigan sabab,</text>
  <text x="650" y="398" text-anchor="middle" font-size="13" fill="#16a34a">kontekst va qaror</text>
  <text x="650" y="424" text-anchor="middle" font-size="13" fill="#64748b">Qiymat: kelajakdagi o'zingizga yordam</text>

  <text x="440" y="262" text-anchor="middle" font-size="22" fill="#94a3b8">vs</text>
</svg>
