<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Segoe UI">
  <title>Karyera narvoni: junior, mid, senior darajalaridan keyin texnik (staff/principal) va boshqaruv (lead/menejer) ikki shoxga ajraladi</title>
  <rect x="0" y="0" width="900" height="540" fill="#f8fafc"/>

  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Karyera narvoni: bir poydevor, ikki shox</text>
  <text x="450" y="60" text-anchor="middle" font-size="14" fill="#64748b">Daraja = unvon emas, ta'sir doirasi va mustaqillik</text>

  <!-- shared trunk -->
  <rect x="330" y="430" width="240" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="455" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">Junior</text>
  <text x="450" y="476" text-anchor="middle" font-size="13" fill="#334155">vazifani bajaradi, ko'p yo'naltirish</text>

  <rect x="330" y="350" width="240" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="375" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">Mid</text>
  <text x="450" y="396" text-anchor="middle" font-size="13" fill="#334155">mustaqil feature olib boradi</text>

  <rect x="330" y="270" width="240" height="56" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="295" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">Senior</text>
  <text x="450" y="316" text-anchor="middle" font-size="13" fill="#334155">noaniqlikni hal qiladi, boshqalarni ko'taradi</text>

  <!-- connectors up -->
  <line x1="450" y1="430" x2="450" y2="406" stroke="#94a3b8" stroke-width="3"/>
  <line x1="450" y1="350" x2="450" y2="326" stroke="#94a3b8" stroke-width="3"/>

  <!-- fork lines -->
  <line x1="450" y1="270" x2="220" y2="200" stroke="#94a3b8" stroke-width="3"/>
  <line x1="450" y1="270" x2="680" y2="200" stroke="#94a3b8" stroke-width="3"/>
  <text x="450" y="246" text-anchor="middle" font-size="14" fill="#7c3aed" font-weight="bold">ikki yo'l ajraladi</text>

  <!-- IC branch -->
  <rect x="70" y="140" width="300" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="220" y="166" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">Staff / Principal (texnik yo'l)</text>
  <text x="220" y="187" text-anchor="middle" font-size="13" fill="#334155">tashkilot darajasida ta'sir, yo'nalish</text>

  <rect x="70" y="62" width="300" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="220" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">Distinguished / Fellow</text>
  <text x="220" y="107" text-anchor="middle" font-size="13" fill="#334155">kompaniya/sanoat ko'lamida ta'sir</text>
  <line x1="220" y1="140" x2="220" y2="118" stroke="#94a3b8" stroke-width="3"/>

  <!-- Manager branch -->
  <rect x="530" y="140" width="300" height="60" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="680" y="166" text-anchor="middle" font-size="16" font-weight="bold" fill="#6d28d9">Tech Lead / Menejer (boshqaruv)</text>
  <text x="680" y="187" text-anchor="middle" font-size="13" fill="#334155">odamlar, jamoa, etkazib berish</text>

  <rect x="530" y="62" width="300" height="56" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="680" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#6d28d9">Director / VP Engineering</text>
  <text x="680" y="107" text-anchor="middle" font-size="13" fill="#334155">bir necha jamoa, strategiya</text>
  <line x1="680" y1="140" x2="680" y2="118" stroke="#94a3b8" stroke-width="3"/>

  <text x="450" y="520" text-anchor="middle" font-size="13" fill="#64748b">Ikkala shox ham yuqoriga olib boradi — "senior = menejer" afsona</text>
</svg>
