<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" font-family="Segoe UI">
  <title>Sichqoncha oqimi sekin vs klaviatura yorliq oqimi tez taqqoslash</title>
  <rect x="0" y="0" width="840" height="460" fill="#f8fafc"/>
  <text x="420" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Klaviatura &gt; sichqoncha (tez-tez amallar uchun)</text>
  <text x="420" y="66" text-anchor="middle" font-size="15" fill="#64748b">bir xil natija, ikki yo'l — qo'l klaviaturada qolsin</text>

  <!-- Mouse flow (slow) -->
  <rect x="40" y="92" width="360" height="312" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="220" y="122" text-anchor="middle" font-size="17" font-weight="bold" fill="#dc2626">Sichqoncha oqimi</text>
  <text x="220" y="144" text-anchor="middle" font-size="14" fill="#64748b">"faylni topib ochish" — 5 qadam</text>

  <rect x="70" y="160" width="300" height="34" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="86" y="182" font-size="14" fill="#334155">1. qo'l klaviaturadan uziladi</text>
  <rect x="70" y="200" width="300" height="34" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="86" y="222" font-size="14" fill="#334155">2. sichqonchani qidirib topish</text>
  <rect x="70" y="240" width="300" height="34" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="86" y="262" font-size="14" fill="#334155">3. menyuga nishonlash</text>
  <rect x="70" y="280" width="300" height="34" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="86" y="302" font-size="14" fill="#334155">4. fayllar daraxtini ko'zdan kechirish</text>
  <rect x="70" y="320" width="300" height="34" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="86" y="342" font-size="14" fill="#334155">5. bosish + qo'lni qaytarish</text>
  <text x="220" y="384" text-anchor="middle" font-size="15" font-weight="bold" fill="#dc2626">~6 soniya · diqqat uziladi</text>

  <!-- Keyboard flow (fast) -->
  <rect x="440" y="92" width="360" height="312" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="122" text-anchor="middle" font-size="17" font-weight="bold" fill="#16a34a">Klaviatura yorliq oqimi</text>
  <text x="620" y="144" text-anchor="middle" font-size="14" fill="#64748b">"faylni topib ochish" — 1 qadam</text>

  <rect x="470" y="180" width="300" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="206" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Ctrl+P → nom yoz → Enter</text>
  <text x="620" y="228" text-anchor="middle" font-size="13" fill="#64748b">qo'l klaviaturada qoladi</text>

  <text x="620" y="276" text-anchor="middle" font-size="14" fill="#16a34a">+ muscle memory (o'ylamay bajariladi)</text>
  <text x="620" y="306" text-anchor="middle" font-size="14" fill="#16a34a">+ diqqat oqimi uzilmaydi</text>
  <text x="620" y="336" text-anchor="middle" font-size="14" fill="#16a34a">+ kuniga yuzlab takror tejaladi</text>
  <text x="620" y="384" text-anchor="middle" font-size="15" font-weight="bold" fill="#16a34a">~1 soniya · diqqat saqlanadi</text>

  <!-- arrow between -->
  <text x="420" y="248" text-anchor="middle" font-size="22" fill="#7c3aed">vs</text>

  <text x="420" y="436" text-anchor="middle" font-size="14" fill="#64748b">Kichik tejam × kunlik yuz takror = katta vaqt va saqlangan fokus.</text>
</svg>
