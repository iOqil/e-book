<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470">
  <title>Bir xil xabar uch auditoriyaga: jamoadosh, menejer va mijoz uchun tilni moslash</title>
  <rect width="860" height="470" fill="#f8fafc"/>
  <text x="430" y="38" font-family="Segoe UI" font-size="22" font-weight="700" fill="#1e293b" text-anchor="middle">Bir voqea, uch auditoriya</text>

  <!-- source event -->
  <rect x="290" y="62" width="280" height="56" rx="10" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text x="430" y="86" font-family="Segoe UI" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">Voqea: API integratsiya</text>
  <text x="430" y="106" font-family="Segoe UI" font-size="14" fill="#64748b" text-anchor="middle">kutilganidan 2 kun kechikdi</text>

  <line x1="160" y1="150" x2="430" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <line x1="430" y1="120" x2="430" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <line x1="700" y1="150" x2="430" y2="120" stroke="#94a3b8" stroke-width="2"/>

  <!-- teammate -->
  <rect x="30" y="155" width="250" height="285" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="30" y="155" width="250" height="44" rx="12" fill="#dbeafe"/>
  <text x="155" y="183" font-family="Segoe UI" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">Jamoadosh</text>
  <text x="50" y="226" font-family="Segoe UI" font-size="14" font-weight="700" fill="#334155">Til: texnik, to'liq</text>
  <text x="50" y="256" font-family="Segoe UI" font-size="13" fill="#334155">"API rate-limit'ga urildik,</text>
  <text x="50" y="276" font-family="Segoe UI" font-size="13" fill="#334155">retry+backoff qo'shdim.</text>
  <text x="50" y="296" font-family="Segoe UI" font-size="13" fill="#334155">Webhook handler'ni</text>
  <text x="50" y="316" font-family="Segoe UI" font-size="13" fill="#334155">refactor qilish kerak."</text>
  <text x="50" y="356" font-family="Segoe UI" font-size="14" font-weight="700" fill="#2563eb">Diqqat:</text>
  <text x="50" y="382" font-family="Segoe UI" font-size="13" fill="#64748b">jargon OK, detal kerak,</text>
  <text x="50" y="402" font-family="Segoe UI" font-size="13" fill="#64748b">birga yechish</text>

  <!-- manager -->
  <rect x="305" y="155" width="250" height="285" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="305" y="155" width="250" height="44" rx="12" fill="#dcfce7"/>
  <text x="430" y="183" font-family="Segoe UI" font-size="17" font-weight="700" fill="#16a34a" text-anchor="middle">Menejer</text>
  <text x="325" y="226" font-family="Segoe UI" font-size="14" font-weight="700" fill="#334155">Til: ta'sir + reja</text>
  <text x="325" y="256" font-family="Segoe UI" font-size="13" fill="#334155">"Integratsiya 2 kun</text>
  <text x="325" y="276" font-family="Segoe UI" font-size="13" fill="#334155">kechikadi. Sabab: tashqi</text>
  <text x="325" y="296" font-family="Segoe UI" font-size="13" fill="#334155">API limiti. Yangi sana:</text>
  <text x="325" y="316" font-family="Segoe UI" font-size="13" fill="#334155">payshanba. Risk yo'q."</text>
  <text x="325" y="356" font-family="Segoe UI" font-size="14" font-weight="700" fill="#16a34a">Diqqat:</text>
  <text x="325" y="382" font-family="Segoe UI" font-size="13" fill="#64748b">qisqa, sana, ta'sir,</text>
  <text x="325" y="402" font-family="Segoe UI" font-size="13" fill="#64748b">jargonsiz</text>

  <!-- client -->
  <rect x="580" y="155" width="250" height="285" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="580" y="155" width="250" height="44" rx="12" fill="#ede9fe"/>
  <text x="705" y="183" font-family="Segoe UI" font-size="17" font-weight="700" fill="#7c3aed" text-anchor="middle">Mijoz</text>
  <text x="600" y="226" font-family="Segoe UI" font-size="14" font-weight="700" fill="#334155">Til: qiymat + ishonch</text>
  <text x="600" y="256" font-family="Segoe UI" font-size="13" fill="#334155">"To'lov ulanishini</text>
  <text x="600" y="276" font-family="Segoe UI" font-size="13" fill="#334155">ishonchli qilish uchun</text>
  <text x="600" y="296" font-family="Segoe UI" font-size="13" fill="#334155">qo'shimcha tekshiruv</text>
  <text x="600" y="316" font-family="Segoe UI" font-size="13" fill="#334155">qo'shdik. Payshanba tayyor."</text>
  <text x="600" y="356" font-family="Segoe UI" font-size="14" font-weight="700" fill="#7c3aed">Diqqat:</text>
  <text x="600" y="382" font-family="Segoe UI" font-size="13" fill="#64748b">nega muhim, biznes tili,</text>
  <text x="600" y="402" font-family="Segoe UI" font-size="13" fill="#64748b">xotirjamlik</text>
</svg>
