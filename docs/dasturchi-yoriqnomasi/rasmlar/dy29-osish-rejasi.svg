<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" font-family="Segoe UI">
  <title>Shaxsiy o'sish sikli: baholash, maqsad qo'yish, o'rganish, amaliyot va choraklik qayta baholash</title>
  <rect x="0" y="0" width="820" height="540" fill="#f8fafc"/>

  <text x="410" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Shaxsiy o'sish sikli</text>
  <text x="410" y="62" text-anchor="middle" font-size="14" fill="#64748b">Har chorakda takrorlanadi -- o'sish chiziqli emas, sikldir</text>

  <!-- dashed circle backdrop -->
  <circle cx="410" cy="300" r="180" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Node 1: Baholash (top) -->
  <circle cx="410" cy="140" r="58" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="410" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">1. Baholash</text>
  <text x="410" y="154" text-anchor="middle" font-size="13" fill="#334155">kuchli/zaif</text>
  <text x="410" y="172" text-anchor="middle" font-size="13" fill="#334155">tomonlar</text>

  <!-- Node 2: Maqsad (right) -->
  <circle cx="565" cy="240" r="58" fill="#faf5ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="565" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#6d28d9">2. Maqsad</text>
  <text x="565" y="254" text-anchor="middle" font-size="13" fill="#334155">keyingi daraja</text>
  <text x="565" y="272" text-anchor="middle" font-size="13" fill="#334155">(23-bob)</text>

  <!-- Node 3: O'rganish (bottom-right) -->
  <circle cx="510" cy="430" r="58" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/>
  <text x="510" y="422" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">3. O'rganish</text>
  <text x="510" y="444" text-anchor="middle" font-size="13" fill="#334155">reja (22-bob)</text>

  <!-- Node 4: Amaliyot (bottom-left) -->
  <circle cx="310" cy="430" r="58" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <text x="310" y="422" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">4. Amaliyot</text>
  <text x="310" y="444" text-anchor="middle" font-size="13" fill="#334155">real ish bilan</text>

  <!-- Node 5: Qayta baholash (left) -->
  <circle cx="255" cy="240" r="58" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="255" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">5. Qayta</text>
  <text x="255" y="244" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">baholash</text>
  <text x="255" y="266" text-anchor="middle" font-size="13" fill="#334155">choraklik</text>

  <!-- arrows around the cycle -->
  <path d="M 462 168 A 180 180 0 0 1 533 192" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M 588 295 A 180 180 0 0 1 545 380" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M 452 458 A 180 180 0 0 1 368 458" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M 275 380 A 180 180 0 0 1 232 295" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M 287 192 A 180 180 0 0 1 358 168" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#ar)"/>

  <text x="410" y="296" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Uzluksiz</text>
  <text x="410" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">o'sish</text>

  <text x="410" y="520" text-anchor="middle" font-size="13" fill="#64748b">Tarmoq va ko'rinish (24-bob) hamda barqarorlik (28-bob) butun sikl davomida</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
