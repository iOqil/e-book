<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Segoe UI">
  <title>Mentor va mentee munosabati: yo'naltiruvchi savol beradigan yaxshi mentor va tayyor javob beradigan yomon mentor taqqoslashi</title>
  <rect x="0" y="0" width="880" height="500" fill="#f8fafc"/>

  <text x="440" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Mentor &#8596; Mentee: javob berish emas, o'ylashga yo'naltirish</text>
  <text x="440" y="62" text-anchor="middle" font-size="14" fill="#64748b">Yaxshi mentor balig'ni emas, qarmoq tutishni beradi</text>

  <!-- figures -->
  <circle cx="170" cy="150" r="34" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="156" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">Mentor</text>
  <circle cx="710" cy="150" r="34" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="710" y="156" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">Mentee</text>

  <!-- good: question arrow -->
  <line x1="206" y1="138" x2="674" y2="138" stroke="#16a34a" stroke-width="3"/>
  <polygon points="674,138 662,132 662,144" fill="#16a34a"/>
  <text x="440" y="128" text-anchor="middle" font-size="14" fill="#166534">"Sen bo'lsang qanday tekshirardin? Qaysi variantni sinab ko'rding?"</text>

  <!-- mentee thinks back -->
  <line x1="674" y1="178" x2="206" y2="178" stroke="#7c3aed" stroke-width="3" stroke-dasharray="6 4"/>
  <polygon points="206,178 218,172 218,184" fill="#7c3aed"/>
  <text x="440" y="200" text-anchor="middle" font-size="14" fill="#6d28d9">mentee o'zi o'ylaydi &#8594; ko'nikma o'sadi</text>

  <!-- GOOD mentor box -->
  <rect x="40" y="240" width="380" height="230" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="230" y="272" text-anchor="middle" font-size="17" font-weight="bold" fill="#166534">&#9989; Yo'naltiruvchi mentor</text>
  <text x="60" y="304" font-size="14" fill="#1e293b">&#8226; Tayyor javob o'rniga savol beradi</text>
  <text x="60" y="332" font-size="14" fill="#1e293b">&#8226; Xavfsiz makon: "bilmaslik" normal</text>
  <text x="60" y="360" font-size="14" fill="#1e293b">&#8226; O'z xatolarini ham aytadi</text>
  <text x="60" y="388" font-size="14" fill="#1e293b">&#8226; Misol bo'ladi, qo'lidan tutmaydi</text>
  <text x="60" y="416" font-size="14" fill="#1e293b">&#8226; Mentee mustaqil bo'lishiga ishlaydi</text>
  <text x="230" y="452" text-anchor="middle" font-size="13" fill="#166534">Natija: mustaqil, ishonchli muhandis</text>

  <!-- BAD mentor box -->
  <rect x="460" y="240" width="380" height="230" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="650" y="272" text-anchor="middle" font-size="17" font-weight="bold" fill="#991b1b">&#10060; "Hammasini hal qilib beruvchi"</text>
  <text x="480" y="304" font-size="14" fill="#1e293b">&#8226; Darrov tayyor yechim beradi</text>
  <text x="480" y="332" font-size="14" fill="#1e293b">&#8226; Mentee'ni o'ylashga qo'ymaydi</text>
  <text x="480" y="360" font-size="14" fill="#1e293b">&#8226; "Men bilaman, sen kuzat" ohangi</text>
  <text x="480" y="388" font-size="14" fill="#1e293b">&#8226; Savolni "ahmoqona" deb baholaydi</text>
  <text x="480" y="416" font-size="14" fill="#1e293b">&#8226; Mentee unga qaram bo'lib qoladi</text>
  <text x="650" y="452" text-anchor="middle" font-size="13" fill="#991b1b">Natija: qaram, qo'rqoq dasturchi</text>
</svg>
