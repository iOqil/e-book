<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="Segoe UI">
  <title>Test piramidasi: ko'p unit, o'rta integratsiya, kam e2e va teskari muzqaymoq konusi antipatterni</title>
  <rect x="0" y="0" width="880" height="540" fill="#f8fafc"/>

  <text x="440" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Test piramidasi va uning teskarisi</text>
  <text x="440" y="62" text-anchor="middle" font-size="14" fill="#64748b">Pastdan yuqoriga: tezroq va arzon -- sekinroq va qimmat</text>

  <!-- LEFT: healthy pyramid -->
  <text x="220" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#16a34a">Sog'lom piramida</text>

  <!-- e2e top -->
  <polygon points="220,118 280,178 160,178" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="220" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">E2E</text>
  <!-- integration middle -->
  <polygon points="160,182 280,182 330,272 110,272" fill="#fff7ed" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="220" y="234" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">Integratsiya</text>
  <!-- unit base -->
  <polygon points="110,276 330,276 390,376 50,376" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="220" y="334" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">Unit (ko'p)</text>

  <text x="220" y="412" text-anchor="middle" font-size="13" fill="#334155">Ko'p tez unit -- mustahkam poydevor</text>
  <text x="220" y="434" text-anchor="middle" font-size="13" fill="#334155">Kam sekin e2e -- faqat muhim oqimlar</text>
  <text x="220" y="462" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">Tez, barqaror, ishonchli</text>

  <!-- arrow speed/cost on far left -->
  <line x1="30" y1="376" x2="30" y2="118" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <text x="22" y="250" text-anchor="middle" font-size="13" fill="#64748b" transform="rotate(-90 22 250)">sekinroq, qimmatroq, mo'rtroq</text>

  <!-- RIGHT: inverted ice-cream cone (antipattern) -->
  <text x="650" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#dc2626">Teskari: muzqaymoq konusi</text>

  <!-- e2e wide top -->
  <polygon points="540,118 760,118 700,208 600,208" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="650" y="170" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">E2E (ko'p)</text>
  <!-- integration -->
  <polygon points="600,212 700,212 680,272 620,272" fill="#fff7ed" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="650" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">Integ.</text>
  <!-- unit small bottom cone -->
  <polygon points="620,276 680,276 650,346" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="650" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">Unit</text>

  <text x="650" y="412" text-anchor="middle" font-size="13" fill="#334155">Ko'p sekin e2e -- mo'rt va sekin to'plam</text>
  <text x="650" y="434" text-anchor="middle" font-size="13" fill="#334155">Kam unit -- xato qayerda ekani noaniq</text>
  <text x="650" y="462" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">Sekin, mo'rt, ishonchsiz</text>

  <text x="440" y="510" text-anchor="middle" font-size="14" fill="#64748b">Maqsad -- chap tomon: izolatsiya qilingan ko'p unit, ehtiyotkorlik bilan tanlangan kam e2e</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
