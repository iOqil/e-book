<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="Segoe UI">
  <title>Temir uchburchak: kolam, vaqt va resurs uchburchagi, sifat markazda</title>
  <rect x="0" y="0" width="820" height="520" fill="#f8fafc"/>

  <text x="410" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Temir uchburchak</text>
  <text x="410" y="60" text-anchor="middle" font-size="14" fill="#64748b">Ko'lam, vaqt va resursni birdan belgilab bo'lmaydi; sifat markazda</text>

  <!-- triangle -->
  <polygon points="410,100 700,440 120,440" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>

  <!-- vertices -->
  <circle cx="410" cy="100" r="6" fill="#2563eb"/>
  <circle cx="700" cy="440" r="6" fill="#16a34a"/>
  <circle cx="120" cy="440" r="6" fill="#f59e0b"/>

  <!-- vertex labels -->
  <rect x="330" y="64" width="160" height="34" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="410" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">Ko'lam (nima)</text>

  <rect x="620" y="448" width="160" height="34" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="700" y="470" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">Vaqt (qachon)</text>

  <rect x="40" y="448" width="180" height="34" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="130" y="470" text-anchor="middle" font-size="16" font-weight="bold" fill="#b45309">Resurs (kim/byudjet)</text>

  <!-- center: quality -->
  <circle cx="410" cy="330" r="58" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="410" y="326" text-anchor="middle" font-size="16" font-weight="bold" fill="#6d28d9">Sifat</text>
  <text x="410" y="346" text-anchor="middle" font-size="13" fill="#7c3aed">markazda</text>

  <!-- explanation -->
  <text x="410" y="500" text-anchor="middle" font-size="13" fill="#64748b">Bir uchni o'zgartirsangiz, boshqasi siljishi shart: "uchtasini birdan" mumkin emas</text>
</svg>
