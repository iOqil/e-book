<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="Segoe UI">
  <title>Ta'sir doirasining kengayishi: o'zim, vazifa, jamoa va tashkilot konsentrik doiralari junior'dan staff'gacha kengayadi</title>
  <rect x="0" y="0" width="880" height="540" fill="#f8fafc"/>

  <text x="440" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Ta'sir doirasining kengayishi</text>
  <text x="440" y="60" text-anchor="middle" font-size="14" fill="#64748b">Daraja oshgani sayin ta'sir doirasi kengayadi — kod ko'lami emas</text>

  <!-- concentric circles -->
  <circle cx="350" cy="320" r="190" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="350" cy="320" r="140" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="350" cy="320" r="90" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="350" cy="320" r="42" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>

  <text x="350" y="316" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">O'zim</text>
  <text x="350" y="335" text-anchor="middle" font-size="13" fill="#1e3a8a">junior</text>

  <text x="350" y="218" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">Vazifa</text>
  <text x="350" y="430" text-anchor="middle" font-size="13" fill="#1e40af">mid: mustaqil feature</text>

  <text x="350" y="168" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">Jamoa</text>
  <text x="350" y="478" text-anchor="middle" font-size="13" fill="#1e40af">senior: jamoani ko'taradi</text>

  <text x="350" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Tashkilot</text>

  <!-- right legend -->
  <text x="615" y="150" font-size="16" font-weight="bold" fill="#1e293b">Daraja &#8594; ta'sir</text>

  <circle cx="630" cy="190" r="9" fill="#93c5fd" stroke="#1e40af"/>
  <text x="650" y="195" font-size="14" fill="#334155">O'zim — o'z vazifam, o'z kodim</text>

  <circle cx="630" cy="232" r="9" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="650" y="237" font-size="14" fill="#334155">Vazifa — feature, modul oxirigacha</text>

  <circle cx="630" cy="274" r="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="650" y="279" font-size="14" fill="#334155">Jamoa — boshqalarni samaraliroq qiladi</text>

  <circle cx="630" cy="316" r="9" fill="#eff6ff" stroke="#2563eb"/>
  <text x="650" y="321" font-size="14" fill="#334155">Tashkilot — yo'nalish, standart, ta'sir</text>

  <text x="615" y="380" font-size="14" fill="#7c3aed" font-weight="bold">Savol: ta'siringiz</text>
  <text x="615" y="402" font-size="14" fill="#7c3aed" font-weight="bold">qaysi doiraga yetdi?</text>
  <text x="615" y="430" font-size="13" fill="#64748b">Promotion ko'pincha siz</text>
  <text x="615" y="450" font-size="13" fill="#64748b">keyingi doirada ishlay</text>
  <text x="615" y="470" font-size="13" fill="#64748b">boshlaganingizda keladi</text>
</svg>
