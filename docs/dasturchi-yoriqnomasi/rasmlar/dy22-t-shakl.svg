<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Segoe UI">
  <title>T-shaklli mutaxassis: ko'p sohada keng asos va bitta sohada chuqur ustun</title>
  <rect x="0" y="0" width="880" height="500" fill="#f8fafc"/>

  <text x="440" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">T-shaklli mutaxassis</text>
  <text x="440" y="62" text-anchor="middle" font-size="14" fill="#64748b">Keng asos (ko'p soha) + bitta chuqur ustun (bir soha)</text>

  <!-- horizontal bar: breadth -->
  <rect x="120" y="110" width="640" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="142" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">KENGLIK &#8594; ko'p sohadan umumiy tushuncha</text>
  <text x="440" y="166" text-anchor="middle" font-size="13" fill="#1e3a8a">tarmoq &#183; DB &#183; frontend &#183; DevOps &#183; xavfsizlik &#183; UX &#183; mahsulot</text>

  <!-- breadth arrows -->
  <line x1="120" y1="95" x2="760" y2="95" stroke="#2563eb" stroke-width="2"/>
  <polygon points="120,95 134,89 134,101" fill="#2563eb"/>
  <polygon points="760,95 746,89 746,101" fill="#2563eb"/>

  <!-- vertical bar: depth -->
  <rect x="400" y="180" width="80" height="270" rx="8" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="440" y="320" text-anchor="middle" font-size="16" font-weight="bold" fill="#5b21b6" transform="rotate(90 440 320)">CHUQURLIK &#8594; bitta sohada ekspert</text>

  <!-- depth arrow -->
  <line x1="385" y1="190" x2="385" y2="440" stroke="#7c3aed" stroke-width="2"/>
  <polygon points="385,440 379,426 391,426" fill="#7c3aed"/>

  <!-- side annotations -->
  <rect x="40" y="220" width="300" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="190" y="248" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">Kenglik nega kerak</text>
  <text x="58" y="276" font-size="13" fill="#1e293b">&#8226; Boshqalar bilan til topish</text>
  <text x="58" y="300" font-size="13" fill="#1e293b">&#8226; Tizimni butun ko'rish</text>
  <text x="58" y="324" font-size="13" fill="#1e293b">&#8226; Yangi sohaga tez ko'chish</text>

  <rect x="540" y="220" width="300" height="120" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="690" y="248" text-anchor="middle" font-size="15" font-weight="bold" fill="#5b21b6">Chuqurlik nega kerak</text>
  <text x="558" y="276" font-size="13" fill="#1e293b">&#8226; Qiyin muammoni hal qilish</text>
  <text x="558" y="300" font-size="13" fill="#1e293b">&#8226; Ishonchli ekspert ovozi</text>
  <text x="558" y="324" font-size="13" fill="#1e293b">&#8226; Bozorda ajralib turish</text>

  <text x="440" y="478" text-anchor="middle" font-size="14" fill="#475569">Faqat keng = sayoz (&#8212;shakl) &#183; Faqat chuqur = tor (I-shakl) &#183; T = muvozanat</text>
</svg>
