<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI">
  <title>Burnout uch o'lchami: charchoq, sinizm va samarasizlik hissi, hamda har birining belgilar kartasi</title>
  <rect x="0" y="0" width="900" height="520" fill="#f8fafc"/>

  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Burnout (charchash) — uch o'lcham</text>
  <text x="450" y="60" text-anchor="middle" font-size="14" fill="#64748b">Bu shunchaki "charchadim" emas: uchala o'lcham birga keladi</text>

  <!-- column 1: exhaustion -->
  <rect x="40" y="92" width="260" height="380" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="170" y="128" text-anchor="middle" font-size="18" font-weight="bold" fill="#b91c1c">1. Charchoq</text>
  <text x="170" y="150" text-anchor="middle" font-size="13" fill="#64748b">(emotional + jismoniy)</text>
  <line x1="64" y1="166" x2="276" y2="166" stroke="#fecaca" stroke-width="2"/>
  <text x="60" y="196" font-size="14" fill="#334155">&#8226; doimiy holsizlik</text>
  <text x="60" y="226" font-size="14" fill="#334155">&#8226; uyqu yetmaydi</text>
  <text x="60" y="256" font-size="14" fill="#334155">&#8226; ertalab "yana-mi"</text>
  <text x="60" y="286" font-size="14" fill="#334155">&#8226; bosh og'rig'i, taranglik</text>
  <text x="60" y="316" font-size="14" fill="#334155">&#8226; dam olish tiklamaydi</text>
  <text x="60" y="346" font-size="14" fill="#334155">&#8226; arzimas ish ham og'ir</text>

  <!-- column 2: cynicism -->
  <rect x="320" y="92" width="260" height="380" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="128" text-anchor="middle" font-size="18" font-weight="bold" fill="#b45309">2. Sinizm</text>
  <text x="450" y="150" text-anchor="middle" font-size="13" fill="#64748b">(uzoqlashish, befarqlik)</text>
  <line x1="344" y1="166" x2="556" y2="166" stroke="#fde68a" stroke-width="2"/>
  <text x="340" y="196" font-size="14" fill="#334155">&#8226; "menga baribir"</text>
  <text x="340" y="226" font-size="14" fill="#334155">&#8226; asabiylik, jahl</text>
  <text x="340" y="256" font-size="14" fill="#334155">&#8226; jamoadan uzoqlashish</text>
  <text x="340" y="286" font-size="14" fill="#334155">&#8226; mijoz/kodga nafrat</text>
  <text x="340" y="316" font-size="14" fill="#334155">&#8226; qiziqish yo'qoladi</text>
  <text x="340" y="346" font-size="14" fill="#334155">&#8226; har narsa bema'ni</text>

  <!-- column 3: inefficacy -->
  <rect x="600" y="92" width="260" height="380" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="730" y="128" text-anchor="middle" font-size="18" font-weight="bold" fill="#6d28d9">3. Samarasizlik</text>
  <text x="730" y="150" text-anchor="middle" font-size="13" fill="#64748b">(yetarli emasman hissi)</text>
  <line x1="624" y1="166" x2="836" y2="166" stroke="#e9d5ff" stroke-width="2"/>
  <text x="620" y="196" font-size="14" fill="#334155">&#8226; "hech nima ulgurmayman"</text>
  <text x="620" y="226" font-size="14" fill="#334155">&#8226; ishonchsizlik oshadi</text>
  <text x="620" y="256" font-size="14" fill="#334155">&#8226; diqqat to'planmaydi</text>
  <text x="620" y="286" font-size="14" fill="#334155">&#8226; oddiy vazifa qiyinlashadi</text>
  <text x="620" y="316" font-size="14" fill="#334155">&#8226; yutuq sezilmaydi</text>
  <text x="620" y="346" font-size="14" fill="#334155">&#8226; "men yaroqsizman"</text>

  <text x="450" y="440" text-anchor="middle" font-size="14" fill="#dc2626" font-weight="bold">Uchchovi birga, haftalar davom etsa &#8594; bu dam emas, burnout</text>
  <text x="450" y="463" text-anchor="middle" font-size="13" fill="#64748b">Erta belgi: dam olish kuni ham tiklamasa, yordam so'rash vaqti keldi</text>
</svg>
