<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="Segoe UI">
  <title>TDD sikli: qizil (yiqiladigan test yoz), yashil (o'tkazadigan minimal kod), refactor (toza qil)</title>
  <rect x="0" y="0" width="820" height="520" fill="#f8fafc"/>

  <text x="410" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">TDD sikli: Qizil -- Yashil -- Refactor</text>
  <text x="410" y="62" text-anchor="middle" font-size="14" fill="#64748b">Avval test, keyin kod, oxirida tozalash -- va qaytadan</text>

  <!-- circular arrows backdrop -->
  <circle cx="410" cy="290" r="160" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- RED node (top) -->
  <circle cx="410" cy="150" r="62" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="410" y="142" text-anchor="middle" font-size="17" font-weight="bold" fill="#991b1b">1. Qizil</text>
  <text x="410" y="166" text-anchor="middle" font-size="13" fill="#334155">Yiqiladigan</text>
  <text x="410" y="184" text-anchor="middle" font-size="13" fill="#334155">test yoz</text>

  <!-- GREEN node (bottom-right) -->
  <circle cx="600" cy="380" r="62" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <text x="600" y="372" text-anchor="middle" font-size="17" font-weight="bold" fill="#166534">2. Yashil</text>
  <text x="600" y="396" text-anchor="middle" font-size="13" fill="#334155">O'tkazadigan</text>
  <text x="600" y="414" text-anchor="middle" font-size="13" fill="#334155">minimal kod</text>

  <!-- REFACTOR node (bottom-left) -->
  <circle cx="220" cy="380" r="62" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="220" y="372" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">3. Refactor</text>
  <text x="220" y="396" text-anchor="middle" font-size="13" fill="#334155">Toza qil,</text>
  <text x="220" y="414" text-anchor="middle" font-size="13" fill="#334155">test yashil qolsin</text>

  <!-- arrows along the circle -->
  <path d="M 462 188 A 160 160 0 0 1 553 333" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a2)"/>
  <path d="M 538 380 A 160 160 0 0 1 282 380" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a2)"/>
  <path d="M 267 333 A 160 160 0 0 1 358 188" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a2)"/>

  <text x="410" y="296" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Kichik qadamlar,</text>
  <text x="410" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">tez sikl</text>

  <text x="410" y="492" text-anchor="middle" font-size="13" fill="#64748b">Test avval yiqilishi shart -- shunda u nimanidir tekshirayotganiga ishonasiz</text>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
