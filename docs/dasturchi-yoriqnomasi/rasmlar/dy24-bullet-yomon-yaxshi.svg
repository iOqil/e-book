<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Segoe UI">
  <title>Rezyume bullet juftligi: yomon "PHP bilan ishladim" vs yaxshi "X ni qilib, Y natijaga erishdim (Z%)" — fe'l, natija va raqam bilan</title>
  <rect x="0" y="0" width="900" height="480" fill="#f8fafc"/>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Rezyume bullet: vazifa emas — ta'sir</text>
  <text x="450" y="62" text-anchor="middle" font-size="14" fill="#64748b">Bir xil ish, ikki xil yozilishi — biri intervyuga olib boradi</text>

  <!-- Bad -->
  <rect x="40" y="86" width="820" height="150" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="64" y="118" font-size="18" font-weight="bold" fill="#b91c1c">x  Yomon — nima qilganingiz noaniq</text>
  <rect x="64" y="134" width="772" height="44" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="80" y="162" font-size="16" fill="#7f1d1d">"PHP bilan ishladim. Backend qildim. Bug'larni tuzatdim."</text>
  <text x="64" y="204" font-size="13" fill="#dc2626">Muammo: fe'l kuchsiz · natija yo'q · raqam yo'q · har kim shunday yozadi · qiymat ko'rinmaydi</text>

  <!-- arrow -->
  <line x1="450" y1="240" x2="450" y2="272" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="450,278 444,266 456,266" fill="#94a3b8"/>
  <text x="470" y="264" font-size="14" font-weight="bold" fill="#16a34a">fe'l + natija + raqam</text>

  <!-- Good -->
  <rect x="40" y="288" width="820" height="160" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="64" y="320" font-size="18" font-weight="bold" fill="#166534">v  Yaxshi — ta'sir o'lchanadi</text>
  <rect x="64" y="336" width="772" height="44" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="80" y="364" font-size="16" fill="#14532d">"To'lov API'sini qayta yozib, javob vaqtini 2.1s dan 0.4s ga (80%) tushirdim."</text>

  <text x="64" y="406" font-size="14" fill="#166534">v  Fe'l: "qayta yozib... tushirdim"</text>
  <text x="320" y="406" font-size="14" fill="#166534">v  Natija: javob tezlashdi</text>
  <text x="600" y="406" font-size="14" fill="#166534">v  Raqam: 80% (2.1s -&gt; 0.4s)</text>
  <text x="64" y="432" font-size="13" fill="#64748b">Raqam yo'q bo'lsa ham bo'ladi — lekin natija/ta'sirni har doim ko'rsating ("nimani yaxshiladingiz").</text>
</svg>
