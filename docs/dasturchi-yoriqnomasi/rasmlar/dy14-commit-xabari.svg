<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="Segoe UI">
  <title>Yaxshi commit xabari anatomiyasi: imperativ sarlavha, bosh qator, nega tanasi, yomoni faqat fix</title>
  <rect x="0" y="0" width="860" height="480" fill="#f8fafc"/>

  <text x="430" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Yaxshi commit xabari anatomiyasi</text>

  <!-- GOOD message box -->
  <rect x="40" y="66" width="500" height="360" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>

  <!-- title line -->
  <rect x="70" y="92" width="440" height="44" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="86" y="120" font-size="15" font-weight="bold" fill="#1e293b">Savatda yetkazish narxini hisobga ol</text>

  <!-- blank line -->
  <rect x="70" y="146" width="440" height="30" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="290" y="166" text-anchor="middle" font-size="13" fill="#16a34a">(bo'sh qator)</text>

  <!-- body -->
  <rect x="70" y="186" width="440" height="222" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="86" y="214" font-size="14" fill="#334155">Mijozlar yetkazish narxini yakuniy</text>
  <text x="86" y="238" font-size="14" fill="#334155">summada ko'rmay qolayotgani haqida</text>
  <text x="86" y="262" font-size="14" fill="#334155">shikoyat qildi (#318). Avval narx</text>
  <text x="86" y="286" font-size="14" fill="#334155">faqat checkout'da qo'shilardi; endi</text>
  <text x="86" y="310" font-size="14" fill="#334155">savat sahifasida ham ko'rinadi.</text>
  <text x="86" y="346" font-size="14" fill="#334155">Koeffitsient (1.2) hozircha qattiq</text>
  <text x="86" y="370" font-size="14" fill="#334155">kodlangan (TECH-DEBT #322).</text>

  <!-- annotations -->
  <text x="580" y="120" font-size="14" font-weight="bold" fill="#166534">Sarlavha</text>
  <text x="580" y="140" font-size="13" fill="#64748b">imperativ, ~50 belgi</text>

  <text x="580" y="166" font-size="14" font-weight="bold" fill="#166534">Bo'sh qator</text>
  <text x="580" y="186" font-size="13" fill="#64748b">sarlavha/tana ajratuvchi</text>

  <text x="580" y="240" font-size="14" font-weight="bold" fill="#166534">Tana</text>
  <text x="580" y="262" font-size="13" fill="#64748b">NEGA, nima emas;</text>
  <text x="580" y="282" font-size="13" fill="#64748b">tiketga bog'lab</text>
  <text x="580" y="302" font-size="13" fill="#64748b">kontekst saqlanadi.</text>

  <!-- BAD message -->
  <rect x="580" y="340" width="240" height="66" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="700" y="368" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">"fix"</text>
  <text x="700" y="392" text-anchor="middle" font-size="13" fill="#dc2626">nima ham, nega ham yo'q</text>

  <text x="290" y="448" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">Yaxshi: olti oydan keyin ham tushunarli</text>
</svg>
