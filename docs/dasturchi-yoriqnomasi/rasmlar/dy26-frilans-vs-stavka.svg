<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI">
  <title>Frilans va to'liq stavka ishni taqqoslash: frilans erkinlik beradi lekin nostabil va ko'p rolni talab qiladi, stavka ish barqaror lekin kamroq erkin</title>
  <rect x="0" y="0" width="900" height="520" fill="#f8fafc"/>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Frilans vs to'liq stavka ish</text>
  <text x="450" y="62" text-anchor="middle" font-size="14" fill="#64748b">Bir yo'l yaxshi emas — boshqasi yomon emas; har biri o'z narxi bilan keladi</text>

  <!-- Freelance column -->
  <rect x="50" y="90" width="380" height="400" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="240" y="124" text-anchor="middle" font-size="19" font-weight="bold" fill="#6d28d9">Frilanser</text>
  <text x="240" y="146" text-anchor="middle" font-size="13" fill="#64748b">o'zi xo'jayin = o'zi tadbirkor</text>

  <text x="74" y="184" font-size="14" font-weight="bold" fill="#16a34a">+ Yutuq</text>
  <text x="74" y="208" font-size="13" fill="#334155">Erkinlik: vaqt, joy, mijoz tanlash</text>
  <text x="74" y="230" font-size="13" fill="#334155">Yuqori soatbay potensial</text>
  <text x="74" y="252" font-size="13" fill="#334155">Xilma-xil loyiha, tez o'sish</text>
  <text x="74" y="274" font-size="13" fill="#334155">Global bozorga to'g'ridan kirish</text>

  <text x="74" y="312" font-size="14" font-weight="bold" fill="#dc2626">- Narx</text>
  <text x="74" y="336" font-size="13" fill="#334155">Nostabil daromad (oy bo'sh ham bo'ladi)</text>
  <text x="74" y="358" font-size="13" fill="#334155">Ko'p rol: savdo, hisob, soliq, mijoz</text>
  <text x="74" y="380" font-size="13" fill="#334155">Sug'urta/ta'til/nafaqa o'zingdan</text>
  <text x="74" y="402" font-size="13" fill="#334155">Yolg'izlik, doimiy mijoz qidirish</text>

  <rect x="74" y="426" width="332" height="48" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="240" y="446" text-anchor="middle" font-size="13" font-weight="bold" fill="#6d28d9">Mohiyat: erkinlik uchun</text>
  <text x="240" y="465" text-anchor="middle" font-size="13" fill="#334155">barqarorlik bilan to'laysiz</text>

  <!-- Salary column -->
  <rect x="470" y="90" width="380" height="400" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="660" y="124" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e40af">To'liq stavka (ish beruvchi)</text>
  <text x="660" y="146" text-anchor="middle" font-size="13" fill="#64748b">bitta kompaniya, oylik maosh</text>

  <text x="494" y="184" font-size="14" font-weight="bold" fill="#16a34a">+ Yutuq</text>
  <text x="494" y="208" font-size="13" fill="#334155">Barqaror, oldindan ma'lum daromad</text>
  <text x="494" y="230" font-size="13" fill="#334155">Ta'til, sug'urta, ijtimoiy paket</text>
  <text x="494" y="252" font-size="13" fill="#334155">Faqat kodga fokus (savdo emas)</text>
  <text x="494" y="274" font-size="13" fill="#334155">Jamoa, mentor, tayyor jarayon</text>

  <text x="494" y="312" font-size="14" font-weight="bold" fill="#dc2626">- Narx</text>
  <text x="494" y="336" font-size="13" fill="#334155">Kamroq erkinlik (vaqt, loyiha)</text>
  <text x="494" y="358" font-size="13" fill="#334155">Daromad chegarasi sekin oshadi</text>
  <text x="494" y="380" font-size="13" fill="#334155">Ofis siyosati, boshqaruvga bog'liq</text>
  <text x="494" y="402" font-size="13" fill="#334155">Bitta ish beruvchiga qaramlik</text>

  <rect x="494" y="426" width="332" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="660" y="446" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Mohiyat: barqarorlik uchun</text>
  <text x="660" y="465" text-anchor="middle" font-size="13" fill="#334155">bir oz erkinlik bilan to'laysiz</text>

  <text x="450" y="508" text-anchor="middle" font-size="13" fill="#64748b">Tanlov "yaxshi/yomon" emas — qaysi narxni to'lashga tayyorligingiz</text>
</svg>
