<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="Segoe UI">
  <title>Kitob xaritasi: tafakkurdan karyeragacha olti qism narvoni</title>
  <rect x="0" y="0" width="880" height="480" fill="#f8fafc"/>
  <text x="440" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Kitob xaritasi - olti pog'onali narvon</text>
  <text x="440" y="68" text-anchor="middle" font-size="13" fill="#64748b">kod yozuvchidan professional muhandisgacha</text>

  <!-- Narvon yo'li -->
  <line x1="90" y1="430" x2="800" y2="120" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="6 6"/>

  <!-- 1 Tafakkur -->
  <rect x="60" y="392" width="180" height="58" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="78" y="418" font-size="15" font-weight="bold" fill="#7c3aed">1 &#183; Tafakkur</text>
  <text x="78" y="440" font-size="13" fill="#64748b">muammo, debug, o'qish</text>

  <!-- 2 Hunar -->
  <rect x="190" y="330" width="180" height="58" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="208" y="356" font-size="15" font-weight="bold" fill="#2563eb">2 &#183; Hunar</text>
  <text x="208" y="378" font-size="13" fill="#64748b">toza kod, refactoring</text>

  <!-- 3 Sifat -->
  <rect x="320" y="268" width="180" height="58" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="338" y="294" font-size="15" font-weight="bold" fill="#16a34a">3 &#183; Sifat</text>
  <text x="338" y="316" font-size="13" fill="#64748b">test, xavfsizlik, qarz</text>

  <!-- 4 Jamoa -->
  <rect x="450" y="206" width="180" height="58" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="468" y="232" font-size="15" font-weight="bold" fill="#f59e0b">4 &#183; Jamoa</text>
  <text x="468" y="254" font-size="13" fill="#64748b">review, Agile, muloqot</text>

  <!-- 5 Unumdorlik -->
  <rect x="560" y="144" width="190" height="58" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <text x="578" y="170" font-size="15" font-weight="bold" fill="#0891b2">5 &#183; Unumdorlik</text>
  <text x="578" y="192" font-size="13" fill="#64748b">vositalar, vaqt, o'sish</text>

  <!-- 6 Karyera -->
  <rect x="660" y="82" width="190" height="58" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
  <text x="678" y="108" font-size="15" font-weight="bold" fill="#dc2626">6 &#183; Karyera</text>
  <text x="678" y="130" font-size="13" fill="#64748b">junior-senior, intervyu</text>

  <!-- Cho'qqi belgisi -->
  <text x="755" y="70" text-anchor="middle" font-size="20">&#9650;</text>
  <text x="500" y="468" text-anchor="middle" font-size="13" fill="#64748b">Har pog'ona oldingisiga tayanadi - lekin ehtiyojga qarab to'g'ridan-to'g'ri bobga o'tsa ham bo'ladi.</text>
</svg>
