<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="Segoe UI">
  <title>Qaror daraxti: izoh yozaymi yoki avval kodni yaxshilay olamanmi</title>
  <rect x="0" y="0" width="880" height="540" fill="#f8fafc"/>

  <text x="440" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Izoh yozay yoki yozmayinmi?</text>
  <text x="440" y="60" text-anchor="middle" font-size="14" fill="#64748b">Birinchi savol: izohsiz tushunarli qila olamanmi?</text>

  <!-- Start -->
  <rect x="320" y="84" width="240" height="56" rx="12" fill="#2563eb"/>
  <text x="440" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Bu joy tushunarsizmi?</text>
  <text x="440" y="130" text-anchor="middle" font-size="13" fill="#dbeafe">(nom, tuzilish, mantiq)</text>

  <!-- arrow down -->
  <line x1="440" y1="140" x2="440" y2="172" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="440,180 435,170 445,170" fill="#94a3b8"/>

  <!-- Q2 -->
  <rect x="300" y="180" width="280" height="64" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="208" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Kodning o'zini yaxshilab</text>
  <text x="440" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">tushunarli qila olamanmi?</text>

  <!-- HA branch left -->
  <line x1="300" y1="212" x2="170" y2="212" stroke="#16a34a" stroke-width="2"/>
  <line x1="170" y1="212" x2="170" y2="300" stroke="#16a34a" stroke-width="2"/>
  <polygon points="170,308 165,298 175,298" fill="#16a34a"/>
  <text x="232" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#16a34a">HA</text>

  <rect x="40" y="308" width="260" height="100" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="170" y="338" text-anchor="middle" font-size="15" font-weight="bold" fill="#16a34a">Izoh YOZMA</text>
  <text x="170" y="362" text-anchor="middle" font-size="13" fill="#334155">Yaxshi nom qo'y, funksiyani</text>
  <text x="170" y="380" text-anchor="middle" font-size="13" fill="#334155">ajrat, oraliq o'zgaruvchi.</text>
  <text x="170" y="398" text-anchor="middle" font-size="13" fill="#334155">Kod o'zi gapirsin.</text>

  <!-- YO'Q branch right -->
  <line x1="580" y1="212" x2="710" y2="212" stroke="#f59e0b" stroke-width="2"/>
  <line x1="710" y1="212" x2="710" y2="300" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="710,308 705,298 715,298" fill="#f59e0b"/>
  <text x="648" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#f59e0b">YO'Q</text>

  <rect x="580" y="308" width="260" height="100" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="710" y="338" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">"NEGA" izohini YOZ</text>
  <text x="710" y="362" text-anchor="middle" font-size="13" fill="#334155">Sabab, kontekst, ogohlantirish,</text>
  <text x="710" y="380" text-anchor="middle" font-size="13" fill="#334155">havola (ticket/formula).</text>
  <text x="710" y="398" text-anchor="middle" font-size="13" fill="#334155">Nimani emas, negani.</text>

  <!-- bottom note -->
  <rect x="220" y="440" width="440" height="72" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="440" y="468" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">Hech qachon: "nima"ni takrorlovchi izoh</text>
  <text x="440" y="492" text-anchor="middle" font-size="13" fill="#334155">soni++ // soni ni oshiramiz  — bu shovqin, foyda yo'q</text>
</svg>
