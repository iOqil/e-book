<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Segoe UI">
  <title>Ish bozori aysbergi: e'lon qilingan vakansiyalar suv ustidagi kichik cho'qqi, yashirin/tavsiya orqali topiladigan ishlar suv ostidagi katta qism</title>
  <rect x="0" y="0" width="900" height="540" fill="#f8fafc"/>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Ish bozori aysbergi: ko'rinadigan qism kichik</text>
  <text x="450" y="62" text-anchor="middle" font-size="14" fill="#64748b">Ko'p vakansiya hech qachon e'lon qilinmaydi — tavsiya va tarmoq orqali to'ladi</text>

  <!-- waterline -->
  <line x1="40" y1="190" x2="860" y2="190" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="852" y="184" text-anchor="end" font-size="13" fill="#2563eb">suv chizig'i = ariza beradigan joyingiz</text>

  <!-- sky / above water -->
  <rect x="40" y="78" width="820" height="112" fill="#eff6ff"/>

  <!-- tip of iceberg -->
  <polygon points="450,110 510,190 390,190" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="160" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">E'lon</text>
  <text x="450" y="178" text-anchor="middle" font-size="13" fill="#1e40af">qilingan</text>
  <text x="600" y="120" font-size="14" fill="#334155">Suv ustidagi cho'qqi:</text>
  <text x="600" y="142" font-size="14" fill="#334155">hamma ko'radi, yuzlab nomzod,</text>
  <text x="600" y="164" font-size="14" fill="#334155">eng raqobatli, eng past javob nisbati</text>

  <!-- underwater -->
  <rect x="40" y="190" width="820" height="290" fill="#e0f2fe"/>
  <polygon points="390,190 510,190 660,470 240,470" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>

  <text x="450" y="240" text-anchor="middle" font-size="17" font-weight="bold" fill="#075985">Yashirin bozor</text>
  <text x="450" y="278" text-anchor="middle" font-size="14" fill="#0c4a6e">Tavsiya (referral)</text>
  <text x="450" y="312" text-anchor="middle" font-size="14" fill="#0c4a6e">Tanish-bilish, eski hamkasb</text>
  <text x="450" y="346" text-anchor="middle" font-size="14" fill="#0c4a6e">Hali e'lon qilinmagan o'rin</text>
  <text x="450" y="380" text-anchor="middle" font-size="14" fill="#0c4a6e">Meetup, jamoa, ochiq kod hissasi</text>
  <text x="450" y="414" text-anchor="middle" font-size="14" fill="#0c4a6e">Sizni "kimdir tanigani" uchun chaqirish</text>

  <text x="690" y="300" font-size="14" fill="#334155">Suv osti:</text>
  <text x="690" y="322" font-size="14" fill="#334155">kamroq raqobat,</text>
  <text x="690" y="344" font-size="14" fill="#334155">ishonchga asoslangan,</text>
  <text x="690" y="366" font-size="14" fill="#334155">tarmoq quradiganlar uchun</text>

  <text x="450" y="510" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Xulosa: faqat e'lonlarga ariza bermang — tarmoq qurib, suv ostiga kiring.</text>
</svg>
