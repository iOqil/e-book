<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Segoe UI">
  <title>Past psixologik xavfsizlik (jimlik, qo'rquv) va yuqori xavfsizlik (savol, xato tan olish) jamoa taqqoslashi</title>
  <rect x="0" y="0" width="880" height="500" fill="#f8fafc"/>

  <text x="440" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Psixologik xavfsizlik: ikki jamoa</text>
  <text x="440" y="62" text-anchor="middle" font-size="14" fill="#64748b">"Ahmoq ko'rinishdan qo'rqmaslik" unumdorlikni oshiradi (Aristotel loyihasi)</text>

  <!-- LOW column -->
  <rect x="40" y="90" width="380" height="380" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="230" y="122" text-anchor="middle" font-size="17" font-weight="bold" fill="#991b1b">&#10060; Past xavfsizlik</text>

  <rect x="62" y="142" width="336" height="50" rx="8" fill="#ffffff" stroke="#fca5a5"/>
  <text x="78" y="164" font-size="14" fill="#1e293b">"Bilmayman" desam, kulishadi.</text>
  <text x="78" y="184" font-size="13" fill="#dc2626">savol bermaydi, jim qoladi</text>

  <rect x="62" y="204" width="336" height="50" rx="8" fill="#ffffff" stroke="#fca5a5"/>
  <text x="78" y="226" font-size="14" fill="#1e293b">Xatoni yashiradi, kech aytadi.</text>
  <text x="78" y="246" font-size="13" fill="#dc2626">muammo katta bo'lib portlaydi</text>

  <rect x="62" y="266" width="336" height="50" rx="8" fill="#ffffff" stroke="#fca5a5"/>
  <text x="78" y="288" font-size="14" fill="#1e293b">Yangi g'oyani aytishga qo'rqadi.</text>
  <text x="78" y="308" font-size="13" fill="#dc2626">innovatsiya to'xtaydi</text>

  <rect x="62" y="328" width="336" height="50" rx="8" fill="#ffffff" stroke="#fca5a5"/>
  <text x="78" y="350" font-size="14" fill="#1e293b">"Bu mening ishim emas."</text>
  <text x="78" y="370" font-size="13" fill="#dc2626">mas'uliyatdan qochish</text>

  <text x="230" y="412" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">Natija: sekin, mo'rt jamoa</text>
  <text x="230" y="436" text-anchor="middle" font-size="13" fill="#991b1b">xatolar yashirin, o'sish sekin</text>
  <text x="230" y="456" text-anchor="middle" font-size="13" fill="#991b1b">eng yaxshilar ketadi</text>

  <!-- HIGH column -->
  <rect x="460" y="90" width="380" height="380" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="650" y="122" text-anchor="middle" font-size="17" font-weight="bold" fill="#166534">&#9989; Yuqori xavfsizlik</text>

  <rect x="482" y="142" width="336" height="50" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="498" y="164" font-size="14" fill="#1e293b">"Buni tushunmadim, tushuntirasanmi?"</text>
  <text x="498" y="184" font-size="13" fill="#166534">savol berish odatiy hol</text>

  <rect x="482" y="204" width="336" height="50" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="498" y="226" font-size="14" fill="#1e293b">"Men xato qildim, mana shu yerda."</text>
  <text x="498" y="246" font-size="13" fill="#166534">xato tez aytiladi, tez tuzatiladi</text>

  <rect x="482" y="266" width="336" height="50" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="498" y="288" font-size="14" fill="#1e293b">"Boshqacha yondashuv bormi?"</text>
  <text x="498" y="308" font-size="13" fill="#166534">g'oyalar erkin aylanadi</text>

  <rect x="482" y="328" width="336" height="50" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="498" y="350" font-size="14" fill="#1e293b">"Yordam kerakmi? Men qarayman."</text>
  <text x="498" y="370" font-size="13" fill="#166534">birgalikda mas'uliyat</text>

  <text x="650" y="412" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">Natija: tez, kuchli jamoa</text>
  <text x="650" y="436" text-anchor="middle" font-size="13" fill="#166534">xatolar darsga aylanadi, tez o'sish</text>
  <text x="650" y="456" text-anchor="middle" font-size="13" fill="#166534">odamlar qoladi va o'sadi</text>
</svg>
