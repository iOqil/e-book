<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" font-family="Segoe UI">
  <title>Dasturchi asbob qutisi: muharrir, terminal, debugger, VCS, qidiruv, avtomatlashtirish</title>
  <rect x="0" y="0" width="840" height="470" fill="#f8fafc"/>
  <text x="420" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#1e293b">Dasturchi asbob qutisi</text>
  <text x="420" y="66" text-anchor="middle" font-size="15" fill="#64748b">olti tayanch vosita — har biri bir maqsadga xizmat qiladi</text>

  <!-- Card 1: Muharrir/IDE -->
  <rect x="40" y="100" width="230" height="150" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="40" y="100" width="230" height="38" rx="12" fill="#2563eb"/>
  <rect x="40" y="120" width="230" height="18" fill="#2563eb"/>
  <text x="155" y="126" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Muharrir / IDE</text>
  <text x="60" y="165" font-size="14" fill="#334155">navigatsiya (go to def)</text>
  <text x="60" y="190" font-size="14" fill="#334155">refactor amallari</text>
  <text x="60" y="215" font-size="14" fill="#334155">multi-cursor, snippet</text>
  <text x="60" y="240" font-size="13" fill="#64748b">maqsad: yozish + harakat</text>

  <!-- Card 2: Terminal/shell -->
  <rect x="305" y="100" width="230" height="150" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="305" y="100" width="230" height="38" rx="12" fill="#16a34a"/>
  <rect x="305" y="120" width="230" height="18" fill="#16a34a"/>
  <text x="420" y="126" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Terminal / shell</text>
  <text x="325" y="165" font-size="14" fill="#334155">pipe, qayta yo'naltirish</text>
  <text x="325" y="190" font-size="14" fill="#334155">tarix, alias</text>
  <text x="325" y="215" font-size="14" fill="#334155">til-mustaqil yopishtiruvchi</text>
  <text x="325" y="240" font-size="13" fill="#64748b">maqsad: boshqarish</text>

  <!-- Card 3: Debugger -->
  <rect x="570" y="100" width="230" height="150" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="570" y="100" width="230" height="38" rx="12" fill="#dc2626"/>
  <rect x="570" y="120" width="230" height="18" fill="#dc2626"/>
  <text x="685" y="126" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Debugger</text>
  <text x="590" y="165" font-size="14" fill="#334155">breakpoint, step</text>
  <text x="590" y="190" font-size="14" fill="#334155">o'zgaruvchi ko'rish</text>
  <text x="590" y="215" font-size="14" fill="#334155">stack trace</text>
  <text x="590" y="240" font-size="13" fill="#64748b">maqsad: tushunish</text>

  <!-- Card 4: VCS -->
  <rect x="40" y="280" width="230" height="150" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="40" y="280" width="230" height="38" rx="12" fill="#7c3aed"/>
  <rect x="40" y="300" width="230" height="18" fill="#7c3aed"/>
  <text x="155" y="306" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">VCS (Git)</text>
  <text x="60" y="345" font-size="14" fill="#334155">tarix, branch, diff</text>
  <text x="60" y="370" font-size="14" fill="#334155">bisect, blame</text>
  <text x="60" y="395" font-size="14" fill="#334155">jamoa oqimi</text>
  <text x="60" y="420" font-size="13" fill="#64748b">maqsad: xotira + jamoa</text>

  <!-- Card 5: Qidiruv -->
  <rect x="305" y="280" width="230" height="150" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <rect x="305" y="280" width="230" height="38" rx="12" fill="#f59e0b"/>
  <rect x="305" y="300" width="230" height="18" fill="#f59e0b"/>
  <text x="420" y="306" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Qidiruv (grep)</text>
  <text x="325" y="345" font-size="14" fill="#334155">kod bazasida topish</text>
  <text x="325" y="370" font-size="14" fill="#334155">ripgrep, regex sezgisi</text>
  <text x="325" y="395" font-size="14" fill="#334155">"qaysi ipni tortish"</text>
  <text x="325" y="420" font-size="13" fill="#64748b">maqsad: yo'naltirish</text>

  <!-- Card 6: Avtomatlashtirish -->
  <rect x="570" y="280" width="230" height="150" rx="12" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <rect x="570" y="280" width="230" height="38" rx="12" fill="#1e293b"/>
  <rect x="570" y="300" width="230" height="18" fill="#1e293b"/>
  <text x="685" y="306" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Avtomatlashtirish</text>
  <text x="590" y="345" font-size="14" fill="#334155">skript, Makefile</text>
  <text x="590" y="370" font-size="14" fill="#334155">task runner</text>
  <text x="590" y="395" font-size="14" fill="#334155">dotfiles (git'da)</text>
  <text x="590" y="420" font-size="13" fill="#64748b">maqsad: takrorni yo'q qilish</text>

  <text x="420" y="458" text-anchor="middle" font-size="14" fill="#64748b">Vosita — usta qo'lidagi asbob: maqsad emas, kuchaytirgich.</text>
</svg>
