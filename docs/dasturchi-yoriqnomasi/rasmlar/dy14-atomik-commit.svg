<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="Segoe UI">
  <title>Aralash katta commit yomon, bir nechta atomik commit yaxshi</title>
  <rect x="0" y="0" width="860" height="470" fill="#f8fafc"/>

  <text x="430" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Aralash commit vs atomik commit</text>

  <!-- LEFT: mixed commit (bad) -->
  <rect x="40" y="70" width="360" height="340" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="220" y="104" text-anchor="middle" font-size="18" font-weight="bold" fill="#991b1b">Aralash commit</text>
  <text x="220" y="128" text-anchor="middle" font-size="14" fill="#dc2626">Hammasi bitta commit ichida</text>

  <rect x="72" y="148" width="296" height="222" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
  <text x="92" y="178" font-size="15" font-weight="bold" fill="#1e293b">commit a3f9c1</text>
  <text x="92" y="200" font-size="14" fill="#64748b">"fix stuff"</text>
  <line x1="92" y1="214" x2="348" y2="214" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="92" y="240" font-size="14" fill="#334155">+ login bug tuzatildi</text>
  <text x="92" y="266" font-size="14" fill="#334155">+ tugma rangi o'zgardi</text>
  <text x="92" y="292" font-size="14" fill="#334155">+ 4 fayl formatlandi</text>
  <text x="92" y="318" font-size="14" fill="#334155">+ aloqasiz refactor</text>
  <text x="92" y="352" font-size="14" font-weight="bold" fill="#dc2626">Review/revert/bisect qiyin</text>

  <!-- RIGHT: atomic commits (good) -->
  <rect x="460" y="70" width="360" height="340" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="640" y="104" text-anchor="middle" font-size="18" font-weight="bold" fill="#166534">Atomik commit</text>
  <text x="640" y="128" text-anchor="middle" font-size="14" fill="#16a34a">Bitta g'oya = bitta commit</text>

  <rect x="492" y="148" width="296" height="46" rx="9" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="510" y="170" font-size="14" font-weight="bold" fill="#1e293b">fix: login token xatosi</text>
  <text x="510" y="187" font-size="13" fill="#64748b">faqat auth mantig'i</text>

  <rect x="492" y="204" width="296" height="46" rx="9" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="510" y="226" font-size="14" font-weight="bold" fill="#1e293b">style: tugma rangi</text>
  <text x="510" y="243" font-size="13" fill="#64748b">faqat UI rangi</text>

  <rect x="492" y="260" width="296" height="46" rx="9" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="510" y="282" font-size="14" font-weight="bold" fill="#1e293b">chore: fayllarni formatla</text>
  <text x="510" y="299" font-size="13" fill="#64748b">faqat formatlash</text>

  <rect x="492" y="316" width="296" height="46" rx="9" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="510" y="338" font-size="14" font-weight="bold" fill="#1e293b">refactor: narx hisobi</text>
  <text x="510" y="355" font-size="13" fill="#64748b">faqat refactor</text>

  <text x="640" y="392" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">Review/revert/bisect oson</text>
</svg>
