<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="Segoe UI">
  <title>Dasturchi ish kuni tarkibi: kod yozish kichik ulush</title>
  <rect x="0" y="0" width="860" height="470" fill="#f8fafc"/>
  <text x="430" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Dasturchi ish kuni aslida nimaga ketadi</text>
  <text x="430" y="70" text-anchor="middle" font-size="13" fill="#64748b">(taxminiy ulush - jamoa va loyihaga qarab o'zgaradi)</text>

  <!-- Doira diagramma (taxminiy ulushlar) -->
  <!-- Kod yozish 20% (binafsha) -->
  <path d="M250 250 L250 110 A140 140 0 0 1 387.4 277.6 Z" fill="#7c3aed"/>
  <!-- Begona kodni o'qish 25% -->
  <path d="M250 250 L387.4 277.6 A140 140 0 0 1 250 390 Z" fill="#2563eb"/>
  <!-- Muhokama / yig'ilish 20% -->
  <path d="M250 250 L250 390 A140 140 0 0 1 116.3 293.2 Z" fill="#16a34a"/>
  <!-- Debugging 20% -->
  <path d="M250 250 L116.3 293.2 A140 140 0 0 1 117.4 200.5 Z" fill="#f59e0b"/>
  <!-- Rejalashtirish / kutish 15% -->
  <path d="M250 250 L117.4 200.5 A140 140 0 0 1 250 110 Z" fill="#94a3b8"/>

  <circle cx="250" cy="250" r="62" fill="#f8fafc"/>
  <text x="250" y="245" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">8 soatlik</text>
  <text x="250" y="265" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">ish kuni</text>

  <!-- Izoh (legend) -->
  <rect x="500" y="120" width="22" height="22" rx="4" fill="#7c3aed"/>
  <text x="532" y="137" font-size="15" fill="#334155">Kod yozish - taxminan 20%</text>

  <rect x="500" y="160" width="22" height="22" rx="4" fill="#2563eb"/>
  <text x="532" y="177" font-size="15" fill="#334155">Begona kod / hujjat o'qish - 25%</text>

  <rect x="500" y="200" width="22" height="22" rx="4" fill="#16a34a"/>
  <text x="532" y="217" font-size="15" fill="#334155">Muhokama, yig'ilish, sharh - 20%</text>

  <rect x="500" y="240" width="22" height="22" rx="4" fill="#f59e0b"/>
  <text x="532" y="257" font-size="15" fill="#334155">Debugging, sinash - 20%</text>

  <rect x="500" y="280" width="22" height="22" rx="4" fill="#94a3b8"/>
  <text x="532" y="297" font-size="15" fill="#334155">Rejalashtirish, kutish - 15%</text>

  <text x="500" y="360" font-size="14" fill="#dc2626" font-weight="bold">Xulosa: &quot;kod yozish&quot; - aysbergning uchi.</text>
  <text x="500" y="384" font-size="14" fill="#334155">Vaqtning ko'pi - o'ylash, o'qish va</text>
  <text x="500" y="406" font-size="14" fill="#334155">odamlar bilan ishlashga ketadi.</text>
</svg>
