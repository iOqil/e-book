<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" font-family="Segoe UI">
  <title>Yuqori cohesion bog'liq narsalar bir modulda past cohesion sochilgan</title>
  <rect x="0" y="0" width="880" height="490" fill="#f8fafc"/>

  <text x="440" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Bog'liq narsalar birga turadi (cohesion)</text>
  <text x="440" y="60" text-anchor="middle" font-size="14" fill="#64748b">"O'zgartirish kerak bo'lganda bir joyga qarayman" vs "butun loyihani izlayman"</text>

  <!-- LOW cohesion: scattered -->
  <rect x="40" y="88" width="380" height="372" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
  <text x="230" y="118" text-anchor="middle" font-size="18" font-weight="bold" fill="#dc2626">Past cohesion: sochilgan</text>

  <rect x="64" y="138" width="160" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="144" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">utils.js</text>
  <text x="144" y="184" text-anchor="middle" font-size="13" fill="#dc2626">toloviHisobla()</text>

  <rect x="240" y="138" width="160" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="320" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">helpers.js</text>
  <text x="320" y="184" text-anchor="middle" font-size="13" fill="#dc2626">tolovniTasdiqla()</text>

  <rect x="64" y="220" width="160" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="144" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">misc.js</text>
  <text x="144" y="266" text-anchor="middle" font-size="13" fill="#dc2626">tolovQaytar()</text>

  <rect x="240" y="220" width="160" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="320" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">main.js</text>
  <text x="320" y="266" text-anchor="middle" font-size="13" fill="#dc2626">tolovChek()</text>

  <text x="230" y="332" text-anchor="middle" font-size="14" fill="#1e293b">To'lov mantig'i 4 faylga tarqab ketgan</text>
  <text x="230" y="392" text-anchor="middle" font-size="13" fill="#dc2626">O'zgartirishda 4 joyni izlaysiz,</text>
  <text x="230" y="412" text-anchor="middle" font-size="13" fill="#dc2626">bittasini unutib qo'yasiz</text>
  <text x="230" y="438" text-anchor="middle" font-size="14" fill="#dc2626">Bog'liqlik bor, qo'shnilik yo'q</text>

  <!-- HIGH cohesion: together -->
  <rect x="460" y="88" width="380" height="372" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="650" y="118" text-anchor="middle" font-size="18" font-weight="bold" fill="#16a34a">Yuqori cohesion: birga</text>

  <rect x="500" y="142" width="300" height="216" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="650" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#16a34a">tolov/  moduli</text>
  <line x1="524" y1="184" x2="776" y2="184" stroke="#bbf7d0" stroke-width="1.5"/>

  <rect x="524" y="200" width="252" height="34" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="650" y="223" text-anchor="middle" font-size="13" fill="#334155">toloviHisobla()</text>

  <rect x="524" y="240" width="252" height="34" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="650" y="263" text-anchor="middle" font-size="13" fill="#334155">tolovniTasdiqla()</text>

  <rect x="524" y="280" width="252" height="34" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="650" y="303" text-anchor="middle" font-size="13" fill="#334155">tolovniQaytar()</text>

  <rect x="524" y="320" width="252" height="34" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="650" y="343" text-anchor="middle" font-size="13" fill="#334155">tolovChekiniYarat()</text>

  <text x="650" y="392" text-anchor="middle" font-size="13" fill="#16a34a">Butun to'lov mantig'i bitta papkada</text>
  <text x="650" y="412" text-anchor="middle" font-size="13" fill="#16a34a">O'zgartirish kerakmi? Bitta joyga qaraysiz</text>
  <text x="650" y="438" text-anchor="middle" font-size="14" fill="#16a34a">Birga o'zgaradigan narsa birga turadi</text>
</svg>
