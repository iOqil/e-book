<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Segoe UI">
  <title>Uch nuqtali baho: optimist, realist va pessimist baholardan kutilgan qiymat</title>
  <rect x="0" y="0" width="880" height="460" fill="#f8fafc"/>

  <text x="440" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Uch nuqtali baho (three-point estimate)</text>
  <text x="440" y="60" text-anchor="middle" font-size="14" fill="#64748b">Bitta raqam emas: optimist, realist, pessimist va kutilgan qiymat</text>

  <!-- number line -->
  <line x1="90" y1="250" x2="790" y2="250" stroke="#1e293b" stroke-width="2"/>
  <text x="90" y="282" text-anchor="middle" font-size="13" fill="#64748b">2 kun</text>
  <text x="320" y="282" text-anchor="middle" font-size="13" fill="#64748b">5 kun</text>
  <text x="720" y="282" text-anchor="middle" font-size="13" fill="#64748b">12 kun</text>

  <!-- optimist O -->
  <circle cx="90" cy="250" r="7" fill="#16a34a"/>
  <text x="90" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">Optimist</text>
  <text x="90" y="220" text-anchor="middle" font-size="13" fill="#64748b">O = 2 (hammasi joyida)</text>

  <!-- realist M -->
  <circle cx="320" cy="250" r="7" fill="#2563eb"/>
  <text x="320" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">Realist</text>
  <text x="320" y="220" text-anchor="middle" font-size="13" fill="#64748b">M = 5 (odatdagi)</text>

  <!-- pessimist P -->
  <circle cx="720" cy="250" r="7" fill="#dc2626"/>
  <text x="720" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">Pessimist</text>
  <text x="720" y="220" text-anchor="middle" font-size="13" fill="#64748b">P = 12 (nimadir buziladi)</text>

  <!-- expected value marker -->
  <line x1="406" y1="240" x2="406" y2="320" stroke="#7c3aed" stroke-width="3" stroke-dasharray="6 4"/>
  <circle cx="406" cy="250" r="6" fill="#7c3aed"/>
  <rect x="296" y="324" width="220" height="56" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="406" y="346" text-anchor="middle" font-size="14" font-weight="bold" fill="#6d28d9">Kutilgan qiymat</text>
  <text x="406" y="368" text-anchor="middle" font-size="13" fill="#7c3aed">(O + 4M + P) / 6 = ~5.7 kun</text>

  <!-- formula box -->
  <rect x="560" y="330" width="280" height="92" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="700" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Nega P tarafga og'adi?</text>
  <text x="700" y="380" text-anchor="middle" font-size="13" fill="#334155">Ishlar kechikishga moyil:</text>
  <text x="700" y="400" text-anchor="middle" font-size="13" fill="#334155">"erta tugadi" kam, "kech qoldi" ko'p</text>

  <text x="440" y="448" text-anchor="middle" font-size="13" fill="#64748b">Bitta raqam o'rniga diapazon: bu noaniqlikni halol ko'rsatadi</text>
</svg>
