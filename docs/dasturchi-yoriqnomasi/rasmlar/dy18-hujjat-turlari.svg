<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" font-family="Segoe UI">
  <title>Diataxis hujjat turlari kvadranti: tutorial, how-to, reference va explanation</title>
  <rect x="0" y="0" width="860" height="540" fill="#f8fafc"/>

  <text x="430" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Hujjat turlari (Diataxis sezgisi)</text>
  <text x="430" y="60" text-anchor="middle" font-size="14" fill="#64748b">Amaliyot/nazariya x O'rganish/ish bajarish</text>

  <!-- axis labels -->
  <text x="270" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">O'rganishga (study)</text>
  <text x="605" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">Ishga (work)</text>
  <text x="56" y="205" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155" transform="rotate(-90 56 205)">Amaliy qadam</text>
  <text x="56" y="400" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155" transform="rotate(-90 56 400)">Bilim (nazariya)</text>

  <!-- top-left: tutorial -->
  <rect x="100" y="110" width="330" height="185" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="265" y="144" text-anchor="middle" font-size="17" font-weight="bold" fill="#166534">Tutorial (qo'llanma)</text>
  <text x="265" y="174" text-anchor="middle" font-size="14" fill="#1e293b">Yangi kishini qo'lidan ushlab</text>
  <text x="265" y="196" text-anchor="middle" font-size="14" fill="#1e293b">birinchi muvaffaqiyatga olib boradi.</text>
  <text x="265" y="228" text-anchor="middle" font-size="13" fill="#334155">Savol: "Boshlashga yordam ber"</text>
  <text x="265" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">Misol: "0 dan birinchi ishga tushish"</text>

  <!-- top-right: how-to -->
  <rect x="440" y="110" width="330" height="185" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="605" y="144" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d4ed8">How-to (yo'riqnoma)</text>
  <text x="605" y="174" text-anchor="middle" font-size="14" fill="#1e293b">Aniq vazifani bajarishga</text>
  <text x="605" y="196" text-anchor="middle" font-size="14" fill="#1e293b">qadam-qadam yo'l ko'rsatadi.</text>
  <text x="605" y="228" text-anchor="middle" font-size="13" fill="#334155">Savol: "Buni qanday qilaman?"</text>
  <text x="605" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">Misol: "Domen qanday ulanadi"</text>

  <!-- bottom-left: explanation -->
  <rect x="100" y="305" width="330" height="185" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="265" y="339" text-anchor="middle" font-size="17" font-weight="bold" fill="#6d28d9">Explanation (tushuntirish)</text>
  <text x="265" y="369" text-anchor="middle" font-size="14" fill="#1e293b">Nega bunday: kontekst,</text>
  <text x="265" y="391" text-anchor="middle" font-size="14" fill="#1e293b">sabab va qaror mantig'i.</text>
  <text x="265" y="423" text-anchor="middle" font-size="13" fill="#334155">Savol: "Nega shunday qilingan?"</text>
  <text x="265" y="457" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c3aed">Misol: ADR, arxitektura eslatma</text>

  <!-- bottom-right: reference -->
  <rect x="440" y="305" width="330" height="185" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="605" y="339" text-anchor="middle" font-size="17" font-weight="bold" fill="#b45309">Reference (ma'lumotnoma)</text>
  <text x="605" y="369" text-anchor="middle" font-size="14" fill="#1e293b">Aniq, quruq faktlar:</text>
  <text x="605" y="391" text-anchor="middle" font-size="14" fill="#1e293b">API, parametr, konfiguratsiya.</text>
  <text x="605" y="423" text-anchor="middle" font-size="13" fill="#334155">Savol: "Bu nima qiladi?"</text>
  <text x="605" y="457" text-anchor="middle" font-size="14" font-weight="bold" fill="#f59e0b">Misol: API hujjati, sozlama jadvali</text>

  <text x="430" y="522" text-anchor="middle" font-size="13" fill="#64748b">Har biri boshqa maqsadga xizmat qiladi -- ularni aralashtirmang.</text>
</svg>
