<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI">
  <title>Yaxshi rezyume anatomiyasi: kontakt, qisqa, tajriba (natija-fe'l), loyiha, ko'nikma, ta'lim bloklari; yon tomonda rezyumega QO'SHMA ro'yxati</title>
  <rect x="0" y="0" width="900" height="560" fill="#f8fafc"/>

  <text x="40" y="38" font-size="22" font-weight="bold" fill="#1e293b">Rezyume anatomiyasi: 1 sahifa, maqsad — intervyuga chaqirtirish</text>
  <text x="40" y="62" font-size="14" fill="#64748b">Skaner (ATS) o'qiy oladigan sodda tuzilish — yuqoridan pastga muhimlik tartibida</text>

  <!-- Resume page -->
  <rect x="40" y="84" width="520" height="452" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Kontakt -->
  <rect x="60" y="100" width="480" height="48" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="74" y="124" font-size="15" font-weight="bold" fill="#1e40af">Kontakt</text>
  <text x="74" y="142" font-size="13" fill="#334155">Ism · shahar · email · telefon · GitHub · LinkedIn</text>

  <!-- Qisqa -->
  <rect x="60" y="156" width="480" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="74" y="180" font-size="15" font-weight="bold" fill="#1e40af">Qisqa profil (2-3 qator)</text>
  <text x="74" y="198" font-size="13" fill="#334155">Kim ekanligingiz + nimaga moslashayotganingiz</text>

  <!-- Tajriba -->
  <rect x="60" y="212" width="480" height="92" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="74" y="236" font-size="15" font-weight="bold" fill="#166534">Tajriba (eng katta blok)</text>
  <text x="74" y="258" font-size="13" fill="#334155">Har bullet = fe'l + natija + raqam</text>
  <text x="74" y="278" font-size="13" fill="#16a34a">"X ni qildim, Y ga erishdim (Z%)"</text>
  <text x="74" y="296" font-size="13" fill="#64748b">vazifa ro'yxati emas — TA'SIR</text>

  <!-- Loyiha -->
  <rect x="60" y="312" width="480" height="48" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="74" y="336" font-size="15" font-weight="bold" fill="#6d28d9">Loyiha / portfolio</text>
  <text x="74" y="354" font-size="13" fill="#334155">2-3 sifatli loyiha + jonli demo / GitHub havola</text>

  <!-- Ko'nikma -->
  <rect x="60" y="368" width="480" height="48" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="74" y="392" font-size="15" font-weight="bold" fill="#b45309">Ko'nikma (texnologiyalar)</text>
  <text x="74" y="410" font-size="13" fill="#334155">Vakansiya tilidagi kalit so'zlar — halol</text>

  <!-- Ta'lim -->
  <rect x="60" y="424" width="480" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="74" y="448" font-size="15" font-weight="bold" fill="#334155">Ta'lim</text>
  <text x="74" y="464" font-size="13" fill="#64748b">Eng oxirida — tajriba muhimroq</text>

  <text x="300" y="510" text-anchor="middle" font-size="13" fill="#64748b">Yuqori = muhim. Skaner ham, odam ham yuqoridan o'qiydi.</text>

  <!-- Side: QO'SHMASLIK list -->
  <rect x="588" y="84" width="280" height="452" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="728" y="116" text-anchor="middle" font-size="17" font-weight="bold" fill="#b91c1c">Rezyumega QO'SHMANG</text>

  <text x="606" y="156" font-size="14" fill="#991b1b">x  Foto, yosh, jins</text>
  <text x="606" y="188" font-size="14" fill="#991b1b">x  Manzil (to'liq), oilaviy holat</text>
  <text x="606" y="220" font-size="14" fill="#991b1b">x  "MS Word bilaman"</text>
  <text x="606" y="252" font-size="14" fill="#991b1b">x  Hobbi ro'yxati (ahamiyatsiz)</text>
  <text x="606" y="284" font-size="14" fill="#991b1b">x  "Mas'uliyatli, mehnatkash"</text>
  <text x="624" y="304" font-size="13" fill="#dc2626">(dalilsiz sifatlar)</text>
  <text x="606" y="336" font-size="14" fill="#991b1b">x  Murakkab dizayn, jadval, rang</text>
  <text x="624" y="356" font-size="13" fill="#dc2626">(skaner o'qiy olmaydi)</text>
  <text x="606" y="388" font-size="14" fill="#991b1b">x  Yolg'on tajriba / daraja</text>
  <text x="606" y="420" font-size="14" fill="#991b1b">x  3+ sahifa</text>

  <text x="728" y="470" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">Qoida:</text>
  <text x="728" y="492" text-anchor="middle" font-size="13" fill="#991b1b">qiymat qo'shmasa — olib tashlang.</text>
  <text x="728" y="512" text-anchor="middle" font-size="13" fill="#991b1b">Sodda format = ko'proq intervyu.</text>
</svg>
