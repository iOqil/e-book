<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI">
  <title>Noetik so'rovga javob qaror oqimi: gaplash, muqobil taklif et, rad et, oxirgi chora eskalatsiya</title>
  <rect x="0" y="0" width="900" height="520" fill="#f8fafc"/>

  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Noetik so'rov kelganda: qaror oqimi</text>
  <text x="450" y="60" text-anchor="middle" font-size="14" fill="#64748b">"Yo'q" deyish — ko'nikma. Eng yengil zinadan boshlang.</text>

  <!-- Start -->
  <rect x="300" y="84" width="300" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="450" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">So'rov noetik yoki shubhali</text>
  <text x="450" y="129" text-anchor="middle" font-size="13" fill="#334155">aldash, qalbaki ma'lumot, qonunbuzarlik</text>
  <line x1="450" y1="140" x2="450" y2="166" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="450,166 443,154 457,154" fill="#94a3b8"/>

  <!-- Step 1 -->
  <rect x="250" y="168" width="400" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">1. Aniqlashtir va gaplash</text>
  <text x="450" y="213" text-anchor="middle" font-size="13" fill="#334155">"Nega kerak? Men buni shunday tushundim — to'g'rimi?"</text>
  <line x1="450" y1="226" x2="450" y2="250" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="450,250 443,238 457,238" fill="#94a3b8"/>

  <!-- Step 2 -->
  <rect x="250" y="252" width="400" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">2. Muqobil taklif et</text>
  <text x="450" y="297" text-anchor="middle" font-size="13" fill="#334155">"Bu xavfli. O'rniga shu etik yo'lni qila olamiz"</text>
  <line x1="450" y1="310" x2="450" y2="334" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="450,334 443,322 457,322" fill="#94a3b8"/>

  <!-- Step 3 -->
  <rect x="250" y="336" width="400" height="58" rx="10" fill="#fef9c3" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="360" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">3. Tinch, lekin qat'iy rad et</text>
  <text x="450" y="381" text-anchor="middle" font-size="13" fill="#334155">"Men buni qila olmayman — sababi shu" (yozma qoldir)</text>
  <line x1="450" y1="394" x2="450" y2="418" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="450,418 443,406 457,406" fill="#94a3b8"/>

  <!-- Step 4 -->
  <rect x="250" y="420" width="400" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="450" y="444" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">4. Oxirgi chora: eskalatsiya</text>
  <text x="450" y="465" text-anchor="middle" font-size="13" fill="#334155">rahbar/HR/huquqiy; jiddiy zarar bo'lsa — fosh qilish</text>
  <text x="450" y="481" text-anchor="middle" font-size="13" fill="#64748b">(whistleblowing) — eng og'ir, oxirgi qadam</text>

  <!-- side note -->
  <rect x="690" y="200" width="190" height="120" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="785" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">Ko'pincha</text>
  <text x="785" y="252" text-anchor="middle" font-size="13" fill="#334155">muammo 1-2</text>
  <text x="785" y="272" text-anchor="middle" font-size="13" fill="#334155">qadamda hal</text>
  <text x="785" y="292" text-anchor="middle" font-size="13" fill="#334155">bo'ladi — odam</text>
  <text x="785" y="312" text-anchor="middle" font-size="13" fill="#334155">oqibatni bilmagan</text>
  <line x1="650" y1="280" x2="690" y2="260" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,4"/>

  <rect x="20" y="200" width="190" height="120" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="115" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#6d28d9">Yodda tut</text>
  <text x="115" y="252" text-anchor="middle" font-size="13" fill="#334155">"Buyruq edi"</text>
  <text x="115" y="272" text-anchor="middle" font-size="13" fill="#334155">javobgarlikni</text>
  <text x="115" y="292" text-anchor="middle" font-size="13" fill="#334155">olib tashlamaydi.</text>
  <text x="115" y="312" text-anchor="middle" font-size="13" fill="#334155">Qo'l — sizniki.</text>
  <line x1="250" y1="280" x2="210" y2="260" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5,4"/>
</svg>
