<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="Segoe UI">
  <title>Chuqur ish bloki vs sayoz, bo'lingan kun: ikkita kun jadvalini taqqoslash</title>
  <rect x="0" y="0" width="820" height="470" fill="#f8fafc"/>

  <text x="410" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Chuqur ish vs sayoz kun</text>
  <text x="410" y="60" text-anchor="middle" font-size="14" fill="#64748b">Bir xil 4 soat, ikki xil natija</text>

  <!-- LEFT: deep work -->
  <text x="210" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">Himoyalangan fokus</text>
  <!-- timeline bar -->
  <rect x="80" y="120" width="260" height="220" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <!-- one long block -->
  <rect x="92" y="132" width="236" height="150" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="210" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">Uzluksiz blok</text>
  <text x="210" y="222" text-anchor="middle" font-size="13" fill="#166534">oqim holatiga kiriladi</text>
  <text x="210" y="244" text-anchor="middle" font-size="13" fill="#166534">murakkab masala yechiladi</text>
  <!-- small break -->
  <rect x="92" y="290" width="236" height="38" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="210" y="314" text-anchor="middle" font-size="13" fill="#1e40af">Rejali tanaffus</text>
  <text x="210" y="368" text-anchor="middle" font-size="15" font-weight="bold" fill="#16a34a">Natija: 1 qiyin masala TUGADI</text>

  <!-- RIGHT: shallow day -->
  <text x="610" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#b91c1c">Bo'lingan kun</text>
  <rect x="480" y="120" width="260" height="220" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <!-- fragmented strips -->
  <rect x="492" y="132" width="236" height="26" rx="4" fill="#fee2e2" stroke="#dc2626"/>
  <text x="610" y="150" text-anchor="middle" font-size="13" fill="#b91c1c">ish - chat uzdi</text>
  <rect x="492" y="164" width="236" height="20" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="610" y="179" text-anchor="middle" font-size="13" fill="#b45309">qayta fokus...</text>
  <rect x="492" y="190" width="236" height="26" rx="4" fill="#fee2e2" stroke="#dc2626"/>
  <text x="610" y="208" text-anchor="middle" font-size="13" fill="#b91c1c">ish - email uzdi</text>
  <rect x="492" y="222" width="236" height="20" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="610" y="237" text-anchor="middle" font-size="13" fill="#b45309">qayta fokus...</text>
  <rect x="492" y="248" width="236" height="26" rx="4" fill="#fee2e2" stroke="#dc2626"/>
  <text x="610" y="266" text-anchor="middle" font-size="13" fill="#b91c1c">ish - yig'ilish uzdi</text>
  <rect x="492" y="280" width="236" height="20" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="610" y="295" text-anchor="middle" font-size="13" fill="#b45309">qayta fokus...</text>
  <rect x="492" y="306" width="236" height="22" rx="4" fill="#fee2e2" stroke="#dc2626"/>
  <text x="610" y="322" text-anchor="middle" font-size="13" fill="#b91c1c">ish - chat uzdi</text>
  <text x="610" y="368" text-anchor="middle" font-size="15" font-weight="bold" fill="#dc2626">Natija: band edim, hech nima tugamadi</text>

  <text x="410" y="430" text-anchor="middle" font-size="14" fill="#334155">Sarflangan vaqt teng; uzluksizlik farqi natijani belgilaydi</text>
  <text x="410" y="452" text-anchor="middle" font-size="13" fill="#64748b">Sayoz kunda ko'p vaqt "qayta fokus"ga yo'qoladi, asl ishga emas</text>
</svg>
