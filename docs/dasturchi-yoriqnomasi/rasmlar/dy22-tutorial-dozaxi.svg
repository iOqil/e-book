<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI">
  <title>Tutorial do'zaxi sikli (qamoq) va o'rgan-qur-o'rgan spiral o'sishi taqqoslashi</title>
  <rect x="0" y="0" width="900" height="500" fill="#f8fafc"/>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Tutorial do'zaxi &#8596; Qurish orqali o'sish</text>
  <text x="450" y="62" text-anchor="middle" font-size="14" fill="#64748b">Bir xil vaqt, butunlay boshqa natija</text>

  <!-- LEFT: tutorial hell loop (a closed cage cycle) -->
  <rect x="30" y="90" width="400" height="380" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="230" y="120" text-anchor="middle" font-size="17" font-weight="bold" fill="#991b1b">&#10060; Tutorial do'zaxi (yopiq sikl)</text>

  <circle cx="150" cy="180" r="38" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <text x="150" y="178" text-anchor="middle" font-size="14" fill="#7f1d1d">darslik</text>
  <text x="150" y="194" text-anchor="middle" font-size="13" fill="#7f1d1d">ko'r</text>

  <circle cx="310" cy="180" r="38" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <text x="310" y="178" text-anchor="middle" font-size="14" fill="#7f1d1d">darslik</text>
  <text x="310" y="194" text-anchor="middle" font-size="13" fill="#7f1d1d">ko'r</text>

  <circle cx="230" cy="320" r="38" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <text x="230" y="318" text-anchor="middle" font-size="14" fill="#7f1d1d">darslik</text>
  <text x="230" y="334" text-anchor="middle" font-size="13" fill="#7f1d1d">ko'r</text>

  <!-- loop arrows -->
  <path d="M 188 180 L 272 180" stroke="#dc2626" stroke-width="3" fill="none"/>
  <polygon points="272,180 260,174 260,186" fill="#dc2626"/>
  <path d="M 300 215 L 250 285" stroke="#dc2626" stroke-width="3" fill="none"/>
  <polygon points="250,285 256,272 263,281" fill="#dc2626"/>
  <path d="M 210 285 L 160 215" stroke="#dc2626" stroke-width="3" fill="none"/>
  <polygon points="160,215 167,228 174,219" fill="#dc2626"/>

  <text x="230" y="400" text-anchor="middle" font-size="14" fill="#991b1b">"Tushunyapman" tuyg'usi, lekin...</text>
  <text x="230" y="426" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">bo'sh ekranda 0 dan qura olmaydi</text>
  <text x="230" y="452" text-anchor="middle" font-size="13" fill="#64748b">bilim oshmaydi &#8594; o'sha joyda aylanadi</text>

  <!-- RIGHT: build spiral, upward -->
  <rect x="470" y="90" width="400" height="380" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="670" y="120" text-anchor="middle" font-size="17" font-weight="bold" fill="#166534">&#9989; O'rgan &#8594; qur &#8594; o'rgan</text>

  <!-- ascending spiral steps -->
  <circle cx="540" cy="410" r="30" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="540" y="408" text-anchor="middle" font-size="13" fill="#14532d">ozgina</text>
  <text x="540" y="424" text-anchor="middle" font-size="13" fill="#14532d">o'rgan</text>

  <circle cx="640" cy="330" r="30" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
  <text x="640" y="328" text-anchor="middle" font-size="14" fill="#14532d">qur</text>
  <text x="640" y="344" text-anchor="middle" font-size="13" fill="#14532d">(qotib qol)</text>

  <circle cx="740" cy="250" r="30" fill="#4ade80" stroke="#15803d" stroke-width="2"/>
  <text x="740" y="248" text-anchor="middle" font-size="13" fill="#14532d">kerakni</text>
  <text x="740" y="264" text-anchor="middle" font-size="13" fill="#14532d">o'rgan</text>

  <circle cx="800" cy="175" r="30" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
  <text x="800" y="173" text-anchor="middle" font-size="14" fill="#ffffff">yana</text>
  <text x="800" y="189" text-anchor="middle" font-size="13" fill="#ffffff">qur</text>

  <path d="M 568 392 L 614 350" stroke="#16a34a" stroke-width="3" fill="none"/>
  <polygon points="614,350 600,352 608,362" fill="#16a34a"/>
  <path d="M 668 312 L 714 270" stroke="#16a34a" stroke-width="3" fill="none"/>
  <polygon points="714,270 700,272 708,282" fill="#16a34a"/>
  <path d="M 768 232 L 778 200" stroke="#16a34a" stroke-width="3" fill="none"/>
  <polygon points="778,200 766,206 776,212" fill="#16a34a"/>

  <text x="670" y="452" text-anchor="middle" font-size="14" fill="#166534">Har sikl: real ko'nikma + ishlaydigan loyiha</text>
</svg>
