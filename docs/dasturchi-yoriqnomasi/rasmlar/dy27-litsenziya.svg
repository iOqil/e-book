<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI">
  <title>Ochiq kod litsenziyalari spektri: erkin (public domain), permissive (MIT, Apache) va copyleft (LGPL, GPL, AGPL) erkinlik va majburiyat o'qida</title>
  <rect x="0" y="0" width="900" height="470" fill="#f8fafc"/>

  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Ochiq kod litsenziyalari spektri</text>
  <text x="450" y="60" text-anchor="middle" font-size="14" fill="#64748b">Chapdan o'ngga: ko'proq erkinlik berish &#8594; ko'proq majburiyat yuklash</text>

  <!-- axis -->
  <line x1="70" y1="160" x2="830" y2="160" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="830,160 818,153 818,167" fill="#94a3b8"/>
  <text x="90" y="148" text-anchor="start" font-size="13" fill="#16a34a" font-weight="bold">erkinroq (ruxsat)</text>
  <text x="810" y="148" text-anchor="end" font-size="13" fill="#dc2626" font-weight="bold">majburiyatliroq (himoya)</text>

  <!-- Public domain -->
  <rect x="60" y="180" width="150" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="135" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">Public domain</text>
  <text x="135" y="227" text-anchor="middle" font-size="13" fill="#334155">CC0, Unlicense</text>
  <line x1="135" y1="180" x2="135" y2="160" stroke="#16a34a" stroke-width="2"/>

  <!-- Permissive -->
  <rect x="240" y="180" width="200" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="340" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">Permissive (ruxsatli)</text>
  <text x="340" y="227" text-anchor="middle" font-size="13" fill="#334155">MIT, Apache 2.0, BSD</text>
  <line x1="340" y1="180" x2="340" y2="160" stroke="#2563eb" stroke-width="2"/>

  <!-- Weak copyleft -->
  <rect x="470" y="180" width="170" height="60" rx="10" fill="#fef9c3" stroke="#f59e0b" stroke-width="2"/>
  <text x="555" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">Zaif copyleft</text>
  <text x="555" y="227" text-anchor="middle" font-size="13" fill="#334155">LGPL, MPL 2.0</text>
  <line x1="555" y1="180" x2="555" y2="160" stroke="#f59e0b" stroke-width="2"/>

  <!-- Strong copyleft -->
  <rect x="670" y="180" width="170" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="755" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">Kuchli copyleft</text>
  <text x="755" y="227" text-anchor="middle" font-size="13" fill="#334155">GPL, AGPL</text>
  <line x1="755" y1="180" x2="755" y2="160" stroke="#dc2626" stroke-width="2"/>

  <!-- explanation boxes -->
  <rect x="60" y="290" width="380" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="250" y="316" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">Permissive: "ishlat, faqat nomimni saqla"</text>
  <text x="80" y="342" font-size="13" fill="#334155">Yopiq mahsulotga ham qo'sha olasiz</text>
  <text x="80" y="364" font-size="13" fill="#334155">Manbani ochishga majbur emassiz</text>
  <text x="80" y="386" font-size="13" fill="#334155">Litsenziya/copyright matnini saqlash shart</text>

  <rect x="460" y="290" width="380" height="120" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="650" y="316" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">Copyleft: "erkinlikni keyingiga ham o'tkaz"</text>
  <text x="480" y="342" font-size="13" fill="#334155">Hosila ish ham bir xil litsenziyada bo'lsin</text>
  <text x="480" y="364" font-size="13" fill="#334155">Manbani ochish shart bo'lishi mumkin</text>
  <text x="480" y="386" font-size="13" fill="#334155">AGPL: tarmoq orqali xizmat ham hisoblanadi</text>

  <text x="450" y="445" text-anchor="middle" font-size="13" fill="#64748b">Litsenziya = ruxsatnoma. "Ochiq" demak "bemalol nusxala" degani EMAS — shartlarni o'qing</text>
</svg>
