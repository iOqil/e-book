<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" font-family="Segoe UI">
  <title>Nomlash naqshlari: o'zgaruvchi ot, funksiya fe'l, boolean is/has, klass ot, kollektsiya ko'plik</title>
  <rect x="0" y="0" width="860" height="500" fill="#f8fafc"/>

  <text x="430" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Har element turining nomlash naqshi</text>
  <text x="430" y="64" text-anchor="middle" font-size="14" fill="#64748b">Nom turini ko'rib, uning roli darhol tushunilsin</text>

  <!-- card 1: ozgaruvchi -->
  <rect x="40" y="96" width="380" height="110" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="60" y="128" font-size="17" font-weight="bold" fill="#2563eb">O'zgaruvchi = ot</text>
  <text x="60" y="154" font-size="14" fill="#64748b">narsani bildiradi</text>
  <text x="60" y="184" font-size="14" fill="#16a34a" font-family="monospace">foydalanuvchi, narx, sana</text>

  <!-- card 2: funksiya -->
  <rect x="440" y="96" width="380" height="110" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="460" y="128" font-size="17" font-weight="bold" fill="#7c3aed">Funksiya = fe'l</text>
  <text x="460" y="154" font-size="14" fill="#64748b">harakatni bildiradi</text>
  <text x="460" y="184" font-size="14" fill="#16a34a" font-family="monospace">hisobla(), yubor(), oluvchi()</text>

  <!-- card 3: boolean -->
  <rect x="40" y="222" width="380" height="110" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="60" y="254" font-size="17" font-weight="bold" fill="#16a34a">Boolean = is / has / can</text>
  <text x="60" y="280" font-size="14" fill="#64748b">ha/yo'q savoliga javob</text>
  <text x="60" y="310" font-size="14" fill="#16a34a" font-family="monospace">isFaol, hasRuxsat, canEdit</text>

  <!-- card 4: klass -->
  <rect x="440" y="222" width="380" height="110" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="460" y="254" font-size="17" font-weight="bold" fill="#f59e0b">Klass = ot (bosh harf)</text>
  <text x="460" y="280" font-size="14" fill="#64748b">tushuncha/tip</text>
  <text x="460" y="310" font-size="14" fill="#16a34a" font-family="monospace">Foydalanuvchi, Buyurtma</text>

  <!-- card 5: kollektsiya -->
  <rect x="40" y="348" width="380" height="110" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
  <text x="60" y="380" font-size="17" font-weight="bold" fill="#dc2626">Kollektsiya = ko'plik</text>
  <text x="60" y="406" font-size="14" fill="#64748b">ichida ko'p element bor</text>
  <text x="60" y="436" font-size="14" fill="#16a34a" font-family="monospace">foydalanuvchilar, narxlar</text>

  <!-- card 6: konstanta -->
  <rect x="440" y="348" width="380" height="110" rx="12" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
  <text x="460" y="380" font-size="17" font-weight="bold" fill="#1e293b">Konstanta = KATTA_HARF</text>
  <text x="460" y="406" font-size="14" fill="#64748b">o'zgarmas qiymat</text>
  <text x="460" y="436" font-size="14" fill="#16a34a" font-family="monospace">MAX_URINISH, PI, SOLIQ_FOIZ</text>

  <text x="430" y="484" text-anchor="middle" font-size="13" fill="#64748b">Naqsh izchil bo'lsa, nomning shakli uning vazifasini aytib turadi</text>
</svg>
