<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="Segoe UI">
  <title>Vaqt o'tishi bilan to'lanmagan texnik qarz foizi o'sib, yetkazib berish tezligi pasayadi</title>
  <rect x="0" y="0" width="880" height="480" fill="#f8fafc"/>

  <text x="440" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Texnik qarz foizi: vaqt o'tishi bilan tezlik pasayadi</text>
  <text x="440" y="60" text-anchor="middle" font-size="14" fill="#64748b">To'lanmagan qarz har yangi o'zgarishni sekinlashtiradi</text>

  <!-- axes -->
  <line x1="90" y1="120" x2="90" y2="410" stroke="#1e293b" stroke-width="2"/>
  <line x1="90" y1="410" x2="820" y2="410" stroke="#1e293b" stroke-width="2"/>
  <text x="64" y="130" text-anchor="middle" font-size="13" fill="#64748b">yuqori</text>
  <text x="64" y="405" text-anchor="middle" font-size="13" fill="#64748b">past</text>
  <text x="44" y="270" text-anchor="middle" font-size="14" fill="#334155" transform="rotate(-90 44 270)">Yetkazish tezligi</text>
  <text x="455" y="440" text-anchor="middle" font-size="14" fill="#334155">Vaqt (oylar)</text>

  <!-- healthy line: managed debt, stays high -->
  <polyline points="90,150 240,160 390,172 540,180 690,188 820,196" fill="none" stroke="#16a34a" stroke-width="3"/>
  <circle cx="820" cy="196" r="5" fill="#16a34a"/>
  <rect x="610" y="120" width="210" height="34" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="715" y="142" text-anchor="middle" font-size="13" fill="#166534">Qarz boshqarilgan: tezlik barqaror</text>

  <!-- debt line: ignored, drops -->
  <polyline points="90,150 240,178 390,222 540,282 690,348 820,395" fill="none" stroke="#dc2626" stroke-width="3"/>
  <circle cx="820" cy="395" r="5" fill="#dc2626"/>

  <!-- interest gap shading hints -->
  <line x1="540" y1="180" x2="540" y2="282" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="556" y="238" font-size="13" fill="#b45309">foiz (interest)</text>
  <line x1="690" y1="188" x2="690" y2="348" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="558" y="335" font-size="13" fill="#b45309">tobora kengayadi</text>

  <rect x="540" y="356" width="270" height="34" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="675" y="378" text-anchor="middle" font-size="13" fill="#991b1b">E'tiborsiz qarz: har feature sekinroq</text>

  <text x="180" y="138" font-size="13" fill="#64748b" font-weight="bold">Boshlang'ich tezlik bir xil</text>
</svg>
