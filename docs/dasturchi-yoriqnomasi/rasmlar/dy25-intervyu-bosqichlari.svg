<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Segoe UI">
  <title>Texnik intervyu jarayonining voronkasi: skrining, texnik, tizim dizayni, behavioral va taklif bosqichlari</title>
  <rect x="0" y="0" width="900" height="540" fill="#f8fafc"/>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Intervyu jarayoni: voronka</text>
  <text x="450" y="62" text-anchor="middle" font-size="14" fill="#64748b">Har bosqichda nomzodlar soni kamayadi; har biri alohida ko'nikma</text>

  <!-- funnel stages -->
  <rect x="170" y="90" width="560" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">1. Skrining (recruiter / HR)</text>
  <text x="450" y="140" text-anchor="middle" font-size="13" fill="#334155">rezyume, qisqa suhbat, ish haqi kutilmasi, asosiy moslik</text>

  <rect x="210" y="172" width="480" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">2. Texnik (coding)</text>
  <text x="450" y="222" text-anchor="middle" font-size="13" fill="#334155">algoritm + ma'lumotlar strukturasi, jonli kodlash, jarayon</text>

  <rect x="250" y="254" width="400" height="64" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="282" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">3. Tizim dizayni (mid+)</text>
  <text x="450" y="304" text-anchor="middle" font-size="13" fill="#334155">talab, taxminiy hisob, komponent, trade-off</text>

  <rect x="290" y="336" width="320" height="64" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="450" y="364" text-anchor="middle" font-size="16" font-weight="bold" fill="#6d28d9">4. Behavioral (STAR)</text>
  <text x="450" y="386" text-anchor="middle" font-size="13" fill="#334155">konflikt, xato, hamkorlik hikoyalari</text>

  <rect x="330" y="418" width="240" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="450" y="446" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">5. Taklif (offer)</text>
  <text x="450" y="468" text-anchor="middle" font-size="13" fill="#334155">muzokara, paket, qaror</text>

  <!-- arrows down -->
  <line x1="450" y1="154" x2="450" y2="172" stroke="#94a3b8" stroke-width="3"/>
  <line x1="450" y1="236" x2="450" y2="254" stroke="#94a3b8" stroke-width="3"/>
  <line x1="450" y1="318" x2="450" y2="336" stroke="#94a3b8" stroke-width="3"/>
  <line x1="450" y1="400" x2="450" y2="418" stroke="#94a3b8" stroke-width="3"/>

  <text x="765" y="290" text-anchor="middle" font-size="13" fill="#64748b">rad javobi</text>
  <text x="765" y="312" text-anchor="middle" font-size="13" fill="#64748b">har bosqichda</text>
  <text x="765" y="334" text-anchor="middle" font-size="13" fill="#64748b">mumkin</text>
</svg>
