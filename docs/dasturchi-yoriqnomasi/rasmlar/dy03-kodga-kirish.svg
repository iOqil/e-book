<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="Segoe UI">
  <title>Yangi loyihaga kirish qadamlari: README dan bitta oqimni kuzatishgacha</title>
  <rect x="0" y="0" width="880" height="470" fill="#f8fafc"/>

  <text x="440" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Yangi kod bazasiga kirishning 5 qadami</text>
  <text x="440" y="68" text-anchor="middle" font-size="14" fill="#64748b">Hammasini birdan emas, qadam-baqadam</text>

  <!-- Qadam 1 -->
  <rect x="40" y="110" width="150" height="90" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="115" y="142" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563eb">1. README</text>
  <text x="115" y="168" text-anchor="middle" font-size="13" fill="#334155">Loyiha nima?</text>
  <text x="115" y="188" text-anchor="middle" font-size="13" fill="#334155">Nega bor?</text>

  <!-- Qadam 2 -->
  <rect x="225" y="110" width="150" height="90" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="300" y="142" text-anchor="middle" font-size="16" font-weight="bold" fill="#16a34a">2. Ishga tushir</text>
  <text x="300" y="168" text-anchor="middle" font-size="13" fill="#334155">Lokal'da yur,</text>
  <text x="300" y="188" text-anchor="middle" font-size="13" fill="#334155">testni o'tkaz</text>

  <!-- Qadam 3 -->
  <rect x="410" y="110" width="150" height="90" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="485" y="142" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c3aed">3. Tuzilish</text>
  <text x="485" y="168" text-anchor="middle" font-size="13" fill="#334155">Papkalar,</text>
  <text x="485" y="188" text-anchor="middle" font-size="13" fill="#334155">testlar qayerda</text>

  <!-- Qadam 4 -->
  <rect x="595" y="110" width="150" height="90" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="670" y="142" text-anchor="middle" font-size="15" font-weight="bold" fill="#f59e0b">4. Kirish nuqtasi</text>
  <text x="670" y="168" text-anchor="middle" font-size="13" fill="#334155">main / index</text>
  <text x="670" y="188" text-anchor="middle" font-size="13" fill="#334155">qayerdan boshlanadi</text>

  <!-- Strelkalar 1->2->3->4 -->
  <path d="M190 155 L222 155" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah)"/>
  <path d="M375 155 L407 155" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah)"/>
  <path d="M560 155 L592 155" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- Qadam 5 (pastda, kengroq) -->
  <rect x="225" y="280" width="430" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="440" y="316" text-anchor="middle" font-size="17" font-weight="bold" fill="#2563eb">5. Bitta oqimni kuzat</text>
  <text x="440" y="344" text-anchor="middle" font-size="14" fill="#334155">Bitta tugma / endpoint / buyruqni tanla,</text>
  <text x="440" y="366" text-anchor="middle" font-size="14" fill="#334155">uni boshidan oxirigacha ip kabi tort</text>

  <!-- 4 -> 5 strelka -->
  <path d="M670 200 L670 330 L660 330" stroke="#f59e0b" stroke-width="2.5" fill="none" marker-end="url(#aho)"/>

  <text x="440" y="425" text-anchor="middle" font-size="14" fill="#64748b">Maqsad: butun loyihani emas, ishlaydigan mental model qurish</text>
  <text x="440" y="450" text-anchor="middle" font-size="13" fill="#16a34a">Har qadamda qayd yozing va o'zingizga tushuntiring</text>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#94a3b8"/>
    </marker>
    <marker id="aho" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#f59e0b"/>
    </marker>
  </defs>
</svg>
