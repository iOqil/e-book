<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520">
  <title>Yomon savol va yaxshi savol anatomiyasi: kontekst, sinov, kutilgan va xato matni</title>
  <rect width="860" height="520" fill="#f8fafc"/>
  <text x="430" y="38" font-family="Segoe UI" font-size="22" font-weight="700" fill="#1e293b" text-anchor="middle">Yaxshi savol anatomiyasi</text>

  <!-- BAD card -->
  <rect x="30" y="70" width="370" height="410" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="30" y="70" width="370" height="46" rx="12" fill="#fee2e2"/>
  <text x="52" y="100" font-family="Segoe UI" font-size="18" font-weight="700" fill="#dc2626">&#10060; Yomon savol</text>

  <rect x="52" y="138" width="326" height="64" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="68" y="166" font-family="Segoe UI" font-size="16" fill="#1e293b">"Ishlamayapti, yordam!"</text>
  <text x="68" y="190" font-family="Segoe UI" font-size="14" fill="#64748b">"Kodim xato beryapti, nega?"</text>

  <text x="52" y="240" font-family="Segoe UI" font-size="15" font-weight="700" fill="#dc2626">Nima yetishmaydi:</text>
  <text x="60" y="270" font-family="Segoe UI" font-size="14" fill="#334155">&#8226; Kontekst yo'q</text>
  <text x="60" y="298" font-family="Segoe UI" font-size="14" fill="#334155">&#8226; Nima sinaganini aytmaydi</text>
  <text x="60" y="326" font-family="Segoe UI" font-size="14" fill="#334155">&#8226; Aniq xato matni yo'q</text>
  <text x="60" y="354" font-family="Segoe UI" font-size="14" fill="#334155">&#8226; Kutilgan natija noma'lum</text>

  <rect x="52" y="386" width="326" height="74" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="68" y="414" font-family="Segoe UI" font-size="14" fill="#64748b">Javob beruvchi 5 marta</text>
  <text x="68" y="436" font-family="Segoe UI" font-size="14" fill="#64748b">qayta so'rashi kerak &#8594;</text>
  <text x="68" y="454" font-family="Segoe UI" font-size="14" font-weight="700" fill="#dc2626">vaqt isrof</text>

  <!-- GOOD card -->
  <rect x="460" y="70" width="370" height="410" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="460" y="70" width="370" height="46" rx="12" fill="#dcfce7"/>
  <text x="482" y="100" font-family="Segoe UI" font-size="18" font-weight="700" fill="#16a34a">&#9989; Yaxshi savol</text>

  <rect x="482" y="132" width="326" height="44" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="496" y="151" font-family="Segoe UI" font-size="14" font-weight="700" fill="#16a34a">1. Kontekst</text>
  <text x="496" y="169" font-family="Segoe UI" font-size="13" fill="#334155">"X funksiyada login form'ni yozyapman"</text>

  <rect x="482" y="184" width="326" height="44" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="496" y="203" font-family="Segoe UI" font-size="14" font-weight="700" fill="#16a34a">2. Nima sinadim</text>
  <text x="496" y="221" font-family="Segoe UI" font-size="13" fill="#334155">"null tekshirdim, log qo'ydim"</text>

  <rect x="482" y="236" width="326" height="44" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="496" y="255" font-family="Segoe UI" font-size="14" font-weight="700" fill="#16a34a">3. Kutilgan vs haqiqiy</text>
  <text x="496" y="273" font-family="Segoe UI" font-size="13" fill="#334155">"token kutdim, lekin undefined keldi"</text>

  <rect x="482" y="288" width="326" height="44" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="496" y="307" font-family="Segoe UI" font-size="14" font-weight="700" fill="#16a34a">4. Aniq xato matni</text>
  <text x="496" y="325" font-family="Segoe UI" font-size="13" fill="#334155">"TypeError: cannot read 'id' of null"</text>

  <rect x="482" y="344" width="326" height="40" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="496" y="363" font-family="Segoe UI" font-size="14" font-weight="700" fill="#16a34a">5. Muhit</text>
  <text x="496" y="380" font-family="Segoe UI" font-size="13" fill="#334155">"Node 20, kecha ishlardi, bugun yo'q"</text>

  <rect x="482" y="396" width="326" height="64" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="498" y="424" font-family="Segoe UI" font-size="14" fill="#64748b">Javob beruvchi darrov</text>
  <text x="498" y="446" font-family="Segoe UI" font-size="14" font-weight="700" fill="#16a34a">muammoni ko'radi &#8594; bir o'qishda yordam</text>
</svg>
