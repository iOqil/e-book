<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Segoe UI">
  <title>Yomon sharh (qo'pol, noaniq, shaxsga) va yaxshi sharh (mehribon, aniq, sababli, muammoga) taqqoslash</title>
  <rect x="0" y="0" width="880" height="500" fill="#f8fafc"/>

  <text x="440" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Bir xil muammo, ikki xil sharh</text>
  <text x="440" y="62" text-anchor="middle" font-size="14" fill="#64748b">Sharh kodga emas, muammoga; ayblamasdan, sabab bilan</text>

  <!-- BAD column -->
  <rect x="40" y="90" width="380" height="370" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="230" y="122" text-anchor="middle" font-size="17" font-weight="bold" fill="#991b1b">&#10060; Yomon sharh</text>

  <rect x="62" y="142" width="336" height="58" rx="8" fill="#ffffff" stroke="#fca5a5"/>
  <text x="78" y="166" font-size="14" fill="#1e293b">"Bu noto'g'ri. Nega bunday yozding?"</text>
  <text x="78" y="188" font-size="13" fill="#dc2626">shaxsga, ayblovchi ohang</text>

  <rect x="62" y="212" width="336" height="58" rx="8" fill="#ffffff" stroke="#fca5a5"/>
  <text x="78" y="236" font-size="14" fill="#1e293b">"Buni tuzat."</text>
  <text x="78" y="258" font-size="13" fill="#dc2626">noaniq — nimani? nega?</text>

  <rect x="62" y="282" width="336" height="58" rx="8" fill="#ffffff" stroke="#fca5a5"/>
  <text x="78" y="306" font-size="14" fill="#1e293b">"Bunaqa kodni qabul qilmayman."</text>
  <text x="78" y="328" font-size="13" fill="#dc2626">bloker bilan nit aralash, qattiq</text>

  <rect x="62" y="352" width="336" height="58" rx="8" fill="#ffffff" stroke="#fca5a5"/>
  <text x="78" y="376" font-size="14" fill="#1e293b">"???"</text>
  <text x="78" y="398" font-size="13" fill="#dc2626">izohsiz, hurmatsiz</text>

  <text x="230" y="442" text-anchor="middle" font-size="13" fill="#991b1b">Natija: mudofaa, ranjish, sekin oqim</text>

  <!-- GOOD column -->
  <rect x="460" y="90" width="380" height="370" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="650" y="122" text-anchor="middle" font-size="17" font-weight="bold" fill="#166534">&#9989; Yaxshi sharh</text>

  <rect x="482" y="142" width="336" height="58" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="498" y="164" font-size="14" fill="#1e293b">"savol: bu yerda null kelsa nima</text>
  <text x="498" y="183" font-size="14" fill="#1e293b">bo'ladi? Test ko'rmadim."</text>

  <rect x="482" y="212" width="336" height="58" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="498" y="234" font-size="14" fill="#1e293b">"blocking: bu so'rov user'siz ham</text>
  <text x="498" y="253" font-size="14" fill="#1e293b">ishlaydi — xavfsizlik teshigi."</text>

  <rect x="482" y="282" width="336" height="58" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="498" y="304" font-size="14" fill="#1e293b">"nit: nomni 'd' o'rniga 'kunlar'</text>
  <text x="498" y="323" font-size="14" fill="#1e293b">qilsak o'qish osonroq. Majburiy emas."</text>

  <rect x="482" y="352" width="336" height="58" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="498" y="376" font-size="14" fill="#1e293b">"Bu retry mantig'i juda toza,</text>
  <text x="498" y="395" font-size="14" fill="#1e293b">o'rgandim &#128077;"</text>

  <text x="650" y="442" text-anchor="middle" font-size="13" fill="#166534">Natija: tushunish, ishonch, tez oqim</text>
</svg>
