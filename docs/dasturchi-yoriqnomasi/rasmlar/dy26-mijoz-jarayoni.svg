<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" font-family="Segoe UI">
  <title>Mijoz bilan ish oqimi: aloqa, TZ va shartnoma, oldindan depozit, bosqichli ish va to'lov, yetkazish va yakuniy to'lov bosqichlari</title>
  <rect x="0" y="0" width="920" height="440" fill="#f8fafc"/>

  <text x="460" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Mijoz bilan ish oqimi</text>
  <text x="460" y="62" text-anchor="middle" font-size="14" fill="#64748b">Har qadam himoya: yozma kelishuv va bosqichli to'lov ishonchni quradi</text>

  <!-- Step 1 -->
  <rect x="40" y="100" width="160" height="110" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="60" cy="124" r="13" fill="#2563eb"/>
  <text x="60" y="129" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">1</text>
  <text x="120" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">Aloqa</text>
  <text x="120" y="174" text-anchor="middle" font-size="13" fill="#334155">ehtiyojni tinglash,</text>
  <text x="120" y="192" text-anchor="middle" font-size="13" fill="#334155">moslikni tekshirish</text>

  <!-- Step 2 -->
  <rect x="240" y="100" width="160" height="110" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <circle cx="260" cy="124" r="13" fill="#16a34a"/>
  <text x="260" y="129" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">2</text>
  <text x="320" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">TZ + shartnoma</text>
  <text x="320" y="174" text-anchor="middle" font-size="13" fill="#334155">ko'lam, narx, muddat</text>
  <text x="320" y="192" text-anchor="middle" font-size="13" fill="#334155">yozma kelishuv</text>

  <!-- Step 3 -->
  <rect x="440" y="100" width="160" height="110" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="460" cy="124" r="13" fill="#f59e0b"/>
  <text x="460" y="129" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">3</text>
  <text x="520" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">Depozit</text>
  <text x="520" y="174" text-anchor="middle" font-size="13" fill="#334155">oldindan to'lov</text>
  <text x="520" y="192" text-anchor="middle" font-size="13" fill="#334155">(mas. 30-50%)</text>

  <!-- Step 4 -->
  <rect x="640" y="100" width="160" height="110" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="660" cy="124" r="13" fill="#7c3aed"/>
  <text x="660" y="129" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">4</text>
  <text x="720" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#6d28d9">Bosqichli ish</text>
  <text x="720" y="174" text-anchor="middle" font-size="13" fill="#334155">milestone + oraliq</text>
  <text x="720" y="192" text-anchor="middle" font-size="13" fill="#334155">to'lov + demo</text>

  <!-- arrows row 1 -->
  <line x1="200" y1="155" x2="234" y2="155" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="234,155 226,150 226,160" fill="#94a3b8"/>
  <line x1="400" y1="155" x2="434" y2="155" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="434,155 426,150 426,160" fill="#94a3b8"/>
  <line x1="600" y1="155" x2="634" y2="155" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="634,155 626,150 626,160" fill="#94a3b8"/>

  <!-- down arrow -->
  <line x1="720" y1="210" x2="720" y2="248" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="720,248 715,240 725,240" fill="#94a3b8"/>

  <!-- Step 5 -->
  <rect x="440" y="250" width="360" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="460" cy="274" r="13" fill="#2563eb"/>
  <text x="460" y="279" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">5</text>
  <text x="630" y="282" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">Yetkazish</text>
  <text x="630" y="304" text-anchor="middle" font-size="13" fill="#334155">qabul, hujjat, qo'llab-quvvatlash kelishuvi</text>

  <!-- left arrow -->
  <line x1="438" y1="290" x2="404" y2="290" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="404,290 412,285 412,295" fill="#94a3b8"/>

  <!-- Step 6 -->
  <rect x="40" y="250" width="360" height="80" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <circle cx="60" cy="274" r="13" fill="#16a34a"/>
  <text x="60" y="279" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">6</text>
  <text x="230" y="282" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">Yakuniy to'lov</text>
  <text x="230" y="304" text-anchor="middle" font-size="13" fill="#334155">qolgan summa + tavsiya/sharh so'rash</text>

  <rect x="40" y="356" width="760" height="52" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="420" y="378" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">Anti-naqsh: og'zaki kelishuv + 100% oxirida to'lov</text>
  <text x="420" y="398" text-anchor="middle" font-size="13" fill="#334155">= ko'lam o'sadi, mijoz g'oyib bo'ladi, isbot yo'q — eng ko'p frilans og'rig'i shu</text>
</svg>
