<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="Segoe UI">
  <title>Kod yoza olaman bilan muhandisman orasidagi jarlik</title>
  <rect x="0" y="0" width="860" height="460" fill="#f8fafc"/>

  <!-- Chap qirg'oq: Kod yoza olaman -->
  <rect x="30" y="90" width="270" height="300" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="165" y="130" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Kod yoza olaman</text>
  <text x="165" y="156" text-anchor="middle" font-size="13" fill="#64748b">(hunarning kichik qismi)</text>

  <text x="55" y="200" font-size="15" fill="#334155">- Sintaksisni bilaman</text>
  <text x="55" y="232" font-size="15" fill="#334155">- Vazifa berilsa yozaman</text>
  <text x="55" y="264" font-size="15" fill="#334155">- &quot;Ishladi&quot; = tamom</text>
  <text x="55" y="296" font-size="15" fill="#334155">- Faqat o'z faylim</text>
  <text x="55" y="328" font-size="15" fill="#334155">- &quot;Menga aytilmadi&quot;</text>
  <text x="55" y="360" font-size="15" fill="#334155">- Kod = maqsad</text>

  <!-- O'ng qirg'oq: Muhandisman -->
  <rect x="560" y="90" width="270" height="300" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="695" y="130" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Muhandisman</text>
  <text x="695" y="156" text-anchor="middle" font-size="13" fill="#64748b">(kod + qolgan hammasi)</text>

  <text x="585" y="200" font-size="15" fill="#16a34a">+ Muammoni tushunaman</text>
  <text x="585" y="232" font-size="15" fill="#16a34a">+ Kontekstni o'ylayman</text>
  <text x="585" y="264" font-size="15" fill="#16a34a">+ Oqibat uchun mas'ulman</text>
  <text x="585" y="296" font-size="15" fill="#16a34a">+ Jamoa bilan ishlayman</text>
  <text x="585" y="328" font-size="15" fill="#16a34a">+ Qaror qabul qilaman</text>
  <text x="585" y="360" font-size="15" fill="#16a34a">Kod = ta'sir vositasi</text>

  <!-- Jarlik (o'rtada) -->
  <path d="M320 90 L320 400 L420 440 L420 90 Z" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <path d="M540 90 L540 400 L440 440 L440 90 Z" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="430" y="55" text-anchor="middle" font-size="18" font-weight="bold" fill="#dc2626">JARLIK</text>
  <text x="430" y="240" text-anchor="middle" font-size="14" fill="#dc2626" transform="rotate(90 430 240)">mas'uliyat &#183; kontekst &#183; jamoa &#183; qaror</text>

  <!-- Ko'prik -->
  <path d="M300 110 L560 110" stroke="#f59e0b" stroke-width="5" stroke-dasharray="10 6"/>
  <text x="430" y="100" text-anchor="middle" font-size="13" fill="#f59e0b">bu kitob = ko'prik</text>
</svg>
