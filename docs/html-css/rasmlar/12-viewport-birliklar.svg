<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>Viewport birliklar: vw ekran kengligining foizi, vh balandligining foizi</title>
  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Viewport birliklar — ekranga nisbatan o'lcham</text>
  <text x="360" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Viewport = brauzer oynasining ko'rinadigan qismi</text>

  <!-- ekran (viewport) ramkasi -->
  <rect x="90" y="90" width="540" height="290" rx="6" fill="#ffffff" stroke="#475569" stroke-width="3"/>
  <text x="360" y="110" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">viewport (100vw &#215; 100vh)</text>

  <!-- kenglik o'lchami (yuqorida) -->
  <line x1="90" y1="128" x2="630" y2="128" stroke="#2563eb" stroke-width="2"/>
  <line x1="90" y1="122" x2="90" y2="134" stroke="#2563eb" stroke-width="2"/>
  <line x1="630" y1="122" x2="630" y2="134" stroke="#2563eb" stroke-width="2"/>
  <rect x="300" y="118" width="120" height="22" rx="4" fill="#f8fafc"/>
  <text x="360" y="134" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">kenglik = 100vw</text>

  <!-- 50vw quti -->
  <rect x="120" y="160" width="240" height="90" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="240" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e3a8a">width: 50vw</text>
  <text x="240" y="226" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e3a8a">ekran kengligining yarmi</text>

  <!-- 100vh balandlik o'qi (chapda) -->
  <line x1="430" y1="160" x2="430" y2="350" stroke="#16a34a" stroke-width="2"/>
  <line x1="424" y1="160" x2="436" y2="160" stroke="#16a34a" stroke-width="2"/>
  <line x1="424" y1="350" x2="436" y2="350" stroke="#16a34a" stroke-width="2"/>

  <!-- 30vh quti -->
  <rect x="450" y="160" width="150" height="120" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="525" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#14532d">height: 30vh</text>
  <text x="525" y="234" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#14532d">balandlikning</text>
  <text x="525" y="252" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#14532d">30 foizi</text>

  <text x="408" y="345" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a" transform="rotate(-90 408 345)">balandlik = 100vh</text>

  <!-- izoh qatori -->
  <text x="360" y="406" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">1vw = ekran kengligining 1% · 1vh = balandligining 1%</text>
  <text x="360" y="428" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#f59e0b">vmin = kichigi, vmax = kattasi (kenglik/balandlikdan)</text>
</svg>
