<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440">
  <title>Skrinrider landmark'lar ro'yxatini qanday tuzadi va foydalanuvchi ular orasida sakraydi</title>
  <rect x="0" y="0" width="640" height="440" fill="#f8fafc"/>

  <text x="320" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Skrinrider sahifani "landmark'lar ro'yxati" sifatida ko'radi</text>

  <!-- Chap: sahifa -->
  <rect x="30" y="56" width="250" height="350" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="155" y="80" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#475569">Sahifa (HTML)</text>

  <rect x="46" y="92" width="218" height="44" rx="6" fill="#e2e8f0" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="119" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">&lt;header&gt;</text>

  <rect x="46" y="144" width="218" height="44" rx="6" fill="#e2e8f0" stroke="#16a34a" stroke-width="2"/>
  <text x="155" y="171" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">&lt;nav&gt;</text>

  <rect x="46" y="196" width="218" height="120" rx="6" fill="#e2e8f0" stroke="#f59e0b" stroke-width="2"/>
  <text x="155" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">&lt;main&gt;</text>
  <text x="155" y="270" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Asosiy matn,</text>
  <text x="155" y="288" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">sarlavhalar, rasmlar</text>

  <rect x="46" y="324" width="218" height="44" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="155" y="351" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">&lt;footer&gt;</text>

  <!-- Strelka -->
  <defs>
    <marker id="sr-arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <line x1="288" y1="230" x2="338" y2="230" stroke="#475569" stroke-width="3" marker-end="url(#sr-arrow)"/>
  <text x="313" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">o'qiydi</text>

  <!-- O'ng: skrinrider ro'yxati -->
  <rect x="350" y="56" width="260" height="350" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="80" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">Landmark menyusi (D klavishi)</text>

  <rect x="368" y="96" width="224" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="382" y="121" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">1. Banner (header)</text>

  <rect x="368" y="144" width="224" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="382" y="169" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">2. Navigation (nav)</text>

  <rect x="368" y="192" width="224" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="382" y="217" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">3. Main (main)</text>

  <rect x="368" y="240" width="224" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="382" y="265" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">4. Contentinfo (footer)</text>

  <text x="480" y="312" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Ko'r foydalanuvchi to'g'ridan-to'g'ri</text>
  <text x="480" y="330" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">"Main"ga sakrab, menyuni o'tkazib</text>
  <text x="480" y="348" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yuboradi. Div'larda bu ro'yxat</text>
  <text x="480" y="366" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626" font-weight="bold">bo'sh bo'lar edi.</text>
</svg>
