<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480">
  <title>align-items qiymatlari: itemlar cross o'q (ko'ndalang) bo'ylab qanday tekislanadi</title>
  <rect x="0" y="0" width="760" height="480" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">align-items — cross o'q bo'ylab tekislash</text>
  <text x="380" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">row holatida cross o'q vertikal: itemlar konteyner balandligida qanday turadi</text>

  <!-- stretch -->
  <text x="130" y="90" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#1e293b">stretch (standart)</text>
  <rect x="40" y="100" width="180" height="170" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="56" y="112" width="44" height="146" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="108" y="112" width="44" height="146" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="160" y="112" width="44" height="146" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="292" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">to'liq balandlikka cho'ziladi</text>

  <!-- flex-start -->
  <text x="380" y="90" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#1e293b">flex-start</text>
  <rect x="290" y="100" width="180" height="170" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="306" y="112" width="44" height="50" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="358" y="112" width="44" height="74" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="410" y="112" width="44" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="292" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yuqoriga yopishadi</text>

  <!-- flex-end -->
  <text x="630" y="90" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#1e293b">flex-end</text>
  <rect x="540" y="100" width="180" height="170" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="556" y="208" width="44" height="50" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="608" y="184" width="44" height="74" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="660" y="218" width="44" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="630" y="292" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">pastga yopishadi</text>

  <!-- center -->
  <text x="195" y="338" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#1e293b">center</text>
  <rect x="105" y="348" width="180" height="100" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="121" y="373" width="44" height="50" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="173" y="365" width="44" height="66" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="225" y="378" width="44" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="195" y="470" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">cross o'q markaziga</text>

  <!-- baseline -->
  <text x="565" y="338" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#1e293b">baseline</text>
  <rect x="475" y="348" width="180" height="100" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <line x1="483" y1="408" x2="647" y2="408" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="491" y="372" width="44" height="36" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="513" y="398" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#2563eb">Aa</text>
  <rect x="543" y="360" width="44" height="48" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="565" y="398" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="21" fill="#2563eb">Aa</text>
  <rect x="595" y="380" width="44" height="28" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="617" y="399" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">Aa</text>
  <text x="565" y="470" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">matn tag chizig'i tekis</text>
</svg>
