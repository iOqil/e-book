<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
  <title>@keyframes vaqt o'qi: 0%, 50% va 100% bosqichlarda element holatining o'zgarishi</title>
  <defs>
    <marker id="oq18k" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>

  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">@keyframes bosqichlari: 0% &#8594; 50% &#8594; 100%</text>
  <text x="380" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">har foiz — bir tugun (keyframe); brauzer oraliqlarni avtomatik to'ldiradi</text>

  <!-- 0% panel -->
  <rect x="40" y="90" width="200" height="190" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="140" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">0%</text>
  <rect x="110" y="200" width="60" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2" opacity="0.4"/>
  <text x="140" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">opacity: 0</text>
  <text x="140" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">past, kichik</text>

  <!-- 50% panel -->
  <rect x="280" y="90" width="200" height="190" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">50%</text>
  <rect x="340" y="180" width="80" height="80" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2" opacity="0.7"/>
  <text x="380" y="155" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">opacity: 0.7</text>
  <text x="380" y="173" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tepada, kattaroq</text>

  <!-- 100% panel -->
  <rect x="520" y="90" width="200" height="190" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="620" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#f59e0b">100%</text>
  <rect x="585" y="190" width="70" height="70" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="620" y="155" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">opacity: 1</text>
  <text x="620" y="173" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">joyida, to'liq</text>

  <!-- bog'lovchi strelkalar -->
  <line x1="240" y1="185" x2="278" y2="185" stroke="#475569" stroke-width="2" marker-end="url(#oq18k)"/>
  <line x1="480" y1="185" x2="518" y2="185" stroke="#475569" stroke-width="2" marker-end="url(#oq18k)"/>

  <!-- vaqt o'qi -->
  <line x1="40" y1="330" x2="720" y2="330" stroke="#475569" stroke-width="2.5" marker-end="url(#oq18k)"/>
  <circle cx="140" cy="330" r="6" fill="#2563eb"/>
  <circle cx="380" cy="330" r="6" fill="#16a34a"/>
  <circle cx="620" cy="330" r="6" fill="#f59e0b"/>
  <text x="140" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">boshi (0s)</text>
  <text x="380" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">o'rtasi</text>
  <text x="620" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">oxiri (duration)</text>

  <text x="380" y="396" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">animation: paydoBol 2s ease forwards;  — 2s ichida 0% dan 100% gacha</text>
</svg>
