<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>Tipografiya anatomiyasi: baseline, x-height, ascender, descender va line-height chiziqlari</title>
  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Tipografiya anatomiyasi</text>

  <!-- line box foni (line-height) -->
  <rect x="120" y="90" width="380" height="250" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- yordamchi chiziqlar -->
  <!-- ascender line -->
  <line x1="120" y1="130" x2="620" y2="130" stroke="#16a34a" stroke-width="2"/>
  <text x="630" y="135" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">ascender chizig'i</text>
  <!-- cap / x-height top -->
  <line x1="120" y1="170" x2="620" y2="170" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="630" y="175" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#f59e0b">x-height tepasi</text>
  <!-- baseline -->
  <line x1="120" y1="270" x2="620" y2="270" stroke="#dc2626" stroke-width="2.5"/>
  <text x="630" y="275" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">baseline (asos)</text>
  <!-- descender line -->
  <line x1="120" y1="305" x2="620" y2="305" stroke="#16a34a" stroke-width="2"/>
  <text x="630" y="310" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">descender chizig'i</text>

  <!-- namuna so'z: harflar baseline'ga o'tirgan -->
  <text x="160" y="270" font-family="Georgia, serif" font-size="100" fill="#1e293b">x</text>
  <text x="230" y="270" font-family="Georgia, serif" font-size="100" fill="#2563eb">h</text>
  <text x="300" y="270" font-family="Georgia, serif" font-size="100" fill="#1e293b">p</text>
  <text x="370" y="270" font-family="Georgia, serif" font-size="100" fill="#2563eb">g</text>

  <!-- x-height o'lchami -->
  <line x1="100" y1="170" x2="100" y2="270" stroke="#f59e0b" stroke-width="2"/>
  <line x1="94" y1="170" x2="106" y2="170" stroke="#f59e0b" stroke-width="2"/>
  <line x1="94" y1="270" x2="106" y2="270" stroke="#f59e0b" stroke-width="2"/>
  <text x="92" y="225" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#f59e0b">x-height</text>

  <!-- line-height o'lchami (chap chetda) -->
  <line x1="60" y1="90" x2="60" y2="340" stroke="#2563eb" stroke-width="2"/>
  <line x1="54" y1="90" x2="66" y2="90" stroke="#2563eb" stroke-width="2"/>
  <line x1="54" y1="340" x2="66" y2="340" stroke="#2563eb" stroke-width="2"/>
  <text x="52" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb" transform="rotate(-90 52 220)">line-height (qator balandligi)</text>

  <!-- ascender / descender belgilari -->
  <text x="285" y="155" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">ascender</text>
  <text x="400" y="298" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">descender</text>

  <text x="360" y="382" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">baseline — harflar "o'tiradigan" chiziq · x-height — kichik harf balandligi</text>
  <text x="360" y="406" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">ascender (h, b) tepaga, descender (p, g) pastga chiqadi</text>
  <text x="360" y="430" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#2563eb">line-height — butun qator qutisining balandligi (matnni o'rab turadi)</text>
</svg>
