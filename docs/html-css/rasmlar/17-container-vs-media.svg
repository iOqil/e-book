<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>Media query viewport o'lchamiga, container query element o'lchamiga qarashi farqi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>

  <text x="380" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Media query vs Container query</text>

  <!-- ====== CHAP: media query ====== -->
  <text x="195" y="72" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">@media — VIEWPORT'ga qaraydi</text>

  <!-- Brauzer oynasi (viewport) -->
  <rect x="50" y="90" width="290" height="220" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="50" y="90" width="290" height="26" rx="8" fill="#2563eb"/>
  <circle cx="66" cy="103" r="4" fill="#ffffff"/>
  <circle cx="80" cy="103" r="4" fill="#ffffff"/>
  <circle cx="94" cy="103" r="4" fill="#ffffff"/>
  <text x="210" y="107" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff">brauzer oynasi (viewport)</text>

  <!-- ichidagi karta -->
  <rect x="80" y="140" width="160" height="150" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="160" y="168" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">karta</text>
  <rect x="92" y="180" width="136" height="9" rx="2" fill="#cbd5e1"/>
  <rect x="92" y="194" width="136" height="9" rx="2" fill="#cbd5e1"/>
  <rect x="92" y="208" width="100" height="9" rx="2" fill="#cbd5e1"/>

  <!-- O'lchov chizig'i viewport eni -->
  <line x1="50" y1="328" x2="340" y2="328" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="50" y1="322" x2="50" y2="334" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="340" y1="322" x2="340" y2="334" stroke="#2563eb" stroke-width="1.5"/>
  <text x="195" y="348" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">oyna eni o'lchanadi</text>

  <!-- kod -->
  <rect x="50" y="362" width="290" height="40" rx="6" fill="#1e293b"/>
  <text x="195" y="387" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#f8fafc">@media (min-width: 600px)</text>

  <!-- Ajratuvchi -->
  <line x1="380" y1="60" x2="380" y2="410" stroke="#cbd5e1" stroke-width="2"/>

  <!-- ====== O'NG: container query ====== -->
  <text x="565" y="72" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">@container — ELEMENT'ga qaraydi</text>

  <rect x="420" y="90" width="290" height="220" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="420" y="90" width="290" height="26" rx="8" fill="#64748b"/>
  <text x="565" y="107" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff">bir xil brauzer oynasi</text>

  <!-- konteyner (yon ustun) -->
  <rect x="440" y="132" width="120" height="166" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">konteyner</text>
  <rect x="450" y="160" width="100" height="128" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="500" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">karta</text>
  <rect x="458" y="190" width="84" height="8" rx="2" fill="#cbd5e1"/>
  <rect x="458" y="202" width="84" height="8" rx="2" fill="#cbd5e1"/>

  <!-- keng asosiy hudud -->
  <rect x="575" y="132" width="120" height="166" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="635" y="216" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">asosiy hudud</text>

  <!-- O'lchov chizig'i konteyner eni -->
  <line x1="440" y1="316" x2="560" y2="316" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="440" y1="310" x2="440" y2="322" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="560" y1="310" x2="560" y2="322" stroke="#16a34a" stroke-width="1.5"/>
  <text x="565" y="348" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">konteyner eni o'lchanadi</text>

  <rect x="420" y="362" width="290" height="40" rx="6" fill="#1e293b"/>
  <text x="565" y="387" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#f8fafc">@container (min-width: 300px)</text>

  <!-- Pastki izoh -->
  <rect x="50" y="424" width="660" height="36" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="447" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Container query: komponent qayerga joylansa, o'sha joyning eniga moslashadi — qayta ishlatish oson.</text>
</svg>
