<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" width="660" height="360">
  <title>Semantik ma'no va vizual ko'rinish farqi: strong/em (ma'no) va b/i (faqat ko'rinish)</title>
  <rect x="0" y="0" width="660" height="360" fill="#f8fafc"/>
  <text x="330" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Ma'no (semantika) va ko'rinish (vizual)</text>
  <text x="330" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Bir xil ko'rinadi, lekin mashina (skrinrider, qidiruv) uchun farqli</text>

  <!-- Semantik tomon -->
  <rect x="20" y="76" width="300" height="256" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <rect x="20" y="76" width="300" height="42" rx="10" fill="#16a34a"/>
  <rect x="20" y="100" width="300" height="18" fill="#16a34a"/>
  <text x="170" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Semantik — ma'noli</text>

  <text x="40" y="150" font-family="Consolas, monospace" font-size="14" fill="#1e293b">&lt;strong&gt;</text>
  <text x="150" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">= "muhim" (qalin)</text>
  <text x="40" y="180" font-family="Consolas, monospace" font-size="14" fill="#1e293b">&lt;em&gt;</text>
  <text x="150" y="180" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">= "urg'u" (qiya)</text>

  <rect x="40" y="200" width="260" height="110" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="56" y="226" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Skrinrider ovozini</text>
  <text x="56" y="248" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">o'zgartiradi.</text>
  <text x="56" y="278" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Qidiruv tizimi</text>
  <text x="56" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">ahamiyatni tushunadi.</text>

  <!-- Vizual tomon -->
  <rect x="340" y="76" width="300" height="256" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <rect x="340" y="76" width="300" height="42" rx="10" fill="#f59e0b"/>
  <rect x="340" y="100" width="300" height="18" fill="#f59e0b"/>
  <text x="490" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Vizual — faqat ko'rinish</text>

  <text x="360" y="150" font-family="Consolas, monospace" font-size="14" fill="#1e293b">&lt;b&gt;</text>
  <text x="470" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">= shunchaki qalin</text>
  <text x="360" y="180" font-family="Consolas, monospace" font-size="14" fill="#1e293b">&lt;i&gt;</text>
  <text x="470" y="180" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">= shunchaki qiya</text>

  <rect x="360" y="200" width="260" height="110" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="376" y="226" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Hech qanday qo'shimcha</text>
  <text x="376" y="248" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">ma'no bermaydi.</text>
  <text x="376" y="278" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Faqat harf shaklini</text>
  <text x="376" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">o'zgartiradi.</text>
</svg>
