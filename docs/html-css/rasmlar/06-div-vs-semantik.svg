<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="680" height="480">
  <title>Taqqoslash: chapda ma'nosiz div sho'rva, o'ngda ma'noli semantik teglar (aside main'dan tashqarida, sibling)</title>
  <rect x="0" y="0" width="680" height="480" fill="#f8fafc"/>

  <!-- Sarlavhalar -->
  <text x="170" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#dc2626">Div sho'rva (yomon)</text>
  <text x="510" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#16a34a">Semantik (yaxshi)</text>

  <!-- CHAP TOMON: div soup -->
  <rect x="30" y="52" width="280" height="396" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>

  <rect x="48" y="70" width="244" height="44" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="170" y="97" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">&lt;div class="header"&gt;</text>

  <rect x="48" y="124" width="244" height="34" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="170" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">&lt;div class="nav"&gt;</text>

  <rect x="48" y="166" width="244" height="118" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="170" y="188" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">&lt;div class="main"&gt;</text>
  <rect x="64" y="200" width="212" height="70" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="170" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">&lt;div class="post"&gt;</text>

  <rect x="48" y="292" width="244" height="44" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="170" y="319" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">&lt;div class="side"&gt;</text>

  <rect x="48" y="344" width="244" height="44" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="170" y="371" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">&lt;div class="footer"&gt;</text>

  <text x="170" y="414" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">Brauzer uchun hammasi bir xil quti.</text>
  <text x="170" y="434" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">Skrinrider strukturani ko'rmaydi.</text>

  <!-- O'rtadagi strelka -->
  <defs>
    <marker id="ok-arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <line x1="320" y1="250" x2="368" y2="250" stroke="#475569" stroke-width="3" marker-end="url(#ok-arrow)"/>

  <!-- O'NG TOMON: semantik (aside = main'ning birodari, ICHIDA emas) -->
  <rect x="370" y="52" width="280" height="396" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>

  <rect x="388" y="70" width="244" height="44" rx="6" fill="#e2e8f0" stroke="#2563eb" stroke-width="2"/>
  <text x="510" y="97" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">&lt;header&gt;</text>

  <rect x="388" y="124" width="244" height="34" rx="6" fill="#e2e8f0" stroke="#16a34a" stroke-width="2"/>
  <text x="510" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">&lt;nav&gt;</text>

  <rect x="388" y="166" width="244" height="118" rx="6" fill="#e2e8f0" stroke="#f59e0b" stroke-width="2"/>
  <text x="510" y="188" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">&lt;main&gt;</text>
  <rect x="404" y="200" width="212" height="70" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="510" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">&lt;article&gt;</text>

  <rect x="388" y="292" width="244" height="44" rx="6" fill="#e2e8f0" stroke="#dc2626" stroke-width="2"/>
  <text x="510" y="319" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">&lt;aside&gt;</text>

  <rect x="388" y="344" width="244" height="44" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="510" y="371" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">&lt;footer&gt;</text>

  <text x="510" y="414" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Teg nomining o'zi ma'no beradi.</text>
  <text x="510" y="434" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Skrinrider landmark'larni o'qiydi.</text>
</svg>
