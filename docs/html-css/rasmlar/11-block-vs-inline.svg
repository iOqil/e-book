<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500">
  <title>block, inline va inline-block farqi: block to'liq qator egallaydi, inline yonma-yon turadi</title>
  <rect x="0" y="0" width="720" height="500" fill="#f8fafc"/>

  <!-- Sarlavha -->
  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">block · inline · inline-block</text>

  <!-- ===== BLOCK ===== -->
  <text x="40" y="74" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">block (masalan div, p, h1)</text>
  <!-- konteyner -->
  <rect x="40" y="84" width="640" height="120" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="52" y="96" width="616" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="121" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">block element 1 — butun qatorni egallaydi</text>
  <rect x="52" y="146" width="616" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="171" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">block element 2 — yangi qatordan boshlanadi</text>
  <text x="360" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">width/height ishlaydi · har biri yangi qatorga tushadi</text>

  <!-- ===== INLINE ===== -->
  <text x="40" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">inline (masalan span, a, strong)</text>
  <rect x="40" y="252" width="640" height="90" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="52" y="270" width="150" height="30" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="127" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">inline 1</text>
  <rect x="210" y="270" width="120" height="30" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="270" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">inline 2</text>
  <rect x="338" y="270" width="170" height="30" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="423" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">inline 3</text>
  <text x="360" y="328" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yonma-yon turadi · width/height TA'SIR QILMAYDI</text>

  <!-- ===== INLINE-BLOCK ===== -->
  <text x="40" y="380" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#b45309">inline-block (yonma-yon + o'lcham)</text>
  <rect x="40" y="390" width="640" height="96" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="52" y="404" width="130" height="60" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="117" y="438" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">box 1</text>
  <rect x="194" y="404" width="130" height="60" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="259" y="438" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">box 2</text>
  <rect x="336" y="404" width="130" height="60" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="401" y="438" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">box 3</text>
  <text x="560" y="438" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yonma-yon</text>
  <text x="560" y="456" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">+ width/height</text>
</svg>
