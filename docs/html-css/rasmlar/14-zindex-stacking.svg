<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480">
  <title>z-index va qatlamlanish: elementlar bir-biri ustida z-index tartibida joylashishi</title>
  <rect x="0" y="0" width="720" height="480" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">z-index: kim kimning ustida turadi?</text>
  <text x="360" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Katta z-index = yuqori qatlam = old tomonda (foydalanuvchiga yaqin)</text>

  <!-- Qatlamlar: pastdan tepaga, har biri biroz siljigan (3D illyuziya) -->
  <!-- z-index: 1 (eng past) -->
  <rect x="120" y="300" width="320" height="120" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="140" y="328" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#475569">z-index: 1</text>
  <text x="140" y="350" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">orqa fon paneli</text>

  <!-- z-index: 5 -->
  <rect x="180" y="240" width="320" height="120" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="268" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">z-index: 5</text>
  <text x="200" y="290" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">kartochka (content)</text>

  <!-- z-index: 10 -->
  <rect x="240" y="180" width="320" height="120" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="260" y="208" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">z-index: 10</text>
  <text x="260" y="230" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">ochiladigan menyu (dropdown)</text>

  <!-- z-index: 100 (eng tepa) -->
  <rect x="300" y="120" width="320" height="120" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="320" y="148" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b45309">z-index: 100</text>
  <text x="320" y="170" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">modal oyna (eng oldinda)</text>

  <!-- O'q: tepaga = old tomon -->
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <line x1="660" y1="420" x2="660" y2="120" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
  <text x="678" y="280" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626" transform="rotate(90 678 280)">old tomon (yuqori z-index)</text>

  <!-- Pastki izoh -->
  <text x="360" y="452" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">z-index faqat positioned (static'dan boshqa) elementlarga ishlaydi. Teng bo'lsa — keyin yozilgani ustun.</text>
</svg>
