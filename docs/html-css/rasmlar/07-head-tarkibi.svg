<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>head ichidagi asosiy meta va link teglar ro'yxati</title>
  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>

  <!-- Sarlavha -->
  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">&lt;head&gt; ichida nimalar bo'ladi?</text>

  <!-- Asosiy head qutisi -->
  <rect x="30" y="56" width="660" height="392" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="50" y="82" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#475569">&lt;head&gt;</text>

  <!-- charset -->
  <rect x="50" y="96" width="620" height="44" rx="7" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
  <text x="64" y="118" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">meta charset=&quot;UTF-8&quot;</text>
  <text x="64" y="134" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Harf kodlash — o'/g'/ch to'g'ri ko'rinishi uchun (eng birinchi)</text>

  <!-- viewport -->
  <rect x="50" y="148" width="620" height="44" rx="7" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/>
  <text x="64" y="170" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">meta name=&quot;viewport&quot;</text>
  <text x="64" y="186" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Mobil moslashuv (responsive) — width=device-width</text>

  <!-- title -->
  <rect x="50" y="200" width="620" height="44" rx="7" fill="#f8fafc" stroke="#f59e0b" stroke-width="2"/>
  <text x="64" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">&lt;title&gt;</text>
  <text x="64" y="238" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Tab nomi va Google natijasidagi ko'k sarlavha</text>

  <!-- description -->
  <rect x="50" y="252" width="620" height="44" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="64" y="274" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">meta name=&quot;description&quot;</text>
  <text x="64" y="290" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Qidiruv natijasidagi qisqa tavsif (SEO)</text>

  <!-- favicon -->
  <rect x="50" y="304" width="620" height="44" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="64" y="326" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">link rel=&quot;icon&quot;</text>
  <text x="64" y="342" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Favicon — tabdagi kichik belgi (logotip)</text>

  <!-- stylesheet -->
  <rect x="50" y="356" width="305" height="44" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="64" y="378" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">link rel=&quot;stylesheet&quot;</text>
  <text x="64" y="394" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">CSS faylni ulash</text>

  <!-- script -->
  <rect x="365" y="356" width="305" height="44" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="379" y="378" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">&lt;script defer&gt;</text>
  <text x="379" y="394" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">JS faylni ulash</text>

  <!-- OG / SEO -->
  <rect x="50" y="408" width="620" height="30" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="360" y="428" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Qo'shimcha: og:title / og:image (ulashish) · canonical · robots · JSON-LD</text>
</svg>
