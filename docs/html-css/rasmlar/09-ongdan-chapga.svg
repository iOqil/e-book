<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" width="740" height="360">
  <title>Brauzer selektorni o'ngdan chapga o'qiydi</title>
  <rect x="0" y="0" width="740" height="360" fill="#f8fafc"/>
  <text x="370" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Brauzer selektorni O'NGDAN CHAPGA o'qiydi</text>

  <!-- selector tokens -->
  <rect x="120" y="70" width="170" height="50" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="205" y="101" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#1e293b">nav</text>

  <rect x="300" y="70" width="60" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="330" y="101" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#475569">ul</text>

  <rect x="370" y="70" width="120" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="430" y="101" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#475569">li</text>

  <rect x="500" y="70" width="120" height="50" rx="8" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <text x="560" y="101" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#ffffff" font-weight="bold">a.faol</text>

  <text x="370" y="150" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#1e293b">nav ul li a.faol</text>

  <!-- arrow pointing left -->
  <defs>
    <marker id="arrowL" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <line x1="600" y1="178" x2="150" y2="178" stroke="#dc2626" stroke-width="3" marker-end="url(#arrowL)"/>
  <text x="375" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">o'qish yo'nalishi</text>

  <!-- steps -->
  <rect x="40" y="222" width="660" height="116" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="56" y="248" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Nega o'ngdan chapga?</text>
  <text x="56" y="274" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">1. Eng o'ngdagi qism — <tspan font-family="Consolas, monospace" fill="#2563eb">a.faol</tspan> — "kalit selektor" (mos kelishi shart bo'lgan element).</text>
  <text x="56" y="298" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">2. Brauzer avval shu elementni topadi, keyin chapga qarab ota-bobolarini tekshiradi.</text>
  <text x="56" y="322" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">3. Bu tezroq: ko'p element ichidan kalitga mos kelmaydiganlari darhol chetlatiladi.</text>
</svg>
