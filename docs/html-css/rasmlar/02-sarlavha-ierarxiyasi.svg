<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430">
  <title>Sarlavhalar ierarxiyasi: h1 dan h6 gacha kamayuvchi o'lcham va daraja</title>
  <rect x="0" y="0" width="640" height="430" fill="#f8fafc"/>
  <text x="320" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Sarlavhalar ierarxiyasi (h1 → h6)</text>
  <text x="320" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Daraja oshgani sari o'lcham va "muhimlik" kamayadi</text>

  <!-- Daraja chizig'i (vertikal) -->
  <line x1="48" y1="80" x2="48" y2="408" stroke="#94a3b8" stroke-width="2"/>

  <!-- h1 -->
  <rect x="64" y="80" width="510" height="46" rx="6" fill="#2563eb"/>
  <text x="80" y="110" font-family="Segoe UI, system-ui, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">h1 — Sahifa sarlavhasi</text>
  <circle cx="48" cy="103" r="6" fill="#2563eb"/>
  <text x="600" y="109" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">1-daraja</text>

  <!-- h2 -->
  <rect x="84" y="134" width="470" height="42" rx="6" fill="#3b82f6"/>
  <text x="100" y="161" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">h2 — Bo'lim sarlavhasi</text>
  <circle cx="48" cy="155" r="6" fill="#3b82f6"/>
  <text x="600" y="160" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">2-daraja</text>

  <!-- h3 -->
  <rect x="104" y="184" width="430" height="38" rx="6" fill="#60a5fa"/>
  <text x="120" y="208" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#1e293b">h3 — Kichik bo'lim</text>
  <circle cx="48" cy="203" r="6" fill="#60a5fa"/>
  <text x="600" y="208" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">3-daraja</text>

  <!-- h4 -->
  <rect x="124" y="230" width="390" height="34" rx="6" fill="#93c5fd"/>
  <text x="140" y="252" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#1e293b">h4 — Mavzucha</text>
  <circle cx="48" cy="247" r="6" fill="#93c5fd"/>
  <text x="600" y="252" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">4-daraja</text>

  <!-- h5 -->
  <rect x="144" y="272" width="350" height="30" rx="6" fill="#bfdbfe"/>
  <text x="160" y="292" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">h5 — Tafsilot</text>
  <circle cx="48" cy="287" r="6" fill="#bfdbfe"/>
  <text x="600" y="292" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">5-daraja</text>

  <!-- h6 -->
  <rect x="164" y="310" width="310" height="28" rx="6" fill="#dbeafe"/>
  <text x="180" y="329" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">h6 — Eng kichik daraja</text>
  <circle cx="48" cy="324" r="6" fill="#dbeafe"/>
  <text x="600" y="329" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">6-daraja</text>

  <!-- Qoida qutisi -->
  <rect x="48" y="356" width="544" height="52" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="64" y="380" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">Qoida:</text>
  <text x="120" y="380" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">darajalarni o'tkazib yuborma (h1 dan keyin to'g'ridan-to'g'ri h3 ga sakrama).</text>
  <text x="64" y="399" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Bir sahifada odatda bitta h1 bo'ladi — u sahifaning bosh sarlavhasi.</text>
</svg>
