<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>title va description Google natijasida, og teglar ijtimoiy tarmoq kartasida qanday ko'rinishi</title>
  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>

  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Meta teglar tashqarida qanday ko'rinadi</text>

  <!-- ===== CHAP: Google qidiruv natijasi ===== -->
  <text x="40" y="68" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#475569">Google qidiruv natijasi</text>
  <rect x="40" y="80" width="320" height="150" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>

  <!-- URL qatori -->
  <text x="58" y="106" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">https://saytim.uz</text>
  <!-- title -->
  <text x="58" y="132" font-family="Segoe UI, system-ui, sans-serif" font-size="17" fill="#1a0dab">Pishloqli pitsa retsepti — Oshxonam</text>
  <!-- description -->
  <text x="58" y="156" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">30 daqiqada uyda mazali pishloqli pitsa</text>
  <text x="58" y="172" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tayyorlash bo'yicha qadam-baqadam qo'llanma.</text>

  <!-- Belgilovchi chiziqlar -->
  <line x1="270" y1="128" x2="378" y2="118" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="384" y="120" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#b45309">&lt;title&gt;</text>
  <line x1="240" y1="164" x2="378" y2="160" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="384" y="163" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">description</text>

  <!-- ===== O'NG: Ijtimoiy tarmoq kartasi (Open Graph) ===== -->
  <text x="430" y="68" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#475569">Ulashish kartasi (Open Graph)</text>
  <rect x="430" y="80" width="250" height="230" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>

  <!-- og:image -->
  <rect x="430" y="80" width="250" height="120" rx="10" fill="#dbeafe"/>
  <rect x="430" y="120" width="250" height="80" fill="#dbeafe"/>
  <circle cx="510" cy="140" r="22" fill="#f59e0b"/>
  <polygon points="555,165 595,120 635,165" fill="#16a34a"/>
  <text x="555" y="115" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">og:image (rasm)</text>

  <!-- og:title / og:description -->
  <text x="446" y="232" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Pishloqli pitsa retsepti</text>
  <text x="446" y="256" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">30 daqiqada uyda mazali pitsa.</text>
  <text x="446" y="294" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">SAYTIM.UZ</text>

  <line x1="600" y1="232" x2="688" y2="218" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="566" y="214" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">og:title</text>

  <!-- Pastki xulosa -->
  <rect x="40" y="340" width="640" height="106" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="368" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Bitta sahifa — uch xil joyda</text>
  <text x="360" y="394" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Tab nomi (title) · Google natijasi (title + description) · ijtimoiy karta (og:*)</text>
  <text x="360" y="420" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Ularning hammasi &lt;head&gt; ichidagi ko'rinmas teglardan o'qiladi.</text>
</svg>
