<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>position sticky: skroll paytidagi uch holat — chegaragacha oddiy, chegarada yopishadi, ota tugaganda chiqib ketadi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>

  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">position: sticky — uch holat (skroll qilganda)</text>

  <!-- Uchta viewport ramkasi yonma-yon -->

  <!-- HOLAT 1: hali chegaraga yetmagan -->
  <rect x="30" y="70" width="220" height="360" rx="6" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="140" y="60" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e293b">1) Oddiy holat</text>
  <text x="48" y="92" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">top: 0 chizigi</text>
  <line x1="40" y1="98" x2="240" y2="98" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- sticky element o'z joyida (chegaradan past) -->
  <rect x="48" y="150" width="184" height="34" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="140" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">sticky element</text>
  <rect x="48" y="200" width="184" height="14" rx="3" fill="#e2e8f0"/>
  <rect x="48" y="224" width="184" height="14" rx="3" fill="#e2e8f0"/>
  <rect x="48" y="248" width="184" height="14" rx="3" fill="#e2e8f0"/>
  <text x="140" y="412" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">relative kabi: o'z joyida</text>

  <!-- HOLAT 2: chegaraga yopishgan -->
  <rect x="270" y="70" width="220" height="360" rx="6" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="380" y="60" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e293b">2) Yopishgan</text>
  <text x="288" y="92" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">top: 0 chizigi</text>
  <line x1="280" y1="98" x2="480" y2="98" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- sticky element chegaraga yopishgan -->
  <rect x="288" y="100" width="184" height="34" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="380" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">sticky element</text>
  <rect x="288" y="150" width="184" height="14" rx="3" fill="#e2e8f0"/>
  <rect x="288" y="174" width="184" height="14" rx="3" fill="#e2e8f0"/>
  <rect x="288" y="198" width="184" height="14" rx="3" fill="#e2e8f0"/>
  <rect x="288" y="222" width="184" height="14" rx="3" fill="#e2e8f0"/>
  <rect x="288" y="246" width="184" height="14" rx="3" fill="#e2e8f0"/>
  <!-- siljish o'qi -->
  <defs>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <line x1="380" y1="280" x2="380" y2="340" stroke="#2563eb" stroke-width="2" marker-end="url(#ar2)"/>
  <text x="380" y="370" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">skroll yonalishi</text>
  <text x="380" y="412" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#f59e0b">fixed kabi: top'ga yopishdi</text>

  <!-- HOLAT 3: ota tugadi, chiqib ketdi -->
  <rect x="510" y="70" width="220" height="360" rx="6" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="620" y="60" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e293b">3) Ota tugadi</text>
  <text x="528" y="92" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">top: 0 chizigi</text>
  <line x1="520" y1="98" x2="720" y2="98" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- ota qutisi tugab boryapti -->
  <rect x="528" y="110" width="184" height="120" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="620" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">ota qutisi (tugayapti)</text>
  <!-- sticky element ota pastiga itariladi -->
  <rect x="528" y="190" width="184" height="34" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="620" y="212" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">sticky element</text>
  <text x="620" y="412" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">ota bilan birga chiqib ketadi</text>

  <text x="380" y="452" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">sticky element faqat o'z otasining qutisi ichida yopishib turadi — undan tashqariga chiqmaydi.</text>
</svg>
