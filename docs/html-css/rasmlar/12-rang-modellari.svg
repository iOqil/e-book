<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <title>Rang modellari: bitta ko'k rang hex, rgb va hsl yozuvlarida bir xil natija beradi</title>
  <rect x="0" y="0" width="720" height="420" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Bitta rang — uch xil yozuv</text>
  <text x="360" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Bu uchala yozuv AYNAN bir xil ko'k rangni beradi</text>

  <!-- katta rang namunasi -->
  <rect x="270" y="80" width="180" height="70" rx="10" fill="#2563eb" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">bir xil natija</text>

  <!-- hex karta -->
  <rect x="40" y="190" width="200" height="180" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="40" y="190" width="200" height="40" rx="10" fill="#2563eb"/>
  <text x="140" y="217" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">HEX</text>
  <text x="140" y="265" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" fill="#1e293b">#2563eb</text>
  <text x="140" y="298" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">25=R · 63=G · eb=B</text>
  <text x="140" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">16 lik sanoq tizimi</text>
  <text x="140" y="350" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">eng ixcham</text>

  <!-- rgb karta -->
  <rect x="260" y="190" width="200" height="180" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="260" y="190" width="200" height="40" rx="10" fill="#2563eb"/>
  <text x="360" y="217" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">RGB</text>
  <text x="360" y="265" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#1e293b">rgb(37, 99, 235)</text>
  <text x="360" y="298" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Qizil · Yashil · Ko'k</text>
  <text x="360" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">har biri 0&#8211;255</text>
  <text x="360" y="350" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">o'qish oson</text>

  <!-- hsl karta -->
  <rect x="480" y="190" width="200" height="180" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="480" y="190" width="200" height="40" rx="10" fill="#2563eb"/>
  <text x="580" y="217" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">HSL</text>
  <text x="580" y="265" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">hsl(221, 83%, 53%)</text>
  <text x="580" y="298" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Tus · To'yinganlik</text>
  <text x="580" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">· Yorqinlik</text>
  <text x="580" y="350" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#f59e0b">odamga tushunarli</text>

  <text x="360" y="402" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#2563eb">HSL'da rangni xayolan tasavvur qilish oson: tus + qanchalik to'yingan + qanchalik yorug'</text>
</svg>
