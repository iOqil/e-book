<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340">
  <title>label for atributi input id ga bog'lanadi: yorliqqa bosilganda mos maydon aktivlashadi</title>
  <defs>
    <marker id="strelka2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="340" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">label va input qanday bog'lanadi?</text>

  <!-- kod tomoni -->
  <rect x="40" y="70" width="300" height="170" rx="10" fill="#1e293b"/>
  <text x="60" y="104" font-family="Consolas, monospace" font-size="14" fill="#e2e8f0">&lt;label for=</text>
  <text x="143" y="104" font-family="Consolas, monospace" font-size="14" fill="#f59e0b">"email"</text>
  <text x="206" y="104" font-family="Consolas, monospace" font-size="14" fill="#e2e8f0">&gt;</text>
  <text x="60" y="128" font-family="Consolas, monospace" font-size="14" fill="#e2e8f0">  Email manzil</text>
  <text x="60" y="152" font-family="Consolas, monospace" font-size="14" fill="#e2e8f0">&lt;/label&gt;</text>
  <text x="60" y="190" font-family="Consolas, monospace" font-size="14" fill="#e2e8f0">&lt;input id=</text>
  <text x="138" y="190" font-family="Consolas, monospace" font-size="14" fill="#f59e0b">"email"</text>
  <text x="60" y="214" font-family="Consolas, monospace" font-size="14" fill="#e2e8f0">       type="email"&gt;</text>

  <!-- bog'lovchi strelka for -> id -->
  <path d="M210,108 C 250,108 250,182 200,186" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#strelka2)"/>
  <text x="282" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">for == id</text>

  <!-- natija tomoni -->
  <rect x="400" y="70" width="280" height="170" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="540" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Ekranda natija</text>
  <text x="425" y="138" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Email manzil</text>
  <rect x="425" y="150" width="230" height="36" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="437" y="173" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ali@mail.uz</text>
  <text x="425" y="214" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Yorliqqa bosilsa, maydon fokuslanadi</text>

  <!-- pastki nega muhim -->
  <rect x="40" y="262" width="640" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="60" y="287" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Nega muhim?</text>
  <text x="60" y="308" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Skrin-reader yorliqni o'qiydi · bosish maydoni kattalashadi · forma qulayroq va accessible bo'ladi</text>
</svg>
