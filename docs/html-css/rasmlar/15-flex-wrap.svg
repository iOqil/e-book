<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360">
  <title>flex-wrap: nowrap (siqiladi) va wrap (qatorga ko'chadi) farqi</title>
  <rect x="0" y="0" width="760" height="360" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">flex-wrap — itemlar sig'masa nima bo'ladi?</text>

  <!-- nowrap -->
  <text x="40" y="74" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#1e293b">nowrap (standart) — hammasi bitta qatorda, siqiladi</text>
  <rect x="40" y="84" width="680" height="60" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="50" y="96" width="128" height="36" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="114" y="119" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">1</text>
  <rect x="186" y="96" width="128" height="36" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="250" y="119" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">2</text>
  <rect x="322" y="96" width="128" height="36" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="386" y="119" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">3</text>
  <rect x="458" y="96" width="128" height="36" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="522" y="119" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">4</text>
  <rect x="594" y="96" width="116" height="36" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="652" y="119" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">5</text>
  <text x="40" y="166" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">itemlar tor joyga zo'rlab tiqiladi (min-content gacha siqiladi)</text>

  <!-- wrap -->
  <text x="40" y="208" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#1e293b">wrap — sig'magani yangi qatorga tushadi</text>
  <rect x="40" y="218" width="680" height="110" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="50" y="230" width="150" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="125" y="253" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">1</text>
  <rect x="208" y="230" width="150" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="283" y="253" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">2</text>
  <rect x="366" y="230" width="150" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="441" y="253" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">3</text>
  <rect x="524" y="230" width="150" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="599" y="253" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">4</text>
  <rect x="50" y="278" width="150" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="125" y="301" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">5</text>
  <text x="40" y="350" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">bir nechta qator hosil bo'ladi · qatorlar orasini align-content boshqaradi</text>
</svg>
