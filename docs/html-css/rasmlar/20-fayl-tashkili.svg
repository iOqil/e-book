<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>CSS fayl tashkili: bitta katta fayl o'rniga komponentlarga bo'lingan tuzilma va main.css ularni birlashtiradi</title>
  <defs>
    <marker id="ftArr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Fayl tashkili: bitta dev emas, mantiqiy bo'laklar</text>

  <!-- CHAP: yomon -->
  <text x="190" y="70" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">Yomon: bitta ulkan fayl</text>
  <rect x="80" y="84" width="220" height="240" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="190" y="116" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#1e293b">style.css</text>
  <line x1="100" y1="128" x2="280" y2="128" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="100" y="150" font-family="Consolas, monospace" font-size="13" fill="#475569">/* reset */</text>
  <text x="100" y="170" font-family="Consolas, monospace" font-size="13" fill="#475569">/* tugmalar */</text>
  <text x="100" y="190" font-family="Consolas, monospace" font-size="13" fill="#475569">/* kartalar */</text>
  <text x="100" y="210" font-family="Consolas, monospace" font-size="13" fill="#475569">/* menyu */</text>
  <text x="100" y="230" font-family="Consolas, monospace" font-size="13" fill="#475569">/* formalar */</text>
  <text x="100" y="250" font-family="Consolas, monospace" font-size="13" fill="#475569">... 4000 qator ...</text>
  <text x="100" y="270" font-family="Consolas, monospace" font-size="13" fill="#475569">/* footer */</text>
  <text x="190" y="302" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">Topish qiyin, qo'rqib tahrirlaysan</text>

  <!-- O'NG: yaxshi -->
  <text x="560" y="70" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">Yaxshi: komponentlarga bo'lingan</text>

  <!-- main.css -->
  <rect x="470" y="84" width="180" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="560" y="108" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#1e293b">main.css</text>
  <text x="560" y="130" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">@import barchasini ulaydi</text>

  <!-- bolalar fayllar -->
  <line x1="500" y1="142" x2="460" y2="178" stroke="#475569" stroke-width="1.5" marker-end="url(#ftArr)"/>
  <line x1="560" y1="142" x2="560" y2="178" stroke="#475569" stroke-width="1.5" marker-end="url(#ftArr)"/>
  <line x1="620" y1="142" x2="660" y2="178" stroke="#475569" stroke-width="1.5" marker-end="url(#ftArr)"/>

  <rect x="380" y="182" width="120" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="440" y="207" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">reset.css</text>

  <rect x="510" y="182" width="120" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="570" y="207" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">tugma.css</text>

  <rect x="630" y="240" width="120" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="690" y="265" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">karta.css</text>

  <rect x="380" y="240" width="120" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="440" y="265" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">menyu.css</text>

  <rect x="505" y="240" width="120" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="565" y="265" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">forma.css</text>

  <text x="560" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Har fayl bir vazifa — tez topiladi</text>

  <!-- pastki kod: import tartibi -->
  <rect x="80" y="344" width="600" height="104" rx="10" fill="#1e293b"/>
  <text x="100" y="370" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">/* main.css — tartib MUHIM: pastdagi yuqorisini yengadi */</text>
  <text x="100" y="392" font-family="Consolas, monospace" font-size="13" fill="#fcd34d">@import</text>
  <text x="170" y="392" font-family="Consolas, monospace" font-size="13" fill="#86efac">"reset.css"</text>
  <text x="270" y="392" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">;</text>
  <text x="100" y="414" font-family="Consolas, monospace" font-size="13" fill="#fcd34d">@import</text>
  <text x="170" y="414" font-family="Consolas, monospace" font-size="13" fill="#86efac">"tugma.css"</text>
  <text x="270" y="414" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">;</text>
  <text x="100" y="436" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">/* yoki: @layer reset, components, utilities; */</text>
</svg>
