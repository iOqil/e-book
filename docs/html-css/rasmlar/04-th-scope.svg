<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360">
  <title>th scope: scope="col" ustun sarlavhasi, scope="row" qator sarlavhasi yo'nalishi</title>

  <text x="350" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">th scope — sarlavha qaysi yacheykalarga tegishli?</text>

  <!-- defs: strelka uchun marker -->
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Jadval 3 ustun x 3 qator -->
  <!-- Burchak (bo'sh) -->
  <rect x="90" y="70" width="140" height="46" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Ustun sarlavhalari (scope="col") -->
  <rect x="232" y="70" width="140" height="46" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="302" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Yosh</text>
  <text x="302" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">scope="col"</text>

  <rect x="374" y="70" width="140" height="46" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="444" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Shahar</text>
  <text x="444" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">scope="col"</text>

  <!-- 1-qator: qator sarlavhasi (scope="row") + 2 ta td -->
  <rect x="90" y="118" width="140" height="46" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="160" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Ali</text>
  <text x="160" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">scope="row"</text>

  <rect x="232" y="118" width="140" height="46" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="302" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">25</text>
  <rect x="374" y="118" width="140" height="46" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="444" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Buxoro</text>

  <!-- 2-qator -->
  <rect x="90" y="166" width="140" height="46" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="160" y="188" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Lola</text>
  <text x="160" y="204" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">scope="row"</text>

  <rect x="232" y="166" width="140" height="46" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="302" y="194" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">30</text>
  <rect x="374" y="166" width="140" height="46" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="444" y="194" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Toshkent</text>

  <!-- scope=col strelkalari (pastga) -->
  <line x1="302" y1="218" x2="302" y2="236" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="444" y1="218" x2="444" y2="236" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="373" y="252" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">scope="col" &#8594; pastdagi butun ustunga tegishli</text>

  <!-- scope=row strelkasi (o'ngga) -->
  <line x1="62" y1="141" x2="84" y2="141" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="62" y1="189" x2="84" y2="189" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- izohlar -->
  <text x="350" y="288" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">&lt; scope="row" &#8594; o'ngdagi butun qatorga tegishli</text>

  <text x="350" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Skrin-rider "Lola, Yosh: 30" deb o'qiydi — har son qaysi sarlavhaga oid ekani aniq</text>
  <text x="350" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">scope yacheyka va sarlavhani bog'laydi — ko'r foydalanuvchilar uchun zarur</text>
</svg>
