<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520">
  <title>Havola yo'l turlari: absolyut, nisbiy va fragment</title>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">Havola yo'l turlari</text>

  <!-- Sayt strukturasi paneli -->
  <rect x="20" y="60" width="300" height="430" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="170" y="88" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Sayt strukturasi (papkalar)</text>

  <!-- daraxt: root -->
  <text x="45" y="124" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">📁</text>
  <text x="70" y="124" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">/ (sayt ildizi)</text>

  <line x1="55" y1="134" x2="55" y2="430" stroke="#cbd5e1" stroke-width="2"/>

  <!-- index.html (joriy sahifa) -->
  <line x1="55" y1="156" x2="78" y2="156" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="80" y="142" width="210" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="90" y="161" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">📄 index.html</text>
  <text x="218" y="161" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">← joriy</text>

  <!-- about.html -->
  <line x1="55" y1="194" x2="78" y2="194" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="80" y="180" width="200" height="28" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="90" y="199" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">📄 about.html</text>

  <!-- blog/ papka -->
  <line x1="55" y1="232" x2="78" y2="232" stroke="#cbd5e1" stroke-width="2"/>
  <text x="82" y="237" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">📁</text>
  <text x="104" y="237" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">blog/</text>
  <line x1="95" y1="244" x2="95" y2="290" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="95" y1="270" x2="115" y2="270" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="116" y="256" width="164" height="28" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="126" y="275" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">📄 post-1.html</text>

  <!-- rasmlar/ papka -->
  <line x1="55" y1="318" x2="78" y2="318" stroke="#cbd5e1" stroke-width="2"/>
  <text x="82" y="323" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">📁</text>
  <text x="104" y="323" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">rasmlar/</text>
  <line x1="95" y1="330" x2="95" y2="376" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="95" y1="356" x2="115" y2="356" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="116" y="342" width="150" height="28" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="126" y="361" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">🖼 logo.png</text>

  <!-- Fragment ichidagi sarlavha -->
  <line x1="55" y1="404" x2="78" y2="404" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="80" y="390" width="210" height="28" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="90" y="409" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">🔖 #aloqa (shu sahifada)</text>

  <text x="170" y="448" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">Joriy sahifa: /index.html</text>
  <text x="170" y="466" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">dan turib havolalar yoziladi</text>

  <!-- O'ng panel: yo'l turlari -->
  <!-- Absolyut -->
  <rect x="350" y="70" width="390" height="118" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="368" y="96" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">1. Absolyut yo'l (to'liq URL)</text>
  <rect x="368" y="108" width="354" height="30" rx="5" fill="#1e293b"/>
  <text x="380" y="128" font-family="Consolas, monospace" font-size="13" fill="#f8fafc">https://example.com/about.html</text>
  <text x="368" y="158" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Boshqa saytga / tashqi manzilga. To'liq</text>
  <text x="368" y="178" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">manzil — domen bilan birga.</text>

  <!-- Nisbiy -->
  <rect x="350" y="200" width="390" height="190" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="368" y="226" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">2. Nisbiy yo'l (joriy joydan)</text>

  <rect x="368" y="238" width="354" height="28" rx="5" fill="#1e293b"/>
  <text x="380" y="257" font-family="Consolas, monospace" font-size="13" fill="#f8fafc">about.html</text>
  <text x="552" y="257" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#93c5fd">→ shu papkadagi fayl</text>

  <rect x="368" y="272" width="354" height="28" rx="5" fill="#1e293b"/>
  <text x="380" y="291" font-family="Consolas, monospace" font-size="13" fill="#f8fafc">blog/post-1.html</text>
  <text x="552" y="291" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#93c5fd">→ ichkariga (papkaga)</text>

  <rect x="368" y="306" width="354" height="28" rx="5" fill="#1e293b"/>
  <text x="380" y="325" font-family="Consolas, monospace" font-size="13" fill="#f8fafc">rasmlar/logo.png</text>
  <text x="552" y="325" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#93c5fd">→ rasmlar papkasiga</text>

  <rect x="368" y="340" width="354" height="28" rx="5" fill="#1e293b"/>
  <text x="380" y="359" font-family="Consolas, monospace" font-size="13" fill="#f8fafc">../uy.html</text>
  <text x="552" y="359" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#93c5fd">→ bir papka tashqariga</text>
  <text x="368" y="382" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">./ = shu yer · ../ = ota-papka · / = ildizdan</text>

  <!-- Fragment -->
  <rect x="350" y="402" width="390" height="98" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="368" y="428" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#b45309">3. Fragment (#) — sahifa ichida</text>
  <rect x="368" y="440" width="354" height="28" rx="5" fill="#1e293b"/>
  <text x="380" y="459" font-family="Consolas, monospace" font-size="13" fill="#f8fafc">#aloqa</text>
  <text x="490" y="459" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#fcd34d">→ id="aloqa" joyiga sakraydi</text>
  <text x="368" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Sahifa qayta yuklanmaydi — faqat aylantiradi.</text>
</svg>
