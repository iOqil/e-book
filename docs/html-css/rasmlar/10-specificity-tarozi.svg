<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380">
  <title>Specificity tarozisi: id eng og'ir, keyin class, eng yengili element</title>
  <rect x="0" y="0" width="640" height="380" fill="#f8fafc"/>
  <text x="320" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Specificity tarozisi — kim og'irroq?</text>

  <!-- id chashka (eng og'ir, pastda) -->
  <g>
    <rect x="60" y="120" width="160" height="90" rx="10" fill="#dc2626" stroke="#94a3b8" stroke-width="2"/>
    <text x="140" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">#id</text>
    <text x="140" y="188" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#ffffff">0,1,0,0</text>
  </g>
  <text x="140" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">eng og'ir</text>

  <!-- class chashka (o'rta) -->
  <g>
    <rect x="240" y="155" width="160" height="80" rx="10" fill="#2563eb" stroke="#94a3b8" stroke-width="2"/>
    <text x="320" y="190" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">.class</text>
    <text x="320" y="216" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#ffffff">0,0,1,0</text>
  </g>
  <text x="320" y="262" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">o'rta</text>

  <!-- element chashka (eng yengil, yuqorida) -->
  <g>
    <rect x="420" y="185" width="160" height="70" rx="10" fill="#16a34a" stroke="#94a3b8" stroke-width="2"/>
    <text x="500" y="216" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">element</text>
    <text x="500" y="238" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#ffffff">0,0,0,1</text>
  </g>
  <text x="500" y="282" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">eng yengil</text>

  <!-- tarozi tayanchi va strelka -->
  <line x1="40" y1="320" x2="600" y2="320" stroke="#475569" stroke-width="3"/>
  <polygon points="60,320 580,320 540,300 100,300" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="320" y="350" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Pastroq joylashgan = og'irroq = qoidasi g'olib chiqadi</text>
</svg>
