<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420">
  <title>Dark mode: bir xil karta komponenti yorug' va qorong'i temada, custom property qiymatlari almashishi orqali</title>
  <rect x="0" y="0" width="780" height="420" fill="#f8fafc"/>
  <text x="390" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Dark mode: bitta komponent, ikki tema</text>
  <text x="390" y="60" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">HTML bitta — faqat custom property qiymatlari almashadi</text>

  <!-- ====== CHAP: light tema ====== -->
  <text x="195" y="94" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">Yorug' tema (light)</text>
  <!-- sahifa foni -->
  <rect x="55" y="106" width="280" height="150" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <!-- karta -->
  <rect x="80" y="128" width="230" height="106" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="100" y="160" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Karta sarlavhasi</text>
  <text x="100" y="184" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Matn quyuq, fon yorug'.</text>
  <rect x="100" y="198" width="100" height="28" rx="6" fill="#2563eb"/>
  <text x="150" y="217" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Tugma</text>

  <!-- ====== O'NG: dark tema ====== -->
  <text x="585" y="94" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#60a5fa">Qorong'i tema (dark)</text>
  <rect x="445" y="106" width="280" height="150" rx="10" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <rect x="470" y="128" width="230" height="106" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="490" y="160" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f1f5f9">Karta sarlavhasi</text>
  <text x="490" y="184" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#cbd5e1">Matn yorug', fon quyuq.</text>
  <rect x="490" y="198" width="100" height="28" rx="6" fill="#3b82f6"/>
  <text x="540" y="217" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Tugma</text>

  <!-- O'rtadagi almashinish strelkasi -->
  <circle cx="390" cy="181" r="26" fill="#f59e0b"/>
  <path d="M378 175 a12 12 0 1 0 6 -8 M384 167 l-4 -2 l1 6 z" fill="#ffffff"/>
  <text x="390" y="232" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tema</text>

  <!-- Pastki: custom property jadvali -->
  <text x="390" y="294" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Almashadigan custom property'lar</text>

  <!-- jadval boshi -->
  <rect x="60" y="306" width="220" height="30" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <rect x="280" y="306" width="220" height="30" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <rect x="500" y="306" width="220" height="30" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="170" y="326" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">o'zgaruvchi</text>
  <text x="390" y="326" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">light</text>
  <text x="610" y="326" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#60a5fa">dark</text>

  <!-- qator 1 -->
  <rect x="60" y="336" width="220" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="280" y="336" width="220" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="500" y="336" width="220" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="354" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">--fon</text>
  <text x="290" y="354" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">#ffffff</text>
  <text x="510" y="354" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">#0f172a</text>

  <!-- qator 2 -->
  <rect x="60" y="364" width="220" height="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="280" y="364" width="220" height="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="500" y="364" width="220" height="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="382" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">--matn</text>
  <text x="290" y="382" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">#1e293b</text>
  <text x="510" y="382" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">#f1f5f9</text>

  <!-- qator 3 -->
  <rect x="60" y="392" width="220" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="280" y="392" width="220" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="500" y="392" width="220" height="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="408" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">--accent</text>
  <text x="290" y="408" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">#2563eb</text>
  <text x="510" y="408" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">#3b82f6</text>
</svg>
