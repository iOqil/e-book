<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620">
  <title>justify-content qiymatlari: itemlar main o'q bo'ylab qanday taqsimlanadi</title>
  <rect x="0" y="0" width="760" height="620" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">justify-content — main o'q bo'ylab tekislash</text>
  <text x="380" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">qator (row): itemlar gorizontal bo'sh joyga qanday joylashadi</text>

  <!-- flex-start -->
  <text x="40" y="90" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#1e293b">flex-start</text>
  <rect x="220" y="76" width="500" height="50" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="228" y="84" width="50" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="286" y="84" width="50" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="344" y="84" width="50" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>

  <!-- center -->
  <text x="40" y="158" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#1e293b">center</text>
  <rect x="220" y="144" width="500" height="50" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="383" y="152" width="50" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="441" y="152" width="50" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="499" y="152" width="50" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>

  <!-- flex-end -->
  <text x="40" y="226" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#1e293b">flex-end</text>
  <rect x="220" y="212" width="500" height="50" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="546" y="220" width="50" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="604" y="220" width="50" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="662" y="220" width="50" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>

  <!-- space-between -->
  <text x="40" y="294" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#1e293b">space-between</text>
  <text x="40" y="312" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">chetlar yopishadi,</text>
  <text x="40" y="326" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">oraliq teng</text>
  <rect x="220" y="280" width="500" height="50" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="228" y="288" width="50" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="445" y="288" width="50" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="662" y="288" width="50" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>

  <!-- space-around -->
  <text x="40" y="362" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#1e293b">space-around</text>
  <text x="40" y="380" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">har item atrofida</text>
  <text x="40" y="394" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">teng oraliq</text>
  <rect x="220" y="348" width="500" height="50" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="256" y="356" width="50" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="445" y="356" width="50" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="634" y="356" width="50" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <!-- oraliq belgilari space-around -->
  <line x1="223" y1="406" x2="253" y2="406" stroke="#f59e0b" stroke-width="3"/>
  <line x1="309" y1="406" x2="442" y2="406" stroke="#f59e0b" stroke-width="3"/>
  <line x1="498" y1="406" x2="631" y2="406" stroke="#f59e0b" stroke-width="3"/>
  <line x1="687" y1="406" x2="717" y2="406" stroke="#f59e0b" stroke-width="3"/>

  <!-- space-evenly -->
  <text x="40" y="446" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#1e293b">space-evenly</text>
  <text x="40" y="464" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">barcha oraliq</text>
  <text x="40" y="478" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(chet ham) teng</text>
  <rect x="220" y="432" width="500" height="50" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="268" y="440" width="50" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="445" y="440" width="50" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="622" y="440" width="50" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <line x1="223" y1="490" x2="265" y2="490" stroke="#f59e0b" stroke-width="3"/>
  <line x1="321" y1="490" x2="442" y2="490" stroke="#f59e0b" stroke-width="3"/>
  <line x1="498" y1="490" x2="619" y2="490" stroke="#f59e0b" stroke-width="3"/>
  <line x1="675" y1="490" x2="717" y2="490" stroke="#f59e0b" stroke-width="3"/>

  <text x="380" y="540" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">space-around: chet oraliq = ichki oraliqning yarmi · space-evenly: barcha oraliq bir xil</text>
  <line x1="40" y1="560" x2="120" y2="560" stroke="#f59e0b" stroke-width="3"/>
  <text x="130" y="565" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">= bo'sh joy (oraliq) belgisi</text>
</svg>
