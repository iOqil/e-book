<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500">
  <title>CSS box model: ichma-ich joylashgan margin, border, padding va content qatlamlari</title>
  <rect x="0" y="0" width="720" height="500" fill="#f8fafc"/>

  <!-- Sarlavha -->
  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Box model: har element to'rt qatlamdan iborat quti</text>

  <!-- margin (eng tashqi) -->
  <rect x="60" y="56" width="600" height="400" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="78" y="78" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b45309">margin — tashqi bo'sh joy (qo'shni elementlardan masofa)</text>

  <!-- border -->
  <rect x="120" y="96" width="480" height="320" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="138" y="118" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">border — chegara (quti devori)</text>

  <!-- padding -->
  <rect x="180" y="136" width="360" height="240" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="198" y="158" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">padding — ichki bo'sh joy (chegara va content orasi)</text>

  <!-- content (eng ichki) -->
  <rect x="240" y="180" width="240" height="150" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="250" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#1e293b">content</text>
  <text x="360" y="274" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">matn, rasm — asl mazmun</text>
  <text x="360" y="296" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(width × height shu yerni o'lchaydi)</text>

  <!-- pastki izoh -->
  <text x="360" y="482" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Tartibi (ichdan tashqariga): content -&gt; padding -&gt; border -&gt; margin</text>
</svg>
