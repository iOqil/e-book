<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>grid-column va grid-row bilan joylashtirish: element chiziq raqamlari va span yordamida bir nechta katakni egallashi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>

  <!-- Sarlavha -->
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Chiziq raqamlari bilan joylashtirish</text>

  <!-- Panjara 4 ustun x 3 qator. Faqat to'rni chizamiz (yengil) -->
  <!-- och kataklar -->
  <g fill="#eef2f7" stroke="#cbd5e1" stroke-width="1.5">
    <rect x="120" y="80" width="130" height="100" rx="3"/>
    <rect x="260" y="80" width="130" height="100" rx="3"/>
    <rect x="400" y="80" width="130" height="100" rx="3"/>
    <rect x="540" y="80" width="130" height="100" rx="3"/>
    <rect x="120" y="190" width="130" height="100" rx="3"/>
    <rect x="260" y="190" width="130" height="100" rx="3"/>
    <rect x="400" y="190" width="130" height="100" rx="3"/>
    <rect x="540" y="190" width="130" height="100" rx="3"/>
    <rect x="120" y="300" width="130" height="100" rx="3"/>
    <rect x="260" y="300" width="130" height="100" rx="3"/>
    <rect x="400" y="300" width="130" height="100" rx="3"/>
    <rect x="540" y="300" width="130" height="100" rx="3"/>
  </g>

  <!-- Vertikal chiziq raqamlari 1..5 -->
  <text x="120" y="72" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">1</text>
  <text x="260" y="72" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">2</text>
  <text x="400" y="72" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">3</text>
  <text x="540" y="72" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">4</text>
  <text x="670" y="72" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">5</text>
  <!-- Gorizontal chiziq raqamlari 1..4 -->
  <text x="110" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">1</text>
  <text x="110" y="194" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">2</text>
  <text x="110" y="304" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">3</text>
  <text x="110" y="404" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">4</text>

  <!-- Element A: grid-column: 1 / 3 (ustun 1 dan 3 gacha = 2 katak), qator 1 -->
  <rect x="124" y="84" width="262" height="92" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="255" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">A</text>
  <text x="255" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">grid-column: 1 / 3;</text>

  <!-- Element B: grid-column: 3 / 5 (span 2), grid-row: 1 / 3 (2 qator baland) -->
  <rect x="404" y="84" width="262" height="202" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="535" y="170" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">B</text>
  <text x="535" y="192" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">grid-column: 3 / 5;</text>
  <text x="535" y="212" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">grid-row: 1 / 3;</text>

  <!-- Element C: grid-column: 1 / span 4 (butun qatorni egallaydi), qator 3 -->
  <rect x="124" y="304" width="542" height="92" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="395" y="344" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">C</text>
  <text x="395" y="366" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">grid-column: 1 / span 4;  (4 katak keng)</text>

  <!-- Pastki izoh -->
  <rect x="60" y="420" width="640" height="40" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="380" y="445" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b"><tspan font-weight="bold">1 / 3</tspan> = "1-chiziqdan boshla, 3-chiziqda tugat". <tspan font-weight="bold">span 4</tspan> = "shu yerdan 4 katak cho'zil".</text>
</svg>
