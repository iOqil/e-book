<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620">
  <title>Landing page blueprint: header/nav, hero, features grid va footer bo'limlari yorliqlangan</title>
  <rect x="0" y="0" width="760" height="620" fill="#f8fafc"/>

  <!-- Sarlavha -->
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Landing page skeleti (wireframe)</text>
  <text x="380" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yuqoridan pastga: header / hero / features / footer</text>

  <!-- Sahifa konteyneri -->
  <rect x="150" y="76" width="460" height="500" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>

  <!-- ===== HEADER + NAV ===== -->
  <rect x="166" y="92" width="428" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <!-- Logo -->
  <rect x="180" y="108" width="70" height="24" rx="4" fill="#2563eb"/>
  <text x="215" y="125" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Logo</text>
  <!-- Nav linklar -->
  <rect x="420" y="112" width="44" height="16" rx="3" fill="#93c5fd"/>
  <rect x="474" y="112" width="44" height="16" rx="3" fill="#93c5fd"/>
  <rect x="528" y="112" width="52" height="16" rx="3" fill="#93c5fd"/>
  <text x="290" y="125" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">&lt;header&gt; + &lt;nav&gt;</text>

  <!-- Header yorlig'i (o'ng) -->
  <line x1="594" y1="120" x2="660" y2="120" stroke="#2563eb" stroke-width="1.5"/>
  <text x="664" y="116" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">flexbox</text>
  <text x="664" y="132" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">logo + menyu</text>

  <!-- ===== HERO ===== -->
  <rect x="166" y="160" width="428" height="120" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <rect x="206" y="184" width="348" height="20" rx="4" fill="#f59e0b"/>
  <rect x="246" y="214" width="268" height="12" rx="3" fill="#fcd34d"/>
  <rect x="320" y="238" width="120" height="26" rx="13" fill="#16a34a"/>
  <text x="380" y="256" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">CTA tugma</text>
  <line x1="166" y1="220" x2="100" y2="220" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="96" y="216" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#b45309">hero</text>
  <text x="96" y="232" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">sarlavha +</text>
  <text x="96" y="247" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">harakatga chaqiriq</text>

  <!-- ===== FEATURES GRID ===== -->
  <rect x="166" y="292" width="428" height="184" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="380" y="314" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">&lt;section&gt; — features</text>
  <!-- 3 ta karta -->
  <rect x="184" y="328" width="124" height="130" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <rect x="318" y="328" width="124" height="130" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <rect x="452" y="328" width="124" height="130" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <!-- Karta ichidagi ikonka + matn -->
  <circle cx="246" cy="356" r="12" fill="#16a34a"/>
  <circle cx="380" cy="356" r="12" fill="#16a34a"/>
  <circle cx="514" cy="356" r="12" fill="#16a34a"/>
  <rect x="204" y="382" width="84" height="10" rx="3" fill="#16a34a"/>
  <rect x="338" y="382" width="84" height="10" rx="3" fill="#16a34a"/>
  <rect x="472" y="382" width="84" height="10" rx="3" fill="#16a34a"/>
  <rect x="204" y="402" width="84" height="8" rx="3" fill="#86efac"/>
  <rect x="204" y="416" width="64" height="8" rx="3" fill="#86efac"/>
  <rect x="338" y="402" width="84" height="8" rx="3" fill="#86efac"/>
  <rect x="338" y="416" width="64" height="8" rx="3" fill="#86efac"/>
  <rect x="472" y="402" width="84" height="8" rx="3" fill="#86efac"/>
  <rect x="472" y="416" width="64" height="8" rx="3" fill="#86efac"/>

  <line x1="594" y1="392" x2="660" y2="392" stroke="#16a34a" stroke-width="1.5"/>
  <text x="664" y="388" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">grid</text>
  <text x="664" y="404" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">3 ta karta</text>

  <!-- ===== FOOTER ===== -->
  <rect x="166" y="488" width="428" height="72" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="186" y="506" width="100" height="10" rx="3" fill="#94a3b8"/>
  <rect x="186" y="524" width="160" height="8" rx="3" fill="#cbd5e1"/>
  <rect x="430" y="508" width="30" height="30" rx="6" fill="#475569"/>
  <rect x="470" y="508" width="30" height="30" rx="6" fill="#475569"/>
  <rect x="510" y="508" width="30" height="30" rx="6" fill="#475569"/>
  <text x="240" y="552" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">&lt;footer&gt;</text>

  <!-- Pastki izoh -->
  <rect x="70" y="582" width="620" height="30" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="380" y="602" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Umumiy joylashuv = Grid · navbar va kartalar ichi = Flexbox</text>
</svg>
