<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520">
  <title>Tipik semantik sahifa strukturasi: header, nav, main (article + aside), footer</title>
  <rect x="0" y="0" width="640" height="520" fill="#f8fafc"/>

  <!-- Tashqi ramka: body -->
  <rect x="20" y="20" width="600" height="480" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="34" y="44" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">&lt;body&gt;</text>

  <!-- header -->
  <rect x="40" y="56" width="560" height="64" rx="8" fill="#e2e8f0" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">&lt;header&gt;</text>
  <text x="320" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Logo, sayt sarlavhasi</text>

  <!-- nav -->
  <rect x="40" y="132" width="560" height="50" rx="8" fill="#e2e8f0" stroke="#16a34a" stroke-width="2"/>
  <text x="320" y="155" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">&lt;nav&gt;</text>
  <text x="320" y="173" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Asosiy menyu havolalari</text>

  <!-- main wrapper -->
  <rect x="40" y="194" width="560" height="244" rx="8" fill="#f8fafc" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="54" y="214" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">&lt;main&gt;  (sahifaning asosiy, takrorlanmas mazmuni)</text>

  <!-- article -->
  <rect x="56" y="226" width="370" height="196" rx="6" fill="#e2e8f0" stroke="#2563eb" stroke-width="2"/>
  <text x="241" y="252" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#1e293b">&lt;article&gt;</text>
  <text x="241" y="272" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Mustaqil, to'liq mazmun (maqola)</text>

  <!-- section ichida -->
  <rect x="72" y="286" width="338" height="56" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="241" y="310" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">&lt;section&gt;</text>
  <text x="241" y="328" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Mavzuli bo'lim (sarlavhali)</text>

  <rect x="72" y="350" width="338" height="56" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="241" y="374" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">&lt;section&gt;</text>
  <text x="241" y="392" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Yana bir mavzuli bo'lim</text>

  <!-- aside -->
  <rect x="440" y="226" width="144" height="196" rx="6" fill="#e2e8f0" stroke="#dc2626" stroke-width="2"/>
  <text x="512" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">&lt;aside&gt;</text>
  <text x="512" y="312" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Yondosh</text>
  <text x="512" y="328" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">mazmun:</text>
  <text x="512" y="346" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">reklama,</text>
  <text x="512" y="362" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">bog'liq havolalar</text>

  <!-- footer -->
  <rect x="40" y="450" width="560" height="42" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="320" y="476" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">&lt;footer&gt;  —  mualliflik, aloqa, havolalar</text>
</svg>
