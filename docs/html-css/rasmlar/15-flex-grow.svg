<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480">
  <title>flex-grow: ortib qolgan bo'sh joy itemlar orasida qanday taqsimlanadi</title>
  <rect x="0" y="0" width="760" height="480" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">flex-grow — ortgan bo'sh joyni ulushlab bo'lish</text>

  <!-- 1: hammasi 0 -->
  <text x="40" y="78" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#1e293b">flex-grow: 0 (standart) — itemlar o'smaydi</text>
  <rect x="40" y="88" width="680" height="56" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="50" y="98" width="100" height="36" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="100" y="121" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">A · 0</text>
  <rect x="158" y="98" width="100" height="36" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="208" y="121" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">B · 0</text>
  <rect x="266" y="98" width="100" height="36" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="316" y="121" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">C · 0</text>
  <path d="M374 116 L710 116" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="544" y="111" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">ortgan bo'sh joy ishlatilmaydi</text>

  <!-- 2: hammasi 1 -->
  <text x="40" y="186" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#1e293b">flex-grow: 1 (hammasiga) — bo'sh joy teng bo'linadi</text>
  <rect x="40" y="196" width="680" height="56" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="50" y="206" width="220" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="160" y="229" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">A · 1</text>
  <rect x="278" y="206" width="220" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="388" y="229" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">B · 1</text>
  <rect x="506" y="206" width="204" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="608" y="229" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">C · 1</text>

  <!-- 3: 1 / 2 / 1 -->
  <text x="40" y="294" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#1e293b">flex-grow: 1 / 2 / 1 — B ikki barobar ko'p oladi</text>
  <rect x="40" y="304" width="680" height="56" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="50" y="314" width="165" height="36" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="132" y="337" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">A · 1</text>
  <rect x="223" y="314" width="330" height="36" rx="4" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="388" y="337" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">B · 2</text>
  <rect x="561" y="314" width="149" height="36" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="635" y="337" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">C · 1</text>

  <text x="40" y="402" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e293b">Qanday hisoblanadi?</text>
  <text x="40" y="424" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">1. Konteynerdan itemlarning asl (basis) eni ayriladi -&gt; ortgan bo'sh joy chiqadi.</text>
  <text x="40" y="446" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">2. Bo'sh joy grow ulushlariga bo'linadi: 1+2+1 = 4 ulush. B (2/4) ni, A va C (1/4) dan oladi.</text>
  <text x="40" y="468" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">3. Har item: asl en + o'z ulushi. flex-grow faqat ORTGAN joyni bo'ladi, butun enini emas.</text>
</svg>
