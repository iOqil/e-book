<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540">
  <title>auto-fill va auto-fit farqi: ortib qolgan bo'sh joyda auto-fill bo'sh ustunlar yaratadi, auto-fit esa mavjud ustunlarni cho'zadi</title>
  <rect x="0" y="0" width="760" height="540" fill="#f8fafc"/>

  <!-- Sarlavha -->
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">auto-fill va auto-fit farqi</text>
  <text x="380" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">repeat(auto-fill / auto-fit, minmax(150px, 1fr)) — keng konteyner, atigi 3 ta element</text>

  <!-- ===== auto-fill (yuqori) ===== -->
  <text x="40" y="100" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">auto-fill</text>
  <text x="40" y="120" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">bo'sh, ko'rinmas ustunlarni HAM yaratadi</text>

  <rect x="40" y="132" width="680" height="120" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <!-- 3 ta to'la element -->
  <rect x="52" y="144" width="150" height="96" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="127" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#2563eb">1</text>
  <rect x="212" y="144" width="150" height="96" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="287" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#2563eb">2</text>
  <rect x="372" y="144" width="150" height="96" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="447" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#2563eb">3</text>
  <!-- 2 ta bo'sh "ruh" ustun -->
  <rect x="532" y="144" width="80" height="96" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="572" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">bo'sh</text>
  <rect x="622" y="144" width="80" height="96" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="662" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">bo'sh</text>
  <text x="617" y="232" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">bo'sh ustunlar joy egallaydi</text>

  <!-- ===== auto-fit (past) ===== -->
  <text x="40" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">auto-fit</text>
  <text x="40" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">bo'sh ustunlarni YIG'ADI, mavjudlarini cho'zadi</text>

  <rect x="40" y="332" width="680" height="120" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <!-- 3 ta cho'zilgan element (qolgan joyni 1fr orqali bo'lib oladi) -->
  <rect x="52" y="344" width="216" height="96" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="160" y="398" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">1</text>
  <rect x="278" y="344" width="216" height="96" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="386" y="398" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">2</text>
  <rect x="504" y="344" width="204" height="96" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="606" y="398" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">3</text>
  <text x="380" y="446" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">elementlar bo'sh joyni to'ldirib cho'ziladi (1fr tufayli)</text>

  <!-- Pastki xulosa -->
  <rect x="40" y="474" width="680" height="52" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="498" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#b45309">Qachon nima?</text>
  <text x="380" y="518" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Galereyada elementlar kengaysin desangiz — auto-fit. Ustun "to'r"i barqaror qolsin desangiz — auto-fill.</text>
</svg>
