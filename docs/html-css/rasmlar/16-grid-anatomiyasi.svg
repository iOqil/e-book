<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540">
  <title>CSS Grid anatomiyasi: grid lines (chiziqlar), tracks (yo'lakchalar), cell (katak), area (soha) va gap yorliqlangan</title>
  <rect x="0" y="0" width="760" height="540" fill="#f8fafc"/>

  <!-- Sarlavha -->
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">CSS Grid anatomiyasi</text>
  <text x="380" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">3 ustun &#215; 2 qator panjarasi</text>

  <!-- Panjara konteyneri (och fon) -->
  <rect x="150" y="90" width="470" height="320" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>

  <!-- ===== Kataklar (cells) ===== -->
  <!-- Qator 1 -->
  <rect x="170" y="110" width="130" height="130" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="320" y="110" width="130" height="130" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="470" y="110" width="130" height="130" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <!-- Qator 2 -->
  <rect x="170" y="260" width="130" height="130" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="320" y="260" width="130" height="130" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="470" y="260" width="130" height="130" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>

  <!-- Bitta katakni "cell" deb belgilash -->
  <text x="235" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">katak</text>
  <text x="235" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(cell)</text>

  <!-- Area: ikkita katakni qamragan soha (o'ng pastki ikki katak) -->
  <rect x="320" y="260" width="280" height="130" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="3" stroke-dasharray="7 4"/>
  <text x="460" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">soha (area)</text>
  <text x="460" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">2 katakni qamraydi</text>

  <!-- ===== Grid lines (chiziq) raqamlari ===== -->
  <!-- Vertikal chiziqlar: 1..4 -->
  <text x="170" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">1</text>
  <text x="320" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">2</text>
  <text x="470" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">3</text>
  <text x="600" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">4</text>
  <!-- Gorizontal chiziqlar: 1..3 -->
  <text x="160" y="115" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">1</text>
  <text x="160" y="265" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">2</text>
  <text x="160" y="395" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">3</text>

  <!-- gap o'qi: ustunlar orasidagi bo'shliq -->
  <rect x="300" y="110" width="20" height="280" fill="#fde68a" opacity="0.8"/>
  <line x1="310" y1="250" x2="310" y2="430" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="310" y="450" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#b45309">gap</text>
  <text x="310" y="468" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">(yo'laklar orasidagi bo'shliq)</text>

  <!-- track (ustun yo'lakchasi) yorlig'i: birinchi ustun ostida -->
  <line x1="170" y1="240" x2="300" y2="240" stroke="#7c3aed" stroke-width="2"/>
  <line x1="170" y1="234" x2="170" y2="246" stroke="#7c3aed" stroke-width="2"/>
  <line x1="300" y1="234" x2="300" y2="246" stroke="#7c3aed" stroke-width="2"/>
  <text x="235" y="228" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#7c3aed">ustun yo'lakchasi (column track)</text>

  <!-- track (qator yo'lakchasi): chap chetda -->
  <line x1="140" y1="110" x2="140" y2="240" stroke="#7c3aed" stroke-width="2"/>
  <line x1="134" y1="110" x2="146" y2="110" stroke="#7c3aed" stroke-width="2"/>
  <line x1="134" y1="240" x2="146" y2="240" stroke="#7c3aed" stroke-width="2"/>
  <text x="100" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#7c3aed">qator</text>
  <text x="100" y="194" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#7c3aed">yo'lakchasi</text>
  <text x="100" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#7c3aed">(row track)</text>

  <!-- Izoh qutisi (chiziq tushuntirishi) -->
  <rect x="60" y="488" width="640" height="40" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="380" y="513" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b"><tspan font-weight="bold" fill="#dc2626">Qizil raqamlar</tspan> = grid lines (chiziqlar). Joylashtirishda mana shu raqamlarga murojaat qilamiz.</text>
</svg>
