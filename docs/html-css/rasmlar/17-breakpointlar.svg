<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440">
  <title>Mobil, planshet va desktop ekran o'lchamlari va tipik breakpoint chiziqlari</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>

  <text x="380" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Ekran o'lchamlari va breakpoint chiziqlari</text>

  <!-- O'lcham o'qi -->
  <line x1="60" y1="100" x2="700" y2="100" stroke="#475569" stroke-width="2"/>
  <polygon points="700,100 690,95 690,105" fill="#475569"/>
  <text x="60" y="92" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">0px</text>
  <text x="705" y="104" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">px en</text>

  <!-- Breakpoint chiziqlari (640, 768, 1024) -->
  <line x1="230" y1="86" x2="230" y2="360" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="230" y="78" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">640px</text>

  <line x1="400" y1="86" x2="400" y2="360" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="400" y="78" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">768px</text>

  <line x1="560" y1="86" x2="560" y2="360" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="560" y="78" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">1024px</text>

  <!-- Diapazon yorliqlari ustida -->
  <text x="145" y="120" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">mobil</text>
  <text x="315" y="120" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">katta telefon</text>
  <text x="480" y="120" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">planshet</text>
  <text x="630" y="120" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">desktop</text>

  <!-- Telefon -->
  <rect x="100" y="180" width="70" height="130" rx="10" fill="#1e293b"/>
  <rect x="107" y="194" width="56" height="96" rx="2" fill="#ffffff"/>
  <circle cx="135" cy="300" r="4" fill="#475569"/>
  <text x="135" y="338" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Mobil</text>
  <text x="135" y="356" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">~320–640px</text>

  <!-- Planshet -->
  <rect x="290" y="170" width="120" height="150" rx="10" fill="#1e293b"/>
  <rect x="298" y="180" width="104" height="130" rx="2" fill="#ffffff"/>
  <text x="350" y="346" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Planshet</text>
  <text x="350" y="364" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">~768–1024px</text>

  <!-- Desktop -->
  <rect x="500" y="160" width="190" height="120" rx="6" fill="#1e293b"/>
  <rect x="508" y="168" width="174" height="104" rx="2" fill="#ffffff"/>
  <rect x="575" y="280" width="40" height="14" fill="#1e293b"/>
  <rect x="555" y="294" width="80" height="8" rx="3" fill="#475569"/>
  <text x="595" y="346" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Desktop</text>
  <text x="595" y="364" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">1024px+</text>

  <!-- Izoh -->
  <rect x="60" y="390" width="640" height="36" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="413" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Breakpoint = layout o'zgaradigan en. Tarkibingiz "buzilgan" joyda breakpoint qo'ying.</text>
</svg>
