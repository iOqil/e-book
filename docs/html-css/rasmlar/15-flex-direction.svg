<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560">
  <title>flex-direction qiymatlari: row, row-reverse, column, column-reverse</title>
  <defs>
    <marker id="dir15" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="560" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">flex-direction — main o'q yo'nalishini belgilaydi</text>

  <!-- row -->
  <text x="40" y="80" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">row (standart)</text>
  <rect x="40" y="92" width="300" height="80" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="54" y="110" width="50" height="44" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="79" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#2563eb">1</text>
  <rect x="114" y="110" width="50" height="44" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="139" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#2563eb">2</text>
  <rect x="174" y="110" width="50" height="44" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="199" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#2563eb">3</text>
  <line x1="54" y1="186" x2="224" y2="186" stroke="#475569" stroke-width="2" marker-end="url(#dir15)"/>
  <text x="244" y="135" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">chapdan</text>
  <text x="244" y="151" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">o'ngga</text>

  <!-- row-reverse -->
  <text x="420" y="80" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">row-reverse</text>
  <rect x="420" y="92" width="300" height="80" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="656" y="110" width="50" height="44" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="681" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#2563eb">1</text>
  <rect x="596" y="110" width="50" height="44" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="621" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#2563eb">2</text>
  <rect x="536" y="110" width="50" height="44" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="561" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#2563eb">3</text>
  <line x1="706" y1="186" x2="536" y2="186" stroke="#475569" stroke-width="2" marker-end="url(#dir15)"/>
  <text x="430" y="135" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">o'ngdan</text>
  <text x="430" y="151" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">chapga</text>

  <!-- column -->
  <text x="40" y="250" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">column</text>
  <rect x="40" y="262" width="300" height="270" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="70" y="280" width="150" height="44" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="145" y="308" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">1</text>
  <rect x="70" y="338" width="150" height="44" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="145" y="366" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">2</text>
  <rect x="70" y="396" width="150" height="44" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="145" y="424" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">3</text>
  <line x1="250" y1="290" x2="250" y2="430" stroke="#475569" stroke-width="2" marker-end="url(#dir15)"/>
  <text x="266" y="350" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yuqoridan</text>
  <text x="266" y="366" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">pastga</text>

  <!-- column-reverse -->
  <text x="420" y="250" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">column-reverse</text>
  <rect x="420" y="262" width="300" height="270" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="450" y="396" width="150" height="44" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="525" y="424" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">1</text>
  <rect x="450" y="338" width="150" height="44" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="525" y="366" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">2</text>
  <rect x="450" y="280" width="150" height="44" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="525" y="308" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">3</text>
  <line x1="630" y1="430" x2="630" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#dir15)"/>
  <text x="646" y="350" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">pastdan</text>
  <text x="646" y="366" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yuqoriga</text>

  <text x="380" y="552" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">row* da main o'q gorizontal, column* da vertikal. -reverse tartibni teskari qiladi.</text>
</svg>
