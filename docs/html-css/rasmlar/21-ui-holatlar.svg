<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" width="780" height="320">
  <title>Tugmaning besh holati: normal, hover, focus, active va disabled — har biri uchun rang va ko'rinish farqi</title>
  <rect x="0" y="0" width="780" height="320" fill="#f8fafc"/>
  <text x="390" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Tugmaning UI holatlari</text>
  <text x="390" y="60" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Bir tugma — foydalanuvchi harakatiga qarab besh xil ko'rinish</text>

  <!-- 1. normal -->
  <text x="90" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">:normal</text>
  <rect x="30" y="120" width="120" height="48" rx="8" fill="#2563eb"/>
  <text x="90" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Saqlash</text>
  <text x="90" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tinch holat</text>

  <!-- 2. hover -->
  <text x="240" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">:hover</text>
  <rect x="180" y="120" width="120" height="48" rx="8" fill="#1d4ed8"/>
  <text x="240" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Saqlash</text>
  <!-- kursor -->
  <path d="M252 154 l0 26 l7 -7 l5 11 l5 -2 l-5 -11 l10 0 z" fill="#1e293b" stroke="#ffffff" stroke-width="1"/>
  <text x="240" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">sichqon ustida</text>
  <text x="240" y="218" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">— quyuqroq</text>

  <!-- 3. focus-visible -->
  <text x="390" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">:focus-visible</text>
  <rect x="324" y="114" width="132" height="60" rx="11" fill="none" stroke="#16a34a" stroke-width="3"/>
  <rect x="330" y="120" width="120" height="48" rx="8" fill="#2563eb"/>
  <text x="390" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Saqlash</text>
  <text x="390" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">klaviatura fokusi</text>
  <text x="390" y="218" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">— focus ring</text>

  <!-- 4. active -->
  <text x="540" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f59e0b">:active</text>
  <rect x="480" y="124" width="120" height="44" rx="8" fill="#1e40af"/>
  <text x="540" y="152" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Saqlash</text>
  <text x="540" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">bosilgan payt</text>
  <text x="540" y="218" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">— "bosildi" hissi</text>

  <!-- 5. disabled -->
  <text x="690" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">:disabled</text>
  <rect x="630" y="120" width="120" height="48" rx="8" fill="#cbd5e1"/>
  <text x="690" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#94a3b8">Saqlash</text>
  <text x="690" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">o'chirilgan</text>
  <text x="690" y="218" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">— bosib bo'lmaydi</text>

  <!-- Pastki izoh -->
  <rect x="40" y="252" width="700" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="390" y="281" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Har holat — foydalanuvchiga qaytariladigan vizual javob. Holatlar bir-birining ustiga ham qo'shilishi mumkin.</text>
</svg>
