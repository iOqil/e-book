<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
  <title>Flex konteyner: main o'q (asosiy) va cross o'q (ko'ndalang) row holatida</title>
  <defs>
    <marker id="oq15a" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="oq15b" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>

  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Flex konteyner va ikki o'q (flex-direction: row)</text>
  <text x="380" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">main o'q — itemlar shu bo'ylab joylashadi · cross o'q — unga ko'ndalang</text>

  <!-- Konteyner -->
  <rect x="80" y="100" width="600" height="200" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="92" y="124" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#475569">konteyner (display: flex)</text>

  <!-- Itemlar -->
  <rect x="120" y="150" width="100" height="110" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="212" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">item 1</text>
  <rect x="250" y="150" width="100" height="110" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="212" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">item 2</text>
  <rect x="380" y="150" width="100" height="110" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="430" y="212" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">item 3</text>

  <!-- main o'q (gorizontal) -->
  <line x1="100" y1="335" x2="660" y2="335" stroke="#2563eb" stroke-width="3" marker-end="url(#oq15a)"/>
  <text x="380" y="360" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">main o'q (asosiy) — justify-content shu bo'ylab tekislaydi</text>

  <!-- cross o'q (vertikal) -->
  <line x1="710" y1="110" x2="710" y2="295" stroke="#16a34a" stroke-width="3" marker-end="url(#oq15b)"/>
  <text x="724" y="205" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a" transform="rotate(90 724 205)">cross o'q (ko'ndalang) — align-items</text>
</svg>
