<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560">
  <title>Asosiy input turlarining vizual katalogi: text, password, email, number, date, range, color, checkbox, radio, file, search</title>
  <rect x="0" y="0" width="820" height="560" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">input turlari katalogi (type="...")</text>
  <text x="410" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">type atributi brauzerga maydonni qanday ko'rsatish va tekshirishni aytadi</text>

  <!-- Qator 1 -->
  <!-- text -->
  <text x="50" y="100" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">type="text"</text>
  <rect x="50" y="108" width="200" height="34" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="62" y="130" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Oddiy matn</text>

  <!-- password -->
  <text x="300" y="100" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">type="password"</text>
  <rect x="300" y="108" width="200" height="34" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="312" y="132" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;</text>

  <!-- email -->
  <text x="550" y="100" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">type="email"</text>
  <rect x="550" y="108" width="200" height="34" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="562" y="130" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">ali@mail.uz</text>

  <!-- Qator 2 -->
  <!-- number -->
  <text x="50" y="180" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">type="number"</text>
  <rect x="50" y="188" width="200" height="34" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="62" y="210" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">42</text>
  <rect x="222" y="188" width="28" height="17" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="236" y="201" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">&#9650;</text>
  <rect x="222" y="205" width="28" height="17" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="236" y="219" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">&#9660;</text>

  <!-- date -->
  <text x="300" y="180" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">type="date"</text>
  <rect x="300" y="188" width="200" height="34" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="312" y="210" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">09.06.2026</text>
  <rect x="468" y="192" width="26" height="26" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="481" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">&#128197;</text>

  <!-- tel -->
  <text x="550" y="180" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">type="tel"</text>
  <rect x="550" y="188" width="200" height="34" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="562" y="210" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">+998 90 123 45 67</text>

  <!-- Qator 3 -->
  <!-- range -->
  <text x="50" y="260" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">type="range"</text>
  <line x1="55" y1="285" x2="245" y2="285" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="55" y1="285" x2="160" y2="285" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <circle cx="160" cy="285" r="11" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>

  <!-- color -->
  <text x="300" y="260" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">type="color"</text>
  <rect x="300" y="270" width="50" height="34" rx="5" fill="#16a34a" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="362" y="292" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">rang tanlash</text>

  <!-- search -->
  <text x="550" y="260" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">type="search"</text>
  <rect x="550" y="270" width="200" height="34" rx="17" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="568" cy="287" r="6" fill="none" stroke="#475569" stroke-width="1.5"/>
  <line x1="572" y1="291" x2="577" y2="296" stroke="#475569" stroke-width="1.5"/>
  <text x="584" y="291" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">qidirish...</text>

  <!-- Qator 4 -->
  <!-- checkbox -->
  <text x="50" y="345" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">type="checkbox" (ko'p tanlov)</text>
  <rect x="55" y="356" width="20" height="20" rx="4" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
  <path d="M59,366 L63,371 L71,360" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <text x="84" y="371" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">PHP</text>
  <rect x="150" y="356" width="20" height="20" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="179" y="371" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">JS</text>

  <!-- radio -->
  <text x="300" y="345" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">type="radio" (bittasi)</text>
  <circle cx="312" cy="366" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="312" cy="366" r="5" fill="#2563eb"/>
  <text x="330" y="371" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Erkak</text>
  <circle cx="410" cy="366" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="428" y="371" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Ayol</text>

  <!-- file -->
  <text x="550" y="345" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">type="file"</text>
  <rect x="550" y="356" width="120" height="32" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="610" y="377" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Fayl tanlash</text>
  <text x="678" y="377" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">rasm.png</text>

  <!-- Qator 5: select / textarea -->
  <text x="50" y="430" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">select (ro'yxatdan tanlash)</text>
  <rect x="50" y="440" width="200" height="34" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="62" y="462" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Toshkent</text>
  <path d="M228,455 L240,455 L234,463 z" fill="#475569"/>

  <text x="300" y="430" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">textarea (ko'p qatorli matn)</text>
  <rect x="300" y="440" width="200" height="70" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="312" y="462" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Uzun izoh matni</text>
  <text x="312" y="482" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">bir necha qatorda...</text>
  <path d="M492,508 L500,508 L500,500 z" fill="#94a3b8"/>

  <!-- button -->
  <text x="550" y="430" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">button (submit)</text>
  <rect x="550" y="440" width="140" height="40" rx="6" fill="#16a34a"/>
  <text x="620" y="465" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Tasdiqlash</text>

  <!-- pastki izoh -->
  <rect x="50" y="525" width="720" height="24" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="410" y="541" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">type noto'g'ri bo'lsa, brauzer "text" deb hisoblaydi — shuning uchun har doim mos type tanlang</text>
</svg>
