<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>Jadval anatomiyasi: caption, thead, tbody, tfoot va th vs td yacheykalar</title>

  <!-- Tashqi sarlavha -->
  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Jadval anatomiyasi (&lt;table&gt;)</text>

  <!-- Tashqi table ramkasi -->
  <rect x="40" y="56" width="470" height="384" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2.5"/>
  <text x="56" y="78" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">&lt;table&gt;</text>

  <!-- caption -->
  <rect x="60" y="88" width="430" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="275" y="110" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">&lt;caption&gt; — Jadval sarlavhasi</text>

  <!-- thead -->
  <rect x="60" y="132" width="430" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="74" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">&lt;thead&gt;</text>
  <!-- thead qatori: th yacheykalar -->
  <rect x="75" y="156" width="130" height="26" rx="4" fill="#2563eb"/>
  <text x="140" y="173" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">&lt;th&gt; Ism</text>
  <rect x="215" y="156" width="130" height="26" rx="4" fill="#2563eb"/>
  <text x="280" y="173" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">&lt;th&gt; Yosh</text>
  <rect x="355" y="156" width="125" height="26" rx="4" fill="#2563eb"/>
  <text x="417" y="173" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">&lt;th&gt; Shahar</text>

  <!-- tbody -->
  <rect x="60" y="198" width="430" height="120" rx="6" fill="#f1f5f9" stroke="#16a34a" stroke-width="2"/>
  <text x="74" y="216" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">&lt;tbody&gt;</text>
  <!-- 1-qator -->
  <rect x="75" y="222" width="130" height="26" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="140" y="239" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">&lt;td&gt; Ali</text>
  <rect x="215" y="222" width="130" height="26" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="280" y="239" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">&lt;td&gt; 25</text>
  <rect x="355" y="222" width="125" height="26" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="417" y="239" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">&lt;td&gt; Buxoro</text>
  <!-- 2-qator -->
  <rect x="75" y="254" width="130" height="26" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="140" y="271" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">&lt;td&gt; Lola</text>
  <rect x="215" y="254" width="130" height="26" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="280" y="271" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">&lt;td&gt; 30</text>
  <rect x="355" y="254" width="125" height="26" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="417" y="271" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">&lt;td&gt; Toshkent</text>
  <!-- tr yorlig'i -->
  <text x="74" y="294" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">har bir gorizontal qator = &lt;tr&gt;</text>

  <!-- tfoot -->
  <rect x="60" y="328" width="430" height="50" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="74" y="346" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">&lt;tfoot&gt;</text>
  <rect x="75" y="350" width="130" height="22" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
  <text x="140" y="365" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Jami</text>
  <rect x="215" y="350" width="265" height="22" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
  <text x="347" y="365" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">2 ta yozuv</text>

  <!-- O'ng tomon: izohli legenda -->
  <text x="540" y="78" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Belgilar</text>

  <rect x="540" y="92" width="26" height="26" rx="4" fill="#2563eb"/>
  <text x="574" y="103" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">&lt;th&gt;</text>
  <text x="574" y="117" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">sarlavha yacheyka</text>

  <rect x="540" y="130" width="26" height="26" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="574" y="141" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">&lt;td&gt;</text>
  <text x="574" y="155" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">oddiy ma'lumot</text>

  <line x1="540" y1="176" x2="700" y2="176" stroke="#94a3b8" stroke-width="1"/>

  <text x="540" y="200" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">&#8226; &lt;caption&gt; = nom</text>
  <text x="540" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">&#8226; &lt;thead&gt; = bosh</text>
  <text x="540" y="244" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">&#8226; &lt;tbody&gt; = tana</text>
  <text x="540" y="266" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">&#8226; &lt;tfoot&gt; = oyoq</text>

  <line x1="540" y1="284" x2="700" y2="284" stroke="#94a3b8" stroke-width="1"/>

  <text x="540" y="308" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Tartib (HTML):</text>
  <text x="540" y="328" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">caption &#8594; thead</text>
  <text x="540" y="346" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">&#8594; tbody &#8594; tfoot</text>
  <text x="540" y="370" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">brauzer tfoot ni</text>
  <text x="540" y="385" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">baribir pastda chizadi</text>

  <!-- Pastki izoh -->
  <text x="360" y="424" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Jadval = qatorlar (&lt;tr&gt;) to'plami; har qator yacheykalardan (&lt;th&gt; / &lt;td&gt;) iborat</text>
</svg>
