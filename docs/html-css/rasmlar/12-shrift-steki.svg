<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <title>Shrift steki: brauzer ro'yxatdagi shriftlarni navbatma-navbat sinaydi, birinchi mavjudini ishlatadi</title>
  <rect x="0" y="0" width="720" height="360" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">font-family — shrift steki (fallback zanjiri)</text>
  <text x="360" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">font-family: "Inter", Arial, sans-serif;</text>

  <!-- 1-shrift: yo'q -->
  <rect x="60" y="90" width="180" height="90" rx="10" fill="#fde2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="150" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#7f1d1d">1. "Inter"</text>
  <text x="150" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#7f1d1d">qurilmada yo'q</text>
  <text x="150" y="168" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" fill="#dc2626">&#10007;</text>

  <!-- 2-shrift: yo'q -->
  <rect x="270" y="90" width="180" height="90" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#92400e">2. Arial</text>
  <text x="360" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#92400e">qurilmada yo'q</text>
  <text x="360" y="168" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" fill="#f59e0b">&#10007;</text>

  <!-- 3-shrift: bor -->
  <rect x="480" y="90" width="180" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="570" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#14532d">3. sans-serif</text>
  <text x="570" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#14532d">tizim standarti — bor!</text>
  <text x="570" y="168" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" fill="#16a34a">&#10003;</text>

  <!-- strelkalar -->
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <line x1="240" y1="135" x2="266" y2="135" stroke="#475569" stroke-width="2.5" marker-end="url(#ok)"/>
  <line x1="450" y1="135" x2="476" y2="135" stroke="#475569" stroke-width="2.5" marker-end="url(#ok)"/>

  <text x="150" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">keyingisini sina</text>
  <text x="360" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">keyingisini sina</text>
  <text x="570" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">SHU ishlatiladi</text>

  <!-- izoh quti -->
  <rect x="60" y="250" width="600" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="360" y="282" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">Brauzer chapdan o'ngga yuradi, BIRINCHI mavjud shriftda to'xtaydi.</text>
  <text x="360" y="310" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#2563eb">Shuning uchun oxirida doim umumiy oila (sans-serif/serif) yoziladi — kafolatli zaxira.</text>
</svg>
