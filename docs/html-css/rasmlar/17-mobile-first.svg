<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440">
  <title>Mobile-first va desktop-first yondashuvlarning qatlamlanish farqi</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>

  <text x="380" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Mobile-first va desktop-first qatlamlanishi</text>

  <!-- ====== CHAP: mobile-first ====== -->
  <text x="200" y="74" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">Mobile-first (min-width)</text>

  <!-- Asos qatlam -->
  <rect x="70" y="92" width="260" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="200" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Asos stil (mobil)</text>
  <text x="200" y="136" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">media query'siz, eng sodda</text>

  <line x1="200" y1="150" x2="200" y2="166" stroke="#475569" stroke-width="2"/>
  <polygon points="200,170 195,160 205,160" fill="#475569"/>

  <rect x="90" y="170" width="220" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="200" y="197" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">@media (min-width: 768px)</text>

  <line x1="200" y1="214" x2="200" y2="230" stroke="#475569" stroke-width="2"/>
  <polygon points="200,234 195,224 205,224" fill="#475569"/>

  <rect x="110" y="234" width="180" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="200" y="261" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">@media (min-width: 1024px)</text>

  <text x="200" y="316" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Ekran kattalashgan sari</text>
  <text x="200" y="334" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">stil QO'SHILADI</text>

  <!-- Ajratuvchi -->
  <line x1="380" y1="70" x2="380" y2="360" stroke="#cbd5e1" stroke-width="2"/>

  <!-- ====== O'NG: desktop-first ====== -->
  <text x="560" y="74" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">Desktop-first (max-width)</text>

  <rect x="430" y="92" width="260" height="58" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="560" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Asos stil (desktop)</text>
  <text x="560" y="136" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">to'liq, murakkab</text>

  <line x1="560" y1="150" x2="560" y2="166" stroke="#475569" stroke-width="2"/>
  <polygon points="560,170 555,160 565,160" fill="#475569"/>

  <rect x="450" y="170" width="220" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="560" y="197" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">@media (max-width: 1024px)</text>

  <line x1="560" y1="214" x2="560" y2="230" stroke="#475569" stroke-width="2"/>
  <polygon points="560,234 555,224 565,224" fill="#475569"/>

  <rect x="470" y="234" width="180" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="560" y="261" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">@media (max-width: 768px)</text>

  <text x="560" y="316" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">Ekran kichraygan sari</text>
  <text x="560" y="334" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">stil USTIDAN YOZILADI</text>

  <!-- Pastki tavsiya -->
  <rect x="70" y="382" width="620" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="380" y="408" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Tavsiya: mobile-first. Sodda asosdan boshlab, kerakli joyda murakkablik qo'shasiz.</text>
</svg>
