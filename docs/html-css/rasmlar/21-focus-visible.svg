<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380">
  <title>focus-visible farqi: sichqon bilan bosilganda focus ring ko'rinmaydi, Tab klavishi bilan o'tilganda focus ring ko'rinadi</title>
  <rect x="0" y="0" width="780" height="380" fill="#f8fafc"/>
  <text x="390" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">:focus-visible — sichqon va klaviatura farqi</text>

  <!-- Ajratuvchi -->
  <line x1="390" y1="64" x2="390" y2="344" stroke="#cbd5e1" stroke-width="2"/>

  <!-- ====== CHAP: sichqon bilan ====== -->
  <text x="195" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">Sichqon bilan bosish</text>

  <!-- sichqon belgisi -->
  <rect x="160" y="110" width="70" height="56" rx="32" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <line x1="195" y1="110" x2="195" y2="138" stroke="#475569" stroke-width="2"/>
  <line x1="160" y1="138" x2="230" y2="138" stroke="#475569" stroke-width="2"/>
  <text x="195" y="190" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">foydalanuvchi tugmani</text>
  <text x="195" y="208" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">sichqon bilan bosadi</text>

  <line x1="195" y1="222" x2="195" y2="244" stroke="#475569" stroke-width="2"/>
  <polygon points="195,250 189,238 201,238" fill="#475569"/>

  <!-- natija: ring yo'q -->
  <rect x="125" y="256" width="140" height="50" rx="8" fill="#2563eb"/>
  <text x="195" y="287" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Yuborish</text>
  <text x="195" y="332" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">focus ring YO'Q</text>

  <!-- ====== O'NG: Tab bilan ====== -->
  <text x="585" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">Tab klavishi bilan</text>

  <!-- Tab klavishi -->
  <rect x="540" y="112" width="90" height="48" rx="6" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="585" y="142" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Tab</text>
  <path d="M548 152 l-8 4 l8 4 z" fill="#475569"/>
  <line x1="540" y1="156" x2="558" y2="156" stroke="#475569" stroke-width="2"/>
  <text x="585" y="190" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">foydalanuvchi tugmaga</text>
  <text x="585" y="208" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">klaviatura bilan o'tadi</text>

  <line x1="585" y1="222" x2="585" y2="244" stroke="#475569" stroke-width="2"/>
  <polygon points="585,250 579,238 591,238" fill="#475569"/>

  <!-- natija: ring bor -->
  <rect x="509" y="250" width="152" height="62" rx="11" fill="none" stroke="#16a34a" stroke-width="3"/>
  <rect x="515" y="256" width="140" height="50" rx="8" fill="#2563eb"/>
  <text x="585" y="287" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Yuborish</text>
  <text x="585" y="332" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">focus ring KO'RINADI</text>

  <!-- Pastki izoh -->
  <rect x="40" y="354" width="700" height="20" rx="6" fill="none"/>
  <text x="390" y="369" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Brauzer "kirish usuli" ni biladi: ring faqat klaviatura bilan kerak bo'lganda chiqadi.</text>
</svg>
