<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <title>Positioned ota: absolute element eng yaqin positioned ota'ga nisbatan joylashadi, topilmasa body'ga</title>
  <rect x="0" y="0" width="720" height="420" fill="#f8fafc"/>

  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="bold" fill="#1e293b">absolute element kimga nisbatan joylashadi?</text>

  <!-- CHAP: ota positioned EMAS -->
  <text x="180" y="62" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">Ota positioned EMAS</text>
  <!-- body -->
  <rect x="30" y="74" width="300" height="280" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="42" y="92" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">body (root)</text>
  <!-- ota: position static -->
  <rect x="60" y="120" width="240" height="180" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="72" y="138" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">.ota (position: static)</text>
  <!-- absolute element body burchagiga ketgan -->
  <rect x="246" y="290" width="78" height="40" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="285" y="314" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">absolute</text>
  <text x="180" y="378" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">positioned ota yo'q -&gt; body'ga nisbatan</text>

  <!-- O'NG: ota positioned -->
  <text x="540" y="62" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Ota positioned (relative)</text>
  <rect x="390" y="74" width="300" height="280" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="402" y="92" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">body (root)</text>
  <!-- ota: position relative -->
  <rect x="420" y="120" width="240" height="180" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="432" y="138" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">.ota (position: relative)</text>
  <!-- absolute element ota burchagiga -->
  <rect x="582" y="246" width="68" height="40" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="616" y="270" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">absolute</text>
  <text x="540" y="378" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">eng yaqin positioned ota'ga nisbatan</text>

  <text x="360" y="406" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Maslahat: ota'ga position: relative ber — bola absolute uni "tayanch" qilib oladi.</text>
</svg>
