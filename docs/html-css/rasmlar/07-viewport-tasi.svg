<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480">
  <title>Viewport meta tegi bilan va usiz mobil ekranda sahifa ko'rinishi taqqosi</title>
  <rect x="0" y="0" width="720" height="480" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Viewport meta tegi: bor va yo'q holat</text>

  <!-- ============ CHAP: viewport YO'Q ============ -->
  <text x="190" y="70" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">Viewport YO'Q</text>
  <text x="190" y="88" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">brauzer 980px deb o'ylaydi</text>

  <!-- Telefon ramkasi -->
  <rect x="100" y="100" width="180" height="330" rx="20" fill="#1e293b"/>
  <rect x="112" y="124" width="156" height="282" rx="4" fill="#ffffff"/>
  <circle cx="190" cy="418" r="7" fill="#475569"/>

  <!-- Kichraytirilgan, kichik matnli sahifa (zoom out) -->
  <rect x="118" y="130" width="144" height="24" fill="#2563eb"/>
  <text x="190" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff">Sayt sarlavhasi</text>
  <rect x="124" y="162" width="132" height="8" fill="#cbd5e1"/>
  <rect x="124" y="174" width="132" height="6" fill="#e2e8f0"/>
  <rect x="124" y="184" width="132" height="6" fill="#e2e8f0"/>
  <rect x="124" y="194" width="100" height="6" fill="#e2e8f0"/>
  <rect x="124" y="210" width="60" height="36" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="190" y="210" width="60" height="36" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="124" y="254" width="132" height="6" fill="#e2e8f0"/>
  <rect x="124" y="264" width="132" height="6" fill="#e2e8f0"/>
  <rect x="124" y="274" width="90" height="6" fill="#e2e8f0"/>
  <!-- Gorizontal aylantirish chizig'i (muammo) -->
  <rect x="118" y="392" width="144" height="8" fill="#fecaca"/>
  <rect x="118" y="392" width="48" height="8" fill="#dc2626"/>

  <text x="190" y="452" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">Matn juda mayda, gorizontal scroll</text>

  <!-- ============ O'NG: viewport BOR ============ -->
  <text x="530" y="70" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">Viewport BOR</text>
  <text x="530" y="88" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">width=device-width</text>

  <rect x="440" y="100" width="180" height="330" rx="20" fill="#1e293b"/>
  <rect x="452" y="124" width="156" height="282" rx="4" fill="#ffffff"/>
  <circle cx="530" cy="418" r="7" fill="#475569"/>

  <!-- Normal, o'qsa bo'ladigan sahifa -->
  <rect x="452" y="124" width="156" height="34" fill="#2563eb"/>
  <text x="530" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff">Sayt sarlavhasi</text>
  <rect x="464" y="172" width="132" height="12" rx="2" fill="#cbd5e1"/>
  <rect x="464" y="192" width="132" height="9" rx="2" fill="#e2e8f0"/>
  <rect x="464" y="206" width="132" height="9" rx="2" fill="#e2e8f0"/>
  <rect x="464" y="220" width="96" height="9" rx="2" fill="#e2e8f0"/>
  <rect x="464" y="244" width="132" height="40" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="530" y="268" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Karta</text>
  <rect x="464" y="298" width="132" height="9" rx="2" fill="#e2e8f0"/>
  <rect x="464" y="312" width="132" height="9" rx="2" fill="#e2e8f0"/>
  <rect x="464" y="326" width="80" height="9" rx="2" fill="#e2e8f0"/>
  <rect x="464" y="354" width="132" height="34" rx="6" fill="#16a34a"/>
  <text x="530" y="376" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff">Tugma</text>

  <text x="530" y="452" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Ekranga moslashgan, o'qish oson</text>
</svg>
