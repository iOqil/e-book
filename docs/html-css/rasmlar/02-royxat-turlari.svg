<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400">
  <title>Ro'yxat turlari yonma-yon: tartibsiz (ul), tartibli (ol) va tavsif ro'yxati (dl)</title>
  <rect x="0" y="0" width="680" height="400" fill="#f8fafc"/>
  <text x="340" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Ro'yxatning uch turi</text>

  <!-- ===== ul ===== -->
  <rect x="20" y="56" width="200" height="300" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="20" y="56" width="200" height="40" rx="10" fill="#2563eb"/>
  <rect x="20" y="80" width="200" height="16" fill="#2563eb"/>
  <text x="120" y="83" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">&lt;ul&gt; — tartibsiz</text>
  <text x="120" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tartib muhim emas</text>

  <circle cx="48" cy="146" r="5" fill="#1e293b"/>
  <text x="64" y="151" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">Olma</text>
  <circle cx="48" cy="180" r="5" fill="#1e293b"/>
  <text x="64" y="185" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">Banan</text>
  <circle cx="48" cy="214" r="5" fill="#1e293b"/>
  <text x="64" y="219" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">Uzum</text>

  <rect x="36" y="244" width="168" height="96" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="46" y="266" font-family="Consolas, monospace" font-size="13" fill="#2563eb">&lt;ul&gt;</text>
  <text x="56" y="284" font-family="Consolas, monospace" font-size="13" fill="#1e293b">&lt;li&gt;Olma&lt;/li&gt;</text>
  <text x="56" y="302" font-family="Consolas, monospace" font-size="13" fill="#1e293b">&lt;li&gt;Banan&lt;/li&gt;</text>
  <text x="56" y="320" font-family="Consolas, monospace" font-size="13" fill="#1e293b">&lt;li&gt;Uzum&lt;/li&gt;</text>
  <text x="46" y="336" font-family="Consolas, monospace" font-size="13" fill="#2563eb">&lt;/ul&gt;</text>

  <!-- ===== ol ===== -->
  <rect x="240" y="56" width="200" height="300" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="240" y="56" width="200" height="40" rx="10" fill="#16a34a"/>
  <rect x="240" y="80" width="200" height="16" fill="#16a34a"/>
  <text x="340" y="83" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">&lt;ol&gt; — tartibli</text>
  <text x="340" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tartib muhim (qadamlar)</text>

  <text x="256" y="151" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">1.</text>
  <text x="280" y="151" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">Suvni qaynat</text>
  <text x="256" y="185" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">2.</text>
  <text x="280" y="185" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">Choy sol</text>
  <text x="256" y="219" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">3.</text>
  <text x="280" y="219" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">Damla</text>

  <rect x="256" y="244" width="168" height="96" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="266" y="266" font-family="Consolas, monospace" font-size="13" fill="#16a34a">&lt;ol&gt;</text>
  <text x="276" y="284" font-family="Consolas, monospace" font-size="13" fill="#1e293b">&lt;li&gt;Qaynat&lt;/li&gt;</text>
  <text x="276" y="302" font-family="Consolas, monospace" font-size="13" fill="#1e293b">&lt;li&gt;Sol&lt;/li&gt;</text>
  <text x="276" y="320" font-family="Consolas, monospace" font-size="13" fill="#1e293b">&lt;li&gt;Damla&lt;/li&gt;</text>
  <text x="266" y="336" font-family="Consolas, monospace" font-size="13" fill="#16a34a">&lt;/ol&gt;</text>

  <!-- ===== dl ===== -->
  <rect x="460" y="56" width="200" height="300" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="460" y="56" width="200" height="40" rx="10" fill="#f59e0b"/>
  <rect x="460" y="80" width="200" height="16" fill="#f59e0b"/>
  <text x="560" y="83" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">&lt;dl&gt; — tavsif</text>
  <text x="560" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">atama + izoh juftligi</text>

  <text x="476" y="151" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f59e0b">HTML</text>
  <text x="494" y="170" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tuzilma tili</text>
  <text x="476" y="199" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f59e0b">CSS</text>
  <text x="494" y="218" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ko'rinish tili</text>

  <rect x="476" y="244" width="168" height="96" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="486" y="264" font-family="Consolas, monospace" font-size="13" fill="#f59e0b">&lt;dl&gt;</text>
  <text x="496" y="281" font-family="Consolas, monospace" font-size="13" fill="#1e293b">&lt;dt&gt;HTML&lt;/dt&gt;</text>
  <text x="496" y="298" font-family="Consolas, monospace" font-size="13" fill="#1e293b">&lt;dd&gt;...&lt;/dd&gt;</text>
  <text x="486" y="334" font-family="Consolas, monospace" font-size="13" fill="#f59e0b">&lt;/dl&gt;</text>
</svg>
