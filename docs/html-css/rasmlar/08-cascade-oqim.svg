<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <title>Cascade: uslublar yuqoridan pastga oqib, oxirgisi g'olib chiqishi</title>

  <defs>
    <marker id="ok08" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Sarlavha -->
  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Cascade — uslublar "sharsharadek" oqadi</text>
  <text x="360" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Bir xil elementga bir xil property kelsa, OXIRGI / KUCHLIROQ qoida g'olib bo'ladi</text>

  <!-- 1-qatlam: brauzer default -->
  <rect x="90" y="80" width="320" height="50" rx="9" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="250" y="103" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">1. Brauzer default (user-agent)</text>
  <text x="250" y="121" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">p { color: black; }</text>

  <line x1="250" y1="130" x2="250" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#ok08)"/>

  <!-- 2-qatlam: external/internal -->
  <rect x="90" y="152" width="320" height="50" rx="9" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="2"/>
  <text x="250" y="175" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">2. Sizning CSS (external / internal)</text>
  <text x="250" y="193" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">p { color: blue; }</text>

  <line x1="250" y1="202" x2="250" y2="222" stroke="#475569" stroke-width="2" marker-end="url(#ok08)"/>

  <!-- 3-qatlam: inline -->
  <rect x="90" y="224" width="320" height="50" rx="9" fill="#dc2626" fill-opacity="0.10" stroke="#dc2626" stroke-width="2"/>
  <text x="250" y="247" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">3. Inline style (eng kuchli)</text>
  <text x="250" y="265" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">style="color: green;"</text>

  <line x1="250" y1="274" x2="250" y2="296" stroke="#475569" stroke-width="2" marker-end="url(#ok08)"/>

  <!-- Natija -->
  <rect x="90" y="298" width="320" height="54" rx="9" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="2.5"/>
  <text x="250" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Natija: matn YASHIL bo'ladi</text>
  <text x="250" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">eng kuchli qoida (inline) g'olib chiqdi</text>

  <!-- O'ng tomon izoh paneli -->
  <rect x="448" y="80" width="240" height="272" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="568" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Cascade nimaga qarab</text>
  <text x="568" y="127" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">hal qiladi?</text>

  <circle cx="472" cy="156" r="4" fill="#2563eb"/>
  <text x="486" y="161" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Manba (kim yozgan)</text>

  <circle cx="472" cy="192" r="4" fill="#2563eb"/>
  <text x="486" y="197" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Specificity (aniqlik)</text>

  <circle cx="472" cy="228" r="4" fill="#2563eb"/>
  <text x="486" y="233" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Tartib (oxirgi qoida)</text>

  <rect x="468" y="256" width="200" height="80" rx="8" fill="#f59e0b" fill-opacity="0.10" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="568" y="278" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309" font-weight="bold">"Cascade" = sharshara</text>
  <text x="568" y="298" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Qoidalar yuqoridan pastga</text>
  <text x="568" y="314" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">oqib, ustma-ust tushadi.</text>
  <text x="568" y="330" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">CSS = Cascading Style Sheets</text>
</svg>
