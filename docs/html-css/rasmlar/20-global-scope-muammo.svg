<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440">
  <title>CSS global scope muammosi: bitta umumiy klass nomi butun sahifaga ta'sir qilib, kutilmagan joyni buzadi</title>
  <defs>
    <marker id="gsArr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Global scope muammosi</text>
  <text x="380" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">CSS'da har bir selektor butun hujjatga taalluqli — devor yo'q</text>

  <!-- markaziy qoida -->
  <rect x="270" y="80" width="220" height="62" rx="10" fill="#1e293b"/>
  <text x="380" y="106" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#60a5fa">.title {</text>
  <text x="380" y="126" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">color: red; }</text>

  <!-- uchta nishon -->
  <line x1="320" y1="142" x2="160" y2="210" stroke="#dc2626" stroke-width="2.5" marker-end="url(#gsArr)"/>
  <line x1="380" y1="142" x2="380" y2="210" stroke="#dc2626" stroke-width="2.5" marker-end="url(#gsArr)"/>
  <line x1="440" y1="142" x2="600" y2="210" stroke="#dc2626" stroke-width="2.5" marker-end="url(#gsArr)"/>

  <!-- nishon 1: kerakli -->
  <rect x="70" y="214" width="180" height="96" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="160" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Maqola sarlavhasi</text>
  <text x="160" y="262" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">class="title"</text>
  <text x="160" y="288" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" font-weight="bold">Kerakli — to'g'ri</text>

  <!-- nishon 2: kutilmagan -->
  <rect x="290" y="214" width="180" height="96" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="380" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Yon panel widget</text>
  <text x="380" y="262" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">class="title"</text>
  <text x="380" y="288" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626" font-weight="bold">Tasodifan qizardi!</text>

  <!-- nishon 3: kutilmagan -->
  <rect x="510" y="214" width="180" height="96" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Modal oyna</text>
  <text x="600" y="262" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">class="title"</text>
  <text x="600" y="288" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626" font-weight="bold">Bu ham qizardi!</text>

  <!-- xulosa paneli -->
  <rect x="90" y="338" width="580" height="78" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="364" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">Muammo: bir nom uchta joyga tegdi</text>
  <text x="380" y="388" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Bitta sodda nom (.title) butun loyihada takrorlangan bo'lsa,</text>
  <text x="380" y="407" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">bir o'zgartirish bir nechta begona joyni buzadi. Yechim: noyob, scope'li nomlash (BEM).</text>
</svg>
