<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
  <title>fr birligi: grid-template-columns 1fr 2fr 1fr bo'sh joyni qanday bo'lishini ko'rsatuvchi diagramma</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>

  <!-- Sarlavha -->
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">fr birligi bo'sh joyni qismlarga bo'ladi</text>
  <text x="380" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">grid-template-columns: 1fr 2fr 1fr;</text>

  <!-- Jami eni o'qi -->
  <text x="380" y="86" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Konteyner eni = 600px, jami = 1 + 2 + 1 = 4 qism, har qism = 150px</text>

  <!-- Konteyner -->
  <rect x="80" y="110" width="600" height="120" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>

  <!-- 1fr ustun (150px) -->
  <rect x="90" y="120" width="140" height="100" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="166" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#2563eb">1fr</text>
  <text x="160" y="190" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">150px</text>

  <!-- 2fr ustun (300px) -->
  <rect x="240" y="120" width="290" height="100" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="385" y="166" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#16a34a">2fr</text>
  <text x="385" y="190" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">300px (ikki barobar keng)</text>

  <!-- 1fr ustun (150px) -->
  <rect x="540" y="120" width="130" height="100" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="605" y="166" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#2563eb">1fr</text>
  <text x="605" y="190" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">150px</text>

  <!-- O'lcham strelkasi (jami eni) -->
  <line x1="80" y1="248" x2="680" y2="248" stroke="#475569" stroke-width="1.5"/>
  <line x1="80" y1="242" x2="80" y2="254" stroke="#475569" stroke-width="1.5"/>
  <line x1="680" y1="242" x2="680" y2="254" stroke="#475569" stroke-width="1.5"/>
  <text x="380" y="270" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">600px (mavjud bo'sh joy)</text>

  <!-- Izoh qutisi -->
  <rect x="80" y="296" width="600" height="100" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="324" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">fr nima qiladi?</text>
  <text x="380" y="350" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">fr ("fraction" = ulush) mavjud bo'sh joyni qismlarga bo'ladi.</text>
  <text x="380" y="372" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Konteyner kengaysa yoki torayganda ustunlar shu nisbatda o'zgaradi.</text>
  <text x="380" y="390" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Shuning uchun foiz (%) hisoblashga hojat yo'q — fr o'zi bo'lishadi.</text>
</svg>
