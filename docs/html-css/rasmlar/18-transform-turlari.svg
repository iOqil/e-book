<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540">
  <title>transform turlari: translate, scale, rotate va skew har biri original kvadrat ustiga qanday ta'sir qiladi</title>
  <defs>
    <marker id="oq18a" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="540" fill="#f8fafc"/>

  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">transform turlari: original (kulrang) ustiga ta'siri (ko'k)</text>
  <text x="380" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">har bir panelda punktir kulrang — asl o'rni · to'q ko'k — transformdan keyingi holat</text>

  <!-- TRANSLATE -->
  <rect x="30" y="80" width="340" height="200" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="200" y="106" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">translate(40px, 30px)</text>
  <text x="200" y="126" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">elementni siljitadi (joyini o'zgartiradi)</text>
  <rect x="90" y="150" width="90" height="90" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="130" y="180" width="90" height="90" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="175" y="231" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">box</text>
  <line x1="135" y1="195" x2="175" y2="225" stroke="#475569" stroke-width="1.5" marker-end="url(#oq18a)"/>
  <text x="270" y="200" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">o'ng + past</text>

  <!-- SCALE -->
  <rect x="390" y="80" width="340" height="200" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="560" y="106" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">scale(1.5)</text>
  <text x="560" y="126" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">o'lchamni kattalashtiradi (markazdan)</text>
  <rect x="525" y="180" width="70" height="70" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="507" y="162" width="106" height="106" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="560" y="221" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">box</text>

  <!-- ROTATE -->
  <rect x="30" y="300" width="340" height="210" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="200" y="326" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f59e0b">rotate(30deg)</text>
  <text x="200" y="346" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">markaz atrofida aylantiradi (soat yo'nalishi)</text>
  <rect x="155" y="385" width="90" height="90" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g transform="rotate(30 200 430)">
    <rect x="155" y="385" width="90" height="90" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="200" y="436" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">box</text>
  </g>

  <!-- SKEW -->
  <rect x="390" y="300" width="340" height="210" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="560" y="326" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">skewX(20deg)</text>
  <text x="560" y="346" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">qiyshaytiradi (parallelogram qiladi)</text>
  <rect x="515" y="385" width="90" height="90" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="548,385 638,385 605,475 515,475" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="576" y="436" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">box</text>
</svg>
