<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560">
  <title>Kombinatorlar: DOM daraxtida har bir kombinator qaysi elementni tanlashi</title>
  <rect x="0" y="0" width="760" height="560" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Kombinatorlar va DOM daraxti</text>

  <!-- DOM tree -->
  <!-- div.box (root) -->
  <rect x="320" y="56" width="120" height="40" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="380" y="81" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">div.box</text>

  <!-- lines from div.box -->
  <line x1="380" y1="96" x2="200" y2="140" stroke="#475569" stroke-width="2"/>
  <line x1="380" y1="96" x2="560" y2="140" stroke="#475569" stroke-width="2"/>

  <!-- p (left child of box) -->
  <rect x="150" y="140" width="100" height="40" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="200" y="165" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">p</text>

  <!-- ul (right child of box) -->
  <rect x="510" y="140" width="100" height="40" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="560" y="165" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">ul</text>

  <!-- lines from p -->
  <line x1="200" y1="180" x2="200" y2="224" stroke="#475569" stroke-width="2"/>
  <!-- span (child of p) -->
  <rect x="150" y="224" width="100" height="40" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="200" y="249" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">span</text>

  <!-- lines from ul to li, li, li -->
  <line x1="560" y1="180" x2="500" y2="224" stroke="#475569" stroke-width="2"/>
  <line x1="560" y1="180" x2="600" y2="224" stroke="#475569" stroke-width="2"/>
  <line x1="560" y1="180" x2="690" y2="224" stroke="#475569" stroke-width="2"/>

  <rect x="450" y="224" width="100" height="40" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="500" y="249" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">li.bir</text>

  <rect x="560" y="224" width="80" height="40" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="600" y="249" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">li.ikki</text>

  <rect x="650" y="224" width="80" height="40" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="690" y="249" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">li.uch</text>

  <!-- Legend / examples -->
  <text x="40" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Har bir kombinator nimani tanlaydi:</text>

  <!-- avlod -->
  <rect x="40" y="338" width="22" height="22" rx="4" fill="#2563eb"/>
  <text x="74" y="355" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b"><tspan font-family="Consolas, monospace" fill="#2563eb">div span</tspan>  (avlod) — div ichidagi BARCHA span (chuqurlikdan qat'i nazar)</text>

  <!-- bevosita farzand -->
  <rect x="40" y="370" width="22" height="22" rx="4" fill="#16a34a"/>
  <text x="74" y="387" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b"><tspan font-family="Consolas, monospace" fill="#16a34a">div &gt; p</tspan>  (bevosita farzand) — faqat to'g'ridan-to'g'ri p</text>

  <!-- qo'shni birodar -->
  <rect x="40" y="402" width="22" height="22" rx="4" fill="#f59e0b"/>
  <text x="74" y="419" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b"><tspan font-family="Consolas, monospace" fill="#f59e0b">li.bir + li</tspan>  (qo'shni birodar) — darhol keyingi bitta li (li.ikki)</text>

  <!-- umumiy birodar -->
  <rect x="40" y="434" width="22" height="22" rx="4" fill="#dc2626"/>
  <text x="74" y="451" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b"><tspan font-family="Consolas, monospace" fill="#dc2626">li.bir ~ li</tspan>  (umumiy birodar) — keyingi BARCHA li (li.ikki, li.uch)</text>

  <!-- coloured rings around selected nodes for visual mapping -->
  <!-- div span -> span (blue) -->
  <rect x="146" y="220" width="108" height="48" rx="12" fill="none" stroke="#2563eb" stroke-width="3"/>
  <!-- div>p -> p (green) -->
  <rect x="146" y="136" width="108" height="48" rx="12" fill="none" stroke="#16a34a" stroke-width="3"/>
  <!-- li.bir + li -> li.ikki (amber) -->
  <rect x="556" y="220" width="88" height="48" rx="12" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <!-- li.bir ~ li -> li.ikki, li.uch (red) -->
  <rect x="556" y="216" width="180" height="56" rx="14" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>

  <text x="40" y="500" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Daraxtdagi rangli ramkalar yuqoridagi misollarga mos keladi (qizil punktir = ~ tanlovi).</text>
  <text x="40" y="524" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Eslatma: + va ~ faqat KEYINGI birodarlarni tanlaydi, oldingilarini emas.</text>
</svg>
