<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540">
  <title>:nth-child formulasi qaysi qatorlarni tanlashi</title>
  <rect x="0" y="0" width="720" height="540" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">:nth-child() — qaysi qatorlar tanlanadi?</text>

  <!-- Column 1: 2n (juft) -->
  <text x="160" y="74" text-anchor="middle" font-family="Consolas, monospace" font-size="17" font-weight="bold" fill="#2563eb">:nth-child(2n)</text>
  <text x="160" y="94" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">juft: 2, 4, 6</text>

  <!-- Column 2: odd / 2n+1 -->
  <text x="540" y="74" text-anchor="middle" font-family="Consolas, monospace" font-size="17" font-weight="bold" fill="#16a34a">:nth-child(odd)</text>
  <text x="540" y="94" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">toq: 1, 3, 5</text>

  <!-- rows for column 1 -->
  <!-- row 1 (not selected) -->
  <rect x="40" y="108" width="240" height="44" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="60" y="135" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">li (1)</text>
  <!-- row 2 (selected blue) -->
  <rect x="40" y="158" width="240" height="44" rx="6" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <text x="60" y="185" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#ffffff" font-weight="bold">li (2)  &#8592; tanlandi</text>
  <!-- row 3 -->
  <rect x="40" y="208" width="240" height="44" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="60" y="235" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">li (3)</text>
  <!-- row 4 selected -->
  <rect x="40" y="258" width="240" height="44" rx="6" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <text x="60" y="285" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#ffffff" font-weight="bold">li (4)  &#8592; tanlandi</text>
  <!-- row 5 -->
  <rect x="40" y="308" width="240" height="44" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="60" y="335" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">li (5)</text>
  <!-- row 6 selected -->
  <rect x="40" y="358" width="240" height="44" rx="6" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <text x="60" y="385" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#ffffff" font-weight="bold">li (6)  &#8592; tanlandi</text>

  <!-- rows for column 2 (odd) -->
  <rect x="420" y="108" width="240" height="44" rx="6" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
  <text x="440" y="135" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#ffffff" font-weight="bold">li (1)  &#8592; tanlandi</text>
  <rect x="420" y="158" width="240" height="44" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="440" y="185" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">li (2)</text>
  <rect x="420" y="208" width="240" height="44" rx="6" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
  <text x="440" y="235" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#ffffff" font-weight="bold">li (3)  &#8592; tanlandi</text>
  <rect x="420" y="258" width="240" height="44" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="440" y="285" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">li (4)</text>
  <rect x="420" y="308" width="240" height="44" rx="6" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
  <text x="440" y="335" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#ffffff" font-weight="bold">li (5)  &#8592; tanlandi</text>
  <rect x="420" y="358" width="240" height="44" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="440" y="385" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">li (6)</text>

  <!-- Formula explainer box -->
  <rect x="40" y="424" width="640" height="92" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="56" y="450" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Formulani o'qish: an + b</text>
  <text x="56" y="474" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b"><tspan font-family="Consolas, monospace" fill="#2563eb">n</tspan> = 0, 1, 2, 3 ... (har bir qadamda navbatdagi qiymat olinadi)</text>
  <text x="56" y="496" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b"><tspan font-family="Consolas, monospace" fill="#2563eb">3n+1</tspan> &#8594; 1, 4, 7 ...  ·  <tspan font-family="Consolas, monospace" fill="#16a34a">odd</tspan> = 2n+1  ·  <tspan font-family="Consolas, monospace" fill="#dc2626">even</tspan> = 2n</text>
</svg>
