<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470">
  <title>srcset: ekran kengligiga qarab mos rasm fayli tanlanadi</title>
  <text x="390" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">srcset — bitta rasm, turli fayllar</text>
  <text x="390" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#64748b">Brauzer ekran kengligiga qarab eng mos faylni o'zi tanlaydi</text>

  <!-- Kod blok -->
  <rect x="40" y="78" width="700" height="78" rx="8" fill="#1e293b"/>
  <text x="58" y="104" font-family="Consolas, monospace" font-size="14" fill="#f8fafc">&lt;img src="rasm-640.jpg"</text>
  <text x="78" y="126" font-family="Consolas, monospace" font-size="14" fill="#7dd3fc">srcset="rasm-640.jpg 640w, rasm-1280.jpg 1280w, rasm-1920.jpg 1920w"</text>
  <text x="78" y="148" font-family="Consolas, monospace" font-size="14" fill="#fcd34d">sizes="(max-width: 700px) 100vw, 50vw" alt="manzara"&gt;</text>

  <!-- Telefon -->
  <rect x="60" y="200" width="160" height="220" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <rect x="72" y="226" width="136" height="150" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="305" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">rasm-640</text>
  <text x="140" y="218" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Telefon</text>
  <text x="140" y="398" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">~360px keng</text>
  <text x="140" y="414" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">kichik fayl ✓</text>

  <!-- Planshet -->
  <rect x="270" y="200" width="220" height="220" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <rect x="284" y="226" width="192" height="150" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="305" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">rasm-1280</text>
  <text x="380" y="218" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Planshet</text>
  <text x="380" y="398" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">~768px keng</text>
  <text x="380" y="414" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">o'rta fayl ✓</text>

  <!-- Desktop -->
  <rect x="540" y="200" width="200" height="220" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <rect x="554" y="226" width="172" height="150" rx="6" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/>
  <text x="640" y="305" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">rasm-1920</text>
  <text x="640" y="218" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Desktop</text>
  <text x="640" y="398" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">1920px+ keng</text>
  <text x="640" y="414" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">katta fayl ✓</text>

  <!-- Strelkalar kod -> qurilmalar -->
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <line x1="140" y1="156" x2="140" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/>
  <line x1="380" y1="156" x2="380" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/>
  <line x1="640" y1="156" x2="640" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#ok)"/>

  <text x="390" y="452" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">Natija: kichik ekranlar kichik faylni yuklaydi — tezroq, internet trafigi tejaladi</text>
</svg>
