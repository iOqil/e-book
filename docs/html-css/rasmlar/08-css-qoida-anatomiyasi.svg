<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <title>CSS qoidasining anatomiyasi: selector, e'lon bloki, property va value</title>

  <!-- Sarlavha -->
  <text x="360" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">CSS qoidasining anatomiyasi</text>

  <!-- Kod qatori foni -->
  <rect x="40" y="120" width="640" height="70" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>

  <!-- Selector qismi -->
  <rect x="56" y="135" width="60" height="40" rx="6" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
  <text x="86" y="161" text-anchor="middle" font-family="Consolas, monospace" font-size="22" fill="#2563eb" font-weight="bold">h1</text>

  <!-- Ochuvchi qavs -->
  <text x="128" y="161" text-anchor="middle" font-family="Consolas, monospace" font-size="22" fill="#475569">{</text>

  <!-- Property qismi -->
  <rect x="148" y="135" width="100" height="40" rx="6" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="2"/>
  <text x="198" y="161" text-anchor="middle" font-family="Consolas, monospace" font-size="20" fill="#16a34a" font-weight="bold">color</text>

  <!-- Ikki nuqta -->
  <text x="258" y="161" text-anchor="middle" font-family="Consolas, monospace" font-size="22" fill="#475569">:</text>

  <!-- Value qismi -->
  <rect x="274" y="135" width="80" height="40" rx="6" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-width="2"/>
  <text x="314" y="161" text-anchor="middle" font-family="Consolas, monospace" font-size="20" fill="#b45309" font-weight="bold">blue</text>

  <!-- Nuqta-vergul -->
  <rect x="360" y="135" width="26" height="40" rx="6" fill="#dc2626" fill-opacity="0.14" stroke="#dc2626" stroke-width="2"/>
  <text x="373" y="161" text-anchor="middle" font-family="Consolas, monospace" font-size="22" fill="#dc2626" font-weight="bold">;</text>

  <!-- Yopuvchi qavs -->
  <text x="404" y="161" text-anchor="middle" font-family="Consolas, monospace" font-size="22" fill="#475569">}</text>

  <!-- E'lon bloki ramkasi (qavs ichi) -->
  <rect x="138" y="128" width="278" height="54" rx="8" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- YORLIQLAR -->

  <!-- Selector yorligi -->
  <line x1="86" y1="135" x2="86" y2="92" stroke="#2563eb" stroke-width="2"/>
  <text x="86" y="80" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#2563eb" font-weight="bold">selector</text>
  <text x="86" y="64" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(nimani bezaymiz)</text>

  <!-- E'lon bloki yorligi -->
  <line x1="277" y1="128" x2="277" y2="92" stroke="#475569" stroke-width="2"/>
  <text x="277" y="80" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b" font-weight="bold">e'lon bloki</text>
  <text x="277" y="64" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">{ } ichidagi qoidalar</text>

  <!-- Property yorligi -->
  <line x1="198" y1="175" x2="198" y2="232" stroke="#16a34a" stroke-width="2"/>
  <text x="198" y="250" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#16a34a" font-weight="bold">property</text>
  <text x="198" y="268" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(xususiyat)</text>

  <!-- Value yorligi -->
  <line x1="314" y1="175" x2="314" y2="232" stroke="#f59e0b" stroke-width="2"/>
  <text x="314" y="250" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#b45309" font-weight="bold">value</text>
  <text x="314" y="268" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(qiymat)</text>

  <!-- Nuqta-vergul yorligi -->
  <line x1="373" y1="175" x2="373" y2="300" stroke="#dc2626" stroke-width="2"/>
  <text x="373" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#dc2626" font-weight="bold">nuqta-vergul</text>
  <text x="373" y="336" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">e'lonni tugatadi</text>

  <!-- Bitta e'lon = property + value izohi -->
  <rect x="460" y="128" width="220" height="120" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="570" y="152" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Bitta e'lon (declaration)</text>
  <text x="570" y="180" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#1e293b"><tspan fill="#16a34a" font-weight="bold">color</tspan>: <tspan fill="#b45309" font-weight="bold">blue</tspan><tspan fill="#dc2626" font-weight="bold">;</tspan></text>
  <text x="570" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">property + value</text>
  <text x="570" y="230" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">juftligi</text>
</svg>
