<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="Segoe UI, system-ui, sans-serif">
  <title>MCP'siz har tizimga alohida integratsiya, MCP bilan bitta standart (USB-C kabi)</title>
  <rect x="0" y="0" width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">MCP'siz vs MCP bilan</text>

  <!-- Chap panel: MCP'siz -->
  <rect x="20" y="56" width="350" height="384" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="195" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">MCP'siz: har juftga alohida</text>
  <text x="195" y="104" text-anchor="middle" font-size="13" fill="#94a3b8">N × M ta qo'lda ko'prik</text>

  <!-- 3 ilova chapda -->
  <rect x="44" y="130" width="92" height="42" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="90" y="156" text-anchor="middle" font-size="13" fill="#1e293b">Ilova A</text>
  <rect x="44" y="210" width="92" height="42" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="90" y="236" text-anchor="middle" font-size="13" fill="#1e293b">Ilova B</text>
  <rect x="44" y="290" width="92" height="42" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="90" y="316" text-anchor="middle" font-size="13" fill="#1e293b">Ilova C</text>

  <!-- 3 tizim chapda -->
  <rect x="254" y="130" width="92" height="42" rx="8" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="300" y="156" text-anchor="middle" font-size="13" fill="#1e293b">GitHub</text>
  <rect x="254" y="210" width="92" height="42" rx="8" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="300" y="236" text-anchor="middle" font-size="13" fill="#1e293b">Baza</text>
  <rect x="254" y="290" width="92" height="42" rx="8" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="300" y="316" text-anchor="middle" font-size="13" fill="#1e293b">Slack</text>

  <!-- chigal chiziqlar (9 ta) -->
  <g stroke="#fca5a5" stroke-width="1.4" fill="none">
    <line x1="136" y1="151" x2="254" y2="151"/>
    <line x1="136" y1="151" x2="254" y2="231"/>
    <line x1="136" y1="151" x2="254" y2="311"/>
    <line x1="136" y1="231" x2="254" y2="151"/>
    <line x1="136" y1="231" x2="254" y2="231"/>
    <line x1="136" y1="231" x2="254" y2="311"/>
    <line x1="136" y1="311" x2="254" y2="151"/>
    <line x1="136" y1="311" x2="254" y2="231"/>
    <line x1="136" y1="311" x2="254" y2="311"/>
  </g>
  <text x="195" y="400" text-anchor="middle" font-size="14" font-weight="600" fill="#dc2626">9 ta ko'prik — chigal, takror</text>
  <text x="195" y="422" text-anchor="middle" font-size="13" fill="#475569">har ilova × har tizim qo'lda</text>

  <!-- O'ng panel: MCP bilan -->
  <rect x="390" y="56" width="350" height="384" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="565" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">MCP bilan: bitta standart</text>
  <text x="565" y="104" text-anchor="middle" font-size="13" fill="#94a3b8">USB-C kabi — hammaga mos</text>

  <!-- 3 ilova o'ngda -->
  <rect x="412" y="130" width="86" height="42" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="455" y="156" text-anchor="middle" font-size="13" fill="#1e293b">Ilova A</text>
  <rect x="412" y="210" width="86" height="42" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="455" y="236" text-anchor="middle" font-size="13" fill="#1e293b">Ilova B</text>
  <rect x="412" y="290" width="86" height="42" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="455" y="316" text-anchor="middle" font-size="13" fill="#1e293b">Ilova C</text>

  <!-- markaziy MCP standart -->
  <rect x="540" y="190" width="56" height="82" rx="10" fill="#4f46e5" stroke="#4f46e5" stroke-width="2"/>
  <text x="568" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">MCP</text>
  <text x="568" y="245" text-anchor="middle" font-size="13" fill="#c7d2fe">standart</text>

  <!-- 3 tizim o'ngda -->
  <rect x="636" y="130" width="86" height="42" rx="8" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="679" y="156" text-anchor="middle" font-size="13" fill="#1e293b">GitHub</text>
  <rect x="636" y="210" width="86" height="42" rx="8" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="679" y="236" text-anchor="middle" font-size="13" fill="#1e293b">Baza</text>
  <rect x="636" y="290" width="86" height="42" rx="8" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="679" y="316" text-anchor="middle" font-size="13" fill="#1e293b">Slack</text>

  <!-- toza chiziqlar: ilova->MCP, MCP->tizim -->
  <g stroke="#86efac" stroke-width="2" fill="none">
    <line x1="498" y1="151" x2="540" y2="210"/>
    <line x1="498" y1="231" x2="540" y2="231"/>
    <line x1="498" y1="311" x2="540" y2="252"/>
    <line x1="596" y1="210" x2="636" y2="151"/>
    <line x1="596" y1="231" x2="636" y2="231"/>
    <line x1="596" y1="252" x2="636" y2="311"/>
  </g>
  <text x="565" y="400" text-anchor="middle" font-size="14" font-weight="600" fill="#16a34a">6 ta ulanish — toza, standart</text>
  <text x="565" y="422" text-anchor="middle" font-size="13" fill="#475569">server bir marta yoziladi</text>
</svg>
