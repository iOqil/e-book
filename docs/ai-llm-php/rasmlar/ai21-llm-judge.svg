<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Segoe UI, system-ui, sans-serif">
  <title>LLM-as-judge: javob va mezon baho modeliga kiradi, model ball qaytaradi</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">LLM-as-judge: AI o'qituvchi</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">bir model boshqa model javobini mezon bo'yicha baholaydi</text>

  <!-- Kirishlar (chap) -->
  <rect x="40" y="96" width="220" height="64" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="150" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">SAVOL</text>
  <text x="150" y="145" text-anchor="middle" font-size="13" fill="#475569">"Buyurtmam qayerda?"</text>

  <rect x="40" y="178" width="220" height="78" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="150" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#7c3aed">BAHOLANAYOTGAN JAVOB</text>
  <text x="150" y="226" text-anchor="middle" font-size="13" fill="#475569">"'Buyurtmalarim' bo'limidan</text>
  <text x="150" y="244" text-anchor="middle" font-size="13" fill="#475569">kuzating..."</text>

  <rect x="40" y="274" width="220" height="78" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="150" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">MEZON</text>
  <text x="150" y="322" text-anchor="middle" font-size="13" fill="#475569">hurmatli · aniq qadam ·</text>
  <text x="150" y="340" text-anchor="middle" font-size="13" fill="#475569">qisqa</text>

  <!-- Strelkalar markazga -->
  <defs>
    <marker id="ai21arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <line x1="260" y1="128" x2="338" y2="200" stroke="#7c3aed" stroke-width="2" marker-end="url(#ai21arrow)"/>
  <line x1="260" y1="217" x2="338" y2="220" stroke="#7c3aed" stroke-width="2" marker-end="url(#ai21arrow)"/>
  <line x1="260" y1="313" x2="338" y2="240" stroke="#7c3aed" stroke-width="2" marker-end="url(#ai21arrow)"/>

  <!-- Baho modeli (markaz) -->
  <rect x="346" y="160" width="190" height="120" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="441" y="200" text-anchor="middle" font-size="17" font-weight="700" fill="#7c3aed">BAHO MODELI</text>
  <text x="441" y="224" text-anchor="middle" font-size="13" fill="#475569">(kuchli model —</text>
  <text x="441" y="242" text-anchor="middle" font-size="13" fill="#475569">qat'iy baholovchi)</text>
  <text x="441" y="266" text-anchor="middle" font-size="13" fill="#1e293b">o'qiydi -&gt; baholaydi</text>

  <!-- Strelka chiqishga -->
  <line x1="536" y1="220" x2="606" y2="220" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ai21arrow)"/>

  <!-- Natija (o'ng) -->
  <rect x="610" y="160" width="118" height="120" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="669" y="194" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">BALL</text>
  <text x="669" y="232" text-anchor="middle" font-size="30" font-weight="700" fill="#1e293b">9/10</text>
  <text x="669" y="262" text-anchor="middle" font-size="13" fill="#475569">+ sabab</text>

  <!-- Ehtiyot eslatma -->
  <rect x="40" y="372" width="688" height="34" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="384" y="394" text-anchor="middle" font-size="13" fill="#b45309">Ehtiyot: judge ham AI — uzunlik/joylashuv/o'ziga moyilliklar bor. Mezon aniq bo'lsin.</text>
</svg>
