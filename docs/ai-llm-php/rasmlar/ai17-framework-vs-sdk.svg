<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" font-family="Segoe UI, system-ui, sans-serif">
  <title>Framework vs to'g'ridan SDK taqqoslash</title>
  <rect x="0" y="0" width="760" height="450" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Framework vs to'g'ridan SDK</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">qaysi biri qachon?</text>

  <!-- Chap: framework -->
  <rect x="40" y="84" width="330" height="320" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="205" y="116" text-anchor="middle" font-size="17" font-weight="700" fill="#7c3aed">Framework</text>
  <text x="205" y="138" text-anchor="middle" font-size="13" fill="#94a3b8">LLPhant · Neuron AI</text>

  <text x="64" y="174" font-size="14" fill="#16a34a">+ Tez prototip / MVP</text>
  <text x="64" y="204" font-size="14" fill="#16a34a">+ Kam kod</text>
  <text x="64" y="234" font-size="14" fill="#16a34a">+ Ko'p provayder oson</text>
  <text x="64" y="264" font-size="14" fill="#16a34a">+ Tayyor RAG / agent</text>
  <text x="64" y="300" font-size="14" fill="#dc2626">− Kamroq nazorat</text>
  <text x="64" y="330" font-size="14" fill="#dc2626">− Ko'proq bog'liqlik</text>
  <text x="64" y="360" font-size="14" fill="#dc2626">− Yangi imkoniyatga kech</text>

  <rect x="64" y="374" width="282" height="20" rx="6" fill="#ede9fe"/>
  <text x="205" y="389" text-anchor="middle" font-size="13" font-weight="600" fill="#7c3aed">Qachon: tez, ko'p provayder, standart</text>

  <!-- O'ng: SDK -->
  <rect x="390" y="84" width="330" height="320" rx="14" fill="#ffffff" stroke="#d97757" stroke-width="2.5"/>
  <text x="555" y="116" text-anchor="middle" font-size="17" font-weight="700" fill="#d97757">To'g'ridan SDK</text>
  <text x="555" y="138" text-anchor="middle" font-size="13" fill="#94a3b8">1-16 boblar (anthropic-ai/sdk)</text>

  <text x="414" y="174" font-size="14" fill="#16a34a">+ To'liq nazorat</text>
  <text x="414" y="204" font-size="14" fill="#16a34a">+ Kam bog'liqlik</text>
  <text x="414" y="234" font-size="14" fill="#16a34a">+ Yangi imkoniyatga tez</text>
  <text x="414" y="264" font-size="14" fill="#16a34a">+ Ostini chuqur bilasiz</text>
  <text x="414" y="300" font-size="14" fill="#dc2626">− Sekinroq (ko'p yozasiz)</text>
  <text x="414" y="330" font-size="14" fill="#dc2626">− Ko'p kod</text>
  <text x="414" y="360" font-size="14" fill="#dc2626">− Ko'p provayder = qo'lda</text>

  <rect x="414" y="374" width="282" height="20" rx="6" fill="#fef3ec"/>
  <text x="555" y="389" text-anchor="middle" font-size="13" font-weight="600" fill="#d97757">Qachon: nazorat, kam bog'liqlik, maxsus</text>

  <!-- O'rtada VS -->
  <circle cx="380" cy="244" r="22" fill="#1e293b"/>
  <text x="380" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">VS</text>

  <text x="380" y="430" text-anchor="middle" font-size="13" fill="#475569">Ko'p loyihada ikkalasi: standartga framework, nozik joyga SDK.</text>
</svg>
