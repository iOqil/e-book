<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Tool ta'rifining uch qismi: name, description, input_schema</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Tool ta'rifining uch qismi</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">Model shu uchta maydondan funksiyani QACHON va QANDAY chaqirishni biladi</text>

  <!-- name -->
  <rect x="40" y="90" width="680" height="90" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="40" y="90" width="170" height="90" rx="12" fill="#ede9fe"/>
  <text x="125" y="130" text-anchor="middle" font-size="17" font-weight="700" fill="#7c3aed">name</text>
  <text x="125" y="154" text-anchor="middle" font-size="13" fill="#7c3aed">funksiya nomi</text>
  <text x="235" y="125" font-size="14" fill="#1e293b" font-weight="600">'ob_havo'</text>
  <text x="235" y="150" font-size="13" fill="#475569">Qisqa, aniq identifikator (kod ichida ishlatasiz).</text>
  <text x="235" y="170" font-size="13" fill="#475569">Bo'sh joy emas — pastki chiziq yoki camelCase.</text>

  <!-- description -->
  <rect x="40" y="195" width="680" height="110" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="40" y="195" width="170" height="110" rx="12" fill="#e0e7ff"/>
  <text x="125" y="240" text-anchor="middle" font-size="17" font-weight="700" fill="#4f46e5">description</text>
  <text x="125" y="264" text-anchor="middle" font-size="13" fill="#4f46e5">tavsif</text>
  <text x="125" y="284" text-anchor="middle" font-size="13" fill="#4f46e5">(ENG MUHIM!)</text>
  <text x="235" y="228" font-size="14" fill="#1e293b" font-weight="600">'Berilgan shahar uchun joriy ob-havoni qaytaradi.'</text>
  <text x="235" y="254" font-size="13" fill="#475569">Model AYNAN shundan toolni QACHON ishlatishni biladi.</text>
  <text x="235" y="276" font-size="13" fill="#475569">Aniq va to'liq yozing — yomon tavsif = noto'g'ri chaqiriq.</text>
  <text x="235" y="298" font-size="13" fill="#dc2626">Bu — promptdek muhim. Vaqt ajrating!</text>

  <!-- input_schema -->
  <rect x="40" y="320" width="680" height="130" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="40" y="320" width="170" height="130" rx="12" fill="#dcfce7"/>
  <text x="125" y="368" text-anchor="middle" font-size="17" font-weight="700" fill="#16a34a">input_schema</text>
  <text x="125" y="392" text-anchor="middle" font-size="13" fill="#16a34a">argument shakli</text>
  <text x="125" y="412" text-anchor="middle" font-size="13" fill="#16a34a">(JSON Schema)</text>
  <text x="235" y="352" font-size="14" fill="#1e293b" font-weight="600">'type' =&gt; 'object', 'properties' =&gt; [...]</text>
  <text x="235" y="378" font-size="13" fill="#475569">Qaysi argumentlar kerak, qaysi turda (string, number...).</text>
  <text x="235" y="400" font-size="13" fill="#475569">'required' — majburiy maydonlar ro'yxati.</text>
  <text x="235" y="424" font-size="13" fill="#475569">Model argumentlarni AYNAN shu shaklda to'ldiradi.</text>
</svg>
