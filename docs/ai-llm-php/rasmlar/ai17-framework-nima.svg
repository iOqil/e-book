<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Qo'lda qurish (ko'p blok) vs framework (tayyor bloklar)</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Qo'lda qurish vs Framework</text>

  <!-- Chap: qo'lda -->
  <rect x="30" y="64" width="340" height="378" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="200" y="94" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">Qo'lda (1-16 boblar)</text>
  <text x="200" y="116" text-anchor="middle" font-size="13" fill="#94a3b8">har blokni o'zingiz yozasiz</text>

  <rect x="56" y="132" width="132" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="122" y="160" text-anchor="middle" font-size="13" fill="#475569">Suhbat tarixi</text>
  <rect x="212" y="132" width="132" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="278" y="160" text-anchor="middle" font-size="13" fill="#475569">Streaming sikl</text>

  <rect x="56" y="188" width="132" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="122" y="216" text-anchor="middle" font-size="13" fill="#475569">Tool sikli</text>
  <rect x="212" y="188" width="132" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="278" y="216" text-anchor="middle" font-size="13" fill="#475569">Chunklash</text>

  <rect x="56" y="244" width="132" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="122" y="272" text-anchor="middle" font-size="13" fill="#475569">Embedding</text>
  <rect x="212" y="244" width="132" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="278" y="272" text-anchor="middle" font-size="13" fill="#475569">Vektor baza</text>

  <rect x="56" y="300" width="132" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="122" y="328" text-anchor="middle" font-size="13" fill="#475569">Qidiruv</text>
  <rect x="212" y="300" width="132" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="278" y="328" text-anchor="middle" font-size="13" fill="#475569">Prompt yig'ish</text>

  <rect x="56" y="356" width="288" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="200" y="384" text-anchor="middle" font-size="13" fill="#475569">Provayder ko'prigi (fallback)</text>

  <text x="200" y="426" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">Ko'p kod · har loyihada qaytadan</text>

  <!-- O'q -->
  <text x="392" y="252" text-anchor="middle" font-size="26" fill="#7c3aed">→</text>

  <!-- O'ng: framework -->
  <rect x="416" y="64" width="314" height="378" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="573" y="94" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">Framework</text>
  <text x="573" y="116" text-anchor="middle" font-size="13" fill="#94a3b8">tayyor bloklar — siz yig'asiz</text>

  <rect x="446" y="140" width="254" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="573" y="166" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">RAG quvuri</text>
  <text x="573" y="186" text-anchor="middle" font-size="13" fill="#94a3b8">o'qish+chunk+embed+baza+javob</text>

  <rect x="446" y="214" width="254" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="573" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">Agent / Workflow</text>
  <text x="573" y="260" text-anchor="middle" font-size="13" fill="#94a3b8">model + tool + xotira</text>

  <rect x="446" y="288" width="254" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="573" y="314" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">Provayder-agnostik</text>
  <text x="573" y="334" text-anchor="middle" font-size="13" fill="#94a3b8">Claude/OpenAI/Gemini/Ollama</text>

  <text x="573" y="386" text-anchor="middle" font-size="13" font-weight="600" fill="#16a34a">Kam kod · biznes mantiqqa fokus</text>
  <text x="573" y="412" text-anchor="middle" font-size="13" fill="#94a3b8">LLPhant · Neuron AI</text>
</svg>
