<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Segoe UI, system-ui, sans-serif">
  <title>Chek rasmi -> model -> strukturalangan ma'lumot: do'kon, sana, summa</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Chekdan ma'lumot ajratish</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">Vision + strukturali chiqish = avtomatik kvitansiya o'qish</text>

  <!-- Chek rasmi -->
  <rect x="50" y="110" width="170" height="220" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="135" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed">Chek (rasm)</text>
  <line x1="74" y1="158" x2="196" y2="158" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="74" y="182" font-size="13" fill="#475569">KORZINKA</text>
  <text x="74" y="206" font-size="13" fill="#94a3b8">15.06.2026</text>
  <line x1="74" y1="222" x2="196" y2="222" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="74" y="246" font-size="13" fill="#94a3b8">Non      4 000</text>
  <text x="74" y="268" font-size="13" fill="#94a3b8">Sut     12 000</text>
  <line x1="74" y1="284" x2="196" y2="284" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="74" y="310" font-size="13" font-weight="700" fill="#1e293b">JAMI: 16 000</text>

  <!-- model -->
  <rect x="300" y="170" width="160" height="100" rx="14" fill="#faf5ff" stroke="#a855f7" stroke-width="2.5"/>
  <text x="380" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#7c3aed">LLM (vision)</text>
  <text x="380" y="232" text-anchor="middle" font-size="13" fill="#475569">o'qiydi + ajratadi</text>
  <text x="380" y="252" text-anchor="middle" font-size="13" fill="#475569">+ JSON shaklga soladi</text>

  <!-- strukturalangan natija -->
  <rect x="530" y="110" width="200" height="220" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="630" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">Chek obyekti</text>
  <rect x="552" y="156" width="156" height="44" rx="8" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="566" y="174" font-size="13" fill="#475569">dokon:</text>
  <text x="566" y="192" font-size="13" font-weight="700" fill="#1e293b">"Korzinka"</text>
  <rect x="552" y="208" width="156" height="44" rx="8" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="566" y="226" font-size="13" fill="#475569">sana:</text>
  <text x="566" y="244" font-size="13" font-weight="700" fill="#1e293b">"2026-06-15"</text>
  <rect x="552" y="260" width="156" height="44" rx="8" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="566" y="278" font-size="13" fill="#475569">summa:</text>
  <text x="566" y="296" font-size="13" font-weight="700" fill="#1e293b">16000.0</text>

  <!-- strelkalar -->
  <path d="M222 220 L296 220" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a07c)"/>
  <path d="M460 220 L526 220" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#a07c)"/>

  <text x="380" y="388" text-anchor="middle" font-size="13" fill="#94a3b8">Endi summa/sana/do'kon to'g'ridan-to'g'ri bazaga yoziladi — qo'lda kiritish shart emas</text>

  <defs>
    <marker id="a07c" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
