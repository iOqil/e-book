<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>Prompt caching: katta o'zgarmas kontekst keshlanadi, takror so'rovda ~90% arzon</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Prompt caching — kontekstni keshlash</text>

  <defs>
    <marker id="arc" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 1-SO'ROV -->
  <text x="60" y="78" font-size="16" font-weight="700" fill="#7c3aed">1-so'rov (kesh yoziladi)</text>

  <rect x="60" y="92" width="240" height="90" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="180" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Katta o'zgarmas kontekst</text>
  <text x="180" y="140" text-anchor="middle" font-size="13" fill="#475569">system + hujjat + few-shot</text>
  <text x="180" y="162" text-anchor="middle" font-size="13" fill="#7c3aed">cache_control: ephemeral</text>

  <rect x="60" y="190" width="240" height="44" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="180" y="217" text-anchor="middle" font-size="13" fill="#475569">+ savol (o'zgaruvchi, oxirda)</text>

  <line x1="300" y1="160" x2="356" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#arc)"/>

  <rect x="360" y="120" width="150" height="80" rx="10" fill="#ffffff" stroke="#d97757" stroke-width="2"/>
  <text x="435" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Model</text>
  <text x="435" y="172" text-anchor="middle" font-size="13" fill="#475569">to'liq narx</text>

  <line x1="510" y1="160" x2="566" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#arc)"/>

  <rect x="570" y="118" width="160" height="84" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="650" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Kesh</text>
  <text x="650" y="168" text-anchor="middle" font-size="13" fill="#475569">kontekst saqlandi</text>
  <text x="650" y="188" text-anchor="middle" font-size="13" fill="#475569">~5 daqiqa yashaydi</text>

  <!-- ajratuvchi -->
  <line x1="60" y1="258" x2="700" y2="258" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- 2-SO'ROV -->
  <text x="60" y="296" font-size="16" font-weight="700" fill="#16a34a">2-so'rov (kesh o'qiladi)</text>

  <rect x="60" y="310" width="240" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="180" y="336" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Xuddi shu kontekst</text>
  <text x="180" y="358" text-anchor="middle" font-size="13" fill="#16a34a">keshdan olinadi (~90% arzon)</text>

  <line x1="300" y1="342" x2="356" y2="342" stroke="#94a3b8" stroke-width="2" marker-end="url(#arc)"/>

  <rect x="360" y="316" width="150" height="52" rx="10" fill="#ffffff" stroke="#d97757" stroke-width="2"/>
  <text x="435" y="347" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Model</text>

  <line x1="510" y1="342" x2="566" y2="342" stroke="#16a34a" stroke-width="2" marker-end="url(#arc)"/>

  <rect x="570" y="312" width="160" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="650" y="338" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">Javob</text>
  <text x="650" y="360" text-anchor="middle" font-size="13" fill="#475569">tez + arzon</text>

  <!-- pastki izoh -->
  <text x="380" y="412" text-anchor="middle" font-size="13" fill="#475569">usage: cacheReadInputTokens &gt; 0  =&gt;  kesh ishladi</text>
</svg>
