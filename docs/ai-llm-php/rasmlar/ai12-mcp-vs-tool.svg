<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>MCP va oddiy tool taqqoslash: qachon qaysi birini ishlatish</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">MCP vs oddiy tool — qachon qaysi biri?</text>

  <!-- Oddiy tool paneli -->
  <rect x="24" y="58" width="346" height="318" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="24" y="58" width="346" height="44" rx="12" fill="#ede9fe"/>
  <text x="197" y="87" text-anchor="middle" font-size="17" font-weight="700" fill="#7c3aed">Oddiy tool (09-10 bob)</text>

  <text x="46" y="132" font-size="14" font-weight="600" fill="#1e293b">Qayerda:</text>
  <text x="160" y="132" font-size="14" fill="#475569">ilova ichida (closure)</text>
  <text x="46" y="166" font-size="14" font-weight="600" fill="#1e293b">Maqsad:</text>
  <text x="160" y="166" font-size="14" fill="#475569">ilovaga xos, sodda</text>
  <text x="46" y="200" font-size="14" font-weight="600" fill="#1e293b">Kim:</text>
  <text x="160" y="200" font-size="14" fill="#475569">faqat shu ilova</text>
  <text x="46" y="234" font-size="14" font-weight="600" fill="#1e293b">Sozlash:</text>
  <text x="160" y="234" font-size="14" fill="#475569">eng oddiy</text>

  <rect x="46" y="258" width="300" height="98" rx="9" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.3"/>
  <text x="62" y="282" font-size="13" font-weight="600" fill="#7c3aed">Qachon:</text>
  <text x="62" y="304" font-size="13" fill="#475569">mantiq shu ilovaga xos, sodda,</text>
  <text x="62" y="322" font-size="13" fill="#475569">boshqa hech kimga kerak emas.</text>
  <text x="62" y="344" font-size="13" fill="#94a3b8">Masalan: "savat summasini hisobla"</text>

  <!-- MCP paneli -->
  <rect x="390" y="58" width="346" height="318" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="390" y="58" width="346" height="44" rx="12" fill="#dcfce7"/>
  <text x="563" y="87" text-anchor="middle" font-size="17" font-weight="700" fill="#16a34a">MCP</text>

  <text x="412" y="132" font-size="14" font-weight="600" fill="#1e293b">Qayerda:</text>
  <text x="526" y="132" font-size="14" fill="#475569">tashqi server'da</text>
  <text x="412" y="166" font-size="14" font-weight="600" fill="#1e293b">Maqsad:</text>
  <text x="526" y="166" font-size="14" fill="#475569">qayta ishlatiladigan</text>
  <text x="412" y="200" font-size="14" font-weight="600" fill="#1e293b">Kim:</text>
  <text x="526" y="200" font-size="14" fill="#475569">har MCP-mos ilova/til</text>
  <text x="412" y="234" font-size="14" font-weight="600" fill="#1e293b">Sozlash:</text>
  <text x="526" y="234" font-size="14" fill="#475569">server + mijoz</text>

  <rect x="412" y="258" width="302" height="98" rx="9" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.3"/>
  <text x="428" y="282" font-size="13" font-weight="600" fill="#16a34a">Qachon:</text>
  <text x="428" y="304" font-size="13" fill="#475569">tashqi tizim, takrorlanadigan,</text>
  <text x="428" y="322" font-size="13" fill="#475569">tayyor server mavjud.</text>
  <text x="428" y="344" font-size="13" fill="#94a3b8">Masalan: GitHub, Postgres, Slack</text>

  <!-- pastki qoida -->
  <rect x="24" y="392" width="712" height="34" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="380" y="414" text-anchor="middle" font-size="13" fill="#1e293b">Shubha bo'lsa — oddiy tool'dan boshlang; takrorlanish boshlangach, MCP serverga ko'chiring.</text>
</svg>
