<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Rasm yuborish: base64 yoki URL rasm bloki + text bloki -> messages -> javob</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Rasmni qanday yuboramiz</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">content = bloklar massivi: rasm bloki + text bloki</text>

  <!-- Variant 1: base64 -->
  <rect x="40" y="92" width="300" height="130" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="60" y="118" font-size="15" font-weight="700" fill="#7c3aed">Variant A — base64</text>
  <text x="60" y="142" font-size="13" fill="#475569">faylni o'qib kodlaymiz:</text>
  <rect x="60" y="152" width="260" height="56" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="72" y="174" font-size="13" fill="#1e293b">'type' =&gt; 'base64',</text>
  <text x="72" y="194" font-size="13" fill="#1e293b">'media_type' =&gt; 'image/png'</text>

  <!-- Variant 2: url -->
  <rect x="420" y="92" width="300" height="130" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="440" y="118" font-size="15" font-weight="700" fill="#4f46e5">Variant B — URL</text>
  <text x="440" y="142" font-size="13" fill="#475569">rasm internetda bo'lsa:</text>
  <rect x="440" y="152" width="260" height="56" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="452" y="174" font-size="13" fill="#1e293b">'type' =&gt; 'url',</text>
  <text x="452" y="194" font-size="13" fill="#1e293b">'url' =&gt; 'https://...'</text>

  <!-- content massivi -->
  <rect x="180" y="262" width="400" height="92" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
  <text x="380" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed">messages -&gt; content (massiv)</text>
  <rect x="206" y="302" width="160" height="38" rx="8" fill="#ffffff" stroke="#a855f7"/>
  <text x="286" y="326" text-anchor="middle" font-size="13" fill="#1e293b">[1] image bloki</text>
  <rect x="394" y="302" width="160" height="38" rx="8" fill="#ffffff" stroke="#a855f7"/>
  <text x="474" y="326" text-anchor="middle" font-size="13" fill="#1e293b">[2] text: "savol"</text>

  <!-- model -->
  <rect x="260" y="386" width="110" height="58" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="315" y="412" text-anchor="middle" font-size="14" font-weight="700" fill="#7c3aed">model</text>
  <text x="315" y="432" text-anchor="middle" font-size="13" fill="#475569">create()</text>

  <!-- javob -->
  <rect x="400" y="386" width="160" height="58" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="412" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">javob (matn)</text>
  <text x="480" y="432" text-anchor="middle" font-size="13" fill="#475569">rasm tasviri</text>

  <!-- strelkalar -->
  <path d="M190 222 L300 258" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a07r)"/>
  <path d="M570 222 L460 258" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#a07r)"/>
  <path d="M340 354 L325 382" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a07r)"/>
  <path d="M370 415 L396 415" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#a07r)"/>

  <defs>
    <marker id="a07r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>
</svg>
