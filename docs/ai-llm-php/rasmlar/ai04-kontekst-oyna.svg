<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" font-family="Segoe UI, system-ui, sans-serif">
  <title>Kontekst oynasi to'lishi va uni boshqarish: truncation, summarization, sliding window</title>
  <rect x="0" y="0" width="760" height="500" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Kontekst oynasi to'ladi — uni boshqarish kerak</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">Suhbat o'sadi → token ko'payadi → narx oshadi, cheklovga yetadi</text>

  <!-- to'lib borayotgan oyna -->
  <rect x="60" y="86" width="200" height="180" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="160" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">Kontekst oynasi</text>
  <rect x="74" y="118" width="172" height="20" rx="4" fill="#ede9fe"/>
  <rect x="74" y="142" width="172" height="20" rx="4" fill="#ede9fe"/>
  <rect x="74" y="166" width="172" height="20" rx="4" fill="#ddd6fe"/>
  <rect x="74" y="190" width="172" height="20" rx="4" fill="#c7d2fe"/>
  <rect x="74" y="214" width="172" height="20" rx="4" fill="#fecaca"/>
  <rect x="74" y="238" width="172" height="20" rx="4" fill="#fecaca"/>
  <text x="160" y="253" text-anchor="middle" font-size="13" fill="#dc2626">to'ldi!</text>

  <path d="M266 176 L320 176" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a04k)"/>

  <!-- 3 strategiya -->
  <text x="540" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Boshqarish strategiyalari</text>

  <rect x="340" y="118" width="380" height="58" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="356" y="140" font-size="14" font-weight="700" fill="#4f46e5">Sliding window — faqat oxirgi N xabar</text>
  <text x="356" y="162" font-size="13" fill="#475569">Eng eski xabarlarni tushiramiz, yangilari qoladi.</text>

  <rect x="340" y="186" width="380" height="58" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="356" y="208" font-size="14" font-weight="700" fill="#7c3aed">Truncation — qisqartirish</text>
  <text x="356" y="230" font-size="13" fill="#475569">Belgilangan token chegarasiga sig'dirib kesamiz.</text>

  <rect x="340" y="254" width="380" height="58" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="356" y="276" font-size="14" font-weight="700" fill="#16a34a">Summarization — xulosalash</text>
  <text x="356" y="298" font-size="13" fill="#475569">Eski qismni model bir xulosaga siqadi, ma'no saqlanadi.</text>

  <!-- pastki maslahat -->
  <rect x="60" y="340" width="660" height="128" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="80" y="366" font-size="14" font-weight="700" fill="#7c3aed">Qachon qaysi?</text>
  <text x="80" y="392" font-size="13" fill="#475569">• Qisqa chatbot, yaqin kontekst muhim → sliding window (sodda, tez).</text>
  <text x="80" y="416" font-size="13" fill="#475569">• Qattiq token/narx chegarasi → truncation (kafolatli chegara).</text>
  <text x="80" y="440" font-size="13" fill="#475569">• Uzoq suhbat, eski ma'lumot ham kerak → summarization (ma'no yo'qolmaydi).</text>
  <text x="80" y="462" font-size="13" fill="#94a3b8">Maslahat: countTokens bilan har so'rovdan oldin hajmni o'lchang.</text>

  <defs>
    <marker id="a04k" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
