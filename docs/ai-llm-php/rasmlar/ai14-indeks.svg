<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Segoe UI, system-ui, sans-serif">
  <title>Indekssiz to'liq skan (sekin) va HNSW indeks bilan tez qidiruv taqqosi</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Indeks nima uchun kerak</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">Indekssiz — hammasini skanlaydi (sekin). HNSW indeks — to'g'ri yo'nalishga boradi (tez)</text>

  <defs>
    <marker id="ix14r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
