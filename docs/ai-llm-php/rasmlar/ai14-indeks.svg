  <!-- pastki izoh -->
  <text x="380" y="410" text-anchor="middle" font-size="13" fill="#475569">Kam ma'lumotda indeks shart emas · O'n minglab+ qatorda HNSW shart · CREATE INDEX ... USING hnsw (embedding vector_cosine_ops)</text>
