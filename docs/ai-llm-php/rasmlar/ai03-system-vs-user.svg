<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>System prompt (rol va qoidalar) va user prompt (aniq savol) qatlamlari</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">System prompt va user prompt</text>
  <text x="380" y="62" text-anchor="middle" font-size="14" fill="#475569">Ikki qatlam birga modelga uzatiladi</text>

  <!-- System prompt qatlami -->
  <rect x="50" y="92" width="400" height="150" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <rect x="50" y="92" width="400" height="34" rx="12" fill="#7c3aed"/>
  <rect x="50" y="110" width="400" height="16" fill="#7c3aed"/>
  <text x="70" y="115" font-size="15" font-weight="700" fill="#ffffff">SYSTEM PROMPT — rol va qoidalar</text>
  <text x="70" y="152" font-size="14" fill="#475569">Kim u? Qanday javob beradi? Nimani qilmaydi?</text>
  <text x="70" y="178" font-size="14" fill="#1e293b">"Sen tajribali PHP dasturchisisan."</text>
  <text x="70" y="200" font-size="14" fill="#1e293b">"Doim o'zbek tilida, qisqa javob ber."</text>
  <text x="70" y="226" font-size="13" fill="#94a3b8">Butun suhbatga taalluqli — bir marta</text>

  <!-- User prompt qatlami -->
  <rect x="50" y="262" width="400" height="120" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/>
  <rect x="50" y="262" width="400" height="34" rx="12" fill="#4f46e5"/>
  <rect x="50" y="280" width="400" height="16" fill="#4f46e5"/>
  <text x="70" y="285" font-size="15" font-weight="700" fill="#ffffff">USER PROMPT — aniq savol</text>
  <text x="70" y="322" font-size="14" fill="#1e293b">"PHP da massivni qanday saralayman?"</text>
  <text x="70" y="350" font-size="13" fill="#94a3b8">Har safar o'zgaradigan joriy savol</text>

  <!-- Strelkalar modelga -->
  <path d="M 450 165 L 545 220" stroke="#a855f7" stroke-width="2.5" fill="none" marker-end="url(#ok)"/>
  <path d="M 450 320 L 545 245" stroke="#6366f1" stroke-width="2.5" fill="none" marker-end="url(#ok)"/>

  <!-- Model -->
  <rect x="555" y="180" width="160" height="100" rx="14" fill="#7c3aed"/>
  <text x="635" y="222" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Claude</text>
  <text x="635" y="248" text-anchor="middle" font-size="13" fill="#ede9fe">modeli</text>

  <!-- Javob -->
  <path d="M 635 280 L 635 330" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#ok)"/>
  <rect x="510" y="338" width="250" height="60" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="635" y="364" text-anchor="middle" font-size="14" font-weight="600" fill="#16a34a">Rolga mos, aniq javob</text>
  <text x="635" y="385" text-anchor="middle" font-size="13" fill="#475569">qisqa, o'zbekcha, dasturchi tilida</text>

  <!-- Pastki izoh -->
  <text x="250" y="430" text-anchor="middle" font-size="13" fill="#475569">Doimiy narsa system'ga, o'zgaradigan narsa user'ga</text>

  <defs>
    <marker id="ok" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
