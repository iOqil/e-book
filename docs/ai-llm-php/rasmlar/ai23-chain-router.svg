<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" font-family="Segoe UI, system-ui, sans-serif">
  <title>Chain — ketma-ket bog'langan chaqiruvlar va Router — turga qarab yo'naltirish</title>
  <rect x="0" y="0" width="760" height="480" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Chain va Router — ikki asosiy naqsh</text>

  <defs>
    <marker id="arr23c" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#6366f1"/>
    </marker>
    <marker id="arr23g" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- CHAIN -->
  <text x="380" y="74" text-anchor="middle" font-size="16" font-weight="700" fill="#7c3aed">Chain (zanjir): birinchi javob — keyingiga kirish</text>

  <rect x="40" y="92" width="130" height="62" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="105" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Uzun matn</text>
  <text x="105" y="139" text-anchor="middle" font-size="13" fill="#475569">kiruvchi</text>

  <line x1="170" y1="123" x2="216" y2="123" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arr23c)"/>

  <rect x="220" y="92" width="150" height="62" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="295" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#4f46e5">1. Xulosa</text>
  <text x="295" y="139" text-anchor="middle" font-size="13" fill="#475569">matn -&gt; qisqa</text>

  <line x1="370" y1="123" x2="416" y2="123" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arr23c)"/>

  <rect x="420" y="92" width="150" height="62" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="495" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#4f46e5">2. Tarjima</text>
  <text x="495" y="139" text-anchor="middle" font-size="13" fill="#475569">xulosa -&gt; EN</text>

  <line x1="570" y1="123" x2="616" y2="123" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr23g)"/>

  <rect x="620" y="92" width="118" height="62" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="679" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Natija</text>
  <text x="679" y="139" text-anchor="middle" font-size="13" fill="#16a34a">tayyor</text>

  <text x="40" y="184" font-size="13" fill="#94a3b8">Har qadam aniq — siz boshqarasiz. Bir qadam chiqishi keyingisining kirishi.</text>

  <line x1="40" y1="204" x2="720" y2="204" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ROUTER -->
  <text x="380" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#4f46e5">Router (yo'naltirish): so'rov TURIGA qarab to'g'ri oqimga</text>

  <rect x="40" y="256" width="150" height="64" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="115" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">So'rov keldi</text>
  <text x="115" y="303" text-anchor="middle" font-size="13" fill="#475569">"bu qaysi tur?"</text>

  <line x1="190" y1="288" x2="236" y2="288" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arr23c)"/>

  <rect x="240" y="252" width="150" height="72" rx="10" fill="#fef9c3" stroke="#f59e0b" stroke-width="2"/>
  <text x="315" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Klassifikator</text>
  <text x="315" y="301" text-anchor="middle" font-size="13" fill="#475569">arzon model</text>
  <text x="315" y="318" text-anchor="middle" font-size="13" fill="#94a3b8">(Haiku) turni aniqlaydi</text>

  <!-- branches -->
  <line x1="390" y1="276" x2="556" y2="262" stroke="#6366f1" stroke-width="2" marker-end="url(#arr23c)"/>
  <line x1="390" y1="288" x2="556" y2="332" stroke="#6366f1" stroke-width="2" marker-end="url(#arr23c)"/>
  <line x1="390" y1="300" x2="556" y2="402" stroke="#6366f1" stroke-width="2" marker-end="url(#arr23c)"/>

  <rect x="560" y="238" width="178" height="48" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="649" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#4f46e5">Texnik savol</text>
  <text x="649" y="276" text-anchor="middle" font-size="13" fill="#475569">kod prompt + Opus</text>

  <rect x="560" y="308" width="178" height="48" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="649" y="328" text-anchor="middle" font-size="13" font-weight="700" fill="#4f46e5">Buyurtma holati</text>
  <text x="649" y="346" text-anchor="middle" font-size="13" fill="#475569">tool + bazaga so'rov</text>

  <rect x="560" y="378" width="178" height="48" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="649" y="398" text-anchor="middle" font-size="13" font-weight="700" fill="#4f46e5">Oddiy salom</text>
  <text x="649" y="416" text-anchor="middle" font-size="13" fill="#475569">qisqa javob, arzon</text>

  <text x="40" y="360" font-size="13" fill="#475569" font-weight="700">Foyda:</text>
  <text x="40" y="382" font-size="13" fill="#475569">- Har turga mos prompt</text>
  <text x="40" y="404" font-size="13" fill="#475569">- Har turga mos model</text>
  <text x="40" y="426" font-size="13" fill="#475569">- Arzon model bilan saralash,</text>
  <text x="40" y="446" font-size="13" fill="#475569">  qimmat model bilan bajarish</text>
</svg>
