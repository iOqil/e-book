<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" font-family="Segoe UI, system-ui, sans-serif">
  <title>Model bir nechta tooldan keraklisini tanlab ketma-ket chaqiradi va yakuniy javob beradi</title>
  <rect x="0" y="0" width="760" height="480" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Ko'p tool: model keraklisini tanlaydi</text>
  <text x="380" y="58" text-anchor="middle" font-size="14" fill="#475569">savol: "Bugungi sanani ayt va 240 ni 4 ga bo'l"</text>

  <!-- User question -->
  <rect x="280" y="78" width="200" height="50" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="380" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">Foydalanuvchi savoli</text>
  <text x="380" y="118" text-anchor="middle" font-size="13" fill="#94a3b8">runner'ga uzatiladi</text>

  <line x1="380" y1="128" x2="380" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="380,158 375,148 385,148" fill="#94a3b8"/>

  <!-- Model -->
  <rect x="250" y="160" width="260" height="58" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="380" y="184" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed">Model (Claude)</text>
  <text x="380" y="204" text-anchor="middle" font-size="13" fill="#475569">qaysi tool kerakligini hal qiladi</text>

  <!-- Three tools row -->
  <!-- tool 1: chosen -->
  <line x1="320" y1="218" x2="170" y2="262" stroke="#16a34a" stroke-width="2"/>
  <polygon points="170,262 178,255 181,267" fill="#16a34a"/>
  <rect x="60" y="264" width="200" height="64" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="160" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">joriy_vaqt &#10003;</text>
  <text x="160" y="308" text-anchor="middle" font-size="13" fill="#475569">sana uchun chaqirildi</text>

  <!-- tool 2: not chosen -->
  <rect x="280" y="264" width="200" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="380" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#94a3b8">ob_havo</text>
  <text x="380" y="308" text-anchor="middle" font-size="13" fill="#94a3b8">so'ralmadi — tegilmadi</text>

  <!-- tool 3: chosen -->
  <line x1="440" y1="218" x2="590" y2="262" stroke="#16a34a" stroke-width="2"/>
  <polygon points="590,262 582,255 579,267" fill="#16a34a"/>
  <rect x="500" y="264" width="200" height="64" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">kalkulyator &#10003;</text>
  <text x="600" y="308" text-anchor="middle" font-size="13" fill="#475569">bo'lish uchun chaqirildi</text>

  <!-- results back to model -->
  <line x1="160" y1="328" x2="320" y2="376" stroke="#a855f7" stroke-width="2"/>
  <line x1="600" y1="328" x2="440" y2="376" stroke="#a855f7" stroke-width="2"/>
  <text x="380" y="356" text-anchor="middle" font-size="13" fill="#7c3aed">natijalar runner orqali modelga qaytadi</text>

  <!-- Final answer -->
  <rect x="210" y="380" width="340" height="78" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="380" y="406" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">Yakuniy javob (runUntilDone)</text>
  <text x="380" y="430" text-anchor="middle" font-size="13" fill="#475569">"Bugun 2026-06-15.</text>
  <text x="380" y="448" text-anchor="middle" font-size="13" fill="#475569">240 ni 4 ga bo'lsak — 60."</text>
</svg>
