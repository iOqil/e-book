<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>To'liq chat oqimi: Livewire UI, route, AiService, Claude, javob va DB saqlash</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">To'liq chat oqimi</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#64748b">Savol UI'dan Claude'ga boradi, javob qaytadi va saqlanadi</text>

  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
    <marker id="a2b" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- 1 UI -->
  <rect x="50" y="96" width="160" height="74" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="130" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">UI (Livewire)</text>
  <text x="130" y="144" text-anchor="middle" font-size="13" fill="#475569">savol kiritiladi</text>
  <text x="130" y="160" text-anchor="middle" font-size="13" fill="#94a3b8">wire:model</text>

  <!-- 2 route/component -->
  <rect x="300" y="96" width="160" height="74" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="380" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Komponent / Route</text>
  <text x="380" y="144" text-anchor="middle" font-size="13" fill="#475569">yubor() metodi</text>
  <text x="380" y="160" text-anchor="middle" font-size="13" fill="#94a3b8">validatsiya</text>

  <!-- 3 AiService -->
  <rect x="550" y="96" width="160" height="74" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="630" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed">AiService</text>
  <text x="630" y="144" text-anchor="middle" font-size="13" fill="#475569">sora()</text>
  <text x="630" y="160" text-anchor="middle" font-size="13" fill="#94a3b8">DI bilan inject</text>

  <!-- 4 Claude -->
  <rect x="550" y="250" width="160" height="64" rx="32" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
  <text x="630" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed">Claude API</text>
  <text x="630" y="298" text-anchor="middle" font-size="13" fill="#94a3b8">javob generatsiya</text>

  <!-- 5 DB -->
  <rect x="300" y="250" width="160" height="64" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">Suhbat (DB)</text>
  <text x="380" y="298" text-anchor="middle" font-size="13" fill="#475569">savol + javob saqlanadi</text>

  <!-- 6 UI ko'rsatadi -->
  <rect x="50" y="250" width="160" height="64" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="130" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">Javob UI'da</text>
  <text x="130" y="298" text-anchor="middle" font-size="13" fill="#475569">ekranda ko'rinadi</text>

  <!-- arrows forward (binafsha) -->
  <line x1="210" y1="133" x2="296" y2="133" stroke="#7c3aed" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="460" y1="133" x2="546" y2="133" stroke="#7c3aed" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="630" y1="170" x2="630" y2="246" stroke="#7c3aed" stroke-width="2" marker-end="url(#a2)"/>

  <!-- arrows back (yashil) -->
  <line x1="546" y1="282" x2="464" y2="282" stroke="#16a34a" stroke-width="2" marker-end="url(#a2b)"/>
  <text x="505" y="246" text-anchor="middle" font-size="13" fill="#16a34a">javob</text>
  <line x1="300" y1="282" x2="214" y2="282" stroke="#16a34a" stroke-width="2" marker-end="url(#a2b)"/>

  <!-- forward step numbers -->
  <circle cx="253" cy="133" r="11" fill="#7c3aed"/><text x="253" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <circle cx="503" cy="133" r="11" fill="#7c3aed"/><text x="503" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <circle cx="648" cy="208" r="11" fill="#7c3aed"/><text x="648" y="213" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <circle cx="505" cy="282" r="11" fill="#16a34a"/><text x="505" y="287" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
  <circle cx="257" cy="282" r="11" fill="#16a34a"/><text x="257" y="287" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">5</text>

  <text x="380" y="360" text-anchor="middle" font-size="14" fill="#475569">Binafsha = so'rov yo'li · Yashil = javob va saqlash yo'li</text>
  <text x="380" y="392" text-anchor="middle" font-size="13" fill="#94a3b8">Streaming kerak bo'lsa: javob bo'lak-bo'lak (token) UI'ga real vaqtda oqadi (5-bob)</text>
</svg>
