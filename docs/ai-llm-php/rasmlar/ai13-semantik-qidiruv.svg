<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Semantik qidiruv oqimi: hujjatlarni embed qilish, so'rovni embed qilish, eng yaqin vektorni topish va natija</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Semantik qidiruv oqimi</text>

  <!-- TAYYORLASH (bir marta) -->
  <text x="40" y="72" font-size="15" font-weight="700" fill="#4f46e5">1) Tayyorlash (bir marta)</text>
  <rect x="40" y="84" width="150" height="92" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="115" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Hujjatlar</text>
  <text x="115" y="138" text-anchor="middle" font-size="13" fill="#475569">FAQ, maqola,</text>
  <text x="115" y="156" text-anchor="middle" font-size="13" fill="#475569">bo'laklar...</text>

  <line x1="192" y1="130" x2="228" y2="130" stroke="#94a3b8" stroke-width="2" marker-end="url(#a13c)"/>

  <rect x="232" y="84" width="150" height="92" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="307" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#4f46e5">Embed qil</text>
  <text x="307" y="146" text-anchor="middle" font-size="13" fill="#475569">har biriga vektor</text>

  <line x1="384" y1="130" x2="420" y2="130" stroke="#94a3b8" stroke-width="2" marker-end="url(#a13c)"/>

  <rect x="424" y="84" width="160" height="92" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="504" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Saqlash</text>
  <text x="504" y="146" text-anchor="middle" font-size="13" fill="#475569">vektor + matn</text>

  <!-- QIDIRUV (har so'rovda) -->
  <text x="40" y="232" font-size="15" font-weight="700" fill="#d97757">2) Qidiruv (har so'rovda)</text>
  <rect x="40" y="244" width="150" height="92" rx="10" fill="#ffffff" stroke="#d97757" stroke-width="2"/>
  <text x="115" y="284" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">So'rov</text>
  <text x="115" y="306" text-anchor="middle" font-size="13" fill="#475569">"avto narxi?"</text>

  <line x1="192" y1="290" x2="228" y2="290" stroke="#94a3b8" stroke-width="2" marker-end="url(#a13c)"/>

  <rect x="232" y="244" width="150" height="92" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="307" y="284" text-anchor="middle" font-size="14" font-weight="700" fill="#4f46e5">Embed qil</text>
  <text x="307" y="306" text-anchor="middle" font-size="13" fill="#475569">so'rov vektori</text>

  <line x1="384" y1="290" x2="420" y2="290" stroke="#94a3b8" stroke-width="2" marker-end="url(#a13c)"/>

  <rect x="424" y="244" width="160" height="92" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="504" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">Kosinus bilan</text>
  <text x="504" y="298" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">eng yaqinni top</text>
  <text x="504" y="318" text-anchor="middle" font-size="13" fill="#475569">(saqlangan vektorlar)</text>

  <!-- saqlash -> taqqoslash (dashed) -->
  <path d="M 504 178 L 504 210 L 660 210 L 660 290 L 588 290" fill="none" stroke="#c7d2fe" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a13c)"/>
  <text x="672" y="245" font-size="13" fill="#94a3b8">saqlangan</text>
  <text x="672" y="262" font-size="13" fill="#94a3b8">vektorlar</text>

  <!-- natija -->
  <line x1="504" y1="338" x2="504" y2="378" stroke="#94a3b8" stroke-width="2" marker-end="url(#a13c)"/>
  <rect x="180" y="384" width="400" height="64" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="412" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">Natija: eng mos hujjat(lar)</text>
  <text x="380" y="434" text-anchor="middle" font-size="13" fill="#475569">"mashina" so'zi bo'lmasa ham ma'noga ko'ra topiladi</text>

  <defs>
    <marker id="a13c" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
