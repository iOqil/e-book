<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="Segoe UI, system-ui, sans-serif">
  <title>API kalit himoyasi: kalit frontendda yoki kodda bo'lsa o'g'irlanadi (xato) vs kalit serverda .env da, frontend backend proxy orqali boradi (to'g'ri)</title>
  <rect x="0" y="0" width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">API kalitni qayerda saqlash kerak</text>

  <defs>
    <marker id="arrK" markerWidth="12" markerHeight="12" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#475569"/>
    </marker>
    <marker id="arrKr" markerWidth="12" markerHeight="12" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- XATO -->
  <rect x="24" y="58" width="712" height="170" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="24" y="58" width="712" height="38" rx="12" fill="#fee2e2"/>
  <text x="44" y="84" font-size="16" font-weight="700" fill="#dc2626">XATO — kalit frontendda yoki kodda/git'da</text>

  <rect x="48" y="116" width="190" height="90" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="143" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Brauzer (frontend)</text>
  <text x="143" y="172" text-anchor="middle" font-size="13" fill="#dc2626">JS ichida API kalit</text>
  <text x="143" y="192" text-anchor="middle" font-size="13" fill="#dc2626">(hamma ko'radi)</text>

  <line x1="244" y1="161" x2="320" y2="161" stroke="#dc2626" stroke-width="2" marker-end="url(#arrKr)"/>
  <text x="282" y="153" text-anchor="middle" font-size="13" fill="#94a3b8">kalit bilan</text>

  <rect x="326" y="116" width="160" height="90" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="406" y="156" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">AI API</text>
  <text x="406" y="180" text-anchor="middle" font-size="13" fill="#475569">(Anthropic)</text>

  <text x="600" y="138" text-anchor="middle" font-size="32">⚠</text>
  <rect x="520" y="150" width="190" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="615" y="173" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">Kalit o'g'irlanadi</text>
  <text x="615" y="193" text-anchor="middle" font-size="13" fill="#dc2626">-&gt; sizning hisobingizdan pul</text>

  <!-- TO'G'RI -->
  <rect x="24" y="246" width="712" height="184" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="24" y="246" width="712" height="38" rx="12" fill="#dcfce7"/>
  <text x="44" y="272" font-size="16" font-weight="700" fill="#15803d">TO'G'RI — kalit serverda .env, frontend backend proxy orqali</text>

  <rect x="48" y="304" width="170" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="133" y="340" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Brauzer (frontend)</text>
  <text x="133" y="366" text-anchor="middle" font-size="13" fill="#15803d">kalit YO'Q</text>

  <line x1="218" y1="349" x2="288" y2="349" stroke="#475569" stroke-width="2" marker-end="url(#arrK)"/>
  <text x="253" y="341" text-anchor="middle" font-size="13" fill="#94a3b8">kalitsiz</text>

  <rect x="294" y="304" width="190" height="90" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="389" y="334" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">PHP backend (proxy)</text>
  <text x="389" y="360" text-anchor="middle" font-size="13" fill="#15803d">getenv('...KEY')</text>
  <text x="389" y="380" text-anchor="middle" font-size="13" fill="#15803d">.env (git'da YO'Q)</text>

  <line x1="484" y1="349" x2="554" y2="349" stroke="#475569" stroke-width="2" marker-end="url(#arrK)"/>
  <text x="519" y="341" text-anchor="middle" font-size="13" fill="#94a3b8">kalit bilan</text>

  <rect x="560" y="304" width="150" height="90" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="635" y="344" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">AI API</text>
  <text x="635" y="368" text-anchor="middle" font-size="13" fill="#475569">(Anthropic)</text>

  <text x="380" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">Kalit hech qachon foydalanuvchining qurilmasiga yetib bormaydi</text>
</svg>
