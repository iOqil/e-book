<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Segoe UI, system-ui, sans-serif">
  <title>BetaRunnableTool qismlari: ta'rif (name, description, input_schema) va run funksiya</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">BetaRunnableTool qismlari</text>
  <text x="380" y="58" text-anchor="middle" font-size="14" fill="#475569">bitta tool = ta'rif (model o'qiydi) + funksiya (kod bajaradi)</text>

  <!-- Outer container -->
  <rect x="40" y="78" width="680" height="320" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="70" y="104" font-size="15" font-weight="700" fill="#7c3aed">new BetaRunnableTool( ta'rif , funksiya )</text>

  <!-- LEFT: ta'rif (1-argument) -->
  <rect x="64" y="120" width="320" height="258" rx="10" fill="#f5f3ff" stroke="#a855f7" stroke-width="2"/>
  <text x="224" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed">1) Ta'rif (massiv)</text>
  <text x="224" y="166" text-anchor="middle" font-size="13" fill="#94a3b8">modelga "bu tool nima" deydi</text>

  <rect x="84" y="180" width="280" height="52" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="98" y="202" font-size="14" font-weight="700" fill="#4f46e5">name</text>
  <text x="98" y="222" font-size="13" fill="#475569">tool nomi: 'ob_havo'</text>

  <rect x="84" y="240" width="280" height="52" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="98" y="262" font-size="14" font-weight="700" fill="#4f46e5">description</text>
  <text x="98" y="282" font-size="13" fill="#475569">qachon chaqirilsin (muhim!)</text>

  <rect x="84" y="300" width="280" height="62" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="98" y="322" font-size="14" font-weight="700" fill="#4f46e5">input_schema</text>
  <text x="98" y="342" font-size="13" fill="#475569">qaysi argumentlar (JSON-schema)</text>
  <text x="98" y="358" font-size="13" fill="#94a3b8">type, properties, required</text>

  <!-- RIGHT: funksiya (2-argument) -->
  <rect x="408" y="120" width="288" height="258" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="552" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">2) Funksiya (closure)</text>
  <text x="552" y="166" text-anchor="middle" font-size="13" fill="#94a3b8">tool chaqirilganda ishlaydi</text>

  <rect x="428" y="184" width="248" height="48" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="552" y="206" text-anchor="middle" font-size="13" fill="#475569">kirish: array $input</text>
  <text x="552" y="224" text-anchor="middle" font-size="13" fill="#94a3b8">model bergan argumentlar</text>

  <line x1="552" y1="232" x2="552" y2="262" stroke="#16a34a" stroke-width="2"/>
  <polygon points="552,270 547,260 557,260" fill="#16a34a"/>

  <rect x="428" y="272" width="248" height="48" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="552" y="294" text-anchor="middle" font-size="13" fill="#475569">sizning kod: API, baza...</text>
  <text x="552" y="312" text-anchor="middle" font-size="13" fill="#94a3b8">"Toshkent: 25 daraja"</text>

  <rect x="428" y="328" width="248" height="34" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="552" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">qaytaradi: string yoki array</text>
</svg>
