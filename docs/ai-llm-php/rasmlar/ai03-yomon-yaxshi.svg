<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>Noaniq prompt tarqoq javob beradi, aniq prompt aniq javob beradi</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Yomon prompt va yaxshi prompt</text>
  <text x="380" y="62" text-anchor="middle" font-size="14" fill="#475569">Bir xil vazifa — ikki xil natija</text>

  <!-- Chap: yomon -->
  <rect x="40" y="90" width="320" height="80" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="118" font-size="15" font-weight="700" fill="#dc2626">Yomon prompt (noaniq)</text>
  <text x="60" y="146" font-size="14" fill="#1e293b">"Maqola yoz."</text>

  <path d="M 200 170 L 200 210" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>

  <rect x="40" y="218" width="320" height="100" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="200" y="246" text-anchor="middle" font-size="14" font-weight="600" fill="#dc2626">Tarqoq, taxminiy javob</text>
  <text x="60" y="272" font-size="13" fill="#475569">Qaysi mavzu? Kim uchun?</text>
  <text x="60" y="294" font-size="13" fill="#475569">Qancha uzun? Qaysi tilda?</text>
  <text x="60" y="312" font-size="13" fill="#94a3b8">Model o'zicha taxmin qiladi</text>

  <!-- Ajratuvchi chiziq -->
  <line x1="380" y1="92" x2="380" y2="330" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- O'ng: yaxshi -->
  <rect x="400" y="90" width="320" height="110" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="420" y="118" font-size="15" font-weight="700" fill="#16a34a">Yaxshi prompt (aniq)</text>
  <text x="420" y="144" font-size="13" fill="#1e293b">"Xatolarni boshqarish haqida</text>
  <text x="420" y="164" font-size="13" fill="#1e293b">boshlovchilar uchun maqola: 3 bo'lim,</text>
  <text x="420" y="184" font-size="13" fill="#1e293b">misol bilan, o'zbekcha, ~300 so'z."</text>

  <path d="M 560 200 L 560 240" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#ar2)"/>

  <rect x="400" y="248" width="320" height="90" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="560" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#16a34a">Aniq, kerakli javob</text>
  <text x="420" y="302" font-size="13" fill="#475569">To'g'ri mavzu, daraja, tuzilma,</text>
  <text x="420" y="322" font-size="13" fill="#475569">uzunlik va til — hammasi mos</text>

  <!-- Pastki xulosa -->
  <rect x="150" y="370" width="460" height="44" rx="10" fill="#ede9fe" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="380" y="397" text-anchor="middle" font-size="14" font-weight="600" fill="#7c3aed">Aniq aytmaganingizni model taxmin qiladi</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/>
    </marker>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
