<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Segoe UI, system-ui, sans-serif">
  <title>Erkin mijoz xabaridan strukturalangan ma'lumot ajratish (ism, email, maqsad)</title>
  <rect x="0" y="0" width="760" height="380" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Ma'lumot ajratish (extraction)</text>

  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Kirish: erkin matn -->
  <rect x="36" y="100" width="230" height="180" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="151" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">Erkin xabar</text>
  <text x="52" y="158" font-size="13" fill="#475569">"Salom, men Dilnoza,</text>
  <text x="52" y="180" font-size="13" fill="#475569">telefonim buzildi,</text>
  <text x="52" y="202" font-size="13" fill="#475569">kafolat bormi?</text>
  <text x="52" y="224" font-size="13" fill="#475569">doniyor@example.com</text>
  <text x="52" y="246" font-size="13" fill="#475569">ga yozing"</text>

  <!-- Model -->
  <rect x="312" y="130" width="136" height="120" rx="10" fill="#ede9fe" stroke="#a855f7" stroke-width="2"/>
  <text x="380" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#7c3aed">Model</text>
  <text x="380" y="204" text-anchor="middle" font-size="13" fill="#475569">+ sxema</text>
  <text x="380" y="224" text-anchor="middle" font-size="13" fill="#475569">(MijozMurojaati)</text>

  <!-- Chiqish: strukturalangan -->
  <rect x="494" y="86" width="230" height="208" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="609" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">Strukturalangan</text>

  <rect x="514" y="132" width="190" height="44" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="526" y="150" font-size="13" fill="#94a3b8">ism</text>
  <text x="526" y="168" font-size="14" font-weight="600" fill="#1e293b">Dilnoza</text>

  <rect x="514" y="184" width="190" height="44" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="526" y="202" font-size="13" fill="#94a3b8">email</text>
  <text x="526" y="220" font-size="14" font-weight="600" fill="#1e293b">doniyor@example.com</text>

  <rect x="514" y="236" width="190" height="44" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="526" y="254" font-size="13" fill="#94a3b8">maqsad</text>
  <text x="526" y="272" font-size="14" font-weight="600" fill="#1e293b">kafolat</text>

  <!-- strelkalar -->
  <line x1="266" y1="190" x2="308" y2="190" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="448" y1="190" x2="490" y2="190" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr2)"/>

  <text x="380" y="334" text-anchor="middle" font-size="14" fill="#475569">Tartibsiz matn -&gt; aniq, kodga tayyor maydonlar</text>
</svg>
