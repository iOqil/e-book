<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>HTTP xato kodlari va qaysilarini qayta urinish mumkin</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">API xato kodlari — qaysini qayta urinish mumkin?</text>

  <!-- Jadval boshi -->
  <rect x="40" y="62" width="120" height="44" fill="#4f46e5"/>
  <rect x="160" y="62" width="300" height="44" fill="#4f46e5"/>
  <rect x="460" y="62" width="120" height="44" fill="#4f46e5"/>
  <rect x="580" y="62" width="140" height="44" fill="#4f46e5"/>
  <text x="100" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Kod</text>
  <text x="310" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Ma'nosi</text>
  <text x="520" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Qayta urinish?</text>
  <text x="650" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Sabab sizdami?</text>

  <!-- 400 -->
  <rect x="40" y="106" width="120" height="46" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <rect x="160" y="106" width="300" height="46" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <rect x="460" y="106" width="120" height="46" fill="#fef2f2" stroke="#ddd6fe" stroke-width="1.5"/>
  <rect x="580" y="106" width="140" height="46" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="100" y="135" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">400</text>
  <text x="172" y="135" font-size="14" fill="#475569">Noto'g'ri so'rov (parametr xato)</text>
  <text x="520" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">Yo'q</text>
  <text x="650" y="135" text-anchor="middle" font-size="14" fill="#475569">Ha — kodni tuzating</text>

  <!-- 401 -->
  <rect x="40" y="152" width="120" height="46" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <rect x="160" y="152" width="300" height="46" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <rect x="460" y="152" width="120" height="46" fill="#fef2f2" stroke="#ddd6fe" stroke-width="1.5"/>
  <rect x="580" y="152" width="140" height="46" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="100" y="181" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">401</text>
  <text x="172" y="181" font-size="14" fill="#475569">Kalit xato yoki yo'q</text>
  <text x="520" y="181" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">Yo'q</text>
  <text x="650" y="181" text-anchor="middle" font-size="14" fill="#475569">Ha — kalitni teks.</text>

  <!-- 403 -->
  <rect x="40" y="198" width="120" height="46" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <rect x="160" y="198" width="300" height="46" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <rect x="460" y="198" width="120" height="46" fill="#fef2f2" stroke="#ddd6fe" stroke-width="1.5"/>
  <rect x="580" y="198" width="140" height="46" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="100" y="227" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">403</text>
  <text x="172" y="227" font-size="14" fill="#475569">Ruxsat yo'q</text>
  <text x="520" y="227" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">Yo'q</text>
  <text x="650" y="227" text-anchor="middle" font-size="14" fill="#475569">Ha — huquqlar</text>

  <!-- 404 -->
  <rect x="40" y="244" width="120" height="46" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <rect x="160" y="244" width="300" height="46" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <rect x="460" y="244" width="120" height="46" fill="#fef2f2" stroke="#ddd6fe" stroke-width="1.5"/>
  <rect x="580" y="244" width="140" height="46" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="100" y="273" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">404</text>
  <text x="172" y="273" font-size="14" fill="#475569">Model topilmadi (ID xato)</text>
  <text x="520" y="273" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">Yo'q</text>
  <text x="650" y="273" text-anchor="middle" font-size="14" fill="#475569">Ha — model ID</text>

  <!-- 429 -->
  <rect x="40" y="290" width="120" height="46" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <rect x="160" y="290" width="300" height="46" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <rect x="460" y="290" width="120" height="46" fill="#f0fdf4" stroke="#ddd6fe" stroke-width="1.5"/>
  <rect x="580" y="290" width="140" height="46" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="100" y="319" text-anchor="middle" font-size="16" font-weight="700" fill="#f59e0b">429</text>
  <text x="172" y="319" font-size="14" fill="#475569">Rate limit (juda ko'p so'rov)</text>
  <text x="520" y="319" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">Ha — kutib</text>
  <text x="650" y="319" text-anchor="middle" font-size="14" fill="#475569">Qisman</text>

  <!-- 500/529 -->
  <rect x="40" y="336" width="120" height="46" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <rect x="160" y="336" width="300" height="46" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <rect x="460" y="336" width="120" height="46" fill="#f0fdf4" stroke="#ddd6fe" stroke-width="1.5"/>
  <rect x="580" y="336" width="140" height="46" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="100" y="365" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">500 / 529</text>
  <text x="172" y="365" font-size="14" fill="#475569">Server xatosi / yuklangan</text>
  <text x="520" y="365" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">Ha — backoff</text>
  <text x="650" y="365" text-anchor="middle" font-size="14" fill="#475569">Yo'q — server</text>

  <!-- Izoh -->
  <rect x="40" y="402" width="680" height="48" rx="8" fill="#ede9fe" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="60" y="423" font-size="14" fill="#4f46e5" font-weight="700">Qoida:</text>
  <text x="115" y="423" font-size="14" fill="#475569">429 va 5xx — vaqtinchalik, qayta urinsa bo'ladi (kutib).</text>
  <text x="60" y="442" font-size="14" fill="#475569">400/401/403/404 — sizning xatongiz: qayta urinish FOYDASIZ, kodni tuzating.</text>
</svg>
