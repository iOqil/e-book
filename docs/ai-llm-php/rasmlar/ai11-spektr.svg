<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Segoe UI, system-ui, sans-serif">
  <title>Nazorat spektri: oddiy so'rov, workflow, agent — kim yo'lni boshqaradi</title>
  <rect x="0" y="0" width="760" height="400" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Spektr: kim yo'lni boshqaradi?</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">Oddiy so'rov &lt; workflow &lt; agent — nazorat sizdan modelga o'tadi</text>

  <defs>
    <marker id="arr11s" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Spektr o'qi -->
  <line x1="60" y1="100" x2="700" y2="100" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr11s)"/>
  <text x="70" y="91" font-size="13" fill="#64748b">SIZ boshqarasiz</text>
  <text x="690" y="91" text-anchor="end" font-size="13" fill="#64748b">MODEL boshqaradi</text>

  <!-- 1. Oddiy so'rov -->
  <rect x="50" y="130" width="210" height="220" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="50" y="130" width="210" height="44" rx="12" fill="#ede9fe"/>
  <text x="155" y="159" text-anchor="middle" font-size="16" font-weight="700" fill="#4f46e5">Oddiy so'rov</text>
  <text x="70" y="200" font-size="14" font-weight="700" fill="#1e293b">Kim: SIZ (1 qadam)</text>
  <text x="70" y="226" font-size="13" fill="#475569">Bir so'rov, bir javob.</text>
  <text x="70" y="248" font-size="13" fill="#475569">Yo'l yo'q — to'g'ri javob.</text>
  <text x="70" y="288" font-size="13" font-weight="700" fill="#7c3aed">Misol:</text>
  <text x="70" y="310" font-size="13" fill="#475569">"Bu matnni tarjima qil"</text>
  <text x="70" y="336" font-size="13" font-style="italic" fill="#16a34a">Bir qadamlik vazifa</text>

  <!-- 2. Workflow -->
  <rect x="275" y="130" width="210" height="220" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="275" y="130" width="210" height="44" rx="12" fill="#e0e7ff"/>
  <text x="380" y="159" text-anchor="middle" font-size="16" font-weight="700" fill="#4f46e5">Workflow</text>
  <text x="295" y="200" font-size="14" font-weight="700" fill="#1e293b">Kim: SIZ (qadamlar)</text>
  <text x="295" y="226" font-size="13" fill="#475569">Qadamlarni siz yozasiz.</text>
  <text x="295" y="248" font-size="13" fill="#475569">Yo'l oldindan sobit.</text>
  <text x="295" y="288" font-size="13" font-weight="700" fill="#4f46e5">Misol:</text>
  <text x="295" y="310" font-size="13" fill="#475569">"xulosa -&gt; teg -&gt; saqla"</text>
  <text x="295" y="336" font-size="13" font-style="italic" fill="#16a34a">Qadamlar ma'lum</text>

  <!-- 3. Agent -->
  <rect x="500" y="130" width="210" height="220" rx="12" fill="#ffffff" stroke="#d97757" stroke-width="2.5"/>
  <rect x="500" y="130" width="210" height="44" rx="12" fill="#fde8df"/>
  <text x="605" y="159" text-anchor="middle" font-size="16" font-weight="700" fill="#d97757">Agent</text>
  <text x="520" y="200" font-size="14" font-weight="700" fill="#1e293b">Kim: MODEL</text>
  <text x="520" y="226" font-size="13" fill="#475569">Qadamlarni model</text>
  <text x="520" y="246" font-size="13" fill="#475569">o'zi tanlaydi.</text>
  <text x="520" y="288" font-size="13" font-weight="700" fill="#d97757">Misol:</text>
  <text x="520" y="310" font-size="13" fill="#475569">"hisobot tayyorla"</text>
  <text x="520" y="336" font-size="13" font-style="italic" fill="#dc2626">Qadamlar noma'lum</text>
</svg>
