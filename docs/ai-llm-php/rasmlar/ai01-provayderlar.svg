<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="Segoe UI, system-ui, sans-serif">
  <title>LLM provayderlari manzarasi va bitta kod ko'p provayderga ulanishi g'oyasi</title>
  <rect x="0" y="0" width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Provayderlar manzarasi</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">Tushunchalar bir xil — provayderni almashtirish oson</text>

  <!-- Sizning kodingiz (markazda yuqorida) -->
  <rect x="280" y="90" width="200" height="80" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="380" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#7c3aed">Sizning PHP kodingiz</text>
  <text x="380" y="150" text-anchor="middle" font-size="13" fill="#475569">(provayder-agnostik g'oya)</text>

  <!-- connector lines to providers -->
  <line x1="380" y1="170" x2="120" y2="250" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="380" y1="170" x2="293" y2="250" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="380" y1="170" x2="467" y2="250" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="380" y1="170" x2="640" y2="250" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Anthropic (urg'u) -->
  <rect x="40" y="250" width="160" height="100" rx="10" fill="#fff7ed" stroke="#d97757" stroke-width="2.5"/>
  <text x="120" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Anthropic</text>
  <text x="120" y="306" text-anchor="middle" font-size="14" fill="#d97757">Claude</text>
  <text x="120" y="328" text-anchor="middle" font-size="13" fill="#475569">★ bu kitobda</text>
  <text x="120" y="344" text-anchor="middle" font-size="13" fill="#475569">asosiy vosita</text>

  <!-- OpenAI -->
  <rect x="213" y="250" width="160" height="100" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="293" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">OpenAI</text>
  <text x="293" y="306" text-anchor="middle" font-size="14" fill="#4f46e5">GPT</text>
  <text x="293" y="332" text-anchor="middle" font-size="13" fill="#475569">eng mashhur</text>

  <!-- Google -->
  <rect x="386" y="250" width="160" height="100" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="466" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Google</text>
  <text x="466" y="306" text-anchor="middle" font-size="14" fill="#4f46e5">Gemini</text>
  <text x="466" y="332" text-anchor="middle" font-size="13" fill="#475569">Google ekotizimi</text>

  <!-- Lokal -->
  <rect x="559" y="250" width="160" height="100" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="639" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Lokal</text>
  <text x="639" y="306" text-anchor="middle" font-size="14" fill="#16a34a">Ollama / LM Studio</text>
  <text x="639" y="328" text-anchor="middle" font-size="13" fill="#475569">o'z kompyuterda,</text>
  <text x="639" y="344" text-anchor="middle" font-size="13" fill="#475569">bepul va maxfiy</text>

  <!-- bottom idea box -->
  <rect x="40" y="378" width="680" height="62" rx="10" fill="#ede9fe" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="380" y="404" text-anchor="middle" font-size="14" font-weight="700" fill="#4f46e5">Asosiy g'oya: token, prompt, streaming, RAG, agent — har provayderda bir xil ishlaydi.</text>
  <text x="380" y="426" text-anchor="middle" font-size="13" fill="#475569">Claude'ni o'rgansangiz, boshqasiga o'tish bir necha soatlik ish (19-bob).</text>
</svg>
