<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Segoe UI, system-ui, sans-serif">
  <title>Model yolg'iz so'rovga noto'g'ri yoki bilmayman javob beradi (yopiq kitob), RAG bilan esa hujjatdan topib aniq javob beradi (ochiq kitob)</title>
  <rect x="0" y="0" width="760" height="380" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Yopiq kitob vs ochiq kitob</text>

  <!-- LEFT: LLM yolg'iz -->
  <rect x="24" y="60" width="346" height="296" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="197" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">Model yolg'iz (yopiq kitob)</text>

  <!-- savol -->
  <rect x="48" y="106" width="298" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="197" y="133" text-anchor="middle" font-size="14" fill="#475569">Savol: "Bizning qaytarish siyosati?"</text>

  <line x1="197" y1="152" x2="197" y2="178" stroke="#94a3b8" stroke-width="2" marker-end="url(#a15y)"/>

  <!-- model -->
  <rect x="120" y="182" width="154" height="48" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="197" y="211" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">LLM (faqat yoddan)</text>

  <line x1="197" y1="232" x2="197" y2="258" stroke="#94a3b8" stroke-width="2" marker-end="url(#a15y)"/>

  <!-- javob1 -->
  <rect x="48" y="262" width="298" height="38" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="197" y="285" text-anchor="middle" font-size="14" fill="#dc2626">"Bilmayman" yoki to'qib chiqaradi</text>
  <!-- javob2 -->
  <rect x="48" y="308" width="298" height="36" rx="8" fill="#f8fafc" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="197" y="330" text-anchor="middle" font-size="13" fill="#475569">hujjatni ko'rmagan = ishonchsiz</text>

  <!-- RIGHT: RAG -->
  <rect x="390" y="60" width="346" height="296" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="563" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">RAG (ochiq kitob)</text>

  <!-- savol -->
  <rect x="414" y="106" width="298" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="563" y="133" text-anchor="middle" font-size="14" fill="#475569">Savol: "Bizning qaytarish siyosati?"</text>

  <line x1="563" y1="152" x2="563" y2="174" stroke="#94a3b8" stroke-width="2" marker-end="url(#a15y)"/>

  <!-- hujjat topish -->
  <rect x="414" y="178" width="298" height="44" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="563" y="199" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">Hujjatdan topiladi (retrieval):</text>
  <text x="563" y="216" text-anchor="middle" font-size="13" fill="#475569">"14 kun, chek bilan..." + savol</text>

  <line x1="563" y1="224" x2="563" y2="246" stroke="#94a3b8" stroke-width="2" marker-end="url(#a15y)"/>

  <!-- model -->
  <rect x="486" y="250" width="154" height="44" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="563" y="277" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">LLM (kontekst bilan)</text>

  <line x1="563" y1="296" x2="563" y2="312" stroke="#94a3b8" stroke-width="2" marker-end="url(#a15y)"/>

  <!-- javob -->
  <rect x="414" y="316" width="298" height="32" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="563" y="337" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">Aniq javob + manba [1]</text>

  <defs>
    <marker id="a15y" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
