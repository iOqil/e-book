<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Segoe UI, system-ui, sans-serif">
  <title>RAG indekslash bosqichi: hujjat bo'laklarga bo'linadi, har bo'lak embedding orqali vektorga aylanadi va vektor bazaga saqlanadi</title>
  <rect x="0" y="0" width="760" height="360" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">1-bosqich: indekslash (bir marta)</text>
  <text x="380" y="58" text-anchor="middle" font-size="14" fill="#475569">Hujjatlarni oldindan tayyorlab vektor bazaga joylaymiz</text>

  <!-- 1. Hujjat -->
  <rect x="28" y="120" width="130" height="110" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="93" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Hujjat</text>
  <line x1="48" y1="168" x2="138" y2="168" stroke="#ddd6fe" stroke-width="2"/>
  <line x1="48" y1="184" x2="138" y2="184" stroke="#ddd6fe" stroke-width="2"/>
  <line x1="48" y1="200" x2="138" y2="200" stroke="#ddd6fe" stroke-width="2"/>
  <text x="93" y="222" text-anchor="middle" font-size="13" fill="#94a3b8">PDF / matn</text>

  <line x1="160" y1="175" x2="196" y2="175" stroke="#94a3b8" stroke-width="2" marker-end="url(#a15i)"/>

  <!-- 2. Bo'laklar (chunking) -->
  <rect x="200" y="110" width="150" height="130" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="275" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">Bo'laklash</text>
  <text x="275" y="152" text-anchor="middle" font-size="13" fill="#475569">(chunking)</text>
  <rect x="216" y="162" width="118" height="20" rx="4" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="275" y="176" text-anchor="middle" font-size="13" fill="#475569">bo'lak 1</text>
  <rect x="216" y="186" width="118" height="20" rx="4" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="275" y="200" text-anchor="middle" font-size="13" fill="#475569">bo'lak 2</text>
  <rect x="216" y="210" width="118" height="20" rx="4" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="275" y="224" text-anchor="middle" font-size="13" fill="#475569">bo'lak 3</text>

  <line x1="352" y1="175" x2="388" y2="175" stroke="#94a3b8" stroke-width="2" marker-end="url(#a15i)"/>

  <!-- 3. Embedding -->
  <rect x="392" y="120" width="150" height="110" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="467" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">Embedding</text>
  <text x="467" y="172" text-anchor="middle" font-size="14" fill="#475569">modeli</text>
  <text x="467" y="196" text-anchor="middle" font-size="13" fill="#94a3b8">(Voyage /</text>
  <text x="467" y="212" text-anchor="middle" font-size="13" fill="#94a3b8">OpenAI)</text>

  <line x1="544" y1="175" x2="580" y2="175" stroke="#94a3b8" stroke-width="2" marker-end="url(#a15i)"/>

  <!-- 4. Vektor baza -->
  <rect x="584" y="118" width="150" height="114" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <ellipse cx="659" cy="140" rx="60" ry="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <path d="M 599 140 V 210 A 60 12 0 0 0 719 210 V 140" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="659" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">Vektor</text>
  <text x="659" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">baza</text>
  <text x="659" y="226" text-anchor="middle" font-size="13" fill="#475569">(pgvector)</text>

  <!-- Bottom note -->
  <rect x="120" y="288" width="520" height="44" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="380" y="315" text-anchor="middle" font-size="14" fill="#b45309">Har bo'lak: matn + manba + vektor — birga saqlanadi (manba ko'rsatish uchun)</text>

  <defs>
    <marker id="a15i" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
