<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Segoe UI, system-ui, sans-serif">
  <title>Vazifa murakkabligiga qarab mos model tanlash: oddiy Haiku, o'rta Sonnet, murakkab Opus</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Vazifaga mos model tanlash</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">murakkablik oshgani sari kuchli (qimmat) modelga o'tamiz</text>

  <!-- murakkablik o'qi (chapdan o'ngga) -->
  <defs>
    <marker id="arm" markerWidth="12" markerHeight="12" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <line x1="60" y1="92" x2="700" y2="92" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arm)"/>
  <text x="70" y="84" font-size="13" fill="#94a3b8">oddiy</text>
  <text x="690" y="84" text-anchor="end" font-size="13" fill="#94a3b8">murakkab</text>

  <!-- HAIKU -->
  <rect x="50" y="120" width="210" height="270" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="50" y="120" width="210" height="48" rx="12" fill="#dcfce7"/>
  <text x="155" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#15803d">Haiku 4.5</text>
  <text x="155" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">$1 / $5 — eng arzon</text>
  <text x="155" y="222" text-anchor="middle" font-size="13" fill="#475569">Klassifikatsiya</text>
  <text x="155" y="246" text-anchor="middle" font-size="13" fill="#475569">Spam / sentiment</text>
  <text x="155" y="270" text-anchor="middle" font-size="13" fill="#475569">Til aniqlash, teglash</text>
  <text x="155" y="294" text-anchor="middle" font-size="13" fill="#475569">Qisqa javoblar</text>
  <text x="155" y="356" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">tez + ko'p so'rovga</text>

  <!-- SONNET -->
  <rect x="275" y="120" width="210" height="270" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <rect x="275" y="120" width="210" height="48" rx="12" fill="#e0e7ff"/>
  <text x="380" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#4338ca">Sonnet 4.6</text>
  <text x="380" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">$3 / $15 — balans</text>
  <text x="380" y="222" text-anchor="middle" font-size="13" fill="#475569">Umumlashtirish</text>
  <text x="380" y="246" text-anchor="middle" font-size="13" fill="#475569">Oddiy kod yozish</text>
  <text x="380" y="270" text-anchor="middle" font-size="13" fill="#475569">Tahlil, suhbat boti</text>
  <text x="380" y="294" text-anchor="middle" font-size="13" fill="#475569">RAG javoblari</text>
  <text x="380" y="356" text-anchor="middle" font-size="13" font-weight="700" fill="#6366f1">aql + tezlik</text>

  <!-- OPUS -->
  <rect x="500" y="120" width="210" height="270" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="500" y="120" width="210" height="48" rx="12" fill="#ede9fe"/>
  <text x="605" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#6d28d9">Opus 4.8</text>
  <text x="605" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">$5 / $25 — eng aqlli</text>
  <text x="605" y="222" text-anchor="middle" font-size="13" fill="#475569">Murakkab fikrlash</text>
  <text x="605" y="246" text-anchor="middle" font-size="13" fill="#475569">Nozik kod</text>
  <text x="605" y="270" text-anchor="middle" font-size="13" fill="#475569">Huquq / moliya tahlil</text>
  <text x="605" y="294" text-anchor="middle" font-size="13" fill="#475569">Agent qarorlari</text>
  <text x="605" y="356" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">muhim ishga</text>
</svg>
