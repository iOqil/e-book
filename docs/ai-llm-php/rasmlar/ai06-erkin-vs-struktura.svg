<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Segoe UI, system-ui, sans-serif">
  <title>Erkin matn (parse qiyin) va strukturali JSON (aniq maydonlar) taqqoslashi</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Erkin matn vs strukturali chiqish</text>

  <!-- CHAP: erkin matn -->
  <rect x="36" y="64" width="330" height="330" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="201" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">Erkin insho</text>

  <rect x="60" y="108" width="282" height="120" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="74" y="132" font-size="13" fill="#475569">Albatta! Bu mijozning ismi</text>
  <text x="74" y="152" font-size="13" fill="#475569">Dilnoza, u telefon kafolati</text>
  <text x="74" y="172" font-size="13" fill="#475569">haqida soraydi. Email:</text>
  <text x="74" y="192" font-size="13" fill="#475569">doniyor@example.com.</text>
  <text x="74" y="212" font-size="13" fill="#475569">Mavzu: nosozlik.</text>

  <text x="201" y="258" text-anchor="middle" font-size="14" fill="#dc2626">preg_match? satr qidirish?</text>
  <text x="201" y="280" text-anchor="middle" font-size="14" fill="#dc2626">taxmin? ko'pincha buziladi</text>

  <rect x="60" y="300" width="282" height="76" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="201" y="328" text-anchor="middle" font-size="14" font-weight="600" fill="#dc2626">Faktni qidirish kerak</text>
  <text x="201" y="352" text-anchor="middle" font-size="13" fill="#475569">ishonchsiz, mo'rt</text>

  <!-- O'NG: strukturali JSON -->
  <rect x="394" y="64" width="330" height="330" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="559" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">To'ldirilgan anketa</text>

  <rect x="418" y="108" width="282" height="120" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="432" y="132" font-size="13" fill="#1e293b">{</text>
  <text x="446" y="152" font-size="13" fill="#475569">"ism": "Dilnoza",</text>
  <text x="446" y="172" font-size="13" fill="#475569">"email": "doniyor@...",</text>
  <text x="446" y="192" font-size="13" fill="#475569">"maqsad": "kafolat"</text>
  <text x="432" y="212" font-size="13" fill="#1e293b">}</text>

  <text x="559" y="258" text-anchor="middle" font-size="14" fill="#16a34a">$obj-&gt;ism · $obj-&gt;email</text>
  <text x="559" y="280" text-anchor="middle" font-size="14" fill="#16a34a">aniq maydon, aniq tip</text>

  <rect x="418" y="300" width="282" height="76" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="559" y="328" text-anchor="middle" font-size="14" font-weight="600" fill="#16a34a">Katakdan o'qiysiz</text>
  <text x="559" y="352" text-anchor="middle" font-size="13" fill="#475569">ishonchli, barqaror</text>

  <!-- o'rtadagi VS -->
  <circle cx="380" cy="229" r="22" fill="#7c3aed"/>
  <text x="380" y="235" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">VS</text>
</svg>
