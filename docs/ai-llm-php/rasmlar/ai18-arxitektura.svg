<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Laravel AI arxitekturasi: Controller, AiService, Anthropic SDK va Queue Job</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Laravel'da AI arxitekturasi</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#64748b">So'rov qatlamlardan o'tadi — har biri o'z vazifasini bajaradi</text>

  <!-- Foydalanuvchi -->
  <rect x="40" y="100" width="150" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="115" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Foydalanuvchi</text>
  <text x="115" y="150" text-anchor="middle" font-size="13" fill="#64748b">brauzer / API</text>

  <!-- Route + Controller -->
  <rect x="250" y="100" width="170" height="64" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="335" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Route + Controller</text>
  <text x="335" y="144" text-anchor="middle" font-size="13" fill="#475569">validatsiya, javob</text>
  <text x="335" y="158" text-anchor="middle" font-size="13" fill="#94a3b8">POST /chat</text>

  <!-- AiService -->
  <rect x="480" y="100" width="170" height="64" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="565" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed">AiService</text>
  <text x="565" y="144" text-anchor="middle" font-size="13" fill="#475569">sora() · stream()</text>
  <text x="565" y="158" text-anchor="middle" font-size="13" fill="#94a3b8">app/Services</text>

  <!-- Anthropic SDK -->
  <rect x="480" y="240" width="170" height="64" rx="10" fill="#ffffff" stroke="#d97757" stroke-width="2.5"/>
  <text x="565" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#d97757">Anthropic SDK</text>
  <text x="565" y="290" text-anchor="middle" font-size="13" fill="#475569">messages-&gt;create()</text>

  <!-- Claude (bulut) -->
  <rect x="480" y="370" width="170" height="60" rx="30" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
  <text x="565" y="398" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed">Claude API</text>
  <text x="565" y="416" text-anchor="middle" font-size="13" fill="#94a3b8">bulutdagi model</text>

  <!-- Queue Job -->
  <rect x="250" y="240" width="170" height="64" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="335" y="264" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">Queue: Job</text>
  <text x="335" y="284" text-anchor="middle" font-size="13" fill="#475569">sekin so'rov fonda</text>
  <text x="335" y="298" text-anchor="middle" font-size="13" fill="#94a3b8">dispatch()</text>

  <!-- DB -->
  <rect x="40" y="240" width="150" height="64" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="115" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">Ma'lumotlar bazasi</text>
  <text x="115" y="290" text-anchor="middle" font-size="13" fill="#64748b">suhbat tarixi</text>

  <!-- Arrows -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <!-- foydalanuvchi -> controller -->
  <line x1="190" y1="132" x2="246" y2="132" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <!-- controller -> aiservice -->
  <line x1="420" y1="132" x2="476" y2="132" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <!-- aiservice -> sdk -->
  <line x1="565" y1="164" x2="565" y2="236" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <!-- sdk -> claude -->
  <line x1="565" y1="304" x2="565" y2="366" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <!-- controller -> job (sekin yo'l) -->
  <line x1="335" y1="164" x2="335" y2="236" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="345" y="206" font-size="13" fill="#b45309">sekin ish</text>
  <!-- job -> aiservice -->
  <line x1="420" y1="262" x2="476" y2="200" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <!-- job -> db -->
  <line x1="250" y1="272" x2="194" y2="272" stroke="#16a34a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="200" y="328" font-size="13" fill="#16a34a">natija saqlanadi</text>

  <text x="380" y="455" text-anchor="middle" font-size="13" fill="#94a3b8">Toza yo'l: Controller AI mantig'ini bilmaydi — faqat AiService'ni chaqiradi</text>
</svg>
