<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="Segoe UI, system-ui, sans-serif">
  <title>Qachon qaysi provayder: Claude, OpenAI, Gemini, lokal Ollama, OpenRouter — har birining kuchli tomoni va mos ishi</title>
  <rect x="0" y="0" width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Qachon qaysi provayder?</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">"eng yaxshi" yo'q — har biri o'z o'rnida kuchli</text>

  <!-- Claude -->
  <rect x="40" y="86" width="345" height="106" rx="12" fill="#ffffff" stroke="#d97757" stroke-width="2"/>
  <text x="58" y="114" font-size="16" font-weight="700" fill="#d97757">Claude (Anthropic)</text>
  <text x="58" y="138" font-size="13" fill="#1e293b">Kuchi: uzun kontekst, kod, aniq/ehtiyotkor javob</text>
  <text x="58" y="160" font-size="13" fill="#475569">Mos: murakkab fikrlash, kod yozish, uzun hujjat</text>
  <text x="58" y="180" font-size="13" fill="#475569">tahlili, ishonchli agent</text>

  <!-- OpenAI -->
  <rect x="40" y="200" width="345" height="106" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="58" y="228" font-size="16" font-weight="700" fill="#15803d">OpenAI (GPT)</text>
  <text x="58" y="252" font-size="13" fill="#1e293b">Kuchi: keng ekotizim, ko'p vosita/integratsiya</text>
  <text x="58" y="274" font-size="13" fill="#475569">Mos: tayyor integratsiyalar, keng jamoa</text>
  <text x="58" y="294" font-size="13" fill="#475569">tajribasi kerak bo'lganda</text>

  <!-- Gemini -->
  <rect x="40" y="314" width="345" height="106" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="58" y="342" font-size="16" font-weight="700" fill="#4338ca">Gemini (Google)</text>
  <text x="58" y="366" font-size="13" fill="#1e293b">Kuchi: multimodal (matn+rasm+video), arzon</text>
  <text x="58" y="388" font-size="13" fill="#475569">Mos: rasm/video tahlili, arzon multimodal</text>
  <text x="58" y="408" font-size="13" fill="#475569">ishlar</text>

  <!-- Lokal / Ollama -->
  <rect x="397" y="143" width="323" height="106" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="415" y="171" font-size="16" font-weight="700" fill="#b45309">Lokal / Ollama</text>
  <text x="415" y="195" font-size="13" fill="#1e293b">Kuchi: maxfiylik, bepul, oflayn, nazorat</text>
  <text x="415" y="217" font-size="13" fill="#475569">Mos: ma'lumot chiqmasligi kerak; ko'p arzon</text>
  <text x="415" y="237" font-size="13" fill="#475569">so'rov; internet yo'q joy</text>

  <!-- OpenRouter -->
  <rect x="397" y="257" width="323" height="106" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="415" y="285" font-size="16" font-weight="700" fill="#6d28d9">OpenRouter</text>
  <text x="415" y="309" font-size="13" fill="#1e293b">Kuchi: bitta kalit — ko'p model, oson almashish</text>
  <text x="415" y="331" font-size="13" fill="#475569">Mos: modellarni sinash/taqqoslash; tez</text>
  <text x="415" y="351" font-size="13" fill="#475569">almashish kerak bo'lganda</text>

  <!-- pastki maslahat -->
  <rect x="397" y="375" width="323" height="45" rx="10" fill="#ede9fe" stroke="#a855f7" stroke-width="1.5"/>
  <text x="558" y="396" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Ko'p loyiha 2-3 provayderni birga ishlatadi</text>
  <text x="558" y="414" text-anchor="middle" font-size="13" fill="#475569">asosiy + arzon/lokal + zaxira (fallback)</text>

  <text x="380" y="446" text-anchor="middle" font-size="13" fill="#94a3b8">interfeys yondashuvi (LlmProvider) almashishni osonlashtiradi</text>
</svg>
