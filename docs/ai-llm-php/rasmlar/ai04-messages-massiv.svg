<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>messages massivi: user va assistant rollari almashinib suhbat oqimini hosil qiladi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">messages massivi — rollar almashinadi</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">user → assistant → user → assistant ... suhbat oqimi</text>

  <!-- user 1 -->
  <rect x="60" y="86" width="320" height="58" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="76" y="110" font-size="13" font-weight="700" fill="#7c3aed">user</text>
  <text x="76" y="132" font-size="13" fill="#475569">Eng yaxshi PHP framework qaysi?</text>

  <!-- assistant 1 -->
  <rect x="380" y="158" width="320" height="58" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
  <text x="396" y="182" font-size="13" font-weight="700" fill="#a855f7">assistant</text>
  <text x="396" y="204" font-size="13" fill="#475569">Ko'pchilik Laravel'ni tanlaydi.</text>

  <!-- user 2 -->
  <rect x="60" y="230" width="320" height="58" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="76" y="254" font-size="13" font-weight="700" fill="#7c3aed">user</text>
  <text x="76" y="276" font-size="13" fill="#475569">Uni qanday o'rnataman?</text>

  <!-- assistant 2 -->
  <rect x="380" y="302" width="320" height="58" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
  <text x="396" y="326" font-size="13" font-weight="700" fill="#a855f7">assistant</text>
  <text x="396" y="348" font-size="13" fill="#475569">composer create-project ... bilan.</text>

  <!-- oqim chiziqlari -->
  <path d="M380 115 L378 158" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a04m)"/>
  <path d="M380 187 L380 230" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a04m)"/>
  <path d="M380 259 L380 302" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a04m)"/>

  <!-- system yon eslatma -->
  <rect x="60" y="382" width="640" height="64" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="80" y="408" font-size="14" font-weight="700" fill="#b45309">system — alohida (massivda emas)</text>
  <text x="80" y="432" font-size="13" fill="#475569">Suhbatning umumiy ko'rsatmasi: top-level "system" parametrida beriladi, rollar oqimidan tashqarida.</text>

  <defs>
    <marker id="a04m" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
