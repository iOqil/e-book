<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Yaxshi promptning besh qismi: rol, kontekst, ko'rsatma, misol va format</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Yaxshi promptning tarkibi</text>
  <text x="380" y="62" text-anchor="middle" font-size="14" fill="#475569">Besh qism birlashganda kuchli prompt hosil bo'ladi</text>

  <!-- 5 qatlam -->
  <rect x="120" y="90" width="520" height="58" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <circle cx="155" cy="119" r="16" fill="#7c3aed"/>
  <text x="155" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>
  <text x="190" y="114" font-size="16" font-weight="700" fill="#1e293b">Rol</text>
  <text x="190" y="136" font-size="13" fill="#475569">"Sen tajribali PHP dasturchisisan..."</text>

  <rect x="120" y="160" width="520" height="58" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="2.5"/>
  <circle cx="155" cy="189" r="16" fill="#6366f1"/>
  <text x="155" y="194" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
  <text x="190" y="184" font-size="16" font-weight="700" fill="#1e293b">Kontekst</text>
  <text x="190" y="206" font-size="13" fill="#475569">Vazifa uchun kerakli ma'lumot va cheklovlar</text>

  <rect x="120" y="230" width="520" height="58" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/>
  <circle cx="155" cy="259" r="16" fill="#4f46e5"/>
  <text x="155" y="264" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>
  <text x="190" y="254" font-size="16" font-weight="700" fill="#1e293b">Ko'rsatma</text>
  <text x="190" y="276" font-size="13" fill="#475569">Aniq vazifa: nima, kim uchun, qancha uzun</text>

  <rect x="120" y="300" width="520" height="58" rx="10" fill="#ffffff" stroke="#a855f7" stroke-width="2.5"/>
  <circle cx="155" cy="329" r="16" fill="#a855f7"/>
  <text x="155" y="334" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4</text>
  <text x="190" y="324" font-size="16" font-weight="700" fill="#1e293b">Misol (few-shot)</text>
  <text x="190" y="346" font-size="13" fill="#475569">1-3 namuna — model naqshni o'rganadi</text>

  <rect x="120" y="370" width="520" height="58" rx="10" fill="#ffffff" stroke="#d97757" stroke-width="2.5"/>
  <circle cx="155" cy="399" r="16" fill="#d97757"/>
  <text x="155" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">5</text>
  <text x="190" y="394" font-size="16" font-weight="700" fill="#1e293b">Format</text>
  <text x="190" y="416" font-size="13" fill="#475569">Ro'yxat, jadval, JSON — javob ko'rinishi</text>

  <text x="380" y="455" text-anchor="middle" font-size="13" fill="#94a3b8">Hammasi shart emas — vazifaga qarab tanlang</text>
</svg>
