<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Segoe UI, system-ui, sans-serif">
  <title>Multimodal model: matn va rasm kirishi -> model -> tushunish (ko'zli yordamchi)</title>
  <rect x="0" y="0" width="760" height="420" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Multimodal model — matn ham, rasm ham</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">Model endi nafaqat o'qiydi, balki "ko'radi"</text>

  <!-- Kirish: matn bloki -->
  <rect x="40" y="100" width="220" height="80" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="150" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">Matn bloki</text>
  <text x="150" y="158" text-anchor="middle" font-size="13" fill="#475569">"Bu rasmda nima bor?"</text>

  <!-- Kirish: rasm bloki -->
  <rect x="40" y="210" width="220" height="100" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="150" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed">Rasm bloki</text>
  <rect x="92" y="252" width="116" height="46" rx="6" fill="#f5f3ff" stroke="#ddd6fe"/>
  <circle cx="118" cy="270" r="7" fill="#f59e0b"/>
  <path d="M104 292 L132 268 L150 286 L168 272 L196 292 Z" fill="#a855f7"/>

  <!-- Model markazda (ko'zli yordamchi) -->
  <rect x="320" y="150" width="180" height="120" rx="14" fill="#faf5ff" stroke="#a855f7" stroke-width="2.5"/>
  <text x="410" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#7c3aed">LLM (model)</text>
  <circle cx="386" cy="218" r="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="386" cy="218" r="5" fill="#1e293b"/>
  <circle cx="434" cy="218" r="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="434" cy="218" r="5" fill="#1e293b"/>
  <text x="410" y="254" text-anchor="middle" font-size="13" fill="#475569">"ko'zli yordamchi"</text>

  <!-- Chiqish -->
  <rect x="560" y="160" width="170" height="100" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="645" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">Tushunish</text>
  <text x="645" y="216" text-anchor="middle" font-size="13" fill="#475569">rasm tavsifi, OCR,</text>
  <text x="645" y="236" text-anchor="middle" font-size="13" fill="#475569">chek/hujjat tahlili</text>

  <!-- Strelkalar -->
  <path d="M260 140 L316 180" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#a07m)"/>
  <path d="M260 260 L316 232" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a07m)"/>
  <path d="M500 210 L556 210" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#a07m)"/>

  <text x="380" y="384" text-anchor="middle" font-size="13" fill="#94a3b8">Foydalanish: rasmni tasvirlash · rasmdan matn (OCR) · diagrammani tushunish · chekni o'qish</text>

  <defs>
    <marker id="a07m" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>
</svg>
