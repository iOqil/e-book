<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Qo'lda loop ko'p qo'l kod, tool runner esa avtomatik boshqaradi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Qo'lda loop vs tool runner</text>

  <!-- LEFT: manual loop -->
  <rect x="30" y="60" width="340" height="380" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="200" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">Qo'lda loop (09-bob)</text>
  <text x="200" y="108" text-anchor="middle" font-size="13" fill="#94a3b8">har qadamni SIZ yozasiz</text>

  <rect x="52" y="124" width="296" height="34" rx="7" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="200" y="146" text-anchor="middle" font-size="13" fill="#475569">1. stopReason tekshirish</text>
  <rect x="52" y="166" width="296" height="34" rx="7" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="200" y="188" text-anchor="middle" font-size="13" fill="#475569">2. tool_use blokini ajratish</text>
  <rect x="52" y="208" width="296" height="34" rx="7" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="200" y="230" text-anchor="middle" font-size="13" fill="#475569">3. funksiyani qo'lda chaqirish</text>
  <rect x="52" y="250" width="296" height="34" rx="7" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="200" y="272" text-anchor="middle" font-size="13" fill="#475569">4. tool_result qaytarish</text>
  <rect x="52" y="292" width="296" height="34" rx="7" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="200" y="314" text-anchor="middle" font-size="13" fill="#475569">5. qayta so'rov yuborish</text>
  <rect x="52" y="334" width="296" height="34" rx="7" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="200" y="356" text-anchor="middle" font-size="13" fill="#475569">6. while loop bilan takrorlash</text>

  <text x="200" y="404" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">= ko'p kod, oson xato</text>
  <text x="200" y="426" text-anchor="middle" font-size="13" fill="#475569">to'liq nazorat kerak bo'lsa</text>

  <!-- RIGHT: tool runner -->
  <rect x="390" y="60" width="340" height="380" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="560" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">Tool runner (10-bob)</text>
  <text x="560" y="108" text-anchor="middle" font-size="13" fill="#94a3b8">loopni SDK avtomatik boshqaradi</text>

  <rect x="412" y="130" width="296" height="56" rx="8" fill="#f5f3ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="560" y="154" text-anchor="middle" font-size="14" font-weight="700" fill="#7c3aed">BetaRunnableTool</text>
  <text x="560" y="174" text-anchor="middle" font-size="13" fill="#475569">ta'rif + funksiya birga</text>

  <line x1="560" y1="186" x2="560" y2="212" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="560,220 555,210 565,210" fill="#94a3b8"/>

  <rect x="412" y="222" width="296" height="56" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="560" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#4f46e5">toolRunner(...)</text>
  <text x="560" y="266" text-anchor="middle" font-size="13" fill="#475569">runner obyektini yaratadi</text>

  <line x1="560" y1="278" x2="560" y2="304" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="560,312 555,302 565,302" fill="#94a3b8"/>

  <rect x="412" y="314" width="296" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="560" y="338" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">runUntilDone()</text>
  <text x="560" y="358" text-anchor="middle" font-size="13" fill="#475569">1-6 qadam avtomatik</text>

  <text x="560" y="404" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">= oz kod, tez, ishonchli</text>
  <text x="560" y="426" text-anchor="middle" font-size="13" fill="#475569">ko'p hollarda default tanlov</text>
</svg>
