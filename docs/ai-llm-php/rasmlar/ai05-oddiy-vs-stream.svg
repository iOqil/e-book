<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Segoe UI, system-ui, sans-serif">
  <title>Oddiy so'rov (to'liq javobni kutish) va streaming (token-token darhol) taqqoslanishi</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Oddiy so'rov vs Streaming</text>

  <!-- LEFT: oddiy -->
  <rect x="30" y="64" width="340" height="330" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="200" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#dc2626">Oddiy (create)</text>

  <rect x="58" y="112" width="284" height="44" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="200" y="139" text-anchor="middle" font-size="14" fill="#475569">Foydalanuvchi savol beradi</text>

  <!-- bo'sh ekran kutish -->
  <rect x="58" y="172" width="284" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="200" y="216" text-anchor="middle" font-size="15" font-weight="600" fill="#dc2626">⏳ Bo'sh ekran</text>
  <text x="200" y="240" text-anchor="middle" font-size="14" fill="#475569">model to'liq javobni</text>
  <text x="200" y="260" text-anchor="middle" font-size="14" fill="#475569">yozguncha kutish</text>
  <text x="200" y="282" text-anchor="middle" font-size="13" fill="#94a3b8">(10+ soniya)</text>

  <rect x="58" y="308" width="284" height="68" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="200" y="334" text-anchor="middle" font-size="14" fill="#475569">Birdan TO'LIQ javob</text>
  <text x="200" y="358" text-anchor="middle" font-size="13" fill="#94a3b8">"Buzilibmi?" his qilinadi</text>

  <!-- RIGHT: streaming -->
  <rect x="390" y="64" width="340" height="330" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="560" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#16a34a">Streaming (createStream)</text>

  <rect x="418" y="112" width="284" height="44" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="560" y="139" text-anchor="middle" font-size="14" fill="#475569">Foydalanuvchi savol beradi</text>

  <!-- token token chiqadi -->
  <rect x="418" y="172" width="284" height="120" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="560" y="198" text-anchor="middle" font-size="15" font-weight="600" fill="#16a34a">⚡ Token-token darhol</text>
  <rect x="436" y="212" width="78" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="475" y="230" text-anchor="middle" font-size="13" fill="#1e293b">Bir</text>
  <rect x="520" y="212" width="78" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="559" y="230" text-anchor="middle" font-size="13" fill="#1e293b">bor</text>
  <rect x="604" y="212" width="82" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="645" y="230" text-anchor="middle" font-size="13" fill="#1e293b">ekan</text>
  <text x="560" y="266" text-anchor="middle" font-size="14" fill="#475569">har bo'lak kelishi bilan</text>
  <text x="560" y="285" text-anchor="middle" font-size="13" fill="#94a3b8">echo + flush()</text>

  <rect x="418" y="308" width="284" height="68" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="560" y="334" text-anchor="middle" font-size="14" fill="#475569">Javob jonli chiqib keladi</text>
  <text x="560" y="358" text-anchor="middle" font-size="13" fill="#16a34a">Kutish "tirik" his qilinadi</text>

  <text x="380" y="418" text-anchor="middle" font-size="13" fill="#94a3b8">Umumiy vaqt deyarli bir xil — lekin his qilinadigan tezlik tubdan farq qiladi</text>
</svg>
