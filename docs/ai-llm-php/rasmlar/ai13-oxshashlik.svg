<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Segoe UI, system-ui, sans-serif">
  <title>Ma'no fazosida yaqin ma'noli matnlar yaqin, boshqa ma'noli matnlar uzoq; kosinus o'xshashligi</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">O'xshashlik = vektorlar yaqinligi</text>
  <text x="380" y="58" text-anchor="middle" font-size="14" fill="#475569">Yaqin ma'no — yaqin nuqta. Boshqa ma'no — uzoq nuqta.</text>

  <!-- space box -->
  <rect x="40" y="80" width="430" height="320" rx="12" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
  <!-- origin -->
  <circle cx="90" cy="360" r="5" fill="#94a3b8"/>
  <text x="90" y="382" text-anchor="middle" font-size="13" fill="#94a3b8">0 (markaz)</text>

  <!-- vector to mashina -->
  <line x1="90" y1="360" x2="250" y2="160" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#a13b)"/>
  <circle cx="250" cy="160" r="8" fill="#7c3aed"/>
  <text x="262" y="150" font-size="14" font-weight="700" fill="#1e293b">mashina</text>

  <!-- vector to avtomobil (yaqin) -->
  <line x1="90" y1="360" x2="290" y2="180" stroke="#a855f7" stroke-width="2.5" marker-end="url(#a13b)"/>
  <circle cx="290" cy="180" r="8" fill="#a855f7"/>
  <text x="302" y="200" font-size="14" font-weight="700" fill="#1e293b">avtomobil</text>

  <!-- small angle arc between them -->
  <path d="M 158 280 A 150 150 0 0 1 175 268" fill="none" stroke="#16a34a" stroke-width="2"/>
  <text x="150" y="245" font-size="13" fill="#16a34a">kichik burchak</text>

  <!-- vector to olma (uzoq) -->
  <line x1="90" y1="360" x2="410" y2="320" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a13b)"/>
  <circle cx="410" cy="320" r="8" fill="#16a34a"/>
  <text x="356" y="312" font-size="14" font-weight="700" fill="#1e293b">olma</text>

  <!-- right panel: cosine -->
  <rect x="496" y="90" width="232" height="300" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="612" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">Kosinus o'xshashligi</text>
  <text x="612" y="146" text-anchor="middle" font-size="13" fill="#475569">vektorlar orasidagi</text>
  <text x="612" y="164" text-anchor="middle" font-size="13" fill="#475569">burchakdan kelib chiqadi</text>

  <line x1="516" y1="184" x2="708" y2="184" stroke="#ddd6fe" stroke-width="1.5"/>

  <rect x="516" y="200" width="192" height="44" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="612" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">1.0 ga yaqin</text>
  <text x="612" y="238" text-anchor="middle" font-size="13" fill="#475569">juda o'xshash</text>

  <rect x="516" y="256" width="192" height="44" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="612" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">0.0 atrofida</text>
  <text x="612" y="294" text-anchor="middle" font-size="13" fill="#475569">aloqasiz</text>

  <rect x="516" y="312" width="192" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="612" y="332" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">-1.0 ga yaqin</text>
  <text x="612" y="350" text-anchor="middle" font-size="13" fill="#475569">qarama-qarshi</text>

  <defs>
    <marker id="a13b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
