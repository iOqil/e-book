<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Kirish va chiqish tokenlari narxi hamda Opus/Sonnet/Haiku taqqoslashi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Token narxi: kirish vs chiqish</text>

  <!-- Kirish/chiqish oqimi -->
  <rect x="40" y="66" width="200" height="66" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="140" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Kirish token</text>
  <text x="140" y="114" text-anchor="middle" font-size="13" fill="#475569">siz yuborgan matn</text>

  <rect x="280" y="66" width="200" height="66" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="380" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Model</text>
  <text x="380" y="114" text-anchor="middle" font-size="13" fill="#475569">o'qiydi + yozadi</text>

  <rect x="520" y="66" width="200" height="66" rx="10" fill="#ffffff" stroke="#d97757" stroke-width="2"/>
  <text x="620" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Chiqish token</text>
  <text x="620" y="114" text-anchor="middle" font-size="13" fill="#dc2626">~5x qimmatroq!</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <line x1="240" y1="99" x2="278" y2="99" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="480" y1="99" x2="518" y2="99" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Narx taqqoslash diagrammasi -->
  <text x="380" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Narx ($ / 1M token)</text>

  <!-- ustun fonlari -->
  <line x1="120" y1="420" x2="700" y2="420" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Opus -->
  <rect x="150" y="370" width="50" height="50" rx="4" fill="#7c3aed"/>
  <text x="175" y="362" text-anchor="middle" font-size="13" fill="#475569">$5</text>
  <rect x="206" y="190" width="50" height="230" rx="4" fill="#a855f7"/>
  <text x="231" y="182" text-anchor="middle" font-size="13" fill="#475569">$25</text>
  <text x="203" y="442" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Opus 4.8</text>

  <!-- Sonnet -->
  <rect x="340" y="392" width="50" height="28" rx="4" fill="#4f46e5"/>
  <text x="365" y="384" text-anchor="middle" font-size="13" fill="#475569">$3</text>
  <rect x="396" y="282" width="50" height="138" rx="4" fill="#6366f1"/>
  <text x="421" y="274" text-anchor="middle" font-size="13" fill="#475569">$15</text>
  <text x="393" y="442" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Sonnet 4.6</text>

  <!-- Haiku -->
  <rect x="530" y="411" width="50" height="9" rx="3" fill="#16a34a"/>
  <text x="555" y="403" text-anchor="middle" font-size="13" fill="#475569">$1</text>
  <rect x="586" y="374" width="50" height="46" rx="4" fill="#22c55e"/>
  <text x="611" y="366" text-anchor="middle" font-size="13" fill="#475569">$5</text>
  <text x="583" y="442" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Haiku 4.5</text>

  <!-- izoh (legend) -->
  <rect x="640" y="186" width="16" height="16" rx="3" fill="#a855f7"/>
  <text x="662" y="199" font-size="13" fill="#475569">chiqish</text>
  <rect x="640" y="208" width="16" height="16" rx="3" fill="#7c3aed"/>
  <text x="662" y="221" font-size="13" fill="#475569">kirish</text>
</svg>
