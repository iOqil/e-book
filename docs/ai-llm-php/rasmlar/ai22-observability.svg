<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Observability: har so'rovni log qilish, DB ga narx saqlash, dashboard va alert</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Kuzatuv: har so'rov iz qoldiradi</text>

  <defs>
    <marker id="ar22a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Chap: so'rov yig'iladigan maydonlar -->
  <rect x="36" y="78" width="210" height="240" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="141" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Har so'rovdan</text>
  <text x="141" y="128" text-anchor="middle" font-size="14" fill="#475569">yig'iladigan maydonlar</text>

  <text x="60" y="160" font-size="14" fill="#1e293b">• request_id</text>
  <text x="60" y="186" font-size="14" fill="#1e293b">• prompt (maskalangan)</text>
  <text x="60" y="212" font-size="14" fill="#1e293b">• model</text>
  <text x="60" y="238" font-size="14" fill="#1e293b">• token (usage)</text>
  <text x="60" y="264" font-size="14" fill="#1e293b">• narx ($)</text>
  <text x="60" y="290" font-size="14" fill="#1e293b">• vaqt (ms) + xato</text>

  <!-- O'rta: ikkita yo'nalish -->
  <rect x="300" y="92" width="170" height="76" rx="10" fill="#ede9fe" stroke="#6366f1" stroke-width="2"/>
  <text x="385" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Strukturali log</text>
  <text x="385" y="146" text-anchor="middle" font-size="13" fill="#475569">JSON (Monolog)</text>

  <rect x="300" y="228" width="170" height="76" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="385" y="260" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">DB (narx)</text>
  <text x="385" y="282" text-anchor="middle" font-size="13" fill="#475569">jadval: ai_sorovlar</text>

  <!-- chapdan o'rtaga strelkalar -->
  <line x1="246" y1="160" x2="298" y2="130" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar22a)"/>
  <line x1="246" y1="238" x2="298" y2="266" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar22a)"/>

  <!-- O'ng: dashboard + alert -->
  <rect x="524" y="92" width="200" height="76" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="624" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Dashboard</text>
  <text x="624" y="146" text-anchor="middle" font-size="13" fill="#475569">narx / kechikish / xato</text>

  <rect x="524" y="228" width="200" height="76" rx="10" fill="#fff7ed" stroke="#d97757" stroke-width="2"/>
  <text x="624" y="260" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Alert</text>
  <text x="624" y="282" text-anchor="middle" font-size="13" fill="#dc2626">xato/narx oshsa ogohlantir</text>

  <line x1="470" y1="130" x2="522" y2="130" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar22a)"/>
  <line x1="470" y1="266" x2="522" y2="266" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar22a)"/>
  <line x1="624" y1="168" x2="624" y2="226" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar22a)"/>

  <!-- pastki izoh -->
  <rect x="36" y="356" width="688" height="84" rx="10" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
  <text x="380" y="386" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Nega kerak?</text>
  <text x="380" y="412" text-anchor="middle" font-size="14" fill="#475569">Debug (nima bo'ldi?) · Narx (kim qancha sarfladi?) · Sifat (qaysi prompt yomon?)</text>
  <text x="380" y="432" text-anchor="middle" font-size="13" fill="#94a3b8">Ko'rinmagan narsani tuzatib bo'lmaydi — avval o'lcha, keyin yaxshila.</text>
</svg>
