<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Manual loop: so'rov, tool_use, bajar, tool_result, yakuniy javob sikli</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Manual loop — qadam-baqadam sikl</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">stopReason 'tool_use' bo'lguncha takrorlanadi; 'end_turn' bo'lsa — tugadi</text>

  <!-- 1 So'rov -->
  <rect x="60" y="95" width="220" height="64" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="170" y="123" text-anchor="middle" font-size="15" font-weight="700" fill="#4f46e5">1. So'rov yuborish</text>
  <text x="170" y="145" text-anchor="middle" font-size="13" fill="#475569">messages + tools</text>

  <!-- 2 tool_use? -->
  <polygon points="480,95 600,127 480,159 360,127" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="480" y="123" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed">stopReason</text>
  <text x="480" y="143" text-anchor="middle" font-size="13" fill="#475569">'tool_use'?</text>

  <!-- 1 -> 2 -->
  <line x1="280" y1="127" x2="356" y2="127" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- 2 ha -> 3 (pastga) -->
  <line x1="480" y1="159" x2="480" y2="210" stroke="#7c3aed" stroke-width="2" marker-end="url(#ap)"/>
  <text x="498" y="188" font-size="13" fill="#7c3aed" font-weight="600">HA</text>

  <!-- 3 Tool_use blok o'qish -->
  <rect x="370" y="212" width="220" height="64" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="480" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed">3. Blokni o'qish</text>
  <text x="480" y="262" text-anchor="middle" font-size="13" fill="#475569">name, input, id</text>

  <!-- 4 Bajar -->
  <rect x="370" y="312" width="220" height="64" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="340" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">4. Funksiyani bajar</text>
  <text x="480" y="362" text-anchor="middle" font-size="13" fill="#475569">natija = ob_havo(...)</text>
  <line x1="480" y1="276" x2="480" y2="308" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- 5 tool_result qaytar -->
  <rect x="60" y="312" width="220" height="64" rx="10" fill="#ffffff" stroke="#d97757" stroke-width="2"/>
  <text x="170" y="340" text-anchor="middle" font-size="15" font-weight="700" fill="#d97757">5. tool_result</text>
  <text x="170" y="362" text-anchor="middle" font-size="13" fill="#475569">user rolida qaytar</text>
  <line x1="370" y1="344" x2="284" y2="344" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- 5 -> 1 (sikl, chapdan tepaga) -->
  <path d="M 60 344 L 30 344 L 30 127 L 56 127" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ap)"/>
  <text x="36" y="240" font-size="13" fill="#7c3aed" font-weight="600" transform="rotate(-90 36 240)">qayta so'rov (sikl)</text>

  <!-- 2 yoq -> 6 -->
  <line x1="600" y1="127" x2="660" y2="127" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <text x="612" y="116" font-size="13" fill="#16a34a" font-weight="600">YO'Q</text>
  <rect x="600" y="212" width="130" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="665" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">6. Yakuniy</text>
  <text x="665" y="262" text-anchor="middle" font-size="13" fill="#16a34a">matn javob</text>
  <path d="M 665 127 L 665 208" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>

  <text x="380" y="430" text-anchor="middle" font-size="13" fill="#94a3b8">Eslatma: model bir nechta tool so'rashi mumkin — hammasini bajarib, hammasi uchun tool_result qaytaring.</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
</svg>
