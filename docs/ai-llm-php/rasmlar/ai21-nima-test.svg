<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, system-ui, sans-serif">
  <title>Kod testi (mock, deterministik) va sifat baholash (eval, nodeterministik)</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">AI ilovasida ikki xil test</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">Nimani test qilyapmiz — KODNI yoki AI SIFATINI?</text>

  <!-- Chap: kod testi -->
  <rect x="36" y="86" width="330" height="318" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="36" y="86" width="330" height="44" rx="14" fill="#eef2ff"/>
  <rect x="36" y="112" width="330" height="18" fill="#eef2ff"/>
  <text x="201" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#4f46e5">1. Kod testi (unit)</text>

  <text x="60" y="160" font-size="14" fill="#1e293b" font-weight="600">Nimani:</text>
  <text x="60" y="182" font-size="13" fill="#475569">so'rov qurish · javob parse</text>
  <text x="60" y="202" font-size="13" fill="#475569">tool · RAG quvuri · narx</text>

  <rect x="60" y="220" width="282" height="40" rx="8" fill="#f1f5f9" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="201" y="245" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">DETERMINISTIK</text>

  <text x="60" y="288" font-size="14" fill="#1e293b" font-weight="600">Usuli: MOCK (soxta javob)</text>
  <text x="60" y="310" font-size="13" fill="#475569">AI'ga BORMAYDI — soxta</text>
  <text x="60" y="328" font-size="13" fill="#475569">javob beriladi</text>

  <rect x="60" y="344" width="282" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="201" y="364" text-anchor="middle" font-size="13" fill="#16a34a" font-weight="600">tez · bepul · barqaror</text>
  <text x="201" y="382" text-anchor="middle" font-size="13" fill="#475569">assertSame(...) ishlaydi</text>

  <!-- O'ng: sifat baholash -->
  <rect x="394" y="86" width="330" height="318" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="394" y="86" width="330" height="44" rx="14" fill="#f5f3ff"/>
  <rect x="394" y="112" width="330" height="18" fill="#f5f3ff"/>
  <text x="559" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#7c3aed">2. Sifat baholash (eval)</text>

  <text x="418" y="160" font-size="14" fill="#1e293b" font-weight="600">Nimani:</text>
  <text x="418" y="182" font-size="13" fill="#475569">prompt/model yaxshimi</text>
  <text x="418" y="202" font-size="13" fill="#475569">javob to'g'ri · foydalimi</text>

  <rect x="418" y="220" width="282" height="40" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="559" y="245" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">NODETERMINISTIK</text>

  <text x="418" y="288" font-size="14" fill="#1e293b" font-weight="600">Usuli: EVAL to'plam</text>
  <text x="418" y="310" font-size="13" fill="#475569">haqiqiy AI · kirish +</text>
  <text x="418" y="328" font-size="13" fill="#475569">mezon -> ball</text>

  <rect x="418" y="344" width="282" height="46" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="559" y="364" text-anchor="middle" font-size="13" fill="#7c3aed" font-weight="600">sekin · pulli · sonli ball</text>
  <text x="559" y="382" text-anchor="middle" font-size="13" fill="#dc2626">assertEquals YIQILADI</text>

  <text x="380" y="426" text-anchor="middle" font-size="13" fill="#94a3b8">Ikkalasini ARALASHTIRMA — har biri o'z usuli bilan</text>
</svg>
