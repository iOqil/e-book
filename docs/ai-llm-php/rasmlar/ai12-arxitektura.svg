<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Segoe UI, system-ui, sans-serif">
  <title>MCP arxitekturasi: LLM, MCP mijoz va MCP server (tools, resources, prompts)</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">MCP arxitekturasi</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#94a3b8">LLM foydalanadi · mijoz ulanadi · server beradi</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- LLM -->
  <rect x="40" y="150" width="160" height="110" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="120" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#7c3aed">LLM</text>
  <text x="120" y="214" text-anchor="middle" font-size="13" fill="#475569">(Claude)</text>
  <text x="120" y="236" text-anchor="middle" font-size="13" fill="#94a3b8">tool'dan</text>
  <text x="120" y="252" text-anchor="middle" font-size="13" fill="#94a3b8">foydalanadi</text>

  <!-- MCP mijoz -->
  <rect x="280" y="150" width="170" height="110" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="365" y="186" text-anchor="middle" font-size="16" font-weight="700" fill="#4f46e5">MCP mijoz</text>
  <text x="365" y="208" text-anchor="middle" font-size="13" fill="#475569">(AI ilova / sizning</text>
  <text x="365" y="224" text-anchor="middle" font-size="13" fill="#475569">PHP kodingiz)</text>
  <text x="365" y="248" text-anchor="middle" font-size="13" fill="#94a3b8">serverga ulanadi</text>

  <!-- MCP server -->
  <rect x="530" y="120" width="200" height="180" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="630" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">MCP server</text>
  <text x="630" y="170" text-anchor="middle" font-size="13" fill="#94a3b8">taqdim etadi:</text>

  <rect x="548" y="182" width="164" height="32" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="630" y="203" text-anchor="middle" font-size="13" fill="#1e293b">Tools — harakat</text>
  <rect x="548" y="222" width="164" height="32" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="630" y="243" text-anchor="middle" font-size="13" fill="#1e293b">Resources — ma'lumot</text>
  <rect x="548" y="262" width="164" height="32" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="630" y="283" text-anchor="middle" font-size="13" fill="#1e293b">Prompts — shablon</text>

  <!-- strelkalar -->
  <line x1="200" y1="190" x2="276" y2="190" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>
  <text x="238" y="180" text-anchor="middle" font-size="13" fill="#475569">so'rov</text>
  <line x1="280" y1="222" x2="204" y2="222" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>
  <text x="238" y="242" text-anchor="middle" font-size="13" fill="#475569">javob</text>

  <line x1="450" y1="190" x2="526" y2="190" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>
  <text x="488" y="180" text-anchor="middle" font-size="13" fill="#475569">chaqir</text>
  <line x1="530" y1="222" x2="454" y2="222" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>
  <text x="492" y="242" text-anchor="middle" font-size="13" fill="#475569">natija</text>

  <!-- pastki izoh -->
  <rect x="40" y="330" width="690" height="74" rx="10" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="60" y="358" font-size="14" font-weight="600" fill="#1e293b">Bu — 10-bobdagi tool runner'ning kengaytmasi:</text>
  <text x="60" y="380" font-size="13" fill="#475569">tool'ni endi closure emas, MCP server bajaradi. LLM uchun farq yo'q — baribir "tool chaqiraman" deydi.</text>
  <text x="60" y="398" font-size="13" fill="#94a3b8">Bitta server ko'plab mijozga (turli til/provayder) xizmat qiladi.</text>
</svg>
