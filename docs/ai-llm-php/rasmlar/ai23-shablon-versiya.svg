<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>Kod ichida sochilgan promptlar va markazlashtirilgan shablon + versiya solishtiruvi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Sochilgan promptlar va tartibli kutubxona</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">Promptni kod ichidan ajratib, nom + versiya bilan bir joyda boshqaramiz</text>

  <defs>
    <marker id="arr23a" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- CHAP: sochilgan -->
  <rect x="36" y="92" width="320" height="350" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="196" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">Yomon: kod ichida sochilgan</text>

  <rect x="60" y="138" width="120" height="58" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="120" y="162" text-anchor="middle" font-size="13" fill="#475569">savol.php</text>
  <text x="120" y="182" text-anchor="middle" font-size="13" fill="#dc2626">"Sen yordamchi..."</text>

  <rect x="212" y="138" width="120" height="58" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="272" y="162" text-anchor="middle" font-size="13" fill="#475569">xulosa.php</text>
  <text x="272" y="182" text-anchor="middle" font-size="13" fill="#dc2626">"Sen yordamchi..."</text>

  <rect x="60" y="210" width="120" height="58" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="120" y="234" text-anchor="middle" font-size="13" fill="#475569">tarjima.php</text>
  <text x="120" y="254" text-anchor="middle" font-size="13" fill="#dc2626">"Sen yordamc.."</text>

  <rect x="212" y="210" width="120" height="58" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="272" y="234" text-anchor="middle" font-size="13" fill="#475569">bot.php</text>
  <text x="272" y="254" text-anchor="middle" font-size="13" fill="#dc2626">"Sen yordamchsan"</text>

  <text x="196" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">Muammolar:</text>
  <text x="60" y="324" font-size="13" fill="#475569">- Takrorlanadi, har xil yozilgan</text>
  <text x="60" y="346" font-size="13" fill="#475569">- O'zgartirsang — hamma joyni izlash</text>
  <text x="60" y="368" font-size="13" fill="#475569">- Versiya yo'q, rollback yo'q</text>
  <text x="60" y="390" font-size="13" fill="#475569">- Test/A-B qilish qiyin</text>
  <text x="60" y="412" font-size="13" fill="#475569">- Dasturchi bo'lmasa tahrir qilolmaydi</text>

  <!-- O'ng: markazlashgan -->
  <rect x="404" y="92" width="320" height="350" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="564" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">Yaxshi: bitta kutubxona</text>

  <rect x="430" y="140" width="268" height="150" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="564" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#4f46e5">PromptManager</text>
  <line x1="446" y1="178" x2="682" y2="178" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="446" y="200" font-size="13" fill="#475569">yordamchi  · v3  · {ism}</text>
  <text x="446" y="222" font-size="13" fill="#475569">xulosa     · v2  · {matn}</text>
  <text x="446" y="244" font-size="13" fill="#475569">tarjima    · v1  · {til}</text>
  <text x="446" y="266" font-size="13" fill="#475569">router     · v4  · {savol}</text>

  <line x1="320" y1="215" x2="426" y2="215" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arr23a)" stroke-dasharray="5 4"/>
  <text x="373" y="206" text-anchor="middle" font-size="13" fill="#7c3aed">bir joyga</text>

  <text x="564" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">Foyda:</text>
  <text x="430" y="342" font-size="13" fill="#475569">- Bitta manba — nom bo'yicha chaqir</text>
  <text x="430" y="364" font-size="13" fill="#475569">- Versiya + rollback (eskisiga qaytish)</text>
  <text x="430" y="386" font-size="13" fill="#475569">- A/B test, o'lchash (21-bob)</text>
  <text x="430" y="408" font-size="13" fill="#475569">- Shablon: {o'zgaruvchi} bilan to'ldir</text>
</svg>
