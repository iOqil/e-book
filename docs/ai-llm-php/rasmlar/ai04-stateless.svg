<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, system-ui, sans-serif">
  <title>API stateless: har so'rovda butun suhbat tarixi yuboriladi, model eslamaydi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">API stateless — model suhbatni eslamaydi</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#475569">Har so'rovda butun yozishmani qaytadan yuborasiz</text>

  <!-- 1-so'rov -->
  <rect x="40" y="92" width="300" height="150" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="60" y="118" font-size="15" font-weight="700" fill="#7c3aed">1-so'rov</text>
  <text x="60" y="142" font-size="13" fill="#475569">[user] Salom, mening ismim Ali</text>
  <text x="60" y="170" font-size="13" fill="#94a3b8">— (boshqa hech narsa) —</text>
  <rect x="60" y="186" width="260" height="40" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="72" y="211" font-size="13" fill="#1e293b">javob: Salom Ali!</text>

  <!-- model markazda -->
  <rect x="420" y="92" width="300" height="150" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
  <text x="570" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#7c3aed">LLM (server)</text>
  <text x="570" y="156" text-anchor="middle" font-size="13" fill="#475569">Hech narsa saqlamaydi</text>
  <text x="570" y="180" text-anchor="middle" font-size="13" fill="#475569">Faqat siz yuborgan</text>
  <text x="570" y="200" text-anchor="middle" font-size="13" fill="#475569">matnga qarab javob beradi</text>
  <text x="570" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">xotira = 0</text>

  <path d="M340 167 L416 167" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#a04ar)"/>

  <!-- 2-so'rov -->
  <rect x="40" y="270" width="430" height="172" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="60" y="296" font-size="15" font-weight="700" fill="#4f46e5">2-so'rov — ismimni eslashi uchun butun tarix kerak</text>
  <text x="60" y="322" font-size="13" fill="#475569">[user] Salom, mening ismim Ali</text>
  <text x="60" y="344" font-size="13" fill="#475569">[assistant] Salom Ali!</text>
  <text x="60" y="366" font-size="13" font-weight="700" fill="#16a34a">[user] Mening ismim nima edi?</text>
  <rect x="60" y="382" width="390" height="44" rx="8" fill="#ecfdf5" stroke="#bbf7d0"/>
  <text x="72" y="409" font-size="13" fill="#1e293b">javob: Sizning ismingiz Ali. (chunki tarix yuborildi)</text>

  <path d="M470 356 C540 356 600 300 600 246" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#a04ar)" stroke-dasharray="5 4"/>

  <text x="540" y="320" font-size="13" fill="#475569">butun</text>
  <text x="540" y="338" font-size="13" fill="#475569">tarix →</text>

  <defs>
    <marker id="a04ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#4f46e5"/>
    </marker>
  </defs>
</svg>
