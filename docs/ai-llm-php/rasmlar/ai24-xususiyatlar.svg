<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" width="780" height="460" font-family="Segoe UI, system-ui, sans-serif">
  <title>Ilova xususiyatlari xaritasi — qaysi xususiyat qaysi bobdan</title>
  <rect x="0" y="0" width="780" height="460" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">Xususiyatlar xaritasi (qaysi bobdan)</text>

  <!-- markaz -->
  <rect x="300" y="200" width="180" height="64" rx="12" fill="#7c3aed" stroke="#6d28d9" stroke-width="2"/>
  <text x="390" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Bilim bazasi</text>
  <text x="390" y="248" text-anchor="middle" font-size="14" fill="#ede9fe">yordamchisi</text>

  <!-- xususiyat qutilari -->
  <!-- RAG -->
  <rect x="40" y="70" width="200" height="58" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="58" y="94" font-size="14" font-weight="600" fill="#1e293b">RAG savol-javob</text>
  <text x="58" y="115" font-size="13" fill="#475569">13-15-bob</text>

  <!-- Tool -->
  <rect x="40" y="148" width="200" height="58" rx="9" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="58" y="172" font-size="14" font-weight="600" fill="#1e293b">Tool (sana/hisob/baza)</text>
  <text x="58" y="193" font-size="13" fill="#475569">9-10-bob</text>

  <!-- Struktura -->
  <rect x="40" y="258" width="200" height="58" rx="9" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="58" y="282" font-size="14" font-weight="600" fill="#1e293b">Strukturali chiqish</text>
  <text x="58" y="303" font-size="13" fill="#475569">6-bob (JSON + ishonch)</text>

  <!-- Streaming -->
  <rect x="40" y="336" width="200" height="58" rx="9" fill="#ffffff" stroke="#a855f7" stroke-width="2"/>
  <text x="58" y="360" font-size="14" font-weight="600" fill="#1e293b">Streaming UI</text>
  <text x="58" y="381" font-size="13" fill="#475569">5-bob (SSE / CLI)</text>

  <!-- Suhbat -->
  <rect x="540" y="70" width="200" height="58" rx="9" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="558" y="94" font-size="14" font-weight="600" fill="#1e293b">Suhbat + kontekst</text>
  <text x="558" y="115" font-size="13" fill="#475569">4-bob (tarix)</text>

  <!-- Xavfsizlik -->
  <rect x="540" y="148" width="200" height="58" rx="9" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="558" y="172" font-size="14" font-weight="600" fill="#1e293b">Xavfsizlik</text>
  <text x="558" y="193" font-size="13" fill="#475569">20-bob (injection/kalit)</text>

  <!-- Ishonchlilik -->
  <rect x="540" y="258" width="200" height="58" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="558" y="282" font-size="14" font-weight="600" fill="#1e293b">Ishonchlilik</text>
  <text x="558" y="303" font-size="13" fill="#475569">8-bob (retry/fallback)</text>

  <!-- Xarajat -->
  <rect x="540" y="336" width="200" height="58" rx="9" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="558" y="360" font-size="14" font-weight="600" fill="#1e293b">Xarajat + kesh</text>
  <text x="558" y="381" font-size="13" fill="#475569">16-bob (model/kesh)</text>

  <!-- chiziqlar -->
  <g stroke="#cbd5e1" stroke-width="1.5">
    <line x1="240" y1="99" x2="300" y2="210"/>
    <line x1="240" y1="177" x2="300" y2="220"/>
    <line x1="240" y1="287" x2="300" y2="244"/>
    <line x1="240" y1="365" x2="300" y2="254"/>
    <line x1="540" y1="99" x2="480" y2="210"/>
    <line x1="540" y1="177" x2="480" y2="220"/>
    <line x1="540" y1="287" x2="480" y2="244"/>
    <line x1="540" y1="365" x2="480" y2="254"/>
  </g>

  <text x="390" y="438" text-anchor="middle" font-size="14" fill="#475569">Bitta ilova — butun kitob bilimini birlashtiradi (+22-bob kuzatuv, 23-bob promptlar)</text>
</svg>
