<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>Fast-forward merge va 3-way merge farqi: fast-forwardda main ko'rsatkichi shunchaki oldinga suriladi, 3-way mergeda esa yangi merge commit yaratiladi</title>

  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Ikki xil merge: ko'rsatkich suriladimi yoki yangi commit?</text>

  <!-- ============ CHAP PANEL: FAST-FORWARD ============ -->
  <text x="190" y="70" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#16a34a">Fast-forward merge</text>
  <text x="190" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">main qo'shimcha ish qilmagan</text>

  <!-- commitlar bir chiziqda -->
  <line x1="55" y1="150" x2="325" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="70" cy="150" r="14" fill="#2563eb"/>
  <text x="70" y="155" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff">A</text>
  <circle cx="160" cy="150" r="14" fill="#2563eb"/>
  <text x="160" y="155" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff">B</text>
  <circle cx="250" cy="150" r="14" fill="#16a34a"/>
  <text x="250" y="155" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff">C</text>
  <circle cx="310" cy="150" r="14" fill="#16a34a"/>
  <text x="310" y="155" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff">D</text>

  <!-- ko'rsatkichlar oldin -->
  <text x="115" y="205" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">main (oldin)</text>
  <line x1="160" y1="168" x2="140" y2="192" stroke="#2563eb" stroke-width="1.5"/>

  <text x="310" y="118" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">feature</text>
  <line x1="310" y1="132" x2="310" y2="124" stroke="#16a34a" stroke-width="1.5"/>

  <!-- main keyin: suriladi -->
  <text x="310" y="245" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">main (keyin)</text>
  <line x1="310" y1="168" x2="310" y2="232" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="190" y="285" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">main shunchaki D ga "siljiydi" —</text>
  <text x="190" y="305" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">yangi commit yaratilmaydi</text>

  <!-- ajratuvchi chiziq -->
  <line x1="360" y1="60" x2="360" y2="430" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ============ O'NG PANEL: 3-WAY ============ -->
  <text x="540" y="70" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#7c3aed">3-way merge</text>
  <text x="540" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ikkala branch ham oldinga ketgan</text>

  <!-- umumiy ajdod A, B -->
  <line x1="405" y1="200" x2="490" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="420" cy="200" r="14" fill="#2563eb"/>
  <text x="420" y="205" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff">A</text>
  <circle cx="490" cy="200" r="14" fill="#2563eb"/>
  <text x="490" y="205" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff">B</text>

  <!-- main shoxi (yuqoriga) -->
  <line x1="500" y1="190" x2="560" y2="155" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="575" cy="150" r="14" fill="#2563eb"/>
  <text x="575" y="155" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff">M</text>
  <text x="575" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">main</text>

  <!-- feature shoxi (pastga) -->
  <line x1="500" y1="210" x2="560" y2="245" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="575" cy="250" r="14" fill="#16a34a"/>
  <text x="575" y="255" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff">F</text>
  <text x="575" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">feature</text>

  <!-- merge commit -->
  <line x1="589" y1="155" x2="650" y2="195" stroke="#7c3aed" stroke-width="2"/>
  <line x1="589" y1="245" x2="650" y2="205" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="665" cy="200" r="16" fill="#7c3aed"/>
  <text x="665" y="205" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff">X</text>
  <text x="540" y="330" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#7c3aed">X — yangi merge commit:</text>
  <text x="540" y="350" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#7c3aed">ikkita "ota"si bor (M va F)</text>

  <!-- pastki xulosa -->
  <rect x="40" y="395" width="640" height="55" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="418" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Fast-forward: tarix to'g'ri chiziq bo'lib qoladi. 3-way: tarixda "ayri" ko'rinadi.</text>
  <text x="360" y="438" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">--no-ff bayrog'i fast-forward o'rnida ham majburan merge commit yaratadi.</text>
</svg>
