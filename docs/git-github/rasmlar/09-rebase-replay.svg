<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>git rebase qanday ishlaydi: ajralib ketgan feature branch commitlari boshqa asosga ko'chirilib qayta o'ynaladi va tarix chiziqli bo'lib qoladi (commitlar yangi hash oladi)</title>

  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">git rebase: commitlarni yangi asosga ko'chirish</text>

  <!-- YUQORI: oldin (ajralgan) -->
  <text x="40" y="74" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#475569">Oldin: tarix ajralib ketgan</text>

  <!-- main qatori -->
  <text x="60" y="118" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">main</text>
  <line x1="110" y1="135" x2="430" y2="135" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="140" cy="135" r="16" fill="#2563eb"/>
  <text x="140" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">C1</text>
  <circle cx="240" cy="135" r="16" fill="#2563eb"/>
  <text x="240" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">C2</text>
  <circle cx="400" cy="135" r="16" fill="#2563eb"/>
  <text x="400" y="140" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">C3</text>

  <!-- feature ajraladi C2 dan -->
  <line x1="240" y1="151" x2="320" y2="200" stroke="#16a34a" stroke-width="2"/>
  <circle cx="350" cy="210" r="16" fill="#16a34a"/>
  <text x="350" y="215" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">F1</text>
  <text x="400" y="215" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">feature</text>
  <text x="350" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">feature C2 dan ajralgan, lekin main C3 ga ketdi</text>

  <!-- O'rta: amal -->
  <text x="360" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#7c3aed">git switch feature; git rebase main  -&gt;  F1 ni C3 ustiga ko'chir</text>

  <!-- PAST: keyin (chiziqli) -->
  <text x="40" y="334" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#475569">Keyin: chiziqli tarix</text>

  <text x="60" y="392" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">main</text>
  <line x1="110" y1="402" x2="560" y2="402" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="140" cy="402" r="16" fill="#2563eb"/>
  <text x="140" y="407" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">C1</text>
  <circle cx="250" cy="402" r="16" fill="#2563eb"/>
  <text x="250" y="407" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">C2</text>
  <circle cx="360" cy="402" r="16" fill="#2563eb"/>
  <text x="360" y="407" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">C3</text>
  <circle cx="470" cy="402" r="16" fill="#16a34a"/>
  <text x="470" y="407" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">F1'</text>
  <text x="525" y="407" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">feature</text>

  <text x="360" y="444" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">F1' — yangi commit: bir xil o'zgarish, lekin YANGI hash (F1 qayta o'ynaldi)</text>
</svg>
