<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>merge va rebase tarix shaklini solishtirish: merge tarmoqlarni qo'shimcha merge commit bilan birlashtiradi va ikki shoxli tarix qoldiradi, rebase esa commitlarni ko'chirib chiziqli tarix yaratadi</title>

  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">merge va rebase: tarix shakli qanday farq qiladi</text>

  <!-- vertikal ajratuvchi -->
  <line x1="360" y1="56" x2="360" y2="420" stroke="#e2e8f0" stroke-width="2"/>

  <!-- CHAP: MERGE -->
  <text x="180" y="80" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#2563eb">git merge</text>
  <text x="180" y="102" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tarixni saqlaydi (haqqoniy, chigal)</text>

  <!-- main qatori -->
  <line x1="60" y1="160" x2="300" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="85" cy="160" r="15" fill="#2563eb"/>
  <text x="85" y="165" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff">C1</text>
  <circle cx="150" cy="160" r="15" fill="#2563eb"/>
  <text x="150" y="165" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff">C2</text>
  <circle cx="215" cy="160" r="15" fill="#2563eb"/>
  <text x="215" y="165" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff">C3</text>
  <!-- merge commit -->
  <circle cx="285" cy="160" r="16" fill="#f59e0b"/>
  <text x="285" y="165" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">M</text>
  <text x="300" y="135" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">merge commit</text>

  <!-- feature shoxi -->
  <line x1="150" y1="174" x2="240" y2="240" stroke="#16a34a" stroke-width="2"/>
  <line x1="255" y1="248" x2="280" y2="174" stroke="#16a34a" stroke-width="2"/>
  <circle cx="250" cy="245" r="15" fill="#16a34a"/>
  <text x="250" y="250" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff">F1</text>
  <text x="180" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">feature shoxi tarixda qoladi</text>

  <text x="180" y="350" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">Hech narsa qayta yozilmaydi</text>
  <text x="180" y="372" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">Eski hashlar saqlanadi</text>
  <text x="180" y="394" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Ulashilgan branch uchun XAVFSIZ</text>

  <!-- O'NG: REBASE -->
  <text x="540" y="80" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#16a34a">git rebase</text>
  <text x="540" y="102" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">chiziqli (toza, tarixni qayta yozadi)</text>

  <line x1="420" y1="180" x2="680" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="445" cy="180" r="15" fill="#2563eb"/>
  <text x="445" y="185" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff">C1</text>
  <circle cx="510" cy="180" r="15" fill="#2563eb"/>
  <text x="510" y="185" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff">C2</text>
  <circle cx="575" cy="180" r="15" fill="#2563eb"/>
  <text x="575" y="185" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff">C3</text>
  <circle cx="650" cy="180" r="16" fill="#16a34a"/>
  <text x="650" y="185" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">F1'</text>
  <text x="650" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">yangi hash</text>

  <text x="540" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">bitta to'g'ri chiziq — shoxi yo'q</text>

  <text x="540" y="350" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">Merge commit yo'q</text>
  <text x="540" y="372" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">Commitlar qayta yoziladi (yangi hash)</text>
  <text x="540" y="394" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#dc2626">Ulashilgan branch uchun XAVFLI</text>
</svg>
