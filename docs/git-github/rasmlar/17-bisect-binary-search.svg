<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>git bisect ikkilik qidiruv: good va bad oralig'i har qadamda yarmiga bo'linib, aybdor commit logarifmik qadamda topiladi</title>

  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">git bisect — ikkilik qidiruv bilan aybdorni topish</text>
  <text x="360" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">8 ta commit: chap chet ishlardi (good), o'ng chet buzilgan (bad)</text>

  <!-- Qadam 1: butun oraliq -->
  <text x="40" y="96" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#475569">1-qadam</text>
  <!-- 8 ta katakcha -->
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="13">
    <rect x="130" y="80" width="56" height="34" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="158" y="102" text-anchor="middle" fill="#16a34a" font-weight="bold">good</text>
    <rect x="190" y="80" width="56" height="34" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="218" y="102" text-anchor="middle" fill="#475569">c2</text>
    <rect x="250" y="80" width="56" height="34" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="278" y="102" text-anchor="middle" fill="#475569">c3</text>
    <rect x="310" y="80" width="56" height="34" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="338" y="73" text-anchor="middle" fill="#b45309" font-size="13" font-weight="bold">c4</text>
    <text x="338" y="102" text-anchor="middle" fill="#b45309" font-size="13">test?</text>
    <rect x="370" y="80" width="56" height="34" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="398" y="102" text-anchor="middle" fill="#475569">c5</text>
    <rect x="430" y="80" width="56" height="34" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="458" y="102" text-anchor="middle" fill="#475569">c6</text>
    <rect x="490" y="80" width="56" height="34" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="518" y="102" text-anchor="middle" fill="#475569">c7</text>
    <rect x="550" y="80" width="56" height="34" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="578" y="102" text-anchor="middle" fill="#dc2626" font-weight="bold">bad</text>
  </g>
  <text x="338" y="134" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">Git o'rtani (c4) tanlaydi -&gt; siz tekshirasiz</text>

  <!-- Qadam 2: c4 yaxshi chiqdi, o'ng yarmi qoladi -->
  <text x="40" y="186" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#475569">2-qadam</text>
  <text x="40" y="206" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">c4 = good</text>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="13">
    <rect x="310" y="170" width="56" height="34" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2" opacity="0.5"/>
    <text x="338" y="192" text-anchor="middle" fill="#16a34a">c4</text>
    <rect x="370" y="170" width="56" height="34" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="398" y="192" text-anchor="middle" fill="#475569">c5</text>
    <rect x="430" y="170" width="56" height="34" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="458" y="163" text-anchor="middle" fill="#b45309" font-size="13" font-weight="bold">c6</text>
    <text x="458" y="192" text-anchor="middle" fill="#b45309" font-size="13">test?</text>
    <rect x="490" y="170" width="56" height="34" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="518" y="192" text-anchor="middle" fill="#475569">c7</text>
    <rect x="550" y="170" width="56" height="34" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="578" y="192" text-anchor="middle" fill="#dc2626" font-weight="bold">bad</text>
  </g>
  <text x="458" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">qolgan yarmining o'rtasi (c6) tekshiriladi</text>

  <!-- Qadam 3: c6 bad, qoldi c5 -->
  <text x="40" y="276" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#475569">3-qadam</text>
  <text x="40" y="296" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">c6 = bad</text>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="13">
    <rect x="370" y="260" width="56" height="34" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2" opacity="0.5"/>
    <text x="398" y="282" text-anchor="middle" fill="#16a34a">c5</text>
    <rect x="430" y="260" width="56" height="34" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="458" y="253" text-anchor="middle" fill="#dc2626" font-size="13" font-weight="bold">c6</text>
    <text x="458" y="282" text-anchor="middle" fill="#dc2626" font-weight="bold" font-size="13">AYBDOR</text>
  </g>
  <text x="458" y="314" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">c5 yaxshi, c6 buzilgan -&gt; aybdor = c6</text>

  <!-- Xulosa qutisi -->
  <rect x="60" y="346" width="600" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="374" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">Nega bu tez? Logarifmik qadam</text>
  <text x="360" y="400" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Har tekshiruvda oraliq YARMIga qisqaradi (7 -&gt; 3 -&gt; 1)</text>
  <text x="360" y="424" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">1000 ta commit ichidan aybdorni atigi ~10 qadamda topadi</text>
</svg>
