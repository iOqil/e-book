<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>Sog'lom open-source repozitoriyning asosiy fayllari: README, LICENSE, CONTRIBUTING, CODE_OF_CONDUCT va .github papkasi — har biri nima vazifa bajaradi</title>
  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Sog'lom open-source repo: kerakli fayllar</text>
  <text x="360" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Bu fayllar yangi kelganga "bu yer nima va qanday yordam beraman?" deb javob beradi</text>

  <!-- README -->
  <rect x="40" y="78" width="310" height="86" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="58" y="104" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">README.md</text>
  <text x="58" y="126" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Loyiha nima qiladi, qanday o'rnatiladi,</text>
  <text x="58" y="146" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">qanday ishlatiladi. Birinchi o'qiladigan fayl.</text>

  <!-- LICENSE -->
  <rect x="370" y="78" width="310" height="86" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="388" y="104" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">LICENSE</text>
  <text x="388" y="126" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Kodni kim, qanday ishlatishi mumkin.</text>
  <text x="388" y="146" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Yo'q bo'lsa — huquqan ishlatib bo'lmaydi!</text>

  <!-- CONTRIBUTING -->
  <rect x="40" y="178" width="310" height="86" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="58" y="204" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#b45309">CONTRIBUTING.md</text>
  <text x="58" y="226" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Hissa qo'shish qoidalari: stil, test,</text>
  <text x="58" y="246" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">PR qanday yuboriladi, kommit qoidasi.</text>

  <!-- CODE_OF_CONDUCT -->
  <rect x="370" y="178" width="310" height="86" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="388" y="204" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#7c3aed">CODE_OF_CONDUCT.md</text>
  <text x="388" y="226" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Muloqot odobi: hurmat qoidalari,</text>
  <text x="388" y="246" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">kim bilan, qanday gaplashish kerak.</text>

  <!-- .github papkasi -->
  <rect x="40" y="278" width="640" height="120" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="58" y="304" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">.github/  (maxsus papka — GitHub avtomatik o'qiydi)</text>
  <rect x="58" y="318" width="290" height="32" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="68" y="339" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">ISSUE_TEMPLATE/ — bildirgi shabloni</text>
  <rect x="370" y="318" width="290" height="32" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="339" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">PULL_REQUEST_TEMPLATE.md — PR shabloni</text>
  <rect x="58" y="358" width="290" height="32" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="68" y="379" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">workflows/ — GitHub Actions (avtotest)</text>
  <rect x="370" y="358" width="290" height="32" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="379" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">FUNDING.yml — moliyaviy qo'llab-quvvatlash</text>

  <!-- pastki izoh -->
  <text x="360" y="430" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Eng muhim ikkitasi: README (nima) va LICENSE (huquq)</text>
  <text x="360" y="454" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Qolganlari loyiha o'sgan sari qo'shiladi — hammasini birdan yozish shart emas</text>
</svg>
