<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>Sir oshkor bo'lishi xavfi va to'g'ri yo'l: chapda .env to'g'ridan commit qilinsa GitHub'ga chiqib ketadi, o'ngda .gitignore va sir menejeri sirni repodan tashqarida ushlab turadi</title>
  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Sirni saqlash: xavfli yo'l va to'g'ri yo'l</text>

  <!-- CHAP: xavfli yo'l -->
  <rect x="28" y="58" width="320" height="372" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="188" y="86" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">❌ Xavfli: sirni commit qilish</text>

  <!-- .env fayl -->
  <rect x="60" y="104" width="256" height="64" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="74" y="126" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">.env</text>
  <text x="74" y="148" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">API_KEY=sk-9f3a...</text>
  <text x="74" y="163" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">DB_PASSWORD=hunter2</text>

  <text x="188" y="190" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#dc2626">git add . &amp;&amp; git commit</text>
  <text x="188" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#dc2626">↓</text>

  <!-- GitHub -->
  <rect x="60" y="220" width="256" height="50" rx="6" fill="#1e293b"/>
  <text x="188" y="251" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">GitHub ( commit tarixida)</text>

  <text x="188" y="296" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">Sir butun dunyoga ochiq —</text>
  <text x="188" y="314" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">o'chirsangiz ham tarixda qoladi.</text>
  <text x="188" y="346" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#dc2626">Qoida: oshkor bo'ldi = o'zgartir</text>
  <text x="188" y="364" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(kalitni darhol bekor qil — rotate)</text>
  <text x="188" y="396" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Botlar GitHub'ni doim skanerlaydi:</text>
  <text x="188" y="414" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tushgan kalit daqiqalarda topiladi.</text>

  <!-- O'NG: to'g'ri yo'l -->
  <rect x="372" y="58" width="320" height="372" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="532" y="86" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">✅ To'g'ri: sirni repodan tashqarida</text>

  <!-- .env diskda, lekin ignore -->
  <rect x="404" y="104" width="256" height="64" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="418" y="126" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">.env (faqat sizning diskda)</text>
  <text x="418" y="148" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">API_KEY=sk-9f3a...</text>
  <text x="418" y="163" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">.gitignore ushlab turadi →</text>

  <!-- .gitignore -->
  <rect x="404" y="182" width="256" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="418" y="202" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#2563eb">.gitignore</text>
  <text x="418" y="219" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">.env</text>

  <text x="532" y="246" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#16a34a">↓</text>

  <!-- GitHub clean -->
  <rect x="404" y="256" width="256" height="50" rx="6" fill="#1e293b"/>
  <text x="532" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">GitHub'da sir YO'Q</text>
  <text x="532" y="298" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#86efac">faqat kod yuklanadi</text>

  <text x="532" y="332" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Sir qayerda turadi?</text>
  <text x="532" y="354" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">• lokal .env faylda (ignore qilingan)</text>
  <text x="532" y="374" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">• sir menejerida (Vault, 1Password)</text>
  <text x="532" y="394" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">• GitHub Actions Secrets'da (CI uchun)</text>
  <text x="532" y="416" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Repoda esa namuna: .env.example</text>

  <text x="360" y="456" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Eng oddiy qoida: sir hech qachon repository ichiga kirmasligi kerak</text>
</svg>
