<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460">
  <title>git reset uch turi: --soft faqat HEAD'ni orqaga suradi, --mixed staging'ni ham bo'shatadi, --hard working zonani ham o'chiradi (xavfli)</title>
  <rect x="0" y="0" width="720" height="460" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">git reset HEAD~1 — uch turi, uch zonaga ta'siri</text>

  <!-- ustun sarlavhalari -->
  <text x="300" y="72" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">repository (HEAD)</text>
  <text x="450" y="72" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">staging</text>
  <text x="600" y="72" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">working</text>

  <!-- SOFT qatori -->
  <rect x="20" y="86" width="220" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="130" y="118" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#16a34a">--soft</text>
  <text x="130" y="144" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">eng yumshoq:</text>
  <text x="130" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">o'zgarish staged qoladi</text>
  <!-- soft uch zona belgisi -->
  <rect x="255" y="96" width="90" height="80" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">orqaga</text>
  <text x="300" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">surildi</text>
  <rect x="405" y="96" width="90" height="80" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">staged</text>
  <text x="450" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">saqlandi</text>
  <rect x="555" y="96" width="90" height="80" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="600" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tegilmadi</text>
  <text x="600" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">✅</text>

  <!-- MIXED qatori -->
  <rect x="20" y="196" width="220" height="100" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="130" y="228" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#b45309">--mixed</text>
  <text x="130" y="254" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">default (flagsiz):</text>
  <text x="130" y="274" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">staging bo'shaydi</text>
  <rect x="255" y="206" width="90" height="80" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="242" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">orqaga</text>
  <text x="300" y="260" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">surildi</text>
  <rect x="405" y="206" width="90" height="80" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="450" y="242" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">bo'shadi</text>
  <text x="450" y="260" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">(unstage)</text>
  <rect x="555" y="206" width="90" height="80" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="600" y="242" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">saqlandi</text>
  <text x="600" y="260" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">✅</text>

  <!-- HARD qatori -->
  <rect x="20" y="306" width="220" height="100" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="130" y="338" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#dc2626">--hard ⚠️</text>
  <text x="130" y="364" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">XAVFLI:</text>
  <text x="130" y="384" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">hamma narsa o'chadi</text>
  <rect x="255" y="316" width="90" height="80" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="352" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">orqaga</text>
  <text x="300" y="370" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">surildi</text>
  <rect x="405" y="316" width="90" height="80" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="450" y="352" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">bo'shadi</text>
  <rect x="555" y="316" width="90" height="80" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="600" y="352" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">O'CHDI</text>
  <text x="600" y="372" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">❌</text>

  <text x="360" y="436" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Pastga qarab har biri "ko'proq narsani" o'chiradi. --hard saqlanmagan ishni tiklab bo'lmaydi.</text>
</svg>
