<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>GitHub Flow: main doim deploy-tayyor, har ish uchun feature branch ochiladi, PR va review'dan keyin main'ga merge qilinib deploy qilinadi</title>

  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">GitHub Flow — sodda oqim (bitta uzun branch: main)</text>

  <!-- main chizig'i -->
  <line x1="55" y1="130" x2="680" y2="130" stroke="#2563eb" stroke-width="3"/>
  <text x="40" y="116" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">main</text>
  <text x="592" y="116" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">doim deploy-tayyor</text>

  <!-- main commitlari -->
  <circle cx="80" cy="130" r="13" fill="#2563eb"/>
  <text x="80" y="135" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff">A</text>
  <circle cx="180" cy="130" r="13" fill="#2563eb"/>
  <text x="180" y="135" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff">B</text>
  <circle cx="560" cy="130" r="15" fill="#7c3aed"/>
  <text x="560" y="135" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff">M</text>

  <!-- feature branch ajraydi -->
  <path d="M180 130 C 240 130, 250 240, 320 240" fill="none" stroke="#16a34a" stroke-width="3"/>
  <circle cx="320" cy="240" r="13" fill="#16a34a"/>
  <text x="320" y="245" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff">C</text>
  <circle cx="410" cy="240" r="13" fill="#16a34a"/>
  <text x="410" y="245" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff">D</text>
  <line x1="333" y1="240" x2="397" y2="240" stroke="#16a34a" stroke-width="3"/>
  <text x="295" y="280" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">feature/login</text>

  <!-- feature main'ga qaytadi (merge) -->
  <path d="M410 240 C 490 240, 500 130, 545 130" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="5 4"/>

  <!-- bosqich yorliqlari -->
  <text x="250" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">1. branch och</text>
  <text x="365" y="305" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">2. commit qil</text>
  <text x="478" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#7c3aed">3. PR + review</text>
  <text x="560" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#7c3aed">4. merge</text>

  <!-- deploy strelka -->
  <line x1="560" y1="145" x2="560" y2="178" stroke="#dc2626" stroke-width="2"/>
  <polygon points="560,188 555,178 565,178" fill="#dc2626"/>
  <text x="560" y="208" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">5. deploy</text>

  <!-- pastki xulosa qutisi -->
  <rect x="40" y="335" width="640" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="362" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Oqim: branch och -&gt; commit -&gt; Pull Request -&gt; review -&gt; main'ga merge -&gt; deploy</text>
  <text x="360" y="388" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Faqat main "abadiy" yashaydi; feature branchlar qisqa umrli — merge'dan keyin o'chiriladi.</text>
</svg>
