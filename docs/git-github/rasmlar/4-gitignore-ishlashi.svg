<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <title>.gitignore qanday ishlaydi: ish papkasidagi fayllar .gitignore naqshlari bo'yicha filtrlanadi, mos kelganlar (node_modules, .env, *.log) Git e'tiborsiz qoldiradi, qolganlari kuzatiladi</title>
  <rect x="0" y="0" width="720" height="420" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">.gitignore — qaysi fayllarni Git "ko'rmaydi"</text>

  <!-- chap: ish papkasidagi hamma fayllar -->
  <rect x="30" y="70" width="190" height="300" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="125" y="94" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#475569">Ish papkasidagi fayllar</text>
  <rect x="50" y="110" width="150" height="28" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="125" y="129" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">index.html</text>
  <rect x="50" y="146" width="150" height="28" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="125" y="165" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">app.js</text>
  <rect x="50" y="182" width="150" height="28" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="125" y="201" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">node_modules/</text>
  <rect x="50" y="218" width="150" height="28" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="125" y="237" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">.env</text>
  <rect x="50" y="254" width="150" height="28" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="125" y="273" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">debug.log</text>
  <rect x="50" y="290" width="150" height="28" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="125" y="309" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">style.css</text>

  <!-- markaz: .gitignore filtri -->
  <rect x="270" y="120" width="180" height="180" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b45309">.gitignore</text>
  <line x1="290" y1="158" x2="430" y2="158" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="290" y="184" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#92400e">node_modules/</text>
  <text x="290" y="212" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#92400e">.env</text>
  <text x="290" y="240" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#92400e">*.log</text>
  <text x="290" y="268" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#92400e">build/</text>
  <text x="360" y="292" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">filtr (naqshlar)</text>

  <!-- o'ng yuqori: kuzatiladi -->
  <rect x="500" y="78" width="190" height="140" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="595" y="102" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">Git kuzatadi ✅</text>
  <text x="595" y="130" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#15803d">index.html</text>
  <text x="595" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#15803d">app.js</text>
  <text x="595" y="182" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#15803d">style.css</text>
  <text x="595" y="204" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#15803d">(commitga tushadi)</text>

  <!-- o'ng past: e'tiborsiz -->
  <rect x="500" y="240" width="190" height="140" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="595" y="264" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">Git e'tiborsiz ❌</text>
  <text x="595" y="292" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#b91c1c">node_modules/</text>
  <text x="595" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#b91c1c">.env</text>
  <text x="595" y="344" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#b91c1c">debug.log</text>
  <text x="595" y="366" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b91c1c">(tarixga umuman tushmaydi)</text>

  <defs>
    <marker id="aG2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="aR2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="aGr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <!-- fayllar -> filtr -->
  <line x1="222" y1="210" x2="266" y2="210" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#aGr2)"/>
  <!-- filtr -> kuzatiladi -->
  <line x1="452" y1="170" x2="496" y2="150" stroke="#16a34a" stroke-width="2.5" marker-end="url(#aG2)"/>
  <!-- filtr -> etiborsiz -->
  <line x1="452" y1="250" x2="496" y2="290" stroke="#dc2626" stroke-width="2.5" marker-end="url(#aR2)"/>

  <text x="360" y="408" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Maqsad: sirlar (.env), katta papkalar (node_modules) va vaqtinchalik fayllar tarixga tushib qolmasin</text>
</svg>
