<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 470" width="740" height="470">
  <title>Tez yechim xaritasi: tez-tez uchraydigan muammolar (noto'g'ri branchga commit, oxirgi commitni bekor qilish, push rad etildi, sir tushib qoldi, branch nomini o'zgartirish) va ularning yechim buyruqlari</title>

  <rect x="0" y="0" width="740" height="470" fill="#f8fafc"/>

  <text x="370" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Tez yechim xaritasi: muammo -&gt; buyruq</text>

  <!-- ustun sarlavhalari -->
  <text x="195" y="68" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">Muammo (vahima)</text>
  <text x="540" y="68" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">Yechim</text>

  <!-- qator 1 -->
  <rect x="30" y="80" width="330" height="62" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="46" y="105" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Noto'g'ri branchga commit qildim</text>
  <text x="46" y="127" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(main'ga, feature kerak edi)</text>
  <line x1="362" y1="111" x2="388" y2="111" stroke="#475569" stroke-width="2" marker-end="url(#b24)"/>
  <rect x="390" y="80" width="320" height="62" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="406" y="105" font-family="Consolas, monospace" font-size="13" fill="#16a34a">git switch -c feature</text>
  <text x="406" y="127" font-family="Consolas, monospace" font-size="13" fill="#16a34a">git switch main; git reset --hard HEAD~1</text>

  <!-- qator 2 -->
  <rect x="30" y="152" width="330" height="62" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="46" y="177" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Oxirgi commitni bekor qilmoqchiman</text>
  <text x="46" y="199" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(o'zgarish saqlansin, push qilinmagan)</text>
  <line x1="362" y1="183" x2="388" y2="183" stroke="#475569" stroke-width="2" marker-end="url(#b24)"/>
  <rect x="390" y="152" width="320" height="62" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="406" y="183" font-family="Consolas, monospace" font-size="13" fill="#16a34a">git reset --soft HEAD~1</text>
  <text x="406" y="203" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">faqat xabarni tuzatish: commit --amend</text>

  <!-- qator 3 -->
  <rect x="30" y="224" width="330" height="62" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="46" y="249" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Push rad etildi (rejected)</text>
  <text x="46" y="271" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">"fetch first" / remote oldinda</text>
  <line x1="362" y1="255" x2="388" y2="255" stroke="#475569" stroke-width="2" marker-end="url(#b24)"/>
  <rect x="390" y="224" width="320" height="62" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="406" y="249" font-family="Consolas, monospace" font-size="13" fill="#16a34a">git pull --rebase origin main</text>
  <text x="406" y="271" font-family="Consolas, monospace" font-size="13" fill="#16a34a">git push</text>

  <!-- qator 4 -->
  <rect x="30" y="296" width="330" height="62" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="46" y="321" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Sir/parol commitga tushib qoldi</text>
  <text x="46" y="343" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(.env push bo'lib ketdi)</text>
  <line x1="362" y1="327" x2="388" y2="327" stroke="#475569" stroke-width="2" marker-end="url(#b24)"/>
  <rect x="390" y="296" width="320" height="62" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="406" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Kalitni DARROV bekor qiling (rotate)</text>
  <text x="406" y="340" font-family="Consolas, monospace" font-size="13" fill="#16a34a">git rm --cached .env; .gitignore'ga</text>

  <!-- qator 5 -->
  <rect x="30" y="368" width="330" height="62" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="46" y="393" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Branch nomini o'zgartirmoqchiman</text>
  <text x="46" y="415" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(noto'g'ri nom qo'ydim)</text>
  <line x1="362" y1="399" x2="388" y2="399" stroke="#475569" stroke-width="2" marker-end="url(#b24)"/>
  <rect x="390" y="368" width="320" height="62" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="406" y="393" font-family="Consolas, monospace" font-size="13" fill="#16a34a">git branch -m yangi-nom</text>
  <text x="406" y="413" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">push qilingan bo'lsa: eski branchni o'chiring</text>

  <text x="370" y="456" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Qoida: push QILINMAGAN bo'lsa — emin-erkin tuzating; push QILINGAN bo'lsa — ehtiyot bo'ling (jamoa ko'rgan).</text>

  <defs>
    <marker id="b24" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
