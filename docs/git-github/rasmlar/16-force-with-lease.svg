<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>git push --force va --force-with-lease farqi: oddiy force hamkasb commitini ustidan ochiradi, force-with-lease esa remote ozgarganini sezib pushni stale info bilan rad etadi va hamkasb ishini saqlaydi</title>

  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>

  <text x="360" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">--force vs --force-with-lease</text>
  <text x="360" y="62" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Holat: siz push qilgandan keyin hamkasb yangi commit (H) qo'shdi</text>

  <!-- CHAP PANEL: oddiy force -->
  <rect x="28" y="84" width="318" height="350" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="187" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">git push --force</text>
  <text x="187" y="134" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">"remoteda nima bo'lsa ham ustiga yoz"</text>

  <!-- remote oldin -->
  <text x="60" y="166" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Remote (push paytida):</text>
  <circle cx="90" cy="196" r="18" fill="#2563eb"/>
  <text x="90" y="201" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">C2</text>
  <line x1="108" y1="196" x2="128" y2="196" stroke="#94a3b8" stroke-width="2.5"/>
  <circle cx="146" cy="196" r="18" fill="#7c3aed"/>
  <text x="146" y="201" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">H</text>
  <text x="200" y="200" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#7c3aed">&lt;- hamkasb ishi</text>

  <!-- strelka pastga -->
  <line x1="187" y1="222" x2="187" y2="256" stroke="#dc2626" stroke-width="3"/>
  <polygon points="187,260 181,248 193,248" fill="#dc2626"/>
  <text x="187" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">--force bajariladi</text>

  <!-- remote keyin -->
  <text x="60" y="312" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Remote (force'dan keyin):</text>
  <circle cx="90" cy="346" r="18" fill="#2563eb"/>
  <text x="90" y="351" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">C2'</text>
  <!-- H ochirilgan -->
  <circle cx="146" cy="346" r="18" fill="#e2e8f0" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="146" y="351" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">H</text>
  <line x1="130" y1="362" x2="162" y2="330" stroke="#dc2626" stroke-width="2"/>
  <text x="187" y="400" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">Hamkasb ishi YO'QOLDI!</text>
  <text x="187" y="420" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">va buni hech kim sezmaydi</text>

  <!-- O'NG PANEL: force-with-lease -->
  <rect x="374" y="84" width="318" height="350" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="533" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">git push --force-with-lease</text>
  <text x="533" y="134" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">"avval remote o'zgarmaganini tekshir"</text>

  <text x="406" y="166" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Remote (push paytida):</text>
  <circle cx="436" cy="196" r="18" fill="#2563eb"/>
  <text x="436" y="201" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">C2</text>
  <line x1="454" y1="196" x2="474" y2="196" stroke="#94a3b8" stroke-width="2.5"/>
  <circle cx="492" cy="196" r="18" fill="#7c3aed"/>
  <text x="492" y="201" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">H</text>
  <text x="546" y="200" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#7c3aed">&lt;- hamkasb ishi</text>

  <line x1="533" y1="222" x2="533" y2="256" stroke="#16a34a" stroke-width="3"/>
  <polygon points="533,260 527,248 539,248" fill="#16a34a"/>
  <text x="533" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">"remote o'zgargan!" -&gt; to'xta</text>

  <!-- rad etildi quti -->
  <rect x="410" y="300" width="246" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="533" y="320" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#b45309" font-weight="bold">! [rejected] (stale info)</text>
  <text x="533" y="338" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">push rad etildi</text>

  <text x="533" y="372" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Remote tegilmadi:</text>
  <circle cx="476" cy="400" r="16" fill="#2563eb"/>
  <text x="476" y="405" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">C2</text>
  <line x1="492" y1="400" x2="510" y2="400" stroke="#94a3b8" stroke-width="2.5"/>
  <circle cx="526" cy="400" r="16" fill="#7c3aed"/>
  <text x="526" y="405" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">H</text>
  <text x="580" y="405" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a" font-weight="bold">saqlandi!</text>

  <!-- pastki qoida -->
  <text x="360" y="456" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" font-weight="bold">Qoida: --force hech qachon, --force-with-lease har doim</text>
</svg>
