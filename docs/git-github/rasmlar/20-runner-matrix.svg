<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>Matrix strategiya: bitta job ta'rifidan GitHub ikki OS va uch Node versiyasining har kombinatsiyasi uchun alohida runner ochib, oltita nusxani parallel ishga tushiradi</title>

  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Matrix: bitta job — ko'p muhitda parallel</text>

  <!-- job definition -->
  <rect x="40" y="58" width="240" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">Bitta job ta'rifi</text>
  <text x="58" y="108" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">matrix:</text>
  <text x="74" y="128" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">os: [ubuntu, windows]</text>
  <text x="74" y="148" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">node: [18, 20, 22]</text>

  <!-- expansion arrow -->
  <line x1="280" y1="113" x2="322" y2="113" stroke="#1e293b" stroke-width="2"/>
  <polygon points="332,113 320,107 320,119" fill="#1e293b"/>
  <text x="306" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">kengayadi</text>

  <text x="525" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">2 x 3 = 6 ta runner, hammasi bir vaqtda</text>

  <!-- runner grid: ubuntu row -->
  <text x="356" y="135" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">ubuntu</text>
  <rect x="356" y="142" width="100" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="406" y="166" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">ubuntu</text>
  <text x="406" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">Node 18</text>

  <rect x="468" y="142" width="100" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="518" y="166" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">ubuntu</text>
  <text x="518" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">Node 20</text>

  <rect x="580" y="142" width="100" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="630" y="166" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">ubuntu</text>
  <text x="630" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">Node 22</text>

  <!-- runner grid: windows row -->
  <text x="356" y="227" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">windows</text>
  <rect x="356" y="234" width="100" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="406" y="258" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">windows</text>
  <text x="406" y="278" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">Node 18</text>

  <rect x="468" y="234" width="100" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="518" y="258" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">windows</text>
  <text x="518" y="278" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">Node 20</text>

  <rect x="580" y="234" width="100" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="630" y="258" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">windows</text>
  <text x="630" y="278" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">Node 22</text>

  <!-- runner explanation box -->
  <rect x="40" y="200" width="240" height="120" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="160" y="226" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Runner nima?</text>
  <text x="160" y="250" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">GitHub bulutidagi toza</text>
  <text x="160" y="270" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">vaqtinchalik kompyuter —</text>
  <text x="160" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">jobni shu yerda bajaradi,</text>
  <text x="160" y="310" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tugagach o'chiriladi.</text>

  <!-- bottom note -->
  <rect x="40" y="352" width="640" height="64" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="378" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Foydasi: kod hamma versiya va OS'da ishlashini bir urinishda tekshirasiz</text>
  <text x="360" y="402" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Parallel bo'lgani uchun 6 ta tekshiruv ham deyarli bitta job vaqtida tugaydi.</text>
</svg>
