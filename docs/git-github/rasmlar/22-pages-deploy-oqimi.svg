<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <title>GitHub Pages deploy oqimi: repodagi kod push qilinadi, GitHub uni build qiladi va jonli URL orqali chop etadi</title>
  <rect x="0" y="0" width="720" height="360" fill="#f8fafc"/>

  <text x="360" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">GitHub Pages: kod qanday jonli saytga aylanadi</text>

  <!-- 1: Repo -->
  <rect x="40" y="110" width="170" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="125" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">1. Repozitoriy</text>
  <text x="125" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">index.html</text>
  <text x="125" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">style.css</text>
  <text x="125" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">rasm.png</text>
  <text x="125" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">git push bilan jo'natiladi</text>

  <!-- arrow 1->2 -->
  <line x1="210" y1="170" x2="270" y2="170" stroke="#475569" stroke-width="2.5"/>
  <polygon points="270,170 260,165 260,175" fill="#475569"/>

  <!-- 2: Build -->
  <rect x="275" y="110" width="170" height="120" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">2. Build (GitHub)</text>
  <text x="360" y="152" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">GitHub fayllarni</text>
  <text x="360" y="176" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">tayyorlaydi va</text>
  <text x="360" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">serverga joylaydi</text>

  <!-- arrow 2->3 -->
  <line x1="445" y1="170" x2="505" y2="170" stroke="#475569" stroke-width="2.5"/>
  <polygon points="505,170 495,165 495,175" fill="#475569"/>

  <!-- 3: Live URL -->
  <rect x="510" y="110" width="170" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="595" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">3. Jonli sayt</text>
  <text x="595" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">username.github.io</text>
  <text x="595" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">/repo-nomi</text>
  <text x="595" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">hammaga ochiq, bepul</text>

  <!-- bottom note -->
  <text x="360" y="288" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Har push'dan keyin sayt avtomatik yangilanadi (odatda 1-2 daqiqa ichida)</text>
  <text x="360" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Server, domen yoki to'lov kerak emas — faqat statik fayllar (HTML/CSS/JS)</text>
</svg>
