<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <title>Branch ajralishi (divergence): umumiy commitdan keyin main va feature ikki alohida yo'nalishda o'sib boradi, har biri o'z commitlariga ega</title>
  <rect x="0" y="0" width="720" height="380" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Branch ajralishi: tarix ikkiga bo'linadi</text>
  <text x="360" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">C2 dan keyin ikki yo'l: main pastda, feature tepada -- bir-biriga xalal bermaydi</text>

  <!-- umumiy ona commitlar -->
  <circle cx="110" cy="200" r="28" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="110" y="205" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">C1</text>

  <circle cx="240" cy="200" r="28" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="240" y="205" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">C2</text>
  <line x1="138" y1="200" x2="212" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <text x="175" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">umumiy tarix</text>

  <!-- main yo'nalishi (pastga) -->
  <line x1="268" y1="200" x2="350" y2="255" stroke="#16a34a" stroke-width="2"/>
  <circle cx="380" cy="270" r="28" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="380" y="275" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">C3</text>
  <line x1="408" y1="270" x2="492" y2="270" stroke="#16a34a" stroke-width="2"/>
  <circle cx="520" cy="270" r="28" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="520" y="275" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">C4</text>
  <rect x="580" y="254" width="100" height="32" rx="6" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
  <text x="630" y="275" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">main</text>
  <line x1="548" y1="270" x2="576" y2="270" stroke="#16a34a" stroke-width="2"/>

  <!-- feature yo'nalishi (tepaga) -->
  <line x1="268" y1="200" x2="350" y2="145" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="380" cy="130" r="28" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="380" y="135" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">C5</text>
  <line x1="408" y1="130" x2="492" y2="130" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="520" cy="130" r="28" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="520" y="135" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">C6</text>
  <rect x="572" y="114" width="116" height="32" rx="6" fill="#7c3aed" stroke="#6d28d9" stroke-width="2"/>
  <text x="630" y="135" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">feature</text>
  <line x1="548" y1="130" x2="568" y2="130" stroke="#7c3aed" stroke-width="2"/>

  <!-- pastki izoh -->
  <text x="360" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">main ishlab turgan barqaror kod, feature da yangi xususiyat sinaladi -- tayyor bo'lgach birlashtiriladi</text>
</svg>
