<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>Git va GitHub farqi: Git — kompyuteringga o'rnatiladigan dastur, tarixni lokal boshqaradi; GitHub — internetdagi xizmat, repozitoriyni saqlaydi va jamoa bilan ishlashga imkon beradi</title>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Git ≠ GitHub</text>

  <!-- chap: Git (lokal dastur) -->
  <rect x="40" y="60" width="280" height="300" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#2563eb">Git</text>
  <text x="180" y="114" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">dastur — kompyuteringda</text>

  <!-- noutbuk ikonkasi -->
  <rect x="120" y="132" width="120" height="74" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="134" y="146" width="92" height="46" rx="2" fill="#1e293b"/>
  <text x="180" y="174" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dcfce7">$ git commit</text>
  <rect x="108" y="206" width="144" height="8" rx="3" fill="#94a3b8"/>

  <text x="180" y="242" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">✅ Bepul, ochiq kodli</text>
  <text x="180" y="266" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">✅ Internetsiz (offline) ishlaydi</text>
  <text x="180" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">✅ Tarixni o'zing boshqarasan</text>
  <text x="180" y="314" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">✅ commit, branch, merge — bu yerda</text>
  <text x="180" y="342" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Linus Torvalds, 2005</text>

  <!-- markaz: ulanish -->
  <line x1="320" y1="210" x2="400" y2="210" stroke="#16a34a" stroke-width="3"/>
  <polygon points="400,210 388,204 388,216" fill="#16a34a"/>
  <polygon points="320,210 332,204 332,216" fill="#16a34a"/>
  <text x="360" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">push /</text>
  <text x="360" y="232" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">pull</text>

  <!-- o'ng: GitHub (bulutli xizmat) -->
  <rect x="400" y="60" width="280" height="300" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="540" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#16a34a">GitHub</text>
  <text x="540" y="114" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">xizmat — internetda (bulutda)</text>

  <!-- bulut ikonkasi -->
  <ellipse cx="540" cy="170" rx="70" ry="34" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <ellipse cx="500" cy="178" rx="26" ry="20" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <ellipse cx="582" cy="178" rx="26" ry="20" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="474" y="178" width="132" height="22" fill="#ffffff"/>
  <text x="540" y="176" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">repozitoriy nusxasi</text>

  <text x="540" y="242" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">✅ Kodni internetda saqlaydi</text>
  <text x="540" y="266" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">✅ Jamoa bilan birga ishlash</text>
  <text x="540" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">✅ Pull Request, Issues, Actions</text>
  <text x="540" y="314" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">✅ Boshqalar ko'radi va hissa qo'shadi</text>
  <text x="540" y="342" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Asoschilar 2008 · hozir Microsoft'niki</text>

  <!-- pastki izoh -->
  <text x="360" y="392" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Git'siz ham ishlash mumkin, lekin GitHub Git ustiga qurilgan.</text>
  <text x="360" y="416" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Muqobil bulut xizmatlari ham bor: GitLab, Bitbucket, Codeberg</text>
</svg>
