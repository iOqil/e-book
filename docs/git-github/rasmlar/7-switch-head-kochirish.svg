<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">
  <title>git switch HEAD ni qanday ko'chiradi: switch dan oldin HEAD main ga, switch feature dan keyin HEAD feature branchga ishora qiladi va ishchi papka shunga moslashadi</title>
  <rect x="0" y="0" width="720" height="400" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">git switch HEAD ni ko'chiradi</text>

  <!-- chap panel: oldin -->
  <text x="190" y="74" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#475569">OLDIN: HEAD main da</text>
  <rect x="40" y="86" width="300" height="230" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <circle cx="120" cy="230" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="120" y="235" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">C2</text>
  <line x1="146" y1="220" x2="200" y2="180" stroke="#16a34a" stroke-width="2"/>
  <line x1="146" y1="240" x2="200" y2="280" stroke="#7c3aed" stroke-width="2"/>

  <circle cx="230" cy="170" r="26" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="230" y="175" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">C3</text>
  <rect x="200" y="120" width="60" height="26" rx="5" fill="#16a34a"/>
  <text x="230" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">main</text>
  <line x1="230" y1="146" x2="230" y2="142" stroke="#16a34a" stroke-width="2"/>

  <circle cx="230" cy="290" r="26" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="230" y="295" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">C4</text>
  <rect x="270" y="277" width="68" height="26" rx="5" fill="#7c3aed"/>
  <text x="304" y="295" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">feature</text>

  <rect x="120" y="96" width="64" height="26" rx="5" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <text x="152" y="114" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">HEAD</text>
  <line x1="170" y1="122" x2="220" y2="146" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#a1)"/>

  <!-- o'ng panel: keyin -->
  <text x="530" y="74" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#475569">git switch feature</text>
  <rect x="380" y="86" width="300" height="230" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <circle cx="460" cy="230" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="460" y="235" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">C2</text>
  <line x1="486" y1="220" x2="540" y2="180" stroke="#16a34a" stroke-width="2"/>
  <line x1="486" y1="240" x2="540" y2="280" stroke="#7c3aed" stroke-width="2"/>

  <circle cx="570" cy="170" r="26" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="570" y="175" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">C3</text>
  <rect x="540" y="120" width="60" height="26" rx="5" fill="#16a34a"/>
  <text x="570" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">main</text>

  <circle cx="570" cy="290" r="26" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="570" y="295" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">C4</text>
  <rect x="424" y="305" width="68" height="26" rx="5" fill="#7c3aed"/>
  <text x="458" y="323" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">feature</text>
  <line x1="488" y1="312" x2="548" y2="300" stroke="#7c3aed" stroke-width="2"/>

  <rect x="610" y="320" width="64" height="26" rx="5" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <text x="642" y="338" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">HEAD</text>
  <line x1="624" y1="320" x2="588" y2="300" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#a2)"/>

  <!-- pastki izoh -->
  <text x="360" y="364" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">HEAD endi feature ga ishora qiladi -- ishchi papkadagi fayllar C4 holatiga keladi</text>
  <text x="360" y="388" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Commitlar joyida qoladi, faqat "qayerda turibmiz" o'zgaradi</text>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#f59e0b"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#f59e0b"/></marker>
  </defs>
</svg>
