<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 480" width="740" height="480">
  <title>Open-source loyihaga hissa qo'shish oqimi: issue topish, fork qilish, branch ochish, o'zgartirish va test, push, Pull Request yuborish, review va merge</title>
  <rect x="0" y="0" width="740" height="480" fill="#f8fafc"/>

  <text x="370" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Hissa qo'shish oqimi: issue'dan merge'gacha</text>

  <!-- uchta sahna ustuni: upstream, fork, lokal -->
  <text x="130" y="68" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">upstream (asl loyiha)</text>
  <text x="370" y="68" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">origin (sizning fork)</text>
  <text x="610" y="68" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">lokal (kompyuteringiz)</text>

  <!-- ustun fonlari -->
  <rect x="30" y="78" width="200" height="360" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="270" y="78" width="200" height="360" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="510" y="78" width="200" height="360" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>

  <!-- 1. issue -->
  <rect x="48" y="96" width="164" height="48" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="130" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">1. Issue top</text>
  <text x="130" y="134" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">good first issue</text>

  <!-- 2. fork (upstream -> origin) -->
  <rect x="288" y="96" width="164" height="48" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="370" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">2. Fork</text>
  <text x="370" y="134" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">o'z nusxangiz</text>
  <line x1="212" y1="120" x2="286" y2="120" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 3. clone (origin -> lokal) -->
  <rect x="528" y="96" width="164" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="610" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">3. Clone</text>
  <text x="610" y="134" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">git clone</text>
  <line x1="452" y1="120" x2="526" y2="120" stroke="#16a34a" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 4. branch + o'zgartir + test (lokal) -->
  <rect x="528" y="166" width="164" height="62" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="610" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">4. Branch +</text>
  <text x="610" y="204" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">o'zgartir + test</text>
  <text x="610" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">git switch -c fix/...</text>
  <line x1="610" y1="144" x2="610" y2="164" stroke="#16a34a" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 5. push (lokal -> origin) -->
  <rect x="288" y="166" width="164" height="62" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="370" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">5. Commit +</text>
  <text x="370" y="204" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">push</text>
  <text x="370" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">git push origin</text>
  <line x1="526" y1="197" x2="454" y2="197" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 6. PR (origin -> upstream) -->
  <rect x="48" y="166" width="164" height="62" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="130" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">6. Pull Request</text>
  <text x="130" y="204" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">"mening ishimni</text>
  <text x="130" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">qo'shasizmi?"</text>
  <line x1="286" y1="197" x2="214" y2="197" stroke="#f59e0b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 7. review -->
  <rect x="48" y="250" width="164" height="54" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="130" y="272" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">7. Review</text>
  <text x="130" y="292" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">maintainer izoh beradi</text>
  <line x1="130" y1="228" x2="130" y2="248" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 8. merge -->
  <rect x="48" y="326" width="164" height="54" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="130" y="348" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">8. Merge!</text>
  <text x="130" y="368" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">ishingiz loyihada</text>
  <line x1="130" y1="304" x2="130" y2="324" stroke="#16a34a" stroke-width="2" marker-end="url(#ar)"/>

  <!-- pastki izoh -->
  <text x="370" y="412" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Fork va PR — GitHub saytida; clone, branch, commit, push — kompyuteringizda terminalda</text>
  <text x="370" y="432" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Review'da o'zgartirish so'ralsa: yana commit + push qilasiz — PR avtomatik yangilanadi</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
