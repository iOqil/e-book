<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>Public va private repozitoriy farqi: public reponi hamma ko'radi va portfolio uchun yaxshi, private reponi faqat siz va taklif qilganlaringiz ko'radi</title>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Public vs Private repozitoriy</text>

  <!-- chap: PUBLIC -->
  <rect x="40" y="64" width="300" height="320" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="190" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#16a34a">Public (ochiq)</text>

  <!-- ochiq qulf belgisi -->
  <g>
    <rect x="172" y="118" width="36" height="28" rx="4" fill="#16a34a"/>
    <path d="M178 118 v-8 a12 12 0 0 1 24 0" fill="none" stroke="#16a34a" stroke-width="4"/>
  </g>

  <text x="190" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Internetda hamma ko'ra oladi</text>
  <text x="190" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">istalgan kishi kodni o'qiydi,</text>
  <text x="190" y="230" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">klon qiladi, fork oladi</text>

  <text x="190" y="266" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Yaxshi:</text>
  <text x="190" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">portfolio, open source,</text>
  <text x="190" y="310" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">o'quv loyihalar</text>

  <text x="190" y="346" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">Ehtiyot: parol/kalit qo'ymang!</text>
  <text x="190" y="370" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(o'zgartirish faqat egasida)</text>

  <!-- o'ng: PRIVATE -->
  <rect x="380" y="64" width="300" height="320" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="530" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#b45309">Private (yopiq)</text>

  <!-- yopiq qulf belgisi -->
  <g>
    <rect x="512" y="118" width="36" height="28" rx="4" fill="#b45309"/>
    <path d="M518 118 v-8 a12 12 0 0 1 24 0 v8" fill="none" stroke="#b45309" stroke-width="4"/>
  </g>

  <text x="530" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Faqat siz ko'rasiz</text>
  <text x="530" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">boshqalar faqat siz taklif</text>
  <text x="530" y="230" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">qilsangiz kira oladi</text>

  <text x="530" y="266" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">Yaxshi:</text>
  <text x="530" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">mijoz ishi, sir kod,</text>
  <text x="530" y="310" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">tugamagan loyiha</text>

  <text x="530" y="346" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Bepul rejada ham mavjud</text>
  <text x="530" y="370" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">keyin public'ga o'zgartirsa bo'ladi</text>

  <!-- pastki izoh -->
  <text x="360" y="414" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Ikkalasini ham Settings'da istalgan vaqt o'zgartirish mumkin; ikkilansangiz private'dan boshlang</text>
</svg>
