<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <title>User sayt va project sayt farqi: user sayt username.github.io repodan ildiz URL'da, project sayt esa oddiy repodan URL ichida papka sifatida chiqadi</title>
  <rect x="0" y="0" width="720" height="420" fill="#f8fafc"/>

  <text x="360" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Ikki xil Pages sayt: user-sayt vs project-sayt</text>

  <!-- LEFT: user site -->
  <text x="190" y="76" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#2563eb">User (shaxsiy) sayt</text>
  <rect x="40" y="90" width="300" height="270" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>

  <text x="60" y="122" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#475569">Repo nomi (aniq shunday bo'lishi shart):</text>
  <rect x="60" y="132" width="260" height="34" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="190" y="154" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">oqil.github.io</text>

  <text x="60" y="196" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#475569">Jonli URL (ildizda):</text>
  <rect x="60" y="206" width="260" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="190" y="228" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">oqil.github.io</text>

  <text x="60" y="272" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">Har akkauntda faqat bitta</text>
  <text x="60" y="296" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">Portfolio, asosiy sahifa uchun</text>
  <text x="60" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">URL qisqa va chiroyli</text>
  <text x="60" y="344" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">main branch'dan chop etiladi</text>

  <!-- RIGHT: project site -->
  <text x="530" y="76" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#16a34a">Project (loyiha) sayt</text>
  <rect x="380" y="90" width="300" height="270" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>

  <text x="400" y="122" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#475569">Repo nomi (xohlagan nom):</text>
  <rect x="400" y="132" width="260" height="34" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="530" y="154" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">todo-app</text>

  <text x="400" y="196" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#475569">Jonli URL (papka ichida):</text>
  <rect x="400" y="206" width="260" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="530" y="228" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">oqil.github.io/todo-app</text>

  <text x="400" y="272" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">Har repo uchun alohida sayt</text>
  <text x="400" y="296" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">Loyiha demosi uchun ideal</text>
  <text x="400" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">Soni cheklanmagan</text>
  <text x="400" y="344" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Settings -> Pages'da yoqiladi</text>

  <!-- bottom note -->
  <text x="360" y="398" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Tafovut: faqat repo NOMIda. Nom username.github.io bo'lsa — ildiz URL, aks holda — papka.</text>
</svg>
