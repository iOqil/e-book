<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <title>Bitta reponing ikki xil URL ko'rinishi: HTTPS url https bilan boshlanadi va token bilan ishlaydi, SSH url git@ bilan boshlanadi va SSH kalit bilan ishlaydi; ikkalasi ham bir reponi ko'rsatadi, faqat ulanish usuli farq qiladi</title>

  <rect x="0" y="0" width="720" height="360" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Bitta repo — ikki xil URL</text>
  <text x="360" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Ikkalasi ham aynan bir reponi ko'rsatadi, faqat ulanish usuli boshqacha</text>

  <!-- HTTPS panel -->
  <rect x="40" y="84" width="300" height="220" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#2563eb">HTTPS</text>

  <rect x="60" y="128" width="260" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="190" y="148" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">https://github.com/</text>
  <text x="190" y="166" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">oqil/loyiha.git</text>

  <text x="190" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">+ Sozlash oson, hamma joyda ishlaydi</text>
  <text x="190" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">+ Firewall ortidan ham o'tadi</text>
  <text x="190" y="246" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">- Push uchun token kerak (parol emas)</text>
  <text x="190" y="278" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Boshlovchilarga tavsiya etiladi</text>

  <!-- SSH panel -->
  <rect x="380" y="84" width="300" height="220" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="530" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#7c3aed">SSH</text>

  <rect x="400" y="128" width="260" height="44" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="530" y="148" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">git@github.com:</text>
  <text x="530" y="166" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">oqil/loyiha.git</text>

  <text x="530" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">+ Bir marta sozlab, parolsiz ishlash</text>
  <text x="530" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">+ Kalit bilan xavfsiz (ed25519)</text>
  <text x="530" y="246" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">- Avval kalit yaratib sozlash kerak</text>
  <text x="530" y="278" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Kunlik ishlovchilarga qulay (12-bob)</text>

  <text x="360" y="334" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Repo sahifasidagi yashil Code tugmasidan kerakli URL turini tanlab nusxalaysiz</text>
</svg>
