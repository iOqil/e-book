<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>Issue'ni tartibga soluvchi uchta vosita: label (turkum), milestone (reliz maqsadi) va assignee (mas'ul shaxs)</title>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Issue'ni tartibga solish: 3 ta vosita</text>

  <!-- markazdagi issue kartochkasi -->
  <rect x="250" y="58" width="220" height="110" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="360" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">Issue #12</text>
  <text x="360" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Login formasi</text>
  <text x="360" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">ishlamayapti</text>
  <text x="360" y="152" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">holati: Open</text>

  <!-- LABEL bloki (chap) -->
  <rect x="30" y="220" width="200" height="170" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="130" y="246" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#b45309">Label (turkum)</text>
  <text x="130" y="266" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">issue turini belgilaydi</text>
  <rect x="58" y="282" width="56" height="22" rx="11" fill="#fee2e2"/>
  <text x="86" y="298" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">bug</text>
  <rect x="124" y="282" width="120" height="22" rx="11" fill="#dbeafe"/>
  <text x="184" y="298" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">enhancement</text>
  <rect x="58" y="314" width="138" height="22" rx="11" fill="#dcfce7"/>
  <text x="127" y="330" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">good first issue</text>
  <rect x="58" y="346" width="92" height="22" rx="11" fill="#f3e8ff"/>
  <text x="104" y="362" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#7c3aed">question</text>

  <!-- MILESTONE bloki (markaz) -->
  <rect x="258" y="220" width="200" height="170" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="358" y="246" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">Milestone</text>
  <text x="358" y="266" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">reliz maqsadi</text>
  <rect x="280" y="284" width="156" height="86" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="358" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">v1.0 reliz</text>
  <text x="358" y="328" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">muddat: 1-iyul</text>
  <rect x="296" y="340" width="124" height="14" rx="7" fill="#e2e8f0"/>
  <rect x="296" y="340" width="74" height="14" rx="7" fill="#16a34a"/>
  <text x="358" y="368" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">60% bajarildi</text>

  <!-- ASSIGNEE bloki (o'ng) -->
  <rect x="486" y="220" width="204" height="170" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="588" y="246" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">Assignee (mas'ul)</text>
  <text x="588" y="266" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">kim bajaradi</text>
  <circle cx="540" cy="320" r="26" fill="#16a34a"/>
  <text x="540" y="326" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">A</text>
  <text x="540" y="362" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">@aziz</text>
  <circle cx="624" cy="320" r="26" fill="#7c3aed"/>
  <text x="624" y="326" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">M</text>
  <text x="624" y="362" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">@malika</text>

  <!-- bog'lovchi chiziqlar issue'dan blocklarga -->
  <defs>
    <marker id="lm" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <line x1="300" y1="168" x2="160" y2="218" stroke="#94a3b8" stroke-width="2" marker-end="url(#lm)"/>
  <line x1="360" y1="168" x2="358" y2="218" stroke="#94a3b8" stroke-width="2" marker-end="url(#lm)"/>
  <line x1="420" y1="168" x2="560" y2="218" stroke="#94a3b8" stroke-width="2" marker-end="url(#lm)"/>

  <!-- pastki izoh -->
  <text x="360" y="416" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Bir issue'ga bir nechta label, bitta milestone va bir yoki bir nechta assignee biriktiriladi</text>
</svg>
