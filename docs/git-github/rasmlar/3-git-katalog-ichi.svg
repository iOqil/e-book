<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420">
  <title>.git yashirin katalogi ichidagi asosiy elementlar: HEAD, config, refs, objects va index — har birining vazifasi qisqacha</title>

  <!-- fon -->
  <rect x="0" y="0" width="680" height="420" fill="#f8fafc"/>

  <text x="340" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">.git katalogi ichida nima bor?</text>
  <text x="340" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Bu yashirin papka butun tarixni saqlaydi — o'chsa, tarix yo'qoladi</text>

  <!-- ildiz papka -->
  <rect x="40" y="78" width="140" height="40" rx="8" fill="#1e293b"/>
  <text x="110" y="103" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">.git/</text>

  <!-- ulagich chiziq -->
  <line x1="110" y1="118" x2="110" y2="380" stroke="#94a3b8" stroke-width="2"/>

  <!-- HEAD -->
  <line x1="110" y1="150" x2="200" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <rect x="200" y="130" width="150" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="275" y="155" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">HEAD</text>
  <text x="370" y="155" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">hozir qaysi branch'dasiz (mas. main)</text>

  <!-- config -->
  <line x1="110" y1="200" x2="200" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <rect x="200" y="180" width="150" height="40" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="275" y="205" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">config</text>
  <text x="370" y="205" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">shu repo sozlamalari</text>

  <!-- index -->
  <line x1="110" y1="250" x2="200" y2="250" stroke="#94a3b8" stroke-width="2"/>
  <rect x="200" y="230" width="150" height="40" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="275" y="255" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">index</text>
  <text x="370" y="255" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Staging Area — bu yerda yashaydi</text>

  <!-- refs -->
  <line x1="110" y1="300" x2="200" y2="300" stroke="#94a3b8" stroke-width="2"/>
  <rect x="200" y="280" width="150" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="275" y="305" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#15803d">refs/</text>
  <text x="370" y="305" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">branch'lar qaysi commitga ishora qiladi</text>

  <!-- objects -->
  <line x1="110" y1="350" x2="200" y2="350" stroke="#94a3b8" stroke-width="2"/>
  <rect x="200" y="330" width="150" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="275" y="355" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#15803d">objects/</text>
  <text x="370" y="355" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">commitlar va fayl mazmuni (asosiy ombor)</text>

  <!-- ogohlantirish -->
  <rect x="40" y="388" width="600" height="26" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="340" y="406" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#991b1b">Ichini qo'lda tahrirlamang: Git bilan ishlang. .git'ni o'chirsangiz oddiy papka qoladi, tarix ketadi.</text>
</svg>
