<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>Git config uch darajasi piramidasi: local (eng yuqori, eng kuchli), global (o'rta), system (eng past, eng zaif). Yuqori daraja pastdagini bosib o'tadi, ustuvorlik local > global > system</title>

  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>

  <text x="360" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Config darajalari: kim kimni bosib o'tadi?</text>

  <!-- LOCAL (eng tepa, eng kuchli) -->
  <rect x="240" y="64" width="240" height="78" rx="8" fill="#16a34a"/>
  <text x="360" y="93" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">LOCAL  (--local)</text>
  <text x="360" y="115" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dcfce7">faqat shu bitta loyiha</text>
  <text x="360" y="133" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dcfce7">.git/config</text>

  <!-- GLOBAL (o'rta) -->
  <rect x="180" y="162" width="360" height="78" rx="8" fill="#2563eb"/>
  <text x="360" y="191" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">GLOBAL  (--global)</text>
  <text x="360" y="213" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dbeafe">sizning barcha loyihalaringiz</text>
  <text x="360" y="231" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dbeafe">uy papkasi / .gitconfig</text>

  <!-- SYSTEM (eng past, eng zaif) -->
  <rect x="120" y="260" width="480" height="78" rx="8" fill="#475569"/>
  <text x="360" y="289" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">SYSTEM  (--system)</text>
  <text x="360" y="311" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#e2e8f0">kompyuterdagi hamma foydalanuvchi</text>
  <text x="360" y="329" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#e2e8f0">Git o'rnatilgan papka / etc/gitconfig</text>

  <!-- ustuvorlik strelkasi (chap tomon) -->
  <line x1="74" y1="330" x2="74" y2="92" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="74,72 66,90 82,90" fill="#dc2626"/>
  <text x="50" y="210" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626" transform="rotate(-90 50 210)">kuchayib boradi</text>

  <!-- o'ng tomon izoh -->
  <text x="646" y="103" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">eng kuchli</text>
  <text x="646" y="300" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">eng zaif</text>

  <!-- pastki qoida qutisi -->
  <rect x="120" y="366" width="480" height="76" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="392" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#b45309">Qoida:  local  &gt;  global  &gt;  system</text>
  <text x="360" y="416" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Bir sozlama bir necha darajada bo'lsa, Git eng yuqoridagisini</text>
  <text x="360" y="434" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">(local) tanlaydi; u bo'lmasa global'ga, keyin system'ga qaraydi</text>
</svg>
