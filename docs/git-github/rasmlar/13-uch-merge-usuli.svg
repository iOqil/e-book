<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>PR ni qo'shishning uch usuli va ularning main tarixiga ta'siri: Merge commit branchdagi hamma commitni saqlaydi va merge commit qo'shadi, Squash and merge hamma commitni bitta yangi commitga siqadi, Rebase and merge commitlarni main ustiga chiziqli ko'chiradi</title>

  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>

  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">PR ni qo'shishning 3 usuli: main tarixi qanday ko'rinadi</text>

  <text x="380" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">PR'da branchda 2 ta commit bor (F1, F2). Har usul main tarixini boshqacha qoldiradi.</text>

  <!-- ===================== 1) MERGE COMMIT ===================== -->
  <text x="130" y="90" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">Merge commit</text>
  <rect x="20" y="100" width="220" height="300" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>

  <!-- main chizig'i -->
  <line x1="70" y1="140" x2="70" y2="370" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="70" cy="150" r="11" fill="#1e293b"/><text x="92" y="155" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">main</text>
  <!-- branch -->
  <circle cx="170" cy="210" r="11" fill="#16a34a"/><text x="190" y="215" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">F1</text>
  <circle cx="170" cy="270" r="11" fill="#16a34a"/><text x="190" y="275" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">F2</text>
  <line x1="70" y1="160" x2="160" y2="205" stroke="#16a34a" stroke-width="2"/>
  <line x1="170" y1="221" x2="170" y2="259" stroke="#16a34a" stroke-width="2"/>
  <!-- merge commit -->
  <circle cx="70" cy="340" r="11" fill="#2563eb"/><text x="92" y="345" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">M</text>
  <line x1="70" y1="160" x2="70" y2="329" stroke="#94a3b8" stroke-width="2"/>
  <line x1="170" y1="281" x2="78" y2="332" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="392" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">F1, F2 saqlanadi + M</text>

  <!-- ===================== 2) SQUASH ===================== -->
  <text x="380" y="90" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">Squash and merge</text>
  <rect x="270" y="100" width="220" height="300" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>

  <line x1="380" y1="140" x2="380" y2="370" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="380" cy="150" r="11" fill="#1e293b"/><text x="402" y="155" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">main</text>
  <!-- bitta squash commit -->
  <circle cx="380" cy="250" r="13" fill="#16a34a"/><text x="404" y="255" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">S</text>
  <text x="380" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">F1+F2 = bitta</text>
  <text x="380" y="309" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">yangi commit (S)</text>
  <text x="380" y="392" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tarix toza, chiziqli</text>

  <!-- ===================== 3) REBASE ===================== -->
  <text x="630" y="90" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#7c3aed">Rebase and merge</text>
  <rect x="520" y="100" width="220" height="300" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>

  <line x1="630" y1="140" x2="630" y2="370" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="630" cy="150" r="11" fill="#1e293b"/><text x="652" y="155" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">main</text>
  <circle cx="630" cy="240" r="11" fill="#7c3aed"/><text x="652" y="245" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#7c3aed">F1</text>
  <circle cx="630" cy="320" r="11" fill="#7c3aed"/><text x="652" y="325" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#7c3aed">F2</text>
  <text x="630" y="392" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">F1, F2 chiziqli, M yo'q</text>

  <!-- pastki izoh -->
  <text x="380" y="430" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b" font-weight="bold">Merge: to'liq tarix (kim nimani qachon). Squash: 1 PR = 1 commit. Rebase: chiziqli, merge commitsiz.</text>
  <text x="380" y="456" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Hamma usulda yakuniy KOD bir xil — faqat main tarixining ko'rinishi farq qiladi.</text>
</svg>
