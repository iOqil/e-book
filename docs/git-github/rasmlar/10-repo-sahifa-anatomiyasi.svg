<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>GitHub repozitoriy sahifasining anatomiyasi: yuqorida repo nomi va Star/Fork/Watch tugmalari, ostida Code/Issues/Pull requests/Actions/Settings tablar, markazda fayllar ro'yxati va README</title>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">GitHub repo sahifasi: nima qayerda turadi</text>

  <!-- repo nomi qatori -->
  <rect x="40" y="56" width="640" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="56" y="84" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#475569">foydalanuvchi <tspan fill="#2563eb" font-weight="bold">/ mening-loyiham</tspan></text>

  <!-- Star / Fork / Watch tugmalari -->
  <rect x="430" y="66" width="76" height="26" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="468" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#b45309">Star</text>
  <rect x="514" y="66" width="76" height="26" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="552" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Fork</text>
  <rect x="598" y="66" width="76" height="26" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="636" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Watch</text>

  <!-- tablar qatori -->
  <rect x="40" y="112" width="640" height="40" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="48" y="118" width="86" height="28" rx="6" fill="#2563eb"/>
  <text x="91" y="137" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Code</text>
  <text x="178" y="137" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Issues</text>
  <text x="300" y="137" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Pull requests</text>
  <text x="424" y="137" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Actions</text>
  <text x="524" y="137" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Projects</text>
  <text x="636" y="137" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Settings</text>

  <!-- fayllar ro'yxati (chap) -->
  <rect x="40" y="166" width="380" height="190" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="40" y="166" width="380" height="32" rx="8" fill="#dbeafe"/>
  <text x="56" y="187" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">main</text>
  <text x="230" y="187" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">oxirgi commit: "Birinchi commit"</text>
  <line x1="40" y1="230" x2="420" y2="230" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="40" y1="262" x2="420" y2="262" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="40" y1="294" x2="420" y2="294" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#f59e0b">.gitignore</text>
  <text x="60" y="254" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">LICENSE</text>
  <text x="60" y="286" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">README.md</text>
  <text x="60" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">src/</text>
  <text x="300" y="324" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">fayllar va papkalar</text>

  <!-- README (o'ng) -->
  <rect x="436" y="166" width="244" height="190" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="436" y="166" width="244" height="32" rx="8" fill="#dcfce7"/>
  <text x="558" y="187" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">README.md (loyiha yuzi)</text>
  <text x="558" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b"># Mening loyiham</text>
  <line x1="456" y1="244" x2="660" y2="244" stroke="#e2e8f0" stroke-width="6"/>
  <line x1="456" y1="266" x2="630" y2="266" stroke="#e2e8f0" stroke-width="6"/>
  <line x1="456" y1="288" x2="660" y2="288" stroke="#e2e8f0" stroke-width="6"/>
  <line x1="456" y1="310" x2="600" y2="310" stroke="#e2e8f0" stroke-width="6"/>
  <text x="558" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tashrif buyuruvchi birinchi shuni o'qiydi</text>

  <!-- pastki izohlar -->
  <text x="360" y="390" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Code — fayllar; Issues — vazifa/xatolar; Pull requests — o'zgarish takliflari</text>
  <text x="360" y="416" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Actions — avtomatik tekshiruvlar; Settings — sozlamalar (faqat egasi)</text>
  <text x="360" y="446" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Star — yoqtirish/belgilash, Fork — o'zingizga nusxa olish, Watch — yangiliklarni kuzatish</text>
</svg>
