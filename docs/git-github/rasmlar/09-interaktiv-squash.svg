<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460">
  <title>Interaktiv rebase squash: uchta mayda commit (pick, squash, squash) bitta toza commitga birlashtiriladi, tarix soddalashadi</title>

  <rect x="0" y="0" width="720" height="460" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Interaktiv rebase: 3 commitni 1  taga squash qilish</text>

  <!-- CHAP: tahrir oynasi (git rebase -i HEAD~3) -->
  <text x="200" y="74" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#475569">git rebase -i HEAD~3 ochgan oyna</text>
  <rect x="40" y="90" width="320" height="190" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>

  <text x="60" y="124" font-family="Consolas, Segoe UI, monospace" font-size="14" fill="#86efac">pick</text>
  <text x="108" y="124" font-family="Consolas, Segoe UI, monospace" font-size="14" fill="#e2e8f0">a1b2c3d Login formani qoshdim</text>

  <text x="60" y="158" font-family="Consolas, Segoe UI, monospace" font-size="14" fill="#fbbf24">squash</text>
  <text x="128" y="158" font-family="Consolas, Segoe UI, monospace" font-size="14" fill="#e2e8f0">e4f5a6b tugma rangi</text>

  <text x="60" y="192" font-family="Consolas, Segoe UI, monospace" font-size="14" fill="#fbbf24">squash</text>
  <text x="128" y="192" font-family="Consolas, Segoe UI, monospace" font-size="14" fill="#e2e8f0">c7d8e9f matn xatosi</text>

  <line x1="56" y1="212" x2="344" y2="212" stroke="#475569" stroke-width="1"/>
  <text x="60" y="236" font-family="Consolas, Segoe UI, monospace" font-size="13" fill="#94a3b8">pick   = shu commitni qoldir</text>
  <text x="60" y="260" font-family="Consolas, Segoe UI, monospace" font-size="13" fill="#94a3b8">squash = yuqoridagiga qo'sh</text>

  <!-- O'q -->
  <text x="412" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="34" fill="#7c3aed">-&gt;</text>

  <!-- O'NG: natija -->
  <text x="560" y="74" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#475569">Natija: bitta toza commit</text>
  <line x1="460" y1="170" x2="680" y2="170" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="490" cy="170" r="16" fill="#2563eb"/>
  <text x="490" y="175" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff">C1</text>
  <circle cx="600" cy="170" r="20" fill="#16a34a"/>
  <text x="600" y="175" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">F*</text>
  <text x="600" y="212" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">3 commit birlashdi</text>
  <text x="600" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">"Login formasi qo'shildi"</text>

  <!-- OLDIN/KEYIN solishtirma pastda -->
  <rect x="40" y="320" width="640" height="110" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="60" y="348" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">Nega squash?</text>
  <text x="60" y="374" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">"tugma rangi", "matn xatosi" — bular tarixda alohida turishi shart emas.</text>
  <text x="60" y="398" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">Bitta mantiqiy ish = bitta commit. Tarix o'qiladigan va toza bo'ladi.</text>
  <text x="60" y="420" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">fixup = squash kabi, lekin xabarini tashlab yuboradi (so'ramaydi).</text>
</svg>
