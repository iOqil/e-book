  <text x="188" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">o'zini siz qilib ko'rsatib commit qiladi.</text>

  <!-- O'NG: imzolangan -->
  <rect x="372" y="60" width="320" height="180" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="532" y="88" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">Imzolangan commit</text>
  <rect x="400" y="104" width="264" height="78" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
