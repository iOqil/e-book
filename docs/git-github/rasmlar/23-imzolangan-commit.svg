  <text x="70" y="148" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Message: "to'lov tuzatildi"</text>
  <text x="70" y="170" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">Imzo: yo'q</text>
