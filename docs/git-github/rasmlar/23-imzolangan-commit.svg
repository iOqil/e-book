<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>Imzolangan commit: imzosiz commit'da muallifni har kim soxtalashtirishi mumkin, imzolangan commit esa shaxsiy kalit bilan muhrlanadi va GitHub'da yashil Verified belgisi paydo bo'ladi</title>
  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Imzolangan commit — "buni rostdan men yozdim"</text>

  <!-- CHAP: imzosiz -->
  <rect x="28" y="60" width="320" height="180" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
