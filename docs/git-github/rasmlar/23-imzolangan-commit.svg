  <text x="414" y="148" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Message: "to'lov tuzatildi"</text>
  <text x="414" y="170" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Imzo: ✓ shaxsiy kalit bilan</text>
