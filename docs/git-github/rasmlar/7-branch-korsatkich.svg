<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360">
  <title>Branch commitga ishora qiluvchi arzon ko'rsatkich: HEAD branchga, branch esa commitga ishora qiladi (40 baytli ishora, nusxa emas)</title>
  <rect x="0" y="0" width="700" height="360" fill="#f8fafc"/>

  <text x="350" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Branch = commitga arzon ko'rsatkich</text>
  <text x="350" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">HEAD -&gt; branch -&gt; commit (har biri keyingisiga "ishora qiladi")</text>

  <!-- commitlar zanjiri -->
  <circle cx="180" cy="250" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="180" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">C1</text>
  <text x="180" y="266" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">a1b2c3d</text>

  <circle cx="350" cy="250" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="350" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">C2</text>
  <text x="350" y="266" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">e4f5g6h</text>

  <circle cx="520" cy="250" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="520" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">C3</text>
  <text x="520" y="266" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">i7j8k9l</text>

  <!-- commit -> ota commit strelkalari (orqaga) -->
  <line x1="320" y1="250" x2="210" y2="250" stroke="#94a3b8" stroke-width="2" marker-end="url(#gray)"/>
  <line x1="490" y1="250" x2="380" y2="250" stroke="#94a3b8" stroke-width="2" marker-end="url(#gray)"/>
  <text x="265" y="300" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">har commit otasini biladi</text>

  <!-- branch yorlig'i: main -->
  <rect x="465" y="150" width="110" height="34" rx="6" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
  <text x="520" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">main</text>
  <line x1="520" y1="184" x2="520" y2="216" stroke="#16a34a" stroke-width="2.5" marker-end="url(#green)"/>

  <!-- HEAD yorlig'i -->
  <rect x="470" y="92" width="100" height="32" rx="6" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <text x="520" y="113" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">HEAD</text>
  <line x1="520" y1="124" x2="520" y2="148" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#amber)"/>

  <text x="600" y="170" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">= C3</text>
  <text x="585" y="110" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">= main</text>

  <!-- pastki izoh -->
  <text x="350" y="338" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Branch fayli ichida atigi bitta commit hash turadi -- shuning uchun yangi branch deyarli bepul</text>

  <defs>
    <marker id="gray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/></marker>
    <marker id="green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#16a34a"/></marker>
    <marker id="amber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#f59e0b"/></marker>
  </defs>
</svg>
