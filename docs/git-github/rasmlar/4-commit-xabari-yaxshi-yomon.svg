<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>Yaxshi va yomon commit xabari taqqoslangani: yomon xabarlar noaniq va qisqa ('fix', 'asdf'), yaxshi xabar esa qisqa aniq sarlavha va nima/nega tushuntiruvidan iborat</title>
  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Commit xabari: yomon vs yaxshi</text>

  <!-- yomon panel -->
  <rect x="30" y="60" width="320" height="330" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="190" y="88" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">❌ Yomon</text>

  <rect x="50" y="104" width="280" height="40" rx="6" fill="#fff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="64" y="129" font-family="Consolas, monospace" font-size="14" fill="#991b1b">"fix"</text>
  <rect x="50" y="152" width="280" height="40" rx="6" fill="#fff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="64" y="177" font-family="Consolas, monospace" font-size="14" fill="#991b1b">"o'zgarishlar"</text>
  <rect x="50" y="200" width="280" height="40" rx="6" fill="#fff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="64" y="225" font-family="Consolas, monospace" font-size="14" fill="#991b1b">"asdf"</text>
  <rect x="50" y="248" width="280" height="40" rx="6" fill="#fff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="64" y="273" font-family="Consolas, monospace" font-size="14" fill="#991b1b">"ishladi nihoyat!!!"</text>

  <text x="190" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#991b1b">Nima o'zgardi? Nega? Bilib bo'lmaydi.</text>
  <text x="190" y="342" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#991b1b">6 oydan keyin o'zingiz ham</text>
  <text x="190" y="362" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#991b1b">tushunmaysiz.</text>

  <!-- yaxshi panel -->
  <rect x="370" y="60" width="320" height="330" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="530" y="88" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">✅ Yaxshi</text>

  <rect x="390" y="104" width="280" height="40" rx="6" fill="#fff" stroke="#86efac" stroke-width="1.5"/>
  <text x="404" y="129" font-family="Consolas, monospace" font-size="13" fill="#166534">"Login formasiga tekshiruv qo'shildi"</text>
  <rect x="390" y="152" width="280" height="40" rx="6" fill="#fff" stroke="#86efac" stroke-width="1.5"/>
  <text x="404" y="177" font-family="Consolas, monospace" font-size="13" fill="#166534">"Narx hisobidagi xato tuzatildi"</text>
  <rect x="390" y="200" width="280" height="40" rx="6" fill="#fff" stroke="#86efac" stroke-width="1.5"/>
  <text x="404" y="225" font-family="Consolas, monospace" font-size="13" fill="#166534">"README ga o'rnatish bo'limi"</text>

  <rect x="390" y="252" width="280" height="76" rx="6" fill="#fff" stroke="#86efac" stroke-width="1.5"/>
  <text x="404" y="274" font-family="Consolas, monospace" font-size="13" fill="#166534">"Savatda dublikat tovar tuzatildi"</text>
  <text x="404" y="296" font-family="Consolas, monospace" font-size="13" fill="#15803d">(bo'sh satr)</text>
  <text x="404" y="318" font-family="Consolas, monospace" font-size="13" fill="#15803d">Tugma 2 marta bosilsa edi.</text>

  <text x="530" y="356" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">Sarlavha ~50 belgi, nimani aytadi.</text>
  <text x="530" y="378" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">Kerak bo'lsa pastda "nega"si.</text>

  <text x="360" y="416" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Qoida: sarlavha "Nima qildi?" savoliga javob bersin — qisqa, aniq, ish-buyruq ohangida</text>
</svg>
