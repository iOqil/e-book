<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>Profil README: nomi akkaunt nomi bilan bir xil bo'lgan maxsus repodagi README.md fayli GitHub profil sahifasining tepasida ko'rinadi</title>
  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Profil README qanday ishlaydi</text>

  <!-- LEFT: special repo -->
  <text x="180" y="74" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">Maxsus repo</text>
  <rect x="40" y="86" width="280" height="200" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="116" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Repo nomi = akkaunt nomi:</text>
  <rect x="70" y="128" width="220" height="32" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="180" y="149" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">oqil / oqil</text>
  <text x="180" y="188" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">ichida bitta fayl:</text>
  <rect x="70" y="200" width="220" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="180" y="221" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">README.md</text>
  <text x="180" y="262" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Public bo'lishi shart</text>

  <!-- arrow -->
  <line x1="320" y1="186" x2="392" y2="186" stroke="#475569" stroke-width="2.5"/>
  <polygon points="392,186 382,181 382,191" fill="#475569"/>
  <text x="356" y="176" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">avtomatik</text>

  <!-- RIGHT: profile page -->
  <text x="540" y="74" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">Profil sahifasi</text>
  <rect x="400" y="86" width="280" height="200" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <!-- avatar -->
  <circle cx="438" cy="120" r="18" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="468" y="118" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Oqil</text>
  <text x="468" y="136" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">@oqil</text>
  <!-- README card highlighted -->
  <rect x="420" y="152" width="240" height="118" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="540" y="176" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Salom! Men Oqil</text>
  <text x="540" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Dasturlashni o'rgataman.</text>
  <text x="540" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Texnologiyalar, havolalar,</text>
  <text x="540" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">statistika va badge'lar</text>

  <!-- bottom note -->
  <text x="360" y="328" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">README.md ichidagi matn profilning eng tepasida chiroyli ko'rinadi</text>
  <text x="360" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Bu sizning "raqamli tashrif qog'ozingiz" — kim ekanligingiz, nima qilishingiz</text>
  <text x="360" y="386" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Markdown ishlaydi: sarlavha, ro'yxat, rasm, havola, badge — hammasi mumkin</text>
</svg>
