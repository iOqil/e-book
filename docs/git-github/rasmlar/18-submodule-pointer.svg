<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>Submodule mexanikasi: ota-repo ichida bola-repoga ko'rsatkich (gitlink) saqlanadi — fayllar emas, faqat aniq commit hashiga ishora</title>

  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Submodule: ota-repo bola-repoga ko'rsatkich saqlaydi</text>

  <!-- Ota repo -->
  <rect x="40" y="64" width="320" height="300" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="200" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">asosiy-loyiha (ota-repo)</text>

  <!-- ota repo fayllari -->
  <rect x="64" y="110" width="272" height="34" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="80" y="132" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">README.md</text>

  <rect x="64" y="150" width="272" height="34" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="80" y="172" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">.gitmodules</text>

  <!-- gitlink ko'rsatkich -->
  <rect x="64" y="196" width="272" height="120" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="80" y="220" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">vendor/ui  (ko'rsatkich)</text>
  <text x="80" y="244" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">mode: 160000 (gitlink)</text>
  <text x="80" y="266" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">faqat bitta hash saqlanadi:</text>
  <text x="80" y="292" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">a1b2c3d</text>
  <text x="142" y="292" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(fayllar bu yerda yo'q!)</text>

  <text x="200" y="344" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Ota-repo bola fayllarini nusxalamaydi</text>

  <!-- strelka -->
  <line x1="360" y1="256" x2="448" y2="256" stroke="#dc2626" stroke-width="3"/>
  <polygon points="448,248 466,256 448,264" fill="#dc2626"/>
  <text x="412" y="244" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">ishora</text>

  <!-- Bola repo -->
  <rect x="468" y="64" width="232" height="300" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="584" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">kutubxona-ui (bola-repo)</text>
  <text x="584" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">o'zining alohida tarixi bor</text>

  <!-- bola commit zanjiri -->
  <circle cx="520" cy="160" r="16" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="520" y="165" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">c1</text>
  <line x1="536" y1="160" x2="568" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="584" cy="160" r="16" fill="#fde68a" stroke="#dc2626" stroke-width="2.5"/>
  <text x="584" y="165" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">a1b2c3d</text>
  <line x1="600" y1="160" x2="632" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="648" cy="160" r="16" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="648" y="165" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">c3</text>

  <text x="584" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">ota aynan shu commitga qotirilgan</text>

  <rect x="492" y="220" width="184" height="34" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="508" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">button.js</text>
  <rect x="492" y="262" width="184" height="34" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="508" y="284" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">input.js</text>
  <text x="584" y="328" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">asl fayllar shu yerda yashaydi</text>

  <!-- pastki izoh -->
  <text x="360" y="394" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">clone --recurse-submodules: ota-repo + ko'rsatkich aytgan commitdagi bola fayllari birga keladi</text>
  <text x="360" y="416" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Oddiy clone: ota keladi, vendor/ui esa bo'sh qoladi — keyin update --init kerak</text>
</svg>
