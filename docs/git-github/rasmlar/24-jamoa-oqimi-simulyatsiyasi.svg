<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>To'liq jamoa oqimi simulyatsiyasi: bo'sh repodan init, .gitignore va birinchi commit, GitHubga push, feature branch va PR, review va merge, tag/release, oxirida GitHub Pages deploy bosqichlari ketma-ket</title>

  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>

  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Yakuniy loyiha oqimi: noldan deploygacha</text>

  <!-- 1. init -->
  <rect x="30" y="64" width="160" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="90" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">1. init</text>
  <text x="110" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">bo'sh repo + .gitignore</text>

  <!-- 2. birinchi commit -->
  <rect x="220" y="64" width="160" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="90" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">2. commit</text>
  <text x="300" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">add + birinchi commit</text>

  <!-- 3. push -->
  <rect x="410" y="64" width="160" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="490" y="90" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">3. push</text>
  <text x="490" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">GitHubga yuborish</text>

  <!-- 4. feature branch -->
  <rect x="600" y="64" width="130" height="64" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="665" y="90" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b45309">4. branch</text>
  <text x="665" y="112" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">feature/...</text>

  <!-- yon strelkalar 1->2->3->4 -->
  <line x1="190" y1="96" x2="218" y2="96" stroke="#475569" stroke-width="2" marker-end="url(#a24)"/>
  <line x1="380" y1="96" x2="408" y2="96" stroke="#475569" stroke-width="2" marker-end="url(#a24)"/>
  <line x1="570" y1="96" x2="598" y2="96" stroke="#475569" stroke-width="2" marker-end="url(#a24)"/>

  <!-- pastga strelka 4->5 -->
  <line x1="665" y1="128" x2="665" y2="168" stroke="#475569" stroke-width="2" marker-end="url(#a24)"/>

  <!-- 5. PR -->
  <rect x="600" y="172" width="130" height="64" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="665" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b45309">5. PR</text>
  <text x="665" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Pull Request ochish</text>

  <!-- 6. review -->
  <rect x="410" y="172" width="160" height="64" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="490" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b45309">6. review</text>
  <text x="490" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">CI test + konflikt hal</text>

  <!-- 7. merge -->
  <rect x="220" y="172" width="160" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="300" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">7. merge</text>
  <text x="300" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">main'ga qo'shildi</text>

  <!-- chapga strelka 5<-6<-7 -->
  <line x1="598" y1="204" x2="572" y2="204" stroke="#475569" stroke-width="2" marker-end="url(#a24)"/>
  <line x1="408" y1="204" x2="382" y2="204" stroke="#475569" stroke-width="2" marker-end="url(#a24)"/>

  <!-- pastga strelka 7->8 -->
  <line x1="300" y1="236" x2="300" y2="276" stroke="#475569" stroke-width="2" marker-end="url(#a24)"/>

  <!-- 8. tag/release -->
  <rect x="220" y="280" width="160" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="300" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#7c3aed">8. tag / release</text>
  <text x="300" y="328" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">v1.0.0 reliz</text>

  <!-- 9. deploy -->
  <rect x="410" y="280" width="160" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="490" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">9. deploy</text>
  <text x="490" y="328" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Pages + Actions CI</text>

  <!-- o'ngga strelka 8->9 -->
  <line x1="380" y1="312" x2="408" y2="312" stroke="#475569" stroke-width="2" marker-end="url(#a24)"/>

  <!-- pastki izohlar -->
  <rect x="30" y="372" width="700" height="74" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="50" y="398" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Takror sikl: har yangi vazifa uchun 4 dan 7 gacha qadamlar qaytadan aylanadi.</text>
  <text x="50" y="422" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Ko'k = lokal, yashil = remote/avtomatik, sariq = jamoa hamkorligi (branch/PR/review), binafsha = reliz.</text>
  <text x="50" y="440" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">main har doim ishlaydigan holatda: faqat review va CI o'tgan kod main'ga qo'shiladi.</text>

  <defs>
    <marker id="a24" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
