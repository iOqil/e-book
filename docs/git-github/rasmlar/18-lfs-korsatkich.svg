<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>Git LFS mexanikasi: katta binar fayl o'rniga repoga kichik matnli ko'rsatkich saqlanadi, asl fayl alohida LFS serverda turadi</title>

  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Git LFS: katta fayl o'rniga kichik ko'rsatkich</text>

  <!-- LF'siz holat (chap) -->
  <text x="180" y="70" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">LFS'siz: repo shishadi</text>
  <rect x="50" y="84" width="260" height="120" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="180" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b91c1c">.git tarixi</text>
  <rect x="74" y="124" width="212" height="60" rx="6" fill="#dc2626"/>
  <text x="180" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">dizayn.psd</text>
  <text x="180" y="172" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff">500 MB — har versiyasi to'liq saqlanadi</text>
  <text x="180" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">clone sekin, repo gigabaytga o'sadi</text>

  <!-- LFS bilan holat (o'ng) -->
  <text x="540" y="70" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">LFS bilan: repo yengil</text>
  <rect x="410" y="84" width="260" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="540" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#15803d">.git tarixi</text>
  <rect x="434" y="124" width="212" height="60" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="540" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">dizayn.psd -> ko'rsatkich</text>
  <text x="540" y="168" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">atigi ~130 bayt matn</text>
  <text x="540" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">clone tez, tarix kichik qoladi</text>

  <!-- ko'rsatkich matni -->
  <rect x="50" y="252" width="380" height="150" rx="10" fill="#1e293b"/>
  <text x="68" y="278" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0">Repodagi ko'rsatkich fayl mazmuni:</text>
  <text x="68" y="306" font-family="Consolas, Menlo, monospace" font-size="13" fill="#7dd3fc">version https://git-lfs.github.com/spec/v1</text>
  <text x="68" y="332" font-family="Consolas, Menlo, monospace" font-size="13" fill="#86efac">oid sha256:33737e69...dfb12c</text>
  <text x="68" y="358" font-family="Consolas, Menlo, monospace" font-size="13" fill="#fcd34d">size 524288000</text>
  <text x="68" y="388" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">oid = asl faylning barmoq izi (hash)</text>

  <!-- LFS server -->
  <rect x="466" y="252" width="204" height="150" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="568" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#6d28d9">LFS serveri</text>
  <text x="568" y="302" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(asl katta fayllar shu yerda)</text>
  <rect x="492" y="316" width="152" height="50" rx="6" fill="#7c3aed"/>
  <text x="568" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">dizayn.psd</text>
  <text x="568" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#e9d5ff">500 MB binar</text>
  <text x="568" y="388" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#6d28d9">checkout paytida yuklab olinadi</text>

  <!-- oid bog'lovchi strelka -->
  <line x1="430" y1="332" x2="488" y2="338" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="5 3"/>
  <polygon points="488,330 504,340 486,346" fill="#7c3aed"/>

  <text x="360" y="428" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">git lfs track "*.psd" -> .gitattributes -> shu turdagi fayllar avtomatik ko'rsatkichga aylanadi</text>
</svg>
