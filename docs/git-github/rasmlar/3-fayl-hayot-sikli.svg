<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <title>Fayl hayot sikli: untracked holatdan git add bilan staged, git commit bilan committed (unmodified), tahrirdan keyin modified, yana git add bilan staged'ga qaytish</title>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="420" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Faylning hayot sikli</text>

  <defs>
    <marker id="ar" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Untracked -->
  <rect x="50" y="80" width="180" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="140" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">Untracked</text>
  <text x="140" y="130" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#991b1b">kuzatilmaydigan (yangi)</text>

  <!-- Staged -->
  <rect x="490" y="80" width="180" height="64" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="580" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#b45309">Staged</text>
  <text x="580" y="130" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#92400e">tayyorlangan</text>

  <!-- Committed / Unmodified -->
  <rect x="490" y="280" width="180" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="580" y="308" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#15803d">Committed</text>
  <text x="580" y="330" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#166534">saqlangan (unmodified)</text>

  <!-- Modified -->
  <rect x="50" y="280" width="180" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="308" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">Modified</text>
  <text x="140" y="330" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e40af">o'zgartirilgan</text>

  <!-- Untracked -> Staged (git add) -->
  <line x1="230" y1="100" x2="486" y2="100" stroke="#475569" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="358" y="90" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">git add</text>

  <!-- Staged -> Committed (git commit) -->
  <line x1="580" y1="146" x2="580" y2="276" stroke="#475569" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="592" y="216" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">git commit</text>

  <!-- Committed -> Modified (tahrir) -->
  <line x1="486" y1="312" x2="234" y2="312" stroke="#475569" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="358" y="302" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">faylni tahrir qilasiz</text>

  <!-- Modified -> Staged (git add again) -->
  <line x1="160" y1="276" x2="510" y2="148" stroke="#475569" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="320" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">git add (qaytadan)</text>

  <!-- izoh -->
  <text x="360" y="386" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Bir marta commit qilingan fayl endi "kuzatiladigan" (tracked): tahrir qilsangiz Modified bo'ladi,</text>
  <text x="360" y="406" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">qaytadan add va commit qilib yangi suratga aylanadi. Untracked holat faqat birinchi marta uchraydi.</text>
</svg>
