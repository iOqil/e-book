<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460">
  <title>gitignore qatlamlari: global gitignore (butun kompyuter uchun), repo .gitignore (loyiha uchun) va til shabloni qoidalari birga ishlab, qaysi fayllar kuzatilishini hal qiladi</title>
  <rect x="0" y="0" width="720" height="460" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">gitignore qatlamlari — uchta darajada qoida</text>

  <!-- Qatlam 1: Global -->
  <rect x="40" y="58" width="640" height="96" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="62" y="84" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#7c3aed">1. Global gitignore — butun kompyuter uchun</text>
  <text x="62" y="106" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">~/.gitignore_global · git config --global core.excludesfile</text>
  <text x="62" y="128" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Faqat sizga tegishli, loyihaga aloqasiz fayllar:</text>
  <text x="62" y="146" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">.DS_Store    Thumbs.db    .idea/    *.swp</text>

  <!-- Qatlam 2: Til shabloni -->
  <rect x="40" y="166" width="640" height="96" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="62" y="192" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#b45309">2. Til/freymvork shabloni — tayyor ro'yxat</text>
  <text x="62" y="214" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">github.com/github/gitignore (Node.gitignore, Python.gitignore ...)</text>
  <text x="62" y="236" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Texnologiya generatsiya qiladigan fayllar:</text>
  <text x="62" y="254" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">node_modules/    __pycache__/    target/    *.class</text>

  <!-- Qatlam 3: Repo -->
  <rect x="40" y="274" width="640" height="96" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="62" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">3. Repo .gitignore — shu loyihaga xos</text>
  <text x="62" y="322" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">loyiha ildizidagi .gitignore · commit qilinadi, jamoa ulashadi</text>
  <text x="62" y="344" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">Sirlar va shu loyiha chiqaradigan fayllar:</text>
  <text x="62" y="362" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">.env    *.log    dist/    config.local.json</text>

  <!-- Pastki natija -->
  <text x="360" y="398" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#475569">↓</text>
  <rect x="160" y="408" width="400" height="40" rx="8" fill="#1e293b"/>
  <text x="360" y="433" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Uchala qoida birlashadi → Git nimani kuzatishini hal qiladi</text>
</svg>
