<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470">
  <title>Commit obyektining anatomiyasi: SHA-1 hash, parent ko'rsatkichi, tree, muallif/sana va xabar maydonlari</title>

  <rect x="0" y="0" width="700" height="470" fill="#f8fafc"/>

  <text x="350" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Commit nimadan iborat?</text>

  <!-- hash plashkasi (tepada) -->
  <rect x="150" y="58" width="400" height="46" rx="8" fill="#2563eb"/>
  <text x="350" y="80" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dbeafe">commit'ning nomi = SHA-1 hash (40 belgi)</text>
  <text x="350" y="98" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="14" font-weight="bold" fill="#ffffff">19e61d4c7f71d540f813fe6387c795ec70904b3a</text>

  <!-- asosiy quti -->
  <rect x="120" y="124" width="460" height="262" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>

  <!-- tree -->
  <rect x="140" y="142" width="420" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="158" y="164" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">tree</text>
  <text x="158" y="183" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">o'sha ondagi BARCHA fayllar va papkalar surati</text>

  <!-- parent -->
  <rect x="140" y="200" width="420" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="158" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">parent</text>
  <text x="158" y="241" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">oldingi commit'ning hash'i (zanjirni hosil qiladi)</text>

  <!-- author -->
  <rect x="140" y="258" width="420" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="158" y="280" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">author / committer + sana</text>
  <text x="158" y="299" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Malika Tosheva &lt;malika@example.com&gt; 11-iyun 2026</text>

  <!-- message -->
  <rect x="140" y="316" width="420" height="52" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="158" y="338" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#475569">message (xabar)</text>
  <text x="158" y="357" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">"docs.txt qo'shildi (Malika)"</text>

  <!-- pastki izoh -->
  <text x="350" y="410" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Hash shu to'rt maydondan hisoblanadi: bittasi o'zgarsa — hash butunlay boshqa bo'ladi.</text>
  <text x="350" y="438" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">Shuning uchun hash — yaxlitlik (buzilmaganlik) kafolati.</text>
</svg>
