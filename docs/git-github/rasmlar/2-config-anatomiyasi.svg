<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410">
  <title>git config buyrug'i anatomiyasi: git config (sozlamalar buyrug'i), --global (daraja), user.name (kalit, bo'lim.nom), tirnoq ichidagi qiymat — har bir qism alohida belgilangan</title>

  <rect x="0" y="0" width="720" height="410" fill="#f8fafc"/>

  <text x="360" y="38" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">git config buyrug'i — qismlarga ajratamiz</text>

  <!-- buyruq qismlari (qutilar) -->
  <!-- git config -->
  <rect x="40" y="88" width="150" height="48" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="115" y="118" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="bold" fill="#1e293b">git config</text>

  <!-- global bayrog'i -->
  <rect x="200" y="88" width="120" height="48" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="260" y="118" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="bold" fill="#1e3a8a">--global</text>

  <!-- user.name -->
  <rect x="330" y="88" width="160" height="48" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="410" y="118" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="bold" fill="#15803d">user.name</text>

  <!-- "Oqil Imomnazarov" -->
  <rect x="500" y="88" width="186" height="48" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="593" y="118" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="bold" fill="#b45309">"Oqil Imom..."</text>

  <!-- bog'lovchi chiziqlar pastga izohlarga -->
  <line x1="115" y1="136" x2="115" y2="172" stroke="#475569" stroke-width="1.5"/>
  <line x1="260" y1="136" x2="260" y2="200" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="410" y1="136" x2="410" y2="240" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="593" y1="136" x2="593" y2="300" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- izohlar -->
  <text x="115" y="190" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#475569">sozlamalar buyrug'i</text>

  <text x="260" y="218" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#2563eb">daraja</text>
  <text x="260" y="236" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(--global/--local/--system)</text>

  <text x="410" y="258" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#16a34a">kalit:  bo'lim.nom</text>
  <text x="410" y="276" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">nuqta bo'lim va nomni ajratadi</text>

  <text x="593" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#b45309">qiymat</text>
  <text x="593" y="336" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">bo'sh joy bo'lsa tirnoq ichida</text>

  <!-- pastki ikki holat -->
  <rect x="40" y="356" width="316" height="38" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="198" y="380" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#15803d">Qiymat bilan = YOZADI (o'rnatadi)</text>

  <rect x="370" y="356" width="316" height="38" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="528" y="380" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e3a8a">Qiymatsiz = O'QIYDI (ko'rsatadi)</text>
</svg>
