<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <title>GitHub Projects kanban doskasi: Backlog, In progress va Done ustunlari va ular orasida ko'chadigan vazifa kartochkalari</title>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="420" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">GitHub Projects: kanban doska</text>

  <!-- Ustun 1: Backlog -->
  <rect x="24" y="58" width="216" height="328" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="132" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Backlog</text>
  <text x="132" y="103" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">rejadagi vazifalar</text>

  <rect x="38" y="116" width="188" height="56" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="138" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">#21 Qidiruv qo'shish</text>
  <rect x="52" y="148" width="62" height="16" rx="8" fill="#dbeafe"/>
  <text x="83" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">enhancement</text>

  <rect x="38" y="184" width="188" height="56" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="206" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">#24 Dark mode</text>
  <rect x="52" y="216" width="62" height="16" rx="8" fill="#dbeafe"/>
  <text x="83" y="228" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">enhancement</text>

  <!-- Ustun 2: In progress -->
  <rect x="252" y="58" width="216" height="328" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#b45309">In progress</text>
  <text x="360" y="103" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">hozir bajarilyapti</text>

  <rect x="266" y="116" width="188" height="62" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="280" y="138" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">#12 Login xatosi</text>
  <rect x="280" y="148" width="34" height="16" rx="8" fill="#fee2e2"/>
  <text x="297" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">bug</text>
  <circle cx="430" cy="156" r="11" fill="#16a34a"/>
  <text x="430" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">A</text>

  <!-- Ustun 3: Done -->
  <rect x="480" y="58" width="216" height="328" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="588" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">Done</text>
  <text x="588" y="103" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">tugadi (yopiq)</text>

  <rect x="494" y="116" width="188" height="56" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="508" y="138" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">#8 README yozish</text>
  <text x="508" y="160" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">tugallandi</text>

  <rect x="494" y="184" width="188" height="56" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="508" y="206" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">#5 Loyiha sozlash</text>
  <text x="508" y="228" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">tugallandi</text>

  <!-- ko'chish strelkalari -->
  <defs>
    <marker id="kb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <line x1="230" y1="300" x2="266" y2="300" stroke="#475569" stroke-width="2.5" marker-end="url(#kb)"/>
  <line x1="458" y1="300" x2="494" y2="300" stroke="#475569" stroke-width="2.5" marker-end="url(#kb)"/>
  <text x="360" y="330" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Vazifa ish jarayonida ustundan ustunga o'tkaziladi (drag &amp; drop)</text>

  <!-- pastki izoh -->
  <text x="360" y="406" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Har kartochka — bitta Issue. Doska butun jamoaning ishini bir ko'rinishda jamlaydi</text>
