<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470">
  <title>Workflow yaml anatomiyasi: name, on (trigger), jobs va ularning ichidagi runs-on hamda steps (uses va run) qatlamlari ichma-ich joylashgan</title>

  <rect x="0" y="0" width="720" height="470" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Workflow fayl anatomiyasi (.github/workflows/ci.yml)</text>

  <!-- outer: workflow -->
  <rect x="30" y="56" width="660" height="396" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="48" y="80" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">name: CI</text>
  <text x="280" y="80" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">— workflow nomi (ixtiyoriy)</text>

  <!-- on (trigger) -->
  <rect x="56" y="96" width="608" height="58" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="74" y="122" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b45309">on: [push, pull_request]</text>
  <text x="74" y="144" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">QACHON ishga tushadi? — trigger (sabab)</text>

  <!-- jobs -->
  <rect x="56" y="168" width="608" height="268" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="74" y="192" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">jobs:</text>
  <text x="140" y="192" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">— bajariladigan ishlar (parallel ketadi)</text>

  <!-- single job -->
  <rect x="80" y="204" width="560" height="220" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="98" y="228" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">test:</text>
  <text x="160" y="228" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">— job nomi</text>
  <text x="98" y="252" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">runs-on: ubuntu-latest</text>
  <text x="350" y="252" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">— QAYSI mashinada (runner)</text>

  <!-- steps -->
  <rect x="98" y="266" width="524" height="146" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="114" y="290" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#7c3aed">steps:</text>
  <text x="180" y="290" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">— qadamlar, yuqoridan pastga tartib bilan</text>

  <text x="128" y="318" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">- uses: actions/checkout@v4</text>
  <text x="470" y="318" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#7c3aed">tayyor action</text>

  <text x="128" y="344" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">- uses: actions/setup-node@v4</text>
  <text x="470" y="344" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#7c3aed">tayyor action</text>

  <text x="128" y="370" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">- run: npm ci</text>
  <text x="470" y="370" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">o'z buyrug'ing</text>

  <text x="128" y="396" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">- run: npm test</text>
  <text x="470" y="396" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">o'z buyrug'ing</text>

  <!-- bottom note -->
  <text x="360" y="448" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Tartib: workflow -&gt; on (qachon) -&gt; jobs (nima) -&gt; runs-on (qayerda) -&gt; steps (qadamlar)</text>
</svg>
