<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460">
  <title>Teglar commitlar zanjiridagi muayyan commitlarga "yorliq" osadi (reliz versiyalari); pastda semantik versiya raqamining tuzilishi: major.minor.patch</title>
  <rect x="0" y="0" width="720" height="460" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Teglar — relizlarni belgilovchi yorliqlar</text>

  <!-- commit zanjiri chizig'i -->
  <line x1="70" y1="150" x2="650" y2="150" stroke="#94a3b8" stroke-width="3"/>

  <!-- commitlar -->
  <circle cx="110" cy="150" r="20" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="110" y="155" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">c1</text>
  <circle cx="250" cy="150" r="20" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="250" y="155" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">c2</text>
  <circle cx="390" cy="150" r="20" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="390" y="155" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">c3</text>
  <circle cx="530" cy="150" r="20" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="530" y="155" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">c4</text>
  <circle cx="610" cy="150" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="610" y="155" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">c5</text>

  <!-- teg yorliqlari (yuqorida) -->
  <line x1="110" y1="130" x2="110" y2="100" stroke="#16a34a" stroke-width="2"/>
  <rect x="62" y="74" width="96" height="28" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="110" y="93" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">v1.0.0</text>

  <line x1="390" y1="130" x2="390" y2="100" stroke="#16a34a" stroke-width="2"/>
  <rect x="342" y="74" width="96" height="28" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="390" y="93" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">v1.1.0</text>

  <line x1="610" y1="130" x2="610" y2="100" stroke="#16a34a" stroke-width="2"/>
  <rect x="562" y="74" width="96" height="28" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="610" y="93" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">v2.0.0</text>

  <!-- HEAD/main korsatkichi (pastda) -->
  <line x1="610" y1="170" x2="610" y2="198" stroke="#7c3aed" stroke-width="2"/>
  <rect x="575" y="200" width="70" height="26" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="610" y="218" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#7c3aed">main</text>

  <text x="360" y="258" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Teg — commitga osilgan o'zgarmas yorliq: "shu yer — reliz". main esa oldinga suriladi.</text>

  <!-- semver quti -->
  <rect x="150" y="290" width="420" height="130" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Semantik versiya:  major . minor . patch</text>

  <text x="222" y="362" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="30" font-weight="bold" fill="#dc2626">2</text>
  <text x="262" y="362" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="30" font-weight="bold" fill="#1e293b">.</text>
  <text x="302" y="362" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="30" font-weight="bold" fill="#f59e0b">1</text>
  <text x="342" y="362" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="30" font-weight="bold" fill="#1e293b">.</text>
  <text x="382" y="362" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="30" font-weight="bold" fill="#16a34a">4</text>

  <text x="222" y="392" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">moslik buzildi</text>
  <text x="302" y="392" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">yangi funksiya</text>
  <text x="382" y="392" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">xato tuzatildi</text>
  <text x="222" y="410" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(katta o'zgarish)</text>
  <text x="302" y="410" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(eskisi ishlaydi)</text>
  <text x="382" y="410" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(kichik tuzatish)</text>
</svg>
