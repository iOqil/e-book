<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 500" width="740" height="500">
  <title>Git Flow: main va develop ikkita uzun branch, ulardan feature, release va hotfix shoxlari ochiladi va belgilangan qoidalar bo'yicha qaytadan merge qilinadi</title>

  <rect x="0" y="0" width="740" height="500" fill="#f8fafc"/>

  <text x="370" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Git Flow — beshta branch turi, qat'iy qoidalar</text>

  <!-- branch yorliqlari chapda -->
  <text x="20" y="84" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">hotfix</text>
  <text x="20" y="154" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">main</text>
  <text x="20" y="294" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">develop</text>
  <text x="20" y="384" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">feature</text>
  <text x="20" y="224" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b">release</text>

  <!-- main chiziq (y=150) -->
  <line x1="95" y1="150" x2="715" y2="150" stroke="#2563eb" stroke-width="3"/>
  <circle cx="120" cy="150" r="12" fill="#2563eb"/>
  <circle cx="560" cy="150" r="12" fill="#2563eb"/>
  <circle cx="660" cy="150" r="12" fill="#2563eb"/>
  <!-- main teglari -->
  <text x="120" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">v1.0</text>
  <text x="560" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">v1.1</text>
  <text x="660" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">v1.1.1</text>

  <!-- develop chiziq (y=290) -->
  <line x1="120" y1="290" x2="715" y2="290" stroke="#7c3aed" stroke-width="3"/>
  <circle cx="120" cy="290" r="12" fill="#7c3aed"/>
  <circle cx="320" cy="290" r="12" fill="#7c3aed"/>
  <circle cx="470" cy="290" r="12" fill="#7c3aed"/>
  <circle cx="690" cy="290" r="12" fill="#7c3aed"/>

  <!-- main'dan develop tug'iladi -->
  <line x1="120" y1="162" x2="120" y2="278" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- feature branch (develop'dan, y=380) -->
  <line x1="200" y1="380" x2="320" y2="380" stroke="#16a34a" stroke-width="3"/>
  <circle cx="200" cy="380" r="11" fill="#16a34a"/>
  <circle cx="260" cy="380" r="11" fill="#16a34a"/>
  <circle cx="320" cy="380" r="11" fill="#16a34a"/>
  <line x1="200" y1="302" x2="200" y2="368" stroke="#16a34a" stroke-width="2"/>
  <line x1="320" y1="368" x2="320" y2="302" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="260" y="412" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">feature/savatcha</text>

  <!-- release branch (develop'dan, y=220) -->
  <line x1="470" y1="220" x2="560" y2="220" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="470" cy="220" r="11" fill="#f59e0b"/>
  <circle cx="560" cy="220" r="11" fill="#f59e0b"/>
  <line x1="470" y1="278" x2="470" y2="232" stroke="#f59e0b" stroke-width="2"/>
  <!-- release -> main -->
  <line x1="560" y1="208" x2="560" y2="162" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>
  <!-- release -> develop -->
  <line x1="560" y1="232" x2="690" y2="278" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="515" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">release/1.1</text>

  <!-- hotfix branch (main'dan, y=80) -->
  <line x1="600" y1="80" x2="660" y2="80" stroke="#dc2626" stroke-width="3"/>
  <circle cx="600" cy="80" r="11" fill="#dc2626"/>
  <circle cx="660" cy="80" r="11" fill="#dc2626"/>
  <!-- main -> hotfix (oxirgi main commitidan emas, oldingisidan; soddalashtirib v1.1 dan) -->
  <line x1="560" y1="138" x2="600" y2="92" stroke="#dc2626" stroke-width="2"/>
  <!-- hotfix -> main -->
  <line x1="660" y1="92" x2="660" y2="138" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
  <!-- hotfix -> develop -->
  <line x1="660" y1="69" x2="690" y2="69" stroke="#dc2626" stroke-width="2"/>
  <line x1="690" y1="69" x2="690" y2="278" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="630" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">hotfix/xato</text>

  <!-- pastki izoh qutisi -->
  <rect x="40" y="440" width="660" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="370" y="462" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">feature: develop'dan ochiladi. release: develop'dan -&gt; main + develop'ga. hotfix: main'dan -&gt; main + develop'ga.</text>
  <text x="370" y="481" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Uzluksiz chiziq = branch ochildi/ishladi. Uzuq chiziq = merge qaytdi. main har reliz va tuzatishda teg oladi.</text>
</svg>
