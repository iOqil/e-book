<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>Versiya nazoratisiz papka chalkashligi (loyiha_final_v2.zip kabi nusxalar) va Git bilan toza, tartibli tarix qiyosi</title>

  <!-- fon -->
  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Nusxa to'plash vs Git tarixi</text>

  <!-- chap panel: chalkash papka -->
  <text x="190" y="72" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#dc2626">❌ Versiya nazoratisiz</text>
  <rect x="40" y="86" width="300" height="284" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>

  <!-- papka ichidagi fayllar -->
  <rect x="64" y="106" width="252" height="30" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="78" y="126" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">loyiha.zip</text>
  <rect x="64" y="142" width="252" height="30" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="78" y="162" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">loyiha_final.zip</text>
  <rect x="64" y="178" width="252" height="30" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="78" y="198" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">loyiha_final_v2.zip</text>
  <rect x="64" y="214" width="252" height="30" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="78" y="234" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">loyiha_final_v2_oxirgi.zip</text>
  <rect x="64" y="250" width="252" height="30" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="78" y="270" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">loyiha_ROSTDAN_oxirgi.zip</text>

  <text x="190" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">Qaysi biri eng yangi? Kim o'zgartirgan?</text>
  <text x="190" y="328" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">Nega o'zgartirilgan? Eski holatga qaytib</text>
  <text x="190" y="350" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">bo'ladimi? Hech narsa ma'lum emas.</text>

  <!-- o'ng panel: toza Git tarix -->
  <text x="530" y="72" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#16a34a">✅ Git bilan</text>
  <rect x="380" y="86" width="300" height="284" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>

  <!-- commit zanjiri (pastdan tepaga vaqt) -->
  <line x1="430" y1="130" x2="430" y2="330" stroke="#16a34a" stroke-width="2"/>

  <circle cx="430" cy="130" r="9" fill="#16a34a"/>
  <text x="452" y="126" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Bosh sahifa qo'shildi</text>
  <text x="452" y="144" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Aziz · bugun 14:20</text>

  <circle cx="430" cy="200" r="9" fill="#16a34a"/>
  <text x="452" y="196" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Login tuzatildi</text>
  <text x="452" y="214" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Malika · kecha 18:05</text>

  <circle cx="430" cy="270" r="9" fill="#16a34a"/>
  <text x="452" y="266" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Loyiha boshlandi</text>
  <text x="452" y="284" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Aziz · 3 kun oldin</text>

  <text x="530" y="332" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#15803d">Har o'zgarish: kim · qachon · nega</text>

  <!-- pastki izoh -->
  <text x="360" y="404" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e293b">Bitta papka — ichida butun tarix. Istalgan nuqtaga qaytish mumkin.</text>
  <text x="360" y="428" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Har bir "nuqta" — commit deyiladi: loyihaning saqlangan holati</text>
</svg>
