<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>Uch operatsion tizim uchun Git o'rnatish yo'l xaritasi: Windows installer yoki winget, macOS Homebrew yoki xcode-select, Linux apt yoki dnf — hamma yo'l git --version bilan tekshiruvga olib keladi</title>

  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Git'ni o'rnatish: operatsion tizimingizni tanlang</text>

  <!-- Windows ustun -->
  <rect x="30" y="62" width="200" height="46" rx="8" fill="#2563eb"/>
  <text x="130" y="91" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Windows</text>
  <rect x="30" y="124" width="200" height="62" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="130" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">A) Installer</text>
  <text x="130" y="170" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">git-scm.com/download/win</text>
  <rect x="30" y="196" width="200" height="62" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="130" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">B) winget</text>
  <text x="130" y="242" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">winget install Git.Git</text>

  <!-- macOS ustun -->
  <rect x="260" y="62" width="200" height="46" rx="8" fill="#7c3aed"/>
  <text x="360" y="91" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">macOS</text>
  <rect x="260" y="124" width="200" height="62" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="360" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#5b21b6">A) Homebrew</text>
  <text x="360" y="170" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">brew install git</text>
  <rect x="260" y="196" width="200" height="62" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="360" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#5b21b6">B) Xcode vositalari</text>
  <text x="360" y="242" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">xcode-select --install</text>

  <!-- Linux ustun -->
  <rect x="490" y="62" width="200" height="46" rx="8" fill="#16a34a"/>
  <text x="590" y="91" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Linux</text>
  <rect x="490" y="124" width="200" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="590" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#15803d">Debian / Ubuntu</text>
  <text x="590" y="170" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">sudo apt install git</text>
  <rect x="490" y="196" width="200" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="590" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#15803d">Fedora / RHEL</text>
  <text x="590" y="242" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">sudo dnf install git</text>

  <!-- yo'naltiruvchi chiziqlar pastga -->
  <line x1="130" y1="258" x2="130" y2="300" stroke="#94a3b8" stroke-width="2"/>
  <line x1="360" y1="258" x2="360" y2="300" stroke="#94a3b8" stroke-width="2"/>
  <line x1="590" y1="258" x2="590" y2="300" stroke="#94a3b8" stroke-width="2"/>
  <line x1="130" y1="300" x2="590" y2="300" stroke="#94a3b8" stroke-width="2"/>
  <line x1="360" y1="300" x2="360" y2="326" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="360,338 353,324 367,324" fill="#94a3b8"/>

  <!-- yagona tekshiruv qutisi -->
  <rect x="230" y="340" width="260" height="56" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="365" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b45309">Hammasi shu yerga olib keladi:</text>
  <text x="360" y="386" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">git --version</text>

  <text x="360" y="418" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Versiya raqami chiqsa — o'rnatish muvaffaqiyatli</text>
</svg>
