<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>HTTP so'rov-javob oqimi: mijoz so'rov (req) yuboradi, Node server uni qayta ishlab javob (res) qaytaradi</title>
  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">HTTP so'rov-javob: bir aylanish</text>
  <text x="360" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Mijoz so'rov yuboradi, server qayta ishlaydi, javob qaytadi</text>

  <defs>
    <marker id="ok" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="ok2" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- MIJOZ -->
  <rect x="32" y="150" width="160" height="120" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="112" y="182" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">Mijoz</text>
  <text x="112" y="204" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">brauzer, fetch,</text>
  <text x="112" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">mobil ilova</text>
  <text x="112" y="248" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#1e293b">fetch(url)</text>

  <!-- SERVER -->
  <rect x="280" y="135" width="160" height="150" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="360" y="165" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#7c3aed">Node server</text>
  <text x="360" y="188" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e293b">createServer</text>
  <text x="360" y="208" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">(req, res) =&gt; ...</text>
  <line x1="296" y1="220" x2="424" y2="220" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="360" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#64748b">req ni o'qiydi,</text>
  <text x="360" y="256" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#64748b">routing qiladi,</text>
  <text x="360" y="272" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#64748b">res tayyorlaydi</text>

  <!-- NATIJA / ISH -->
  <rect x="528" y="150" width="160" height="120" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="608" y="182" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">Ish (logika)</text>
  <text x="608" y="206" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">DB, hisoblash,</text>
  <text x="608" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">fayl o'qish</text>
  <text x="608" y="250" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748b">natija qaytaradi</text>

  <!-- REQ strelka mijoz -> server -->
  <line x1="192" y1="190" x2="276" y2="190" stroke="#2563eb" stroke-width="3" marker-end="url(#ok)"/>
  <rect x="186" y="100" width="112" height="44" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="242" y="118" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e40af">req (so'rov)</text>
  <text x="242" y="135" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">method, url, body</text>

  <!-- server -> ish -->
  <line x1="440" y1="190" x2="524" y2="190" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ok)"/>

  <!-- RES strelka server <- mijoz (pastdan qaytadi) -->
  <line x1="280" y1="250" x2="192" y2="250" stroke="#16a34a" stroke-width="3" marker-end="url(#ok2)"/>
  <rect x="186" y="296" width="112" height="44" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="242" y="314" text-anchor="middle" font-family="monospace" font-size="12" fill="#166534">res (javob)</text>
  <text x="242" y="331" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">status, header, body</text>

  <!-- status izoh -->
  <rect x="40" y="360" width="640" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="360" y="380" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#92400e">Status kod javobning natijasini bildiradi:</text>
  <text x="360" y="399" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#92400e">2xx muvaffaqiyat  ·  4xx mijoz xatosi  ·  5xx server xatosi</text>
</svg>
