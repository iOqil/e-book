<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>Ketma-ket vs parallel: uchta 150ms so'rov vaqt o'qida (Promise.all bilan tezlanish)</title>
  <defs>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>
  <text x="360" y="30" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Uch so'rov, har biri ~150ms — vaqt o'qida</text>

  <!-- KETMA-KET blok -->
  <text x="40" y="70" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">Ketma-ket (await sikl ichida)</text>
  <text x="40" y="90" font-family="monospace" font-size="12" fill="#64748b">for (const u of urllar) await fetch(u)</text>

  <!-- vaqt o'qi -->
  <line x1="60" y1="110" x2="660" y2="110" stroke="#cbd5e1" stroke-width="1"/>
  <!-- 3 ta ketma-ket bar -->
  <rect x="60"  y="100" width="180" height="22" rx="4" fill="#fca5a5" stroke="#dc2626"/>
  <text x="150" y="115" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#7f1d1d">fetch 1 (150ms)</text>
  <rect x="242" y="100" width="180" height="22" rx="4" fill="#fca5a5" stroke="#dc2626"/>
  <text x="332" y="115" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#7f1d1d">fetch 2 (150ms)</text>
  <rect x="424" y="100" width="180" height="22" rx="4" fill="#fca5a5" stroke="#dc2626"/>
  <text x="514" y="115" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#7f1d1d">fetch 3 (150ms)</text>
  <!-- jami chiziq -->
  <line x1="60" y1="138" x2="604" y2="138" stroke="#dc2626" stroke-width="1.5" marker-start="url(#ar2)" marker-end="url(#ar2)"/>
  <text x="332" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">Jami ~450ms (150+150+150)</text>

  <!-- PARALLEL blok -->
  <text x="40" y="210" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Parallel (Promise.all)</text>
  <text x="40" y="230" font-family="monospace" font-size="12" fill="#64748b">await Promise.all(urllar.map(fetch))</text>

  <line x1="60" y1="250" x2="660" y2="250" stroke="#cbd5e1" stroke-width="1"/>
  <!-- 3 ta bir vaqtda boshlanadigan bar (ustma-ust) -->
  <rect x="60" y="244" width="180" height="20" rx="4" fill="#86efac" stroke="#16a34a"/>
  <text x="150" y="258" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#14532d">fetch 1 (150ms)</text>
  <rect x="60" y="268" width="180" height="20" rx="4" fill="#86efac" stroke="#16a34a"/>
  <text x="150" y="282" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#14532d">fetch 2 (150ms)</text>
  <rect x="60" y="292" width="180" height="20" rx="4" fill="#86efac" stroke="#16a34a"/>
  <text x="150" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#14532d">fetch 3 (150ms)</text>
  <!-- hammasi bir vaqtda boshlanadi: vertikal start chizig'i -->
  <line x1="60" y1="240" x2="60" y2="316" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="240" y1="240" x2="240" y2="316" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="62" y="334" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#16a34a">hammasi shu yerda boshlanadi</text>
  <line x1="60" y1="350" x2="240" y2="350" stroke="#16a34a" stroke-width="1.5" marker-start="url(#ar2)" marker-end="url(#ar2)"/>
  <text x="150" y="368" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">Jami ~150ms</text>

  <!-- Xulosa qutisi -->
  <rect x="300" y="244" width="380" height="100" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="490" y="270" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#7c3aed">Nega farq?</text>
  <text x="318" y="294" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#334155">Bog'liq bo'lmagan so'rovlarni kutib turish shart emas.</text>
  <text x="318" y="314" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#334155">Promise.all hammasini birvarakayiga boshlaydi va</text>
  <text x="318" y="332" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#334155">eng sekinini kutadi — yig'indi emas, maksimum.</text>

  <text x="360" y="400" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Qoida: so'rovlar bir-biriga bog'liq bo'lmasa — parallel ishlat.</text>
  <text x="360" y="420" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#94a3b8">Real misolda (t7) ~673ms -&gt; ~163ms, ya'ni ~4x tezlanish</text>
</svg>
