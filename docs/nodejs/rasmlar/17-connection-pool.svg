<svg viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <title>Connection pool: so'rovlar pooldan ulanishni olib, qaytaradi</title>
  <rect width="720" height="430" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Connection Pool — ulanishlarni qayta ishlatish</text>

  <!-- So'rovlar -->
  <text x="92" y="74" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">So'rovlar</text>
  <rect x="24" y="92" width="136" height="40" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="92" y="117" text-anchor="middle" font-size="14" fill="#1e293b">query A</text>
  <rect x="24" y="148" width="136" height="40" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="92" y="173" text-anchor="middle" font-size="14" fill="#1e293b">query B</text>
  <rect x="24" y="204" width="136" height="40" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="92" y="229" text-anchor="middle" font-size="14" fill="#1e293b">query C</text>
  <rect x="24" y="260" width="136" height="40" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="92" y="285" text-anchor="middle" font-size="14" fill="#64748b">query D (kutadi)</text>

  <!-- O'qlar so'rov -> pool -->
  <line x1="160" y1="112" x2="248" y2="150" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="160" y1="168" x2="248" y2="190" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="160" y1="224" x2="248" y2="230" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="160" y1="280" x2="248" y2="270" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arg)"/>

  <!-- Pool -->
  <rect x="250" y="118" width="186" height="184" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="343" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">POOL (limit = 3)</text>
  <rect x="270" y="156" width="146" height="34" rx="7" fill="#16a34a"/>
  <text x="343" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">ulanish #1 (band)</text>
  <rect x="270" y="198" width="146" height="34" rx="7" fill="#16a34a"/>
  <text x="343" y="220" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">ulanish #2 (band)</text>
  <rect x="270" y="240" width="146" height="34" rx="7" fill="#16a34a"/>
  <text x="343" y="262" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">ulanish #3 (band)</text>
  <text x="343" y="292" text-anchor="middle" font-size="12" fill="#64748b">bo'sh ulanish yo'q -> D navbatda</text>

  <!-- O'q pool -> DB -->
  <line x1="436" y1="210" x2="540" y2="210" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arp)"/>
  <text x="488" y="200" text-anchor="middle" font-size="12" fill="#7c3aed">TCP ulanish</text>
  <text x="488" y="232" text-anchor="middle" font-size="11" fill="#94a3b8">(qayta ishlatiladi)</text>

  <!-- DB -->
  <ellipse cx="612" cy="160" rx="58" ry="18" fill="#dc2626"/>
  <path d="M554 160 v60 a58 18 0 0 0 116 0 v-60" fill="#dc2626"/>
  <ellipse cx="612" cy="160" rx="58" ry="18" fill="#ef4444"/>
  <text x="612" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">MySQL</text>
  <text x="612" y="246" text-anchor="middle" font-size="12" fill="#64748b">localhost:3306</text>

  <!-- Pastki izoh -->
  <rect x="24" y="334" width="672" height="74" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="40" y="360" font-size="13" fill="#334155"><tspan font-weight="700" fill="#dc2626">Poolsiz:</tspan> har so'rov yangi TCP+autentifikatsiya ochadi — sekin, qimmat.</text>
  <text x="40" y="384" font-size="13" fill="#334155"><tspan font-weight="700" fill="#16a34a">Pool bilan:</tspan> tayyor ulanishlar saqlanadi, so'rov ishlatib bo'lgach qaytaradi (release).</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#2563eb"/></marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#94a3b8"/></marker>
    <marker id="arp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#7c3aed"/></marker>
  </defs>
</svg>
