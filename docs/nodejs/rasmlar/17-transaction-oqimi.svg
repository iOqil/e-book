<svg viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <title>Tranzaksiya oqimi: BEGIN -> amallar -> COMMIT yoki ROLLBACK</title>
  <rect width="720" height="430" fill="#f8fafc"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Tranzaksiya oqimi — hammasi yoki hech narsa</text>

  <!-- getConnection -->
  <rect x="270" y="56" width="180" height="40" rx="9" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <text x="360" y="81" text-anchor="middle" font-size="14" font-weight="600" fill="#5b21b6">pool.getConnection()</text>
  <line x1="360" y1="96" x2="360" y2="116" stroke="#475569" stroke-width="2" marker-end="url(#a2)"/>

  <!-- BEGIN -->
  <rect x="285" y="116" width="150" height="38" rx="9" fill="#f59e0b"/>
  <text x="360" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">beginTransaction()</text>
  <line x1="360" y1="154" x2="360" y2="172" stroke="#475569" stroke-width="2" marker-end="url(#a2)"/>

  <!-- amallar -->
  <rect x="250" y="172" width="220" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="194" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">UPDATE ... balans - 300  (A)</text>
  <text x="360" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">UPDATE ... balans + 300  (B)</text>

  <!-- shart romb -->
  <polygon points="360,250 432,290 360,330 288,290" fill="#fff" stroke="#475569" stroke-width="2"/>
  <text x="360" y="286" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">xato</text>
  <text x="360" y="304" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">bo'ldimi?</text>

  <!-- yo'q -> commit -->
  <line x1="288" y1="290" x2="150" y2="290" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <text x="218" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">yo'q</text>
  <rect x="36" y="270" width="114" height="40" rx="9" fill="#16a34a"/>
  <text x="93" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">commit()</text>
  <text x="93" y="332" text-anchor="middle" font-size="12" fill="#16a34a">o'zgarishlar saqlanadi</text>

  <!-- ha -> rollback -->
  <line x1="432" y1="290" x2="570" y2="290" stroke="#dc2626" stroke-width="2" marker-end="url(#ar2)"/>
  <text x="502" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">ha</text>
  <rect x="570" y="270" width="114" height="40" rx="9" fill="#dc2626"/>
  <text x="627" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">rollback()</text>
  <text x="627" y="332" text-anchor="middle" font-size="12" fill="#dc2626">hammasi bekor qilinadi</text>

  <!-- finally release -->
  <rect x="248" y="360" width="224" height="42" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="360" y="386" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">finally: conn.release()</text>
  <line x1="93" y1="310" x2="270" y2="372" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 4"/>
  <line x1="627" y1="310" x2="450" y2="372" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 4"/>

  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#475569"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#16a34a"/></marker>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#dc2626"/></marker>
  </defs>
</svg>
