<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>HTTP polling vs WebSocket: polling takror so'rov yuboradi, WebSocket bitta doimiy ikki tomonlama ulanish ochadi</title>
  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">HTTP polling vs WebSocket</text>
  <text x="360" y="55" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">takror so'rov (isrof) vs bitta doimiy, ikki tomonlama ulanish</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#dc2626"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- LEFT: POLLING -->
  <rect x="20" y="78" width="330" height="332" rx="12" fill="#fff" stroke="#dc2626" stroke-width="1.6"/>
  <text x="185" y="102" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">Polling (takror so'rov)</text>
  <text x="70" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">Mijoz</text>
  <text x="300" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">Server</text>
  <line x1="70" y1="138" x2="70" y2="392" stroke="#94a3b8" stroke-width="2"/>
  <line x1="300" y1="138" x2="300" y2="392" stroke="#94a3b8" stroke-width="2"/>

  <!-- 3 round trips: request then empty response -->
  <line x1="72" y1="156" x2="298" y2="166" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
  <text x="185" y="151" text-anchor="middle" font-family="monospace" font-size="11" fill="#b91c1c">GET /yangilik?</text>
  <line x1="298" y1="180" x2="72" y2="190" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)" stroke-dasharray="4 3"/>
  <text x="185" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#64748b">bo'sh (yangilik yo'q)</text>

  <line x1="72" y1="214" x2="298" y2="224" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
  <text x="185" y="209" text-anchor="middle" font-family="monospace" font-size="11" fill="#b91c1c">GET /yangilik?</text>
  <line x1="298" y1="238" x2="72" y2="248" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)" stroke-dasharray="4 3"/>
  <text x="185" y="244" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#64748b">bo'sh</text>

  <line x1="72" y1="272" x2="298" y2="282" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
  <text x="185" y="267" text-anchor="middle" font-family="monospace" font-size="11" fill="#b91c1c">GET /yangilik?</text>
  <line x1="298" y1="296" x2="72" y2="306" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <text x="185" y="302" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#166534">nihoyat ma'lumot</text>

  <rect x="40" y="330" width="290" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="185" y="352" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#991b1b">Har so'rov: yangi ulanish + header</text>
  <text x="185" y="370" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#991b1b">isrof trafik, kechikish, ko'p bo'sh javob</text>
  <text x="185" y="388" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#991b1b">server o'zi PUSH qila olmaydi</text>

  <!-- RIGHT: WEBSOCKET -->
  <rect x="372" y="78" width="328" height="332" rx="12" fill="#fff" stroke="#16a34a" stroke-width="1.6"/>
  <text x="536" y="102" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">WebSocket (doimiy ulanish)</text>
  <text x="422" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">Mijoz</text>
  <text x="650" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#475569">Server</text>
  <line x1="422" y1="138" x2="422" y2="392" stroke="#94a3b8" stroke-width="2"/>
  <line x1="650" y1="138" x2="650" y2="392" stroke="#94a3b8" stroke-width="2"/>

  <!-- handshake -->
  <line x1="424" y1="158" x2="648" y2="158" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/>
  <text x="536" y="152" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#1d4ed8">Upgrade: websocket</text>
  <line x1="648" y1="176" x2="424" y2="176" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/>
  <text x="536" y="171" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#1d4ed8">101 Switching</text>

  <!-- persistent open channel -->
  <rect x="424" y="190" width="224" height="118" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="536" y="208" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#166534">bitta OCHIQ kanal</text>
  <line x1="648" y1="228" x2="424" y2="234" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <text x="536" y="225" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#166534">server PUSH</text>
  <line x1="424" y1="256" x2="648" y2="262" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar)"/>
  <text x="536" y="253" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#6d28d9">mijoz emit</text>
  <line x1="648" y1="284" x2="424" y2="290" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <text x="536" y="281" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#166534">server PUSH (xohlagancha)</text>

  <rect x="392" y="330" width="288" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="536" y="352" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#166534">Bir marta handshake, keyin kanal ochiq</text>
  <text x="536" y="370" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#166534">ikki tomon istalgan payt xabar yuboradi</text>
  <text x="536" y="388" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#166534">past kechikish, kam ortiqcha trafik</text>
</svg>
