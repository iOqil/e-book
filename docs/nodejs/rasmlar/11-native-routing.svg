<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>Native routing: metod va URL bo'yicha qo'lda if/switch orqali to'g'ri handler tanlanadi, mos kelmasa 404</title>
  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Qo'lda routing: metod + URL → handler</text>
  <text x="360" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Express yo'q — har bir yo'lni o'zimiz if/switch bilan ajratamiz</text>

  <defs>
    <marker id="a" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- KIRUVCHI SO'ROV -->
  <rect x="28" y="180" width="150" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="103" y="208" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">Kiruvchi so'rov</text>
  <text x="103" y="230" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e293b">req.method</text>
  <text x="103" y="248" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e293b">req.url</text>

  <!-- TEKSHIRUV ROMBI (oddiy to'rtburchak sifatida) -->
  <rect x="222" y="170" width="150" height="100" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="297" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">Solishtirish</text>
  <text x="297" y="224" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#1e293b">method + url</text>
  <text x="297" y="244" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">if / switch</text>
  <text x="297" y="262" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#64748b">qaysi handler?</text>

  <line x1="178" y1="220" x2="218" y2="220" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- HANDLERLAR -->
  <rect x="448" y="92" width="248" height="46" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="466" y="113" font-family="monospace" font-size="12.5" fill="#166534" font-weight="bold">GET /vazifalar</text>
  <text x="466" y="130" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">→ ro'yxatni JSON qaytaradi</text>

  <rect x="448" y="148" width="248" height="46" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="466" y="169" font-family="monospace" font-size="12.5" fill="#166534" font-weight="bold">POST /vazifalar</text>
  <text x="466" y="186" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">→ tanani o'qiydi, yangi qo'shadi</text>

  <rect x="448" y="204" width="248" height="46" rx="9" fill="#fef9c3" stroke="#f59e0b" stroke-width="2"/>
  <text x="466" y="225" font-family="monospace" font-size="12.5" fill="#92400e" font-weight="bold">GET /salom</text>
  <text x="466" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">→ matn qaytaradi</text>

  <rect x="448" y="296" width="248" height="50" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="466" y="318" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#991b1b" font-weight="bold">Mos kelmadi → 404</text>
  <text x="466" y="336" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#7f1d1d">"Topilmadi" javobini yuboradi</text>

  <!-- strelkalar tekshiruvdan handlerlarga -->
  <line x1="372" y1="205" x2="444" y2="115" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="372" y1="215" x2="444" y2="171" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="372" y1="228" x2="444" y2="227" stroke="#f59e0b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="372" y1="245" x2="444" y2="318" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>

  <!-- pastki izoh -->
  <rect x="28" y="380" width="668" height="34" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="360" y="402" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e40af">Har yangi yo'l uchun yana bitta if qo'shiladi — yo'l ko'paysa, bu charchatadi (12-bobda Express buni soddalashtiradi)</text>
</svg>
