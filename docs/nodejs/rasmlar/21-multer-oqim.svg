<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>Multer fayl yuklash oqimi: brauzer form-data yuboradi, multer tanani o'qiydi, fileFilter va limits validatsiya qiladi, so'ng diskStorage faylni xavfsiz nom bilan saqlaydi yoki xato qaytaradi</title>
  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Multer fayl yuklash oqimi</text>
  <text x="360" y="55" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">form-data -&gt; multer -&gt; validatsiya (tur/hajm) -&gt; xavfsiz saqlash</text>

  <defs>
    <marker id="mar21" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="marRed" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Brauzer / form -->
  <rect x="24" y="150" width="130" height="92" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="89" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">Brauzer</text>
  <text x="89" y="201" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#1e293b">&lt;input</text>
  <text x="89" y="216" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#1e293b">type="file"&gt;</text>
  <text x="89" y="233" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#64748b">multipart/form-data</text>

  <!-- Multer -->
  <rect x="200" y="150" width="130" height="92" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="265" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">multer</text>
  <text x="265" y="201" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#1e293b">tanani o'qiydi</text>
  <text x="265" y="217" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#64748b">single("rasm")</text>
  <text x="265" y="233" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#64748b">-&gt; req.file</text>

  <!-- Validatsiya -->
  <rect x="376" y="150" width="130" height="92" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="441" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">validatsiya</text>
  <text x="441" y="199" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#1e293b">fileFilter: MIME</text>
  <text x="441" y="215" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#1e293b">limits: fileSize</text>
  <text x="441" y="231" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#64748b">tur + hajm</text>

  <!-- Saqlash (OK) -->
  <rect x="556" y="118" width="140" height="76" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="626" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">saqlash</text>
  <text x="626" y="166" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#1e293b">diskStorage</text>
  <text x="626" y="183" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#64748b">xavfsiz nom + 201</text>

  <!-- Rad (XATO) -->
  <rect x="556" y="232" width="140" height="76" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="626" y="260" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">rad etish</text>
  <text x="626" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#1e293b">415 / 413</text>
  <text x="626" y="297" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#64748b">noto'g'ri tur/hajm</text>

  <!-- arrows main flow -->
  <line x1="154" y1="196" x2="196" y2="196" stroke="#2563eb" stroke-width="3" marker-end="url(#mar21)"/>
  <line x1="330" y1="196" x2="372" y2="196" stroke="#2563eb" stroke-width="3" marker-end="url(#mar21)"/>
  <!-- OK branch -->
  <path d="M506,180 C530,170 535,160 552,156" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#mar21)"/>
  <text x="528" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#16a34a">to'g'ri</text>
  <!-- ERR branch -->
  <path d="M506,212 C530,222 535,250 552,262" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#marRed)"/>
  <text x="527" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#dc2626">noto'g'ri</text>

  <!-- bottom note -->
  <rect x="90" y="340" width="540" height="58" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="360" y="364" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">Xavfsizlik qoidasi: faylni DOIM oq ro'yxatdagi MIME va hajm bo'yicha tekshir,</text>
  <text x="360" y="385" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">fayl nomini O'ZING yangidan yarat (crypto), foydalanuvchi nomiga ishonma.</text>
</svg>
