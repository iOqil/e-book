<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>Validatsiya oqimi: kiruvchi so'rov validate middleware orqali Zod schema bilan tekshiriladi; muvaffaqiyatli bo'lsa tozalangan ma'lumot route handlerga o'tadi, xato bo'lsa 422 javob qaytariladi</title>
  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Validatsiya oqimi: so'rov &#8594; schema &#8594; natija</text>
  <text x="360" y="55" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Ishonchsiz ma'lumot route handlerga yetib bormaydi &#8212; avval schema tekshiradi</text>

  <defs>
    <marker id="va-blue" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="va-green" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#16a34a"/>
    </marker>
    <marker id="va-red" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- client request -->
  <rect x="28" y="170" width="130" height="78" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.3"/>
  <text x="93" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">Mijoz so'rovi</text>
  <text x="93" y="221" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#475569">body / query</text>
  <text x="93" y="237" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#475569">params</text>

  <!-- validate middleware -->
  <rect x="210" y="160" width="150" height="98" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2.4"/>
  <text x="285" y="190" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#7c3aed">validate(schema)</text>
  <text x="285" y="212" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748b">Zod middleware</text>
  <text x="285" y="234" text-anchor="middle" font-family="monospace" font-size="12" fill="#475569">schema.safeParse()</text>
  <text x="285" y="251" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#94a3b8">tip + qoidalar tekshiruvi</text>

  <line x1="158" y1="209" x2="206" y2="209" stroke="#2563eb" stroke-width="2.7" marker-end="url(#va-blue)"/>

  <!-- decision diamond -->
  <polygon points="455,209 500,178 545,209 500,240" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.4"/>
  <text x="500" y="206" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#92400e">success?</text>
  <text x="500" y="223" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#92400e">to'g'rimi?</text>
  <line x1="360" y1="209" x2="453" y2="209" stroke="#7c3aed" stroke-width="2.7" marker-end="url(#va-blue)"/>

  <!-- success path -->
  <path d="M500,178 L500,108 L572,108" fill="none" stroke="#16a34a" stroke-width="2.7" marker-end="url(#va-green)"/>
  <text x="512" y="150" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">ha &#8594; next()</text>
  <rect x="575" y="78" width="128" height="62" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2.3"/>
  <text x="639" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#16a34a">route handler</text>
  <text x="639" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#15803d">tozalangan req.body</text>

  <!-- fail path -->
  <path d="M500,240 L500,318 L572,318" fill="none" stroke="#dc2626" stroke-width="2.7" marker-end="url(#va-red)"/>
  <text x="512" y="282" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">yo'q &#8594; throw</text>
  <rect x="575" y="288" width="128" height="64" rx="11" fill="#fee2e2" stroke="#dc2626" stroke-width="2.3"/>
  <text x="639" y="314" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">422</text>
  <text x="639" y="333" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#991b1b">Unprocessable</text>
  <text x="639" y="347" text-anchor="middle" font-family="monospace" font-size="10" fill="#991b1b">{ errors: [...] }</text>

  <!-- bottom note -->
  <rect x="60" y="378" width="600" height="36" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="360" y="401" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e40af">Qoida: ishonchsiz mijoz ma'lumotini handlerdan OLDIN, chegarada tekshiring</text>
</svg>
