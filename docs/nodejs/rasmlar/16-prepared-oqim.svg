<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>Prepared statement oqimi: SQL matni db.prepare bilan bir marta kompilyatsiya qilinadi, keyin parametrlar bind qilinib run/get/all bilan ko'p marta ishlatiladi</title>
  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Prepared statement oqimi (better-sqlite3)</text>
  <text x="360" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">SQL bir marta kompilyatsiya, parametrlar bog'lab ko'p marta ishlatiladi</text>

  <defs>
    <marker id="par" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 1. SQL matni -->
  <rect x="24" y="95" width="170" height="78" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="109" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">1. SQL matni</text>
  <text x="109" y="144" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#1e293b">SELECT ... WHERE</text>
  <text x="109" y="160" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#1e293b">id = ?</text>

  <!-- 2. prepare -->
  <rect x="262" y="95" width="190" height="78" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="357" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">2. db.prepare(sql)</text>
  <text x="357" y="143" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#64748b">kompilyatsiya (bir marta)</text>
  <text x="357" y="159" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#64748b">-> Statement obyekti</text>

  <!-- 3. bind -->
  <rect x="520" y="95" width="176" height="78" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="608" y="122" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">3. bind</text>
  <text x="608" y="143" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#64748b">? -> qiymat (xavfsiz)</text>
  <text x="608" y="159" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#64748b">@named -> obyekt</text>

  <line x1="194" y1="134" x2="258" y2="134" stroke="#2563eb" stroke-width="3" marker-end="url(#par)"/>
  <line x1="452" y1="134" x2="516" y2="134" stroke="#2563eb" stroke-width="3" marker-end="url(#par)"/>

  <!-- 4. run/get/all -->
  <rect x="120" y="230" width="160" height="86" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="200" y="258" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#16a34a">.run()</text>
  <text x="200" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#64748b">INSERT/UPDATE/DELETE</text>
  <text x="200" y="300" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">{ changes, lastInsertRowid }</text>

  <rect x="290" y="230" width="160" height="86" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="370" y="258" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#16a34a">.get()</text>
  <text x="370" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#64748b">bitta qator</text>
  <text x="370" y="300" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">-> obyekt yoki undefined</text>

  <rect x="460" y="230" width="160" height="86" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="540" y="258" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#16a34a">.all()</text>
  <text x="540" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#64748b">barcha qatorlar</text>
  <text x="540" y="300" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">-> obyektlar massivi</text>

  <line x1="608" y1="173" x2="540" y2="226" stroke="#16a34a" stroke-width="2.2" marker-end="url(#par)" opacity="0.55"/>
  <line x1="600" y1="174" x2="372" y2="226" stroke="#16a34a" stroke-width="2.2" marker-end="url(#par)" opacity="0.45"/>
  <line x1="592" y1="174" x2="206" y2="226" stroke="#16a34a" stroke-width="2.2" marker-end="url(#par)" opacity="0.35"/>

  <!-- xavfsizlik eslatmasi -->
  <rect x="90" y="345" width="540" height="36" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="360" y="368" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#991b1b">String birlashtirmang! `... WHERE id = ` + input -> SQL injection xavfi. Hamisha ? yoki @named.</text>

  <text x="360" y="404" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#64748b">Bir marta prepare -> ko'p marta bind+ishlat: tez va xavfsiz</text>
</svg>
