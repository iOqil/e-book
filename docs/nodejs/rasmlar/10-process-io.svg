<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
  <title>process obyekti: argv va env kirish sifatida, stdin/stdout/stderr oqimlar, signallar (SIGINT/SIGTERM) va exit kodi chiqish sifatida</title>

  <rect x="0" y="0" width="720" height="440" fill="#f8fafc"/>

  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">process — dasturning tashqi dunyo bilan aloqasi</text>
  <text x="360" y="54" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">kirish (chap) → Node jarayoni (markaz) → chiqish (o'ng)</text>

  <!-- Markaziy jarayon qutisi -->
  <rect x="280" y="120" width="160" height="200" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="360" y="150" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">Node jarayoni</text>
  <text x="360" y="174" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">process.pid</text>
  <text x="360" y="194" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">process.cwd()</text>
  <text x="360" y="214" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">process.platform</text>
  <text x="360" y="234" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">process.arch</text>
  <text x="360" y="254" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">process.version</text>
  <rect x="300" y="272" width="120" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="360" y="294" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#7c3aed">event loop</text>

  <!-- KIRISH (chap): argv, env, stdin -->
  <rect x="30" y="110" width="190" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="125" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">process.argv</text>
  <text x="125" y="149" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#15803d">CLI argumentlar</text>

  <rect x="30" y="170" width="190" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="125" y="192" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">process.env</text>
  <text x="125" y="209" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#15803d">muhit o'zgaruvchilar</text>

  <rect x="30" y="230" width="190" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="125" y="252" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">process.stdin</text>
  <text x="125" y="269" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#1d4ed8">foydalanuvchi inputi</text>

  <!-- kirish strelkalari -->
  <line x1="220" y1="133" x2="278" y2="160" stroke="#16a34a" stroke-width="2" marker-end="url(#agreen)"/>
  <line x1="220" y1="193" x2="278" y2="200" stroke="#16a34a" stroke-width="2" marker-end="url(#agreen)"/>
  <line x1="220" y1="253" x2="278" y2="240" stroke="#2563eb" stroke-width="2" marker-end="url(#ablue)"/>

  <!-- CHIQISH (o'ng): stdout, stderr, exit -->
  <rect x="500" y="120" width="190" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="595" y="142" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">process.stdout</text>
  <text x="595" y="159" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#1d4ed8">odatiy chiqish (log)</text>

  <rect x="500" y="180" width="190" height="46" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="595" y="202" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">process.stderr</text>
  <text x="595" y="219" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#b45309">xato/log oqimi</text>

  <rect x="500" y="240" width="190" height="46" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="595" y="262" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">process.exit(code)</text>
  <text x="595" y="279" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#b91c1c">0 = OK, ≠0 = xato</text>

  <!-- chiqish strelkalari -->
  <line x1="442" y1="160" x2="498" y2="143" stroke="#2563eb" stroke-width="2" marker-end="url(#ablue)"/>
  <line x1="442" y1="200" x2="498" y2="203" stroke="#f59e0b" stroke-width="2" marker-end="url(#aamber)"/>
  <line x1="442" y1="240" x2="498" y2="260" stroke="#dc2626" stroke-width="2" marker-end="url(#ared)"/>

  <!-- Signallar (pastdan) -->
  <rect x="180" y="356" width="360" height="56" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="360" y="378" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#7c3aed">Signallar va hodisalar</text>
  <text x="360" y="398" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#5b21b6">SIGINT (Ctrl+C) · SIGTERM · 'exit' · 'uncaughtException'</text>
  <line x1="360" y1="320" x2="360" y2="354" stroke="#7c3aed" stroke-width="2" marker-end="url(#apurple)"/>

  <defs>
    <marker id="agreen" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
    <marker id="ablue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="aamber" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f59e0b"/></marker>
    <marker id="ared" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/></marker>
    <marker id="apurple" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed"/></marker>
  </defs>
</svg>
