<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>Middleware zanjiri: so'rov req dan boshlab mw1, mw2, handler orqali o'tib res javobiga yetadi; har bosqichda next() keyingisiga uzatadi</title>
  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Middleware zanjiri: so'rov bilan javob orasida</text>
  <text x="360" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Har bir middleware next() chaqirib boshqaruvni keyingisiga uzatadi</text>

  <defs>
    <marker id="mwarr" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- REQ -->
  <rect x="20" y="150" width="96" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="68" y="184" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">req</text>
  <text x="68" y="206" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">so'rov kiradi</text>

  <!-- MW1 logger -->
  <rect x="150" y="145" width="120" height="90" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="210" y="173" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">mw1</text>
  <text x="210" y="194" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e293b">logger</text>
  <text x="210" y="214" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#64748b">so'rovni</text>
  <text x="210" y="228" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#64748b">yozadi</text>

  <!-- MW2 auth -->
  <rect x="300" y="145" width="120" height="90" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="360" y="173" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">mw2</text>
  <text x="360" y="194" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e293b">auth</text>
  <text x="360" y="214" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#64748b">req.user ni</text>
  <text x="360" y="228" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#64748b">qo'shadi</text>

  <!-- HANDLER -->
  <rect x="450" y="145" width="120" height="90" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="510" y="173" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">handler</text>
  <text x="510" y="194" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e293b">(route)</text>
  <text x="510" y="214" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#64748b">res.json()</text>
  <text x="510" y="228" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#64748b">javob beradi</text>

  <!-- RES -->
  <rect x="604" y="150" width="96" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="652" y="184" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">res</text>
  <text x="652" y="206" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">javob chiqadi</text>

  <!-- arrows + next() labels -->
  <line x1="116" y1="190" x2="146" y2="190" stroke="#f59e0b" stroke-width="3" marker-end="url(#mwarr)"/>
  <line x1="270" y1="190" x2="296" y2="190" stroke="#f59e0b" stroke-width="3" marker-end="url(#mwarr)"/>
  <line x1="420" y1="190" x2="446" y2="190" stroke="#f59e0b" stroke-width="3" marker-end="url(#mwarr)"/>
  <line x1="570" y1="190" x2="600" y2="190" stroke="#f59e0b" stroke-width="3" marker-end="url(#mwarr)"/>

  <rect x="244" y="105" width="62" height="22" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="275" y="120" text-anchor="middle" font-family="monospace" font-size="12" fill="#92400e">next()</text>
  <rect x="394" y="105" width="62" height="22" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="425" y="120" text-anchor="middle" font-family="monospace" font-size="12" fill="#92400e">next()</text>

  <!-- warning about missing next -->
  <rect x="120" y="270" width="480" height="34" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="360" y="292" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#991b1b">Agar middleware next() ni chaqirmasa — so'rov shu yerda muzlab qoladi (osiladi)</text>

  <!-- app.use order note -->
  <rect x="120" y="320" width="480" height="34" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="360" y="342" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e40af">app.use(...) yozilish TARTIBI = ishlash tartibi. Yuqoridan pastga oqadi.</text>

  <text x="360" y="384" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">Middleware = (req, res, next) funksiya: so'rovga "qo'l tekkizib" keyingisiga uzatadi</text>
</svg>
