<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>Node globallari xaritasi: globalThis markazda, atrofida process, Buffer, console, timer funksiyalari, fetch va structuredClone — brauzerda yo'q bo'lganlari qizil belgi bilan</title>
  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Node globallari xaritasi (require/import KERAK EMAS)</text>
  <text x="360" y="56" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">🟥 belgisi — bu narsa BRAUZERDA yo'q, faqat Node'da</text>

  <!-- markaz: globalThis -->
  <circle cx="360" cy="235" r="58" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="360" y="230" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#7c3aed">globalThis</text>
  <text x="360" y="250" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#6d28d9">( = global )</text>

  <!-- bog'lovchi chiziqlar -->
  <line x1="360" y1="177" x2="160" y2="110" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="360" y1="177" x2="560" y2="110" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="302" y1="235" x2="150" y2="235" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="418" y1="235" x2="570" y2="235" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="360" y1="293" x2="160" y2="360" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="360" y1="293" x2="560" y2="360" stroke="#cbd5e1" stroke-width="2"/>

  <!-- process (qizil = node maxsus) -->
  <rect x="40" y="80" width="200" height="62" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2.5"/>
  <text x="140" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">🟥 process</text>
  <text x="140" y="125" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">argv · env · cwd() · platform · exit()</text>

  <!-- Buffer (qizil) -->
  <rect x="480" y="80" width="200" height="62" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2.5"/>
  <text x="580" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">🟥 Buffer</text>
  <text x="580" y="125" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">binar ma'lumot (09-bobda chuqur)</text>

  <!-- console (har joyda bor) -->
  <rect x="20" y="206" width="130" height="58" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="85" y="230" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">console</text>
  <text x="85" y="250" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#475569">log · error · table · time</text>

  <!-- timerlar -->
  <rect x="570" y="206" width="130" height="58" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="635" y="230" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">timerlar</text>
  <text x="635" y="250" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#475569">setTimeout · setImmediate</text>

  <!-- fetch (node 18+) -->
  <rect x="40" y="330" width="200" height="62" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="140" y="354" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b45309">fetch (Node 18+)</text>
  <text x="140" y="375" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">tarmoq so'rovi — paket kerak emas</text>

  <!-- structuredClone -->
  <rect x="480" y="330" width="200" height="62" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="580" y="354" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#7c3aed">structuredClone</text>
  <text x="580" y="375" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">chuqur (deep) nusxa</text>
</svg>
