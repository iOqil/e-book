<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>TypeScript dan Node gacha oqim: .ts kodi tsconfig qoidalari bilan ikki yo'ldan ketadi — tsx orqali bevosita dev, yoki tsc bilan .js ga build qilib node ishga tushiradi</title>
  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">TypeScript -&gt; Node: ikki yo'l</text>
  <text x="360" y="55" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">tsconfig qoidalarni belgilaydi; tsx — dev, tsc -&gt; node — production</text>

  <defs>
    <marker id="ab" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="ag" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#16a34a"/></marker>
    <marker id="av" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#7c3aed"/></marker>
  </defs>

  <!-- .ts source -->
  <rect x="40" y="170" width="150" height="90" rx="13" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.4"/>
  <text x="115" y="205" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#6d28d9">.ts kodi</text>
  <text x="115" y="228" text-anchor="middle" font-family="monospace" font-size="12" fill="#5b21b6">src/app.ts</text>
  <text x="115" y="246" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#7c3aed">tiplar bilan</text>

  <!-- tsconfig governs -->
  <rect x="40" y="80" width="150" height="58" rx="11" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="115" y="104" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#92400e">tsconfig.json</text>
  <text x="115" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#b45309">target, module, strict</text>
  <line x1="115" y1="138" x2="115" y2="166" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#av)"/>

  <!-- DEV path: tsx -->
  <rect x="280" y="100" width="180" height="84" rx="13" fill="#dcfce7" stroke="#16a34a" stroke-width="2.4"/>
  <text x="370" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#166534">tsx (dev)</text>
  <text x="370" y="150" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#15803d">tsx src/app.ts</text>
  <text x="370" y="170" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#16a34a">kompilyatsiyasiz, tez</text>

  <!-- BUILD path: tsc -->
  <rect x="280" y="246" width="180" height="84" rx="13" fill="#dbeafe" stroke="#2563eb" stroke-width="2.4"/>
  <text x="370" y="274" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1d4ed8">tsc (build)</text>
  <text x="370" y="296" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#1e40af">tsc -&gt; dist/*.js</text>
  <text x="370" y="316" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#2563eb">tiplar o'chadi (sof JS)</text>

  <!-- node runtime -->
  <rect x="540" y="172" width="150" height="86" rx="13" fill="#dcfce7" stroke="#16a34a" stroke-width="2.4"/>
  <text x="615" y="206" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#166534">Node 24</text>
  <text x="615" y="228" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#16a34a">ishga tushadi</text>
  <text x="615" y="246" text-anchor="middle" font-family="monospace" font-size="11" fill="#15803d">JS bajariladi</text>

  <!-- arrows from source to two paths -->
  <line x1="190" y1="200" x2="276" y2="150" stroke="#16a34a" stroke-width="2.6" marker-end="url(#ag)"/>
  <text x="232" y="166" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#16a34a">dev yo'l</text>
  <line x1="190" y1="230" x2="276" y2="280" stroke="#2563eb" stroke-width="2.6" marker-end="url(#ab)"/>
  <text x="232" y="270" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#2563eb">build yo'l</text>

  <!-- arrows to node -->
  <line x1="460" y1="142" x2="536" y2="195" stroke="#16a34a" stroke-width="2.6" marker-end="url(#ag)"/>
  <line x1="460" y1="288" x2="536" y2="235" stroke="#2563eb" stroke-width="2.6" marker-end="url(#ab)"/>
  <text x="505" y="170" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#16a34a">to'g'ridan</text>
  <text x="505" y="262" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#2563eb">node dist/</text>

  <rect x="120" y="368" width="480" height="44" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="360" y="388" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#3730a3">Node 24'da flagsiz `node app.ts` ham ishlaydi (type-stripping) — lekin tip</text>
  <text x="360" y="404" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#3730a3">TEKSHIRMAYDI. Xatolarni ushlash uchun baribir `tsc --noEmit` kerak.</text>
</svg>
