<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>SemVer diagrammasi: versiya major.minor.patch dan iborat; caret belgisi minor va patch yangilanishiga ruxsat beradi lekin major'ni qotiradi, tilda belgisi esa faqat patch'ga ruxsat beradi</title>

  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">SemVer: 1.2.3 nimani anglatadi?</text>

  <!-- versiya raqami katta -->
  <text x="200" y="96" text-anchor="middle" font-family="Consolas, monospace" font-size="40" font-weight="bold" fill="#2563eb">1</text>
  <text x="248" y="96" text-anchor="middle" font-family="Consolas, monospace" font-size="40" font-weight="bold" fill="#475569">.</text>
  <text x="296" y="96" text-anchor="middle" font-family="Consolas, monospace" font-size="40" font-weight="bold" fill="#16a34a">2</text>
  <text x="344" y="96" text-anchor="middle" font-family="Consolas, monospace" font-size="40" font-weight="bold" fill="#475569">.</text>
  <text x="392" y="96" text-anchor="middle" font-family="Consolas, monospace" font-size="40" font-weight="bold" fill="#f59e0b">3</text>

  <!-- yorliqlar -->
  <text x="200" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">MAJOR</text>
  <text x="200" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">buzuvchi o'zgarish</text>
  <text x="296" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">MINOR</text>
  <text x="296" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">yangi imkoniyat</text>
  <text x="392" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#b45309">PATCH</text>
  <text x="392" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">xato tuzatish</text>

  <!-- caret qator -->
  <rect x="36" y="186" width="648" height="92" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="120" y="222" text-anchor="middle" font-family="Consolas, monospace" font-size="26" font-weight="bold" fill="#2563eb">^1.2.3</text>
  <text x="120" y="252" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">caret (eng keng tarqalgan)</text>
  <text x="430" y="214" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">RUXSAT: 1.2.3 -&gt; 1.9.9 (minor + patch yangilanadi)</text>
  <text x="430" y="240" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">QOTIRADI: 2.0.0 ga o'tmaydi (major saqlanadi)</text>
  <text x="430" y="264" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748b">mantiq: minor/patch orqaga mos, major buzadi</text>

  <!-- tilde qator -->
  <rect x="36" y="290" width="648" height="78" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="120" y="324" text-anchor="middle" font-family="Consolas, monospace" font-size="26" font-weight="bold" fill="#16a34a">~1.2.3</text>
  <text x="120" y="352" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">tilde (ehtiyotkor)</text>
  <text x="430" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">RUXSAT: 1.2.3 -&gt; 1.2.9 (faqat patch)</text>
  <text x="430" y="344" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">QOTIRADI: 1.3.0 ga o'tmaydi (minor saqlanadi)</text>

  <!-- pastki izoh -->
  <text x="360" y="404" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Aniq versiya: "1.2.3" (belgisiz) — hech qachon o'zgarmaydi.   "*" yoki "latest" — eng xavfli (har narsani oladi).</text>
  <text x="360" y="424" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#7c3aed">Eslatma: 0.x.y da caret boshqacha — ^0.2.3 faqat 0.2.x ga ruxsat beradi (0 versiya hali beqaror deb hisoblanadi)</text>
</svg>
