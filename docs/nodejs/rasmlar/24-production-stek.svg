<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>Production stek: foydalanuvchi -> nginx reverse proxy (TLS) -> Node cluster (PM2) -> MySQL bazasi; yon tomonda log fayllari va /health endpoint monitoringi</title>
  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="30" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Production stek (joylash arxitekturasi)</text>
  <text x="360" y="52" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Internet -> nginx (TLS) -> Node cluster -> DB; loglar va /health monitoring</text>

  <defs>
    <marker id="ar24p" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
  </defs>

  <!-- User -->
  <rect x="40" y="170" width="100" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="90" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">Foydalanuvchi</text>
  <text x="90" y="217" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#1e40af">brauzer / mobil</text>

  <!-- nginx -->
  <rect x="185" y="160" width="115" height="84" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2.4"/>
  <text x="242" y="187" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#166534">nginx</text>
  <text x="242" y="206" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#15803d">reverse proxy</text>
  <text x="242" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#15803d">TLS, gzip,</text>
  <text x="242" y="237" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#15803d">statik, rate limit</text>

  <!-- Node cluster -->
  <rect x="350" y="138" width="150" height="128" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.4"/>
  <text x="425" y="162" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#5b21b6">Node cluster</text>
  <text x="425" y="179" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#6d28d9">PM2 boshqaradi</text>
  <rect x="364" y="188" width="56" height="30" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="392" y="208" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#5b21b6">w1</text>
  <rect x="430" y="188" width="56" height="30" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="458" y="208" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#5b21b6">w2</text>
  <rect x="364" y="224" width="56" height="30" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="392" y="244" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#5b21b6">w3</text>
  <rect x="430" y="224" width="56" height="30" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="458" y="244" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#5b21b6">w4</text>

  <!-- DB -->
  <rect x="555" y="160" width="120" height="84" rx="11" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.4"/>
  <ellipse cx="615" cy="180" rx="40" ry="11" fill="#fff" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="615" y="208" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#92400e">MySQL</text>
  <text x="615" y="227" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#b45309">connection pool</text>

  <!-- arrows main flow -->
  <line x1="140" y1="202" x2="181" y2="202" stroke="#334155" stroke-width="2.4" marker-end="url(#ar24p)"/>
  <text x="160" y="194" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9.5" fill="#64748b">HTTPS</text>
  <line x1="300" y1="202" x2="346" y2="202" stroke="#334155" stroke-width="2.4" marker-end="url(#ar24p)"/>
  <text x="323" y="194" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9.5" fill="#64748b">HTTP</text>
  <line x1="500" y1="202" x2="551" y2="202" stroke="#334155" stroke-width="2.4" marker-end="url(#ar24p)"/>
  <text x="525" y="194" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9.5" fill="#64748b">SQL</text>

  <!-- Logs -->
  <rect x="350" y="300" width="150" height="50" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="425" y="322" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#991b1b">JSON loglar (pino)</text>
  <text x="425" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#991b1b">stdout -> log yig'gich</text>
  <line x1="425" y1="266" x2="425" y2="296" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Health -->
  <rect x="185" y="300" width="135" height="50" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="252" y="322" text-anchor="middle" font-family="monospace" font-size="12.5" font-weight="bold" fill="#1e40af">GET /health</text>
  <text x="252" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#1e40af">monitoring tekshiradi</text>
  <line x1="290" y1="296" x2="370" y2="266" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="4 3"/>

  <!-- Monitoring box -->
  <rect x="530" y="300" width="150" height="50" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
  <text x="605" y="322" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#334155">Monitoring</text>
  <text x="605" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#475569">uptime, alert, lag</text>

  <rect x="60" y="372" width="600" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="360" y="389" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1e40af">Node hech qachon Internetga to'g'ridan-to'g'ri ochilmaydi — har doim nginx orqasida turadi.</text>
  <text x="360" y="406" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1e40af">Secrets — env'da; loglar JSON; /health har soniyada tekshiriladi; deploy zero-downtime.</text>
</svg>
