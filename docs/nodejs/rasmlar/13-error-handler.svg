<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>Error-handling middleware oqimi: oddiy middleware da xato yuz berganda next(err) yoki throw orqali boshqaruv 4 argumentli markaziy error handlerga sakraydi</title>
  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Xato boshqaruvi: markaziy error handler</text>
  <text x="360" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">Xato yuz bersa, boshqaruv to'g'ridan-to'g'ri (err, req, res, next) handlerga sakraydi</text>

  <defs>
    <marker id="okarr" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#16a34a"/>
    </marker>
    <marker id="errarr" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- normal flow row -->
  <rect x="30" y="95" width="120" height="64" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2.3"/>
  <text x="90" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">req</text>
  <text x="90" y="144" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">so'rov</text>

  <rect x="200" y="95" width="130" height="64" rx="11" fill="#ffffff" stroke="#7c3aed" stroke-width="2.3"/>
  <text x="265" y="121" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#7c3aed">middleware</text>
  <text x="265" y="142" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#64748b">auth / parser</text>

  <rect x="380" y="95" width="130" height="64" rx="11" fill="#ffffff" stroke="#16a34a" stroke-width="2.3"/>
  <text x="445" y="121" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#16a34a">handler</text>
  <text x="445" y="142" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#64748b">route</text>

  <rect x="560" y="95" width="130" height="64" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2.3"/>
  <text x="625" y="121" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#16a34a">res 200</text>
  <text x="625" y="142" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">muvaffaqiyat</text>

  <line x1="150" y1="127" x2="196" y2="127" stroke="#16a34a" stroke-width="2.6" marker-end="url(#okarr)"/>
  <line x1="330" y1="127" x2="376" y2="127" stroke="#16a34a" stroke-width="2.6" marker-end="url(#okarr)"/>
  <line x1="510" y1="127" x2="556" y2="127" stroke="#16a34a" stroke-width="2.6" marker-end="url(#okarr)"/>
  <text x="360" y="82" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#16a34a">Oddiy oqim (xatosiz): next() bilan oldinga</text>

  <!-- error jump -->
  <text x="265" y="200" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#dc2626">throw / next(err)</text>
  <path d="M265,159 L265,178 L360,178 L360,260" fill="none" stroke="#dc2626" stroke-width="2.6" stroke-dasharray="6 4" marker-end="url(#errarr)"/>
  <path d="M445,159 L445,185 L405,185 L405,260" fill="none" stroke="#dc2626" stroke-width="2.6" stroke-dasharray="6 4" marker-end="url(#errarr)"/>
  <text x="510" y="200" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#dc2626">throw</text>

  <!-- error handler box -->
  <rect x="190" y="268" width="340" height="86" rx="13" fill="#fee2e2" stroke="#dc2626" stroke-width="2.6"/>
  <text x="360" y="296" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#991b1b">Markaziy Error Handler</text>
  <text x="360" y="320" text-anchor="middle" font-family="monospace" font-size="13" fill="#7f1d1d">(err, req, res, next) => {...}</text>
  <text x="360" y="342" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#991b1b">4 argument — Express buni xato handler deb biladi</text>

  <!-- error response -->
  <rect x="565" y="284" width="128" height="54" rx="11" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.3"/>
  <text x="629" y="309" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#92400e">res 4xx/5xx</text>
  <text x="629" y="328" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#92400e">{ xato: ... }</text>
  <line x1="530" y1="311" x2="561" y2="311" stroke="#dc2626" stroke-width="2.6" marker-end="url(#errarr)"/>

  <rect x="120" y="378" width="480" height="34" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="360" y="400" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e40af">Error handler HAMISHA oxirida — barcha route va middleware DAN keyin yoziladi</text>
</svg>
