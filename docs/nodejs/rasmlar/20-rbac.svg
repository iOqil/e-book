<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <title>RBAC: rollar va ruxsatlar - admin va user nimani qila oladi</title>
  <rect width="720" height="430" fill="#f8fafc"/>
  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">RBAC: rol -> ruxsat</text>
  <text x="360" y="50" text-anchor="middle" font-size="12" fill="#64748b">requireAuth (kimsan?)  ->  requireRole (nima qila olasan?)</text>

  <defs>
    <marker id="ok" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="no" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Roles -->
  <rect x="40" y="110" width="150" height="60" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <text x="115" y="138" text-anchor="middle" font-weight="700" fill="#7c3aed">user roli</text>
  <text x="115" y="158" text-anchor="middle" fill="#64748b" font-size="11">oddiy foydalanuvchi</text>

  <rect x="40" y="250" width="150" height="60" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <text x="115" y="278" text-anchor="middle" font-weight="700" fill="#dc2626">admin roli</text>
  <text x="115" y="298" text-anchor="middle" fill="#64748b" font-size="11">to'liq boshqaruv</text>

  <!-- Permissions -->
  <rect x="470" y="80" width="210" height="46" rx="8" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="575" y="108" text-anchor="middle" fill="#334155">GET /me (o'z profili)</text>

  <rect x="470" y="150" width="210" height="46" rx="8" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="575" y="178" text-anchor="middle" fill="#334155">CRUD o'z vazifalari</text>

  <rect x="470" y="230" width="210" height="46" rx="8" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="575" y="258" text-anchor="middle" fill="#334155">GET /admin/users</text>

  <rect x="470" y="300" width="210" height="46" rx="8" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="575" y="328" text-anchor="middle" fill="#334155">DELETE har qanday user</text>

  <!-- user -> permissions (allowed) -->
  <line x1="190" y1="135" x2="466" y2="103" stroke="#16a34a" stroke-width="2" marker-end="url(#ok)"/>
  <line x1="190" y1="148" x2="466" y2="173" stroke="#16a34a" stroke-width="2" marker-end="url(#ok)"/>
  <!-- user -> admin perms (denied) -->
  <line x1="190" y1="160" x2="466" y2="250" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#no)"/>
  <text x="320" y="212" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="700">403 taqiqlandi</text>

  <!-- admin -> all (allowed) -->
  <line x1="190" y1="270" x2="466" y2="258" stroke="#16a34a" stroke-width="2" marker-end="url(#ok)"/>
  <line x1="190" y1="285" x2="466" y2="320" stroke="#16a34a" stroke-width="2" marker-end="url(#ok)"/>
  <line x1="190" y1="258" x2="466" y2="180" stroke="#16a34a" stroke-width="2" stroke-dasharray="2 3" marker-end="url(#ok)"/>

  <!-- legend -->
  <rect x="40" y="360" width="640" height="50" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="60" y1="378" x2="95" y2="378" stroke="#16a34a" stroke-width="2" marker-end="url(#ok)"/>
  <text x="105" y="382" fill="#334155" font-size="12">ruxsat berilgan (200)</text>
  <line x1="290" y1="378" x2="325" y2="378" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#no)"/>
  <text x="335" y="382" fill="#334155" font-size="12">taqiqlangan (403)</text>
  <text x="60" y="400" fill="#64748b" font-size="11">admin user'ning hamma ruxsatlarini meros qiladi + qo'shimcha admin amallar</text>
</svg>
