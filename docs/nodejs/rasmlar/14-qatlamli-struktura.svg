<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>Qatlamli REST API strukturasi: so'rov route, controller va service qatlamlaridan o'tib ma'lumot omboriga yetadi; har qatlamning aniq vazifasi bor</title>
  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Qatlamli struktura: route &#8594; controller &#8594; service</text>
  <text x="360" y="55" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Har qatlam bitta vazifa bajaradi — sof kod, oson test, oson o'zgartirish</text>

  <defs>
    <marker id="qarr" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#f59e0b"/>
    </marker>
    <marker id="qarrback" markerWidth="11" markerHeight="11" refX="2" refY="4" orient="auto">
      <path d="M9,0 L0,4 L9,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- CLIENT -->
  <rect x="40" y="95" width="120" height="240" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="100" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">Client</text>
  <text x="100" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#475569">fetch / brauzer</text>
  <text x="100" y="240" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#475569">HTTP so'rov</text>

  <!-- ROUTE -->
  <rect x="195" y="95" width="120" height="240" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="255" y="125" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">routes</text>
  <text x="255" y="150" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e293b">Router()</text>
  <line x1="210" y1="162" x2="300" y2="162" stroke="#e2e8f0" stroke-width="1"/>
  <text x="255" y="182" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">URL + metodni</text>
  <text x="255" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">controllerga</text>
  <text x="255" y="214" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">bog'laydi</text>
  <text x="255" y="252" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#94a3b8">GET /:id</text>
  <text x="255" y="268" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#94a3b8">POST /</text>

  <!-- CONTROLLER -->
  <rect x="350" y="95" width="120" height="240" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="410" y="125" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#d97706">controller</text>
  <line x1="365" y1="138" x2="455" y2="138" stroke="#e2e8f0" stroke-width="1"/>
  <text x="410" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">req o'qiydi</text>
  <text x="410" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">status tanlaydi</text>
  <text x="410" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">res.json yozadi</text>
  <line x1="365" y1="210" x2="455" y2="210" stroke="#e2e8f0" stroke-width="1"/>
  <text x="410" y="232" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#94a3b8">HTTP biladi,</text>
  <text x="410" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#94a3b8">biznesni bilmaydi</text>

  <!-- SERVICE -->
  <rect x="505" y="95" width="120" height="240" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="565" y="125" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">service</text>
  <line x1="520" y1="138" x2="610" y2="138" stroke="#e2e8f0" stroke-width="1"/>
  <text x="565" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">biznes mantiq</text>
  <text x="565" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">CRUD amallar</text>
  <text x="565" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#475569">filtr/sort/page</text>
  <line x1="520" y1="210" x2="610" y2="210" stroke="#e2e8f0" stroke-width="1"/>
  <text x="565" y="232" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#94a3b8">HTTP ni bilmaydi —</text>
  <text x="565" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#94a3b8">alohida test bo'ladi</text>

  <!-- DB -->
  <rect x="640" y="135" width="62" height="160" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="671" y="205" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#475569" transform="rotate(90 671 205)">DB (16-bob)</text>

  <!-- forward arrows -->
  <line x1="160" y1="180" x2="192" y2="180" stroke="#f59e0b" stroke-width="3" marker-end="url(#qarr)"/>
  <line x1="315" y1="180" x2="347" y2="180" stroke="#f59e0b" stroke-width="3" marker-end="url(#qarr)"/>
  <line x1="470" y1="180" x2="502" y2="180" stroke="#f59e0b" stroke-width="3" marker-end="url(#qarr)"/>
  <line x1="625" y1="180" x2="638" y2="180" stroke="#64748b" stroke-width="2.5" stroke-dasharray="4 3"/>

  <!-- back arrows (javob) -->
  <line x1="192" y1="250" x2="160" y2="250" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#qarrback)"/>
  <line x1="347" y1="250" x2="315" y2="250" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#qarrback)"/>
  <line x1="502" y1="250" x2="470" y2="250" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#qarrback)"/>
  <text x="335" y="296" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#94a3b8">&#8592; javob (data) qaytib oqadi</text>

  <!-- bottom note -->
  <rect x="40" y="358" width="640" height="54" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="360" y="380" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#15803d">Bog'liqlik bir yo'nalishda: route &#8594; controller &#8594; service. Service hech kimni bilmaydi.</text>
  <text x="360" y="400" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#15803d">Shuning uchun service ni Express'siz ham, DB'siz ham (mock bilan) test qilsa bo'ladi.</text>
</svg>
