<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>Markaziy xato boshqaruvi: route va validatsiya middleware ichida throw qilingan custom Error sinflari (NotFoundError, ValidationError, UnauthorizedError, AppError) bitta markaziy error middleware ga sakraydi va u statusCode hamda RFC 7807 Problem Details JSON javobini qaytaradi</title>
  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Markaziy xato boshqaruvi: throw &#8594; handler &#8594; JSON</text>
  <text x="360" y="55" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Har joydan throw &#8212; bitta markazda javobga aylanadi (RFC 7807)</text>

  <defs>
    <marker id="me-red" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <marker id="me-amber" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- error sources -->
  <text x="120" y="92" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#7c3aed">Xato manbalari (throw)</text>
  <rect x="36" y="104" width="168" height="40" rx="9" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="120" y="129" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#991b1b">NotFoundError (404)</text>
  <rect x="36" y="152" width="168" height="40" rx="9" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="120" y="177" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#991b1b">ValidationError (422)</text>
  <rect x="36" y="200" width="168" height="40" rx="9" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="120" y="225" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#991b1b">UnauthorizedError (401)</text>
  <rect x="36" y="248" width="168" height="40" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="120" y="273" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#92400e">Error (kutilmagan 500)</text>

  <!-- arrows into handler -->
  <path d="M204,124 C270,124 270,196 300,200" fill="none" stroke="#dc2626" stroke-width="2.3" marker-end="url(#me-red)"/>
  <path d="M204,172 C260,172 270,200 300,205" fill="none" stroke="#dc2626" stroke-width="2.3" marker-end="url(#me-red)"/>
  <path d="M204,220 L300,213" fill="none" stroke="#dc2626" stroke-width="2.3" marker-end="url(#me-red)"/>
  <path d="M204,268 C260,268 272,224 300,219" fill="none" stroke="#f59e0b" stroke-width="2.3" marker-end="url(#me-amber)"/>

  <!-- central error handler -->
  <rect x="305" y="150" width="190" height="120" rx="13" fill="#fee2e2" stroke="#dc2626" stroke-width="2.7"/>
  <text x="400" y="180" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#991b1b">Markaziy handler</text>
  <text x="400" y="201" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#7f1d1d">(err, req, res, next)</text>
  <line x1="320" y1="212" x2="480" y2="212" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="400" y="230" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#7f1d1d">statusCode tanlash</text>
  <text x="400" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#7f1d1d">log (5xx) + dev/prod</text>
  <text x="400" y="264" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#7f1d1d">Problem Details yasash</text>

  <!-- json response -->
  <path d="M495,210 L560,210" fill="none" stroke="#dc2626" stroke-width="2.7" marker-end="url(#me-red)"/>
  <rect x="563" y="150" width="142" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.4"/>
  <text x="634" y="176" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#15803d">JSON javob</text>
  <text x="634" y="196" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#166534">application/</text>
  <text x="634" y="210" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#166534">problem+json</text>
  <text x="634" y="230" text-anchor="middle" font-family="monospace" font-size="10" fill="#166534">{ type, title,</text>
  <text x="634" y="244" text-anchor="middle" font-family="monospace" font-size="10" fill="#166534">  status, code,</text>
  <text x="634" y="258" text-anchor="middle" font-family="monospace" font-size="10" fill="#166534">  errors }</text>

  <!-- bottom note -->
  <rect x="60" y="338" width="600" height="72" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.7"/>
  <text x="360" y="362" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">Operatsion xato vs dasturchi xatosi</text>
  <text x="360" y="383" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1e3a8a">Operatsion (AppError): kutilgan &#8212; toza xabar mijozga. Dasturchi xatosi (500): yashir, faqat logga.</text>
  <text x="360" y="402" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1e3a8a">Error middleware HAMISHA eng oxirida &#8212; 4 argument bilan Express uni xato handler deb biladi.</text>
</svg>
