<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>Typed Express: Request generik turi to'rt parametr oladi — Params, ResBody, ReqBody, ReqQuery — shu tufayli req.params, res.json va req.body avtomatik tiplanadi va xato kompilyatsiyada ushlanadi</title>
  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Typed Express: Request generik parametrlari</text>
  <text x="360" y="55" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Request&lt;Params, ResBody, ReqBody, ReqQuery&gt; — har bir slot bir narsani tiplaydi</text>

  <!-- the generic signature -->
  <rect x="70" y="78" width="580" height="52" rx="10" fill="#1e293b"/>
  <text x="360" y="110" text-anchor="middle" font-family="monospace" font-size="15" fill="#e2e8f0">Request&lt;<tspan fill="#f59e0b">Params</tspan>, <tspan fill="#16a34a">ResBody</tspan>, <tspan fill="#60a5fa">ReqBody</tspan>, <tspan fill="#c084fc">ReqQuery</tspan>&gt;</text>

  <!-- Params -->
  <rect x="44" y="162" width="150" height="120" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.4"/>
  <text x="119" y="187" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#92400e">1. Params</text>
  <text x="119" y="212" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#b45309">req.params</text>
  <text x="119" y="236" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#92400e">URL /:id qismi</text>
  <text x="119" y="258" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#b45309">{ id: string }</text>

  <!-- ResBody -->
  <rect x="206" y="162" width="150" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.4"/>
  <text x="281" y="187" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#166534">2. ResBody</text>
  <text x="281" y="212" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#15803d">res.json(...)</text>
  <text x="281" y="236" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#166534">javob tanasi</text>
  <text x="281" y="258" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#15803d">Vazifa</text>

  <!-- ReqBody -->
  <rect x="368" y="162" width="150" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.4"/>
  <text x="443" y="187" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8">3. ReqBody</text>
  <text x="443" y="212" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#1e40af">req.body</text>
  <text x="443" y="236" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#1d4ed8">mijoz yuborgan</text>
  <text x="443" y="258" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#1e40af">VazifaYaratish</text>

  <!-- ReqQuery -->
  <rect x="530" y="162" width="150" height="120" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.4"/>
  <text x="605" y="187" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#6d28d9">4. ReqQuery</text>
  <text x="605" y="212" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#5b21b6">req.query</text>
  <text x="605" y="236" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#6d28d9">?sahifa=2</text>
  <text x="605" y="258" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#5b21b6">{ sahifa?: string }</text>

  <!-- connector lines from signature to boxes -->
  <line x1="240" y1="130" x2="119" y2="160" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="4 3"/>
  <line x1="320" y1="130" x2="281" y2="160" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="4 3"/>
  <line x1="405" y1="130" x2="443" y2="160" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="4 3"/>
  <line x1="490" y1="130" x2="605" y2="160" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="4 3"/>

  <!-- payoff box -->
  <rect x="60" y="312" width="600" height="98" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="360" y="335" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Foyda: IDE avtomat to'ldiradi, xato KOMPILYATSIYADA ushlanadi</text>
  <text x="360" y="360" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#16a34a">req.body.sarlavha  // string — IDE biladi</text>
  <text x="360" y="382" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#dc2626">req.body.narx  // XATO: VazifaYaratish'da yo'q (TS2339)</text>
  <text x="360" y="402" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#64748b">Faqat kerakli slotni bering, qolganini `unknown` qoldiring</text>
</svg>
