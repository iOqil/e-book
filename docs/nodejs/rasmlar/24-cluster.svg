<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <title>Cluster moduli: master jarayon so'rovlarni worker'larga tarqatadi, har bir worker alohida CPU yadrosida ishlaydi va bitta portni bo'lishadi</title>
  <rect x="0" y="0" width="720" height="430" fill="#f8fafc"/>

  <text x="360" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Cluster moduli: bitta port, ko'p yadro</text>
  <text x="360" y="55" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Master so'rovlarni teng tarqatadi (load balancing); har worker alohida jarayon</text>

  <defs>
    <marker id="ar24c" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="ar24g" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Incoming requests -->
  <rect x="30" y="180" width="110" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="85" y="208" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">So'rovlar</text>
  <text x="85" y="228" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#1e40af">:3000 ga</text>
  <text x="85" y="244" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748b">r1 r2 r3 r4...</text>

  <!-- Master -->
  <rect x="200" y="170" width="130" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.4"/>
  <text x="265" y="200" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#5b21b6">MASTER</text>
  <text x="265" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5b21b6">isPrimary</text>
  <text x="265" y="238" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#6d28d9">portni egallaydi</text>
  <text x="265" y="253" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#6d28d9">+ fork() x N</text>

  <line x1="140" y1="215" x2="196" y2="215" stroke="#2563eb" stroke-width="2.4" marker-end="url(#ar24c)"/>

  <!-- Workers -->
  <g>
    <rect x="420" y="80" width="150" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="495" y="103" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">Worker 1 (PID a)</text>
    <text x="495" y="123" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#15803d">Express app nusxasi</text>

    <rect x="420" y="150" width="150" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="495" y="173" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">Worker 2 (PID b)</text>
    <text x="495" y="193" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#15803d">Express app nusxasi</text>

    <rect x="420" y="220" width="150" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="495" y="243" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">Worker 3 (PID c)</text>
    <text x="495" y="263" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#15803d">Express app nusxasi</text>

    <rect x="420" y="290" width="150" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="495" y="313" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#166534">Worker 4 (PID d)</text>
    <text x="495" y="333" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#15803d">Express app nusxasi</text>
  </g>

  <line x1="330" y1="200" x2="416" y2="108" stroke="#16a34a" stroke-width="2" marker-end="url(#ar24g)"/>
  <line x1="330" y1="210" x2="416" y2="178" stroke="#16a34a" stroke-width="2" marker-end="url(#ar24g)"/>
  <line x1="330" y1="225" x2="416" y2="248" stroke="#16a34a" stroke-width="2" marker-end="url(#ar24g)"/>
  <line x1="330" y1="235" x2="416" y2="318" stroke="#16a34a" stroke-width="2" marker-end="url(#ar24g)"/>

  <!-- CPU cores -->
  <g>
    <rect x="620" y="84" width="74" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="657" y="105" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#92400e">Yadro 1</text>
    <text x="657" y="121" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9.5" fill="#b45309">CPU core</text>

    <rect x="620" y="154" width="74" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="657" y="175" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#92400e">Yadro 2</text>
    <text x="657" y="191" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9.5" fill="#b45309">CPU core</text>

    <rect x="620" y="224" width="74" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="657" y="245" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#92400e">Yadro 3</text>
    <text x="657" y="261" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9.5" fill="#b45309">CPU core</text>

    <rect x="620" y="294" width="74" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="657" y="315" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#92400e">Yadro 4</text>
    <text x="657" y="331" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9.5" fill="#b45309">CPU core</text>
  </g>

  <line x1="570" y1="108" x2="618" y2="108" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="570" y1="178" x2="618" y2="178" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="570" y1="248" x2="618" y2="248" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="570" y1="318" x2="618" y2="318" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 3"/>

  <rect x="120" y="372" width="480" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="360" y="389" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1e40af">Bitta worker yiqilsa, master uni qayta tug'adi (fork) — ilova ishlashda davom etadi.</text>
  <text x="360" y="406" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1e40af">N = os.availableParallelism() (mavjud yadrolar soni)</text>
</svg>
