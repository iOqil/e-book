<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470">
  <title>Kesh darajalari: klient -> CDN -> ilova (in-memory/Redis) -> ma'lumotlar bazasi; har qatlam yaqinroq va tezroq, lekin eskirish xavfi ortadi</title>
  <rect x="0" y="0" width="880" height="470" fill="#f8fafc"/>
  <text x="440" y="34" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b" text-anchor="middle">Kesh darajalari: so'rov yo'lidagi qatlamlar</text>
  <text x="440" y="58" font-family="Segoe UI" font-size="14" fill="#64748b" text-anchor="middle">Chapdan o'ngga: foydalanuvchiga yaqinroq = tezroq, lekin eskirish (stale) xavfi kattaroq</text>

  <!-- 5 ustun -->
  <!-- Klient -->
  <rect x="30" y="110" width="140" height="170" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="100" y="138" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">1. Klient</text>
  <text x="100" y="160" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">brauzer / ilova</text>
  <line x1="48" y1="174" x2="152" y2="174" stroke="#94a3b8" stroke-width="1"/>
  <text x="100" y="196" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">HTTP cache</text>
  <text x="100" y="216" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">localStorage</text>
  <text x="100" y="252" font-family="Segoe UI" font-size="13" fill="#16a34a" text-anchor="middle">~0 ms</text>
  <text x="100" y="270" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">tarmoqsiz</text>

  <!-- CDN -->
  <rect x="200" y="110" width="140" height="170" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="270" y="138" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">2. CDN</text>
  <text x="270" y="160" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">chekka tugun</text>
  <line x1="218" y1="174" x2="322" y2="174" stroke="#94a3b8" stroke-width="1"/>
  <text x="270" y="196" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">statik fayl</text>
  <text x="270" y="216" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">rasm / JS / CSS</text>
  <text x="270" y="252" font-family="Segoe UI" font-size="13" fill="#16a34a" text-anchor="middle">~ms-lar</text>
  <text x="270" y="270" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">geografik yaqin</text>

  <!-- Ilova (in-memory) -->
  <rect x="370" y="110" width="140" height="170" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="440" y="138" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">3. Ilova</text>
  <text x="440" y="160" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">in-memory</text>
  <line x1="388" y1="174" x2="492" y2="174" stroke="#94a3b8" stroke-width="1"/>
  <text x="440" y="196" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">Map / LRU</text>
  <text x="440" y="216" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">jarayon ichida</text>
  <text x="440" y="252" font-family="Segoe UI" font-size="13" fill="#16a34a" text-anchor="middle">&lt; 1 ms</text>
  <text x="440" y="270" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">node-ga xos</text>

  <!-- Redis -->
  <rect x="540" y="110" width="140" height="170" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="610" y="138" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">4. Redis</text>
  <text x="610" y="160" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">taqsimlangan</text>
  <line x1="558" y1="174" x2="662" y2="174" stroke="#94a3b8" stroke-width="1"/>
  <text x="610" y="196" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">umumiy kesh</text>
  <text x="610" y="216" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">nodelar bo'lishadi</text>
  <text x="610" y="252" font-family="Segoe UI" font-size="13" fill="#16a34a" text-anchor="middle">~1-5 ms</text>
  <text x="610" y="270" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">tarmoq sakrash</text>

  <!-- DB -->
  <rect x="710" y="110" width="140" height="170" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="780" y="138" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">5. DB</text>
  <text x="780" y="160" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">manba haqiqat</text>
  <line x1="728" y1="174" x2="832" y2="174" stroke="#94a3b8" stroke-width="1"/>
  <text x="780" y="196" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">source of truth</text>
  <text x="780" y="216" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">disk / so'rov</text>
  <text x="780" y="252" font-family="Segoe UI" font-size="13" fill="#dc2626" text-anchor="middle">~10-100 ms</text>
  <text x="780" y="270" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">eng sekin</text>

  <!-- oqim o'qlari -->
  <defs>
    <marker id="ar20l" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <line x1="170" y1="195" x2="198" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#ar20l)"/>
  <line x1="340" y1="195" x2="368" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#ar20l)"/>
  <line x1="510" y1="195" x2="538" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#ar20l)"/>
  <line x1="680" y1="195" x2="708" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#ar20l)"/>

  <!-- pastki o'qlar: yaqinroq/tezroq vs eskirish -->
  <rect x="30" y="330" width="490" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="275" y="357" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#15803d" text-anchor="middle">&#8592; Yaqinroq, tezroq, DB yuki kamroq</text>

  <rect x="540" y="330" width="310" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="695" y="357" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">Eskirish (stale) xavfi kattaroq &#8594;</text>

  <text x="440" y="420" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">Asosiy savol HAR qatlamda bir xil: ma'lumot QANCHA vaqt eskirgan bo'lishi mumkin?</text>
  <text x="440" y="445" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">Kesh = tezlik uchun eskirgan ma'lumotga ataylab rozilik berish (ongli trade-off)</text>
</svg>
