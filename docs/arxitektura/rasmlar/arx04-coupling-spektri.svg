<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520">
  <title>Coupling spektri: eng yomon (content) dan eng yaxshi (data) gacha, qattiqdan boshqa tomon</title>
  <rect x="0" y="0" width="860" height="520" fill="#f8fafc"/>
  <text x="430" y="34" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">Coupling spektri — qattiq (tight) dan bo'sh (loose) gacha</text>

  <!-- Spektr o'qi -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dc2626"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="60" y="70" width="740" height="20" rx="10" fill="url(#grad)"/>
  <text x="70" y="110" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">Eng yomon (qattiq, mo'rt)</text>
  <text x="790" y="110" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="end">Eng yaxshi (bo'sh, moslashuvchan)</text>

  <!-- 5 turdagi coupling kartalari -->
  <g font-family="Segoe UI">
    <!-- Content -->
    <rect x="60" y="135" width="135" height="120" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text x="127" y="160" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="middle">Content</text>
    <text x="127" y="182" font-size="13" fill="#334155" text-anchor="middle">Modul boshqaning</text>
    <text x="127" y="200" font-size="13" fill="#334155" text-anchor="middle">ICHKI holatiga</text>
    <text x="127" y="218" font-size="13" fill="#334155" text-anchor="middle">to'g'ridan kiradi</text>
    <text x="127" y="242" font-size="13" fill="#64748b" text-anchor="middle">(private maydon)</text>

    <!-- Common -->
    <rect x="205" y="135" width="135" height="120" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text x="272" y="160" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="middle">Common</text>
    <text x="272" y="182" font-size="13" fill="#334155" text-anchor="middle">Umumiy global</text>
    <text x="272" y="200" font-size="13" fill="#334155" text-anchor="middle">holatga (global</text>
    <text x="272" y="218" font-size="13" fill="#334155" text-anchor="middle">o'zgaruvchi)</text>
    <text x="272" y="242" font-size="13" fill="#64748b" text-anchor="middle">birga bog'lanish</text>

    <!-- Control -->
    <rect x="350" y="135" width="135" height="120" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="417" y="160" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">Control</text>
    <text x="417" y="182" font-size="13" fill="#334155" text-anchor="middle">Flag/bayroq orqali</text>
    <text x="417" y="200" font-size="13" fill="#334155" text-anchor="middle">boshqaning</text>
    <text x="417" y="218" font-size="13" fill="#334155" text-anchor="middle">mantiqini boshqarish</text>
    <text x="417" y="242" font-size="13" fill="#64748b" text-anchor="middle">(doFlag=true)</text>

    <!-- Stamp -->
    <rect x="495" y="135" width="135" height="120" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="562" y="160" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">Stamp</text>
    <text x="562" y="182" font-size="13" fill="#334155" text-anchor="middle">Butun struktura</text>
    <text x="562" y="200" font-size="13" fill="#334155" text-anchor="middle">uzatiladi, lekin</text>
    <text x="562" y="218" font-size="13" fill="#334155" text-anchor="middle">faqat qismi kerak</text>
    <text x="562" y="242" font-size="13" fill="#64748b" text-anchor="middle">(katta obyekt)</text>

    <!-- Data -->
    <rect x="640" y="135" width="160" height="120" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="720" y="160" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">Data</text>
    <text x="720" y="182" font-size="13" fill="#334155" text-anchor="middle">Faqat kerakli</text>
    <text x="720" y="200" font-size="13" fill="#334155" text-anchor="middle">oddiy parametrlar</text>
    <text x="720" y="218" font-size="13" fill="#334155" text-anchor="middle">uzatiladi</text>
    <text x="720" y="242" font-size="13" fill="#64748b" text-anchor="middle">(eng yaxshi)</text>
  </g>

  <!-- Misol: tight vs loose -->
  <text x="60" y="300" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">Misol: OrderService -> xabar yuborish</text>

  <!-- TIGHT -->
  <rect x="60" y="320" width="350" height="170" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="235" y="345" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="middle">QATTIQ (tight)</text>
  <rect x="85" y="360" width="140" height="50" rx="6" fill="#ffffff" stroke="#dc2626"/>
  <text x="155" y="385" font-family="Segoe UI" font-size="13" fill="#1e293b" text-anchor="middle">OrderService</text>
  <text x="155" y="402" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">new EmailSender()</text>
  <rect x="250" y="360" width="140" height="50" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="320" y="390" font-family="Segoe UI" font-size="13" fill="#1e293b" text-anchor="middle">EmailSender</text>
  <line x1="225" y1="385" x2="248" y2="385" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="235" y="440" font-family="Segoe UI" font-size="13" fill="#991b1b" text-anchor="middle">Konkret klassga mixlangan.</text>
  <text x="235" y="460" font-family="Segoe UI" font-size="13" fill="#991b1b" text-anchor="middle">SMS qo'shish = OrderService'ni</text>
  <text x="235" y="478" font-family="Segoe UI" font-size="13" fill="#991b1b" text-anchor="middle">o'zgartirish. Testda haqiqiy email.</text>

  <!-- LOOSE -->
  <rect x="450" y="320" width="350" height="170" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="625" y="345" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">BO'SH (loose)</text>
  <rect x="470" y="360" width="125" height="50" rx="6" fill="#ffffff" stroke="#16a34a"/>
  <text x="532" y="385" font-family="Segoe UI" font-size="13" fill="#1e293b" text-anchor="middle">OrderService</text>
  <text x="532" y="402" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">notifier: Notifier</text>
  <rect x="640" y="355" width="135" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="707" y="377" font-family="Segoe UI" font-size="13" fill="#1e3a8a" text-anchor="middle">«interface» Notifier</text>
  <rect x="640" y="395" width="64" height="26" rx="5" fill="#ffffff" stroke="#16a34a"/>
  <text x="672" y="412" font-family="Segoe UI" font-size="13" fill="#1e293b" text-anchor="middle">Email</text>
  <rect x="711" y="395" width="64" height="26" rx="5" fill="#ffffff" stroke="#16a34a"/>
  <text x="743" y="412" font-family="Segoe UI" font-size="13" fill="#1e293b" text-anchor="middle">SMS</text>
  <line x1="595" y1="377" x2="638" y2="372" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="672" y1="394" x2="672" y2="391" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3"/>
  <line x1="743" y1="394" x2="711" y2="391" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3"/>
  <text x="625" y="445" font-family="Segoe UI" font-size="13" fill="#166534" text-anchor="middle">Abstraksiyaga bog'langan (DIP).</text>
  <text x="625" y="465" font-family="Segoe UI" font-size="13" fill="#166534" text-anchor="middle">Yangi kanal = yangi adapter,</text>
  <text x="625" y="483" font-family="Segoe UI" font-size="13" fill="#166534" text-anchor="middle">OrderService'ga tegmaymiz. Testda fake.</text>
</svg>
