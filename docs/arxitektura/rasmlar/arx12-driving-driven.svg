<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470">
  <title>Driving (primary) va Driven (secondary) portlar/adapterlar: chapda driving adapter biznesni CHAQIRADI, o'ngda biznes driven portni chaqiradi va driven adapter uni implements qiladi; oqim chapdan o'ngga</title>

  <rect x="0" y="0" width="820" height="470" fill="#f8fafc"/>

  <text x="410" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Driving vs Driven portlar — kim kimni chaqiradi?</text>

  <!-- ===== CHAP: DRIVING (primary) ===== -->
  <text x="150" y="74" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">DRIVING (primary)</text>
  <text x="150" y="93" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">tashqi dunyo biznesni chaqiradi</text>

  <rect x="55" y="115" width="190" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="138" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">DRIVING ADAPTER</text>
  <text x="150" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">REST controller / Test / CLI</text>

  <!-- ===== MARKAZ: BIZNES ===== -->
  <rect x="320" y="180" width="180" height="110" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="410" y="220" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#92400e">BIZNES MANTIQ</text>
  <text x="410" y="242" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">RoyxatdanOtkaz</text>
  <text x="410" y="260" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309">(use-case)</text>

  <!-- driving port (markazga kiruvchi interfeys) -->
  <rect x="265" y="205" width="60" height="60" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="295" y="232" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#2563eb">driving</text>
  <text x="295" y="248" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#2563eb">port</text>

  <!-- ===== O'NG: DRIVEN (secondary) ===== -->
  <text x="660" y="74" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">DRIVEN (secondary)</text>
  <text x="660" y="93" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">biznes infratuzilmani chaqiradi</text>

  <!-- driven port (markazdan chiquvchi interfeys) -->
  <rect x="495" y="205" width="60" height="60" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="525" y="232" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#16a34a">driven</text>
  <text x="525" y="248" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#16a34a">port</text>

  <rect x="575" y="115" width="190" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="670" y="138" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">DRIVEN ADAPTER</text>
  <text x="670" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">DB repo / Email / Queue</text>

  <!-- ===== O'QLAR ===== -->
  <!-- driving adapter -> driving port (biznesni chaqiradi) -->
  <line x1="150" y1="171" x2="290" y2="208" stroke="#2563eb" stroke-width="3" marker-end="url(#bluearr)"/>
  <text x="210" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#2563eb">chaqiradi</text>

  <!-- biznes -> driven port (biznes interfeysni chaqiradi) -->
  <line x1="500" y1="235" x2="493" y2="235" stroke="#16a34a" stroke-width="3" marker-end="url(#greenarr)"/>

  <!-- driven adapter -> driven port (IMPLEMENTS, o'q ICHKARIGA/portga) -->
  <line x1="670" y1="171" x2="540" y2="208" stroke="#16a34a" stroke-width="3" marker-end="url(#greenarr)"/>
  <text x="625" y="196" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">implements</text>

  <!-- umumiy oqim o'qi -->
  <line x1="80" y1="330" x2="740" y2="330" stroke="#94a3b8" stroke-width="2" marker-end="url(#grayarr)"/>
  <text x="410" y="322" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">boshqaruv oqimi: tashqi -&gt; biznes -&gt; infratuzilma</text>

  <!-- pastki taqqoslash jadvali -->
  <rect x="55" y="355" width="345" height="92" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="227" y="377" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">DRIVING (kim biznesni ishlatadi)</text>
  <text x="227" y="399" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">port = biznes TAKLIF qiladigan API</text>
  <text x="227" y="418" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">adapter biznesni CHAQIRADI</text>
  <text x="227" y="436" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">REST, GraphQL, CLI, test, scheduler</text>

  <rect x="420" y="355" width="345" height="92" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="592" y="377" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">DRIVEN (biznes nimaga muhtoj)</text>
  <text x="592" y="399" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">port = biznes TALAB qiladigan interfeys</text>
  <text x="592" y="418" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">adapter portni IMPLEMENTS qiladi</text>
  <text x="592" y="436" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">DB, email, to'lov, navbat, kesh</text>

  <defs>
    <marker id="bluearr" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto">
      <path d="M1,1 L10,5 L1,9 Z" fill="#2563eb"/>
    </marker>
    <marker id="greenarr" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto">
      <path d="M1,1 L10,5 L1,9 Z" fill="#16a34a"/>
    </marker>
    <marker id="grayarr" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto">
      <path d="M1,1 L10,5 L1,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
