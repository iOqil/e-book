<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" width="860" height="540">
  <title>Distributed monolit anti-pattern: alohida deploy qilingan, lekin qattiq bog'langan servislar - ikkala dunyoning kamchiligi</title>
  <rect x="0" y="0" width="860" height="540" fill="#f8fafc"/>
  <text x="430" y="34" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#dc2626" text-anchor="middle">Anti-pattern: Distributed Monolith</text>
  <text x="430" y="58" font-family="Segoe UI" font-size="14" fill="#64748b" text-anchor="middle">Tarmoq bo'ylab tarqatilgan, lekin qattiq bog'langan — eng yomoni: ikkala dunyoning kamchiligi</text>

  <defs>
    <marker id="dm-a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 3 ta servis, alohida deploy (qutilar tarmoq bo'ylab tarqalgan) -->
  <!-- Buyurtma -->
  <rect x="90" y="110" width="170" height="70" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="175" y="138" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#991b1b" text-anchor="middle">Buyurtma servisi</text>
  <text x="175" y="160" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">alohida deploy</text>

  <!-- To'lov -->
  <rect x="600" y="110" width="170" height="70" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="685" y="138" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#991b1b" text-anchor="middle">To'lov servisi</text>
  <text x="685" y="160" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">alohida deploy</text>

  <!-- Ombor -->
  <rect x="345" y="270" width="170" height="70" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="430" y="298" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#991b1b" text-anchor="middle">Ombor servisi</text>
  <text x="430" y="320" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">alohida deploy</text>

  <!-- UMUMIY DB (qattiq bog'lanish manbasi) -->
  <ellipse cx="430" cy="430" rx="90" ry="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <rect x="340" y="430" width="180" height="56" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <ellipse cx="430" cy="486" rx="90" ry="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="430" y="462" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#991b1b" text-anchor="middle">UMUMIY DB</text>
  <text x="430" y="482" font-family="Segoe UI" font-size="13" fill="#991b1b" text-anchor="middle">(hammasi bir jadvalga yozadi!)</text>

  <!-- Sinxron zanjirli chaqiruvlar (har biri ikkinchisini kutadi) -->
  <line x1="260" y1="140" x2="598" y2="140" stroke="#dc2626" stroke-width="2.5" marker-end="url(#dm-a)"/>
  <text x="430" y="130" font-family="Segoe UI" font-size="13" fill="#991b1b" text-anchor="middle">sinxron chaqiruv (kutadi)</text>
  <line x1="660" y1="180" x2="490" y2="268" stroke="#dc2626" stroke-width="2.5" marker-end="url(#dm-a)"/>
  <line x1="200" y1="180" x2="375" y2="268" stroke="#dc2626" stroke-width="2.5" marker-end="url(#dm-a)"/>

  <!-- Har servis umumiy DB ga -->
  <line x1="175" y1="180" x2="360" y2="418" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="685" y1="180" x2="500" y2="418" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="430" y1="340" x2="430" y2="412" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Belgilar paneli -->
  <rect x="30" y="360" width="290" height="160" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="175" y="384" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">Belgilari (signal)</text>
  <text x="46" y="408" font-family="Segoe UI" font-size="13" fill="#7f1d1d">- bitta o'zgarish = bir nechta servisni</text>
  <text x="46" y="424" font-family="Segoe UI" font-size="13" fill="#7f1d1d">  BIRGA deploy qilish shart</text>
  <text x="46" y="444" font-family="Segoe UI" font-size="13" fill="#7f1d1d">- servislar umumiy DB/jadvalni baham ko'radi</text>
  <text x="46" y="464" font-family="Segoe UI" font-size="13" fill="#7f1d1d">- uzun sinxron chaqiruv zanjiri (biri yiqilsa</text>
  <text x="46" y="480" font-family="Segoe UI" font-size="13" fill="#7f1d1d">  hammasi yiqiladi)</text>
  <text x="46" y="500" font-family="Segoe UI" font-size="13" fill="#7f1d1d">- mustaqil release mumkin emas, jamoalar</text>
  <text x="46" y="516" font-family="Segoe UI" font-size="13" fill="#7f1d1d">  bir-birini kutadi</text>

  <!-- Natija paneli -->
  <rect x="540" y="360" width="290" height="160" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="685" y="384" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">Nega eng yomoni?</text>
  <text x="556" y="408" font-family="Segoe UI" font-size="13" fill="#92400e">Monolit MURAKKABLIGI (tarmoq, deploy,</text>
  <text x="556" y="424" font-family="Segoe UI" font-size="13" fill="#92400e">latency) bor —</text>
  <text x="556" y="448" font-family="Segoe UI" font-size="13" fill="#92400e">lekin mikroservis FOYDASI yo'q</text>
  <text x="556" y="464" font-family="Segoe UI" font-size="13" fill="#92400e">(mustaqil deploy/masshtab/jamoa yo'q).</text>
  <text x="556" y="490" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a">Davo: ko'pincha modulli monolitga qaytish</text>
  <text x="556" y="506" font-family="Segoe UI" font-size="13" fill="#166534">yoki chegaralarni (bounded context) qayta chizish.</text>
</svg>
