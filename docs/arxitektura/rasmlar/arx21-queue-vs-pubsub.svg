<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470">
  <title>Queue (bitta consumer xabarni oladi, ish taqsimlanadi) va Pub/Sub (topic, har bir obunachi nusxa oladi) taqqoslamasi</title>
  <rect x="0" y="0" width="820" height="470" fill="#f8fafc"/>
  <text x="410" y="34" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Queue vs Pub/Sub — xabar kimga boradi?</text>

  <defs>
    <marker id="qp-ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- chap ustun: QUEUE -->
  <rect x="20" y="58" width="380" height="392" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="210" y="86" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#2563eb" text-anchor="middle">QUEUE (navbat)</text>
  <text x="210" y="108" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">Bir xabarni FAQAT BITTA consumer oladi</text>

  <!-- producer -->
  <rect x="45" y="135" width="120" height="56" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="105" y="160" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">Producer</text>
  <text x="105" y="178" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">job yuboradi</text>

  <!-- queue boxes -->
  <rect x="195" y="138" width="32" height="50" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="231" y="138" width="32" height="50" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="267" y="138" width="32" height="50" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="247" y="208" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">navbat (FIFO)</text>
  <line x1="165" y1="163" x2="193" y2="163" stroke="#2563eb" stroke-width="2" marker-end="url(#qp-ar)"/>

  <!-- consumers (competing) -->
  <rect x="60" y="250" width="100" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="110" y="279" font-family="Segoe UI" font-size="13" fill="#16a34a" text-anchor="middle">Worker A</text>
  <rect x="170" y="250" width="100" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="220" y="279" font-family="Segoe UI" font-size="13" fill="#16a34a" text-anchor="middle">Worker B</text>
  <rect x="280" y="250" width="100" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="330" y="279" font-family="Segoe UI" font-size="13" fill="#16a34a" text-anchor="middle">Worker C</text>

  <line x1="247" y1="190" x2="120" y2="248" stroke="#2563eb" stroke-width="2" marker-end="url(#qp-ar)"/>
  <line x1="247" y1="190" x2="220" y2="248" stroke="#2563eb" stroke-width="2" marker-end="url(#qp-ar)"/>
  <line x1="247" y1="190" x2="328" y2="248" stroke="#2563eb" stroke-width="2" marker-end="url(#qp-ar)"/>

  <rect x="45" y="330" width="335" height="100" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="60" y="354" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#334155">Har xabar 1 worker'ga -> ish TAQSIMLANADI</text>
  <text x="60" y="376" font-family="Segoe UI" font-size="13" fill="#334155">(competing consumers). Worker qo'shsang</text>
  <text x="60" y="396" font-family="Segoe UI" font-size="13" fill="#334155">throughput oshadi. Misol: rasm qayta ishlash,</text>
  <text x="60" y="416" font-family="Segoe UI" font-size="13" fill="#64748b">email yuborish navbati (RabbitMQ tabiiy).</text>

  <!-- o'ng ustun: PUB/SUB -->
  <rect x="420" y="58" width="380" height="392" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="610" y="86" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#16a34a" text-anchor="middle">PUB/SUB (topic)</text>
  <text x="610" y="108" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">Har bir obunachi NUSXA oladi</text>

  <rect x="445" y="135" width="120" height="56" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="505" y="160" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">Publisher</text>
  <text x="505" y="178" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">hodisa e'lon</text>

  <!-- topic -->
  <rect x="600" y="138" width="120" height="50" rx="8" fill="#fef9c3" stroke="#f59e0b" stroke-width="2"/>
  <text x="660" y="160" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">topic</text>
  <text x="660" y="178" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">tolov.tasdiqlandi</text>
  <line x1="565" y1="163" x2="598" y2="163" stroke="#2563eb" stroke-width="2" marker-end="url(#qp-ar)"/>

  <!-- subscribers (each gets a copy) -->
  <rect x="450" y="250" width="100" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="279" font-family="Segoe UI" font-size="13" fill="#16a34a" text-anchor="middle">Email</text>
  <rect x="560" y="250" width="100" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="610" y="279" font-family="Segoe UI" font-size="13" fill="#16a34a" text-anchor="middle">Analitika</text>
  <rect x="670" y="250" width="100" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="720" y="279" font-family="Segoe UI" font-size="13" fill="#16a34a" text-anchor="middle">Sodiqlik</text>

  <line x1="640" y1="190" x2="510" y2="248" stroke="#2563eb" stroke-width="2" marker-end="url(#qp-ar)"/>
  <line x1="660" y1="190" x2="610" y2="248" stroke="#2563eb" stroke-width="2" marker-end="url(#qp-ar)"/>
  <line x1="680" y1="190" x2="710" y2="248" stroke="#2563eb" stroke-width="2" marker-end="url(#qp-ar)"/>

  <rect x="445" y="330" width="335" height="100" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="460" y="354" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#334155">Har obunachi BIR XIL xabar nusxasini oladi</text>
  <text x="460" y="376" font-family="Segoe UI" font-size="13" fill="#334155">-> reaksiyalar TARQATILADI (fan-out).</text>
  <text x="460" y="396" font-family="Segoe UI" font-size="13" fill="#334155">Obunachi qo'shsang, mavjudlari tegilmaydi.</text>
  <text x="460" y="416" font-family="Segoe UI" font-size="13" fill="#64748b">Misol: "to'lov amalga oshdi" hodisasi (Kafka).</text>
</svg>
