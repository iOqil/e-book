<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" width="820" height="540">
  <title>DDD bloklar xaritasi: strategik dizayn (Ubiquitous Language, Bounded Context, Context Map) va taktik dizayn (Entity, Value Object, Aggregate, Repository, Domain Service, Domain Event, Factory)</title>
  <rect x="0" y="0" width="820" height="540" fill="#f8fafc"/>
  <text x="410" y="34" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">DDD bloklari: strategik va taktik dizayn</text>
  <text x="410" y="58" font-family="Segoe UI" font-size="14" fill="#64748b" text-anchor="middle">Strategik = katta rasm (chegaralar); Taktik = chegara ICHIDAGI model qurilishi</text>

  <!-- STRATEGIK panel -->
  <rect x="40" y="84" width="740" height="148" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="110" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">STRATEGIK dizayn (dev + biznes birga, "qayerda chegara?")</text>

  <rect x="60" y="126" width="220" height="86" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="170" y="150" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Ubiquitous Language</text>
  <text x="170" y="174" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">yagona til: kod va biznes</text>
  <text x="170" y="192" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">bir atamani ishlatadi</text>

  <rect x="300" y="126" width="220" height="86" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="410" y="150" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Bounded Context</text>
  <text x="410" y="174" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">model chegarasi: bir atama</text>
  <text x="410" y="192" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">har kontekstda har xil</text>

  <rect x="540" y="126" width="220" height="86" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="650" y="150" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Context Map</text>
  <text x="650" y="174" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">kontekstlar aloqasi va</text>
  <text x="650" y="192" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">integratsiya turlari</text>

  <!-- TAKTIK panel -->
  <rect x="40" y="252" width="740" height="244" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="60" y="278" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">TAKTIK dizayn (chegara ichida modelni quramiz)</text>

  <!-- qator 1 -->
  <rect x="60" y="294" width="160" height="78" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="140" y="318" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Entity</text>
  <text x="140" y="340" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">IDENTIFIKATSIYA</text>
  <text x="140" y="358" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">bo'yicha tenglik</text>

  <rect x="240" y="294" width="160" height="78" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="320" y="318" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Value Object</text>
  <text x="320" y="340" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">QIYMAT bo'yicha,</text>
  <text x="320" y="358" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">immutable (Pul)</text>

  <rect x="420" y="294" width="160" height="78" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="500" y="318" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Aggregate (+Root)</text>
  <text x="500" y="340" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">yaxlitlik chegarasi,</text>
  <text x="500" y="358" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">invariant himoyasi</text>

  <rect x="600" y="294" width="160" height="78" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="680" y="318" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Repository</text>
  <text x="680" y="340" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">aggregate'ni</text>
  <text x="680" y="358" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">saqlash/yuklash</text>

  <!-- qator 2 -->
  <rect x="60" y="388" width="220" height="78" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="170" y="412" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Domain Service</text>
  <text x="170" y="434" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">bir entity'ga sig'maydigan,</text>
  <text x="170" y="452" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">holatsiz domen mantig'i</text>

  <rect x="300" y="388" width="220" height="78" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="410" y="412" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Domain Event</text>
  <text x="410" y="434" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">"nimadir sodir bo'ldi"</text>
  <text x="410" y="452" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">(BuyurtmaTasdiqlandi)</text>

  <rect x="540" y="388" width="220" height="78" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="650" y="412" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Factory</text>
  <text x="650" y="434" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">murakkab aggregate'ni</text>
  <text x="650" y="452" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">yaxlit holda yaratish</text>

  <text x="410" y="520" font-family="Segoe UI" font-size="13" font-style="italic" fill="#dc2626" text-anchor="middle">Anti-pattern: Anemic Model — Entity'lar bo'sh "ma'lumot sumkasi", butun mantiq Service'da (taktik bloklar ishlamaydi).</text>
</svg>
