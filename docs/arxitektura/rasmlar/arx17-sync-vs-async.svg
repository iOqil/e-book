<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470">
  <title>Sinxron (so'rov-javob, kutadi) va asinxron (xabar/event, kutmaydi) aloqa taqqoslangan</title>
  <rect x="0" y="0" width="780" height="470" fill="#f8fafc"/>
  <text x="390" y="32" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Sinxron va asinxron aloqa</text>
  <text x="390" y="56" font-family="Segoe UI" font-size="14" fill="#64748b" text-anchor="middle">Sinxron: yuboruvchi javobni KUTADI · Asinxron: xabarni qoldirib KETADI</text>

  <defs>
    <marker id="a17-ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="a17-arg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- ===== SINXRON (chap) ===== -->
  <rect x="30" y="84" width="350" height="356" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="205" y="112" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">SINXRON (REST / gRPC)</text>

  <rect x="56" y="132" width="120" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="116" y="157" font-family="Segoe UI" font-size="14" fill="#1e293b" text-anchor="middle">Servis A</text>
  <rect x="232" y="132" width="120" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="292" y="157" font-family="Segoe UI" font-size="14" fill="#1e293b" text-anchor="middle">Servis B</text>

  <!-- so'rov -->
  <line x1="176" y1="200" x2="232" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#a17-ar)"/>
  <text x="204" y="192" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">so'rov</text>
  <!-- kutish -->
  <rect x="120" y="218" width="56" height="78" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="148" y="244" font-family="Segoe UI" font-size="13" fill="#92400e" text-anchor="middle">A</text>
  <text x="148" y="262" font-family="Segoe UI" font-size="13" fill="#92400e" text-anchor="middle">kutib</text>
  <text x="148" y="280" font-family="Segoe UI" font-size="13" fill="#92400e" text-anchor="middle">turadi</text>
  <!-- javob -->
  <line x1="232" y1="320" x2="176" y2="320" stroke="#16a34a" stroke-width="2" marker-end="url(#a17-arg)"/>
  <text x="204" y="340" font-family="Segoe UI" font-size="13" fill="#16a34a" text-anchor="middle">javob</text>

  <text x="56" y="376" font-family="Segoe UI" font-size="13" fill="#16a34a">+ Sodda, natija darhol qaytadi</text>
  <text x="56" y="398" font-family="Segoe UI" font-size="13" fill="#dc2626">- Temporal coupling: B yiqilsa A kutadi</text>
  <text x="56" y="420" font-family="Segoe UI" font-size="13" fill="#dc2626">- B sekin = A ham sekin (latency qo'shiladi)</text>

  <!-- ===== ASINXRON (o'ng) ===== -->
  <rect x="400" y="84" width="350" height="356" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="575" y="112" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a" text-anchor="middle">ASINXRON (xabar / event)</text>

  <rect x="426" y="132" width="110" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="481" y="157" font-family="Segoe UI" font-size="14" fill="#1e293b" text-anchor="middle">Servis A</text>
  <rect x="556" y="132" width="80" height="40" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="596" y="157" font-family="Segoe UI" font-size="13" fill="#92400e" text-anchor="middle">Navbat</text>
  <rect x="656" y="132" width="68" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="690" y="157" font-family="Segoe UI" font-size="14" fill="#1e293b" text-anchor="middle">Servis B</text>

  <!-- A -> navbat -->
  <line x1="536" y1="152" x2="556" y2="152" stroke="#16a34a" stroke-width="2" marker-end="url(#a17-arg)"/>
  <!-- navbat -> B (keyinroq) -->
  <line x1="636" y1="152" x2="656" y2="152" stroke="#334155" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#a17-ar)"/>
  <text x="596" y="200" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">xabar qoladi</text>

  <!-- A davom etadi -->
  <rect x="426" y="222" width="110" height="58" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="481" y="248" font-family="Segoe UI" font-size="13" fill="#166534" text-anchor="middle">A DARHOL</text>
  <text x="481" y="266" font-family="Segoe UI" font-size="13" fill="#166534" text-anchor="middle">davom etadi</text>

  <text x="426" y="318" font-family="Segoe UI" font-size="13" fill="#16a34a">+ Vaqtinchalik ajralgan: B keyin ishlaydi</text>
  <text x="426" y="340" font-family="Segoe UI" font-size="13" fill="#16a34a">+ B yiqilsa xabar navbatda kutadi</text>
  <text x="426" y="362" font-family="Segoe UI" font-size="13" fill="#16a34a">+ Yuk ko'tarsa — bufer rolini bajaradi</text>
  <text x="426" y="384" font-family="Segoe UI" font-size="13" fill="#dc2626">- Murakkabroq; natija DARHOL yo'q</text>
  <text x="426" y="406" font-family="Segoe UI" font-size="13" fill="#dc2626">- Eventual consistency, broker kerak (21-bob)</text>
</svg>
