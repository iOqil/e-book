<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <title>O'zgarish narxi vaqt o'tishi bilan: yaxshi arxitektura tekis, yomon arxitektura keskin o'sadi</title>
  <rect x="0" y="0" width="760" height="460" fill="#f8fafc"/>
  <text x="380" y="34" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">O'zgarish narxi vaqt o'tishi bilan</text>
  <text x="380" y="58" font-family="Segoe UI" font-size="14" fill="#64748b" text-anchor="middle">Texnik qarz to'planib, har yangi xususiyat tobora qimmatlashadi</text>

  <!-- O'qlar -->
  <line x1="90" y1="380" x2="700" y2="380" stroke="#334155" stroke-width="2"/>
  <line x1="90" y1="380" x2="90" y2="90" stroke="#334155" stroke-width="2"/>
  <text x="395" y="430" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">Vaqt / qo'shilgan xususiyatlar soni  -&gt;</text>
  <text x="40" y="235" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle" transform="rotate(-90 40 235)">Bir o'zgarish narxi  -&gt;</text>

  <!-- Yomon arxitektura: keskin o'suvchi egri (big ball of mud) -->
  <path d="M90,360 C 250,355 360,320 480,230 C 560,170 620,120 700,100" fill="none" stroke="#dc2626" stroke-width="3.5"/>
  <circle cx="700" cy="100" r="6" fill="#dc2626"/>
  <text x="690" y="92" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="end">Yomon arxitektura</text>
  <text x="690" y="130" font-family="Segoe UI" font-size="13" fill="#dc2626" text-anchor="end">(texnik qarz to'plangan)</text>

  <!-- Yaxshi arxitektura: deyarli tekis chiziq -->
  <path d="M90,362 C 250,358 450,352 700,345" fill="none" stroke="#16a34a" stroke-width="3.5"/>
  <circle cx="700" cy="345" r="6" fill="#16a34a"/>
  <text x="690" y="368" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="end">Yaxshi arxitektura</text>

  <!-- Kesishish/farq belgisi -->
  <line x1="560" y1="170" x2="560" y2="350" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="568" y="265" font-family="Segoe UI" font-size="13" fill="#64748b">Farq vaqt bilan</text>
  <text x="568" y="283" font-family="Segoe UI" font-size="13" fill="#64748b">kengayib boradi</text>

  <!-- Boshlanish izohi -->
  <text x="105" y="350" font-family="Segoe UI" font-size="13" fill="#64748b">Boshda ikkalasi</text>
  <text x="105" y="366" font-family="Segoe UI" font-size="13" fill="#64748b">deyarli bir xil</text>
</svg>
