<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <title>Single-leader (leader-follower) replikatsiya: mijoz leader'ga yozadi, leader follower'larga tarqatadi. Sinxron replikatsiya kafolatli lekin sekin va follower o'lsa bloklaydi; asinxron tez lekin replication lag va eski o'qish xavfi bor.</title>
  <rect x="0" y="0" width="900" height="600" fill="#f8fafc"/>
  <text x="450" y="36" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Single-leader replikatsiya: sinxron vs asinxron</text>

  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowG" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrowA" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Client -->
  <rect x="40" y="250" width="120" height="64" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="100" y="278" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Mijoz</text>
  <text x="100" y="298" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">yozish/o'qish</text>

  <!-- Leader -->
  <rect x="240" y="240" width="160" height="84" rx="10" fill="#2563eb"/>
  <text x="320" y="270" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#ffffff">LEADER</text>
  <text x="320" y="292" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#ffffff">(primary)</text>
  <text x="320" y="310" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#ffffff">barcha yozuv shu yerga</text>

  <!-- Client -> Leader write -->
  <line x1="160" y1="282" x2="236" y2="282" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="198" y="272" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">write</text>

  <!-- Follower 1 (sync) -->
  <rect x="560" y="120" width="170" height="84" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="645" y="150" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">Follower 1</text>
  <text x="645" y="172" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">SINXRON</text>
  <text x="645" y="190" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">leader kutadi -> tasdiq</text>

  <!-- Follower 2 (async) -->
  <rect x="560" y="360" width="170" height="84" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="645" y="390" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#b45309">Follower 2</text>
  <text x="645" y="412" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">ASINXRON</text>
  <text x="645" y="430" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">leader kutmaydi (lag)</text>

  <!-- Leader -> Follower1 sync -->
  <line x1="400" y1="262" x2="556" y2="168" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <text x="470" y="200" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a">sync: yozuvni kutadi</text>

  <!-- Leader -> Follower2 async -->
  <line x1="400" y1="300" x2="556" y2="396" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowA)"/>
  <text x="470" y="372" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#b45309">async: keyin yetkazadi</text>

  <!-- Lag note on follower 2 -->
  <rect x="745" y="372" width="135" height="60" rx="8" fill="#fef9c3" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="812" y="394" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#b45309">replication lag</text>
  <text x="812" y="412" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">bu yerdan o'qish</text>
  <text x="812" y="426" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">ESKI bo'lishi mumkin</text>

  <!-- Comparison footer -->
  <rect x="40" y="478" width="405" height="104" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="242" y="502" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">Sinxron</text>
  <text x="58" y="524" font-family="Segoe UI" font-size="13" fill="#16a34a">+ follower kafolatli yangi (mos)</text>
  <text x="58" y="542" font-family="Segoe UI" font-size="13" fill="#dc2626">- sekinroq yozish (kutish)</text>
  <text x="58" y="560" font-family="Segoe UI" font-size="13" fill="#dc2626">- follower o'lsa, yozish bloklanadi</text>
  <text x="58" y="576" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">to'g'rilik &gt; tezlik (CP-ga moyil)</text>

  <rect x="465" y="478" width="405" height="104" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="667" y="502" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#b45309">Asinxron</text>
  <text x="483" y="524" font-family="Segoe UI" font-size="13" fill="#16a34a">+ tez yozish (kutmaydi)</text>
  <text x="483" y="542" font-family="Segoe UI" font-size="13" fill="#16a34a">+ follower o'lsa ham yozish davom</text>
  <text x="483" y="560" font-family="Segoe UI" font-size="13" fill="#dc2626">- lag: follower'dan eski o'qish</text>
  <text x="483" y="576" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b">tezlik/mavjudlik &gt; lahzali moslik (AP-ga moyil)</text>
</svg>
