<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470">
  <title>Qatlamli arxitektura: presentation -> business -> persistence -> database stek va so'rov oqimi</title>
  <rect x="0" y="0" width="780" height="470" fill="#f8fafc"/>
  <text x="390" y="34" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Qatlamli arxitektura: stek va oqim</text>
  <text x="390" y="58" font-family="Segoe UI" font-size="14" fill="#64748b" text-anchor="middle">Har qatlam faqat o'zidan PASTDAGIGA murojaat qiladi (yopiq qatlamlar)</text>

  <defs>
    <marker id="q-down" markerWidth="11" markerHeight="11" refX="5" refY="9" orient="auto">
      <path d="M1,1 L9,1 L5,9 Z" fill="#2563eb"/>
    </marker>
    <marker id="q-up" markerWidth="11" markerHeight="11" refX="5" refY="1" orient="auto">
      <path d="M1,9 L9,9 L5,1 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Presentation -->
  <rect x="150" y="86" width="380" height="74" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="340" y="116" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#2563eb" text-anchor="middle">Presentation (UI / API)</text>
  <text x="340" y="142" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">controller: HTTP so'rov/javob, validatsiya formati</text>

  <!-- Business -->
  <rect x="150" y="178" width="380" height="74" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="340" y="208" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#16a34a" text-anchor="middle">Business / Application</text>
  <text x="340" y="234" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">service: biznes qoidalari (email noyob, narx, soliq)</text>

  <!-- Persistence -->
  <rect x="150" y="270" width="380" height="74" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="340" y="300" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#f59e0b" text-anchor="middle">Persistence (data access)</text>
  <text x="340" y="326" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">repository: SQL / ORM, satr &lt;-&gt; obyekt</text>

  <!-- Database -->
  <rect x="150" y="362" width="380" height="74" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2.5"/>
  <text x="340" y="392" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#334155" text-anchor="middle">Database</text>
  <text x="340" y="418" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">PostgreSQL / MySQL / NoSQL</text>

  <!-- So'rov pastga (ko'k) -->
  <line x1="200" y1="160" x2="200" y2="178" stroke="#2563eb" stroke-width="2.5" marker-end="url(#q-down)"/>
  <line x1="200" y1="252" x2="200" y2="270" stroke="#2563eb" stroke-width="2.5" marker-end="url(#q-down)"/>
  <line x1="200" y1="344" x2="200" y2="362" stroke="#2563eb" stroke-width="2.5" marker-end="url(#q-down)"/>

  <!-- Javob yuqoriga (yashil) -->
  <line x1="480" y1="362" x2="480" y2="344" stroke="#16a34a" stroke-width="2.5" marker-end="url(#q-up)"/>
  <line x1="480" y1="270" x2="480" y2="252" stroke="#16a34a" stroke-width="2.5" marker-end="url(#q-up)"/>
  <line x1="480" y1="178" x2="480" y2="160" stroke="#16a34a" stroke-width="2.5" marker-end="url(#q-up)"/>

  <text x="120" y="265" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle" transform="rotate(-90 120 265)">so'rov (pastga)</text>
  <text x="560" y="265" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle" transform="rotate(90 560 265)">javob (yuqoriga)</text>

  <!-- O'ng izoh -->
  <rect x="590" y="178" width="170" height="178" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="675" y="202" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Qoida</text>
  <text x="605" y="226" font-family="Segoe UI" font-size="13" fill="#334155">Yuqori qatlam pastni</text>
  <text x="605" y="244" font-family="Segoe UI" font-size="13" fill="#334155">chaqiradi. Past qatlam</text>
  <text x="605" y="262" font-family="Segoe UI" font-size="13" fill="#334155">yuqorini BILMAYDI.</text>
  <text x="605" y="288" font-family="Segoe UI" font-size="13" fill="#16a34a">DB o'zgarsa — faqat</text>
  <text x="605" y="306" font-family="Segoe UI" font-size="13" fill="#16a34a">persistence o'zgaradi.</text>
  <text x="605" y="330" font-family="Segoe UI" font-size="13" fill="#dc2626">Kamchilik: DB markazda</text>
  <text x="605" y="348" font-family="Segoe UI" font-size="13" fill="#dc2626">(13-bob hal qiladi).</text>
</svg>
