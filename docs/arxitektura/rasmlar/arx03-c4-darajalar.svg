<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560">
  <title>C4 model 4 darajasi: Context (L1) -> Container (L2) -> Component (L3) -> Code (L4), har daraja keyingisiga zoom-in</title>
  <rect x="0" y="0" width="900" height="560" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">C4 model: kattalashtirish (zoom-in) darajalari</text>
  <text x="450" y="58" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Har bir daraja oldingisining BIR qutisini ochib, ichini ko'rsatadi</text>

  <!-- L1 Context -->
  <rect x="40" y="90" width="380" height="190" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="56" y="116" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">L1 - System Context</text>
  <text x="56" y="136" font-family="Segoe UI" font-size="13" fill="#64748b">Tizim dunyoda qayerda: foydalanuvchi + tashqi tizimlar</text>
  <!-- person -->
  <circle cx="100" cy="180" r="16" fill="#16a34a"/>
  <rect x="84" y="196" width="32" height="26" rx="6" fill="#16a34a"/>
  <text x="100" y="240" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Mijoz</text>
  <!-- our system -->
  <rect x="170" y="160" width="110" height="64" rx="8" fill="#2563eb"/>
  <text x="225" y="188" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff">Do'kon</text>
  <text x="225" y="206" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dbeafe">tizimi</text>
  <!-- external -->
  <rect x="320" y="160" width="84" height="64" rx="8" fill="#64748b"/>
  <text x="362" y="188" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#ffffff">To'lov</text>
  <text x="362" y="206" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#e2e8f0">shlyuzi</text>
  <line x1="120" y1="190" x2="168" y2="190" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="282" y1="190" x2="318" y2="190" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- zoom arrow 1->2 -->
  <line x1="430" y1="185" x2="478" y2="185" stroke="#f59e0b" stroke-width="3" marker-end="url(#arZ)"/>
  <text x="454" y="176" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#f59e0b">zoom</text>

  <!-- L2 Container -->
  <rect x="490" y="90" width="380" height="190" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="506" y="116" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">L2 - Container</text>
  <text x="506" y="136" font-family="Segoe UI" font-size="13" fill="#64748b">"Do'kon tizimi" ichidagi deploy birliklari</text>
  <rect x="506" y="150" width="100" height="50" rx="6" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="556" y="172" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">SPA</text>
  <text x="556" y="190" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">brauzer</text>
  <rect x="640" y="150" width="100" height="50" rx="6" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="690" y="172" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">API</text>
  <text x="690" y="190" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">Node/HTTP</text>
  <rect x="640" y="216" width="100" height="48" rx="6" fill="#fde68a" stroke="#f59e0b"/>
  <text x="690" y="238" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">Ma'lumotlar</text>
  <text x="690" y="254" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">bazasi</text>
  <line x1="606" y1="175" x2="638" y2="175" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="690" y1="200" x2="690" y2="214" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <text x="800" y="172" font-family="Segoe UI" font-size="13" fill="#dc2626">Docker EMAS!</text>

  <!-- zoom arrow 2->3 (down) -->
  <line x1="680" y1="282" x2="680" y2="318" stroke="#f59e0b" stroke-width="3" marker-end="url(#arZ)"/>
  <text x="712" y="304" font-family="Segoe UI" font-size="13" fill="#f59e0b">zoom</text>

  <!-- L3 Component -->
  <rect x="490" y="330" width="380" height="190" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="506" y="356" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">L3 - Component</text>
  <text x="506" y="376" font-family="Segoe UI" font-size="13" fill="#64748b">"API" konteyneri ichidagi komponentlar</text>
  <rect x="506" y="392" width="108" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="560" y="418" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">Controller</text>
  <rect x="636" y="392" width="108" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="690" y="418" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">Service</text>
  <rect x="636" y="456" width="108" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="690" y="482" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">Repository</text>
  <line x1="614" y1="414" x2="634" y2="414" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="690" y1="436" x2="690" y2="454" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- zoom arrow 3->4 (left) -->
  <line x1="488" y1="425" x2="452" y2="425" stroke="#f59e0b" stroke-width="3" marker-end="url(#arZ)"/>
  <text x="470" y="416" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#f59e0b">zoom</text>

  <!-- L4 Code -->
  <rect x="40" y="330" width="400" height="190" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="56" y="356" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#64748b">L4 - Code (kamdan-kam)</text>
  <text x="56" y="376" font-family="Segoe UI" font-size="13" fill="#64748b">"Service" komponenti ichidagi sinflar (UML class)</text>
  <rect x="60" y="392" width="160" height="110" rx="6" fill="#ffffff" stroke="#334155"/>
  <line x1="60" y1="416" x2="220" y2="416" stroke="#334155"/>
  <text x="140" y="410" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#1e293b">OrderService</text>
  <text x="72" y="438" font-family="Segoe UI" font-size="13" fill="#475569">- repo: OrderRepo</text>
  <line x1="60" y1="450" x2="220" y2="450" stroke="#334155"/>
  <text x="72" y="472" font-family="Segoe UI" font-size="13" fill="#475569">+ place(o): Order</text>
  <text x="72" y="492" font-family="Segoe UI" font-size="13" fill="#475569">+ cancel(id): void</text>
  <rect x="250" y="412" width="170" height="70" rx="6" fill="#ffffff" stroke="#334155"/>
  <line x1="250" y1="436" x2="420" y2="436" stroke="#334155"/>
  <text x="335" y="430" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#1e293b">&lt;&lt;interface&gt;&gt;</text>
  <text x="335" y="464" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">OrderRepo</text>
  <line x1="220" y1="440" x2="248" y2="440" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <text x="450" y="546" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Yuqoridan pastga: kengroq surat -> torroq detal. Ko'pchilik tizim uchun L1 + L2 yetarli.</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/></marker>
    <marker id="arZ" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#f59e0b"/></marker>
  </defs>
</svg>
