<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" width="800" height="510">
  <title>API Gateway yagona kirish nuqtasi: klientlar gateway orqali servislarga; auth, rate-limit va routing markazlashtirilgan; BFF har klient uchun moslangan</title>
  <rect x="0" y="0" width="800" height="510" fill="#f8fafc"/>
  <text x="400" y="32" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">API Gateway va BFF</text>
  <text x="400" y="56" font-family="Segoe UI" font-size="14" fill="#64748b" text-anchor="middle">Yagona kirish nuqtasi: auth, rate-limit, routing bir joyda — servislar sodda qoladi</text>

  <defs>
    <marker id="g17-ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Klientlar -->
  <rect x="40" y="100" width="150" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="115" y="129" font-family="Segoe UI" font-size="14" fill="#1e293b" text-anchor="middle">Web klient</text>
  <rect x="40" y="220" width="150" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="115" y="249" font-family="Segoe UI" font-size="14" fill="#1e293b" text-anchor="middle">Mobil ilova</text>
  <rect x="40" y="340" width="150" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="115" y="369" font-family="Segoe UI" font-size="14" fill="#1e293b" text-anchor="middle">Tashqi hamkor</text>

  <!-- Gateway -->
  <rect x="280" y="120" width="190" height="246" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="375" y="150" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#92400e" text-anchor="middle">API GATEWAY</text>
  <line x1="296" y1="164" x2="454" y2="164" stroke="#f59e0b" stroke-width="1"/>
  <text x="300" y="192" font-family="Segoe UI" font-size="13" fill="#334155">- Autentifikatsiya</text>
  <text x="300" y="216" font-family="Segoe UI" font-size="13" fill="#334155">- Rate limiting</text>
  <text x="300" y="240" font-family="Segoe UI" font-size="13" fill="#334155">- Routing (yo'naltirish)</text>
  <text x="300" y="264" font-family="Segoe UI" font-size="13" fill="#334155">- TLS to'xtatish</text>
  <text x="300" y="288" font-family="Segoe UI" font-size="13" fill="#334155">- Log / metrika</text>
  <text x="300" y="312" font-family="Segoe UI" font-size="13" fill="#334155">- Aggregatsiya</text>
  <rect x="300" y="324" width="150" height="30" rx="6" fill="#fde68a"/>
  <text x="375" y="344" font-family="Segoe UI" font-size="13" font-style="italic" fill="#92400e" text-anchor="middle">ko'ndalang ish bir joyda</text>

  <!-- Klient -> Gateway -->
  <line x1="190" y1="123" x2="280" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#g17-ar)"/>
  <line x1="190" y1="243" x2="280" y2="243" stroke="#334155" stroke-width="2" marker-end="url(#g17-ar)"/>
  <line x1="190" y1="363" x2="280" y2="326" stroke="#334155" stroke-width="2" marker-end="url(#g17-ar)"/>

  <!-- Servislar -->
  <rect x="600" y="96" width="160" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="680" y="125" font-family="Segoe UI" font-size="14" fill="#1e293b" text-anchor="middle">Auth servisi</text>
  <rect x="600" y="166" width="160" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="680" y="195" font-family="Segoe UI" font-size="14" fill="#1e293b" text-anchor="middle">Buyurtma servisi</text>
  <rect x="600" y="236" width="160" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="680" y="265" font-family="Segoe UI" font-size="14" fill="#1e293b" text-anchor="middle">To'lov servisi</text>
  <rect x="600" y="306" width="160" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="680" y="335" font-family="Segoe UI" font-size="14" fill="#1e293b" text-anchor="middle">Ombor servisi</text>

  <!-- Gateway -> Servislar -->
  <line x1="470" y1="180" x2="600" y2="119" stroke="#334155" stroke-width="2" marker-end="url(#g17-ar)"/>
  <line x1="470" y1="210" x2="600" y2="189" stroke="#334155" stroke-width="2" marker-end="url(#g17-ar)"/>
  <line x1="470" y1="250" x2="600" y2="259" stroke="#334155" stroke-width="2" marker-end="url(#g17-ar)"/>
  <line x1="470" y1="290" x2="600" y2="329" stroke="#334155" stroke-width="2" marker-end="url(#g17-ar)"/>

  <!-- BFF izoh -->
  <rect x="40" y="416" width="720" height="76" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="56" y="442" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">BFF — Backend for Frontend</text>
  <text x="56" y="466" font-family="Segoe UI" font-size="13" fill="#334155">Har klient turi (web, mobil) uchun ALOHIDA gateway-qatlam: mobilga ixcham javob, webga to'liq.</text>
  <text x="56" y="486" font-family="Segoe UI" font-size="13" fill="#64748b">Gateway = yagona umumiy kirish · BFF = har frontend ehtiyojiga moslangan kirish (trade-off: ko'proq qatlam).</text>
</svg>
