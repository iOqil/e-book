<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540">
  <title>Stateful (holat serverda) gorizontal masshtablanmaydi, stateless (holat tashqi do'konda - Redis/DB/token) masshtablanadi - taqqoslash</title>
  <rect x="0" y="0" width="880" height="540" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Stateful va Stateless: nega gorizontal masshtab stateless talab qiladi</text>

  <!-- STATEFUL (left) -->
  <rect x="30" y="58" width="390" height="430" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="30" y="58" width="390" height="34" rx="10" fill="#dc2626"/>
  <text x="225" y="81" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#ffffff">Stateful: holat SERVER xotirasida</text>

  <!-- LB -->
  <rect x="160" y="106" width="130" height="40" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="225" y="131" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">Load balancer</text>

  <line x1="190" y1="146" x2="120" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="260" y1="146" x2="330" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#a1)"/>

  <!-- server A holds session -->
  <rect x="55" y="185" width="140" height="96" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="125" y="208" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Server A</text>
  <rect x="72" y="220" width="106" height="48" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="125" y="240" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">sessiya: u1</text>
  <text x="125" y="258" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">savat: 3 dona</text>

  <!-- server B empty -->
  <rect x="255" y="185" width="140" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="325" y="208" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Server B</text>
  <rect x="272" y="220" width="106" height="48" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="325" y="240" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">sessiya yo'q</text>
  <text x="325" y="258" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">(bilmaydi)</text>

  <text x="225" y="320" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#dc2626">Keyingi so'rov B ga tushsa:</text>
  <text x="225" y="342" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">savat YO'QOLADI - foydalanuvchi tushib qoladi</text>

  <text x="50" y="378" font-family="Segoe UI" font-size="13" fill="#334155">Vaqtinchalik "yamoq": STICKY SESSION</text>
  <text x="50" y="398" font-family="Segoe UI" font-size="13" fill="#334155">(bir mijoz doim A da qoladi), lekin:</text>
  <text x="50" y="420" font-family="Segoe UI" font-size="13" fill="#dc2626">- A yiqilsa, sessiya baribir yo'qoladi</text>
  <text x="50" y="440" font-family="Segoe UI" font-size="13" fill="#dc2626">- yuk teng tarqalmaydi (A qiziydi)</text>
  <text x="50" y="460" font-family="Segoe UI" font-size="13" fill="#dc2626">- yangi node bo'sh turadi</text>
  <text x="50" y="480" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#dc2626">-> haqiqiy masshtab BUZILADI</text>

  <!-- STATELESS (right) -->
  <rect x="460" y="58" width="390" height="430" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="460" y="58" width="390" height="34" rx="10" fill="#16a34a"/>
  <text x="655" y="81" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#ffffff">Stateless: holat TASHQI do'konda</text>

  <rect x="590" y="106" width="130" height="40" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="655" y="131" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">Load balancer</text>

  <line x1="620" y1="146" x2="555" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="690" y1="146" x2="755" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#a1)"/>

  <!-- identical empty servers -->
  <rect x="490" y="185" width="130" height="70" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="555" y="210" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Server A</text>
  <text x="555" y="232" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">holatsiz</text>
  <text x="555" y="248" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">(bir xil)</text>

  <rect x="690" y="185" width="130" height="70" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="755" y="210" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Server B</text>
  <text x="755" y="232" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">holatsiz</text>
  <text x="755" y="248" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">(bir xil)</text>

  <!-- shared store -->
  <line x1="555" y1="255" x2="630" y2="310" stroke="#2563eb" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="755" y1="255" x2="680" y2="310" stroke="#2563eb" stroke-width="2" marker-end="url(#a2)"/>
  <rect x="540" y="312" width="230" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="655" y="336" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Umumiy do'kon</text>
  <text x="655" y="358" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">Redis / DB / JWT token (sessiya)</text>

  <text x="655" y="408" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a">Har so'rov istalgan node'ga tushadi:</text>
  <text x="655" y="430" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">hammasi bir xil javob beradi (savat saqlanadi)</text>
  <text x="480" y="460" font-family="Segoe UI" font-size="13" fill="#16a34a">- Node qo'shsang -> darhol ishlaydi</text>
  <text x="480" y="480" font-family="Segoe UI" font-size="13" fill="#16a34a">- Bittasi yiqilsa -> sessiya saqlanadi</text>

  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
  </defs>
</svg>
