<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470">
  <title>Yozish strategiyalari taqqoslash: write-through keshga va DB-ga birga yozadi (izchil lekin sekin); write-behind avval keshga yozib darhol javob beradi, DB-ga keyin yozadi (tez lekin yo'qotish xavfi)</title>
  <rect x="0" y="0" width="880" height="470" fill="#f8fafc"/>
  <text x="440" y="34" font-family="Segoe UI" font-size="21" font-weight="bold" fill="#1e293b" text-anchor="middle">Yozish strategiyalari: write-through vs write-behind</text>
  <text x="440" y="58" font-family="Segoe UI" font-size="14" fill="#64748b" text-anchor="middle">Trade-off: izchillik (consistency) va xavfsizlik &#8596; yozish kechikishi (latency)</text>

  <defs>
    <marker id="ar20w" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#334155"/>
    </marker>
    <marker id="ar20wg" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- chap panel: write-through -->
  <rect x="24" y="80" width="410" height="360" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="229" y="110" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#15803d" text-anchor="middle">Write-through</text>
  <text x="229" y="132" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">keshga va DB-ga BIRGA yozadi</text>

  <rect x="50" y="160" width="100" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="100" y="193" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">Ilova</text>

  <rect x="180" y="160" width="100" height="56" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="230" y="193" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">Kesh</text>

  <rect x="310" y="160" width="100" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="360" y="193" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">DB</text>

  <line x1="150" y1="188" x2="178" y2="188" stroke="#334155" stroke-width="2" marker-end="url(#ar20w)"/>
  <text x="164" y="178" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">1</text>
  <line x1="280" y1="188" x2="308" y2="188" stroke="#334155" stroke-width="2" marker-end="url(#ar20w)"/>
  <text x="294" y="178" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">2</text>

  <!-- javob faqat DB tasdiqlagach -->
  <path d="M360,216 C360,250 100,250 100,218" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ar20wg)"/>
  <text x="229" y="262" font-family="Segoe UI" font-size="13" fill="#15803d" text-anchor="middle">3. javob: DB tasdiqlagach (ikkalasi yozildi)</text>

  <rect x="50" y="300" width="360" height="120" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="66" y="324" font-family="Segoe UI" font-size="13" fill="#15803d">+ Kesh va DB doim mos (kesh hech eskirmaydi)</text>
  <text x="66" y="346" font-family="Segoe UI" font-size="13" fill="#15803d">+ Ma'lumot yo'qolmaydi (DB-ga darhol yetadi)</text>
  <text x="66" y="372" font-family="Segoe UI" font-size="13" fill="#b91c1c">- Sekinroq: har yozish DB-ni kutadi</text>
  <text x="66" y="394" font-family="Segoe UI" font-size="13" fill="#b91c1c">- Yozilgan, lekin o'qilmaydigan ma'lumot ham keshda</text>
  <text x="66" y="414" font-family="Segoe UI" font-size="13" fill="#64748b">Qachon: izchillik muhim, yozish kam</text>

  <!-- o'ng panel: write-behind -->
  <rect x="446" y="80" width="410" height="360" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="651" y="110" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#b45309" text-anchor="middle">Write-behind (write-back)</text>
  <text x="651" y="132" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">avval keshga, DB-ga KEYIN (asinxron)</text>

  <rect x="472" y="160" width="100" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="522" y="193" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">Ilova</text>

  <rect x="602" y="160" width="100" height="56" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="652" y="193" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">Kesh</text>

  <rect x="732" y="160" width="100" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="782" y="193" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">DB</text>

  <line x1="572" y1="188" x2="600" y2="188" stroke="#334155" stroke-width="2" marker-end="url(#ar20w)"/>
  <text x="586" y="178" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">1</text>

  <!-- darhol javob -->
  <path d="M652,216 C652,238 522,238 522,218" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ar20wg)"/>
  <text x="586" y="252" font-family="Segoe UI" font-size="13" fill="#15803d" text-anchor="middle">2. javob DARHOL (DB-ni kutmaydi)</text>

  <!-- keyinroq DB-ga -->
  <line x1="702" y1="200" x2="730" y2="200" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#ar20w)"/>
  <text x="716" y="232" font-family="Segoe UI" font-size="13" fill="#b45309" text-anchor="middle">3. keyin</text>
  <text x="716" y="248" font-family="Segoe UI" font-size="13" fill="#b45309" text-anchor="middle">(batch/async)</text>

  <rect x="472" y="300" width="360" height="120" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="488" y="324" font-family="Segoe UI" font-size="13" fill="#15803d">+ Juda tez yozish (DB-ni kutmaydi)</text>
  <text x="488" y="346" font-family="Segoe UI" font-size="13" fill="#15803d">+ Yozishlarni to'plab DB yukini kamaytiradi</text>
  <text x="488" y="372" font-family="Segoe UI" font-size="13" fill="#b91c1c">- Kesh DB-ga yetmasdan o'lsa: MA'LUMOT YO'QOLADI</text>
  <text x="488" y="394" font-family="Segoe UI" font-size="13" fill="#b91c1c">- Kesh va DB vaqtincha mos kelmaydi</text>
  <text x="488" y="414" font-family="Segoe UI" font-size="13" fill="#64748b">Qachon: yozish ko'p, lahzali yo'qotish chidamli</text>
</svg>
