<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470">
  <title>CQRS: yozish (command) va o'qish (query) yo'llari alohida model bilan ajratilgan</title>
  <rect x="0" y="0" width="780" height="470" fill="#f8fafc"/>
  <text x="390" y="34" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">CQRS: command yo'li | query yo'li ajratilgan</text>
  <text x="390" y="58" font-family="Segoe UI" font-size="14" fill="#64748b" text-anchor="middle">Yozish va o'qish modellari mustaqil — har biri o'z yukiga moslab masshtablanadi</text>

  <defs>
    <marker id="cq-arb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="cq-arg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="cq-arp" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Client -->
  <rect x="320" y="80" width="140" height="56" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="390" y="114" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">Klient</text>

  <!-- Command side (left) -->
  <text x="190" y="178" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="middle">COMMAND (yozish)</text>
  <rect x="70" y="192" width="240" height="70" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="190" y="220" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">Command handler</text>
  <text x="190" y="244" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">validatsiya + biznes qoidalari</text>

  <rect x="70" y="300" width="240" height="76" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="190" y="328" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">Write model (DB)</text>
  <text x="190" y="350" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">normallashgan, tranzaksion</text>
  <text x="190" y="368" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">to'g'rilik birinchi o'rinda</text>

  <!-- Query side (right) -->
  <text x="590" y="178" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">QUERY (o'qish)</text>
  <rect x="470" y="192" width="240" height="70" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="590" y="220" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">Query handler</text>
  <text x="590" y="244" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">faqat o'qiydi, mantiq yo'q</text>

  <rect x="470" y="300" width="240" height="76" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="590" y="328" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">Read model (proyeksiya)</text>
  <text x="590" y="350" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">denormallashgan, tez o'qish</text>
  <text x="590" y="368" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">cache/qidiruv indeksi mumkin</text>

  <!-- Client -> command -->
  <line x1="350" y1="136" x2="220" y2="190" stroke="#dc2626" stroke-width="2.5" marker-end="url(#cq-arb)"/>
  <text x="232" y="160" font-family="Segoe UI" font-size="13" fill="#dc2626">command</text>
  <!-- Client -> query -->
  <line x1="430" y1="136" x2="560" y2="190" stroke="#16a34a" stroke-width="2.5" marker-end="url(#cq-arg)"/>
  <text x="486" y="160" font-family="Segoe UI" font-size="13" fill="#16a34a">query</text>

  <!-- handler -> model -->
  <line x1="190" y1="262" x2="190" y2="298" stroke="#dc2626" stroke-width="2" marker-end="url(#cq-arb)"/>
  <line x1="590" y1="262" x2="590" y2="298" stroke="#16a34a" stroke-width="2" marker-end="url(#cq-arg)"/>

  <!-- sync: write -> read -->
  <line x1="310" y1="338" x2="468" y2="338" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#cq-arp)"/>
  <text x="390" y="330" font-family="Segoe UI" font-size="13" fill="#2563eb" text-anchor="middle">proyeksiya (event)</text>
  <text x="390" y="358" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">eventual consistency</text>

  <!-- Note -->
  <rect x="70" y="402" width="640" height="50" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="86" y="424" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#334155">Qachon:</text>
  <text x="160" y="424" font-family="Segoe UI" font-size="13" fill="#334155">o'qish/yozish yuki keskin nomutanosib bo'lsa. Narxi: ikki model, eventual consistency, murakkablik.</text>
  <text x="86" y="443" font-family="Segoe UI" font-size="13" fill="#64748b">Oddiy CRUD uchun CQRS — over-engineering. Avval bitta model bilan boshlang.</text>
</svg>
