<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" width="780" height="460">
  <title>Sifat atributlari uch toifaga: operatsion (ish vaqtida), strukturaviy (kodni o'zgartirganda), ko'ndalang (butun tizim bo'ylab)</title>

  <rect x="0" y="0" width="780" height="460" fill="#f8fafc"/>

  <text x="390" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="bold" fill="#1e293b">Sifat atributlari ("-ilities")</text>
  <text x="390" y="60" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">tizim "qanchalik yaxshi" ishlashini belgilaydi — uch toifa</text>

  <!-- 1. Operatsion (ko'k) -->
  <rect x="30" y="90" width="232" height="300" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="30" y="90" width="232" height="48" rx="12" fill="#2563eb"/>
  <rect x="30" y="118" width="232" height="20" fill="#2563eb"/>
  <text x="146" y="113" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Operatsion</text>
  <text x="146" y="131" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dbeafe">tizim ishlab turganda</text>

  <g font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">
    <text x="50" y="170">• Availability (yetishuvchanlik)</text>
    <text x="50" y="200">• Reliability (ishonchlilik)</text>
    <text x="50" y="230">• Performance (unumdorlik)</text>
    <text x="50" y="260">• Scalability (masshtab)</text>
    <text x="50" y="290">• Elasticity (elastiklik)</text>
  </g>
  <text x="146" y="332" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">foydalanuvchi va operatsiya</text>
  <text x="146" y="350" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">jamoasi his qiladi</text>

  <!-- 2. Strukturaviy (yashil) -->
  <rect x="274" y="90" width="232" height="300" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <rect x="274" y="90" width="232" height="48" rx="12" fill="#16a34a"/>
  <rect x="274" y="118" width="232" height="20" fill="#16a34a"/>
  <text x="390" y="113" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Strukturaviy</text>
  <text x="390" y="131" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dcfce7">kodni o'zgartirganda</text>

  <g font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">
    <text x="294" y="170">• Maintainability</text>
    <text x="294" y="200">• Modularity (modullik)</text>
    <text x="294" y="230">• Testability</text>
    <text x="294" y="260">• Deployability</text>
    <text x="294" y="290">• Extensibility</text>
  </g>
  <text x="390" y="332" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">dasturchilar har kuni his qiladi</text>
  <text x="390" y="350" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">(coupling/cohesion natijasi)</text>

  <!-- 3. Ko'ndalang (sariq) -->
  <rect x="518" y="90" width="232" height="300" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <rect x="518" y="90" width="232" height="48" rx="12" fill="#f59e0b"/>
  <rect x="518" y="118" width="232" height="20" fill="#f59e0b"/>
  <text x="634" y="113" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Ko'ndalang</text>
  <text x="634" y="131" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#fef3c7">butun tizim bo'ylab</text>

  <g font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">
    <text x="538" y="170">• Security (xavfsizlik)</text>
    <text x="538" y="200">• Usability (qulaylik)</text>
    <text x="538" y="230">• Observability</text>
    <text x="538" y="260">• Accessibility</text>
    <text x="538" y="290">• Compliance</text>
  </g>
  <text x="634" y="332" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">bitta qatlamda emas —</text>
  <text x="634" y="350" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">hamma joyni kesib o'tadi</text>

  <!-- pastki izoh -->
  <rect x="30" y="408" width="720" height="38" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="390" y="432" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#334155">Ildizi: ISO/IEC 25010 standarti · amaliy guruhlash: Richards &amp; Ford — toifalar fikrlash uchun, qattiq qonun emas</text>
</svg>
