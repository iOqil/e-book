<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700">
  <title>Masshtablangan arxitektura rejasi: CDN, load balancer, stateless servis replikalari, Redis kesh, DB birlamchi va o'qish-replikalari, message queue va worker'lar</title>
  <rect x="0" y="0" width="980" height="700" fill="#f8fafc"/>
  <text x="490" y="30" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">Masshtab rejasi - bottleneck'lardan keyin</text>
  <text x="490" y="54" font-family="Segoe UI" font-size="14" fill="#64748b" text-anchor="middle">CDN -> LB -> stateless replikalar -> kesh -> DB (birlamchi + o'qish-replika) + queue/worker (raqamlar taxminiy/tartib)</text>

  <defs>
    <marker id="m26m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="m26q" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Foydalanuvchilar -->
  <rect x="40" y="100" width="120" height="50" rx="25" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="100" y="122" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#3730a3" text-anchor="middle">Foydalanuvchilar</text>
  <text x="100" y="140" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">[~taxminiy ko'p]</text>

  <!-- CDN -->
  <rect x="40" y="200" width="120" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="100" y="222" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">CDN</text>
  <text x="100" y="240" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">[statik/rasm]</text>

  <!-- Load Balancer -->
  <rect x="220" y="150" width="140" height="56" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="290" y="174" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#92400e" text-anchor="middle">Load Balancer</text>
  <text x="290" y="194" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">[health-check]</text>

  <!-- Stateless servis replikalari -->
  <rect x="410" y="96" width="150" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="485" y="118" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">API replika 1</text>
  <text x="485" y="135" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">[stateless]</text>

  <rect x="410" y="156" width="150" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="485" y="178" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">API replika 2</text>
  <text x="485" y="195" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">[stateless]</text>

  <rect x="410" y="216" width="150" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="485" y="238" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">API replika N</text>
  <text x="485" y="255" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">[gorizontal masshtab]</text>

  <text x="485" y="284" font-family="Segoe UI" font-size="13" font-style="italic" fill="#64748b" text-anchor="middle">stateless = istalgan replikaga so'rov (sticky session shart emas)</text>

  <!-- Redis kesh -->
  <ellipse cx="685" cy="120" rx="50" ry="13" fill="#fee2e2" stroke="#dc2626"/>
  <rect x="635" y="120" width="100" height="44" fill="#fee2e2" stroke="#dc2626"/>
  <ellipse cx="685" cy="164" rx="50" ry="13" fill="#fee2e2" stroke="#dc2626"/>
  <text x="685" y="138" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">Redis kesh</text>
  <text x="685" y="156" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">[cache-aside]</text>

  <!-- DB birlamchi -->
  <ellipse cx="685" cy="320" rx="55" ry="14" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="630" y="320" width="110" height="50" fill="#dcfce7" stroke="#16a34a"/>
  <ellipse cx="685" cy="370" rx="55" ry="14" fill="#dcfce7" stroke="#16a34a"/>
  <text x="685" y="340" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">DB BIRLAMCHI</text>
  <text x="685" y="358" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">[yozish]</text>

  <!-- DB o'qish-replikalari -->
  <ellipse cx="845" cy="300" rx="48" ry="12" fill="#dcfce7" stroke="#16a34a" stroke-dasharray="4,3"/>
  <rect x="797" y="300" width="96" height="40" fill="#dcfce7" stroke="#16a34a" stroke-dasharray="4,3"/>
  <ellipse cx="845" cy="340" rx="48" ry="12" fill="#dcfce7" stroke="#16a34a" stroke-dasharray="4,3"/>
  <text x="845" y="318" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">o'qish-replika</text>
  <text x="845" y="336" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">[read scale]</text>

  <ellipse cx="845" cy="396" rx="48" ry="12" fill="#dcfce7" stroke="#16a34a" stroke-dasharray="4,3"/>
  <rect x="797" y="396" width="96" height="40" fill="#dcfce7" stroke="#16a34a" stroke-dasharray="4,3"/>
  <ellipse cx="845" cy="436" rx="48" ry="12" fill="#dcfce7" stroke="#16a34a" stroke-dasharray="4,3"/>
  <text x="845" y="414" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">o'qish-replika</text>
  <text x="845" y="432" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">[read scale]</text>

  <!-- Message queue -->
  <rect x="380" y="470" width="220" height="48" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
  <text x="490" y="492" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#92400e" text-anchor="middle">Message Queue (Kafka/RabbitMQ)</text>
  <text x="490" y="510" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">[og'ir/sekin ishlarni bufferlash]</text>

  <!-- Worker'lar -->
  <rect x="120" y="556" width="150" height="46" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="195" y="578" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">Email worker</text>
  <text x="195" y="595" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">[asinxron]</text>

  <rect x="290" y="556" width="150" height="46" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="365" y="578" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">Inventar worker</text>
  <text x="365" y="595" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">[idempotent]</text>

  <rect x="460" y="556" width="150" height="46" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="535" y="578" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">Hisobot worker</text>
  <text x="535" y="595" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">[batch/analitik]</text>

  <!-- O'qlar -->
  <line x1="160" y1="125" x2="218" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#m26m)"/>
  <line x1="100" y1="150" x2="100" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#m26m)"/>
  <text x="60" y="180" font-family="Segoe UI" font-size="13" fill="#475569">statik</text>

  <line x1="360" y1="160" x2="408" y2="125" stroke="#334155" stroke-width="2" marker-end="url(#m26m)"/>
  <line x1="360" y1="178" x2="408" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#m26m)"/>
  <line x1="360" y1="196" x2="408" y2="235" stroke="#334155" stroke-width="2" marker-end="url(#m26m)"/>
  <text x="320" y="130" font-family="Segoe UI" font-size="13" fill="#475569">teng taqsim</text>

  <!-- replika -> kesh -->
  <line x1="560" y1="140" x2="632" y2="142" stroke="#dc2626" stroke-width="2" marker-end="url(#m26m)"/>
  <text x="575" y="132" font-family="Segoe UI" font-size="13" fill="#991b1b">1. kesh?</text>

  <!-- kesh miss -> DB birlamchi -->
  <line x1="685" y1="178" x2="685" y2="306" stroke="#334155" stroke-width="2" marker-end="url(#m26m)"/>
  <text x="694" y="250" font-family="Segoe UI" font-size="13" fill="#475569">2. miss -> DB</text>

  <!-- replika -> o'qish-replika (o'qish so'rovlari) -->
  <line x1="560" y1="220" x2="796" y2="320" stroke="#334155" stroke-width="1.5" marker-end="url(#m26m)"/>
  <text x="640" y="270" font-family="Segoe UI" font-size="13" fill="#475569">o'qish so'rovi</text>

  <!-- DB birlamchi -> o'qish-replika (replikatsiya) -->
  <line x1="740" y1="330" x2="796" y2="320" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#m26m)"/>
  <line x1="740" y1="350" x2="796" y2="410" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#m26m)"/>
  <text x="730" y="395" font-family="Segoe UI" font-size="13" fill="#166534">replikatsiya</text>
  <text x="730" y="412" font-family="Segoe UI" font-size="13" fill="#166534">(eventual)</text>

  <!-- replika -> queue (og'ir ish) -->
  <line x1="485" y1="264" x2="490" y2="470" stroke="#f59e0b" stroke-width="2" marker-end="url(#m26q)"/>
  <text x="498" y="380" font-family="Segoe UI" font-size="13" fill="#b45309">og'ir/sekin ish -> queue</text>

  <!-- queue -> worker'lar -->
  <line x1="430" y1="518" x2="220" y2="556" stroke="#f59e0b" stroke-width="2" marker-end="url(#m26q)"/>
  <line x1="465" y1="518" x2="380" y2="556" stroke="#f59e0b" stroke-width="2" marker-end="url(#m26q)"/>
  <line x1="525" y1="518" x2="540" y2="556" stroke="#f59e0b" stroke-width="2" marker-end="url(#m26q)"/>

  <!-- worker -> DB birlamchi -->
  <line x1="440" y1="578" x2="630" y2="368" stroke="#16a34a" stroke-width="1.5" marker-end="url(#m26m)"/>
  <text x="540" y="470" font-family="Segoe UI" font-size="13" fill="#166534">yozadi</text>

  <!-- Izoh quti -->
  <rect x="40" y="290" width="300" height="160" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="190" y="312" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Bottleneck -> yechim</text>
  <text x="55" y="336" font-family="Segoe UI" font-size="13" fill="#475569">- ko'p o'qish -> kesh + o'qish-replika</text>
  <text x="55" y="358" font-family="Segoe UI" font-size="13" fill="#475569">- ko'p so'rov -> LB + stateless replika</text>
  <text x="55" y="380" font-family="Segoe UI" font-size="13" fill="#475569">- og'ir/sekin ish -> queue + worker</text>
  <text x="55" y="402" font-family="Segoe UI" font-size="13" fill="#475569">- statik/rasm -> CDN (origin'ni tushir)</text>
  <text x="55" y="424" font-family="Segoe UI" font-size="13" fill="#dc2626">- yozish bottleneck -> sharding (eng oxirgi)</text>
  <text x="55" y="444" font-family="Segoe UI" font-size="13" fill="#64748b" font-style="italic">avval o'lcha, keyin masshtabla</text>

  <text x="490" y="648" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">Birlamchi DB ko'pincha YOZISH bottleneck'i bo'ladi: kesh va o'qish-replika o'qishni yengillatadi;</text>
  <text x="490" y="670" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">yozish hali ham og'ir bo'lsa -> sharding (oxirgi chora). O'qish-replika = eventual consistency (22-bob).</text>
</svg>
