<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540">
  <title>Cohesion: past jipslik (god object) vs yuqori jipslik (functional) va cohesion turlari shkalasi</title>
  <rect x="0" y="0" width="860" height="540" fill="#f8fafc"/>
  <text x="430" y="34" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">Cohesion (jipslik) — past vs yuqori</text>

  <!-- PAST cohesion: god object -->
  <rect x="40" y="60" width="370" height="230" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="225" y="86" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">PAST jipslik — "UtilManager"</text>
  <text x="225" y="106" font-family="Segoe UI" font-size="13" fill="#991b1b" text-anchor="middle">bog'liq bo'lmagan ishlar bir joyda (god object)</text>
  <rect x="70" y="120" width="140" height="42" rx="6" fill="#ffffff" stroke="#dc2626"/>
  <text x="140" y="146" font-family="Segoe UI" font-size="13" fill="#1e293b" text-anchor="middle">sendEmail()</text>
  <rect x="240" y="120" width="140" height="42" rx="6" fill="#ffffff" stroke="#dc2626"/>
  <text x="310" y="146" font-family="Segoe UI" font-size="13" fill="#1e293b" text-anchor="middle">parsePDF()</text>
  <rect x="70" y="174" width="140" height="42" rx="6" fill="#ffffff" stroke="#dc2626"/>
  <text x="140" y="200" font-family="Segoe UI" font-size="13" fill="#1e293b" text-anchor="middle">calcTax()</text>
  <rect x="240" y="174" width="140" height="42" rx="6" fill="#ffffff" stroke="#dc2626"/>
  <text x="310" y="200" font-family="Segoe UI" font-size="13" fill="#1e293b" text-anchor="middle">resizeImage()</text>
  <rect x="70" y="228" width="310" height="42" rx="6" fill="#ffffff" stroke="#dc2626"/>
  <text x="225" y="254" font-family="Segoe UI" font-size="13" fill="#1e293b" text-anchor="middle">connectDB()  ·  logMetric()</text>

  <!-- YUQORI cohesion: 3 fokuslangan modul -->
  <rect x="450" y="60" width="370" height="230" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="635" y="86" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a" text-anchor="middle">YUQORI jipslik — fokuslangan modullar</text>
  <text x="635" y="106" font-family="Segoe UI" font-size="13" fill="#166534" text-anchor="middle">har modul bitta ishni qiladi (functional)</text>

  <rect x="470" y="120" width="160" height="150" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="550" y="142" font-family="Segoe UI" font-size="13.5" font-weight="bold" fill="#166534" text-anchor="middle">TaxService</text>
  <rect x="486" y="152" width="128" height="30" rx="5" fill="#dcfce7"/>
  <text x="550" y="172" font-family="Segoe UI" font-size="13" fill="#1e293b" text-anchor="middle">calcTax()</text>
  <rect x="486" y="188" width="128" height="30" rx="5" fill="#dcfce7"/>
  <text x="550" y="208" font-family="Segoe UI" font-size="13" fill="#1e293b" text-anchor="middle">applyVat()</text>
  <rect x="486" y="224" width="128" height="30" rx="5" fill="#dcfce7"/>
  <text x="550" y="244" font-family="Segoe UI" font-size="13" fill="#1e293b" text-anchor="middle">roundMoney()</text>

  <rect x="645" y="120" width="160" height="150" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="725" y="142" font-family="Segoe UI" font-size="13.5" font-weight="bold" fill="#166534" text-anchor="middle">Notifier</text>
  <rect x="661" y="152" width="128" height="30" rx="5" fill="#dcfce7"/>
  <text x="725" y="172" font-family="Segoe UI" font-size="13" fill="#1e293b" text-anchor="middle">sendEmail()</text>
  <rect x="661" y="188" width="128" height="30" rx="5" fill="#dcfce7"/>
  <text x="725" y="208" font-family="Segoe UI" font-size="13" fill="#1e293b" text-anchor="middle">sendSms()</text>
  <rect x="661" y="224" width="128" height="30" rx="5" fill="#dcfce7"/>
  <text x="725" y="244" font-family="Segoe UI" font-size="13" fill="#1e293b" text-anchor="middle">format()</text>

  <!-- Cohesion turlari shkalasi -->
  <text x="430" y="330" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Cohesion turlari — pastdan (yomon) yuqoriga (yaxshi)</text>
  <defs>
    <linearGradient id="cohgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dc2626"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect x="40" y="350" width="780" height="16" rx="8" fill="url(#cohgrad)"/>

  <g font-family="Segoe UI" font-size="13" fill="#334155">
    <text x="55" y="392" font-weight="bold" fill="#dc2626">1. Coincidental</text>
    <text x="55" y="410" font-size="13" fill="#64748b">tasodifan birga (Utils)</text>

    <text x="225" y="392" font-weight="bold" fill="#dc2626">2. Logical</text>
    <text x="225" y="410" font-size="13" fill="#64748b">"o'xshash" amallar bayroqda</text>

    <text x="430" y="392" font-weight="bold" fill="#b45309">3. Temporal</text>
    <text x="430" y="410" font-size="13" fill="#64748b">bir vaqtda ishlaydi (init)</text>

    <text x="620" y="392" font-weight="bold" fill="#b45309">4. Procedural / Communicational</text>
    <text x="620" y="410" font-size="13" fill="#64748b">tartib / bir ma'lumot ustida</text>

    <text x="55" y="448" font-weight="bold" fill="#15803d">5. Sequential</text>
    <text x="55" y="466" font-size="13" fill="#64748b">biri chiqishi keyingiga kiradi</text>

    <text x="430" y="448" font-weight="bold" fill="#16a34a">6. Functional (eng yaxshi)</text>
    <text x="430" y="466" font-size="13" fill="#64748b">hammasi bitta aniq vazifaga xizmat qiladi</text>
  </g>

  <rect x="40" y="486" width="780" height="38" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="430" y="510" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Maqsad: YUQORI cohesion + BO'SH coupling — birga</text>
</svg>
