<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700">
  <title>Buyurtma berish ketma-ketlik diagrammasi: xaridor, gateway, buyurtma, inventar, to'lov, broker, inventar/bildirishnoma servislari bo'ylab sinxron va asinxron oqim</title>
  <rect x="0" y="0" width="980" height="700" fill="#f8fafc"/>
  <text x="490" y="30" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">Ma'lumot oqimi - "buyurtma berish" (ketma-ketlik)</text>
  <text x="490" y="54" font-family="Segoe UI" font-size="14" fill="#64748b" text-anchor="middle">sinxron yo'l = to'lovgacha (CP); asinxron yo'l = event orqali (inventar/email)</text>

  <defs>
    <marker id="s26s" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="s26r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="s26e" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Ishtirokchilar (head) va lifeline'lar -->
  <!-- 1 Xaridor x=70 -->
  <rect x="25" y="78" width="90" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="70" y="103" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#3730a3" text-anchor="middle">Xaridor</text>
  <line x1="70" y1="118" x2="70" y2="650" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- 2 Gateway x=210 -->
  <rect x="160" y="78" width="100" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="210" y="103" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#92400e" text-anchor="middle">Gateway</text>
  <line x1="210" y1="118" x2="210" y2="650" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- 3 Buyurtma x=370 -->
  <rect x="315" y="78" width="110" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="370" y="103" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">Buyurtma</text>
  <line x1="370" y1="118" x2="370" y2="650" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- 4 Inventar x=540 -->
  <rect x="485" y="78" width="110" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="540" y="103" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">Inventar</text>
  <line x1="540" y1="118" x2="540" y2="650" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- 5 To'lov x=700 -->
  <rect x="645" y="78" width="110" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="700" y="103" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">To'lov</text>
  <line x1="700" y1="118" x2="700" y2="650" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- 6 Broker x=850 -->
  <rect x="800" y="78" width="120" height="40" rx="6" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
  <text x="860" y="103" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#92400e" text-anchor="middle">Broker</text>
  <line x1="860" y1="118" x2="860" y2="650" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- 1: Xaridor -> Gateway -->
  <line x1="70" y1="148" x2="208" y2="148" stroke="#2563eb" stroke-width="2" marker-end="url(#s26s)"/>
  <text x="76" y="142" font-family="Segoe UI" font-size="13" fill="#1e293b">POST /orders {savat, Idempotency-Key}</text>

  <!-- 2: Gateway -> Buyurtma -->
  <line x1="210" y1="176" x2="368" y2="176" stroke="#2563eb" stroke-width="2" marker-end="url(#s26s)"/>
  <text x="216" y="170" font-family="Segoe UI" font-size="13" fill="#1e293b">auth OK -> buyurtma yarat</text>

  <!-- 3: Buyurtma -> Inventar (rezerv) -->
  <line x1="370" y1="204" x2="538" y2="204" stroke="#2563eb" stroke-width="2" marker-end="url(#s26s)"/>
  <text x="376" y="198" font-family="Segoe UI" font-size="13" fill="#1e293b">qoldiqni REZERV qil (sinxron)</text>

  <!-- 4: Inventar -> Buyurtma (javob) -->
  <line x1="540" y1="230" x2="372" y2="230" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#s26r)"/>
  <text x="400" y="224" font-family="Segoe UI" font-size="13" fill="#475569">rezerv OK</text>

  <!-- 5: Buyurtma -> To'lov (sinxron, CP) -->
  <line x1="370" y1="258" x2="698" y2="258" stroke="#2563eb" stroke-width="2" marker-end="url(#s26s)"/>
  <text x="376" y="252" font-family="Segoe UI" font-size="13" fill="#1e293b">to'lovni boshla (Idempotency-Key bilan)</text>

  <!-- 6: To'lov -> tashqi shlyuz izoh -->
  <rect x="645" y="272" width="200" height="28" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="745" y="290" font-family="Segoe UI" font-size="13" fill="#475569" text-anchor="middle">tashqi shlyuz, retry/timeout</text>

  <!-- 7: To'lov -> Buyurtma (javob) -->
  <line x1="700" y1="318" x2="372" y2="318" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#s26r)"/>
  <text x="430" y="312" font-family="Segoe UI" font-size="13" fill="#475569">to'lov tasdiqlandi</text>

  <!-- alt blok: to'lov muvaffaqiyatli -->
  <rect x="330" y="334" width="540" height="170" rx="6" fill="none" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="330" y="334" width="120" height="24" fill="#16a34a"/>
  <text x="338" y="351" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#ffffff">alt [to'lov OK]</text>

  <!-- 8: Buyurtma -> Broker (event publish) -->
  <line x1="370" y1="382" x2="858" y2="382" stroke="#f59e0b" stroke-width="2" marker-end="url(#s26e)"/>
  <text x="376" y="376" font-family="Segoe UI" font-size="13" fill="#b45309">OrderPlaced event (publish) - asinxron</text>

  <!-- 9: Broker -> Inventar (subscribe, async) -->
  <line x1="860" y1="416" x2="542" y2="416" stroke="#f59e0b" stroke-width="2" marker-end="url(#s26e)"/>
  <text x="560" y="410" font-family="Segoe UI" font-size="13" fill="#b45309">rezervni QAT'IY kamaytir (eventual)</text>

  <!-- 10: Broker -> (Bildirishnoma izoh) -->
  <line x1="860" y1="450" x2="212" y2="450" stroke="#f59e0b" stroke-width="2" marker-end="url(#s26e)"/>
  <text x="300" y="444" font-family="Segoe UI" font-size="13" fill="#b45309">email/SMS yubor (bildirishnoma worker, eventual)</text>

  <!-- 11: Buyurtma -> Gateway -> Xaridor (201) -->
  <line x1="370" y1="478" x2="72" y2="478" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#s26r)"/>
  <text x="120" y="472" font-family="Segoe UI" font-size="13" fill="#475569">201 Created {orderId, status: paid}</text>

  <!-- else blok: to'lov muvaffaqiyatsiz -->
  <rect x="330" y="516" width="540" height="100" rx="6" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="330" y="516" width="150" height="24" fill="#dc2626"/>
  <text x="338" y="533" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#ffffff">else [to'lov xato]</text>

  <!-- 12: Buyurtma -> Inventar (kompensatsiya) -->
  <line x1="370" y1="564" x2="538" y2="564" stroke="#dc2626" stroke-width="2" marker-end="url(#s26s)"/>
  <text x="376" y="558" font-family="Segoe UI" font-size="13" fill="#991b1b">rezervni BEKOR qil (kompensatsiya/saga)</text>

  <!-- 13: Buyurtma -> Xaridor (402) -->
  <line x1="370" y1="596" x2="72" y2="596" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#s26r)"/>
  <text x="110" y="590" font-family="Segoe UI" font-size="13" fill="#475569">402 / xato {status: failed}</text>

  <text x="490" y="644" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">Idempotency-Key = bir buyurtma ikki marta to'lanmaydi (17/21-bob). Saga = distributed tranzaksiya o'rnida kompensatsiya.</text>
  <text x="490" y="676" font-family="Segoe UI" font-size="13" fill="#94a3b8" text-anchor="middle" font-style="italic">Ko'k = sinxron so'rov; kulrang punktir = javob; sariq = asinxron event; qizil = kompensatsiya yo'li</text>
</svg>
