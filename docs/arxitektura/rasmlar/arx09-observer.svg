<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450">
  <title>Observer pattern: subyekt holat o'zgarganda barcha obunachilarni xabardor qiladi</title>
  <rect x="0" y="0" width="760" height="450" fill="#f8fafc"/>
  <text x="380" y="34" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Observer: bir manba, ko'p tinglovchi</text>
  <text x="380" y="58" font-family="Segoe UI" font-size="14" fill="#64748b" text-anchor="middle">Subyekt obunachilarni KIM ekanini bilmaydi — faqat xabar yuboradi (loose coupling)</text>

  <defs>
    <marker id="o-ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Subyekt -->
  <rect x="290" y="110" width="190" height="100" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="385" y="138" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="middle">Ombor (subyekt)</text>
  <line x1="290" y1="150" x2="480" y2="150" stroke="#94a3b8" stroke-width="1"/>
  <text x="306" y="173" font-family="Segoe UI" font-size="13" fill="#334155">+ obunaBol(t)</text>
  <text x="306" y="195" font-family="Segoe UI" font-size="13" fill="#334155">+ xabarYubor(hodisa)</text>

  <!-- Hodisa -->
  <rect x="300" y="232" width="170" height="34" rx="8" fill="#fef9c3" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="385" y="254" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">qoldiq o'zgardi: 3</text>

  <!-- Obunachilar -->
  <rect x="40" y="330" width="200" height="90" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="357" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">Email xabarnoma</text>
  <text x="58" y="382" font-family="Segoe UI" font-size="13" fill="#334155">qoldiqni mijozga</text>
  <text x="58" y="402" font-family="Segoe UI" font-size="13" fill="#334155">yozadi</text>

  <rect x="280" y="330" width="200" height="90" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="357" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">Kam-qoldiq alert</text>
  <text x="298" y="382" font-family="Segoe UI" font-size="13" fill="#334155">qoldiq &lt; 5 bo'lsa</text>
  <text x="298" y="402" font-family="Segoe UI" font-size="13" fill="#334155">ogohlantiradi</text>

  <rect x="520" y="330" width="200" height="90" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="357" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">Analitika</text>
  <text x="538" y="382" font-family="Segoe UI" font-size="13" fill="#334155">hodisani log'ga</text>
  <text x="538" y="402" font-family="Segoe UI" font-size="13" fill="#334155">yozadi</text>

  <!-- O'qlar: subyekt -> obunachilar -->
  <line x1="350" y1="266" x2="150" y2="330" stroke="#2563eb" stroke-width="2" marker-end="url(#o-ar)"/>
  <line x1="385" y1="266" x2="380" y2="330" stroke="#2563eb" stroke-width="2" marker-end="url(#o-ar)"/>
  <line x1="420" y1="266" x2="610" y2="330" stroke="#2563eb" stroke-width="2" marker-end="url(#o-ar)"/>
  <text x="160" y="305" font-family="Segoe UI" font-size="13" fill="#2563eb">xabar()</text>
  <text x="395" y="305" font-family="Segoe UI" font-size="13" fill="#2563eb">xabar()</text>
  <text x="540" y="305" font-family="Segoe UI" font-size="13" fill="#2563eb">xabar()</text>

  <!-- Izoh -->
  <rect x="510" y="110" width="220" height="100" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="620" y="135" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Nega muhim</text>
  <text x="526" y="160" font-family="Segoe UI" font-size="13" fill="#334155">Yangi tinglovchi qo'shsang,</text>
  <text x="526" y="178" font-family="Segoe UI" font-size="13" fill="#334155">Ombor kodi o'zgarmaydi.</text>
  <text x="526" y="198" font-family="Segoe UI" font-size="13" fill="#64748b">Event-driven (15-bob) poydevori.</text>
</svg>
