<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520">
  <title>Arxitektura anti-patternlari xaritasi: har biri uchun belgisi (alomati) va davosi qisqacha berilgan</title>
  <rect x="0" y="0" width="780" height="520" fill="#f8fafc"/>
  <text x="390" y="34" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Arxitektura anti-patternlari xaritasi</text>
  <text x="390" y="56" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">Har biri: nima · belgisi (alomat) · davosi</text>

  <!-- Card template: 7 cards in grid -->
  <!-- Row 1 -->
  <rect x="24" y="78" width="240" height="130" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="40" y="102" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">Big Ball of Mud</text>
  <text x="40" y="124" font-family="Segoe UI" font-size="13" fill="#334155">Tuzilmasiz, hamma hammaga</text>
  <text x="40" y="142" font-family="Segoe UI" font-size="13" fill="#334155">bog'liq chigallik.</text>
  <text x="40" y="166" font-family="Segoe UI" font-size="13" fill="#64748b">Belgi: "tegsang sinadi".</text>
  <text x="40" y="190" font-family="Segoe UI" font-size="13" fill="#16a34a">Davo: modul chegarasi, fitness fn.</text>

  <rect x="270" y="78" width="240" height="130" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="286" y="102" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#b45309">Golden Hammer</text>
  <text x="286" y="124" font-family="Segoe UI" font-size="13" fill="#334155">Bitta sevimli vositani</text>
  <text x="286" y="142" font-family="Segoe UI" font-size="13" fill="#334155">hamma muammoga urish.</text>
  <text x="286" y="166" font-family="Segoe UI" font-size="13" fill="#64748b">Belgi: "bizda hamma narsa X".</text>
  <text x="286" y="190" font-family="Segoe UI" font-size="13" fill="#16a34a">Davo: muammoga ko'ra vosita tanla.</text>

  <rect x="516" y="78" width="240" height="130" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="532" y="102" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#b45309">Lava Flow</text>
  <text x="532" y="124" font-family="Segoe UI" font-size="13" fill="#334155">O'lik / qo'rqinchli kod</text>
  <text x="532" y="142" font-family="Segoe UI" font-size="13" fill="#334155">qotib qoladi, hech kim olib tashlamaydi.</text>
  <text x="532" y="166" font-family="Segoe UI" font-size="13" fill="#64748b">Belgi: "tegma, ishlayapti".</text>
  <text x="532" y="190" font-family="Segoe UI" font-size="13" fill="#16a34a">Davo: o'lik kodni o'chir, qamrov.</text>

  <!-- Row 2 -->
  <rect x="24" y="222" width="240" height="130" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="40" y="246" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#b45309">Accidental Arch.</text>
  <text x="40" y="268" font-family="Segoe UI" font-size="13" fill="#334155">Rejasiz, "o'z-o'zidan</text>
  <text x="40" y="286" font-family="Segoe UI" font-size="13" fill="#334155">paydo bo'lgan" tuzilma.</text>
  <text x="40" y="310" font-family="Segoe UI" font-size="13" fill="#64748b">Belgi: hech kim chizolmaydi.</text>
  <text x="40" y="334" font-family="Segoe UI" font-size="13" fill="#16a34a">Davo: ataylab qaror, ADR, C4.</text>

  <rect x="270" y="222" width="240" height="130" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="286" y="246" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">Distributed Monolith</text>
  <text x="286" y="268" font-family="Segoe UI" font-size="13" fill="#334155">Mikroservis ko'rinishi,</text>
  <text x="286" y="286" font-family="Segoe UI" font-size="13" fill="#334155">lekin birga deploy + umumiy DB.</text>
  <text x="286" y="310" font-family="Segoe UI" font-size="13" fill="#64748b">Belgi: birini deploy=hammasini.</text>
  <text x="286" y="334" font-family="Segoe UI" font-size="13" fill="#16a34a">Davo: chegara, async, DB-per-svc.</text>

  <rect x="516" y="222" width="240" height="130" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="532" y="246" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#b45309">Vendor Lock-in</text>
  <text x="532" y="268" font-family="Segoe UI" font-size="13" fill="#334155">Bitta provayderga chuqur</text>
  <text x="532" y="286" font-family="Segoe UI" font-size="13" fill="#334155">o'ralashib, chiqib bo'lmaydi.</text>
  <text x="532" y="310" font-family="Segoe UI" font-size="13" fill="#64748b">Belgi: ko'chish narxi ulkan.</text>
  <text x="532" y="334" font-family="Segoe UI" font-size="13" fill="#16a34a">Davo: port/adapter, abstraksiya.</text>

  <!-- Row 3: one wide card -->
  <rect x="24" y="366" width="486" height="130" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="40" y="390" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#b45309">Premature Optimization</text>
  <text x="40" y="412" font-family="Segoe UI" font-size="13" fill="#334155">Hali muammo emasligini o'lchamasdan, erta murakkab</text>
  <text x="40" y="430" font-family="Segoe UI" font-size="13" fill="#334155">optimallashtirish (kesh, shard, mikroservis) qo'shish.</text>
  <text x="40" y="456" font-family="Segoe UI" font-size="13" fill="#64748b">Belgi: o'lchov yo'q, "ehtimol kerak bo'lar".</text>
  <text x="40" y="480" font-family="Segoe UI" font-size="13" fill="#16a34a">Davo: avval o'lcha, keyin optimallashtir (profiling).</text>

  <!-- Legend -->
  <rect x="528" y="366" width="228" height="130" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="544" y="390" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Belgisiga qarab og'irlik</text>
  <rect x="544" y="404" width="16" height="16" rx="3" fill="#dc2626"/>
  <text x="568" y="417" font-family="Segoe UI" font-size="13" fill="#334155">Tizimli, og'ir (qizil)</text>
  <rect x="544" y="430" width="16" height="16" rx="3" fill="#f59e0b"/>
  <text x="568" y="443" font-family="Segoe UI" font-size="13" fill="#334155">Sekin eroziya (sariq)</text>
  <text x="544" y="472" font-family="Segoe UI" font-size="13" fill="#64748b">Hammasi intizom va</text>
  <text x="544" y="490" font-family="Segoe UI" font-size="13" fill="#64748b">o'lchov yo'qligidan.</text>
</svg>
