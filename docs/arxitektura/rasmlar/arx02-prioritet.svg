<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" width="780" height="450">
  <title>Har xil tizim har xil prioritet: bank (consistency, security), ijtimoiy tarmoq lentasi (availability, scalability), real-time o'yin (latency, performance)</title>

  <rect x="0" y="0" width="780" height="450" fill="#f8fafc"/>

  <text x="390" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="bold" fill="#1e293b">Har tizim — har xil haydovchi atribut</text>
  <text x="390" y="60" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569">"qaysi arxitektura yaxshi?" degan savol kontekstsiz ma'nosiz — 2-3 ta atribut shaklini belgilaydi</text>

  <!-- BANK -->
  <rect x="30" y="90" width="232" height="320" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="146" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="34">&#127974;</text>
  <text x="146" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#1e293b">Bank / to'lov</text>

  <rect x="50" y="176" width="192" height="40" rx="8" fill="#2563eb"/>
  <text x="146" y="201" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#ffffff">Consistency</text>
  <rect x="50" y="222" width="192" height="40" rx="8" fill="#2563eb"/>
  <text x="146" y="247" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#ffffff">Security</text>
  <rect x="50" y="268" width="192" height="36" rx="8" fill="#93c5fd"/>
  <text x="146" y="291" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e3a8a">Reliability</text>

  <text x="146" y="338" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">voz kechadi:</text>
  <text x="146" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">availability (qisman), latency</text>
  <text x="146" y="388" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155" font-style="italic">"1 soat o'chiq" &gt;</text>
  <text x="146" y="404" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155" font-style="italic">"1 soat noto'g'ri balans"</text>

  <!-- IJTIMOIY TARMOQ -->
  <rect x="274" y="90" width="232" height="320" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="390" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="34">&#128241;</text>
  <text x="390" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#1e293b">Ijtimoiy lenta</text>

  <rect x="294" y="176" width="192" height="40" rx="8" fill="#16a34a"/>
  <text x="390" y="201" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#ffffff">Availability</text>
  <rect x="294" y="222" width="192" height="40" rx="8" fill="#16a34a"/>
  <text x="390" y="247" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#ffffff">Scalability</text>
  <rect x="294" y="268" width="192" height="36" rx="8" fill="#86efac"/>
  <text x="390" y="291" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#14532d">Performance</text>

  <text x="390" y="338" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">voz kechadi:</text>
  <text x="390" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">qattiq consistency</text>
  <text x="390" y="388" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155" font-style="italic">biroz eski post mayli —</text>
  <text x="390" y="404" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155" font-style="italic">asosiysi ishlab tursin</text>

  <!-- O'YIN -->
  <rect x="518" y="90" width="232" height="320" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="634" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="34">&#127918;</text>
  <text x="634" y="156" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#1e293b">Real-time o'yin</text>

  <rect x="538" y="176" width="192" height="40" rx="8" fill="#f59e0b"/>
  <text x="634" y="201" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#ffffff">Latency</text>
  <rect x="538" y="222" width="192" height="40" rx="8" fill="#f59e0b"/>
  <text x="634" y="247" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="bold" fill="#ffffff">Performance</text>
  <rect x="538" y="268" width="192" height="36" rx="8" fill="#fcd34d"/>
  <text x="634" y="291" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#78350f">Availability</text>

  <text x="634" y="338" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">voz kechadi:</text>
  <text x="634" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">qattiq consistency</text>
  <text x="634" y="388" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155" font-style="italic">har millisekund muhim —</text>
  <text x="634" y="404" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155" font-style="italic">eskini mijozda silliqlaymiz</text>
</svg>
