<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" width="860" height="540">
  <title>Modulli monolit: bitta deploy birligi ichida toza chegarali mustaqil modullar, mikroservisga ko'prik</title>
  <rect x="0" y="0" width="860" height="540" fill="#f8fafc"/>
  <text x="430" y="34" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">Modulli monolit — "oltin o'rtalik"</text>
  <text x="430" y="58" font-family="Segoe UI" font-size="14" fill="#64748b" text-anchor="middle">Bitta deploy birligi (monolit qulayligi) + ichki toza chegaralar (mikroservis intizomi)</text>

  <defs>
    <marker id="mm-a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="mm-x" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <path d="M2,2 L10,10 M10,2 L2,10" stroke="#dc2626" stroke-width="2" fill="none"/>
    </marker>
  </defs>

  <!-- Tashqi deploy birligi konturi -->
  <rect x="40" y="80" width="780" height="320" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="8,5"/>
  <text x="430" y="106" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">1 DEPLOY BIRLIGI (bitta jarayon, bitta release)</text>

  <!-- Modul 1: Buyurtma -->
  <rect x="70" y="130" width="220" height="230" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="156" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">Buyurtma moduli</text>
  <rect x="90" y="172" width="180" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="180" y="194" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">public API (yagona eshik)</text>
  <text x="180" y="226" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">ichki domen mantiqi</text>
  <rect x="105" y="290" width="150" height="56" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="180" y="314" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">ichki ma'lumot</text>
  <text x="180" y="332" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">(o'z jadval/schema)</text>

  <!-- Modul 2: To'lov -->
  <rect x="320" y="130" width="220" height="230" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="430" y="156" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">To'lov moduli</text>
  <rect x="340" y="172" width="180" height="34" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="430" y="194" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">public API (yagona eshik)</text>
  <text x="430" y="226" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">ichki domen mantiqi</text>
  <rect x="355" y="290" width="150" height="56" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="430" y="314" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">ichki ma'lumot</text>
  <text x="430" y="332" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">(o'z jadval/schema)</text>

  <!-- Modul 3: Ombor -->
  <rect x="570" y="130" width="220" height="230" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="680" y="156" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">Ombor moduli</text>
  <rect x="590" y="172" width="180" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="680" y="194" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#92400e" text-anchor="middle">public API (yagona eshik)</text>
  <text x="680" y="226" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">ichki domen mantiqi</text>
  <rect x="605" y="290" width="150" height="56" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="680" y="314" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">ichki ma'lumot</text>
  <text x="680" y="332" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">(o'z jadval/schema)</text>

  <!-- Ruxsat etilgan aloqa: public API -> public API -->
  <line x1="270" y1="189" x2="338" y2="189" stroke="#16a34a" stroke-width="2.5" marker-end="url(#mm-a)"/>
  <line x1="520" y1="189" x2="588" y2="189" stroke="#16a34a" stroke-width="2.5" marker-end="url(#mm-a)"/>
  <text x="430" y="378" font-family="Segoe UI" font-size="13" fill="#166534" text-anchor="middle">RUXSAT: faqat boshqa modulning public API'siga chaqiruv</text>

  <!-- TAQIQ: ichki ma'lumotga to'g'ridan kirish -->
  <path d="M255 318 C 300 380, 360 380, 405 318" stroke="#dc2626" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#mm-x)"/>

  <!-- Pastki: ko'prik izohi -->
  <rect x="40" y="420" width="780" height="100" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="430" y="446" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Nega "ko'prik"?</text>
  <text x="60" y="472" font-family="Segoe UI" font-size="13" fill="#16a34a">+ Bitta deploy: sodda ishga tushirish, bitta release, ACID tranzaksiya hali mumkin (umumiy DB bo'lsa).</text>
  <text x="60" y="492" font-family="Segoe UI" font-size="13" fill="#2563eb">+ Toza chegaralar: agar keyin mikroservis kerak bo'lsa, modulni AJRATIB olish oson — public API allaqachon bor.</text>
  <text x="60" y="512" font-family="Segoe UI" font-size="13" fill="#dc2626">- Intizom KERAK: kompilyator/arxitektura testlari chegarani himoya qilmasa, modullar asta chigallashadi.</text>
</svg>
