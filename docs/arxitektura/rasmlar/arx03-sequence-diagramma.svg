<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560">
  <title>Ketma-ketlik (sequence) diagrammasi: Mijoz -> API -> Ma'lumotlar bazasi, buyurtma berish oqimi va xato yo'li</title>
  <rect x="0" y="0" width="880" height="560" fill="#f8fafc"/>
  <text x="440" y="32" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Sequence: "buyurtma berish" oqimi</text>
  <text x="440" y="56" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Vaqt yuqoridan pastga oqadi; har strelka - bitta xabar</text>

  <!-- lifelines header -->
  <rect x="60" y="78" width="130" height="44" rx="8" fill="#16a34a"/>
  <text x="125" y="106" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#ffffff">Mijoz</text>
  <rect x="360" y="78" width="130" height="44" rx="8" fill="#2563eb"/>
  <text x="425" y="106" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#ffffff">API</text>
  <rect x="660" y="78" width="130" height="44" rx="8" fill="#f59e0b"/>
  <text x="725" y="106" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Baza (DB)</text>

  <!-- lifelines -->
  <line x1="125" y1="122" x2="125" y2="520" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="425" y1="122" x2="425" y2="520" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="725" y1="122" x2="725" y2="520" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- activation bars -->
  <rect x="418" y="158" width="14" height="300" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="718" y="210" width="14" height="70" fill="#fde68a" stroke="#f59e0b"/>
  <rect x="718" y="330" width="14" height="60" fill="#fde68a" stroke="#f59e0b"/>

  <!-- msg1: POST /orders -->
  <line x1="125" y1="160" x2="416" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#sar)"/>
  <text x="270" y="152" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">1. POST /orders {tovarlar}</text>

  <!-- msg2: SELECT stock -->
  <line x1="432" y1="218" x2="716" y2="218" stroke="#334155" stroke-width="2" marker-end="url(#sar)"/>
  <text x="574" y="210" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">2. SELECT zaxira</text>
  <!-- return -->
  <line x1="716" y1="272" x2="434" y2="272" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#sarR)"/>
  <text x="574" y="264" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">3. zaxira yetarli</text>

  <!-- alt frame -->
  <rect x="150" y="298" width="600" height="150" rx="4" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="150" y="298" width="58" height="22" fill="#2563eb"/>
  <text x="179" y="314" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#ffffff">alt</text>
  <text x="300" y="314" font-family="Segoe UI" font-size="13" fill="#2563eb">[zaxira bor]</text>

  <!-- msg4: INSERT order -->
  <line x1="432" y1="340" x2="716" y2="340" stroke="#334155" stroke-width="2" marker-end="url(#sar)"/>
  <text x="574" y="332" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#334155">4. INSERT buyurtma</text>
  <line x1="716" y1="384" x2="434" y2="384" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#sarR)"/>
  <text x="574" y="376" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">5. id = 1042</text>

  <!-- divider for else -->
  <line x1="150" y1="404" x2="750" y2="404" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="300" y="420" font-family="Segoe UI" font-size="13" fill="#dc2626">[zaxira yo'q]</text>

  <!-- return to client -->
  <line x1="416" y1="478" x2="127" y2="478" stroke="#16a34a" stroke-width="2" marker-end="url(#sarG)"/>
  <text x="270" y="470" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">6. 201 Created (yoki 409 - zaxira yo'q)</text>

  <text x="440" y="512" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">alt = shartli shox: yuqori yo'l "muvaffaqiyat", pastki yo'l "xato"</text>

  <defs>
    <marker id="sar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#334155"/></marker>
    <marker id="sarR" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#64748b"/></marker>
    <marker id="sarG" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#16a34a"/></marker>
  </defs>
</svg>
