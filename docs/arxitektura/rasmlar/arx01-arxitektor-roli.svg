<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>Me'mor roli: mas'uliyatlari markazda, ko'nikmalari atrofda, "ivory tower" anti-pattern bilan</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>
  <text x="380" y="34" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Me'mor (architect) roli</text>
  <text x="380" y="58" font-family="Segoe UI" font-size="14" fill="#64748b" text-anchor="middle">Boshliq emas, yo'l ko'rsatuvchi: qaror, trade-off, aloqa</text>

  <!-- Markaziy doira -->
  <circle cx="380" cy="240" r="78" fill="#2563eb"/>
  <text x="380" y="232" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">ME'MOR</text>
  <text x="380" y="256" font-family="Segoe UI" font-size="13" fill="#ffffff" text-anchor="middle">qarorlarni bog'laydi</text>

  <!-- 4 mas'uliyat atrofda -->
  <!-- Yuqori chap -->
  <rect x="60" y="120" width="220" height="58" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="146" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Qaror qabul qilish</text>
  <text x="170" y="166" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">muhim, qaytarib bo'lmas tanlovlar</text>
  <line x1="280" y1="170" x2="320" y2="205" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Yuqori o'ng -->
  <rect x="480" y="120" width="220" height="58" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="590" y="146" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Trade-off baholash</text>
  <text x="590" y="166" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">nimani nimaga almashtirish</text>
  <line x1="480" y1="170" x2="440" y2="205" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Past chap -->
  <rect x="60" y="305" width="220" height="58" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="170" y="331" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Jamoaga yo'l ko'rsatish</text>
  <text x="170" y="351" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">tushuntirish, hujjatlash, mentorlik</text>
  <line x1="280" y1="320" x2="320" y2="280" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Past o'ng -->
  <rect x="480" y="305" width="220" height="58" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="590" y="331" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Kod bilan aloqada qolish</text>
  <text x="590" y="351" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">"hands-on" — kod yozadi, ko'rib chiqadi</text>
  <line x1="480" y1="320" x2="440" y2="280" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Anti-pattern banneri -->
  <rect x="120" y="400" width="520" height="50" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="380" y="422" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">Anti-pattern: "Ivory Tower" me'mor</text>
  <text x="380" y="441" font-family="Segoe UI" font-size="13" fill="#dc2626" text-anchor="middle">kod yozmaydi, jamoadan uzilgan — diagrammasi amalda ishlamaydi</text>
</svg>
