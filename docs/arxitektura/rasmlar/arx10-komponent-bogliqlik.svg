<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480">
  <title>Komponent bog'liqlik: aylanali (cyclic) graf yomon, aylanasiz (acyclic) graf yaxshi; bog'liqlik barqaror tomonga yo'naladi</title>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="860" height="480" fill="#f8fafc"/>
  <text x="430" y="32" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Komponent bog'liqlik printsiplari</text>

  <!-- LEFT: cyclic = BAD (ADP buzilgan) -->
  <text x="215" y="64" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">Aylanali (cyclic) — ADP buzilgan</text>

  <rect x="90" y="86" width="120" height="48" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="150" y="115" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">orders</text>

  <rect x="260" y="170" width="120" height="48" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="320" y="199" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">billing</text>

  <rect x="90" y="254" width="120" height="48" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="150" y="283" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">payments</text>

  <!-- cycle arrows -->
  <line x1="210" y1="118" x2="262" y2="176" stroke="#dc2626" stroke-width="2" marker-end="url(#arRed)"/>
  <line x1="300" y1="218" x2="190" y2="256" stroke="#dc2626" stroke-width="2" marker-end="url(#arRed)"/>
  <line x1="150" y1="254" x2="150" y2="136" stroke="#dc2626" stroke-width="2" marker-end="url(#arRed)"/>
  <text x="395" y="200" font-family="Segoe UI" font-size="22" fill="#dc2626" text-anchor="middle">&#8635;</text>

  <rect x="56" y="330" width="320" height="96" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="4 3"/>
  <text x="72" y="352" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#dc2626">orders -> billing -> payments -> orders</text>
  <text x="72" y="372" font-family="Segoe UI" font-size="13" fill="#334155">Birini o'zgartirsang hammasi ta'sirlanadi.</text>
  <text x="72" y="390" font-family="Segoe UI" font-size="13" fill="#334155">Alohida test/build/deploy qilib bo'lmaydi.</text>
  <text x="72" y="412" font-family="Segoe UI" font-size="13" fill="#64748b" font-style="italic">Bu — yashirin "katta to'p loy".</text>

  <!-- divider -->
  <line x1="430" y1="58" x2="430" y2="440" stroke="#cbd5e1" stroke-width="2"/>

  <!-- RIGHT: acyclic = GOOD -->
  <text x="645" y="64" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a" text-anchor="middle">Aylanasiz (acyclic) — ADP + SDP</text>

  <rect x="580" y="86" width="120" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="640" y="106" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">web</text>
  <text x="640" y="124" font-family="Segoe UI" font-size="13" fill="#dc2626" text-anchor="middle">I=1.0 (beqaror)</text>

  <rect x="490" y="186" width="120" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="550" y="206" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">billing</text>
  <text x="550" y="224" font-family="Segoe UI" font-size="13" fill="#f59e0b" text-anchor="middle">I=0.67</text>

  <rect x="690" y="186" width="120" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="750" y="206" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">orders</text>
  <text x="750" y="224" font-family="Segoe UI" font-size="13" fill="#f59e0b" text-anchor="middle">I=0.33</text>

  <rect x="590" y="286" width="120" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="650" y="306" font-family="Segoe UI" font-size="14" fill="#334155" text-anchor="middle">shared</text>
  <text x="650" y="324" font-family="Segoe UI" font-size="13" fill="#16a34a" text-anchor="middle">I=0 (barqaror)</text>

  <!-- acyclic arrows: down toward stable -->
  <line x1="615" y1="134" x2="560" y2="184" stroke="#16a34a" stroke-width="2" marker-end="url(#arGreen)"/>
  <line x1="665" y1="134" x2="730" y2="184" stroke="#16a34a" stroke-width="2" marker-end="url(#arGreen)"/>
  <line x1="565" y1="234" x2="625" y2="288" stroke="#16a34a" stroke-width="2" marker-end="url(#arGreen)"/>
  <line x1="735" y1="234" x2="675" y2="288" stroke="#16a34a" stroke-width="2" marker-end="url(#arGreen)"/>
  <line x1="610" y1="200" x2="688" y2="200" stroke="#16a34a" stroke-width="2" marker-end="url(#arGreen)"/>

  <rect x="486" y="350" width="338" height="80" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-dasharray="4 3"/>
  <text x="502" y="372" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a">SDP: o'q I kamayadigan (barqaror) tomonga.</text>
  <text x="502" y="392" font-family="Segoe UI" font-size="13" fill="#334155">I = Ce / (Ca + Ce). shared hammaga kerak -> I=0.</text>
  <text x="502" y="410" font-family="Segoe UI" font-size="13" fill="#334155">Barqaror komponent o'zgarmas (abstrakt) bo'lsin (SAP).</text>

  <text x="430" y="466" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">O'q yo'nalishi = "kim kimga muhtoj". Aylana YO'Q + barqaror tomonga oqim = sog'lom graf.</text>
</svg>
