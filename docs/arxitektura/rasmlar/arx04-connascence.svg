<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560">
  <title>Connascence (Page-Jones): static va dynamic turlari hamda kuchni belgilovchi uch o'lcham</title>
  <rect x="0" y="0" width="860" height="560" fill="#f8fafc"/>
  <text x="430" y="34" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">Connascence — coupling'ning nozik tasnifi (Page-Jones)</text>
  <text x="430" y="58" font-family="Segoe UI" font-size="13.5" fill="#64748b" text-anchor="middle">Ikki element birga o'zgarishi shart bo'lsa, ular orasida connascence bor</text>

  <!-- STATIC -->
  <rect x="40" y="78" width="400" height="290" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="240" y="104" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">STATIC — kodni o'qib ko'rinadi</text>

  <g font-family="Segoe UI">
    <rect x="60" y="118" width="360" height="38" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="72" y="142" font-size="13.5" font-weight="bold" fill="#1e293b">Name (nom)</text>
    <text x="210" y="142" font-size="13" fill="#64748b">bir nomga kelishish (o'zg., metod)</text>

    <rect x="60" y="160" width="360" height="38" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="72" y="184" font-size="13.5" font-weight="bold" fill="#1e293b">Type (tip)</text>
    <text x="210" y="184" font-size="13" fill="#64748b">bir tipga kelishish</text>

    <rect x="60" y="202" width="360" height="38" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="72" y="226" font-size="13.5" font-weight="bold" fill="#1e293b">Meaning (ma'no)</text>
    <text x="210" y="226" font-size="13" fill="#64748b">"1 = aktiv" kabi sehrli qiymat</text>

    <rect x="60" y="244" width="360" height="38" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="72" y="268" font-size="13.5" font-weight="bold" fill="#b45309">Position (pozitsiya)</text>
    <text x="210" y="268" font-size="13" fill="#64748b">argument tartibi (kuchliroq)</text>

    <rect x="60" y="286" width="360" height="38" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="72" y="310" font-size="13.5" font-weight="bold" fill="#b45309">Algorithm (algoritm)</text>
    <text x="210" y="310" font-size="13" fill="#64748b">ikki tomon bir algoritmga tayanadi</text>
  </g>
  <text x="240" y="350" font-family="Segoe UI" font-size="13" fill="#1e3a8a" text-anchor="middle">Yuqoridan pastga: zaifroq -> kuchliroq</text>

  <!-- DYNAMIC -->
  <rect x="460" y="78" width="360" height="290" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="640" y="104" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#991b1b" text-anchor="middle">DYNAMIC — ish vaqtida bilinadi</text>

  <g font-family="Segoe UI">
    <rect x="480" y="118" width="320" height="50" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="492" y="140" font-size="13.5" font-weight="bold" fill="#1e293b">Execution (tartib)</text>
    <text x="492" y="160" font-size="13" fill="#64748b">A B'dan oldin chaqirilishi shart</text>

    <rect x="480" y="174" width="320" height="50" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="492" y="196" font-size="13.5" font-weight="bold" fill="#1e293b">Timing (vaqt)</text>
    <text x="492" y="216" font-size="13" fill="#64748b">vaqtga bog'liqlik (race, timeout)</text>

    <rect x="480" y="230" width="320" height="50" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="492" y="252" font-size="13.5" font-weight="bold" fill="#1e293b">Value (qiymat)</text>
    <text x="492" y="272" font-size="13" fill="#64748b">bir nechta qiymat birga to'g'ri bo'lishi</text>

    <rect x="480" y="286" width="320" height="50" rx="6" fill="#fef2f2" stroke="#dc2626"/>
    <text x="492" y="308" font-size="13.5" font-weight="bold" fill="#991b1b">Identity (o'ziga xoslik)</text>
    <text x="492" y="328" font-size="13" fill="#64748b">aynan bir obyektga ishora (eng kuchli)</text>
  </g>

  <!-- Kuchni belgilovchi uch o'lcham -->
  <rect x="40" y="388" width="780" height="150" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="430" y="414" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Connascence kuchi = 3 o'lcham bilan baholanadi</text>

  <rect x="70" y="430" width="230" height="90" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="185" y="456" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Daraja (degree)</text>
  <text x="185" y="480" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">qancha element birga</text>
  <text x="185" y="498" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">o'zgarishi kerak</text>

  <rect x="315" y="430" width="230" height="90" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="430" y="456" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#166534" text-anchor="middle">Lokallik (locality)</text>
  <text x="430" y="480" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">yaqinmi (bir funksiya)</text>
  <text x="430" y="498" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">yoki uzoqmi (modullar)</text>

  <rect x="560" y="430" width="230" height="90" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="675" y="456" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">Ko'rinish (degree of</text>
  <text x="675" y="474" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">implicitness)</text>
  <text x="675" y="498" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">oshkormi yoki yashiringanmi</text>
</svg>
