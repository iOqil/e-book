<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440">
  <title>Decorator patterni: obyektni qatma-qat o'rab, har qatlam yangi mas'uliyat (cache, logging) qo'shadi</title>
  <rect x="0" y="0" width="760" height="440" fill="#f8fafc"/>
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b">Decorator — dinamik o'rash (qatma-qat mas'uliyat)</text>

  <!-- Tashqi qatlam: CacheDecorator -->
  <rect x="120" y="70" width="520" height="290" rx="12" fill="#fef9c3" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="96" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#92400e">CacheDecorator (natijani keshlaydi)</text>

  <!-- O'rta qatlam: LoggingDecorator -->
  <rect x="180" y="120" width="400" height="200" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="146" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#166534">LoggingDecorator (kirish/chiqishni yozadi)</text>

  <!-- Ichki: AsosiyServis -->
  <rect x="270" y="170" width="220" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="222" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">AsosiyServis</text>
  <text x="380" y="246" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">haqiqiy ish</text>
  <text x="380" y="266" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">bajar(sorov)</text>

  <!-- Kirish strelkasi -->
  <line x1="40" y1="215" x2="116" y2="215" stroke="#dc2626" stroke-width="2.5" marker-end="url(#dstrelka)"/>
  <text x="78" y="205" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">so'rov</text>

  <!-- Hammasi bir xil interfeys eslatmasi -->
  <text x="380" y="392" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">Har qatlam Servis interfeysini IMPLEMENTS qiladi -> tashqaridan barchasi bir xil ko'rinadi.</text>
  <text x="380" y="414" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Qatlamlarni xohlagancha qo'shasiz/almashtirasiz (OCP: yangi xulq = yangi o'ram, eski kod o'zgarmaydi).</text>

  <defs>
    <marker id="dstrelka" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
