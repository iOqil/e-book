<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <title>Hexagonal, Onion va Clean Architecture yonma-yon taqqoslash: uchalasida ham biznes mantiq markazda, infratuzilma chekkada va bog'liqlik markazga yo'naladi; faqat taqdimot shakli farq qiladi — olti burchak, konsentrik halqalar, konsentrik doiralar</title>

  <rect x="0" y="0" width="1000" height="620" fill="#f8fafc"/>

  <text x="500" y="38" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">Bitta g'oya, uch taqdimot: Hexagonal · Onion · Clean</text>
  <text x="500" y="62" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#64748b">Hammasida: biznes mantiq markazda · infratuzilma chekkada · bog'liqlik markazga (DIP)</text>

  <!-- ===================== 1) HEXAGONAL ===================== -->
  <text x="168" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">Hexagonal (port/adapter)</text>
  <text x="168" y="120" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">Alistair Cockburn, 2005</text>

  <!-- tashqi olti burchak (adapterlar) -->
  <polygon points="168,150 270,210 270,330 168,390 66,330 66,210" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="168" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">Adapterlar</text>
  <!-- ichki olti burchak (domen) -->
  <polygon points="168,232 214,259 214,313 168,340 122,313 122,259" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="168" y="288" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">Domen</text>
  <text x="168" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1d4ed8">+ port</text>

  <!-- port nuqtalari -->
  <circle cx="122" cy="259" r="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="214" cy="259" r="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="122" cy="313" r="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="214" cy="313" r="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>

  <text x="168" y="420" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">Adapterlar olti qirrada</text>
  <text x="168" y="438" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">portlarga ulanadi</text>

  <!-- ===================== 2) ONION ===================== -->
  <text x="500" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">Onion (qatlamli halqalar)</text>
  <text x="500" y="120" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">Jeffrey Palermo, 2008</text>

  <circle cx="500" cy="280" r="140" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="500" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">Infrastructure</text>

  <circle cx="500" cy="280" r="108" fill="#fef9c3" stroke="#f59e0b" stroke-width="2"/>
  <text x="500" y="192" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#d97706">Application Services</text>

  <circle cx="500" cy="280" r="76" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">Domain Services</text>

  <circle cx="500" cy="280" r="44" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="500" y="277" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">Domain</text>
  <text x="500" y="294" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">Model</text>

  <text x="500" y="442" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">Konsentrik halqalar</text>

  <!-- ===================== 3) CLEAN ===================== -->
  <text x="832" y="100" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#d97706">Clean (4 doira)</text>
  <text x="832" y="120" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">Robert C. Martin, 2012</text>

  <circle cx="832" cy="280" r="140" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="832" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">Frameworks &amp; Drivers</text>

  <circle cx="832" cy="280" r="108" fill="#fef9c3" stroke="#f59e0b" stroke-width="2"/>
  <text x="832" y="192" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#d97706">Interface Adapters</text>

  <circle cx="832" cy="280" r="76" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="832" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">Use Cases</text>

  <circle cx="832" cy="280" r="44" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="832" y="285" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">Entities</text>

  <text x="832" y="442" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">Konsentrik doiralar</text>

  <!-- ===================== Pastki taqqoslash jadvali ===================== -->
  <rect x="60" y="470" width="880" height="124" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="84" y="500" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Umumiy yadro (hammasida bir xil):</text>
  <text x="84" y="524" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">DIP: bog'liqlik markazga · biznes mantiq tashqi detaldan mustaqil · port/interfeys orqali izolyatsiya</text>

  <text x="84" y="554" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Farqi (faqat shakl va atama):</text>
  <text x="84" y="578" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">Hexagonal — port/adapter urg'usi · Onion — halqa qatlamlari nomi · Clean — use case/entity, "framework=detal"</text>
</svg>
