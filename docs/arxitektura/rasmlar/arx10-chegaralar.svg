<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470">
  <title>Modul chegarasi: tashqi kod faqat public API (index) orqali kiradi; internal qism yashirin va to'g'ridan ulanish taqiqlangan</title>
  <defs>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="820" height="470" fill="#f8fafc"/>
  <text x="410" y="34" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Modul chegarasi: public API va yashirin internal</text>

  <!-- external consumer -->
  <rect x="40" y="180" width="150" height="80" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="212" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">web/ moduli</text>
  <text x="115" y="234" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">(tashqi iste'molchi)</text>

  <!-- module boundary box -->
  <rect x="300" y="70" width="470" height="330" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="8 4"/>
  <text x="535" y="98" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">orders/ moduli (chegara)</text>

  <!-- public API gate -->
  <rect x="320" y="118" width="180" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="142" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">index.ts</text>
  <text x="410" y="162" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">PUBLIC API</text>
  <text x="410" y="176" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">OrderDTO, ordersModuleYarat()</text>

  <!-- internal items (hidden) -->
  <rect x="320" y="208" width="430" height="170" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="535" y="230" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#64748b" text-anchor="middle">internal/  (yashirin — tashqaridan ko'rinmaydi)</text>

  <rect x="340" y="244" width="170" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="425" y="271" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">OrderService</text>
  <rect x="540" y="244" width="190" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="635" y="271" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">OrderEntity</text>
  <rect x="340" y="304" width="170" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="425" y="331" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">OrderRepo (impl)</text>
  <rect x="540" y="304" width="190" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="635" y="331" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">XotiraOrderRepo</text>

  <!-- allowed arrow: web -> index (public) -->
  <line x1="190" y1="200" x2="316" y2="150" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="240" y="168" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a">RUXSAT: public API</text>

  <!-- forbidden arrow: web -> internal -->
  <line x1="190" y1="245" x2="334" y2="300" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <text x="205" y="290" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#dc2626">TAQIQ: internal'ga to'g'ridan</text>
  <text x="525" y="270" font-family="Segoe UI" font-size="40" fill="#dc2626" text-anchor="middle" opacity="0.18">&#128274;</text>

  <text x="410" y="430" font-family="Segoe UI" font-size="13" fill="#334155" text-anchor="middle">Modul faqat O'Z public API'sini ko'rsatadi (encapsulation). Tashqi kod internal tafsilotga bog'lanmaydi —</text>
  <text x="410" y="450" font-family="Segoe UI" font-size="13" fill="#64748b" text-anchor="middle">shu sabab ichkarini erkin refactoring qilish mumkin: chegara o'zgarishni "ushlab qoladi".</text>
</svg>
