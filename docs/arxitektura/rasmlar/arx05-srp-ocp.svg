<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" width="780" height="560">
  <title>SRP: aralashgan mas'uliyatni uch sinfga ajratish va OCP: yangi to'lov turini mavjud kodga tegmasdan qo'shish</title>

  <rect x="0" y="0" width="780" height="560" fill="#f8fafc"/>

  <!-- ===== SRP qismi ===== -->
  <text x="390" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">SRP — bitta sinf, bitta o'zgarish sababi</text>

  <!-- YOMON: god-class -->
  <text x="30" y="70" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">Yomon: bitta sinf 3 sababga o'zgaradi</text>
  <rect x="30" y="82" width="300" height="150" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="180" y="108" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#1e293b">HisobotXizmati</text>
  <line x1="46" y1="118" x2="314" y2="118" stroke="#dc2626" stroke-width="1"/>
  <text x="50" y="142" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">+ yarat()   &#8592; biznes o'zgarsa</text>
  <text x="50" y="168" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">+ htmlGa()  &#8592; dizayn o'zgarsa</text>
  <text x="50" y="194" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">+ saqla()   &#8592; ombor o'zgarsa</text>
  <text x="180" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">3 aktyor -> 3 o'zgarish sababi</text>

  <!-- o'q -->
  <text x="360" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="26" fill="#16a34a">&#8594;</text>
  <text x="360" y="182" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">ajrat</text>

  <!-- YAXSHI: 3 sinf -->
  <text x="400" y="70" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">Yaxshi: har sinf bitta sababga</text>
  <rect x="400" y="82" width="120" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="460" y="105" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#1e293b">Generatori</text>
  <text x="460" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">+ yarat()</text>

  <rect x="528" y="82" width="120" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="588" y="105" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#1e293b">Formatlovchi</text>
  <text x="588" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">+ htmlGa()</text>

  <rect x="464" y="160" width="120" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="524" y="183" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#1e293b">Saqlovchi</text>
  <text x="524" y="206" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">+ saqla()</text>

  <!-- ajratuvchi chiziq -->
  <line x1="30" y1="258" x2="750" y2="258" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- ===== OCP qismi ===== -->
  <text x="390" y="294" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">OCP — kengaytirishga ochiq, o'zgartirishga yopiq</text>

  <!-- Tolovchi yuqori daraja -->
  <rect x="310" y="316" width="160" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="390" y="340" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#1e293b">Tolovchi</text>
  <text x="390" y="361" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">bajar(usul, summa)</text>

  <!-- interfeys -->
  <rect x="300" y="404" width="180" height="46" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="390" y="424" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-style="italic" fill="#2563eb">&#171;interface&#187; TolovUsuli</text>
  <text x="390" y="442" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">tola(summa)</text>

  <!-- Tolovchi -> interfeys (bog'lanish) -->
  <line x1="390" y1="372" x2="390" y2="404" stroke="#2563eb" stroke-width="2" marker-end="url(#oarr)"/>

  <!-- implementatsiyalar -->
  <rect x="60" y="490" width="150" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="135" y="520" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">Karta</text>

  <rect x="240" y="490" width="150" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="315" y="520" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">Naqd</text>

  <rect x="420" y="490" width="150" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="495" y="520" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">Click (mavjud)</text>

  <!-- YANGI: Payme -->
  <rect x="600" y="490" width="150" height="50" rx="8" fill="#fef9c3" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="675" y="513" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#1e293b">Payme</text>
  <text x="675" y="531" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#d97706">YANGI qo'shildi</text>

  <!-- implement strelkalari (interfeysga) -->
  <line x1="135" y1="490" x2="340" y2="450" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#tarr)"/>
  <line x1="315" y1="490" x2="375" y2="450" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#tarr)"/>
  <line x1="495" y1="490" x2="420" y2="450" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#tarr)"/>
  <line x1="675" y1="490" x2="455" y2="450" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#tarrY)"/>

  <text x="390" y="478" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">hammasi TolovUsuli'ni bajaradi (implements)</text>

  <!-- markerlar -->
  <defs>
    <marker id="oarr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#2563eb"/>
    </marker>
    <marker id="tarr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#16a34a" stroke-width="1.5"/>
    </marker>
    <marker id="tarrY" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#f59e0b" stroke-width="2"/>
    </marker>
  </defs>
</svg>
