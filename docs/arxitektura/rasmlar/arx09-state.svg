<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430">
  <title>State pattern: buyurtma holatlar mashinasi va ruxsat etilgan o'tishlar</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>
  <text x="380" y="34" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">State: buyurtma holatlar mashinasi</text>
  <text x="380" y="58" font-family="Segoe UI" font-size="14" fill="#64748b" text-anchor="middle">Xulq holatga bog'liq — har holat faqat o'ziga RUXSAT etilgan o'tishni biladi</text>

  <defs>
    <marker id="st-ar" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#16a34a"/>
    </marker>
    <marker id="st-red" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Holatlar -->
  <rect x="50" y="150" width="130" height="60" rx="30" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="186" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">yangi</text>

  <rect x="270" y="150" width="130" height="60" rx="30" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="335" y="186" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#f59e0b" text-anchor="middle">tolangan</text>

  <rect x="490" y="150" width="130" height="60" rx="30" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="555" y="186" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">yuborilgan</text>

  <rect x="270" y="300" width="130" height="60" rx="30" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="335" y="336" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="middle">bekor</text>

  <!-- Ruxsat etilgan o'tishlar (yashil) -->
  <line x1="180" y1="180" x2="270" y2="180" stroke="#16a34a" stroke-width="2" marker-end="url(#st-ar)"/>
  <text x="225" y="170" font-family="Segoe UI" font-size="13" fill="#16a34a" text-anchor="middle">tola()</text>

  <line x1="400" y1="180" x2="490" y2="180" stroke="#16a34a" stroke-width="2" marker-end="url(#st-ar)"/>
  <text x="445" y="170" font-family="Segoe UI" font-size="13" fill="#16a34a" text-anchor="middle">yubor()</text>

  <line x1="115" y1="210" x2="290" y2="300" stroke="#16a34a" stroke-width="2" marker-end="url(#st-ar)"/>
  <text x="160" y="270" font-family="Segoe UI" font-size="13" fill="#16a34a">bekorQil()</text>

  <line x1="335" y1="210" x2="335" y2="300" stroke="#16a34a" stroke-width="2" marker-end="url(#st-ar)"/>
  <text x="345" y="258" font-family="Segoe UI" font-size="13" fill="#16a34a">bekorQil()</text>

  <!-- Taqiqlangan (qizil, uzuq) -->
  <line x1="555" y1="210" x2="400" y2="320" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#st-red)"/>
  <text x="500" y="290" font-family="Segoe UI" font-size="13" fill="#dc2626" text-anchor="middle">bekorQil() = XATO</text>

  <!-- Izoh paneli -->
  <rect x="50" y="375" width="660" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="64" y="402" font-family="Segoe UI" font-size="13" fill="#334155">Yashil = ruxsat etilgan o'tish. Qizil = taqiqlangan (holat sinfi xato qaytaradi). if/else daraxti o'rniga har holat — alohida sinf.</text>
</svg>
