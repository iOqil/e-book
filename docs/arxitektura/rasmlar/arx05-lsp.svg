<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" width="780" height="540">
  <title>LSP: Pingvin Qush'dan uch() metodini meros qilib olsa shartnoma buziladi; uchish qobiliyatini alohida Uchuvchi interfeysiga ajratish to'g'ri yechim</title>

  <rect x="0" y="0" width="780" height="540" fill="#f8fafc"/>

  <text x="390" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">LSP — pastki tip ota tipni buzmasdan almashtirsin</text>

  <!-- ===== YOMON ===== -->
  <rect x="20" y="56" width="350" height="430" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="195" y="82" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">Yomon: meros shartnomani buzadi</text>

  <!-- Qush bazasi (uch bor) -->
  <rect x="100" y="98" width="190" height="74" rx="8" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <text x="195" y="120" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#1e293b">Qush</text>
  <line x1="116" y1="128" x2="274" y2="128" stroke="#dc2626" stroke-width="1"/>
  <text x="195" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">+ ovqatlan()</text>
  <text x="195" y="166" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">+ uch()  &#8592; hamma uchadi deb taxmin</text>

  <!-- Chumchuq -->
  <rect x="40" y="232" width="140" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="110" y="256" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">Chumchuq</text>
  <text x="110" y="276" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">uch() ishlaydi</text>

  <!-- Pingvin -->
  <rect x="210" y="232" width="140" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="280" y="256" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">Pingvin</text>
  <text x="280" y="276" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">uch() ?!</text>

  <!-- meros strelkalari -->
  <line x1="110" y1="232" x2="170" y2="172" stroke="#64748b" stroke-width="1.5" marker-end="url(#harr)"/>
  <line x1="280" y1="232" x2="220" y2="172" stroke="#64748b" stroke-width="1.5" marker-end="url(#harr)"/>

  <!-- muammo qutisi -->
  <rect x="40" y="320" width="310" height="150" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="195" y="344" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">Pingvin uchun uch() nima qiladi?</text>
  <text x="56" y="370" font-family="Consolas, monospace" font-size="13" fill="#1e293b">A) throw Error()  &#8594; almashtirsa</text>
  <text x="76" y="388" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">qulaydi (LSP buzildi)</text>
  <text x="56" y="412" font-family="Consolas, monospace" font-size="13" fill="#1e293b">B) jim qoladi  &#8594; soxta natija,</text>
  <text x="76" y="430" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">"hech narsa qilmaydigan" metod</text>
  <text x="56" y="454" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626">Har ikkala variant ham shartnomani buzadi.</text>

  <!-- ===== YAXSHI ===== -->
  <rect x="410" y="56" width="350" height="430" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="585" y="82" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">Yaxshi: qobiliyatni ajrat</text>

  <!-- Qush (uch yo'q) -->
  <rect x="450" y="98" width="160" height="58" rx="8" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="530" y="120" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#1e293b">Qush</text>
  <line x1="466" y1="128" x2="594" y2="128" stroke="#16a34a" stroke-width="1"/>
  <text x="530" y="148" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">+ ovqatlan()</text>

  <!-- Uchuvchi interfeys -->
  <rect x="628" y="98" width="120" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="688" y="120" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-style="italic" fill="#2563eb">&#171;interface&#187;</text>
  <text x="688" y="138" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-style="italic" fill="#2563eb">Uchuvchi</text>
  <text x="688" y="151" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">uch()</text>

  <!-- Chumchuq -->
  <rect x="445" y="232" width="150" height="74" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="520" y="256" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">Chumchuq</text>
  <text x="520" y="276" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">: Qush, Uchuvchi</text>
  <text x="520" y="294" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">uch() bor</text>

  <!-- Pingvin -->
  <rect x="615" y="232" width="135" height="74" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="682" y="256" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">Pingvin</text>
  <text x="682" y="276" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">: Qush</text>
  <text x="682" y="294" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">uch() YO'Q, suz() bor</text>

  <!-- meros + implement -->
  <line x1="520" y1="232" x2="520" y2="156" stroke="#16a34a" stroke-width="1.5" marker-end="url(#harrG)"/>
  <line x1="560" y1="232" x2="650" y2="156" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#tarr2)"/>
  <line x1="682" y1="232" x2="560" y2="156" stroke="#16a34a" stroke-width="1.5" marker-end="url(#harrG)"/>

  <!-- xulosa -->
  <rect x="445" y="330" width="305" height="140" rx="8" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="597" y="354" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">Endi har bir tip shartnomasini bajaradi</text>
  <text x="461" y="380" font-family="Consolas, monospace" font-size="13" fill="#1e293b">boqamiz(qushlar: Qush[])</text>
  <text x="481" y="398" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">har Qush xavfsiz almashtiriladi</text>
  <text x="461" y="424" font-family="Consolas, monospace" font-size="13" fill="#1e293b">uchiramiz(u: Uchuvchi[])</text>
  <text x="481" y="442" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">Pingvin bu yerga UMUMAN o'tmaydi</text>
  <text x="481" y="460" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#16a34a">-> "uchmaydigan uchuvchi" muammosi yo'q</text>

  <defs>
    <marker id="harr" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
    <marker id="harrG" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#16a34a" stroke-width="1.5"/>
    </marker>
    <marker id="tarr2" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    </marker>
  </defs>
</svg>
