<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430">
  <title>SUT ni real DOC dan ajratib, uni dublyor bilan almashtirish</title>
  <rect x="0" y="0" width="820" height="430" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Tashqi bog'liqlikni dublyor bilan almashtirish</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Real DOC sekin va ishonchsiz — test paytida uni soxta nusxa egallaydi</text>

  <!-- Yuqori: real -->
  <text x="200" y="110" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">Realda (test emas)</text>
  <rect x="60" y="125" width="150" height="64" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="135" y="153" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">SUT</text>
  <text x="135" y="174" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">tekshirilayotgan kod</text>

  <line x1="210" y1="157" x2="300" y2="157" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="300,157 290,152 290,162" fill="#94a3b8"/>

  <rect x="300" y="125" width="180" height="64" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="390" y="150" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Real DOC</text>
  <text x="390" y="172" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">DB, tarmoq, to'lov...</text>

  <text x="630" y="148" font-family="Segoe UI" font-size="13" fill="#dc2626">sekin, yon-effektli,</text>
  <text x="630" y="167" font-family="Segoe UI" font-size="13" fill="#dc2626">ba'zan tushib qoladi</text>

  <!-- Pastki: test -->
  <text x="200" y="250" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">Testda</text>
  <rect x="60" y="265" width="150" height="64" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="135" y="293" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">SUT</text>
  <text x="135" y="314" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">o'zgarmaydi</text>

  <line x1="210" y1="297" x2="300" y2="297" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="300,297 290,292 290,302" fill="#94a3b8"/>

  <rect x="300" y="265" width="180" height="64" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="390" y="290" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Dublyor</text>
  <text x="390" y="312" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">stub / fake / mock...</text>

  <text x="630" y="290" font-family="Segoe UI" font-size="13" fill="#16a34a">tez, boshqariladigan,</text>
  <text x="630" y="309" font-family="Segoe UI" font-size="13" fill="#16a34a">takrorlanadigan</text>

  <text x="410" y="385" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#475569">SUT ayni o'sha interfeysni "ko'radi" — almashtirilganini bilmaydi</text>
</svg>
