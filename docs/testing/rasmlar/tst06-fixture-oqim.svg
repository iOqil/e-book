<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420">
  <title>Fixture oqimi: setup, yield orqali testga berish va keyin teardown</title>
  <rect x="0" y="0" width="820" height="420" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Fixture hayot sikli (yield bilan)</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">setup &#8594; testga qiymat &#8594; teardown (har test uchun qayta)</text>

  <!-- Setup -->
  <rect x="40" y="120" width="180" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="152" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#2563eb">Setup</text>
  <text x="130" y="176" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">fayl yarat,</text>
  <text x="130" y="194" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">obyekt tayyorla</text>

  <!-- arrow -->
  <line x1="220" y1="165" x2="300" y2="165" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="300,165 290,160 290,170" fill="#94a3b8"/>
  <text x="260" y="155" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#7c3aed">yield</text>

  <!-- Test -->
  <rect x="300" y="120" width="220" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="152" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">Test ishlaydi</text>
  <text x="410" y="176" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">Act + Assert</text>
  <text x="410" y="194" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">(qiymatni ishlatadi)</text>

  <!-- arrow -->
  <line x1="520" y1="165" x2="600" y2="165" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="600,165 590,160 590,170" fill="#94a3b8"/>

  <!-- Teardown -->
  <rect x="600" y="120" width="180" height="90" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="690" y="152" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#b45309">Teardown</text>
  <text x="690" y="176" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">tozalash:</text>
  <text x="690" y="194" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">fayl o'chir, ulanish yop</text>

  <!-- code lane -->
  <rect x="40" y="260" width="740" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60" y="290" font-family="Consolas, Segoe UI" font-size="14" fill="#64748b">@pytest.fixture</text>
  <text x="60" y="314" font-family="Consolas, Segoe UI" font-size="14" fill="#2563eb">def vaqtinchalik_fayl(tmp_path):</text>
  <text x="90" y="338" font-family="Consolas, Segoe UI" font-size="14" fill="#1e293b">fayl.write_text(...)   # setup</text>
  <text x="90" y="362" font-family="Consolas, Segoe UI" font-size="14" fill="#7c3aed">yield fayl              # testga beriladi</text>
  <text x="430" y="338" font-family="Consolas, Segoe UI" font-size="14" fill="#b45309"># yield dan keyin = teardown</text>
  <text x="430" y="362" font-family="Consolas, Segoe UI" font-size="14" fill="#16a34a"># test yiqilsa ham ishlaydi</text>
</svg>
