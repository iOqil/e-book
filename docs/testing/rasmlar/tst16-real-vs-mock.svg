<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460">
  <title>Real DB, in-memory va mock DB taqqoslash: realistiklik vs tezlik</title>
  <rect x="0" y="0" width="820" height="460" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">DB testlash: uch yondashuv</text>
  <text x="410" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Realistiklik oshgani sayin tezlik tushadi, ishonch ortadi</text>

  <!-- Real DB -->
  <rect x="40" y="110" width="220" height="270" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="150" y="148" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#16a34a">Real DB</text>
  <text x="150" y="172" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">PostgreSQL / MySQL</text>
  <text x="150" y="210" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">Realistiklik: yuqori</text>
  <text x="150" y="234" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">Ishonch: eng katta</text>
  <text x="150" y="258" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#dc2626">Tezlik: sekin</text>
  <text x="150" y="300" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">Cheklov, SQL, tip —</text>
  <text x="150" y="320" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">hammasi haqiqiy</text>
  <text x="150" y="356" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a">CI uchun ideal</text>

  <!-- In-memory -->
  <rect x="300" y="110" width="220" height="270" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="148" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#2563eb">In-memory</text>
  <text x="410" y="172" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">sqlite :memory:</text>
  <text x="410" y="210" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">Realistiklik: o'rta</text>
  <text x="410" y="234" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">Tezlik: juda tez</text>
  <text x="410" y="258" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#f59e0b">Lahja farqi bor</text>
  <text x="410" y="300" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">O'rnatishsiz, qulay</text>
  <text x="410" y="320" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">JSONB / massiv yo'q</text>
  <text x="410" y="356" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#2563eb">Tez fikr-mulohaza</text>

  <!-- Mock -->
  <rect x="560" y="110" width="220" height="270" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="670" y="148" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#dc2626">Mock DB</text>
  <text x="670" y="172" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">soxta obyekt</text>
  <text x="670" y="210" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#dc2626">Realistiklik: past</text>
  <text x="670" y="234" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">Tezlik: eng tez</text>
  <text x="670" y="258" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#dc2626">Ishonch: eng kam</text>
  <text x="670" y="300" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">Buzilgan SQL / JOIN /</text>
  <text x="670" y="320" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">cheklov ushlanmaydi</text>
  <text x="670" y="356" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#dc2626">Tavsiya etilmaydi</text>

  <text x="410" y="420" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Tavsiya: DB'ni mock qilmang — real yoki realga yaqin ishlating</text>
  <text x="410" y="444" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Ko'p loyiha ikkalasini birga: lokal in-memory + CI'da real DB</text>
</svg>
