  <text x="120" y="411" font-family="Segoe UI" font-size="14" fill="#1e293b">Manfiy son &#8594; xato (raises)</text>
  <rect x="560" y="392" width="40" height="26" rx="6" fill="#dc2626"/><text x="580" y="410" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#ffffff">RED</text>
  <text x="612" y="410" font-family="Segoe UI" font-size="14" fill="#64748b">&#8594;</text>
  <rect x="632" y="392" width="56" height="26" rx="6" fill="#16a34a"/><text x="660" y="410" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#ffffff">GREEN</text>

  <!-- 8 -->
  <circle cx="58" cy="450" r="16" fill="#2563eb"/>
  <text x="58" y="456" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#ffffff">8</text>
  <text x="120" y="456" font-family="Segoe UI" font-size="14" fill="#1e293b">1000 dan katta &#8594; e'tiborsiz</text>
  <rect x="560" y="437" width="40" height="26" rx="6" fill="#dc2626"/><text x="580" y="455" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#ffffff">RED</text>
  <text x="612" y="455" font-family="Segoe UI" font-size="14" fill="#64748b">&#8594;</text>
  <rect x="632" y="437" width="56" height="26" rx="6" fill="#16a34a"/><text x="660" y="455" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#ffffff">GREEN</text>

  <!-- 9 -->
  <circle cx="58" cy="495" r="16" fill="#7c3aed"/>
  <text x="58" y="501" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#ffffff">9</text>
  <text x="120" y="501" font-family="Segoe UI" font-size="14" fill="#1e293b">Barcha manfiylar xabarda</text>
  <rect x="560" y="482" width="40" height="26" rx="6" fill="#dc2626"/><text x="580" y="500" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#ffffff">RED</text>
  <text x="612" y="500" font-family="Segoe UI" font-size="14" fill="#64748b">&#8594;</text>
  <rect x="632" y="482" width="56" height="26" rx="6" fill="#16a34a"/><text x="660" y="500" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#ffffff">GREEN</text>

  <text x="410" y="540" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Oxirida REFACTOR: yordamchi funksiyalarga ajratamiz &#8212; 9 test yashil qoladi</text>
</svg>
