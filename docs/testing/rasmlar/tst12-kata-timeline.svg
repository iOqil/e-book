  <text x="120" y="276" font-family="Segoe UI" font-size="14" fill="#1e293b">Ko'p son, vergul bilan</text>
  <rect x="560" y="257" width="40" height="26" rx="6" fill="#dc2626"/><text x="580" y="275" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#ffffff">RED</text>
  <text x="612" y="275" font-family="Segoe UI" font-size="14" fill="#64748b">&#8594;</text>
