  <text x="120" y="321" font-family="Segoe UI" font-size="14" fill="#1e293b">Yangi qator ajratuvchi</text>
  <rect x="560" y="302" width="40" height="26" rx="6" fill="#dc2626"/><text x="580" y="320" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#ffffff">RED</text>
  <text x="612" y="320" font-family="Segoe UI" font-size="14" fill="#64748b">&#8594;</text>
  <rect x="632" y="302" width="56" height="26" rx="6" fill="#16a34a"/><text x="660" y="320" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#ffffff">GREEN</text>

