  <circle cx="58" cy="360" r="16" fill="#2563eb"/>
  <text x="58" y="366" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#ffffff">6</text>
  <text x="120" y="366" font-family="Segoe UI" font-size="14" fill="#1e293b">Maxsus ajratuvchi //;</text>
  <rect x="560" y="347" width="40" height="26" rx="6" fill="#dc2626"/><text x="580" y="365" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#ffffff">RED</text>
  <text x="612" y="365" font-family="Segoe UI" font-size="14" fill="#64748b">&#8594;</text>
  <rect x="632" y="347" width="56" height="26" rx="6" fill="#16a34a"/><text x="660" y="365" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#ffffff">GREEN</text>

  <!-- 7 -->
  <circle cx="58" cy="405" r="16" fill="#7c3aed"/>
