<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560">
  <title>String Calculator kata: 9 sikl, har biri Red keyin Green</title>
  <rect x="0" y="0" width="820" height="560" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Kata jadvali — har talab bitta Red-Green sikl</text>
  <text x="410" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">String Calculator: kichik qadamlar bilan oddiydan murakkabga</text>

  <!-- ustun sarlavhalari -->
  <text x="58" y="100" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#64748b">Sikl</text>
  <text x="300" y="100" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#64748b">Talab (yangi test)</text>
  <text x="640" y="100" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#64748b">RED &#8594; GREEN</text>

  <!-- 9 qator -->
  <!-- 1 -->
  <circle cx="58" cy="135" r="16" fill="#2563eb"/>
  <text x="58" y="141" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#ffffff">1</text>
  <text x="120" y="141" font-family="Segoe UI" font-size="14" fill="#1e293b">Bo'sh satr &#8594; 0</text>
  <rect x="560" y="122" width="40" height="26" rx="6" fill="#dc2626"/><text x="580" y="140" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#ffffff">RED</text>
  <text x="612" y="140" font-family="Segoe UI" font-size="14" fill="#64748b">&#8594;</text>
  <rect x="632" y="122" width="56" height="26" rx="6" fill="#16a34a"/><text x="660" y="140" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#ffffff">GREEN</text>

  <!-- 2 -->
  <circle cx="58" cy="180" r="16" fill="#2563eb"/>
  <text x="58" y="186" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#ffffff">2</text>
  <text x="120" y="186" font-family="Segoe UI" font-size="14" fill="#1e293b">Bitta son &#8594; o'zi</text>
  <rect x="560" y="167" width="40" height="26" rx="6" fill="#dc2626"/><text x="580" y="185" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#ffffff">RED</text>
  <text x="612" y="185" font-family="Segoe UI" font-size="14" fill="#64748b">&#8594;</text>
  <rect x="632" y="167" width="56" height="26" rx="6" fill="#16a34a"/><text x="660" y="185" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#ffffff">GREEN</text>

  <!-- 3 -->
  <circle cx="58" cy="225" r="16" fill="#2563eb"/>
  <text x="58" y="231" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#ffffff">3</text>
  <text x="120" y="231" font-family="Segoe UI" font-size="14" fill="#1e293b">Ikki son, vergul bilan</text>
  <rect x="560" y="212" width="40" height="26" rx="6" fill="#dc2626"/><text x="580" y="230" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#ffffff">RED</text>
  <text x="612" y="230" font-family="Segoe UI" font-size="14" fill="#64748b">&#8594;</text>
  <rect x="632" y="212" width="56" height="26" rx="6" fill="#16a34a"/><text x="660" y="230" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#ffffff">GREEN</text>

  <!-- 4 -->
