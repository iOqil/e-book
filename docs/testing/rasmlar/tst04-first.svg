<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470">
  <title>FIRST tamoyillari: Fast, Isolated, Repeatable, Self-validating, Timely</title>
  <rect x="0" y="0" width="840" height="470" fill="#f8fafc"/>
  <text x="420" y="42" text-anchor="middle" font-family="Segoe UI" font-size="24" font-weight="bold" fill="#1e293b">FIRST — yaxshi testning 5 xossasi</text>
  <text x="420" y="70" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#64748b">Har harf bitta tamoyilni anglatadi</text>

  <!-- F -->
  <rect x="30" y="100" width="148" height="320" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="104" y="158" text-anchor="middle" font-family="Segoe UI" font-size="58" font-weight="bold" fill="#2563eb">F</text>
  <text x="104" y="196" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#1e293b">Fast</text>
  <text x="104" y="222" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Tez</text>
  <text x="104" y="262" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">Millisekundlarda</text>
  <text x="104" y="282" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">ishlasin —</text>
  <text x="104" y="302" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">tez-tez ishga</text>
  <text x="104" y="322" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">tushiriladi</text>

  <!-- I -->
  <rect x="190" y="100" width="148" height="320" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="264" y="158" text-anchor="middle" font-family="Segoe UI" font-size="58" font-weight="bold" fill="#16a34a">I</text>
  <text x="264" y="196" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#1e293b">Isolated</text>
  <text x="264" y="222" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Mustaqil</text>
  <text x="264" y="262" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">Bir-biriga</text>
  <text x="264" y="282" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">bog'liq emas;</text>
  <text x="264" y="302" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">tartibdan qat'i</text>
  <text x="264" y="322" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">nazar ishlaydi</text>

  <!-- R -->
  <rect x="350" y="100" width="148" height="320" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="424" y="158" text-anchor="middle" font-family="Segoe UI" font-size="58" font-weight="bold" fill="#7c3aed">R</text>
  <text x="424" y="196" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#1e293b">Repeatable</text>
  <text x="424" y="222" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Takrorlanuvchan</text>
  <text x="424" y="262" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">Har safar</text>
  <text x="424" y="282" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">bir xil natija;</text>
  <text x="424" y="302" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">vaqt/tasodifga</text>
  <text x="424" y="322" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">bog'liq emas</text>

  <!-- S -->
  <rect x="510" y="100" width="148" height="320" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="584" y="158" text-anchor="middle" font-family="Segoe UI" font-size="58" font-weight="bold" fill="#f59e0b">S</text>
  <text x="584" y="196" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#1e293b">Self-</text>
  <text x="584" y="218" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#1e293b">validating</text>
  <text x="584" y="242" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">O'zini tekshiradi</text>
  <text x="584" y="278" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">PASS/FAIL aniq;</text>
  <text x="584" y="298" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">qo'lda ko'z bilan</text>
  <text x="584" y="318" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">tekshirish kerak emas</text>

  <!-- T -->
  <rect x="670" y="100" width="148" height="320" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="744" y="158" text-anchor="middle" font-family="Segoe UI" font-size="58" font-weight="bold" fill="#dc2626">T</text>
  <text x="744" y="196" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#1e293b">Timely</text>
  <text x="744" y="222" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">O'z vaqtida</text>
  <text x="744" y="262" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">Kod bilan</text>
  <text x="744" y="282" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">birga yoziladi,</text>
  <text x="744" y="302" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">oylar keyin</text>
  <text x="744" y="322" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">emas</text>

  <text x="420" y="452" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#94a3b8">FIRST = Fast · Isolated · Repeatable · Self-validating · Timely</text>
</svg>
