<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420">
  <title>Consumer va provider o'rtasidagi kontrakt (shartnoma o'rtada)</title>
  <rect x="0" y="0" width="820" height="420" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Kontrakt = ikki tomon o'rtasidagi shartnoma</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Har tomon kontraktga qarshi MUSTAQIL testlanadi — to'liq E2E'siz</text>

  <!-- Consumer -->
  <rect x="50" y="150" width="220" height="130" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="185" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#1e293b">Consumer</text>
  <text x="160" y="208" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">(iste'molchi)</text>
  <text x="160" y="236" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">"Menga shu shaklda</text>
  <text x="160" y="256" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">javob kerak"</text>

  <!-- Contract in middle -->
  <rect x="320" y="140" width="180" height="150" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="410" y="172" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#1e293b">KONTRAKT</text>
  <text x="410" y="200" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">GET /narx/{id}</text>
  <text x="410" y="224" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">javob shakli:</text>
  <text x="410" y="246" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">id: int</text>
  <text x="410" y="266" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">narx: int</text>

  <!-- Provider -->
  <rect x="550" y="150" width="220" height="130" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="185" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#1e293b">Provider</text>
  <text x="660" y="208" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">(ta'minotchi)</text>
  <text x="660" y="236" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">"Men shu shaklga</text>
  <text x="660" y="256" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">rioya qilaman"</text>

  <!-- Arrows -->
  <line x1="270" y1="215" x2="318" y2="215" stroke="#94a3b8" stroke-width="2" marker-end="url(#ok)"/>
  <line x1="550" y1="215" x2="502" y2="215" stroke="#94a3b8" stroke-width="2" marker-end="url(#ok)"/>

  <text x="295" y="135" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">e'lon qiladi</text>
  <text x="525" y="135" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">tasdiqlaydi</text>

  <text x="410" y="345" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">Kontrakt = yagona haqiqat manbai. Provider buzsa -> provider testi yiqiladi.</text>
  <text x="410" y="372" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Tez + ishonchli moslik tekshiruvi (biznes mantiqni emas, SHAKLNI tekshiradi)</text>

  <defs>
    <marker id="ok" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
