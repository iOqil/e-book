<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470">
  <title>AAA naqsh: Arrange-Act-Assert uch bosqichi</title>
  <rect x="0" y="0" width="820" height="470" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">AAA naqsh — bir test, uch bosqich</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Har bir testni o'qish oson bo'lishi uchun uchga bo'ling</text>

  <!-- Arrange -->
  <rect x="40" y="100" width="740" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="80" cy="150" r="20" fill="#2563eb"/>
  <text x="80" y="157" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#ffffff">1</text>
  <text x="120" y="138" font-family="Segoe UI" font-size="19" font-weight="bold" fill="#1e293b">Arrange — tayyorla</text>
  <text x="120" y="165" font-family="Segoe UI" font-size="14" fill="#475569">Obyekt, ma'lumot va boshlang'ich holatni tayyorlaymiz</text>
  <text x="120" y="186" font-family="Segoe UI" font-size="13" fill="#64748b">savat = Savat(); savat.qoshish("non", 5000)</text>

  <!-- Act -->
  <rect x="40" y="218" width="740" height="100" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <circle cx="80" cy="268" r="20" fill="#16a34a"/>
  <text x="80" y="275" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#ffffff">2</text>
  <text x="120" y="256" font-family="Segoe UI" font-size="19" font-weight="bold" fill="#1e293b">Act — bajar</text>
  <text x="120" y="283" font-family="Segoe UI" font-size="14" fill="#475569">Tekshirilayotgan bitta amalni ishga tushiramiz</text>
  <text x="120" y="304" font-family="Segoe UI" font-size="13" fill="#64748b">jami = savat.jami()</text>

  <!-- Assert -->
  <rect x="40" y="336" width="740" height="100" rx="12" fill="#fef9f3" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="80" cy="386" r="20" fill="#f59e0b"/>
  <text x="80" y="393" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#ffffff">3</text>
  <text x="120" y="374" font-family="Segoe UI" font-size="19" font-weight="bold" fill="#1e293b">Assert — tekshir</text>
  <text x="120" y="401" font-family="Segoe UI" font-size="14" fill="#475569">Natija kutilgan qiymatga mosligini tasdiqlaymiz</text>
  <text x="120" y="422" font-family="Segoe UI" font-size="13" fill="#64748b">assert jami == 17000</text>
</svg>
