<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460">
  <title>Ikki nuqtai nazar: server tomoni vs mijoz tomoni testlash</title>
  <rect x="0" y="0" width="820" height="460" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">API testlashning ikki yo'nalishi</text>
  <text x="410" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Kim API'ni yozgan? Bu testni butunlay o'zgartiradi</text>

  <!-- Server side panel -->
  <rect x="40" y="95" width="340" height="320" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="210" y="124" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#2563eb">SERVER tomoni</text>
  <text x="210" y="146" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">API'ni SIZ yozasiz</text>

  <rect x="70" y="166" width="120" height="56" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="130" y="190" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a">Test mijozi</text>
  <text x="130" y="208" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">TestClient</text>

  <line x1="192" y1="194" x2="256" y2="194" stroke="#2563eb" stroke-width="3"/>
  <polygon points="256,194 246,188 246,200" fill="#2563eb"/>

  <rect x="258" y="166" width="92" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="304" y="190" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#2563eb">Sizning</text>
  <text x="304" y="208" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">API'ingiz</text>

  <text x="210" y="256" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">Savol: endpoint to'g'ri</text>
  <text x="210" y="274" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">javob beradimi?</text>
  <text x="210" y="300" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">Tekshiramiz: 200 / 401 / 404 / 422</text>
  <text x="210" y="320" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">+ JSON body sxemasi</text>
  <rect x="70" y="344" width="280" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="210" y="364" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#92400e">Real port ochilmaydi —</text>
  <text x="210" y="382" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#92400e">ilova xotirada ishlaydi</text>

  <!-- Client side panel -->
  <rect x="440" y="95" width="340" height="320" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="610" y="124" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#7c3aed">MIJOZ tomoni</text>
  <text x="610" y="146" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">API'ni BOSHQA kim'dir yozgan</text>

  <rect x="470" y="166" width="120" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="530" y="190" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#2563eb">Sizning</text>
  <text x="530" y="208" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">kodingiz</text>

  <line x1="592" y1="194" x2="656" y2="194" stroke="#7c3aed" stroke-width="3"/>
  <polygon points="656,194 646,188 646,200" fill="#7c3aed"/>

  <rect x="658" y="166" width="92" height="56" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="704" y="190" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#7c3aed">Tashqi</text>
  <text x="704" y="208" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">API (mock)</text>

  <text x="610" y="256" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">Savol: tashqi API'ga bog'liq</text>
  <text x="610" y="274" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">kod ishonchli ishlaydimi?</text>
  <text x="610" y="300" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#7c3aed">Soxtalashtiramiz: 200 / 500 /</text>
  <text x="610" y="320" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#7c3aed">timeout / buzuq JSON</text>
  <rect x="470" y="344" width="280" height="48" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="610" y="364" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#991b1b">Real tarmoq kesiladi —</text>
  <text x="610" y="382" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#991b1b">javobni responses beradi</text>

  <text x="410" y="440" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Ikkalasida ham real tarmoqqa CHIQMAYMIZ</text>
</svg>
