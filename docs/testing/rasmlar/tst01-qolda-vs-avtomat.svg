<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470">
  <title>Qo'lda testlash va avtomatlashtirilgan testlash taqqoslashi</title>
  <rect x="0" y="0" width="820" height="470" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Qo'lda vs avtomatlashtirilgan testlash</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Har biri o'z o'rnida kerak — bir-birini almashtirmaydi</text>

  <!-- chap panel: qo'lda -->
  <rect x="50" y="95" width="340" height="320" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="220" y="130" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#b45309">Qo'lda (manual)</text>

  <text x="75" y="172" font-family="Segoe UI" font-size="14" fill="#dc2626">✗ Sekin va zerikarli</text>
  <text x="75" y="202" font-family="Segoe UI" font-size="14" fill="#dc2626">✗ Takror — odam charchaydi</text>
  <text x="75" y="232" font-family="Segoe UI" font-size="14" fill="#dc2626">✗ Xatoni o'tkazib yuboradi</text>
  <text x="75" y="262" font-family="Segoe UI" font-size="14" fill="#16a34a">✓ Yangi, kutilmagan holatni</text>
  <text x="90" y="282" font-family="Segoe UI" font-size="14" fill="#16a34a">topadi (exploratory)</text>
  <text x="75" y="312" font-family="Segoe UI" font-size="14" fill="#16a34a">✓ UX/dizayn hissini beradi</text>
  <text x="75" y="342" font-family="Segoe UI" font-size="14" fill="#16a34a">✓ Sozlash shart emas</text>
  <text x="220" y="392" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Qachon: yangilikni o'rganish</text>

  <!-- o'ng panel: avtomat -->
  <rect x="430" y="95" width="340" height="320" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="600" y="130" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#2563eb">Avtomat (kod)</text>

  <text x="455" y="172" font-family="Segoe UI" font-size="14" fill="#16a34a">✓ Soniyalarda yuzlab tekshiruv</text>
  <text x="455" y="202" font-family="Segoe UI" font-size="14" fill="#16a34a">✓ Cheksiz takror, charchamaydi</text>
  <text x="455" y="232" font-family="Segoe UI" font-size="14" fill="#16a34a">✓ Aniq, takrorlanuvchan</text>
  <text x="455" y="262" font-family="Segoe UI" font-size="14" fill="#16a34a">✓ Regressiyani tutadi</text>
  <text x="455" y="292" font-family="Segoe UI" font-size="14" fill="#16a34a">✓ CI'da har commit'da ishlaydi</text>
  <text x="455" y="322" font-family="Segoe UI" font-size="14" fill="#dc2626">✗ Yozishga boshda vaqt ketadi</text>
  <text x="455" y="342" font-family="Segoe UI" font-size="14" fill="#dc2626">✗ Faqat siz yozgan holatni biladi</text>
  <text x="600" y="392" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Qachon: takroriy, regressiya</text>
</svg>
