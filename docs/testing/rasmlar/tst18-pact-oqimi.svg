<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440">
  <title>Pact ish oqimi: consumer pact generatsiya qiladi, broker saqlaydi, provider verifikatsiya qiladi</title>
  <rect x="0" y="0" width="820" height="440" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Consumer-Driven Contract (Pact) oqimi</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Consumer kutgan shaklni e'lon qiladi -> provider unga mos kelishini tekshiradi</text>

  <!-- Step 1: consumer test -->
  <rect x="40" y="120" width="200" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="150" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">1. Consumer testi</text>
  <text x="140" y="178" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">stub provider bilan</text>
  <text x="140" y="198" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">o'tadi (PASS)</text>
  <text x="140" y="222" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">-> pact fayl yozadi</text>

  <!-- Step 2: pact file / broker -->
  <rect x="310" y="120" width="200" height="120" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="410" y="150" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">2. Pact broker</text>
  <text x="410" y="178" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">pact.json saqlanadi</text>
  <text x="410" y="198" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">(so'rov + javob shakli,</text>
  <text x="410" y="218" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">versiyalangan)</text>

  <!-- Step 3: provider verify -->
  <rect x="580" y="120" width="200" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="680" y="150" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">3. Provider verify</text>
  <text x="680" y="178" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">pact'ni o'qib, real</text>
  <text x="680" y="198" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">servisga qarshi</text>
  <text x="680" y="218" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">tekshiradi (PASS/FAIL)</text>

  <!-- arrows -->
  <line x1="240" y1="180" x2="308" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="510" y1="180" x2="578" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- result band -->
  <rect x="40" y="300" width="740" height="100" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="410" y="332" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Agar provider javob shaklini o'zgartirsa (narx -> price):</text>
  <text x="410" y="360" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#dc2626">3-qadam YIQILADI — buzilish ishlab chiqarishga yetib bormaydi</text>
  <text x="410" y="386" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Consumer va provider hech qachon birga ishga tushmadi, lekin moslik kafolatlandi</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
