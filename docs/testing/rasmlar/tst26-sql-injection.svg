<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500">
  <title>SQL injection: zaif kod foydalanuvchi kiritgan matnni so'rovga to'g'ridan-to'g'ri ulaydi va hujum kodga aylanadi, parametrli so'rov esa kirishni ma'lumot sifatida uzatib hujumni bloklaydi</title>
  <rect x="0" y="0" width="860" height="500" fill="#f8fafc"/>
  <text x="430" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">SQL injection: zaif vs himoyalangan</text>
  <text x="430" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Hujum kirishi: ' OR '1'='1</text>

  <!-- Left: vulnerable (concatenation) -->
  <rect x="40" y="96" width="380" height="360" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="230" y="128" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#991b1b">ZAIF: matnni ulash (concat)</text>

  <rect x="62" y="148" width="336" height="64" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="78" y="172" font-family="Consolas, monospace" font-size="13" fill="#991b1b">"... WHERE login = '" + kirish</text>
  <text x="78" y="194" font-family="Consolas, monospace" font-size="13" fill="#64748b">kirish kod bilan ARALASHADI</text>

  <text x="230" y="234" text-anchor="middle" font-family="Segoe UI" font-size="20" fill="#dc2626">&#8595;</text>

  <rect x="62" y="246" width="336" height="74" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="78" y="270" font-family="Consolas, monospace" font-size="13" fill="#991b1b">WHERE login = '' OR '1'='1'</text>
  <text x="78" y="292" font-family="Segoe UI" font-size="13" fill="#991b1b">'1'='1' har doim ROST</text>
  <text x="78" y="311" font-family="Segoe UI" font-size="13" fill="#991b1b">-&gt; barcha qatorlar oqib chiqadi</text>

  <rect x="62" y="346" width="336" height="86" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <text x="230" y="374" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#991b1b">Natija: butun jadval oqdi</text>
  <text x="230" y="397" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#991b1b">[ali, ADMIN] ham ko'rindi</text>
  <text x="230" y="419" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">MA'LUMOT OQDI</text>

  <!-- Right: protected (parameterized) -->
  <rect x="440" y="96" width="380" height="360" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="630" y="128" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#166534">HIMOYALANGAN: parametrli (?)</text>

  <rect x="462" y="148" width="336" height="64" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="478" y="172" font-family="Consolas, monospace" font-size="13" fill="#166534">"... WHERE login = ?", (kirish,)</text>
  <text x="478" y="194" font-family="Consolas, monospace" font-size="13" fill="#64748b">kirish AYRIM uzatiladi</text>

  <text x="630" y="234" text-anchor="middle" font-family="Segoe UI" font-size="20" fill="#16a34a">&#8595;</text>

  <rect x="462" y="246" width="336" height="74" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="478" y="270" font-family="Segoe UI" font-size="13" fill="#166534">Baza kirishni MA'LUMOT deb biladi</text>
  <text x="478" y="292" font-family="Segoe UI" font-size="13" fill="#166534">"' OR '1'='1" = oddiy login matni</text>
  <text x="478" y="311" font-family="Segoe UI" font-size="13" fill="#166534">-&gt; bunday login yo'q</text>

  <rect x="462" y="346" width="336" height="86" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="630" y="374" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#166534">Natija: bo'sh ro'yxat []</text>
  <text x="630" y="397" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">Hujum kod bo'la olmadi</text>
  <text x="630" y="419" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">HUJUM BLOKLANDI</text>

  <text x="430" y="484" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Qoida: foydalanuvchi kirishini hech qachon kodga ulamang — har doim parametr sifatida uzating</text>
</svg>
