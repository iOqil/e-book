<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440">
  <title>responses tarmoqni kesadi va mock javob qaytaradi</title>
  <rect x="0" y="0" width="820" height="440" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">responses: real tarmoq o'rniga mock javob</text>
  <text x="410" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">requests.get to'xtatiladi — internetga chiqmaydi</text>

  <!-- Test code -->
  <rect x="40" y="110" width="180" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="150" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">Sinaladigan kod</text>
  <text x="130" y="174" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">obhavo_olish()</text>
  <text x="130" y="192" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">requests.get(...)</text>

  <!-- responses interceptor -->
  <rect x="320" y="100" width="180" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="132" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">responses</text>
  <text x="410" y="154" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">@responses.activate</text>
  <text x="410" y="176" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">ushlaydi va</text>
  <text x="410" y="194" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">soxta javob beradi</text>

  <!-- Real network, cut -->
  <rect x="600" y="110" width="180" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="690" y="150" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">Real internet</text>
  <text x="690" y="174" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#991b1b">api.obhavo.example</text>
  <text x="690" y="192" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#991b1b">CHAQIRILMAYDI</text>

  <!-- arrow code -> responses -->
  <line x1="222" y1="160" x2="316" y2="160" stroke="#2563eb" stroke-width="3"/>
  <polygon points="316,160 306,154 306,166" fill="#2563eb"/>
  <!-- responses -> code (return) -->
  <line x1="410" y1="222" x2="130" y2="222" stroke="#16a34a" stroke-width="3"/>
  <line x1="410" y1="220" x2="410" y2="222" stroke="#16a34a" stroke-width="3"/>
  <polygon points="130,222 140,216 140,228" fill="#16a34a"/>
  <text x="270" y="240" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">mock javob qaytadi</text>

  <!-- cut arrow responses -> real (blocked) -->
  <line x1="502" y1="160" x2="596" y2="160" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 4"/>
  <line x1="540" y1="142" x2="560" y2="178" stroke="#dc2626" stroke-width="4"/>
  <line x1="560" y1="142" x2="540" y2="178" stroke="#dc2626" stroke-width="4"/>
  <text x="551" y="200" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#dc2626">kesildi</text>

  <!-- responses.add examples -->
  <rect x="120" y="280" width="580" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="410" y="306" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Bitta URL — har xil javoblarni soxtalashtiramiz</text>
  <text x="150" y="334" font-family="Segoe UI" font-size="13" fill="#16a34a">responses.add(GET, URL, json={...}, status=200)</text>
  <text x="150" y="356" font-family="Segoe UI" font-size="13" fill="#dc2626">responses.add(GET, URL, status=500)</text>
  <text x="150" y="378" font-family="Segoe UI" font-size="13" fill="#f59e0b">responses.add(GET, URL, body=ConnectTimeout())</text>
</svg>
