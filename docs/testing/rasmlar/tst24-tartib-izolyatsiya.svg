<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500">
  <title>Tartibga bog'liq yiqilish: umumiy holatda testlar tartibga qarab goh PASS goh FAIL bo'ladi; har testga toza fixture berib izolyatsiya qilingach esa tartibdan qat'i nazar har doim PASS bo'ladi</title>
  <rect x="0" y="0" width="820" height="500" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Tartibga bog'liq yiqilish -&gt; izolyatsiya</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Umumiy holat = yashirin bog'liqlik; toza fixture buni uzadi</text>

  <!-- OLDIN: umumiy holat -->
  <rect x="40" y="96" width="340" height="370" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="210" y="124" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#991b1b">Oldin — umumiy savat = []</text>

  <text x="210" y="152" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#64748b">Tabiiy tartib</text>
  <rect x="64" y="164" width="292" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="80" y="189" font-family="Segoe UI" font-size="13" fill="#1e293b">1) qo'shish  ('non' qoldi)</text>
  <text x="340" y="189" text-anchor="end" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a">PASS</text>
  <rect x="64" y="210" width="292" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="80" y="235" font-family="Segoe UI" font-size="13" fill="#1e293b">2) bo'sh deb kutadi</text>
  <text x="340" y="235" text-anchor="end" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#dc2626">FAIL</text>

  <text x="210" y="284" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#64748b">Teskari tartib</text>
  <rect x="64" y="296" width="292" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="80" y="321" font-family="Segoe UI" font-size="13" fill="#1e293b">2) bo'sh deb kutadi</text>
  <text x="340" y="321" text-anchor="end" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a">PASS</text>
  <rect x="64" y="342" width="292" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="80" y="367" font-family="Segoe UI" font-size="13" fill="#1e293b">1) qo'shish</text>
  <text x="340" y="367" text-anchor="end" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a">PASS</text>

  <text x="210" y="416" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#991b1b">Tartib o'zgarsa natija o'zgaradi</text>
  <text x="210" y="440" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#991b1b">Jonli: tabiiy = 1 failed; teskari = 2 passed</text>

  <!-- Strelka -->
  <text x="410" y="270" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#2563eb">fixture</text>
  <line x1="388" y1="285" x2="432" y2="285" stroke="#2563eb" stroke-width="3"/>
  <polygon points="438,285 424,278 424,292" fill="#2563eb"/>

  <!-- KEYIN: izolyatsiya -->
  <rect x="460" y="96" width="320" height="370" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="124" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#166534">Keyin — har testga yangi savat</text>

  <text x="620" y="152" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#64748b">Tabiiy tartib</text>
  <rect x="484" y="164" width="272" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="504" y="189" font-family="Segoe UI" font-size="13" fill="#166534">1) qo'shish (o'z savati)</text>
  <text x="740" y="189" text-anchor="end" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a">PASS</text>
  <rect x="484" y="210" width="272" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="504" y="235" font-family="Segoe UI" font-size="13" fill="#166534">2) bo'sh (toza savat)</text>
  <text x="740" y="235" text-anchor="end" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a">PASS</text>

  <text x="620" y="284" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#64748b">Teskari tartib</text>
  <rect x="484" y="296" width="272" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="504" y="321" font-family="Segoe UI" font-size="13" fill="#166534">2) bo'sh (toza savat)</text>
  <text x="740" y="321" text-anchor="end" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a">PASS</text>
  <rect x="484" y="342" width="272" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="504" y="367" font-family="Segoe UI" font-size="13" fill="#166534">1) qo'shish (o'z savati)</text>
  <text x="740" y="367" text-anchor="end" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a">PASS</text>

  <text x="620" y="416" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#166534">Tartibdan mustaqil = barqaror</text>
  <text x="620" y="440" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">Jonli: har ikki tartib = 2 passed</text>
</svg>
