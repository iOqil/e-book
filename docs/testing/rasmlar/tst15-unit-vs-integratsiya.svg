<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470">
  <title>Unit test yakka modulni mock chegarasida tekshiradi, integratsiya testi esa bir nechta modulni real birga ishlaganda tekshiradi</title>
  <rect x="0" y="0" width="820" height="470" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Unit vs Integratsiya</text>
  <text x="410" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Yakka modul (mock chegara) yoki bir nechta modul (real birga)</text>

  <!-- UNIT -->
  <rect x="40" y="98" width="340" height="330" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="210" y="128" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e40af">Unit test</text>
  <text x="210" y="150" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">faqat Xizmat, qo'shnilar mock</text>

  <rect x="120" y="172" width="180" height="60" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="210" y="208" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">BuyurtmaXizmati</text>

  <rect x="75" y="300" width="120" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="135" y="325" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#64748b">Ombor</text>
  <text x="135" y="344" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">mock</text>
  <rect x="225" y="300" width="120" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="285" y="325" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#64748b">Hisobchi</text>
  <text x="285" y="344" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">mock</text>
  <line x1="180" y1="300" x2="200" y2="234" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="285" y1="300" x2="232" y2="234" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="210" y="392" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e40af">Tez · izolyatsiya</text>
  <text x="210" y="412" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">birga ishlashni tekshirmaydi</text>

  <!-- INTEGRATSIYA -->
  <rect x="440" y="98" width="340" height="330" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="610" y="128" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#166534">Integratsiya testi</text>
  <text x="610" y="150" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">uch modul real birga ishlaydi</text>

  <rect x="520" y="172" width="180" height="56" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="610" y="206" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">BuyurtmaXizmati</text>

  <rect x="475" y="296" width="120" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="535" y="321" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#166534">Ombor</text>
  <text x="535" y="340" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">real sqlite</text>
  <rect x="625" y="296" width="120" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="685" y="321" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#166534">Hisobchi</text>
  <text x="685" y="340" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">real</text>
  <line x1="580" y1="296" x2="600" y2="230" stroke="#16a34a" stroke-width="2"/>
  <line x1="685" y1="296" x2="632" y2="230" stroke="#16a34a" stroke-width="2"/>
  <text x="610" y="392" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#166534">Realroq ishonch</text>
  <text x="610" y="412" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">sekinroq · sozlash murakkabroq</text>

  <text x="410" y="454" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Mock yashirgan haqiqat (SQL, sxema, kontrakt) — integratsiyada ochiladi</text>
</svg>
