<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360">
  <title>Ekvivalentlik sinflari: yosh o'qi to'rt sinfga bo'linadi, har biridan bitta vakil tanlanadi</title>
  <rect x="0" y="0" width="820" height="360" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Ekvivalentlik sinflari</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">chegirma(yosh): bir xil ishlov ko'radigan guruhlar, har biridan bitta vakil</text>

  <!-- input axis -->
  <line x1="60" y1="150" x2="760" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="760,150 750,144 750,156" fill="#94a3b8"/>
  <text x="770" y="154" text-anchor="start" font-family="Segoe UI" font-size="13" fill="#64748b">yosh</text>

  <!-- class 1: error -->
  <rect x="60" y="170" width="150" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="135" y="196" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">yosh &lt; 0</text>
  <text x="135" y="218" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">xato (ValueError)</text>

  <!-- class 2: 0% -->
  <rect x="220" y="170" width="150" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="295" y="196" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">0 .. 17</text>
  <text x="295" y="218" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">chegirma yo'q (0%)</text>

  <!-- class 3: 10% -->
  <rect x="380" y="170" width="150" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="455" y="196" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">18 .. 64</text>
  <text x="455" y="218" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">10% chegirma</text>

  <!-- class 4: 20% -->
  <rect x="540" y="170" width="150" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="615" y="196" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">65 va undan katta</text>
  <text x="615" y="218" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">20% chegirma</text>

  <!-- representatives -->
  <text x="410" y="280" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Har sinfdan bitta vakil yetarli:</text>
  <circle cx="135" cy="310" r="20" fill="#dc2626"/>
  <text x="135" y="315" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff">-1</text>
  <circle cx="295" cy="310" r="20" fill="#2563eb"/>
  <text x="295" y="315" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff">10</text>
  <circle cx="455" cy="310" r="20" fill="#2563eb"/>
  <text x="455" y="315" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff">40</text>
  <circle cx="615" cy="310" r="20" fill="#16a34a"/>
  <text x="615" y="315" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff">90</text>
</svg>
