<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560">
  <title>Meszaros taksonomiyasi: dublyorning besh turi taqqoslashi</title>
  <rect x="0" y="0" width="820" height="560" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Dublyorning besh turi (Meszaros)</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Soddadan murakkabga: kirish bormi? javob beradimi? yozadimi? o'zi tekshiradimi?</text>

  <!-- Dummy -->
  <rect x="40" y="95" width="740" height="78" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="60" y="125" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#1e293b">Dummy</text>
  <text x="60" y="150" font-family="Segoe UI" font-size="13" fill="#64748b">o'rin to'ldiruvchi</text>
  <text x="240" y="130" font-family="Segoe UI" font-size="14" fill="#475569">Hech ishlatilmaydi — faqat majburiy argumentni to'ldirish uchun beriladi.</text>
  <text x="240" y="153" font-family="Segoe UI" font-size="13" fill="#64748b">Qachon: parametr kerak, ammo testda hech qachon chaqirilmaydi.</text>

  <!-- Stub -->
  <rect x="40" y="183" width="740" height="78" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="213" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#2563eb">Stub</text>
  <text x="60" y="238" font-family="Segoe UI" font-size="13" fill="#64748b">tayyor javob</text>
  <text x="240" y="218" font-family="Segoe UI" font-size="14" fill="#475569">SUT ga oldindan tayyorlangan qiymat qaytaradi (kirish beradi).</text>
  <text x="240" y="241" font-family="Segoe UI" font-size="13" fill="#64748b">Qachon: SUT ga "ma'lumot kerak" — natijaga (state) qaraymiz.</text>

  <!-- Spy -->
  <rect x="40" y="271" width="740" height="78" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="60" y="301" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#7c3aed">Spy</text>
  <text x="60" y="326" font-family="Segoe UI" font-size="13" fill="#64748b">stub + yozadi</text>
  <text x="240" y="306" font-family="Segoe UI" font-size="14" fill="#475569">Stub kabi javob beradi, ustiga chaqiruvlarni yozib boradi.</text>
  <text x="240" y="329" font-family="Segoe UI" font-size="13" fill="#64748b">Qachon: "chaqirildimi, qanday argument bilan?" — keyin tekshirasiz.</text>

  <!-- Mock -->
  <rect x="40" y="359" width="740" height="78" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="389" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#dc2626">Mock</text>
  <text x="60" y="414" font-family="Segoe UI" font-size="13" fill="#64748b">kutish + verify</text>
  <text x="240" y="394" font-family="Segoe UI" font-size="14" fill="#475569">Oldindan KUTISH bilan dasturlanadi; o'zi xulqni tekshiradi (verify).</text>
  <text x="240" y="417" font-family="Segoe UI" font-size="13" fill="#64748b">Qachon: o'zaro ta'sir (behavior) testning maqsadi bo'lganda.</text>

  <!-- Fake -->
  <rect x="40" y="447" width="740" height="78" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="60" y="477" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#16a34a">Fake</text>
  <text x="60" y="502" font-family="Segoe UI" font-size="13" fill="#64748b">ishlaydigan</text>
  <text x="240" y="482" font-family="Segoe UI" font-size="14" fill="#475569">Haqiqiy, lekin soddalashtirilgan implementatsiya (in-memory DB).</text>
  <text x="240" y="505" font-family="Segoe UI" font-size="13" fill="#64748b">Qachon: real DOC og'ir, lekin haqiqiy xulq kerak bo'lganda.</text>
</svg>
