<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440">
  <title>State verification va behavior verification farqi</title>
  <rect x="0" y="0" width="820" height="440" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Holatni tekshirish vs xulqni tekshirish</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Ikki xil "to'g'rimi?" savoli — ikki xil dublyor</text>

  <!-- State -->
  <rect x="40" y="95" width="350" height="300" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="215" y="128" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#2563eb">State verification</text>
  <text x="215" y="150" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">holatni / natijani tekshirish</text>

  <text x="215" y="185" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#475569">Savol: "natija to'g'rimi?"</text>
  <rect x="70" y="205" width="290" height="46" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="215" y="233" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">assert jami == 18000</text>

  <text x="215" y="285" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Dublyor: stub / fake</text>
  <text x="215" y="315" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">SUT ni ishga tushir, qaytgan</text>
  <text x="215" y="335" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">qiymat yoki yangi holatga qara</text>
  <text x="215" y="368" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">+ refactoring'ga chidamli</text>

  <!-- Behavior -->
  <rect x="430" y="95" width="350" height="300" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="605" y="128" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#dc2626">Behavior verification</text>
  <text x="605" y="150" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">xulqni / o'zaro ta'sirni tekshirish</text>

  <text x="605" y="185" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#475569">Savol: "to'g'ri chaqirildimi?"</text>
  <rect x="460" y="205" width="290" height="46" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="605" y="233" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">assert spy.saqlangan == [...]</text>

  <text x="605" y="285" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">Dublyor: spy / mock</text>
  <text x="605" y="315" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">qaysi metod, qanday argument</text>
  <text x="605" y="335" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">bilan chaqirilganini tekshir</text>
  <text x="605" y="368" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#f59e0b">- ortiqcha ishlatilsa "muzlatadi"</text>
</svg>
