<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470">
  <title>CI pipeline bosqichlari: commit dan keyin checkout, o'rnatish, lint, unit test, integratsiya test, coverage darvozasi va build/deploy ketma-ket bajariladi; har bosqich yiqilsa pipeline darrov to'xtaydi (fail fast) va deploy bo'lmaydi</title>
  <rect x="0" y="0" width="860" height="470" fill="#f8fafc"/>
  <text x="430" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">CI pipeline bosqichlari</text>
  <text x="430" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Har commit/PR'da avtomatik ishlaydi — test = sifat darvozasi (quality gate)</text>

  <!-- commit -->
  <rect x="30" y="100" width="120" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="90" y="126" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e3a8a">commit / PR</text>
  <text x="90" y="146" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">push tetigi</text>

  <!-- arrow -->
  <line x1="150" y1="128" x2="190" y2="128" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="190,123 200,128 190,133" fill="#94a3b8"/>

  <!-- pipeline stages row -->
  <g font-family="Segoe UI">
    <rect x="200" y="100" width="118" height="56" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="259" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">checkout +</text>
    <text x="259" y="143" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">o'rnatish</text>

    <rect x="330" y="100" width="110" height="56" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="385" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">lint / format</text>

    <rect x="452" y="100" width="118" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="511" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">unit testlar</text>
    <text x="511" y="143" text-anchor="middle" font-size="13" fill="#166534">(tez)</text>

    <rect x="582" y="100" width="128" height="56" rx="10" fill="#fef9c3" stroke="#f59e0b" stroke-width="2"/>
    <text x="646" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">integratsiya</text>
    <text x="646" y="143" text-anchor="middle" font-size="13" fill="#92400e">(sekinroq)</text>
  </g>

  <!-- arrows between stages -->
  <g stroke="#94a3b8" stroke-width="2" fill="#94a3b8">
    <line x1="318" y1="128" x2="328" y2="128"/><polygon points="328,123 338,128 328,133"/>
    <line x1="440" y1="128" x2="450" y2="128"/><polygon points="450,123 460,128 450,133"/>
    <line x1="570" y1="128" x2="580" y2="128"/><polygon points="580,123 590,128 580,133"/>
  </g>

  <!-- down arrow to second row -->
  <line x1="646" y1="156" x2="646" y2="196" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="641,196 646,206 651,196" fill="#94a3b8"/>

  <!-- second row -->
  <rect x="582" y="210" width="128" height="56" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="646" y="234" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#5b21b6">coverage</text>
  <text x="646" y="253" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#5b21b6">darvozasi</text>

  <line x1="582" y1="238" x2="462" y2="238" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="462,233 452,238 462,243" fill="#94a3b8"/>

  <rect x="334" y="210" width="118" height="56" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="393" y="242" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">build</text>

  <line x1="334" y1="238" x2="224" y2="238" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="224,233 214,238 224,243" fill="#94a3b8"/>

  <rect x="94" y="210" width="120" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="154" y="234" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e3a8a">deploy</text>
  <text x="154" y="253" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e3a8a">(CD)</text>

  <!-- fail-fast box -->
  <rect x="60" y="320" width="740" height="118" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="430" y="350" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#991b1b">Fail fast — har bosqich darvoza</text>
  <text x="430" y="378" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#7f1d1d">Istalgan bosqich qizil (FAIL) bo'lsa — pipeline darrov to'xtaydi, keyingilari ishlamaydi.</text>
  <text x="430" y="402" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#7f1d1d">Testlar yashil bo'lmasa — deploy MUMKIN EMAS. "Menda ishlayapti" muammosining yechimi.</text>
  <text x="430" y="426" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">pytest yiqilsa exit kodi != 0 -> CI bosqichi qizil bo'ladi</text>
</svg>
