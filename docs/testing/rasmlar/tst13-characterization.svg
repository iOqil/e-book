<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430">
  <title>Characterization test oqimi: kuzat, muhrla, xavfsiz refactor</title>
  <rect x="0" y="0" width="820" height="430" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Characterization test (xulq-muhrlovchi test)</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Legacy kod: "to'g'rimi?" emas — "HOZIR shunday ishlaydi" deb yozib qo'yamiz</text>

  <!-- 1. KUZAT -->
  <rect x="50" y="120" width="210" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="85" cy="155" r="16" fill="#2563eb"/>
  <text x="85" y="161" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#ffffff">1</text>
  <text x="180" y="161" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#1e293b">KUZAT</text>
  <text x="155" y="195" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Kodga turli kirish ber,</text>
  <text x="155" y="215" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">haqiqiy chiqishni yoz</text>
  <text x="155" y="245" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#7c3aed">-10 -&gt; "F" · 150 -&gt; "A"</text>

  <!-- 2. MUHRLA -->
  <rect x="305" y="120" width="210" height="150" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="340" cy="155" r="16" fill="#7c3aed"/>
  <text x="340" y="161" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#ffffff">2</text>
  <text x="430" y="161" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#1e293b">MUHRLA</text>
  <text x="410" y="195" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Shu chiqishni assert qil:</text>
  <text x="410" y="215" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">test endi xulqni qotiradi</text>
  <text x="410" y="245" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">parametrize: 10 holat PASS</text>

  <!-- 3. REFACTOR -->
  <rect x="560" y="120" width="210" height="150" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <circle cx="595" cy="155" r="16" fill="#16a34a"/>
  <text x="595" y="161" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#ffffff">3</text>
  <text x="690" y="161" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#1e293b">REFACTOR</text>
  <text x="665" y="195" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Kodni xavfsiz tozala —</text>
  <text x="665" y="215" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">to'r yashil bo'lsa, xulq</text>
  <text x="665" y="245" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">saqlanganiga ishonch</text>

  <!-- strelkalar -->
  <line x1="262" y1="195" x2="303" y2="195" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a2)"/>
  <line x1="517" y1="195" x2="558" y2="195" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a2)"/>

  <rect x="50" y="320" width="720" height="74" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="410" y="350" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#92400e">Diqqat: g'alati xulqni ham muhrlaymiz</text>
  <text x="410" y="376" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#92400e">Avval xulqni xavfsiz saqlab refactor qil; xatoni tuzatish — ALOHIDA, keyingi qadam</text>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
