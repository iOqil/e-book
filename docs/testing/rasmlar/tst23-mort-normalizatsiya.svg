<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440">
  <title>Mo'rt snapshot: sana va ID har run'da o'zgaradi va snapshot'ni doim buzadi; normalizatsiya bu qismlarni maskalab snapshot'ni barqaror qiladi</title>
  <rect x="0" y="0" width="840" height="440" fill="#f8fafc"/>
  <text x="420" y="40" text-anchor="middle" font-family="Segoe UI" font-size="23" font-weight="bold" fill="#1e293b">Mo'rt snapshot -&gt; normalizatsiya</text>
  <text x="420" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">nodeterministik qismlarni maskala, snapshot barqaror bo'lsin</text>

  <!-- chap: mo'rt -->
  <rect x="40" y="95" width="360" height="300" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="220" y="123" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#991b1b">MO'RT (doim buziladi)</text>

  <rect x="70" y="140" width="300" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="85" y="165" font-family="Consolas,monospace" font-size="13" fill="#1e293b">KVITANSIYA</text>
  <text x="85" y="187" font-family="Consolas,monospace" font-size="13" fill="#dc2626">Sana: 2026-06-16T20:58:35</text>
  <text x="85" y="209" font-family="Consolas,monospace" font-size="13" fill="#dc2626">ID: d453d915-8513-461b...</text>
  <text x="85" y="231" font-family="Consolas,monospace" font-size="13" fill="#1e293b">Mahsulot: Olma</text>

  <text x="220" y="268" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#991b1b">har run'da sana va ID o'zgaradi</text>
  <rect x="100" y="285" width="240" height="30" rx="6" fill="#fecaca"/>
  <text x="220" y="305" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#991b1b">FAIL -&gt; FAIL -&gt; FAIL</text>
  <text x="220" y="345" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">hech kim diff'ni o'qimaydi,</text>
  <text x="220" y="364" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">faqat "update" bosiladi -&gt; qiymatsiz</text>

  <!-- o'ng: normallashtirilgan -->
  <rect x="440" y="95" width="360" height="300" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="123" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#166534">NORMALLASHTIRILGAN</text>

  <rect x="470" y="140" width="300" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="485" y="165" font-family="Consolas,monospace" font-size="13" fill="#1e293b">KVITANSIYA</text>
  <text x="485" y="187" font-family="Consolas,monospace" font-size="13" fill="#16a34a">Sana: &lt;SANA&gt;</text>
  <text x="485" y="209" font-family="Consolas,monospace" font-size="13" fill="#16a34a">ID: &lt;ID&gt;</text>
  <text x="485" y="231" font-family="Consolas,monospace" font-size="13" fill="#1e293b">Mahsulot: Olma</text>

  <text x="620" y="268" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">sana/ID maskalandi -&gt; qiymat barqaror</text>
  <rect x="500" y="285" width="240" height="30" rx="6" fill="#bbf7d0"/>
  <text x="620" y="305" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#166534">PASS -&gt; PASS -&gt; PASS</text>
  <text x="620" y="345" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">endi farq = haqiqiy o'zgarish,</text>
  <text x="620" y="364" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">shovqin emas</text>

  <text x="420" y="252" text-anchor="middle" font-family="Segoe UI" font-size="24" fill="#94a3b8">-&gt;</text>
</svg>
