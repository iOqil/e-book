<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420">
  <title>Yaxshi test nomi anatomiyasi: nima, sharoit, kutilgan natija</title>
  <rect x="0" y="0" width="820" height="420" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Yaxshi test nomi nimadan iborat</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Nom = nima testlanadi + qaysi sharoitda + qanday natija</text>

  <!-- name parts -->
  <rect x="50" y="110" width="210" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="140" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">test_manfiy_sonlar</text>
  <text x="155" y="164" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">NIMA testlanadi</text>

  <rect x="300" y="110" width="200" height="70" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="400" y="140" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">_qoshilganda</text>
  <text x="400" y="164" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">qaysi SHAROIT</text>

  <rect x="540" y="110" width="230" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="655" y="140" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">_togri_yigindi</text>
  <text x="655" y="164" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#475569">kutilgan NATIJA</text>

  <!-- good vs bad -->
  <rect x="50" y="230" width="720" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="78" y="267" font-family="Segoe UI" font-size="20" fill="#16a34a">OK</text>
  <text x="125" y="261" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">test_manfiy_sonlar_qoshilganda_togri_yigindi</text>
  <text x="125" y="282" font-family="Segoe UI" font-size="13" fill="#64748b">yiqilsa, nom o'zi nima buzilganini aytadi</text>

  <rect x="50" y="310" width="720" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="78" y="347" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#dc2626">X</text>
  <text x="125" y="341" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">test_qoshish  ·  test_1  ·  test_ishlaydimi</text>
  <text x="125" y="362" font-family="Segoe UI" font-size="13" fill="#64748b">yiqilsa, nimani buzganini bilish uchun kodga qarash kerak</text>
</svg>
