<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440">
  <title>Bitta o'zgarmagan testni 5 marta ishga tushirganda natija aralash: goh yashil (PASS) goh qizil (FAIL) bo'ladi, bu flaky testning ta'rifi</title>
  <rect x="0" y="0" width="820" height="440" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Flaky test: goh yashil, goh qizil</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Bir xil kod, kod o'zgarmagan — 5 marta ishga tushirildi</text>

  <!-- Bitta test qutisi -->
  <rect x="280" y="96" width="260" height="48" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="118" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">test_zar_olti_emas()</text>
  <text x="410" y="136" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">o'zgarmagan, bitta test</text>

  <!-- Strelka pastga -->
  <line x1="410" y1="148" x2="410" y2="178" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="410,184 403,170 417,170" fill="#94a3b8"/>

  <!-- 5 run natijasi -->
  <rect x="60" y="200" width="120" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="120" y="232" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">Run 1</text>
  <text x="120" y="262" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#16a34a">PASS</text>

  <rect x="200" y="200" width="120" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="260" y="232" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">Run 2</text>
  <text x="260" y="262" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#16a34a">PASS</text>

  <rect x="340" y="200" width="120" height="90" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="400" y="232" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#991b1b">Run 3</text>
  <text x="400" y="262" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#dc2626">FAIL</text>

  <rect x="480" y="200" width="120" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="540" y="232" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">Run 4</text>
  <text x="540" y="262" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#16a34a">PASS</text>

  <rect x="620" y="200" width="120" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="680" y="232" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">Run 5</text>
  <text x="680" y="262" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#16a34a">PASS</text>

  <!-- Xulosa -->
  <rect x="180" y="320" width="460" height="56" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="410" y="345" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#92400e">Natija nodeterministik = FLAKY</text>
  <text x="410" y="366" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#92400e">Jonli: 20 run -&gt; 18 PASS, 2 FAIL</text>

  <text x="410" y="412" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Deterministik test 100 run = 100 bir xil natija; flaky test esa "irodaga ko'ra" o'zgaradi</text>
</svg>
