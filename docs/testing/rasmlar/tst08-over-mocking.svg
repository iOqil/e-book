<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480">
  <title>Over-mocking: test faqat o'z mock'larini tekshiradi (bo'sh ishonch)</title>
  <rect x="0" y="0" width="820" height="480" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Over-mocking — bo'sh ishonch tuzog'i</text>
  <text x="410" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Hamma narsa mock bo'lsa, test haqiqiy mantiqdan o'tmaydi</text>

  <!-- YOMON tomon -->
  <text x="215" y="104" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">Hamma narsa mock</text>
  <rect x="60" y="120" width="310" height="170" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>

  <rect x="90" y="142" width="110" height="44" rx="8" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <text x="145" y="170" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#dc2626">mock savat</text>
  <rect x="230" y="142" width="110" height="44" rx="8" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <text x="285" y="170" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#dc2626">mock narx</text>
  <rect x="160" y="210" width="110" height="44" rx="8" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <text x="215" y="238" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#dc2626">mock jami</text>
  <text x="215" y="278" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">test == o'z yolg'onini tasdiqlaydi</text>

  <!-- YAXSHI tomon -->
  <text x="605" y="104" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">Chegarada mock, ichida real</text>
  <rect x="450" y="120" width="310" height="170" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>

  <rect x="480" y="150" width="130" height="50" rx="8" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="545" y="180" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">real Savat</text>
  <rect x="630" y="150" width="100" height="50" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="680" y="174" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">mock</text>
  <text x="680" y="192" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">tarmoq</text>
  <text x="605" y="234" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">haqiqiy mantiq sinaladi</text>
  <text x="605" y="256" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">faqat IO chegarasi mock</text>

  <!-- pastki xabar -->
  <rect x="120" y="330" width="580" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="362" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">Savol: bu test BUZILGAN kodni topa oladimi?</text>
  <text x="410" y="392" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#dc2626">Hamma narsa mock -> YO'Q (jami() mantig'i hech qachon ishlamaydi)</text>
  <text x="410" y="418" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">Real obyekt -> HA (yig'indi/chegirma xatosini ushlaydi)</text>
  <text x="410" y="442" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Yiqilmaydigan, lekin hech narsa isbotlamaydigan test — eng xavfli test</text>
</svg>
