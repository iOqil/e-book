<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430">
  <title>Snapshot testing oqimi: birinchi run snapshot'ni saqlaydi, keyingi run solishtiradi, farq bo'lsa diff bilan yiqiladi</title>
  <rect x="0" y="0" width="840" height="430" fill="#f8fafc"/>
  <text x="420" y="40" text-anchor="middle" font-family="Segoe UI" font-size="23" font-weight="bold" fill="#1e293b">Snapshot testing oqimi</text>
  <text x="420" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">birinchi run saqlaydi -&gt; keyingi run solishtiradi -&gt; farq bo'lsa diff</text>

  <!-- BIRINCHI RUN -->
  <rect x="40" y="100" width="230" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="128" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">1-RUN (snapshot yo'q)</text>
  <text x="155" y="155" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">natija hisoblanadi</text>
  <text x="155" y="178" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">faylga SAQLANADI</text>
  <rect x="95" y="190" width="120" height="22" rx="6" fill="#16a34a"/>
  <text x="155" y="206" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#ffffff">PASS (yozildi)</text>

  <!-- snapshot fayli -->
  <rect x="340" y="120" width="160" height="80" rx="10" fill="#fefce8" stroke="#f59e0b" stroke-width="2"/>
  <text x="420" y="150" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">snapshot fayli</text>
  <text x="420" y="174" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">.snap (oltin nusxa)</text>

  <!-- KEYINGI RUN -->
  <rect x="570" y="100" width="230" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="685" y="128" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">KEYINGI RUN</text>
  <text x="685" y="155" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">yangi natija</text>
  <text x="685" y="178" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#334155">snapshot bilan SOLISHTIR</text>

  <!-- arrows -->
  <line x1="270" y1="160" x2="335" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="565" y1="160" x2="505" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- natija ikki tarmoq -->
  <rect x="430" y="270" width="170" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="515" y="295" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#166534">mos keldi</text>
  <text x="515" y="316" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#166534">PASS</text>

  <rect x="630" y="270" width="180" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="720" y="295" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#991b1b">farq bor</text>
  <text x="720" y="318" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#991b1b">FAIL + diff</text>
  <text x="720" y="340" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="#991b1b">- eski</text>
  <text x="720" y="358" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="#166534">+ yangi</text>

  <line x1="685" y1="222" x2="560" y2="268" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="700" y1="222" x2="715" y2="268" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>

  <text x="200" y="300" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Birinchi run hech narsani tekshirmaydi —</text>
  <text x="200" y="320" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">u faqat "oltin standart"ni yozadi.</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
