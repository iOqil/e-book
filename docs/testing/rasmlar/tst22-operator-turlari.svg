<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470">
  <title>Mutant operatorlari turlari: arifmetik, taqqoslash, mantiqiy, konstanta va statement o'chirish — har biri kodda kichik o'zgartirish kiritib mutant hosil qiladi</title>
  <rect x="0" y="0" width="820" height="470" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Mutant operatorlari turlari</text>
  <text x="410" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Asbob koddagi kichik joylarni shu naqshlar bilan o'zgartiradi</text>

  <!-- Card 1 arithmetic -->
  <rect x="40" y="92" width="360" height="110" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="120" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e40af">Arifmetik</text>
  <text x="60" y="148" font-family="Segoe UI" font-size="14" fill="#1e293b">+ -&gt; -     * -&gt; /     - -&gt; +</text>
  <text x="60" y="176" font-family="Segoe UI" font-size="13" fill="#64748b">a + b   =&gt;   a - b</text>

  <!-- Card 2 comparison -->
  <rect x="420" y="92" width="360" height="110" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="440" y="120" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#166534">Taqqoslash</text>
  <text x="440" y="148" font-family="Segoe UI" font-size="14" fill="#1e293b">&gt; -&gt; &gt;=     &lt; -&gt; &lt;=     == -&gt; !=</text>
  <text x="440" y="176" font-family="Segoe UI" font-size="13" fill="#64748b">x &gt; 0   =&gt;   x &gt;= 0   (chegara!)</text>

  <!-- Card 3 logical -->
  <rect x="40" y="218" width="360" height="110" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="60" y="246" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#6b21a8">Mantiqiy</text>
  <text x="60" y="274" font-family="Segoe UI" font-size="14" fill="#1e293b">and -&gt; or     or -&gt; and     not o'chir</text>
  <text x="60" y="302" font-family="Segoe UI" font-size="13" fill="#64748b">a and b   =&gt;   a or b</text>

  <!-- Card 4 constant -->
  <rect x="420" y="218" width="360" height="110" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="440" y="246" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#92400e">Konstanta</text>
  <text x="440" y="274" font-family="Segoe UI" font-size="14" fill="#1e293b">True -&gt; False     0 -&gt; 1     n -&gt; n+1</text>
  <text x="440" y="302" font-family="Segoe UI" font-size="13" fill="#64748b">limit = 100   =&gt;   limit = 101</text>

  <!-- Card 5 statement deletion -->
  <rect x="40" y="344" width="740" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="372" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#991b1b">Statement o'chirish</text>
  <text x="60" y="400" font-family="Segoe UI" font-size="14" fill="#1e293b">Butun qatorni olib tashlash yoki return'ni o'zgartirish</text>
  <text x="60" y="426" font-family="Segoe UI" font-size="13" fill="#64748b">foiz = foiz + 5   =&gt;   (qator o'chirildi)       return x   =&gt;   return None</text>
</svg>
