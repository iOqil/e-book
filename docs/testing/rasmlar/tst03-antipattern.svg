<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 490">
  <title>Sog'lom piramida (chapda) va muzqaymoq konusi anti-patterni (o'ngda) yonma-yon: sog'lomda asos unit testlar, anti-patternda tepada ko'p qo'lda va E2E testlar</title>
  <rect x="0" y="0" width="820" height="490" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Sog'lom piramida vs muzqaymoq konusi</text>
  <text x="410" y="62" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Bir xil testlar soni, butunlay teskari taqsimot</text>

  <!-- LEFT: healthy pyramid -->
  <text x="210" y="100" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">✅ Sog'lom piramida</text>
  <polygon points="210,116 256,176 164,176" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="210" y="166" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#991b1b">E2E (oz)</text>
  <polygon points="164,178 256,178 296,250 124,250" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="210" y="222" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#92400e">Integratsiya</text>
  <polygon points="124,252 296,252 340,338 80,338" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="210" y="300" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#166534">Unit (ko'p)</text>
  <text x="210" y="368" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">Tez · barqaror · arzon</text>

  <!-- divider -->
  <line x1="410" y1="90" x2="410" y2="410" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- RIGHT: ice cream cone (inverted) -->
  <text x="610" y="100" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">❌ Muzqaymoq konusi</text>
  <!-- big scoop on top: manual -->
  <ellipse cx="600" cy="150" rx="108" ry="44" fill="#fde2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="147" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#991b1b">Qo'lda testlar (ko'p)</text>
  <text x="600" y="167" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#991b1b">sekin, takror, charchatadi</text>
  <!-- E2E band -->
  <rect x="515" y="196" width="170" height="46" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="224" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#991b1b">E2E (ko'p)</text>
  <!-- thin integration -->
  <polygon points="550,244 650,244 628,300 572,300" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <line x1="650" y1="270" x2="700" y2="270" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="706" y="275" font-family="Segoe UI" font-size="13" fill="#92400e">Integratsiya (oz)</text>
  <!-- tiny unit cone tip -->
  <polygon points="572,302 628,302 600,352" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <line x1="600" y1="352" x2="600" y2="372" stroke="#16a34a" stroke-width="1.5"/>
  <text x="600" y="388" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">Unit (juda oz)</text>

  <text x="600" y="430" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">Sekin · mo'rt (flaky) · qimmat</text>
  <text x="410" y="468" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Teskari shakl = sekin fikr-mulohaza, xatoni topish qiyin</text>
</svg>
