<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470">
  <title>Misol-asosli test bir nechta kirishni o'zingiz tanlaysiz va orasidagi bo'shliqlar sinalmay qoladi, xossa-asosli test esa kutubxona yuzlab tasodifiy kirish generatsiya qilib xossani buzadigan holatni qidiradi</title>
  <rect x="0" y="0" width="820" height="470" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Misol-asosli vs xossa-asosli test</text>
  <text x="410" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Kirishlarni siz tanlaysizmi yoki kutubxona generatsiya qiladimi?</text>

  <!-- Left: example-based -->
  <rect x="40" y="92" width="350" height="330" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="215" y="122" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">Misol-asosli (example-based)</text>
  <text x="215" y="146" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Siz 3 ta kirishni qo'lda tanlaysiz</text>

  <!-- input number line -->
  <line x1="70" y1="200" x2="360" y2="200" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="110" cy="200" r="9" fill="#2563eb"/>
  <circle cx="215" cy="200" r="9" fill="#2563eb"/>
  <circle cx="320" cy="200" r="9" fill="#2563eb"/>
  <text x="110" y="228" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">0</text>
  <text x="215" y="228" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">5</text>
  <text x="320" y="228" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">10</text>

  <text x="160" y="264" text-anchor="middle" font-family="Segoe UI" font-size="26" fill="#dc2626">?</text>
  <text x="268" y="264" text-anchor="middle" font-family="Segoe UI" font-size="26" fill="#dc2626">?</text>
  <text x="215" y="294" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">Orasidagi bo'shliqlar sinalmadi</text>

  <text x="215" y="338" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">Faqat o'zingiz o'ylagan holat</text>
  <text x="215" y="362" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">Chegara/g'alati kirish o'tib ketadi</text>
  <text x="215" y="394" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">assert teskari("salom") == "molas"</text>

  <!-- Right: property-based -->
  <rect x="430" y="92" width="350" height="330" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="605" y="122" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e40af">Xossa-asosli (property-based)</text>
  <text x="605" y="146" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Kutubxona yuzlab kirish generatsiya qiladi</text>

  <line x1="460" y1="200" x2="750" y2="200" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="468" cy="200" r="5" fill="#16a34a"/>
  <circle cx="490" cy="200" r="5" fill="#16a34a"/>
  <circle cx="512" cy="200" r="5" fill="#16a34a"/>
  <circle cx="534" cy="200" r="5" fill="#16a34a"/>
  <circle cx="556" cy="200" r="5" fill="#16a34a"/>
  <circle cx="578" cy="200" r="5" fill="#16a34a"/>
  <circle cx="600" cy="200" r="5" fill="#16a34a"/>
  <circle cx="622" cy="200" r="5" fill="#16a34a"/>
  <circle cx="644" cy="200" r="5" fill="#16a34a"/>
  <circle cx="666" cy="200" r="5" fill="#16a34a"/>
  <circle cx="688" cy="200" r="5" fill="#16a34a"/>
  <circle cx="710" cy="200" r="5" fill="#16a34a"/>
  <circle cx="732" cy="200" r="5" fill="#dc2626"/>
  <text x="732" y="180" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">xato!</text>

  <text x="605" y="264" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">Bo'sh, juda katta, g'alati Unicode...</text>
  <text x="605" y="294" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">hammasi avtomatik sinaladi</text>

  <text x="605" y="338" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">Siz XOSSANI e'lon qilasiz, misolni emas</text>
  <text x="605" y="394" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e40af">teskari(teskari(s)) == s</text>
  <text x="605" y="362" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">Xossani buzadigan kirishni qidiradi</text>
</svg>
