<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470">
  <title>Kichik qadamlar vs katta sakrash: TDD intizomi</title>
  <rect x="0" y="0" width="820" height="470" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="23" font-weight="bold" fill="#1e293b">Kichik qadamlar vs katta sakrash</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">TDD ko'p kichik, ishonchli qadamni afzal ko'radi</text>

  <defs>
    <marker id="okg" markerWidth="11" markerHeight="11" refX="7" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="okr" markerWidth="11" markerHeight="11" refX="7" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Top: big leap (risky) -->
  <text x="60" y="120" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#dc2626">Katta sakrash</text>
  <text x="60" y="142" font-family="Segoe UI" font-size="13" fill="#64748b">Yiqilsa: qayerda xato? Uzoq debug.</text>
  <rect x="60" y="158" width="120" height="50" rx="8" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/>
  <text x="120" y="188" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">Boshlanish</text>
  <path d="M 188 183 C 360 100, 560 260, 660 183" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#okr)"/>
  <text x="420" y="135" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">bitta ulkan o'zgarish</text>
  <rect x="668" y="158" width="120" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="728" y="180" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">Maqsad</text>
  <text x="728" y="198" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">(xavfli)</text>

  <line x1="60" y1="250" x2="788" y2="250" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Bottom: baby steps (safe) -->
  <text x="60" y="290" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#16a34a">Kichik qadamlar (baby steps)</text>
  <text x="60" y="312" font-family="Segoe UI" font-size="13" fill="#64748b">Har qadamda yashil &#8594; xato bo'lsa darrov ko'rinadi.</text>

  <rect x="60" y="330" width="92" height="46" rx="8" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/>
  <text x="106" y="358" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">Boshlanish</text>

  <rect x="200" y="330" width="78" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="239" y="358" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">yashil</text>

  <rect x="326" y="330" width="78" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="365" y="358" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">yashil</text>

  <rect x="452" y="330" width="78" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="491" y="358" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">yashil</text>

  <rect x="578" y="330" width="78" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="617" y="358" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">yashil</text>

  <rect x="700" y="330" width="88" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="744" y="358" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#16a34a">Maqsad</text>

  <line x1="152" y1="353" x2="196" y2="353" stroke="#16a34a" stroke-width="2.5" marker-end="url(#okg)"/>
  <line x1="278" y1="353" x2="322" y2="353" stroke="#16a34a" stroke-width="2.5" marker-end="url(#okg)"/>
  <line x1="404" y1="353" x2="448" y2="353" stroke="#16a34a" stroke-width="2.5" marker-end="url(#okg)"/>
  <line x1="530" y1="353" x2="574" y2="353" stroke="#16a34a" stroke-width="2.5" marker-end="url(#okg)"/>
  <line x1="656" y1="353" x2="696" y2="353" stroke="#16a34a" stroke-width="2.5" marker-end="url(#okg)"/>

  <text x="410" y="430" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">Qancha noaniq bo'lsa, qadam shuncha kichik bo'lsin</text>
</svg>
