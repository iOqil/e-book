<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500">
  <title>Gherkin tilining tuzilishi: Feature ichida Scenario, Scenario ichida Given/When/Then/And qadamlari — bir vaqtning o'zida ham hujjat, ham bajariladigan test</title>
  <rect x="0" y="0" width="820" height="500" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Gherkin tuzilishi — Feature, Scenario, qadamlar</text>
  <text x="410" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Oddiy matn, lekin mashina bajara oladigan spetsifikatsiya</text>

  <!-- Feature outer box -->
  <rect x="60" y="92" width="700" height="370" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="60" y="92" width="220" height="40" rx="12" fill="#2563eb"/>
  <text x="80" y="119" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#ffffff">Feature: Imkoniyat</text>
  <text x="300" y="119" font-family="Segoe UI" font-size="13" fill="#1e40af">— foydalanuvchi uchun bitta qadr-qiymat</text>

  <!-- Scenario inner box -->
  <rect x="90" y="148" width="640" height="290" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="90" y="148" width="230" height="38" rx="10" fill="#7c3aed"/>
  <text x="108" y="174" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#ffffff">Scenario: Holat</text>
  <text x="335" y="174" font-family="Segoe UI" font-size="13" fill="#5b21b6">— bitta aniq misol</text>

  <!-- Given -->
  <rect x="118" y="200" width="584" height="48" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="138" y="221" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#5b21b6">Given</text>
  <text x="210" y="221" font-family="Segoe UI" font-size="13" fill="#5b21b6">hisobimda 100000 so'm bor</text>
  <text x="138" y="240" font-family="Segoe UI" font-size="13" fill="#64748b">boshlang'ich kontekst</text>

  <!-- When -->
  <rect x="118" y="258" width="584" height="48" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="138" y="279" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#166534">When</text>
  <text x="210" y="279" font-family="Segoe UI" font-size="13" fill="#166534">men 30000 so'm yechaman</text>
  <text x="138" y="298" font-family="Segoe UI" font-size="13" fill="#64748b">hodisa / amal</text>

  <!-- Then -->
  <rect x="118" y="316" width="584" height="48" rx="8" fill="#fef9f3" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="138" y="337" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#92400e">Then</text>
  <text x="210" y="337" font-family="Segoe UI" font-size="13" fill="#92400e">hisobimda 70000 so'm qoladi</text>
  <text x="138" y="356" font-family="Segoe UI" font-size="13" fill="#64748b">kutilgan natija</text>

  <!-- And -->
  <rect x="118" y="374" width="584" height="48" rx="8" fill="#fef9f3" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="138" y="395" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#92400e">And</text>
  <text x="210" y="395" font-family="Segoe UI" font-size="13" fill="#92400e">menga chek ko'rsatiladi</text>
  <text x="138" y="414" font-family="Segoe UI" font-size="13" fill="#64748b">qadamni davom ettiradi (Given/When/Then dan keyin)</text>

  <text x="410" y="486" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Bir xil Gherkin: Cucumber, SpecFlow, behave, pytest-bdd — tildan mustaqil</text>
</svg>
