<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500">
  <title>String Calculator talablari: oddiydan murakkabga pog'ona</title>
  <rect x="0" y="0" width="820" height="500" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Talablar pog'onasi &#8212; murakkablik bosqichma-bosqich o'sadi</text>
  <text x="410" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Har pog'ona &#8212; bitta yangi qoida; oldingisini buzmaymiz</text>

  <!-- pog'onalar: pastdan yuqoriga -->
  <!-- 1 -->
  <rect x="60" y="410" width="220" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="438" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">Bo'sh / bitta son</text>

  <!-- 2 -->
  <rect x="120" y="356" width="240" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="240" y="384" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">Ikki/ko'p son, vergul</text>

  <!-- 3 -->
  <rect x="180" y="302" width="260" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="310" y="330" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">Yangi qator ajratuvchi</text>

  <!-- 4 -->
  <rect x="240" y="248" width="280" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="276" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">Maxsus ajratuvchi //;</text>

  <!-- 5 -->
  <rect x="300" y="194" width="300" height="44" rx="8" fill="#fef9f3" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="222" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">Manfiy son &#8594; xato</text>

  <!-- 6 -->
  <rect x="360" y="140" width="320" height="44" rx="8" fill="#fef9f3" stroke="#f59e0b" stroke-width="2"/>
  <text x="520" y="168" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">1000 dan katta e'tiborsiz</text>

  <!-- 7 cho'qqi -->
  <rect x="420" y="96" width="320" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="580" y="122" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#16a34a">To'liq, refactor qilingan</text>

  <!-- ko'rsatkich strelka -->
  <text x="40" y="270" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#64748b" transform="rotate(-90 40 270)">murakkablik &#8593;</text>
  <text x="410" y="486" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Yashil = oson holatlar &#183; sariq = xato/chegara holatlari &#183; har pog'ona yangi test bilan keladi</text>
</svg>
