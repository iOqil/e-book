<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480">
  <title>Red-Green-Refactor sikli: yiqiladigan test yoz, o'tkaz, tozala</title>
  <rect x="0" y="0" width="820" height="480" fill="#f8fafc"/>
  <text x="410" y="42" text-anchor="middle" font-family="Segoe UI" font-size="24" font-weight="bold" fill="#1e293b">Red &#8594; Green &#8594; Refactor sikli</text>
  <text x="410" y="70" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Kichik qadamlar bilan aylanma: har sikl bitta yangi xulqni qo'shadi</text>

  <!-- Cycle arrows (circular) -->
  <defs>
    <marker id="ok" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- RED circle -->
  <circle cx="410" cy="180" r="62" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="410" y="172" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#dc2626">RED</text>
  <text x="410" y="196" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">Yiqiladigan</text>
  <text x="410" y="213" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">test yoz</text>

  <!-- GREEN circle -->
  <circle cx="600" cy="330" r="62" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <text x="600" y="322" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#16a34a">GREEN</text>
  <text x="600" y="346" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">Eng oddiy</text>
  <text x="600" y="363" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">kod bilan o'tkaz</text>

  <!-- REFACTOR circle -->
  <circle cx="220" cy="330" r="62" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="220" y="322" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#2563eb">REFACTOR</text>
  <text x="220" y="346" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">Yashil turganda</text>
  <text x="220" y="363" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">kodni tozala</text>

  <!-- arrows along the triangle -->
  <path d="M 462 213 A 150 150 0 0 1 558 290" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ok)"/>
  <path d="M 538 360 A 150 150 0 0 1 282 360" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ok)"/>
  <path d="M 262 290 A 150 150 0 0 1 358 213" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ok)"/>

  <!-- captions -->
  <text x="540" y="240" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">o'tkaz</text>
  <text x="410" y="408" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">tozala</text>
  <text x="280" y="240" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">keyingi xulq</text>

  <text x="410" y="455" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">Qoida: faqat yiqilgan testni o'tkazadigan eng kam kodni yoz</text>
</svg>
