<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480">
  <title>Umumiy til ko'prigi: biznes, Gherkin spetsifikatsiyasi va kod bir xil tilda gaplashadi — uchburchakning markazida ubiquitous language</title>
  <rect x="0" y="0" width="820" height="480" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Umumiy til — biznes, Gherkin va kod bir tilda</text>
  <text x="410" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Bir xil atamalar; "tarjima yo'qolishi" kamayadi (DDD: ubiquitous language)</text>

  <!-- Triangle edges -->
  <line x1="410" y1="150" x2="180" y2="380" stroke="#94a3b8" stroke-width="2"/>
  <line x1="410" y1="150" x2="640" y2="380" stroke="#94a3b8" stroke-width="2"/>
  <line x1="180" y1="380" x2="640" y2="380" stroke="#94a3b8" stroke-width="2"/>

  <!-- Center label -->
  <rect x="320" y="288" width="180" height="46" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="410" y="310" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#92400e">Umumiy til</text>
  <text x="410" y="328" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#92400e">(savat, chegirma, yosh chegarasi)</text>

  <!-- Top: Business -->
  <rect x="290" y="98" width="240" height="84" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="410" y="128" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#5b21b6">Biznes / mijoz</text>
  <text x="410" y="152" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#5b21b6">talabni misol bilan aytadi</text>
  <text x="410" y="172" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#5b21b6">"voyaga yetmaganga sotmaymiz"</text>

  <!-- Bottom-left: Gherkin -->
  <rect x="60" y="338" width="240" height="92" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="368" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e40af">Gherkin .feature</text>
  <text x="180" y="392" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e40af">Given/When/Then</text>
  <text x="180" y="412" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e40af">hujjat = bajariladigan test</text>

  <!-- Bottom-right: Code -->
  <rect x="520" y="338" width="240" height="92" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="640" y="368" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#166534">Kod (qadam)</text>
  <text x="640" y="392" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">step funksiyalar</text>
  <text x="640" y="412" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">domen mantig'ini bajaradi</text>

  <text x="410" y="462" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Uch burchak bir tilda: nomlar mos tushsa, noto'g'ri tushunish kamayadi</text>
</svg>
