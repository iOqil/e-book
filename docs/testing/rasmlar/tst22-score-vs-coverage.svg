<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480">
  <title>Mutation score formulasi va coverage bilan taqqoslash: coverage 100% bo'lishi mumkin, ammo chegara mutanti tirik qolib mutation score 50% bo'lib qoladi, demak mutation score testlar sifati haqida kuchliroq signal beradi</title>
  <rect x="0" y="0" width="820" height="480" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Mutation score vs Coverage</text>
  <text x="410" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Bir xil testlar, ikki xil baho — qaysi biri haqiqatni aytadi?</text>

  <!-- formula box -->
  <rect x="160" y="92" width="500" height="78" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="124" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e40af">Mutation score = o'ldirilgan mutantlar / jami mutantlar</text>
  <text x="410" y="152" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e40af">= 3 / 6 = 50%</text>

  <!-- Left: coverage card -->
  <rect x="60" y="200" width="320" height="230" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="220" y="232" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#166534">Coverage aytadi</text>
  <text x="220" y="296" text-anchor="middle" font-family="Segoe UI" font-size="46" font-weight="bold" fill="#16a34a">100%</text>
  <text x="220" y="330" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">qator ham, shox ham qoplangan</text>
  <text x="220" y="362" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">"Kod bajarildi" ni o'lchaydi</text>
  <text x="220" y="386" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Miqdor: nechta qator kechib o'tildi</text>
  <text x="220" y="412" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">"Mukammal!" deydi</text>

  <!-- Right: mutation card -->
  <rect x="440" y="200" width="320" height="230" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="232" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#92400e">Mutation score aytadi</text>
  <text x="600" y="296" text-anchor="middle" font-family="Segoe UI" font-size="46" font-weight="bold" fill="#d97706">50%</text>
  <text x="600" y="330" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#92400e">6 mutantdan 3 tasi tirik qoldi</text>
  <text x="600" y="362" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">"Test xatoni TUTADIMI" ni o'lchaydi</text>
  <text x="600" y="386" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Sifat: nechta xato sezilmadi</text>
  <text x="600" y="412" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#92400e">"Bo'shliqlaring bor" deydi</text>

  <!-- bottom note -->
  <text x="410" y="458" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">100% coverage bo'lsa ham chegara mutanti tirik qolishi mumkin</text>
</svg>
