<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360">
  <title>Assert bosqichi: natijani kutilgan qiymat bilan solishtirib PASS yoki FAIL hukmini chiqaradi</title>
  <rect x="0" y="0" width="820" height="360" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Assert — testning hukmi</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Act natijasi kutilgan qiymat bilan solishtiriladi</text>

  <!-- Act result box -->
  <rect x="40" y="120" width="200" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="152" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Haqiqiy natija</text>
  <text x="140" y="178" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#2563eb">chegirma(65) = 10</text>

  <!-- compare diamond -->
  <polygon points="410,110 500,160 410,210 320,160" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="410" y="155" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">assert</text>
  <text x="410" y="176" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">natija == kutilgan ?</text>

  <!-- Expected box -->
  <rect x="580" y="120" width="200" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="680" y="152" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Kutilgan qiymat</text>
  <text x="680" y="178" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#2563eb">20</text>

  <!-- arrows to diamond -->
  <line x1="240" y1="160" x2="318" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="318,160 308,155 308,165" fill="#94a3b8"/>
  <line x1="580" y1="160" x2="502" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="502,160 512,155 512,165" fill="#94a3b8"/>

  <!-- PASS / FAIL -->
  <rect x="120" y="270" width="240" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="240" y="296" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">teng -&gt; PASS (o'tdi)</text>
  <text x="240" y="316" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">test sukut bilan o'tadi</text>

  <rect x="460" y="270" width="240" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="580" y="296" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">teng emas -&gt; FAIL (yiqildi)</text>
  <text x="580" y="316" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">assert 10 == 20</text>

  <line x1="380" y1="210" x2="270" y2="268" stroke="#16a34a" stroke-width="2"/>
  <polygon points="270,268 280,262 274,272" fill="#16a34a"/>
  <line x1="440" y1="210" x2="550" y2="268" stroke="#dc2626" stroke-width="2"/>
  <polygon points="550,268 540,262 546,272" fill="#dc2626"/>
</svg>
