<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480">
  <title>Kapston loyihasining yakuniy test piramidasi: 19 tez, 12 integratsiya, 1 E2E</title>
  <rect x="0" y="0" width="820" height="480" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Yakuniy test piramidasi (real sonlar)</text>
  <text x="410" y="62" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Jami 32 test · 100% coverage · ~0.6 soniya</text>

  <!-- E2E uchi -->
  <polygon points="410,90 480,160 340,160" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="410" y="135" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#991b1b">1</text>
  <text x="410" y="153" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#991b1b">E2E</text>
  <text x="560" y="130" text-anchor="start" font-family="Segoe UI" font-size="13" fill="#64748b">to'liq oqim: ijara -&gt; qaytar -&gt; jarima</text>
  <text x="560" y="148" text-anchor="start" font-family="Segoe UI" font-size="13" fill="#94a3b8">kam, sekin, keng — eng tepada</text>

  <!-- Integratsiya o'rta -->
  <polygon points="340,162 480,162 560,290 260,290" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="410" y="222" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#b45309">12</text>
  <text x="410" y="244" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#b45309">Integratsiya + API</text>
  <text x="410" y="266" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#b45309">DB 6 · API 6</text>
  <text x="600" y="235" text-anchor="start" font-family="Segoe UI" font-size="13" fill="#64748b">real sqlite · so'rov/javob shartnomasi</text>

  <!-- Unit asos -->
  <polygon points="260,292 560,292 660,440 160,440" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="360" text-anchor="middle" font-family="Segoe UI" font-size="20" font-weight="bold" fill="#15803d">19</text>
  <text x="410" y="384" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#15803d">Tez (unit + dublyor)</text>
  <text x="410" y="406" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#15803d">domen 12 · xizmat 7</text>
  <text x="690" y="370" text-anchor="end" font-family="Segoe UI" font-size="13" fill="#64748b">ko'p, tez, arzon</text>
  <text x="690" y="388" text-anchor="end" font-family="Segoe UI" font-size="13" fill="#94a3b8">asos — eng keng</text>

  <text x="410" y="466" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Sog'lom shakl: pastda ko'p, yuqorida oz (03-bob piramidasi)</text>
</svg>
