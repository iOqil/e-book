<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560">
  <title>Agile testing quadrants: ikki o'q (biznes-orientir vs texnologiya-orientir, jamoaga yordam vs mahsulotni tanqid) bo'ylab to'rt kvadrant Q1 unit/komponent, Q2 funksional/BDD, Q3 exploratory/UAT, Q4 performance/security</title>
  <rect x="0" y="0" width="820" height="560" fill="#f8fafc"/>
  <text x="410" y="36" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Agile testing quadrants</text>
  <text x="410" y="62" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Nimani test qilamizni ikki o'q bo'ylab joylashtirish</text>

  <!-- Axis labels -->
  <text x="410" y="98" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">Jamoaga yordam (rivojlantiradi)</text>
  <text x="410" y="528" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">Mahsulotni tanqid (baholaydi)</text>
  <text x="36" y="310" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb" transform="rotate(-90 36 310)">Biznes-orientir</text>
  <text x="800" y="310" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb" transform="rotate(90 800 310)">Texnologiya-orientir</text>

  <!-- Q2 top-left (business / supporting) -->
  <rect x="110" y="112" width="300" height="188" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="260" y="142" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#1e40af">Q2</text>
  <text x="260" y="166" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e40af">Biznes · jamoaga yordam</text>
  <text x="260" y="196" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">Funksional testlar</text>
  <text x="260" y="220" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">Misol · BDD · hikoya</text>
  <text x="260" y="244" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">Given-When-Then</text>
  <text x="260" y="276" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Avtomat + qo'lda</text>

  <!-- Q1 top-right wait: layout. Q1 tech/supporting = top-right -->
  <rect x="430" y="112" width="300" height="188" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="580" y="142" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#166534">Q1</text>
  <text x="580" y="166" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">Texnologiya · jamoaga yordam</text>
  <text x="580" y="196" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">Unit testlar</text>
  <text x="580" y="220" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">Komponent testlar</text>
  <text x="580" y="244" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">TDD</text>
  <text x="580" y="276" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Avtomat</text>

  <!-- Q3 bottom-left business/critique -->
  <rect x="110" y="320" width="300" height="188" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="260" y="350" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#92400e">Q3</text>
  <text x="260" y="374" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#92400e">Biznes · mahsulotni baholaydi</text>
  <text x="260" y="404" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">Exploratory testlash</text>
  <text x="260" y="428" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">Usability · UAT</text>
  <text x="260" y="452" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">Qo'lda baholash</text>
  <text x="260" y="484" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Asosan qo'lda</text>

  <!-- Q4 bottom-right tech/critique -->
  <rect x="430" y="320" width="300" height="188" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="580" y="350" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#991b1b">Q4</text>
  <text x="580" y="374" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#991b1b">Texnologiya · mahsulotni baholaydi</text>
  <text x="580" y="404" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">Performance · yuk</text>
  <text x="580" y="428" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">Security</text>
  <text x="580" y="452" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">"ility"lar</text>
  <text x="580" y="484" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Asboblar bilan</text>
</svg>
