<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480">
  <title>Functional core, imperative shell: ichkarida sof mantiq yadrosi yon-effektsiz va oson testlanadi, tashqi yupqa qobiq esa IO ni bajaradi va integratsiyada tekshiriladi</title>
  <rect x="0" y="0" width="820" height="480" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Sof yadro, imperativ qobiq</text>
  <text x="410" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Mantiqni IO dan ajrating: yadro sof, qobiq yupqa</text>

  <!-- Outer shell ring -->
  <circle cx="410" cy="280" r="160" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="148" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e40af">Imperativ qobiq (IO)</text>
  <text x="410" y="168" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e40af">fayl, tarmoq, vaqt, ma'lumotlar bazasi</text>

  <!-- Inner core -->
  <circle cx="410" cy="290" r="92" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="278" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#166534">Sof yadro</text>
  <text x="410" y="300" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">soliq(), yakuniy_hisob()</text>
  <text x="410" y="320" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">kirish -&gt; chiqish</text>

  <!-- Left label: core -->
  <rect x="40" y="250" width="190" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="135" y="278" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#166534">Yadro = oson test</text>
  <text x="135" y="300" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">yon-effektsiz</text>
  <text x="135" y="318" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">determinstik, tez</text>
  <line x1="230" y1="290" x2="316" y2="290" stroke="#16a34a" stroke-width="2"/>
  <polygon points="328,290 312,283 312,297" fill="#16a34a"/>

  <!-- Right label: shell -->
  <rect x="590" y="250" width="190" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="685" y="278" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e40af">Qobiq = ozgina</text>
  <text x="685" y="300" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e40af">mantiq deyarli yo'q</text>
  <text x="685" y="318" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e40af">integratsiyada tekshir</text>
  <line x1="570" y1="220" x2="500" y2="248" stroke="#2563eb" stroke-width="2"/>
  <polygon points="490,252 507,250 502,238" fill="#2563eb"/>

  <text x="410" y="462" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Ko'p unit test yadroga, ozgina integratsiya testi qobiqqa</text>
</svg>
