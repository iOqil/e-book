<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520">
  <title>Goodhart qonuni va coverage: qamrov signal sifatida ishlatilganda foydali, lekin majburiy KPI maqsadiga aylantirilganda dasturchilar assert'siz testlar yozib raqamni qondiradi va o'lchov ma'nosini yo'qotadi</title>
  <rect x="0" y="0" width="820" height="520" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Goodhart qonuni va coverage</text>
  <text x="410" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">"O'lchov maqsadga aylansa, yaxshi o'lchov bo'lishdan to'xtaydi"</text>

  <!-- Left: coverage as SIGNAL (good) -->
  <rect x="50" y="100" width="330" height="360" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="215" y="134" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#1e40af">Signal sifatida (to'g'ri)</text>
  <text x="215" y="162" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e40af">Qamrov = "qayerga e'tibor ber"</text>

  <rect x="78" y="186" width="274" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="215" y="210" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e40af">Qoplanmagan qator chiqdi</text>
  <text x="215" y="230" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e40af">"Bu joyni ko'rib chiqaman"</text>

  <rect x="78" y="258" width="274" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="215" y="282" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e40af">Yangi kod uchun diff coverage</text>
  <text x="215" y="302" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e40af">Kritik kodga yuqori talab</text>

  <rect x="78" y="330" width="274" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="215" y="354" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#166534">Natija: ma'noli testlar</text>
  <text x="215" y="374" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">assert bor, xato tutiladi</text>

  <text x="215" y="430" text-anchor="middle" font-family="Segoe UI" font-size="36" font-weight="bold" fill="#16a34a">good</text>

  <!-- Right: coverage as KPI TARGET (bad) -->
  <rect x="440" y="100" width="330" height="360" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="605" y="134" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#991b1b">Maqsad sifatida (tuzoq)</text>
  <text x="605" y="162" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#991b1b">"100% bo'lmasa, merge yo'q"</text>

  <rect x="468" y="186" width="274" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="605" y="210" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#991b1b">Bosim: raqamni qondir</text>
  <text x="605" y="230" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#991b1b">"Foizni ko'tarish kerak"</text>

  <rect x="468" y="258" width="274" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="605" y="282" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#991b1b">assert'siz testlar yoziladi</text>
  <text x="605" y="302" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#991b1b">kodni "qoplaydi", tekshirmaydi</text>

  <rect x="468" y="330" width="274" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="605" y="354" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#991b1b">Natija: 100% + 0 ishonch</text>
  <text x="605" y="374" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#991b1b">o'lchov ma'nosini yo'qotdi</text>

  <text x="605" y="430" text-anchor="middle" font-family="Segoe UI" font-size="36" font-weight="bold" fill="#dc2626">buzildi</text>

  <text x="410" y="496" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Coverage'ni o'lchagich qiling — boshqaruv tutqichi emas</text>
</svg>
