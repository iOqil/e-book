<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430">
  <title>Testlash yetukligi: boshlovchidan ekspertgacha yo'l xaritasi</title>
  <rect x="0" y="0" width="840" height="430" fill="#f8fafc"/>
  <text x="420" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Testlash yetukligi bosqichlari</text>
  <text x="420" y="62" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">"test yozaman" dan "risk-asosli strategiya" gacha</text>

  <!-- yo'l strelkasi -->
  <line x1="60" y1="120" x2="780" y2="120" stroke="#cbd5e1" stroke-width="3"/>
  <polygon points="790,120 775,113 775,127" fill="#cbd5e1"/>

  <!-- Boshlovchi -->
  <circle cx="160" cy="120" r="14" fill="#16a34a"/>
  <text x="160" y="125" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff">1</text>
  <rect x="60" y="160" width="200" height="218" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="160" y="186" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#15803d">Boshlovchi</text>
  <text x="72" y="214" font-family="Segoe UI" font-size="13" fill="#334155">+ AAA bilan unit yozadi</text>
  <text x="72" y="238" font-family="Segoe UI" font-size="13" fill="#334155">+ assert ishlatadi</text>
  <text x="72" y="262" font-family="Segoe UI" font-size="13" fill="#334155">+ "yashil = tugadi"</text>
  <text x="72" y="290" font-family="Segoe UI" font-size="13" fill="#dc2626">- chegarani unutadi</text>
  <text x="72" y="314" font-family="Segoe UI" font-size="13" fill="#dc2626">- hammasini mock qiladi</text>
  <text x="72" y="338" font-family="Segoe UI" font-size="13" fill="#dc2626">- coverage = maqsad</text>
  <text x="72" y="362" font-family="Segoe UI" font-size="13" fill="#64748b">e'tibor: sintaksis</text>

  <!-- O'rta -->
  <circle cx="420" cy="120" r="14" fill="#2563eb"/>
  <text x="420" y="125" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff">2</text>
  <rect x="320" y="160" width="200" height="218" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="420" y="186" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e40af">O'rta</text>
  <text x="332" y="214" font-family="Segoe UI" font-size="13" fill="#334155">+ piramidani biladi</text>
  <text x="332" y="238" font-family="Segoe UI" font-size="13" fill="#334155">+ chegara/parametrize</text>
  <text x="332" y="262" font-family="Segoe UI" font-size="13" fill="#334155">+ TDD qila boshlaydi</text>
  <text x="332" y="286" font-family="Segoe UI" font-size="13" fill="#334155">+ DB'ni real sinaydi</text>
  <text x="332" y="310" font-family="Segoe UI" font-size="13" fill="#334155">+ flaky'ni tuzatadi</text>
  <text x="332" y="334" font-family="Segoe UI" font-size="13" fill="#334155">+ DI bilan testlanadigan</text>
  <text x="332" y="362" font-family="Segoe UI" font-size="13" fill="#64748b">e'tibor: dizayn</text>

  <!-- Ekspert -->
  <circle cx="680" cy="120" r="14" fill="#7c3aed"/>
  <text x="680" y="125" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#ffffff">3</text>
  <rect x="580" y="160" width="200" height="218" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="680" y="186" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#5b21b6">Ekspert</text>
  <text x="592" y="214" font-family="Segoe UI" font-size="13" fill="#334155">+ risk-asosli strategiya</text>
  <text x="592" y="238" font-family="Segoe UI" font-size="13" fill="#334155">+ mutation/property</text>
  <text x="592" y="262" font-family="Segoe UI" font-size="13" fill="#334155">+ kontrakt/CI darvoza</text>
  <text x="592" y="286" font-family="Segoe UI" font-size="13" fill="#334155">+ "nimani test QILMASLIK"</text>
  <text x="592" y="310" font-family="Segoe UI" font-size="13" fill="#334155">+ jamoaga madaniyat</text>
  <text x="592" y="334" font-family="Segoe UI" font-size="13" fill="#334155">+ ROI bilan o'ylaydi</text>
  <text x="592" y="362" font-family="Segoe UI" font-size="13" fill="#64748b">e'tibor: qiymat/risk</text>

  <text x="420" y="406" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Har bosqich oldingisini o'chirmaydi — ustiga quradi. Yo'l doimiy amaliyot bilan bosiladi.</text>
</svg>
