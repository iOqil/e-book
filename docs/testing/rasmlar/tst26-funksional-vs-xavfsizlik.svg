<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470">
  <title>Funksional testlash kerakli narsa ishlaydimi degan savolga javob beradi, xavfsizlik testlash esa kerakmas narsa ishlamasligini tekshiradi (negative va abuse testlash)</title>
  <rect x="0" y="0" width="820" height="470" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Funksional test vs Xavfsizlik test</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Ikki xil savol, ikki xil fikrlash tarzi</text>

  <!-- Left: functional -->
  <rect x="50" y="100" width="330" height="320" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="215" y="134" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#1e40af">Funksional test</text>
  <text x="215" y="160" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e40af">"Kerakli narsa ISHLAYDIMI?"</text>

  <rect x="78" y="184" width="274" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="215" y="213" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e40af">To'g'ri parol -&gt; kirish ochiladi</text>

  <rect x="78" y="242" width="274" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="215" y="271" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e40af">Savatga mahsulot qo'shiladi</text>

  <rect x="78" y="300" width="274" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="215" y="329" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e40af">Yaxshi foydalanuvchi fikri</text>

  <text x="215" y="392" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">Positive testlash</text>

  <!-- Right: security -->
  <rect x="440" y="100" width="330" height="320" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="605" y="134" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#991b1b">Xavfsizlik test</text>
  <text x="605" y="160" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#991b1b">"KERAKMAS narsa ISHLAMAYDIMI?"</text>

  <rect x="468" y="184" width="274" height="46" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="605" y="213" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#991b1b">Parolsiz kirib bo'lmasligi kerak</text>

  <rect x="468" y="242" width="274" height="46" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="605" y="271" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#991b1b">Begona hujjat ochilmasligi kerak</text>

  <rect x="468" y="300" width="274" height="46" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="605" y="329" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#991b1b">"Yovuz foydalanuvchi" fikri</text>

  <text x="605" y="392" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">Negative / abuse testlash</text>

  <text x="410" y="448" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Funksional = "ishlaydigan yo'l"; Xavfsizlik = "ishlamasligi kerak bo'lgan yo'l"</text>
</svg>
