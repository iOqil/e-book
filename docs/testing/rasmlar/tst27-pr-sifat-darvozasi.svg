<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470">
  <title>PR sifat darvozasi: testlar yashil bo'lgan pull request merge tugmasi ochiq, testlar qizil bo'lgan pull request esa bloklangan — status check o'tmaguncha kodga qo'shilmaydi</title>
  <rect x="0" y="0" width="820" height="470" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">PR sifat darvozasi (status check)</text>
  <text x="410" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Testlar yashil bo'lmasa — merge yo'q</text>

  <!-- Left PR: passing -->
  <rect x="50" y="100" width="330" height="320" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="215" y="132" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#166534">PR #42 — yashil</text>

  <rect x="74" y="152" width="282" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <circle cx="100" cy="172" r="9" fill="#16a34a"/>
  <text x="100" y="177" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#ffffff">+</text>
  <text x="120" y="177" font-family="Segoe UI" font-size="13" fill="#166534">lint — o'tdi</text>

  <rect x="74" y="200" width="282" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <circle cx="100" cy="220" r="9" fill="#16a34a"/>
  <text x="100" y="225" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#ffffff">+</text>
  <text x="120" y="225" font-family="Segoe UI" font-size="13" fill="#166534">unit testlar — 248 o'tdi</text>

  <rect x="74" y="248" width="282" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <circle cx="100" cy="268" r="9" fill="#16a34a"/>
  <text x="100" y="273" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#ffffff">+</text>
  <text x="120" y="273" font-family="Segoe UI" font-size="13" fill="#166534">coverage — 87% (gate o'tdi)</text>

  <rect x="74" y="332" width="282" height="56" rx="10" fill="#16a34a"/>
  <text x="215" y="367" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#ffffff">Merge — OCHIQ</text>

  <!-- Right PR: failing -->
  <rect x="440" y="100" width="330" height="320" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="605" y="132" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#991b1b">PR #43 — qizil</text>

  <rect x="464" y="152" width="282" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <circle cx="490" cy="172" r="9" fill="#16a34a"/>
  <text x="490" y="177" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#ffffff">+</text>
  <text x="510" y="177" font-family="Segoe UI" font-size="13" fill="#166534">lint — o'tdi</text>

  <rect x="464" y="200" width="282" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <circle cx="490" cy="220" r="9" fill="#dc2626"/>
  <text x="490" y="225" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#ffffff">x</text>
  <text x="510" y="225" font-family="Segoe UI" font-size="13" fill="#991b1b">unit testlar — 2 yiqildi</text>

  <rect x="464" y="248" width="282" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="490" cy="268" r="9" fill="#94a3b8"/>
  <text x="490" y="272" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#ffffff">-</text>
  <text x="510" y="273" font-family="Segoe UI" font-size="13" fill="#64748b">coverage — o'tkazib yuborildi</text>

  <rect x="464" y="332" width="282" height="56" rx="10" fill="#fca5a5"/>
  <text x="605" y="361" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#7f1d1d">Merge — BLOKLANGAN</text>
  <text x="605" y="381" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#7f1d1d">status check o'tmadi</text>

  <text x="410" y="448" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Branch protection: "required status checks" yashil bo'lishini majburlaydi</text>
</svg>
