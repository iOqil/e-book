<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470">
  <title>Strategiya: test bilan qoplangan orollar va Strangler Fig bilan eski tizimni asta almashtirish</title>
  <rect x="0" y="0" width="820" height="470" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Strategiya: hammasini emas — o'zgarayotgan joyni o'ra</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Test qoplangan "orollar" + Strangler Fig (eski tizimni asta yangiga ko'chir)</text>

  <!-- Test orollari -->
  <text x="210" y="106" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Test qoplagan orollar</text>
  <rect x="55" y="120" width="310" height="170" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="210" y="142" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">test yo'q legacy dengizi</text>
  <circle cx="130" cy="195" r="34" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="130" y="200" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">test</text>
  <circle cx="245" cy="180" r="30" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="245" y="185" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">test</text>
  <circle cx="195" cy="250" r="28" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="195" y="255" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">test</text>
  <text x="210" y="280" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">faqat tegayotgan joyni qoplab boramiz</text>

  <!-- Strangler Fig -->
  <text x="610" y="106" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Strangler Fig</text>
  <rect x="455" y="120" width="310" height="170" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="480" y="150" width="120" height="110" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="540" y="200" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#991b1b">eski</text>
  <text x="540" y="220" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#991b1b">tizim</text>
  <rect x="620" y="150" width="120" height="110" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="680" y="200" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">yangi</text>
  <text x="680" y="220" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">(testli)</text>
  <line x1="603" y1="205" x2="617" y2="205" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a29x)"/>
  <text x="610" y="280" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">asta-sekin o'rab, qism-qism almashtir</text>

  <!-- pastki tamoyillar -->
  <rect x="55" y="320" width="710" height="125" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="410" y="349" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#92400e">Amaliy tamoyillar</text>
  <text x="75" y="378" font-family="Segoe UI" font-size="13" fill="#92400e">Bo'yscout qoidasi: har teginganingni biroz toza qoldir — coverage'ni asta oshir</text>
  <text x="75" y="402" font-family="Segoe UI" font-size="13" fill="#92400e">Yuqori darajadagi (E2E/characterization) "tutib turuvchi" test bilan o'ra, keyin ichkariga kir</text>
  <text x="75" y="426" font-family="Segoe UI" font-size="13" fill="#92400e">Maqsad — mukammallik emas, asta-sekin yaxshilanish (legacy sekin va asabiy)</text>

  <defs>
    <marker id="a29x" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
