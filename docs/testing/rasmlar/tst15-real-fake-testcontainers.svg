<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470">
  <title>Integratsiya muhitini tanlash: in-memory fake tez lekin kamroq realistik, real bog'liqlik realistik lekin sekin, Testcontainers eng realistik lekin Docker talab qiladi</title>
  <rect x="0" y="0" width="820" height="470" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Integratsiya muhitini tanlash</text>
  <text x="410" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Tezlik va realistiklik o'rtasidagi muvozanat</text>

  <!-- FAKE -->
  <rect x="30" y="100" width="240" height="300" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="150" y="132" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#166534">In-memory fake</text>
  <text x="150" y="156" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">dict / soxta implementatsiya</text>
  <text x="150" y="196" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#166534">⚡ eng tez</text>
  <text x="150" y="224" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#166534">✓ sozlash oson</text>
  <text x="150" y="252" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#dc2626">✗ kamroq realistik</text>
  <text x="150" y="280" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">real SQL/sxema xatosini</text>
  <text x="150" y="300" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">tutmaydi</text>
  <rect x="60" y="330" width="180" height="46" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="150" y="358" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#166534">tez fikr-mulohaza</text>

  <!-- REAL (sqlite) -->
  <rect x="290" y="100" width="240" height="300" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="132" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e40af">Real (yengil)</text>
  <text x="410" y="156" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">sqlite / fayl / lokal</text>
  <text x="410" y="196" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">✓ haqiqiy SQL</text>
  <text x="410" y="224" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">✓ sxemani tekshiradi</text>
  <text x="410" y="252" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#f59e0b">~ sekinroq</text>
  <text x="410" y="280" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">prod DB'dan biroz farq</text>
  <text x="410" y="300" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">qilishi mumkin</text>
  <rect x="320" y="330" width="180" height="46" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="358" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#1e40af">muvozanatli tanlov</text>

  <!-- TESTCONTAINERS -->
  <rect x="550" y="100" width="240" height="300" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="670" y="132" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#5b21b6">Testcontainers</text>
  <text x="670" y="156" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">real Postgres Docker'da</text>
  <text x="670" y="196" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">✓ eng realistik</text>
  <text x="670" y="224" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#16a34a">✓ prod'dagi DB aynan</text>
  <text x="670" y="252" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#dc2626">✗ Docker talab qiladi</text>
  <text x="670" y="280" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">eng sekin start,</text>
  <text x="670" y="300" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">CI sozlamasi kerak</text>
  <rect x="580" y="330" width="180" height="46" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="670" y="358" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#5b21b6">kontseptual (bu bobda)</text>

  <text x="410" y="438" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Tez fikr uchun fake, ishonch uchun real/Testcontainers — ko'pincha ikkalasi</text>
</svg>
