<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440">
  <title>O'zgartirish dilemmasi: o'zgartirish uchun test kerak, test uchun o'zgartirish kerak (tovuq-tuxum)</title>
  <rect x="0" y="0" width="820" height="440" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">O'zgartirish dilemmasi (tovuq-tuxum)</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Legacy kodning markaziy qiyinligi: ikkalasi ham bir-birini talab qiladi</text>

  <!-- chap: o'zgartirish -->
  <rect x="90" y="130" width="230" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="205" y="178" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#1e293b">Kodni o'zgartirish</text>
  <text x="205" y="206" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Xavfsiz qilish uchun</text>
  <text x="205" y="226" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">avval TEST kerak</text>

  <!-- o'ng: test -->
  <rect x="500" y="130" width="230" height="120" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="615" y="178" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="bold" fill="#1e293b">Test yozish</text>
  <text x="615" y="206" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Test yozish uchun ko'pincha</text>
  <text x="615" y="226" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">kodni O'ZGARTIRISH kerak</text>

  <!-- aylanma strelkalar -->
  <path d="M325,165 C400,135 500,135 495,165" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a29)"/>
  <text x="410" y="128" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">"test kerak"</text>
  <path d="M495,215 C420,245 320,245 325,215" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a29)"/>
  <text x="410" y="262" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">"o'zgartirish kerak"</text>

  <!-- yechim -->
  <rect x="90" y="320" width="640" height="96" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="352" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#166534">Yechim: minimal, xavfsiz qadamlar</text>
  <text x="410" y="378" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">Eng kichik, xavfi past o'zgarishlar bilan SEAM och, keyin characterization test bilan</text>
  <text x="410" y="398" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">xulqni muhrla. Avtomatlashtirilgan refactoring vositasi yoki juda ehtiyot qo'lda.</text>

  <defs>
    <marker id="a29" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
