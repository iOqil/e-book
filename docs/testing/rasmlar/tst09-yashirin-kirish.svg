<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470">
  <title>Yashirin kirish: funksiyaga oshkor argument oldindan, vaqt-tasodif-IO esa yon eshikdan kiradi va natijani nodeterministik qiladi</title>
  <rect x="0" y="0" width="820" height="470" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Yashirin kirish — yon eshikdan kelgan argument</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Imzoda ko'rinmaydigan, lekin natijaga ta'sir qiladigan kirish = flaky test</text>

  <!-- Funksiya qutisi -->
  <rect x="300" y="160" width="220" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="220" text-anchor="middle" font-family="Segoe UI" font-size="19" font-weight="bold" fill="#1e293b">funksiya</text>
  <text x="410" y="248" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#475569">yadro mantiqi</text>

  <!-- Oshkor kirish (oldingi eshik) -->
  <rect x="60" y="200" width="160" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="230" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#166534">oshkor argument</text>
  <text x="140" y="252" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">imzoda ko'rinadi</text>
  <line x1="220" y1="235" x2="296" y2="235" stroke="#16a34a" stroke-width="2"/>
  <polygon points="300,235 288,230 288,240" fill="#16a34a"/>

  <!-- Natija -->
  <rect x="600" y="200" width="160" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="680" y="240" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">natija</text>
  <line x1="520" y1="235" x2="596" y2="235" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="600,235 588,230 588,240" fill="#94a3b8"/>

  <!-- Yashirin kirishlar (yon eshik) -->
  <text x="410" y="115" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">yashirin kirishlar (yon eshik)</text>
  <rect x="200" y="370" width="130" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="265" y="395" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#991b1b">vaqt</text>
  <text x="265" y="415" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#991b1b">now()</text>
  <rect x="345" y="370" width="130" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="410" y="395" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#991b1b">tasodif</text>
  <text x="410" y="415" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#991b1b">random</text>
  <rect x="490" y="370" width="130" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="555" y="395" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#991b1b">I/O</text>
  <text x="555" y="415" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#991b1b">fayl · env · UUID</text>

  <!-- Yon eshik strelkalari (pastdan funksiyaga) -->
  <line x1="265" y1="370" x2="360" y2="312" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="410" y1="370" x2="410" y2="312" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="555" y1="370" x2="460" y2="312" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="410,310 405,322 415,322" fill="#dc2626"/>
</svg>
