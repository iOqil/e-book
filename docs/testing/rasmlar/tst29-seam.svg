<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460">
  <title>Seam kiritish: qattiq bog'langan bog'liqlik soxtalashtirilib testlanadigan qilinadi</title>
  <rect x="0" y="0" width="820" height="460" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Seam — xulqni o'zgartirib bo'ladigan joy</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Kodni tahrirlamasdan, undagi bog'liqlikni boshqasi bilan almashtirish nuqtasi</text>

  <!-- OLDIN: seam yo'q -->
  <text x="210" y="108" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#dc2626">OLDIN: seam yo'q (testlash qiyin)</text>
  <rect x="60" y="125" width="300" height="120" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="210" y="160" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">salomlash()</text>
  <text x="210" y="188" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">ichida datetime.now() qotgan</text>
  <rect x="120" y="200" width="180" height="32" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="210" y="221" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#991b1b">real soatga bog'langan</text>
  <text x="210" y="262" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">test goh yashil, goh qizil (flaky)</text>

  <!-- KEYIN: seam bor -->
  <text x="610" y="108" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">KEYIN: seam bor (testlanadi)</text>
  <rect x="460" y="125" width="300" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="610" y="160" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e293b">salomlash(hozir=None)</text>
  <text x="610" y="188" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">vaqt parametr orqali kiradi</text>
  <rect x="520" y="200" width="180" height="32" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="610" y="221" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">test soxta vaqt beradi</text>
  <text x="610" y="262" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">8:00 -&gt; "Xayrli tong" (aniq)</text>

  <line x1="365" y1="185" x2="455" y2="185" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a29s)"/>
  <text x="410" y="178" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">seam</text>

  <!-- seam turlari -->
  <rect x="60" y="305" width="700" height="125" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="334" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Seam turlari (Feathers)</text>
  <text x="80" y="364" font-family="Segoe UI" font-size="13" fill="#334155">Object seam: bog'liqlikni parametr/inject yoki override (subklass) orqali almashtir</text>
  <text x="80" y="388" font-family="Segoe UI" font-size="13" fill="#334155">Sprout method / class: yangi mantiqni alohida, testlangan birlikda yoz, bir qator bilan ula</text>
  <text x="80" y="412" font-family="Segoe UI" font-size="13" fill="#334155">Wrap method: eski metodni o'rab, yangi xulqni atrofiga qo'sh (ichini tahrir qilmasdan)</text>

  <defs>
    <marker id="a29s" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
