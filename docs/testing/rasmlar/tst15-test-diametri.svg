<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500">
  <title>Test diametri: yakka funksiyadan boshlanib, modullar orasi, ma'lumotlar bazasi va tashqi servislargacha qancha komponent birga tekshirilishini ko'rsatadi</title>
  <rect x="0" y="0" width="820" height="500" fill="#f8fafc"/>
  <text x="410" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Test diametri va chegaralar</text>
  <text x="410" y="64" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Qancha komponent qamralsa, diametr shuncha katta</text>

  <!-- concentric rings -->
  <ellipse cx="300" cy="300" rx="270" ry="160" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <ellipse cx="270" cy="300" rx="210" ry="135" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <ellipse cx="235" cy="300" rx="150" ry="105" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <ellipse cx="190" cy="300" rx="80" ry="62" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>

  <text x="190" y="296" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#166534">unit</text>
  <text x="190" y="316" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">yakka funksiya</text>

  <text x="300" y="232" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e40af">modullar orasi</text>
  <text x="320" y="378" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#b45309">+ ma'lumotlar bazasi</text>
  <text x="360" y="436" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#991b1b">+ tashqi servis / tarmoq</text>

  <!-- legend / arrow of growth -->
  <text x="690" y="150" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Diametr o'sgani sari</text>
  <rect x="600" y="170" width="180" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="690" y="197" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">tezroq, izolyatsiya</text>
  <line x1="690" y1="220" x2="690" y2="252" stroke="#64748b" stroke-width="2"/>
  <polygon points="690,258 684,246 696,246" fill="#64748b"/>
  <rect x="600" y="262" width="180" height="44" rx="8" fill="#fef9c3" stroke="#f59e0b" stroke-width="2"/>
  <text x="690" y="289" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#b45309">realroq ishonch</text>
  <line x1="690" y1="312" x2="690" y2="344" stroke="#64748b" stroke-width="2"/>
  <polygon points="690,350 684,338 696,338" fill="#64748b"/>
  <rect x="600" y="354" width="180" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="690" y="381" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#991b1b">sekinroq, mo'rtroq</text>

  <text x="410" y="486" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Qaror: qaysi chegarani (DB, API, fayl, queue) testdan o'tkazaman?</text>
</svg>
