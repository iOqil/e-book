<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540">
  <title>Risk matritsasi: ehtimollik (vertikal) va ta'sir (gorizontal) bo'ylab 3x3 katak. Yuqori-o'ng (yuqori ehtimollik va yuqori ta'sir) qizil zonaga eng ko'p test, past-chap yashil zonaga kam test yo'naltiriladi</title>
  <rect x="0" y="0" width="820" height="540" fill="#f8fafc"/>
  <text x="410" y="36" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Risk matritsasi: testni qayerga yo'naltirish</text>
  <text x="410" y="62" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Xavf = ehtimollik x ta'sir — qizil zonaga ko'proq test</text>

  <!-- Axis labels -->
  <text x="44" y="290" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b" transform="rotate(-90 44 290)">Ehtimollik (sinish chastotasi)</text>
  <text x="430" y="522" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Ta'sir (sinsa qancha yomon)</text>

  <!-- column headers -->
  <text x="200" y="108" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Past</text>
  <text x="400" y="108" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">O'rta</text>
  <text x="600" y="108" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Yuqori</text>
  <!-- row headers -->
  <text x="86" y="160" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Yuqori</text>
  <text x="86" y="290" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">O'rta</text>
  <text x="86" y="420" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Past</text>

  <!-- Grid 3x3. Top row = high probability -->
  <!-- Row high prob -->
  <rect x="110" y="120" width="180" height="120" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="200" y="186" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#92400e">o'rta</text>
  <rect x="310" y="120" width="180" height="120" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="400" y="186" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#991b1b">yuqori</text>
  <rect x="510" y="120" width="180" height="120" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="180" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#991b1b">eng yuqori</text>
  <text x="600" y="204" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#991b1b">eng ko'p test</text>

  <!-- Row mid prob -->
  <rect x="110" y="250" width="180" height="120" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="200" y="316" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#166534">past</text>
  <rect x="310" y="250" width="180" height="120" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="316" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#92400e">o'rta</text>
  <rect x="510" y="250" width="180" height="120" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="316" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#991b1b">yuqori</text>

  <!-- Row low prob -->
  <rect x="110" y="380" width="180" height="120" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="200" y="440" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#166534">eng past</text>
  <text x="200" y="464" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">kam yoki test yo'q</text>
  <rect x="310" y="380" width="180" height="120" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="446" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#166534">past</text>
  <rect x="510" y="380" width="180" height="120" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="446" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#92400e">o'rta</text>

  <text x="700" y="186" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626" font-weight="bold">to'lov, login</text>
  <text x="245" y="446" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a" font-weight="bold">rang temasi</text>
</svg>
