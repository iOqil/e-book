<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360">
  <title>E2E test yo'li: real foydalanuvchi brauzer/UI orqali API ga, API ma'lumotlar bazasiga va tashqi servisga boradi; E2E butun zanjirni boshidan oxirigacha sinaydi</title>
  <rect x="0" y="0" width="820" height="360" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">E2E — butun zanjir, foydalanuvchi ko'zi bilan</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Bitta test real yo'lni boshidan oxirigacha bosib o'tadi</text>

  <!-- Foydalanuvchi -->
  <circle cx="80" cy="180" r="34" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="178" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e40af">Foyda-</text>
  <text x="80" y="196" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#1e40af">lanuvchi</text>

  <!-- UI -->
  <rect x="160" y="146" width="120" height="68" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="220" y="178" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#5b21b6">UI / brauzer</text>
  <text x="220" y="198" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#5b21b6">bos, yoz, ko'r</text>

  <!-- API -->
  <rect x="330" y="146" width="120" height="68" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="390" y="178" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#92400e">API / server</text>
  <text x="390" y="198" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#92400e">biznes mantiq</text>

  <!-- DB -->
  <rect x="500" y="146" width="120" height="68" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="560" y="178" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#166534">Ma'lumotlar</text>
  <text x="560" y="198" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#166534">bazasi</text>

  <!-- Tashqi servis -->
  <rect x="670" y="146" width="120" height="68" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="730" y="178" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#991b1b">Tashqi servis</text>
  <text x="730" y="198" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#991b1b">to'lov / pochta</text>

  <!-- Strelkalar -->
  <line x1="114" y1="180" x2="156" y2="180" stroke="#64748b" stroke-width="2"/>
  <polygon points="160,180 148,174 148,186" fill="#64748b"/>
  <line x1="280" y1="180" x2="326" y2="180" stroke="#64748b" stroke-width="2"/>
  <polygon points="330,180 318,174 318,186" fill="#64748b"/>
  <line x1="450" y1="180" x2="496" y2="180" stroke="#64748b" stroke-width="2"/>
  <polygon points="500,180 488,174 488,186" fill="#64748b"/>
  <line x1="620" y1="180" x2="666" y2="180" stroke="#64748b" stroke-width="2"/>
  <polygon points="670,180 658,174 658,186" fill="#64748b"/>

  <!-- E2E qamrovi -->
  <rect x="150" y="120" width="650" height="120" rx="14" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="475" y="270" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#2563eb">E2E test bu butun yo'lni bitta ssenariyda sinaydi</text>
  <text x="475" y="296" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Eng realistik signal — lekin eng sekin va eng mo'rt</text>
</svg>
