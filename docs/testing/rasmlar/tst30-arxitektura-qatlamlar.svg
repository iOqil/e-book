<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470">
  <title>Kutubxona loyihasi arxitekturasi va har qatlamda qaysi test turi</title>
  <rect x="0" y="0" width="840" height="470" fill="#f8fafc"/>
  <text x="420" y="38" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Loyiha arxitekturasi va test turlari</text>
  <text x="420" y="62" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Har qatlam o'z test turi bilan qoplanadi</text>

  <!-- API qatlam -->
  <rect x="220" y="90" width="400" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="420" y="116" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">API qatlam (yupqa)</text>
  <text x="420" y="138" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">so'rov -&gt; (status, javob)</text>
  <rect x="640" y="98" width="180" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="730" y="118" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#1e3a8a">API + E2E</text>
  <text x="730" y="135" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e3a8a">test (17-19)</text>

  <!-- Xizmat qatlam -->
  <rect x="220" y="166" width="400" height="62" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="420" y="192" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">Xizmat (use-case)</text>
  <text x="420" y="214" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">ijaraga_ber · qaytar — DI bilan</text>
  <rect x="640" y="174" width="180" height="46" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="730" y="194" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#5b21b6">dublyor test</text>
  <text x="730" y="211" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#5b21b6">(07-08-10)</text>

  <!-- Domen va Ombor yonma-yon -->
  <rect x="220" y="242" width="192" height="78" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="316" y="268" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">Domen mantiq</text>
  <text x="316" y="289" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">sof funksiya</text>
  <text x="316" y="307" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">unit test (02-06)</text>

  <rect x="428" y="242" width="192" height="78" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="524" y="268" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">Ombor (DB)</text>
  <text x="524" y="289" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">sqlite repozitoriy</text>
  <text x="524" y="307" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#b45309">integratsiya (15-16)</text>

  <!-- Tashqi to'lov porti -->
  <rect x="220" y="336" width="400" height="58" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="420" y="361" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#1e293b">Tashqi to'lov servisi (port/adapter)</text>
  <text x="420" y="382" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">testda FakeTolov — real pul yechilmaydi</text>
  <rect x="640" y="340" width="180" height="46" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="730" y="360" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#991b1b">fake/stub</text>
  <text x="730" y="377" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#991b1b">(09-bob)</text>

  <!-- oqim strelkasi -->
  <text x="120" y="195" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">so'rov</text>
  <line x1="120" y1="205" x2="120" y2="285" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="120,300 115,285 125,285" fill="#94a3b8"/>
  <text x="120" y="320" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">pastga</text>

  <text x="420" y="430" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Pastga tushgan sayin test sekinroq, realistikroq — ko'p unit, oz E2E</text>
  <text x="420" y="452" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#94a3b8">DB sizniki: real sinaladi · to'lov sizniki emas: izolyatsiya</text>
</svg>
