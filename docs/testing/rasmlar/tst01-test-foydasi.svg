<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500">
  <title>Test yozishning 5 ta foydasi</title>
  <rect x="0" y="0" width="820" height="500" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Test bizga nima beradi?</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Test — vaqtni behuda sarflash emas, balki beshta aniq foyda</text>

  <!-- markaz -->
  <circle cx="410" cy="280" r="62" fill="#2563eb"/>
  <text x="410" y="274" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#ffffff">TEST</text>
  <text x="410" y="296" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dbeafe">5 foyda</text>

  <!-- bog'lovchi chiziqlar -->
  <line x1="410" y1="218" x2="180" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <line x1="472" y1="280" x2="640" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <line x1="472" y1="300" x2="660" y2="320" stroke="#94a3b8" stroke-width="2"/>
  <line x1="410" y1="342" x2="410" y2="420" stroke="#94a3b8" stroke-width="2"/>
  <line x1="348" y1="300" x2="160" y2="320" stroke="#94a3b8" stroke-width="2"/>

  <!-- 1: ishonch -->
  <rect x="60" y="118" width="200" height="62" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="160" y="146" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">1. Ishonch</text>
  <text x="160" y="167" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">refactoringdan qo'rqmaslik</text>

  <!-- 2: regressiyadan himoya -->
  <rect x="560" y="118" width="210" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="665" y="146" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#2563eb">2. Regressiya himoyasi</text>
  <text x="665" y="167" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">eski narsa buzilmasin</text>

  <!-- 3: jonli hujjat -->
  <rect x="575" y="292" width="200" height="62" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="675" y="320" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#7c3aed">3. Jonli hujjat</text>
  <text x="675" y="341" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">kod nima qilishini ko'rsatadi</text>

  <!-- 4: dizaynga fikr -->
  <rect x="305" y="424" width="210" height="62" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="410" y="452" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#b45309">4. Dizaynga fikr</text>
  <text x="410" y="473" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">testlash qiyin = yomon dizayn</text>

  <!-- 5: tez fikr-mulohaza -->
  <rect x="45" y="292" width="215" height="62" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="152" y="320" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="bold" fill="#16a34a">5. Tez fikr-mulohaza</text>
  <text x="152" y="341" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#1e293b">xatoni soniyalarda bilasiz</text>
</svg>
