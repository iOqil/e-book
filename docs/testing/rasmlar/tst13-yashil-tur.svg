<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470">
  <title>Testlar xavfsizlik to'ri: kod o'zgaradi, testlar yashil qoladi</title>
  <rect x="0" y="0" width="820" height="470" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Testlar — refactoring uchun xavfsizlik to'ri</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Ichki struktura o'zgaradi · tashqi xulq (va testlar) o'zgarmaydi</text>

  <!-- OLDIN kod bloki -->
  <rect x="60" y="110" width="270" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="195" y="138" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">OLDIN: chalkash kod</text>
  <text x="195" y="166" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">uzun funksiya, takror,</text>
  <text x="195" y="186" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">ichma-ich shartlar</text>
  <text x="195" y="212" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">xulq: 1000000 -&gt; 900000</text>

  <!-- strelka -->
  <line x1="335" y1="170" x2="485" y2="170" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ok)"/>
  <text x="410" y="158" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#7c3aed">refactor</text>
  <text x="410" y="190" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">kichik qadamlar</text>

  <!-- KEYIN kod bloki -->
  <rect x="490" y="110" width="270" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="625" y="138" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="bold" fill="#1e293b">KEYIN: toza kod</text>
  <text x="625" y="166" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">extract function,</text>
  <text x="625" y="186" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">guard clause, rename</text>
  <text x="625" y="212" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">xulq: 1000000 -&gt; 900000</text>

  <!-- xavfsizlik to'ri -->
  <rect x="60" y="300" width="700" height="120" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="410" y="332" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="bold" fill="#15803d">XAVFSIZLIK TO'RI — o'zgarmaydigan testlar</text>
  <g font-family="Segoe UI" font-size="14" fill="#15803d" text-anchor="middle">
    <text x="160" y="372">PASS</text>
    <text x="285" y="372">PASS</text>
    <text x="410" y="372">PASS</text>
    <text x="535" y="372">PASS</text>
    <text x="660" y="372">PASS</text>
  </g>
  <g fill="#16a34a">
    <circle cx="160" cy="392" r="9"/><circle cx="285" cy="392" r="9"/><circle cx="410" cy="392" r="9"/><circle cx="535" cy="392" r="9"/><circle cx="660" cy="392" r="9"/>
  </g>
  <g stroke="#ffffff" stroke-width="2.5" fill="none">
    <path d="M156 392 l3 4 l5 -7"/><path d="M281 392 l3 4 l5 -7"/><path d="M406 392 l3 4 l5 -7"/><path d="M531 392 l3 4 l5 -7"/><path d="M656 392 l3 4 l5 -7"/>
  </g>

  <!-- kod -> to'r tushadigan chiziqlar -->
  <line x1="195" y1="230" x2="195" y2="300" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="625" y1="230" x2="625" y2="300" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="410" y="448" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#64748b">Qoida: yashil test ostida refactor qil — har qadamdan keyin testni qayta ishlat</text>

  <defs>
    <marker id="ok" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
