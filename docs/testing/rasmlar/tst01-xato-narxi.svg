<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470">
  <title>Xatoning narxi: qancha kech topilsa, shuncha qimmat</title>
  <rect x="0" y="0" width="820" height="470" fill="#f8fafc"/>
  <text x="410" y="40" text-anchor="middle" font-family="Segoe UI" font-size="22" font-weight="bold" fill="#1e293b">Xatoning narxi vaqt bo'yicha o'sadi</text>
  <text x="410" y="66" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#64748b">Xato qaysi bosqichda topilsa, uni tuzatish shuncha qimmatga tushadi</text>

  <!-- o'qlar -->
  <line x1="90" y1="400" x2="760" y2="400" stroke="#94a3b8" stroke-width="2"/>
  <line x1="90" y1="400" x2="90" y2="110" stroke="#94a3b8" stroke-width="2"/>
  <text x="425" y="445" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#64748b">Loyiha bosqichi (vaqt) →</text>
  <text x="58" y="255" text-anchor="middle" font-family="Segoe UI" font-size="15" fill="#64748b" transform="rotate(-90 58 255)">Tuzatish narxi →</text>

  <!-- o'sish egri chizig'i (eksponensial) -->
  <path d="M 130 388 Q 320 372 430 320 T 700 130" fill="none" stroke="#dc2626" stroke-width="3"/>

  <!-- nuqtalar va ustunlar -->
  <circle cx="130" cy="388" r="7" fill="#16a34a"/>
  <text x="130" y="378" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">1×</text>
  <text x="130" y="420" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">Talab</text>

  <circle cx="270" cy="360" r="7" fill="#16a34a"/>
  <text x="270" y="350" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">3×</text>
  <text x="270" y="420" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">Dizayn</text>

  <circle cx="420" cy="318" r="7" fill="#2563eb"/>
  <text x="420" y="308" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#2563eb">10×</text>
  <text x="420" y="420" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">Kod / test</text>

  <circle cx="700" cy="130" r="8" fill="#dc2626"/>
  <text x="700" y="118" text-anchor="middle" font-family="Segoe UI" font-size="13" font-weight="bold" fill="#dc2626">100×+</text>
  <text x="700" y="420" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="bold" fill="#dc2626">Production</text>

  <!-- izoh kartochkalari -->
  <rect x="120" y="150" width="240" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="240" y="178" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">Test'da topilgan bug:</text>
  <text x="240" y="198" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#16a34a">soniyalar, arzon</text>

  <rect x="500" y="200" width="250" height="58" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="625" y="228" text-anchor="middle" font-family="Segoe UI" font-size="14" fill="#1e293b">Production'da topilgan bug:</text>
  <text x="625" y="248" text-anchor="middle" font-family="Segoe UI" font-size="13" fill="#dc2626">mijoz, obro', kechalar</text>
</svg>
