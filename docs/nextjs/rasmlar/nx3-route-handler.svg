<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430">
  <title>Route Handler: HTTP so'rov route.ts handlerga kelib, Response qaytaradi (GET/POST/PUT/DELETE)</title>
  <rect x="0" y="0" width="760" height="430" fill="#f8fafc"/>

  <defs>
    <marker id="rhArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="380" y="34" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="bold" fill="#1e293b" text-anchor="middle">Route Handler — so'rov qanday ishlanadi</text>

  <!-- Client / so'rovchi -->
  <rect x="30" y="80" width="180" height="150" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="120" y="108" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Mijoz (so'rovchi)</text>
  <text x="120" y="134" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b" text-anchor="middle">Mobil ilova</text>
  <text x="120" y="156" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b" text-anchor="middle">Boshqa sayt</text>
  <text x="120" y="178" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b" text-anchor="middle">Webhook</text>
  <text x="120" y="200" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b" text-anchor="middle">Frontend (fetch)</text>

  <!-- Handler -->
  <rect x="300" y="70" width="200" height="170" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="98" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">app/api/.../route.ts</text>
  <text x="400" y="122" font-family="monospace" font-size="14" fill="#1e293b" text-anchor="middle">GET()</text>
  <text x="400" y="146" font-family="monospace" font-size="14" fill="#1e293b" text-anchor="middle">POST(request)</text>
  <text x="400" y="170" font-family="monospace" font-size="14" fill="#1e293b" text-anchor="middle">PUT(request)</text>
  <text x="400" y="194" font-family="monospace" font-size="14" fill="#1e293b" text-anchor="middle">DELETE(request)</text>
  <text x="400" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">serverda ishlaydi</text>

  <!-- Response -->
  <rect x="585" y="80" width="150" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="108" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a" text-anchor="middle">Response</text>
  <text x="660" y="136" font-family="monospace" font-size="13.5" fill="#1e293b" text-anchor="middle">JSON ma'lumot</text>
  <text x="660" y="160" font-family="monospace" font-size="13.5" fill="#1e293b" text-anchor="middle">status: 200</text>
  <text x="660" y="182" font-family="monospace" font-size="13.5" fill="#1e293b" text-anchor="middle">201 / 400 / 404</text>
  <text x="660" y="208" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">NextResponse.json</text>

  <!-- Arrows -->
  <line x1="212" y1="135" x2="295" y2="135" stroke="#475569" stroke-width="2.5" marker-end="url(#rhArrow)"/>
  <text x="253" y="125" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569" text-anchor="middle">HTTP so'rov</text>

  <line x1="502" y1="150" x2="582" y2="150" stroke="#475569" stroke-width="2.5" marker-end="url(#rhArrow)"/>
  <text x="543" y="140" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569" text-anchor="middle">javob</text>

  <!-- Return arrow -->
  <path d="M 660 232 L 660 300 L 120 300 L 120 234" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#rhArrow)"/>
  <text x="390" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#16a34a" text-anchor="middle">javob mijozga qaytadi</text>

  <!-- Method legend -->
  <rect x="30" y="350" width="700" height="58" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="50" y="375" font-family="monospace" font-size="14" font-weight="bold" fill="#2563eb">GET</text>
  <text x="98" y="375" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">olish (o'qish)</text>
  <text x="240" y="375" font-family="monospace" font-size="14" font-weight="bold" fill="#16a34a">POST</text>
  <text x="295" y="375" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">yaratish</text>
  <text x="420" y="375" font-family="monospace" font-size="14" font-weight="bold" fill="#f59e0b">PUT</text>
  <text x="465" y="375" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">yangilash</text>
  <text x="600" y="375" font-family="monospace" font-size="14" font-weight="bold" fill="#dc2626">DELETE</text>
  <text x="50" y="398" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#475569">Har metod alohida funksiya; bitta route.ts da bir nechtasi bo'lishi mumkin.</text>
  <text x="657" y="398" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#dc2626" text-anchor="middle">o'chirish</text>
</svg>
