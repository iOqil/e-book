<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" width="780" height="540">
  <title>Maxsus fayl konventsiyalari: layout, page, loading, error va not-found qanday joylashadi</title>
  <rect x="0" y="0" width="780" height="540" fill="#f8fafc"/>

  <text x="390" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Maxsus fayllar bitta marshrutda qanday o'raladi</text>

  <!-- Nesting boxes: layout wraps the rest -->
  <rect x="40" y="58" width="430" height="392" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="58" y="84" font-family="monospace" font-size="15" font-weight="bold" fill="#2563eb">layout.tsx</text>
  <text x="255" y="84" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">— umumiy qoplama (menyu, footer)</text>

  <!-- error wraps page+loading -->
  <rect x="64" y="100" width="382" height="270" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="80" y="124" font-family="monospace" font-size="15" font-weight="bold" fill="#dc2626">error.tsx</text>
  <text x="255" y="124" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">— xato bo'lsa shu chiqadi</text>

  <!-- loading wraps page -->
  <rect x="86" y="140" width="338" height="210" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="102" y="164" font-family="monospace" font-size="15" font-weight="bold" fill="#f59e0b">loading.tsx</text>
  <text x="255" y="164" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">— yuklanayotganda chiqadi</text>

  <!-- page in the middle -->
  <rect x="108" y="180" width="294" height="150" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="255" y="244" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#16a34a">page.tsx</text>
  <text x="255" y="272" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Sahifaning haqiqiy mazmuni</text>
  <text x="255" y="294" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">(faqat shu fayl URL hosil qiladi)</text>

  <text x="255" y="400" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">layout eng tashqarida, page eng ichkarida.</text>
  <text x="255" y="424" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">loading/error page'ni avtomatik o'raydi.</text>

  <!-- Right: roles table -->
  <rect x="500" y="58" width="252" height="392" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="626" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Har fayl nima qiladi</text>

  <rect x="516" y="100" width="220" height="58" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="528" y="122" font-family="monospace" font-size="14" font-weight="bold" fill="#16a34a">page.tsx</text>
  <text x="528" y="144" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">URL + sahifa mazmuni</text>

  <rect x="516" y="166" width="220" height="58" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="528" y="188" font-family="monospace" font-size="14" font-weight="bold" fill="#2563eb">layout.tsx</text>
  <text x="528" y="210" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">qoplama, {children} bilan</text>

  <rect x="516" y="232" width="220" height="58" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="528" y="254" font-family="monospace" font-size="14" font-weight="bold" fill="#f59e0b">loading.tsx</text>
  <text x="528" y="276" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">"Yuklanmoqda..." ekrani</text>

  <rect x="516" y="298" width="220" height="58" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="528" y="320" font-family="monospace" font-size="14" font-weight="bold" fill="#dc2626">error.tsx</text>
  <text x="528" y="342" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">xato ekrani (sayt qulamaydi)</text>

  <rect x="516" y="364" width="220" height="58" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="528" y="386" font-family="monospace" font-size="14" font-weight="bold" fill="#1e293b">not-found.tsx</text>
  <text x="528" y="408" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">404 — topilmadi ekrani</text>

  <text x="390" y="486" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Maxsus nom = maxsus vazifa. Next.js bu fayllarni o'zi tanib, kerakli paytda ko'rsatadi.</text>
  <text x="390" y="512" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">loading va error orqasida React Suspense va xato chegarasi (error boundary) ishlaydi.</text>
</svg>
