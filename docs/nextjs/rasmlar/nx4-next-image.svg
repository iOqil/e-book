<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470">
  <title>next/image optimizatsiyasi — asl katta rasmdan moslangan o'lcham va formatga</title>
  <defs>
    <marker id="niArr" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0 0 L9 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="niArrGreen" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0 0 L9 5 L0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="470" fill="#f8fafc"/>
  <text x="430" y="34" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">next/image — bitta asldan har qurilmaga mos rasm</text>

  <!-- Asl rasm (chap) -->
  <rect x="40" y="120" width="200" height="150" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="140" y="100" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">Asl rasm (og'ir)</text>
  <text x="140" y="195" font-family="monospace" font-size="14" fill="#1e293b" text-anchor="middle">foto.jpg</text>
  <text x="140" y="218" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">2400 x 1600 · JPG</text>
  <text x="140" y="240" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">~1.8 MB</text>
  <text x="140" y="292" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">src={...}, width, height</text>

  <!-- next/image quvuri (markaz) -->
  <rect x="320" y="105" width="200" height="180" rx="10" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="2"/>
  <text x="420" y="132" font-family="monospace" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">&lt;Image&gt;</text>
  <text x="420" y="156" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">avtomatik qiladi:</text>
  <text x="340" y="182" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">• format: WebP / AVIF</text>
  <text x="340" y="204" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">• ekranga moslab kichraytirish</text>
  <text x="340" y="226" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">• lazy load (ko'rinsa yuklash)</text>
  <text x="340" y="248" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">• joyni saqlash (CLS yo'q)</text>
  <text x="340" y="270" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">  priority — muhim rasmga</text>

  <!-- Asl -> Image strelka -->
  <path d="M242 195 L318 195" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#niArr)"/>

  <!-- Image -> qurilmalar strelka -->
  <path d="M522 195 L598 195" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#niArrGreen)"/>

  <!-- Qurilmalarga moslangan natija (o'ng) -->
  <text x="730" y="100" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a" text-anchor="middle">Har qurilmaga moslangan</text>

  <!-- Telefon -->
  <rect x="610" y="120" width="70" height="120" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="620" y="135" width="50" height="60" rx="4" fill="#16a34a" fill-opacity="0.15"/>
  <text x="645" y="217" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">Telefon</text>
  <text x="645" y="235" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#15803d" text-anchor="middle">640px WebP</text>

  <!-- Planshet -->
  <rect x="700" y="120" width="60" height="120" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="708" y="135" width="44" height="50" rx="4" fill="#16a34a" fill-opacity="0.15"/>
  <text x="730" y="217" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">Planshet</text>
  <text x="730" y="235" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#15803d" text-anchor="middle">1024px</text>

  <!-- Kompyuter -->
  <rect x="775" y="125" width="75" height="90" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="783" y="135" width="59" height="48" rx="4" fill="#16a34a" fill-opacity="0.15"/>
  <text x="812" y="231" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">Kompyuter</text>
  <text x="812" y="249" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#15803d" text-anchor="middle">1920px AVIF</text>

  <!-- Natija paneli (past) -->
  <rect x="40" y="330" width="780" height="110" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="430" y="358" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a" text-anchor="middle">Natija</text>
  <text x="60" y="386" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">• Brauzer faqat o'ziga kerak o'lchamni oladi — kerakmas piksellar yuborilmaydi.</text>
  <text x="60" y="408" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">• WebP/AVIF JPG dan ancha yengil — sahifa tezroq yuklanadi (LCP yaxshilanadi).</text>
  <text x="60" y="430" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">• Rasm joyi oldindan band — sahifa sakramaydi (CLS = 0).</text>
</svg>
