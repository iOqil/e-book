<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>Nega Next.js: React ustiga routing, server va optimizatsiya tayyor keladi</title>
  <rect x="0" y="0" width="760" height="470" fill="#f8fafc"/>

  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Nega Next.js? React tayyor narsalar bilan keladi</text>

  <!-- Left: Sof React -->
  <rect x="30" y="62" width="320" height="372" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
  <text x="190" y="90" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">Sof React (o'zi)</text>

  <rect x="115" y="106" width="150" height="44" rx="8" fill="#2563eb" stroke="#2563eb"/>
  <text x="190" y="134" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">React (UI)</text>

  <text x="190" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Qolganini O'ZINGIZ qurasiz:</text>

  <rect x="50" y="196" width="280" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="64" y="221" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">× Routing (sahifalar) qo'lda</text>

  <rect x="50" y="246" width="280" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="64" y="271" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">× Server yo'q (SEO yomon)</text>

  <rect x="50" y="296" width="280" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="64" y="321" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">× Ma'lumot olish murakkab</text>

  <rect x="50" y="346" width="280" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="64" y="371" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">× Optimizatsiya qo'lda</text>

  <text x="190" y="418" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#dc2626">Ko'p ish, ko'p xato</text>

  <!-- Arrow -->
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>
  <line x1="358" y1="248" x2="408" y2="248" stroke="#475569" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Right: Next.js -->
  <rect x="412" y="62" width="320" height="372" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="572" y="90" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">Next.js 16 (to'liq jihozlangan)</text>

  <rect x="497" y="106" width="150" height="44" rx="8" fill="#2563eb" stroke="#2563eb"/>
  <text x="572" y="134" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">React (UI)</text>

  <text x="572" y="178" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Quyidagilar TAYYOR keladi:</text>

  <rect x="432" y="196" width="280" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="446" y="221" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">✓ File-based routing (app/)</text>

  <rect x="432" y="246" width="280" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="446" y="271" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">✓ Server render (RSC, SEO zo'r)</text>

  <rect x="432" y="296" width="280" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="446" y="321" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">✓ Ma'lumot to'g'ridan komponentda</text>

  <rect x="432" y="346" width="280" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="446" y="371" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">✓ Rasm/shrift/kesh avtomatik</text>

  <text x="572" y="418" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#16a34a">Kam ish, e'tibor mahsulotga</text>

  <text x="380" y="456" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e293b">Next.js = React + routing + server + optimizatsiya bitta freymvorkda.</text>
</svg>
