<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520">
  <title>Streaming va Suspense — sahifa bo'lak-bo'lak keladi, tayyor qism darhol ko'rinadi</title>
  <defs>
    <marker id="ssArr" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0 0 L9 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="520" fill="#f8fafc"/>
  <text x="430" y="34" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">Streaming + Suspense — sahifa bo'lak-bo'lak keladi</text>
  <text x="430" y="58" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Tayyor qism darhol chiqadi, sekin qism &lt;Suspense&gt; ostida keyin keladi</text>

  <!-- Vaqt o'qi -->
  <line x1="60" y1="100" x2="800" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#ssArr)"/>
  <text x="60" y="90" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">0 ms</text>
  <text x="780" y="90" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="end">vaqt →</text>

  <!-- 1-bosqich: darhol -->
  <text x="160" y="135" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">1. Darhol (~0 ms)</text>
  <rect x="60" y="150" width="200" height="230" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="74" y="166" width="172" height="34" rx="5" fill="#2563eb"/>
  <text x="160" y="189" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Sarlavha (tayyor)</text>
  <rect x="74" y="210" width="172" height="26" rx="5" fill="#e2e8f0"/>
  <text x="160" y="228" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">Menyu (tayyor)</text>
  <!-- Suspense teshik (yuklanmoqda) -->
  <rect x="74" y="250" width="172" height="110" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="160" y="298" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309" text-anchor="middle">Sharhlar</text>
  <text x="160" y="318" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309" text-anchor="middle">yuklanmoqda...</text>
  <text x="160" y="340" font-family="monospace" font-size="13" fill="#92400e" text-anchor="middle">(fallback)</text>

  <!-- strelka 1->2 -->
  <path d="M268 265 L322 265" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#ssArr)"/>
  <text x="295" y="255" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">stream</text>

  <!-- 2-bosqich: server fonda ishlaydi -->
  <text x="430" y="135" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="middle">2. Server fonda</text>
  <rect x="330" y="150" width="200" height="230" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="344" y="166" width="172" height="34" rx="5" fill="#2563eb"/>
  <text x="430" y="189" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Sarlavha</text>
  <rect x="344" y="210" width="172" height="26" rx="5" fill="#e2e8f0"/>
  <text x="430" y="228" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">Menyu</text>
  <rect x="344" y="250" width="172" height="110" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="430" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309" text-anchor="middle">await dbdan</text>
  <text x="430" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#b45309" text-anchor="middle">sharhlarni olmoqda</text>

  <!-- strelka 2->3 -->
  <path d="M538 265 L592 265" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#ssArr)"/>
  <text x="565" y="255" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">tayyor</text>

  <!-- 3-bosqich: to'liq -->
  <text x="700" y="135" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">3. To'liq sahifa</text>
  <rect x="600" y="150" width="200" height="230" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="614" y="166" width="172" height="34" rx="5" fill="#2563eb"/>
  <text x="700" y="189" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Sarlavha</text>
  <rect x="614" y="210" width="172" height="26" rx="5" fill="#e2e8f0"/>
  <text x="700" y="228" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">Menyu</text>
  <rect x="614" y="250" width="172" height="110" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="700" y="296" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#15803d" text-anchor="middle">Sharhlar (keldi)</text>
  <text x="700" y="318" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#15803d" text-anchor="middle">avtomatik o'rniga</text>
  <text x="700" y="340" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#15803d" text-anchor="middle">qo'yiladi</text>

  <!-- Pastki izoh -->
  <rect x="60" y="410" width="740" height="90" rx="10" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb" stroke-width="1.5"/>
  <text x="430" y="438" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">Foydalanuvchi BO'SH ekranni kutmaydi</text>
  <text x="80" y="464" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">• loading.tsx — butun sahifa uchun; &lt;Suspense fallback&gt; — aniq bir qism uchun.</text>
  <text x="80" y="486" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b">• Sekin so'rov butun sahifani bloklamaydi: tez qism darhol, sekin qism keyin oqib keladi.</text>
</svg>
