<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>Next.js caching qatlamlari: Request Memoization, Data Cache, Full Route Cache (server) va Router Cache (klient)</title>
  <rect x="0" y="0" width="800" height="500" fill="#f8fafc"/>

  <defs>
    <marker id="cArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="400" y="32" font-family="Segoe UI, system-ui, sans-serif" font-size="21" font-weight="bold" fill="#1e293b" text-anchor="middle">Next.js caching qatlamlari (App Router)</text>
  <text x="400" y="56" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#475569" text-anchor="middle">So'rov 4 qatlamdan o'tadi: 3 tasi serverda, 1 tasi brauzerda</text>

  <!-- SERVER region -->
  <rect x="25" y="78" width="540" height="392" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="45" y="102" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#475569">SERVER tomoni</text>

  <!-- 1 Request Memoization -->
  <rect x="50" y="118" width="490" height="78" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="68" y="143" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">1. Request Memoization</text>
  <text x="68" y="166" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">Bitta render davomida bir xil fetch() takror chaqirilsa —</text>
  <text x="68" y="186" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">faqat bir marta bajariladi. Render tugagach o'chadi.</text>

  <!-- 2 Data Cache -->
  <rect x="50" y="210" width="490" height="78" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="68" y="235" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">2. Data Cache</text>
  <text x="68" y="258" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">Ma'lumotni so'rovlar va deploylar oraligida saqlaydi.</text>
  <text x="68" y="278" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">revalidate yoki revalidatePath/Tag bilan yangilanadi.</text>

  <!-- 3 Full Route Cache -->
  <rect x="50" y="302" width="490" height="78" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="68" y="327" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#b45309">3. Full Route Cache</text>
  <text x="68" y="350" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">Statik sahifaning HTML va RSC natijasini saqlaydi.</text>
  <text x="68" y="370" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">Build vaqtida yoki revalidate'da hosil bo'ladi.</text>

  <!-- PPR note -->
  <rect x="50" y="396" width="490" height="58" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="68" y="419" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="bold" fill="#1e293b">PPR (Partial Prerendering):</text>
  <text x="68" y="440" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" fill="#1e293b">statik qobiq darrov, dinamik qismlar oqim (stream) bilan keladi.</text>

  <!-- CLIENT region -->
  <rect x="585" y="78" width="190" height="392" rx="12" fill="#fbe9e9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="605" y="102" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#475569">KLIENT (brauzer)</text>

  <!-- 4 Router Cache -->
  <rect x="605" y="210" width="150" height="170" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="680" y="238" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="middle">4. Router</text>
  <text x="680" y="258" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#dc2626" text-anchor="middle">Cache</text>
  <text x="680" y="288" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">Sahifalar orasida</text>
  <text x="680" y="306" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">tez navigatsiya.</text>
  <text x="680" y="332" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">RSC natijasi</text>
  <text x="680" y="350" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">xotirada saqlanadi</text>
  <text x="680" y="368" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">(sessiya davomida).</text>

  <!-- flow arrows -->
  <line x1="295" y1="198" x2="295" y2="208" stroke="#475569" stroke-width="2.5" marker-end="url(#cArrow)"/>
  <line x1="295" y1="290" x2="295" y2="300" stroke="#475569" stroke-width="2.5" marker-end="url(#cArrow)"/>
  <line x1="565" y1="295" x2="603" y2="295" stroke="#475569" stroke-width="2.5" marker-end="url(#cArrow)"/>

  <text x="400" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Next.js 16: fetch va GET sukut bo'yicha keshlanmaydi; keshlash uchun "use cache" yoki revalidate kerak.</text>
</svg>
