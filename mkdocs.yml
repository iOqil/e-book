site_name: Oqil E-kitoblar
site_description: "Dasturlash bo'yicha o'zbekcha e-kitoblar — 0 dan expertgacha. 9 ta qo'llanma, 375 SVG diagramma."
copyright: '© 2026 <a href="/litsenziya/">Oqil Imomnazarov</a> · bepul · savdo taqiqlanadi · CC BY-NC-SA 4.0'
repo_url: https://github.com/iOqil/e-book
repo_name: iOqil/e-book
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
use_directory_urls: true

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/goatcounter.js

theme:
  name: material
  language: uz
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch
    - navigation.tabs.sticky
    - content.tooltips
    - search.share
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.action.view
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: "Qorong'i rejim"
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: "Yorug' rejim"

extra:
  social:
    - icon: material/web
      link: https://ioqil.uz
      name: ioqil.uz
    - icon: fontawesome/brands/telegram
      link: https://t.me/i_oqil
      name: Telegram
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@I_Oqil
      name: YouTube

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

